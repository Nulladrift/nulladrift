{
  "lockfileVersion": 2,
  "subjects": {
    "ca.tripfinder/tours": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tripfinder.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ca.tripfinder/tours",
        "title": "TripFinder.ca — compare and book guided group tours",
        "version": "1.0.0",
        "websiteUrl": "https://tripfinder.ca"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "TripFinder.ca is a Canadian service for comparing multi-day guided group tours across operators (G Adventures, Intrepid, Exodus, Trafalgar, Collette, Exoticca and others) and booking them through a human travel advisor at the same price as booking direct.\n\nTypical flow: search_trips → get_trip or compare_trips → request_quote once the traveller has chosen a trip and date. Use contact_advisor for open-ended requests, and about_tripfinder, list_guides and get_guide for background.\n\nPrices are indicative per-person catalog prices in CAD (or USD on request) and availability is a snapshot; the advisor confirms both. Null or empty fields mean the fact is unknown. Each trip has a canonical url on tripfinder.ca.\n\nrequest_quote and contact_advisor send a real request to TripFinder's advisors, so they are for when the traveller has asked for that, supplied their own contact details and agreed to be contacted. They do not take payment: the advisor completes the booking with the traveller.",
      "tools": [
        {
          "name": "about_tripfinder",
          "title": "About TripFinder and how booking works",
          "description": "Who TripFinder is, how booking and payment work, what it costs the traveller, licensing (TICO), the advisors, and contact details. Use this to answer trust and process questions.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About TripFinder and how booking works"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6d4673ad893609715d14baa95b17e180214959d6d45cc5428f60657f21d9e5da"
        },
        {
          "name": "compare_trips",
          "title": "Compare tours side by side",
          "description": "Compare two to four tours on the same facts: price, duration, route, group size, age limits, comfort and activity level, flights, inclusions, meals, accommodation, transport, itinerary outline and next departures.",
          "inputSchema": {
            "properties": {
              "currency": {
                "default": "CAD",
                "description": "Currency for prices. CAD is the default; use USD for travellers in the United States.",
                "enum": ["CAD", "USD"],
                "type": "string"
              },
              "slugs": {
                "items": {
                  "maxLength": 200,
                  "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare tours side by side"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:947f528e1dd0250f8017a4c10c587912a6f7c9f4eaedec4d20da09ae772804fa"
        },
        {
          "name": "contact_advisor",
          "title": "Ask a travel advisor",
          "description": "Send a general enquiry to a TripFinder travel advisor when the traveller has not settled on a specific trip, wants a custom recommendation, or has a question the catalog cannot answer. An advisor replies within one business day. Creates a real message read by people, so it is for when the traveller has asked to reach an advisor, given their own contact details and agreed to be contacted. request_quote is the better fit once a specific trip is chosen.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Number of adult travellers.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "childrenAges": {
                "default": [],
                "description": "Age of each child travelling, if any.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "consentToContact": {
                "const": true,
                "description": "True when the traveller has explicitly agreed that TripFinder may contact them about this request using the details provided. The request is not sent otherwise.",
                "type": "boolean"
              },
              "contactPreference": {
                "enum": ["email", "phone", "either"],
                "type": "string"
              },
              "currency": {
                "enum": ["CAD", "USD"],
                "type": "string"
              },
              "email": {
                "description": "The traveller's email. Email or phone is required.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "message": {
                "description": "What the traveller is looking for or wants to ask, in their words, with any useful context from the conversation.",
                "maxLength": 3500,
                "minLength": 10,
                "type": "string"
              },
              "name": {
                "description": "The traveller's full name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "description": "The traveller's phone number. Email or phone is required.",
                "maxLength": 40,
                "minLength": 7,
                "type": "string"
              },
              "timing": {
                "description": "When they hope to travel, e.g. \"September 2027, about two weeks\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["consentToContact", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask a travel advisor"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c6d472d0e17354a7e39797327a52d7ab5ebfc445f1e797b9d010b30c673c64a8"
        },
        {
          "name": "get_guide",
          "title": "Read a travel guide",
          "description": "The full text of one TripFinder guide in Markdown, with its sources, FAQ and the points a traveller should confirm before booking.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "A guide slug from list_guides.",
                "maxLength": 200,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a travel guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3db4c0932d5832fe96aeec97b0346f70b9464876fa7104d2fd2790c16b1b1d1b"
        },
        {
          "name": "get_trip",
          "title": "Get tour details",
          "description": "Full public facts for one tour: day-by-day itinerary, inclusions and exclusions, meals, accommodation, transport, group size, age limits, international flight status, promotions, and upcoming departure dates with per-person prices and availability.",
          "inputSchema": {
            "properties": {
              "currency": {
                "default": "CAD",
                "description": "Currency for prices. CAD is the default; use USD for travellers in the United States.",
                "enum": ["CAD", "USD"],
                "type": "string"
              },
              "departuresFrom": {
                "description": "Only list departures starting on or after this date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "departuresTo": {
                "description": "Only list departures starting on or before this date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "slug": {
                "maxLength": 200,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get tour details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e95667bf36f59cda3ea80744f197f39308e7cb688719207b009f2873ec172268"
        },
        {
          "name": "list_catalog_options",
          "title": "List destinations, operators and styles",
          "description": "The countries, regions, tour operators (with trip counts) and travel styles currently in the catalog, plus the valid activity levels, comfort levels and sort orders for search_trips.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List destinations, operators and styles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:beee60c0029a0e138ae95305b10fa551bc35825ab4214e539cb56329d5402b38"
        },
        {
          "name": "list_guides",
          "title": "List travel guides",
          "description": "TripFinder's sourced editorial guides: operator comparisons (e.g. G Adventures vs Intrepid), destination comparisons, what a tour price includes, travelling solo, choosing pace and difficulty. Returns each guide's short answer; use get_guide for the full text.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Optional keywords to filter guides, e.g. \"solo\" or \"vietnam\".",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List travel guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9dec31c7ad1830ae4808504cba566799c552297722b51e208fbb543dda493ed"
        },
        {
          "name": "request_quote",
          "title": "Request a quote or booking",
          "description": "Start a booking: send the traveller's chosen trip(s), preferred departure date(s) and contact details to a TripFinder travel advisor, who replies within one business day with the confirmed price and availability and completes the booking with the traveller. Creates a real request read by people, so it is for when the traveller has asked for a quote, given their own contact details and agreed to be contacted. Does not take payment or guarantee a place.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Number of adult travellers.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "childrenAges": {
                "default": [],
                "description": "Age of each child travelling, if any.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "consentToContact": {
                "const": true,
                "description": "True when the traveller has explicitly agreed that TripFinder may contact them about this request using the details provided. The request is not sent otherwise.",
                "type": "boolean"
              },
              "contactPreference": {
                "enum": ["email", "phone", "either"],
                "type": "string"
              },
              "currency": {
                "default": "CAD",
                "description": "Currency for prices. CAD is the default; use USD for travellers in the United States.",
                "enum": ["CAD", "USD"],
                "type": "string"
              },
              "departureCity": {
                "description": "Home city/airport, for flight advice.",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              },
              "departureDates": {
                "default": [],
                "description": "Preferred departure start dates from get_trip. Leave empty if the traveller is flexible.",
                "items": {
                  "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "email": {
                "description": "The traveller's email. Email or phone is required.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "name": {
                "description": "The traveller's full name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "notes": {
                "description": "Anything the advisor should know: flexibility, budget, mobility, dietary needs, questions.",
                "maxLength": 3000,
                "type": "string"
              },
              "phone": {
                "description": "The traveller's phone number. Email or phone is required.",
                "maxLength": 40,
                "minLength": 7,
                "type": "string"
              },
              "roomPreference": {
                "enum": ["twin", "double", "single", "unsure"],
                "type": "string"
              },
              "tripSlugs": {
                "description": "Slugs of the trip(s) the traveller wants quoted, from search_trips or get_trip.",
                "items": {
                  "maxLength": 200,
                  "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["adults", "consentToContact", "name", "tripSlugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a quote or booking"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:611036de628585e136e145b2698bbd089385d8106532b2d4921fedec79cc598c"
        },
        {
          "name": "search_trips",
          "title": "Search tours",
          "description": "Search TripFinder's catalog of multi-day guided group tours from operators including G Adventures, Intrepid, Exodus, Trafalgar, Collette and Exoticca. Filter by destination, dates, budget, activity level, comfort level and travel style. Returns 10 trips per page with from-prices, next departures and canonical URLs. Use get_trip for full details of a result.",
          "inputSchema": {
            "properties": {
              "activityLevel": {
                "enum": ["easy", "moderate", "active", "challenging"],
                "type": "string"
              },
              "comfortLevels": {
                "description": "Service level, from basic (simple, budget) to luxury.",
                "items": {
                  "enum": ["basic", "standard", "comfort", "premium", "luxury"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "currency": {
                "default": "CAD",
                "description": "Currency for prices. CAD is the default; use USD for travellers in the United States.",
                "enum": ["CAD", "USD"],
                "type": "string"
              },
              "dateFrom": {
                "description": "Earliest acceptable start date. Use with dateTo; the trip must start on/after this and end on/before dateTo. Window is limited to 120 days.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "dateTo": {
                "description": "Latest acceptable end date. Use with dateFrom.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "dealsOnly": {
                "description": "Only trips with a current promotion.",
                "type": "boolean"
              },
              "destination": {
                "description": "A country (e.g. \"Vietnam\") or region (Africa, Asia, Europe, North America, Central America, South America, Middle East, Oceania, Antarctica, Arctic).",
                "maxLength": 80,
                "type": "string"
              },
              "maxPricePerPerson": {
                "description": "Maximum from-price per person, in the requested currency.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "months": {
                "description": "Departure months, 1–12. Ignored when dateFrom/dateTo are given.",
                "items": {
                  "maximum": 12,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 12,
                "type": "array"
              },
              "operators": {
                "description": "Limit to these tour operators.",
                "items": {
                  "enum": ["g-adventures", "intrepid-travel", "exoticca", "exodus-adventure-travels", "trafalgar", "collette"],
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "page": {
                "default": 1,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search, e.g. \"hiking in Peru\", \"Japan food tour in October\", \"safari under 5000\". Understands destinations, months, styles and budgets.",
                "maxLength": 200,
                "type": "string"
              },
              "sort": {
                "description": "Result order. Default is recommended.",
                "enum": ["recommended", "price_asc", "price_desc", "duration_asc", "duration_desc", "departure_asc", "departure_desc", "operator_asc", "name_asc"],
                "type": "string"
              },
              "travelStyle": {
                "description": "A travel style from list_catalog_options, e.g. \"Trekking & Hiking\".",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search tours"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:79ae0b4fef26adc1c32d7fd44fdfe955c77173b9e2b4c6c5f86eadbddb2a6d32"
        }
      ],
      "digest": "sha256:7d066320b678ed24a322ceeacf17dafd3496a2250373d257161e0b71bf7252ff"
    }
  }
