{
  "lockfileVersion": 2,
  "subjects": {
    "com.retirecrunch/calculators": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.retirecrunch.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "retirecrunch-mcp",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "calculate_coast_fire",
          "description": "Compute the Coast FIRE milestone — the capital required today such that, with no further contributions, a portfolio compounds to the user's retirement target by their target age.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "annual_expenses_in_retirement": {
                "minimum": 1,
                "type": "number"
              },
              "currency": {
                "default": "USD",
                "enum": ["USD", "EUR", "GBP", "CHF", "JPY", "CAD", "AUD", "DKK"],
                "type": "string"
              },
              "current_age": {
                "maximum": 80,
                "minimum": 18,
                "type": "integer"
              },
              "current_savings": {
                "minimum": 0,
                "type": "number"
              },
              "expected_return_rate": {
                "default": 7,
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "inflation_rate": {
                "default": 3,
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "monthly_savings": {
                "default": 0,
                "minimum": 0,
                "type": "number"
              },
              "portfolio_volatility": {
                "default": 0,
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "safe_withdrawal_rate": {
                "default": 4,
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "target_retirement_age": {
                "maximum": 100,
                "minimum": 30,
                "type": "integer"
              }
            },
            "required": ["annual_expenses_in_retirement", "current_age", "current_savings", "target_retirement_age"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:54b0dbbbb6f6fcf230b157811a9789212d213c78b110424ee8e7910a4117741e"
        },
        {
          "name": "calculate_fire_target",
          "description": "Estimate the savings target needed for Financial Independence / Early Retirement. Runs Monte Carlo simulation and returns the probability the portfolio survives the planning horizon.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "annual_expense": {
                "description": "Projected annual spending in retirement (in selected currency).",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "apply_inflation": {
                "default": true,
                "type": "boolean"
              },
              "currency": {
                "default": "USD",
                "enum": ["USD", "EUR", "GBP", "CHF", "JPY", "CAD", "AUD", "DKK"],
                "type": "string"
              },
              "current_savings": {
                "default": 0,
                "description": "Current liquid + invested assets.",
                "minimum": 0,
                "type": "number"
              },
              "inflation_rate": {
                "default": 3,
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "portfolio_return_rate": {
                "default": 5,
                "description": "Expected real annual return %.",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "portfolio_volatility": {
                "default": 12,
                "description": "Annual return standard deviation %.",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "years": {
                "description": "Planning horizon in years.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["annual_expense", "years"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e98c7ecdc6546f697aaaef3e4720f3c452cbb0e848ad5fb3659731fcb2b56889"
        },
        {
          "name": "compute_swiss_property_tax",
          "description": "Estimate the Swiss cantonal real-estate capital gains tax (Grundstückgewinnsteuer) for a property sale. Covers all 26 cantons with holding-period adjustments and Ersatzbeschaffung (replacement-residence) deferral. Educational estimate; commune surcharges and value-enhancing-improvement deductions are not modeled.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "canton": {
                "description": "Canton code (ZH, BE, ..., JU).",
                "enum": ["ZH", "BE", "LU", "UR", "SZ", "OW", "NW", "GL", "ZG", "FR", "SO", "BS", "BL", "SH", "AR", "AI", "SG", "GR", "AG", "TG", "TI", "VD", "VS", "NE", "GE", "JU"],
                "type": "string"
              },
              "ersatzbeschaffung": {
                "default": false,
                "description": "Reinvest proceeds into a replacement primary residence.",
                "type": "boolean"
              },
              "ersatzbeschaffung_amount": {
                "default": 0,
                "description": "Amount reinvested (caps the tax deferral).",
                "minimum": 0,
                "type": "number"
              },
              "purchase_price": {
                "minimum": 0,
                "type": "number"
              },
              "sale_price": {
                "minimum": 0,
                "type": "number"
              },
              "years_held": {
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["canton", "purchase_price", "sale_price", "years_held"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f338f9bdb4e2a5ee53ead6e6e4646a7f1909f78218909e2a703d087843c81f49"
        },
        {
          "name": "get_portfolio_returns",
          "description": "Return RetireCrunch's historical portfolio return profiles for a currency. Each profile is a (return %, volatility %) pair derived from real index data — useful for grounding the assumptions in calculate_fire_target / project_wealth_plan in something defensible rather than guessing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "currency": {
                "description": "Currency code; the historical return profiles are denominated in this currency.",
                "enum": ["USD", "EUR", "GBP", "CHF", "JPY", "CAD", "AUD", "DKK"],
                "type": "string"
              }
            },
            "required": ["currency"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f5ac6fb2de561a87a2220a65ec12718e269c15ee235cbd39c7f6d96d8c96389b"
        },
        {
          "name": "get_rebalance_plan",
          "description": "Fetch the rebalancing trades the user decided on in the RetireCrunch Rebalancer, from the plan code they copied (\"Send plan to my AI\"). Codes work once, for 15 minutes. Returns the trades with IBKR contract ids where known. To act on them, create one IBKR order instruction per trade (create_order_instruction); the user reviews and submits each one inside IBKR. RetireCrunch never places orders.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "description": "The plan code the user copied from the RetireCrunch Rebalancer (\"Send plan to my AI\").",
                "maxLength": 200,
                "minLength": 33,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:755009fca27357d291a3b2c2f371d666a7afe0fc16c668f3305088274cd3f9c3"
        },
        {
          "name": "load_portfolio",
          "description": "Open the user's Interactive Brokers portfolio in the RetireCrunch Portfolio Rebalancer. First call the IBKR connector's get_account_positions, get_account_balances and get_account_summary, then pass their results here UNCHANGED (do not re-type or round numbers). Returns a private link that works once, for 15 minutes — give it to the user exactly as written. No login is needed because the link itself is the key: the positions are encrypted with a key that exists only in the link, and RetireCrunch's server holds just that encrypted copy, which it cannot read, for at most 15 minutes and deletes it when the link is opened. Tell the user this, and that anyone holding the link can open it once, so it should not be shared. RetireCrunch does not recommend instruments or allocations: the user sets their own targets on the page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "balances": {
                "description": "The `balances` array from IBKR get_account_balances, unchanged (gives per-currency cash).",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "cash_balance": {
                      "type": "number"
                    },
                    "currency": {
                      "description": "ISO code, or \"BASE\" for the base-currency roll-up.",
                      "type": "string"
                    },
                    "exchange_rate": {
                      "type": "number"
                    },
                    "net_liquidation_value": {
                      "type": "number"
                    }
                  },
                  "required": ["cash_balance", "currency"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "language": {
                "default": "en",
                "description": "Site language for the link, matching the user's language when possible.",
                "enum": ["en", "es", "fr", "pt-BR", "de", "ja", "it"],
                "type": "string"
              },
              "positions": {
                "description": "The `positions` array from IBKR get_account_positions, unchanged.",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "asset_class": {
                      "description": "STK, OPT, FUT, BOND, FUND …",
                      "type": "string"
                    },
                    "average_price": {
                      "type": "number"
                    },
                    "contract_description": {
                      "description": "e.g. \"GOOG\" or \"NVDA Jun17'27 110 PUT @AMEX\".",
                      "type": "string"
                    },
                    "contract_id": {
                      "description": "IBKR contract id (conid).",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "currency": {
                      "maxLength": 3,
                      "minLength": 3,
                      "type": "string"
                    },
                    "market_price": {
                      "description": "Price per unit (per share for options).",
                      "type": "number"
                    },
                    "market_value": {
                      "description": "Market value in the position currency.",
                      "type": "number"
                    },
                    "position": {
                      "description": "Units held (negative = short).",
                      "type": "number"
                    }
                  },
                  "required": ["currency", "market_price", "market_value", "position"],
                  "type": "object"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "summary": {
                "additionalProperties": {},
                "description": "The result of IBKR get_account_summary, unchanged (base currency + net liquidation, used to check the numbers add up).",
                "properties": {
                  "currency": {
                    "type": "string"
                  },
                  "net_liquidation": {
                    "type": "number"
                  }
                },
                "type": "object"
              }
            },
            "required": ["positions"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5505da8a59e0d2073daf13c2e5002f28a51e07d1a8ae94f476c7a83931698e98"
        },
        {
          "name": "project_wealth_plan",
          "description": "Run RetireCrunch's full year-by-year Wealth Plan projection for a household. Models earned income, pensions, expenses, portfolio growth (accumulating, distributing, or accumulating until a switch year), mortgage amortization, optional property sale, and region-aware tax (US uses 2026 federal+state brackets; other regions use a flat rate). Returns a compact summary with 5-year milestones by default, or the full annual array when yearly_detail=true.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "currency": {
                "default": "USD",
                "enum": ["USD", "EUR", "GBP", "CHF", "JPY", "CAD", "AUD", "DKK"],
                "type": "string"
              },
              "current_earned_income": {
                "default": 0,
                "description": "Annual gross earned income today.",
                "minimum": 0,
                "type": "number"
              },
              "current_housing_expenses": {
                "default": 0,
                "description": "Annual housing expenses today.",
                "minimum": 0,
                "type": "number"
              },
              "current_investment_portfolio": {
                "default": 0,
                "minimum": 0,
                "type": "number"
              },
              "current_liquidity": {
                "default": 0,
                "minimum": 0,
                "type": "number"
              },
              "current_living_costs": {
                "default": 0,
                "description": "Annual general living expenses today.",
                "minimum": 0,
                "type": "number"
              },
              "current_mortgage": {
                "default": 0,
                "minimum": 0,
                "type": "number"
              },
              "current_other_expenses": {
                "default": 0,
                "description": "Annual other expenses today.",
                "minimum": 0,
                "type": "number"
              },
              "current_property": {
                "default": 0,
                "minimum": 0,
                "type": "number"
              },
              "estimated_tax_rate": {
                "default": 20,
                "description": "Pre-retirement effective tax rate (%).",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "household_type": {
                "default": "single",
                "enum": ["single", "couple"],
                "type": "string"
              },
              "income_yield_rate": {
                "default": 3.5,
                "description": "Annual payout % of the portfolio while distributing.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "inflation_rate": {
                "default": 2,
                "description": "Annual inflation %.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "partner_early_death_years_before_end": {
                "default": 5,
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "partner_survivor_expense_factor": {
                "default": 0.7,
                "maximum": 1,
                "minimum": 0.3,
                "type": "number"
              },
              "plan_horizon_years": {
                "default": 50,
                "description": "Total years to project from start_year.",
                "maximum": 80,
                "minimum": 1,
                "type": "integer"
              },
              "portfolio_return_mode": {
                "description": "What the portfolio does with its return. 'accumulating': everything stays invested and compounds, nothing is paid out (shortfalls are drawn from cash, then the portfolio). 'distributing': pays out income_yield_rate % of its value every year from start_year as investment income; the rest stays invested. 'switch': accumulating until portfolio_switch_year, distributing from then on. If omitted: 'switch' when portfolio_switch_enabled is true (the legacy default), 'accumulating' when it is false.",
                "enum": ["accumulating", "distributing", "switch"],
                "type": "string"
              },
              "portfolio_return_rate": {
                "default": 5,
                "description": "Annual real portfolio return %.",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "portfolio_switch_enabled": {
                "default": true,
                "description": "Legacy: prefer portfolio_return_mode. Only read when portfolio_return_mode is omitted.",
                "type": "boolean"
              },
              "portfolio_switch_year": {
                "description": "'switch' mode: first year the portfolio pays out. Defaults to retirement_year if omitted.",
                "maximum": 2200,
                "minimum": 1900,
                "type": "integer"
              },
              "portfolio_volatility": {
                "default": 0,
                "description": "Return std dev %; 0 = deterministic.",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "post_retirement_tax_rate": {
                "default": 10,
                "description": "Post-retirement effective tax rate (%).",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "property_sale_destination": {
                "default": "liquidity",
                "enum": ["liquidity", "investmentPortfolio"],
                "type": "string"
              },
              "property_sale_enabled": {
                "default": false,
                "type": "boolean"
              },
              "property_sale_year": {
                "maximum": 2200,
                "minimum": 1900,
                "type": "integer"
              },
              "region": {
                "default": "GENERIC",
                "description": "Country regime — drives tax model (US uses bracket-based federal/state; others a flat rate).",
                "enum": ["US", "CH", "GB", "EU", "JP", "GENERIC"],
                "type": "string"
              },
              "retirement_year": {
                "description": "Year retirement begins.",
                "maximum": 2200,
                "minimum": 1900,
                "type": "integer"
              },
              "start_year": {
                "description": "First year of the projection (typically the current year).",
                "maximum": 2200,
                "minimum": 1900,
                "type": "integer"
              },
              "yearly_detail": {
                "default": false,
                "description": "When true, include the full year-by-year array in the response. When false (default), return a compact summary plus 5-year milestones.",
                "type": "boolean"
              }
            },
            "required": ["retirement_year", "start_year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:66ab4747b9c90e5891a70e2c629dd091da6dd7d5b010361d7be73f155d160ce6"
        },
        {
          "name": "rebalance_portfolio",
          "description": "Rebalance a multi-currency portfolio: given holdings, per-holding (or per-asset-class) target weights, cash and FX rates, return the exact BUY/SELL trades to reach the targets, the per-currency cash movements (flagging foreign-cash overdrafts), and a summary. It is the same plan the RetireCrunch Portfolio Rebalancer page makes: class goals drive holdings (locked holdings stay put, target_mode \"custom\" holdings keep their target_pct, the rest share the class goal pro-rata to value), with an optional buy-only mode, tolerance band and new money. The verdict says why there are trades or none (onTarget, locked, belowMinimum, …). Planning math only — no transaction costs or taxes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "available_cash": {
                "additionalProperties": {
                  "type": "number"
                },
                "default": {},
                "description": "Cash held per currency, keyed by ISO code.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "base_currency": {
                "default": "USD",
                "description": "Base currency the portfolio is valued in.",
                "type": "string"
              },
              "class_targets": {
                "additionalProperties": {
                  "maximum": 100,
                  "minimum": 0,
                  "type": "number"
                },
                "description": "Optional per-asset-class goal % of the whole portfolio (incl. \"Cash\"). Inside a class with a goal, locked holdings stay put, target_mode \"custom\" holdings keep their target_pct, and the rest share what is left pro-rata to current value. Classes without a goal trade to their holdings' own target_pct.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "fx_rates": {
                "additionalProperties": {
                  "exclusiveMinimum": 0,
                  "type": "number"
                },
                "default": {},
                "description": "Value of 1 unit of each currency in the base currency (base currency itself is 1).",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "holdings": {
                "description": "The portfolio holdings to rebalance.",
                "items": {
                  "properties": {
                    "asset_class": {
                      "default": "Equity",
                      "description": "Equity, Bond, Cash, Real estate, Commodity, Alternative, Crypto or Other.",
                      "type": "string"
                    },
                    "cost_basis": {
                      "default": 0,
                      "description": "Average acquisition price per unit (for P/L only).",
                      "minimum": 0,
                      "type": "number"
                    },
                    "currency": {
                      "description": "ISO currency code the instrument trades in (e.g. \"USD\").",
                      "type": "string"
                    },
                    "locked": {
                      "default": false,
                      "description": "Pin to current weight — never traded.",
                      "type": "boolean"
                    },
                    "multiplier": {
                      "description": "Units of the underlying one quantity unit stands for (default 1): 100 for a US equity option, 0.01 for a bond quoted in % of par. Value = quantity × price × multiplier.",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "name": {
                      "description": "Human-readable instrument name.",
                      "type": "string"
                    },
                    "price": {
                      "description": "Current price per unit, in the holding currency.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "quantity": {
                      "description": "Units/shares held.",
                      "type": "number"
                    },
                    "risk_level": {
                      "default": "Medium",
                      "description": "Low, Medium or High.",
                      "type": "string"
                    },
                    "sec_type": {
                      "description": "Broker security type (STK, OPT, BOND, BILL …). BOND and BILL trade in 1,000-face steps.",
                      "type": "string"
                    },
                    "symbol": {
                      "description": "Ticker symbol.",
                      "type": "string"
                    },
                    "target_mode": {
                      "default": "auto",
                      "description": "Only matters inside a class that has a goal in class_targets. \"auto\" (default): the holding shares what is left of the class goal with the other auto holdings, pro-rata to current value, and its target_pct is ignored. \"custom\": the holding keeps its own target_pct.",
                      "enum": ["auto", "custom"],
                      "type": "string"
                    },
                    "target_pct": {
                      "description": "Target weight as % of the whole portfolio (incl. cash).",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["currency", "price", "quantity", "symbol", "target_pct"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "mode": {
                "default": "rebalance",
                "description": "\"rebalance\" (default): buy and sell to reach the targets. \"buyOnly\": never sell; spend only the cash above the cash target, spread evenly over the under-weight holdings.",
                "enum": ["rebalance", "buyOnly"],
                "type": "string"
              },
              "new_money": {
                "default": 0,
                "description": "New money to invest, in base_currency (default 0). Added to base-currency cash before the plan is made.",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "tolerance_pts": {
                "default": 0,
                "description": "Tolerance band in percentage points (default 0). A class within this many points of its goal is not traded. Needs class_targets.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["holdings"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5e70c789b4ac4f0d60391727986ef24d168dc499b15f92c32b7b6d005afb08be"
        }
      ],
      "digest": "sha256:636c3b59b22941deb6d1adf2d7dcf5e606cf13f6dba4b42fa624b898874bdab6"
    }
  }
}
