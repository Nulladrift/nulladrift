        "websiteUrl": "https://emojidig.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Searches all Unicode emoji by meaning, slang or name (e.g. \"crying laughing\", \"skull\", \"ok hand\") and returns the exact emoji characters to paste, with names, codepoints and a page link.",
      "tools": [
        {
          "name": "get_emoji",
          "title": "Emoji details",
          "description": "Look up one emoji by the character itself (e.g. \"🫠\") or its EmojiDig slug (e.g. \"melting-face\"): name, codepoints, category, Unicode version, aliases, keywords, skin-tone support and related emoji.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "emoji": {
                "description": "The emoji character or its slug.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["emoji"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:888bc42bad4bac583ae473b71097fc201b6049f852b0ea686f57ffe63c48790d"
        },
        {
          "name": "search_emoji",
          "title": "Search emoji",
          "description": "Find emoji by meaning, mood, slang or name, e.g. \"happy\", \"dead\", \"fire\", \"thank you\", \"flag japan\". Returns the emoji characters, names and links, best match first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
