        {
          "name": "voice_to_sheet",
          "title": "Turn a voice note into a table",
          "description": "Use this when the user has a voice note that lists things (expenses, orders, stock counts, hours worked) and wants it as a table. Pass the attached audio as file, or audio_url, or audio_base64 (ogg, opus, m4a, mp3, wav, webm, flac or amr; up to about 3 minutes); add language when known. It transcribes the note with free speech-to-text, then copies it into rows and columns. Returns the table, the transcript, the values that may be misheard (unclear), sum checks, CSV text and 24-hour links. Not for meeting transcripts or subtitles.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "audio_base64": "T2dnUwACAAAAAAAAAAA=",
                "language": "en"
              }
            ],
            "properties": {
              "audio_base64": {
                "description": "The audio bytes as base64, up to 6 MB.",
                "type": "string"
              },
              "audio_url": {
                "description": "A public https link to one voice note (ogg, opus, m4a, mp3, wav, webm, flac or amr), up to 6 MB, about 3 minutes.",
                "maxLength": 2000,
                "type": "string"
              },
              "file": {
                "additionalProperties": false,
                "description": "The voice note the user attached in the chat.",
                "properties": {
                  "download_url": {
                    "description": "Temporary link to the uploaded file.",
                    "maxLength": 4096,
                    "type": "string"
                  },
                  "file_id": {
                    "description": "Id of the uploaded file.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "file_name": {
                    "maxLength": 400,
                    "type": "string"
                  },
                  "mime_type": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "hint": {
                "description": "Optional: what the content is or which columns the person wants, for example 'stock count, item and quantity only'.",
                "maxLength": 300,
                "type": "string"
              },
              "language": {
                "description": "Optional ISO 639-1 code of the spoken language, such as en, vi, es or sw. Without it the language is detected.",
                "pattern": "^[a-z]{2,3}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checks": {
                "items": {
                  "properties": {
                    "check": {
                      "enum": ["line_amount", "column_sum", "total_math", "row_total"],
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    },
                    "row": {
                      "type": ["integer", "null"]
                    },
                    "status": {
                      "enum": ["ok", "mismatch", "unchecked"],
                      "type": "string"
                    }
                  },
                  "required": ["check", "detail", "row", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "columns": {
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["label", "quantity", "unit_price", "amount", "row_total", "part", "date", "time", "person", "other"],
                      "type": "string"
                    },
                    "type": {
                      "enum": ["text", "number", "money", "date", "time"],
                      "type": "string"
