        {
          "name": "photo_to_sheet",
          "title": "Turn a photo into a table",
          "description": "Use this when the user has a photo of a receipt, a notebook page, a shop shelf, a chat screenshot with orders, a timesheet or a printed log and wants it as a table or spreadsheet. Pass the attached photo as file, or image_url (a public https link), or image_base64; add hint when the user says which columns they want. Returns the rows and columns in the page's own language with numbers written plainly, the totals on the page, the cells hard to read, sum checks (quantity x price, column total, tax, row totals) that flag a wrong sum, CSV text, and links to a printable page and CSV file kept for 24 hours. It copies what is visible and never invents values. Not for photos of people. For a product photo meant for a listing, use describe_product_photo.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "image_base64": "/9j/4AAQSkZJRgAB"
              }
            ],
            "properties": {
              "file": {
                "additionalProperties": false,
                "description": "The photo the user attached in the chat.",
                "properties": {
                  "download_url": {
                    "description": "Temporary link to the uploaded file.",
                    "maxLength": 4096,
                    "type": "string"
                  },
                  "file_id": {
                    "description": "Id of the uploaded file.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "file_name": {
                    "maxLength": 400,
                    "type": "string"
                  },
                  "mime_type": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "hint": {
                "description": "Optional: what the content is or which columns the person wants, for example 'stock count, item and quantity only'.",
                "maxLength": 300,
                "type": "string"
              },
              "image_base64": {
                "description": "The image bytes as base64 (a data: URL is accepted), up to 8 MB.",
                "type": "string"
              },
              "image_url": {
                "description": "A public https link to one JPEG, PNG, WebP or HEIC image, up to 8 MB.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checks": {
                "items": {
                  "properties": {
                    "check": {
                      "enum": ["line_amount", "column_sum", "total_math", "row_total"],
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    },
                    "row": {
                      "type": ["integer", "null"]
                    },
                    "status": {
                      "enum": ["ok", "mismatch", "unchecked"],
                      "type": "string"
                    }
                  },
                  "required": ["check", "detail", "row", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "columns": {
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["label", "quantity", "unit_price", "amount", "row_total", "part", "date", "time", "person", "other"],
                      "type": "string"
                    },
                    "type": {
                      "enum": ["text", "number", "money", "date", "time"],
                      "type": "string"
                    }
                  },
                  "required": ["name", "role", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "csv": {
                "type": "string"
              },
              "currency": {
                "type": ["string", "null"]
              },
              "kind": {
                "enum": ["receipt", "notebook", "shelf", "chat", "timesheet", "expenses", "orders", "log", "other", null],
                "type": ["string", "null"]
              },
              "links": {
                "properties": {
                  "csv": {
                    "type": "string"
                  },
                  "expires_at": {
                    "type": "string"
                  },
                  "json": {
                    "type": "string"
                  },
                  "page": {
                    "type": "string"
                  }
                },
                "required": ["csv", "expires_at", "json", "page"],
                "type": ["object", "null"]
              },
              "message": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notice": {
                "type": "string"
              },
              "rows": {
                "items": {
                  "items": {
                    "type": ["string", "null"]
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "source": {
                "enum": ["photo", "voice", "text"],
                "type": "string"
              },
              "status": {
                "enum": ["ok", "no_table", "unreadable", "no_speech", "capacity_reached", "unavailable"],
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "totals": {
                "items": {
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["subtotal", "tax", "discount", "tip", "total", "paid", "change", "other"],
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "role", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "transcript": {
                "properties": {
                  "language": {
                    "type": ["string", "null"]
                  },
                  "seconds": {
                    "type": ["number", "null"]
                  },
                  "text": {
                    "type": "string"
                  }
                },
                "required": ["language", "seconds", "text"],
                "type": ["object", "null"]
              },
              "unclear": {
                "items": {
                  "properties": {
                    "column": {
                      "type": "string"
                    },
                    "reading": {
                      "type": "string"
                    },
                    "row": {
                      "type": "integer"
                    }
                  },
                  "required": ["column", "reading", "row"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["checks", "columns", "csv", "currency", "kind", "links", "message", "notes", "notice", "rows", "source", "status", "title", "totals", "transcript", "unclear"],
            "type": "object"
          },
