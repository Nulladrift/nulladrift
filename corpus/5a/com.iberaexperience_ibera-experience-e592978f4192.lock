          },
          "digest": "sha256:c07dbf9f17e5f696a900fa714b80d2a3dcf6ed1ae46ab5c92434ed3eb4ed824a"
        },
        {
          "name": "como_llegar",
          "title": "Cómo llegar a un portal",
          "description": "Devuelve rutas, distancias y tiempos para llegar a un portal desde Buenos Aires, Corrientes, Posadas o Mercedes, con el estado del camino, las alertas del portal y los traslados con precio del catálogo que llegan a ese portal.",
          "inputSchema": {
            "properties": {
              "desde": {
                "description": "Ciudad de partida. Si falta, se explica desde Buenos Aires y desde la base más cercana.",
                "enum": ["buenos-aires", "corrientes", "posadas", "mercedes"],
                "type": "string"
              },
              "portal": {
                "description": "Portal (id, nombre o pueblo).",
                "type": "string"
