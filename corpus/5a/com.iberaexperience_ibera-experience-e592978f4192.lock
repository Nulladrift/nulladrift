          "name": "listar_portales",
          "title": "Listar los portales del Iberá",
          "description": "Devuelve los 10 portales de acceso a los Esteros del Iberá con su pueblo, qué los distingue, mejor época, alertas vigentes, entrada al parque, cuántos prestadores tiene cada uno por rubro, cuántos productos con precio hay en el catálogo y el link a su guía.",
