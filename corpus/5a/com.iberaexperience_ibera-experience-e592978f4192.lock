      "serverInfo": {
        "name": "ibera-experience",
        "title": "Iberá Experience",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Iberá Experience es la guía de los Esteros del Iberá (Corrientes, Argentina): 10 portales de acceso, más de 500 prestadores y un catálogo de experiencias con precio del prestador, sin recargo. Las reservas son POR SOLICITUD: usá preparar_solicitud_reserva para armar el mensaje y dale a la persona el link de WhatsApp o el mail de Iberá Experience. Nunca digas que una reserva está confirmada: la confirma el prestador por ese canal. Acá no se cobra nada. Los precios son la tarifa final publicada por el prestador (con impuestos) y tienen fecha de vigencia. Si un producto dice Consultar, no inventes un precio. Este servidor no da teléfonos ni mails de prestadores: mandá a la persona a la ficha (url) o a la solicitud de reserva. Ibera Experience is the guide to the Ibera Wetlands (Argentina). Bookings are by request through Ibera Experience; never state a booking is confirmed. Prices are the provider's public rates.",
      "tools": [
        {
          "name": "buscar_experiencias",
          "title": "Buscar experiencias con precio",
          "description": "Busca en el catálogo vendible de Iberá Experience: experiencias, alojamientos, traslados y guías de los Esteros del Iberá que el prestador aceptó distribuir, y viajes de varios días armados por Iberá Experience, con su precio público y reserva por solicitud. Filtra por portal, tipo, cantidad de personas, presupuesto, idioma o texto libre. Devuelve hasta 20 productos (id, prestador, portal, tipo, precio con vigencia, capacidad, idiomas, cancelación y link a la ficha) y el total encontrado. Si el catálogo no tiene productos publicados, devuelve una lista vacía con el aviso \"catálogo vacío\".",
          "inputSchema": {
            "properties": {
              "idioma": {
                "description": "Idioma en que se atiende.",
                "enum": ["es", "en", "pt", "fr"],
                "type": "string"
              },
              "moneda": {
                "description": "Moneda del presupuesto. Por defecto ARS.",
                "enum": ["ARS", "USD"],
                "type": "string"
              },
              "personas": {
                "description": "Cuántas personas viajan (filtra por capacidad).",
                "minimum": 1,
                "type": "integer"
              },
              "portal": {
                "description": "Portal de acceso: id (lagunasibera, cambyreta, sanantonio, sannicolas, carambola, galarza, riocorriente, uguay, capivari, mburucuya), nombre o pueblo (por ejemplo \"Carlos Pellegrini\").",
                "type": "string"
              },
              "presupuesto_max": {
                "description": "Precio máximo por unidad de precio del producto (en la moneda indicada).",
                "type": "number"
              },
              "texto": {
                "description": "Texto libre: kayak, cabaña, nocturna, traslado desde Mercedes...",
                "type": "string"
              },
              "tipo": {
                "description": "Tipo de producto.",
                "enum": ["safari_fauna", "navegacion", "cabalgata", "caminata", "avistaje_aves", "alojamiento", "traslado", "gastronomia", "artesania", "guia", "paquete"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar experiencias con precio"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:65fa6bee54145e99d869c6ab31a56b70fb3d55f3f1f8b6a46350d5cef306949c"
        },
        {
          "name": "buscar_prestadores",
          "title": "Buscar en el directorio (sin precio garantizado)",
          "description": "Busca en el directorio completo de la guía (más de 500 alojamientos, excursiones, guías, gastronomía, traslados, artesanos y agencias) por portal, categoría o texto. Devuelve hasta 20 prestadores (nombre, rubro, pueblo, precio orientativo o Consultar, puntaje, reseñas y link a la ficha, donde está su contacto) y el total encontrado. No da teléfonos ni mails, y estos prestadores no se reservan a través de este servidor.",
          "inputSchema": {
            "properties": {
              "categoria": {
                "description": "Rubro.",
                "enum": ["alojamiento", "excursion", "gastronomia", "guia", "transfer", "artesania", "agencia"],
                "type": "string"
              },
              "portal": {
                "description": "Portal (id, nombre o pueblo).",
                "type": "string"
              },
              "texto": {
                "description": "Texto libre sobre nombre o descripción.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar en el directorio (sin precio garantizado)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
