        },
        {
          "name": "detalle_experiencia",
          "title": "Detalle de una experiencia",
          "description": "Devuelve todo lo publicado de un producto del catálogo vendible, buscado por su id: precio y vigencia, duración, horarios, temporada, capacidad, qué incluye y qué no, cancelación, punto de encuentro e idiomas, más la ficha del prestador en la app (sin teléfonos ni mails) y cómo se pide la reserva. Con un id que no está en el catálogo devuelve un error.",
          "inputSchema": {
            "properties": {
