      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for blbestate.com: read the site, list what can be bought (list_products) and start a purchase (create_checkout, get_checkout). create_checkout never charges anything: it returns a continue_url where the buyer pays on the Stripe-hosted checkout page. No credentials. Rate limited; stay under one call per second. See https://blbestate.com/auth.md.",
      "tools": [
        {
          "name": "create_checkout",
          "description": "Start a purchase of one offer. Returns a continue_url: send the buyer there to pay on the Stripe-hosted checkout page. This tool does not charge anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "offer_id": {
                "enum": ["realestate-mac", "realestate-windows"],
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "maximum": 1,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["offer_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6dea0da53acc5f27fd30811ae87a33e22800173f34b29a53642a517b8a0b83e0"
        },
