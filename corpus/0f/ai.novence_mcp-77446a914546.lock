        {
          "name": "configure_custom_domain",
          "title": "Configure custom domain",
          "description": "Attach a custom domain. For site domains, enables apex+www. Default primary=www. Required DNS: CNAME www → fallback.novence.ai. Then do exactly one apex option: ALIAS/ANAME/CNAME-flattening @ → fallback.novence.ai, or registrar URL-redirect @ → https://www.{domain}/. Pass primary=apex only when the apex must serve (ALIAS required; URL-redirect would loop).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hostname": {
                "description": "Custom hostname (e.g. example.com or www.example.com).",
                "type": "string"
              },
              "primary": {
                "description": "Which host is canonical. Default www.",
                "enum": ["www", "apex"],
                "type": "string"
              },
              "project_id": {
                "description": "Hosting project UUID from create_project or list_projects.",
                "format": "uuid",
                "type": "string"
              },
              "redirect": {
                "description": "If true, redirect the non-primary host to the primary. Default true.",
                "type": "boolean"
              }
            },
            "required": ["hostname", "project_id"],
            "type": "object"
