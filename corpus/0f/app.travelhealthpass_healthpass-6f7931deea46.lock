{
  "lockfileVersion": 2,
  "subjects": {
    "app.travelhealthpass/healthpass": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://travelhealthpass.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "healthpass",
        "title": "HealthPass",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "HealthPass finds travel-health doctors and clinics, verified by a person, and lets travellers request an appointment on HealthPass. You never book: every result has a HealthPass link where the traveller signs in and sends the request. Do not pass diagnoses, conditions or medications to any tool; use the reason and service codes. If you found a doctor elsewhere, hand it over with prepare_appointment and give the traveller the returned link.",
      "tools": [
        {
          "name": "find_travel_health_provider",
          "title": "Find a travel-health doctor",
          "description": "Search verified travel-health doctors and clinics by country, city or position, service and language, nearest first when a position is given. Each result has a page and a HealthPass link where the traveller requests an appointment. Returns only providers a person has checked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2, e.g. PE",
                "type": "string"
              },
              "language": {
                "description": "ISO 639-1, e.g. de",
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "type": "number"
              },
              "service": {
                "enum": ["travel-consultation", "vaccination", "yellow-fever", "malaria-prophylaxis", "fitness-to-fly", "medication-letter", "chronic-condition-travel", "post-travel", "foreign-patients", "telemedicine"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a travel-health doctor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6485b53416e7920d6f7220d6b1100451faa5130aea8db4050932828a6e9eae9a"
        },
        {
          "name": "get_destination_requirements",
          "title": "Health requirements for a destination",
          "description": "Where the official entry and vaccination requirements for a country are published (CDC, WHO), and the HealthPass trip plan that matches them to the traveller's own record.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2, e.g. TH",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Health requirements for a destination"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f0a5f8e7b65a566301eb4b2bc3e80d2a180cc8a1f6f2374fea010628267a57a8"
        },
        {
          "name": "get_provider",
          "title": "Get a travel-health doctor",
          "description": "The checked details of one verified provider: services, languages, foreign-patient policy, opening hours, date verified, and the HealthPass request link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a travel-health doctor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f25055f25fe12eb8aaae881a0ebfd6ec421d6807a8dfa4be9cafccac5d4e68ae"
        },
        {
          "name": "prepare_appointment",
          "title": "Hand a doctor over to HealthPass",
          "description": "Hand over a doctor you found so the traveller can request an appointment on HealthPass. This books nothing and sends nothing: it returns a link the traveller opens to sign in, check the doctor and send the request. Give what you know about the doctor and cite your sources. Do not include the traveller's name, diagnosis, condition or medication. HealthPass emails the practice only if the address appears on the practice's own website.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "doctor": {
                "properties": {
                  "address": {
                    "properties": {
                      "city": {
                        "type": "string"
                      },
                      "country": {
                        "description": "ISO 3166-1 alpha-2",
                        "type": "string"
                      },
                      "postalCode": {
                        "type": "string"
                      },
                      "street": {
                        "type": "string"
                      }
                    },
                    "required": ["city", "country"],
                    "type": "object"
                  },
                  "certifications": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "email": {
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["clinic", "physician"],
                    "type": "string"
                  },
                  "languages": {
                    "description": "ISO 639-1 codes",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "name": {
                    "type": "string"
                  },
                  "openingHours": {
                    "type": "string"
                  },
                  "patientFeedback": {
                    "description": "A short summary of patient feedback; cite where it is from in sources",
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  },
                  "services": {
                    "items": {
                      "enum": ["travel-consultation", "vaccination", "yellow-fever", "malaria-prophylaxis", "fitness-to-fly", "medication-letter", "chronic-condition-travel", "post-travel", "foreign-patients", "telemedicine"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "sources": {
                    "description": "https pages the facts come from",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "specializations": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "website": {
                    "description": "https only",
                    "type": "string"
                  }
                },
                "required": ["address", "name"],
                "type": "object"
              },
              "preferredDays": {
                "properties": {
                  "from": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "to": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["from", "to"],
                "type": "object"
              },
              "reason": {
                "enum": ["pre-travel", "vaccination", "chronic-condition", "fitness-to-fly", "during-trip", "post-travel"],
                "type": "string"
              }
            },
            "required": ["doctor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Hand a doctor over to HealthPass"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8d401be4d06ff2fe7c491950969af8983f3444bbaad4013342a59cee8ab5b235"
        }
      ],
      "digest": "sha256:59c58479cb7970f3ff338676b965ffe7f5da08c653846ec37c896555a93c4d04"
    }
  }
}
