                    },
                    "type": "array"
                  },
                  "final_total_ttc": {
                    "description": "Total TTC avec les frais d'expédition, indicatif, en euros.",
                    "type": "number"
                  },
                  "lines": {
                    "description": "Les lignes chiffrées.",
                    "items": {
                      "additionalProperties": true,
                      "properties": {
                        "name": {
                          "description": "Son nom.",
                          "type": "string"
                        },
                        "quantity": {
