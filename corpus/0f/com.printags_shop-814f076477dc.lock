            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lines": {
                "description": "Les lignes du panier (1 à 10), une par produit.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "back_upload_id": {
                      "description": "Visuel du verso. Sans lui ni blank_back, la personne l'enverra elle-même.",
                      "format": "uuid",
                      "type": "string"
                    },
                    "blank_back": {
                      "description": "true : verso vierge (aucun fichier verso).",
                      "type": "boolean"
                    },
                    "cards": {
                      "description": "Un visuel (et un contenu de puce) PAR CARTE, pour une équipe : autant d'entrées que `quantity`, au moins deux. Le tarif dégressif s'applique sur la quantité totale. Ne se combine pas avec front_upload_id, back_upload_id, encoding, encodings.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "back_upload_id": {
                            "description": "Visuel du verso de CETTE carte, rendu par create_upload, upload_file ou upload_visual.",
                            "format": "uuid",
                            "type": "string"
                          },
                          "encoding": {
                            "additionalProperties": false,
                            "description": "Contenu de la puce de CETTE carte.",
                            "properties": {
                              "content": {
                                "description": "L'adresse complète (https://…) ou le texte. Jamais inventé : donné par la personne.",
                                "maxLength": 1000,
                                "type": "string"
                              },
                              "lock": {
                                "description": "true (défaut, comme sur le Studio) : la puce est verrouillée en lecture seule après l'écriture, IRRÉVERSIBLE ; le panier l'indique (« verrouillé »). false : seulement si la personne veut pouvoir la réécrire. Préviens-la que la puce sera verrouillée sauf demande contraire.",
                                "type": "boolean"
                              },
                              "type": {
                                "description": "'uri' : une adresse (dans `content`), 'text' : un texte, 'empty' : puce non encodée.",
                                "enum": ["uri", "text", "empty"],
                                "type": "string"
                              }
                            },
                            "required": ["type"],
                            "type": "object"
                          },
                          "front_upload_id": {
                            "description": "Visuel du recto de CETTE carte, rendu par create_upload, upload_file ou upload_visual. Sans lui, la personne l'enverra depuis le Studio.",
                            "format": "uuid",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "maxItems": 50,
                      "minItems": 2,
                      "type": "array"
                    },
