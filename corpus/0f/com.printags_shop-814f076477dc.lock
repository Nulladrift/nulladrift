        {
          "name": "prepare_cart",
          "title": "Préparer un panier et donner le lien",
          "description": "Prépare un panier du Studio pour la personne et renvoie `claim_url`, un lien à lui donner. Elle l'ouvre : elle voit son panier et le BAT (épreuve) de ses cartes, l'approuve, saisit son adresse (et son numéro de TVA), choisit le transport et PAIE elle-même. Cet outil ne crée AUCUNE commande, n'envoie aucun e-mail, ne paie rien et n'approuve aucun BAT. Le lien est valable 48 heures et ne sert qu'une fois. Le prix vient du Studio. Les visuels sont facultatifs : ceux qui manquent, la personne les envoie depuis le Studio. Une ligne = un produit : un visuel pour toutes les cartes (front_upload_id…), des contenus de puce différents (encodings), ou un visuel par carte (cards). N'invente ni visuel, ni lien, ni texte de puce : demande ce qui manque.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "back_upload_id": {
                      "$ref": "#/properties/lines/items/properties/front_upload_id",
                      "description": "Visuel du verso. Sans lui ni blank_back, la personne l'enverra elle-même."
                    },
                    "blank_back": {
                      "description": "true : verso vierge (aucun fichier verso).",
                      "type": "boolean"
                    },
                    "cards": {
                      "description": "Un visuel (et un contenu de puce) PAR CARTE, pour une équipe : autant d'entrées que `quantity`, au moins deux. Le tarif dégressif s'applique sur la quantité totale. Ne se combine pas avec front_upload_id, back_upload_id, encoding, encodings.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "back_upload_id": {
                            "$ref": "#/properties/lines/items/properties/front_upload_id"
                          },
                          "encoding": {
                            "$ref": "#/properties/lines/items/properties/encoding",
                            "description": "Contenu de la puce NFC. Seulement pour une carte à puce NTAG (voir `encodable` de list_products)."
                          },
                          "front_upload_id": {
                            "$ref": "#/properties/lines/items/properties/front_upload_id"
                          }
                        },
                        "type": "object"
                      },
                      "maxItems": 50,
                      "minItems": 2,
                      "type": "array"
                    },
                    "encoding": {
                      "additionalProperties": false,
                      "description": "Un même contenu de puce pour toutes les cartes.",
                      "properties": {
                        "content": {
                          "description": "L'adresse complète (https://…) ou le texte. Jamais inventé : donné par la personne.",
                          "maxLength": 1000,
                          "type": "string"
                        },
                        "lock": {
                          "description": "true (défaut, comme sur le Studio) : la puce est verrouillée en lecture seule après l'écriture, IRRÉVERSIBLE ; le panier l'indique (« verrouillé »). false : seulement si la personne veut pouvoir la réécrire. Préviens-la que la puce sera verrouillée sauf demande contraire.",
                          "type": "boolean"
                        },
                        "type": {
                          "description": "'uri' : une adresse (dans `content`), 'text' : un texte, 'empty' : puce non encodée.",
                          "enum": ["uri", "text", "empty"],
                          "type": "string"
                        }
                      },
                      "required": ["type"],
                      "type": "object"
                    },
                    "encodings": {
                      "description": "Un contenu de puce par carte, même visuel : au plus `quantity` entrées, dans l'ordre. Ne se combine pas avec `encoding`.",
                      "items": {
                        "$ref": "#/properties/lines/items/properties/encoding"
                      },
                      "maxItems": 10000,
                      "type": "array"
                    },
                    "front_upload_id": {
                      "description": "Visuel du recto, rendu par create_upload ou upload_file. Le même pour toutes les cartes de la ligne.",
                      "format": "uuid",
                      "type": "string"
                    },
                    "product": {
                      "description": "Le slug rendu par list_products. Jamais de mémoire.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Nombre de cartes de cette ligne. Au moins `min_quantity` du produit.",
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["product", "quantity"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "locale": {
                "description": "Langue de la personne : noms des produits, et page du Studio où elle arrivera. Celle de la conversation.",
                "enum": ["fr", "en", "de", "it", "es"],
                "type": "string"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
