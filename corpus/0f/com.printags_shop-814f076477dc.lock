          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country_code": {
                "description": "Pays de livraison, ISO 3166-1 alpha-2 (défaut FR). Hors de France, des frais d'expédition s'ajoutent.",
