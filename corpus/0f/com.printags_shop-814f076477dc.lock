      },
      "instructions": "Studio Printags (studio.printags.com) : cartes de visite PVC, NFC, MIFARE et bois imprimées, SANS compte. Tu prépares un panier avec\nprepare_cart et tu donnes claim_url à la personne : elle approuve l'épreuve (BAT), saisit son adresse et PAIE elle-même sur le Studio.\nTu ne paies jamais, tu ne prends aucune adresse, tu n'approuves jamais le BAT. Commence par list_products (jamais de slug ni de prix de mémoire).\n\nParcours pour « commande-moi N cartes » :\n  1. list_products : slugs, quantité minimale, paliers de prix HT, cartes à puce encodable. Jamais de slug ni de prix de mémoire.\n  2. quote_cart pour annoncer le total (HT, TVA 20 %, TTC, port hors de France) : indicatif, le paiement recalcule. La livraison Chrono se choisit sur le Studio.\n  3. Le visuel, s'il existe : upload_visual si la personne l'a joint à la conversation (ChatGPT), sinon create_upload (PUT, si tu peux faire une\n     requête HTTP) ou upload_file (petit fichier en base64) ; chacun donne un upload_id. Sans moyen d'envoyer le fichier, prépare le panier\n     SANS visuel : la personne l'enverra depuis le Studio. N'invente jamais un visuel.\n  4. La puce NFC (produits « encodable ») : encoding = { type: \"uri\", content: \"https://…\" } (ou \"text\"). Comme sur le Studio, la puce est verrouillée POUR\n     TOUJOURS après l'écriture (le panier l'indique) : préviens la personne, et passe lock: false seulement si elle veut pouvoir la réécrire.\n     Un contenu par carte : encodings ; un visuel par carte (une équipe) : cards.\n  5. prepare_cart renvoie claim_url : DONNE-LE à la personne. Elle l'ouvre (valable 48 h, une seule fois), voit le panier et le BAT, l'approuve,\n     saisit adresse et TVA, choisit le transport et paie. Aucune commande n'existe avant son paiement.\n  6. get_order_status, plus tard, avec le jeton de suivi que la personne a reçu après son paiement.\n\nRègles :\n  • N'invente aucune donnée : quantité, contenu de la puce, texte, lien. Demande ce qui manque.\n  • Montants HORS TAXES sauf mention contraire ; les prix baissent avec la quantité.\n  • Fichiers : PNG, JPEG ou PDF, 25 Mo max (3 Mo en base64). Le contenu est vérifié.\n  • Le lien de reprise est personnel : ne le publie pas, ne l'ouvre pas toi-même.",
      "tools": [
        {
          "name": "create_upload",
          "title": "Déposer un visuel : URL d'envoi",
          "description": "Prépare le dépôt d'un visuel (PNG, JPEG ou PDF, 25 Mo max) à imprimer sur les cartes. Renvoie un `upload_id` et une URL de PUT valable 15 minutes : envoie-y les octets du fichier en un seul PUT, avec l'en-tête Content-Type du fichier (ex. curl -T visuel.png -H \"Content-Type: image/png\" <upload_url>). Cite ensuite l'`upload_id` dans prepare_cart. Un dépôt ne sert qu'une fois. Si tu ne peux pas faire de requête HTTP, utilise upload_file pour un petit fichier, ou prépare le panier sans visuel : la personne l'enverra elle-même depuis le Studio.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content_type": {
                "enum": ["image/png", "image/jpeg", "application/pdf"],
                "type": "string"
              },
              "file_name": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["content_type", "file_name"],
            "type": "object"
          },
