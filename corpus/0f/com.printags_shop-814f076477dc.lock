              "expires_at": {
                "description": "Fin de validité de upload_url (ISO 8601).",
                "type": "string"
              },
              "max_bytes": {
                "description": "Taille maximale du fichier, en octets.",
                "type": "integer"
              },
              "method": {
                "description": "Méthode HTTP à utiliser (PUT).",
                "type": "string"
              },
              "upload_id": {
                "description": "Identifiant du dépôt, à citer dans prepare_cart une fois le PUT réussi.",
                "type": "string"
              },
              "upload_url": {
                "description": "Adresse où envoyer les octets du fichier en un seul PUT.",
                "type": "string"
              }
            },
            "required": ["content_type", "expires_at", "max_bytes", "method", "upload_id", "upload_url"],
            "type": "object"
