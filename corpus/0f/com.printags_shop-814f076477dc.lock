                "minLength": 2,
                "type": "string"
              },
              "lines": {
                "description": "Les lignes à chiffrer (1 à 10), une par produit.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "product": {
                      "description": "Le slug rendu par list_products.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Nombre de cartes de cette ligne. Au moins `min_quantity` du produit.",
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["product", "quantity"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "locale": {
                "description": "Langue de la personne : noms des produits, et page du Studio où elle arrivera. Celle de la conversation.",
                "enum": ["fr", "en", "de", "it", "es"],
                "type": "string"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "quote": {
                "additionalProperties": true,
                "description": "Le chiffrage, indicatif : le paiement recalcule tout.",
                "properties": {
                  "delivery_option_applied": {
                    "description": "Option de livraison comptée dans final_total_ttc (standard).",
