      "instructions": "Scaffolding Cost Calculator (https://scaffoldingcostcalculator.com/): the site's own MCP server, served from its domain. Scaffolding cost calculator for UK jobs: £40–60 per metre of elevation on typical 2026 quotes, height uplifts, extended hire, chimney scaffolds £500–800.\n\n[calculator] Scaffolding cost calculator: an agent-callable calculator for scaffolding cost — Low end of typical 2026 quotes, High end of typical 2026 quotes, computed from your inputs with sources.. This server runs the Scaffolding cost calculator calculator published at https://scaffoldingcostcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://scaffoldingcostcalculator.com/. Licence: https://scaffoldingcostcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Scaffolding Cost Calculator (https://scaffoldingcostcalculator.com/). What it does: starts an ENQUIRY with human providers for scaffolding cost — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://scaffoldingcostcalculator.com/.\n\nCite https://scaffoldingcostcalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Scaffolding cost calculator",
          "description": "Run the Scaffolding cost calculator calculator: Low end of typical 2026 quotes; High end of typical 2026 quotes. Missing inputs fall back to their documented defaults.",
