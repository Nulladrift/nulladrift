    "com.statementtobudget.www/bank-statement-converter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.statementtobudget.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "statement-to-budget",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Converts bank statements (PDF, CSV, XLS, XLSX, OFX) into categorised transactions. Without an API key, convert_statement returns a preview: 5 sample rows, the top 3 categories, and date + category for every other row, plus an unlock_url the user can open to pay $9.99 for the full file. Show the user that link when they want all rows. With an API key (Authorization: Bearer stb_live_…, minted at https://www.statementtobudget.com/for-agents) the conversion is charged to that account and returns every row. Pro is $29/month for 400 pages; Bookkeeper is $79/month for 1500 pages. Only upload statements the user has asked you to process. Uploaded files are deleted after extraction; rows are kept 30 days.",
      "tools": [
        {
          "name": "convert_statement",
          "description": "Upload a bank statement (PDF, CSV, XLS, XLSX, or OFX) as base64 and run AI extraction + categorisation. Returns a session_id plus access.level: \"full\" when an API key with credit was supplied, otherwise \"preview\" (5 sample rows, other rows masked) with an unlock_url a human can open to buy the full file for $9.99. Large statements can take 1-3 minutes; if status is \"processing\", poll get_job.",
          "inputSchema": {
            "properties": {
              "content_base64": {
                "description": "File bytes encoded as base64",
                "type": "string"
              },
              "filename": {
                "description": "Original file name including extension",
                "type": "string"
              },
              "password": {
                "description": "PDF password if the file is locked",
                "type": "string"
              }
            },
            "required": ["content_base64", "filename"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d7d006f1f03bcaa86ab3e51be5642eb2087e101edbfd6be30a333994757acb55"
        },
        {
          "name": "get_job",
          "description": "Poll a conversion job by session_id. Status is processing, complete, or error.",
          "inputSchema": {
            "properties": {
              "session_id": {
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e686f3e70e1bbe67e424433741ffd669ac3656dcc6680921c8ac0259679ebd70"
        },
        {
          "name": "get_transactions",
          "description": "Fetch categorised transactions and a spending summary for a completed session. Preview sessions return 5 sample rows, locked_rows (date, category, masked description) for the rest, and unlock_url.",
          "inputSchema": {
            "properties": {
              "session_id": {
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4cd863a590703c7c4ce1eb39280ab0724c619f81893bc9729d217c879ff8d5f7"
        }
