{
  "lockfileVersion": 2,
  "subjects": {
    "com.eventstatapp/eventstatapp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://eventstatapp.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "eventstatapp",
        "title": "Eventstatapp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Eventstatapp hosts live race-day status pages for running races and other events. Use list_events to find upcoming events (search by name or place), then get_event_status with the event's slug for its current status (GREEN = go, YELLOW = caution, RED = stop, PENDING = no update yet), race schedule and latest public announcements. get_event_updates returns a longer announcement history. Statuses change during an event, so look them up again rather than reusing an old answer. Always give people the event's status_page_url (https://eventstatapp.com/e/<slug>) for the official, live information.",
      "tools": [
        {
          "name": "get_event_status",
          "title": "Get an event's live status",
          "description": "Current public status of one event (GREEN go / YELLOW caution / RED stop / PENDING no update yet) with the organizer's headline and message, every race's schedule and status, and the 5 newest public updates.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The event's slug: the last part of its status page address, e.g. riverside-10k for eventstatapp.com/e/riverside-10k.",
                "maxLength": 60,
                "minLength": 3,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an event's live status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ddeb066b4dafde62d16cc111ad3753f21091f97956be4dfcf6bd4528a5a338d8"
        },
        {
          "name": "get_event_updates",
          "title": "Get an event's update history",
          "description": "The public announcements an event's organizer has posted, newest first (up to 50).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "description": "Most updates to return, newest first (1–50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The event's slug: the last part of its status page address, e.g. riverside-10k for eventstatapp.com/e/riverside-10k.",
                "maxLength": 60,
                "minLength": 3,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an event's update history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc66259ba527c09b2557b2480ba0bbab8016b984dc0bd26621dcabbd0689cbc4"
        },
        {
          "name": "list_events",
          "title": "List upcoming events",
          "description": "Lists upcoming and ongoing events with live status pages on Eventstatapp, soonest first. Optionally search by name or location words and limit to a date range. Returns each event's slug, dates, location, current status and links.",
          "inputSchema": {
            "properties": {
              "from_date": {
                "description": "Only events still running on or after this day (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Most events to return (1–100, default 25).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for in the event name or location, e.g. \"marathon\" or \"Richmond\". Leave out to list all.",
                "maxLength": 100,
                "type": "string"
              },
              "to_date": {
                "description": "Only events starting on or before this day (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List upcoming events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52e2d1c3a80618f3d0d653c7838015c2607e440cdec47b054d31977d2f6b315e"
        }
      ],
      "digest": "sha256:652a5906b2996b95a0a83c7fa26e4e98e51e4c7e1525931da092b1acc6d1d01a"
    }
  }
}
