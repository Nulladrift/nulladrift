      "serverInfo": {
        "name": "com.clawhard/meridian",
        "title": "Meridian",
        "version": "1.0.0",
        "description": "Meridian converts times between time zones, shows who is awake, and finds meeting times that work across places, with daylight saving handled correctly for the exact date. Runs in your browser, no account.",
        "websiteUrl": "https://meridian.clawhard.com",
        "icons": [
          {
            "src": "https://clawhard.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Meridian: Meridian converts times between time zones, shows who is awake, and finds meeting times that work across places, with daylight saving handled correctly for the exact date. Runs in your browser, no account. Use it when you need the current time somewhere, a time converted between time zones, a meeting time that works across zones, or a daylight saving change. Tools: meridian_now (Current time in any places or time zones); meridian_convert_time (Convert a time between time zones, DST-correct); meridian_meeting_slots (Find meeting times that work across time zones); meridian_zone_info (Offset, abbreviation and daylight saving changes for a zone). Results include a link (open_url) that the user can open to see the same result on the website.",
      "tools": [
        {
          "name": "meridian_convert_time",
          "title": "Convert a time between time zones, DST-correct",
          "description": "Use when you need to convert a specific wall-clock time from one place to others, for any date. It uses the real tz database, so daylight saving is right for that exact date (the US and Europe switch on different weeks), and it warns when the time does not exist (spring forward) or happens twice (fall back). Time accepts \"15:00\", \"3:30pm\", \"noon\", \"now\" or an ISO local time like 2026-11-05T15:00 (no Z). Date defaults to today in the source zone. Returns {input, utc, source:{...}, converted:[{place, zone, local, time_12h, date, utc_offset, abbreviation, day_note, hours_ahead_of_source}], warning?, summary, open_url}.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Optional date YYYY-MM-DD in the source zone. Default today.",
                "maxLength": 10,
                "type": "string"
              },
              "from": {
                "description": "Source place or zone, e.g. \"New York\" or \"America/New_York\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "time": {
                "description": "Local time in the source place, e.g. \"15:00\", \"3:30pm\", \"noon\", \"now\", \"2026-11-05T15:00\".",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "to": {
                "description": "Destination places, e.g. [\"London\",\"Tokyo\"].",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["from", "time", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert a time between time zones, DST-correct"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://meridian/convert-v1.html",
            "openai/toolInvocation/invoked": "Converted",
            "openai/toolInvocation/invoking": "Converting…",
            "ui": {
              "resourceUri": "ui://meridian/convert-v1.html",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/meridian/result"
          },
          "digest": "sha256:f0be76049a7fd982116c1596b0125e82b02b267fa87fda3eb62054929da638a4"
        },
        {
          "name": "meridian_meeting_slots",
          "title": "Find meeting times that work across time zones",
          "description": "Use when you need to schedule a call across several places. Scans the day in 15-minute steps and ranks start times so the most people are inside working hours and nobody is at night, using each place's real offset and DST for that date. Returns up to 5 slots with each person's local start and end, and says plainly when no time works for everyone. Defaults: working hours 9 to 17, 60 minutes, date today in the first place.",
          "inputSchema": {
            "properties": {
              "count": {
                "description": "How many slots to return, default 5.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "date": {
                "description": "Date YYYY-MM-DD, local to the first place. Default today.",
                "maxLength": 10,
                "type": "string"
              },
              "duration_minutes": {
                "description": "Meeting length in minutes, multiple of 15. Default 60.",
                "maximum": 480,
                "minimum": 15,
                "type": "integer"
              },
              "end_hour": {
                "description": "Working day end hour, default 17.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "places": {
                "description": "Where each attendee is, e.g. [\"San Francisco\",\"London\",\"Tokyo\"].",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 2,
                "type": "array"
              },
              "start_hour": {
                "description": "Working day start hour, default 9.",
                "maximum": 23,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["places"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find meeting times that work across time zones"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://meridian/slots-v1.html",
            "openai/toolInvocation/invoked": "Options ready",
            "openai/toolInvocation/invoking": "Finding times…",
            "ui": {
              "resourceUri": "ui://meridian/slots-v1.html",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/meridian/result"
          },
          "digest": "sha256:20257cd304586c347a8d980ab23234ed23786d29b0cb8617f58a27dad37c41c3"
        },
        {
          "name": "meridian_now",
          "title": "Current time in any places or time zones",
          "description": "Use when the user asks what time or date it is right now somewhere. Reads the server clock and returns the current time, date, UTC offset, abbreviation and daylight saving status for each place. Places can be cities (\"Tokyo\"), IANA zones (\"Europe/Paris\"), abbreviations (\"PST\") or \"UTC+5:30\".",
          "inputSchema": {
            "properties": {
              "places": {
                "description": "Cities, IANA zones or abbreviations, e.g. [\"London\",\"Asia/Tokyo\"].",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["places"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Current time in any places or time zones"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://meridian/now-v1.html",
            "openai/toolInvocation/invoked": "Times ready",
            "openai/toolInvocation/invoking": "Reading clocks…",
            "ui": {
              "resourceUri": "ui://meridian/now-v1.html",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/meridian/result"
          },
          "digest": "sha256:8ddd0f4c402b4cb6004d98766eef5c6a3f777e4d616f68068f698ab7c024ba08"
        },
        {
          "name": "meridian_zone_info",
          "title": "Offset, abbreviation and daylight saving changes for a zone",
          "description": "Use when you need to answer \"what is the UTC offset of X\", \"does X observe daylight saving\" and \"when do the clocks change\". Returns the current offset and abbreviation, whether the place observes DST, every clock change in the year with exact local before and after times, and the next change. Abbreviations like IST or CST are ambiguous, so the answer says which zone was used.",
          "inputSchema": {
            "properties": {
              "place": {
                "description": "City, IANA zone or abbreviation, e.g. \"London\" or \"America/Phoenix\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "year": {
                "description": "Year to list clock changes for. Default this year.",
                "maximum": 2100,
                "minimum": 1970,
                "type": "integer"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Offset, abbreviation and daylight saving changes for a zone"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://meridian/zone-v1.html",
            "openai/toolInvocation/invoked": "Zone ready",
            "openai/toolInvocation/invoking": "Looking up the zone…",
            "ui": {
              "resourceUri": "ui://meridian/zone-v1.html",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/meridian/result"
          },
          "digest": "sha256:3bfb8e89b95e27e57605382466a8defdda2a15b094d8cf85d236280019c54b3b"
        }
