        {
          "name": "get_domain_requirements",
          "description": "Return configured TLD-specific registration eligibility, required fields, and checkout flow choices for a named TLD or domain. Check this result before describing special-TLD requirements; do not assume all .bank, .insurance, .pharmacy, .us, or .aero domains use the same process. A missing configured requirement is not a guarantee of unrestricted eligibility. Ask the customer to choose only when the result has multiple paths; collect sensitive fields in checkout, not chat.",
          "inputSchema": {
            "properties": {
              "default_tld": {
                "type": "string"
              },
              "domains": {
                "anyOf": [
                  {
                    "description": "Space-separated or comma-separated domains.",
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "partner_id": {
                "description": "Optional partner id used to resolve a matching restricted-TLD flow.",
                "type": "string"
              },
              "requirement_use_case": {
                "description": "Restricted-TLD flow id when a TLD has multiple eligibility paths, e.g. preapproved or approval-help.",
                "type": "string"
              },
              "tld": {
                "description": "TLD to inspect, with or without leading dot.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "requirements": {
                "type": "object"
              },
              "success": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
