        {
          "name": "inspect_public_dns",
          "description": "Read current public DNS records for one domain using public resolvers. This is not a domain ownership, website, email delivery, SSL, or account-status check. An unavailable lookup is not evidence that a record is absent. TXT records are returned only when explicitly requested.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "maxLength": 253,
                "minLength": 4,
                "type": "string"
              },
              "record_types": {
                "description": "Optional types to inspect. Defaults to NS, MX, A, AAAA, and CNAME.",
                "items": {
                  "enum": ["NS", "MX", "A", "AAAA", "CNAME", "TXT"],
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkedAt": {
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "lookups": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "maximum": 10,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "status": {
                      "enum": ["found", "no_record", "unavailable"],
                      "type": "string"
                    },
                    "type": {
                      "enum": ["NS", "MX", "A", "AAAA", "CNAME", "TXT"],
                      "type": "string"
                    }
                  },
                  "required": ["count", "status", "type"],
                  "type": "object"
                },
                "maxItems": 6,
                "type": "array"
              },
              "records": {
                "items": {
                  "properties": {
                    "nullMx": {
                      "description": "True for a published RFC 7505 null MX (0 .), which advertises no incoming mail service.",
                      "type": "boolean"
                    },
                    "priority": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "type": {
                      "enum": ["NS", "MX", "A", "AAAA", "CNAME", "TXT"],
                      "type": "string"
                    },
                    "value": {
                      "maxLength": 300,
                      "type": "string"
                    }
                  },
                  "required": ["type", "value"],
                  "type": "object"
                },
                "maxItems": 60,
                "type": "array"
              },
              "source": {
                "const": "public_dns",
                "type": "string"
              },
              "success": {
                "type": "boolean"
              },
              "warning": {
                "type": "string"
              }
            },
            "required": ["checkedAt", "domain", "lookups", "records", "source", "success", "warning"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:9bddb40e9923cae2aa33c04700f602c5041e98568add630eee1be3bc2456d627"
        },
        {
          "name": "inspect_public_registration",
          "description": "Look up a domain in public RDAP using the IANA bootstrap. Returns registrar, registry expiration date, and registration statuses as a checked-time snapshot. This cannot establish the visitor's account ownership, EnCirca billing date, auto-renewal setting, renewal price, or whether a domain is eligible to renew. A 404 is not proof the name is available to buy; use check_domain_price for availability. Unsupported and unavailable lookups are distinct.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "maxLength": 253,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkedAt": {
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "lookupStatus": {
                "enum": ["found", "not_found", "unsupported", "unavailable"],
                "type": "string"
              },
              "registrar": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "ianaId": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "name": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "required": ["ianaId", "name"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "registrationStatus": {
                "items": {
                  "type": "string"
                },
                "maxItems": 16,
                "type": "array"
              },
              "registryExpirationDate": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "source": {
                "const": "public_rdap",
                "type": "string"
              },
              "sourceUrl": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "success": {
                "type": "boolean"
              },
              "warning": {
                "type": "string"
              }
            },
            "required": ["checkedAt", "domain", "lookupStatus", "registrar", "registrationStatus", "registryExpirationDate", "source", "sourceUrl", "success", "warning"],
            "type": "object"
          },
