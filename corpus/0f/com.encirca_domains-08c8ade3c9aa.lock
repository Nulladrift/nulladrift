      "instructions": "Encirca MCP exposes public domain commerce tools without login. Account-management tools require an Auth0 bearer token after the user has completed the existing Encirca login and team-selection flow.",
      "tools": [
        {
          "name": "check_domain_price",
          "description": "Check live partner-specific registration availability and price, or renewal/transfer price and bounded eligibility evidence, for one or more named domains without writing cache rows. Choose order_type by the customer intent: Domain_Order buys a new domain; Domain_Renewal extends a registration; Domain_Transfer means transfer IN to EnCirca, never transfer out. Keep each price, term, status, and warning attached to its domain. A quote or unverified eligibility warning is not approval, payment, or a completed action. Public registry expiration is not a renewal quote.",
          "inputSchema": {
            "properties": {
              "default_tld": {
                "type": "string"
              },
              "domain_years": {
                "additionalProperties": {
                  "maximum": 10,
                  "minimum": 1,
                  "type": "integer"
                },
                "description": "Optional per-domain registration period in years.",
                "type": "object"
              },
              "domains": {
                "anyOf": [
                  {
                    "description": "Space-separated or comma-separated domains.",
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "order_type": {
                "enum": ["Domain_Order", "Domain_Renewal", "Domain_Transfer"],
                "type": "string"
              },
              "partner_id": {
                "description": "Optional registration partner id; defaults to the configured MCP partner. Renewal and transfer always use their configured dedicated partners.",
                "type": "string"
              },
              "requirement_use_case": {
                "description": "Restricted-TLD flow id when a TLD has multiple eligibility paths, e.g. preapproved or approval-help.",
                "type": "string"
              },
              "years": {
                "description": "Registration period in years for all requested domains. Defaults to 1.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "eligibility": {
                "description": "Read-only renewal eligibility evidence, when checked.",
                "type": "object"
              },
              "orderType": {
                "type": "string"
              },
              "partnerId": {
                "type": "string"
              },
              "results": {
                "type": "array"
              },
              "success": {
                "type": "boolean"
              },
              "warning": {
                "description": "Do not present an unverified renewal as approved.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:03b0cd047d465bdf637d75b991aca88137e3495aa7bcb3ba31359246e123fcae"
        },
        {
          "name": "generate_checkout_link",
          "description": "Prepare a checkout URL only for an explicit purchase, renewal, or transfer-IN request. Domain_Order buys a new domain; Domain_Renewal extends a registration; Domain_Transfer moves a domain INTO EnCirca, never out. The response includes domainDetails.results with checked price and term per domain. It does not submit or pay for an order. Renewal and transfer links include bounded eligibility evidence; if unverified or not checked, say checkout must confirm it. Check actual TLD requirements and ask for a route choice only when multiple approval paths apply. Sensitive registrant fields belong in secure checkout. Inbound transfer requires auth code input; use only an authorized secure client flow and never ask the customer to paste the code into chat.",
          "inputSchema": {
            "properties": {
              "auth_code": {
                "description": "Single inbound-transfer auth code for one-domain checkout. Supply only from an authorized secure flow; never ask the customer to disclose it in chat.",
                "type": "string"
              },
              "auth_codes": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Per-domain inbound-transfer auth codes for checkout. Supply only from an authorized secure flow; never ask the customer to disclose them in chat.",
                "type": "object"
              },
              "default_tld": {
                "type": "string"
              },
              "domain_years": {
                "additionalProperties": {
                  "maximum": 10,
                  "minimum": 1,
                  "type": "integer"
                },
                "description": "Optional per-domain registration period in years.",
                "type": "object"
              },
              "domains": {
                "anyOf": [
                  {
                    "description": "Space-separated or comma-separated domains.",
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "order_type": {
                "enum": ["Domain_Order", "Domain_Renewal", "Domain_Transfer"],
                "type": "string"
              },
              "partner_id": {
                "description": "Optional registration partner id; defaults to the configured MCP partner. Renewal and transfer always use their configured dedicated partners.",
                "type": "string"
              },
              "requirement_use_case": {
                "description": "Restricted-TLD flow id when a TLD has multiple eligibility paths, e.g. preapproved or approval-help.",
                "type": "string"
              },
              "skip_availability_check": {
                "default": false,
                "type": "boolean"
              },
              "years": {
                "description": "Registration period in years for all requested domains. Defaults to 1.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checkoutUrl": {
                "type": "string"
              },
              "domainDetails": {
                "properties": {
                  "results": {
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "eligibility": {
                "description": "Read-only renewal or transfer eligibility evidence, when checked.",
                "type": "object"
              },
              "success": {
                "type": "boolean"
              },
              "token": {
                "type": "string"
              },
              "tokenType": {
                "type": "string"
              },
              "warning": {
                "description": "Do not present an unverified renewal or transfer as approved.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
