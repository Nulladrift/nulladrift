      "instructions": "Encirca MCP exposes public domain commerce tools without login. Account-management tools require an Auth0 bearer token after the user has completed the existing Encirca login and team-selection flow.",
      "tools": [
        {
          "name": "check_domain_price",
          "description": "Check live local pricing and availability for one or more domains using partner-specific ESB rules without writing cache rows.",
          "inputSchema": {
            "properties": {
              "default_tld": {
                "type": "string"
              },
              "domain_years": {
                "additionalProperties": {
                  "maximum": 10,
                  "minimum": 1,
                  "type": "integer"
                },
                "description": "Optional per-domain registration period in years.",
                "type": "object"
              },
              "domains": {
                "anyOf": [
                  {
                    "description": "Space-separated or comma-separated domains.",
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "order_type": {
                "enum": ["Domain_Order", "Domain_Renewal", "Domain_Transfer"],
                "type": "string"
              },
              "partner_id": {
                "description": "ESB partner id. Optional if ENCIRCA_MCP_DEFAULT_PARTNER_ID is set.",
                "type": "string"
              },
              "requirement_use_case": {
                "description": "Restricted-TLD flow id when a TLD has multiple eligibility paths, e.g. preapproved or approval-help.",
                "type": "string"
              },
              "years": {
                "description": "Registration period in years for all requested domains. Defaults to 1.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "orderType": {
                "type": "string"
              },
              "partnerId": {
                "type": "string"
              },
              "results": {
                "type": "array"
              },
              "success": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:f9639375e94cb5ee0ce90eac8461c72dc07ad5c92721902fb6823d567bdf6f76"
        },
        {
          "name": "generate_checkout_link",
          "description": "Create a checkout URL for available domains using a raw JWT token. For special TLDs, do not collect field values in chat; tell the customer what checkout will require.",
          "inputSchema": {
            "properties": {
              "auth_code": {
                "description": "Single transfer auth code for one-domain transfer checkouts.",
                "type": "string"
              },
              "auth_codes": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Per-domain auth codes required for Domain_Transfer checkout links.",
                "type": "object"
              },
              "default_tld": {
                "type": "string"
              },
              "domain_years": {
                "additionalProperties": {
                  "maximum": 10,
                  "minimum": 1,
                  "type": "integer"
                },
                "description": "Optional per-domain registration period in years.",
                "type": "object"
              },
              "domains": {
                "anyOf": [
                  {
                    "description": "Space-separated or comma-separated domains.",
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "order_type": {
                "enum": ["Domain_Order", "Domain_Renewal", "Domain_Transfer"],
                "type": "string"
              },
              "partner_id": {
                "description": "ESB partner id. Optional if ENCIRCA_MCP_DEFAULT_PARTNER_ID is set.",
                "type": "string"
              },
              "requirement_use_case": {
                "description": "Restricted-TLD flow id when a TLD has multiple eligibility paths, e.g. preapproved or approval-help.",
                "type": "string"
              },
              "skip_availability_check": {
                "default": false,
                "type": "boolean"
              },
              "years": {
                "description": "Registration period in years for all requested domains. Defaults to 1.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checkoutUrl": {
                "type": "string"
              },
              "success": {
                "type": "boolean"
              },
              "token": {
                "type": "string"
              },
              "tokenType": {
                "type": "string"
              }
