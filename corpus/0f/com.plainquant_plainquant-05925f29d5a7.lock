    "com.plainquant/plainquant": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://plainquant.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "plainquant",
        "title": "PlainQuant",
        "version": "1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PlainQuant reports what US stocks did after past market events and how stocks score at the last close, from its own data. Quote the figures as past results with the page url; they are not a forecast or advice. Call list_events (or read event_study's enum) to pick an event id; index_move_study takes an index move instead; check_stocks takes tickers, HK codes or company names. upcoming_events lists scheduled events ahead; rule_estimates compares each library rule's raw backtest with its honest estimate; market_snapshot sums up the scores as of the last close; company_filings lists a US stock's important SEC filings. Past results, not a forecast or advice.",
      "tools": [
        {
          "name": "check_stocks",
          "title": "Check stocks",
          "description": "Trend and business scores (1-100) for up to 20 US or Hong Kong stocks, the industry ranks behind them, whether each is stretched above its average, and whether the scores have predicted later returns. Accepts tickers (NVDA), HK codes (700) or company names, comma-separated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "symbols": {
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["symbols"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:56e7fc958d2d8d2ec06257e4ccf1196d4f6ab517811b45eb904841202d1c9e21"
        },
        {
          "name": "company_filings",
          "title": "A US company's important SEC filings",
          "description": "A US stock's important SEC filings in the last days (default 30, at most 90): results, 10-Q and 10-K, officer or director changes, major agreements and deals, 5%+ stakes (13D), with links to the filings on SEC EDGAR. Takes a ticker or company name. Hong Kong is not covered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "symbol": {
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b1af7d79203a99ca2c3e891bc010a686bcaa6787c3cfeb6000a752c4b45bef0b"
        },
        {
          "name": "event_study",
          "title": "What the market did after an event",
          "description": "For each past occurrence of the event, the move of the market (market: US = the S&P 500 via SPY, the default for US events; HK = the Hang Seng Index, from its first close after the news; 'measured' in the answer names it) 2 weeks, 4 weeks and 3 months later (fractions: 0.037 = +3.7%), plus median, share up, worst and best beside any window of the same length. With too few occurrences only the list is given. Give symbol (a ticker or company name of the measured market) to measure that one stock's own price, dividends included, instead of the market (QQQ for the Nasdaq-100). Use for questions like 'what happens to stocks after a midterm election / an FOMC meeting', 'what did AAPL do after CPI' or 'what did Hong Kong do after the Fed'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "event_id": {
                "enum": ["global_war_start", "systemic_bank_failure", "us_cpi_release", "us_fomc_decision", "us_government_shutdown", "us_jobs_report", "us_market_down_day_3", "us_market_drop_10", "us_market_drop_20", "us_midterm_election", "us_presidential_election", "us_quad_witching", "us_sovereign_downgrade", "us_tariff_escalation", "who_health_emergency"],
                "type": "string"
              },
              "market": {
                "enum": ["US", "HK"],
                "type": "string"
              },
              "symbol": {
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["event_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c720ba08c702fcbeb5c63f694833ef8fcafa662741712b36ded32f943ca77cc8"
        },
        {
          "name": "index_move_study",
          "title": "What came after an index move",
          "description": "Like event_study, for a move of an index found in our prices: index SPY (S&P 500), QQQ (Nasdaq-100) or HSI (Hang Seng Index) moving pct percent (signed: -10 = a fall of 10% or more) within days trading days (a fall without days = from its high). Use for 'what happens if the Nasdaq drops 10% in two days' or 'what does Hong Kong do after the S&P 500 falls 3% in a day' (market HK).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "maximum": 63,
                "minimum": 1,
                "type": "integer"
              },
              "index": {
                "enum": ["HSI", "QQQ", "SPY"],
                "type": "string"
              },
              "market": {
                "enum": ["US", "HK"],
                "type": "string"
              },
              "pct": {
                "maximum": 50,
                "minimum": -50,
                "type": "number"
              },
              "symbol": {
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["index", "pct"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:91e485f623210ffbc084ece3bd891447eec23f33120b739e949dff5ee07c56c4"
        },
        {
          "name": "list_events",
          "title": "List market events",
          "description": "The events PlainQuant has history for (Fed decisions, CPI, jobs reports, US elections, quarterly options expiry, market drops), with ids, names in English and Chinese, and aliases.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
