          },
          "digest": "sha256:86503e79d4667dc239e7f462da99d1b871f1eb83bce23e9b1709e4b7441dc6ec"
        }
      ],
      "digest": "sha256:721919fd1cbc2983b51b21694fd3d30e23497850728876b2bfdb6164984954bb"
    }
  }
}
