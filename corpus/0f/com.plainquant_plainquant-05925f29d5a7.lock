          },
          "digest": "sha256:9165bb1ff73580d48e5dc223786a17717144b42a37e3bced9dde82d116aad329"
        },
        {
          "name": "upcoming_events",
          "title": "Scheduled market events ahead",
          "description": "Fed decisions, CPI and jobs reports scheduled in the next days (default 30, at most 180), copied from each official calendar, each with the link to what the market did after past ones. Use for 'what market events are coming this week'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
