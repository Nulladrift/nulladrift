            "readOnly": true
          },
          "digest": "sha256:f64ccc30dd6cc88eb9f8ef0bcc0fa37194e6b2d7d95264136d170132d43be95c"
        },
        {
          "name": "rule_estimates",
          "title": "How library stock-picking rules really did",
          "description": "For each of PlainQuant's library stock-picking rules (US and Hong Kong) at default settings: the plain backtest's return a year after trading costs beside the honest estimate left after delisted stocks and untuned test periods (fractions: 0.05 = 5% a year), the trade count and the test window. Use for 'does momentum / value / moving-average investing work' or 'how much do backtests overstate'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
