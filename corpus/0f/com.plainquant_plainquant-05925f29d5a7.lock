          },
          "digest": "sha256:86503e79d4667dc239e7f462da99d1b871f1eb83bce23e9b1709e4b7441dc6ec"
        },
        {
          "name": "market_snapshot",
          "title": "The market at the last close, from PlainQuant's scores",
          "description": "US and Hong Kong large stocks as of each market's last close (the date is as_of): how many have a strong, good, mixed or weak price trend, how many are stretched above their average, and the strongest and weakest groups by median trend. A description of that day, not a forecast. Use for 'how broad is the rally' or 'which sectors are strongest'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
