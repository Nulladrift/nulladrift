{
  "lockfileVersion": 2,
  "subjects": {
    "com.leadmerlin/leadmerlin": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.leadmerlin.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "leadmerlin",
        "title": "LeadMerlin",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LeadMerlin finds local businesses (Google Maps) by niche and city and enriches each one: owner name, checked emails, phone line type, website tech. Typical flow: find_locations -> (optional) suggest_keywords -> start_search with max_leads -> poll get_job every ~5s until status is completed -> get_results. start_search and enrich_domains spend credits (1 per business with a website); always pass max_leads and start a search once. get_usage shows the balance. check_website_tech and find_website_emails are free and work without an API key.",
      "tools": [
        {
          "name": "check_website_tech",
          "title": "Check website tech",
          "description": "Free: detect the CMS, analytics, ad pixels, chat and booking tools a single website runs.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Website URL or domain",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:13d222dbadb3ed8ff5aca7a6d5c5fce06bca414ee0084eea9600d47d11363b6e"
        },
        {
          "name": "enrich_domains",
          "title": "Enrich domains",
          "description": "Enrich up to 100 businesses you already have, by website domain: owner name, checked emails, phone line type, tech. Spends 1 credit per domain (recently enriched domains are free). Returns a job_id.",
          "inputSchema": {
            "properties": {
              "leads": {
                "items": {
                  "properties": {
                    "business_name": {
                      "description": "Optional",
                      "type": "string"
                    },
                    "city": {
                      "description": "Optional",
                      "type": "string"
                    },
                    "domain": {
                      "description": "e.g. acmeplumbing.com",
                      "type": "string"
                    },
                    "state": {
                      "description": "Optional",
                      "type": "string"
                    }
                  },
                  "required": ["domain"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["leads"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a28cc3f98fd335cb8f961dc6c27063c2f58f5e623df8d6600766d9d373c70bbd"
        },
        {
          "name": "find_locations",
          "title": "Find locations",
          "description": "Look up location codes for a city, county, state or country (free). Use the returned location_code in start_search.",
          "inputSchema": {
            "properties": {
              "q": {
                "description": "Place name, e.g. \"Austin\" or \"Austin, Texas\"",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d5f5fdf5b67ec88170bd79a068437f604dfff5c39e252c270c9b0cf900c2b29b"
        },
        {
          "name": "find_website_emails",
          "title": "Find website emails",
          "description": "Free: find the email addresses published on one website (homepage plus up to 4 contact/about/team pages), with the page each was found on, role-based/free-provider flags and an MX check. Limited per day; use start_search or enrich_domains for lists.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Website URL or domain, e.g. acmeplumbing.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:59dc3dbba5395c9e1eb6df919360e7f0ace02fc31b4cd9fb123b8effa78c4300"
        },
        {
          "name": "get_job",
          "title": "Get job status",
          "description": "Status and counts for a search or enrichment job (queued, running, completed, failed, cancelled). Poll every ~5 seconds.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "Job id from start_search or enrich_domains",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d3b59ecac431b1e7cc12c5eaac5cc6dd02bb5741329ad3555e52ab2e3c24dd43"
        },
        {
          "name": "get_results",
          "title": "Get job results",
          "description": "Enriched businesses for a job, paginated. Pass next_cursor from the previous page to continue.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "next_cursor from the previous page",
                "type": "string"
              },
              "job_id": {
                "description": "Job id",
                "type": "string"
              },
              "limit": {
                "description": "Page size (default 50)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fa7ca401fb19f37ec1ecc425d5ec9099434aece5d32497bcfbb5978b6fe97a86"
        },
        {
          "name": "get_usage",
          "title": "Get usage",
          "description": "Current plan, credit balance and phone line-type allowance.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d99cbdc2c4cd2cd805c7b6e8dad8b7fd307a617e5047790400278f79185f8ad8"
        },
        {
          "name": "start_search",
          "title": "Start a lead search",
          "description": "Start an async search for local businesses by keyword in up to 5 locations, then enrich each one. Spends 1 credit per business with a website (website-less and off-niche listings are free). Returns a job_id; poll get_job. Call once per search: every call starts a new paid job.",
          "inputSchema": {
            "properties": {
              "exclude_exported": {
                "description": "Skip businesses this account already exported (not charged).",
                "type": "boolean"
              },
              "keyword": {
                "description": "Business niche, e.g. \"plumber\"",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "location_codes": {
                "description": "Codes from find_locations",
                "items": {
                  "type": "integer"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "max_leads": {
                "description": "Cap on businesses charged and enriched. Strongly recommended.",
                "minimum": 1,
                "type": "integer"
              },
              "phone_line_type": {
                "description": "Look up mobile/landline/VoIP for each main phone (default true, monthly plan allowance).",
                "type": "boolean"
              },
              "strictness": {
                "description": "Niche filter. moderate (default) drops keyword coincidences; strict also drops adjacent trades.",
                "enum": ["off", "moderate", "strict"],
                "type": "string"
              }
            },
            "required": ["keyword", "location_codes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e3cb0dd673666bb01ebe7975cd5831612e0bc548d558ab10447fe022de0aff42"
        },
        {
          "name": "suggest_keywords",
          "title": "Suggest keywords",
          "description": "Turn a niche into matching Google business categories and sharper search keywords (free). Helps avoid off-niche results.",
          "inputSchema": {
            "properties": {
              "niche": {
                "description": "Niche, e.g. \"basement waterproofing\"",
                "type": "string"
              }
            },
            "required": ["niche"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9c497d7a2037f58be78e4894fe95acdc9dea03a4461ecca37a870ace6032d733"
        }
      ],
      "digest": "sha256:6305c4f52684f0183527bc7af5ba850cd3c57fd667b83a52d4c39f285d1178f9"
    }
  }
}
