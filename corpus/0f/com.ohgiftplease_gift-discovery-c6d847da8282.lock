          "title": "Find gift guides",
          "description": "Find the most relevant OhGiftPlease editorial gift guide for a gifting problem or topic.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "topic": {
                "description": "Gift topic or problem, such as hard to shop for, cooking, games, self-care, weird gifts, or under $25.",
