        },
        {
          "name": "find_gifts",
          "title": "Find gifts",
          "description": "Find relevant OhGiftPlease gift ideas for a recipient, interest, vibe, occasion, or budget.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "budgetMax": {
                "description": "Maximum preferred budget in US dollars.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "interests": {
                "description": "Interests, hobbies, personality traits, or things they like.",
                "type": "string"
              },
              "occasion": {
                "description": "Occasion, such as birthday, date night, thank-you, or just because.",
                "type": "string"
              },
              "recipient": {
                "description": "Who the gift is for, such as friend, partner, coworker, parent, or self.",
                "minLength": 1,
                "type": "string"
              },
              "vibe": {
                "description": "Desired feel, such as thoughtful, funny, weird, practical, cozy, or self-care.",
                "type": "string"
              }
            },
            "required": ["recipient"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
