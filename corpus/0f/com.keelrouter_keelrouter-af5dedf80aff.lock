  "subjects": {
    "com.keelrouter/keelrouter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.keelrouter.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "keelrouter",
        "title": "KeelRouter",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "KeelRouter runs image and video models (Seedream, GPT Image, Nano Banana, Kling, Seedance and others) from one prepaid USD balance. Call list_models to pick a model and see its price and params, tell the user the cost, then generate_image (waits up to 50 s) or generate_video (returns task_id) and get_result. Failed calls are not charged.",
      "tools": [
        {
          "name": "generate_image",
          "title": "Generate an image",
          "description": "Generate an image with a KeelRouter model. Spends real USD from the account balance at the price in list_models (from under $0.01 per image; higher resolutions cost more); failed calls are not charged. Waits up to 50 seconds; if not done, returns task_id for get_result. Result links are valid for a limited time.",
          "inputSchema": {
            "properties": {
              "idempotency_key": {
                "description": "Reuse the same key when retrying so the task is not created or charged twice.",
                "pattern": "^[A-Za-z0-9_\\-:.]{1,100}$",
                "type": "string"
              },
              "model": {
                "description": "Model id from list_models.",
                "maxLength": 120,
                "type": "string"
              },
              "params": {
                "additionalProperties": {},
                "description": "Other request fields for this model, as listed in list_models params (e.g. aspect_ratio, resolution, image_urls, duration).",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "prompt": {
                "maxLength": 10000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["model", "prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fafe4f3b86427f426249edb203dbecb867910e9677c5af10aa61d54feed84ec9"
        },
        {
          "name": "generate_video",
          "title": "Start a video",
          "description": "Start a video with a KeelRouter model and return task_id right away; videos take one to several minutes. Spends real USD from the account balance at the price in list_models (usually per second; check before choosing duration and resolution); failed calls are not charged. Then call get_result.",
          "inputSchema": {
            "properties": {
              "idempotency_key": {
                "description": "Reuse the same key when retrying so the task is not created or charged twice.",
                "pattern": "^[A-Za-z0-9_\\-:.]{1,100}$",
                "type": "string"
              },
              "model": {
                "description": "Model id from list_models.",
                "maxLength": 120,
                "type": "string"
              },
              "params": {
                "additionalProperties": {},
                "description": "Other request fields for this model, as listed in list_models params (e.g. aspect_ratio, resolution, image_urls, duration).",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "prompt": {
                "maxLength": 10000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["model", "prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c6a7e3dba6a7cab851af466796bd9e6b2ac5fa8b1561fff6eed74d2e24ad8897"
        },
