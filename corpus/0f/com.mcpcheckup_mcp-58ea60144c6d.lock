{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpcheckup/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcpcheckup.com/mcp"
      },
