      "instructions": "Opus Motion makes launch and promo videos from templates. This server covers the whole job for an agent: find a template, fill or edit it, see what you made, and hand the person a link where the video plays live and they export it.\n\nTwo kinds of template, both designed by us; an agent puts the person's brand on them. Catalog templates (search_templates) take fields: texts, images, colors, clips. Make a draft with create_draft and change it with update_draft. Pro templates (list_pro_templates) let you change every text, image and color, and hide a layer. Make a draft with create_pro_draft and change it with edit_pro_draft. The layout, timing and motion stay as designed; the person can change them in the editor.\n\nWhen the person gives you a studio session code (OM-XXXX-XXXX), they have that template open in the studio: join_studio_session first, then work on that draft with update_draft. They watch each change arrive; no new draft, no link.\n\nLook before you hand it over. look_at_draft and look_at_pro_draft return stills or a contact sheet as images, with a layout check. Fix what you see and look again.\n\nExporting the MP4 is the person's step, in their own account, from the link you give them; a premium template or a Pro draft is paid there (or covered by their Opus Motion Pass), so tell them the price the draft's answer gives. Keep the editToken: it is shown once, and every change and look needs it.\n\nGuides: opusmotion://guide/agents (catalog drafts from inside a project), opusmotion://guide/pro (every Pro operation), opusmotion://guide/mcp (this server).\n\nOpus Motion: Promo and launch video templates designed by Claude Opus 5.5. Paste a website and every template comes out in that brand, with its logo, colors and words; change anything in a live studio and export a full HD MP4 in 16:9 or 9:16. Free templates export at no cost; premium ones cost a few dollars per export.\n\nUse it when: Someone needs a short launch, product or promo video for their own brand, app, tool or website, and has no agency, editor or motion designer. Someone wants a branded video for X, LinkedIn, Instagram, TikTok or YouTube, in 16:9 or vertical 9:16, from their website alone. Someone is comparing promo video templates by style, length, format or price.\n\nHow to help: Working inside the person's project (Claude Code, Codex, any coding agent)? Follow /agents.md: you compare templates by their timelapse, write the texts and pick the images from the repo, `POST /api/v1/drafts` answers a studio link, and the person opens it with the video playing live. `PATCH /api/v1/drafts/{id}` with its `editToken` changes the same draft, and a real clip from the repo goes to a video field with `PUT /api/v1/drafts/{id}/media/{field}`. Find a template: `GET /api/v1/templates` (filter by `q`, `category`, `tier`, `format`) or the MCP tool `search_templates`. Hand the person a studio link for their website: `GET /api/v1/studio-link?template=<id>&site=<their domain>` or the MCP tool `studio_link`. The studio reads the site and fills the template with their logo, colors and copy. The person reviews it, changes anything, and exports it themselves. Exporting needs their own account, and payment for premium templates: an agent cannot export or pay on their behalf.",
      "tools": [
        {
          "name": "create_draft",
          "title": "Make a draft video",
          "description": "Make a draft of a catalog template with the person's texts, images, colors and safe size adjustments. Returns a studioUrl the person opens to see the video playing live, an editToken to change it later (update_draft) and to look at it (look_at_draft), what is missing and the price to tell them. Nothing is rendered; the person exports it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "The brand: name, colors (1 to 4 hex) and logo or icon (base64 data URLs, 1 MB each).",
                "type": "object"
              },
              "format": {
                "description": "The format the draft opens in.",
                "type": "string"
              },
              "site": {
                "description": "The person's website domain, for example example.com: texts you leave out are filled from it when it was read before.",
                "type": "string"
              },
              "template": {
                "description": "The template's id or slug (from search_templates).",
                "type": "string"
              },
              "tweaks": {
                "description": "Safe adjustments the template declares, for example { \"logoScale\": 1.3 }.",
                "type": "object"
              },
              "values": {
                "description": "Field id → value: texts, choices, colors, and small images as base64 data URLs. get_template lists the fields. Image files and clips go with media_upload_command.",
                "type": "object"
              }
            },
            "required": ["template"],
            "type": "object"
          },
