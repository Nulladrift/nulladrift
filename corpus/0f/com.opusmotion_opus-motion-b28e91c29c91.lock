        {
          "name": "create_pro_draft",
          "title": "Make a Pro draft",
          "description": "Make a draft of a Pro template with the brand's texts, images and colors: set (a layer's text, its image src and fit, its colors, or hidden), recolor (one palette color to another everywhere) and video (its background). The layout, timing and motion stay the template's: an operation that changes them is refused, and the person can change them in the editor. All are checked together: one that fails applies nothing and the answer lists every issue. Returns draftId, editToken (shown once), editorUrl (opens the Pro editor, where the person watches it, can change anything and exports it), warnings and export (its price, to tell the person).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ops": {
                "description": "Operations, for example [{\"op\":\"set\",\"layer\":\"title\",\"text\":\"Plan less.\\nShip more.\"},{\"op\":\"recolor\",\"from\":\"#FE7B02\",\"to\":\"#5E6AD2\"}]. The guide (resource opusmotion://guide/pro) says how to make it good.",
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "format": {
                          "description": "\"all\" (default) or one format id.",
                          "type": "string"
                        },
                        "hidden": {
                          "description": "true hides the layer (a part the brand doesn't need).",
                          "type": "boolean"
                        },
                        "layer": {
                          "description": "A layer id (get_pro_template lists them, with what each is for).",
                          "type": "string"
                        },
                        "op": {
                          "enum": ["set"],
                          "type": "string"
                        },
                        "props": {
                          "additionalProperties": false,
                          "properties": {
                            "background": {
                              "description": "#RRGGBB",
                              "type": "string"
                            },
                            "color": {
                              "description": "#RRGGBB",
                              "type": "string"
                            },
                            "fill": {
                              "description": "#RRGGBB",
                              "type": "string"
                            },
                            "fit": {
                              "enum": ["cover", "contain"],
                              "type": "string"
                            },
                            "src": {
                              "description": "An image layer: the template's own asset or an upload_pro_image src.",
                              "type": "string"
                            },
                            "stroke": {
                              "description": "#RRGGBB",
                              "type": "string"
                            },
                            "text": {
                              "type": "string"
                            }
                          },
                          "type": "object"
                        },
                        "text": {
                          "description": "A text layer's words.",
                          "type": "string"
                        }
                      },
                      "required": ["layer", "op"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "from": {
                          "description": "#RRGGBB",
                          "type": "string"
                        },
                        "op": {
                          "enum": ["recolor"],
                          "type": "string"
                        },
                        "to": {
                          "description": "#RRGGBB",
                          "type": "string"
                        }
                      },
                      "required": ["from", "op", "to"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "background": {
                          "description": "#RRGGBB",
                          "type": "string"
                        },
                        "op": {
                          "enum": ["video"],
                          "type": "string"
                        }
                      },
                      "required": ["background", "op"],
                      "type": "object"
                    }
                  ],
                  "description": "set (a layer's text, props.text/src/fit/color/fill/stroke/background, or hidden), recolor (from one color to another everywhere), or video (its background). Where things sit, when they show and how they move are the template's."
                },
                "type": "array"
              },
              "template": {
                "description": "The Pro template's id.",
                "type": "string"
              }
            },
            "required": ["template"],
            "type": "object"
          },
