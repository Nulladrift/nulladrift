      "serverInfo": {
        "name": "clearbar-verdicts",
        "title": "Clearbar verdicts",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Answers one question: which is the cheapest LLM that still passes for a task? Start with cheapest_model: one call, no arguments, returns the cheapest passing model for every task family with its cost per successful task, how much it saves against the baseline and the page that proves it ({\"task\":\"spam detection\"} narrows it to one). Then call get_verdict with the task in plain words, for example {\"task\":\"spam detection\"}, {\"task\":\"sentiment\"} or {\"task\":\"json extraction\"} (a slug works too): you get the cheapest passing model, its cost per successful task in US dollars with retries and failures counted, the baseline it beats, every candidate, and the page and run file to check it. list_verdicts shows all published verdicts first. Figures are measured on public datasets; the dated price snapshot is in every answer. To get the same verdict on your own examples, open the app_url in the answer.",
      "tools": [
        {
          "name": "cheapest_model",
          "title": "Cheapest model that still passes, per task, in one call",
          "description": "One call, the headline answer: which is the cheapest LLM that still passes? With no arguments you get every task family (classification, extraction, tool-call) with its cheapest passing model, cost per successful task in US dollars (retries and failures counted), how much cheaper it is than the baseline, and the verdict page that proves it. Pass {\"task\":\"spam detection\"} (plain words, or a family such as classification) for just that answer. Next call: get_verdict with the slug for the full candidate table, failures and the re-run script.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task": {
                "description": "Optional. The task in plain words (spam detection, sentiment, json extraction, tool calling) or a family: classification, extraction, tool-call.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answers": {
                "items": {
                  "properties": {
                    "answer": {
                      "description": "One-sentence verdict in plain words, with the price date.",
                      "type": "string"
                    },
                    "baseline_model": {
                      "type": ["string", "null"]
                    },
                    "cheapest_passing_model": {
                      "description": "The cheapest model that clears the bar; null when none does.",
                      "type": ["string", "null"]
                    },
                    "cost_per_successful_task_usd": {
                      "description": "US dollars per successful task, retries and failures counted.",
                      "type": ["number", "null"]
                    },
                    "pass_bar": {
                      "description": "Pass-rate threshold the cheapest model has to clear (0 to 1).",
                      "type": "number"
                    },
                    "pass_rate": {
                      "type": ["number", "null"]
                    },
                    "saving_pct": {
                      "description": "Share cheaper than the baseline (0 to 1); 0 or null when the baseline is already cheapest.",
                      "type": ["number", "null"]
                    },
                    "slug": {
                      "description": "Verdict slug, the key for get_verdict.",
                      "type": "string"
                    },
                    "task": {
                      "description": "Task type, for example classification.",
                      "type": "string"
                    },
                    "task_family": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "verdict_url": {
                      "description": "The verdict page, with the evidence.",
                      "type": "string"
                    }
                  },
                  "required": ["answer", "baseline_model", "cheapest_passing_model", "cost_per_successful_task_usd", "pass_bar", "slug", "task", "task_family", "title", "verdict_url"],
                  "type": "object"
                },
                "type": "array"
              },
              "app_note": {
                "type": "string"
              },
              "app_url": {
                "description": "Where to run the same verdict on your own examples.",
                "type": "string"
              },
              "count": {
                "description": "Number of answers returned.",
                "type": "integer"
              },
              "headline": {
                "description": "The overview in one or two sentences.",
                "type": "string"
              },
              "next_call": {
                "description": "The call to make next for the full table of one verdict.",
                "type": "string"
              },
              "prices_as_of": {
                "description": "Date (YYYY-MM-DD) of the newest price snapshot behind the figures.",
                "type": ["string", "null"]
              }
            },
            "required": ["answers", "app_note", "app_url", "count", "headline", "next_call", "prices_as_of"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.grain64/example": {}
          },
          "digest": "sha256:9ee183994e938084ba528dcd566e319ba684cca41c5e691e42283eee62548800"
        },
        {
          "name": "get_verdict",
          "title": "Get one verdict: cheapest passing model, cost, failures",
          "description": "Answers: which is the cheapest LLM that still passes for <task>? Give the task in plain words (for example \"spam detection\", \"sentiment\", \"json extraction\", \"tool calling\", \"intent classification\") or a verdict slug, and get the cheapest model that clears the bar, its pass rate and cost per successful task in US dollars, the baseline it is compared with, every candidate's status, plus links to the verdict page, the run file (JSON) and the script that re-runs it. Example: {\"task\":\"spam detection\"} returns the sms-spam verdict. Not sure what exists? Call list_verdicts first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Or the exact verdict slug from list_verdicts, for example sms-spam.",
                "minLength": 1,
                "type": "string"
              },
              "task": {
                "description": "The task in plain words, for example spam detection, sentiment, json extraction. The closest published verdict answers.",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer": {
                "description": "One-sentence verdict in plain words, with the price date.",
                "type": "string"
              },
              "app_note": {
                "type": "string"
              },
              "app_url": {
                "type": "string"
              },
              "baseline_cost_per_successful_task_usd": {
                "type": ["number", "null"]
              },
              "baseline_model": {
                "type": ["string", "null"]
              },
              "baseline_pass_rate": {
                "type": ["number", "null"]
              },
              "candidates": {
                "items": {
                  "properties": {
                    "attempts_per_task": {
                      "type": ["number", "null"]
                    },
                    "cost_per_successful_task_usd": {
                      "type": ["number", "null"]
                    },
                    "latency_p50_ms": {
                      "type": ["number", "null"]
                    },
                    "latency_p95_ms": {
                      "type": ["number", "null"]
                    },
                    "model": {
                      "type": "string"
                    },
                    "pass_rate": {
                      "type": ["number", "null"]
                    },
                    "status": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["model"],
                  "type": "object"
                },
                "type": "array"
              },
              "cheapest_passing_model": {
                "description": "The cheapest model that clears the bar; null when none does.",
                "type": ["string", "null"]
              },
              "cost_per_successful_task_usd": {
                "description": "US dollars per successful task, retries and failures counted.",
                "type": ["number", "null"]
              },
              "dataset": {
                "description": "Public dataset behind the run: name, rows, source, licence.",
                "type": "object"
              },
              "matched_by": {
                "description": "How the verdict was chosen: the exact slug, or the closest published verdict to the task you described.",
                "type": "string"
              },
              "pass_bar": {
                "description": "Pass-rate threshold the cheapest model has to clear (0 to 1).",
                "type": "number"
              },
              "pass_rate": {
                "type": ["number", "null"]
              },
              "price_snapshot_at": {
                "type": ["string", "null"]
              },
              "ran_at": {
                "type": ["string", "null"]
              },
              "rerun_script_url": {
                "description": "Script that re-runs the verdict; null when none is published.",
                "type": ["string", "null"]
              },
              "run_file_url": {
                "description": "The run file (JSON) to check the figures.",
                "type": "string"
              },
              "saving_pct": {
                "type": ["number", "null"]
              },
              "slug": {
                "description": "Verdict slug, the key for get_verdict.",
                "type": "string"
              },
              "task": {
                "description": "Task type, for example classification.",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "verdict_kind": {
                "description": "switch (a cheaper model passes) or keep (the baseline is already cheapest).",
                "type": "string"
              },
              "verdict_url": {
                "description": "The verdict page, with the evidence.",
                "type": "string"
              }
            },
            "required": ["answer", "app_url", "baseline_model", "candidates", "cheapest_passing_model", "cost_per_successful_task_usd", "pass_bar", "run_file_url", "slug", "task", "title", "verdict_kind", "verdict_url"],
            "type": "object"
