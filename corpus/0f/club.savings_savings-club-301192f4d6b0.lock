      "serverInfo": {
        "name": "savings-club",
        "title": "Savings Club",
        "version": "0.4.0",
        "description": "Ask how Savings Club works, estimate a membership, compare financing, see vehicle costs by state, and verify a Savings Club certificate.",
        "websiteUrl": "https://savings.club"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
