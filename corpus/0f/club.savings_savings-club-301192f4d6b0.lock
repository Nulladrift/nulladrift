                "title": "Compare To",
                "type": "string"
              },
              "credit_tier": {
                "default": "not_sure",
                "description": "For average_bank_loan: the person's credit tier. not_sure shows every tier.",
                "enum": ["super_prime", "prime", "near_prime", "subprime", "deep_subprime", "not_sure"],
                "title": "Credit Tier",
                "type": "string"
              },
