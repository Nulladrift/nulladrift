{
  "lockfileVersion": 2,
  "subjects": {
    "com.inboxesim/esim": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://inboxesim.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "inbox-esim",
        "title": "Inbox eSIM",
        "version": "1.1.0",
        "websiteUrl": "https://inboxesim.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Inbox eSIM sells prepaid, data-only travel eSIMs for 200+ countries and regions. Prices are in USD. Use find_esim_plans with the place the customer travels to, pick a plan with them, then buy_esim with the plan_id and the customer's email. buy_esim returns a payment link: POST to it, answer the HTTP 402 Machine Payments Protocol challenge with a Stripe shared payment token, and retry. The QR code and a one-tap install link are emailed to the customer within about a minute. No app and no account. For a trip to several countries, make_esim_cart turns several plan_ids into one link where the customer pays for all of them at once (2 eSIMs: 3% off; 3 or more: 5% off). Before buying, check_esim_device tells whether the customer's phone is likely to take an eSIM; after buying, get_order_status shows where the order is. To compare brands for one country, compare_esim_prices lists every brand we read, cheapest first, with dated prices and ours marked.",
      "tools": [
        {
          "name": "buy_esim",
          "title": "Buy a travel eSIM",
          "description": "Starts the purchase of one eSIM plan for the customer and returns a payment link. Pay it with the Machine Payments Protocol (HTTP 402, Stripe shared payment token) to complete the order. Before calling, confirm the plan, the price and the email with the customer, and get their agreement to the terms: By buying, the customer asks for the eSIM to be sent at once and accepts the terms (https://inboxesim.com/terms): the 14-day right to withdraw ends once the eSIM is installed. An eSIM that was never installed or used can be refunded within 30 days from its order page, less the payment fee (no card fee within 14 days in the EU and UK).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "customer_agreed_to_terms": {
                "description": "true only if the customer accepted the terms quoted in this tool's description.",
                "type": "boolean"
              },
              "customer_email": {
                "description": "Where the QR code and install link are sent.",
                "type": "string"
              },
              "plan_id": {
                "description": "A plan_id from find_esim_plans, e.g. 'japan-5gb-30d'.",
                "type": "string"
              }
            },
            "required": ["customer_agreed_to_terms", "customer_email", "plan_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amount_usd": {
                "type": "string"
              },
              "browser_fallback": {
                "type": "string"
              },
              "how_to_pay": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "page_url": {
                "type": "string"
              },
              "payment_link": {
                "description": "POST here and answer the HTTP 402 challenge.",
                "type": "string"
              },
              "plan": {
                "properties": {
                  "countries": {
                    "description": "Regional and global plans: how many countries they cover.",
                    "type": "integer"
                  },
                  "data_gb": {
                    "type": "number"
                  },
                  "details": {
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["country", "regional", "global"],
                    "type": "string"
                  },
                  "page_url": {
                    "type": "string"
                  },
                  "place": {
                    "type": "string"
                  },
                  "plan_id": {
                    "type": "string"
                  },
                  "price_usd": {
                    "description": "Final price in USD, e.g. \"5.90\".",
                    "type": "string"
                  },
                  "valid_days": {
                    "type": "integer"
                  }
                },
                "required": ["data_gb", "details", "kind", "page_url", "place", "plan_id", "price_usd", "valid_days"],
                "type": "object"
              },
              "status": {
                "enum": ["payment_required", "buy_on_page"],
                "type": "string"
              }
            },
            "required": ["plan", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c84fc7e43f12e42839415ebc8d16da30eb9b6a6329bd7170baea70548752e75"
        },
        {
          "name": "check_esim_device",
          "title": "Check a phone for eSIM",
          "description": "Says whether a phone model is likely to take an eSIM (likely, unlikely or check), from the model name, with how to be sure on the phone itself. Call it before buy_esim when the customer is unsure.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "device": {
                "description": "The phone or tablet model, e.g. 'iPhone 13', 'Galaxy S23', 'Pixel 7a'.",
                "type": "string"
              }
            },
            "required": ["device"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "device": {
                "type": "string"
              },
              "how_to_check": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "verdict": {
                "enum": ["likely", "unlikely", "check"],
                "type": "string"
              }
            },
            "required": ["device", "how_to_check", "reason", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c2a860545ab37c615a2910e3bb4c03278ee6b2da5178634b807915eb8a32e436"
        },
        {
          "name": "compare_esim_prices",
          "title": "Compare eSIM prices across brands",
          "description": "Compares travel eSIM prices for one country across every brand Inbox eSIM reads (about 50), cheapest first, for a size and a trip length. Read only. Each brand's cheapest plan that covers the request, with its price, the date that price was read, whether it needs an app or account, and its page. Inbox eSIM runs the comparison and also sells eSIMs: its row is marked is_ours and keeps its real position, because the order is by price only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "data_gb": {
                "description": "Optional: at least this much data. Default 5.",
                "type": "number"
              },
              "destination": {
                "description": "One country, e.g. 'Japan', 'USA', 'Bangkok'.",
                "type": "string"
              },
              "min_days": {
                "description": "Optional: valid for at least this many days. Default 30 (7 for unlimited).",
                "type": "integer"
              },
              "unlimited": {
                "description": "Optional: unlimited or daily plans instead of a data size.",
                "type": "boolean"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asked": {
                "type": "object"
              },
              "brands_read": {
                "type": "integer"
              },
              "brands_with_a_match": {
                "type": "integer"
              },
              "comparison_page": {
                "type": "string"
              },
              "destination": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "plans": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["comparison_page", "destination", "note", "plans"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d141a74872ca6393553b2f09c478fa61b400874412fab2b6fb59f0715540bd1"
        },
        {
          "name": "find_esim_plans",
          "title": "Find travel eSIM plans",
          "description": "Lists Inbox eSIM data plans for a destination (country, city, region such as Europe, or 'global'), cheapest first, with plan_id, data in GB, validity in days and price in USD. Data only, no phone number; works on unlocked eSIM phones.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Where the customer travels, e.g. 'Japan', 'USA', 'Europe', 'Bangkok'.",
                "type": "string"
              },
              "min_data_gb": {
                "description": "Optional: only plans with at least this much data.",
                "type": "number"
              },
              "min_days": {
                "description": "Optional: only plans valid for at least this many days (the trip length).",
                "type": "integer"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "type": "string"
              },
              "plans": {
                "items": {
                  "properties": {
                    "countries": {
                      "description": "Regional and global plans: how many countries they cover.",
                      "type": "integer"
                    },
                    "data_gb": {
                      "type": "number"
                    },
                    "details": {
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["country", "regional", "global"],
                      "type": "string"
                    },
                    "page_url": {
                      "type": "string"
                    },
                    "place": {
                      "type": "string"
                    },
                    "plan_id": {
                      "type": "string"
                    },
                    "price_usd": {
                      "description": "Final price in USD, e.g. \"5.90\".",
                      "type": "string"
                    },
                    "valid_days": {
                      "type": "integer"
                    }
                  },
                  "required": ["data_gb", "details", "kind", "page_url", "place", "plan_id", "price_usd", "valid_days"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["plans"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:992748d804917795ab30296a7e926645600b1f6280656f49889d85929f54355a"
        },
        {
          "name": "get_order_status",
          "title": "Get an eSIM order's status",
          "description": "Where an Inbox eSIM order is (awaiting_payment, preparing, ready_to_install, installed, in_use, ended, refunded, cancelled, with_support), with data used, the end date and the order page. Needs the order number and the email it was bought with.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "customer_email": {
                "description": "The email the order was bought with.",
                "type": "string"
              },
              "order_id": {
                "description": "The order number, e.g. 'ISJPAH2PXG2C' (in the paid response and the email).",
                "type": "string"
              }
            },
            "required": ["customer_email", "order_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data_total_gb": {
                "type": "number"
              },
              "data_used_gb": {
                "type": "number"
              },
              "note": {
                "type": "string"
              },
              "order_id": {
                "type": "string"
              },
              "order_url": {
                "type": "string"
              },
              "place": {
                "type": "string"
              },
              "plan": {
                "type": "string"
              },
              "status": {
                "enum": ["awaiting_payment", "preparing", "ready_to_install", "installed", "in_use", "ended", "refunded", "cancelled", "with_support"],
                "type": "string"
              },
              "top_up_of": {
                "type": "string"
              },
              "valid_until": {
                "type": "string"
              }
            },
            "required": ["order_id", "order_url", "place", "plan", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c65c557ce2c09988396d72cd07d4b3a55ad3a18b808e428ac65e214b1aafa44"
        },
        {
          "name": "make_esim_cart",
          "title": "One payment for several eSIMs",
          "description": "For a trip to several countries (or several phones): turns 2 to 6 plan_ids from find_esim_plans into one cart link. The customer opens it, checks the eSIMs and pays once on Stripe; each eSIM comes in its own QR email and can be refunded on its own if never installed. 3 or more eSIMs in one cart are 5% off. Nothing is bought until the customer pays on the page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plan_ids": {
                "description": "plan_ids from find_esim_plans, one per eSIM, e.g. ['japan-5gb-30d', 'south-korea-3gb-30d'].",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["plan_ids"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cart_url": {
                "description": "Give this link to the customer: they pay for every eSIM in it at once.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "plans": {
                "items": {
                  "properties": {
                    "countries": {
                      "description": "Regional and global plans: how many countries they cover.",
                      "type": "integer"
                    },
                    "data_gb": {
                      "type": "number"
                    },
                    "details": {
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["country", "regional", "global"],
                      "type": "string"
                    },
                    "page_url": {
                      "type": "string"
                    },
                    "place": {
                      "type": "string"
                    },
                    "plan_id": {
                      "type": "string"
                    },
                    "price_usd": {
                      "description": "Final price in USD, e.g. \"5.90\".",
                      "type": "string"
                    },
                    "valid_days": {
                      "type": "integer"
                    }
                  },
                  "required": ["data_gb", "details", "kind", "page_url", "place", "plan_id", "price_usd", "valid_days"],
                  "type": "object"
                },
                "type": "array"
              },
              "total_usd": {
                "description": "What the cart page charges, with the cart discount (2 eSIMs 3% off, 3+ eSIMs 5% off) on most plans. A partner code may lower it on the page.",
                "type": "string"
              }
            },
            "required": ["cart_url", "plans", "total_usd"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d6e52dd2e8823e1f11c66654ee8a6a33d279d087a77a0b88c912f881ab1de3f"
        }
      ],
      "digest": "sha256:c3977b3c0eb5e1f813d41717a38e2c9fe06ae16729eacbf7494f7de461de08e3"
    }
  }
