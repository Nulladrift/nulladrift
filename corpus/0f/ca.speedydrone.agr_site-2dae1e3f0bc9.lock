        },
        {
          "name": "search_site",
          "title": "Search the site",
          "description": "Search SpeedyDrone's agricultural drone spraying, spreading and crop mapping in Canada library: Choosing a spray drone: Agras T50 vs T100, Drone spraying regulations, licences and SFOCs in Canada, Cover-crop, pasture and granular fertilizer spreading, Multispectral crop scouting and mapping with Mavic 3M, Drone spraying job costs and buy-vs-hire break-even, Research and government drone purchasing, Starting a drone spraying business and pilot training, Orchard, vineyard, potato and greenhouse applications. Articles, guides and FAQs written for Canadian growers, custom applicators, and research and government buyers choosing or running agricultural drones, and the free calculators. Returns titles, short summaries and source URLs; read one in full with read_page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 8,
                "description": "How many results (default 8)",
                "maximum": 20,
                "minimum": 1,
