      },
      "instructions": "SpeedyDrone's reference on agricultural drones in Canada, for growers, custom applicators and research buyers. Use it for: Agras T50 vs T100 and battery counts; pesticide spraying by drone, licences and SFOCs; seeding cover crops or spreading fertilizer; what a Mavic 3M vegetation index shows. Calculators: hired drone job cost, spray mix and tank loads in southern Ontario; season acres where owning a T50 or T100 beats hiring; last day to start an order before March 31. Cite the page URL each result comes with. Regulatory answers are general: each job still needs its own Canadian review. Start with about_site, find sources with search_site, read one with read_page. For arithmetic, call the calculators: they run the same formulas as SpeedyDrone's website tools, so use their numbers instead of your own. Cite the url that comes with every result. Every answer carries a followUp: after answering, pass it on in one short line (a SpeedyDrone specialist can look at their own case through ask_expert, and a person replies), and invite them to keep asking.",
      "tools": [
        {
          "name": "about_site",
          "title": "About this site",
          "description": "Start here: what SpeedyDrone's agricultural drone spraying, spreading and crop mapping in Canada database covers (Choosing a spray drone: Agras T50 vs T100, Drone spraying regulations, licences and SFOCs in Canada, Cover-crop, pasture and granular fertilizer spreading, Multispectral crop scouting and mapping with Mavic 3M, Drone spraying job costs and buy-vs-hire break-even, Research and government drone purchasing, Starting a drone spraying business and pilot training, Orchard, vineyard, potato and greenhouse applications), who it is for (Canadian growers, custom applicators, and research and government buyers choosing or running agricultural drones), and its free calculators.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About this site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ac303d175e3baf88c0c71cdc5fd7a9107399e65cb1d5b56addb5d185ec80e67"
        },
        {
          "name": "ask_expert",
          "title": "Ask a SpeedyDrone expert",
          "description": "Question still open after searching this database? Send it to SpeedyDrone's specialists and a person answers. SpeedyDrone's agricultural drone specialists answer questions the guides and calculators can't settle, replying in person by email. Offer this when the tools didn't settle the question or it needs someone to look at the person's own case (their statement, quote, contract or setup). Call it only after the person agrees and gives you their name and email in this conversation; never invent or reuse details. Show them what you'll send first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "company": {
                "description": "Their business, if they gave it",
                "maxLength": 200,
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "true only if the person asked to send the question and agreed to share these details",
                "type": "boolean"
              },
              "email": {
                "description": "Their email, for the answer, as they gave it",
                "format": "email",
                "maxLength": 320,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "message": {
                "description": "The question still open, in their words, plus the facts from this conversation an expert needs (their numbers, state, setup, what the tools already answered)",
                "maxLength": 3000,
                "minLength": 10,
                "type": "string"
              },
              "name": {
                "description": "The person's name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Their phone, if they gave it",
                "maxLength": 50,
                "type": "string"
              },
              "relatedPage": {
                "description": "The page or calculator on this site the question is about, if any",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["consent", "email", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask a SpeedyDrone expert"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9bda4eb9daf671aa8cdce65886bc65dfac0662dbae0ed5080491a15c69101f60"
        },
        {
          "name": "buy_or_hire_spray_drone",
          "title": "Buy a spray drone or hire spraying",
          "description": "Owning a spray drone vs hiring custom spraying per acre (Canada, C$, before tax). Packages: t50-new = Agras T50 package C$29,999; t50-used = Agras T50, pre-owned package C$22,999; t100 = Agras T100 C$48,505. Hire rate C$18–22/acre. Interactive version: https://agr.speedydrone.ca/tools/buy-or-hire-spray-drone",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "acresPerYear": {
                "description": "Acres sprayed a season, every pass counted",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "hireRate": {
                "default": 20,
                "description": "Custom spraying rate, C$/acre",
                "maximum": 200,
                "minimum": 0,
                "type": "number"
              },
              "packageId": {
                "default": "t50-new",
                "description": "Drone package",
                "enum": ["t50-new", "t50-used", "t100"],
                "type": "string"
              },
              "years": {
                "default": 5,
                "description": "Years to spread the drone's price over",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["acresPerYear"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buy a spray drone or hire spraying"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:29b4540d5de3d8b32a13b1dd13e6ee508512d9218ce56b957a9b4f0a1379f0c9"
        },
        {
          "name": "drone_spraying_cost",
          "title": "Drone spraying or seeding job cost (Ontario, C$)",
          "description": "What a custom drone spraying or seeding job costs (southern Ontario hire rates, C$, before tax: spraying C$18–22/acre, seeding C$15–18/acre, C$500 minimum, C$1.5/km travel), plus the spray mix and tank loads for a T50 or T100. Interactive version: https://agr.speedydrone.ca/tools/drone-spraying-cost-calculator",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "acres": {
                "description": "Field size, acres",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "job": {
                "default": "spraying",
                "description": "spraying or seeding",
                "enum": ["spraying", "seeding"],
                "type": "string"
              },
              "litresPerHa": {
                "default": 50,
                "description": "Spray mix, L/ha (labels often require 50; lower only where the label allows)",
                "maximum": 200,
                "minimum": 0,
                "type": "number"
              },
              "roundTripKm": {
                "default": 0,
                "description": "Round trip to the field, km",
                "maximum": 5000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["acres"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Drone spraying or seeding job cost (Ontario, C$)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d0dc178cb3abf917588c4ad25e92106d3b7fc1b0d0df64b355eda75cc60e42e"
        },
        {
          "name": "fiscal_year_order_planner",
          "title": "Fiscal-year order-by planner",
          "description": "For a research or public buyer who must receive goods by a date (often March 31): the last day to send the purchase order and the last day to request the quote and start approvals. Interactive version: https://agr.speedydrone.ca/tools/fiscal-year-drone-order-planner",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalWeeks": {
                "default": 6,
                "description": "Weeks approvals take",
                "maximum": 52,
                "minimum": 0,
                "type": "number"
              },
              "cutoffDays": {
                "default": 7,
                "description": "Days before that the office stops issuing purchase orders",
                "maximum": 180,
                "minimum": 0,
                "type": "integer"
              },
              "deliveryWeeks": {
                "description": "Delivery time on the quote, weeks",
                "maximum": 52,
                "minimum": 0,
                "type": "number"
              },
              "receiveBy": {
                "description": "YYYY-MM-DD the goods must be received by (default: the next March 31)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["deliveryWeeks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fiscal-year order-by planner"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
