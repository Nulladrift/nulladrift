            "readOnly": true
          },
          "digest": "sha256:e113784910d5102512582284ae63ee125f9f13c95576307d13e179b3e0bc7a26"
        },
        {
          "name": "read_page",
          "title": "Read a page",
          "description": "The full text of one SpeedyDrone page: an article, guide, FAQ page or calculator page. Pass a URL from search_site or a path like /blog/<slug>.",
