                            "additionalProperties": false,
                            "properties": {
                              "de": {
                                "description": "German text, or null.",
                                "type": ["string", "null"]
                              },
                              "en": {
                                "description": "English text, or null.",
                                "type": ["string", "null"]
                              }
                            },
                            "required": ["de", "en"],
                            "type": "object"
