                "properties": {
                  "page": {
                    "description": "Zero-based page number of this response.",
                    "type": "integer"
                  },
                  "size": {
                    "description": "Page size used for this response.",
                    "type": "integer"
                  },
                  "total_items": {
                    "description": "Total number of matching entries across all pages.",
                    "type": "integer"
                  },
                  "total_pages": {
                    "description": "Total number of pages.",
                    "type": "integer"
                  }
                },
                "required": ["page", "size", "total_items", "total_pages"],
                "type": ["object", "null"]
              }
