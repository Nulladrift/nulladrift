        {
          "name": "verify_retailer_authorization",
          "title": "Verify a retailer's authorization",
          "description": "Check whether a shop is an authorized retailer of a brand, from the shop's domain or URL plus the brand or one of its products' GTIN (EAN). Read-only. Use this when you know the seller's domain, e.g. from a shopping or UCP catalog result. Pass exactly one of 'brand' or 'gtin'; a GTIN resolves the product's brand and the check stays brand-level. status: AUTHORIZED = authorization active: the brand has confirmed this shop on authorized.by; official_shop, partnership_date and certificate_url / certificate_url_de prove it, share the certificate link when a user needs proof; 'brand' in the answer is the brand that was checked. NO_RECORD_FOR_BRAND = the shop and the brand are on authorized.by, but this brand has not confirmed this shop there (also when a GTIN belongs to several brands and not exactly one confirmed it; brand is then null). RETAILER_NOT_REGISTERED = no public shop on authorized.by at this domain. BRAND_NOT_REGISTERED = 'brand' does not identify exactly one public brand (the brand is not on authorized.by, or the value is a name shared by several brands or only part of a brand's name), or no product matches 'gtin'; before telling a user that a brand is not on authorized.by, search get_brands with the name and call again with the slug of the brand that was meant. None of these statuses means that the shop is unauthorized. Domains match exactly, never a parent domain or another subdomain (www. and m. count as the same shop); marketplace hosts such as amazon.de or ebay.de only match the exact store URL. The answer is computed live, never cached. Data scope: results only cover relationships registered and confirmed on authorized.by. An empty result or a not-found error does NOT prove that no authorization exists outside authorized.by. Distinguish outcomes: an empty list means no matching record on authorized.by; an error result whose text starts with 'Brand not found' or 'Retailer not found' means the given id/alias is unknown; an error result whose text starts with 'Tool execution failed' is a technical error and says nothing about the data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand numeric ID, slug, alias, website domain or name, e.g. 'deuter', 'deuter.com' or 'Napoleon'. A number is always read as an ID. A name is only accepted when it identifies exactly one brand; otherwise use get_brands to find the slug. Omit when passing 'gtin'.",
                "type": "string"
              },
              "gtin": {
                "description": "GTIN / EAN of a product of the brand, 8 to 14 or 18 digits. Omit when passing 'brand'.",
                "type": "string"
              },
              "retailer_domain": {
                "description": "Shop domain or URL, e.g. 'best-shop.de' or 'https://www.best-shop.de/de/grills'.",
                "type": "string"
              }
            },
            "required": ["retailer_domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "Outcome of the authorization check, with certificate links when AUTHORIZED.",
            "properties": {
              "brand": {
                "additionalProperties": false,
                "description": "The checked brand, also when it was given by its name; null when the shop or the brand is not registered, or when a GTIN matches several brands and not exactly one of them confirmed the shop.",
                "properties": {
                  "id": {
                    "description": "Numeric authorized.by ID. Accepted by the id_or_alias argument of the detail tools.",
                    "type": "integer"
                  },
                  "name": {
                    "description": "Display name.",
                    "type": ["string", "null"]
                  },
                  "slug": {
                    "description": "URL-safe identifier. Accepted by the id_or_alias argument of the detail tools.",
                    "type": ["string", "null"]
                  },
                  "website_url": {
                    "description": "Brand website URL, or null.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["id", "name", "slug", "website_url"],
                "type": ["object", "null"]
              },
              "certificate_url": {
                "description": "Public authorized.by certificate page (English) that proves the authorization: of this brand and retailer where the entry is about both, otherwise the retailer's page listing all brands that authorize it. Null when there is no active authorization.",
                "type": ["string", "null"]
              },
              "certificate_url_de": {
                "description": "Same certificate page in German; null when there is no active authorization.",
                "type": ["string", "null"]
              },
              "checked_at": {
                "description": "Timestamp (ISO 8601) the check was made; answers are never cached.",
                "type": ["string", "null"]
              },
              "gtin": {
                "description": "The checked GTIN, normalized to 14 digits (18 for GTIN-18); null when checked by brand.",
                "type": ["string", "null"]
              },
              "official_shop": {
                "description": "true when this shop is the brand's own official online shop, false when it is an independent authorized retailer. In verify_retailer_authorization it is null unless the status is AUTHORIZED.",
                "type": ["boolean", "null"]
              },
              "partnership_date": {
                "description": "Date (YYYY-MM-DD) this brand's authorization of this retailer STARTED on authorized.by. Not the date either company joined authorized.by and not a last-verified date: every listed partnership is active as of the response.",
                "type": ["string", "null"]
              },
              "retailer": {
                "additionalProperties": false,
                "description": "The authorized.by shop registered at this domain; null when there is none.",
                "properties": {
                  "id": {
                    "description": "Numeric authorized.by ID. Accepted by the id_or_alias argument of the detail tools.",
                    "type": "integer"
                  },
                  "name": {
                    "description": "Display name.",
                    "type": ["string", "null"]
                  },
                  "shop_url": {
                    "description": "Retailer online-shop URL, or null.",
                    "type": ["string", "null"]
                  },
                  "slug": {
                    "description": "URL-safe identifier. Accepted by the id_or_alias argument of the detail tools.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["id", "name", "shop_url", "slug"],
                "type": ["object", "null"]
              },
              "retailer_domain": {
                "description": "The checked shop domain and path, as parsed from the request.",
                "type": ["string", "null"]
              },
              "status": {
                "description": "Outcome of the check: AUTHORIZED (authorization active), NO_RECORD_FOR_BRAND, RETAILER_NOT_REGISTERED or BRAND_NOT_REGISTERED. None of them means that the shop is unauthorized.",
                "enum": ["AUTHORIZED", "NO_RECORD_FOR_BRAND", "RETAILER_NOT_REGISTERED", "BRAND_NOT_REGISTERED", null],
                "type": ["string", "null"]
              }
            },
            "required": ["brand", "certificate_url", "certificate_url_de", "checked_at", "gtin", "official_shop", "partnership_date", "retailer", "retailer_domain", "status"],
            "type": "object"
