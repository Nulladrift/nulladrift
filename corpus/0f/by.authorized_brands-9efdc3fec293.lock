                          "description": "Description text in German (de) and English (en); each may be null.",
                          "properties": {
                            "de": {
                              "description": "German text, or null.",
                              "type": ["string", "null"]
                            },
                            "en": {
                              "description": "English text, or null.",
                              "type": ["string", "null"]
                            }
                          },
                          "required": ["de", "en"],
                          "type": ["object", "null"]
                        },
                        "email": {
                          "type": ["string", "null"]
                        },
                        "opening_hours": {
                          "description": "Weekly opening hours of the physical store; empty or null when unknown.",
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "closing_hour": {
                                "description": "Closing time.",
                                "type": ["string", "null"]
