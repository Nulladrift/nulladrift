                      }
                    },
                    "required": ["de", "en"],
                    "type": ["object", "null"]
                  },
                  "hq_country": {
                    "description": "Country code of the brand's headquarters (its company address), or null. Not a manufacturing country and not the countries its authorizations cover.",
