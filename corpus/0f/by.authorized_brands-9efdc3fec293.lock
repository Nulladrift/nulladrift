                              "type": ["string", "null"]
                            },
                            "en": {
                              "description": "English text, or null.",
                              "type": ["string", "null"]
                            }
                          },
                          "required": ["de", "en"],
                          "type": ["object", "null"]
                        },
                        "email": {
