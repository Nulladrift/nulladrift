        {
          "name": "get_brands",
          "title": "Search brands",
          "description": "Search brands (manufacturers) registered on authorized.by, or list them all. Read-only. 'search' matches the brand name, alias or website domain (partial match). Returns for each brand: id, name, slug, logo and the number of retailers it has authorized. Omit 'search' to retrieve the full index; use 'page' and 'size' to paginate. Data scope: results only cover relationships registered and confirmed on authorized.by. An empty result or a not-found error does NOT prove that no authorization exists outside authorized.by. Distinguish outcomes: an empty list means no matching record on authorized.by; an error result whose text starts with 'Brand not found' or 'Retailer not found' means the given id/alias is unknown; an error result whose text starts with 'Tool execution failed' is a technical error and says nothing about the data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "page": {
                "description": "Zero-based page number (default 0).",
                "type": "integer"
              },
              "search": {
                "description": "Filter by brand name, alias or website domain/URL, e.g. 'deuter' or 'deuter.com'. Optional.",
                "type": "string"
              },
              "size": {
                "description": "Page size (default 500).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "A page of brands plus network-wide totals and pagination.",
            "properties": {
              "brands": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Numeric authorized.by ID. Accepted by the id_or_alias argument of the detail tools.",
                      "type": "integer"
                    },
                    "logo": {
                      "description": "Logo image URL, or null.",
                      "type": ["string", "null"]
                    },
                    "name": {
                      "description": "Display name.",
                      "type": ["string", "null"]
                    },
                    "retailer_count": {
                      "description": "Number of retailers currently authorized by this brand on authorized.by.",
                      "type": "integer"
                    },
                    "slug": {
                      "description": "URL-safe identifier. Accepted by the id_or_alias argument of the detail tools.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "logo", "name", "retailer_count", "slug"],
                  "type": "object"
                },
                "type": ["array", "null"]
              },
              "meta": {
                "additionalProperties": false,
                "description": "Network-wide totals.",
                "properties": {
                  "generated_at": {
                    "description": "Timestamp (ISO 8601) the index was generated.",
                    "type": ["string", "null"]
                  },
                  "total_brands": {
                    "description": "Total number of public brands on authorized.by.",
                    "type": "integer"
                  },
                  "total_connections": {
                    "description": "Total number of active brand-retailer authorizations on authorized.by.",
                    "type": "integer"
                  },
                  "total_retailers": {
