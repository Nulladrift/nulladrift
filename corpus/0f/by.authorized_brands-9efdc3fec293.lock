      "instructions": "authorized.by is the registry of retailers that brands (manufacturers) have explicitly authorized to sell their products. All tools are read-only. Typical flow: resolve a name or domain with get_brands or get_retailers, then call get_brand_retailers (brand → authorized shops) or get_retailer_brands (shop → authorized brands). To check one shop by its domain or URL (e.g. a seller in a shopping result), call verify_retailer_authorization with the brand or a product GTIN. Results only cover authorizations registered and confirmed on authorized.by; a missing record does not prove that no authorization exists elsewhere. certificate_url fields link to public proof pages.",
      "tools": [
        {
          "name": "get_brand",
          "title": "Get brand profile",
          "description": "Get the public profile of one brand (manufacturer) on authorized.by. Read-only. Returns categories, website, headquarters country, description, registration date and the number of authorized retailers. Use get_brands first if you only know an approximate name. Data scope: results only cover relationships registered and confirmed on authorized.by. An empty result or a not-found error does NOT prove that no authorization exists outside authorized.by. Distinguish outcomes: an empty list means no matching record on authorized.by; an error result whose text starts with 'Brand not found' or 'Retailer not found' means the given id/alias is unknown; an error result whose text starts with 'Tool execution failed' is a technical error and says nothing about the data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id_or_alias": {
                "description": "Brand numeric ID, slug or alias, e.g. 'deuter' or '16709'.",
                "type": "string"
              }
            },
            "required": ["id_or_alias"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "The public profile of one brand.",
            "properties": {
              "categories": {
                "description": "Product categories.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Numeric authorized.by ID. Accepted by the id_or_alias argument of the detail tools.",
                      "type": "integer"
                    },
                    "name_de": {
                      "description": "German category name.",
                      "type": ["string", "null"]
                    },
                    "name_en": {
                      "description": "English category name.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "name_de", "name_en"],
                  "type": "object"
                },
                "type": ["array", "null"]
              },
              "details": {
                "additionalProperties": false,
                "description": "Extended profile details.",
                "properties": {
                  "description": {
                    "additionalProperties": false,
                    "description": "Description text in German (de) and English (en); each may be null.",
                    "properties": {
                      "de": {
                        "description": "German text, or null.",
