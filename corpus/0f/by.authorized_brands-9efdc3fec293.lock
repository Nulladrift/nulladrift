                                "description": "English text, or null.",
                                "type": ["string", "null"]
                              }
                            },
                            "required": ["de", "en"],
                            "type": "object"
                          },
                          "type": ["array", "null"]
                        },
                        "description": {
                          "additionalProperties": false,
                          "description": "Description text in German (de) and English (en); each may be null.",
                          "properties": {
                            "de": {
                              "description": "German text, or null.",
                              "type": ["string", "null"]
                            },
                            "en": {
                              "description": "English text, or null.",
                              "type": ["string", "null"]
                            }
                          },
                          "required": ["de", "en"],
                          "type": ["object", "null"]
                        },
                        "email": {
                          "type": ["string", "null"]
                        },
                        "opening_hours": {
                          "description": "Weekly opening hours of the physical store; empty or null when unknown.",
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "closing_hour": {
                                "description": "Closing time.",
                                "type": ["string", "null"]
                              },
                              "day_of_week": {
                                "description": "Day of the week.",
                                "type": ["string", "null"]
                              },
                              "opening_hour": {
                                "description": "Opening time.",
                                "type": ["string", "null"]
                              }
                            },
                            "required": ["closing_hour", "day_of_week", "opening_hour"],
                            "type": "object"
                          },
                          "type": ["array", "null"]
                        },
                        "payment_methods": {
                          "description": "Accepted payment methods; null when unknown.",
                          "items": {
                            "type": "string"
                          },
                          "type": ["array", "null"]
                        },
                        "phone": {
                          "type": ["string", "null"]
