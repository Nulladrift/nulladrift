      "tools": [
        {
          "name": "check_bill_markup",
          "title": "Bill markup check",
          "description": "Compares one billed line to the hospital's own published negotiated rate for that code and returns the multiple. You type the code and amount; no bill upload. Educational, not billing advice.",
          "inputSchema": {
            "properties": {
              "billed_amount": {
                "description": "Amount billed, USD.",
                "minimum": 0,
                "type": "number"
              },
              "cpt": {
                "description": "CPT/HCPCS procedure code.",
                "maxLength": 10,
                "type": "string"
              },
              "hospital": {
                "description": "Hospital / facility name.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["billed_amount", "cpt", "hospital"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Bill markup check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "annotationsJustification": "Read-only comparison of a user-supplied number against the same static hospital rate file used by get_hospital_rate. No write, no external call — openWorldHint=false.",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:fb0c352e220178e4f586fd05c399f9f6d2aab1adf162eb0d77fcde897c95bf29"
        },
        {
          "name": "explain_denial_code",
          "title": "Denial code explainer",
          "description": "Explains a CARC claim-adjustment reason code from the public X12 code list: what it means, whether it is typically appealable, and the general appeal path. Not legal advice.",
          "inputSchema": {
            "properties": {
              "carc_code": {
                "description": "CARC/RARC code, e.g. 'CO-16', '16', 'CO-50'.",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["carc_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Denial code explainer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "annotationsJustification": "Read-only lookup against the public X12 CARC/RARC code list bundled with the service. No external call, no side effect — openWorldHint=false.",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:1b2487bd20aad8477b04addd361f05228d12eba084a6187f6e555494e618a25b"
        },
        {
          "name": "get_appeal_deadline",
          "title": "Appeal deadline rule",
          "description": "Returns the appeal window that applies to a plan type (employer ERISA plan, marketplace/individual, Medicare Advantage, Medicaid) with the federal citation and how the clock is counted. Cites the rule; does not tell you whether to file.",
          "inputSchema": {
            "properties": {
              "plan_type": {
                "description": "e.g. 'self_funded', 'aca_marketplace', 'medicare', 'medicaid'.",
                "maxLength": 40,
                "type": "string"
              },
              "state": {
                "description": "2-letter US state (echoed on the row; the window itself is federal).",
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["plan_type", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Appeal deadline rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "annotationsJustification": "Read-only lookup of a federally-fixed appeal window keyed by plan type. Static table, no external call — openWorldHint=false.",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:b9d0ae465663c1b579ba9e669cd85da5ae541642d864c91888d22d0985ceac33"
        },
        {
          "name": "get_hospital_rate",
          "title": "Hospital published rate",
          "description": "Returns the negotiated rate a named hospital publishes in its federally required machine-readable file for a CPT/HCPCS code, with the file's as-of date. Public hospital-transparency data; educational, not billing advice.",
          "inputSchema": {
            "properties": {
              "cpt": {
                "description": "CPT/HCPCS procedure code.",
                "maxLength": 10,
                "type": "string"
              },
              "hospital": {
                "description": "Hospital / facility name.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["cpt", "hospital"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Hospital published rate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "annotationsJustification": "Read-only: reads a static, federally-required hospital machine-readable price file already on disk. No external system is called and nothing is published or changed — openWorldHint=false.",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:997a3a7c00cbc748be11bb6cdeb3eb0f5e00bc0e5ead51c1e3b2b88214011687"
        },
        {
          "name": "get_insurer_overturn_rate",
          "title": "Insurer overturn rate",
          "description": "Returns, for one insurer in one state, the share of external-review appeals the state regulator reports as overturned, with the sample size, the regulator's report as the source, and the as-of date. Available for CA, NY, MD, NJ, MI, OH, NC. This is one insurer's own historical rate — not a ranking or comparison against other insurers, and not a prediction for your case.",
          "inputSchema": {
            "properties": {
              "insurer": {
                "description": "Insurer / payer name.",
                "maxLength": 100,
                "type": "string"
              },
              "state": {
                "description": "Venue state: CA, NY, MD, NJ, MI, OH, or NC.",
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["insurer", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Insurer overturn rate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "annotationsJustification": "Read-only lookup of one insurer's own historical external-review overturn rate as published by a state regulator, k-anonymity floored. No comparison field returned, no external call at request time (pre-ingested corpus) — openWorldHint=false.",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:bf4f4ce65744635e413350211aa7c0814fb8e88a45a474bf79c1f9e38b0c289e"
        },
        {
          "name": "lookup_procedure_code",
          "title": "Procedure code lookup",
          "description": "Plain-English description of a CPT/HCPCS procedure code and its category, from public code references.",
          "inputSchema": {
            "properties": {
              "cpt_code": {
                "description": "CPT / HCPCS-J code ('99213', 'J1885') or keyword ('knee MRI', 'colonoscopy').",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["cpt_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Procedure code lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "annotationsJustification": "Read-only lookup against a bundled public CPT/HCPCS descriptor table. No external call — openWorldHint=false.",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:1b8a944cd04989b11b1093a4274b061b4ec2ad6623359862e03e2edcc91d466c"
        }
