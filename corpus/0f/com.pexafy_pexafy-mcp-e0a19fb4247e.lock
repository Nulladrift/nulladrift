          "digest": "sha256:b6688994ac24c0ee2f971c25f3d1c13af58a4f8830f26484d71c6eea9f95cf57"
        },
        {
          "name": "get_grid_selected_photos",
          "title": "Get the photos the person liked in the grid",
          "description": "Returns the photographs the person liked (hearted) in the Pexafy results grid. Use it when the person refers to that selection rather than asking for new photos — for example “the images I selected”, “the ones I chose”, “my selection”, “the photos I hearted”, “the photos I liked”, “use the ones I picked”, “put my selection in the document”, “download the ones I chose”, or “write the article around my photos”.\n\nThe selection is held by the grid and the server, not by the conversation: this tool is how it is read, and search results are not the selection. It takes no arguments and returns every liked photograph with its rank, photo_id, photographer, source library, licence, pixel size, orientation, description, page URL and credit line, and `selection_count`, the number of them.\n\nTo get one of them as an image file, pass its photo_id to get_photo_file_by_photo_id.\n\n`rank` is the person's order, #1 first: the order the photos were liked in, unless the person rearranged them by dragging in the grid. Where the grid is rendered, that number is drawn on each liked photograph, so it is the number the person sees and names them by (“#2”). The `rank` of a search result is only its position in that answer and is not drawn on the grid.\n\nAn empty selection means nothing is liked in the grid currently on screen; a photograph is liked with the heart on it. A selection expires an hour after its last change, and a new search replaces the grid it belongs to.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "description": "What the count means, in words: a whole selection, one that a later search replaced, or an empty one.",
                "type": "string"
              },
              "selected_photos": {
                "description": "The photographs they liked, in their order — the order they liked them in, unless they rearranged them in the grid. Each carries its `rank` — #1 first — the `photo_id` to pass on, the photographer, the source, the licence, the pixel size, the description, the page it came from and the credit line.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "attribution": {
                      "description": "The credit line to display.",
                      "type": "string"
                    },
                    "description": {
                      "description": "What is in the photograph.",
                      "type": "string"
                    },
                    "height": {
                      "type": "integer"
                    },
                    "image_url": {
                      "description": "The link to the photograph.",
                      "type": "string"
                    },
                    "license": {
                      "type": "string"
                    },
                    "orientation": {
                      "type": "string"
                    },
                    "photo_id": {
                      "description": "What every other tool takes.",
                      "type": "string"
                    },
                    "photographer": {
                      "type": "string"
                    },
                    "rank": {
                      "description": "#1 is first in their order.",
                      "type": "integer"
                    },
