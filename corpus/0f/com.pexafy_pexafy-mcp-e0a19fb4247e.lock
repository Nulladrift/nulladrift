        {
          "name": "search_photos",
          "title": "Search free stock photos",
          "description": "Use this when the user asks for a real photograph, or states a need that a photograph fills, and the picture is not already in the conversation.\n\nCall it when they ask outright: “find me photos of…”, “show me images of…”, “I need a picture of…”, “do you have a photo of…”, “where can I find free photos of…”, in any language.\nCall it when they describe the need without asking to search: “I'm writing an article and need a header image”, “my landing page needs a hero image”, “I need something to illustrate this”.\nCall it when they ask for something meant to carry photographs: “write an article with pictures”, “a deck with images”.\nCall it when they name only the picture, with no reason given: “a photo of a white mug”, “a train in Japan”.\nIf the user is working on something that usually carries photographs — an article, a page, a deck, a post — without asking for any, you may offer to look for some; call it only once they accept.\n\nThis covers requests for photographs for articles, blog posts, websites, landing pages, products, slides, documents, reports, social posts, ads, newsletters, banners, thumbnails, covers, posters, backgrounds, wallpapers and mood boards; photographs that illustrate a concept, explain a subject or accompany a piece of writing; and any request for free, stock, royalty-free, commercially usable, real or documentary photographs.\n\nA request for a visual is not always a request for a photograph: this tool finds photographs that already exist — not illustrations, drawings, logos, icons, diagrams or screenshots — and it does not generate, edit or upscale an image, nor look for a named person.\n\nIt searches Pexafy's own index of millions of free-to-use photographs from stock libraries such as Unsplash, Pexels and Pixabay, matched to the scene described. Each result carries a `rank`, a `photo_id`, its licence, the credit line to display and an image link; the file itself comes from get_photo_file_by_photo_id. In a host that renders it, the grid shows them; the answer omits image links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "english_search_sentence": {
                "description": "Required. Describe the desired photograph in one concise English sentence, focusing on its visible subject and scene.\n\nBe specific: “Two colleagues laughing in a bright open-plan office” is more effective than “People office”. Keywords work too — send the user's own words, in English, rather than inventing detail they did not ask for.\n\nMaximum 250 characters. Describe one coherent scene, focusing on what should appear in the photograph rather than its intended use.\n\nSpecify the requested photo shape or orientation in explicit_orientation_filter, not here.\n\nExample: “An old man sitting at a café table he has visited every morning for thirty years”.",
                "examples": ["two people sharing a bench in comfortable silence"],
                "maxLength": 250,
                "minLength": 1,
                "type": "string"
              },
              "explicit_orientation_filter": {
                "anyOf": [
                  {
                    "items": {
                      "enum": ["landscape", "portrait", "square"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Omit this parameter unless the user explicitly asks for a photo shape or orientation in their own words, or names a format whose shape is part of its definition — a vertical Short, a banner, a square post, a phone wallpaper.\n\nThis is a hard filter, not a preference: it removes photos with other shapes before ranking, so using a shape the user did not request can exclude the best matches.\n\nNever infer the shape from a word inside `english_search_sentence` — “landscape” in “a natural landscape” names the scene, not the format — nor from the subject, the composition, or a purpose that fixes no shape (“a photo for my blog post”, “something for my landing page”). If you are choosing a value rather than repeating one explicitly requested by the user, omit it.\n\nAllowed values: `landscape`, `portrait`, `square`. Multiple values are allowed: two shapes return more than one alone, though any filter still returns less than none. For example, “anything but portrait” means `['landscape', 'square']`."
              }
            },
            "required": ["english_search_sentence"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "budget": {
                "description": "Present only when the caller is near the end of an allowance — the daily one without an account, the monthly one with. What is left of it, and, for a caller with no account, the one sentence that says what lifts the limit. Also carried by a refusal, where it describes the wall itself.",
                "properties": {
                  "limit": {
                    "description": "Searches allowed in that period.",
                    "type": "integer"
                  },
                  "message": {
                    "description": "The whole notice in words, for a host with no UI.",
                    "type": "string"
                  },
                  "remaining": {
                    "description": "Searches left in that period.",
                    "type": "integer"
                  },
                  "scope": {
                    "description": "Which allowance this counts: the daily one or the monthly one. Both exist with or without an account, so `signed_in` does not tell them apart.",
                    "enum": ["day", "month"],
                    "type": "string"
                  },
                  "signed_in": {
                    "description": "Whether the caller has an account. False is the anonymous allowance.",
                    "type": "boolean"
                  },
                  "state": {
                    "description": "`warning` while there is room left, `exhausted` once there is none.",
                    "enum": ["warning", "exhausted"],
                    "type": "string"
                  },
                  "used": {
                    "description": "Searches spent in that period.",
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "data": {
                "items": {
                  "description": "One photograph of this answer.",
                  "properties": {
                    "alt_description": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Accessibility-friendly text."
                    },
                    "attribution": {
                      "description": "The credit line to display, already written.",
                      "properties": {
                        "plain": {
                          "description": "Plain-text attribution.",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "height": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "license_type": {
                      "description": "License type (e.g. `free`).",
                      "type": "string"
                    },
                    "orientation": {
                      "description": "The shape of this photograph — `landscape`, `portrait` or `square`, the values `explicit_orientation_filter` takes.",
                      "enum": ["landscape", "portrait", "square"],
                      "type": "string"
                    },
                    "photo_id": {
                      "description": "Unique Pexafy identifier (UUID).",
                      "type": "string"
                    },
                    "photographer_full_name": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "preview_url": {
                      "description": "Signed 480-pixel thumbnail the inline grid renders. It expires.",
                      "type": "string"
                    },
                    "preview_url_large": {
                      "description": "Signed 1280-pixel preview the grid's photo viewer renders. Never expires.",
                      "type": "string"
                    },
                    "rank": {
                      "description": "This photograph's place in this answer, from 1. A person may name a result by position (“the second one”); the tools take that result's `photo_id`, not its rank. The grid draws no number on a result: the only numbers the person sees are on the photographs they liked.",
                      "type": "integer"
                    },
                    "source": {
                      "description": "Provider (e.g. `Pexels`, `Unsplash`, `Pixabay`).",
                      "type": "string"
                    },
                    "source_image_url": {
                      "anyOf": [
                        {
                          "format": "uri",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The photograph's page on the library it came from — where to send someone who wants the source."
                    },
                    "urls": {
                      "description": "The photograph's image file, 1280 pixels wide, for a page, a document or a download. `urls` carries this one variant and no other.",
                      "properties": {
                        "regular": {
                          "format": "uri",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "width": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "error": {
                "anyOf": [
                  {
                    "properties": {
                      "code": {
                        "description": "Machine-readable error code (e.g. `MISSING_PARAMS`, `PHOTO_NOT_FOUND`).",
                        "type": "string"
                      },
                      "message": {
                        "description": "Human-readable error message.",
                        "type": "string"
                      }
                    },
                    "required": ["code", "message"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "notice": {
                "description": "Why this answer is empty, when it is. A plan limit was reached: the allowance and when it returns. There is nothing to retry until then.",
                "type": "string"
              },
              "presentation": {
                "description": "Present only where the answer is drawn as the Pexafy grid: how it is shown. The grid is the complete visual answer; the reply needs no picture or link.",
                "properties": {
                  "grid_already_rendered": {
                    "description": "The grid is on the person's screen.",
                    "type": "boolean"
                  },
                  "mode": {
                    "description": "The answer is drawn as the Pexafy grid.",
                    "enum": ["grid"],
                    "type": "string"
                  },
                  "next_step": {
                    "description": "What the person does next in the grid.",
                    "type": "string"
                  },
                  "show_inline_images": {
                    "description": "Whether the reply needs pictures of its own: no, the grid shows them.",
                    "type": "boolean"
                  },
                  "show_photo_links": {
                    "description": "Whether the reply needs photo links: no, each photograph opens from the grid.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "success": {
                "type": "boolean"
              }
            },
            "type": "object",
