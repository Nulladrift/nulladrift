        {
          "name": "get_photo_file_by_photo_id",
          "title": "Get the photo as a file",
          "description": "Returns one photograph from an earlier Pexafy result as an image file, identified by its `photo_id`. A result's link points to the image; this tool returns the image itself, so the person does not need to send the photograph again.\n\nUse it when the user wants a photograph found here as a file: to place it in a document, a slide or a post, to attach, send or download it, or to have it cropped, captioned or otherwise edited with the host's own tools.\n\nIt is for a photograph the person picked: where the Pexafy grid is shown, the photographs of a search are already on screen and need no file to be seen.\n\nThe answer contains the photograph, at most 1280 pixels wide, and a line giving its file name, size, licence, source, `photo_id`, page at the source and the credit line to display. One photo per call; the file stays in the conversation afterwards.\n\nThis server does not edit images: what can be done to the file next depends on the host's own tools. Its licence and credit line apply to this photograph only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "photo_id": {
                "description": "The `photo_id` of the specific photo to retrieve from a previous Pexafy result. It is a UUID such as `019e1ecb-0039-7da6-b1ca-987ee4d337c0`.\n\nUse the photo's `photo_id`, never a rank or a position: a rank is how the person and you name a photograph out loud, never what this parameter takes.",
                "type": "string"
              }
            },
            "required": ["photo_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the photo as a file"
          },
          "behavior": {
