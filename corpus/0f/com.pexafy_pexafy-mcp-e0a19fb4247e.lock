            "openai/toolInvocation/invoking": "Opening Pexafy account connection…",
            "openai/widgetAccessible": true,
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["read"],
                "type": "oauth2"
              }
            ]
