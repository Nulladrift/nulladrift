      },
      "instructions": "Use this server when the user asks for real photographs, or states a need that photographs fill, in any language, for example:\n\n* Finding, showing or providing photos or pictures.\n* Photographs for articles, blogs, websites, landing pages, products, slides, social posts, ads, newsletters, banners, thumbnails, covers, posters, backgrounds, wallpapers or mood boards.\n* Content the user asks to illustrate with photographs (e.g. \"write an article with pictures\").\n* Free, stock, royalty-free, commercially usable or documentary photographs.\n* A real photograph, when the user asks for one.\n* Free alternatives to a picture, or photos that look like it — one the user links to or that the host passes as a file, or a Pexafy photo already found.\n\nPexafy searches its own index of millions of free-to-use photographs from stock libraries such as Unsplash, Pexels and Pixabay, each with its licence and credit line.\n\n### When NOT to use Pexafy\n\nA request for a visual is not always a request for a photograph. Pexafy does not find illustrations, drawings, logos, icons, diagrams or UI screenshots, does not generate, edit or upscale images, and does not search for named people; finding free photographs like a picture the user provides is in scope: by image when it is linked or passed to the tool, in words otherwise. Do not use Pexafy to add photographs the user did not ask for.\n\n### Tool selection\n\n* To find photographs described in words, call `search_photos`.\n* To find photographs that look like a reference, call `search_photos_by_image` with exactly one reference: `image_url`, `image_file` or `image_base64` for a picture, or `photo_id` for a Pexafy photo returned in an earlier search or liked in the Pexafy grid.\n* To read the photographs the user liked in the Pexafy grid, call `get_grid_selected_photos`.\n* To get a photograph found here as an image file — to insert, attach or download it, or to edit it with the host's own tools — call `get_photo_file_by_photo_id`.",
      "tools": [
        {
          "name": "connect_account",
          "title": "Connect a Pexafy account",
          "description": "Asks the host to offer its own flow for connecting a Pexafy account, when none is attached. Use it when the person asks to connect, link or sign in to a Pexafy account — including from the account button in the Pexafy grid — or wants more searches than the daily allowance available without an account.\n\nWhen no account is attached, it returns an error result that carries an account-connection request for the host: the error is how that request is delivered, not a failure. A host that supports it shows its own account-connection prompt, which the person completes or dismisses; other hosts show only the result's text. Calling it again returns the same request. When an account is already attached, it says so and starts nothing.\n\nIt does not search, and searching does not require calling it. `check_only` is set by the Pexafy grid to read the state without opening a prompt; leave it unset when the person wants to connect or sign in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_only": {
                "default": false,
                "description": "Set by the Pexafy results grid: `true` reports whether an account is connected — and the allowance in force — without opening the connection prompt. Leave it unset when the person wants to connect or sign in.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "budget": {
                "anyOf": [
                  {
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "What is left of the current allowance, or null when it is not worth saying."
              },
              "connected": {
                "description": "Whether an account is attached to this conversation.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Connect a Pexafy account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
