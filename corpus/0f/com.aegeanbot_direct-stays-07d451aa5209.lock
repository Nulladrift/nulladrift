      },
      "instructions": "Search and compare direct-booking vacation homes across Greece. Use search_listings first, then pass a returned listing_id or exact name to detail and availability tools. Never invent dates, party size, budget, availability, or price. Public sessions expose only read-only catalog tools; reservation and operational tools require scoped auth.",
      "tools": [
        {
          "name": "check_availability_and_price",
          "title": "Check Availability And Price",
          "description": "Exact availability + total price for one listing and concrete dates, with the direct booking link.",
          "inputSchema": {
            "properties": {
              "checkin": {
                "description": "YYYY-MM-DD — never in the past; bare day numbers in a follow-up ('26 to 29') keep the month/year already under discussion, NOT the current month",
                "type": "string"
              },
              "checkout": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "listing": {
                "type": "string"
              }
            },
            "required": ["checkin", "checkout", "listing"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check Availability And Price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7b63b13c4c86a4efadaa99943b36fd5357c52b86f50f4fd51cc6d0a72d6c6e74"
        },
        {
          "name": "get_faq_answer",
          "title": "Get Faq Answer",
          "description": "Retrieve the host's own Q&A entries most relevant to a factual question about the stay, the house, or the host's services. Prefer this over guessing for any host-specific question.",
          "inputSchema": {
            "properties": {
              "listing_id": {
                "description": "scope to one listing (optional)",
                "type": "string"
              },
              "question": {
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Faq Answer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:19f3dcac5a4db54245f93d88b19fa5776232585d302d515f67e7619c6a57857b"
        },
        {
          "name": "get_listing_details",
          "title": "Get Listing Details",
          "description": "Full facts for ONE listing already in play (amenities, description, capacity, base price).",
          "inputSchema": {
            "properties": {
              "listing": {
                "description": "listing title (partial ok)",
                "type": "string"
              }
            },
            "required": ["listing"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Listing Details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:80b7673ce16710cd1e0f1dc5895257bea7640ec63417fd7578297233b25355fd"
        },
        {
          "name": "get_listing_policies",
          "title": "Get Listing Policies",
          "description": "Every policy fact for ONE listing in one call: check-in/out times, advance notice, preparation days, this month's minimum stay, cancellation policy, and (when configured) amendment rules like late checkout. Use for ANY rules/policy question about a home.",
          "inputSchema": {
            "properties": {
              "listing": {
                "description": "listing title (partial ok)",
                "type": "string"
              }
            },
            "required": ["listing"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Listing Policies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f1dbc7ba5dd31893a6cfe0baa4c0e701d107dcd5871939fa4f35a3dc43453011"
        },
        {
          "name": "search_listings",
          "title": "Search Listings",
          "description": "Search available vacation rentals across Greece. Pass explicit destinations, dates, guest counts and filters as structured fields; use query only for preferences not represented by another field. Do not invent locations, dates, guest counts or budgets the guest never gave. Results include stable listing ids for follow-up calls (get_listing_details, check_availability_and_price).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "number of adult guests",
                "minimum": 1,
                "type": "integer"
              },
              "amenities": {
                "description": "hard amenity requirements the guest explicitly asked for — every listed amenity must be present",
                "items": {
                  "enum": ["private_pool", "pool", "heated_pool", "jacuzzi_hot_tub", "sea_view", "beachfront", "parking", "private_parking", "air_conditioning", "wifi", "full_kitchen", "washing_machine", "garden", "bbq", "balcony_terrace", "workspace", "baby_cot", "high_chair"],
                  "type": "string"
                },
                "type": "array"
              },
              "bathrooms": {
                "description": "minimum bathrooms requested",
                "minimum": 1,
                "type": "number"
              },
              "bedrooms": {
                "description": "minimum bedrooms requested",
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "exact arrival date YYYY-MM-DD — ONLY when the guest gave real stay dates. If they only named a month/season ('in August'), leave dates out: availability is checked per night, so a whole month demands 30 free nights",
                "format": "date",
                "type": "string"
              },
              "checkout": {
                "description": "exact departure date YYYY-MM-DD — same rule as checkin",
                "format": "date",
                "type": "string"
              },
              "children": {
                "description": "number of children — counted toward capacity together with adults",
                "minimum": 0,
                "type": "integer"
              },
              "currency": {
                "description": "currency used for price filters",
                "enum": ["EUR"],
                "type": "string"
              },
              "guests": {
                "description": "total guests (alternative to adults/children when the split is unknown)",
                "type": "integer"
              },
              "infants": {
                "description": "number of infants — noted but NOT counted toward sleeping capacity",
                "minimum": 0,
                "type": "integer"
              },
              "location": {
                "description": "a PLACE the guest actually named: city, island, region, island complex ('Cyclades') or area ('Athens south coast'). For generic geography ('the islands', 'the mountains', 'by the sea') use setting instead — do NOT guess a region the guest never said. Omit if unknown",
                "type": "string"
              },
              "max_nightly_price": {
                "description": "maximum accommodation price per night (EUR)",
                "minimum": 0,
                "type": "number"
              },
              "max_total_price": {
                "description": "maximum total stay price (EUR) when the guest gave a whole-trip budget — only applied when exact dates are also given (otherwise ignored with a note)",
                "minimum": 0,
                "type": "number"
              },
              "mood": {
                "description": "holiday-mood collection: beach=steps from the sea/coves, pools=private pool/resort calm, sunset=golden-hour terraces/romance, night=chora/town stays with evening life",
                "enum": ["beach", "pools", "sunset", "night"],
                "type": "string"
              },
              "near_metro": {
                "description": "true only when the guest wants to be near a metro/subway station (Athens & Thessaloniki only) — filters to homes within a 1 km walk of a station",
                "type": "boolean"
              },
              "property_type": {
                "description": "requested property type",
                "enum": ["villa", "apartment", "house", "studio", "maisonette"],
                "type": "string"
              },
              "query": {
                "description": "optional free-text preferences NOT captured by the structured filters, e.g. 'quiet romantic vibe with sunset views' — do not repeat structured information here",
                "type": "string"
              },
              "setting": {
                "description": "geography facet for generic wishes: 'στα νησιά'/'the islands' → island; combinable with budget/dates, replaces a location guess",
                "enum": ["island", "city", "mountain", "countryside", "beachfront"],
                "type": "string"
              },
              "sort": {
                "description": "result ordering; default recommended",
                "enum": ["recommended", "price_low_to_high", "price_high_to_low"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ffc84e3492a358626287a83068d324e9a61b1eb9033f3d167650a5c2e5c0599f"
        }
      ],
      "digest": "sha256:308c69fab5eabcd10532f18a062a7006675fcb2d631cfaf67829440ba2aa9cc0"
    }
  }
