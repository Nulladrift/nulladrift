            "properties": {
              "arguments": {
                "type": "object"
              },
              "body": {
                "type": "object"
              },
              "label": {
                "description": "What this call is for, e.g. \"book the reservation\". Shown in your console.",
                "type": "string"
              },
              "listing_id": {
                "description": "The id from find_apis",
                "type": "string"
              },
              "messages": {
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "operation": {
                "type": "string"
              },
              "path": {
                "type": "object"
              },
              "provider_key": {
                "description": "Your key for that service, used for this call only",
                "type": "string"
              },
              "query": {
                "type": "object"
              },
              "task": {
