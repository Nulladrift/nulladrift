        {
          "name": "create_market_map",
          "title": "Create a market map",
          "description": "Build a startup market map from a plain-language request, e.g. 'fintech startups in London' or 'AI coding assistants split by use case'. The map splits the market into segments and fills each with real companies from StartupHub.ai's database of startup profiles, with their logos. Returns image_url (a PNG of the finished map: show it to the user), editor_url (open the map in Market Map Maker to edit it by hand or by chat), the segments with every company and its profile link, and the full map spec as JSON. Set publish: true to also get a public link. Uses one market map credit from the account's monthly allowance. Answers within about 15 seconds: when status is 'building' the map is saved and still filling, section by section, so follow it with get_market_map (map_id) every few seconds until status is 'done', not with another create_market_map (the interactive map view in Claude does this itself and shows each section as it fills). Same result as POST /api/v1/market-maps. Needs a StartupHub.ai API key with credit (pay as you go).",
          "inputSchema": {
            "properties": {
              "prompt": {
                "description": "What to map, in plain words: a sector, theme, region, or a list of companies and their competitors.",
                "type": "string"
              },
              "publish": {
                "description": "Also publish the map at a public link. Default false (private to the account).",
                "type": "boolean"
