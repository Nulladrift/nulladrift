        {
          "name": "query_funding",
          "title": "Query funding totals",
          "description": "Answer how much funding was raised, how many rounds closed, or how many companies were founded, for a country, sector, series, and year. This is the StartupHub /analysis chart as data. Use it for questions like 'how much funding did Canadian startups raise in 2026'. dataset=rounds (default) is announced round capital in that year. dataset=startups is companies founded that year, and the dollar total is what those companies have raised to date, not capital raised during the year. dataset=funds is fund closes. dataset=investors counts firms founded, with no dollar total. country is a full English name: Canada, United States, United Kingdom. group=sector or group=country returns a breakdown. Free, no API key. Returns the count, total USD, a chart URL, and the periods or categories behind the total. Needs a StartupHub.ai API key with credit (pay as you go).",
          "inputSchema": {
            "properties": {
              "bucket": {
                "description": "Time bucket. A single year defaults to year. A range defaults to quarter.",
                "enum": ["month", "quarter", "year"],
                "type": "string"
              },
              "countries": {
                "description": "Alias of country.",
                "type": "string"
              },
              "country": {
                "description": "Full English country name, or a common alias. Examples: Canada, United States, USA, United Kingdom, UK. Comma-separated for more than one, up to 8.",
                "type": "string"
              },
              "dataset": {
                "description": "rounds = capital announced in the year (default). startups = companies founded that year. funds = funds closed. investors = firms founded.",
                "enum": ["rounds", "funds", "startups", "investors"],
                "type": "string"
              },
              "from": {
                "description": "First year, inclusive. Ignored when year is set. Default depends on dataset: rounds 2021, funds 2015, startups 2010, investors 1995. Clamped to the dataset range.",
                "type": "number"
              },
              "group": {
                "description": "How to break the total down. Default time, which is the single undivided total. Depends on dataset: funds and startups have no series; investors allows only time, sector and country. An invalid value becomes time. group=sector counts a company in every sector it carries, so that total is higher.",
                "enum": ["time", "series", "size", "sector", "country"],
                "type": "string"
              },
              "sector": {
                "description": "Sector name, for example Artificial Intelligence or Fintech. Comma-separated for more than one, up to 8.",
                "type": "string"
              },
              "sectors": {
                "description": "Alias of sector.",
                "type": "string"
              },
              "series": {
                "description": "Round stage, dataset=rounds only. Exact, case-sensitive values: Pre-Seed, Seed, Series A, Series B, Series C, Series D, Series E, Series F+, Growth, IPO, Debt, Grant, Strategic, Unlabeled. Comma-separated for more than one. Any other value is dropped.",
                "type": "string"
              },
              "split": {
                "description": "Optional second breakdown: one of the dataset dimensions, not equal to group. Anything else means none. The total still excludes double-counting.",
                "enum": ["none", "series", "size", "sector", "country"],
                "type": "string"
              },
              "to": {
                "description": "Last year, inclusive. Ignored when year is set. Default the current year. Clamped between from and the current year.",
                "type": "number"
              },
              "year": {
                "description": "Calendar year, an integer from 1970 to 2100. Sets both from and to. Example: 2026.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Query funding totals"
          },
