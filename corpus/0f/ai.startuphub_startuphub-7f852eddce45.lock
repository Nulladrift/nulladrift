        {
          "name": "find_stealth_startups",
          "title": "Find stealth startups",
          "description": "Convenience wrapper around search_startups pre-tuned for fresh-stealth deal-flow. Always sends stealth=true and sort=founded_date.desc; those two cannot be changed here. Returns stealth startups with their detected tech stack (CDN, email provider, analytics), RDAP domain registration date, and a has_known_emails flag indicating whether at least one founder/team email has been verified. Inputs: domain_tld (default 'ai,io,so,xyz,security'), with_emails (default true, which sends has_known_emails=true; pass false to drop that filter), founded_after, country, cdn, email_provider, limit (default 20, max 100). There is no offset; use search_startups with stealth=true to page further. Startup tier and higher only (Free tier 403s). Startup sees redacted emails; Pro tier sees full. Combine with list_startup_team and discover_email to surface the actual addresses. Needs a StartupHub.ai account: a free account includes 50 lookups a month.",
          "inputSchema": {
            "properties": {
              "cdn": {
                "description": "Optional comma-separated CDN filter (e.g. 'cloudflare').",
                "type": "string"
              },
              "country": {
                "description": "Optional comma-separated HQ countries, names or ISO codes.",
                "type": "string"
              },
              "domain_tld": {
                "description": "Comma-separated TLDs. Defaults to 'ai,io,so,xyz,security' (the high-signal AI-native TLDs).",
                "type": "string"
              },
              "email_provider": {
                "description": "Optional comma-separated email_provider filter (e.g. 'm365,self_hosted' to find non-Google-Workspace stealth shops).",
                "type": "string"
              },
              "founded_after": {
                "description": "Only stealth startups founded on or after this date: YYYY, YYYY-MM or YYYY-MM-DD.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Default 20, max 100.",
                "type": "number"
              },
              "with_emails": {
                "default": true,
                "description": "When true (default), only return startups with at least one verified founder/team email (has_known_emails=true). False drops that filter.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
