        {
          "name": "call_api",
          "title": "call api",
          "description": "Call any API, MCP server, chat endpoint or agent listed on StartupHub (find one with find_apis), billed to your StartupHub credits. REST: operation \"METHOD /path\" plus path, query, body. MCP: operation = tool name plus arguments. Chat: operation = model id plus messages. Agent: task; a long agent task answers with a task_id, follow it with get_api_task. label names what the call is for in your console. Add provider_key only when the listing needs your own key for that service. Needs a StartupHub.ai API key with credit (pay as you go).",
