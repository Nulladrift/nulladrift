      "instructions": "Look up startups, investors, and people. Use query_funding for how much a country or sector raised in a year. Use discover_email or validate_email for a work address, and only report an address the tool returned. Content jobs that return a job id are unfinished until the matching get call reports status done. Submit and update tools change records the signed-in account is allowed to change. Do not invent funding, headcount, scores, or emails.",
