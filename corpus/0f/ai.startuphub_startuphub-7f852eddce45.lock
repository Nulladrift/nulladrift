          "description": "One-call CRM/inbox enrichment. Pass an email, get back: the best available name and its source, the person's public Gravatar profile when they have one (name, title, company, location, verified social accounts), the domain's mail provider, matched person record (if known), the email's domain matched against startups + investors (with funding intel for VC-backed scoring), a heuristic name guess from the local part if person is unknown, and a flag for free email providers (gmail/outlook/etc) so you can skip company matching on consumer addresses. The killer endpoint for HubSpot/Salesforce auto-enrichment, Gmail/Outlook plugins, and lead-scoring pipelines. 1 profile credit (cheaper than chaining get_person_by_email + get_startup_by_domain + get_investor_by_domain separately). Needs a StartupHub.ai API key with credit (pay as you go).",
