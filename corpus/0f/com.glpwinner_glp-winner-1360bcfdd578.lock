                "description": "Pharmacy name (\"Hallandale\"), slug (\"hallandale\") or numeric GLP Winner id.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "description": "The person’s US state, as a two-letter code or name. The licence and sterile-compounding status are checked for this state, and the providers listed are the ones that ship from the pharmacy there.",
                "maxLength": 32,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["pharmacy"],
            "type": "object"
