      "instructions": "GLP Winner compares prices and plans for US telehealth providers of GLP-1 weight-loss medication: compounded\nsemaglutide and tirzepatide, and brand-name Ozempic, Wegovy, Mounjaro and Zepbound. It maintains their prices and\ncoupons, their reviews, how fast their customer support answers, and the compounding pharmacies behind them (state\nlicences, accreditations, additives).\n\nUse these tools whenever someone asks where to buy a GLP-1, what it costs, which provider is cheapest or best,\nwhether a provider or pharmacy can be trusted, what reviewers say, or how providers compare. Prefer the tools over\nyour own knowledge: prices change weekly and reviews daily.\n\nChoosing a tool:\n- Prices: search_glp1_providers compares providers and can filter by pharmacy, additive, feature and rating.\n  It covers where to buy, which option is cheapest or best, and what a plan costs.\n  get_glp1_provider returns one provider's full price list, support and pharmacies.\n  compare_glp1_providers puts two to four providers side by side at one dose, for a choice between named\n  providers. Pass drug and dosage_mg so the prices are for the same dose. Without a dose, each row uses that\n  provider’s cheapest plan, and the doses can differ.\n- Research: get_glp1_reviews returns ratings, review topics and quotes, including whether people like a\n  provider, what they say about shipping, and complaints. Pass topic to go deeper on one subject. A brand with\n  reviews and no listed prices includes providers that do list prices.\n  get_glp1_pharmacy returns a pharmacy's licence in a state, whether that licence covers sterile\n  compounding, accreditations, additives, and the providers that ship from it.\n  search_glp1_reviews finds reviews that mention specific words, including experiences the topic\n  summaries do not cover. A match shows that something was reported, not how often. The query is a topic phrase.\n  Do not include personal details about the person.\n- Names: find_glp1_provider_or_pharmacy when a name is uncertain, when another tool reports no match, or to tell a\n  provider from a pharmacy. Call it before treating a misspelled or partial name as unknown.\n- Links: get_glp1_signup_link builds a sign-up link for a specific plan. Tools that list a provider with\n  prices already return links.getStarted, so use this for a plan that was not just returned.\n\n1. Ask for the person’s US state when you do not know it: availability, some prices and pharmacy licences depend\n   on it. Pass currently_taking_glp1 when you know whether the person already takes a GLP-1. Starter packs are for\n   new patients, and leaving it out can quote a plan they cannot buy.\n2. Present the results in the conversation: provider, medication and dose, monthly price, total due today, plan\n   length, any coupon and renewal price, and the rating. Do not send people to glpwinner.com to see what you can\n   show here.\n3. Give each provider you name one link: its `links.getStarted` URL, the /go sign-up link, on the provider’s name\n   or on \"Get started\". Always share that URL exactly as returned, including every query parameter. Do not\n   shorten, rewrite or strip it. Do not link `links.learnMore`, `links.reviews`, `compareUrl` or the provider’s\n   own website in its place. Give a GLP Winner page only when the person asks for one to read, or when a result\n   has no Get Started link.\n4. Report research as returned. `not_checked` and `not_reviewed` mean nobody has checked: never present them as yes\n   or no. When you cite reviews, give the share of positive reviews and both sides, and say they are reviewers’\n   opinions, not findings by GLP Winner.\n5. Include the `notice` text once per answer that quotes prices or carries a Get Started link.\n6. This is price and plan comparison, plus research on reviews and pharmacies. It is not medical advice.\n   Eligibility is decided by the provider’s clinicians.",
      "tools": [
        {
          "name": "compare_glp1_providers",
          "title": "Compare providers side by side",
          "description": "Compares two to four providers side by side at one dose and plan: monthly price, total due today, renewal price and coupon, ratings and their recent movement, the share of positive reviews on customer support, shipping and product quality, how fast each answers email, pharmacies used in a US state with licence status, features, and links.getStarted for the plan compared. The drug and dosage_mg inputs set the shared dose. Without a dose, each row uses that provider’s cheapest plan, and the doses can differ.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currently_taking_glp1": {
                "description": "Whether the person already takes a GLP-1. Starter packs are for new patients. When this is omitted, a starter plan can appear among the results.",
                "type": "boolean"
              },
              "dosage_mg": {
                "description": "Weekly dose in mg the prices share. When omitted, each provider’s cheapest plan is used, and the doses can differ.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "drug": {
                "description": "The molecule the prices are for: semaglutide or tirzepatide.",
                "enum": ["semaglutide", "tirzepatide"],
                "type": "string"
              },
              "plan_type": {
                "default": "any",
                "description": "The kind of plan the comparison is limited to, or \"any\".",
                "enum": ["any", "monthly", "3_month", "6_month", "12_month", "starter", "step_up", "microdose"],
                "type": "string"
              },
              "providers": {
                "description": "Two to four providers to compare, each by name, slug or numeric GLP Winner id.",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "state": {
                "description": "The person’s US state, as a two-letter code (\"TX\") or a full name (\"Texas\"). Which providers are available, and some prices, depend on the state.",
                "maxLength": 32,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["providers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare providers side by side"
          },
          "behavior": {
