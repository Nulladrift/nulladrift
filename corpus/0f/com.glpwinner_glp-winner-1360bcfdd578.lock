        {
          "name": "search_glp1_providers",
          "title": "Search GLP-1 providers",
          "description": "Compares US telehealth providers of GLP-1 weight-loss medication by price, plan, rating and state. Returns each provider’s cheapest matching plan (monthly price, total due today, coupon and renewal price), its rating, and links.getStarted, the provider’s sign-up URL. Optional filters select a compounding pharmacy, an additive (none or a named additive), feature keys such as FSA/HSA or pick your pharmacy, and a minimum rating. Covers semaglutide, tirzepatide, Ozempic, Wegovy, Mounjaro and Zepbound.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "additive": {
                "description": "Formula filter. \"none\" is additive-free. Other values are additives: b12, b6, b3, glycine, l_carnitine, nad. Limits results to providers with a pharmacy in the person’s state that lists that formula.",
                "enum": ["none", "b12", "b6", "b3", "glycine", "l_carnitine", "nad"],
                "type": "string"
              },
              "currently_taking_glp1": {
                "description": "Whether the person already takes a GLP-1. Starter packs are for new patients. When this is omitted, a starter plan can appear among the results.",
                "type": "boolean"
              },
              "dosage_mg": {
                "description": "Weekly dose in mg to price, for example 2.5 for tirzepatide or 0.25 for semaglutide. When omitted, the cheapest starting dose is used.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "drug": {
                "default": "any",
                "description": "The compounded molecule (semaglutide, tirzepatide), a brand name (ozempic, wegovy, mounjaro, zepbound), or \"any\". A brand name also returns the compounded alternatives of the same molecule.",
                "enum": ["semaglutide", "tirzepatide", "ozempic", "wegovy", "mounjaro", "zepbound", "any"],
                "type": "string"
              },
              "features": {
                "description": "Feature keys that every result has, for example \"FSA_HSA\", \"PICK_PHARMACY\", \"ADDITIVE_SELECTION\", \"VIDEO_CALLS\", \"LABS_INCLUDED\" or \"24_7_SUPPORT\". An unknown key is returned with the list of known keys.",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "include_brand_name": {
                "description": "Whether results include telehealth providers that prescribe brand-name Ozempic, Wegovy, Mounjaro or Zepbound. When omitted, naming a brand includes those providers.",
                "type": "boolean"
              },
              "limit": {
                "default": 5,
                "description": "How many providers to return, from 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_monthly_price": {
                "description": "Monthly price cap in dollars. Providers whose cheapest matching plan costs more than this are excluded.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_rating": {
                "description": "Minimum composite review rating, from 1 to 5. Providers below this rating are excluded.",
                "maximum": 5,
                "minimum": 1,
                "type": "number"
              },
              "pharmacy": {
                "description": "Compounding pharmacy name or slug. Limits results to providers that fill prescriptions through that pharmacy in the person’s state.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "plan_type": {
                "default": "any",
                "description": "The kind of plan to include: month-to-month (\"monthly\"), a prepaid 3, 6 or 12-month plan, a starter pack, a step-up plan, a microdose plan, or \"any\".",
                "enum": ["any", "monthly", "3_month", "6_month", "12_month", "starter", "step_up", "microdose"],
                "type": "string"
              },
              "sort": {
                "default": "best",
                "description": "\"best\" orders by GLP Winner’s composite score, then price. \"cheapest\" orders by monthly price.",
                "enum": ["best", "cheapest"],
                "type": "string"
              },
              "state": {
                "description": "The person’s US state, as a two-letter code (\"TX\") or a full name (\"Texas\"). Which providers are available, and some prices, depend on the state.",
                "maxLength": 32,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
