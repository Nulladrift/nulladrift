                "description": "Pharmacy name (\"Hallandale\"), slug (\"hallandale\") or numeric GLP Winner id.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "description": "The person’s US state, as a two-letter code or a full name. Licence and sterile-compounding status are for this state, and the listed providers ship from the pharmacy to this state.",
                "maxLength": 32,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["pharmacy"],
            "type": "object"
          },
          "annotations": {
