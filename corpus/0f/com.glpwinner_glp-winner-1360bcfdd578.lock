        {
          "name": "search_glp1_providers",
          "title": "Search GLP-1 providers",
          "description": "Compare US telehealth providers of GLP-1 weight-loss medication by price, plan, rating and state. Returns each provider’s cheapest matching plan (monthly price, total due today, coupon, renewal), its rating, and a Get Started link to show the person. Can filter to providers that use a given compounding pharmacy, offer an additive-free or specific-additive formula, have given features (FSA/HSA, pick your pharmacy, ...) or meet a rating floor. Use for \"where can I buy\", \"cheapest\", \"best\" and \"how much\" questions about semaglutide, tirzepatide, Ozempic, Wegovy, Mounjaro or Zepbound. Always share each provider’s `links.getStarted` URL, the /go link, exactly as returned. Do not shorten, rewrite or strip it. Do not link `links.learnMore`, another GLP Winner page or the provider’s own website in its place.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "additive": {
                "description": "Only providers with a pharmacy in the person’s state that lists this formula: \"none\" for additive-free, or an additive (b12, b6, b3, glycine, l_carnitine, nad).",
                "enum": ["none", "b12", "b6", "b3", "glycine", "l_carnitine", "nad"],
                "type": "string"
              },
              "currently_taking_glp1": {
                "description": "True when the person already takes a GLP-1. Starter packs are for new patients, so leaving this out when you know the answer can quote a plan they cannot buy.",
                "type": "boolean"
              },
              "dosage_mg": {
                "description": "Weekly dose in mg to price, e.g. 2.5 for tirzepatide or 0.25 for semaglutide. Omit for the cheapest starting dose.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "drug": {
                "default": "any",
                "description": "Compounded molecule (semaglutide, tirzepatide) or a brand name (ozempic, wegovy, mounjaro, zepbound). A brand name also returns the compounded alternatives of the same molecule.",
                "enum": ["semaglutide", "tirzepatide", "ozempic", "wegovy", "mounjaro", "zepbound", "any"],
                "type": "string"
              },
              "features": {
                "description": "Feature keys every result must have, e.g. \"FSA_HSA\", \"PICK_PHARMACY\", \"ADDITIVE_SELECTION\", \"VIDEO_CALLS\", \"LABS_INCLUDED\", \"24_7_SUPPORT\". An unknown key is answered with the list of known ones.",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "include_brand_name": {
                "description": "Also list telehealth providers that prescribe brand-name Ozempic, Wegovy, Mounjaro or Zepbound. Defaults to true when a brand is named.",
                "type": "boolean"
              },
              "limit": {
                "default": 5,
                "description": "How many providers to return (1-10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_monthly_price": {
                "description": "Leave out providers whose cheapest plan costs more than this per month.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_rating": {
                "description": "Leave out providers whose composite review rating is below this (1-5).",
                "maximum": 5,
                "minimum": 1,
                "type": "number"
              },
              "pharmacy": {
                "description": "Only providers that fill prescriptions through this compounding pharmacy (name or slug) in the person’s state.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "plan_type": {
                "default": "any",
                "description": "Restrict to one kind of plan: month-to-month, a prepaid 3/6/12-month plan, a starter pack, a step-up plan or a microdose plan.",
                "enum": ["any", "monthly", "3_month", "6_month", "12_month", "starter", "step_up", "microdose"],
                "type": "string"
              },
              "sort": {
                "default": "best",
                "description": "\"best\" ranks on GLP Winner’s composite score (conversion quality and reviews), then price; \"cheapest\" ranks on monthly price.",
                "enum": ["best", "cheapest"],
                "type": "string"
              },
              "state": {
                "description": "The person’s US state, as a two-letter code (\"TX\") or name (\"Texas\"). Strongly recommended: which providers serve them and some prices depend on it.",
                "maxLength": 32,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
