        {
          "name": "get_glp1_reviews",
          "title": "Read what reviewers say",
          "description": "What reviewers say about one provider or pharmacy: rating by source, how the rating moved over the last 30, 60 and 90 days, review topics (customer support, shipping, product quality, switching) with the share of positive reviews, a summary and quotes from both sides, and quotes from Reddit with links. Pass `topic` to go deeper on one. Works for brands GLP Winner has reviews for but no prices; those answers suggest listed providers to consider. Use for \"is X any good\", \"what do people say about X’s shipping\" and \"any complaints about X\". Always share each provider’s `links.getStarted` URL, the /go link, exactly as returned. Do not shorten, rewrite or strip it. Do not link `links.learnMore`, another GLP Winner page or the provider’s own website in its place.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
