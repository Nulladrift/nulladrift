        {
          "name": "get_glp1_pharmacy",
          "title": "Get a compounding pharmacy’s profile",
          "description": "One compounding pharmacy from GLP Winner: whether it is licensed in the person’s state (licence number, expiry and the state board’s record when held), whether that licence covers sterile compounding, accreditations (503A, 503B, PCAB, ...), FDA inspection, the additives it compounds with, ratings, and the providers that ship from it to that state with Get Started links. Use for \"is this pharmacy licensed / legit / sterile\", \"what does it add to the medication\" and \"who uses this pharmacy\". Statuses of \"not_checked\" or \"not_reviewed\" mean unknown, never yes or no. Always share each provider’s `links.getStarted` URL, the /go link, exactly as returned. Do not shorten, rewrite or strip it. Do not link `links.learnMore`, another GLP Winner page or the provider’s own website in its place.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
