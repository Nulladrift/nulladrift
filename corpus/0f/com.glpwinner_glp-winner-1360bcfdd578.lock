                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "description": "The person’s US state, as a two-letter code or a full name. Prices and links in the result are for this state.",
                "maxLength": 32,
                "minLength": 2,
                "type": "string"
              },
              "topic": {
                "description": "One review topic to return in more detail, such as \"shipping\", \"communication\" (customer support), \"product quality\", \"switching\", or another topic listed in the result.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "type": {
