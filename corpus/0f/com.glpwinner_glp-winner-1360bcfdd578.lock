        {
          "name": "find_glp1_provider_or_pharmacy",
          "title": "Find a provider or pharmacy by name",
          "description": "Looks up a telehealth provider or compounding pharmacy on GLP Winner by name, including misspellings and partial names. Returns each match’s type (provider or pharmacy), rating, whether GLP Winner lists its prices or only its reviews, and links. A provider with listed prices includes links.getStarted, its sign-up URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many matches to return, from 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Provider or pharmacy name, or part of a name. Misspellings are included in the matches.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "default": "any",
                "description": "Whether the name is a telehealth provider, a compounding pharmacy, or \"any\" for both.",
                "enum": ["any", "provider", "pharmacy"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
