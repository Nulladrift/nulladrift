        },
        {
          "name": "search_glp1_reviews",
          "title": "Search review text",
          "description": "Finds public reviews and Reddit quotes that mention specific words, across every provider and pharmacy on GLP Winner or within one named provider or pharmacy. Example queries include \"arrived warm\", \"refund\", \"charged twice\" and \"prior authorization\". Returns the newest matches with the provider or pharmacy, source, star rating, date and a short excerpt. Each match records that the words were reported and does not include how often they appear.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many matches to return, from 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_rating": {
                "description": "Highest star rating to include, from 1 to 5.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "min_rating": {
                "description": "Lowest star rating to include, from 1 to 5.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Provider or pharmacy whose reviews to search. When omitted, the search covers every provider and pharmacy.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "Words to find in review text, for example \"arrived warm\", \"refund\" or \"prior authorization\". A match contains every word. \"a or b\" matches either side. Quotes match an exact phrase. The value is a topic phrase.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "since": {
                "description": "Earliest review date to include, as YYYY-MM-DD.",
                "maxLength": 40,
                "minLength": 4,
                "type": "string"
              },
              "type": {
                "default": "any",
                "description": "Whether the name is a telehealth provider, a compounding pharmacy, or \"any\" for both.",
                "enum": ["any", "provider", "pharmacy"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search review text"
          },
          "behavior": {
            "destructive": false,
