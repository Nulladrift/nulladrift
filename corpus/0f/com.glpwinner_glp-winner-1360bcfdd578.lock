        },
        {
          "name": "search_glp1_reviews",
          "title": "Search review text",
          "description": "Find public reviews and Reddit quotes that mention specific words, across every provider and pharmacy on GLP Winner or within one: \"arrived warm\", \"refund\", \"charged twice\", \"prior authorization\". Returns the newest matches with the provider or pharmacy, source, star rating, date and a short excerpt. Use it for specific experiences that the topic summaries of get_glp1_reviews do not cover. It shows that something was reported, not how often.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many matches to return (1-10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_rating": {
                "description": "Only reviews with at most this many stars.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "min_rating": {
                "description": "Only reviews with at least this many stars.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Search only this provider’s or pharmacy’s reviews. Omit to search every provider and pharmacy.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "Words to find in review text, e.g. \"arrived warm\", \"refund\", \"prior authorization\". Every word must appear; use \"a or b\" for either and quotes for an exact phrase. Pass a topic phrase, never personal details about the person.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "since": {
                "description": "Only reviews posted on or after this date (YYYY-MM-DD).",
                "maxLength": 40,
                "minLength": 4,
                "type": "string"
              },
              "type": {
                "default": "any",
                "description": "Whether the name is a telehealth provider or a compounding pharmacy; \"any\" when unsure.",
                "enum": ["any", "provider", "pharmacy"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
