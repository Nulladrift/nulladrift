                    "type": "null"
                  }
                ],
                "default": null,
                "description": "m²",
                "title": "Built Area Min"
              },
              "deal": {
                "default": "buy",
                "description": "buy = for sale (resale and new builds); rent = long-term rental",
                "enum": ["buy", "rent"],
                "title": "Deal",
                "type": "string"
              },
              "features": {
                "anyOf": [
                  {
                    "items": {
                      "enum": ["sea_view", "panoramic_view", "mountain_view", "golf_view", "beachfront", "beachside", "near_sea", "pool", "private_pool", "communal_pool", "heated_pool", "garden", "private_garden", "terrace", "garage", "parking", "lift", "air_conditioning", "underfloor_heating", "fireplace", "furnished", "unfurnished", "gated_community", "security_24h", "gym", "sauna_or_jacuzzi", "near_golf", "frontline_golf", "near_shops", "near_schools", "near_transport", "near_marina", "storage_room", "guest_apartment", "reduced_mobility", "solar_panels", "ev_charger", "smart_home", "tennis_or_padel", "south_facing", "renovated", "needs_renovation", "luxury", "price_reduced"],
                      "type": "string"
                    },
                    "maxItems": 6,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "All of these must be present",
                "title": "Features"
              },
              "keywords": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
