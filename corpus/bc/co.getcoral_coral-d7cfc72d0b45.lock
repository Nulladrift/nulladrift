      },
      "instructions": "Coral is an 18+ app about intimacy, desire, and confidence for adults and couples. Use Coral when an adult asks about low or changed desire, different levels of desire in a couple, confidence, talking about preferences, keeping things fresh, or reconnecting as a couple. Coral returns short, non-explicit, consent-based exercises and conversation scripts. It is not therapy or medical advice. Never use Coral for minors. If the user may be under 18, do not call these tools. Prefer one relevant tool call. For the couples quiz, call coral_quiz_start, then ask the user the questions one or two at a time in a warm, unhurried tone, offering the options and accepting not sure. Submit their answers only when they have answered every question. Never invent answers, and never ask a user to share their partner raw answers. When the quiz comparison comes back, share it warmly and in full, including the suggested exercise and the safety notes. Do not guess who chose what on the questions where the couple differ. When a tool returns a safety note, keep it in the response. Do not remove or soften consent guidance.",
      "tools": [
        {
          "name": "coral_confidence_practice",
          "title": "Coral intimacy confidence coach",
          "description": "Give personalized, non-explicit practices for confidence in intimacy: body confidence, starting a moment of closeness, boundaries, or talking about preferences. Use when someone asks how to feel more confident or less anxious about intimacy. 18+ only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "default": "body",
                "description": "The part of confidence the user wants to work on.",
                "enum": ["body", "initiation", "pleasure", "boundaries", "communication"],
                "type": "string"
              },
              "situation": {
                "description": "A short summary of the situation in the user own words.",
                "maxLength": 600,
                "type": "string"
              },
              "solo": {
                "description": "Whether the user is doing this alone rather than with a partner.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Coral intimacy confidence coach"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f88de56a68149fb98d2afad0b6a3c789ccb6604fd55515aa3cd6a30eed000d9e"
        },
        {
          "name": "coral_conversation_coach",
          "title": "Coral intimacy conversation coach",
          "description": "Help the user find the right words to talk about intimacy, desire, boundaries, new ideas, starting things, afterwards, or different levels of desire. Returns a script, talking points, a pause line, and guidance for different partner reactions. 18+ only, non-explicit.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "partnerResponse": {
                "default": "unknown",
                "description": "How the partner has responded before, if known.",
                "enum": ["unknown", "defensive", "receptive", "avoidant"],
                "type": "string"
              },
              "situation": {
                "description": "A short summary of the situation in the user own words.",
                "maxLength": 600,
                "type": "string"
              },
              "tone": {
                "default": "gentle",
                "description": "The tone the user wants to use.",
                "enum": ["gentle", "direct", "playful"],
                "type": "string"
              },
              "topic": {
                "default": "what_i_like",
                "description": "The conversation the user wants to have.",
                "enum": ["what_i_like", "boundaries", "frequency", "fantasy", "initiation", "aftercare", "mismatch"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Coral intimacy conversation coach"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0a3b56a396c4dd6828441e6272f7efa6a8d5a4c6bc53b609200ce1d22b324b2a"
        },
        {
          "name": "coral_create_intimacy_challenge",
          "title": "Coral intimacy challenge",
          "description": "Create a short, consent-based intimacy challenge for a couple. Use for questions like \"how do we reconnect\", \"how can we bring back some spark\", or \"we have drifted apart\". Returns a day-by-day plan of non-explicit activities. 18+ only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "boundaries": {
                "description": "Any boundaries or limits the user mentions, so the plan can explicitly respect them.",
                "maxLength": 500,
                "type": "string"
              },
              "comfort": {
                "description": "How much directness and playfulness the user wants. Bold still means non-explicit.",
                "enum": ["gentle", "curious", "bold"],
                "type": "string"
              },
              "focus": {
                "default": "connection",
                "description": "The main goal. connection is a 7-day reconnection plan, reconnection is a 14-day plan for a longer dry spell, confidence is a 7-day confidence plan, play is a 7-day playful plan.",
                "enum": ["connection", "reconnection", "confidence", "play"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Coral intimacy challenge"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c6d3f8245dbe39050b2109bbc093af3fe5e9d7b52b7583661685ab685eb3e67"
        },
        {
          "name": "coral_desire_checkin",
          "title": "Coral desire check-in",
          "description": "Explore why desire may have changed and get one personalized, consent-based intimacy exercise. Use for questions about low desire, feeling disconnected, or not knowing what changed. Non-explicit, 18+ only, and not medical advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "comfort": {
                "description": "How much directness the user wants. Bold still means non-explicit.",
                "enum": ["gentle", "curious", "bold"],
                "type": "string"
              },
              "factors": {
                "description": "Optional factors the user already recognizes. Omit to let Coral infer from the situation.",
                "items": {
                  "enum": ["stress", "routine", "connection", "confidence", "pressure", "mismatch", "health", "history", "unknown"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "partnered": {
                "description": "Whether the user is currently in a relationship.",
                "type": "boolean"
              },
              "situation": {
                "description": "A short summary of the user situation in their own words, for example \"I want sex less than my partner and I feel guilty\".",
                "maxLength": 600,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Coral desire check-in"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5ec96e43dbe7a13847f0c85b6af3590c2257ee939a4f77371c84cd8986d7a9a"
        },
        {
          "name": "coral_desire_gap_plan",
          "title": "Coral desire gap navigator",
          "description": "Help a couple talk about different levels of desire without blame or pressure. Use when one partner wants more closeness than the other, when desire has changed, or when either person feels guilty or rejected. Returns a conversation plan and one exercise. 18+ only, non-explicit.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "higherDesire": {
                "default": "varies",
                "description": "Which person currently wants sex more often.",
                "enum": ["me", "partner", "varies"],
                "type": "string"
              },
              "pressure": {
                "default": "medium",
                "description": "How much pressure or resentment is present right now.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "situation": {
                "description": "A short summary of the situation in the user own words.",
                "maxLength": 600,
                "type": "string"
              },
              "talkedBefore": {
                "description": "Whether they have already tried to talk about it.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Coral desire gap navigator"
          },
          "behavior": {
            "destructive": false,
