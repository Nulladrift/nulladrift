  "subjects": {
    "com.businessnamedesk/name-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://businessnamedesk.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "business-name-desk",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_business_name",
          "title": "Check a business name",
          "description": "Check whether a business name looks available in a US state: searches the state's business register (live in Alaska, Colorado, Connecticut, District of Columbia, Florida, Iowa, New York, Oregon, Pennsylvania and Texas; other states return the official search link), whether the .com is registered, and words that often need a regulator's approval. Returns the closest registered names, the official state search URL and a link to the full result.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "description": "The business name to check, e.g. \"Blue Ridge Coffee\"",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "description": "Two-letter code or full name of the US state, e.g. \"TX\" or \"Texas\"",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name", "state"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:229eb8a1c5e25dac79f92dd666441657a5011baca565e37b6fd901ad72896abd"
        },
        {
          "name": "list_states",
          "title": "List states searched live",
          "description": "List the US states whose business register Business Name Desk searches live, with the data source and how current it is, and the official search links for the other states.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:142af0002b4d59d981b885eeba9938dcbf811938ce5351fad48928d9265c53b0"
        }
      ],
