      },
      "serverInfo": {
        "name": "alphacitation-reference",
        "title": "AlphaCitation reference lookup",
        "version": "1.1.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call check_drug_approval before saying whether a drug is approved, authorised, licensed or registered in a country or the EU, what it is approved or indicated for, today or on a past date; give the claimed use in plain words with every qualifier, or an offered indication_id. For the US and the EU it returns the current FDA or European Commission record, which memory and web pages may not reflect. For Brazil, Canada, Colombia, Czechia, Denmark, France, Italy, Latvia, the Netherlands, Poland, Slovakia, Switzerland, Taiwan and the United Kingdom it returns the country's own competent-authority record. Answer from the record returned and cite its pointer URL and date. Unresolved means not verified, never \"not approved\". Call read_drug_label_fda_eu for what a named product's official FDA label or EU SmPC states, by section. Call lookup_precedent_ruling for an AlphaCitation ruling identifier (ACPREC-YYYY-NNNN); a ruling settles no claim today, the current record beside it does. Which record settles a claim is decided under the AlphaCitation Evidence-Authority Standard (EAS-Prime, https://alphacitation.com/standards/evidence-authority).",
      "tools": [
        {
          "name": "check_drug_approval",
          "title": "Is a drug FDA or EU approved?",
          "description": "Answers whether a drug or medicine is approved, authorised, licensed or registered (for example FDA approved, or authorised in the EU) in a country or the EU, or approved, registered, authorised, licensed or indicated for a condition or use, today or on a past date, and which official record settles it. Records held: the FDA's for the US (approvals on Drugs@FDA, prescribing information on DailyMed) and the European Commission's for centrally authorised EU and EEA medicines, and each country's own competent-authority register for Brazil, Canada, Colombia, Czechia, Denmark, France, Italy, Latvia, the Netherlands, Poland, Slovakia, Switzerland, Taiwan and the United Kingdom, each answer with the record's date and pointer URL. In any other market the answer names the competent authority where one is identified; where that authority's own record of the drug is read, it settles registration only, not a use. Otherwise the claim is not settled, and the answer points to the authority's own register or product information: a route to verification, not evidence. A claim is read with every qualifier it states (population, stage, line, biomarker, regimen, combination) and only where it names one listed condition exactly: a broader or narrower condition never stands in for it, and the answer is then unresolved with the closest listed conditions. Unresolved means the claim could not be verified from a held record; it is not evidence that the drug is or is not approved. supported_attested (the holder's own label states the claim), settling_record_identified and reference_only do not settle a claim. Not for dosing, safety advice, prices, shortages or news.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claim": {
                "description": "Optional: the use asked about, in plain words with every qualifier (obstructive sleep apnea in adults with obesity). Absent, the question is whether the drug is approved at all.",
                "type": "string"
              },
              "date": {
                "description": "Optional: the date asked about, YYYY-MM-DD. Defaults to today (UTC).",
                "type": "string"
              },
              "indication_id": {
                "description": "Optional, in place of claim: a listed condition's identifier, as an unresolved answer offers it.",
                "type": "string"
              },
              "market": {
                "description": "US, EU, or another country's ISO 3166-1 alpha-2 code (DE, GB, AE).",
                "type": "string"
              },
              "medicine": {
                "description": "Brand or active substance name, for example Zepbound or tirzepatide.",
                "type": "string"
              },
              "min_age_years": {
                "description": "Optional, with a claim: the youngest age in years it covers.",
                "maximum": 120,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["market", "medicine"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "abstention": {
                "type": ["object", "null"]
              },
              "credit": {
                "type": ["object", "null"]
              },
              "records": {
                "type": "array"
              },
              "referral": {
                "description": "For an answer that does not settle: where to verify the claim at the market's own authority (destinations, most specific first), what to search for, and the next step. A route to verification, not evidence.",
                "type": ["object", "null"]
              },
              "relation": {
                "enum": ["agrees", "agrees_narrower", "disagrees", "insufficient"],
                "type": "string"
              },
              "status": {
                "enum": ["settled", "settling_record_identified", "supported_attested", "reference_only", "unresolved"],
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "unresolved": {
                "type": "array"
              }
            },
            "required": ["records", "relation", "status", "summary", "unresolved"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Is a drug FDA or EU approved?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4d790eb7ac950de498772479376bf543eed1c2a4820d86ca9bc21bb34269df8c"
        },
        {
          "name": "lookup_precedent_ruling",
          "title": "A numbered AlphaCitation ruling on an evidence conflict",
          "description": "For one AlphaCitation ruling identifier (ACPREC-YYYY-NNNN): what was decided about an evidence conflict, why, on which records, its status (settled, unresolved or superseded), with the current governing record for its medicine, market and date. A ruling is not evidence and decides no claim today; the current record does. Not for dosing, prices, shortages or news.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional: the date for the current record, YYYY-MM-DD. Defaults to today (UTC).",
                "type": "string"
              },
              "id": {
                "description": "The ruling identifier, for example ACPREC-2026-0001.",
                "pattern": "^ACPREC-[0-9]{4}-[0-9]{4}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "AlphaCitation precedent ruling"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a09cd1e4f5e6d1293780637946acb4609ae28eb8c9f4c415536f453815762b9b"
        },
        {
          "name": "read_drug_label_fda_eu",
          "title": "What does a drug's FDA or EU label say?",
          "description": "Answers what a drug's FDA label (US prescribing information) or EU summary of product characteristics (SmPC) says, today or on a past date: what it is approved for and in whom, dosage, contraindications, boxed warning, warnings, pregnancy, breastfeeding, children, older people, adverse reactions, interactions, overdose, pharmacology, storage, approval facts and the label's version history. From DailyMed and Drugs@FDA (US) and the European Commission's product information (EU). Each answer quotes the record's own words for the section, with its section number, version, effective date, SHA-256 and address; each SmPC of a product is given apart. Whether a particular use falls within the indications text is not decided here. Where the record cannot be read, matched or confirmed for the date, no text is given and the answer is unresolved, with a reason code. Not for personal dosing, timing or interaction advice, prices, shortages or news.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "application": {
                "description": "Optional: a US NDA, ANDA or BLA number or an EMA product number (EMEA/H/C/002677), for one authorisation.",
                "type": "string"
              },
              "date": {
                "description": "Optional: the date asked about, YYYY-MM-DD. Defaults to today (UTC).",
                "type": "string"
              },
              "market": {
                "description": "US (FDA) or EU (centrally authorised medicines).",
                "enum": ["US", "EU"],
                "type": "string"
              },
              "medicine": {
                "description": "Brand or active substance name, for example Jardiance or empagliflozin.",
                "type": "string"
              },
              "product": {
                "description": "Optional: a strength or form as the label names it (395 mg, solution for injection), among several labels.",
                "type": "string"
              },
              "section": {
                "description": "Optional, with topic history and since: the section (a topic name) whose change is shown.",
                "type": "string"
              },
              "since": {
                "description": "Optional, with topic history and section: the earlier version's date, YYYY-MM-DD.",
                "type": "string"
              },
              "topic": {
                "description": "The label section to read; approval gives the approval facts, history the versions, pharmaceutical_particulars storage and excipients.",
                "enum": ["approval", "indications", "dosage", "dosage_forms", "contraindications", "boxed_warning", "warnings_precautions", "adverse_reactions", "interactions", "specific_populations", "pregnancy", "lactation", "pediatric", "geriatric", "overdose", "pharmacodynamics", "pharmacokinetics", "pharmaceutical_particulars", "history"],
                "type": "string"
              }
            },
            "required": ["market", "medicine", "topic"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "array"
              },
              "credit": {
                "type": ["object", "null"]
              },
              "records": {
                "type": "array"
              },
              "status": {
                "enum": ["record_text", "record_facts", "unresolved"],
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "unresolved": {
                "type": "array"
              }
            },
            "required": ["attribution", "records", "status", "summary", "unresolved"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "What does a drug's FDA or EU label say?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4e13c5e41b9c5f510cf8a9861769b54f52b22093ae1becb4531b49e040a1806e"
        }
      ],
