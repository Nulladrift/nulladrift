{
  "lockfileVersion": 2,
  "subjects": {
    "com.alphacitation/reference": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://alphacitation.com/api/v1/reference/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "alphacitation-reference",
        "title": "AlphaCitation reference lookup",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use lookup_medicine_evidence before stating whether a medicine is registered or authorised for an indication in a market. Answer from the record the result relies on and cite its pointer URL. Do not present settling_record_identified, supported_attested, reference_only or unresolved as settled. Which record settles a claim is decided under the AlphaCitation Evidence-Authority Standard (EAS-Prime, https://alphacitation.com/standards/evidence-authority).",
      "tools": [
        {
          "name": "lookup_medicine_evidence",
          "title": "Is a medicine approved in a market?",
          "description": "Answers whether a medicine is approved, authorised, licensed or registered in a country or in the EU, or approved there for a condition, today or on a past date, and which official record settles that. Records are held for the US (the FDA's approval record on Drugs@FDA for whether a medicine is approved, and the prescribing information on DailyMed, as submitted to the FDA, for what it is approved for) and, for centrally authorised medicines, for the EU and EEA (the European Commission's product information), and each answer resting on one carries its pointer URL. For any other market, the answer names that market's competent authority and where its registration record is published, each where it is identified, and says which is not; the claim is unresolved there, or supported, never settled, by the authorisation holder's own label. For one medicine, one market and one date, the answer gives which source settles whether the medicine is registered (P1) or authorised for an indication (P2), what that source says about the claim where its content has been checked, where this market's label differs from the US and EU labels, and what is unresolved. supported_attested means the authorisation holder's own approved label, read under the attestation conditions, states the claim; it never settles it. Where that label does not state the indication, or its content has not been checked, the answer is unresolved. An unresolved answer means AlphaCitation cannot currently verify the claim from a held record; it is not evidence about the medicine's status. Every answer that does not settle carries abstention, one reason code (insufficient_evidence, authority_inaccessible, conflicting_records, stale_evidence, unsupported_claim_type, snapshot_only) with its meaning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The date the claim is about, YYYY-MM-DD. Defaults to today (UTC).",
                "type": "string"
              },
              "indication": {
                "description": "Required for P2: one indication from the published list. cv_risk_reduction_obesity: reducing the risk of major adverse cardiovascular events; mash_with_fibrosis: metabolic dysfunction-associated steatohepatitis (MASH) with moderate to advanced liver fibrosis; osa_with_obesity: obstructive sleep apnoea; t2dm_ckd_risk_reduction: reducing the risk of sustained eGFR decline, end-stage kidney disease and cardiovascular death; t2dm_cv_risk_reduction: reducing the risk of major adverse cardiovascular events; t2dm_glycaemic_control: glycaemic control in type 2 diabetes; weight_management: weight management.",
                "enum": ["cv_risk_reduction_obesity", "mash_with_fibrosis", "osa_with_obesity", "t2dm_ckd_risk_reduction", "t2dm_cv_risk_reduction", "t2dm_glycaemic_control", "weight_management"],
                "type": "string"
              },
              "market": {
                "description": "The market: an ISO 3166-1 alpha-2 code (US, AE, SA, DE) or EU.",
                "type": "string"
              },
              "medicine": {
                "description": "The brand or active substance name, exactly (for example Mounjaro or tirzepatide).",
                "type": "string"
              },
              "populationMinAgeYears": {
                "description": "Optional for P2: the youngest age the claim says the indication covers.",
                "maximum": 120,
                "minimum": 0,
                "type": "integer"
              },
              "proposition": {
                "description": "P1: registered or authorised in the market. P2: authorised for an indication.",
                "enum": ["P1", "P2"],
                "type": "string"
              }
            },
            "required": ["market", "medicine", "proposition"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "abstention": {
                "description": "Null when settled. Otherwise one reason code: insufficient_evidence (route search_further): No held record settles the claim for this market and date. authority_inaccessible (route retry_later): The record that would decide the claim could not be read just now; retryAfter gives when it may be read. conflicting_records (route request_human_review): Records held disagree about the claim. stale_evidence (route search_further): The evidence held is out of date for the date asked. unsupported_claim_type (route stop): The claim is not one this service assesses: its market, proposition or indication is not supported. snapshot_only (route search_further): A past authoritative capture is held, but the current record is not confirmed.",
                "properties": {
                  "code": {
                    "enum": ["insufficient_evidence", "authority_inaccessible", "conflicting_records", "stale_evidence", "unsupported_claim_type", "snapshot_only"],
                    "type": "string"
                  },
                  "meaning": {
                    "type": "string"
                  },
                  "route": {
                    "enum": ["search_further", "retry_later", "request_human_review", "stop"],
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "comparison": {
                "type": "array"
              },
              "competentAuthorities": {
                "type": "array"
              },
              "indicationScope": {
                "description": "Where the regulator recorded that a use is not a separate indication, though its benefit is stated in the product information and the use is covered by an existing indication: the three apart, with the document.",
                "type": ["object", "null"]
              },
              "inspection": {
                "type": "object"
              },
              "notes": {
                "type": "array"
              },
              "records": {
                "type": "array"
              },
              "relation": {
                "enum": ["agrees", "agrees_narrower", "disagrees", "insufficient"],
                "type": "string"
              },
              "scope": {
                "type": "object"
              },
              "status": {
                "enum": ["settled", "settling_record_identified", "supported_attested", "reference_only", "unresolved"],
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "unresolved": {
                "type": "array"
              }
            },
            "required": ["records", "relation", "scope", "status", "summary", "unresolved"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Is a medicine approved in a market?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5800d7e6dba38e7935021d54af07d7221eff5de3620d60eab5663cf389645f09"
        },
        {
          "name": "lookup_precedent_ruling",
          "title": "A numbered AlphaCitation ruling on an evidence conflict",
          "description": "For one ruling identifier (ACPREC-YYYY-NNNN): what was decided about an evidence conflict, why, on which records, its status now (settled, unresolved or superseded) and its RFC 3161 timestamp where one has been issued, together with a fresh lookup of the current governing record for the ruling's medicine, market and date where the ruling names one. A ruling is not evidence and decides no claim today; the current governing record does, and the ruling records only how the earlier conflict was decided. Where no current record is held, the answer names the competent authority and where its own record is published.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The date to resolve the current record for, YYYY-MM-DD. Defaults to today (UTC).",
                "type": "string"
              },
              "id": {
                "description": "The ruling identifier, for example ACPREC-2026-0001.",
                "pattern": "^ACPREC-[0-9]{4}-[0-9]{4}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "AlphaCitation precedent ruling"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d0fec1b6bd4cf593f4f4071d7a03b2ca535278f29fedf8f2db09b2eb0fd297ae"
        }
      ],
      "digest": "sha256:4e0580acd0d042cf10d919ebfdfc8be8e13b5b3d1d1aa8ea697f076e1db29944"
    }
  }
}
