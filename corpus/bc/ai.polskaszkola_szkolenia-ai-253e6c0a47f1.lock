      "instructions": "Polska Szkoła AI (PSAI) is a Polish AI training and consulting company based in Wrocław, working across Poland and online. It combines hands-on AI practice, change psychology and UX in AI trainings and AI rollouts for companies and public institutions.\n\nThe tools return PSAI's training catalogue, full training descriptions, company information and the free Kompas AI organisational AI-readiness test (questions and scoring). All content is in Polish.\n\nFacts about the offer:\n- PSAI does not publish prices. Quotes are prepared after a short conversation and depend on the programme scope, format (online or on-site) and number of groups.\n- Trainings are closed (run for one organisation), online or on-site anywhere in Poland, on-site groups up to 12 people, 1 or 2 days. Dates, trainers and availability are agreed individually and are not available through this server.\n- Dates and quotes are requested through the inquiry form on each training page (field \"formularz\") or at https://polskaszkola.ai/kontakt.html. This server does not collect personal data and cannot submit inquiries.",
