        {
          "name": "capital_withdrawal_tax",
          "title": "Pension withdrawal tax",
          "description": "Tax on a lump-sum withdrawal from the pension fund (2nd pillar) or pillar 3a in every Swiss commune, from the official ESTV tax calculator: CHF 100,000, 250,000, 500,000 or 1,000,000, single or married, payment at 65, federal + cantonal + communal tax without church tax. Give a commune (name, postcode or BFS number) for its tax, rate and rank, a canton for its lowest and highest communes, or nothing for the national lowest and highest. Lump sums in the same year are added together; pillar3a_tax calculates other amounts for one commune.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Withdrawn capital in CHF: 100000, 250000, 500000 or 1000000 (default 500000).",
                "enum": [100000, 250000, 500000, 1000000],
                "type": "number"
              },
              "canton": {
                "description": "Canton as 2-letter abbreviation, e.g. \"ZH\", \"GE\", \"TI\". Lists every commune of the canton.",
                "type": "string"
              },
              "commune": {
                "description": "Swiss commune: official name, BFS number or 4-digit postcode, e.g. \"Winterthur\", \"230\" or \"8400\". «8001 Zürich» and «Basel (BS)» also work.",
                "type": "string"
              },
              "household": {
                "description": "single (one person) or married (married couple).",
                "enum": ["single", "married"],
                "type": "string"
              },
              "limit": {
                "description": "How many communes to list when ranking a canton or Switzerland, e.g. 10 (default 10).",
                "type": "number"
              }
            },
            "type": "object"
          },
