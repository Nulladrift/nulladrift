        {
          "name": "commute_cost",
          "title": "Commute cost",
          "description": "Monthly commute cost between two Swiss places: by car at the official Swiss average fuel price (BFS) and by electric car at the home commune official electricity tariff (ElCom H4), plus the public-transport journey time (Swiss timetable). Distance defaults to straight line × 1.3 between the stations (labelled estimate) unless km_one_way is given. Public-transport fares are not open official data and are not included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consumption_l": {
                "description": "l/100 km, default 7",
                "type": "number"
              },
              "days_per_month": {
                "description": "Commuting days per month, e.g. 20 (default 20).",
                "type": "number"
              },
              "ev_kwh": {
                "description": "kWh/100 km, default 18",
                "type": "number"
              },
              "from": {
                "description": "Home place: Swiss postcode or locality, e.g. \"Winterthur\" or \"8400\".",
                "type": "string"
              },
              "fuel": {
                "description": "unleaded95 or diesel",
                "type": "string"
              },
              "km_one_way": {
                "description": "Road distance one way in km, e.g. 25; omit to use the routed distance between from and to.",
                "type": "number"
              },
              "to": {
                "description": "Work place: Swiss postcode or locality, e.g. \"Zürich\" or \"8001\".",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              }
            },
            "type": "object"
