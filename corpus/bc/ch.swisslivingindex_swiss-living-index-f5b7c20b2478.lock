              "income": {
                "description": "Taxable gross yearly income in CHF, e.g. 100000.",
                "type": "number"
              },
              "married": {
                "description": "true for a married couple (joint taxation), false or omitted for a single person.",
                "type": "boolean"
              },
              "wealth": {
                "description": "Net wealth in CHF for the wealth tax, e.g. 250000 (default 0).",
                "type": "number"
              }
            },
            "required": ["commune", "income"],
            "type": "object"
          },
          "outputSchema": {
