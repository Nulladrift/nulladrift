      "instructions": "Swiss Living Index: official Swiss data for the 26 cantons and about 2,100 communes (taxes, rents, health insurance premiums, salaries, permits, naturalisation, pensions, votes and parliament, holidays, fuel, electricity, EV charging). Every figure comes from an official Swiss source (FSO/BFS, ESTV, FOPH, SEM, SNB, ElCom, SFOE, MeteoSwiss, Parliamentary Services, cantons and communes) and carries its source and year.\n\nChoosing tools: one canton → get_canton; 2 to 4 cantons → compare_cantons; all cantons by one figure → rank_by_metric (keys from list_metrics); one commune → get_commune. Tax for one household → commune_tax; tax on CHF 100,000 across communes → tax_by_commune; a move between communes → plan_move (estimate_net_move for the money only). Health insurance: compare_health_insurers, cheapest_health_insurer, health_deductible_advice. Permits: which_permit first. Anything else: list_datasets then get_dataset.\n\nPersonal questions («how much will I get / pay», «can I …»): call the matching tool FIRST, with no arguments if you know none, BEFORE asking the user anything (never ask for details first); it returns the official figures and, where your answer depends on the person, questions_to_ask. Give the official figures, then ask those questions in the user's language; when the user answers, call the tool again with the answers. Pass only parameters the user actually gave.\n\nFor any figure about Switzerland (pensions, taxes, premiums, salaries, rents, holidays, votes, weather hazards, shop hours, fees) call a tool instead of answering from memory: the values change every year and the tools carry the official current ones.\n\nPlaces: communes by name, BFS number or postcode («8001 Zürich» and «Basel (BS)» work); cantons by 2-letter code (ZH, GE, TI). Amounts are CHF unless stated.\n\nWhen answering, cite the source and year given in the result, link the page field when present, and credit «Swiss Living Index» (CC BY 4.0). The data is information, not tax, legal or immigration advice. Pages exist in German, French, Italian and English.\n\nTechnology: CBI Software · advisory: Mirabello Consultancy.\n\nToday is 2026-11-14.",
      "tools": [
        {
          "name": "ahv_pension",
          "title": "AHV old-age pension",
          "description": "Swiss AHV/AVS old-age pension (1st pillar, AHV-Rente, rente AVS, rendita AVS). ALWAYS call this for any question about the state pension, including «how much AHV pension will I get?»: never answer a personal amount from memory. Returns the official minimum and maximum (2026, 2027), the 13th pension, reference age, early withdrawal and deferral rates, and a PERSONAL ESTIMATE computed with the law (AHVG Art. 34 formula, partial-pension scale, income splitting for married couples, child-rearing credits, couple cap, AHV 21 supplements). Pass ONLY values the user stated (never guess income, birth year, sex or retirement age). Without average_income it returns questions_to_ask: ask the user those, then call again with the answers. For pillar 3a or pension-fund figures use pension_figures; for tax on a lump-sum withdrawal capital_withdrawal_tax.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Current age in years, e.g. 55 (use when the user gives an age, not a birth year).",
                "type": "integer"
              },
              "average_income": {
                "description": "This person’s OWN average gross yearly income in Switzerland over the working life (AHV-liable, today’s CHF), e.g. 85000. A combined household income must be split between the spouses.",
                "type": "number"
              },
              "birth_year": {
                "description": "Year of birth, e.g. 1968 (only if the user gave it).",
                "type": "integer"
              },
              "canton": {
                "description": "2-letter abbreviation, optional: that canton's pension statistics",
                "type": "string"
              },
              "children_years": {
                "description": "Years with a child under 16 (child-rearing credits), e.g. 16.",
                "type": "number"
              },
              "contribution_years": {
                "description": "TOTAL AHV contribution years at retirement, including the years still to come (age 21 to retirement; 44 = complete, no gaps). A 55-year-old with no gaps who works to 65 has 44, not 34. Omit if unknown.",
                "type": "number"
              },
              "married": {
                "description": "true if married or in a registered partnership.",
                "type": "boolean"
              },
              "monthly_pension": {
                "description": "monthly old-age pension in CHF, optional",
                "type": "number"
              },
              "months": {
                "description": "months with an old-age pension in the year, 1 to 12, default 12",
                "type": "number"
              },
              "retirement_age": {
                "description": "Planned pension start age, e.g. 64 (early) or 67 (deferred).",
                "maximum": 70,
                "minimum": 62,
                "type": "number"
              },
              "sex": {
                "description": "female or male (reference age, AHV 21 supplement).",
                "enum": ["female", "male"],
                "type": "string"
              },
              "spouse_average_income": {
                "description": "Spouse’s average gross yearly income, today’s CHF, e.g. 40000.",
                "type": "number"
              },
              "spouse_contribution_years": {
                "description": "Spouse’s full contribution years, e.g. 44.",
                "type": "number"
              },
              "statistics": {
                "description": "true to add the average pension of every canton.",
                "type": "boolean"
              },
              "years_married": {
                "description": "Contribution years spent married, e.g. 25; omit if not stated.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              }
            },
            "type": "object"
          },
