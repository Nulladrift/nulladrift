        {
          "name": "verify_start",
          "title": "Send a verification code",
          "description": "Email a one-time verification code to an address (sign-up, sign-in, confirming an email). email59 makes the code, sends it, limits resends and expires it; the code is never returned to you. Returns an id. Uses 1 email of today's allowance. A new code to the same address replaces the one waiting there. Then call verify_check with what the person typed.",
          "inputSchema": {
            "properties": {
              "app_name": {
                "description": "Your app's name, shown in the subject and body. Optional.",
                "type": "string"
              },
              "code_length": {
                "description": "Digits in the code, 4 to 10. Default 6.",
                "type": "integer"
              },
              "expires_in": {
                "description": "Seconds the code works, 60 to 3600. Default 600.",
                "type": "integer"
              },
              "from": {
                "description": "Name before the @; the domain is always email59.com. Default verify.",
                "type": "string"
              },
              "to": {
                "description": "The address to verify.",
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
