            "properties": {
              "email": {
                "description": "Email address.",
                "type": "string"
              },
              "list_id": {
                "description": "Empty = every list.",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
