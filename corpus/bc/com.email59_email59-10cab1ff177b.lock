        {
          "name": "send_email",
          "title": "Send an email",
          "description": "Send one transactional email (receipt, code, alert, notice) to one recipient. No promotions or newsletters; from your own kid-safe mailbox also no bad language or sexual content and English text only. Otherwise it is refused with content_not_allowed and uses no allowance. Every send is read before it goes out: sexual content, phishing or pure marketing is refused with content_refused, sends must be a few seconds apart (sending_too_fast), and either pauses sending for 3 minutes (sending_paused). It goes out as HTML in a branded template with a text part; give text, html or both. Uses 1 email of today's allowance. Many recipients at once: send_campaign.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "This email's look; the account's brand otherwise.",
                "properties": {
                  "address": {
                    "type": "string"
                  },
                  "color": {
                    "type": "string"
                  },
                  "logo_url": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "button_text": {
                "type": "string"
              },
              "button_url": {
                "type": "string"
              },
              "category": {
                "description": "Default transactional. marketing is closed (marketing_not_allowed).",
                "enum": ["transactional", "marketing"],
                "type": "string"
              },
              "code": {
                "description": "The code for template code.",
                "type": "string"
              },
              "from": {
                "description": "Name before the @ (e.g. hello). The domain is always email59.com. Optional.",
                "type": "string"
              },
              "heading": {
                "type": "string"
              },
              "html": {
                "description": "HTML body.",
                "type": "string"
              },
              "list_id": {
