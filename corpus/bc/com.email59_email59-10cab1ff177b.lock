      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "email59 routes transactional email for developers and bots (no marketing; email from a kid-safe address must also be kid-safe; every email sent or received is also read by an automated AI check). 200 emails a day free, renewed daily; every $1 buys 3,636 email credits that last until used. To sign up or sign in, call auth with your email, then call auth again with the email and the 6-digit otp from the email. Send the returned session_key as 'Authorization: Bearer <session_key>' on every later request (an e59_live_ API key works too). Mail is sent from your name @email59.com; there is no domain to set up.",
      "tools": [
        {
          "name": "add_unsubscribe",
          "title": "Record an unsubscribe",
          "description": "Record an opt-out. Campaigns to that list (or every list, if list_id is empty) skip the address.",
