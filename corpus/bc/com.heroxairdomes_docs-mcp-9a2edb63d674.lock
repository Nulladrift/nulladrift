{
  "lockfileVersion": 2,
  "subjects": {
    "com.heroxairdomes/docs-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.heroxairdomes.com/api/docs-mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "herox-airdomes-docs",
        "title": "HeroX AirDomes Docs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Documentation MCP server for HeroX AirDomes. Use it to answer questions from reference docs and blog articles. It is read-only. To take actions (planning package purchases, booking a consultation) use the product MCP server at https://www.heroxairdomes.com/api/mcp.",
      "tools": [
        {
          "name": "list_blog_posts",
          "title": "List blog articles",
          "description": "List recent HeroX blog articles about air domes, fabric structures, costs and facility planning, with slugs for read_blog_post.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Number of posts (default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27b37afb000845454f4b2d47352b5b0e49e61af7494f8d647858f644bdac957e"
        },
        {
          "name": "list_docs",
          "title": "List documentation",
          "description": "List HeroX AirDomes reference documents (company and product overview, agent skill, auth/access policy) with IDs and URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0a7087bd7645111c7684281ab18e16f6aa3ea920be77b2c0483acd1bcfade690"
        },
        {
          "name": "read_blog_post",
          "title": "Read a blog article",
          "description": "Return the plain-text content of a HeroX blog article by slug from list_blog_posts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Article slug.",
                "maxLength": 200,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f8b9c4c8118c5cd4d71ddbeb5a237023e79ec457efb7255cfb5ada860a82601b"
        },
        {
          "name": "read_doc",
          "title": "Read a document",
          "description": "Return the full Markdown text of a HeroX AirDomes reference document by ID from list_docs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Document ID from list_docs.",
                "enum": ["llms", "agent_skill", "auth"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e6f718d7a3b2b530219f88471d5c0f315bfcb31019631077bf24e013e79c299"
        },
        {
          "name": "search_docs",
          "title": "Search documentation",
          "description": "Keyword search across HeroX AirDomes reference documents. Returns matching lines with their document ID. Use read_doc for full context.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Words to search for, e.g. 'warranty' or 'tennis dome cost'.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5fdc1826508f2f96db853e2200a0743447c80235cfe1e4054ed8742a7b68758"
        }
      ],
      "digest": "sha256:219428d1911d290fc8f55a4f3c6cc56c606c21a53427e53a33660f932c674063"
    }
  }
}
