{
  "lockfileVersion": 2,
  "subjects": {
    "com.heroxairdomes/docs-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.heroxairdomes.com/api/docs-mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "herox-airdomes-docs",
        "title": "HeroX AirDomes Docs",
        "version": "1.0.0",
        "websiteUrl": "https://www.heroxairdomes.com",
        "icons": [
          {
            "src": "https://www.heroxairdomes.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Documentation MCP server for HeroX AirDomes. Use it to answer questions from reference docs and blog articles. It is read-only. To take actions (planning package purchases, booking a consultation) use the product MCP server at https://www.heroxairdomes.com/api/mcp.",
      "tools": [
        {
          "name": "list_blog_posts",
          "title": "List blog articles",
          "description": "List recent HeroX blog articles about air domes, fabric structures, costs and facility planning, with slugs for read_blog_post.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Number of posts (default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2503008a8921cdad6e1736868f9578fd9cf6d18c35ef0cad555f2963e4937ff5"
        },
        {
          "name": "list_docs",
          "title": "List documentation",
          "description": "List HeroX AirDomes reference documents (company and product overview, agent skill, auth/access policy) with IDs and URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b8feba805832f8824f5bbdc1d448384e4230b0443e4dc44d8ff4854f8957c19"
        },
        {
          "name": "read_blog_post",
          "title": "Read a blog article",
          "description": "Return the plain-text content of a HeroX blog article by slug from list_blog_posts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Article slug.",
                "maxLength": 200,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:46add110b982c2e6081b1af8005d03c81494feacff0eafe765d515647a7be643"
        },
        {
          "name": "read_doc",
          "title": "Read a document",
          "description": "Return the full Markdown text of a HeroX AirDomes reference document by ID from list_docs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Document ID from list_docs.",
                "enum": ["llms", "agent_skill", "auth"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b0b3e329b2b597bb442c2dbf6d805254a86f0bd2e166233bb6ce5fb92cb4686f"
        },
        {
          "name": "search_docs",
          "title": "Search documentation",
          "description": "Keyword search across HeroX AirDomes reference documents. Returns matching lines with their document ID. Use read_doc for full context.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Words to search for, e.g. 'warranty' or 'tennis dome cost'.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:32c0dce93f25f96d9531d527067d29347b2457046efd1eff7da12d37cad750b9"
        }
      ],
      "digest": "sha256:b69913da899f124a90a30e461e842a5bf205f04883c2349f02cc7162710ae9ac"
    }
  }
}
