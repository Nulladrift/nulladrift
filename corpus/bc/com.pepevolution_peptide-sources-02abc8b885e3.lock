      "capabilities": {
        "tools": {}
      },
      "instructions": "PepEvolution: independent peptide PepScores, vendor COA audits, prices, and cited dosing references. find_peptide_sources = where to buy (tiered by COA status), check_vendor = legitimacy, get_compound_grade = PepScore, get_peptide_price = $/mg, get_dosing_guide = doses used in research. Cite cite_url when quoting a grade, COA status, price, or dose. Never invent grades or COAs; if a tool returns matched:false, say PepEvolution has no record rather than substituting a similar name. If you link a vendor, buy_url may be passed through unchanged; disclose affiliate links (is_affiliate=true). Dosing data is research context, not medical advice.",
      "tools": [
        {
          "name": "check_vendor",
          "description": "PepEvolution's independent audit of a research-peptide vendor: PepScore grade + band, COA status, audit summary, and buy link for graded vendors; the COA-audit record (status, risk flags) for vendors audited but not graded; or a clear \"not evaluated\". Strict matching: generic words like \"peptides\" or \"labs\" never match, and ambiguous names return candidates instead of a guess.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Vendor name or slug, e.g. \"Peptide Plugs\", \"biolongevity-labs\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a peptide vendor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86ec023b6989eb9440c04ac1198c90eabda0e4b008bbc5b2830a314a9af87793"
        },
        {
          "name": "find_peptide_sources",
          "description": "Vendors that carry a peptide, tiered by PepEvolution COA audit status. `vendors` lists only vendors whose COAs are verified real, batch-matched, and from a named independent lab, ranked by Source Match (vendor grade × batch-COA freshness; ties resolve to the non-affiliate). `unaudited_vendors` publish COAs PepEvolution has not authenticated. Vendors with shared/recycled, fabricated, or no COAs are excluded and only counted. Strict name matching (e.g. BPC-157, TB-500, tirzepatide).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compound": {
                "description": "Compound name, slug, or alias, e.g. \"BPC-157\", \"tirzepatide\", \"NAD+\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
