          "description": "Doses used in published research for a peptide, each row with route, caveats, and citations, plus regulatory status, evidence summary, pharmacology, safety notes, and a worked reconstitution example. Educational research context, NOT a dosing recommendation or medical advice. Covers compounds with a /dosing page; others return matched compound with has_dosing_guide:false.",
