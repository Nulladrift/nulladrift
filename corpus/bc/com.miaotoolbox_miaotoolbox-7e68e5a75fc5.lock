                      "description": "当月税前工资（元）"
                    },
                    "otherDeduction": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        }
                      ],
                      "description": "当月其他扣除（元）"
                    },
                    "socialInsurance": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        }
                      ],
                      "description": "当月个人五险一金（元）"
                    },
                    "specialDeduction": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        }
                      ],
                      "description": "当月专项附加扣除（元）"
                    }
                  },
                  "required": ["grossSalary"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "monthlyOtherDeduction": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【monthly_withholding】每月其他依法扣除（元，默认 0）"
