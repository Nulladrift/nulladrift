        {
          "name": "calculate_date",
          "title": "日期与工作日计算（妙用盒）",
          "description": "确定性日历与工作日计算（1900-2100年，内置 2025-2026 中国国务院办公厅法定节假日与调休补班）。支持 3 种操作：1) action=\"diff\" 计算两个日期间隔天数与工作日数；2) action=\"offset\" 从基准日加减 N 个工作日/自然日/周/月/年推算目标日期；3) action=\"inspect\" 查询单日星期、是否工作日、法定假日/补班及年内天数。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "action": {
                "description": "计算类型：diff（日期间隔）/ offset（日期加减推算）/ inspect（单日属性查询）",
                "enum": ["diff", "offset", "inspect"],
                "type": "string"
              },
              "baseDate": {
                "description": "【offset】基准日期 YYYY-MM-DD",
                "maxLength": 16,
                "type": "string"
              },
              "date": {
                "description": "【inspect】要查询的日期 YYYY-MM-DD",
                "maxLength": 16,
                "type": "string"
              },
              "delta": {
                "description": "【offset】加减数量（负数往前倒推）",
                "maximum": 36500,
                "minimum": -36500,
                "type": "integer"
              },
              "endDate": {
                "description": "【diff】结束日期 YYYY-MM-DD",
                "maxLength": 16,
                "type": "string"
              },
              "includeEnd": {
                "default": true,
                "description": "【diff】是否包含结束日（默认 true，两头都算）",
                "type": "boolean"
              },
              "startDate": {
                "description": "【diff】开始日期 YYYY-MM-DD",
                "maxLength": 16,
                "type": "string"
              },
              "unit": {
                "default": "workdays",
                "description": "【offset】偏移单位",
                "enum": ["workdays", "days", "weeks", "months", "years"],
                "type": "string"
              },
              "workdayRule": {
                "default": "cn_official",
                "description": "工作日规则：cn_official（中国法定节假日含调休，默认）或 standard（周一至周五）",
                "enum": ["cn_official", "standard"],
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bf81322b2aef7a73aecfcf85b9f30b491a894db1ed3f042437e81478f9856e77"
        },
        {
          "name": "calculate_interest",
          "title": "单利 / 复利 / 定投 / IRR 试算（妙用盒）",
          "description": "使用 50 位十进制精度试算四种理财与投资模型：simple（单利）、compound（复利与有效年利率 EAR）、sip（定期定投）、irr（现金流内部收益率，支持 2–120 期）。默认仅返回汇总结果；compound/sip 如需分期明细可设 includeSchedule=true 并分页（每次最多 24 期）。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "annualRatePercent": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【simple/compound/sip】年利率或预期年化收益率（%，0–1000）"
              },
              "cashFlows": {
                "description": "【irr】现金流数组（2–120 期，负数为投入、正数为回流，至少 1 次符号变化）",
                "items": {
                  "anyOf": [
                    {
                      "type": "number"
                    },
                    {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    }
                  ]
                },
                "maxItems": 120,
                "minItems": 2,
                "type": "array"
              },
              "compounding": {
                "default": "monthly",
                "description": "【compound】复利计息频率",
                "enum": ["yearly", "half_yearly", "quarterly", "monthly", "daily"],
                "type": "string"
              },
              "frequency": {
                "description": "【sip/irr】频率：sip 支持 monthly/weekly/yearly；irr 支持 yearly/quarterly/monthly",
                "enum": ["yearly", "quarterly", "monthly", "weekly"],
                "type": "string"
              },
              "includeSchedule": {
                "default": false,
                "description": "【compound/sip】是否附带分期明细（默认 false）",
                "type": "boolean"
              },
              "initialPrincipal": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【sip】初始本金（元，默认 0）"
              },
              "mode": {
                "description": "试算模式：simple / compound / sip / irr",
                "enum": ["simple", "compound", "sip", "irr"],
                "type": "string"
              },
              "periodicContribution": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【sip】每期定投金额（元）"
              },
              "periods": {
                "description": "【sip】定投总期数（1–600）",
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "principal": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【simple/compound】本金（元，>0 且 <=1万亿）"
              },
              "scheduleLimit": {
                "default": 12,
                "description": "【compound/sip】明细每页条数（1–24）",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "scheduleStart": {
                "default": 1,
                "description": "【compound/sip】明细起始期数（从 1 开始）",
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "term": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【simple/compound】投资期限数值"
              },
              "termUnit": {
                "description": "【simple/compound】期限单位：year / month / day（默认 year）",
                "enum": ["year", "month", "day"],
                "type": "string"
              },
              "timing": {
                "default": "end",
                "description": "【sip】扣款时机：end（期末，默认）或 begin（期初）",
                "enum": ["end", "begin"],
                "type": "string"
              },
              "years": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【compound】投资年数（与 term/termUnit 二选一）"
              }
            },
            "required": ["mode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
