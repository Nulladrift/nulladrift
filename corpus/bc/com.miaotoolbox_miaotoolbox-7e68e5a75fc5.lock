                "description": "【bonus_compare/reverse_annual】年度专项附加扣除总额（元，默认 0）"
              },
              "mode": {
                "description": "可选模式（省略时自动推断）/ Optional mode: monthly_withholding | bonus_compare | reverse_annual",
                "enum": ["monthly_withholding", "bonus_compare", "reverse_annual"],
                "type": "string"
              },
              "monthlyEntries": {
