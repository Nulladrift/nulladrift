            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "annualBonus": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【bonus_compare】税前年终奖金额（元）"
              },
              "annualOtherDeduction": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【bonus_compare/reverse_annual】年度其他依法扣除总额（元，默认 0）"
              },
              "annualSalary": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【bonus_compare】年度税前工资总额（不含年终奖，元）"
              },
              "annualSocialInsurance": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【bonus_compare/reverse_annual】年度个人五险一金总额（元，默认 0）"
              },
              "annualSpecialDeduction": {
                "anyOf": [
                  {
                    "type": "number"
