        {
          "name": "calculate_cn_income_tax",
          "title": "国内个税与年终奖对比试算（妙用盒）",
          "description": "按现行中国大陆个人所得税政策（月基本减除 5,000 元、7 级综合所得超额累进税率）试算：1) mode=\"monthly_withholding\" 1–12 月累计预扣明细、退税预警与汇算汇总；2) mode=\"bonus_compare\" 年终奖单独计税 vs 并入综合所得省税对比，并检测 6 大年终奖缩水无效区及临界拆分建议。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "annualBonus": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【bonus_compare】税前年终奖金额（元）"
              },
              "annualOtherDeduction": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【bonus_compare】年度其他依法扣除总额（元，默认 0）"
              },
              "annualSalary": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【bonus_compare】年度税前工资薪金总额（不含年终奖，元）"
              },
              "annualSocialInsurance": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【bonus_compare】年度个人五险一金总额（元，默认 0）"
              },
              "annualSpecialDeduction": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【bonus_compare】年度专项附加扣除总额（元，默认 0）"
              },
              "mode": {
                "description": "模式：monthly_withholding（月度累计预扣）或 bonus_compare（年终奖对比）",
                "enum": ["monthly_withholding", "bonus_compare"],
                "type": "string"
              },
              "monthlyEntries": {
                "description": "【monthly_withholding】1–12 月逐月完整收入与扣除明细",
                "items": {
                  "properties": {
                    "grossSalary": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        }
                      ],
                      "description": "当月税前工资（元）"
                    },
                    "otherDeduction": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        }
                      ],
                      "description": "当月其他扣除（元）"
                    },
                    "socialInsurance": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        }
                      ],
                      "description": "当月个人五险一金（元）"
                    },
                    "specialDeduction": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        }
                      ],
                      "description": "当月专项附加扣除（元）"
                    }
                  },
                  "required": ["grossSalary"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "monthlyOtherDeduction": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【monthly_withholding】每月其他依法扣除（元，默认 0）"
              },
              "monthlySalaries": {
                "description": "【monthly_withholding】1–12 月逐月税前月薪数组",
                "items": {
                  "anyOf": [
                    {
                      "type": "number"
                    },
                    {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    }
                  ]
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "monthlySalary": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【monthly_withholding】统一税前月薪（元，与 monthlySalaries / monthlyEntries 三选一）"
              },
              "monthlySocialInsurance": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【monthly_withholding】每月个人五险一金（元，默认 0）"
              },
              "monthlySpecialDeduction": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【monthly_withholding】每月专项附加扣除（元，默认 0）"
              },
              "monthsCount": {
                "default": 12,
                "description": "【monthly_withholding】计算月数（1–12，配合 monthlySalary 使用，默认 12）",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["mode"],
            "type": "object"
          },
