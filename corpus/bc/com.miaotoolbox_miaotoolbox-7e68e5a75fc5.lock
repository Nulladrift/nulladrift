                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "固定名义年利率（百分数，如 3.5 表示 3.5%），范围 0 至 30，最多 6 位小数"
              },
              "includeSchedule": {
                "default": false,
