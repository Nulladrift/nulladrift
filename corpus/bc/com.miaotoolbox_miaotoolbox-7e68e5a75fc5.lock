              "principal": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "贷款本金（人民币元），大于 0 且不超过 100000000，最多 2 位小数"
              },
              "scheduleLimit": {
                "default": 12,
                "description": "明细返回期数上限（1 至 24 期）",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "scheduleStart": {
                "default": 1,
                "description": "明细起始期数（从 1 开始）",
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["annualRate", "months", "principal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
