        {
          "name": "calculate_mortgage_plus",
          "title": "组合贷与提前还款（妙用盒）",
          "description": "支持两大场景：1) scenario=\"combined\" 商业贷款+公积金贷款组合试算（各自支持独立本金/期限/利率/等额本息或等额本金）；2) scenario=\"prepayment\" 一次性提前还本对比“缩短年限”与“减少月供”的省息与缩期效果。默认仅返回汇总，可选分页明细（单次最多 24 期）。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "annualRate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【提前还款】原固定年利率（%，0-30）"
              },
              "commercialMode": {
                "default": "annuity",
                "description": "【组合贷】商贷还款方式",
                "enum": ["annuity", "principal"],
                "type": "string"
              },
              "commercialMonths": {
                "description": "【组合贷】商贷期限（整月，1-600）",
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "commercialPrincipal": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【组合贷】商贷本金（元，0 < P <= 100000000）"
              },
              "commercialRate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "【组合贷】商贷固定年利率（%，0-30）"
              },
              "includeSchedule": {
