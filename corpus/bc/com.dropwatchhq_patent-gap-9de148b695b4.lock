  "subjects": {
    "com.dropwatchhq/patent-gap": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://patentgap.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "patent-gap",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "category_opportunity_report",
          "description": "PAID (x402, $0.03 USDC on Base). Full off-patent opportunity report for a category slug (see list_categories): every newly-expirable design patent with computed expiry, CPSC recall-safety band, and OFAC/OIG supplier screen, ranked by actionability. Free callers get a preview + x402 challenge.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug, e.g. 'kitchen-gadgets' (from list_categories).",
                "type": "string"
              },
              "limit": {
                "description": "Max candidates (default 25, max 60).",
                "type": "number"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:822895c8e5a1bb86dcc4e9df996b1ce2122a95572cf66415bad49fc4515872c5"
        },
        {
          "name": "list_categories",
          "description": "List the private-label product categories Patent-Gap tracks for expiring design patents.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e83b15526633e682252833a6b421968665c3c774252c5c4bc270b96be02250a7"
        },
        {
          "name": "newly_expirable",
          "description": "Cross-category feed of design patents that just became (or are about to become) free to make — i.e. fresh off-patent private-label opportunities, soonest-expiry first, already recall- and supplier-screened.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max items (default 30).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a0f9fea19a4407984478e1b6c77376f0e1cad5a936062f68f564cfe71e7db971"
        },
        {
          "name": "screen_patent",
          "description": "Screen ONE US patent by publication number (e.g. USD689332S1): compute its statutory expiry/status, join CPSC recall-safety for its category, and run an OFAC/OIG screen on the assignee. Returns the freedom-to-operate read (design-patent scope; not legal advice).",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category label to sharpen the recall match.",
                "type": "string"
              },
              "publication_number": {
                "description": "US patent publication number, e.g. USD689332S1 or US8935905B2.",
                "type": "string"
              }
            },
            "required": ["publication_number"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b1629613692ad44ef7ed4f9326a241b6d4886974bf3a0189cf77078be25f9497"
        }
      ],
      "digest": "sha256:063cafd66778b48aa300d3a9e26016029ad17a72784dc3744582411f48bfed8b"
    }
  }
