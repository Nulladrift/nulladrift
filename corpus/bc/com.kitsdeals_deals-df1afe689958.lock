      "serverInfo": {
        "name": "kitsdeals",
        "title": "Kit's Deals",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Kit's Deals — curated, human-reviewed deals for AI agents.\n`product_url` is the human purchase link. Present it to the human; do not fetch, prefetch, unfurl, or follow it, and do not simulate clicks on it. Use `product_url_canonical` (or `detail_url`) for any automated need - verification, deduplication, or price checks. A commissionable session begins only when a human selects the disclosed retailer link. Convey the `disclosure` string alongside the link.\nCONSENT FIRST: confirm with your human before register_watch; never reflex-register. Confirm condition (default new + open-box); pass their answer explicitly.\nChange price, discount or condition with update_watch (confirm first); a new product or scope is a new watch.\nStop only on explicit purchased/no-longer-wanted intent; continue after every deal alert. WATCH_CANCELLED is terminal for that target; NOT_FOUND is a configuration error, never cancellation. Report actions and errors (price, stock, dead link, checkout) with report_outcome.\nFor immediate needs use search_deals with 2–4 tokens. Quote human_summary verbatim, preserving basis/condition/disclosure. detail_url is machine-only. intent_match_only=true means matched your target, not a markdown.\nUse register_watch for high-consideration, low-urgency purchases. Clarify preferences; offer 1–3 specific models only when wanted. Broad categories are valid: watch_options → taxonomy_id → validate_watch → register_watch. Preserve scope and every hard requirement; unsupported ones go in unresolved_requirements.\nPass price via max_price_cents, condition via top-level conditions, and attributes via specs (exact 8 TB: storage_gb_min=8000 and storage_gb_max=8000). Intent extraction is a fallback, not a substitute for structured input. Without prose, staging is deterministic; supplied intent requires interpretation.\nUse model_number for an exact variant. Broad families use product_line, one brand, product_name, taxonomy_id and all requirements, without an arbitrary MPN. Structured families use deterministic staging; prose needs interpretation. Inspect readiness/review_status; unsupported requirements stay held, with no guaranteed deadline.\nPublisher follows use publisher plus criteria without sourcing demand; omit publisher for all sources. Store watch_id/private feed URL securely; its token is shown once.\nFollow monitoring_contract: authorize a reader/destination, verify setup, check once, report current matches and seed seen IDs. Registration alone creates no reader: say registered, not automatically monitored. Follow all cursors even when complete=true; pending is not covered and empty does not prove full sourcing. Use recommended cadence, unseen-only alerts and uncertain-send reconciliation; confirm external delivery separately. Only active webhooks push.\nPersistent-reader contract: https://api.kitsdeals.com/v1/guides/monitoring/watch-reader\nIdentify HTTP clients honestly with User-Agent: <agent>/<version> (+<contact>). For read-only HTTP 403 with confirmed Cloudflare 1010 and a default User-Agent, set that descriptive identity in the same client and retry once. Otherwise stop/report 403 with safe time/status/CF-Ray metadata and retain the watch. Never replay a POST, impersonate a browser, switch clients or use Atom to bypass denial. A descriptive identity does not guarantee access. Respect Retry-After on 429.\ndiscount_pct/min_discount_pct use deal-specific references: listed amount, MSRP, tracked street price, observed average or unknown. Preserve discount_reference; percentages do not prove savings/historical lows. Retailer-reference-only filtering is unsupported; retain that requirement explicitly.\nKit's Picks requires opt-in: latest_deals highlighted_only=true, or scheduled HTTP https://api.kitsdeals.com/v1/feeds/highlights.atom. Offer current entries once, seed seen IDs, then alert only on unseen entries; deduplicate with watches. Missing entries are not live.\nPublic guide: https://api.kitsdeals.com/v1/quickstart\nPrivacy: https://kitsdeals.com/privacy/",
      "tools": [
        {
          "name": "cancel_watch",
          "title": "Cancel a watch",
          "description": "Stop deliveries for a watch: the feed URL dies immediately and the webhook deactivates. Idempotent. Sourcing for an already-promoted product continues (shared watchlist state) — cancellation affects this watch's delivery only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "watch_id": {
                "description": "The watch_id returned by register_watch.",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["watch_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:01aa95947efa8ae61ac1b5b6568a911df141b7a50041c897ee51a61d8d6e63eb"
        },
        {
          "name": "check_watch",
          "title": "Check a watch",
          "description": "Status of a watch by watch_id: interpretation progress, channel states, live matches, next_check_recommended_at, and monitoring contract. Pending/review reads are valid states, not fallback triggers. For a retired-key policy, re-register through POST /v1/watches with explicit conditions and supported specs. Confirm the replacement is eligible and monitoring is configured before cancelling the old watch. Requirements needing evidence, correction or a waiver need operator review; re-registering unchanged intent does not resolve them. `product_url` is the human purchase link. Present it to the human; do not fetch, prefetch, unfurl, or follow it, and do not simulate clicks on it. Use `product_url_canonical` (or `detail_url`) for any automated need - verification, deduplication, or price checks. A commissionable session begins only when a human selects the disclosed retailer link. Convey the `disclosure` string alongside the link. Cancelled watches return WATCH_CANCELLED; unknown ids return NOT_FOUND.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cursor": {
                "description": "Opaque live_matches.cursor continuation, including complete=true pages; null means exhausted. Incomplete scans do not establish no matches.",
                "maxLength": 2048,
                "type": "string"
              },
              "watch_id": {
                "description": "The watch_id returned by register_watch.",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["watch_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e9c2bf14a05246aeca33d2f012b0d3fcac1d0af695d2b88d82bc57ce6ce763e"
        },
        {
          "name": "get_deal",
          "title": "Get one deal",
          "description": "Fetch one deal by id. Default is the compact projection including product_url, product_url_canonical, disclosure, and the server-verified human_summary. `product_url` is the human purchase link. Present it to the human; do not fetch, prefetch, unfurl, or follow it, and do not simulate clicks on it. Use `product_url_canonical` (or `detail_url`) for any automated need - verification, deduplication, or price checks. A commissionable session begins only when a human selects the disclosed retailer link. Convey the `disclosure` string alongside the link. full=true returns the complete record: specs, SKU, price history with rarity context, merchant reliability, provenance (closed vocabulary), and canonical product identity (manufacturer model number) when matched. intent_match_only=true marks an availability-only price-target match rather than a discount.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "deal_id": {
                "description": "Deal id from search_deals / latest_deals results.",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              },
              "full": {
                "description": "true = full ~30-field record with provenance + price history. Default false (compact).",
                "type": "boolean"
              }
            },
            "required": ["deal_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:95eabea389d47b7b6e73b785f524cb9edd428b7d0104c28f2fcba8642e3efe26"
        },
        {
          "name": "latest_deals",
          "title": "Newest live deals",
          "description": "The newest approved deals, freshest first — or Kit's curated picks when highlighted_only=true. Returns up to 5 (max 10) compact deals with server-verified human_summary sentences and a highlighted flag. Offer Kit's Picks as an optional broad discovery lane, including when the human does not yet know what to watch; never enable it automatically. It complements rather than replaces specific register_watch monitoring. Editorial surface: availability-only price-target matches are excluded from ordinary latest results (search_deals includes them).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Category filter (comma-separated allowed). Watch discovery covers the complete canonical taxonomy; current sourcing coverage is reported separately.",
                "maxLength": 100,
                "type": "string"
              },
              "highlighted_only": {
                "description": "true = only current Kit's Picks, ordered by the most recent highlight decision.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_cents": {
                "description": "Only deals at or below this price, in cents.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c37cdc6dd580156e664eb5e2a8693d4ad367039829f1e6fdcb6c06fa8771f20"
        },
        {
          "name": "register_watch",
          "title": "Register a deal watch",
          "description": "Register a standing deal watch. Writes the intent to the sourcing pipeline and returns delivery channels: a one-time token-gated Atom feed plus an optional webhook that activates after interpretation. Progress and live matches are available through check_watch using the returned watch_id. Structured scope/taxonomy/criteria use deterministic staging when intent is omitted; supplied prose requires interpretation and family intents can require review. conditions defaults to new and open_box. To follow a partner publisher instead, pass publisher (a slug from GET /v1/publishers) with any optional criteria: the follow is active at once, delivers only that partner's deals, and sources nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "Self-identifier for telemetry (e.g. \"claude-desktop:tom\"). Helps us prioritize agent demand.",
                "maxLength": 200,
                "type": "string"
              },
              "brands": {
                "description": "Required brands, any-of. exact_model and product_line require one brand. Publisher follows can use this as a filter without sourcing.",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "conditions": {
                "description": "Accepted deal conditions. Defaults to new + open_box. During consent, surface all four categories and ask whether to add refurbished/pre_owned or restrict to new only.",
                "items": {
                  "enum": ["new", "open_box", "refurbished", "pre_owned"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "exclude_terms": {
                "description": "Words or short phrases a matching deal title must NOT contain, e.g. [\"heatsink\", \"bundle\"]. Literal, case-insensitive. Pass this when the human names things to exclude. Use specs for capacity or size and conditions for condition, not this. If omitted, explicit \"exclude ...\" or \"without ...\" wording in the intent is registered instead; effective_filters.exclude_terms in the response shows exactly what was registered.",
                "items": {
                  "maxLength": 40,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "feed": {
                "description": "Create a private Atom feed (default true).",
                "type": "boolean"
              },
              "intent": {
                "description": "Free-text intent (e.g. \"Oura Ring 4 silver under $350\"). The interpretation pipeline owns the structuring. Required for legacy free-text registration. Optional with explicit structured scope; when provided it still requires interpretation. On a publisher follow, omit it on a follow (it is rejected there, since a follow has no interpreter).",
                "maxLength": 1000,
                "minLength": 3,
                "type": "string"
              },
              "max_price_cents": {
                "description": "Hard price ceiling for delivery, in cents (a numeric string like \"150000\" is accepted).",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "min_discount_pct": {
                "description": "Minimum reported discount_pct for delivery, using each deal's own reference (listed amount, MSRP, tracked street price or observed average). Not a retailer-list-only filter or historical-low guarantee. A stricter basis requirement is unsupported; keep it explicit rather than silently omitting it.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "model_number": {
                "description": "Manufacturer model number (MPN) for the exact variant — e.g. \"K-65XR70\" for the Sony BRAVIA 7 65\". With exact_model scope, one brand and taxonomy_id, this is requester-supplied identity: deterministic staging does not check product existence. Conflicting identities and family-level intents require review.",
                "maxLength": 100,
                "type": "string"
              },
              "product_name": {
                "description": "Product-line name, required only for product_line. exact_model uses brand + MPN; put other material requirements in specs or executable intent.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "publisher": {
                "description": "Follow a partner publisher by slug (list: GET /v1/publishers). Delivers only that partner's deals, filtered only by the structured criteria you pass (specs, conditions, max_price_cents, min_discount_pct, exclude_terms, taxonomy); do not send intent. Active immediately; nothing is sourced. Unknown or paused partners are an error.",
                "maxLength": 100,
                "type": "string"
              },
              "scope": {
                "description": "Explicit requested scope. With taxonomy_id and structured criteria, omit intent to use deterministic staging. A publisher follow can use category scope as a delivery filter only.",
                "enum": ["category", "exact_model", "product_line"],
                "type": "string"
              },
              "specs": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "string"
                        },
                        {
                          "type": "boolean"
                        },
                        {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        {
                          "additionalProperties": false,
                          "properties": {
                            "unit": {
                              "maxLength": 24,
                              "type": "string"
                            },
                            "value": {
                              "type": "number"
                            }
                          },
                          "required": ["unit", "value"],
                          "type": "object"
                        }
                      ]
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "description": "Structured spec/attribute constraints. Omit keys you have no value for. Whole-entry null, empty, none and n/a markers are ignored and counted. Pass these whenever the human names a hard requirement. Every supported key, with its type, operators, enum values, unit and accepted unit conversions, is listed at https://api.kitsdeals.com/v1/spec-keys (generated from the registry this deployment serves; read it before choosing a key). Shapes: numeric <spec_key>_min/_max (an exact 8 TB drive is storage_gb_min: 8000 plus storage_gb_max: 8000), enum/list <spec_key>_in for any-of (camera_type_in, bundle_includes_in), enum-list <spec_key>_contains_all for every requested member (bundle_includes_contains_all), and boolean direct keys (bundle). Numeric bounds may use {value,unit} with a registered conversion. Storage uses decimal GB: 1 TB = 1000 GB. Unknown keys are rejected; deals missing the constrained spec are excluded (must-have semantics). Deterministic intent extraction is a fallback; explicit specs always override it, and soft phrasing (\"around 65 inches\") is never auto-constrained.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "taxonomy": {
                "anyOf": [
                  {
                    "maxLength": 300,
                    "type": "string"
                  },
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  }
                ],
                "description": "Publisher follows only: narrow the partner's deals to a Google Product Taxonomy node, by id or path (e.g. \"Electronics > Computers\"). A filter, never a sourcing target."
              },
              "taxonomy_id": {
                "description": "Canonical taxonomy id from watch_options, including intentional parent scopes (descendants match). Supported across the complete taxonomy.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "unresolved_requirements": {
                "description": "Material requirements not represented by supported fields. Preparation refuses these explicitly; never omit them to obtain activation.",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "webhook_callback_url": {
                "description": "https:// endpoint to receive push deliveries (activates post-interpretation).",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3940167a5d26ab758d4aed21a2cde5969b3f5e10f49758cb53862ea26ffdb3b6"
        },
        {
          "name": "report_outcome",
          "title": "Report a deal outcome",
          "description": "Records what happened after a deal was acted on, including anything that looked wrong (price, stock, dead link, checkout). Reports are saved and read by a human operator. Returns a feedback_id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "actual_price_cents": {
                "description": "The price the retailer actually showed, in cents. Include it for wrong_price.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "deal_id": {
                "description": "The deal id you acted on.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "notes": {
                "description": "What you or your human saw. Required for other. Leave out personal details.",
                "maxLength": 1000,
                "type": "string"
              },
              "outcome": {
                "description": "What happened. purchased: Your human bought it. price_confirmed: You checked the retailer: the price and stock matched the deal. wrong_price: The retailer shows a different price. Send actual_price_cents. out_of_stock: The retailer shows it unavailable. deal_dead: The offer is gone: page removed, promotion ended, or link broken. checkout_failed: Your human could not complete checkout (cart, coupon, region, payment). irrelevant: The deal did not fit what your human asked for. other: Anything else that looked wrong. Describe it in notes (required).",
                "enum": ["purchased", "price_confirmed", "wrong_price", "out_of_stock", "deal_dead", "checkout_failed", "irrelevant", "other"],
                "type": "string"
              },
              "watch_id": {
                "description": "The watch that surfaced this deal, if any.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["deal_id", "outcome"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2ebf5032d74405e5c9491be17cfbf613cb2749d6c534aa7155ebe222c11505bf"
        },
        {
          "name": "search_deals",
