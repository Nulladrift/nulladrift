        {
          "name": "federal_prompt_pay_deadline",
          "title": "Federal Prompt Payment Deadlines and Interest",
          "description": "Work out when a US federal agency must pay a contractor under the Prompt Payment Act, and the late-payment interest if it paid late. Payment types: supplies_services_invoice (30 days after a proper invoice, with the 7-day constructive-acceptance rule), construction_progress (14 days after a proper progress payment request), construction_retainage (30 days after the contracting officer approves release), construction_final (the later of 30 days after the proper invoice and 30 days after acceptance, acceptance deemed on the 7th day after completion), and subcontractor (the prime pays its subcontractor within 7 days of being paid). Send the dates you have; get back the due date, the date payment may still be made without interest when the due date is a weekend or federal holiday, and, with paid_date, amount and the Treasury Prompt Payment rate you send, the days late and the interest (30-day compounding, 360-day year, at most one year). The live Treasury rate is not fetched: send the rate in effect on the day after the due date. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/federal-prompt-pay-deadline). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
