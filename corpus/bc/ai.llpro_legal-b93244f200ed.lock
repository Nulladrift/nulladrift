            "readOnly": true
          },
          "digest": "sha256:9dfbcbf771743bc23afd437b6b1016af66f6af90a0994032c01710f9de27e189"
        },
        {
          "name": "business_days_calculator",
          "title": "Business Days Calculator by Country",
          "description": "Count the business days between two dates, or find the date a number of business days after or before a date, for a country and (United Kingdom) a nation. Saturdays, Sundays and the country's public holidays are skipped, each holiday named with its date. Send start, country, and either end (to count) or add_business_days (to step; negative steps back); region ENG, WLS, SCT or NIR for the United Kingdom. Optional extra_days_off: your own closing days. Covered: US (United States (federal)), GB (United Kingdom), DE (Germany (national days)), FR (France), IE (Ireland). Any other country is refused, not guessed. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/business-days-calculator). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "add_business_days": {
                "description": "To step: how many business days after start (negative: before start), not counting start itself. 1 = the next business day. Not 0.",
                "maximum": 3000,
                "minimum": -3000,
                "type": "integer"
              },
              "country": {
                "description": "Two-letter ISO 3166 country code: US, GB (or UK), DE, FR, IE.",
                "maxLength": 2,
                "type": "string"
              },
              "end": {
                "description": "To count: the end date, YYYY-MM-DD, on or after start. Send end or add_business_days, not both.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "extra_days_off": {
                "description": "Optional: your own non-working days (company closings, a local holiday), each YYYY-MM-DD; skipped like holidays.",
                "items": {
                  "description": "",
                  "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                  "type": "string"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "label": {
                "description": "Optional label, e.g. 'notice period' (your own text, echoed).",
                "maxLength": 40,
                "type": "string"
              },
              "region": {
                "description": "United Kingdom only, required: ENG, WLS, SCT or NIR. Not used for the other countries.",
                "maxLength": 7,
                "type": "string"
              },
              "start": {
                "description": "Start date, YYYY-MM-DD.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              }
            },
            "required": ["country", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business Days Calculator by Country"
          },
