                "type": "string"
              },
              "amount": {
                "description": "Optional, with paid_date: the amount paid late (the principal interest runs on).",
                "maximum": 10000000000,
                "minimum": 0.01,
                "type": ["number", "string"]
              },
              "annual_rate_percent": {
                "description": "Optional, with paid_date and amount: the Treasury Prompt Payment interest rate in percent a year in effect on the day after the due date (4.75 for 4.75%). Not fetched; Treasury publishes it twice a year.",
                "maximum": 25,
                "minimum": 0,
                "type": ["number", "string"]
              },
              "contract_due_date": {
                "description": "Only if the contract itself names the payment due date, YYYY-MM-DD; used as given, but never before the period starts, and for construction_progress only later than the 14th day (supplies_services_invoice, construction_progress, construction_retainage).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
