          "description": "Count the federal Fair Credit Reporting Act dates for a consumer's dispute of an item on a credit report. Send the date the credit reporting agency received the dispute and, if you have them, the date the reinvestigation was completed and today's date. Get back the day the reinvestigation must be complete (30 days), the latest day if the consumer sent more information during the 30 days (45 days), the day the results must reach the consumer (5 business days after completion, skipping weekends and federal holidays), each date's weekday, weekend and holiday marks, whether the reinvestigation finished in time, and with as_of the days left or past. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/fcra-dispute-dates). Not legal, tax or financial advice.",
