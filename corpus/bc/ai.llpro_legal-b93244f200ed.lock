            "readOnly": true
          },
          "digest": "sha256:1ac1f20507a47004e327bd3ce7f33ae431decb5951a592f70d385c9a05e8284a"
        },
        {
          "name": "cobra_notice_dates",
          "title": "COBRA Notice and Election Dates",
          "description": "Count the federal COBRA deadlines after a qualifying event under an employer group health plan. Send the qualifying event date and, if you have them, the date coverage ends, whether the plan counts from the loss of coverage, the date the plan administrator was told of the event, the date the election notice was sent, and the date the person elected. Get back the employer's 30-day notice to the administrator, the 44-day election notice when the employer is the administrator, the 14-day election notice after the administrator is told, the last day of the election period (60 days after the later of the notice and the loss of coverage), the earliest date the plan may require the first premium (45 days after the election), weekend and federal holiday marks, and with as_of the days left or past. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/cobra-notice-dates). Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "administrator_notified_date": {
                "description": "Optional: date the plan administrator received notice of the event (from the employer or the person), YYYY-MM-DD; gives the 14-day election notice date.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "as_of": {
                "description": "Optional: today's date (or any date), YYYY-MM-DD, to get the days left until each date or the days past it.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "counts_from_loss_of_coverage": {
                "default": false,
                "description": "Optional: true when the plan document says notice periods run from the loss of coverage instead of the event (needs coverage_loss_date).",
                "examples": [false],
                "type": "boolean"
              },
              "coverage_loss_date": {
                "description": "Optional: date the person loses plan coverage because of the event, YYYY-MM-DD (the election period counts from it when it is later than the notice).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "election_date": {
                "description": "Optional: date the person elected COBRA, YYYY-MM-DD; gives the earliest first-premium due date and whether the election was in time.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "election_notice_date": {
                "description": "Optional: date the election notice was sent to the person, YYYY-MM-DD; gives the end of the election period.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "qualifying_event_date": {
                "description": "Date of the qualifying event (end of employment, reduction of hours, death, Medicare entitlement, divorce...), YYYY-MM-DD.",
                "examples": ["2026-11-02"],
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              }
            },
            "required": ["qualifying_event_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "COBRA Notice and Election Dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:579f96be73437d50c1048dcc7cbace9df3a9cc35961874aed21f967fc4a47306"
        },
        {
          "name": "contract_notice_dates",
          "title": "Contract Renewal and Notice Dates",
          "description": "Work out a contract's term end dates, renewal dates and the last day to give notice of non-renewal. Send the start date, the initial term in months, whether it renews automatically, the renewal term, and the notice days (notice at least N days before the term ends, or before the renewal date). Optionally send as_of to see the current term, whether the notice window is still open and the next notice deadline, max_renewals if the contract caps them, and ny_gol_5_903 to get the window in which a provider of a New York service, maintenance or repair contract must send its reminder. Weekend notice deadlines are flagged with the Friday before as a safe send-by date. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/contract-notice-dates). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Optional date to check against (today, say), YYYY-MM-DD.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "auto_renews": {
                "description": "true if the contract renews automatically unless notice is given; false if it simply ends.",
                "type": "boolean"
              },
              "initial_term_months": {
                "description": "Initial term in months (12 for one year, 36 for three years).",
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "label": {
                "description": "Optional label, e.g. 'copier lease' (your own text, echoed; not a party name).",
                "maxLength": 40,
                "type": "string"
              },
              "max_renewals": {
                "description": "Optional: the most renewal terms the contract allows (0 = none). Leave out if renewals are unlimited.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "notice_counted_from": {
                "default": "term_end",
                "description": "term_end (default): N days before the last day of the term. renewal_date: N days before the first day of the next term (one day later). Use the words of the contract.",
                "enum": ["term_end", "renewal_date"],
                "type": "string"
              },
              "notice_days": {
                "description": "Days of notice needed to stop the renewal (for auto-renewing contracts). 'At least 60 days before' = 60.",
                "maximum": 730,
                "minimum": 1,
                "type": "integer"
              },
              "ny_gol_5_903": {
                "default": false,
                "description": "true to add the New York General Obligations Law 5-903 reminder window (service, maintenance or repair contracts for property; renewal terms over one month).",
                "type": "boolean"
              },
              "renewal_term_months": {
                "description": "Each renewal term in months (default: the same as the initial term).",
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "renewals_to_show": {
                "default": 3,
                "description": "How many renewal terms to list after the first one shown (default 3, up to 40).",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "start_date": {
                "description": "First day of the contract's initial term, YYYY-MM-DD.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              }
            },
            "required": ["auto_renews", "initial_term_months", "start_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Contract Renewal and Notice Dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae044af6d8b03618874f909e56edafa0d7c2b413469683bb15f7fe880311d6ad"
        },
        {
          "name": "docket_days_rule",
          "title": "Deadline After Service (Your Rule's Days, Mail Days, Rollover)",
          "description": "Count a deadline that runs a number of days after service, using the numbers your court rule or statute states (state court, agency, arbitration, or a court order). Send the service date, the period in days (calendar or court days), the days your rule adds for the service method (mail, electronic, overnight), whether those days are added after the period's last day has been moved off a weekend or holiday (the federal Rule 6(d) way) or counted on together with the period before any move, and the holidays your court closes on. U.S. federal holidays (on their observed days) are built in and can be turned off. Get back the deadline, its weekday, every day skipped and why, and each step of the count. Answer fields: ok, verdict, result, rule, does_not, sources, observation, signature, verify. Errors: ok false with the reason (bad input, too large, hourly limit). Free. No model, no network, nothing you send is stored by the tool, and every answer is signed with LLPRO's key (check it at https://llpro.ai/docket-days-rule). Labels are your own text: emails, web addresses and long digit runs are refused. Not legal, tax or financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "added_count_in": {
                "default": "calendar_days",
                "description": "Whether the added days are calendar_days (default) or court_days, as your rule says.",
                "enum": ["calendar_days", "court_days"],
                "type": "string"
              },
              "added_days": {
                "default": 0,
                "description": "Days your rule adds for how the paper was served (for example 3 under the federal rule for mail; your state's number for mail or electronic service). 0 if none.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "added_days_when": {
                "default": "after_rollover",
                "description": "after_rollover (default; Fed. R. Civ. P. 6(d)): find the period's deadline first, moving it off a weekend or holiday, then add the days. with_period: add the days straight on from the period's last day, then move the result once.",
                "enum": ["after_rollover", "with_period"],
                "type": "string"
              },
              "count_in": {
                "default": "calendar_days",
                "description": "calendar_days (default): every day counts. court_days: only days that are not a Saturday, Sunday or holiday count.",
                "enum": ["calendar_days", "court_days"],
                "type": "string"
              },
              "days": {
                "description": "The period your rule states, in days (10, 14, 20, 21, 30 ...).",
                "maximum": 1095,
                "minimum": 1,
                "type": "integer"
              },
              "holidays": {
                "description": "Other days your court is closed or your rule calls holidays (state holidays, the day after Thanksgiving, closures), YYYY-MM-DD (up to 60).",
                "items": {
                  "description": "",
                  "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                  "type": "string"
                },
                "maxItems": 60,
                "minItems": 0,
                "type": "array"
              },
              "label": {
                "description": "Optional label, e.g. 'response to motion' (your own text, echoed; not a party name).",
                "maxLength": 40,
                "type": "string"
              },
              "rollover": {
                "default": "forward",
                "description": "forward (default): a last day on a Saturday, Sunday or holiday moves to the next day that is not one. none: no move (only if your rule says so).",
                "enum": ["forward", "none"],
                "type": "string"
              },
              "rule_cited": {
                "description": "Optional: the rule you are applying, e.g. 'Tex. R. Civ. P. 21a' (your own text, echoed; it is not read or checked).",
                "maxLength": 60,
                "type": "string"
              },
              "service_date": {
                "description": "Date of service (the day that starts the count; it is not counted), YYYY-MM-DD.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "us_federal_holidays": {
                "default": true,
                "description": "Count the 11 U.S. federal holidays, on the days federal offices observe them, as holidays (default true). Set false for a court that does not close on them, and send its holidays instead.",
                "type": "boolean"
              }
            },
            "required": ["days", "service_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Deadline After Service (Your Rule's Days, Mail Days, Rollover)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5f6267950d8289cea266261794231b8656068985a5bba5dbe2782925a11fb5d"
        },
        {
          "name": "fcra_dispute_dates",
