        {
          "name": "flag_expired_deal",
          "title": "Report an expired deal",
          "description": "Use this only when the user supplies an exact existing record id and relevant current first-party evidence showing that its offer ended or is unavailable. Do not use it for rumors, third-party summaries, speculation, or a merely blocked or unreachable page. It writes one non-destructive review signal and never removes or changes the catalog record.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "evidence_url": {
                "description": "Current first-party HTTP(S) page supporting the report. Do not submit a rumor, search result, directory, or unrelated provider page.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "note": {
                "description": "Optional concise factual observation, up to 1,000 characters; never include credentials or personal data.",
                "type": "string"
              },
              "record_id": {
                "description": "Exact existing id returned by Andrew’s Freebies search or record lookup.",
                "type": "string"
              },
              "record_type": {
                "description": "Use the record type returned by search when known; omit only when the id uniquely resolves.",
                "enum": ["trial", "entitlement"],
                "type": "string"
              },
              "reporter": {
                "description": "Optional agent or integration label, up to 120 characters; never include a person’s identity.",
                "type": "string"
              }
            },
            "required": ["evidence_url", "record_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_version": {
                "type": "string"
              },
              "flag": {
                "additionalProperties": true,
                "description": "Append-only internal review signal receipt.",
                "type": "object"
              },
              "original_record_unchanged": {
                "const": true,
                "type": "boolean"
              },
              "record": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "record_id": {
                    "type": "string"
                  },
                  "record_type": {
                    "enum": ["trial", "entitlement"],
                    "type": "string"
                  },
                  "web_url": {
                    "type": "string"
                  }
                },
                "required": ["name", "record_id", "record_type", "web_url"],
                "type": "object"
              },
              "review_status": {
                "const": "open",
                "type": "string"
              }
            },
            "required": ["api_version", "flag", "original_record_unchanged", "record", "review_status"],
            "type": "object"
