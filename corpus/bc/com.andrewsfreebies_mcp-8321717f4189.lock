        {
          "name": "get_freshness",
          "title": "Get catalog freshness",
          "description": "Use this when the user asks about verification freshness for the actionable-candidate corpus, overdue coverage, scheduler liveness, records sharing an audit outcome, or whether one exact non-directory record is still inside cadence. Directory-only leads and public services remain inspectable elsewhere but are excluded from this denominator. For one record, provide both record_type and record_id; its audit outcome still proves only the fields checked. Blocked or unknown never means expired.",
