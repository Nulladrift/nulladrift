      "instructions": "Use search for ordinary U.S. free-trial and savings questions, then fetch the best returned id before giving detailed terms. Use search_freebies only when explicit scope controls or rich normalized results are needed, then inspect a selected result with get_record. Never call flag_expired_deal without an exact existing id and relevant current first-party evidence; blocked pages and third-party rumors are not enough. Do not purchase, access accounts, submit applications, or guarantee eligibility. Actionable trial and savings results require incorporated first-party catalog evidence plus a supporting audit. An audit confirms only the normalized fields it tested and never promotes a directory-listed record by itself. A null action_url or official_action.status=withheld means the record is evidence-only and must not be recommended for action. Never treat blocked, fetch-error, unknown, or not-found as proof of expiration without the required repeated or first-party evidence. State material fees, payment or deposit requirements, geography, personalization, expiration, renewal, and cancellation terms. Present a non-null offer action_url only when the user wants to proceed, and cite source_url for current terms. Public-benefit records provide informational eligibility paths, not eligibility decisions.",
