                  "required": ["agent_instruction", "description", "id", "markdown_url", "result_type", "source_backed_matches", "title", "updated", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "api_version": {
                "description": "Andrew’s Freebies search contract version.",
                "type": "string"
              },
              "count": {
                "description": "Normalized record and repository results returned in items.",
                "minimum": 0,
                "type": "integer"
              },
              "items": {
                "description": "Ranked normalized records or, only under an explicit open-source scope, public repository results.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "action_url": {
                      "format": "uri",
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": ["string", "integer"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "record_type": {
                      "enum": ["trial", "entitlement", null],
                      "type": ["string", "null"]
                    },
                    "result_type": {
                      "enum": ["trial", "saving", "public-benefit", "open-source-repository"],
                      "type": "string"
                    }
                  },
                  "required": ["record_type", "result_type"],
                  "type": "object"
                },
                "type": "array"
