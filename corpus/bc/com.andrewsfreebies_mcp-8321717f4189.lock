            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 50,
                "description": "Maximum matching records to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "outcome": {
                "description": "Optional latest-audit outcome filter; outcomes describe evidence, not guaranteed availability.",
                "enum": ["confirmed-exact", "confirmed-partial", "terms-changed", "explicitly-expired", "moved", "blocked", "fetch-error", "not-found", "unknown"],
                "type": "string"
              },
              "record_id": {
                "description": "Optional exact non-directory record id; requires record_type and scopes totals and items to that record.",
                "maxLength": 200,
                "type": "string"
              },
              "record_type": {
                "description": "Optional corpus filter; required when record_id is provided.",
                "enum": ["trial", "entitlement"],
                "type": "string"
