        {
          "name": "search_freebies",
          "title": "Search freebies with scope controls",
          "description": "Use this when the user needs explicit corpus scope, result limits, or a rich normalized list rather than the standard citable search/fetch flow. It is read-only: the default uses site-controlled actionable U.S. trials and savings, while only an explicit open-source scope reads public GitHub. Use public-benefits only for eligibility-based services. Do not use it for purchases, account access, or guaranteed eligibility.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 12,
                "description": "Maximum normalized items to return; answer guides are reported separately.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The user's need in natural language, including provider, product, eligibility, or desired value.",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              },
              "scope": {
                "default": "auto",
                "description": "auto routes ordinary requests to actionable trials/savings and explicit public-service needs to the broader benefits corpus.",
                "enum": ["auto", "actionable", "software", "savings", "public-benefits", "open-source", "all"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
