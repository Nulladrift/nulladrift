        {
          "name": "preflight_check",
          "title": "Preflight check an x402 URL",
          "description": "Live-check an x402 URL before paying it: valid challenge, real price, token, pay-to match. Sends one unpaid request to the URL and compares the answer with our records; the verdict is ok, caution or avoid. Costs $0.005 via x402.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "method": {
                "description": "HTTP method of the paid call (default: the listing's method when the URL is listed, else GET)",
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "url": {
                "description": "The x402 endpoint you are about to pay",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Preflight check an x402 URL"
