        },
        {
          "name": "get_service_status",
          "title": "Service status",
          "description": "Free. Is a listed service up right now? Its state (up, degraded, down, or unknown when not checked yet), since when, the latest check, uptime over 24 hours, 7 and 30 days, and recent outages, from ToolVet's own checks.",
