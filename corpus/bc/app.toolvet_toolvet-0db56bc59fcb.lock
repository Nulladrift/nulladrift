        },
        {
          "name": "recommend_service",
          "title": "Recommend a service",
          "description": "Get the best 3 live, trustworthy services for a task, with reasons and call instructions. Use it when you have one concrete task; use search_services to compare more options. Costs $0.01 via x402.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "x402 for pay-per-call HTTP APIs, mcp for MCP servers",
                "enum": ["x402", "mcp"],
                "type": "string"
              },
              "max_price_usd": {
