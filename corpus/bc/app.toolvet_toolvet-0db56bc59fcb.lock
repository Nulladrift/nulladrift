        },
        {
          "name": "get_service_report",
          "title": "Service vetting report",
          "description": "Full vetting report for one service (uptime, latency, price history, security findings). Takes an id from search or recommend results. Costs $0.002 via x402.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
