        {
          "name": "scan_mcp_server",
          "title": "Scan an MCP server",
          "description": "Free. Connects to a remote MCP server (Streamable HTTP) the way an agent would, reads its tool definitions and instructions (up to a size limit) without calling any tool, and checks them for tool poisoning: hidden instructions, invisible characters, requests for credential files and more. Returns a grade A to F with findings, and says when part of the definitions was too large to check. Limited per IP.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "The remote MCP server URL, for example https://example.com/mcp",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3ef563bbb0beb71d0a9fee645077d92db577a08fbd887e4f8d6473d567834613"
        },
        {
          "name": "search_services",
          "title": "Search services",
          "description": "Search vetted, live-monitored x402 APIs and MCP servers. Returns listings ranked by relevance, trust score and usage, each with price, live status and how to call it; sponsored listings come in a separate list. For one pick for a task, use recommend_service. Costs $0.003 via x402. Each IP address gets 10 free searches a day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "x402 for pay-per-call HTTP APIs, mcp for MCP servers",
                "enum": ["x402", "mcp"],
                "type": "string"
              },
              "limit": {
                "description": "Number of results, 1 to 25 (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_usd": {
                "description": "Maximum price per call in USD",
                "minimum": 0,
                "type": "number"
              },
              "network": {
                "description": "CAIP-2 network your wallet pays on, e.g. eip155:8453",
                "type": "string"
