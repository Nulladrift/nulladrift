      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "surfaced-ai-readiness",
        "title": "Surfaced: Shopify AI readiness",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Surfaced checks how ready a Shopify store is for AI shopping assistants (ChatGPT, Copilot, Gemini, Perplexity). Call check_store_ai_readiness with a store domain to get a 0-100 score and the top issues; call explain_issue for fix steps. Only public storefront data is read; nothing is changed. To fix issues across the whole catalog, the merchant can install the Surfaced Shopify app (get_surfaced_plans).",
      "tools": [
        {
          "name": "check_store_ai_readiness",
          "title": "Check a Shopify store's AI shopping readiness",
          "description": "Scores a public Shopify store 0-100 for AI shopping assistants from its public catalog, robots.txt, policy pages and structured data, and returns the top issues with how to fix them. Read-only. Results are cached for 30 minutes; rate limited per client.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language for issue text and grade (default en)",
                "enum": ["en", "de", "fr", "es", "pt", "it", "nl", "ja"],
                "type": "string"
              },
              "store_url": {
                "description": "Store domain or URL, e.g. allbirds.com or mystore.myshopify.com",
                "type": "string"
              }
            },
            "required": ["store_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f9dcbae5a0347f759bfa5a8d537c8cf30c693cce5c5488a41646f48e2bb4c1da"
        },
        {
          "name": "explain_issue",
          "title": "Explain how to fix a readiness issue",
          "description": "Returns what an issue id from check_store_ai_readiness means and how to fix it (e.g. altText, gtin, description, crawlers, jsonld, policy:refund-policy).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "issue_id": {
                "description": "Issue id from top_issues[].id",
                "type": "string"
              }
            },
            "required": ["issue_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c2cfc74aa91359fd1eb48fc876bd946827431542614922af13732e3c1c6a6ecd"
        },
        {
          "name": "get_surfaced_plans",
          "title": "Surfaced app plans and install link",
          "description": "Lists the Surfaced Shopify app plans (Free, Pro, Growth) and the install link, for merchants who want every product scanned and safe fixes applied with undo.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
