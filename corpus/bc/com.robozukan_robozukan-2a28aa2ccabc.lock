{
  "lockfileVersion": 2,
  "subjects": {
    "com.robozukan/robozukan": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://robozukan.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "robozukan",
        "title": "ロボ図鑑 — AI接続性カタログ",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ロボ図鑑(https://robozukan.com)は、AIエージェントから操作できる物理デバイス(スマートホーム・掃除ロボ・3Dプリンター・ドローン・カメラ・ロボットアーム・移動ロボ等)の日本語カタログです。\n各デバイスにAI接続性(AI-0〜AI-5: 接続の口の有無と成熟度)と自律度(1〜3: 状態取得やフィードバックの段階)を付け、判定根拠と一次情報の出典(確認日つき)を持ちます。\n- verified=false は運営者が実機で接続確認していないことを意味します。判定は公式ドキュメントと実在する実装に基づきます。\n- 収録に無いことは「AIから操作できない」ことを意味しません(未収録なだけの場合があります)。\n- 回答でデータを使うときは、該当ページのURLと出典の確認日を添えてください。接続仕様はファーム更新やAPI変更で変わります。",
      "tools": [
        {
          "name": "get_device",
          "title": "デバイスの銘板を取得",
          "description": "1台のデバイスについて、AI接続性と自律度の判定根拠、接続口(API/SDK/MCP/ハック)、必要なひと手間、出典と確認日、関連する接続ガイドを返す。slug は search_devices の結果から取る。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "デバイスの slug(例: switchbot-hub-2)",
                "pattern": "^[a-z0-9-]{1,80}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0822462bc5907668d0f363042d6aff1b1f7b7b0dff6c9362632830b8fa36c95"
        },
        {
          "name": "get_rating_criteria",
          "title": "レーティング基準",
          "description": "AI接続性(AI-0〜AI-5)と自律度(1〜3)の判定基準を返す。数値の意味を説明するときに使う。",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8be89b803e37c1f24e11f6219aeac9c0bea32ec7b3a8811bc989033281c91f2b"
        },
        {
          "name": "list_guides",
          "title": "接続ガイドの一覧",
          "description": "機種別の接続ガイド・組み合わせレシピ・コラムの一覧(タイトル・概要・URL)を新しい順に返す。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "guide=接続ガイド / recipe=レシピ / column=コラム",
                "enum": ["guide", "recipe", "column"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:03e4b5067f4e5527c5ebbf784216543ece8b884a79c1e09ef9f582ce8753c995"
        },
        {
          "name": "search_devices",
          "title": "デバイスを検索",
          "description": "ロボ図鑑の収録デバイスを検索する。語句(製品名・ブランド・概要の部分一致)、カテゴリ、AI接続性の下限、接続口の種類で絞り込める。条件を省くと全件をAI接続性の高い順に返す。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "カテゴリ",
                "enum": ["smart-home", "vacuum", "3d-printer", "drone", "camera", "robot-arm", "mobile-robot", "agriculture", "security", "other"],
                "type": "string"
              },
              "interface_type": {
                "description": "この種類の接続口を持つデバイスに限る",
                "enum": ["cloud-api", "local-api", "sdk", "mcp-official", "mcp-community", "hack"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "最大件数(1〜50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_ai_rating": {
                "description": "AI接続性の下限(0〜5)",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "製品名・ブランド・概要に含まれる語句(例: SwitchBot, Tapo, ROS2)",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5622e2bf871df9dc090c01c7822cd64ecc2505c287b50fcbfa271e24f7fdfbe"
        }
      ],
      "digest": "sha256:853f3580f3abcabae093735c123eced40b299f20aef850fb8469454ff9f110b4"
    }
  }
}
