  "subjects": {
    "app.agentwright/claude-pricing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentwright.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "claude-pricing",
        "title": "Claude API Pricing (Agentwright)",
        "version": "1.0.0",
        "websiteUrl": "https://agentwright.app/tools/claude-api-cost-calculator/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Look up current Claude API prices and estimate costs from token counts. All tools are read-only.",
      "tools": [
        {
          "name": "compare_claude_models",
          "title": "Compare Claude model costs",
          "description": "Compare what the same workload costs on every Claude model, cheapest first. Give tokens per request and the number of requests (e.g. per user per month).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "batch": {
                "description": "Use Batch API pricing (default false)",
                "type": "boolean"
              },
              "input_tokens": {
                "description": "Input tokens per request",
                "minimum": 0,
                "type": "number"
              },
              "output_tokens": {
                "description": "Output tokens per request",
                "minimum": 0,
                "type": "number"
              },
              "requests": {
                "description": "Number of requests (default 1)",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["input_tokens", "output_tokens"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b17dbbe0e0757e5ebf458fb3334392124d2ccf138c1a4cf7eb1f6cebd82566b"
        },
        {
          "name": "estimate_claude_cost",
          "title": "Estimate Claude API cost",
          "description": "Estimate the USD cost of Claude API calls from token counts. Handles prompt caching (cache writes and reads), the Batch API 50% discount and long-prompt pricing. Returns cost per request and in total.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "batch": {
                "description": "Use Batch API pricing (default false)",
                "type": "boolean"
              },
              "cache_read_tokens": {
                "description": "Tokens read from the prompt cache per request",
                "minimum": 0,
                "type": "number"
              },
              "cache_write_1h_tokens": {
                "description": "Tokens written to the 1-hour prompt cache per request",
                "minimum": 0,
                "type": "number"
              },
              "cache_write_5m_tokens": {
                "description": "Tokens written to the 5-minute prompt cache per request",
                "minimum": 0,
                "type": "number"
              },
              "input_tokens": {
                "description": "Uncached input tokens per request",
                "minimum": 0,
                "type": "number"
              },
              "model": {
                "description": "Model id, e.g. claude-fable-5-2, claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5",
                "type": "string"
              },
              "output_tokens": {
                "description": "Output tokens per request (includes thinking tokens)",
                "minimum": 0,
                "type": "number"
              },
              "requests": {
                "description": "Number of requests (default 1)",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["input_tokens", "model", "output_tokens"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:997b0186f8b456de077ec81a56a9545762024132052274917042a4a13f0845ca"
        },
        {
          "name": "list_claude_models",
          "title": "List Claude models and prices",
          "description": "List current Claude API models with their prices in USD per million tokens: input, output, prompt-cache writes (5 min / 1 h), cache reads, and the Batch API discount.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b6371a2d60db9fc5a495fcacf728d72e5d543b433153895ea5a54b9e8b2f582"
        }
      ],
      "digest": "sha256:662cc0530eee432f10247b167ad7bc802991f45cd0584a84c674a4b0bdec747e"
    }
  }
}
