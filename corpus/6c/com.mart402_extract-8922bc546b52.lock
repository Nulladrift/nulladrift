        {
          "name": "jp_consumption_tax",
          "title": "Jp Consumption Tax",
          "description": "Consumption tax: per-rate invoice rounding, qualified-invoice validation, simplified taxation, 20% special. $0.01/call. Deterministic, cites primary sources; errors and unverified rules are never billed. Required by mode (default invoice_totals): invoice_totals -> lines; validate_invoice -> document; simplified -> taxable_sales_excl_yen, category; two_percent -> taxable_sales_excl_yen, taxable_period_start, taxable_period_end.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "Calculation reference date YYYY-MM-DD (default today); selects the rules version",
                "format": "date",
                "type": "string"
              },
              "category": {
                "description": "Simplified-taxation business class 1-6",
                "type": "string"
              },
              "document": {
                "description": "Qualified-invoice fields to validate (registration_number etc.)",
                "type": "object"
              },
              "lines": {
                "description": "Invoice lines [{amount_yen, qty, rate_key: standard|reduced}]",
                "type": "array"
              },
              "mode": {
                "default": "invoice_totals",
