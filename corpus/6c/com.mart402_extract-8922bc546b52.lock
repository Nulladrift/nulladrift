      "instructions": "Mart402: pay-per-call APIs for AI agents - documents & web, Japan statutory calculations, calibrated vision (x402, USDC on Base; no account, no API key). Free tools work immediately. Paid tools called without x_payment return the exact payment requirements instead of charging you. Typical workflow: check an unfamiliar x402 seller for free (search_x402_services, operator_history), pay it, then verify what it returned (verify_invoice, document_pipeline; free samples via get_sample). Cheapest first real calls to test your payment loop end to end: jp_business_days at $0.003 (deterministic, LLM-free) or pdf_info at $0.001. Line-specific endpoints with smaller tool sets: /mcp/docs, /mcp/jp, /mcp/vision, /mcp/market. Docs: https://mart402.com/agents.md",
      "tools": [
        {
          "name": "document_pipeline",
          "title": "Document Pipeline",
          "description": "One call: PDF invoice to parse (hallucination-guarded OCR) + field extraction + arithmetic verification (+optional issuer enrich). Flat $0.05/document; inputs validated before payment. Choose this when a PDF is an invoice/receipt and you want parse + field extraction + arithmetic verification in one paid call; for text only use parse_document.",
          "inputSchema": {
            "properties": {
              "enrich": {
                "default": false,
                "description": "Also run issuer enrichment on the parsed invoice",
                "type": "boolean"
              },
              "url": {
                "description": "Absolute http(s) URL of the input (web page or PDF, per tool)",
                "type": "string"
              },
              "x_payment": {
                "description": "Optional: base64 X-PAYMENT header value (x402 exact scheme, USDC on Base mainnet). Omit it to receive the payment requirements (accepts[] + docs) for this call without being charged.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "body": {
                "description": "JSON body of the underlying call (see /samples/{product} for each product's shape)"
              },
              "how_to_pay": {
                "type": "string"
              },
              "payment_required": {
                "description": "true when status is 402: body holds x402 payment terms, not a result. Pay and call again with x_payment",
                "type": "boolean"
              },
              "receipt_id": {
                "description": "set on paid results; free re-fetch via get_receipt",
                "type": "string"
              },
              "status": {
                "description": "HTTP status of the underlying call (200 result, 402 payment terms, 4xx input error)",
                "type": "integer"
              }
            },
            "required": ["body", "status"],
            "type": "object"
          },
