      "tools": [
        {
          "name": "vendor_legit_check",
          "description": "Screen a vendor, store, or group-buy (by name or URL) for legitimacy before paying. Returns a reputation read, a red-flag checklist (e.g. no MOQ disclosed, brand-new vendor), and Reddit community sentiment. Use this to assess scam/non-delivery risk for a hobby/collectibles purchase or group buy.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Vendor, store, or group-buy name or URL, e.g. 'novelkeys' or a Kickstarter link.",
                "type": "string"
              },
              "reddit": {
                "description": "Include live Reddit sentiment (default true). Set false for a faster, lighter check.",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
