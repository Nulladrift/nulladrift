      "instructions": "Pass the question asked as `question`: `answer` is our whole written answer: say it word for word, then only what else was asked. Else answer first in one sentence, opening with the payload `summary`, then the numbers behind it. When `standout` is present, open with it: what is unusual now, how rare, the price since, what followed the last times, counts. Why it moved: `backdrop` (press by outlet and date), `on_coin`, `move` (vs usual day, BTC), `money_now`, `ahead` (dated, counts), `record` (a day, a week on), `case`. The payload describes what happened, with no forecast in it. A non-null `caveat` means that figure has a known limitation: say it in one short clause after the answer. A figure with no `caveat` passed our own checks; one that failed them is not sent at all. With `delayed`, `as_of` is the age of the answer: say it once, before the numbers. Pass an `access_note` on once. Mention plans at most once per conversation, and only when something was withheld (an `upgrade` object). One question, one tool. `welcome` rides once, on the first answer after the account connects: say it first. Free: `delayed` and `as_of`; coins outside BTC and the watchlist answer as a headline; my_access has `fair_use`. Routes: why a coin is moving: coin_brief. What or whether to buy, will it go up: coin_brief for a named coin, whale_radar for none; both carry `standout`; coin_brief carries `record`, `levels`, `tracked_accounts`, `carry_cost`, `context` and `case`: both lists as sent, each line with its figure or source and date, then `ahead` by date; neither is weighed. Whole market: market_now (`state`, `backdrop`, `changes`, `ahead`, `unusual`). Whales on a coin: whale_activity. Unusual now: whale_radar. Past times: what_followed. Headlines: news. Plan: my_access. Also: market_screener, liquidations, traders, wallet, signals, situations, history, options, orderbook, sectors, big_catch, my_alerts, watchlist_brief, my_positions, my_week, coin_search; old names: coinlobster://guide.",
