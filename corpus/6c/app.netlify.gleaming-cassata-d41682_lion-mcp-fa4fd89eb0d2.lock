      },
      "serverInfo": {
        "name": "lion-trend-intent-mcp",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LION exposes x402-paid MCP/data services on Base. Five tools: (1) lion_trend_intent_signal_json and (2) lion_trend_intent_signal_csv return hardware-wallet buyer-intent + self-custody onboarding-friction intelligence ($0.01 USDC on Base mainnet); (3) lion_base_dex_signals_json is a live Base DEX market-data feed ($0.005 USDC on Base eip155:8453) returning raw on-chain metrics (price, liquidity, volume, price-change, pair-age, and a transparent mechanical activity score) for active Base tokens - raw public DexScreener data, not financial advice; (4) lion_adaptive_data_query is the LION Adaptive Data Fabric - one typed x402 query endpoint covering live Base verticals (base_dex market data, token_risk security screening via GoPlus, defi_yields via DefiLlama) with a free self-describing capability manifest at ?describe=1 ($0.005 USDC, raw public data, not advice); (5) lion_payment_attempt_readiness_audit is a pre-spend payment-term trust check an agent calls before signing a Payment-Signature against an x402/MCP endpoint ($0.05 USDC on Base eip155:8453, external_paid_proof:false); it returns payment_attempt_blockers, buyer_policy_fit, canonical_purchase_recipe, funnel_stage, a readiness score, and risk_flags, checking payment-term consistency only (not smart-contract security). Each tool is gated by an x402 invoice. tools/call returns payment-required metadata only (paid_route_url + amount + asset + payTo + scheme); settle the invoice at the paid route to fetch the dataset or audit report. Payment rail proven by prior controlled Endpoint #1 settlements.",
      "tools": [
        {
          "name": "lion_adaptive_data_query",
          "description": "LION Adaptive Data Fabric: ONE typed x402 query endpoint that adapts to any agent request over live Base on-chain data, covering multiple verticals from one call. Query params: source (base_dex | token_risk | defi_yields), token (0x address; for token_risk / single-token base_dex), sort (activity|volume|liquidity|age), limit, min_liquidity, max_age_hours, fields (output projection), q (free-text intent). base_dex = ranked active Base tokens (liquidity, volume, price-change, pair-age, activity_score) via DexScreener; token_risk = token security card (honeypot, buy/sell tax, mintable, owner, holders + mechanical risk_flags) via GoPlus; defi_yields = Base DeFi pools ranked by TVL with APY via DefiLlama. Free self-describing capability manifest at the same URL with ?describe=1 (no payment). Returns typed JSON rows + freshness fields (as_of, data_age_seconds, confidence, source_provider). Public keyless data, no API key. Raw public market data only - not financial or investment advice. Pay 0.005 USDC on Base via x402; tools/call returns payment-required metadata only, settle at the paid route to fetch the live JSON.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "description": "Comma-separated output field projection.",
                "type": "string"
              },
              "limit": {
                "description": "Max rows.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_age_hours": {
                "description": "Filter: max pair age in hours (base_dex).",
                "type": "number"
              },
              "min_liquidity": {
                "description": "Filter: minimum liquidity/TVL in USD.",
                "type": "number"
              },
              "q": {
                "description": "Free-text intent (echoed; reserved for semantic routing).",
                "type": "string"
              },
              "sort": {
                "description": "Ranking key.",
                "enum": ["activity", "volume", "liquidity", "age"],
                "type": "string"
              },
              "source": {
                "description": "Which live data vertical to query. Default base_dex.",
                "enum": ["base_dex", "token_risk", "defi_yields"],
                "type": "string"
              },
              "token": {
                "description": "Base token address; required for token_risk, optional for base_dex single-token lookup.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22d3eb9a7917d11e45ed158590492c4fb3998e0904d519cbf8b617c4554cfba9"
        },
        {
          "name": "lion_base_dex_signals_json",
          "description": "Live Base (eip155:8453) DEX market-data feed for trading and research agents. Returns a fresh ranked snapshot of active Base tokens with raw on-chain metrics: price_usd, liquidity_usd, volume_h24, volume_m5, price_change_h1/h24, pair_age_hours, dex, and a transparent mechanical activity_score (volume + liquidity + recency). Source: public DexScreener data, no API key. Raw public market data only - not financial or investment advice, no buy/sell recommendation. Pay 0.005 USDC on Base via x402 at the paid route. tools/call returns payment-required metadata only; settle the x402 invoice at the paid route to fetch the live JSON.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de12d7d58f16350aeda10c5c56a7be494657bab60313fad739780d4209080c3a"
        },
        {
          "name": "lion_payment_attempt_readiness_audit",
          "description": "Pre-spend payment-term trust check for x402 endpoints. Before your agent signs a Payment-Signature, call this with a target x402/MCP service URL: LION extracts the target live 402 payment terms (payTo, amount, asset, network, scheme), cross-checks them for drift across public discovery surfaces, and returns payment_attempt_blockers, buyer_policy_fit, canonical_purchase_recipe, funnel_stage, a transparent readiness score, and risk_flags so the agent can decide whether to sign. 0.05 USDC on Base eip155:8453. Unpaid tools/call returns JSON-RPC error -32402 with the x402 paymentRequirement; wallet-capable MCP clients (e.g. Coinbase Payments MCP, AWS AgentCore Payments) auto-construct the EIP-3009 signature. LION does NOT perform payment inside MCP. Checks payment-term consistency only - not a smart-contract security audit, no settlement guarantee, no fund movement.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public HTTPS x402/MCP service URL to audit.",
                "format": "uri",
                "pattern": "^https://",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "type": "string"
              },
              "asset": {
                "type": "string"
              },
              "external_paid_proof": {
                "type": "boolean"
              },
              "instructions": {
                "type": "string"
              },
              "network": {
                "type": "string"
              },
              "paid_endpoint_url": {
                "type": "string"
              },
              "payTo": {
                "type": "string"
              },
              "price_usdc": {
                "type": "string"
              },
              "scheme": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["amount", "asset", "external_paid_proof", "instructions", "network", "paid_endpoint_url", "payTo", "price_usdc", "scheme", "status"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6e31ca0b9e7f51a4d9e59c66629644ae220c7d3022a20d5741769dac50d8ef17"
        },
        {
          "name": "lion_trend_intent_signal_csv",
          "description": "Hardware-wallet buyer-intent + self-custody onboarding-friction intelligence as flat CSV. Same column set as the JSON variant: Ledger vs Trezor comparison demand, Bitcoin-only wallet research, under-$100 wallet shopper queries, DeFi hardware-wallet intent, decision-stage crypto purchase research. Optimised for spreadsheet / pipeline ingestion and affiliate-routing or comparison-research workflows. Pay $0.01 USDC on Base mainnet via x402 at the paid route. tools/call returns payment-required metadata only; settle the invoice at the paid route to fetch the CSV.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
