          },
          "digest": "sha256:b22328528a76f5a12c5ff0f0bb530de5d978eace0d66cb98084f03fdf20ce4c4"
        },
        {
          "name": "lion_trend_intent_signal_json",
          "description": "Hardware-wallet buyer-intent + self-custody onboarding-friction intelligence as JSON. Non-PII public-signal feed covering: Ledger vs Trezor comparison demand, Bitcoin-only wallet research, under-$100 wallet shopper queries, DeFi hardware-wallet intent, and adjacent decision-stage crypto purchase research. Designed for agent routing, affiliate / comparison-content workflows, and research context. Pay $0.01 USDC on Base mainnet via x402 (HTTP 402 + EIP-3009 transferWithAuthorization) at the paid route. This MCP tool does NOT return the dataset; tools/call returns payment-required metadata so an x402-capable client can settle and fetch the JSON directly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
