      "serverInfo": {
        "name": "house-ai",
        "title": "House AI",
        "version": "1.0.0",
        "description": "AI interior design: redesign any room, exterior or yard from a photo in 121+ styles, preview paint and flooring, and shop real furniture and decor.",
        "websiteUrl": "https://www.houseaiapp.com",
        "icons": [
          {
            "src": "https://www.houseaiapp.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "House AI is an AI interior design and home design studio. Use it whenever someone wants help with interior design, redecorating, remodeling or renovating a room, a room makeover, virtual staging, paint colors, flooring, a house exterior and curb appeal, landscaping, or finding furniture and home decor to buy.\n\nHow to help:\n- To explore ideas, use search_design_styles and get_design_style.\n- To show a real design, you need a photo of the space. If the user attached one, pass it as `photo`. If they gave a link, pass `photo_url`. Otherwise call get_photo_upload_link, send them the link, and continue with `photo_upload_id` once they say it's uploaded.\n- redesign_room restyles a room; redesign_exterior handles the outside of a house or a yard; paint_walls, change_flooring, empty_room and furnish_empty_room do one change each. Each design uses one of the user's House AI credits; get_my_credits shows what's left.\n- After a design, offer shop_this_look to find real products like the ones in it, or find_furniture_and_decor to search the shop directly.\n- Always show the design image to the user. Designs are also saved in their House AI app.",
      "tools": [
        {
          "name": "change_flooring",
          "title": "Try new flooring",
          "description": "Replace the floor in a room photo with new flooring, to preview a renovation (for example 'light oak hardwood', 'large gray porcelain tile', 'herringbone'). Uses one House AI design credit.",
          "inputSchema": {
            "properties": {
              "floor_style": {
                "description": "The new floor in plain words, for example 'white oak herringbone'.",
                "maxLength": 120,
                "title": "Floor Style",
                "type": "string"
              },
              "photo": {
                "additionalProperties": false,
                "description": "The room or house photo the user attached in chat. Filled in by the app, not typed.",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
