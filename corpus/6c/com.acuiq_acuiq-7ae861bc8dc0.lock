          "name": "search_symptoms",
          "title": "Search symptom names",
          "description": "Resolve what a person describes into AcuiQ symptom names – the first step before search_protocols. Plain description works (\"trouble sleeping\", \"my lower back hurts\"): filler words are stripped and the search retries on the clinical words, reporting which term matched. Set popular=true for trending symptoms instead. Always returns an object with a `symptoms` array, empty when nothing matched.",
