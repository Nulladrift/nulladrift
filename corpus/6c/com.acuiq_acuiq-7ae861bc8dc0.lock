        {
          "name": "get_full_corpus",
          "title": "Whole corpus",
          "description": "The whole of the AcuiQ reference wiki as one text document, for bulk ingestion. Preflight first: sizeOnly=true returns the character count, a token estimate, the per-branch breakdown and the largest pages. Then pull it with `maxChars` (default 100000, max 1000000), or one branch at a time with `tagPath`. Truncation is page-aligned: `truncated`, `omittedPages` and `nextSkip` say where to resume (pass skip=nextSkip). For a handful of pages get_pages is cheaper.",
          "inputSchema": {
            "properties": {
              "maxChars": {
                "description": "Character budget for `document` (default 100000, max 1000000)",
                "maximum": 1000000,
                "minimum": 1000,
                "type": "number"
              },
              "sizeOnly": {
                "description": "Sizes and breakdowns only, no document. Do this before the first real pull.",
                "type": "boolean"
              },
              "skip": {
                "description": "Resume from this page index: the `nextSkip` of the previous truncated call (default 0)",
                "minimum": 0,
                "type": "number"
              },
              "tagPath": {
                "description": "One branch and its descendants. Omit for everything.",
                "type": "string"
              }
            },
            "type": "object"
