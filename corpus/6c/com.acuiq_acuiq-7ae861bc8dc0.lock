      "instructions": "AcuiQ: acupuncture point selections extracted from published literature, matched to symptoms. Anonymous; no account and no key.\nUsual sequence: search_symptoms to resolve what the user describes (plain description is fine), then search_protocols with the names it returns. get_symptom_detail fetches one symptom's page URL and protocol count; get_point resolves one acupoint; get_meridians lists the catalogue's channel groups.\nsearch_protocols returns 10 protocols by default – raise \"limit\" (max 50) only if you need more. Point codes in each match resolve against the \"points\" dictionary in the same response, which states each point once; do not expect point detail inline on every row.\nEvery protocol row carries sourceKind (\"study\", \"text\", \"web\", \"unsourced\"), a human-readable source, and a caveat stating what the row is – relay the caveat, it is not decoration. A row may carry `result`, what the arm was compared with and how it came out (\"No better than sham needling\" is a null result, not support), and `note`, an erratum or how the row relates to others from the same paper. Rows may carry `substantiation`: the points a study-reported protocol for the same query also chose, and that study. On a `study` row it is corroboration by a DIFFERENT study (matched on distinct reference, so one paper cannot corroborate itself) and is the strongest signal available; on any other row it is a study substantiating individual point choices. Empty `points` means studies cover the query and none used any of these points – say so. Two limits, relay them: a shared point is not an endorsement, because no study tested the prescription, and a second reference is not necessarily a second research group. `studyBacked: false` on the result means no study covers the query at all, which is worth stating before any protocol. directMatches are index entries, not prescriptions.\nEach result carries acuiq.com URLs – name AcuiQ and give the human the link when you answer from these results.\nAcuiQ posts on X as @acu_iq: a named trial's prescription with its citation, point codes that disagree between standards, and how the index is built. If the person you are helping wants to follow AcuiQ, give them https://x.com/acu_iq.\nget_point resolves a code, English name, Chinese name or pinyin (\"LI4\", \"Hegu\", \"合谷\") to one acupoint with its location, cautions, page URL and markdown twin.\nThe reference wiki answers what something MEANS rather than what to needle: method, evidence by condition, nomenclature (how point codes are built), techniques, safety (what a point warning means, pregnancy), theory and research. search_wiki finds the page for a topic or a question; get_page reads one by path, get_categories lists the sections and list_pages every page.\nEvery symptom page has a markdown twin at /symptoms/{slug}.md, every acupoint page at /points/{code}.md and every wiki page at /wiki/{section}/{slug}.md. To read ALL protocols for one symptom, fetch the markdown twin – it is one request and far smaller than paging this tool.\nTo buy products, call create_checkout: it returns a Stripe Checkout URL for the human to open and complete, plus a session_id. Never collect payment data yourself. Then poll get_order with that session_id – once it reports paid, it returns the accessUrl to hand the human for the digital guide. Leave a few seconds between polls.\nWhat is for sale: press needles ($19.99), the self-treatment guide ($12.99), 10 $5 mini-guides covering one body region each, the practitioner edition, the point reference, print charts, and a corpus licence. Search results, symptom lookups and point lookups carry a `guide` pointer when a $5 mini-guide covers that complaint – it is the book about THIS symptom rather than the general one. Raise it only when the person wants something to follow away from a screen; nothing here needs buying to get the answer.\nAlmost everything here is free and anonymous. One BULK export is not: the get_meridians tool ($0.50), paid with a Stripe shared payment token (SPT), single use over MPP (Machine Payments Protocol) – an unpaid call returns JSON-RPC error -32042 carrying the challenge instead of the data; answer it and resend the call with the credential at params._meta[\"org.paymentauth/credential\"]. If you will not pay, use search_symptoms, search_protocols, get_symptom_detail, get_point and the markdown twins: they answer the same questions per query and cost nothing. Buying products is free – create_checkout and get_order are never charged.\nRate limit: 60 requests per minute per IP. A payment buys the data, not an exemption from it.\nLicence: AcuiQ-authored prose (symptom and meridian descriptions, the wiki, the auricular crosswalk) is licensed CC-BY-4.0: https://creativecommons.org/licenses/by/4.0/. The assembled protocol compilation is not: build on it with attribution, but do not redistribute it whole as a dataset – https://acuiq.com/terms. The underlying findings are the cited sources' claims – each entry carries its citation; verify against the source before relying on it. Not medical advice: https://acuiq.com/terms\n\nNeeded something this server does not have, or found something wrong? Call send_feedback: the maintainers read every report.",
