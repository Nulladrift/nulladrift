          "name": "search_wiki",
          "title": "Search the wiki",
          "description": "Keyword search across the AcuiQ reference wiki: the first call when you know what you are looking for but not where it lives. Matches titles and body prose, ranked in four tiers: titles starting with the term, titles containing it, literal body hits, then English full-text hits by relevance, which stem words and drop stopwords. Not semantic: one distinctive word beats a sentence. A query that finds nothing is retried with its misspelled words corrected, and `corrected` then names what was searched. Each row carries a `path`, its size in `chars` and a snippet windowed on the match. Feed the paths to get_pages in one call rather than looping get_page. Narrow with tagPath when a term is common. Defaults: page 1, pageSize 20 (max 50); keep paging while `hasMore` is true.",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "1-based page number (default 1)",
                "minimum": 1,
                "type": "number"
              },
              "pageSize": {
                "description": "Results per page (default 20, max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Search term, matched against page titles and body text",
                "type": "string"
              },
              "tagPath": {
                "description": "Only pages at this tag path, e.g. a path from get_categories",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the wiki"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfb15f25a059ca132ddc5202988d8ba091c88ac7fc80367ce4814a4a797debf7"
        },
        {
          "name": "send_feedback",
          "title": "Send feedback",
          "description": "Tell the maintainers of AcuiQ what you needed and did not find, what is wrong, or what broke. One issue per call, in 300 characters at most. Reports are read, not published.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "missing: not covered here. wrong: a fact or link is out of date or false. broken: a tool or page failed. suggestion: anything else.",
