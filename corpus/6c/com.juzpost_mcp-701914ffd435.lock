        {
          "name": "list_options",
          "title": "List choices for an account",
          "description": "Lists the choices one account offers for a setting the schedule needs, read live from the platform. Requests: list_board (pinterest, ids go in pinterest.board_id); list_post_type (wordpress, ids go in wordpress.post_type); list_location (tiktok, ids go in tiktok.location). Use this when the user posts to Pinterest: list the boards, ask which one, and pass its id as board_id. Use list_location with a query (a city, a venue) when the user wants a place on a TikTok Business post: pass the chosen choice as tiktok.location { id, name }. Use list_post_type when the user wants a WordPress post published as something other than a blog post (a short story, a page): pass the matching id as post_type; the name lists the taxonomies that type takes in terms. Returns field (where the ids go) and choices[] with id and name. Refer to a choice by its name when talking to the user. Does NOT change anything.",
