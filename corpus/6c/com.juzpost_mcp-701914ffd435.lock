        {
          "name": "upload_media",
          "title": "Upload media",
          "description": "Stores the original image or video in the workspace from a file the chat app hands over, a public URL (up to 1 GB for a video) or inline base64 (up to 3 MB), checking the real file type and the storage quota. Use this when the user gives you a link to attach to a post, or when the chat app hands you their attachment as `file` (ChatGPT does); then pass the returned media_key to create_post or update_post. `file` is filled by the chat app with an https download link, never by you: a path you see such as /mnt/user-data/uploads/… is on the user's side and cannot be read here. For a file the user attached or has on their device, call upload_file in a chat app that shows cards (Claude), or create_upload_url in Claude Code or a terminal. Use `base64` only with the original bytes of a small image you read from disk; never draw, reconstruct, re-encode or compress an image you have only seen. Returns media_key, bytes, content_type and source. Does NOT attach the file to any post by itself and does NOT accept private or local-network URLs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "base64": {
                "description": "The original file bytes as base64, read from disk (a data: URI is fine). Either this, file or url.",
                "type": "string"
              },
              "content_type": {
                "description": "MIME type of the base64 bytes, e.g. image/jpeg. Required with base64, used with nothing else: a file or url is typed from its own bytes.",
                "type": "string"
              },
              "file": {
                "additionalProperties": false,
                "description": "Filled by the chat app (ChatGPT) with the attachment's https download_url; never a local path. Either this, url or base64.",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "filename": {
                "description": "File name for a base64 upload; a file or url is named by its import.",
                "type": "string"
              },
              "url": {
                "description": "Public http(s) URL of the original file. Either this, file or base64.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "bytes": {
                "type": "number"
              },
              "content_type": {
                "type": "string"
              },
              "media_key": {
                "type": "string"
              },
              "source": {
                "enum": ["url", "base64", "file"],
                "type": "string"
              }
            },
            "required": ["bytes", "content_type", "media_key", "source"],
            "type": "object"
          },
