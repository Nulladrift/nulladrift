        {
          "name": "upload_file",
          "title": "Upload a file from the device",
          "description": "Shows an upload card where the user picks images or videos from their device (images up to 20 MB, videos up to 1 GB); the card stores the original files in the workspace. Use this in a chat app that shows cards (Claude.ai, Claude Desktop, Claude mobile) whenever the user attached a file in the chat or wants to add one from their device: you cannot read their attachment, so let them pick it here. When they finish, the card adds each file name and media_key to your context and asks the user to send a message; pass those media_key values to create_post or update_post. Returns nothing to attach by itself. Does NOT work in Claude Code or a terminal (use create_upload_url there) and does NOT take a link (use upload_media).",
