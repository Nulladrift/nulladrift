        {
          "name": "update_post",
          "title": "Update a post",
          "description": "Edits a draft or a scheduled post, the same edit the composer makes: caption, title, description, hashtags, type, media keys, cover, accounts, per-account text, media and covers, platform settings, and the time. Only the fields passed change; media_keys: null clears the media. The per-account maps (account_overrides, channel_overrides, media_by_account, cover_by_account, each platform's settings) change only the accounts they name: send just the accounts you are changing, and every other account keeps its text, media and settings. An account's entry is its whole text or settings; account_overrides: { id: null } clears that account's text. account_ids is the complete list: an account left out is removed from the post. Facebook text post with a link: also set platform_settings.facebook.link (see that field) so Facebook shows a preview card. A scheduled post is checked the way schedule_post checks one, and nothing is written when it is refused. It can no longer be edited from 10 minutes before its first account fires, or once an account has started preparing (an Instagram or Pinterest video prepares earlier). publish_at on a scheduled post moves it; on a draft it is the time the draft keeps. Times are ISO 8601 ending in Z or an offset, like 2026-11-03T09:00:00+05:30: use the user's own local time with its offset. workspace.timezone from get_context is the workspace's display zone, not necessarily where the user is; if you are unsure of their timezone, ask them. Use this when the user revises a post before it goes out. Returns the updated post and warnings[] for any platform caption limit the new content exceeds. Does NOT edit published or failed posts (returns an error), and does NOT ingest URLs; use upload_media first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "account_ids": {
                "description": "Where this post goes: each account's ref from list_accounts (e.g. \"x:acme_studio\"), or its id. Prefer the ref; it is what the person reads when approving. Always the complete list, unlike the per-account maps: an account left out is removed from the post, with its text and settings.",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "account_overrides": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "properties": {
                        "description": {
                          "description": "This account's caption. \"\" posts no text on this account.",
                          "type": "string"
                        },
                        "hashtags": {
                          "items": {
                            "maxLength": 100,
                            "type": "string"
                          },
                          "maxItems": 30,
                          "type": "array"
                        },
                        "title": {
                          "maxLength": 10000,
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "description": "Text for one account, keyed by account ref or id: title, caption, hashtags. Send only the accounts you are changing; every other account keeps its text. An entry is that account's whole text (a field it leaves out is cleared); null clears the account's text. Wins over channel_overrides and the base text.",
                "propertyNames": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "actions_by_account": {
                "additionalProperties": {
                  "items": {
                    "oneOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "actor": {
                            "description": "Another account of the same platform that writes this comment (ref or id), replying to the post itself. Omit for the account's own comment, which replies to the one above it. X and Bluesky.",
                            "maxLength": 300,
                            "minLength": 1,
                            "type": "string"
                          },
                          "delay_minutes": {
                            "description": "Minutes to wait after the comment above went out (the post, for the first one, or for another account's comment), 0 to 1440.",
                            "maximum": 1440,
                            "minimum": 0,
                            "type": "integer"
                          },
                          "kind": {
                            "const": "comment",
                            "type": "string"
                          },
                          "text": {
                            "maxLength": 100000,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["delay_minutes", "kind", "text"],
                        "type": "object"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "actor": {
                            "description": "The account that reposts the post (ref or id): the posting account itself or another account of the same platform. X, Bluesky and Threads.",
                            "maxLength": 300,
                            "minLength": 1,
                            "type": "string"
                          },
                          "delay_minutes": {
                            "description": "Minutes to wait after the post went out, 0 to 1440.",
                            "maximum": 1440,
                            "minimum": 0,
                            "type": "integer"
                          },
                          "kind": {
                            "const": "repost",
                            "type": "string"
                          }
                        },
                        "required": ["actor", "delay_minutes", "kind"],
                        "type": "object"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "actor": {
                            "description": "The account that quotes the post (ref or id): the posting account itself or another account of the same platform. Bluesky and Threads; X accounts repost only.",
                            "maxLength": 300,
                            "minLength": 1,
                            "type": "string"
                          },
                          "delay_minutes": {
                            "description": "Minutes to wait after the post went out, 0 to 1440.",
                            "maximum": 1440,
                            "minimum": 0,
                            "type": "integer"
                          },
                          "kind": {
                            "const": "quote",
                            "type": "string"
