        {
          "name": "create_upload_url",
          "title": "Create an upload URL",
          "description": "Reserves storage for one file and returns a presigned upload_url (valid 1 day) plus the media_key it will be stored under. Images up to 20 MB, videos up to 1 GB. Use this in Claude Code, a terminal or a script, for a local file or any video: PUT the ORIGINAL file bytes, unmodified, to upload_url with the returned content-type header and exactly `bytes` bytes, then pass media_key to create_post or update_post. Never re-encode, resize or compress the file first. In a chat app that shows cards (Claude.ai, Claude Desktop, Claude mobile) call upload_file instead: the user picks the file and nothing has to be allowed. The PUT goes to the storage host in upload_url (<account>.r2.cloudflarestorage.com). A code sandbox that blocks it needs that host allowed: On Claude.ai a Pro or Max user allows it in Settings → Capabilities; on a Team or Enterprise plan the organization owner adds it in Admin settings → Capabilities → Additional allowed domains. Returns upload_url, media_key, headers and expires_in. Does NOT upload anything by itself, and does NOT accept a URL or base64; use upload_media for those.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bytes": {
                "description": "Exact size of the file in bytes. The URL only accepts a body of this length.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "content_type": {
                "description": "MIME type of the file, e.g. video/mp4 or image/png.",
                "type": "string"
              },
              "filename": {
                "description": "The file name with its extension, e.g. clip.mp4.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["bytes", "content_type", "filename"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "expires_in": {
                "type": "number"
              },
              "headers": {
                "additionalProperties": false,
                "properties": {
                  "content-type": {
                    "type": "string"
                  }
                },
                "required": ["content-type"],
                "type": "object"
              },
              "media_key": {
                "type": "string"
              },
              "upload_url": {
                "type": "string"
              }
            },
            "required": ["expires_in", "headers", "media_key", "upload_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
