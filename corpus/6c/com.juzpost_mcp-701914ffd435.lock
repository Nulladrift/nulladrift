{
  "lockfileVersion": 2,
  "subjects": {
    "com.juzpost/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.juzpost.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "juzpost",
        "title": "JuzPost",
        "version": "2.0.0",
        "websiteUrl": "https://www.juzpost.com",
        "icons": [
          {
            "src": "https://cdn.juzpost.com/brand/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_post",
          "title": "Create a draft post",
          "description": "Creates a draft post with everything the composer saves: caption, title, description, hashtags, media, the accounts it goes to, per-account text (account_overrides, channel_overrides), per-account media and covers, and each platform's settings. Media can be public URLs (downloaded and stored server-side) or media keys from upload_media. Facebook text post with a link: also set platform_settings.facebook.link (see that field) so Facebook shows a preview card. Use this only once you have the full brief from the user: the post type, the text, and the media if the type needs it. `type` is required and is never guessed: use the type the user stated (text, image, video, story or blog); if they did not say, ask them before calling this tool. A story is an Instagram or Facebook Story: one image or one video, no caption on Instagram. A blog post goes to WordPress: title is required and becomes the page heading. Put the body in description, as HTML; it is sent exactly as written. Plain text also works: blank lines become paragraphs. WordPress keeps p, br, hr, h2 to h6 (with id), ul, ol, li, blockquote, strong, em, a (href, rel, target, title), code, pre, abbr, time, figure, figcaption, the table tags and img (src, alt, width, height). Do not use h1 (the title is already the page heading), script or style (WordPress removes the tag but leaves its text visible). The first image is the featured image; any others are added under the body in order. Images only, no video. Then schedule_post puts the draft on the calendar. To schedule straight away, call schedule_post with the content instead: it creates and schedules in one call. Pass the same idempotency_key on a retry so a network error never makes two drafts. Returns the draft (post) plus warnings[] naming any platform whose caption limit the content exceeds, and created=false when the idempotency_key matched an existing draft. Does NOT schedule or publish anything.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "account_ids": {
                "description": "Where this post goes: each account's ref from list_accounts (e.g. \"x:acme_studio\"), or its id. Prefer the ref; it is what the person reads when approving. Always the complete list, unlike the per-account maps: an account left out is removed from the post, with its text and settings.",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "account_overrides": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "properties": {
                        "description": {
                          "description": "This account's caption. \"\" posts no text on this account.",
                          "type": "string"
                        },
                        "hashtags": {
                          "items": {
                            "maxLength": 100,
                            "type": "string"
                          },
                          "maxItems": 30,
                          "type": "array"
                        },
                        "title": {
                          "maxLength": 10000,
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "description": "Text for one account, keyed by account ref or id: title, caption, hashtags. Send only the accounts you are changing; every other account keeps its text. An entry is that account's whole text (a field it leaves out is cleared); null clears the account's text. Wins over channel_overrides and the base text.",
                "propertyNames": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "actions_by_account": {
                "additionalProperties": {
                  "items": {
                    "oneOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "actor": {
                            "description": "Another account of the same platform that writes this comment (ref or id), replying to the post itself. Omit for the account's own comment, which replies to the one above it. X and Bluesky.",
                            "maxLength": 300,
                            "minLength": 1,
                            "type": "string"
                          },
                          "delay_minutes": {
                            "description": "Minutes to wait after the comment above went out (the post, for the first one, or for another account's comment), 0 to 1440.",
                            "maximum": 1440,
                            "minimum": 0,
                            "type": "integer"
                          },
                          "kind": {
                            "const": "comment",
                            "type": "string"
                          },
                          "text": {
                            "maxLength": 100000,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["delay_minutes", "kind", "text"],
                        "type": "object"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "actor": {
                            "description": "The account that reposts the post (ref or id): the posting account itself or another account of the same platform. X, Bluesky and Threads.",
                            "maxLength": 300,
                            "minLength": 1,
                            "type": "string"
                          },
                          "delay_minutes": {
                            "description": "Minutes to wait after the post went out, 0 to 1440.",
                            "maximum": 1440,
                            "minimum": 0,
                            "type": "integer"
                          },
                          "kind": {
                            "const": "repost",
                            "type": "string"
                          }
                        },
                        "required": ["actor", "delay_minutes", "kind"],
                        "type": "object"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "actor": {
                            "description": "The account that quotes the post (ref or id): the posting account itself or another account of the same platform. Bluesky and Threads; X accounts repost only.",
                            "maxLength": 300,
                            "minLength": 1,
                            "type": "string"
                          },
                          "delay_minutes": {
                            "description": "Minutes to wait after the post went out, 0 to 1440.",
                            "maximum": 1440,
                            "minimum": 0,
                            "type": "integer"
                          },
                          "kind": {
                            "const": "quote",
                            "type": "string"
                          },
                          "text": {
                            "description": "What the quoting account says above the quoted post.",
                            "maxLength": 100000,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["actor", "delay_minutes", "kind", "text"],
                        "type": "object"
                      }
                    ]
                  },
                  "maxItems": 10,
                  "type": "array"
                },
                "description": "What happens once the post is live, keyed by the account it goes out on (ref or id): that account's whole ordered list. Its own comments (no actor) each reply to the one above after their delay (X and Bluesky). A comment with an actor is written by that other account of the same platform; a repost or quote is done by its actor, the posting account itself or another account of the same platform. Both count their delay from the post (comments X and Bluesky; reposts X, Bluesky and Threads; quotes Bluesky and Threads, never X). At most 10 per account; [] removes them. Send only the accounts you are changing; every other account keeps its actions. An account that has already published keeps its actions as they are.",
                "propertyNames": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "bluesky": {
                "additionalProperties": {
                  "properties": {
                    "alt_text": {
                      "description": "[optional] One description per file, in the order this account publishes its media; \"\" leaves a file undescribed. Exactly as many entries as files. Up to 2000 characters each. Default: no alt text.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "labels": {
                      "description": "[optional] Content warnings: at most one of sexual (Suggestive), nudity, porn (Adult), plus graphic-media. Only on posts with images or video. Default [].",
                      "items": {
                        "enum": ["sexual", "nudity", "porn", "graphic-media"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "langs": {
                      "description": "[optional] The post's languages as BCP 47 codes (e.g. \"en\", \"pt-BR\"), at most 3. Bluesky uses them for language feeds. Default: none, Bluesky guesses.",
                      "items": {
                        "pattern": "^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$",
                        "type": "string"
                      },
                      "maxItems": 3,
                      "type": "array"
                    }
                  },
                  "required": ["alt_text", "labels"],
                  "type": "object"
                },
                "description": "bluesky settings keyed by bluesky account (ref or id). Each field says whether it is required, an account default or optional. Send only the accounts you are changing: an entry is that account's whole settings, and every other account keeps its own.",
                "propertyNames": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "channel_overrides": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "properties": {
                        "description": {
                          "description": "This account's caption. \"\" posts no text on this account.",
                          "type": "string"
                        },
                        "hashtags": {
                          "items": {
                            "maxLength": 100,
                            "type": "string"
                          },
                          "maxItems": 30,
                          "type": "array"
                        },
                        "title": {
                          "maxLength": 10000,
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "description": "Text for every account of one platform, keyed by platform id (e.g. \"instagram\"): \"the Instagram caption\". Send only the platforms you are changing; null clears the text of that platform's accounts. An account_overrides entry for the same account wins field by field.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "content": {
                "description": "The caption / body text.",
                "maxLength": 100000,
                "type": "string"
              },
              "cover_by_account": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "maxLength": 512,
                      "type": "string"
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "description": "One account's own video cover, keyed by account ref or id: a media_key, or null to use the post's cover.",
                "propertyNames": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "cover_key": {
                "description": "media_key of a cover image for video posts.",
                "type": "string"
              },
              "cover_timestamp_ms": {
                "description": "The video frame, in milliseconds, used as the cover when no cover image is set.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "description": {
                "type": "string"
              },
              "facebook": {
                "additionalProperties": {
                  "properties": {
                    "link": {
                      "description": "[optional] A web address Facebook shows as a preview card under a text post. When a Facebook text post's caption has one link, set it here too so the card shows; with several links, ask the user which one. Ignored on a post with images or video. A link only in the caption shows as plain text. Default none.",
                      "format": "uri",
                      "maxLength": 2048,
                      "type": "string"
                    },
                    "video_as": {
                      "const": "reel",
                      "description": "[optional] Publish a video as a Reel: 3 to 90 seconds, vertical 9:16, at most 30 Reels per Page per day. Default: a classic Page video.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "description": "facebook settings keyed by facebook account (ref or id). Each field says whether it is required, an account default or optional. Send only the accounts you are changing: an entry is that account's whole settings, and every other account keeps its own.",
                "propertyNames": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "hashtags": {
                "description": "Without the # is fine.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "idempotency_key": {
                "description": "Any unique string; a repeat with the same key returns the same draft.",
                "maxLength": 200,
                "type": "string"
              },
              "instagram": {
                "additionalProperties": {
                  "properties": {
                    "trial_reel": {
                      "description": "[optional] Share a Reel as a Trial Reel, to non-followers first. manual: you decide whether it goes to followers; auto: Instagram decides on performance. Reels with one video only. Default: a normal Reel.",
                      "enum": ["manual", "auto"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "description": "instagram settings keyed by instagram account (ref or id). Each field says whether it is required, an account default or optional. Send only the accounts you are changing: an entry is that account's whole settings, and every other account keeps its own.",
                "propertyNames": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "media_by_account": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "items": {
                        "maxLength": 512,
                        "type": "string"
                      },
                      "maxItems": 20,
                      "type": "array"
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "description": "One account's own media, keyed by account ref or id: its whole ordered list of media_key values; [] posts no media there, null goes back to the post's media.",
                "propertyNames": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "media_keys": {
                "description": "media_key values from upload_media.",
                "items": {
                  "maxLength": 512,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "media_urls": {
                "description": "Public http(s) URLs of the ORIGINAL files to download and attach, up to 100 MB each. Never a re-encoded copy.",
                "items": {
                  "maxLength": 512,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "pinterest": {
                "additionalProperties": {
                  "properties": {
                    "alt_text": {
                      "description": "[optional] Describes the image for screen readers. Default none; the title is never used.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "board_id": {
                      "description": "[account default] The board the Pin goes on. Default: the account's saved board, and no account has one yet, so every Pin needs this: ask the user which board, from list_options req_type list_board.",
                      "pattern": "^\\d+$",
                      "type": "string"
                    },
                    "link": {
                      "description": "[optional] The Pin's clickable destination. A URL in the caption is never clickable on Pinterest. Default none.",
                      "format": "uri",
                      "maxLength": 2048,
                      "type": "string"
                    }
                  },
                  "required": ["board_id"],
                  "type": "object"
                },
                "description": "pinterest settings keyed by pinterest account (ref or id). Each field says whether it is required, an account default or optional. Send only the accounts you are changing: an entry is that account's whole settings, and every other account keeps its own.",
                "propertyNames": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "tiktok": {
                "additionalProperties": {
                  "properties": {
                    "ai_generated": {
                      "description": "[optional] Label the post as AI-generated, on photo and video posts. Set it when the photos or the video were made or significantly edited with AI. TikTok does not let the label be removed after posting. Default false.",
                      "type": "boolean"
                    },
                    "brand_content": {
                      "description": "[optional] Branded content for someone else. Needs commercial_content; cannot be SELF_ONLY. Default false.",
                      "type": "boolean"
                    },
                    "brand_organic": {
                      "description": "[optional] Promotes the creator's own brand. Needs commercial_content. Default false.",
                      "type": "boolean"
                    },
                    "commercial_content": {
                      "description": "[optional] The post promotes a brand, product or service. Default false.",
                      "type": "boolean"
                    },
                    "delivery": {
                      "description": "[optional] direct_post publishes the post to the account; it is the only value. Default direct_post.",
                      "enum": ["direct_post"],
                      "type": "string"
                    },
                    "interactions": {
                      "description": "[account default] Allow comments, duets and stitches on this post. Default: the switches saved on the account. Anything the creator turned off in TikTok stays off. Send only when the user asks.",
                      "properties": {
                        "comment": {
                          "type": "boolean"
                        },
                        "duet": {
                          "type": "boolean"
                        },
                        "stitch": {
                          "type": "boolean"
                        }
                      },
                      "required": ["comment", "duet", "stitch"],
                      "type": "object"
                    },
                    "location": {
                      "description": "[optional] A place tagged on the post, as { id, name } from list_options req_type list_location with a query. TikTok Business accounts only (list_accounts shows api \"business\"); refused on a personal account. Default none.",
                      "properties": {
                        "id": {
                          "maxLength": 32,
                          "pattern": "^\\d+$",
                          "type": "string"
                        },
                        "name": {
                          "maxLength": 300,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["id", "name"],
                      "type": "object"
                    },
                    "privacy_level": {
                      "description": "[optional] Who can see the post. SELF_ONLY when the user says \"only me\". Default PUBLIC_TO_EVERYONE.",
                      "enum": ["PUBLIC_TO_EVERYONE", "MUTUAL_FOLLOW_FRIENDS", "FOLLOWER_OF_CREATOR", "SELF_ONLY"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "description": "tiktok settings keyed by tiktok account (ref or id). Each field says whether it is required, an account default or optional. Send only the accounts you are changing: an entry is that account's whole settings, and every other account keeps its own.",
                "propertyNames": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "title": {
                "description": "Title, used by platforms that have one (YouTube, Pinterest). Required for a blog post, where it becomes the WordPress page heading.",
                "maxLength": 200,
                "type": "string"
              },
              "tumblr": {
                "additionalProperties": {
                  "properties": {
                    "link_url": {
                      "description": "[optional] A link Tumblr shows as a card on the post. A link in the caption stays plain text. Default none. Tags go in account_overrides hashtags.",
                      "format": "uri",
                      "maxLength": 2048,
                      "type": "string"
                    },
                    "source_url": {
                      "description": "[optional] The post's Source credit. Default none.",
                      "format": "uri",
                      "maxLength": 2048,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "description": "tumblr settings keyed by tumblr account (ref or id). Each field says whether it is required, an account default or optional. Send only the accounts you are changing: an entry is that account's whole settings, and every other account keeps its own.",
                "propertyNames": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "type": {
                "description": "Required. The type the user asked for. Ask if they have not said. story is an Instagram or Facebook Story with one media. blog is a WordPress blog post.",
                "enum": ["text", "image", "video", "story", "blog"],
                "type": "string"
              },
              "wordpress": {
                "additionalProperties": {
                  "properties": {
                    "categories": {
                      "description": "[optional] Category names that already exist on the site; an unknown one is refused at schedule with the site's list. Only for a post type that has categories. Default: the site's default category.",
                      "items": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "excerpt": {
                      "description": "[optional] Short summary for feeds and link previews. Default: WordPress makes one from the body.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "featured_image_alt": {
                      "description": "[optional] Alt text for the featured image (the first image). Default none.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "post_type": {
                      "description": "[optional] The post type to publish as, e.g. a short story instead of a blog post: a slug from list_options req_type list_post_type. Default post.",
                      "pattern": "^[a-z0-9_-]{1,20}$",
                      "type": "string"
                    },
                    "seo": {
                      "description": "[optional] Yoast SEO fields. Only for an account whose list_accounts entry shows seo \"yoast\". Default: Yoast's own.",
                      "properties": {
                        "description": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "focus_keyphrase": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "title": {
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "slug": {
                      "description": "[optional] The URL slug. Default: made from the title.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "status": {
                      "description": "[optional] publish; draft or pending (Pending review) to review it in wp-admin; private for logged-in editors only. Default publish.",
                      "enum": ["publish", "draft", "pending", "private"],
                      "type": "string"
                    },
                    "tags": {
                      "description": "[optional] Tag names; a new one is created. Only for a post type that has tags. Default none.",
                      "items": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "terms": {
                      "additionalProperties": {
                        "items": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "minItems": 1,
                        "type": "array"
                      },
                      "description": "[optional] Terms of the post type's own taxonomies, as { taxonomy slug: [names] }, e.g. { \"genre\": [\"Romance\"] }. list_post_type names each type's taxonomies. Names must already exist on the site; an unknown one is refused at schedule with the site's list. Default none.",
                      "propertyNames": {
                        "pattern": "^[a-z0-9_-]{1,32}$",
                        "type": "string"
                      },
                      "type": "object"
                    }
                  },
                  "type": "object"
                },
                "description": "wordpress settings keyed by wordpress account (ref or id). Each field says whether it is required, an account default or optional. Send only the accounts you are changing: an entry is that account's whole settings, and every other account keeps its own.",
                "propertyNames": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "x": {
                "additionalProperties": {
                  "properties": {
                    "made_with_ai": {
                      "description": "[optional] Label the post as made with AI. Default false.",
                      "type": "boolean"
                    },
                    "paid_partnership": {
                      "description": "[optional] Label the post as a paid partnership. Default false.",
                      "type": "boolean"
                    },
                    "reply_settings": {
                      "description": "[optional] Who can reply: everyone, following (accounts you follow), mentionedUsers, verified or subscribers. Default everyone.",
                      "enum": ["everyone", "following", "mentionedUsers", "verified", "subscribers"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "description": "x settings keyed by x account (ref or id). Each field says whether it is required, an account default or optional. Send only the accounts you are changing: an entry is that account's whole settings, and every other account keeps its own.",
                "propertyNames": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "youtube": {
                "additionalProperties": {
                  "properties": {
                    "category_id": {
                      "description": "[optional] YouTube category id, e.g. \"22\" People & Blogs, \"27\" Education, \"28\" Science & Technology. Default \"22\". Tags go in account_overrides hashtags, 500 characters in all.",
                      "pattern": "^\\d{1,3}$",
                      "type": "string"
                    },
                    "made_for_kids": {
                      "description": "[optional] Made for kids. YouTube turns off comments and personalised ads when true. Default false.",
                      "type": "boolean"
                    },
                    "privacy_status": {
                      "description": "[optional] Who can watch: public, unlisted (anyone with the link) or private. Default public.",
                      "enum": ["public", "unlisted", "private"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
