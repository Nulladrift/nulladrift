        {
          "name": "list_posts",
          "title": "List posts",
          "description": "Lists posts in the workspace: drafts, scheduled, published and failed. Use this to find drafts to schedule, to review the queue, or to find a post id for get_post, update_post, schedule_post (publish_now on a scheduled post) or delete_post (any status). Returns posts[] (id, status, type, title, content, mediaUrls, scheduledFor), nextCursor and hasMore. Refer to posts by title or caption when talking to the user; ids are for tool calls. Does NOT include per-account results; call get_post for those.",
