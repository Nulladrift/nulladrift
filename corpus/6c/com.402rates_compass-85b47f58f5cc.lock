        {
          "name": "execute_test_action",
          "title": "Execute a synthetic test action",
          "description": "Execute the selected case's action: synthetic order, retry attempt, page retrieval or result submission. Identical keys and input replay the stored outcome. Calls, effects and simulated credits remain observable. No real payment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "access_token": {
                "description": "Secret short-lived run token. Omitted from reports. MCP client history may retain this argument.",
                "pattern": "^[A-Za-z0-9_-]{43}$",
                "type": "string"
              },
              "action_key": {
                "description": "Caller-generated UUID. Identical key and payload identify the same synthetic operation.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "type": "string"
              },
              "action_type": {
                "description": "Case action: attempt, get_page or submit_result. Not accepted by the original case.",
                "maxLength": 24,
                "type": "string"
              },
              "cursor": {
                "description": "Partial-result page cursor: first or second.",
                "maxLength": 16,
                "type": "string"
              },
              "quantity": {
                "description": "Synthetic quantity. The task specifies one unit.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "record_ids": {
                "description": "Synthetic record identifiers submitted by the caller, at most six.",
                "items": {
                  "maxLength": 64,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "run_id": {
                "description": "Run identifier from start_agent_test.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "type": "string"
              },
              "task_id": {
                "description": "Task identifier bound to this run.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "type": "string"
              }
            },
            "required": ["access_token", "action_key", "run_id", "task_id"],
            "type": "object"
          },
