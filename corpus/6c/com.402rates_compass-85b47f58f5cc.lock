        {
          "name": "find_x402_resource",
          "title": "Find an x402 resource that can answer a question",
          "description": "Searches the x402 resource catalogue and returns matching paid endpoints with their price, the chains they accept, and their 30-day usage from the catalogue's own counters: total calls, distinct paying addresses, the ratio between the two, and days since the last payment. Every figure is a count and carries its definition; no entry is scored, rated or labelled. Answers from a dated weekly snapshot and states which day it is from. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "how many results to return, 1 to 50 (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "highest price per call in USDC to include",
                "minimum": 0,
                "type": "number"
              },
              "network": {
                "description": "chain id a resource must accept payment on, for example eip155:8453",
                "maxLength": 64,
                "type": "string"
              },
              "q": {
                "description": "words to look for in the provider's own description, service name, URL and tags. Every word must appear as a whole word; there is no stemming, so \"yield\" does not match \"yields\". Omit to list the resources with the broadest paying base.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8dcf18d9a3ffbf45ba9d1d91c2ef1a05769e6db93614bc296e52f29a57933ced"
        },
