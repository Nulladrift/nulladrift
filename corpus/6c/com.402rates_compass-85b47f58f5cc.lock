        },
        {
          "name": "describe_agent_test",
          "title": "Describe a synthetic agent test",
          "description": "Free description of a versioned synthetic task, its limits and coverage. Optional case selection; omitted selection describes the original confirmation case. No run, payment or wallet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "case_id": {
                "description": "Versioned synthetic case identifier.",
