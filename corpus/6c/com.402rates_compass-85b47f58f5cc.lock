        },
        {
          "name": "describe_agent_test",
          "title": "Describe a synthetic agent test",
          "description": "Free description of a versioned synthetic task, its limits and coverage. Optional case selection; omitted selection describes the original confirmation case. No run, payment or wallet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "case_id": {
                "description": "Versioned synthetic case identifier.",
                "maxLength": 80,
                "type": "string"
              },
              "case_version": {
                "description": "Optional exact case version. A new run defaults to the current published version; a linked repeat retains its previous version. The resolved version is returned and stored.",
                "maxLength": 16,
                "type": "string"
              },
              "variant": {
                "description": "Budget case: budget_first or attempts_first. Linked repeats retain the previous variant.",
                "maxLength": 32,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
