      "tools": [
        {
          "name": "check_payment_terms",
          "title": "Inspect x402 payment terms without making a payment",
          "description": "Free inspection of unsigned x402 terms. Default analysis version 1 retains Exact EVM checks; analysis_version 2 inspects documented EVM Exact, Upto, Batch Settlement and Auth-Capture profiles, declared limits and lifecycle fields. Unknown fields stay unchecked. No wallet, signature verification, live contract validation or settlement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "analysis_version": {
                "description": "1 preserves the original Exact EVM report. 2 selects documented multi-scheme structural inspection, report version 2.0.0.",
                "enum": ["1", "2"],
                "type": "string"
              },
              "challenge": {
                "additionalProperties": {},
                "description": "Decoded PaymentRequired object from HTTP or MCP structuredContent. No signed payment or credentials.",
                "type": "object"
              },
              "expected": {
                "additionalProperties": true,
                "description": "Optional exact terms. An atomic budget requires network and asset.",
                "properties": {
                  "asset": {
                    "type": "string"
                  },
                  "max_amount_atomic": {
                    "type": "string"
                  },
                  "network": {
                    "type": "string"
                  },
                  "pay_to": {
                    "type": "string"
                  },
                  "scheme": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6418cd42f9af863abbd4edc2e5d5451afabcd0565750cb7946bf66784e6a19cf"
        },
        {
          "name": "compare_payment_terms",
          "title": "Compare previous and current x402 payment terms",
          "description": "Free comparison of two unsigned captures for the same resource and method. Default analysis version 1 retains Exact EVM; version 2 compares documented Exact, Upto, Batch Settlement and Auth-Capture fields, limits and lifecycle terms. Captures are caller declarations, with no authentication, fetching or payment. Unknown profiles remain non-comparable.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "analysis_version": {
                "description": "1 preserves the original Exact EVM comparison. 2 compares the pinned multi-scheme EVM profiles, including amount scope, authorizers, escrow, declared deadlines and fee bounds.",
                "enum": ["1", "2"],
                "type": "string"
              },
              "baseline": {
                "additionalProperties": true,
                "properties": {
                  "captured_at": {
                    "description": "Caller-declared UTC capture time with Z suffix. Baseline may be old; current has a 24-hour age bound and both allow 60 seconds of future clock skew.",
                    "type": "string"
                  },
                  "challenge": {
                    "additionalProperties": {},
                    "description": "Decoded unsigned PaymentRequired object, at most 32 offers. Analysis version 1 covers x402 v1/v2 Exact EVM; analysis version 2 covers the pinned x402 v2 EVM profiles.",
                    "type": "object"
                  },
                  "method": {
                    "enum": ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"],
                    "type": "string"
                  },
                  "resource_url": {
                    "description": "Exact HTTP(S) resource URL, including query. No credentials, secret query parameters or fragment.",
                    "maxLength": 2048,
                    "type": "string"
                  }
                },
                "required": ["captured_at", "challenge", "method", "resource_url"],
                "type": "object"
              },
              "current": {
                "additionalProperties": true,
                "properties": {
                  "captured_at": {
                    "description": "Caller-declared UTC capture time with Z suffix. Baseline may be old; current has a 24-hour age bound and both allow 60 seconds of future clock skew.",
                    "type": "string"
                  },
                  "challenge": {
                    "additionalProperties": {},
                    "description": "Decoded unsigned PaymentRequired object, at most 32 offers. Analysis version 1 covers x402 v1/v2 Exact EVM; analysis version 2 covers the pinned x402 v2 EVM profiles.",
                    "type": "object"
                  },
                  "method": {
                    "enum": ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"],
                    "type": "string"
                  },
                  "resource_url": {
                    "description": "Exact HTTP(S) resource URL, including query. No credentials, secret query parameters or fragment.",
                    "maxLength": 2048,
                    "type": "string"
                  }
                },
                "required": ["captured_at", "challenge", "method", "resource_url"],
                "type": "object"
              }
            },
            "required": ["baseline", "current"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:abb3531a33e511681302a2f368673b7c6b695274a8e04ad7b3cfe4753a1b5a7c"
        },
        {
          "name": "decode_payment_attribution",
          "title": "Decode declared application and settlement metadata",
          "description": "Free local decoding of an ERC-8021 schema-2 x402 builder-code suffix from supplied calldata. Separates application, facilitator, services and facilitator-reported metadata. No transaction lookup, receipt confirmation, identity verification or payment. Malformed and unsupported suffixes remain explicit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "calldata": {
                "description": "Full caller-supplied transaction input as even-length 0x hex, at most 90,000 bytes. No URL, transaction hash, signature or receipt.",
                "maxLength": 180002,
                "pattern": "^0x(?:[a-fA-F0-9]{2})*$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
