{
  "lockfileVersion": 2,
  "subjects": {
    "ca.resortfinder/resortfinder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://resortfinder.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "resortfinder",
        "title": "ResortFinder",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ResortFinder researches all-inclusive resorts in Mexico and the Caribbean and hands travellers to a licensed booking partner or a free human advisor.\n\nTypical flow: search_resorts to shortlist, get_resort_details on the finalists, optionally get_best_price_chart or search_recent_package_prices for price context, then hand off: get_booking_link when the traveller wants to book one resort themselves, or submit_advisor_request when they want a person to price or book it (families, groups, US travellers, several resorts, special requests). get_advisor_quote_link is the fallback when they would rather fill in the form themselves.\n\nRules:\n- Only recommend resorts returned by these tools, and use their exact slugs.\n- Prices from these tools are dated observations or advertised chart minima, never live quotes. Say when they were checked. The final price and availability are confirmed at checkout or by an advisor.\n- These tools cannot book, hold or pay. Never tell the traveller a trip is booked or reserved. Say what happens next: they open the link, or an advisor contacts them.\n- Online booking serves travellers departing from Canada (prices in CAD). US travellers and any party with children are served by a free advisor; get_booking_link returns the right link for each case.\n- submit_advisor_request sends the traveller's name and contact details to ResortFinder. Only send details the traveller gave you in this conversation, show them what you will send, and get a clear yes first. Never invent or reuse contact details, and never submit twice.\n- Never ask for payment details, passport numbers or dates of birth.",
      "tools": [
        {
          "name": "get_advisor_quote_link",
          "title": "Get an advisor quote link",
          "description": "Build a link to ResortFinder's free advisor request, prefilled with up to 5 shortlisted resorts and the trip details. Use it when the traveller wants a person to price or book, is comparing several resorts, has children, has a group, or has needs the self-serve search cannot express. The traveller adds their own contact details on the page. This tool sends nothing and creates no record.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Number of adults. Default 2.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "children": {
                "description": "Number of children under 18. Default 0.",
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "departureAirportCode": {
                "description": "Departure airport IATA code. Canadian gateways: YYZ=Toronto, YUL=Montréal, YOW=Ottawa, YHM=Hamilton, YKF=Waterloo, YYC=Calgary, YEG=Edmonton, YVR=Vancouver, YWG=Winnipeg, YQR=Regina, YXE=Saskatoon, YHZ=Halifax, YQB=Québec City, YYT=St. John's.",
                "type": "string"
              },
              "departureDate": {
                "description": "Departure date, YYYY-MM-DD.",
                "type": "string"
              },
              "market": {
                "description": "Where the traveller departs from: \"ca\" (default) for Canada, \"us\" for the United States. Ask if unknown.",
                "enum": ["ca", "us"],
                "type": "string"
              },
              "nights": {
                "description": "Trip length in nights. 7 is the most widely available.",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "resortSlugs": {
                "description": "0 to 5 exact resort slugs from search_resorts. Omit when the traveller has no shortlist yet.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "rooms": {
                "description": "Number of rooms. Default 1.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02071bddc48539a7f265815b00a5e09053d3e85e3be2ce04d031b2fcbbe24e95"
        },
        {
          "name": "get_best_price_chart",
          "title": "Best Price monthly chart",
          "description": "The most recent weekly snapshot of ResortFinder's Best Price chart for one Canadian departure airport: the lowest advertised package price by month for a resort, area or destination, for 7 days, 2 adults, 1 room. Use it for 'when is it cheapest' and month-to-month comparisons. Figures are advertised minima in the chart's displayed dollars, not live prices, not availability and not a quote for another party size. Quote the capturedAt date. N/A means no price was displayed, not sold out.",
          "inputSchema": {
            "properties": {
              "departureAirportCode": {
                "description": "Required exact three-letter Canadian gateway, e.g. YEG, YYC or YYZ.",
                "type": "string"
              },
              "destination": {
                "description": "Country or area text, e.g. Mexico, Playa Mujeres or Punta Cana.",
                "type": "string"
              },
              "level": {
                "description": "hotel for resort rows; destination for country minima; area for destination-area minima.",
                "enum": ["hotel", "area", "destination"],
                "type": "string"
              },
              "maxResults": {
                "maximum": 36,
                "minimum": 1,
                "type": "integer"
              },
              "months": {
                "description": "Requested YYYY-MM months; omit for the whole captured 12-month chart. Use current/next occurrence of month-only requests.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "resortNames": {
                "description": "Exact provider chart hotel names when a catalog slug is unavailable.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "resortSlugs": {
                "description": "Exact catalog slugs, including the correct resort from follow-up card context.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sort": {
                "enum": ["price", "month"],
                "type": "string"
              }
            },
            "required": ["departureAirportCode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9df7618c2e3191ffb91e37a30b6883007ebf4328720dc3d33d3ccd82cbec2f7"
        },
        {
          "name": "get_booking_link",
          "title": "Get a booking link",
          "description": "Build the link that lets the traveller book one resort. With a Canadian departure airport, date, nights and an adults-only party it returns bookingUrl: a ResortFinder page with the trip prefilled, one click from live packages and secure partner checkout. For US travellers, parties with children, or resorts without self-serve search it returns advisorUrl instead, with the trip prefilled for a free advisor. Read status and nextStep and relay them. This tool does not book, hold or charge anything, and creates no record.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Number of adults. Default 2.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "children": {
                "description": "Number of children under 18. Default 0.",
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "departureAirportCode": {
                "description": "Departure airport IATA code. Canadian gateways: YYZ=Toronto, YUL=Montréal, YOW=Ottawa, YHM=Hamilton, YKF=Waterloo, YYC=Calgary, YEG=Edmonton, YVR=Vancouver, YWG=Winnipeg, YQR=Regina, YXE=Saskatoon, YHZ=Halifax, YQB=Québec City, YYT=St. John's.",
                "type": "string"
              },
              "departureDate": {
                "description": "Departure date, YYYY-MM-DD.",
                "type": "string"
              },
              "market": {
                "description": "Where the traveller departs from: \"ca\" (default) for Canada, \"us\" for the United States. Ask if unknown.",
                "enum": ["ca", "us"],
                "type": "string"
              },
              "nights": {
                "description": "Trip length in nights. 7 is the most widely available.",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "resortSlug": {
                "description": "Exact resort slug from search_resorts.",
                "type": "string"
              },
              "rooms": {
                "description": "Number of rooms. Default 1.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["resortSlug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b015e5058a49601dada17141126d53aca7521bd347c27104db0bc54f0eba808"
        },
        {
          "name": "get_resort_details",
          "title": "Get resort details",
          "description": "Detailed research for 1 to 5 resort slugs in one call: nine traveller lenses (food, pool, beach, quiet, value, couples, families, solo, what to know) each with a summary, positives, negatives, verdict and confidence; recent guest-review intelligence; rooms; restaurants and bars; observed package price signals; and links to TripAdvisor and the resort's own site. Review evidence covers the last 12 months only, so qualify low-confidence lenses. Slugs listed in notFound are not in the catalog.",
          "inputSchema": {
            "properties": {
              "slugs": {
                "description": "1-5 resort slugs from search_resorts or search_recent_package_prices results. Batch your finalists.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:43f2bb9d8da45e98d8b29e8507ef8fcaa728ef813e6a28deaae6df2d705c0ec9"
        },
        {
          "name": "search_guest_reviews",
          "title": "Search guest reviews",
          "description": "Verbatim guest-review snippets from the last 12 months for one resort and one theme, such as 'food quality', 'noise', 'kids club' or 'sargassum'. Use when the traveller wants proof or raises a specific worry. Returns up to 5 snippets, most recent first, with source links where available.",
          "inputSchema": {
            "properties": {
              "maxResults": {
                "description": "How many snippets to return. Default 3.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Resort slug from search_resorts or search_recent_package_prices results.",
                "type": "string"
              },
              "theme": {
                "description": "Short theme phrase, e.g. 'food quality', 'noise', 'kids club', 'sargassum', 'swim-up bar'.",
                "type": "string"
              }
            },
            "required": ["slug", "theme"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c1b57f6dd0b98ce0915dc8b7586af77e0d560b2d9e52449a83c6b0c3eff0e05"
        },
        {
          "name": "search_recent_package_prices",
          "title": "Recently checked package prices",
          "description": "Cheapest recently observed flight-inclusive package per resort for a Canadian departure airport and month, with per-person and total CAD price, departure date, sample count and when it was last seen. Use it to rank resorts by price or apply a per-person budget. A departure airport is required. Defaults are 7 nights and 2 travellers. maxPricePerPersonCad and minStarRating are strict filters. These are stored observations: say when each was last seen and that the final price is confirmed at checkout.",
          "inputSchema": {
            "properties": {
              "audience": {
                "enum": ["adults-only", "family-friendly", "everyone"],
                "type": "string"
              },
              "country": {
                "description": "ISO-3166 alpha-2 country codes for countries in our catalog: MX=Mexico, CU=Cuba, JM=Jamaica, BS=Bahamas, TC=Turks & Caicos, KY=Cayman Islands, DO=Dominican Republic, LC=St Lucia, AG=Antigua & Barbuda, BB=Barbados, SX=St Maarten, BM=Bermuda, GD=Grenada, GP=Guadeloupe, HT=Haiti, AW=Aruba, CW=Curaçao, CR=Costa Rica, HN=Honduras, PA=Panama, CO=Colombia.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "departureAirportCity": {
                "description": "Departure city fallback when the airport code is unknown, e.g. Calgary.",
                "type": "string"
              },
              "departureAirportCode": {
                "description": "Exact IATA departure gateway code, e.g. YYC for Calgary, YYZ for Toronto Pearson, YUL for Montreal.",
                "type": "string"
              },
              "destinationQuery": {
                "description": "Free-text destination fallback, e.g. Cancun or Punta Cana. Prefer regions when the user names a known region.",
                "type": "string"
              },
              "excludeSlugs": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "maxPricePerPersonCad": {
                "description": "Hard per-person CAD ceiling. Required whenever the visitor states a per-person maximum budget.",
                "maximum": 100000,
                "minimum": 1,
                "type": "number"
              },
              "maxResults": {
                "description": "Cap on price rows returned. Default 8.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "minStarRating": {
                "description": "Hard minimum supplier-listed star rating. Use only when the visitor explicitly states a star requirement.",
                "maximum": 5,
                "minimum": 1,
                "type": "number"
              },
              "nights": {
                "description": "Package length in nights. Default to 7 for SunVoyage price questions when the user does not specify.",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "regions": {
                "description": "Region labels. Use 'Cancun area' for the Cancun/Riviera Maya/Playa Mujeres/Cozumel cluster. Valid labels: Cancun area (all nearby), Cancun area, Cancun, Riviera Maya, Playa Mujeres, Cozumel, Puerto Vallarta, Los Cabos, Other Mexico, Punta Cana, Cap Cana, La Romana, Puerto Plata, Other DR, Negril, Montego Bay, Ocho Rios, Runaway Bay, Cuba, Bahamas, Turks & Caicos, Cayman Islands, St Lucia, Antigua & Barbuda, Barbados, St Maarten, Bermuda, Grenada, Guadeloupe, Haiti, Aruba, Curaçao, Costa Rica, Honduras, Panama, Colombia.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "seasonLabel": {
                "description": "YYYY-MM season bucket, e.g. 2026-08.",
                "type": "string"
              },
              "travelerCount": {
                "description": "Total travelers represented by the package price history. Default to 2 for current SunVoyage price questions when the user does not specify.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:54a323a7b427293ed1339a88477a87c1bf01f0e5ba2547ac1667383e9bb1b965"
        },
        {
          "name": "search_resorts",
          "title": "Search all-inclusive resorts",
          "description": "Shortlist bookable all-inclusive resorts by country, region, audience (adults-only or family-friendly), price tier, vibe, cuisine or venue, swim-up bar or room, kids club, solo-traveller fit, or brand. Returns slug, name, destination, tagline, best-for tags and a resort page URL. Start here for any recommendation. priceBand and vibeKeywords only influence ranking; the other filters are strict. If nothing matches, suggestedRelaxations says which filter to loosen; do not invent resorts.",
          "inputSchema": {
            "properties": {
              "audience": {
                "description": "Who the trip is for. Use adults-only for honeymoons, couples, kid-free trips. Use family-friendly when the user mentions kids or family.",
                "enum": ["adults-only", "family-friendly", "everyone"],
                "type": "string"
              },
              "brand": {
                "description": "Filter by chain, brand, property family, or named resort. Accepts names like 'Moon Palace', 'Planet Hollywood', 'Riu Palace', 'Hyatt Ziva', 'Grand Palladium', or slugs like 'riu'. Use ONLY when the user explicitly mentions a chain, brand, property family, or named resort.",
                "type": "string"
              },
              "country": {
                "description": "ISO-3166 alpha-2 country codes for countries in our catalog: MX=Mexico, CU=Cuba, JM=Jamaica, BS=Bahamas, TC=Turks & Caicos, KY=Cayman Islands, DO=Dominican Republic, LC=St Lucia, AG=Antigua & Barbuda, BB=Barbados, SX=St Maarten, BM=Bermuda, GD=Grenada, GP=Guadeloupe, HT=Haiti, AW=Aruba, CW=Curaçao, CR=Costa Rica, HN=Honduras, PA=Panama, CO=Colombia. Filtering to a country we don't carry returns no results.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "diningKeywords": {
                "description": "Cuisine or venue terms that must match structured restaurants or editorial dining text. Use for requests like 'Indian restaurant', 'Sutra', 'Taj', 'steakhouse', 'teppanyaki', or 'vegan'.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "excludeSlugs": {
                "description": "Resort slugs that must not appear in this search, usually prior recommendation cards. The server also injects prior cards even if you omit this.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "hasKidsClub": {
                "description": "Filter to resorts with a kids club.",
                "type": "boolean"
              },
              "hasSwimUp": {
                "description": "Filter to resorts with a swim-up bar. Do not use this for swim-up room or swim-up suite requests.",
                "type": "boolean"
              },
              "hasSwimUpRoom": {
                "description": "Filter to resorts with at least one swim-up room or swim-up suite category.",
                "type": "boolean"
              },
              "maxResults": {
                "description": "Cap on rows returned. Default 40. Use a smaller number (10-15) when you want only the top matches.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "priceBand": {
                "description": "Approximate price tier. Used server-side as a soft ranking boost, not a hard filter, because many resorts do not yet have luxury_tier populated.",
                "enum": ["budget", "mid", "premium", "luxury"],
                "type": "string"
              },
              "regions": {
                "description": "Region labels. Use 'Cancun area' for the whole Cancun/Riviera Maya/Playa Mujeres/Cozumel cluster - most users mean this when they say 'Cancun'.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "soloTraveler": {
                "description": "Use for a traveler staying alone. Requires medium/high solo-specific evidence and must not be treated as an adults-only alias.",
                "type": "boolean"
              },
              "vibeKeywords": {
                "description": "Free-form bestFor tag matches. e.g. ['couples', 'honeymooners']. Each keyword passes if it appears in any resort's bestFor tags.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:149d74d88d58c5b8a77bb8ff203e71b7d25e7409ff8efff349834c76b49399e9"
        },
        {
          "name": "submit_advisor_request",
          "title": "Send a request to a ResortFinder advisor",
          "description": "Send the traveller's trip request to ResortFinder's travel advisors, who reply to the traveller directly with current prices and can complete the booking. Advisor help is free. It creates a real request, emails the advisor team and sends the traveller a confirmation email. Before calling: collect name, email, departure city, travel timing and party; show the traveller a short summary of what will be sent; and get their explicit agreement, then set consentToContact to true. Call once per request. It does not book or charge anything.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Number of adults. Default 2.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "budgetAmount": {
                "description": "Budget as a number, in CAD for Canada or USD for the US, including flights, resort, taxes and fees. Optional.",
                "maximum": 999999,
                "minimum": 1,
                "type": "number"
              },
              "budgetBasis": {
                "description": "Whether budgetAmount is the total for everyone or per person. Required with budgetAmount.",
                "enum": ["total", "per_person"],
                "type": "string"
              },
              "children": {
                "description": "Number of children under 18. Default 0.",
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "childrenAges": {
                "description": "One age per child, at the time of travel. Required when children is above 0.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 8,
                "type": "array"
              },
              "consentToContact": {
                "description": "true only after the traveller has seen the details and agreed to send them to ResortFinder and be contacted by an advisor.",
                "type": "boolean"
              },
              "contactChannel": {
                "description": "How the traveller wants the advisor to reply. Default email.",
                "enum": ["email", "text", "call"],
                "type": "string"
              },
              "departureCity": {
                "description": "City or airport the traveller flies from, e.g. 'Toronto', 'YYC', 'Chicago'.",
                "maxLength": 200,
                "type": "string"
              },
              "departureDate": {
                "description": "Fixed departure date, YYYY-MM-DD. Send with nights.",
                "type": "string"
              },
              "earliestDepartureDate": {
                "description": "For flexible dates: earliest day they could leave, YYYY-MM-DD. Send with latestReturnDate and nights.",
                "type": "string"
              },
              "email": {
                "description": "Traveller's email, as they gave it. Never guess.",
                "maxLength": 200,
                "type": "string"
              },
              "latestReturnDate": {
                "description": "For flexible dates: latest day they could be home, YYYY-MM-DD.",
                "type": "string"
              },
              "market": {
                "description": "Where the traveller departs from: \"ca\" (default) for Canada, \"us\" for the United States. Ask if unknown.",
                "enum": ["ca", "us"],
                "type": "string"
              },
              "name": {
                "description": "Traveller's name, as they gave it.",
                "maxLength": 120,
                "type": "string"
              },
              "nights": {
                "description": "Trip length in nights.",
                "maximum": 30,
                "minimum": 3,
                "type": "integer"
              },
              "notes": {
                "description": "Anything else the advisor should know: priorities, concerns, occasion, room needs, what the traveller liked about each resort.",
                "maxLength": 1500,
                "type": "string"
              },
              "phone": {
                "description": "Phone number. Required only when contactChannel is text or call.",
                "maxLength": 50,
                "type": "string"
              },
              "resortSlugs": {
                "description": "0 to 5 exact resort slugs from search_resorts that the traveller is interested in.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "rooms": {
                "description": "Number of rooms. Default 1.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "travelDatesNote": {
                "description": "Timing in the traveller's words when exact dates are not known, e.g. 'March break 2027' or 'any week in February'.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["consentToContact", "departureCity", "email", "name"],
