        },
        {
          "name": "get_product",
          "title": "Get a product",
          "description": "Fetch one product listing by its slug: tagline, description, maker, categories, upvotes and launch date.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
