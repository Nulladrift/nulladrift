      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "awesomeindie",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Awesome Indie (https://awesomeindie.com) is a directory of indie and micro-startup products: daily launches, period rankings, maker profiles and a community feed. Anonymous connections get the discovery tools. Connecting with OAuth (any Awesome Indie account) unlocks the maker tools: submitting and updating products, launch status, per-product stats, the comment inbox and draft writing. There is intentionally no upvote tool — votes cast by agents would be ranking manipulation — and posts and articles can only be drafted here, never published. The payment tools (Skip the Line launches, Pro) never charge anything: they return a hosted checkout URL for the user to open and pay in a browser.",
      "tools": [
        {
          "name": "get_article",
          "title": "Get an article",
          "description": "Read one community article (markdown body) by its author username and article slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "The article slug from its URL",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "username": {
                "description": "The author username, without the @",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug", "username"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b89d2ba4cfe48dace9ace9d5f5183aa4469c12c7d4673f89fcd5d474f1984575"
        },
        {
          "name": "get_community_posts",
          "title": "Recent community posts",
          "description": "The most recent posts from the Awesome Indie community feed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many posts to return (default 20)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:deac50fddb0ea4751c5dc3867afe3d1b1b0ad25b127891eb794adb373d067297"
        },
        {
          "name": "get_launch_availability",
          "title": "Launch availability",
          "description": "When a product submitted today would launch: the free-queue window, and the paid \"Skip the Line\" window that lets a launch be booked for a specific day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
