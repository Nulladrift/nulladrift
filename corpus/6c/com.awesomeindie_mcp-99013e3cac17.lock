        {
          "name": "get_top_products",
          "title": "Top products by period",
          "description": "The ranked products for a period. Without a slug, the current period is a rolling window (last 1/7/30/365 days), exactly like the site. With a slug, an archived calendar period: daily \"2026-08-06\", weekly \"2026-08-03\" (a Monday), monthly \"2026-08\", yearly \"2026\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many products to return (default 20)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "description": "daily, weekly, monthly or yearly",
                "enum": ["daily", "weekly", "monthly", "yearly"],
                "type": "string"
              },
              "slug": {
                "description": "Archived period slug; omit for the current period",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["period"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:359ab609ecda7437e910a4ed6690c40b0b8b720cc969f435c0b0a03bbcd26118"
        },
