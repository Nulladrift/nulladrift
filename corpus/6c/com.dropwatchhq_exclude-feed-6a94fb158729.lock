{
  "lockfileVersion": 2,
  "subjects": {
    "com.dropwatchhq/exclude-feed": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://exclude.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "exclude-feed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "roster_rescreen",
          "description": "Re-screen an ENTIRE ROSTER of employees, contractors, and vendors against the federal exclusion & sanctions lists (HHS-OIG LEIE, OFAC SDN+Consolidated, SAM.gov debarment) in ONE call, and mint a DATED, ed25519-SIGNED COMPLIANCE RECEIPT. This is the OIG-mandated MONTHLY exclusion check for healthcare billing / RCM / compliance teams: OIG guidance says screen every employee, contractor, and vendor against the LEIE each month, because a single excluded person on a claim triggers Civil Monetary Penalties. The signed receipt is your audit artifact — verifiable offline, proving WHO you screened, against WHICH list build, on WHAT date. Returns per-entity verdicts (cleared vs. flagged) plus a verifiable receipt URL.",
          "inputSchema": {
            "properties": {
              "org": {
                "description": "Your organization name (printed on the compliance receipt).",
                "type": "string"
              },
              "period": {
                "description": "Compliance period as YYYY-MM (defaults to the current month).",
                "type": "string"
              },
              "roster": {
                "description": "The people/entities to screen. Each is a name string or {name, npi?, uei?, state?} object (max 250).",
                "items": {
                  "type": ["string", "object"]
                },
                "type": "array"
              }
            },
            "required": ["roster"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b0890c127409edabeb56c194d613ffe574888c250cfd176b9d025937c0ce1e6f"
        },
        {
          "name": "screen_batch",
          "description": "Bulk-screen up to 50 entities in one call against all federal exclusion/sanctions lists. Pass an array of names (or {name,npi,state} objects). Returns one verdict per row. Free tool (rate-limited).",
          "inputSchema": {
            "properties": {
              "entities": {
                "description": "Array of names or {name,npi,uei,state} objects (max 50).",
                "items": {
                  "type": ["string", "object"]
                },
                "type": "array"
              }
            },
            "required": ["entities"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:405dded550bf554e5fa3268aaae1b02365f29c07b10ceebaa559e6e14e60f1fe"
        },
        {
          "name": "screen_exclusion",
          "description": "Screen a business entity / vendor / counterparty for FEDERAL EXCLUSIONS & SANCTIONS before you onboard or pay it. One unified, DEDUPED check across OFAC SDN, OFAC Consolidated (sanctions), HHS-OIG LEIE (healthcare exclusions), SAM.gov (federal contractor debarment/suspension), and publicly-available state debarment lists. Returns match / possible-match / no-match, the matched record(s) with source + exclusion type + dates, and a confidence score. FCRA-SAFE: this is KYB/sanctions compliance for entities — NOT a consumer report, not for credit/employment/insurance/tenancy decisions about individuals.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional country to disambiguate.",
                "type": "string"
              },
              "name": {
                "description": "Legal / business name of the entity to screen.",
                "type": "string"
              },
              "npi": {
                "description": "Optional 10-digit NPI (healthcare) for an exact LEIE match.",
                "type": "string"
              },
              "state": {
                "description": "Optional 2-letter state to disambiguate name matches.",
                "type": "string"
              },
              "uei": {
                "description": "Optional SAM UEI.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b541408548dbeae55d44364232085a949933b6af0cceb86cf87293dbdb8566b4"
        },
        {
          "name": "watch_entity",
          "description": "Add an entity to a watchlist that is RE-SCREENED daily. You get alerted (webhook/email) the first time it appears on any federal exclusion or sanctions list. Use for continuous vendor / counterparty monitoring.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Optional email alerted on a new hit.",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "npi": {
                "type": "string"
              },
              "webhook": {
                "description": "Optional URL POSTed on a new hit.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ca75ccc083e3e905ddb2a4a28ae367d0497c7ec824f7bc239c5db7708cdee692"
        }
      ],
      "digest": "sha256:905249eb9c38a8cd30429da87701078f05139ae0b7bf7de87110cdd6754f31b1"
    }
  }
}
