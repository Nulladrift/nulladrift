        {
          "name": "pitch-find-clubs",
          "title": "Find youth soccer clubs (NorCal Pitch)",
          "description": "Search the NorCal Pitch youth soccer club directory for Northern California. Filter by region, county or city, tier (Elite, Competitive, Recreational), league (for example ECNL, MLS NEXT, Girls Academy), gender, or free-text words. Returns each club's location, tier, leagues, website and verification date. Use pitch/list-areas for valid area names.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Where to look: a region, county or city, county, city or US state name, such as \"San Diego\", \"Boise\" or \"Colorado\". Partial names match. See list-areas for the names this directory uses.",
                "maxLength": 80,
                "type": "string"
              },
              "gender": {
                "description": "Only clubs with boys or girls programs. Clubs with both always match.",
                "enum": ["Boys", "Girls"],
                "type": "string"
              },
              "league": {
                "description": "A league the club plays in, such as \"ECNL\", \"ECNL RL\", \"MLS NEXT\", \"Girls Academy\" or \"N1L\". Partial names match.",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "description": "Most results to return, from 1 to 25. Default 10. The response also gives the total number of matches.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for in the club name, county, city, region, tier and leagues, such as \"Surf\" or \"Albion\". Every word must match. Leave out to list all clubs that fit the other filters.",
                "maxLength": 120,
                "type": "string"
              },
              "tier": {
                "description": "Level of play. Elite: national-league clubs such as ECNL, MLS NEXT or Girls Academy. Competitive: travel and club soccer. Recreational: community and AYSO-style programs. A club with teams at more than one level matches each of them.",
                "enum": ["Elite", "Competitive", "Recreational"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Find youth soccer clubs (NorCal Pitch)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:74140ae11c4c360c36e03853af1af4eefc20393f8b55ac42c1cd573337351be7"
        },
        {
          "name": "pitch-get-page",
          "title": "Read a page (NorCal Pitch)",
          "description": "Full text of one published NorCal Pitch page or article, as plain text with headings. Pass the URL or slug. Long pages come back in parts: pass next_offset as offset to continue.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "offset": {
                "description": "Where to resume a long page. Pass the next_offset value from the previous response. Default 0.",
                "minimum": 0,
                "type": "integer"
              },
              "url_or_slug": {
                "description": "The full page URL from a search result, or just its slug, such as \"tryouts\".",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["url_or_slug"],
            "type": "object"
          },
