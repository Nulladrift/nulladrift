      },
      "serverInfo": {
        "name": "sportsarena-mcp-server",
        "title": "SportArena",
        "version": "1.4.0",
        "description": "Official SportArena MCP server for real-time sports court availability search, upcoming tournament discovery, and court booking across 7 languages.",
        "websiteUrl": "https://www.sportarena.app",
        "icons": [
          {
            "src": "https://www.sportarena.app/images/logos/SportArena192x192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://www.sportarena.app/images/logos/SportArena512x512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Sei connesso al server MCP ufficiale di SportsArena. Puoi cercare campi liberi in tempo reale con 'search_available_courts', cercare tornei in programma con 'search_upcoming_tournaments' e prenotare campi con 'create_court_booking'. Quando presenti i risultati, includi SEMPRE i link diretti ('bookingUrl' o 'tournamentUrl') in formato Markdown per permettere all'utente di aprire la struttura o il torneo sull'app SportArena.",
      "tools": [
        {
          "name": "create_court_booking",
          "title": "Book a Sports Court",
          "description": "Crea una prenotazione su SportsArena con il fieldId selezionato, orari e dati dell'utente (richiede header X-Ai-ApiKey o argomento apiKey). Utilizza l'algoritmo intelligente Best-Fit anti-frammentazione e collega automaticamente la prenotazione all'account dell'utente se registrato.",
          "inputSchema": {
            "properties": {
              "apiKey": {
                "description": "Chiave API opzionale se non fornita tramite header X-Ai-ApiKey.",
                "type": "string"
              },
              "customerEmail": {
                "description": "Email per conferma e associazione all'account SportsArena.",
                "type": "string"
              },
              "customerName": {
                "description": "Nome e cognome di chi prenota.",
                "type": "string"
              },
              "customerPhone": {
                "description": "Recapito telefonico opzionale.",
                "type": "string"
              },
              "endTime": {
                "description": "Data e ora di fine in formato ISO (es. '2026-09-15T19:30:00Z').",
                "type": "string"
              },
              "fieldId": {
                "description": "ID numerico del campo sportivo da prenotare.",
                "type": "integer"
              },
              "language": {
                "description": "Lingua del messaggio di conferma: 'it', 'en', 'es', 'fr', 'de', 'pt', 'pt-BR'.",
                "type": "string"
              },
              "notes": {
                "description": "Note facoltative.",
                "type": "string"
              },
              "sport": {
                "description": "Sport del campo ('padel', 'tennis', 'beachVolley', 'calcetto', 'biliardo', 'bowling', ecc.).",
                "type": "string"
              },
              "startTime": {
                "description": "Data e ora di inizio in formato ISO (es. '2026-09-15T18:00:00Z').",
                "type": "string"
              }
            },
            "required": ["customerEmail", "customerName", "endTime", "fieldId", "startTime"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a Sports Court"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ae63ff1e8b4b2c709f7959efd189c1a447d92c916a47fe9e3c08a62d7c1bf899"
        },
        {
          "name": "search_available_courts",
          "title": "Search Available Sports Courts",
          "description": "Cerca campi sportivi liberi in tempo reale su SportsArena. Supporta nomi sport in 7 lingue (IT, EN, ES, FR, DE, PT, PT-BR: padel, tennis, beach volley, beach tennis, calcetto, futsal, 5-a-side, calcio a 8, calcio, basket, pallavolo, pickleball, biliardo, bowling, ecc.) e geocoding testuale (es. 'Roma eur', 'Milano', 'Madrid', 'Berlin', 'Paris', 'Lisboa') o coordinate GPS. Restituisce le strutture disponibili, prezzi orari e il link diretto 'bookingUrl'.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Data in formato ISO YYYY-MM-DD (es. '2026-09-15').",
                "type": "string"
              },
              "durationMinutes": {
                "description": "Durata partita in minuti (default 90; accetta anche 60 o 120).",
                "type": "integer"
              },
              "language": {
                "description": "Lingua preferita per i link e messaggi: 'it', 'en', 'es', 'fr', 'de', 'pt', 'pt-BR'.",
                "type": "string"
              },
              "latitude": {
                "description": "Latitudine GPS opzionale.",
                "type": "number"
              },
              "locationText": {
                "description": "Città, quartiere o indirizzo (es. 'Roma eur', 'Milano Bicocca', 'Madrid centro', 'München', 'Lisboa').",
                "type": "string"
              },
              "longitude": {
                "description": "Longitudine GPS opzionale.",
                "type": "number"
              },
              "radiusKm": {
                "description": "Raggio di ricerca in km (default 15).",
                "type": "number"
              },
              "sport": {
                "description": "Sport ('padel', 'tennis', 'beachVolley', 'calcetto', 'futsal', '5-a-side', 'calcio a 8', 'calcio', 'basket', 'pallavolo', 'pickleball', 'biliardo', 'bowling', ecc.). Riconosce 7 lingue: IT, EN, ES, FR, DE, PT, PT-BR.",
                "type": "string"
              },
              "time": {
                "description": "Orario preferito di inizio in formato HH:mm (es. '18:00', '10:30').",
                "type": "string"
              },
              "toleranceHours": {
                "description": "Flessibilità oraria +/- in ore (default 2).",
                "type": "integer"
              }
            },
            "required": ["date", "sport", "time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Available Sports Courts"
          },
          "behavior": {
            "destructive": false,
