            "readOnly": true
          },
          "digest": "sha256:3ff42873999dd70298cdc62e2eef1281c9f13ea07a1f99e26326c4757d241d49"
        },
        {
          "name": "search_upcoming_tournaments",
          "title": "Search Upcoming Sports Tournaments",
          "description": "Cerca tornei e campionati sportivi in programma su SportsArena filtrando opzionalmente per sport (in 7 lingue), città/zona o coordinate GPS e intervallo di date. Restituisce nome torneo, date, categoria, organizzatore, sede, stato iscrizioni e link diretto 'tournamentUrl'.",
          "inputSchema": {
            "properties": {
              "fromDate": {
                "description": "Data minima opzionale ISO YYYY-MM-DD (default: oggi).",
                "type": "string"
              },
              "language": {
                "description": "Lingua preferita per i link: 'it', 'en', 'es', 'fr', 'de', 'pt', 'pt-BR'.",
                "type": "string"
              },
              "latitude": {
                "description": "Latitudine GPS opzionale.",
                "type": "number"
              },
              "locationText": {
                "description": "Città, quartiere o regione opzionale (es. 'Roma', 'Milano', 'Madrid'). Ometti per ricerca globale.",
                "type": "string"
              },
              "longitude": {
                "description": "Longitudine GPS opzionale.",
                "type": "number"
              },
              "radiusKm": {
                "description": "Raggio di ricerca in km (default 50).",
                "type": "number"
              },
              "sport": {
                "description": "Sport opzionale ('padel', 'tennis', 'beachVolley', 'calcetto', 'basket', 'pallavolo', 'biliardo', 'bowling', ecc.). Ometti per tutti gli sport.",
                "type": "string"
              },
              "toDate": {
                "description": "Data massima opzionale ISO YYYY-MM-DD.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
