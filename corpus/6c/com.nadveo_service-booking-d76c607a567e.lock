{
  "lockfileVersion": 2,
  "subjects": {
    "com.nadveo/service-booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nadveo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "nadveo",
        "title": "Nadveo — find a service company",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Finds service companies on Nadveo (air conditioning first) by country, city, district, service or name, best first: those coming fast to the district, with an earlier free day and a well-founded rating. Show the client a few to choose from. Then, with the chosen result's `company`, use the other tools here — company_info, list_services, get_quote, check_availability, book_appointment (pass the district), get_request_status, cancel_request — or connect to its mcp_url (Streamable HTTP, no key needed). Book only what the client asked for, with their name, phone and address, and confirm the time with them first.",
      "tools": [
        {
          "name": "book_appointment",
          "title": "Book the visit",
          "description": "At the company chosen from find_companies (pass its `company`). Books the visit at a free time from check_availability. Only after the client confirmed the service, the time, the address and the price. The company messages the client (WhatsApp, or e-mail when given). Returns the request number and a token for get_request_status / cancel_request. Repeating the same call (same idempotency_key or the same data) returns the same booking — its token again only with the same idempotency_key, so send one to be able to retry.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Where the work is done: street, building, apartment, city.",
                "type": "string"
              },
              "answers": {
                "additionalProperties": true,
                "description": "Answers to the service's questions: { question_id: option_id | [option_ids] | number | text }. Use the ids from list_services.",
                "type": "object"
              },
              "client_accepted_disclaimer": {
                "description": "Needed with diagnosis: the client agreed it is a hint, not a diagnosis.",
                "type": "boolean"
              },
              "client_email": {
                "description": "Optional: messages go to this e-mail instead of WhatsApp.",
                "type": "string"
              },
              "client_name": {
                "type": "string"
              },
              "client_phone": {
                "description": "With the country code, e.g. +971 50 123 4567.",
                "type": "string"
              },
              "company": {
                "description": "The company: the `company` of a find_companies result.",
                "type": "string"
              },
              "diagnosis": {
                "description": "Optional: { brand, code } from diagnose — the technician sees it.",
                "properties": {
                  "brand": {
                    "type": "string"
                  },
                  "code": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "district": {
                "description": "When company_info lists service_zones: the client's district as its zone id (e.g. \"dubai:jlt\"), or \"other\" when it is not in the list.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional, 8–100 of A-Z a-z 0-9 _ -: the same key never books twice.",
                "type": "string"
              },
              "lang": {
                "description": "Language for names and labels: ru, es, en, ar, pt, fr, de, it, tr, id, vi, th. Default en.",
                "type": "string"
              },
              "service": {
                "description": "The service key from list_services.",
                "type": "string"
              },
              "slot_id": {
                "description": "A slot_id from check_availability.",
                "type": "integer"
              },
              "units": {
                "description": "How many (air conditioners, sockets, taps… — as the service asks) — only for services that count them. Default 1.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["address", "client_name", "client_phone", "company", "service", "slot_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6f623bfcba90827f6c8e116281c4e1e1edac050b6e58bb0d41caaee7bc41b10b"
        },
        {
          "name": "cancel_request",
          "title": "Cancel a booking",
          "description": "At the company chosen from find_companies (pass its `company`). Cancels the booking (only when the client asked to). Needs the token from book_appointment.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "The company: the `company` of a find_companies result.",
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["company", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:43a107189208c94f050981009852a70a8c3d14d9f1535f4179f1a0cc2a9af39d"
        },
        {
          "name": "check_availability",
          "title": "Free times",
          "description": "At the company chosen from find_companies (pass its `company`). Free start times for the service (with these answers and units — they set how long the work takes) over the next days, from tomorrow. Each time has a slot_id for book_appointment. Times are the company's local time.",
          "inputSchema": {
            "properties": {
              "answers": {
                "additionalProperties": true,
                "description": "Answers to the service's questions: { question_id: option_id | [option_ids] | number | text }. Use the ids from list_services.",
                "type": "object"
              },
              "company": {
                "description": "The company: the `company` of a find_companies result.",
                "type": "string"
              },
              "days": {
                "description": "How many days ahead to look. Default 7.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "service": {
                "description": "The service key from list_services.",
                "type": "string"
              },
              "units": {
                "description": "How many (air conditioners, sockets, taps… — as the service asks) — only for services that count them. Default 1.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["company", "service"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:549dcb356851213b0fd9c767aff01ad3b8d83fd825a56132bbceb769b0294e8d"
        },
        {
          "name": "company_info",
          "title": "About the company",
          "description": "At the company chosen from find_companies (pass its `company`). The company: name, country and city, currency, languages, contacts, clients' rating, the districts it serves (main: fast arrival; secondary: next day or a call-out fee), today's date in its time zone and its booking page.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "The company: the `company` of a find_companies result.",
                "type": "string"
              },
              "lang": {
                "description": "Language for names and labels: ru, es, en, ar, pt, fr, de, it, tr, id, vi, th. Default en.",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfe6f2708d5ed06a2317fdd8de9cbee3ad04a3786104b673bb6f283dd00f6412"
        },
        {
          "name": "diagnose",
          "title": "Hint by the error code",
          "description": "At the company chosen from find_companies (pass its `company`). A preliminary hint by the air conditioner's brand and the error code on its display: the probable cause (a breakdown type) and the company's starting price for it. It is not a diagnosis. Before giving it, tell the client it is an automatic hint, that the technician confirms the cause and the final price on site, and get their agreement — then pass client_accepted_disclaimer: true (also to book_appointment with the diagnosis). Brands: daikin, mitsubishi_electric, lg, samsung, gree, midea, panasonic, carrier, haier, tcl, other.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand key (see the description), or \"other\".",
                "type": "string"
              },
              "client_accepted_disclaimer": {
                "description": "The client agreed that this is an automatic hint, not a diagnosis.",
                "type": "boolean"
              },
              "code": {
                "description": "The code on the display, e.g. U4, E1, CH05.",
                "type": "string"
              },
              "company": {
                "description": "The company: the `company` of a find_companies result.",
                "type": "string"
              },
              "lang": {
                "description": "Language for names and labels: ru, es, en, ar, pt, fr, de, it, tr, id, vi, th. Default en.",
                "type": "string"
              }
            },
            "required": ["brand", "client_accepted_disclaimer", "code", "company"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ad73f11acb839480e999dcb376f861dd63424011fea8235272b2af722f903d9"
        },
        {
          "name": "find_companies",
          "title": "Find a company",
          "description": "Service companies in the Nadveo catalog, filtered by country (ISO code, e.g. AE), city, district, service and name, best first. Each has its districts (main: fast arrival; secondary: next day or a call-out fee), \"from\" prices, the next free day and clients' rating, and badges: online_booking, quote_hours (how long a quote request waits for its quote, on average over 90 days; null — too few yet), amc (runs annual maintenance contracts), portal (gives its clients a portal).",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "The kind of service, e.g. hvac.maintenance, hvac.repair, repair.electrical, repair.plumbing.",
                "enum": ["hvac.maintenance", "hvac.repair", "hvac.installation", "hvac.emergency", "hvac.commercial", "hvac.rental", "hvac.other", "repair.appliances", "repair.electronics", "repair.plumbing", "repair.electrical", "repair.handyman", "repair.other", "rental.equipment", "rental.tools", "rental.events", "rental.other"],
                "type": "string"
              },
              "city": {
                "description": "The city, e.g. Dubai, Abu Dhabi, Sharjah (part of the name is enough).",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166 code, e.g. AE, MX, ID, TH, VN.",
                "type": "string"
              },
              "district": {
                "description": "The client's district in that city, e.g. \"JLT\", \"Dubai Marina\", \"Al Nahda\" (part of the name is enough).",
                "type": "string"
              },
              "query": {
                "description": "Part of the company name.",
                "type": "string"
              },
              "service": {
                "description": "Older form of category for air conditioning: maintenance = hvac.maintenance, repair = hvac.repair, installation = hvac.installation.",
                "enum": ["maintenance", "repair", "installation"],
                "type": "string"
              },
              "trade": {
                "description": "hvac = air conditioning and heating; repair = electrical, plumbing and other repairs. Matches the services a company offers, not only its main trade.",
                "enum": ["hvac", "repair", "rental"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e1f62c03fcfa8bea4fb4ed72c62b003f227d5842926e34b15b9b5f10fe3a4a6c"
        },
        {
          "name": "get_quote",
          "title": "Price for these answers",
          "description": "At the company chosen from find_companies (pass its `company`). Checks the client's answers and gives the price and the duration. If an answer is missing or wrong, \"problem\" says which question.",
          "inputSchema": {
            "properties": {
              "answers": {
                "additionalProperties": true,
                "description": "Answers to the service's questions: { question_id: option_id | [option_ids] | number | text }. Use the ids from list_services.",
                "type": "object"
              },
              "company": {
                "description": "The company: the `company` of a find_companies result.",
                "type": "string"
              },
              "lang": {
                "description": "Language for names and labels: ru, es, en, ar, pt, fr, de, it, tr, id, vi, th. Default en.",
                "type": "string"
              },
              "service": {
                "description": "The service key from list_services.",
                "type": "string"
              },
              "units": {
                "description": "How many (air conditioners, sockets, taps… — as the service asks) — only for services that count them. Default 1.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["company", "service"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b2bf1d80ea6b63b18d17c12f52b06b817d959cfbfbce1855f748a1955e4a40a5"
        },
        {
          "name": "get_request_status",
          "title": "Status of a booking",
          "description": "At the company chosen from find_companies (pass its `company`). Where a booking stands: status, time, technician (once assigned), price. Needs the token from book_appointment.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "The company: the `company` of a find_companies result.",
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["company", "token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:43ea3e20ee045ce0bb2cb4013c9ad543a0dea5f508f5ccea8199057a66400ecc"
        },
        {
          "name": "list_services",
          "title": "Services, prices and questions",
          "description": "At the company chosen from find_companies (pass its `company`). Every service with its starting price, how long it takes, whether it can be booked, and the questions the client answers (they set the price and the time). Questions may depend on an earlier answer (shown_if). \"unknown_allowed\" means \"?\" is a valid answer.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "The company: the `company` of a find_companies result.",
                "type": "string"
              },
              "lang": {
                "description": "Language for names and labels: ru, es, en, ar, pt, fr, de, it, tr, id, vi, th. Default en.",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b52b3c2f92ddb81419b1993e1ead6680833a0ca3eceb8fea5f671ee7616defd2"
        },
        {
          "name": "request_quote",
          "title": "Ask the company for a quote",
          "description": "At the company chosen from find_companies (pass its `company`). For a job that needs a quote, not a fixed price: sends the company the client's description of the job (what, where, how big, how urgent), their contact and address, and links to photos if the client gave any. The company writes the quote itself and sends it to the client (WhatsApp, or e-mail when given) — say so. Use a service whose booking is «quote request» from list_services (required when it lists more than one). A company without one books an on-site estimate instead (book_appointment with a service whose booking is «an assessment visit»). Only after the client confirmed the description and their contact.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Where the work is: street, building, apartment, city.",
                "type": "string"
              },
              "answers": {
                "additionalProperties": true,
                "description": "Answers to the service's questions: { question_id: option_id | [option_ids] | number | text }. Use the ids from list_services.",
                "type": "object"
              },
              "client_email": {
                "description": "Optional: the quote goes to this e-mail instead of WhatsApp.",
                "type": "string"
              },
              "client_name": {
                "type": "string"
              },
              "client_phone": {
                "description": "With the country code, e.g. +971 50 123 4567.",
                "type": "string"
              },
              "company": {
                "description": "The company: the `company` of a find_companies result.",
                "type": "string"
              },
              "description": {
                "description": "The job in the client's words, 10–2000 characters.",
                "type": "string"
              },
              "lang": {
                "description": "Language for names and labels: ru, es, en, ar, pt, fr, de, it, tr, id, vi, th. Default en.",
                "type": "string"
              },
              "photo_urls": {
                "description": "Optional: up to 5 https links to photos the client shared.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "service": {
                "description": "A quote-request service key from list_services; may be left out when there is only one.",
                "type": "string"
              }
            },
            "required": ["client_name", "client_phone", "company", "description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7343e1a8ad603badb61c7d7ffbc89117395511d029ff893e3f7e8aa0e72dfa6a"
        }
      ],
