          "title": "Query Oil Price",
          "description": "查询国内成品油价格（92号/95号/98号汽油、0号柴油）。传入省份名查该省油价，如\"山东\"；不传则返回全国31个省区市油价列表。返回下一轮调价窗口日期。",
