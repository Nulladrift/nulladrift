{
  "lockfileVersion": 2,
  "subjects": {
    "ai.skuit/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.skuit.ai/api/mcp/catalog"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "skuit-catalog",
        "title": "SKUit Catalog",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "catalog_find_alternatives",
          "title": "Find alternatives to a product",
          "description": "Find published alternatives to a product named by part number or family (for example \"Cisco 9300X\" or \"C9300X-48HX\"): one class up, the same class, and one class down, all in the same role, same vendor first. Each alternative states the single dimension it was compared on, so present it as \"comparable on <dimension>\", not as a drop-in replacement. An ambiguous name returns the candidate families to choose from. Answers carry catalog_url (the public catalog page) and build_bom_url (Open in SKUit to build a full bill of materials; the builder requires a SKUit account).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "product": {
                "description": "A part number or a product family name, optionally prefixed by the vendor.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find alternatives"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c6803dce349faf42f4f2ca865b2cbdac4b97dc2b39bc7f912841619fc2f062b3"
        },
        {
          "name": "catalog_get_platform",
          "title": "Get a catalog platform",
          "description": "Get the published facts for one platform by its exact platform id (as returned by the other catalog tools). Answers carry catalog_url (the public catalog page) and build_bom_url (Open in SKUit to build a full bill of materials; the builder requires a SKUit account).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "platform_id": {
                "description": "The exact platform id, e.g. \"C9300X-48HX\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["platform_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get catalog platform"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:39cd65006033facca57f10fe390635136e65649983619ee9803b465444392718"
        },
        {
          "name": "catalog_search_platforms",
          "title": "Search catalog platforms by port demand",
          "description": "Find published platforms that can serve a port demand (for example 60×100G plus 4×400G for a data-center top-of-rack switch), closest fit first: fewest spare ports, then fewest rack units, then least capacity headroom. Each result explains the fit and lists caveats (breakout cables, a non-default port mode, port-pairing rules) that you should pass on to the user. Also reports how many platforms of the use case meet the demand, how many could not be evaluated, and the nearest misses when nothing fits. Answers carry catalog_url (the public catalog page) and build_bom_url (Open in SKUit to build a full bill of materials; the builder requires a SKUit account).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "form_factor": {
                "description": "Only this form factor, e.g. \"fixed\" or \"modular\".",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "How many results (default 5, max 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_rack_units": {
                "description": "Only platforms at most this many rack units tall.",
                "maximum": 64,
                "minimum": 1,
                "type": "integer"
              },
              "poe_required": {
                "description": "Only platforms that supply PoE.",
                "type": "boolean"
              },
              "port_requirements": {
                "description": "The ports needed, one row per speed.",
                "items": {
                  "properties": {
                    "count": {
                      "description": "How many ports at this speed.",
                      "maximum": 10000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "speed_gbps": {
                      "description": "Port speed in Gbps, e.g. 1, 2.5, 10, 25, 100, 400.",
                      "exclusiveMinimum": 0,
                      "maximum": 1600,
                      "type": "number"
                    }
                  },
                  "required": ["count", "speed_gbps"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "use_case_id": {
                "description": "Deployment role: \"campus-access\" (Campus access layer), \"dc-tor\" (ToR & Leaf), \"dc-core\" (DC core / spine), \"wan-edge\" (WAN edge / branch), \"smb\" (SMB / small campus), \"campus-dist\" (Campus distribution), \"load-balancer\" (Security Appliances), \"ai-fabric\" (AI fabric).",
                "enum": ["campus-access", "dc-tor", "dc-core", "wan-edge", "smb", "campus-dist", "load-balancer", "ai-fabric"],
                "type": "string"
              },
              "vendors": {
                "description": "Only these vendors. Case-insensitive, on whole words: \"Juniper\" matches \"Juniper Networks\". An unknown name is reported back with the vendors that do have platforms for the use case.",
                "items": {
                  "anyOf": [
                    {
                      "enum": ["Arista", "Cisco", "F5", "Juniper Networks", "NVIDIA", "Nokia"],
                      "type": "string"
                    },
                    {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    }
                  ]
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["port_requirements", "use_case_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search catalog platforms"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d268773dd94069722776c04c847fad46bceb58d46440f1612d95d8c00477ad05"
        }
      ],
      "digest": "sha256:7ef8498cac4d511cdf642a7a8d0125410e5dadb346e0cb1b0e52610423baa6a5"
    }
  }
}
