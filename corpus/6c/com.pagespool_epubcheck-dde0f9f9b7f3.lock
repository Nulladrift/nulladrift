{
  "lockfileVersion": 2,
  "subjects": {
    "com.pagespool/epubcheck": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.pagespool.com/mcp/epubcheck/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pagespool-epubcheck",
        "version": "1",
        "websiteUrl": "https://pagespool.com/connect#epubcheck"
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": false
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_epub",
          "title": "Check an EPUB file with EPUBCheck",
          "description": "Check an EPUB file (EPUB 2 or 3) against the EPUB specifications with\nEPUBCheck, the W3C's conformance checker.\n\nInput: `epub_base64` is the base64 of the EPUB, at most 4 MB decoded, or\npass the file as a download link in `file`.\n\nReturns `summary` (`valid`, and the `fatal`, `error` and `warning`\ncounts; `valid` is true when there is no FATAL and no ERROR message),\n`messages` (the 20 most severe, FATAL first, each with `severity`, `id`,\n`message`, up to three `locations` as `path:line:column`, and a\n`suggestion` when EPUBCheck has one), `messages_total` and\n`epubcheck_version`. For the full report, or files up to 25 MB, use the\nREST API (`POST /v1/epubcheck/check`).\n\nCredits: 2 per call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "epub_base64": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The EPUB file, base64-encoded. At most 4 MB decoded."
              },
              "file": {
                "default": null,
                "description": "The file as a download link, instead of `epub_base64`. In ChatGPT, pass the user's uploaded file here. Other clients can set `download_url` to a public https URL.",
                "properties": {
                  "download_url": {
                    "description": "A public https URL of the file.",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "An identifier for the file. ChatGPT sets it; other clients may pass any label, such as the file name.",
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check an EPUB file with EPUBCheck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "openai/fileParams": ["file"],
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:5590cabd02ab9c179d0d2e2530cb319a8eb3ffe5c98b1943c8a9ede775f6935b"
        }
      ],
      "digest": "sha256:b82365fd8eac9bee88fa1c25ab1941e1bc0090719513ab27aaea774a38bb26ef"
    }
  }
}
