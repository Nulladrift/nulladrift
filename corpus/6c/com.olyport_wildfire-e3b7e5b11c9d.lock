      "tools": [
        {
          "name": "get_active_fires",
          "description": "Get current active wildfire incidents from NIFC.\n\n    Returns data on active wildfires including name, location, size, and\n    containment status. Data is updated frequently during fire season.\n\n    Args:\n        state: Two-letter US state abbreviation to filter by (e.g. 'CA', 'OR').\n        min_acres: Minimum fire size in acres to include (e.g. 100 for fires over 100 acres).\n        limit: Maximum number of fires to return (default 50).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "min_acres": {
                "default": null,
                "title": "Min Acres",
                "type": "number"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              }
            },
            "title": "get_active_firesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_active_firesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7dac5866f71c4a376d1fcb8c67668214869f04a99157b59bfc3bb14f5ba41a0d"
        },
        {
          "name": "get_fire_perimeters",
          "description": "Get fire perimeter data for active or recent wildfires.\n\n    Returns perimeter boundaries and associated metadata. Useful for\n    understanding the geographic extent of fires.\n\n    Args:\n        fire_name: Name of a specific fire to look up (case-insensitive partial match).\n        state: Two-letter US state abbreviation to filter by.\n    ",
          "inputSchema": {
            "properties": {
              "fire_name": {
                "default": null,
                "title": "Fire Name",
                "type": "string"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              }
            },
            "title": "get_fire_perimetersArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_fire_perimetersOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ebf1fb520142d87c462fe151bbaa47656d6e772177065c29923e19486e366d9"
        },
        {
          "name": "get_fire_stats",
          "description": "Get wildfire statistics summary including total fires and acres burned.\n\n    Returns aggregate statistics from active incident data. When no year is\n    specified, returns current year statistics.\n\n    Args:\n        year: Year to get statistics for (e.g. 2025). Defaults to current year.\n    ",
          "inputSchema": {
            "properties": {
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "title": "get_fire_statsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_fire_statsOutput",
            "type": "object"
          },
