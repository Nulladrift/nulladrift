              "release": {
                "description": "IPD-IMGT/HLA release every verdict was computed against.",
                "type": "string"
              },
              "valid": {
                "description": "true when there are no error-severity issues.",
                "type": "boolean"
              }
            },
            "required": ["alleles", "changed", "counts", "issues", "loci", "normalized_gl", "release", "valid"],
            "type": "object"
