                "type": "object"
              },
              "framework": {
                "default": "8/8",
                "enum": ["6/6", "8/8", "10/10", "12/12", "antigen"],
                "type": "string"
              },
              "recipient": {
                "additionalProperties": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "description": "locus -> up to 4 reported allele names. Allele strings only: never patient names, medical record numbers, dates of birth, or accession or case identifiers.",
                "type": "object"
              }
            },
            "required": ["donor", "recipient"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "description": "Data attribution (IPD-IMGT/HLA, CC-BY-ND).",
                "type": "string"
              },
              "count": {
                "description": "'matched/total' over the resolvable loci only, or UNRESOLVABLE when none resolves. Check verdicts for 'potential' loci before quoting it as a confident count.",
                "type": "string"
              },
              "flags": {
                "description": "e.g. resolution_insufficient, null_allele, null_allele_mismatch.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "framework": {
                "enum": ["6/6", "8/8", "10/10", "12/12", "antigen"],
                "type": "string"
              },
