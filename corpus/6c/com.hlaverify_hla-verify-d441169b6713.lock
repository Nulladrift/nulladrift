        {
          "name": "match_score",
          "description": "Count a donor-recipient HLA match by the published counting rules (R1-R6): allele arithmetic over chromosomes, not a donor recommendation. recipient/donor: {\"A\": [\"A*01:01\",\"A*02:01\"], \"B\": [...], ...} (two reported alleles per locus, any nomenclature era including G/P group names such as A*02:01:01G; allele strings only, no patient identifiers). framework: 6/6, 8/8, 10/10, 12/12, or antigen. Returns count, per-locus verdicts, GvH/HvG mismatch counts, and flags; unresolvable typing yields 'potential', never a confident count.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "donor": {
                "additionalProperties": {
                  "items": {
