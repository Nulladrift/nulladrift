        {
          "name": "check_typing",
          "description": "QC-check one HLA typing (all loci) against the pinned release: resolves every reported allele, flags unresolvable/outdated/locus-mismatched/null alleles, flags too-many/single/homozygous per locus, computes the B-leader (-21 M/T) and KIR-ligand (C1/C2/Bw4) profile, and DRB3/4/5 expected-vs-reported. Nomenclature and internal-consistency checking of the report, not clinical interpretation. typing: {\"A\": [\"A*01:01\", \"A*02:01\"], \"B\": [...], \"DRB1\": [...], ...} (any nomenclature era, G/P group names, A*02:XX and two-field A*02:01g included; NMDP MAC codes are flagged, not expanded; allele strings only, no patient identifiers).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "typing": {
                "additionalProperties": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "description": "locus -> up to 4 reported allele names. Allele strings only: never patient names, medical record numbers, dates of birth, or accession or case identifiers.",
                "type": "object"
              }
            },
            "required": ["typing"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "description": "Data attribution (IPD-IMGT/HLA, CC-BY-ND).",
                "type": "string"
              },
              "counts": {
                "properties": {
                  "error": {
                    "type": "integer"
                  },
                  "info": {
                    "type": "integer"
                  },
                  "warning": {
                    "type": "integer"
                  }
                },
                "required": ["error", "info", "warning"],
                "type": "object"
              },
              "drb345": {
                "description": "DRB3/4/5 expected from DRB1 vs reported; null when DRB1 is not typed.",
                "properties": {
                  "determinate": {
                    "type": "boolean"
                  },
                  "expected": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "reported": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["determinate", "expected", "reported"],
                "type": ["object", "null"]
              },
              "issues": {
                "items": {
                  "properties": {
                    "code": {
                      "description": "unresolvable, deprecated_name, locus_mismatch, null_allele, too_many_alleles, single_allele, homozygous, drb345_unexpected or drb345_not_reported.",
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    },
                    "locus": {
                      "description": "The locus key as reported.",
                      "type": "string"
                    },
                    "severity": {
                      "description": "Any error makes the typing invalid.",
                      "enum": ["error", "warning", "info"],
                      "type": "string"
                    }
                  },
                  "required": ["code", "detail", "locus", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "loci": {
                "additionalProperties": {
                  "items": {
                    "properties": {
                      "allele_2field": {
                        "description": "Current 2-field form, or UNRESOLVABLE.",
                        "type": "string"
                      },
                      "antigen": {
                        "description": "WMDA serologic antigen, or 'null' (not expressed) / 'uncertain'.",
                        "type": "string"
                      },
                      "current_name": {
                        "description": "Current name, or UNRESOLVABLE.",
                        "type": "string"
                      },
                      "flags": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "g_group": {
                        "description": "G group; NONE, AMBIGUOUS or UNRESOLVABLE.",
                        "type": "string"
                      },
                      "ligands": {
                        "description": "Class I (A/B/C) ligand facts, aggregated over member alleles: 'ambiguous' when members disagree, 'unknown' when no residue data.",
                        "properties": {
                          "ambiguities": {
                            "additionalProperties": {
                              "items": {
                                "type": "string"
                              },
                              "type": "array"
                            },
                            "description": "For each ambiguous field, the distinct member values.",
                            "type": "object"
                          },
                          "bw": {
                            "description": "Bw4 / Bw6 / non-Bw4 / unclassified / ambiguous / unknown / not_expressed; null for HLA-C.",
                            "type": ["string", "null"]
                          },
                          "c_group": {
                            "description": "C1 / C2 / unclassified / ambiguous / unknown; null when not applicable.",
                            "type": ["string", "null"]
                          },
                          "expressed": {
                            "description": "false when every member allele is null (not expressed).",
                            "type": "boolean"
                          },
                          "kir_ligand": {
                            "description": "C1 / C2 / Bw4 / Bw4-80I / Bw4-80T / none / ambiguous / unknown.",
                            "type": "string"
                          },
                          "leader_21": {
                            "description": "Residue at leader position -21 (M or T; another letter is possible), ambiguous, unknown or not_expressed.",
                            "type": "string"
                          },
                          "residue_80": {
                            "description": "Residue at position 80 (amino-acid letter), ambiguous, unknown or not_expressed.",
                            "type": "string"
                          }
                        },
                        "required": ["bw", "c_group", "expressed", "kir_ligand", "leader_21", "residue_80"],
                        "type": "object"
                      },
                      "reported": {
                        "type": "string"
                      },
                      "status": {
                        "enum": ["ok", "renamed", "unresolvable"],
                        "type": "string"
                      }
                    },
                    "required": ["allele_2field", "antigen", "current_name", "flags", "g_group", "reported", "status"],
                    "type": "object"
                  },
                  "type": "array"
                },
                "description": "Reported locus key -> one row per reported allele, in input order.",
                "type": "object"
              },
              "profile": {
                "properties": {
                  "b_leader_genotype": {
                    "description": "HLA-B -21 leader genotype such as M/T ('?' unknown); null when B is not typed.",
                    "type": ["string", "null"]
                  },
                  "c_kir_ligand_genotype": {
                    "description": "HLA-C KIR ligand genotype such as C1/C2 ('none', '?'); null when C is not typed.",
                    "type": ["string", "null"]
                  },
                  "kir_ligand_status": {
                    "description": "complete only with two classified alleles at each of A, B and C.",
                    "enum": ["complete", "incomplete"],
                    "type": "string"
                  },
                  "kir_ligands_present": {
                    "description": "Sorted subset of C1, C2, Bw4, Bw4-80I, Bw4-80T.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["b_leader_genotype", "c_kir_ligand_genotype", "kir_ligand_status", "kir_ligands_present"],
                "type": "object"
              },
              "release": {
                "description": "IPD-IMGT/HLA release every verdict was computed against.",
                "type": "string"
              },
              "valid": {
                "description": "true when there are no error-severity issues. Gate on this before using the typing.",
                "type": "boolean"
              }
            },
            "required": ["counts", "drb345", "issues", "loci", "profile", "release", "valid"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3abbff28f07a4258c6e85867883636606667a3c99a41942a2b73d2f02042e0f"
