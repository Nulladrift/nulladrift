                "description": "Allele names exactly as written in the `from` release.",
                "items": {
                  "maxLength": 64,
                  "type": "string"
                },
                "maxItems": 5000,
                "minItems": 1,
                "type": "array"
              },
              "to": {
                "description": "An IPD-IMGT/HLA release, like \"3.40.0\" (1.05.0 to the current one).",
                "maxLength": 16,
                "type": "string"
