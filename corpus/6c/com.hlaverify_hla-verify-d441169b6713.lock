        {
          "name": "verify_text",
          "description": "Scan HLA typing report text, or model output about HLA, for allele-shaped tokens and classify each one: valid / legacy spelling such as A*0201 or Cw*0702 (valid, with modern form and flag deprecated_name) / G-P group / deleted (with successor) / hallucinated (an invented name, never passed as real) / NMDP MAC code (seen, not expanded) / KIR name (out of scope, not checked); a valid token with fewer than four fields carries resolution, what that field count does and does not distinguish. Nomenclature checking against a pinned IPD-IMGT/HLA release, not interpretation of a case. Use on any AI-generated or transcribed content mentioning HLA. Send the HLA content only, with patient identifiers removed first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "description": "HLA typing report text, or model output about HLA typing, to scan for allele names. Send the HLA content only: strip patient names, medical record numbers, dates of birth, accession and case identifiers, and any other patient details before sending. The caller is responsible for de-identifying the text; this service neither needs nor wants identifiers and does not store request bodies.",
                "maxLength": 200000,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "description": "Data attribution (IPD-IMGT/HLA, CC-BY-ND).",
                "type": "string"
              },
              "clean": {
                "description": "The guardrail: true only when no token is hallucinated, fabricated_group or deleted. Gate on this before presenting the text. NMDP multiple allele codes (counts.mac_code) and KIR allele names (counts.out_of_scope) are not checked — treat them as unverified.",
                "type": "boolean"
              },
              "counts": {
                "description": "Number of distinct tokens per status.",
                "properties": {
                  "deleted": {
                    "type": "integer"
                  },
                  "fabricated_group": {
                    "type": "integer"
                  },
                  "group": {
                    "type": "integer"
                  },
                  "hallucinated": {
                    "type": "integer"
                  },
                  "mac_code": {
                    "description": "NMDP multiple allele codes (A*02:AB) seen but not expanded.",
                    "type": "integer"
                  },
                  "out_of_scope": {
                    "description": "KIR allele names (KIR3DL1*001) seen; a gene family outside IPD-IMGT/HLA, not checked.",
                    "type": "integer"
                  },
                  "valid": {
                    "type": "integer"
                  }
                },
                "required": ["deleted", "fabricated_group", "group", "hallucinated", "mac_code", "out_of_scope", "valid"],
                "type": "object"
              },
              "release": {
                "description": "IPD-IMGT/HLA release every verdict was computed against.",
                "type": "string"
              },
              "tokens": {
                "description": "Each distinct allele-shaped token found, sorted by token.",
                "items": {
                  "properties": {
                    "current_2field": {
                      "description": "valid/deleted tokens that resolve: current 2-field form.",
                      "type": "string"
                    },
                    "flags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "g_group": {
                      "description": "G group; NONE or AMBIGUOUS when there is no single group.",
                      "type": "string"
                    },
                    "note": {
                      "description": "Human-readable meaning of status.",
                      "type": "string"
                    },
                    "resolution": {
                      "description": "Present on a name with fewer than four fields: what this resolution level does and does not distinguish.",
                      "properties": {
                        "distinguishes": {
                          "description": "What finer typing at the next field would add.",
                          "type": "string"
                        },
                        "fields": {
                          "description": "Number of colon-separated fields in the name.",
                          "enum": [1, 2, 3],
                          "type": "integer"
                        },
                        "level": {
                          "description": "1 field: allele_group; 2: protein; 3: coding_sequence.",
                          "enum": ["allele_group", "protein", "coding_sequence"],
                          "type": "string"
                        }
                      },
                      "required": ["distinguishes", "fields", "level"],
                      "type": "object"
                    },
                    "status": {
                      "description": "valid: assigned (or a valid prefix; A*02:XX and two-field A*02:01g are checked by the name they abbreviate, and a legacy spelling such as A*0201, Cw*0702 or Cw*07:02 by the current name it stands for, with flag deprecated_name); group: a real G/P group; deleted: no longer current (see successor); fabricated_group: G/P-shaped but no such group; hallucinated: never existed in any release; mac_code: an NMDP multiple allele code, reporting shorthand this service does not expand; out_of_scope: a KIR allele name (IPD-KIR), outside IPD-IMGT/HLA and not checked.",
                      "enum": ["valid", "group", "deleted", "fabricated_group", "hallucinated", "mac_code", "out_of_scope"],
                      "type": "string"
                    },
                    "successor": {
                      "description": "deleted: the name it was renamed to, when known.",
                      "type": "string"
                    },
                    "token": {
                      "description": "The token without any HLA- prefix.",
                      "type": "string"
                    }
                  },
                  "required": ["note", "status", "token"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["clean", "counts", "release", "tokens"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
