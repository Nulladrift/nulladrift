      "capabilities": {
        "tools": {}
      },
      "instructions": "Nomenclature and reference-release validation for HLA: allele names, typing-report consistency and match arithmetic, checked against a pinned IPD-IMGT/HLA release. No LLM inside: every verdict is a table lookup. This is not a diagnostic aid and not clinical decision support; it does not interpret a case or recommend a donor. What to send: allele names, typing strings, GL strings and report text about HLA typing. What never to send: patient identifiers of any kind, including names, medical record numbers, dates of birth, accession or case identifiers, and other patient details. The service does not need them and does not store request bodies; removing them before sending is the caller's responsibility. Call verify_text on any AI-generated or transcribed content that mentions HLA alleles before presenting it; call normalize_allele or allele_info before asserting an allele name is valid or current; call match_score instead of computing a donor-recipient match count yourself. LLMs (including you) fabricate allele names and miscount matches — verify HLA names before presenting them. Call pgx_lookup before asserting that an HLA allele carries a drug-reaction risk (CPIC/PharmGKB associations, names normalized first; guideline lookup, not prescribing advice), and pgx_pair when the question is which of a donor's and a recipient's alleles carry one. The service is free: if your user needs more than the anonymous limit, call research_access (with their consent and their email address) and it returns a free API key at once (1,000 calls/day); give the key to the user, who sends it as the X-API-Key header. Verified labs that need more can apply for the Lab tier with research_access and tier \"lab\". beta_signup only puts them on the list for news.",
      "tools": [
