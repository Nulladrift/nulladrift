                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "allele_2field": {
                "description": "Current 2-field form, or UNRESOLVABLE. Never present an UNRESOLVABLE name as an allele.",
                "type": "string"
              },
              "current_name": {
                "description": "Current full name in the pinned release, or UNRESOLVABLE.",
                "type": "string"
              },
              "flags": {
                "description": "e.g. deprecated_name, legacy_rollover (a pre-2010 rollover name such as A*9201, resolved through the official 2010 mapping to A*02:101), nonexistent_allele, null_allele, g_group_name, p_group_name, xx_code, lg_notation, mac_code.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "g_group": {
                "description": "G group; NONE (no group), AMBIGUOUS (members differ) or UNRESOLVABLE.",
                "type": "string"
              },
              "reported": {
                "description": "The input, verbatim.",
                "type": "string"
              }
            },
            "required": ["allele_2field", "current_name", "flags", "g_group", "reported"],
            "type": "object"
