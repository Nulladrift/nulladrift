        {
          "name": "validate_gl_string",
          "description": "Validate and normalize a GL String (Genotype List, ^ | + ~ / grammar): resolves every allele token, flags outdated/unresolvable names and structural problems (mixed loci within a slash-list, a repeated locus within a haplotype or across ^ blocks, more than two haplotypes, differing loci across a genotype or genotype list, empty elements), and returns the normalized string. Grammar and nomenclature checking only; send allele names, not patient identifiers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gl": {
                "description": "GL String to validate and normalize. Allele names and GL grammar only, never patient identifiers.",
                "maxLength": 100000,
                "type": "string"
              }
            },
            "required": ["gl"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alleles": {
                "description": "Each distinct allele token, in first-seen order.",
                "items": {
                  "properties": {
                    "current_name": {
                      "description": "null when unresolvable.",
                      "type": ["string", "null"]
                    },
                    "locus": {
                      "type": ["string", "null"]
                    },
                    "status": {
                      "enum": ["valid", "renamed", "group", "unresolvable"],
                      "type": "string"
                    },
                    "token": {
                      "type": "string"
                    }
                  },
                  "required": ["current_name", "locus", "status", "token"],
                  "type": "object"
                },
                "type": "array"
              },
              "attribution": {
                "description": "Data attribution (IPD-IMGT/HLA, CC-BY-ND).",
                "type": "string"
              },
              "changed": {
                "description": "normalized_gl differs from the trimmed input.",
                "type": "boolean"
              },
              "counts": {
                "properties": {
                  "error": {
                    "type": "integer"
                  },
                  "warning": {
                    "type": "integer"
                  }
                },
                "required": ["error", "warning"],
                "type": "object"
              },
              "issues": {
                "items": {
                  "properties": {
                    "code": {
                      "description": "unresolvable_allele, renamed_allele, whitespace_in_name, empty_element, mixed_locus_allele_list, haplotype_repeats_locus, genotype_loci_differ, more_than_two_haplotypes, genotype_list_loci_differ or locus_repeated_across_blocks.",
                      "type": "string"
                    },
                    "detail": {
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["error", "warning"],
