        {
          "name": "donor_compat",
          "description": "Donor/recipient immunogenetic compatibility under two published rule sets: HLA-B leader match (-21 M/T, Petersdorf 2020) for a single HLA-B mismatch, and KIR ligand (C1/C2/Bw4) class comparison, computed over each side's full typing QC. Rule checking against published frameworks; it does not rank or recommend a donor. recipient/donor: {\"A\": [...], \"B\": [...], \"C\": [...], \"DRB1\": [...], ...} (allele strings only, no patient identifiers). Decision support only; not a medical device.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "donor": {
                "additionalProperties": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "description": "locus -> up to 4 reported allele names. Allele strings only: never patient names, medical record numbers, dates of birth, or accession or case identifiers.",
                "type": "object"
              },
              "recipient": {
                "additionalProperties": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "description": "locus -> up to 4 reported allele names. Allele strings only: never patient names, medical record numbers, dates of birth, or accession or case identifiers.",
                "type": "object"
              }
            },
            "required": ["donor", "recipient"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "description": "Data attribution (IPD-IMGT/HLA, CC-BY-ND).",
                "type": "string"
              },
              "b_leader": {
                "properties": {
                  "b_mismatches": {
                    "description": "HLA-B mismatch count; null when B is missing, over-typed or unresolvable on either side.",
                    "type": ["integer", "null"]
                  },
                  "donor": {
