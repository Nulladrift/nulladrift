        {
          "name": "allele_history",
          "description": "Every name the allele behind an HLA name has had, release by release since IPD-IMGT/HLA 1.05.0: its HLA ID, current name, the first and last release that used this name, the full timeline of names, and the deletion note if the name was retired. `as_of` adds what it was called in that release. Use it to answer when a name appeared, changed or disappeared; a retired name is answered with its deletion note, and a name that never existed is refused with an error result, not guessed at. An allele string only, no patient identifiers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "An IPD-IMGT/HLA release, like \"3.40.0\" (1.05.0 to the current one).",
                "maxLength": 16,
                "type": "string"
              },
              "name": {
                "description": "An allele name as written in any release, like \"A*0101\".",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4dbffbcff7ac80ba0c017844574b8e8a26ecaa02b489ce9204b6e149d10dfeac"
        },
        {
          "name": "allele_info",
          "description": "Look up one name in the pinned release and return what it is: assigned (G/P group, first release, confirmed status, WMDA serology, null flag), valid_prefix (member count and sample, plus resolution: what a name with fewer than four fields does and does not distinguish), group (a G or P group name: member count and sample), or deleted (successor). Reported shorthands are accepted as /v1/normalize accepts them — legacy spellings (A*0101, Cw*0702, Cw*07:02), the XX code (A*02:XX), two-field A*02:01g, an optional HLA- prefix — and answer with the facts of the name they stand for plus resolves_to and a flag (deprecated_name, xx_code, lg_notation); an NMDP multiple allele code (A*02:AB) returns mac_code, recognised but not expanded. A name that has never existed in any release is refused, not guessed at: the tool returns an error result (HTTP 404 on /v1/allele) and never a near match. A deleted name is answered as deleted, with its successor when the release records one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "An HLA allele name of any era: exact name, lower-resolution prefix, deleted name, G/P group, legacy colon-less name, XX code or lg notation. An allele string only, never a patient name, medical record number or other identifier.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Found: release, name, status and the status-specific fields. Never assigned: only `detail`.",
            "properties": {
              "attribution": {
                "description": "Data attribution (IPD-IMGT/HLA, CC-BY-ND).",
                "type": "string"
              },
              "confirmed": {
                "description": "assigned: confirmed (vs unconfirmed) allele.",
                "type": "boolean"
              },
              "detail": {
                "description": "Present only when the name is not assigned in this release (and then no other field is).",
                "type": "string"
              },
              "first_release": {
                "description": "assigned: first release the exact name appeared in.",
                "type": ["string", "null"]
              },
              "flags": {
                "description": "Present for a shorthand: deprecated_name (legacy spelling: colon-less A*0101, or the Cw locus label as in Cw*07:02), xx_code, lg_notation, or mac_code. Absent for a plain name.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "g_group": {
                "description": "assigned: G group, or null.",
                "type": ["string", "null"]
              },
              "group_type": {
                "description": "group: whether the name is a G group (identical exons 2+3 / exon 2) or a P group (identical peptide-binding domain).",
                "enum": ["G", "P"],
                "type": "string"
              },
              "ligands": {
                "description": "Class I (A/B/C) ligand facts, aggregated over member alleles: 'ambiguous' when members disagree, 'unknown' when no residue data.",
                "properties": {
                  "ambiguities": {
                    "additionalProperties": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "description": "For each ambiguous field, the distinct member values.",
                    "type": "object"
                  },
                  "bw": {
                    "description": "Bw4 / Bw6 / non-Bw4 / unclassified / ambiguous / unknown / not_expressed; null for HLA-C.",
                    "type": ["string", "null"]
                  },
                  "c_group": {
                    "description": "C1 / C2 / unclassified / ambiguous / unknown; null when not applicable.",
                    "type": ["string", "null"]
                  },
                  "expressed": {
                    "description": "false when every member allele is null (not expressed).",
                    "type": "boolean"
                  },
                  "kir_ligand": {
                    "description": "C1 / C2 / Bw4 / Bw4-80I / Bw4-80T / none / ambiguous / unknown.",
                    "type": "string"
                  },
                  "leader_21": {
                    "description": "Residue at leader position -21 (M or T; another letter is possible), ambiguous, unknown or not_expressed.",
                    "type": "string"
                  },
                  "residue_80": {
                    "description": "Residue at position 80 (amino-acid letter), ambiguous, unknown or not_expressed.",
                    "type": "string"
                  }
                },
                "required": ["bw", "c_group", "expressed", "kir_ligand", "leader_21", "residue_80"],
                "type": "object"
              },
              "members_count": {
                "description": "valid_prefix / group: number of assigned alleles under the prefix or in the group.",
                "type": "integer"
              },
              "members_sample": {
                "description": "valid_prefix / group: up to 10 member alleles.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "type": "string"
              },
              "note": {
                "description": "mac_code: what a multiple allele code is and why it is not expanded.",
                "type": "string"
              },
              "null_allele": {
                "description": "assigned: true for an N (null, not expressed) allele.",
                "type": "boolean"
              },
              "p_group": {
                "description": "assigned: P group, or null.",
                "type": ["string", "null"]
              },
              "release": {
                "description": "IPD-IMGT/HLA release every verdict was computed against.",
                "type": "string"
              },
              "resolution": {
                "description": "Present on a name with fewer than four fields: what this resolution level does and does not distinguish.",
                "properties": {
                  "distinguishes": {
                    "description": "What finer typing at the next field would add.",
                    "type": "string"
                  },
                  "fields": {
                    "description": "Number of colon-separated fields in the name.",
                    "enum": [1, 2, 3],
                    "type": "integer"
                  },
                  "level": {
                    "description": "1 field: allele_group; 2: protein; 3: coding_sequence.",
                    "enum": ["allele_group", "protein", "coding_sequence"],
                    "type": "string"
                  }
                },
                "required": ["distinguishes", "fields", "level"],
                "type": "object"
              },
              "resolves_to": {
                "description": "Present when the name was a reported shorthand (legacy colon-less or Cw spelling, XX code, lg notation): the current-style name it stands for, whose facts this result carries.",
                "type": "string"
              },
              "serology": {
                "additionalProperties": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "description": "assigned: WMDA serologic equivalents by column (non-empty columns only), as published in rel_dna_ser.txt: an antigen number, '?' (undetermined equivalent) or '∅' (no serological equivalent, null). The lab tools report these as 'uncertain' and 'null'.",
                "properties": {
                  "assumed": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "expert": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "possible": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "unambiguous": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "status": {
                "description": "assigned: an exact allele in this release; valid_prefix: a lower-resolution prefix of assigned alleles; group: a G or P group name (see group_type); deleted: withdrawn or renamed (see successor); mac_code: an NMDP multiple allele code (A*02:AB), recognised but not expanded or checked.",
                "enum": ["assigned", "valid_prefix", "group", "deleted", "mac_code"],
                "type": "string"
              },
              "successor": {
                "description": "deleted: the current name, or null if none.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0677375427573b2e5877da9228e230a798b5db2dbf294ebf5d4118bb7eb9b31e"
        },
        {
