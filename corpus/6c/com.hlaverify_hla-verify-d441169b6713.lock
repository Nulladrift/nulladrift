        {
          "name": "normalize_allele",
          "description": "Normalize one reported HLA allele name (any era or reporting shorthand: legacy A*0101, Cw*0702 or Cw*07:02, G/P group names, A*02:XX, two-field A*02:01g, optional HLA- prefix) to current 2-field form, with G group, P group, serologic equivalent, and flags. NMDP MAC codes (A*02:AB) are recognised but not expanded (flag mac_code). A name that does not exist comes back UNRESOLVABLE (flag nonexistent_allele), never corrected to a nearby real one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "One reported HLA allele name, any nomenclature era. An allele string only, never a patient name, medical record number or other identifier.",
