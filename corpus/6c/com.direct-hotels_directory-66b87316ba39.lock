        {
          "name": "get_hotel",
          "title": "Get hotel details",
          "description": "One hotel in full: address, rating, description, its booking link, and answers to what guests ask (pets, parking, breakfast, pool, check-in and check-out times), each with where and when it was read. Use when the user asks about a specific hotel by name, or follows up on one from search_hotels (\"does it have a pool?\"). Takes an id, slug or page URL from search_hotels, or a name, with `city` to narrow a common one; several matches come back as candidates. Holds no prices or availability.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "City, to narrow a name lookup.",
                "type": "string"
              },
              "client": {
                "description": "Optional: your product or agent name, e.g. \"Claude\". Not used by the tool; recorded only for the public count of which assistants use the directory.",
                "maxLength": 80,
                "type": "string"
              },
              "hotel": {
                "description": "Hotel id (\"27995\"), slug (\"27995-maison-proust\"), page URL, or name (\"Maison Proust\").",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["hotel"],
            "type": "object"
          },
