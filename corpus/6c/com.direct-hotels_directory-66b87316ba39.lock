        {
          "name": "search_hotels",
          "title": "Search hotels",
          "description": "Hotels in a city or district, each with the link to book on the hotel's own website, its rating, stars and a short description. Use when the user asks where to stay somewhere, for hotels in a place, or for hotels with a pool, parking, pets allowed or a star rating. Districts, regions and spellings resolve to their city (\"Shinjuku\", \"Badung Regency\", \"Marrakesh\", \"Roma\"). City names repeat across countries, so `country` changes the answer (\"Brisbane\" alone is the one in California). Where the directory lists nothing, the result is covered: false with covered places instead. For one named hotel, use get_hotel.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amenities": {
                "description": "Only hotels whose own website mentions all of these. Read from hotel sites, which covers about a quarter of the directory, so an empty result means \"not mentioned\", not \"not available\".",
                "items": {
                  "enum": ["pool", "pets", "parking", "breakfast", "spa", "gym", "beach", "accessible", "family", "air_conditioning", "ev_charging", "airport_shuttle"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "city": {
                "description": "City, neighbourhood or district name, e.g. \"Paris\", \"Shinjuku\".",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "client": {
                "description": "Optional: your product or agent name, e.g. \"Claude\". Not used by the tool; recorded only for the public count of which assistants use the directory.",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "Country name or ISO code, e.g. \"Australia\" or \"AU\". Disambiguates repeated city names.",
                "type": "string"
              },
              "limit": {
                "description": "Default 5, max 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "sort_by": {
                "description": "Default: rating.",
                "enum": ["rating", "reviews"],
                "type": "string"
              },
              "stars": {
                "description": "Star class filter. Note: 84% of the directory has no published star class, so this hides most hotels — prefer sorting by rating.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
