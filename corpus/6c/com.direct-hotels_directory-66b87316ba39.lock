        {
          "name": "suggest_hotel",
          "title": "Suggest a missing hotel",
          "description": "Sends Direct Hotels a hotel it does not list, for review. Use when the user names a hotel that search_hotels and get_hotel did not find and wants it added. We check the hotel's own website before listing it (usually within minutes, otherwise after a manual review), so a suggestion is not yet a listing. The website, when known, is what we verify against. Stores the hotel's details only, nothing about the user.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "City or town, e.g. \"Rethymno\".",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "client": {
                "description": "Optional: your product or agent name, e.g. \"Claude\". Not used by the tool; recorded only for the public count of which assistants use the directory.",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "Country name or ISO code.",
                "maxLength": 80,
                "type": "string"
              },
              "hotel_name": {
                "description": "The hotel's name, e.g. \"Hotel Elida\".",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "website": {
                "description": "The hotel's own website, not a booking platform.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["city", "hotel_name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "status": {
                "enum": ["suggested", "already_suggested", "limit_reached", "rejected"],
                "type": "string"
              }
            },
            "required": ["message", "status"],
            "type": "object"
          },
