      "serverInfo": {
        "name": "direct-hotels",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "A free hotel directory: 425,000+ hotels in 230+ countries, each linked to its own website, which we fetched and saw name the hotel. No commission, no booking flow, no prices or availability. Typical order: search_hotels (or check_coverage) for a place, get_hotel for one hotel, then its booking_url. A result with covered: false means we list nothing there; the directory holds only the hotels in tool results. Each hotel carries provenance: its source and when we last checked its site. clientInfo.name on initialize, or `client` on calls, feeds the public count of assistants at direct-hotels.com/agents.",
      "tools": [
        {
          "name": "check_coverage",
          "title": "Check directory coverage",
          "description": "Whether the directory lists hotels in a place, and how many, without returning listings. Use when the user asks if a destination is covered, or before planning a trip around one. Deepest in the US and Western Europe, thin in China, the Gulf and much of Africa; an uncovered place comes back with covered places instead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "client": {
                "description": "Optional: your product or agent name, e.g. \"Claude\". Not used by the tool; recorded only for the public count of which assistants use the directory.",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "Country name or ISO code, if known.",
                "type": "string"
              },
              "place": {
                "description": "City, region or country to check.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "alternatives": {
                "additionalProperties": false,
                "properties": {
                  "cities": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "city": {
                          "type": "string"
                        },
                        "country": {
                          "type": "string"
                        },
                        "hotels": {
                          "type": "number"
                        },
                        "km": {
                          "description": "Distance from the place asked about, when it could be located.",
                          "type": "number"
                        }
                      },
                      "required": ["city", "hotels"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "scope": {
                    "type": "string"
                  }
                },
                "required": ["cities", "scope"],
                "type": "object"
              },
              "covered": {
                "type": "boolean"
              },
              "hotels": {
                "type": "number"
              },
              "place": {
                "type": "string"
              }
            },
            "required": ["covered", "hotels", "place"],
            "type": "object"
          },
