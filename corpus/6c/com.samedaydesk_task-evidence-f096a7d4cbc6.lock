{
  "lockfileVersion": 2,
  "subjects": {
    "com.samedaydesk/task-evidence": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://samedaydesk.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "samedaydesk-agent-tools",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "browse_taskmarket_tasks",
          "description": "Browse current public TaskMarket inventory through the official read API. Filter by lifecycle status, mode, tag, text, and minimum reward. Amounts carry their actual chain/token; unknown decimals stay raw. Task descriptions are returned as untrusted text and are never executed.",
          "inputSchema": {
            "properties": {
              "chain_id": {
                "description": "Optional current served chain selector.",
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_reward_usdc": {
                "description": "Legacy minimum gross reward; selects qualified Base USDC only. Refuses unknown assets, conflicting metadata or an unlike chain selector; never compares OUSD to USDC.",
                "type": ["number", "string"]
              },
              "mode": {
                "enum": ["bounty", "claim", "pitch", "benchmark", "auction"],
                "type": "string"
              },
              "search": {
                "description": "Case-insensitive text match over descriptions and tags.",
                "type": "string"
              },
              "status": {
                "default": "open",
                "enum": ["ALL", "open", "claimed", "worker_selected", "pending_approval", "review", "appealing", "disputed", "completed", "expired", "cancelled"],
                "type": "string"
              },
              "tag": {
                "description": "Exact case-insensitive tag filter.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:be679588808fc4c38d414cf6783aa3c40341171202fd44679b420b3f0f3c74db"
        },
        {
          "name": "check_agent_readiness",
          "description": "Free. Check whether agents can discover and call a public website. Fetches discovery files, follows MCP links named by those files, and runs only initialize, tools/list, and one unknown-tool call. Never executes a real tool. Returns a 0-100 score, every check with an evidence URL, and the top fixes. No license.",
          "inputSchema": {
            "properties": {
              "host": {
                "description": "Public host to score, for example example.com",
                "type": "string"
              }
            },
            "required": ["host"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checks": {
                "items": {
                  "properties": {
                    "evidenceUrl": {
                      "type": "string"
                    },
                    "fix": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "status": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["fix", "id", "reason", "status", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "evidence": {
                "items": {
                  "properties": {
                    "status": {
                      "type": "number"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "type": "array"
              },
              "free": {
                "type": "boolean"
              },
              "host": {
                "type": "string"
              },
              "score": {
                "type": "number"
              },
              "topFixes": {
                "type": "array"
              }
            },
            "required": ["checks", "evidence", "host", "score", "topFixes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:df02cfa0180ed1b7204182372ec03812cb166f5cab801b02c9cb3266036fbec1"
        },
        {
          "name": "check_ai_readiness",
          "description": "Check whether a website is visible to AI search engines (ChatGPT, Perplexity, Claude, Google AI Overviews). Scores AI-crawler access, JSON-LD structured data, title/meta, Open Graph, sitemap, and llms.txt, and returns a 0-100 score, a letter grade, and a specific fix for each gap. Free.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The website to check, e.g. example.com or https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5a56a4344322101dc9ea7366347cef9b0d25319a24f146ca03e80c2e01562465"
        },
        {
          "name": "generate_complete_fix_pack",
          "description": "PAID. Returns the complete, ready-to-paste AI-readiness Fix Pack for a site: tailored Organization + FAQPage JSON-LD, an AI-crawler robots.txt, a sitemap, and title/meta/Open Graph fixes. Requires a `license` — the checkout-session id you receive after buying the $39 Fix Pack at https://buy.stripe.com/8x24gA0xA9DF9dd13YeZ20h (after paying you're shown your license code). Without a valid license it returns purchase instructions plus a free starter pack.",
          "inputSchema": {
            "properties": {
              "license": {
                "description": "Your Stripe checkout-session license code (starts with cs_).",
                "type": "string"
              },
              "url": {
                "description": "The website to generate the Fix Pack for.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:82d4e834ef94b4cbfa05780007765e0cd0cf8cd5a9fbbe0ca694f8542ce79c10"
        },
        {
          "name": "plan_taskmarket_delegation",
          "description": "Prepare a bounded TaskMarket delegation for research, coding, data collection, benchmarking, or verification. Requires chain_id, token_address, deliverable, reward, deadline, and an explicit maximum-spend ceiling. Reads public chain metadata. Returns the canonical TaskMarket API payload and approval summary without creating a task, holding a wallet, or spending funds.",
          "inputSchema": {
            "properties": {
              "acceptance_criteria": {
                "description": "Up to 10 testable acceptance checks.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "chain_id": {
                "description": "Explicit served chain id; no default.",
                "minimum": 1,
                "type": "integer"
              },
              "deadline_hours": {
                "description": "Hours until TaskMarket submission closes.",
                "exclusiveMinimum": 0,
                "maximum": 720,
                "type": "number"
              },
              "deliverable": {
                "description": "The exact artifact or result the worker must return.",
                "type": "string"
              },
              "max_spend_base_units": {
                "description": "Explicit reward ceiling in the same chain/token's integer base units. No exchange conversion.",
                "pattern": "^[0-9]{1,78}$",
                "type": "string"
              },
              "max_spend_usdc": {
                "description": "Explicit user-authorized reward ceiling in USDC.",
                "type": ["number", "string"]
              },
              "mode": {
                "default": "bounty",
                "enum": ["bounty", "claim"],
                "type": "string"
              },
              "request": {
                "description": "The external work needed, written as a clear task.",
                "type": "string"
              },
              "reward_base_units": {
                "description": "Exact gross reward in the selected token's integer base units. Use with max_spend_base_units.",
                "pattern": "^[0-9]{1,78}$",
                "type": "string"
              },
              "reward_usdc": {
                "description": "Proposed worker reward in USDC, up to 6 decimal places.",
                "type": ["number", "string"]
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "token_address": {
                "description": "Explicit payment token contract on that chain, checked against current network.info.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              }
            },
            "required": ["chain_id", "deadline_hours", "deliverable", "request", "token_address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dfad05c9decba83ca00b8f593c082038e153eb5a56087b67638201ebacc7b934"
        },
        {
          "name": "project_funnel_evidence",
          "description": "Free. Project one declared source-separated observation packet into the accepted funnel decision. Caller observations stay declared. Does not fetch URLs, query customers, store the packet, or spend.",
          "inputSchema": {
            "properties": {
              "packet": {
                "description": "Caller-supplied observation packet. URLs inside it are not fetched.",
                "type": "object"
              }
            },
            "required": ["packet"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:39fe19d03d11d626b003a90ff5d54f72a449764b70814e3f2e3fe7b38ebc8cd3"
        },
        {
          "name": "track_taskmarket_task",
          "description": "Track one public TaskMarket task through the official read API. Returns status, deadline, submissions, artifact hashes, canonical awards, pending actions, and the next authorization boundary. It cannot create, accept, reject, rate, or refund work.",
          "inputSchema": {
            "properties": {
              "task_id": {
                "description": "TaskMarket 32-byte task id.",
                "pattern": "^0x[0-9a-fA-F]{64}$",
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ed914fa2b544db80bc7fe0b48cbfe1636ebbd3b7302415d2693e5e5d2976da2b"
        }
      ],
      "digest": "sha256:250c143e1e4ce9ed30d9ea6fd6e4c7ffc1f42254dc3c1a59d968b4d76071b064"
    }
  }
}
