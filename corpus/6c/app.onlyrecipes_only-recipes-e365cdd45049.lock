        {
          "name": "report_feedback",
          "title": "Report feedback about this server",
          "description": "Use this when one of this server's tools errored, returned wrong or incomplete results, ignored a parameter, or is missing for the user's task. Sends a report to the Only Recipes developers. Include what you called, what came back, what you expected, and a concrete proposed fix. Do not include the user's personal data. Call at most once per distinct issue.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "arguments": {
                "description": "The arguments you passed, as JSON text, without personal data",
                "maxLength": 1000,
                "type": "string"
              },
              "kind": {
                "description": "bug: a tool misbehaved; idea: a missing tool or parameter; question: a description is unclear",
                "enum": ["bug", "idea", "question"],
                "type": "string"
              },
              "proposedFix": {
                "description": "A concrete change that would fix it",
                "maxLength": 2000,
                "type": "string"
              },
              "severity": {
                "description": "high: the user's task could not be completed",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "summary": {
                "description": "What you tried, what you got, what you expected",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "tool": {
                "description": "The tool the report is about",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["kind", "summary"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "status": {
                "enum": ["received", "not_available"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
