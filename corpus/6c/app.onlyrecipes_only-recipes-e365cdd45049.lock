        {
          "name": "search_recipes",
          "title": "Search recipes",
          "description": "Use this when the user wants ideas or recipes to cook, by dish, ingredient, cuisine, diet, time or rating, or just wants to browse. query is optional: leave it out to browse by tags and sort. Searches the public Only Recipes library and returns a grid of recipes. Not for the user's own recipes (use list_my_recipes) or for a pasted link (use import_recipe). Plain keywords need no filters; call get_filters first only to filter by tag. Without a linked account, query matches whole words and word prefixes in the recipe name, a short description summary and tag slugs (not arbitrary substrings), results can lag new recipes and votes by up to a day, and sourceUrl is always null.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "page": {
                "description": "Page number (1-indexed, default 1)",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "description": "Results per page (default 12, max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Text search query to match recipe name or description",
                "type": "string"
              },
              "sort": {
                "description": "Sort order: recent (newest), popular (most votes), rating (highest rated), trending (recently imported)",
                "enum": ["recent", "popular", "rating", "trending"],
                "type": "string"
              },
              "tags": {
                "description": "Tag slugs to filter by (e.g. ['italian', 'dinner', 'vegetarian'])",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "page": {
                "type": "number"
              },
              "pageCount": {
                "type": "number"
              },
              "pageSize": {
                "type": "number"
              },
              "recipes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "aggregateRating": {
                      "type": ["number", "null"]
                    },
                    "aggregateRatingCount": {},
                    "caloriesPerServing": {},
                    "comments": {},
                    "coverPhoto": {
                      "type": ["string", "null"]
                    },
                    "creator": {},
                    "description": {
                      "type": ["string", "null"]
                    },
                    "difficulty": {},
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "recipeYield": {},
                    "savedAt": {},
                    "slug": {
                      "type": ["string", "null"]
                    },
                    "sourceUrl": {},
                    "totalTime": {},
                    "url": {
                      "type": "string"
                    },
                    "votes": {}
                  },
                  "required": ["id", "name", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "type": "string"
              },
              "totalCount": {
                "type": "number"
              },
              "unknownTags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["recipes", "totalCount"],
            "type": "object"
          },
