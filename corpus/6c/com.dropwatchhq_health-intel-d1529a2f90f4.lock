{
  "lockfileVersion": 2,
  "subjects": {
    "com.dropwatchhq/health-intel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://health.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "health-intel",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "fda_enforcement",
          "description": "Return recent FDA enforcement/recall actions tied to a device/drug firm (openFDA). A manufacturer-risk layer for procurement and payor teams.",
          "inputSchema": {
            "properties": {
              "firm": {
                "description": "Recalling firm / manufacturer name.",
                "type": "string"
              }
            },
            "required": ["firm"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:38c28c4b0b2870166871ba11569f60804aaed5bdf2b2e304f6da43edcc0cb554"
        },
        {
          "name": "new_exclusions",
          "description": "Return providers newly added to the OIG-LEIE exclusion list, optionally scoped by state and/or specialty. The credentialing / payment-integrity alert feed.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Default 60.",
                "type": "number"
              },
              "specialty": {
                "type": "string"
              },
              "state": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4bc3e357da6777f062f1b211b07dc167ccd196a033732fbc44ec8b12b9961d6a"
        },
        {
          "name": "provider_lookup",
          "description": "Look up US healthcare providers from the public CMS NPPES registry by NPI, or search by specialty + state (+ optional name/city). Returns NPI, name, specialty, license, location, and an OIG-LEIE exclusion flag on each. Public data only — no PHI.",
          "inputSchema": {
            "properties": {
              "city": {
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 50).",
                "type": "number"
              },
              "name": {
                "description": "Provider or organization name substring.",
                "type": "string"
              },
              "npi": {
                "description": "Exact 10-digit NPI for a single provider.",
                "type": "string"
              },
              "specialty": {
                "description": "Taxonomy/specialty, e.g. 'Cardiology'.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state, e.g. 'TX'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:185ef8c4d47662920a92e1b4ff862f5f485779a12ee1e88124f91bbdf7d050b1"
        },
        {
          "name": "screen_exclusion",
          "description": "Screen a provider/organization against the federal exclusion lists (HHS-OIG LEIE, and SAM.gov if configured). NPI match is exact; name match is flagged and identity-cautious. Returns sourced findings + a disclaimer. Facts, never an allegation.",
          "inputSchema": {
            "properties": {
              "name": {
                "type": "string"
              },
              "npi": {
                "type": "string"
              },
              "state": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:91548c6e16ed636b39aa512c0f01d9a09af0eb6f8439ab21be45b3dcfb6b57eb"
        }
      ],
      "digest": "sha256:fccc6a066994e53fb4403c865e2d0df92d0ad9bd8ae0b40f5c8c491d37b548f1"
    }
  }
}
