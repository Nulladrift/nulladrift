        {
          "name": "estimate_production",
          "title": "Estimate visual production",
          "description": "Return a directional RUB production range and timeline only when the user explicitly asks about price, cost, budget, quote, or budget fit. This tool is read-only, non-binding, and never collects contact details or submits a brief. Choose WHOLE_PRODUCTION for a finished deliverable and BOUNDED_SHOT_POST for named shots/scenes/post work; use INFERRED when that scope is genuinely ambiguous, or SCENARIO for a clearly labeled hypothetical. For production diagnosis without pricing, use diagnose_production instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "assumptions": {
                "description": "Explicit factual assumptions used to make the estimate possible; do not invent client facts.",
                "items": {
                  "maxLength": 1000,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "deadlineDays": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Calendar days available until delivery when known; null or omit when no deadline is supplied."
              },
              "exclusions": {
                "description": "Work explicitly outside this estimate, especially live-action, rights, media, extra versions, or unrequested disciplines.",
                "items": {
                  "maxLength": 1000,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "externalBidItems": {
                "description": "Known cost exposures that require third-party bids; these remain outside the automated production range.",
                "items": {
                  "properties": {
                    "label": {
                      "description": "External cost item that cannot be responsibly priced by this engine, such as talent, location, licensed music, or live-action vendor work.",
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    },
                    "reason": {
                      "description": "Why this cost requires an external quote or remains unknown.",
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["label", "reason"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "includeDepartments": {
                "description": "Optional whitelist of departments to include when the requested estimate intentionally covers only selected disciplines.",
                "items": {
                  "enum": ["CREATIVE", "PREVIS", "PRODUCTION", "AI_VFX", "CGI_3D", "MOTION", "COMPOSITING", "EDIT", "COLOR", "SOUND", "VERSIONING", "PHOTO", "RIGHTS", "TRAVEL", "RESERVE", "OTHER"],
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "mode": {
                "description": "ROM for an early range; SCOPED_ESTIMATE for a defined scope; BUDGET_FIT to compare scope with a target budget; DEADLINE_FIT to evaluate schedule pressure.",
                "enum": ["ROM", "SCOPED_ESTIMATE", "BUDGET_FIT", "DEADLINE_FIT"],
                "type": "string"
              },
              "runtimeSeconds": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 36000,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Final master runtime in seconds when known; null only when genuinely unknown."
              },
              "scopeBasis": {
                "description": "One concise sentence stating exactly what the estimate includes and excludes from the priced object.",
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              },
              "scopeDecision": {
                "description": "USER_EXPLICIT when the requested object is clear; SCENARIO for an explicitly labeled hypothetical; INFERRED only when scope is genuinely ambiguous, in which case no price is returned until clarified.",
                "enum": ["USER_EXPLICIT", "SCENARIO", "INFERRED"],
                "type": "string"
              },
              "scopeEvidence": {
                "description": "Short evidence for the scope choice. For USER_EXPLICIT, copy a brief verbatim phrase from the user's request that identifies the priced object.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "scopeType": {
                "description": "WHOLE_PRODUCTION prices the complete requested finished deliverable; BOUNDED_SHOT_POST prices only named shots, scenes, VFX, or post tasks.",
                "enum": ["WHOLE_PRODUCTION", "BOUNDED_SHOT_POST"],
                "type": "string"
              },
              "targetBudgetMax": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Upper bound of the user's target budget in RUB for BUDGET_FIT; omit when no target ceiling is supplied."
              },
              "targetBudgetMin": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Lower bound of the user's target budget in RUB for BUDGET_FIT; omit when no budget floor exists."
              },
              "units": {
                "description": "Production line items that drive the estimate. Include every material discipline/unit being priced; each item explains quantity, complexity, locks, continuity, and basis.",
                "items": {
                  "properties": {
                    "basis": {
                      "description": "Short factual notes explaining why this unit, quantity, complexity, or lock count was chosen.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "complexity": {
                      "description": "LOW, MEDIUM, HIGH, or EXTREME execution complexity for this unit.",
                      "enum": ["LOW", "MEDIUM", "HIGH", "CRITICAL"],
                      "type": "string"
