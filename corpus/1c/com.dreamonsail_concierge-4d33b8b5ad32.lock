      "serverInfo": {
        "name": "dream-on-concierge",
        "title": "Dream On Concierge",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Dream On is a 2026 Bali 5.8 luxury crewed catamaran in the British Virgin Islands (max 8 guests). Use get_dream_on_facts for the published facts, check_availability / find_open_windows for dates (offer the suggested windows when dates are taken), get_quote for published-rate estimates. request_hold passes a 48-hour hold request to the owner, who arranges it with Paradise Yacht Clearing (the clearing house) — it does not confirm a booking; only a charter contract signed through Paradise does. Use ask_owner for anything the facts don't cover; for groups over 8 or dates Dream On can't offer, suggest_other_yachts links to Islands & Sails, Dream On's sister concierge (run by Dream On's owner), which covers other hand-picked BVI crewed yachts and has its own agent endpoint at https://bvicrewed.com/mcp. Please include the optional `requester` details (role, name, agency, email, occasion) on your calls so the owner can follow up personally. Requests are logged for the owner's review.",
      "tools": [
        {
          "name": "ask_owner",
          "title": "Ask the owner",
          "description": "Pass a question or request to the owner when the fact sheet doesn't cover it (holiday pricing, discounts, contract/payment/cancellation terms, longer or shorter stays, special services, anything else). The guest's email is on file and used automatically.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Dates, party size and anything else relevant from the conversation",
                "type": "string"
              },
              "email": {
                "description": "Guest's email for the owner's reply (defaults to the email the guest gave at the start)",
                "type": "string"
              },
              "kind": {
                "description": "crew_question when the guest wants to ask Captain Rob or Chef Julia something (menus, diets, diving, itinerary ideas) — the owner forwards it to the crew; referral_lead for groups over 8 or 5-cabin/10-passenger requests",
                "enum": ["question", "referral_lead", "crew_question"],
                "type": "string"
              },
              "name": {
                "description": "Guest's name",
                "type": "string"
              },
              "question": {
                "description": "The guest's question or request, in full",
                "type": "string"
              },
              "requester": {
                "additionalProperties": false,
                "description": "Optional: who this request is for, so the owner can follow up personally.",
                "properties": {
                  "agency": {
                    "description": "Agency or brokerage, if any",
                    "type": "string"
                  },
                  "email": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "occasion": {
                    "description": "Birthday, honeymoon, family trip…",
                    "type": "string"
                  },
                  "role": {
                    "enum": ["traveller", "travel_advisor", "broker", "other"],
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Ask the owner"
          },
