            "anyOf": [
              {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "count": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "generatedAt": {
                        "type": "string"
