            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "anyOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "asOf": {
                    "description": "Latest upstream quote timestamp; not necessarily a session close.",
                    "type": ["string", "null"]
                  },
                  "disclaimer": {
                    "type": "string"
                  },
                  "generatedAt": {
                    "description": "Time this snapshot was calculated.",
                    "type": "string"
                  },
                  "indicators": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "evidence": {
                          "description": "Historical S&P 500 and Nasdaq-100 evidence, not validated returns for this instrument.",
                          "type": "string"
                        },
                        "family": {
                          "type": "string"
                        },
                        "id": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "reading": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
