      "instructions": "Read Altair's public pages, market breadth, factor indicators and full research reports for free without sign-in. get_research_signals costs $0.01 USD per call via x402 inside MCP; free sample at /api/research/signals/sample.",
      "tools": [
        {
          "name": "get_market_breadth",
          "title": "Get market breadth",
          "description": "Return the latest S&P 500 sector breadth and S&P 500, Nasdaq-100 and PHLX Semiconductor (SOX) constituent percentages above their 20-session simple moving averages, with SPX, NDX and SOX price-index benchmark levels (no dividends). History uses the loader's constituent lists, not point-in-time membership. Optionally choose 1–252 recent trading sessions; default 20.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 20,
                "description": "Recent trading sessions to return in history; integer from 1 to 252, default 20.",
                "maximum": 252,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "anyOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "asOf": {
                    "description": "Latest upstream quote timestamp among priced S&P 500 stocks; not necessarily the latest breadth session date.",
                    "type": ["string", "null"]
                  },
                  "constituents": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "generatedAt": {
                    "description": "Time this snapshot was calculated; cached responses retain this timestamp.",
                    "type": "string"
                  },
                  "history": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "all": {
                          "description": "Percentage of eligible S&P 500 stocks above their 20-session simple moving average.",
                          "maximum": 100,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "date": {
                          "description": "Trading-session date; use this, not asOf, to identify the reading's session.",
                          "type": "string"
                        },
                        "nasdaq100": {
                          "anyOf": [
                            {
                              "maximum": 100,
                              "minimum": 0,
                              "type": "integer"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Nasdaq-100 percentage above SMA20; null when coverage is insufficient."
                        },
                        "sox": {
                          "anyOf": [
                            {
                              "maximum": 100,
                              "minimum": 0,
                              "type": "integer"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "PHLX Semiconductor constituent percentage above SMA20; null when coverage is insufficient."
                        },
                        "total": {
                          "description": "Sum of the eleven rounded sector percentages; not a stock count or a percentage.",
                          "maximum": 1100,
                          "minimum": 0,
                          "type": "integer"
                        }
                      },
                      "required": ["all", "date", "nasdaq100", "sox", "total"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "index": {
                    "type": "string"
                  },
                  "latest": {
                    "additionalProperties": false,
                    "properties": {
                      "all": {
                        "description": "Percentage of eligible S&P 500 stocks above their 20-session simple moving average.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "benchmarks": {
                        "additionalProperties": false,
                        "properties": {
                          "NDX": {
                            "description": "Nasdaq-100 price index level (^NDX); no dividends.",
                            "type": ["number", "null"]
                          },
                          "SOX": {
                            "description": "PHLX Semiconductor price index level (^SOX); no dividends.",
                            "type": ["number", "null"]
                          },
                          "SPX": {
                            "description": "S&P 500 price index level (^GSPC); no dividends.",
                            "type": ["number", "null"]
                          }
                        },
                        "required": ["NDX", "SOX", "SPX"],
                        "type": "object"
                      },
                      "date": {
                        "description": "Trading-session date; use this, not asOf, to identify the reading's session.",
                        "type": "string"
                      },
                      "nasdaq100": {
                        "anyOf": [
                          {
                            "maximum": 100,
                            "minimum": 0,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Nasdaq-100 percentage above SMA20; null when coverage is insufficient."
                      },
                      "sectors": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "above": {
                              "description": "Percentage of eligible sector stocks above their 20-session simple moving average.",
                              "maximum": 100,
                              "minimum": 0,
                              "type": "integer"
                            },
                            "code": {
                              "type": "string"
                            },
                            "name": {
                              "type": "string"
                            },
                            "stocks": {
                              "maximum": 9007199254740991,
                              "minimum": 0,
                              "type": "integer"
                            }
                          },
                          "required": ["above", "code", "name", "stocks"],
                          "type": "object"
