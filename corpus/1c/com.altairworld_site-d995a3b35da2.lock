        {
          "name": "get_ticker_indicators",
          "title": "Get ticker indicators",
          "description": "Return latest factor and daily/weekly TD Sequential readings for one Yahoo Finance symbol, with session, price, rules, sources and historical index evidence. Reuses /api/market/indicators?ticker=; no chart histories. Stock implied volatility and variance risk premium are null; VIX term structure, credit and yield curve are shared market context. Evidence is not validated single-stock returns. Signals are rule readings, not forecasts or investment advice; the session may still be open. Each reading includes the previous session's value and signal.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "Yahoo Finance symbol, case-insensitive, 1–20 characters after trimming: letters, digits, . - = ^; e.g. NVDA, BRK-B or 0700.HK.",
                "pattern": "^[A-Z0-9^][A-Z0-9.=^-]{0,19}$",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
