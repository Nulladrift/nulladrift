          "title": "Buy research signals",
          "description": "Return the latest final portfolio decision per ticker as structured JSON, including report dates, models, source URLs and summaries. Optional tickers and since filters; ten-minute cache. Costs $0.01 USD per call by default via x402 payments inside MCP; the payment challenge gives the current price. Free sample: /api/research/signals/sample.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
