                                "bands": {
                                  "additionalProperties": false,
                                  "description": "Bullish is checked first; any other value is neutral.",
                                  "properties": {
                                    "bearish": {
                                      "anyOf": [
                                        {
                                          "additionalProperties": false,
                                          "properties": {
                                            "above": {
                                              "type": "number"
                                            }
                                          },
                                          "required": ["above"],
                                          "type": "object"
                                        },
                                        {
                                          "additionalProperties": false,
                                          "properties": {
                                            "below": {
                                              "type": "number"
                                            }
                                          },
                                          "required": ["below"],
                                          "type": "object"
                                        }
                                      ],
                                      "description": "Holds at `above` or higher, or at `below` or lower."
                                    },
                                    "bullish": {
                                      "anyOf": [
                                        {
                                          "additionalProperties": false,
                                          "properties": {
                                            "above": {
                                              "type": "number"
                                            }
                                          },
                                          "required": ["above"],
                                          "type": "object"
                                        },
                                        {
                                          "additionalProperties": false,
                                          "properties": {
                                            "below": {
                                              "type": "number"
                                            }
                                          },
                                          "required": ["below"],
                                          "type": "object"
                                        }
                                      ],
                                      "description": "Holds at `above` or higher, or at `below` or lower."
                                    }
                                  },
                                  "type": "object"
                                },
                                "previous": {
                                  "anyOf": [
                                    {
                                      "additionalProperties": false,
                                      "properties": {
                                        "date": {
                                          "description": "The session before the latest.",
                                          "type": "string"
                                        },
                                        "signal": {
                                          "enum": ["bullish", "neutral", "bearish"],
                                          "type": "string"
                                        },
                                        "value": {
                                          "type": "number"
                                        }
                                      },
                                      "required": ["date", "signal", "value"],
                                      "type": "object"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "description": "The previous session's value and signal under the same bands; null when that session has no reading."
                                },
                                "reading": {
                                  "description": "The value in words, as shown on /indicators.",
                                  "type": "string"
                                },
                                "signal": {
                                  "enum": ["bullish", "neutral", "bearish"],
                                  "type": "string"
                                },
                                "value": {
                                  "description": "The quantity the bands test; a fraction when unit is percent (0.05 is 5%).",
                                  "type": "number"
                                }
                              },
                              "required": ["bands", "previous", "reading", "signal", "value"],
                              "type": "object"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Null when a series the rule needs is missing, e.g. implied volatility for SOX."
                        },
                        "rule": {
                          "type": "string"
                        },
                        "source": {
                          "additionalProperties": false,
                          "properties": {
                            "label": {
