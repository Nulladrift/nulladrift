        {
          "name": "get_market_indicators",
          "title": "Get market indicators",
          "description": "Return the latest readings of eleven factor indicators, including CNN's Fear & Greed Index, and TD Sequential 9 (daily and weekly) for the S&P 500 (SPX), Nasdaq-100 (NDX) and PHLX Semiconductor (SOX) price indices: value, reading, signal (the band the value is in, named bullish, neutral or bearish for compatibility, not a forecast of direction), marks, the rule's bands and the previous session's value, signal and marks, with each rule's source and evidence of what followed on the S&P 500 and Nasdaq-100. marks says what the reading's band marked in the index history: stress (followed by above-average returns averaged over the sessions it held, with larger swings), risk (larger swings and more frequent further falls, not lower returns), calm (smaller swings, not losses) or none (no record either way), null when neutral. SOX implied volatility is Cboe's semiconductor ETF index VXSMH. Each index also has a timing read: its risk regime around the 200-day average and which stress conditions hold, with timingEvidence of what followed each combination on the S&P 500 from 1990 and the Nasdaq-100 from 2001, averaged over every session and counted once per episode; SOX is untested. Five-year histories are at /api/market/indicators.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
