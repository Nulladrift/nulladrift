            "properties": {
              "since": {
                "description": "Inclusive minimum analysis date, a valid YYYY-MM-DD date. Omit for all dates.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "tickers": {
                "description": "1–100 comma-separated uppercase ticker symbols, e.g. NVDA,AAPL. Omit for all tickers.",
                "maxLength": 3299,
                "pattern": "^[A-Z0-9][A-Z0-9.^\\-]{0,31}(,[A-Z0-9][A-Z0-9.^\\-]{0,31})*$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
