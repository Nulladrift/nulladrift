                        "type": "string"
                      },
                      "nasdaq100": {
                        "anyOf": [
                          {
                            "maximum": 100,
                            "minimum": 0,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Nasdaq-100 percentage above SMA20; null when coverage is insufficient."
                      },
                      "sectors": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "above": {
                              "description": "Percentage of eligible sector stocks above their 20-session simple moving average.",
                              "maximum": 100,
                              "minimum": 0,
                              "type": "integer"
                            },
                            "code": {
                              "type": "string"
                            },
                            "name": {
                              "type": "string"
                            },
                            "stocks": {
