                    "type": "string"
                  },
                  "indicators": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "evidence": {
                          "description": "What followed each state on the S&P 500 and Nasdaq-100, with the period and horizon of each figure; SOX is untested.",
                          "type": "string"
                        },
                        "family": {
                          "type": "string"
                        },
                        "id": {
                          "type": "string"
                        },
                        "marks": {
                          "additionalProperties": false,
                          "description": "What each band marked in the index history by default: stress (followed by above-average returns averaged over the sessions it held, with larger swings), risk (larger swings and more frequent further falls, not lower returns), calm (smaller swings, not losses) or none (no record either way); null where the rule has no such band. An index can differ: each reading's marks is for its instrument.",
                          "properties": {
                            "bearish": {
                              "anyOf": [
                                {
                                  "enum": ["stress", "risk", "calm", "none"],
                                  "type": "string"
                                },
