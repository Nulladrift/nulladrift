        {
          "name": "get_research_decisions",
          "title": "Get research decisions",
          "description": "Return every model's final portfolio decision for one ticker on its newest analysis date, or a chosen one: rating, report-time price, price target, confidence, time horizon and executive summary, with report URLs. Set includePrevious to compare each represented model's rating with its nearest earlier analysis date, with both source URLs and explicit missing/unavailable states. Same-date reruns use the latest run-start time; model names are not merged. No explanation of why a rating changed is inferred. Use read_research_report for reasoning.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Analysis date YYYY-MM-DD from list_research_reports. Omit for the newest.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "includePrevious": {
                "description": "Include each selected model's rating comparison with its nearest strictly earlier analysis date. Default false; not a comparison across models or reruns of the same date.",
                "type": "boolean"
              },
              "ticker": {
                "description": "Stock or ETF ticker, e.g. NVDA or SPY; case-insensitive, 1–32 characters after trimming.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "anyOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "comparisons": {
                    "description": "Only returned when includePrevious is true. Each model on the selected date versus its nearest strictly earlier analysis date; no model-name aliases.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "current": {
                          "additionalProperties": false,
                          "properties": {
                            "date": {
                              "type": "string"
                            },
                            "error": {
                              "type": "string"
                            },
                            "rating": {
                              "type": ["string", "null"]
                            },
                            "url": {
                              "type": "string"
                            }
                          },
                          "required": ["date", "rating", "url"],
                          "type": "object"
                        },
                        "model": {
                          "type": "string"
                        },
                        "previous": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
                                "date": {
                                  "type": "string"
                                },
                                "error": {
                                  "type": "string"
                                },
                                "rating": {
                                  "type": ["string", "null"]
                                },
                                "url": {
                                  "type": "string"
                                }
                              },
                              "required": ["date", "rating", "url"],
                              "type": "object"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "status": {
                          "description": "Rating-only comparison after case/whitespace normalization; missing ratings or unreadable reports are unavailable, not unchanged.",
                          "enum": ["changed", "unchanged", "no_previous", "unavailable"],
                          "type": "string"
                        }
                      },
                      "required": ["current", "model", "previous", "status"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "date": {
                    "description": "Analysis date shared by every decision.",
                    "type": "string"
                  },
                  "decisions": {
                    "description": "Newest run of each model on that date.",
                    "items": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "confidence": {
                              "type": ["string", "null"]
                            },
                            "currentPrice": {
                              "description": "Report-time price as written, not a live quote.",
                              "type": ["string", "null"]
                            },
                            "model": {
                              "type": "string"
                            },
                            "priceTarget": {
                              "type": ["string", "null"]
                            },
                            "rating": {
                              "description": "Final portfolio rating as written, e.g. Overweight; null if the report states none.",
