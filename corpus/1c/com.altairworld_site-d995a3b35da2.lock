        {
          "name": "get_ticker_indicators",
          "title": "Get ticker indicators",
          "description": "Return latest factor and daily/weekly TD Sequential readings for one Yahoo Finance symbol, with session, price, rules, sources and historical index evidence. Reuses /api/market/indicators?ticker=; no chart histories. Stock implied volatility and variance risk premium are null; CNN Fear & Greed, VIX term structure, credit and yield curve are shared market context. Evidence is not validated single-stock returns. Each reading's marks says what its band marked in the index history: stress (followed by above-average returns averaged over the sessions it held, with larger swings), risk (larger swings and more frequent further falls, not lower returns), calm (smaller swings, not losses) or none (no record either way), null when neutral; signal keeps the bands' bullish/neutral/bearish names for compatibility. Neither is a forecast or investment advice; the session may still be open. Each reading includes the previous session's value, signal and marks. The instrument's timing read (risk regime and RSI and weekly TD stress conditions) has no tested evidence for single stocks.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "Yahoo Finance symbol, case-insensitive, 1–20 characters after trimming: letters, digits, . - = ^; e.g. NVDA, BRK-B or 0700.HK.",
                "pattern": "^[A-Z0-9^][A-Z0-9.=^-]{0,19}$",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "anyOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "asOf": {
                    "description": "Latest upstream quote timestamp; not necessarily a session close.",
                    "type": ["string", "null"]
                  },
                  "disclaimer": {
                    "type": "string"
                  },
                  "generatedAt": {
                    "description": "Time this snapshot was calculated.",
                    "type": "string"
                  },
                  "indicators": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "evidence": {
                          "description": "Historical S&P 500 and Nasdaq-100 evidence, not validated returns for this instrument.",
                          "type": "string"
                        },
                        "family": {
                          "type": "string"
                        },
                        "id": {
                          "type": "string"
                        },
                        "marks": {
                          "additionalProperties": false,
                          "description": "What each band marked in the index history by default: stress (followed by above-average returns averaged over the sessions it held, with larger swings), risk (larger swings and more frequent further falls, not lower returns), calm (smaller swings, not losses) or none (no record either way); null where the rule has no such band. An index can differ: each reading's marks is for its instrument.",
                          "properties": {
                            "bearish": {
                              "anyOf": [
                                {
                                  "enum": ["stress", "risk", "calm", "none"],
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "bullish": {
                              "anyOf": [
                                {
                                  "enum": ["stress", "risk", "calm", "none"],
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            }
                          },
                          "required": ["bearish", "bullish"],
                          "type": "object"
                        },
                        "name": {
                          "type": "string"
                        },
                        "reading": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
                                "bands": {
                                  "additionalProperties": false,
                                  "description": "Bullish is checked first; any other value is neutral.",
                                  "properties": {
                                    "bearish": {
                                      "anyOf": [
                                        {
                                          "additionalProperties": false,
                                          "properties": {
                                            "above": {
                                              "type": "number"
                                            }
                                          },
                                          "required": ["above"],
                                          "type": "object"
                                        },
                                        {
                                          "additionalProperties": false,
                                          "properties": {
                                            "below": {
                                              "type": "number"
                                            }
                                          },
                                          "required": ["below"],
                                          "type": "object"
                                        }
                                      ],
                                      "description": "Holds at `above` or higher, or at `below` or lower."
                                    },
                                    "bullish": {
                                      "anyOf": [
                                        {
                                          "additionalProperties": false,
                                          "properties": {
                                            "above": {
                                              "type": "number"
                                            }
                                          },
                                          "required": ["above"],
                                          "type": "object"
                                        },
                                        {
                                          "additionalProperties": false,
                                          "properties": {
                                            "below": {
                                              "type": "number"
                                            }
                                          },
                                          "required": ["below"],
                                          "type": "object"
                                        }
                                      ],
                                      "description": "Holds at `above` or higher, or at `below` or lower."
                                    }
                                  },
                                  "type": "object"
                                },
                                "marks": {
                                  "anyOf": [
                                    {
                                      "enum": ["stress", "risk", "calm", "none"],
                                      "type": "string"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "description": "What this signal's band marked in the index history, for this instrument; null when neutral."
                                },
                                "previous": {
                                  "anyOf": [
                                    {
                                      "additionalProperties": false,
                                      "properties": {
                                        "date": {
                                          "description": "The session before the latest.",
                                          "type": "string"
                                        },
                                        "marks": {
                                          "anyOf": [
                                            {
                                              "enum": ["stress", "risk", "calm", "none"],
                                              "type": "string"
                                            },
                                            {
                                              "type": "null"
                                            }
                                          ],
                                          "description": "What this signal's band marked in the index history, for this instrument; null when neutral."
                                        },
                                        "signal": {
                                          "description": "The band the value is in. The names are kept for compatibility and are not a forecast of direction; marks says what the band marked.",
                                          "enum": ["bullish", "neutral", "bearish"],
                                          "type": "string"
                                        },
                                        "value": {
                                          "type": "number"
                                        }
                                      },
                                      "required": ["date", "marks", "signal", "value"],
                                      "type": "object"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "description": "The previous session's value, signal and mark under the same bands; null when that session has no reading."
                                },
                                "reading": {
                                  "description": "The value in words, as shown on /indicators.",
                                  "type": "string"
                                },
                                "signal": {
                                  "description": "The band the value is in. The names are kept for compatibility and are not a forecast of direction; marks says what the band marked.",
                                  "enum": ["bullish", "neutral", "bearish"],
                                  "type": "string"
                                },
                                "since": {
                                  "anyOf": [
                                    {
                                      "additionalProperties": false,
                                      "properties": {
                                        "date": {
                                          "type": "string"
                                        },
                                        "orEarlier": {
                                          "type": "boolean"
                                        }
                                      },
                                      "required": ["date", "orEarlier"],
                                      "type": "object"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "description": "First observed session of the current uninterrupted label under these bands; orEarlier means history begins or a missing value precedes it. Null without aligned history. Not a held-signal confirmation or forecast."
                                },
                                "value": {
                                  "description": "The quantity the bands test; a fraction when unit is percent (0.05 is 5%).",
                                  "type": "number"
                                }
                              },
                              "required": ["bands", "marks", "previous", "reading", "signal", "since", "value"],
                              "type": "object"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Null when a series the rule needs is missing, e.g. implied volatility for SOX, or when its prices are withheld (see dataWarning)."
                        },
                        "rule": {
                          "type": "string"
                        },
                        "source": {
                          "additionalProperties": false,
                          "properties": {
                            "label": {
                              "type": "string"
                            },
                            "url": {
                              "type": ["string", "null"]
                            }
                          },
                          "required": ["label", "url"],
                          "type": "object"
                        },
                        "unit": {
                          "enum": ["percent", "number"],
                          "type": "string"
                        }
                      },
                      "required": ["evidence", "family", "id", "marks", "name", "reading", "rule", "source", "unit"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "instrument": {
                    "additionalProperties": false,
                    "properties": {
                      "close": {
                        "description": "Latest split-adjusted daily price; not a guaranteed final closing quote.",
                        "type": "number"
                      },
                      "dataWarning": {
                        "description": "Why readings that use this instrument's prices are withheld as null: Yahoo closes that look like an unadjusted split, or a split under 5 sessions old. Null when none are withheld for that reason.",
                        "type": ["string", "null"]
                      },
                      "date": {
                        "description": "Latest trading session, which can still be open.",
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "symbol": {
                        "type": "string"
                      },
                      "timing": {
                        "anyOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "cell": {
                                "anyOf": [
                                  {
                                    "enum": ["normal:0", "normal:1", "normal:2+", "risk:0", "risk:1", "risk:2+"],
                                    "type": "string"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ],
                                "description": "Regime and conditions met, a key of timingEvidence[evidence].cells; null without evidence or with a condition missing."
                              },
                              "conditions": {
                                "description": "Stress conditions: SPX and NDX read all five, SOX oversold, weeklyTd and firstDip, a ticker oversold and weeklyTd. One whose series is missing is left out.",
                                "items": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "id": {
                                      "enum": ["vrp", "fear", "oversold", "weeklyTd", "firstDip"],
                                      "type": "string"
                                    },
                                    "met": {
                                      "type": "boolean"
                                    },
                                    "name": {
                                      "type": "string"
                                    },
                                    "reading": {
                                      "description": "The current value in words.",
                                      "type": "string"
                                    }
                                  },
                                  "required": ["id", "met", "name", "reading"],
                                  "type": "object"
                                },
                                "type": "array"
                              },
                              "evidence": {
                                "anyOf": [
                                  {
                                    "enum": ["SPX", "NDX"],
                                    "type": "string"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ],
                                "description": "The index whose history covers these combinations; SOX and tickers are untested."
                              },
                              "met": {
                                "maximum": 9007199254740991,
                                "minimum": 0,
                                "type": "integer"
                              },
                              "regime": {
                                "additionalProperties": false,
                                "properties": {
                                  "orEarlier": {
                                    "description": "The run starts at the first session with a 200-day average in the ten years read, so it may have begun earlier.",
                                    "type": "boolean"
                                  },
                                  "since": {
                                    "description": "First session of the current regime run.",
                                    "type": "string"
                                  },
                                  "state": {
                                    "description": "risk from a close 1% or more below its 200-day average until one 1% or more above it; in between the previous state holds.",
                                    "enum": ["normal", "risk"],
                                    "type": "string"
                                  },
                                  "value": {
                                    "description": "Close over its 200-day average minus 1, a fraction (trend200's value).",
                                    "type": "number"
                                  }
                                },
                                "required": ["orEarlier", "since", "state", "value"],
                                "type": "object"
                              }
                            },
                            "required": ["cell", "conditions", "evidence", "met", "regime"],
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "The timing read; null when dataWarning withholds the prices, before a 200-day average, or from an older cached snapshot."
                      }
                    },
                    "required": ["close", "dataWarning", "date", "name", "symbol", "timing"],
                    "type": "object"
                  }
