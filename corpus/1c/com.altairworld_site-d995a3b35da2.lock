                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            }
                          },
                          "required": ["bearish", "bullish"],
                          "type": "object"
                        },
                        "name": {
                          "type": "string"
                        },
                        "readings": {
                          "additionalProperties": false,
                          "properties": {
                            "NDX": {
                              "anyOf": [
                                {
                                  "additionalProperties": false,
                                  "properties": {
                                    "bands": {
