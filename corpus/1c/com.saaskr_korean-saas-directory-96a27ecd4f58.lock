        {
          "name": "search_korean_saas",
          "description": "saaskr 한국 SaaS 디렉토리: 한국에서 만든 SaaS를 검색한다. 이름·태그라인·소개·태그를 대상으로 하며, 운영 중이 확인된 서비스만 반환한다. 카테고리로 좁힐 수 있다. \"한국 AI 도구\", \"국산 협업툴\" 같은 요청에 사용.",
