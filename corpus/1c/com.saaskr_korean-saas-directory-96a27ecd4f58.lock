        {
          "name": "submit_korean_saas",
          "description": "saaskr 한국 SaaS 디렉토리: 내가 만든 SaaS를 saaskr 디렉토리에 등록한다. 사용자가 \"내 서비스 등록해줘\", \"saaskr에 올려줘\"라고 할 때 사용. 이미 등록된 서비스면 기존 페이지를 알려주고, 새 서비스면 심사 큐에 넣는다(링크가 살아있는지 등 자동 검증 후 보통 1시간 안에 발행). 등록 전 사용자에게 이름·URL·한 줄 설명을 확인받는다. 본인 서비스라면(is_owner) 공식 사이트를 직접 읽고 가격·API·웹훅·MCP·연동·한국 특화 기능 중 **사이트에서 실제로 확인되는 것만** 함께 넣는다 — 확인 안 되는 항목은 비워둘 것(추측 금지). 소개는 사용자가 준 정보와 공식 사이트 내용으로만 채운다(임의로 지어내지 말 것). **상세히 작성한다**: 한 줄 소개만 보내지 말고 profile(해결하는 문제·대상 고객·주요 기능·사용 상황·차별점·시작 방법·고객 유형·플랫폼·단계)과 본인 서비스면 회사 정보(회사명·설립연도·지역·팀 규모)까지 채운다. 이 내용이 saaskr 상세 페이지 본문이 된다. 공개 페이지가 되므로 검색에 읽힐 글로 쓴다: 공식 사이트 문구를 그대로 복사하지 말고 자기 말로 다시 쓰고, 한 줄 소개는 45자 안팎으로 \"누가 언제 쓰는지\"를 담고, 실제 검색어를 자연스러운 문장에 녹이되 키워드를 나열하지 않고, \"최고·유일·1위\" 같은 근거 없는 표현은 쓰지 않는다. 사이트와 사용자 대화에서 확인되지 않는 항목은 비운다 — 모르는 걸 만들어 채우지 말고, 필요하면 사용자에게 물어본다.",
          "inputSchema": {
            "properties": {
              "accept_thin": {
                "description": "소개가 얇다는 안내를 받았는데 사용자가 더 줄 정보가 없을 때만 true. 그대로 등록되지만 구글 색인 대상에서는 제외된다.",
                "type": "boolean"
              },
              "api_docs_url": {
                "description": "API 문서 URL(선택)",
                "type": "string"
              },
              "category": {
                "description": "카테고리 slug(선택). 가능한 값: ai, productivity, social, design, developer-tools, marketing, fintech, ecommerce, education, health, media, lifestyle, hr, gaming, travel, food",
                "type": "string"
              },
              "description": {
                "description": "서비스 소개(선택, 4000자 이내)",
                "type": "string"
              },
              "has_api": {
                "description": "외부 개발자용 API 제공 여부(확인된 경우만)",
                "type": "boolean"
              },
              "has_mcp": {
                "description": "MCP 서버 제공 여부(확인된 경우만)",
                "type": "boolean"
              },
              "has_webhook": {
                "description": "웹훅 제공 여부(확인된 경우만)",
                "type": "boolean"
              },
              "integrates_with": {
                "description": "연동되는 서비스 이름(선택, 최대 20)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "is_owner": {
                "description": "본인이 만든 서비스면 true. 아래 사실 항목은 true 일 때만 반영된다.",
                "type": "boolean"
