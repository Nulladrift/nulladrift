  "subjects": {
    "com.openrobotkits/openrobotkits": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://openrobotkits.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "openrobotkits",
        "title": "OpenRobotKits",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only data on open-source robot kits: live price, stock, license, build difficulty and sourced facts. Start with search_robots, then get_robot or where_to_buy. Prices are list prices in the seller's currency before shipping and tax, refreshed daily around 9 AM Bangkok.",
      "tools": [
        {
          "name": "get_robot",
          "description": "Full facts for one robot: what it is, license, difficulty, build time, cost lines, every seller offer, and sourced facts with links and checked dates.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Robot slug from search_robots, for example so-101",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a robot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bec1f40c445bb068f2edcfe107d44225280ca28c4d6bb755cad0fb1c7fa6108e"
        },
        {
          "name": "search_robots",
          "description": "Find open-source robot kits by words, type or budget. Returns up to 10 robots with the lowest in-stock USD price, stock state, license and page link. Call with no arguments to list everything.",
          "inputSchema": {
            "properties": {
              "max_price": {
                "description": "Only robots with an in-stock listing at or under this many US dollars",
                "type": "number"
              },
              "query": {
                "description": "Words such as 'humanoid', 'desktop', '3d printed arm' or a robot name",
                "type": "string"
              },
              "type": {
                "description": "arm, humanoid, desktop, biped, dog or cable",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search robots"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84bab0d7a22206f24a742604e71cd8c5a24649deb3c8314fd4359f2b058fa93d"
        },
        {
          "name": "where_to_buy",
          "description": "Every seller listing for one robot, in-stock whole kits first, with price, currency, stock, checked date, a buy link and the seller page.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Robot slug from search_robots",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Where to buy a robot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a06457a496194bdb0cff00fe582896dc8069b22586974fe2464c2912aa95cbe"
        }
      ],
      "digest": "sha256:89870a430879a9d1270acc2a3e1474283a961ccadac42ba8af83e1ffe00a3f21"
    }
  }
