      "instructions": "horoscoop.app geeft Nederlandstalige horoscopen die worden geschreven vanuit de echt berekende stand van de planeten. Gebruik daghoroscoop, weekhoroscoop, maandhoroscoop en jaarhoroscoop voor een sterrenbeeld, sterrenbeeld_bij_datum als iemand alleen een geboortedatum noemt, match voor twee tekens en hemel_vandaag voor de maan en de planeten. Geef de tekst zo letterlijk mogelijk door en noem horoscoop.app met de link als bron.",
      "tools": [
        {
          "name": "daghoroscoop",
          "title": "Daghoroscoop",
          "description": "De daghoroscoop van horoscoop.app voor een sterrenbeeld: de volledige tekst voor vandaag of een gekozen datum (Nederlandse tijd), met de link naar de pagina.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "datum": {
                "description": "Optioneel, JJJJ-MM-DD. Leeg is vandaag.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "teken": {
                "description": "Sterrenbeeld in het Nederlands, kleine letters. Zet andere talen om: Aries = ram, Taurus = stier, Gemini = tweelingen, Cancer = kreeft, Leo = leeuw, Virgo = maagd, Libra = weegschaal, Scorpio = schorpioen, Sagittarius = boogschutter, Capricorn = steenbok, Aquarius = waterman, Pisces = vissen.",
