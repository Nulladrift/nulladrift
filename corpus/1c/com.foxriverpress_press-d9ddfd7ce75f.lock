            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:13a5cebe681a49bb787368a5b83682dd7b45ca56dea19f4a518bb6c92ff8f1ae"
        },
        {
          "name": "credit_deadlines",
          "title": "Look up a federal credit deadline",
          "description": "Federal deadlines in U.S. consumer credit (disputes, debt validation, freezes, fraud alerts, reporting periods), each with the statute or rule that sets it and the guide that explains it. Filter by a word or phrase.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A word or phrase to match, for example dispute, freeze, collector or bankruptcy. Omit for every deadline.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
