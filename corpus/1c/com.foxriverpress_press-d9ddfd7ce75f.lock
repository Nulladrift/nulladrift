        {
          "name": "home_charging_estimate",
          "title": "Estimate home EV charging",
          "description": "What a home circuit delivers to an electric car and what it costs: charger amps on a breaker by the 80 percent rule, kilowatts, miles of range per hour, cost per mile, monthly cost and the gas price at which a gas car costs the same per mile. Every assumption has a stated default and can be replaced.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "breaker_amps": {
                "description": "The circuit's breaker, one of 15, 20, 30, 40, 50, 60, 70, 80, 100. The charger draws 80 percent of it. Default 40.",
                "type": "number"
              },
              "cents_per_kwh": {
                "description": "Electricity price. Default 18.2 (U.S. residential average, 2026 (EIA projection)).",
                "type": "number"
              },
              "gas_car_mpg": {
                "description": "The gas car to compare against. Default 28.",
                "type": "number"
              },
              "kwh_per_100_miles": {
                "description": "The car's efficiency. Default 30 (example; your car's figure is on its fueleconomy.gov label).",
                "type": "number"
              },
              "miles_per_day": {
                "description": "Default 35.",
                "type": "number"
              },
              "volts": {
                "description": "120 for a regular outlet, 240 for Level 2. Default 240.",
                "type": "number"
              }
            },
            "type": "object"
