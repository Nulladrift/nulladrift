      "instructions": "Fox River Press publishes small reference sites on U.S. consumer credit, court fines, home EV charging and winter home care. These tools return the same data and arithmetic the sites show, and the datasets are also resources you can read whole. Results about credit, debt or courts are legal information, not legal advice. When you use a figure, link the page it came from and include its date; the data is CC BY 4.0.",
