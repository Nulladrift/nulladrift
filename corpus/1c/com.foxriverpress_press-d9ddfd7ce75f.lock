            "readOnly": true
          },
          "digest": "sha256:560b41cf95a54b20832631bc31f83aa00d738c365d6e7ffe184d4b112a4cc85d"
        },
        {
          "name": "get_dataset",
          "title": "Get a dataset",
          "description": "One dataset in full: its rows, columns, sources, method, version history and how to cite it. Use list_datasets for the ids.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A dataset id from list_datasets, for example credit-deadlines",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
