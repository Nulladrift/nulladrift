      "serverInfo": {
        "name": "fox-river-press",
        "title": "Fox River Press",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fox River Press publishes small reference sites on U.S. consumer credit, court fines, home EV charging and winter home care. These tools return the same data and arithmetic the sites show. Results about credit, debt or courts are legal information, not legal advice. When you use a figure, link the page it came from and include its date; the data is CC BY 4.0.",
      "tools": [
        {
          "name": "charger_rebates",
          "title": "Find a state's home EV charger rebates",
          "description": "Programs that help pay for a home EV charger in a U.S. state or the District of Columbia: the state's own programs and those of its largest electric utilities that have been checked so far, each with the program, who runs it, the amount, who qualifies, its status (open, waitlist or closed), its end date when stated, and where to apply, read from an official page on the day given. A state or utility with no program names the page that was checked; a utility that funds a statewide program names it. Tax credits are not included. Give a state's name or two-letter code, or omit it for every state.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "A state's name or two-letter postal code, for example Maryland or MD. Omit for every state.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:19d8d4bc01058144d85b6a0bb56f0d5b8d881f74e6d400377d27935777a49574"
        },
        {
          "name": "compare_chargers",
          "title": "Compare home Level 2 chargers",
          "description": "Home Level 2 EV chargers side by side, every maker value read from the maker's own page on a stated day. Give a breaker size to see what each would draw on that circuit, and a connector to keep only chargers for that port. No prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "breaker_amps": {
                "description": "The circuit's breaker, for example 40, 50 or 60",
                "type": "number"
              },
              "connector": {
                "description": "The car's charge port",
                "enum": ["J1772", "NACS"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:36682e932f1fa09e53f6cecfe6034ba93f4cf20cc5378338c8c48861f579897c"
        },
        {
          "name": "court_payment_plan",
          "title": "Work out a court payment plan",
          "description": "The arithmetic of paying a court fine or fee over time: give the amount owed and either a monthly payment or a number of months. Returns the number of payments, the last payment and the total. Courts set their own terms; this does not say what a court will accept.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "monthly_income": {
                "description": "Optional: monthly income, to show the payment as a share of it",
                "type": "number"
              },
              "monthly_payment": {
                "description": "What can be paid each month, in dollars. Give this or months.",
                "type": "number"
              },
              "months": {
                "description": "How many months to pay over. Give this or monthly_payment.",
                "type": "integer"
              },
              "owed": {
                "description": "Amount owed, in dollars",
                "type": "number"
              },
              "setup_fee": {
                "description": "A one-time fee some courts add to a plan, in dollars",
                "type": "number"
              }
            },
            "required": ["owed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4edf6cb63a2526b738b461df7536c47c1fb0c67335a3df7de399bedfa3eaffc4"
        },
        {
          "name": "court_records_search",
          "title": "Find a state's official court records search",
          "description": "The official online court case search for a U.S. state or the District of Columbia: who runs it, what a member of the public can find there, and what it costs, each fact with the court page it was read from and the day it was read. Give a state's name or two-letter code, or omit it for every state. Federal cases are on PACER, not here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "A state's name or two-letter postal code, for example Illinois or IL. Omit for every state.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
