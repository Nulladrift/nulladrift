{
  "lockfileVersion": 2,
  "subjects": {
    "com.hagglyai/haggly": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hagglyai.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "haggly",
        "version": "0.1.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Hagglyai compares pay-per-call APIs that agents can use (x402 and Apify): price per call, reliability from Hagglyai's own regular checks, and how many paying users each one has. It covers Web search; Web page extraction; LLM inference; Crypto prices & market data; On-chain data; People & company enrichment; Weather; News; Social media data; Job listings; Products & prices; Maps & places; Translation; Email, SMS & messaging; Flights & travel; Stocks & forex; PDF generation; Captcha solving; Sports data; Shopping; Speech & audio. When a task needs an outside API or data source and you have not chosen one, call find_best with the task in plain words. Use compare_category or most_popular to weigh options in a category, check_endpoint before paying an API URL you were given, and list_categories to see what is covered. Free, read-only and quick: it never calls or pays the APIs it describes. Answers are markdown with links to each API's page on hagglyai.com.",
      "tools": [
        {
          "name": "check_endpoint",
          "title": "Check an API before paying it",
          "description": "Call this before paying a specific API URL you were given or found elsewhere, to see whether it can be trusted: Hagglyai's reliability score and recent check history, its price per call, how many paying users it has, and any warnings (for example a payment wallet that does not match the seller). It never calls the URL. Hagglyai API documentation: https://hagglyai.com/openapi.json",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "The API's URL, exactly as you would call it",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an API before paying it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:afbf432dcb842962a64c3fbd3927b8fe48964eeae4ffd556ece5359af8c5a560"
        },
        {
          "name": "compare_category",
          "title": "Compare APIs in a category",
          "description": "Call this to weigh the options in one area instead of taking find_best's single recommendation, or when the user asks \"which is the cheapest / most reliable X API?\". Returns every tracked API in the category ranked by score, with price per call, reliability, usage and any warnings. Category ids: web-search, web-extraction, llm-inference, crypto-prices, onchain-data, enrichment, weather, news, social-media, jobs, ecommerce, maps-places, translation, messaging, travel, stocks, pdf-generation, captcha-solving, sports-data, shopping, speech-audio. Narrow by platform or task ids from list_categories. Free, read-only and quick: it never calls or pays the APIs it describes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Category id, e.g. 'web-search'",
                "type": "string"
              },
              "hide_flags": {
                "description": "Warnings to leave out, e.g. [\"wallet-mismatch\", \"few-repeat-buyers\"]",
                "items": {
                  "enum": ["wallet-mismatch", "price-mismatch", "few-repeat-buyers", "unusual-seller-traffic", "test-listing", "resale"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_usd": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "platform": {
                "description": "Sub-category platform ids, any of, e.g. [\"instagram\",\"tiktok\"]. See list_categories",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "rail": {
                "description": "Paid rails to include, e.g. [\"x402\"] for pay-per-call only (default both)",
                "items": {
                  "enum": ["x402", "apify"],
                  "type": "string"
                },
                "type": "array"
              },
              "recent": {
                "description": "true = only endpoints checked in the last 7 days",
                "type": "boolean"
              },
              "task": {
                "description": "Sub-category task ids, any of, e.g. [\"comments\"]. See list_categories",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare APIs in a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c11ee1ffa045843b389305ef3e113ec8c18ce9191a21a6133e0104807a2aec52"
        },
        {
          "name": "find_best",
          "title": "Find the best API for a task",
          "description": "Call this when a task needs an outside API or data source and you have not picked one, e.g. \"search the web\", \"scrape this page to markdown\", \"get the BTC price\", \"Instagram comments for a post\", \"flight prices\", \"generate a PDF\", \"solve a captcha\", \"translate this text\". Returns the recommended pay-per-call API with its price per call, reliability score and real usage, plus ranked alternatives and a link to each. Covers Web search; Web page extraction; LLM inference; Crypto prices & market data; On-chain data; People & company enrichment; Weather; News; Social media data; Job listings; Products & prices; Maps & places; Translation; Email, SMS & messaging; Flights & travel; Stocks & forex; PDF generation; Captcha solving; Sports data; Shopping; Speech & audio. Free, read-only and quick: it never calls or pays the APIs it describes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "hide_flags": {
                "description": "Warnings to leave out, e.g. [\"wallet-mismatch\", \"few-repeat-buyers\"]",
                "items": {
                  "enum": ["wallet-mismatch", "price-mismatch", "few-repeat-buyers", "unusual-seller-traffic", "test-listing", "resale"],
                  "type": "string"
                },
                "type": "array"
              },
              "max_price_usd": {
                "description": "Budget per call in USD, e.g. 0.01",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "recent": {
                "description": "true = only endpoints checked in the last 7 days",
                "type": "boolean"
              },
              "task": {
                "description": "The job in plain words, as the user would put it, e.g. \"scrape TikTok comments\" or \"weather forecast for a city\"",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the best API for a task"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49279e737970d25fb43a87a4c66b086a2e5f7eeddfe00be0cf0359ec7479ca3d"
        },
        {
          "name": "list_categories",
          "title": "What Hagglyai covers",
          "description": "Call this to see whether Hagglyai can help with a need, or to get ids for compare_category and most_popular: every category with how many APIs it tracks, the cheapest price per call, and its platform and task sub-categories (e.g. instagram, comments).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What Hagglyai covers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:03f6b3a82f73d867d231e85559e9160e7e63f39c9860491c70a4cf7cc38e77e2"
        },
        {
          "name": "most_popular",
          "title": "Most popular APIs in a category",
          "description": "Call this when the user asks what other people use, or wants a safe, proven choice: the 3 APIs in a category with the most paying users in the last 30 days, \"Most popular\" first. APIs with warnings are held back and named. Category ids: web-search, web-extraction, llm-inference, crypto-prices, onchain-data, enrichment, weather, news, social-media, jobs, ecommerce, maps-places, translation, messaging, travel, stocks, pdf-generation, captcha-solving, sports-data, shopping, speech-audio. Free, read-only and quick: it never calls or pays the APIs it describes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Category id, e.g. 'web-search'",
                "type": "string"
              },
              "hide_flags": {
                "description": "Warnings to leave out, e.g. [\"wallet-mismatch\", \"few-repeat-buyers\"]",
                "items": {
                  "enum": ["wallet-mismatch", "price-mismatch", "few-repeat-buyers", "unusual-seller-traffic", "test-listing", "resale"],
                  "type": "string"
                },
                "type": "array"
              },
              "max_price_usd": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "platform": {
                "description": "Sub-category platform ids, any of, e.g. [\"instagram\",\"tiktok\"]. See list_categories",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "rail": {
                "description": "Paid rails to include, e.g. [\"x402\"] for pay-per-call only (default both)",
                "items": {
                  "enum": ["x402", "apify"],
                  "type": "string"
                },
                "type": "array"
              },
              "recent": {
                "description": "true = only endpoints checked in the last 7 days",
                "type": "boolean"
              },
              "task": {
                "description": "Sub-category task ids, any of, e.g. [\"comments\"]. See list_categories",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Most popular APIs in a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d9a55b2db11d7103513d6996584e9fb8338ab7067b9ccaa627d0f5def27d9e9"
        }
      ],
      "digest": "sha256:5dc38debfebf3eb4800eb91c2bd32c6ef9aee59c25894e061809ee49ad3dff85"
    }
  }
}
