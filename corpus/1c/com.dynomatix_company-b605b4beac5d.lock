{
  "lockfileVersion": 2,
  "subjects": {
    "com.dynomatix/company": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dynomatix.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "com.dynomatix/company",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "We put AI agents into production — and keep them running. Dynomatix puts AI agents into production and keeps them running: agentic systems, e-commerce, and the internal tools a company runs on. Building software since 2012. Engagements: Agent readiness review, Agent and application build, Operate, Legacy software modernization. Read tools are free to call; the two submit tools reach a human inbox and cannot be undone.",
      "tools": [
        {
          "name": "dynomatix_about",
          "title": "About Dynomatix",
          "description": "Who Dynomatix is, what it sells and how to reach it. Returns the company's identity and tagline, its engagement types, both contact addresses, its key pages and its track record. Read this first if you are deciding whether this company fits a need; use dynomatix_submit_enquiry to start a conversation. Takes no arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "contact": {
                "description": "General and hiring email addresses, and the enquiry page.",
                "type": "object"
              },
              "engagements": {
                "description": "The kinds of work Dynomatix takes on.",
                "items": {
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "identity": {
                "description": "Name, legal name, URL, tagline, description, founding year.",
                "type": "object"
              },
              "keyPages": {
                "description": "Labelled links to the pages worth reading next.",
                "items": {
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "proof": {
                "description": "Years active, products shipped, how many are still live.",
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5c98df8c5472e45a981b716f8b973e49641f41099b33485ee8d8c94745d3d288"
        },
        {
          "name": "dynomatix_get_position",
          "title": "Read a job posting",
          "description": "Read one job posting in full: responsibilities, requirements and how the role is set up. Returns the posting's own markdown, frontmatter included — the title and canonical URL it opens with are the citation to quote when you tell someone about the role. Call dynomatix_list_open_positions first to get a valid slug; a slug that is not currently open is refused rather than guessed at.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The position's slug, exactly as dynomatix_list_open_positions returned it. Lowercase letters, digits and hyphens.",
                "maxLength": 81,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a51940a1c34380d9f0c196ccc68e91e7b3015a513769b49eb9b38510ef0a4253"
        },
        {
          "name": "dynomatix_get_work",
          "title": "Read a case study",
          "description": "Read one case study in full: what the problem was, what was built and what it changed. Returns the study's own markdown, frontmatter included — the title and canonical URL it opens with are the citation to quote. Call dynomatix_list_work first for a valid slug; only entries whose `caseStudyUrl` is not null have a write-up to return.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The item's slug, exactly as dynomatix_list_work returned it. Lowercase letters, digits and hyphens.",
                "maxLength": 81,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7d0726631b9ff26f04f79e857c84377e1b052b54810b9c45e8859b5c434641f6"
        },
        {
          "name": "dynomatix_list_open_positions",
          "title": "List open positions",
          "description": "List every role Dynomatix is currently hiring for. Returns one entry per position with its slug, title, one-line summary, employment type, canonical URL and posting dates. Start here before dynomatix_get_position or dynomatix_submit_application: the slug this returns is the value both of them expect. An empty list means there are no openings right now, not that the lookup failed. Takes no arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "positions": {
                "description": "Open roles, in the order the site lists them.",
                "items": {
                  "properties": {
                    "datePosted": {
                      "description": "ISO 8601 date.",
                      "type": "string"
                    },
                    "employmentType": {
                      "description": "Full-time, contract, and so on.",
                      "type": "string"
                    },
                    "role": {
                      "description": "The role's title.",
                      "type": "string"
                    },
                    "slug": {
                      "description": "Identifier for dynomatix_get_position and the `position` argument of dynomatix_submit_application.",
                      "type": "string"
                    },
                    "summary": {
                      "description": "One-line description of the role.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Path to the posting on dynomatix.com.",
                      "type": "string"
                    },
                    "validThrough": {
                      "description": "ISO 8601 date.",
                      "type": "string"
                    }
                  },
                  "required": ["role", "slug", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["positions"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cf5cb6bef91016ed9fa480cedfc8f7394fab3ff1999563ccb9d8484d66e21e1c"
        },
        {
          "name": "dynomatix_list_work",
          "title": "List past and current work",
          "description": "List the products and client work Dynomatix has shipped. Returns one entry per item with its name, the year it started, its status, a short description and its links. Retired items are included — the site shows them and `status` says which is which — because a track record with the failures removed is not a track record. Where `caseStudyUrl` is not null, dynomatix_get_work will return the full write-up for that slug. Takes no arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "work": {
                "description": "Products and engagements, in the order the site lists them.",
                "items": {
                  "properties": {
                    "caseStudyUrl": {
                      "description": "Null when no case study has been written.",
                      "type": ["string", "null"]
                    },
                    "description": {
                      "type": "string"
                    },
                    "linkLabel": {
                      "type": "string"
                    },
                    "markdownUrl": {
                      "description": "Null when no case study has been written.",
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "since": {
                      "description": "The year the work began.",
                      "type": "string"
                    },
                    "slug": {
                      "description": "Identifier for dynomatix_get_work.",
                      "type": "string"
                    },
                    "status": {
                      "description": "Whether the item is live, retired, and so on.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The product's own address.",
                      "type": "string"
                    }
                  },
                  "required": ["name", "slug"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["work"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d28620361a7df3a1acf40d5ace5b2e2af1a4c695f9b75674250d692b8ae2ba81"
        },
        {
          "name": "dynomatix_submit_application",
          "title": "Apply for a position",
          "description": "Submit a job application to Dynomatix, résumé included. This is final: it delivers straight to a monitored human inbox and cannot be edited, recalled or deleted afterwards. Confirm the details with the person you are acting for before you call it, and do not call it twice for the same submission — a retry sends a second copy. Set `position` to a slug from dynomatix_list_open_positions. Supply the résumé exactly one of two ways: `resume_url`, an https link that downloads the file itself (a sharing page from a drive or a document service is not a direct link and will be refused), or `resume_base64` together with `resume_filename`. Supplying both, or neither, is refused. The résumé must be a PDF, DOC or DOCX file under 5 MB; its contents are checked against its extension, so a renamed file is refused too. Nothing is stored until every field passes, and the reply confirms receipt with a submission id worth quoting in any follow-up — it never returns the résumé or a link to it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The applicant's email address, in the form name@example.com. This is the only way they will be contacted, so check it before sending.",
                "maxLength": 254,
                "type": "string"
              },
              "letter": {
                "description": "Optional cover letter. Newlines are preserved.",
                "maxLength": 10000,
                "type": "string"
              },
              "name": {
                "description": "The applicant's full name.",
                "maxLength": 100,
                "type": "string"
              },
              "phone": {
                "description": "Optional. The applicant's phone number.",
                "maxLength": 40,
                "type": "string"
              },
              "portfolio": {
                "description": "Optional. A full web address starting with http:// or https:// — a portfolio, GitHub profile or personal site.",
                "maxLength": 300,
                "type": "string"
              },
              "position": {
                "description": "Slug of the role, from dynomatix_list_open_positions. A role that is not on that list is not accepting applications.",
                "maxLength": 81,
                "type": "string"
              },
              "resume_base64": {
                "description": "The résumé's bytes, base64-encoded. Use this OR resume_url, never both. Requires resume_filename. Payloads over 5 MB are refused before they are decoded.",
                "type": "string"
              },
              "resume_filename": {
                "description": "Required with resume_base64: it is the only source of the file's extension, which must be one of PDF, DOC or DOCX. Optional with resume_url, where the URL's last path segment is used instead.",
                "type": "string"
              },
              "resume_url": {
                "description": "An https URL that downloads the résumé file directly. Not a sharing or preview page — the response must be the file itself. Use this OR resume_base64, never both. http:// is refused, as are hostnames that resolve inside a private network.",
                "type": "string"
              }
            },
            "required": ["email", "name", "position"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10cae301098795764637c53aaebba50246f7739574a1560b6a14431c55f04330"
        },
        {
          "name": "dynomatix_submit_enquiry",
          "title": "Send a work enquiry",
          "description": "Send a project enquiry to Dynomatix — the same form the site's enquiry page submits. This is final: it delivers straight to a monitored human inbox and cannot be edited, recalled or deleted afterwards. Confirm the details with the person you are acting for before you call it, and do not call it twice for the same submission — a retry sends a second copy. Give the company or product website in `company` (a bare hostname like example.com is fine) and say what needs building in `brief`. Nothing is stored: the enquiry becomes an email and nothing else. Ask for a budget on the call, not here — this form does not collect one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brief": {
                "description": "What needs building, in the enquirer's own words. Newlines are preserved. There is no minimum — a single line is a fine enquiry.",
                "maxLength": 50000,
                "type": "string"
              },
              "company": {
                "description": "The company or product website. A bare hostname is accepted and https is assumed; anything that is not a web address is refused.",
                "maxLength": 300,
                "type": "string"
              },
              "email": {
                "description": "The enquirer's email address, in the form name@example.com. This is the only address the reply can go to.",
                "maxLength": 254,
                "type": "string"
              },
              "name": {
                "description": "The enquirer's full name.",
                "maxLength": 100,
                "type": "string"
              },
              "timeline": {
                "description": "Optional. One of: exploring (Exploring), this-quarter (This quarter), already-started (Already started and stuck). Omit it if unknown — blank is valid, a value outside this list is not.",
                "enum": ["exploring", "this-quarter", "already-started"],
                "type": "string"
              }
            },
            "required": ["brief", "company", "email", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90289efb00e420638f1e6be71b8418263ab19e1f2d1eb22d07a1b45ed0ba68b4"
        }
      ],
      "digest": "sha256:0bf33e582848aa5755d764ae9117ddd7aa6a303f923a4cfbc0fb3277c938eb6d"
    }
  }
}
