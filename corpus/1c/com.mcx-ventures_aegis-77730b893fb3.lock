      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Paid tools from McX Ventures AEGIS. Each tools/call costs the USDC price in its description, on Base, paid per call with x402. An unpaid call returns isError with the x402 PaymentRequired object in structuredContent; retry with the signed payment in params._meta['x402/payment']. The settlement receipt is returned in result._meta['x402/payment-response']. Calls that fail validation or error are not charged.",
      "tools": [
        {
          "name": "ct_check",
          "title": "Certificate Transparency check",
          "description": "Public logging of the live certificate, one domain: the certificate the server serves has its embedded SCTs verified against the known Certificate Transparency log list. Issuer and expiry are tls_check. Result hash anchored on Base Price: $0.003 USDC on Base per call, paid with x402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "target": {
                "description": "Public hostname (not an IP address), e.g. example.com",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Certificate Transparency check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
