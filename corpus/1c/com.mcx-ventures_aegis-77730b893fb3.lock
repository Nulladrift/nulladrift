          "description": "No input: a reference scan of AEGIS's fixed basket of public hosts with all six checks (TLS, CT, DNS, NTP, portal, route), a baseline snapshot of network integrity from AEGIS's vantage. To scan your own hosts use forensics_custom. Result hash anchored on Base Price: $0.01 USDC on Base per call, paid with x402.",
