        },
        {
          "name": "dow_awards",
          "title": "Defense-stock signal: Pentagon contract awards by ticker",
          "description": "Defense-stock event signal: U.S. Department of War contract awards ($7.5M+) from the official 5 PM ET daily announcements, normally published the same evening, matched to public tickers and sized as % of the company's annual revenue (material / notable / routine), with action vs ceiling vs obligated dollars, new vs existing work and corrections. Each day's dataset hash is anchored on Base. Feed freshness is reported in every response and free at /dow-awards/index Price: $0.01 USDC on Base per call, paid with x402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "One announcement day, YYYY-MM-DD. Omit all dates for the latest day.",
                "type": "string"
              },
              "date_from": {
                "description": "Range start, YYYY-MM-DD (range max 31 days).",
                "type": "string"
              },
              "date_to": {
                "description": "Range end, YYYY-MM-DD.",
                "type": "string"
              },
              "exclude_existing": {
                "description": "Drop option exercises / modifications.",
                "type": "boolean"
              },
              "limit": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "min_tier": {
                "description": "Minimum materiality tier (award vs annual revenue).",
                "enum": ["routine", "notable", "material"],
                "type": "string"
              },
              "ticker": {
                "description": "Only awards whose awardee maps to this ticker, e.g. LMT.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Defense-stock signal: Pentagon contract awards by ticker"
