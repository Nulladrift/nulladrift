        },
        {
          "name": "forensics_custom",
          "title": "AEGIS Network Forensics (custom targets)",
          "description": "Your targets: the same six checks (TLS, CT, DNS, NTP, portal, route) run against 1-8 public hosts or IPs you supply, in one call, a multi-target posture scan. Private and reserved addresses are rejected. Result hash anchored on Base Price: $0.05 USDC on Base per call, paid with x402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "targets": {
                "description": "1-8 public hostnames or IP addresses",
