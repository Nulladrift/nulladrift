        },
        {
          "name": "dns_check",
          "title": "DNS lookup and hijack check",
          "description": "DNS hijack check, one domain: resolves it through AEGIS and through Cloudflare, Google and Quad9 and compares the answers by network owner (ASN), flagging private addresses and mismatches. Result hash anchored on Base Price: $0.002 USDC on Base per call, paid with x402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "target": {
                "description": "Public hostname (not an IP address), e.g. example.com",
                "type": "string"
