        {
          "name": "koot_watch",
          "title": "Koot Watch: Watch My Stack & Companies (Pro)",
          "description": "PRO. Tell Koot what to watch once: packages (or a pasted package.json) and/or companies (tickers). Koot remembers them and only reports what is NEW: newly exploited or likely-exploited vulnerabilities in your packages, and new SEC filings (8-K material events flagged) from your companies. Add notify_url (Slack or Discord webhook) and Koot posts new items there by itself, daily. Calling again adds to the list.",
          "inputSchema": {
            "properties": {
              "companies": {
                "description": "US public companies to watch for NEW SEC filings: tickers, names or CIKs, e.g. [\"TSLA\", \"AAPL\"]. Up to 25.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ecosystem": {
                "description": "Registry for string packages (default npm).",
                "enum": ["npm", "pypi", "cargo", "go", "maven", "rubygems", "nuget", "composer"],
                "type": "string"
              },
              "manifest": {
                "description": "Or paste a whole package.json or requirements.txt here.",
                "type": "string"
              },
              "notify_url": {
                "description": "Optional. A Slack or Discord incoming-webhook URL. Koot checks daily and posts there only when something NEW is exploited or likely to be.",
                "type": "string"
              },
              "packages": {
                "description": "Packages as 'name' or 'name@version' strings (or {name, version, ecosystem} objects), e.g. [\"lodash@4.17.15\", \"express\"].",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "properties": {
                        "ecosystem": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "version": {
                          "type": "string"
                        }
                      },
                      "required": ["name"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
