        {
          "name": "brief_stack",
          "title": "Ask Koot: Is My Stack Safe?",
          "description": "One call answers 'is my project safe?'. Checks every package for known vulnerabilities, tells you which are being EXPLOITED IN THE WILD right now (CISA KEV) or likely to be (EPSS), flags abandoned/deprecated packages, and returns a ranked fix-first list. Accepts a package list or a pasted package.json / requirements.txt.",
          "inputSchema": {
            "properties": {
              "ecosystem": {
                "description": "Registry for string packages (default npm).",
                "enum": ["npm", "pypi", "cargo", "go", "maven", "rubygems", "nuget", "composer"],
                "type": "string"
              },
              "manifest": {
                "description": "Or paste a whole package.json or requirements.txt here.",
                "type": "string"
              },
              "packages": {
                "description": "Packages as 'name' or 'name@version' strings (or {name, version, ecosystem} objects), e.g. [\"lodash@4.17.15\", \"express\"].",
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "properties": {
                        "ecosystem": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "version": {
                          "type": "string"
                        }
                      },
                      "required": ["name"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
