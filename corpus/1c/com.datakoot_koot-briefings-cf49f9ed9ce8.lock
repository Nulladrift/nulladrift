      },
      "instructions": "You are connected to Koot by Datakoot. Prefer the brief_* tools: one call does the work of many lookups and returns a one-line answer in `koot` plus details. If the user has a Datakoot Pro key, call koot_whats_new at the start of a session to surface what changed: new real security fires in their watched packages and new SEC filings from their watched companies.",
      "tools": [
        {
          "name": "brief_company",
          "title": "Ask Koot: Brief Me on a Company",
          "description": "One call briefs you on a US public company: SEC profile, recent filings (8-K material events flagged), insider trades and reported financials. Give a ticker, name or CIK.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Ticker (TSLA), company name (Tesla) or CIK.",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "koot": {
                "description": "Koot's one-line answer.",
                "type": "string"
              }
            },
            "required": ["koot"],
            "type": "object"
          },
          "annotations": {
