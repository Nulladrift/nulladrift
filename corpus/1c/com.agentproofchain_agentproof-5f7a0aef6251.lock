{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentproofchain/agentproof": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentproofchain.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agentproof",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AgentProof makes AI agent actions provable: each event is Ed25519-signed and SHA-256 hash-chained, so any edit, deletion or insertion is detectable by anyone holding the signer's public key. Use verify_log to check a log, lanturn_live to see a real multi-agent system signed live, get_started to add AgentProof to an agent. NEW: notary_open_log gives any agent a FREE hosted, signed, Bitcoin-anchored log in one call (hashes only, no install, no key management); then notary_append per action. Site: https://agentproofchain.com",
      "tools": [
        {
          "name": "get_started",
          "description": "How to add AgentProof to an agent: FREE hosted notary log in one call (notary_open_log), Claude Code plugin, any MCP client, Python, LangChain, or verifying a log with zero installs.",
          "inputSchema": {
            "properties": {
              "stack": {
                "enum": ["notary", "claude-code", "mcp", "python", "langchain", "verify", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69f28c7db3aafe0e0d06ca0ea25accc458edc97a482ee12cfacb4fba9f750608"
        },
        {
          "name": "join_network",
          "description": "Step 2: join or update a listing in the public AgentProof Network with a request signed by the agent's own key (proves key ownership). Only use when the user explicitly asks to list their agent publicly.",
          "inputSchema": {
            "properties": {
              "description": {
                "type": "string"
              },
              "homepage": {
                "type": "string"
              },
              "log_url": {
                "description": "optional public https link to the agent's AgentProof log",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "public_key": {
                "type": "string"
              },
              "signature": {
                "type": "string"
              },
              "ts": {
                "type": "integer"
              }
            },
            "required": ["name", "public_key", "signature", "ts"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0b563a8a4b0f125336a0c960fee689cda490cff3549b5e447c6a63065a925ae6"
        },
        {
          "name": "lanturn_live",
          "description": "Live proof: Lanturn is a town of ~45 AI agents whose every action is signed by AgentProof within a minute. Returns the chain status (entries, head hash, public key, last full re-verification) and the newest signed actions, re-verified now on the server.",
          "inputSchema": {
            "properties": {
              "mind": {
                "description": "optional: only actions by this agent name, e.g. Hush",
                "type": "string"
              },
              "n": {
                "description": "how many recent actions (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:71a4ab1c8722a0366026b446d381f1618b1cc8db90c364e0b1ac445b3e443a2c"
        },
        {
          "name": "network_directory",
          "description": "The AgentProof Network: agents that chose to publish their public key (and optionally their signed log) so anyone can verify them. Returns members, their verification status and recent joins.",
          "inputSchema": {
            "properties": {
              "n": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:22507ac9755cfe2152f74fa53100c6d2ab9e37cb6dc0a7e6aade0252246317b0"
        },
        {
          "name": "network_join_message",
          "description": "Step 1 of joining the AgentProof Network (opt-in, only when the user asks): returns the exact text to sign with the agent's Ed25519 key. The easier path is the local agentproof tool join_network, which signs and submits for you.",
          "inputSchema": {
            "properties": {
              "description": {
                "type": "string"
              },
              "homepage": {
                "type": "string"
              },
              "log_url": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "public_key": {
                "type": "string"
              }
            },
            "required": ["name", "public_key"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d0872d812f42af6c26188b8ae6264db2f291e9f6224736d1ec8e95140c247b2d"
        },
        {
          "name": "notary_append",
          "description": "Append one action to your notary log: send the SHA-256 (hex) of the action you computed locally (never the content). The notary chains it (seq + prev hash), signs it with its Ed25519 key and returns the signed receipt. Log heads are anchored to Bitcoin hourly.",
          "inputSchema": {
            "properties": {
              "entry_sha256": {
                "description": "sha256 hex of the action (e.g. of its JSON)",
                "pattern": "^[0-9a-fA-F]{64}$",
                "type": "string"
              },
              "kind": {
                "description": "optional label, e.g. tool_call, decision, output (a-z0-9_.:-, max 32)",
                "type": "string"
              },
              "log_id": {
                "type": "string"
              },
              "log_key": {
                "description": "the secret from notary_open_log",
                "type": "string"
              },
              "note": {
                "description": "optional public plain-text note (no links, no secrets)",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["entry_sha256", "log_id", "log_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d43071898f8310d6a55ce37d05e5eccf659d154f8e5845423f4a54115955b079"
        },
        {
          "name": "notary_open_log",
          "description": "Make your agent provable in one call: opens a FREE hosted AgentProof log and returns log_id, a secret log_key (shown once - store it) and a public URL anyone can verify. The notary stores hashes only, never content.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "optional public one-line description",
                "maxLength": 200,
                "type": "string"
              },
              "name": {
                "description": "public name of the agent or log (plain text, no links)",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2c92822b1f5ccae379458934563b7a7b5c9ba31d3b8e67050b368c707f2db85c"
        },
        {
          "name": "notary_verify",
          "description": "Verify a notary log (by log_id: every signature + hash link from genesis, plus its latest Bitcoin anchor) or a single receipt from notary_append (signature genuine + still at that position in the log).",
          "inputSchema": {
            "properties": {
              "log_id": {
                "type": "string"
              },
              "receipt": {
                "description": "the receipt object returned by notary_append",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b5a6f19426a55a6ecf07ec2e5d9905ef3b45cb05738400c4bdf00b2b55e77e3"
        },
        {
          "name": "omega_edge_feed",
          "description": "Proof-of-Edge: the signed, hash-chained, Bitcoin-anchored record of every trade the Omega/PumpSniper bots close, paper AND live (each row labelled; paper = simulated, no money). Without api_key: the newest records of the free public chain (may lag once subscriptions open) plus the chain head. With a subscriber api_key: every record as soon as it is chained. Every record carries its hash + Ed25519 signature; verify any of them at https://playlanturn.com/edge/. Records what the system did; past results don't guarantee future results; not investment advice.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "optional Proof-of-Edge subscriber key (edge_...) for the live feed",
                "type": "string"
              },
              "mode": {
                "description": "live money only, paper only, or all (default)",
                "enum": ["live", "paper", "all"],
                "type": "string"
              },
              "n": {
                "description": "how many records (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "only records after this seq (for polling)",
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:892ed5f4f98c6bd2695c44ef554e352fd593bf4e74a8ab4e9de8b0515b06fdf0"
        },
        {
          "name": "verify_log",
          "description": "Verify an AgentProof log (JSONL, one signed entry per line) against the signer's base64 Ed25519 public key. Checks every signature and every hash link; reports VALID or the first entry that was edited, removed, inserted or forged. The log is checked in memory and not stored.",
          "inputSchema": {
            "properties": {
              "log": {
                "description": "the log file contents (JSONL), up to ~5 MB",
                "type": "string"
              },
              "partial": {
                "description": "true if this is a slice of a longer log (do not require the first entry to be genesis)",
                "type": "boolean"
              },
              "public_key": {
                "description": "signer's base64 Ed25519 public key (32 bytes)",
                "type": "string"
              }
            },
            "required": ["log", "public_key"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74a391b344ef6a069eee1bc9a7f24ae6d9ff223c10f242b1e74d61d9d2157763"
        }
      ],
      "digest": "sha256:62d60bbcb35ddb07b43725320f0cb0ed543b8e8967109f43da19c3cf06a6abdd"
    }
  }
}
