{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentproofchain/agentproof": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentproofchain.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agentproof",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AgentProof makes AI agent actions provable: each event is Ed25519-signed and SHA-256 hash-chained, so any edit, deletion or insertion is detectable by anyone holding the signer's public key. Use verify_log to check a log, lanturn_live to see a real multi-agent system signed live, get_started to add AgentProof to an agent. Site: https://agentproofchain.com",
      "tools": [
        {
          "name": "get_started",
          "description": "How to add AgentProof to an agent: Claude Code plugin, any MCP client, Python, LangChain, or verifying a log with zero installs.",
          "inputSchema": {
            "properties": {
              "stack": {
                "enum": ["claude-code", "mcp", "python", "langchain", "verify", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6353495769e8b7c386f05ee1e1f7226d2794544c690be60054a348dd1909408"
        },
        {
          "name": "join_network",
          "description": "Step 2: join or update a listing in the public AgentProof Network with a request signed by the agent's own key (proves key ownership). Only use when the user explicitly asks to list their agent publicly.",
          "inputSchema": {
            "properties": {
              "description": {
                "type": "string"
              },
              "homepage": {
                "type": "string"
              },
              "log_url": {
                "description": "optional public https link to the agent's AgentProof log",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "public_key": {
                "type": "string"
              },
              "signature": {
                "type": "string"
              },
              "ts": {
                "type": "integer"
              }
            },
            "required": ["name", "public_key", "signature", "ts"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0b563a8a4b0f125336a0c960fee689cda490cff3549b5e447c6a63065a925ae6"
        },
        {
          "name": "lanturn_live",
          "description": "Live proof: Lanturn is a town of ~45 AI agents whose every action is signed by AgentProof within a minute. Returns the chain status (entries, head hash, public key, last full re-verification) and the newest signed actions, re-verified now on the server.",
          "inputSchema": {
            "properties": {
              "mind": {
                "description": "optional: only actions by this agent name, e.g. Hush",
                "type": "string"
              },
              "n": {
                "description": "how many recent actions (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:71a4ab1c8722a0366026b446d381f1618b1cc8db90c364e0b1ac445b3e443a2c"
        },
        {
          "name": "network_directory",
          "description": "The AgentProof Network: agents that chose to publish their public key (and optionally their signed log) so anyone can verify them. Returns members, their verification status and recent joins.",
          "inputSchema": {
            "properties": {
              "n": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:22507ac9755cfe2152f74fa53100c6d2ab9e37cb6dc0a7e6aade0252246317b0"
        },
        {
          "name": "network_join_message",
          "description": "Step 1 of joining the AgentProof Network (opt-in, only when the user asks): returns the exact text to sign with the agent's Ed25519 key. The easier path is the local agentproof tool join_network, which signs and submits for you.",
          "inputSchema": {
            "properties": {
              "description": {
                "type": "string"
              },
              "homepage": {
                "type": "string"
              },
              "log_url": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "public_key": {
                "type": "string"
              }
            },
            "required": ["name", "public_key"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d0872d812f42af6c26188b8ae6264db2f291e9f6224736d1ec8e95140c247b2d"
        },
        {
          "name": "verify_log",
          "description": "Verify an AgentProof log (JSONL, one signed entry per line) against the signer's base64 Ed25519 public key. Checks every signature and every hash link; reports VALID or the first entry that was edited, removed, inserted or forged. The log is checked in memory and not stored.",
          "inputSchema": {
            "properties": {
              "log": {
                "description": "the log file contents (JSONL), up to ~5 MB",
                "type": "string"
              },
              "partial": {
                "description": "true if this is a slice of a longer log (do not require the first entry to be genesis)",
                "type": "boolean"
              },
              "public_key": {
                "description": "signer's base64 Ed25519 public key (32 bytes)",
                "type": "string"
              }
            },
            "required": ["log", "public_key"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74a391b344ef6a069eee1bc9a7f24ae6d9ff223c10f242b1e74d61d9d2157763"
        }
      ],
      "digest": "sha256:f48cb31d01955223648cff2f01db3b8b0fc96d7ff316d19ddcb3a1d95ca4d182"
    }
  }
}
