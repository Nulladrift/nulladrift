{
  "lockfileVersion": 2,
  "subjects": {
    "com.shipstry/launch-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://shipstry.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "shipstry-launch-data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only launch intelligence for Shipstry (https://shipstry.com), a weekly registry of maker-built products. Products are reviewed, then scheduled into a ship week (Monday-Sunday, UTC) keyed as YYYYMMDD. Use search_launches to discover products, list_ship_week to read one week's cohort, get_winners for weekly/monthly medal results, and get_category_landscape to judge how crowded a category is and what a top launch looks like there. Vote counts for the current ship week are hidden during Fog Mode (13:00-19:00 UTC); results say so via voteHidden instead of returning numbers. Every result includes the canonical Shipstry URL so it can be cited.",
      "tools": [
        {
          "name": "check_url",
          "title": "Check whether a URL is listed",
          "description": "Check whether a website URL is already listed on Shipstry, using the same normalization as submission duplicate detection. Only approved listings are visible.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49d43b096de47be1791d7ac134921d449e529d2c40ecd1347478037d8b611dbb"
        },
        {
          "name": "get_category_landscape",
          "title": "Get a category landscape",
          "description": "Benchmark a category over a window of ship weeks: how many products launched, the vote distribution (mean, p50, p75, p90, max), the top launches, how many medals were awarded, and the tags that appear most. Use this to judge how crowded a space is and what a winning launch looks like there.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug. One of: developer-tools, design-tools, marketing-sales, finance, education, health-wellness, social, ecommerce, entertainment, ai-ml, travel, productivity, data-analytics, web3, security-privacy, hardware, media-news, other.",
                "enum": ["developer-tools", "design-tools", "marketing-sales", "finance", "education", "health-wellness", "social", "ecommerce", "entertainment", "ai-ml", "travel", "productivity", "data-analytics", "web3", "security-privacy", "hardware", "media-news", "other"],
                "type": "string"
              },
              "weeks": {
                "default": 12,
                "description": "How many ship weeks back to include.",
                "maximum": 52,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0803964d6ea87148fca16f010698571b13715e7f87eaca7ce866fe8eb585bb74"
        },
        {
          "name": "get_launch",
          "title": "Get a launch",
          "description": "Fetch one approved launch with its description, tags, awards, and maker name. Identify it by Shipstry product id, product slug, its Shipstry URL, or its own website URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Shipstry product id. Every result returned by the other tools includes one.",
                "maxLength": 64,
                "type": "string"
              },
              "slug": {
                "maxLength": 200,
                "type": "string"
              },
              "url": {
                "description": "Either the Shipstry product URL or the product's own website URL.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:334150f0eaabf87c4f4e079d111e97d59511e8a78511885528194b7093e0317f"
        },
        {
          "name": "get_winners",
          "title": "Get winners",
          "description": "Weekly or monthly medal winners (gold, silver, bronze). Returns the most recent periods by default, or one period when `period` is given. Use this to see what actually won, not just what launched.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 12,
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "description": "Award period: YYYYMMDD for weeks, YYYY-MM for months. Omit for the most recent periods.",
                "maxLength": 10,
                "type": "string"
              },
              "scope": {
                "default": "week",
                "description": "Weekly or monthly award periods.",
                "enum": ["week", "month"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2255e93142828cfbb11fdc6b9434bb1c59a2139c4dab8669f309dc0a50bcd3e4"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List Shipstry's product categories with the number of approved products in each. Call this first when you need a valid category slug for the other tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93bcedbc35da9f44a8fb92e9c10db1c6ad049ef1ef55c713b05f5d3a56766583"
        },
        {
          "name": "list_ship_week",
          "title": "List a ship week",
          "description": "List the products that launched in one ship week (Monday-Sunday UTC, keyed YYYYMMDD). Defaults to the current week. During Fog Mode vote counts for the current week are hidden and the order is random.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Filter to one category. One of: developer-tools, design-tools, marketing-sales, finance, education, health-wellness, social, ecommerce, entertainment, ai-ml, travel, productivity, data-analytics, web3, security-privacy, hardware, media-news, other.",
                "enum": ["developer-tools", "design-tools", "marketing-sales", "finance", "education", "health-wellness", "social", "ecommerce", "entertainment", "ai-ml", "travel", "productivity", "data-analytics", "web3", "security-privacy", "hardware", "media-news", "other"],
                "type": "string"
              },
              "limit": {
                "default": 30,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "shipWeek": {
                "description": "Monday of the week in YYYYMMDD form, for example '20260907'. Defaults to the current ship week.",
                "pattern": "^[0-9]{8}$",
                "type": "string"
              },
              "sort": {
                "default": "votes",
                "description": "Vote order is forced to random while Fog Mode hides the current week's ranking.",
                "enum": ["votes", "recent", "random"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1506ecfd8990f291bc14eb7166f4e065e9ca8f914aea383cbc3e33c8a0d35b5"
        },
        {
          "name": "search_launches",
          "title": "Search launches",
          "description": "Search approved Shipstry launches by keyword, category, or tag. Keyword matching covers product name and tagline. Returns compact records with votes, ship week, awards, and the canonical Shipstry URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug. One of: developer-tools, design-tools, marketing-sales, finance, education, health-wellness, social, ecommerce, entertainment, ai-ml, travel, productivity, data-analytics, web3, security-privacy, hardware, media-news, other.",
                "enum": ["developer-tools", "design-tools", "marketing-sales", "finance", "education", "health-wellness", "social", "ecommerce", "entertainment", "ai-ml", "travel", "productivity", "data-analytics", "web3", "security-privacy", "hardware", "media-news", "other"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Keyword matched against product name and tagline.",
                "maxLength": 200,
                "type": "string"
              },
              "sort": {
                "default": "hot",
                "description": "hot = all-time by votes, new = newest first, week = launched in the current ship week, month = launched this month.",
                "enum": ["hot", "new", "week", "month"],
                "type": "string"
              },
              "tag": {
                "description": "Tag slug, for example 'vpn' or 'beta'. See get_category_landscape for tags common in a category.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:43c5aaef5ec74d3358ac4aa7f01736e9419eea223ea797e83066eb687f2b7d3f"
        }
      ],
      "digest": "sha256:1849e14ea859e79aa348067bdf7b8a39e5f7db2d8f4eee655a0946e56af9c512"
    }
  }
}
