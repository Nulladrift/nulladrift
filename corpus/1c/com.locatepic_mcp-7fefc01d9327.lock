        {
          "name": "calculate_solar_shadow_latitude",
          "title": "Solar Shadow Azimuth & Latitude Estimator",
          "description": "Estimate approximate latitude band and hemisphere from object height, shadow length, and UTC capture timestamp for visual photo verification.",
          "inputSchema": {
            "properties": {
              "month": {
                "description": "Capture month (1-12)",
                "type": "integer"
              },
              "objectHeightMeters": {
                "description": "Vertical height of reference object in meters (e.g. 2.0)",
                "type": "number"
              },
              "shadowLengthMeters": {
                "description": "Measured ground shadow length in meters (e.g. 1.73)",
                "type": "number"
              }
            },
            "required": ["objectHeightMeters", "shadowLengthMeters"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Solar Shadow Azimuth & Latitude Estimator"
