              "side": {
                "description": "Keep only accounts whose net balance falls on this side (debit = debits exceed credits). Accounts netting to zero match neither.",
                "enum": ["debit", "credit"],
                "type": "string"
              }
            },
            "required": ["client_id", "period_id"],
