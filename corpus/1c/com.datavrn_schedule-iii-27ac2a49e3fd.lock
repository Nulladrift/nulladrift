              },
              "client_id": {
                "description": "The entity (client) id — from list_clients.",
                "format": "uuid",
                "type": "string"
              },
              "confirm_token": {
                "maxLength": 200,
                "minLength": 20,
                "type": "string"
              },
              "on_behalf_of": {
                "description": "The email address your user signs in to Datavrn with. This records who authorised the change alongside the connection that made it. REQUIRED on an API-key connection — ask your user for it, do not guess. On an OAuth connection leave it out: the change is recorded as authorised by the member who connected; if you do supply it, it must be that member.",
