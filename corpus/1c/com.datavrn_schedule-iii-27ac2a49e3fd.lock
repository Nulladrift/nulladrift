        {
          "name": "get_allocation_target_figures",
          "title": "Read allocation target figures",
          "description": "MANAGEMENT data class. Read one explicit cost or profit partition of the current persisted allocation run at account × target × source × mode grain, with decimal-string allocated amounts. Cost-centre and profit-centre reconciliations are independent views of the same P&L activity; do not add them. Final post-step-down cost uses the complete selected cost population: non-step-down plus signed step-down. Filter allocation_sources=['step_down'] only to inspect transfers and confirm their run net is zero. Accounted equals assigned plus Unallocated; Unallocated is not additional. For profit centres, choose profit. Use filters before paging; the signed page_token is source-pinned, so restart at page 1 if source_changed. Target labels use the current governed centre timeline evaluated at the run period (target_labels_frozen: false); persisted allocation amounts stay unchanged. A controlled in-period centre correction changes a displayed label and invalidates the page token; restart at page 1 without regenerating allocation. Review run staleness and methodology, and regenerate when either changed. An integrity failure means regenerate, retry, then contact support if it recurs. No owners, descriptions, source transactions, or recomputation are returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "account_name_patterns": {
                "description": "Up to 10 case-insensitive account-name substrings; any match is retained.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "allocation_dimension": {
                "description": "Required partition: cost for cost-centre or step-down questions; profit for profit-centre questions. Do not add the two views.",
                "enum": ["cost", "profit"],
                "type": "string"
              },
              "allocation_sources": {
                "description": "Restrict to allocation sources.",
                "items": {
                  "enum": ["account_mapping", "source_dimension", "unallocated", "step_down"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "client_id": {
                "description": "The entity (client) id — from list_clients.",
                "format": "uuid",
                "type": "string"
              },
              "min_abs_amount": {
                "description": "Minimum absolute allocated amount in rupees as a decimal string, e.g. '100000'.",
                "pattern": "^\\d{1,16}(\\.\\d{1,2})?$",
                "type": "string"
              },
              "page_size": {
                "description": "Rows per source-pinned page (default 50, max 200).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
