        {
          "name": "save_disclosures",
          "title": "Save disclosures",
          "description": "Save the notes/disclosures sections the user provides for the statement. Some of these sections IDENTIFY PEOPLE BY NAME — shareholders, promoters and related parties — so send only what your user has given you, exactly as they gave it. SECTIONS YOU DO NOT SEND ARE LEFT ALONE. Send only the sections you are changing; every other section keeps exactly what is saved. Within a section you DO send, the rows you send REPLACE every row saved for that section — there is no row-level merge, so always send that section complete. To CLEAR a section, send it explicitly with its own empty value: [] for corporateInfo, contingent, shareholders5pct, promoters, relatedParties and msmeAmounts; {} for ratioReasons; null for auditorPayments, csr, proposedDividend and the DSCR amounts. The three ageing sections take [] or null. Clearing removes saved content, so Datavrn saves nothing and returns an approval request naming the sections and how many rows each holds. Show your user exactly what would be cleared; only if they mean to, resend the identical call adding removal_token and removal_count from that response. The approval is single-use and lapses after five minutes — if it lapses, call again for a fresh one. Saving here re-opens the disclosure review — after your last change, confirm the disclosure review again with confirm_capture_review before generating. ratioReasons is keyed by the ratio IDENTIFIER, never its display label: current_ratio | debt_equity | dscr | roe | inv_turnover | tr_turnover | tp_turnover | ncap_turnover | net_profit | roce | roi. msmeAmounts is a POSITIONAL list of exactly five items, in this statutory order: 1. Principal amount and interest due thereon remaining unpaid at the year end (shown separately) | 2. Interest paid under section 16 of the MSMED Act, with the payment made beyond the appointed day | 3. Interest due and payable for delay in payment (paid beyond the appointed day), excluding MSMED-specified interest | 4. Interest accrued and remaining unpaid at the year end | 5. Further interest remaining due and payable in succeeding years (section 23 disallowance) — send all five, using {\"currentPaise\": null, \"previousPaise\": null} for an item with nothing to report. Dashes and capitalisation are forgiven when matching a row label (a hyphen for an en dash is fine) and Datavrn stores the prescribed spelling; the wording itself is not forgiven. PRESCRIBED ROWS BY STATEMENT FORMAT — a row label or sub-head that is not one of these is refused rather than stored (a value already saved on this statement stays editable): Division I (Non-Ind AS) (\"schedule_iii_div1\") — trAgeing: 6 buckets in this order [Not due | < 6 months | 6 months – 1 year | 1 – 2 years | 2 – 3 years | > 3 years], rows [Undisputed — considered good | Undisputed — considered doubtful | Disputed — considered good | Disputed — considered doubtful | Unbilled dues]; tpAgeing: 5 buckets in this order [Not due | < 1 year | 1 – 2 years | 2 – 3 years | > 3 years], rows [MSME | Others | Disputed dues — MSME | Disputed dues — Others | Unbilled dues]; cwipAgeing: 4 buckets in this order [< 1 year | 1 – 2 years | 2 – 3 years | > 3 years], rows [Projects in progress | Projects temporarily suspended]. contingent.subhead ∈ contingent liabilities [Claims against the company not acknowledged as debt | Guarantees | Other money for which the company is contingently liable] or commitments [Estimated amount of contracts remaining to be executed on capital account (net of advances) | Uncalled liability on shares and other investments partly paid | Other commitments] — set group to \"contingent\" or \"commitment\" to match, or the row is totalled under contingent liabilities (or leave subhead out and the row prints as its own line under its group). Division II (Ind AS) (\"schedule_iii_div2\") — trAgeing: 6 buckets in this order [Not due | < 6 months | 6 months – 1 year | 1 – 2 years | 2 – 3 years | > 3 years], rows [Undisputed — considered good | Undisputed — significant increase in credit risk | Undisputed — credit impaired | Disputed — considered good | Disputed — significant increase in credit risk | Disputed — credit impaired | Unbilled dues]; tpAgeing: 5 buckets in this order [Not due | < 1 year | 1 – 2 years | 2 – 3 years | > 3 years], rows [MSME | Others | Disputed dues — MSME | Disputed dues — Others | Unbilled dues]; cwipAgeing: 4 buckets in this order [< 1 year | 1 – 2 years | 2 – 3 years | > 3 years], rows [Projects in progress | Projects temporarily suspended]. contingent.subhead ∈ contingent liabilities [Claims against the company not acknowledged as debt | Guarantees excluding financial guarantees | Other money for which the company is contingently liable] or commitments [Estimated amount of contracts remaining to be executed on capital account (net of advances) | Uncalled liability on shares and other investments partly paid | Other commitments] — set group to \"contingent\" or \"commitment\" to match, or the row is totalled under contingent liabilities (or leave subhead out and the row prints as its own line under its group). Non-Corporate Entity (\"icai_nce\") and LLP (\"icai_llp\") — no ageing tables at all — trAgeing/tpAgeing/cwipAgeing are refused. contingent.subhead ∈ contingent liabilities [Claims against the entity not acknowledged as debt | Guarantees given on behalf of others | Other money for which the entity is contingently liable] or commitments [Estimated amount of contracts remaining to be executed on capital account (net of advances) | Uncalled liability on investments partly paid | Other commitments] — set group to \"contingent\" or \"commitment\" to match, or the row is totalled under contingent liabilities (or leave subhead out and the row prints as its own line under its group).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
