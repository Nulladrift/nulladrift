        {
          "name": "confirm_complete_chart",
          "title": "Confirm an upload is the entity’s whole chart",
          "description": "Record your user’s explicit confirmation that one upload is an entity’s COMPLETE CURRENT chart of accounts, so Datavrn starts treating it as evidence when checking whether future files belong to that entity. Recorded as authorised by the member you name. THIS IS A PROFESSIONAL JUDGMENT, NOT A CALCULATION. Datavrn will never make it from the numbers, and neither should you: call preview_chart_rebaseline for that upload first, read its counts to your user, and ask them plainly whether that upload is the entity’s whole book now. Confirming a file that is NOT the entity’s chart teaches Datavrn the wrong chart and weakens wrong-entity detection for that entity from then on. Send back the state_digest and confirm_token from the SAME preview_chart_rebaseline response, unchanged. Datavrn refuses and changes nothing if: the entity’s uploads moved after you were shown those figures, someone already confirmed this upload, the upload no longer needs confirming, or it is one Datavrn asked about directly — for those, answering that question is what settles it. Nothing about the landed figures changes: this affects only which uploads count as evidence of identity.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client_id": {
                "description": "The entity (client) id — from list_clients.",
                "format": "uuid",
                "type": "string"
              },
              "confirm_token": {
                "description": "The approval from preview_chart_rebaseline. Call it first and present its counts to your user.",
                "maxLength": 200,
                "minLength": 20,
                "type": "string"
              },
              "on_behalf_of": {
                "description": "The email address your user signs in to Datavrn with. This records who authorised the change alongside the connection that made it. REQUIRED on an API-key connection — ask your user for it, do not guess. On an OAuth connection leave it out: the change is recorded as authorised by the member who connected; if you do supply it, it must be that member.",
                "format": "email",
                "maxLength": 320,
                "type": "string"
              },
              "source_snapshot_id": {
                "description": "The upload’s id — the `snapshot_id` field of a list_chart_rebaselines row.",
                "format": "uuid",
                "type": "string"
              },
              "state_digest": {
                "description": "The state_digest from the same preview_chart_rebaseline response, unchanged. It pins the figures your user was shown; a different one is refused.",
                "maxLength": 200,
                "minLength": 16,
                "type": "string"
              }
            },
            "required": ["client_id", "confirm_token", "source_snapshot_id", "state_digest"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Confirm an upload is the entity’s whole chart"
