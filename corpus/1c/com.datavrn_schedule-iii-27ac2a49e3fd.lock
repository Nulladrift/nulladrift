                "description": "1-based page number (default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "description": "Rows per page (default 50, max 500 — prefer filters over big pages).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "period_id": {
                "description": "The reporting period id — from list_periods.",
                "format": "uuid",
