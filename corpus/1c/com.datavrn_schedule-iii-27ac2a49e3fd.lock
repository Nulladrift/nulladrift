        {
          "name": "create_upload_link",
          "title": "Create upload link",
          "description": "Mint a single-use, login-free upload link so a file reaches Datavrn WITHOUT passing through your context, where it cannot truncate or corrupt. Use this whenever a human has the file (a trial balance export, etc.) — and also whenever YOU hold the file and it is larger than about 10 KB. This is the RELIABLE path at that size: inlined base64 mutates often enough that the damage arrives as a plausible-looking trial balance rather than an obvious error, while the link delivers the bytes byte-perfect. Two ways to deliver the file: a HUMAN opens upload_url in their browser and chooses the file; a PROGRAMMATIC caller that already holds the file on disk POSTs it to the SEPARATE upload_post_url as a multipart form with a single `file` field (upload_url is the human page and will not accept a POST). The POST reply carries received_file_hash — compare it to your local sha256 before confirming the mapping. The link stages the file for ONE entity and expires in about 15 minutes; nothing is ingested until the column mapping is confirmed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client_id": {
                "description": "The entity (client) id — from list_clients.",
                "format": "uuid",
                "type": "string"
              },
              "file_name": {
                "description": "The file the user is expected to upload, e.g. 'tb-2026-03.xlsx' (shown on the upload page).",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "format": {
                "description": "Leave unset — the assistant handles Trial Balances only; any other format is refused (use the Datavrn web app).",
                "type": "string"
              },
              "source": {
                "description": "Set 'tally_file' when the file is a Tally xlsx export; omit otherwise.",
                "type": "string"
              }
            },
            "required": ["client_id", "file_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
