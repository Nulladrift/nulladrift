        {
          "name": "confirm_capture_review",
          "title": "Confirm a section has been reviewed",
          "description": "Record your user’s confirmation that they have REVIEWED a whole section and it is complete — the entire previous-year comparative column, or the entire disclosure set. A review confirmation is your user’s professional assertion, recorded as authorised by them. Before calling this, show them what you are confirming — the whole comparative, or the whole disclosure set — and get their explicit go-ahead. Never confirm a review that has not happened. Saving figures or text does NOT complete these two sections and never has; only this confirmation does. The confirmation is pinned to the exact set that was reviewed, so ANY later save to that section withdraws it — if a confirmation appears not to stick, the next step is to re-review and confirm again, never to retry. Confirming again after such a change supersedes the earlier confirmation: it is marked withdrawn (it stays on the record) and the response names what was withdrawn. Re-confirming also invalidates any finalise approval you already hold. Only two sections take a review confirmation: the previous-year comparative and the disclosure set. Every other section is answered by saving its rows, or by declare_capture_na. Datavrn notifies the member you name that this was recorded in their name. Generate a fresh version after your last capture change — finalisation checks the version’s frozen capture state, not today’s.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "capture_kind": {
                "enum": ["adjustments", "prior_year_values", "asset_movements", "provision_movements", "reserves_movements", "share_capital", "partner_capital", "settings", "disclosures"],
                "type": "string"
              },
              "client_id": {
                "description": "The entity (client) id — from list_clients.",
                "format": "uuid",
                "type": "string"
              },
              "note": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "on_behalf_of": {
                "description": "The email address your user signs in to Datavrn with. This records who authorised the change alongside the connection that made it. REQUIRED on an API-key connection — ask your user for it, do not guess. On an OAuth connection leave it out: the change is recorded as authorised by the member who connected; if you do supply it, it must be that member.",
                "format": "email",
                "maxLength": 320,
                "type": "string"
              },
              "period_id": {
                "format": "uuid",
                "type": "string"
              },
              "reason_code": {
                "enum": ["comparative_reviewed_complete", "disclosures_reviewed_complete"],
                "type": "string"
              },
              "template_id": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["capture_kind", "client_id", "period_id", "reason_code", "template_id"],
            "type": "object"
