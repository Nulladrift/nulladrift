        {
          "name": "list_account_mappings",
          "title": "Review account mappings",
          "description": "Review account-to-centre mapping status and deterministic suggestions for an entity. Each account carries TWO independent policies: mapping (the cost-centre policy) and profit_mapping (the profit-centre policy). Neither replaces the other. This is status-only: it returns account names, types, target names, confidence, reasons, and balance-bearing booleans, but never debit, credit, balance, or any rupee amount. Always present the rows grouped by confidence tier and target, state exact counts, flag every medium/low-confidence row, and show the completion counts: unmapped_total and unmapped_with_balance are the COST dimension (summary.scope says so), and profit_unmapped_total and profit_unmapped_with_balance are the profit dimension. Never add the two dimensions together, and never call an entity fully mapped on the cost counts alone. Do not call any count pending. Suggestions exist for the cost dimension only: suggestion_groups never describes profit work, and each row’s centre_suggestion carries dimension \"cost\" — never present it as an answer to a profit-centre question. A row carrying mapping_targets_inactive is confirmed onto a cost centre that has since been DEACTIVATED, and a row carrying profit_mapping_targets_inactive is the same fact on the profit dimension: those target ids are absent from the centres and profit_centres lists because they are no longer valid targets. Report summary.mappings_with_inactive_target (which counts an account with a dead target on EITHER dimension) alongside the completion counts and never describe such an account as settled. profit_centres_total says which zero a zero profit count is, and profit_mapped_total says what survives: when profit_centres_total is 0 the profit dimension is not in use and no account NEEDS a profit-centre policy — say that, never that the profit dimension is complete. If profit_mapped_total is also 0, no account has one either; if it is above 0 the dimension has been CLOSED and that many accounts still carry a saved policy pointing at a deactivated centre, which you must report rather than calling the entity profit-mapped.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "balance_bearing_only": {
                "description": "Return only accounts that carry a balance, without returning the balance itself.",
                "type": "boolean"
              },
              "client_id": {
                "description": "The entity (client) id — from list_clients.",
                "format": "uuid",
                "type": "string"
              },
              "name_patterns": {
                "description": "Return accounts whose code or name contains at least one of these case-insensitive patterns.",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "page": {
                "description": "1-based page number (default 1).",
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "description": "Rows per page (default 100, max 200).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "profit_unmapped_only": {
                "description": "Return only accounts that still need a PROFIT-centre policy — the rows behind profit_unmapped_total. Combine with unmapped_only to get accounts that need both.",
                "type": "boolean"
              },
              "unmapped_only": {
                "description": "Return only accounts that still need a COST-centre policy. It does not filter on the profit dimension — use profit_unmapped_only for that.",
                "type": "boolean"
              }
            },
