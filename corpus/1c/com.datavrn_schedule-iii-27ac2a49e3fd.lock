        {
          "name": "assert_previous_year_no_activity",
          "title": "Record that the previous year genuinely had no activity",
          "description": "Record your user’s assertion that the previous year genuinely had no activity, so this statement’s all-nil previous-year Profit and Loss is a fact rather than a closing-entry artefact. This clears Datavrn’s refusal to finalise it. THIS IS A PROFESSIONAL ASSERTION ABOUT A CLIENT’S ACCOUNTS, RECORDED IN THE NAMED MEMBER’S NAME AND KEPT WITH THE STATEMENT. Only send it when your user has told you, in their own words, that the previous year had no activity — a dormant entity is the case it is for. NEVER write the reason yourself and never paraphrase it into something firmer: send what they said. If they are unsure, or if the previous year DID trade and the trial balance was simply taken after closing, do not call this — the other two remedies in get_comparative_source_state are the correct ones. Call get_comparative_source_state first, read out the finding, get their explicit go-ahead, and send the confirm_token it returned. Datavrn refuses if the previous-year figures changed after you read the state, and nothing is recorded. It can be withdrawn in Datavrn if it was recorded in error; withdrawing restores the refusal.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client_id": {
                "description": "The entity (client) id — from list_clients.",
                "format": "uuid",
                "type": "string"
              },
              "confirm_token": {
                "description": "The approval from get_comparative_source_state. Call it first and present its finding to your user.",
                "maxLength": 200,
                "minLength": 20,
                "type": "string"
              },
              "on_behalf_of": {
                "description": "The email address your user signs in to Datavrn with. This records who authorised the change alongside the connection that made it. REQUIRED on an API-key connection — ask your user for it, do not guess. On an OAuth connection leave it out: the change is recorded as authorised by the member who connected; if you do supply it, it must be that member.",
                "format": "email",
                "maxLength": 320,
                "type": "string"
              },
              "period_id": {
                "description": "The reporting period id — from list_periods.",
                "format": "uuid",
                "type": "string"
              },
              "reason": {
                "description": "Your user’s own words: why the previous year had no activity. Recorded with the statement and shown to whoever reviews it.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "template_id": {
                "description": "The statement template id (e.g. 'schedule3_v1' Division I; see list_snapshots/workspace).",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["client_id", "confirm_token", "period_id", "reason", "template_id"],
            "type": "object"
          },
