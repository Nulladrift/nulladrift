                  "type": "object"
                },
                "type": "array"
              },
              "removal_count": {
                "description": "The exact removal count returned by the removal preview.",
                "minimum": 0,
                "type": "integer"
              },
              "removal_token": {
                "description": "Only include the short-lived token returned by the removal preview for this exact upload.",
