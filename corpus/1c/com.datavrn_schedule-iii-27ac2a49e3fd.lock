        {
          "name": "save_partner_capital",
          "title": "Save partner or owner capital schedule",
          "description": "Save the partner or owner capital schedule for an LLP or other non-corporate entity — Note 3a (capital account) or Note 3b (current account), one section per call. Send the COMPLETE schedule for the section you name: anyone you leave out is removed, and a renamed partner reads as one removal plus one addition. If your request would remove anyone, would change the figures of a partner who stays — including their profit-sharing ratio — or would repeat a person’s name that is not already repeated on file, this returns an approval request first and changes NOTHING; tell your user exactly what would change and get their go-ahead before resending with the approval. Two rows with the same person name are both kept: Datavrn never merges them, because two partners may genuinely share a name. A repeated name is therefore saved as a separate row each time it appears, and every one of those rows adds to that person’s balance on the note, so check with your user that there really are that many people before you send a schedule that repeats a name. Adding a partner with a new, different name needs no approval. share_pct is the profit-sharing ratio stated in the LLP or partnership agreement at the reporting date. A ratio that changed part-way through the year cannot be represented here, and a partner who joined or left mid-year cannot be dated — record the position at the reporting date and tell your user the note cannot explain a mid-year change. These figures come from the agreement; Datavrn does not verify them. Datavrn warns about ratios that do not total 100% only when at least TWO capital-account rows carry a ratio, so a partly-filled schedule gets no warning at all — check the total yourself with get_partner_capital. This is your user’s data about named people, recorded as authorised by them. After a successful save, read the section back with get_partner_capital and show your user the new closing balances — this replaces the whole section, and a schedule they cannot see afterwards is a schedule they cannot check. Generate a fresh version after your last capture change — finalisation checks the version’s frozen capture state, not today’s.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "account_kind": {
                "enum": ["capital", "current"],
                "type": "string"
              },
              "client_id": {
                "description": "The entity (client) id — from list_clients.",
                "format": "uuid",
                "type": "string"
              },
              "on_behalf_of": {
                "description": "The email address your user signs in to Datavrn with. This records who authorised the change alongside the connection that made it. REQUIRED on an API-key connection — ask your user for it, do not guess. On an OAuth connection leave it out: the change is recorded as authorised by the member who connected; if you do supply it, it must be that member.",
                "format": "email",
                "maxLength": 320,
                "type": "string"
              },
              "period_id": {
                "format": "uuid",
                "type": "string"
              },
              "removal_count": {
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "removal_token": {
                "maxLength": 200,
                "minLength": 20,
                "type": "string"
              },
              "rows": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "agreed_contribution": {
                      "anyOf": [
                        {
                          "pattern": "^\\d{1,16}(\\.\\d{1,2})?$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null
                    },
                    "interest": {
                      "$ref": "#/properties/rows/items/properties/agreed_contribution/anyOf/0",
                      "default": "0"
                    },
                    "introduced": {
                      "$ref": "#/properties/rows/items/properties/agreed_contribution/anyOf/0",
                      "default": "0"
                    },
                    "opening": {
                      "default": "0",
                      "pattern": "^-?\\d{1,16}(\\.\\d{1,2})?$",
                      "type": "string"
                    },
                    "person_name": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "remuneration": {
                      "$ref": "#/properties/rows/items/properties/agreed_contribution/anyOf/0",
                      "default": "0"
                    },
                    "share_of_pl": {
                      "$ref": "#/properties/rows/items/properties/opening",
                      "default": "0"
                    },
                    "share_pct": {
                      "anyOf": [
                        {
                          "pattern": "^\\d{1,3}(\\.\\d{1,4})?$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null
                    },
                    "withdrawals": {
                      "$ref": "#/properties/rows/items/properties/agreed_contribution/anyOf/0",
                      "default": "0"
                    }
                  },
                  "required": ["person_name"],
                  "type": "object"
                },
                "maxItems": 200,
                "type": "array"
              },
              "template_id": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["account_kind", "client_id", "period_id", "rows", "template_id"],
            "type": "object"
          },
