        {
          "name": "generate_schedule_iii",
          "title": "Generate Schedule III statements",
          "description": "Queue the Schedule III workbook build (returns a job_id to poll with get_job — the build runs as a background job). Supply a fresh request_id UUID for a new request; retain that UUID and unchanged arguments when retrying after an uncertain response. Changing an acknowledgment or other argument requires a new UUID. REFUSES when ungrouped accounts exist unless acknowledged: before acknowledging, present the ungrouped accounts to your user and obtain their explicit go-ahead; record it in acknowledge_reason and pass the exact count in acknowledge_count — an acknowledgement WITHOUT its count is always re-demanded. For a multi-month P&L window, acknowledge_multi_month_pnl is required only when the refusal reports period-activity or basis-not-captured inputs; show your user the exact reported risky-month count and confirm only the P&L figures for that subset. Declared cumulative inputs have already been normalized and must not be described as period movements. If the refusal reports invalid cumulative normalization, do not acknowledge it away: correct and re-upload the affected input. Never acknowledge anything the user has not seen. Once queued, the build usually completes in a few minutes — tell your user their statements are being prepared and poll get_job periodically; do not present the wait as a problem.",
