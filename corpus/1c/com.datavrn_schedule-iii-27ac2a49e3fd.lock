              },
              "period": {
                "description": "The period matching periodicity.",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              },
              "periodicity": {
                "description": "Period grammar: monthly YYYY-MM, quarterly FYyyyy-Qn, annual FYyyyy.",
                "enum": ["monthly", "quarterly", "annual"],
                "type": "string"
              },
              "statement": {
                "description": "Statement face (default pnl).",
                "enum": ["pnl", "balance_sheet", "cash_flow"],
                "type": "string"
              }
            },
            "required": ["group", "period", "periodicity"],
            "type": "object"
