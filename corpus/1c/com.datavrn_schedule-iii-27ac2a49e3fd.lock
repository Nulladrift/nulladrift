        {
          "name": "confirm_centre_mappings",
          "title": "Confirm cost-centre mappings",
          "description": "Persist only the explicit account-to-centre decisions the user approved. Before calling, show the proposal grouped by confidence tier and target with exact counts, call out every medium/low-confidence row, and get a clear approval for the enumerated items. Omitted accounts stay unchanged; there is no apply-all, auto-confirm, or use-suggestions flag. Each item writes ONE dimension, chosen by target_type: \"cost_centre\" writes the cost-centre policy and \"profit_centre\" writes the profit-centre policy. The two are independent — writing one never replaces the other — and the same account may appear once per dimension in a single call. A centre policy can only be set on a profit-and-loss account: an account Datavrn resolves to a balance-sheet type, or has not classified yet, is refused by name and nothing is saved. After the write, report confirmed, unmapped_total and unmapped_with_balance (the cost dimension), and profit_unmapped_total and profit_unmapped_with_balance (the profit dimension) so the user knows exactly what remains. When profit_centres_total is 0 the profit dimension is not in use and no account needs a profit-centre policy — never report the entity as profit-mapped. Read profit_mapped_total beside it: 0 means no account holds one, and above 0 means the dimension has been closed while that many accounts still carry a saved policy pointing at a deactivated centre. The counts describe the policies in force on counts_as_of. A write can be saved and still not be in force, in two ways, and next_action says which: effective_from later than counts_as_of (not in force yet), or superseded_total above 0 (that many of these accounts already carry a LATER version that is in force, so this back-dated write changes nothing visible). In either case do not repeat the call. This tool never returns rupee amounts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client_id": {
                "description": "The entity (client) id — from list_clients.",
                "format": "uuid",
                "type": "string"
              },
              "effective_from": {
                "description": "The effective date shown to the user.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "items": {
                "description": "Every account decision explicitly approved by the user; never a blanket flag.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "account_id": {
                      "format": "uuid",
                      "type": "string"
                    },
                    "centre_id": {
                      "format": "uuid",
                      "type": "string"
                    },
                    "source_of_suggestion": {
                      "anyOf": [
                        {
                          "enum": ["library", "per_client_history", "manual"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "target_type": {
                      "enum": ["cost_centre", "profit_centre"],
                      "type": "string"
                    }
                  },
                  "required": ["account_id", "centre_id"],
                  "type": "object"
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              },
              "removal_count": {
                "description": "The exact removal count returned by the removal preview.",
                "minimum": 0,
                "type": "integer"
              },
              "removal_token": {
                "description": "Only include the short-lived token returned by the removal preview for this exact proposal.",
                "maxLength": 200,
                "minLength": 20,
                "type": "string"
              }
            },
            "required": ["client_id", "effective_from", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Confirm cost-centre mappings"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
