        {
          "name": "upload_trial_balance",
          "title": "Upload trial balance",
          "description": "Stage a Trial Balance spreadsheet (xlsx or csv, max 4 MB) for an entity by INLINING its bytes as base64. This path is ONLY for programmatic callers (a script, Claude Code, an automation) that already have the raw file on disk. If a HUMAN has the file — e.g. they attached it to this chat — do NOT use this tool and do NOT base64-encode the file: call create_upload_link instead and give them the link to upload it in their browser. File size does not change this: even a small attached file goes through create_upload_link — inlining a human-supplied file is unreliable and its bytes routinely truncate. Even for a file you hold on disk, prefer create_upload_link once the file is larger than about 10 KB: base64 through a model context mutates a token often enough that the damage lands as a PLAUSIBLE trial balance, not as an obvious error. VERIFY THE HASH BEFORE YOU CONFIRM ANYTHING: this tool returns received_file_hash, the sha256 of the bytes the server actually received. Compute the sha256 of the file on your disk and compare the two. If they differ, the bytes changed in transit — do NOT call confirm_column_mapping on this session; re-send the file with create_upload_link instead. A mismatched file can still parse cleanly and still show sensible columns, so the hash is the only reliable check. Returns the upload session with detected columns and mapping SUGGESTIONS — nothing is ingested yet. Next: verify received_file_hash, then review the suggested column mapping with your user, then call confirm_column_mapping.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client_id": {
                "description": "The entity (client) id — from list_clients.",
                "format": "uuid",
                "type": "string"
              },
              "file_base64": {
                "description": "The file bytes, base64-encoded.",
                "minLength": 1,
                "type": "string"
              },
              "file_name": {
                "description": "The file's name, e.g. 'tb-2026-03.xlsx'.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "format": {
                "description": "Leave unset — the assistant handles Trial Balances only; any other format is refused (use the Datavrn web app).",
                "type": "string"
              },
              "source": {
                "description": "Set 'tally_file' when the file is a Tally xlsx export; omit otherwise.",
                "type": "string"
              }
            },
            "required": ["client_id", "file_base64", "file_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
