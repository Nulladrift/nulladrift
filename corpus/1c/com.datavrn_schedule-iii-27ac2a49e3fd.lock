              "acknowledged_state_digest": {
                "description": "Browser/REST only, and IGNORED on the agent connection exactly as acknowledge_warnings is: the destroy_state_digest returned by the confirm-mapping step, resent unchanged so the server can prove the acknowledgment was given against the data that is still there. On this connection the removal_token already pins the rows at risk, so sending this changes nothing.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "confirm_identity_correction": {
                "type": "boolean"
              },
              "confirm_merges": {
                "items": {
