        {
          "name": "close_incomplete_mis_capture",
          "title": "Close incomplete generation",
          "description": "Close one incomplete MIS generation only after your user explicitly chooses to close that run. This permanently marks an eligible incomplete generation as failed while preserving its history. The original failure cause remains unknown. Use the same original initiating account and exact original delegated credential, with current Generate and entity access. The server refuses if capture committed, the run is busy, authority changed, or a safe closeout cannot be proved. A successful response contains only the run status and committed closeout receipt. If the outcome is unconfirmed, refresh and verify this same run before generating again. Only after confirmed closeout may the user separately choose ordinary Generate; this tool never starts another generation. Recorded as authorised by the member resolved for this connection.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "on_behalf_of": {
                "description": "The email address your user signs in to Datavrn with. This records who authorised the change alongside the connection that made it. REQUIRED on an API-key connection — ask your user for it, do not guess. On an OAuth connection leave it out: the change is recorded as authorised by the member who connected; if you do supply it, it must be that member.",
                "format": "email",
                "maxLength": 320,
                "type": "string"
              },
              "run_id": {
                "description": "The exact incomplete MIS run id the user chose to close.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Close incomplete generation"
          },
          "behavior": {
            "destructive": true,
