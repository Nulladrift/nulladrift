        {
          "name": "get_allocation_account_figures",
          "title": "Read allocation account figures",
          "description": "MANAGEMENT data class. Read one explicit cost or profit partition of the current persisted allocation run at account grain. Cost-centre and profit-centre reconciliations are independent views of the same P&L activity; do not add them. Books figure plus spreading adjustment equals MIS figure, all as decimal-string rupees. Filter account names or minimum absolute MIS amount before paging. The signed page_token is source-pinned, so restart at page 1 if source_changed. known_stale and not_assessed disclose run state; neither means fresh.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "account_name_patterns": {
                "description": "Up to 10 case-insensitive account-name substrings; any match is retained.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "allocation_dimension": {
                "description": "Required partition: cost for cost-centre or step-down questions; profit for profit-centre questions. Do not add the two views.",
                "enum": ["cost", "profit"],
                "type": "string"
              },
              "client_id": {
                "description": "The entity (client) id — from list_clients.",
                "format": "uuid",
                "type": "string"
              },
              "min_abs_mis": {
                "description": "Minimum absolute MIS figure in rupees as a decimal string, e.g. '100000'.",
                "pattern": "^\\d{1,16}(\\.\\d{1,2})?$",
                "type": "string"
              },
              "page_size": {
                "description": "Rows per source-pinned page (default 50, max 200).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "page_token": {
                "description": "Signed continuation from the prior page; restart without it if source_changed.",
                "maxLength": 4096,
                "minLength": 1,
                "type": "string"
              },
              "period": {
                "description": "Management month in YYYY-MM.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "required": ["allocation_dimension", "client_id", "period"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read allocation account figures"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
