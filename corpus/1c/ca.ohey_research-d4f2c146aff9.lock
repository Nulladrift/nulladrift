          },
          "digest": "sha256:c1071987576461239d2686807f0bbadc69b9dfeef0895857a90f7bd4c9a21d1d"
        },
        {
          "name": "get_feed_stats",
          "title": "Get feed statistics",
          "description": "The size of the Ohey feed and the last seven full UTC days of changes to it, ending the day before asOf. hosts: hosts in the feed now. denied: hosts confirmed as legitimate services and kept out. week.added (and daily): hosts that entered the feed. week.entered: website tips that reached review. week.accepted: of those, the ones accepted into the feed. week.removed: tips an analyst rejected at review. added counts every host that entered the feed that week, whenever and however it was submitted, so it can exceed accepted. archive counts are all-time totals. entered need not equal accepted plus removed: the rest were denied, are still in review, or were decided after the week. week.denied: hosts confirmed legitimate that week. week.delisted: hosts that had been in the feed and moved to the delisted feed that week. archive: the scanner's captures, the responses in them, host IP observations, response bodies judged malicious or clean, and feed status changes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get feed statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9e989024dcf6b4c9f30f9b128c87a8c91c8afb212503449dddf024f1484a50c1"
        },
        {
          "name": "get_threat",
          "title": "Get a technique or kit",
          "description": "A technique or kit page's statistics: sites matched by month, how many sites were still infected when rescanned, WordPress and Joomla shares, common plugins and core versions, kits seen together on the same sites, its EtherHiding contracts, the hosts its ClickFix commands fetch from (the 20 on the most sites) and the articles about it. stats count sites Ohey matched since recordsBegin; an article counts what its own investigation found, often hosts across a whole incident, so the two need not agree. In months, sites counts a site in every month it matched and newSites only in its first, so newSites sums to sites; the month of asOf is still in progress. Kits overlap on the same sites, so kit counts do not add up to the technique, and kits lists kits on more than one of its sites, not only those with contracts or commands. A kit's counts in that list are for the whole kit across every technique it uses; its threat field names the technique its own page sits under. captured is sites with a successful capture since capturesBegin; wordpress, joomla, wpCore and plugins count among those, so divide by captured for a share. An article's dates can start before recordsBegin. persistence.rechecked is sites captured again at least 25 days after their first match and persistence.still is how many of those still matched, so 0 and 0 means none has been rechecked yet, not that none is infected. persistence counts rechecks from before capturesBegin too, so rechecked can exceed captured. For the clickfix and etherhiding techniques, the 20 busiest command hosts or the 20 newest contracts with the totals; the search tools page through the rest.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "A slug from list_threats, such as clickfix, etherhiding or socgholish.",
                "pattern": "^[a-z0-9-]{1,60}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a technique or kit"
          },
          "behavior": {
            "destructive": false,
