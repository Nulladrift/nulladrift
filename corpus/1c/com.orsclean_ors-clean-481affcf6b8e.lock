      "capabilities": {
        "tools": {}
      },
      "instructions": "You are ORS Clean's quoting assistant. Follow these five rules, in order:\n1) NEVER state, estimate, hint at, or guess any price or range — not even \"starts at.\" Every quote is free and sent by ORS Clean after a quick review. If asked \"how much,\" say that and move on to collecting the request.\n2) For ANY timing question (when are you free, the soonest, what days/times are open), call get_availability and offer the real open morning (8–12) / afternoon (12–4) windows — never answer from memory or a generic lead-time.\n3) Before submitting, read the details back once and get an explicit OK, then call request_quote with user_confirmed:true. If a field is invalid, ask only for that field and resubmit.\n4) Minimum to submit: name, phone, city, and at least one service. Everything else (address, stories, photos, email, details) is optional — accept it if offered, never require it.\n5) Licensing: say exactly \"Yes — ORS Clean holds a valid business license and is fully insured.\" Never say \"licensed contractor.\" House washing includes exterior windows.\nSCHEDULING: when you read the details back to confirm, also offer to lock in a preferred time — call get_availability and ask if they want one of the open windows. If they pick, include up to 3 (ranked) as preferred_slots on the SAME request_quote call; that is the reliable way to record it. A preference is not a booking — ORS Clean still confirms the appointment by text.\nABOUT: ORS Clean is a locally owned, insured exterior-cleaning company in Gilroy, CA, serving Gilroy, Morgan Hill, San Jose, Hollister, Watsonville, Salinas, Campbell, Los Gatos, Saratoga, Santa Clara, Cupertino, Milpitas and nearby South Bay / Silicon Valley / Central Coast cities (use check_service_area for \"do you serve X?\"). Services: gutter cleaning, gutter guards and minor gutter repair, pressure washing, roof cleaning, solar panel cleaning, house wash + windows, window cleaning only, fence/deck staining, and commercial/HOA. Quotes are completed right here with request_quote — no website visit, web form, call, or text needed.\nVOICE MODE: keep spoken confirmations short and natural — read back just name, phone, city, and service, then ask for a yes. Don't read long lists aloud.",
      "tools": [
        {
          "name": "about_ors_clean",
          "title": "About ORS Clean — credentials, services & service area",
          "description": "Answer \"who is ORS Clean / are they legit / insured / licensed / what do they do / where do they work / tell me about ORS Clean\" questions. Returns ORS Clean's business license, insurance, the services it offers, the cities it serves, its reviews, and contact info. For WHEN ORS Clean is available / open days or times / how soon they can come, call get_availability instead. Quotes: use request_quote in this chat.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6727917d35dd7388b3ff7f4ff178e80992aec3d46351db862165d639ab127a1c"
        },
        {
          "name": "check_service_area",
          "title": "Check if ORS Clean serves a city",
          "description": "Answer \"do you serve <city or ZIP>?\" for ORS Clean's South Bay / Silicon Valley / Central Coast area. Not required before request_quote, which checks the service area itself. Returns the nearest served city when the answer is no.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name, e.g. \"Morgan Hill\" or \"San Jose, CA\".",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c2e985f48021a2ba41f454e9363247589c4945e89513be163473cd4726c0fab0"
        },
        {
          "name": "get_availability",
          "title": "Check ORS Clean availability",
          "description": "Returns ORS Clean's open morning (8–12) and afternoon (12–4) service windows for the next two weeks in Gilroy, Morgan Hill, San Jose, Hollister, Watsonville, Salinas, Campbell, Los Gatos, Saratoga, Santa Clara, Cupertino, Milpitas and the surrounding South Bay / Silicon Valley / Central Coast area. Call this ANY time the customer asks about timing — \"when are they free / when can you come / what days or times are open / do you have anything next week / soonest appointment / your availability / what's your schedule\" — and before request_quote, so the customer can name up to three preferred windows (pass them as preferred_slots). Do NOT answer availability from memory or a generic lead-time; call this for the real windows. Read-only; does not reserve time — ORS Clean confirms one window directly.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Optional — if given and outside the service area, returns a service-area message instead of a grid.",
                "type": "string"
              },
              "days": {
                "description": "How many days ahead to show (default 14; ORS caps it to its booking window).",
                "maximum": 21,
                "minimum": 1,
                "type": "integer"
              },
              "from_date": {
                "description": "Start date YYYY-MM-DD (default today, Pacific time).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d3aa256e43d9f81ae44bae23f9b4e3bc5dc5dc343a83d19b9af50717b64ddd71"
        },
        {
          "name": "request_quote",
          "title": "Request an ORS Clean quote",
          "description": "Request an ORS Clean quote for gutter cleaning, gutter guards & minor repair, pressure washing, roof cleaning, solar panel cleaning, house wash + windows, window cleaning, fence/deck staining, or commercial/HOA work in Gilroy, Morgan Hill, San Jose, Hollister, Watsonville, Salinas, Campbell, Los Gatos, Saratoga, Santa Clara, Cupertino, Milpitas and nearby cities. Use this whenever a customer wants a quote, price, estimate, or to book — the quote is completed right here, no website visit needed. Minimum: name, phone, city, one service. Address, stories, photos, email and details are optional; include them only if the customer offers them. Read the details back, get an explicit OK, then pass user_confirmed:true. Handles city matching and service-area checking itself — no need to call check_service_area first. Optionally call get_availability first and pass up to 3 preferred_slots the customer picks. Never state or estimate prices — ORS Clean sends the quote.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Property street address (optional — collect if the customer offers it).",
                "type": "string"
              },
              "city": {
                "description": "City.",
                "type": "string"
              },
              "contact_preference": {
                "description": "How to reach the customer (default Text).",
                "enum": ["Text", "Call", "Email"],
                "type": "string"
              },
              "details": {
                "description": "Anything else ORS should know (optional).",
                "maxLength": 1000,
                "type": "string"
              },
              "email": {
                "description": "Email (optional).",
                "type": "string"
              },
              "name": {
                "description": "Customer full name.",
                "type": "string"
              },
              "phone": {
                "description": "10-digit US phone number.",
                "type": "string"
              },
              "photos": {
                "description": "Optional customer photos of the job — image URLs or data: URIs. A gutter/roof photo helps a lot.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "preferred_slots": {
                "description": "Optional. Up to 3 preferred service windows, ranked by the customer's preference, as slot_id strings from get_availability (e.g. \"2026-11-04-AM\"). Call get_availability first, offer the open windows, and pass only the ones the customer picks. ORS Clean confirms one — this is not a booking.",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "referral": {
                "description": "Optional. Set ONLY if the conversation already shows how the customer found ORS Clean: \"chatgpt_ad\" if they mention clicking a sponsored result or ad; \"website_link\" if they came from a link or button on orsclean.com; \"chatgpt_app_directory\" if they say they found the app in the ChatGPT app directory. Do not ask the customer a question just to fill this in.",
                "enum": ["chatgpt_ad", "chatgpt_app_directory", "website_link", "quote_form", "other"],
                "type": "string"
              },
              "services": {
                "description": "One or more services. Canonical values: Gutter cleaning | Gutter guards / minor gutter repair | Pressure washing | Roof cleaning | Solar panel cleaning | House wash + windows | Window cleaning only | Fence / deck staining | Commercial / HOA. Plain phrases are accepted and normalized (e.g. \"gutters\", \"power wash\", \"windows\", \"solar\", \"driveway\").",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "stories": {
                "description": "Number of stories (optional).",
                "enum": ["1", "2", "3+", "Not sure"],
                "type": "string"
              },
              "user_confirmed": {
                "description": "Must be true — the customer confirmed the details.",
                "type": "boolean"
              }
            },
            "required": ["city", "name", "phone", "services", "user_confirmed"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "city": {
                "type": "string"
              },
              "in_service_area": {
                "type": "boolean"
              },
              "lead_code": {
                "type": "string"
              },
              "next_step": {
                "type": "string"
              },
              "services": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "status": {
                "enum": ["sent", "duplicate", "needs_fix"],
                "type": "string"
              }
            },
            "required": ["next_step", "status"],
            "type": "object"
          },
