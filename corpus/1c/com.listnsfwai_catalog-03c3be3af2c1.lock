        },
        {
          "name": "search_places",
          "title": "Search places that list NSFW AI apps",
          "description": "Find directories, review sites, list sites, AI directories, launch sites, press and networks that take NSFW AI apps, filtered by kind, kind of app, price, link type, verdict or a text query. Returns name, domain, kind, verdict, price, link, review terms, submit URL and the page to cite.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accepts": {
                "description": "Verdict; default: yes and clean_only",
                "enum": ["yes", "clean_only", "no"],
                "type": "string"
              },
              "focus": {
                "description": "Only places built for this kind of app, plus the general ones",
                "enum": ["companions", "chat", "generators"],
                "type": "string"
              },
              "kind": {
                "description": "nsfw_directory | review_site | adult_list | ai_directory | launch | press | network",
                "enum": ["nsfw_directory", "review_site", "adult_list", "ai_directory", "launch", "press", "network"],
                "type": "string"
              },
              "limit": {
                "description": "Default 25",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "link": {
                "enum": ["dofollow", "nofollow", "sponsored"],
                "type": "string"
              },
              "price": {
                "description": "free: a free way in; paid: sells a listing or a spot",
                "enum": ["free", "paid"],
                "type": "string"
              },
              "query": {
                "description": "Matches name, domain or notes",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2710e881ab1a742e2f5251c9ce62e03151b8ab8e4c89108c4059431356a2c524"
        },
        {
          "name": "where_is_app_listed",
          "title": "Where an app is already listed",
          "description": "Which of the tracked places list a given app domain (a link to it, or a page of its own such as /tools/erolove), from the site's nightly read of every place: the same answer as the site's free check. Returns the count and up to 10 places with the page where it was seen, plus the link to the full answer. Pro on the site watches it every night.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "The app's domain, e.g. candy.ai",
                "maxLength": 120,
                "type": "string"
              }
