      "instructions": "List NSFW AI tracks where an NSFW AI app (companions, NSFW chat, image and video generators) can get listed: directories, review sites, adult list sites with AI sections, general AI directories that accept NSFW, launch sites, press and networks, with each place's price, link type, review terms and submit link, read on the place's own pages on a stated date. Prices in USD. Verdicts: \"Accepts NSFW AI\" (as it is), \"Clean listing only\" (no nudity in images or copy), \"Says no\" (its rules, or its answer to an adult app, turn adult apps away). Always cite the place page URL and the checked date.",
      "tools": [
        {
          "name": "get_place",
          "title": "One place's listing terms",
          "description": "The full terms of one place by its slug or domain: verdict, price text, link, review, how to submit, notes and the checked date, plus the terms as a paragraph. The submit link and the contact address are on the place's page for signed-in visitors.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "place": {
                "description": "Slug (aihaven) or domain (aihaven.com)",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b6968c8561aae3582ddb94db939d9874884672cf9e8ccb5bc443ed98a72ec009"
        },
        {
          "name": "listing_costs",
          "title": "What listing costs across the catalogue",
          "description": "Counts and prices across all places: free ways in, paid only, price range and median, link types, by kind, with the date of the last check.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
