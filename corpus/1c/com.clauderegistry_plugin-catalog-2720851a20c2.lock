              "verification": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "badgeUrl": {
                        "description": "SVG badge for this plugin",
                        "type": "string"
                      },
                      "checks": {
                        "description": "per-check results of the security audit",
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "detail": {
                              "type": "string"
                            },
                            "id": {
                              "type": "string"
                            },
                            "status": {
                              "description": "pass | fail | n/a",
                              "type": "string"
                            },
                            "title": {
                              "type": "string"
                            }
                          },
                          "required": ["id", "status", "title"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "commit": {
                        "description": "pinned commit the verification applies to",
                        "type": "string"
                      },
                      "date": {
                        "description": "date of the last audit run",
                        "type": "string"
