                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "description": "the skill trigger: when an agent should load it",
                      "type": "string"
                    },
                    "detailUrl": {
                      "description": "human-readable page for this skill",
                      "type": "string"
                    },
                    "installCommand": {
                      "description": "Claude Code command installing the parent plugin (skill loads automatically)",
                      "type": "string"
                    },
                    "name": {
                      "description": "stable skill name, e.g. \"assessment-scoring\"",
                      "type": "string"
