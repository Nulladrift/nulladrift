        {
          "name": "get_skill",
          "title": "Get a verified skill (with portable source)",
          "description": "Get one Sigistry skill by name, including the full raw SKILL.md source. The source is portable: it can be applied directly in any SKILL.md-aware agent (Claude Code, Claude Desktop, and others) without installing anything, or installed natively in Claude Code via the parent plugin, which keeps it verified and updated. The returned skill passed the Sigistry skill-safety check at the parent plugin's verification date.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "the skill name, e.g. \"assessment-scoring\" (find names via search_skills)",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "commit": {
                "description": "pinned commit the source is served from, when externally hosted",
                "type": "string"
              },
              "description": {
                "description": "the skill trigger: when an agent should load it",
                "type": "string"
              },
              "detailUrl": {
                "description": "human-readable page for this skill",
                "type": "string"
              },
              "hosting": {
                "description": "\"registry\" (vendored here) or \"external\" (author repo, verified at a pinned commit)",
                "type": "string"
              },
              "installCommand": {
                "description": "Claude Code command installing the parent plugin (skill loads automatically)",
                "type": "string"
              },
              "name": {
                "description": "stable skill name, e.g. \"assessment-scoring\"",
                "type": "string"
              },
              "plugin": {
                "description": "parent plugin id that ships this skill",
                "type": "string"
              },
              "pluginCategory": {
                "description": "category of the parent plugin",
                "type": ["string", "null"]
              },
              "repo": {
                "description": "author repo (owner/name), when externally hosted",
                "type": "string"
              },
              "source": {
                "description": "the complete raw SKILL.md (frontmatter + body); null only if the fetch failed",
                "type": ["string", "null"]
              },
              "sourceUrl": {
                "description": "GitHub location of the skill directory",
                "type": "string"
              },
              "verification": {
                "description": "verification status of the parent plugin; prefer \"verified\"",
                "type": "string"
              },
              "verifiedDate": {
                "description": "date of the verification run covering this skill",
                "type": ["string", "null"]
              }
            },
            "required": ["description", "detailUrl", "hosting", "installCommand", "name", "plugin", "pluginCategory", "source", "sourceUrl", "verification", "verifiedDate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a verified skill"
          },
