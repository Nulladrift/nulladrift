                      "repo": {
                        "description": "external repo (owner/name), when externally hosted",
                        "type": "string"
                      },
                      "status": {
                        "description": "verified | listed | stale | failed",
                        "type": "string"
                      }
                    },
                    "required": ["checks", "status"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "security-audit result for this plugin (null when never audited)"
              },
              "version": {
                "type": "string"
              }
            },
            "required": ["agents", "commands", "counts", "id", "installCommand", "installMarketplace", "name", "searchableText", "skills", "tags"],
            "type": "object"
