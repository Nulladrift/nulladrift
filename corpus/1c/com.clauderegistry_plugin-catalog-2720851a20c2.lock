        {
          "name": "check_mcp_app",
          "title": "Check an MCP App for safety and spec conformance (runs locally)",
          "description": "Get the Sigistry MCP App safety criteria to audit an MCP App (MCP Apps / SEP-1865: a tool that returns an interactive ui:// HTML resource the host renders in a sandboxed iframe) BEFORE shipping it. Returns two groups of checks: spec conformance (ui:// scheme, the text/html;profile=mcp-app mimeType, tool-to-UI linkage via _meta.ui.resourceUri, a text fallback, visibility values, and CSP coverage of external origins) and security hygiene the iframe sandbox does not cover (unsafe DOM sinks, embedded secrets, host-message origin handling, remote scripts). Call this when the user is building or reviewing an MCP App; then apply each check to the app source you have in context and report findings. Nothing is sent to this server; an interactive browser version is at https://sigistry.com/mcp-app-checker.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checkerUrl": {
                "description": "interactive in-browser checker",
                "type": "string"
              },
              "checks": {
                "description": "the checks to apply to the MCP App",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "group": {
                      "description": "\"spec-conformance\" or \"security-hygiene\"",
                      "type": "string"
                    },
                    "howToCheck": {
                      "description": "what to inspect in the app source",
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "what": {
                      "description": "the requirement",
                      "type": "string"
                    }
                  },
                  "required": ["group", "howToCheck", "id", "title", "what"],
                  "type": "object"
                },
                "type": "array"
              },
              "hubUrl": {
                "description": "human-readable MCP Apps hub",
                "type": "string"
              },
              "interpreting": {
                "type": "string"
              },
              "nextSteps": {
                "type": "string"
              },
              "rubricVersion": {
                "type": "string"
              },
              "runsWhere": {
                "description": "always \"local\": the agent applies the criteria in context; no app code reaches this server",
                "type": "string"
              },
              "specUrl": {
                "description": "the MCP Apps (SEP-1865) specification",
                "type": "string"
              },
              "steps": {
                "description": "what the agent should do, in order",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["checkerUrl", "checks", "hubUrl", "interpreting", "nextSteps", "rubricVersion", "runsWhere", "specUrl", "steps"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an MCP App for safety"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2e3fa476314b17511572b47e4e61b6181bba04f7205004ff2dd4fe488f691d89"
        },
        {
          "name": "get_plugin",
          "title": "Get a Claude Code plugin",
          "description": "Get the full details of a single Sigistry plugin by its id, including install commands, component counts, and its security-audit result (per-check pass/fail from the Verified by Sigistry methodology).",
