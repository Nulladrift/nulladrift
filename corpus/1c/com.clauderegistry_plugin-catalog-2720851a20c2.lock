                "properties": {
                  "agents": {
                    "type": "integer"
                  },
                  "commands": {
                    "type": "integer"
                  },
                  "skills": {
                    "type": "integer"
                  }
                },
                "required": ["agents", "commands", "skills"],
                "type": "object"
              },
              "description": {
                "type": "string"
              },
              "homepage": {
                "type": "string"
              },
              "id": {
                "type": "string"
