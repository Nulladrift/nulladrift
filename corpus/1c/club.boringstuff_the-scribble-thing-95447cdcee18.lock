{
  "lockfileVersion": 2,
  "subjects": {
    "club.boringstuff/the-scribble-thing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scribble.boringstuff.club/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "the-scribble-thing",
        "title": "The Scribble Thing",
        "version": "1.0.0",
        "description": "Turn PNG or JPEG line art into prompt-directed scribe animations.",
        "websiteUrl": "https://scribble.boringstuff.club"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Call get_scribble_service_info before the first creation. Obtain explicit terms and retention acceptance, create one animation, poll every 3-5 seconds, and return the private management URL with the completed preview.",
      "tools": [
        {
          "name": "create_scribe_animation",
          "description": "Create an asynchronous animation from a base64-encoded line-art image.",
          "inputSchema": {
            "properties": {
              "accept_retention": {
                "title": "Accept Retention",
                "type": "boolean"
              },
              "accept_terms": {
                "title": "Accept Terms",
                "type": "boolean"
              },
              "accepted_terms_version": {
                "maxLength": 40,
                "minLength": 1,
                "title": "Accepted Terms Version",
                "type": "string"
              },
              "idempotency_key": {
                "maxLength": 200,
                "minLength": 8,
                "title": "Idempotency Key",
                "type": "string"
              },
              "image_base64": {
                "description": "Raw base64 PNG or JPEG bytes; do not include a data-URL prefix.",
                "maxLength": 14000000,
                "minLength": 4,
                "title": "Image Base64",
                "type": "string"
              },
              "image_mime_type": {
                "enum": ["image/png", "image/jpeg"],
                "title": "Image Mime Type",
                "type": "string"
              },
              "installation_id": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "minLength": 8,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Installation Id"
              },
              "order_text": {
                "default": "",
                "maxLength": 2000,
                "title": "Order Text",
                "type": "string"
              },
              "show_hand": {
                "default": false,
                "title": "Show Hand",
                "type": "boolean"
              },
              "speed": {
                "default": "normal",
                "enum": ["slow", "normal", "fast"],
                "title": "Speed",
                "type": "string"
              }
            },
            "required": ["accept_retention", "accept_terms", "accepted_terms_version", "idempotency_key", "image_base64", "image_mime_type"],
            "title": "create_scribe_animationArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "AgentUnlockDetails": {
                "properties": {
                  "endpoint": {
                    "title": "Endpoint",
                    "type": "string"
                  },
                  "instructions": {
                    "title": "Instructions",
                    "type": "string"
                  },
                  "purchase_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "Purchase Url"
                  },
                  "state": {
                    "enum": ["watermarked", "unlocked"],
                    "title": "State",
                    "type": "string"
                  }
