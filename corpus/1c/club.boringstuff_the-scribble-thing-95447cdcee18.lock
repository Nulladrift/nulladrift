                "title": "Expires At",
                "type": "string"
              },
              "idempotent_replay": {
                "title": "Idempotent Replay",
                "type": "boolean"
              },
              "manage_url": {
                "description": "Private browser handoff URL for user review and unlock.",
                "title": "Manage Url",
                "type": "string"
              },
              "preview_download_available": {
                "title": "Preview Download Available",
                "type": "boolean"
              },
              "preview_url": {
                "title": "Preview Url",
                "type": "string"
              },
              "progress": {
                "description": "Approximate percent complete.",
