        {
          "name": "create_composition",
          "title": "Create composition",
          "description": "Creates a new composition from TSX source and opens it as a tab in the user's Motion page. `files` maps path to source and must include the entry (default composition.tsx). The API is specific to Motion and documented in read_skill {topic:'motion'}; design guidance is in {topic:'motion-craft'}. A partsBoard prop (default false) can lay out UI-like parts for checking before scenes are built.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "durationInFrames": {
                "type": "number"
              },
              "entry": {
                "description": "Defaults to composition.tsx.",
                "type": "string"
              },
              "files": {
                "additionalProperties": {
                  "type": "string"
                },
                "type": "object"
              },
              "fps": {
                "type": "number"
              },
              "height": {
                "type": "number"
              },
              "name": {
                "type": "string"
              },
              "schema": {
                "description": "Props schema; drives the editable controls.",
                "type": "object"
              },
              "token": {
                "description": "The session token that connect returned.",
                "type": "string"
              },
              "width": {
                "type": "number"
              }
