        {
          "name": "tell_user",
          "title": "Show a status line",
          "description": "Shows one short status sentence in the user's Motion tab while work is in progress, so they can tell progress from a stall. kind 'done' marks the job finished and 'problem' marks a blocker; step and of draw a progress bar. Changes nothing else. How it fits the workflow: read_skill {topic:'motion-workflow'}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Omit while working. 'done' ends the job, 'problem' flags a blocker.",
                "enum": ["working", "done", "problem"],
                "type": "string"
              },
              "of": {
                "description": "How many there are in total, e.g. 5 — draws a progress bar. Send both or neither, and only when you genuinely know the total; a bar that goes backwards is worse than none.",
                "type": "number"
              },
              "step": {
                "description": "Which one you are on, e.g. 2.",
                "type": "number"
              },
              "text": {
                "description": "One friendly sentence, first person. Not a log line.",
                "type": "string"
              },
              "token": {
                "description": "The session token that connect returned.",
                "type": "string"
              }
            },
            "required": ["text", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Show a status line"
