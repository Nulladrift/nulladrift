      "instructions": "Motion renders animated motion graphics from TSX code written by the agent; the user's browser tab renders it, and no generative image or video model is involved. To start, call connect with the eight-character pairing code shown on the Motion page, or create_session when the user has no tab open; both return the session token the other tools take. The composition API is specific to Motion and documented in read_skill {topic:\"motion\"}; the other guides cover craft, typography, effects, transitions, examples, working while the user watches (motion-workflow) and structured review (motion-review). The user watches the tab while a piece is built; tell_user shows them a status line.",
      "tools": [
        {
          "name": "check_playback",
          "title": "Check playback",
          "description": "Plays a composition on the user's stage from the first frame to the last, through the same preview a person watches (which inspect_composition does not use), and reports whether it got to the end. Buffering is allowed; any error ends the run. Answers within about 20 s: {status:\"running\", at, total} means call again with the same id to keep waiting on the same run. Then {status:\"done\", verdict:\"ok\"|\"problems\", problems, warnings} or {status:\"incomplete\", reason} (tab hidden, interrupted, edited). It takes over the stage while it runs: the composition under test becomes the one on screen and the preview plays from frame 0. The composition's source and props are not changed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Omit for the active one.",
                "type": "string"
              },
              "token": {
                "description": "The session token that connect returned.",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Check playback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
