{
  "lockfileVersion": 2,
  "subjects": {
    "app.iomarkets/topup": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://iomarkets.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "iomarkets-topup",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "buy",
          "description": "Demo only: payments are switched off, so this answers with an error and nothing can be bought. Get the x402 payment challenge for a quote. This hosted server holds no wallet, so it does NOT spend your money: it returns the exact amount, asset, payTo address and facilitator for you to pay from your own Algorand wallet, then you POST the quote again with your payment signature. Requires prior human confirmation of the quote. Works the same for a quote from quote_vouchers; the paid response is the batch (batchId and claim links) rather than an order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "quoteId": {
                "description": "the quoteId returned by quote or quote_vouchers, after the human confirmed it",
                "type": "string"
              }
            },
            "required": ["quoteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:78fb5f612993245acd5e9b38a10799d75334d8ede42f21b719de2a916e5a3b72"
        },
        {
          "name": "create_pay_link",
          "description": "Demo only: payments are switched off, so this answers with an error and nothing can be bought. Create a checkout link a HUMAN pays from their own Algorand wallet (Pera). Use this when you have no wallet, or when the person should approve and pay themselves: they open the link, see the exact price, sign in their wallet, and the result (the eSIM QR code, or the top-up confirmation) appears on the page. You never hold a key. A top-up link can be paid by anyone — send it to family as 'top up my phone'. An eSIM link delivers to whoever pays. Free. Add `ref` (your Algorand address) to earn a share of margin on each delivered order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "for range top-up offers: amount in local currency",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "max_uses": {
                "description": "0 = reusable until expiry; default 1 for topup, 0 for esim",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "note": {
                "description": "shown on the link page, e.g. 'Your Tokyo trip data'",
                "maxLength": 140,
                "type": "string"
              },
              "offerId": {
                "description": "the offer's offerId from list_offers or lookup_phone, e.g. ea-JC063",
                "type": "string"
              },
              "phone": {
                "description": "topup only: recipient phone, E.164",
                "type": "string"
              },
              "ref": {
                "description": "your Algorand address, to earn referral share",
                "type": "string"
              },
              "ttl_hours": {
                "description": "default 168 (7 days)",
                "maximum": 720,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "the offer's type, as list_offers returned it",
                "enum": ["topup", "esim"],
                "type": "string"
              }
            },
            "required": ["offerId", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c24f0402bf2717c2bb8b36baca0334245e9d0d4104b182d7e95aec97ba25b31a"
        },
        {
          "name": "fx",
          "description": "Indicative USDC → local-currency rate at our sale price, with an estimate for an amount. The quote is the binding price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "an amount in the local currency `to`, to estimate its USDC price, e.g. 5000",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "to": {
                "description": "ISO-4217, e.g. INR",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "type": {
                "description": "what the rate is for; default payout",
                "enum": ["topup", "bill", "payout"],
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a322e0a910527d563f69ccfd38c44a08e986dcb95c1ec4c656442c2883012153"
        },
        {
          "name": "ledger",
          "description": "Public delivery ledger: totals, delivered-or-refunded %, volume, countries, recent orders.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e3392e1e7466ec6937cf4708780ea19dd163dacec75679b6afced41285194d0e"
        },
        {
          "name": "list_offers",
          "description": "Browse purchasable offers: mobile top-ups, travel eSIMs, prepaid bills, or international payment corridors (bank / mobile money / UPI) for a country. Free. Prices shown are indicative; the quote fixes them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "description": "operator or provider brand to filter by, as list_offers returns it in `brand`",
                "type": "string"
              },
              "country": {
                "description": "ISO-3166 alpha-2, e.g. IN",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "page size, default 100; 0 means all",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "offset": {
                "description": "use next_offset from the previous page",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "type": {
                "description": "payout = international payment (bank / mobile money / UPI)",
                "enum": ["topup", "esim", "bill", "payout"],
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f56369499fadbad2db44666c3e0fd26a87c87028e737ea0321412b64107f1158"
        },
        {
          "name": "lookup_phone",
          "description": "Identify the country and mobile operator of a phone number and list the top-up offers available for it. Free. The operator is DETECTED from the number range and is a guess: MVNOs (Tesco Mobile, Giff Gaff, Lebara, Voxi, Sky…) resolve to the host network they ride on. Read the detected brand back to the human and have them confirm it before buying, and use `other_brands` to correct it — a voucher bought for the wrong network delivers successfully and cannot be redeemed or refunded.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "phone": {
                "description": "E.164, e.g. +919876543210",
                "type": "string"
              }
            },
            "required": ["phone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c8eb2c9bae584ebbe1ee9d22fc22551e6570cd51d92ddd0c54f2de110e10aa92"
        },
        {
          "name": "order_status",
          "description": "Check an order. Poll every ~3 s until `terminal` is true: delivered (confirmation + signed receipt), refunded (refund txid + signed receipt) or refund_failed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "orderId": {
                "description": "the orderId returned by buy",
                "type": "string"
              }
            },
            "required": ["orderId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e2a198350341e64bc2ac4785825fd658aa3a817af34e6e785a85342d0b9c9a02"
        },
        {
          "name": "quote",
          "description": "Demo only: payments are switched off, so this answers with an error and nothing can be bought. Lock a price (10 minutes) for one purchase. Returns quoteId, exact USDC price and what will be delivered. Free. ALWAYS show the human the price and the recipient before buying.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "for range offers: amount in the recipient's local currency",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "fields": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "bill-pay / payout recipient fields the offer lists in requiredFields (account_number, bank_code, full_name, vpa, iban…)",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "iccid": {
                "description": "existing eSIM to top up (optional)",
                "type": "string"
              },
              "offerId": {
                "description": "the offer's offerId from list_offers or lookup_phone, e.g. ea-JC063",
                "type": "string"
              },
              "payer": {
                "description": "the Algorand address you will pay from (required for payout compliance when this server holds no wallet)",
                "type": "string"
              },
              "phone": {
                "description": "recipient phone for topup/bill (E.164)",
                "type": "string"
              },
              "ref": {
                "description": "referrer's Algorand address — earns a share of margin if the order is delivered (GET /v1/referrals)",
                "type": "string"
              },
              "sender": {
                "description": "payouts only: the principal (legal name + country); reference = partner KYC id, required above $100/day",
                "properties": {
                  "country": {
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "reference": {
                    "type": "string"
                  }
                },
                "required": ["country", "name"],
                "type": "object"
              },
              "type": {
                "description": "the offer's type, as list_offers returned it",
                "enum": ["topup", "esim", "bill", "payout"],
                "type": "string"
              }
            },
            "required": ["offerId", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10149d88e6fdf56614f821c6ac9e1bc85987933cdbe8b8d7f10fbd5068103841"
        },
        {
          "name": "quote_vouchers",
          "description": "Demo only: payments are switched off, so this answers with an error and nothing can be bought. Lock a price (10 minutes) for a BATCH of travel eSIMs paid in one payment: N claim links, one per person, for a group trip, a conference delegation or event giveaways. Each eSIM is bought when its link is claimed (the person opens it on their phone and installs the QR), and links nobody claims within 30 days are refunded to the paying wallet. Free. Pay the returned quoteId with `buy`, or send the human to this service's /pay/?mode=vouchers page to buy it with their own wallet. Limits: 2–50 eSIMs, each within the per-order limit, the batch within its own limit ($100 by default). ALWAYS show the human the total and the count before buying.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "count": {
                "description": "how many eSIMs, i.e. claim links",
                "maximum": 50,
                "minimum": 2,
                "type": "integer"
              },
              "note": {
                "description": "shown on every claim page, e.g. 'Devcon 8 delegation'",
                "maxLength": 140,
                "type": "string"
              },
              "offerId": {
                "description": "an esim offer from list_offers type=esim",
                "type": "string"
              },
              "payer": {
                "description": "the Algorand address you will pay from",
                "type": "string"
              }
            },
            "required": ["count", "offerId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:82e6402db90719ed7390c27932a32da386beda64d57ee344fe5a32946abddaae"
        },
        {
          "name": "verify_receipt",
          "description": "Verify an ed25519-signed receipt: the signature, and — unless you pass onChain:false — both txids against an Algorand indexer. Give it an orderId to check one of this service's own orders, or a receipt object to check ANY receipt in this format, including one issued by another server.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "onChain": {
                "description": "confirm the txids on chain; default true",
                "type": "boolean"
              },
              "orderId": {
                "description": "an order on this service",
                "type": "string"
              },
              "receipt": {
                "additionalProperties": {},
                "description": "a receipt {payload, signature}, or an order response containing one",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c01c2218dd656ddc0ff8ab8e29b44f5e189ed6d13a8a5c84f10196680677f2a4"
        },
        {
          "name": "voucher_batch",
          "description": "A paid voucher batch: every claim link, which have been claimed and delivered, the expiry, and any refund for unclaimed links. The batchId is the only handle on the links — keep it, and hand each person their own link privately (whoever opens a link first gets that eSIM).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "batchId": {
                "description": "the batchId returned by buy for a quote_vouchers quote",
                "type": "string"
              }
            },
            "required": ["batchId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2ef9bf622e42b00081024eff618061d473994052daeb7168c12ac51683c465b3"
        }
      ],
      "digest": "sha256:e52b21bc63d6e689f9ac8372e13d9d0807d1791d8a0044ada953c5fc3ca18f16"
    }
  }
