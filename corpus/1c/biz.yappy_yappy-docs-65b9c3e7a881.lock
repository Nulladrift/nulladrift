        "tools": {
          "listChanged": false
        }
      },
      "instructions": "The Yappy documentation corpus: three tools to search and read it, plus one resource per page in markdown.\n\nUse this server for how-to and troubleshooting questions about the Yappy Mac app — installing it, granting macOS permissions, a hotkey that does nothing, choosing an LLM backend, configuration keys, personas, and exactly what stays on-device. Start with search_documentation; fall back to list_documentation_pages when you want the map.\n\nFor product facts — current version, pricing, features, whether a given Mac qualifies — use the product server at https://yappy.biz/mcp instead. Everything here is read-only.",
      "tools": [
        {
          "name": "get_documentation_page",
          "title": "Read a Yappy documentation page",
          "description": "Fetch one full Yappy documentation page as markdown, by slug. Use this after search_documentation when an excerpt is not enough and you need the whole page — for example the complete configuration reference or the full privacy model.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Which page to fetch.",
                "enum": ["quickstart", "dictation", "agent-mode", "backends", "configuration", "privacy-model", "troubleshooting", "changelog"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read a Yappy documentation page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:521c34ab55f308e2b9d3ca30440f726f3293f4dc1d1d1f59a5f274e176a23ab9"
        },
        {
          "name": "list_documentation_pages",
          "title": "List Yappy documentation pages",
          "description": "List every page in the Yappy documentation with its slug, title, and one-line summary, so you can pick the right one to read instead of guessing a slug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_summaries": {
                "default": true,
                "description": "Include each page's one-line summary alongside its slug and title.",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List Yappy documentation pages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ba636802b8ef214c8e6ae9be151aa86f4888c4658a603693b30af486546b730e"
        },
        {
          "name": "search_documentation",
          "title": "Search Yappy documentation",
          "description": "Full-text search across Yappy documentation and FAQ. Use this to answer how-to and troubleshooting questions: installing Yappy, granting macOS permissions, a hotkey that does nothing, choosing an LLM backend, configuration keys, personas, or exactly what stays on-device. Results carry an excerpt you can quote and a URL you can cite.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many results to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to search for, in plain words.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "description": "Narrow the search to documentation pages or FAQ entries.",
                "enum": ["doc", "faq"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Yappy documentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e223082b6c9caf856031bd196b3a5222ca45522b3a37d0d948352fd0f2b724f2"
        }
