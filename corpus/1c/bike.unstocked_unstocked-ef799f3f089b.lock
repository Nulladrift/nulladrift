{
  "lockfileVersion": 2,
  "subjects": {
    "bike.unstocked/unstocked": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://unstocked.bike/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "unstocked",
        "title": "Unstocked",
        "version": "1.0.0",
        "websiteUrl": "https://unstocked.bike"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Unstocked (unstocked.bike) lists aftermarket parts that fit sport motorcycles, with typical US street prices, and turns them into build sheets. For a request like 'get me a track-only build for my 2026 Yamaha R7', call get_build with the bike, the style and the model year. For a custom build, call get_parts, choose parts, then call make_build_link. Always give the rider the build link: it opens the build on unstocked.bike (phones too) with buy links and a share button. Prices are typical US street prices, not live quotes. Fitment is advisory: tell the rider to confirm the part number for their year and market. Parts flagged track-only are closed-course parts, not road legal. Ready-made builds are picked by fixed rules from the parts Unstocked lists; present them as a starting point, not a rider's own build. Never add parts Unstocked does not list.",
      "tools": [
        {
          "name": "get_build",
          "title": "Get a ready-made build",
          "description": "A ready-made build for one bike, model year and style (first-mods, carbon-street, track-day, track-only, budget-track). Returns the parts with typical prices and fitment notes, what Unstocked does not list for that bike and year, and a link that opens the build on unstocked.bike. Give the rider that link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bike": {
                "description": "Bike slug or name, e.g. \"yamaha-r7\", \"R7\" or \"2026 Yamaha R7\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "style": {
                "description": "first-mods, carbon-street, track-day, track-only or budget-track. Plain words work too (\"racing\", \"carbon\", \"first mods\").",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "year": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Model year, e.g. 2026. Without it the newest model years are used; ask the rider if it matters."
              }
            },
            "required": ["bike", "style"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a ready-made build"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3384ca4627c304f9c294a0e52376aa04e13ec64d5e769b3f52455bd2b1fbcebf"
        },
        {
          "name": "get_parts",
          "title": "Get parts for a bike",
          "description": "Every part Unstocked lists for a bike, optionally for one model year or category. Each part has an id (for make_build_link), category, brand, tier, typical price, fitment note, flags (track-only, wants-tune) and whether it is listed for the model year. Also returns stock equipment and things to know before buying.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bike": {
                "description": "Bike slug or name, e.g. \"yamaha-r7\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "category": {
                "description": "Category slug or word, e.g. \"exhaust\", \"suspension\", \"brakes\", \"tires\", \"rearsets\".",
                "maxLength": 40,
                "type": "string"
              },
              "query": {
                "description": "Words in the part or brand name, e.g. \"akrapovic\" or \"slip-on\".",
                "maxLength": 80,
                "type": "string"
              },
              "year": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Model year. With it, parts not listed for that year are left out."
              }
            },
            "required": ["bike"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get parts for a bike"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f77aae9b242af813d8e882769e48bd61f28530f0d4f82038a73ce3ef0e5809b"
        },
        {
          "name": "list_bikes",
          "title": "List bikes",
          "description": "Bikes Unstocked covers, with their model-year groups. Optional query filters by make or model (\"yamaha\", \"R7\", \"ZX-6R\"). Use the slug with the other tools.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Make or model, e.g. \"yamaha\" or \"r7\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List bikes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:808ff06e9cbf0f7cd68f244f598a44e06ce2acbd94f9af79a21b299c0e767b8f"
        },
        {
          "name": "make_build_link",
          "title": "Make a build link",
          "description": "Turn a list of part ids into a link that opens the build on unstocked.bike. Use part ids from get_parts or get_build for the same bike. Checks every id fits the bike and that no two parts share a slot, and returns the total at typical prices.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bike": {
                "description": "Bike slug or name, e.g. \"yamaha-r7\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "part_ids": {
                "description": "Part ids, in the order to show them.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "title": {
                "description": "Short build title, e.g. \"Track R7\".",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["bike", "part_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Make a build link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fedf5a16f0e9e65e96fed4b5c1d5c8afdcb508e12617daef31ece45d24fe90dd"
        }
      ],
      "digest": "sha256:5380e33f50622830f53280767dd4ee0cad75bdc11e9b21efcf4dbd31c5ee1af1"
    }
  }
