        {
          "name": "create_client",
          "title": "Add a salon client",
          "description": "Use this when someone asks to add a new client to a salon. Returns the client's id, name, salon and language; the phone and email given are saved but never returned. Not for changing an existing client.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Email address.",
                "maxLength": 254,
                "type": "string"
              },
              "language": {
                "description": "Language for their messages, as a code such as en, it or pt-BR. Defaults to the salon language.",
                "maxLength": 10,
                "type": "string"
              },
