      "instructions": "# Salon operations with HairDora\n\nThis skill drives the HairDora MCP connector. The user must connect HairDora\nand authorize an account with live access to the intended organization. If\nauthorization fails, ask the user to connect HairDora. Never request, embed,\nor repeat an API key, password, OAuth token, payment credential, or webhook\nsecret.\n\n## What the connector changes\n\nThe read tools change nothing. Six tools write, as the signed-in member, with\nthat member's HairDora role: `book_appointment`, `reschedule_appointment`,\n`cancel_appointment`, `create_client`, `update_client` and\n`set_inventory_quantity`. HairDora's own rules apply to every write: a\nstylist sees and changes only what their role allows, and the plan's monthly\nappointment limit counts bookings made here.\n\nIf those six tools are missing, the connection was authorized to read only\n(every connection made before November 2026 was). Ask the user to disconnect\nHairDora and connect it again, allowing HairDora to create and update data.\n\nConfirm every write with the user before calling it: who, which salon, when,\nand what will change. Booking, moving and cancelling reach the client: a\nbooking schedules the salon's reminder messages, a move moves them, and a\ncancellation sends the salon's cancellation message when the salon set one up.\nSay so when you ask.\n\nThe connector cannot delete anything, take or refund payments, send a\nmessage of its own, change reminder or template settings, create a repeating\nseries of appointments, change services, prices, staff or roles, or touch\nexpenses. Direct the user to the HairDora app for those.\n\nIt never returns a client's phone number, email, address or notes. When\nsomeone asks for them, or to export them, say the connector does not share\ncontact details and that the HairDora app shows them.\n\n## Resource identifiers\n\nKeep these identifiers distinct:\n\n- `salonId` selects an owned salon. A write may leave it out when the account\n  has one salon.\n- `clientId` names one client; `appointmentId` one appointment;\n  `inventoryItemId` one stock item.\n- `providerIds` are the stylist ids `list_providers` returns.\n- `serviceIds` are the service ids `list_services` returns.\n- `lastEditTime` is a record's version. Moving or cancelling an appointment,\n  updating a client and setting a stock quantity take it as\n  `expectedLastEditTime` and are refused with `conflict` when the record\n  changed since it was read.\n- `requestId` is a unique id you choose for each new booking or client, such\n  as a UUID. Calling again with the same `requestId` returns the first result\n  instead of booking or adding twice.\n\nResolve a name with a list tool, then reuse the exact returned id. Never guess\nan id, treat an opaque id as authority, or reuse an id from another\norganization. Cross-tenant salon, client, and appointment ids return not found\nor an authorization error. For availability and providers, the connector must\nfinish its owned-salon check before using the product's public booking route.\n\n## Available tools\n\n| Tool                     | Use it when someone asks…                                                                                                                             |\n| ------------------------ | ----------------------------------------------------------------------------------------------------------------------------------------------------- |\n| `list_salons`            | which salons they run, with the ids that narrow other reads to one salon                                                                              |\n| `get_salon`              | for a salon's opening hours, address, phone, timezone or appointment length                                                                           |\n| `get_salon_availability` | when there are free slots (the salon's booking window, up to 14 days with openings)                                                                   |\n| `list_providers`         | which stylists or hairdressers can be booked, with the ids a booking takes                                                                            |\n| `list_clients`           | who the clients are, or for a client's id by name (up to 100)                                                                                         |\n| `get_client`             | about one client's language or salon                                                                                                                  |\n| `list_appointments`      | how many appointments there are on a day or in a period, how many were canceled or no-shows, when a client is booked, or which bookings a stylist has |\n| `get_appointment`        | what services one booking includes and their prices                                                                                                   |\n| `list_calendar_events`   | when the salon is closed or has extra opening hours, or a stylist or chair is blocked                                                                 |\n| `list_services`          | what a cut, colour or other service costs                                                                                                             |\n| `list_payments`          | which payments were taken or whether a client paid; never moves funds                                                                                 |\n| `list_quotes`            | which client quotes are pending, approved or rejected (no amounts)                                                                                    |\n| `list_inventory_items`   | how much of a product is in stock, or what is running low                                                                                             |\n| `show_salon_overview`    | for a one-card overview of one salon                                                                                                                  |\n| `book_appointment`       | to book a client in                                                                                                                                   |\n| `reschedule_appointment` | to move an appointment to another day or time                                                                                                         |\n| `cancel_appointment`     | to cancel an appointment                                                                                                                              |\n| `create_client`          | to add a new client                                                                                                                                   |\n| `update_client`          | to change a client's name, phone, email or language                                                                                                   |\n| `set_inventory_quantity` | to correct or update a stock count                                                                                                                    |\n\n`list_clients`, `list_appointments`, `list_calendar_events`, `list_services`,\n`list_payments`, `list_quotes` and `list_inventory_items` accept a maximum\nresult limit of 100 and return `hasMore`. Defaults are 20 except services and\nstock, which default to 50. `list_salons` and `list_providers` are capped at 100. Report `hasMore` rather than claiming completeness. The overview caps\ncounted clients at 100, appointment previews at 8, and service previews at 12;\na `+` count is a lower bound.\n\n`get_salon_availability` accepts no custom date window. It follows the salon's\nown online-booking window (by default from two hours ahead to six months\nahead) and returns the first 14 days that have openings. Do not extrapolate\nbeyond the days it returns. It summarizes each day with slot count\nand first/last slot; it does not identify who occupies unavailable time.\n\nProvider roles are organization-wide, not proof that a provider works at the\nselected salon. `list_providers` returns ids and names only, with no contact,\nrole record, avatar, or personal schedule.\n\n## Booking workflow\n\n1. Find the client with `list_clients` and its `search` (any words of their\n   name, ignoring case and accents). If they are not there, offer to add them\n   with `create_client`, then use the id it returns.\n2. Use `get_salon` for the salon's timezone and usual appointment length, and\n   `get_salon_availability` when the user has no time in mind.\n3. Use `list_services` for the services asked for, and `list_providers` when\n   the salon has several stylists and the user named one or must choose.\n4. Confirm the client, salon, local day and time, services and stylist with\n   the user, then call `book_appointment` with a new `requestId`. Give\n   `startTime` with the salon's UTC offset. Leave `durationMinutes` out for\n   the salon's usual length.\n5. Report the booked time in the salon's timezone, and that the salon's\n   reminders will reach the client.\n\n`book_appointment` books only stylists with the hairdresser role and only a\nclient of the same salon. With several stylists and none named, it answers\n`provider_required`: ask which one. `plan_limit_reached` means the salon's\nmonthly appointment limit is used up; the owner can upgrade in the app.\n\n## Moving or cancelling an appointment\n\n1. Find the appointment with `list_appointments` (by client and day) or\n   `get_appointment`, and keep its `id` and `lastEditTime`. A stylist's\n   bookings are those whose `providerIds` hold the stylist's id from\n   `list_providers`; move or cancel them one at a time, each confirmed.\n2. Confirm the change with the user, then call `reschedule_appointment` (the\n   client, stylist, services and length stay the same unless a new\n   `durationMinutes` is given) or `cancel_appointment`. Cancelling keeps the\n   appointment as canceled; it never deletes it.\n3. On `conflict`, read the appointment again, tell the user what changed, and\n   ask again before retrying with the new `lastEditTime`.\n\nOnly requested and booked appointments can be moved or canceled. One the\nclient attended or missed stays as it is.\n\n## Clients\n\n`create_client` needs a name; phone, email and language are optional. The\nphone and email are saved for the salon's messages but never returned. Use\n`update_client` with the client's `lastEditTime` to change a name, phone,\nemail or language; only the fields given change.\n\n## Stock\n\n`list_inventory_items` shows each item's unit, quantity, minimum and whether\nit is at or below its minimum. `set_inventory_quantity` replaces the stored\nquantity with the number given: when the user reports a change (\"we used\ntwo\"), work out the new total from the quantity you read, confirm it, and send\nthat total with the item's `lastEditTime`.\n\n## When the answer is lost\n\n`delivery_unknown` means the connection dropped after the request was sent,\nso the change may have been saved. For a booking or a new client, retry with\nthe same `requestId`: a record already saved is returned instead of written\ntwice. For anything else, read the record again before deciding to retry.\n\n## Personal-data boundary\n\nClient display names and pseudonymous client/appointment/quote/payment\nlinkages are personal data. Use them only when the requested workflow needs to\nresolve a client or connect that client's records. Do not repeat more names or\nidentifiers than needed in the answer.\n\nSafe results may include:\n\n- salon ids, display names, public business contact/location, locale,\n  currency, timezone, opening hours, and scheduling settings;\n- client display name and pseudonymous id, salon link, language, and edit\n  time;\n- appointment ids, client/salon links, times, status, edit time, stylist ids\n  and bounded service summaries;\n- stylist ids and display names;\n- calendar type, scope, blocking/opening effect, all-day flag, and times;\n- service ids, names, prices, and salon links;\n- stock item ids, names, units, quantities and minimums; and\n- quote/payment ids, client/salon links, status, time, amount, and currency.\n\nThe connector intentionally never returns:\n\n- client email, phone, address, or other contact/profile fields, even right\n  after you sent them;\n- client, appointment, quote, payment, stock or calendar free-text notes;\n- service/color history or private calendar titles and reasons;\n- chair, role, or organization ids;\n- cardholder data, processor/customer ids, credentials, payment errors,\n  discounts, or staff commission splits; or\n- arbitrary metadata, internal integrations, or unbounded raw documents.\n\nDo not infer or reconstruct excluded fields. Ask for a client's phone or email\nonly to add or update that client, and never to answer a question. Do not ask\nthe user to paste notes, card data, processor ids, or credentials into chat.\n\n## Salon capacity audit\n\n1. Use `list_salons` unless the exact owned salon id is already available.\n2. Call `get_salon` for timezone, opening hours, appointment duration, and\n   business configuration.\n3. Call `list_calendar_events` with that salon and a bounded time window.\n   Interpret `BLOCK` versus `OPEN`; titles, notes, staff/chair ids, and private\n   reasons are unavailable.\n4. Call `get_salon_availability`; it returns the salon's own booking window.\n5. Optionally use `list_appointments` with the same window to describe booked\n   workload without exposing notes or contacts.\n6. Distinguish configured hours, explicit blocks, booked appointments, and\n   remaining summarized availability. Do not invent the cause of a block.\n\n## Service, quote, and payment-status workflow\n\nUse `list_services` for the catalog and prices. A price is operational\nmetadata, not proof of the final charged amount.\n\nFor one resolved client, `list_quotes` can show pseudonymous quote ids, status,\nand time. It does not return line items, discounts, contact details, or notes.\nThe status filter is applied within a bounded upstream window; when `hasMore`\nis true, do not claim that the filtered set is globally complete.\n\n`list_payments` can show pseudonymous payment/client/salon ids, time, amount,\ncurrency, and status. It cannot charge, refund, transfer, retry, settle, or\notherwise move funds. It omits cardholder data, processor/customer ids,\ncredentials, errors, discounts, notes, and commission splits. Treat a status\nas HairDora's recorded operational state, not independent proof of bank\nsettlement.\n\n## Interactive views\n\n`show_salon_overview` renders a bounded salon card. Its model-visible and\nrendered result omits client names and client/appointment ids. Explain lower\nbounds, schedule patterns, or next safe checks instead of restating every\nvisible value.\n\n`get_appointment` renders the appointment-detail card. The card omits the\nappointment note and all contact/payment fields. Use its client or salon\nreference for another safe read only when the user's request requires it.\n",
