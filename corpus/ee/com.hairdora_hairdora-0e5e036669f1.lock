        {
          "name": "reschedule_appointment",
          "title": "Move a salon appointment",
          "description": "Use this when someone asks to move an appointment to another day or time. Returns the moved appointment; its client, stylist, services and length stay the same and the client's reminders move with it. Not for cancelling an appointment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appointmentId": {
                "description": "Id of the appointment, from list_appointments.",
                "maxLength": 24,
                "minLength": 24,
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "durationMinutes": {
                "description": "New length in minutes. Leave it out to keep the current length.",
                "maximum": 480,
                "minimum": 5,
                "type": "integer"
              },
              "expectedLastEditTime": {
                "description": "The lastEditTime from get_appointment or list_appointments. An appointment changed since then is refused.",
                "format": "date-time",
                "maxLength": 40,
                "type": "string"
              },
              "startTime": {
                "description": "New start as an ISO 8601 time with the salon's UTC offset, such as 2026-11-20T15:30:00+01:00.",
                "format": "date-time",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["appointmentId", "expectedLastEditTime", "startTime"],
            "type": "object"
          },
