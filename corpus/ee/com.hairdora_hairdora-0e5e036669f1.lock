        {
          "name": "list_salons",
          "title": "List your salons",
          "description": "Use this when someone asks which hair salons they run in HairDora, or a salon's id is needed. Returns up to 100 salons with id, name, currency, default language and last edit time. Not for a salon's address, phone or opening hours.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "hasMore": {
                "description": "True when the organization has more than 100 salons",
                "type": "boolean"
              },
              "salons": {
                "description": "Salons in the signed-in organization. Contact, address, payment, organization and configuration fields are excluded.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "currency": {
                      "anyOf": [
                        {
                          "pattern": "^[A-Z]{3}$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "defaultLocale": {
                      "anyOf": [
                        {
                          "maxLength": 16,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "id": {
                      "pattern": "^[0-9a-f]{24}$",
                      "type": "string"
                    },
                    "lastEditTime": {
                      "anyOf": [
                        {
                          "maxLength": 32,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "name": {
                      "maxLength": 200,
                      "type": "string"
                    }
                  },
                  "required": ["currency", "defaultLocale", "id", "lastEditTime", "name"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              }
            },
            "required": ["count", "hasMore", "salons"],
            "type": "object"
