{
  "lockfileVersion": 2,
  "subjects": {
    "com.airporttransferconnect/transfers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.airporttransferconnect.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "airport-transfer-connect-transfers",
        "title": "Airport Transfer Connect — private transfers",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use get_quote to price a private transfer (airport ↔ hotel/address) with Airport Transfer Connect. Prices are EUR per vehicle, VAT included, live. Use request_booking only after the user confirms and gives name, email and phone; then give them the booking_url to confirm/pay.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Check whether a private transfer can be booked for the given route, date/time and number of passengers, and which vehicles fit.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Pickup date, YYYY-MM-DD (local time at pickup).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "flight_number": {
                "description": "Optional flight number, e.g. AF1234.",
                "type": "string"
              },
              "from": {
                "description": "Pickup: airport IATA code (CDG, ORY, BVA, LBG, OTP, NCE, LHR…), hotel name + city, or full address.",
                "type": "string"
              },
              "luggage": {
                "description": "Number of suitcases, defaults to passengers (alias accepted: bags).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "passengers": {
                "default": 2,
                "description": "Number of passengers (alias accepted: pax).",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "return_date": {
                "description": "Optional return date YYYY-MM-DD for a round trip.",
                "type": "string"
              },
              "return_time": {
                "description": "Optional return pickup time HH:MM.",
                "type": "string"
              },
              "time": {
                "default": "12:00",
                "description": "Pickup time HH:MM 24h local. For airport pickups use the flight landing time.",
                "type": "string"
              },
              "to": {
                "description": "Drop-off: airport IATA code, hotel name + city, or full address.",
                "type": "string"
              }
            },
            "required": ["date", "from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:021249e8cebd52376993dd0e049f7e951a1d4351939ce8601674805ba0e7cc4d"
        },
        {
          "name": "get_quote",
          "title": "Get transfer price",
          "description": "Live fixed price (EUR, per vehicle, VAT incl.) for a private transfer/chauffeur ride with Airport Transfer Connect — e.g. CDG airport to a Paris hotel. Returns prices for E-Class, V-Class, S-Class, availability and a prefilled booking_url.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Pickup date, YYYY-MM-DD (local time at pickup).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "flight_number": {
                "description": "Optional flight number, e.g. AF1234.",
                "type": "string"
              },
              "from": {
                "description": "Pickup: airport IATA code (CDG, ORY, BVA, LBG, OTP, NCE, LHR…), hotel name + city, or full address.",
                "type": "string"
              },
              "luggage": {
                "description": "Number of suitcases, defaults to passengers (alias accepted: bags).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "passengers": {
                "default": 2,
                "description": "Number of passengers (alias accepted: pax).",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "return_date": {
                "description": "Optional return date YYYY-MM-DD for a round trip.",
                "type": "string"
              },
              "return_time": {
                "description": "Optional return pickup time HH:MM.",
                "type": "string"
              },
              "time": {
                "default": "12:00",
                "description": "Pickup time HH:MM 24h local. For airport pickups use the flight landing time.",
                "type": "string"
              },
              "to": {
                "description": "Drop-off: airport IATA code, hotel name + city, or full address.",
                "type": "string"
              }
            },
            "required": ["date", "from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f2b5035718a46b10f886f93f268d00dba4b5513f9b0b38739bc9b0c407092a76"
        },
        {
          "name": "request_booking",
          "title": "Request a booking",
          "description": "Register a booking request for the passenger (name, email, phone required; only with the user's explicit consent). Returns a reference and a prefilled booking_url where the passenger confirms and pays (card or pay the driver).",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Pickup date, YYYY-MM-DD (local time at pickup).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "email": {
                "description": "Lead passenger email; the booking confirmation is sent there.",
                "format": "email",
                "type": "string"
              },
              "flight_number": {
                "description": "Optional flight number, e.g. AF1234.",
                "type": "string"
              },
              "from": {
                "description": "Pickup: airport IATA code (CDG, ORY, BVA, LBG, OTP, NCE, LHR…), hotel name + city, or full address.",
                "type": "string"
              },
              "luggage": {
                "description": "Number of suitcases, defaults to passengers (alias accepted: bags).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "name": {
                "description": "Lead passenger full name.",
                "type": "string"
              },
              "notes": {
                "description": "Optional: child seat, extra stop, name sign text…",
                "type": "string"
              },
              "passengers": {
                "default": 2,
                "description": "Number of passengers (alias accepted: pax).",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "phone": {
                "description": "Mobile in international format, e.g. +14155550123 (WhatsApp preferred).",
                "type": "string"
              },
              "return_date": {
                "description": "Optional return date YYYY-MM-DD for a round trip.",
                "type": "string"
              },
              "return_time": {
                "description": "Optional return pickup time HH:MM.",
                "type": "string"
              },
              "time": {
                "default": "12:00",
                "description": "Pickup time HH:MM 24h local. For airport pickups use the flight landing time.",
                "type": "string"
              },
              "to": {
                "description": "Drop-off: airport IATA code, hotel name + city, or full address.",
                "type": "string"
              },
              "vehicle": {
                "description": "Optional preferred vehicle: \"E Class\", \"V Class\", \"S Class\".",
                "type": "string"
              }
            },
            "required": ["date", "email", "from", "name", "phone", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f608c5e945d1f5e1b1bc9e243308b682a5a4a470a80c1f7ef87998c2b1344a08"
        }
      ],
      "digest": "sha256:930d453eadc6cc72811e866e9492d07c0e333d1c8387d3edefa29af24acf0536"
    }
  }
}
