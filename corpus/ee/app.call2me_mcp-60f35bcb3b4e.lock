      "serverInfo": {
        "name": "call2me",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call2Me voice AI platform. NEVER guess a phone number or an assistant id: call2me_make_outbound_call and call2me_create_schedule produce a real, charged phone call — ask the user when anything is missing. Deletions and cancellations cannot be undone; when it is unclear which record is meant, list first and have the user confirm. The user's API key cannot be read or returned through these tools. Two accounts: add this server twice under different names, signing in to each with a different account.",
      "tools": [
        {
          "name": "call2me_add_knowledge_base_sources",
          "title": "Add knowledge base sources",
          "description": "Adds text and/or URL sources to an existing knowledge base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "knowledge_base_id": {
                "description": "The knowledge base id. Call call2me_list_knowledge_bases first if unknown.",
                "type": "string"
              },
              "texts": {
                "description": "Text sources to index (max 20).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "text": {
                      "description": "The text content.",
                      "type": "string"
                    },
                    "title": {
                      "description": "Title of the text.",
                      "type": "string"
                    }
                  },
                  "required": ["text", "title"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "urls": {
                "description": "Web page URLs to crawl and index (max 10).",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["knowledge_base_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add knowledge base sources"
          },
          "behavior": {
            "destructive": false,
