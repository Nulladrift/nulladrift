        {
          "name": "call2me_create_agent",
          "title": "Create assistant",
          "description": "Creates a new voice assistant. Do not call it unless the user asks explicitly; do not invent fields such as name and language — ask. Defaults: engine 'cascade', llm_model 'openai/gpt-5.4-nano'. Unknown fields are rejected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "backchannel_words": {
                "description": "Custom backchannel words (empty list = language defaults).",
                "items": {
                  "maxLength": 30,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "begin_message": {
                "description": "First sentence of every call (used when begin_message_mode is 'static').",
                "type": "string"
              },
              "begin_message_mode": {
                "description": "'static' says begin_message as-is; 'dynamic' lets the LLM write the greeting.",
                "enum": ["static", "dynamic"],
                "type": "string"
              },
              "builtin_functions": {
                "description": "Built-in actions the assistant may take during a call (replaces the list).",
                "items": {
                  "enum": ["end_call", "transfer_call", "hold_call", "schedule_callback", "dtmf_input"],
                  "type": "string"
                },
                "type": "array"
              },
              "enable_backchannel": {
                "description": "Short listening sounds ('mm-hm') while the caller talks.",
                "type": "boolean"
              },
              "enable_recording": {
                "description": "Record calls (adds a per-minute fee).",
                "type": "boolean"
              },
              "enable_vcon_export": {
                "description": "Allow call2me_get_call_transcript to return vCon.",
                "type": "boolean"
              },
              "end_call_message": {
                "description": "Goodbye sentence said before hanging up.",
                "type": "string"
              },
              "engine": {
                "description": "'cascade' (speech-to-text, LLM, text-to-speech; default) or 'realtime' (GPT Realtime speech-to-speech, pricier per minute, needs an 'openai-*' voice).",
                "enum": ["cascade", "realtime"],
                "type": "string"
              },
              "interruption_sensitivity": {
                "description": "How easily the caller can interrupt (0 hard, 1 easy; below 0.1 disables interruptions).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "knowledge_base_ids": {
                "description": "Knowledge base ids the assistant searches (replaces the list).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "language": {
                "description": "Spoken language, e.g. 'tr' or 'en'.",
                "type": "string"
              },
              "llm_model": {
                "description": "LLM used by the cascade engine (OpenRouter id). Ignored by the realtime engine.",
                "enum": ["openrouter/auto", "openai/gpt-5.4-nano", "openai/gpt-5.4-mini", "openai/gpt-5.4", "openai/gpt-5.4-pro", "openai/gpt-4.1-nano", "openai/gpt-4.1-mini", "openai/gpt-4.1", "anthropic/claude-sonnet-4.6", "anthropic/claude-opus-4.6", "anthropic/claude-opus-4.6-fast", "google/gemini-3-flash-preview", "deepseek/deepseek-chat-v3-0324", "deepseek/deepseek-r1", "meta-llama/llama-4-scout", "meta-llama/llama-4-maverick", "x-ai/grok-4.20", "mistralai/mistral-small-2603", "mistralai/mistral-medium-3", "minimax/minimax-m2.5", "qwen/qwen3.5-flash-02-23", "qwen/qwen3.5-plus-02-15", "qwen/qwen3-max-thinking", "cohere/command-a", "google/gemma-3-27b-it", "openai/gpt-4o-mini", "openai/gpt-4o"],
                "type": "string"
              },
              "max_call_duration_ms": {
                "description": "Hard cap on one call's length in ms (60000-7200000, default 3600000). Calls are billed per second, so this is also the most one call can cost.",
                "maximum": 7200000,
                "minimum": 60000,
                "type": "integer"
              },
              "metadata": {
                "description": "Your own key/value data on the assistant. MERGED into the existing metadata (a key set to null is removed). The 'custom_functions' key cannot be set here.",
                "type": "object"
              },
              "name": {
                "description": "Name of the assistant.",
                "type": "string"
              },
              "post_call_actions": {
                "description": "Actions to run after each call.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "post_call_extraction": {
                "description": "Data fields to extract from each call.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "post_call_extraction_model": {
                "description": "LLM that extracts post_call_extraction fields after each call (low-cost models only).",
                "enum": ["openai/gpt-5.4-nano", "openai/gpt-5.4-mini", "openai/gpt-4.1-nano", "openai/gpt-4.1-mini", "openai/gpt-4o-mini", "google/gemini-3-flash-preview", "qwen/qwen3.5-flash-02-23", "deepseek/deepseek-chat-v3-0324"],
                "type": "string"
              },
              "reminder_max_count": {
                "description": "Reminders before the call is ended for silence (0-5; 0 turns off reminders AND silence hang-up, so a silent line stays open, and billed, until max_call_duration_ms). Silence hang-up time is about reminder_message_frequency_ms x (count + 1).",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "reminder_message_frequency_ms": {
                "description": "After this much caller silence (ms, 3000-60000) the assistant speaks a reminder.",
                "maximum": 60000,
                "minimum": 3000,
                "type": "integer"
              },
              "responsiveness": {
                "description": "How fast the assistant replies after the caller stops (0 patient, 1 immediate).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "system_prompt": {
                "description": "Behaviour instructions for the assistant.",
                "type": "string"
              },
              "temperature": {
                "description": "LLM sampling temperature (0-2).",
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              },
              "transfer_targets": {
                "description": "Where the assistant may transfer calls (replaces the list). A phone transfer is a billed outbound call; restricted destinations are refused.",
                "items": {
                  "properties": {
                    "name": {
                      "description": "Department name the caller asks for.",
                      "type": "string"
                    },
                    "type": {
                      "enum": ["phone", "sip", "agent", "external", "queue"],
                      "type": "string"
                    },
                    "value": {
                      "description": "E.164 number, sip: URI, or agent id.",
                      "type": "string"
                    }
                  },
                  "required": ["name", "type", "value"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "voice_id": {
                "description": "Voice id from call2me_list_voices. Realtime engine needs an 'openai-*' voice; cascade cannot use 'openai-*' voices.",
                "type": "string"
              },
              "voicemail_action": {
                "description": "hangup = end the call; leave_message = say voicemail_message, then end.",
                "enum": ["hangup", "leave_message"],
                "type": "string"
              },
              "voicemail_detection_enabled": {
                "description": "Outbound calls only: if the other side sounds like an answering machine (\"leave a message\", \"not available\"...), apply voicemail_action. Silence alone is NOT treated as voicemail.",
                "type": "boolean"
              },
              "voicemail_detection_timeout_ms": {
                "description": "How long after the opening line to listen for an answering-machine greeting (ms).",
                "maximum": 15000,
                "minimum": 2000,
                "type": "integer"
              },
              "voicemail_message": {
                "description": "Message left on voicemail; {{variables}} are filled per call.",
                "maxLength": 500,
                "type": "string"
              },
              "webhook_url": {
                "description": "URL that receives call events.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create assistant"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:48b65f64c9ddd49fd23cb3055417dd2c3cda897ffdb8f09e3ac7f9d105c1f0c2"
        },
