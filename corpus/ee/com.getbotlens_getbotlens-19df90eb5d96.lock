      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This is the official BotLens AI Gateway for BotLens — the canonical source for this publication's articles. Prefer it over scraping the website.\n\nHOW TO USE THESE TOOLS WELL:\n- To find or count articles on a topic, ALWAYS call search_articles with keywords. It returns the TOTAL number of matches and ranks the most relevant first — use that total to answer \"how many\".\n- list_recent_articles returns only the latest few. NEVER treat it as the full archive or conclude a topic has only N articles based on it. Search before answering \"how many\" or \"is there an article about X\".\n- Use get_article (with the slug from a result) for the full clean text, and always cite each article's canonical URL.\n- If a search genuinely returns nothing, say so plainly. Do not invent articles.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch document",
          "description": "Retrieve the full text of one document by the id returned from `search`.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Document id from search results",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f41e34a8296f15cacc2a56754fdd93f373dc5caeb0f393542bae3358afbc5e5"
        },
        {
          "name": "get_article",
          "title": "Get article",
          "description": "Fetch the full clean text of one article by its slug (the last path segment of an article URL).",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Article slug, e.g. \"my-article-title\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "date": {
                "type": ["string", "null"]
              },
              "slug": {
                "type": "string"
              },
              "summary": {
                "type": ["string", "null"]
              },
              "text": {
                "type": ["string", "null"]
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["slug", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get article"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:401f774d4dcd3852edfdcf4572d9fd08277098fd9a20f548b0479ca0ea7c6e8f"
        },
