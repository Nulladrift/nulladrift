{
  "lockfileVersion": 2,
  "subjects": {
    "co.angelbacked/angel-investors": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.angelbacked.co/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "angelbacked",
        "title": "AngelBacked",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "AngelBacked: 58,000+ angel investors and VCs with markets, locations, portfolios and verified emails, plus recent funding rounds. Typical flow: search_investors (or company_investors) to build a shortlist, get_investor to check fit, then reveal_investor_email only for investors the user will actually contact. Results are 25 per page, fair-use limited (150 requests/day); refine filters rather than paging through everything. Requires an AngelBacked Annual API key (https://www.angelbacked.co/profile?tab=api). Docs: https://www.angelbacked.co/mcp",
      "tools": [
        {
          "name": "company_investors",
          "title": "Who backed a company",
          "description": "Angel investors in AngelBacked who backed a named company (exact company name, case-insensitive), most active first, up to 50. Use it to find investors who already back companies like yours.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company name, e.g. \"Notion\".",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:41300afb436158f0a047855f29b29b646d3a9123236347b830ddf65df9fceafe"
        },
        {
          "name": "get_investor",
          "title": "Get an investor profile",
          "description": "Full profile for one investor by id or slug (from search results or an angelbacked.co/investor/<slug> URL): title, firm, location, markets, social links and up to 100 portfolio companies. No email; use reveal_investor_email.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "investor": {
                "description": "Investor id (uuid) or profile slug.",
                "type": "string"
              }
            },
            "required": ["investor"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9dfe51f83a76c540c0a53f53b74105495a8bc0e9fc9073f1e6c7ee9f07a9f87b"
        },
        {
          "name": "recent_funding_rounds",
          "title": "Recent funding rounds",
          "description": "Recent startup funding rounds tracked by AngelBacked Signals: company, date, stage, amount and industry, newest first. Filter by days back (max 180), industry and stage (e.g. \"Seed\", \"Series A\", \"Pre-Seed\").",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Lookback in days. Default 30.",
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              },
              "industry": {
                "description": "Industry, partial match (e.g. \"Health\").",
                "type": "string"
              },
              "page": {
                "description": "Page number (1-20). Default 1.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page (max 25). Default 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "stage": {
                "description": "Exact round stage, case-insensitive (e.g. \"Seed\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:63ae4082b43468e8017905ebe1bf366b7d3212d66b08b0e744cba9f94c2a04d1"
        },
        {
          "name": "reveal_investor_email",
          "title": "Reveal an investor email",
          "description": "Reveal one investor's email address. Uses the account's email reveal allowance (the same one as the Reveal button on angelbacked.co; Annual: 500 per day, 3,000 per 30 days). Revealing an investor the account has already revealed is free. Only reveal investors the user intends to contact.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "investor_id": {
                "description": "Investor id (uuid) from search_investors or get_investor.",
                "type": "string"
              }
            },
            "required": ["investor_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b2f0d670169e11c1b610473f8a9e977c743bfa25d94a4e11c10742e7239fd53"
        },
        {
          "name": "search_investors",
          "title": "Search angel investors",
          "description": "Search 58,000+ angel investors and VCs in AngelBacked. Filter by free text (name, firm, title), market/sector, location, or a company they backed. Returns id, name, title, firm, city/state/country, markets, portfolio_count, LinkedIn/Twitter/website, profile_url and has_email. Emails are not included: call reveal_investor_email for the investors you actually want to contact. Sorted by portfolio size.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "location": {
                "description": "City, state or country, partial match (e.g. \"Austin\", \"California\", \"United Kingdom\").",
                "type": "string"
              },
              "market": {
                "description": "Market/sector, partial match (e.g. \"FinTech\", \"Artificial Intelligence\", \"SaaS\").",
                "type": "string"
              },
              "min_portfolio": {
                "description": "Minimum number of portfolio companies (activity filter).",
                "minimum": 0,
                "type": "integer"
              },
              "page": {
                "description": "Page number (1-20). Default 1.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page (max 25). Default 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "portfolio_company": {
                "description": "Only investors who backed this company (partial match, e.g. \"Stripe\").",
                "type": "string"
              },
              "query": {
                "description": "Free text matched against name, firm and title (e.g. \"former founder\", \"Sequoia\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2530f02888e6881f3649703dd1696fef6f34a5bd67fb8f08af7b5bdb6fa4ae00"
        }
      ],
      "digest": "sha256:cc418e169369e2e881bb6e82b6407a89087568202008aeadb63308c65505ac70"
    }
  }
