      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cypher-esim",
        "title": "Cypher eSIM",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Cypher eSIM sells prepaid travel eSIMs (data-only, and plans with a phone number) for crypto. No account, no name, no email. Flow: search_destinations → list_plans → get_plan → tell the person the plan notes → create_order → the person pays the exact amount → get_order until status is \"delivered\" → give the person the QR code (qr_png_url) or the iOS/Android install link. Before create_order, always tell the person: when validity starts, and any plan notes. Number plans: validity starts at installation; the number is French (+33) for Europe plans; the UK number plan must be installed only after arrival in the UK. Never invent prices or coverage: use only what the tools return. Keep order_token private: it is the only key to the eSIM QR code.",
      "tools": [
        {
          "name": "cancel_order",
          "title": "Cancel order",
          "description": "Cancel an unpaid order the person decided not to pay. Do not cancel after the payment was sent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "order_id": {
                "description": "order_id returned by create_order",
                "maxLength": 40,
                "minLength": 10,
                "type": "string"
              },
              "order_token": {
                "description": "order_token returned by create_order",
                "maxLength": 64,
                "minLength": 20,
                "type": "string"
              }
            },
            "required": ["order_id", "order_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel order"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b7a81b4d18f83b54b783755e062a1d7127d3d5d28de0fe3ef617f739ca123edb"
        },
        {
          "name": "create_order",
          "title": "Create order",
          "description": "Create a crypto invoice for one new eSIM. Before calling, confirm the plan with the person and tell them when validity starts and the plan notes (number plans: validity starts at installation; Europe number is French +33; UK number plan: install only after arrival). Returns order_id, order_token, the exact amount and the address. The person must send exactly that amount on that network before expires_at. Then poll get_order. Unpaid invoices per client are limited; cancel unused ones with cancel_order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client_ref": {
                "description": "Resellers only: your own order reference, returned as is.",
                "maxLength": 64,
                "type": "string"
              },
              "coin": {
                "description": "Coin code from list_payment_coins, e.g. \"USDT\", \"BTC\", \"XMR\"",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "network": {
                "description": "Network from list_payment_coins, e.g. \"tron\", \"solana\". Required for USDT (several networks).",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "plan_id": {
                "description": "plan_id from list_plans",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              },
              "quantity": {
                "description": "Resellers with an API key only: number of identical eSIMs on one invoice (1-50). Omit otherwise.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "ref": {
                "description": "Optional partner/referral code",
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["coin", "plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:707f42deee740b69166a15838e6e2bdbbae7e42623fe6d19edd95dbc4833d9d3"
        },
        {
          "name": "create_topup",
          "title": "Create top-up",
          "description": "Create a crypto invoice that adds a data plan to an existing eSIM (no new QR, nothing to install). plan_id must come from list_topups for this ICCID. Payment and polling work exactly like create_order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "coin": {
                "description": "Coin code from list_payment_coins, e.g. \"USDT\", \"BTC\", \"XMR\"",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "iccid": {
                "description": "ICCID of the installed eSIM (18-22 digits, printed in the eSIM settings)",
                "maxLength": 26,
                "minLength": 18,
                "type": "string"
              },
              "network": {
                "description": "Network from list_payment_coins, e.g. \"tron\", \"solana\". Required for USDT (several networks).",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "plan_id": {
                "description": "plan_id from list_plans",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["coin", "iccid", "plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create top-up"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b8510b083ea7b7a8d8565147b593b9af163f7c22ac74f1248fb10921bec06080"
        },
        {
          "name": "get_order",
          "title": "Get order",
          "description": "Order status: pending (waiting for payment), paid (issuing), delivered, expired, failed. When delivered, returns for each eSIM: QR code (also as an image), LPA activation code, ICCID, and one-tap iOS/Android install links. Call at most once every 5 seconds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "order_id": {
                "description": "order_id returned by create_order",
                "maxLength": 40,
                "minLength": 10,
                "type": "string"
              },
              "order_token": {
                "description": "order_token returned by create_order",
                "maxLength": 64,
                "minLength": 20,
                "type": "string"
              }
            },
            "required": ["order_id", "order_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:09febea28b6c4bdbdff43006909b625006544b81bcd782c5153d4d2b42c01be5"
        },
        {
          "name": "get_plan",
          "title": "Get plan",
          "description": "Full details of one plan: all covered countries, data, days, phone number (if any), install rules, when validity starts, and notes. Read the notes to the person before create_order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "plan_id": {
                "description": "plan_id from list_plans",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5f055d69a5ce5a582c117e9183d1421c35cb6ebf13db6b1a94eea3b3ef0147ed"
        },
        {
          "name": "list_payment_coins",
          "title": "List payment coins",
          "description": "Coins and networks accepted for payment. Pass coin and network to create_order. Sending on a different network loses the funds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List payment coins"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
