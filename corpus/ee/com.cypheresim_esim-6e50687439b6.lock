{
  "lockfileVersion": 2,
  "subjects": {
    "com.cypheresim/esim": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cypheresim.com/mcp"
