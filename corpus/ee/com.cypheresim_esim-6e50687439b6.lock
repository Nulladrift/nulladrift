      "serverInfo": {
        "name": "cypher-esim",
        "title": "Cypher eSIM",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Cypher eSIM sells prepaid travel eSIMs (data-only, and plans with a phone number) for crypto. No account, no name, no email. Flow: search_destinations → list_plans → get_plan → tell the person the plan notes → create_order → the person pays the exact amount → get_order until status is \"delivered\" → give the person the QR code (qr_png_url) or the iOS/Android install link. Before create_order, always tell the person: when validity starts, and any plan notes. Number plans: validity starts at installation; the number is French (+33) for Europe plans; the UK number plan must be installed only after arrival in the UK. Never invent prices or coverage: use only what the tools return. Keep order_token private: it is the only key to the eSIM QR code.",
      "tools": [
        {
          "name": "cancel_order",
          "title": "Cancel order",
          "description": "Cancel an unpaid order the person decided not to pay. Do not cancel after the payment was sent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "order_id": {
                "description": "order_id returned by create_order",
                "maxLength": 40,
                "minLength": 10,
                "type": "string"
              },
              "order_token": {
                "description": "order_token returned by create_order",
                "maxLength": 64,
                "minLength": 20,
                "type": "string"
              }
            },
            "required": ["order_id", "order_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel order"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4a51bcb85782c8431b20c62be038cc99f8f4795b1d4de71edd528ec33584d217"
        },
        {
          "name": "create_order",
          "title": "Create order",
          "description": "Create a crypto invoice for one new eSIM. Before calling, confirm the plan with the person and tell them when validity starts and the plan notes (number plans: validity starts at installation; Europe number is French +33; UK number plan: install only after arrival). Returns order_id, order_token, the exact amount and the address. The person must send exactly that amount on that network before expires_at. Then poll get_order. Unpaid invoices per client are limited; cancel unused ones with cancel_order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client_ref": {
                "description": "Resellers only: your own order reference, returned as is.",
                "maxLength": 64,
                "type": "string"
              },
              "coin": {
                "description": "Coin code from list_payment_coins, e.g. \"USDT\", \"BTC\", \"XMR\"",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "network": {
                "description": "Network from list_payment_coins, e.g. \"tron\", \"solana\". Required for USDT (several networks).",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "plan_id": {
                "description": "plan_id from list_plans",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              },
              "quantity": {
                "description": "Resellers with an API key only: number of identical eSIMs on one invoice (1-50). Omit otherwise.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "ref": {
                "description": "Optional partner/referral code",
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["coin", "plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b77f15d7dae84d96830f4ddaef4a5b7d2770e824def0e7a28fd06aaa31b63aac"
        },
        {
          "name": "create_topup",
          "title": "Create top-up",
          "description": "Create a crypto invoice that adds a data plan to an existing eSIM (no new QR, nothing to install). plan_id must come from list_topups for this ICCID. Payment and polling work exactly like create_order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "coin": {
                "description": "Coin code from list_payment_coins, e.g. \"USDT\", \"BTC\", \"XMR\"",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "iccid": {
                "description": "ICCID of the installed eSIM (18-22 digits, printed in the eSIM settings)",
                "maxLength": 26,
                "minLength": 18,
                "type": "string"
              },
              "network": {
                "description": "Network from list_payment_coins, e.g. \"tron\", \"solana\". Required for USDT (several networks).",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "plan_id": {
                "description": "plan_id from list_plans",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["coin", "iccid", "plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create top-up"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:09aeae0890a737329fa1a7d1c30b4262cc5d3df4806b7477c338bfdc67575761"
        },
        {
          "name": "get_order",
          "title": "Get order",
          "description": "Order status: pending (waiting for payment), paid (issuing), delivered, expired, failed. When delivered, returns for each eSIM: QR code (also as an image), LPA activation code, ICCID, and one-tap iOS/Android install links. Call at most once every 5 seconds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "order_id": {
                "description": "order_id returned by create_order",
                "maxLength": 40,
                "minLength": 10,
                "type": "string"
              },
              "order_token": {
                "description": "order_token returned by create_order",
                "maxLength": 64,
                "minLength": 20,
                "type": "string"
              }
            },
            "required": ["order_id", "order_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e1179564741c9ad91cf0605b275cbf059a24671cd3844c011324ea928cc07e71"
        },
        {
          "name": "get_plan",
          "title": "Get plan",
          "description": "Full details of one plan: all covered countries, data, days, phone number (if any), install rules, when validity starts, and notes. Read the notes to the person before create_order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "plan_id": {
                "description": "plan_id from list_plans",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:44aae1c6c14c3ffa7a8f9d56689de6522ba2f92c8a8d3812e8bffc5b9675540a"
        },
        {
          "name": "list_payment_coins",
          "title": "List payment coins",
          "description": "Coins and networks accepted for payment. Pass coin and network to create_order. Sending on a different network loses the funds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List payment coins"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b895715665696950480087fbff34e300dad8db2c09d62d914d00edd2f8a25d3"
        },
        {
          "name": "list_plans",
          "title": "List plans",
          "description": "List purchasable plans for a destination, cheapest first. type \"data\" = data-only eSIM: validity starts on first connection at the destination. type \"number\" = eSIM with a phone number, calls and SMS: validity starts at installation, so install it just before use; Europe plans give a French +33 number; the UK number plan must be installed only after arrival in the UK. For a country without its own plans, regional and world plans that cover it are returned. Prices are final USD prices; the crypto amount is set at create_order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Destination code from search_destinations, or a country ISO2 code",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "include_regional": {
                "description": "For a country: also return regional/world plans covering it",
                "type": "boolean"
              },
              "type": {
                "description": "\"data\" (default) or \"number\" (plan with a phone number)",
                "enum": ["data", "number"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:31484dcfaf4936a08663d66b13b2e1a2c5376ec3c6a291823c7beab79f6a296a"
        },
        {
          "name": "list_topups",
          "title": "List top-ups",
          "description": "Check whether an installed Cypher eSIM can be topped up and list the plans that can be added to it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "iccid": {
                "description": "ICCID of the installed eSIM (18-22 digits, printed in the eSIM settings)",
                "maxLength": 26,
                "minLength": 18,
                "type": "string"
              }
            },
            "required": ["iccid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List top-ups"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:54aabc5081d158631b4f75e4b558658ad89ff5f18ae01bbb59b4353fdfb70d32"
        },
        {
          "name": "search_destinations",
          "title": "Search destinations",
          "description": "Find a country, region or \"world\" destination by name or ISO code. Returns destination codes for list_plans (country: ISO2 like \"JP\"; region: like \"R-EUROPE\"; world: \"WORLD\"), starting prices in USD, and how many data and phone-number plans exist. An empty query lists all destinations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results, default 20",
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Country or region name, or ISO2 code, e.g. \"Japan\", \"JP\", \"Europe\"",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search destinations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d21942a9336681649641f9fc034357c99aedbee46712a5313c4ac69ac0d65ff"
        }
      ],
      "digest": "sha256:4ca17671de5eb9875b6b98edfea94af41db5cedb8cfea265118f2662d28710a9"
    }
  }
