          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ce2820ed86ff6ebd5f0eb1e1d7c44023514c4fb671b0f04c1fdc45c406f8cd9c"
        },
        {
          "name": "list_plans",
          "title": "List plans",
          "description": "List purchasable plans for a destination, cheapest first. type \"data\" = data-only eSIM: validity starts on first connection at the destination. type \"number\" = eSIM with a phone number, calls and SMS: validity starts at installation, so install it just before use; Europe plans give a French +33 number; the UK number plan must be installed only after arrival in the UK. For a country without its own plans, regional and world plans that cover it are returned. Prices are final USD prices; the crypto amount is set at create_order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Destination code from search_destinations, or a country ISO2 code",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "include_regional": {
                "description": "For a country: also return regional/world plans covering it",
                "type": "boolean"
              },
              "type": {
                "description": "\"data\" (default) or \"number\" (plan with a phone number)",
                "enum": ["data", "number"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:90cbda5bcdf1afcf6a7b304e326b7faad93b4ac2268ddcdc9b4e55207184f0da"
        },
        {
          "name": "list_topups",
          "title": "List top-ups",
          "description": "Check whether an installed Cypher eSIM can be topped up and list the plans that can be added to it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "iccid": {
                "description": "ICCID of the installed eSIM (18-22 digits, printed in the eSIM settings)",
                "maxLength": 26,
                "minLength": 18,
                "type": "string"
              }
            },
            "required": ["iccid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
