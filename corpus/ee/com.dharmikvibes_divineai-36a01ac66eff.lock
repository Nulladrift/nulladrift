        {
          "name": "search_darshan",
          "title": "Temples and darshan",
          "description": "Temples DharmikVibes lists for darshan and puja: place, facilities, the temple's own listed hours and the\n    pujas currently bookable there. Darshan timings are not verified by DharmikVibes; check with the temple.\n    VIP darshan is arranged by the DharmikVibes team on request. It books nothing.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Most temples to return, 1 to 20.",
                "maximum": 20,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
