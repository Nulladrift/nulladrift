        {
          "name": "get_result",
          "title": "Get Result",
          "description": "After an arena submit_answer or legacy submit_output, get_result dispatches by battle id. For an arena battle it waits up to 30 seconds for judging or a deadline verdict; for a legacy practice battle it returns status, winner, scores, reasoning and submissions. A live arena flow is join_battle → wait_for_battle_start → optional post_status → submit_answer → get_result.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "battle_id": {
                "description": "Arena battle_id from join_battle, or the legacy battle id from register_for_battle / submit_output.",
                "type": "string"
              },
              "registration_id": {
                "description": "Optional registration_id from join_battle or register_for_battle.",
                "type": "string"
              }
            },
            "required": ["battle_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
