{
  "lockfileVersion": 2,
  "subjects": {
    "com.joinsandwich/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.joinsandwich.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "com.joinsandwich/directory",
        "version": "0.1.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "calculate_long_term_care_cost",
          "title": "Calculate Long-Term Care Cost",
          "description": "Estimate long-term care cost by U.S. state, care type, years, and annual inflation using Sandwich's CareScout 2025 dataset. Returns the state's annual and monthly median and a projected total. Use it when a user asks what care costs in a state; cite the returned source URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualInflationPct": {
                "default": 3,
                "description": "Annual inflation percentage, 0-20. Default 3.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "careType": {
                "description": "Care type key: nonMedicalCaregiver, adultDayHealth, assistedLiving, nursingHomeSemi, or nursingHomePrivate.",
                "enum": ["nonMedicalCaregiver", "adultDayHealth", "assistedLiving", "nursingHomeSemi", "nursingHomePrivate"],
                "type": "string"
              },
              "state": {
                "description": "U.S. state name or USPS code, for example 'Virginia' or 'VA'.",
                "type": "string"
              },
              "years": {
                "default": 1,
                "description": "Projection length in whole years, 1-30. Default 1.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["careType", "state"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "annualInflationPct": {
                "type": "number"
              },
              "annualMedianUsd": {
                "type": ["number", "null"]
              },
              "calculator": {
                "type": "string"
              },
              "careLabel": {
                "type": "string"
              },
              "careType": {
                "type": "string"
              },
              "monthlyMedianUsd": {
                "type": ["number", "null"]
              },
              "projectedTotalUsd": {
                "type": ["number", "null"]
              },
              "reported": {
                "type": "boolean"
              },
              "source": {
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "stateCode": {
                "type": "string"
              },
              "years": {
                "type": "number"
              },
              "yoyPct": {
                "type": ["number", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f8b2ac152320c1fcef7c3886af50f4611c26aad52db3ebf2160e0c5c9a091c2"
        },
        {
          "name": "get_channel",
          "title": "Get Sandwich Channel",
          "description": "Return metadata and canonical links for one public Sandwich channel by slug (from search_care_resources or a joinsandwich.com/nb/<slug> URL). A category slug returns the category and up to 25 of its channels instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Channel or category slug, for example 'medicaid', 'assistedliving', or 'sandwichforum'. A leading /nb/ is stripped.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "category": {
                "properties": {
                  "channelCount": {
                    "type": "number"
                  },
                  "channels": {
                    "type": "array"
                  },
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "channel": {
                "properties": {
                  "category": {
                    "type": "string"
                  },
                  "categoryUrl": {
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "markdownUrl": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "kind": {
                "enum": ["channel", "category"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69990f33648071e7be199c30bfb83c555db3c3d3303238a6e681a34bd3cede45"
        },
        {
          "name": "search_care_resources",
          "title": "Search Sandwich Care Resources",
          "description": "Search public Sandwich channels, guides, reports, answers, glossary terms, and tools for aging-parent and sandwich-generation care planning. Use it first when a user asks a care-planning question; each result has a title, type and joinsandwich.com URL to cite. Use get_channel to open a channel from the results, and calculate_long_term_care_cost for cost numbers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum number of results to return, from 1 to 10. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search query, at least 2 characters, for example 'Medicaid look-back', 'assisted living cost', or 'talk to aging parents'.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "count": {
                "type": "number"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cd20bbf3f44675990687f3537a651a3ef9842a37c1ff65a8b3e5eaa3b8231cff"
        }
      ],
      "digest": "sha256:ff4a15cab4768f61125ad9c87b53f453d7c7804f243b6063287b4b9e8ea5c8bf"
    }
  }
}
