      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "calculate_long_term_care_cost",
          "title": "Calculate Long-Term Care Cost",
          "description": "Estimate long-term care cost by U.S. state, care type, years, and annual inflation using Sandwich's CareScout 2025 dataset.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualInflationPct": {
                "description": "Annual inflation percentage. Default 3.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "careType": {
                "description": "Care type key: nonMedicalCaregiver, adultDayHealth, assistedLiving, nursingHomeSemi, or nursingHomePrivate.",
                "enum": ["nonMedicalCaregiver", "adultDayHealth", "assistedLiving", "nursingHomeSemi", "nursingHomePrivate"],
                "type": "string"
              },
              "state": {
                "description": "U.S. state name or USPS code, for example 'Virginia' or 'VA'.",
                "type": "string"
              },
              "years": {
                "description": "Projection length in years. Default 1.",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["careType", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c2fe9ef8d91b0189dde249216ff7cc5222df04b1136015d34c048fce6e28f16e"
        },
        {
          "name": "get_channel",
          "title": "Get Sandwich Channel",
          "description": "Return metadata and canonical links for one public Sandwich channel by slug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Channel slug, for example 'medicaid', 'assistedliving', or 'sandwichforum'.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:629667a991e857d6c481da0bbd541b6bfb84b021f92116a9d15c95a85fa6e2a8"
        },
        {
          "name": "search_care_resources",
          "title": "Search Sandwich Care Resources",
          "description": "Search public Sandwich channels, guides, reports, answers, glossary terms, and tools for aging-parent and sandwich-generation care planning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum number of results to return, from 1 to 10. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Search query, for example 'Medicaid look-back', 'assisted living cost', or 'talk to aging parents'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
