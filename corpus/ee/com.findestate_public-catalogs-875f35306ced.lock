          "description": "Display up to ten previously returned FindEstate offer/project references as interactive cards. For a comparison request use compare_properties instead; it rereads current facts and opens its own comparison. This reference-only tool does not preserve the search filters that selected the references. For a map request, call search_findestate_map directly with the full requested filters and locale; do not render cards after that map tool. Pass only exact kind, catalogId and id references, plus locale. Every reference is fetched again through current GEO and MCP permission checks; never pass arbitrary card objects, text, image URLs or third-party links. Project images are labeled project imagery and are not photographs of a specific unit. Individual property cards include Request a viewing and I have questions actions with short guest forms inside ChatGPT. No FindEstate account is needed. Opening cards or a form sends no contact details and creates no request; the person must explicitly send. No property reservation, confirmed appointment, checkout or payments.",
