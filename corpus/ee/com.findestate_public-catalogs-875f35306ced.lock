        {
          "name": "submit_findestate_enquiry",
          "title": "Send a FindEstate enquiry",
          "description": "UI-only guest inbound contact submission after the person reviews the exact property/recipient, provides at least one contact, consents to sharing and explicitly presses Send. The server validates the encrypted intent, current publication and immutable recipient, and atomically records one native enquiry and owner-notification job. Contact details are unverified. Reuse the identical intent and payload only for an explicit retry; never silently submit, change targets, reserve property or confirm an appointment. No access to existing enquiries or private accounts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
