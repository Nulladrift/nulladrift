        {
          "name": "get_opportunity_radar",
          "title": "Radar de Oportunidades",
          "description": "Devolve a lista ranqueada de municípios de um critério do Radar de Oportunidades, no Brasil ou numa UF: polos (quociente locacional de uma atividade), potencial (dinamismo recente de emprego, empresas e PIB), concentracao (índice de Herfindahl-Hirschman do emprego formal) ou baixa-oferta (unidades da atividade por habitante abaixo da mediana de municípios parecidos). Cada item traz o escore e os componentes; a resposta traz o método, as fontes com período e a natureza Estimado.",
          "inputSchema": {
            "properties": {
              "criterion": {
                "description": "Critério: \"polos\", \"potencial\", \"concentracao\" ou \"baixa-oferta\".",
                "type": "string"
              },
              "limit": {
                "default": null,
                "description": "Quantos municípios devolver, de 1 a 100. Opcional; padrão 20.",
                "type": ["integer", "null"]
              },
              "sector": {
                "default": null,
                "description": "Seção da CNAE (letra de A a U, ex. \"C\" para indústria de transformação). Obrigatória em polos e baixa-oferta.",
                "type": ["string", "null"]
              },
              "uf": {
                "default": null,
                "description": "Sigla da UF para restringir a lista (ex. \"SC\"). Opcional; padrão é o Brasil.",
                "type": ["string", "null"]
              }
            },
            "required": ["criterion"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
