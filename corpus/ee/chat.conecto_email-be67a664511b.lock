        {
          "name": "account_dashboard_link",
          "title": "Get a link to an area at a glance",
          "description": "A one-time link to a page showing one area as it is when the page opens, for when the person you work for asks to see it themselves: a recruiter looks at the applicants, a bookkeeper at what is due. Do the work and answer with the area's own tools first; a link never replaces that. When an answer would be a long list they would rather look through, offer a link and make it once they say yes. The page is made from the area's own reads as this key, so it shows only what this key may see. It opens once and keeps for an hour; an unopened link ends after 7 days. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "enum": ["analytics", "code", "crm", "calendar", "chat", "account", "admin", "email", "helpdesk", "documents", "esign", "hiring", "outreach", "prospects", "lookups", "companies", "longlists", "mergers", "valuation", "newsletters", "notify", "projects", "schedules", "speech", "uptime", "vault", "web", "tables", "links", "images", "files", "forms", "helpcenter", "imports", "invoices", "books", "inventory", "whistleblowing", "connect", "microsoft365", "googleworkspace", "hubspot", "salesforce", "directory", "hr", "social", "purchasing", "phone", "websites", "views", "visibility", "markets"],
