        {
          "name": "account_erase_person",
          "title": "Erase a person's data",
          "description": "Erases one person across every area when they ask (GDPR Art. 17), once you know it is them (they wrote from that address, or confirmed it). Their CRM contact, chat visitor, past meetings and calls are anonymised, so deals stay without them, and a meeting they were only a guest at drops them; their chats, CRM history, form and routing form answers, job applications with the CV, newsletter subscriptions and events are deleted, and the call log's contents that name them are cleared. Kept, each with its reason in the result: accounting records, employment records, signed documents, the audit log, the account's own settings, upcoming meetings, and emails and tickets (outreach emails and replies too) unless correspondence is true. Their address goes on the suppression lists, so it is never mailed again: outreach campaigns stop for them at once. Can't be undone; the owner is emailed. A key of a team other than the company-wide one gets owner_required: pass the request to the owner. Free. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "correspondence": {
                "default": false,
                "description": "Also delete their emails and tickets, when no law requires keeping them.",
                "type": "boolean"
              },
              "email": {
                "description": "The person's email address.",
                "maxLength": 254,
                "type": "string"
              },
              "phone": {
                "description": "Their phone number in international format, like +1 503 555 0145.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
