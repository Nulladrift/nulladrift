            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "enc_pubkey": {
                "maxLength": 100,
                "type": "string"
              },
              "sign_pubkey": {
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["enc_pubkey", "sign_pubkey"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ea2e70a864a0b5c7b2b6513104ed9b044af9eecc02686de10dcf61c799a308d8"
        },
