            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "doc": {
                "default": "agents",
                "enum": ["agents", "llms", "security", "openapi", "agent_card"],
                "type": "string"
              },
              "max_chars": {
                "default": 20000,
                "maximum": 60000,
                "minimum": 500,
                "type": "integer"
