        {
          "name": "relm_create",
          "description": "Create a record. `data` is the object's fields (see relm_describe_schema). Custom fields must be registered first (relm_create_field). A contact needs at least one of: a name, an identifier (email/phone/linkedin_url), a company, or a custom field (email is unique per workspace) - don't invent a placeholder email.",
          "inputSchema": {
            "properties": {
              "data": {
                "type": "object"
              },
              "object": {
                "description": "Which core object.",
                "enum": ["contact", "company", "deal", "activity"],
                "type": "string"
              }
            },
            "required": ["data", "object"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
