      "instructions": "Relm - the CRM your agent owns. Call relm_describe_schema first to learn what objects, types and fields exist. On any 'unknown_value' error, read valid_options and either use a listed value or create it (relm_create_enum_value / relm_create_field / relm_create_type).",
