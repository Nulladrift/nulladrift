          "inputSchema": {
            "properties": {
              "actions": {
                "type": "array"
              },
              "conditions": {
                "type": "array"
              },
              "enabled": {
                "type": "boolean"
              },
              "name": {
                "type": "string"
              },
              "trigger_event": {
                "type": "string"
              }
            },
            "required": ["actions", "name", "trigger_event"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create automation rule"
          },
          "behavior": {
            "destructive": false,
