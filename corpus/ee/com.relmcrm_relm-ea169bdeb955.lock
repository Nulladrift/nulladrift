        },
        {
          "name": "relm_batch",
          "description": "Run up to 100 record writes in ONE call (contact/company/deal/activity) - the fast path for imports/migrations. operations: [{object, method:create|update|delete, data|patch, id?}]. Returns a per-op result array (partial success). Every op still counts against your quota (batch saves round-trips, not quota).",
          "inputSchema": {
            "properties": {
              "operations": {
                "items": {
                  "properties": {
                    "data": {
                      "type": "object"
                    },
                    "id": {
                      "type": "string"
                    },
                    "method": {
                      "enum": ["create", "update", "delete"],
                      "type": "string"
                    },
                    "object": {
                      "type": "string"
                    },
                    "patch": {
                      "type": "object"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["operations"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Batch write records"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:58941f6e9ad3cc90309231afe561cb7b01887a439ff6d024fd1ae77e2c41e517"
        },
