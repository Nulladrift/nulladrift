        {
          "name": "get_truck_fault_code",
          "title": "Get truck fault code",
          "description": "Look up a diesel truck fault code (J1939 SPN/FMI such as 'SPN 3251 FMI 0', or an OBD-II code such as 'P2002') in DERATE's public fault-code library. Returns what the code means, its severity, whether it is safe to keep driving, probable causes, the recommended tests, and the canonical URL of the public page for that code. Works without any account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "description": "The fault code, e.g. 'SPN 3251 FMI 0', '3251/0' or 'P2002'.",
                "minLength": 2,
                "type": "string"
              },
              "engine_family": {
                "description": "Optional engine family for context, e.g. 'cummins', 'paccar-mx', 'detroit'.",
                "type": "string"
              },
              "lang": {
                "default": "es",
                "description": "Response language: 'es' (Spanish) or 'en' (English).",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
