      "serverInfo": {
        "name": "derate",
        "title": "DERATE — truck fault codes",
        "version": "2.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only tools for DERATE. Start with `buscar_codigo`, `es_seguro_manejar`, `retiros_de_camion` and `get_data_notes` (lang 'en' default); every result includes a derate.app URL to cite. For guides and trucking news use `search_guides` then `get_guide` (full text and sources). Also: DERATE, a diesel truck fault-code and engine-derate assistant. Use `get_truck_fault_code` to look up one J1939 SPN/FMI or OBD-II code, `interpret_derate` for a free-text symptom or power-loss complaint, `search_fault_code_library` to search the public library, and `list_supported_engine_families` to check coverage, `get_pricing` for plans and prices (bought inside the native app), and `get_download_links` for the App Store / Google Play links. DERATE is a native iOS/Android app. `get_diagnosis`, `list_fault_codes` and `explain_fault_code` return the bundled demo diagnosis. All text is available in Spanish ('es') and English ('en').",
      "tools": [
        {
          "name": "buscar_codigo",
          "title": "Search truck fault code / Buscar código",
          "description": "Search DERATE's 56-code heavy-truck library by SPN/FMI, P-code or free text. Returns severity, derates yes/no, meaning, part and estimated part-price range, and the page URL. / Busca en la biblioteca de códigos de DERATE.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "en",
                "description": "Response language / Idioma: 'en' or 'es'.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "query": {
                "description": "SPN/FMI, P-code or free text.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
