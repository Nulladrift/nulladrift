        {
          "name": "vaultify_job_start",
          "description": "Submits options and queues a hide or reveal job for a session whose files have all been uploaded. Hide jobs support the full set of encoding options; reveal jobs only use upload_uid, password, and expiry. The call is idempotent. Requires X-Api-Key header.",
          "inputSchema": {
            "properties": {
              "expiry": {
                "description": "How long the result download link remains accessible after the job completes. Free-tier keys are silently clamped to the free-tier maximum (currently 1d); Pro accounts get the requested value.",
                "enum": ["1h", "12h", "1d", "2d", "1w", "1m"],
                "type": "string"
              },
              "output_format": {
                "description": "Hide only. Image format for stego output. All formats are lossless. Default: avif.",
                "enum": ["avif", "heic", "jp2", "jxl", "png", "webp"],
                "type": "string"
              },
              "packing_strategy": {
                "description": "Hide only. How secrets are distributed across covers. spread: alter each cover as little as possible (default). tight: pack multiple secrets per cover. quality: preserve visual quality above all else.",
                "enum": ["spread", "tight", "quality"],
                "type": "string"
              },
              "password": {
                "description": "Encryption password. Required for hide and reveal. At least 8 characters with mixed case, a digit, and a symbol.",
                "type": "string"
              },
              "scale_secret_to_fit": {
                "description": "Hide only. Auto-reduce secret size when it is too large to fit in its cover — images are resized, videos are compressed further. Set false to fail instead. Default: true.",
                "type": "boolean"
              },
              "secret_video_codec": {
                "description": "Hide only, video secrets. Codec for compressing secret videos. h265 gives ~40% smaller payloads. Default: h265.",
                "enum": ["h264", "h265"],
                "type": "string"
              },
              "secret_video_crf": {
                "description": "Hide only, video secrets. Compression quality for secret videos (lower = better quality, larger payload). Default: 28.",
                "maximum": 40,
                "minimum": 18,
                "type": "integer"
              },
              "strip_cover_metadata": {
                "description": "Hide only. Remove EXIF, GPS, and all embedded metadata from the stego output cover. Default: false.",
                "type": "boolean"
              },
              "strip_secret_metadata": {
                "description": "Hide only. Remove EXIF, GPS, and embedded metadata from secret files before hiding. Reduces payload size. Default: false.",
                "type": "boolean"
              },
              "upload_uid": {
                "description": "The upload_uid returned by vaultify_session_create",
                "type": "string"
              },
              "vault_profile_id": {
                "description": "Pro accounts only, hide jobs only. ID of a Vault Profile to use as an additional key factor. Vault profiles are created and managed at /vault in the web UI. Returns error code -32002 on free accounts.",
                "type": "integer"
              },
              "video_output_format": {
                "description": "Hide only, video covers. Lossless codec and container for stego video output. Default: ffv1_mkv.",
                "enum": ["ffv1_mkv", "huffyuv_avi", "lagarith_avi", "magicyuv_avi", "prores4444_mov", "prores4444xq_mov", "av1lossless_mkv"],
                "type": "string"
              }
            },
            "required": ["expiry", "password", "upload_uid"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
