        {
          "name": "snapwonders_convert_job_start",
          "description": "Submits conversion options and queues a media conversion job. Images and videos in the session are converted to the specified format. The call is idempotent. Requires X-Api-Key header.",
          "inputSchema": {
            "properties": {
              "expiry": {
                "description": "How long the converted files remain accessible after the job completes. Default: 1d. Free-tier keys are silently clamped to the free-tier maximum (currently 1d); Pro accounts get the requested value.",
                "enum": ["1h", "12h", "1d", "2d", "1w", "1m"],
                "type": "string"
              },
              "image_format": {
                "description": "Output format for image files. Default: jpeg.",
                "enum": ["jpeg", "png", "webp", "avif", "heic", "jxl"],
                "type": "string"
              },
              "image_quality": {
                "description": "JPEG/WebP output quality 1–100. Default: 85.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "image_resize_height": {
                "description": "Resize images to fit within this bounding-box height in pixels. Longest-edge fit, aspect preserved, no upscaling.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "image_resize_width": {
                "description": "Resize images to fit within this bounding-box width in pixels. Longest-edge fit, aspect preserved, no upscaling.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "pdf_dpi": {
                "description": "PDF only. Render resolution in DPI. Default: 150.",
                "maximum": 300,
                "minimum": 72,
                "type": "integer"
              },
              "pdf_page_from": {
                "description": "PDF only. First page to render, 1-based. Default: 1.",
                "minimum": 1,
                "type": "integer"
              },
              "pdf_page_to": {
                "description": "PDF only. Last page to render, 1-based. 0 means all pages. Default: 0.",
                "minimum": 0,
                "type": "integer"
              },
              "strip_metadata": {
                "description": "Strip EXIF/GPS/encoder metadata from output files. Default: false.",
                "type": "boolean"
              },
              "upload_uid": {
                "description": "The upload_uid returned by snapwonders_convert_session_create",
                "type": "string"
              },
              "video_crf": {
                "description": "Video CRF value 0–51 (lower = better quality). Default: 23.",
                "maximum": 51,
                "minimum": 0,
                "type": "integer"
              },
              "video_format": {
                "description": "Output format for video files. Default: mp4h264.",
                "enum": ["mp4h264", "mp4h265", "webm", "mkv", "mov"],
                "type": "string"
              },
              "video_max_dimension": {
                "description": "Resolution class cap: the shorter edge in pixels (1080 = 1920×1080 or 1080×1920). Never upscales. Omit for the highest resolution your plan allows.",
                "enum": [480, 720, 1080],
                "type": "integer"
              }
            },
            "required": ["upload_uid"],
            "type": "object"
          },
