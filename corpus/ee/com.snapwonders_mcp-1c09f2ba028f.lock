        {
          "name": "snapwonders_analyse_result",
          "description": "Returns clean forensic result JSON by job_uid — file names, grades (A–F), detection counts, and analysis asset IDs (face overlays, ELA maps, etc.). Each file also carries `summary_text` (a plain sentence saying why each grade is what it is — quote it to the user as is) and `explanation` (which category set each grade and what fired there). The job_uid is returned by snapwonders_analyse_job_start and snapwonders_analyse_job_results. Requires X-Api-Key header.",
          "inputSchema": {
            "properties": {
              "job_uid": {
                "description": "The job_uid returned by snapwonders_analyse_job_start or snapwonders_analyse_job_results",
                "type": "string"
              }
            },
            "required": ["job_uid"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1589c3b49e16b8a43e9d6a350c18ffdf71885319b8e3869c71c8733d56e71cc9"
        },
        {
          "name": "snapwonders_analyse_session_create",
          "description": "Creates an upload session for forensic media analysis. Returns the upload_uid and upload instructions. Upload each file with a single POST /api/upload carrying the file as the request body; its response reports ready_for_job_start, so no separate verification call is needed before snapwonders_analyse_job_start. Direct upload accepts files up to max_upload_bytes (returned in this response, currently 95 MB); anything larger must use the resumable TUS endpoint at /api/tus. Requires X-Api-Key header.",
          "inputSchema": {
            "properties": {},
            "required": [],
