          "description": "Returns the current status and per-item progress of an analysis job. Poll until status is \"completed\", \"partial\", or \"failed\". Requires X-Api-Key header.",
          "inputSchema": {
            "properties": {
              "upload_uid": {
                "description": "The upload_uid returned by snapwonders_analyse_session_create",
                "type": "string"
