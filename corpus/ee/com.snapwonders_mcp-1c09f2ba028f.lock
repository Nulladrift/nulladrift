      "tools": [
        {
          "name": "snapwonders_analyse_job_results",
          "description": "Returns per-item forensic analysis results including overall_grade (A–F; the Authenticity grade — edited, generated or re-encoded), exposure_grade (A–F; what the file gives away — privacy and hidden data), face_count, text_region_count, watermark_flagged (the known-generator decode only) and watermark_state (the one watermark verdict: found, declared, unconfirmed, unusual, not_checked, partial or none; none only when every watermark check ran and found nothing). Returns job_uid which can be passed to snapwonders_analyse_result for the clean summary. Requires X-Api-Key header.",
          "inputSchema": {
            "properties": {
              "upload_uid": {
                "description": "The upload_uid returned by snapwonders_analyse_session_create",
                "type": "string"
              }
            },
            "required": ["upload_uid"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4ac2af0557b056f94950307e95647e46c9a96b6de4a5cbfe0685d392ab13b65"
        },
        {
          "name": "snapwonders_analyse_job_start",
          "description": "Submits analysis options and queues a forensic analysis job. Returns upload_uid and job_uid. The call is idempotent. Requires X-Api-Key header.",
          "inputSchema": {
            "properties": {
              "expiry": {
                "description": "How long the analysis result remains accessible after the job completes. Default: 1d. Free-tier keys are silently clamped to the free-tier maximum (currently 1d); Pro accounts get the requested value.",
                "enum": ["1h", "12h", "1d", "2d", "1w", "1m"],
                "type": "string"
              },
              "face_detection": {
                "description": "Enable face detection. Default: true.",
                "type": "boolean"
              },
              "face_sensitivity": {
                "description": "standard: fewer false positives. thorough: catches more faces, with more false positives. Default: standard.",
                "enum": ["standard", "thorough"],
                "type": "string"
              },
              "forensic_depth": {
                "description": "standard: core forensic checks. deep: extended checks (reserved, currently identical to standard). Default: standard.",
                "enum": ["standard", "deep"],
                "type": "string"
              },
              "text_detection": {
                "description": "Enable OCR / text region detection. Default: true.",
                "type": "boolean"
              },
              "upload_uid": {
                "description": "The upload_uid returned by snapwonders_analyse_session_create",
                "type": "string"
              }
            },
            "required": ["upload_uid"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b16a104a99e3af3a437c6385ffabf722e0bf0061253b669b44f68f74d07de9dc"
        },
