            "readOnly": false
          },
          "digest": "sha256:e94337c082cecc76d11524f2519f781c8dfe702632636a94bdeb6cf46a2ed3a4"
        },
        {
          "name": "get_booking",
          "title": "Get a booking",
          "description": "One job with its status, driver, vehicle, plate and timeline once accepted.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
