{
  "lockfileVersion": 2,
  "subjects": {
    "com.limofarmout/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.limofarmout.com/api/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "limofarmout",
        "title": "LimoFarmOut booking",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LimoFarmOut books prepaid chauffeur and limousine jobs for a verified dispatcher or limousine company. Quote first (quote_trip), confirm the trip and total with the user, then book (book_trip) with an order_ref. Prices include tax. Follow a job with get_booking. Never contact the passenger outside the platform.",
      "tools": [
        {
          "name": "book_trip",
          "title": "Book a chauffeur trip",
          "description": "Book a prepaid job for verified chauffeurs. Within the agent key's limits and with a saved card it is paid and published at once; otherwise it waits for the account holder (waiting_for says why, pay_url is their link). Always confirm the trip details and the total with the user before calling. order_ref makes it safe to retry: the same order_ref never books twice.",
          "inputSchema": {
            "properties": {
              "airport_fee": {
                "type": "number"
              },
              "city": {
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2, e.g. CA, US, GB, AE.",
                "type": "string"
              },
              "dropoff_address": {
                "type": "string"
              },
              "flight_number": {
                "type": "string"
              },
              "hours": {
                "description": "For hourly services.",
                "type": "number"
              },
              "luggage": {
                "type": "integer"
              },
              "notes": {
                "type": "string"
              },
              "order_ref": {
                "description": "Your own order reference (idempotency key).",
                "type": "string"
              },
              "passenger_name": {
                "type": "string"
              },
              "passenger_phone": {
                "description": "International format; reached through a private line, never shown to the driver.",
                "type": "string"
              },
              "passengers": {
                "type": "integer"
              },
              "pay_by": {
                "description": "Only for a LimoFarmOut company account: its bookings are paid by LimoFarmOut after the trip (nothing charged now). Send 'card' to pay by card instead.",
                "enum": ["limofarmout", "card"],
                "type": "string"
              },
              "payout": {
                "description": "What the chauffeur is paid, all in, in the currency's main unit. Optional on quotes.",
                "type": "number"
              },
              "pickup_address": {
                "type": "string"
              },
              "pickup_local": {
                "description": "Pickup in local time, YYYY-MM-DDTHH:MM (no time zone).",
                "type": "string"
              },
              "service_type": {
                "enum": ["transfer", "airport_pickup", "airport_dropoff", "cruise_port", "train_station", "long_distance", "hourly", "wedding", "prom", "corporate", "event", "night_out", "tour", "funeral"],
                "type": "string"
              },
              "text": {
                "description": "The trip in plain words, e.g. \"Tomorrow 9:00 am, YYZ to Fairmont Royal York, SUV, $130\". Fields below win over what is read from the text.",
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone, e.g. America/Toronto.",
                "type": "string"
              },
              "vehicle_type": {
                "enum": ["sedan", "luxury_sedan", "suv", "luxury_suv", "minivan", "sprinter", "stretch_limo", "stretch_suv", "party_bus", "minibus", "coach", "jet_sprinter", "maybach", "rolls_royce", "classic_car", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db3387e9094255a5131db33e7b7b155d7f6becea42f0e62dc0817bc7db890dc5"
        },
        {
          "name": "cancel_booking",
          "title": "Cancel a booking",
          "description": "Cancel a job. The website's cancellation terms apply: once a job is published the platform fee is kept. Confirm with the user before calling.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
