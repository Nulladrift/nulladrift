      },
      "transport": {
        "type": "http",
        "url": "https://form.e-residence.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.e-residence/services",
        "title": "E-Residence",
        "version": "1.0.0",
        "websiteUrl": "https://e-residence.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "E-Residence (e-residence.com) handles official paperwork for foreigners remotely: the Spanish NIE, the Portuguese NIF and NISS, Spanish digital certificates, bank accounts, company formation, tax filings and more. Use search_services to find a service, get_service for its packages, prices and delivery times, and get_order_link for the link where the person orders. The person fills in the order form, pays and uploads documents on e-residence.com; a service whose ordering is \"contact\" is arranged by a manager after a message through the contact page. Quote package prices as given; a bundle saving (an extra added to the same order) is a separate offer, and the order form may open with some extras already ticked. These tools never place an order or take a payment.",
      "tools": [
        {
          "name": "get_order_link",
          "title": "Get the order link",
          "description": "The link where the person orders a service on e-residence.com, and the package to choose there. For a service whose ordering is \"contact\" it gives the contact page instead: a manager arranges that service. This tool orders and charges nothing: the person fills in the form, pays and uploads their documents on the site.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The package id the person chose (e.g. \"nie-spain-online-4weeks\"), or a service id when they have not chosen a package yet.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the order link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66d0cb482c1e35a6cdda925e247625a4c078470e6588e9cb1b88fe2e581b1e12"
        },
        {
          "name": "get_service",
          "title": "Get prices and details",
          "description": "One service in full: every package with its price and what it includes or how long it takes, and the add-ons its order form offers on the same order: their prices, whether the form opens with them already ticked, and any bundle saving with the package price it gives. Takes a service id or a package id from search_services.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A service id (e.g. \"nie\") or a package id (e.g. \"nie-spain-online-4weeks\") from search_services.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get prices and details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:be4098c0a6ef01bcd90b10296a4fbf4d07fbab6cdae4771d31dc7bd6b348aade"
        },
        {
          "name": "search_services",
          "title": "Search services",
          "description": "Finds E-Residence services by what the person needs: the Spanish NIE, the Portuguese NIF and NISS, the Spanish digital certificate, bank accounts in Spain or Portugal, company formation, tax filings and more. Returns each service with its packages and prices, how it is ordered (ordering \"online\" on an order form, or \"contact\" when an E-Residence manager arranges it after a message through the contact page), and an offer when adding an extra to the same order saves money. Package prices never include that saving. Leave out the query to list every service. Results come a page at a time: when next_offset is not null, call again with offset set to it for the next page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Only services for this country.",
                "enum": ["Spain", "Portugal", "Italy", "United States"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many services to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "How many results to skip: use next_offset from the previous call to get the next page.",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "What the person needs, in a few words, e.g. \"Spanish NIE\", \"Portuguese tax number\", \"bank account in Portugal\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3363863c1f3d218f2882fa6a584078a19dcadd4796020de842500ea365696c94"
        }
      ],
      "digest": "sha256:58ca5145bb801f93b0a5a898cc32e5c9863622d5b0b0241f9e96fd655b82529e"
    }
  }
}
