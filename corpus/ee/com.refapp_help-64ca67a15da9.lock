{
  "lockfileVersion": 2,
  "subjects": {
    "com.refapp/help": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://help-mcp.refapp.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "refapp-help",
        "title": "Refapp help",
        "version": "0.2.0",
        "websiteUrl": "https://www.refapp.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "How Refapp works, from Refapp's public help center. No sign-in and no customer data: it cannot look up candidates, projects or companies. Search with search_help in the language of the question, read an article with get_help_article and always link to it. Use explain_status for status labels shown in Refapp and explain_concept for what basic terms such as project or candidate mean.",
      "tools": [
        {
          "name": "explain_concept",
          "title": "Explain a Refapp concept",
          "description": "Explains what a basic Refapp concept is, such as a project, candidate, referee, questionnaire, report or project template. Accepts the name in any of Refapp's languages (e.g. \"Kandidat\", \"Prosjektmal\") or a short question that names it. Returns the name in each language and what it means; when nothing matches, lists the known concepts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "term": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a Refapp concept"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab7e50feadc6ae1349e2228b5159f8da259b9aa3418991dafce171a310371af2"
        },
        {
          "name": "explain_status",
          "title": "Explain a Refapp status",
          "description": "Explain a status shown in Refapp for a candidate, project or background check. Accepts the status as shown in the app in any of Refapp's languages (e.g. \"Försenade\", \"Review needed\") or its internal name (e.g. \"overdue\"). Returns the label in every language and what it means; when nothing matches, lists the known statuses.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "status": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a Refapp status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05340ab2f715235609ff57923b5473a430dcf015276fffe1b5b3af000939cb9b"
        },
        {
          "name": "get_help_article",
          "title": "Read a Refapp help article",
          "description": "Returns one article from Refapp's help center as plain text, with its links. Accepts support.refapp.com knowledge-base links only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "The article's link",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read a Refapp help article"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cddaee4f97101df5fe257aa93faa9993a96c21fadedd06702931d69a15d092be"
        },
        {
          "name": "search_help",
          "title": "Search Refapp help",
          "description": "Searches Refapp's help center (support.refapp.com) for articles on how to use Refapp, such as sending reminders to references, project settings or background checks. Returns the best matching articles with title, link, language and a short excerpt. When no article exists in the requested language, articles in other languages are returned.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "description": "Language of the question: sv, en, no (Norwegian) or da",
                "enum": ["sv", "en", "no", "da"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum articles, default 5",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A few keywords from the question, in the user's language",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Refapp help"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:908c09c5b243b3a7766b83e8b37d0d728cc26656dbeb2745f59b218ea872be10"
        }
      ],
      "digest": "sha256:0617f2bbcc7e2ca12e2993a1b6e57414fb7c7d99715792f98502d1afb8f5ca73"
    }
  }
}
