      "serverInfo": {
        "name": "rottenads",
        "title": "RottenAds affiliate network",
        "version": "1.0.0",
        "websiteUrl": "https://rottenads.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RottenAds is a performance affiliate network (Rotten Marketing LLC, Miami FL). Use search_offers to find CPL/CPA/RevShare offers by vertical, traffic type and geo; payouts are what RottenAds pays the publisher. Tracking links are issued only after a publisher account is approved. To join, use apply_as_publisher or apply_as_advertiser with the applicant's own details and consent; a person reviews every application and answers by email.",
      "tools": [
        {
          "name": "apply_as_advertiser",
          "title": "Apply as an advertiser",
          "description": "Send an advertiser application: an offer you want publishers to promote on a CPL/CPA/CPS/RevShare basis. Use the applicant's real details and only with their consent. Our team answers by email. Returns a reference.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "description": "If you are an AI agent applying on someone's behalf: your name/product, e.g. 'Claude for Acme Media'",
                "type": "string"
              },
              "allowed_traffic": {
                "description": "Traffic types you allow",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "caps": {
                "description": "Daily or monthly caps",
                "type": "string"
              },
              "company": {
                "description": "Company or brand name",
                "type": "string"
              },
              "country": {
                "description": "Country of the company",
                "type": "string"
              },
              "email": {
                "description": "Email where we send the answer (and the login, for publishers)",
                "type": "string"
              },
              "geos": {
                "description": "Countries the offer accepts",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "message": {
                "description": "Anything else we should know",
                "type": "string"
              },
              "name": {
                "description": "Full name of the person applying",
                "type": "string"
              },
              "offer": {
                "description": "What you want to promote: product/brand and offer type",
                "type": "string"
              },
              "offer_url": {
                "description": "Offer or landing page URL",
                "type": "string"
              },
              "payout": {
                "description": "Payout and model, e.g. '$25 CPL' or '40% RevShare'",
                "type": "string"
              },
              "telegram": {
                "description": "Telegram handle, if any (our account managers work on Telegram)",
                "type": "string"
              },
              "tracker": {
                "description": "Your tracking platform: Everflow, Hitpath, Cake, other",
                "type": "string"
              },
              "verticals": {
                "description": "Vertical(s) of the offer",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "website": {
                "description": "Website or LinkedIn",
                "type": "string"
              }
            },
            "required": ["email", "name", "offer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
