            "readOnly": false
          },
          "digest": "sha256:b3181fdb7b99f85d05745fc41ac478533930c4b691410751ce2d3ad56388b8f1"
        },
        {
          "name": "apply_as_publisher",
          "title": "Apply as a publisher",
          "description": "Send a publisher (affiliate) application to RottenAds. Use the applicant's real details and only with their consent. A person reviews it; if approved, the dashboard login is emailed to the applicant. Returns a reference.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "description": "If you are an AI agent applying on someone's behalf: your name/product, e.g. 'Claude for Acme Media'",
                "type": "string"
              },
              "company": {
                "description": "Company or brand name",
                "type": "string"
              },
              "country": {
                "description": "Country of the company",
                "type": "string"
              },
              "email": {
                "description": "Email where we send the answer (and the login, for publishers)",
                "type": "string"
              },
              "geos": {
                "description": "Countries you send traffic from, as two-letter codes",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "list_and_consent": {
                "description": "For email/SMS: how the list was built and how consent was collected",
                "type": "string"
              },
              "message": {
                "description": "Anything else we should know",
                "type": "string"
              },
              "monthly_volume": {
                "description": "Estimated monthly volume (clicks, leads or list size)",
                "type": "string"
              },
              "name": {
                "description": "Full name of the person applying",
                "type": "string"
              },
              "offer_ids": {
                "description": "Ids of offers from search_offers you want to run",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "telegram": {
                "description": "Telegram handle, if any (our account managers work on Telegram)",
                "type": "string"
              },
              "traffic_types": {
                "description": "Traffic you send: Email, SMS, Meta, TikTok, Native, Display, Search, Push, Path, ...",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "verticals": {
                "description": "Verticals you want to run, e.g. Telehealth, Insurance, Finance",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "website": {
                "description": "Website or LinkedIn",
                "type": "string"
              }
            },
            "required": ["email", "name", "traffic_types"],
            "type": "object"
          },
