        {
          "name": "search_offers",
          "title": "Search offers",
          "description": "Search the RottenAds offer catalog. Every filter is optional; results are ranked with offers converting now first. Payout is what RottenAds pays the publisher per conversion (or the RevShare %).",
          "inputSchema": {
            "properties": {
              "geo": {
                "description": "Two-letter country code the offer must accept, e.g. US, UK, CA, DE",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 20)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_payout": {
                "description": "Minimum fixed payout in the offer currency",
                "type": "number"
              },
              "model": {
                "description": "Payout model: CPL, CPA, CPS or RevShare",
                "type": "string"
              },
              "query": {
                "description": "Words to match in the offer name, vertical or restrictions, e.g. 'glp-1', 'auto insurance', 'roofing'",
                "type": "string"
              },
              "traffic": {
                "description": "Traffic type the offer must accept: Email, SMS, Meta, TikTok, Social, Native, Display, Search, Push",
                "type": "string"
              },
              "vertical": {
                "description": "Vertical name or part of it, e.g. Telehealth, Insurance, Finance, Home Services (see list_verticals)",
                "type": "string"
              }
