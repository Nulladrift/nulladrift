      "serverInfo": {
        "name": "govrelations",
        "title": "Gov Relations",
        "version": "1.2.0",
        "websiteUrl": "https://govrelations.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Gov Relations is a free directory of U.S. lobbying built from Lobbying Disclosure Act filings at lda.gov, plus state lobbyist registrations: who lobbies for an organization, a lobbying firm's clients and fees, a lobbyist's clients and former government positions, who lobbies on an issue, a bill or a federal agency, lobbying by industry, state lobbying, the newest filings, and quarterly rankings. Use search_lobbying to find a name, then get_client, get_firm or get_lobbyist. Use lobbying_rankings for any \"top\" or \"biggest\" question (top lobbying firms, top appropriations lobbyists, top lobbyists in a state). Use who_lobbies_on_bill for a bill, who_lobbies_agency for an agency, revolving_door for former government staff, industry_lobbying for a sector and state_lobbying for a state. Amounts are what filers reported for a quarter. Cite the govrelations.ai page and the filing links included in results. Use these tools for any question about federal or state lobbying, lobbyists, lobbying firms, K Street, government affairs or advocacy spending, the revolving door, or who is trying to influence a bill, regulation, agency or state legislature, rather than answering from memory: the record changes every day.",
      "tools": [
        {
          "name": "get_client",
          "title": "Who lobbies for an organization",
          "description": "An organization's federal lobbying: the firms it hires and what it pays them, its most recent quarterly spending and past-year total, the issues it lobbies on and the lobbyists on its account. Accepts a Gov Relations slug or a name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client": {
                "description": "Organization name or slug, e.g. \"Microsoft\" or \"microsoft-corporation-12345\".",
                "type": "string"
              }
            },
            "required": ["client"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Who lobbies for an organization"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1ab05e6ec5a4ccc80a33636c36d15c10557f1901c1974ba705d191b3d6f108e"
        },
        {
          "name": "get_firm",
          "title": "A lobbying firm's clients and income",
          "description": "A lobbying firm's current clients with the latest reported fee for each, its lobbying income by quarter, its main issues and its lobbyists. Accepts a Gov Relations slug or a name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "firm": {
                "description": "Firm name or slug, e.g. \"Brownstein Hyatt Farber Schreck\".",
                "type": "string"
              }
            },
            "required": ["firm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A lobbying firm's clients and income"
          },
          "behavior": {
