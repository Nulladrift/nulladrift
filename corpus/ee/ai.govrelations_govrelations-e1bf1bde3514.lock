            "readOnly": true
          },
          "digest": "sha256:1168ae973434e6e4814431f4fe2944f8823092be1b3c3c9edf699636e6b28b58"
        },
        {
          "name": "industry_lobbying",
          "title": "Lobbying by industry",
          "description": "An industry's federal lobbying over the past 12 months: the organizations in it that spent the most, their combined spending, and the lobbying firms with the most clients in it. Call with no industry to list the industries available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "industry": {
                "description": "Industry name, e.g. \"pharmaceuticals\", \"technology\", \"oil and gas\", \"banking\". Omit to list industries.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Lobbying by industry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de1e0ef3dbd736cb560b960c00be4c0f86c0df498fce38ef60b21050972898cc"
        },
        {
          "name": "latest_filings",
          "title": "Latest lobbying filings",
          "description": "The newest federal lobbying disclosures as they post to lda.gov: new registrations (a firm hired by a new client), terminations, quarterly reports and amendments, with client, firm, amount, issues and lobbyists. Optionally filter by kind, issue code or a name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "issue_code": {
                "description": "Optional three-letter LDA issue code, e.g. \"HCR\", \"DEF\", \"TAX\".",
                "type": "string"
              },
              "kind": {
                "description": "new = registrations, ended = terminations, reports = quarterly reports. Default all.",
                "enum": ["all", "new", "ended", "reports", "amended"],
                "type": "string"
              },
              "limit": {
                "description": "How many filings to return. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional company, firm or issue name to narrow to (past 12 months).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest lobbying filings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:faae2efb0c4222deb64304a57802f215454ee981325edea31b5a376385f671f1"
        },
        {
          "name": "lobbying_rankings",
          "title": "Lobbying rankings (top firms, lobbyists, spenders)",
          "description": "Ranked lists from the filings: the top lobbying firms by income, top spenders, top lobbyists by number of clients, former government officials who lobby, fastest-growing firms, most lobbied issues and agencies, by year, by issue (e.g. appropriations, health care, tax, defense), by industry, or by state (e.g. top lobbyists in Colorado). Every row has a source filing link. Use for any \"top\", \"biggest\", \"leading\" or \"best-known\" lobbying question.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "What to rank, in plain words, e.g. \"top lobbying firms 2026\", \"appropriations lobbyists\", \"health care lobbying spenders\", \"lobbyists in Colorado\", \"revolving door lobbyists\".",
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Lobbying rankings (top firms, lobbyists, spenders)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd7b5b2812c351b382a34ba16ef9ccb76cddfe106322e2a768a618022b05a780"
        },
        {
          "name": "quarter_rankings",
          "title": "Quarterly lobbying rankings",
          "description": "For one quarter: total disclosed federal lobbying spending, the top lobbying firms by income, the top spenders, and the busiest issues, with the change from a year earlier. Defaults to the latest quarter whose reports are due.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "quarter": {
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "year": {
                "maximum": 2100,
                "minimum": 2020,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quarterly lobbying rankings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5852af5f60d1e2a3aec74af707a3f4e2500bed2a4f0b79b3a3a4fe7805b5bd51"
        },
        {
          "name": "revolving_door",
          "title": "Lobbyists who worked in government",
          "description": "Registered federal lobbyists who disclosed working for a given government office: a member of Congress, a committee, a chamber, the White House or an agency (the revolving door). Ranked by recent lobbying activity, with each person's current firm and the matching former positions. Optionally narrow to lobbyists active on one issue.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "issue": {
                "description": "Optional issue to narrow to, e.g. \"health\", \"defense\" or a three-letter LDA code such as \"TAX\".",
                "type": "string"
              },
              "office": {
                "description": "The former office, e.g. \"Senator Shelby\", \"Senate Finance Committee\", \"House Appropriations\", \"White House\", \"FDA\".",
                "type": "string"
              }
            },
            "required": ["office"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Lobbyists who worked in government"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:866ffa6b14a95c44126431f6600e610313dc98572fc62bf116ce2a6c22168aaa"
        },
        {
          "name": "search_lobbying",
          "title": "Search lobbyists, firms and clients",
          "description": "Find registered federal lobbyists, lobbying firms, clients (organizations that hire lobbyists), issues, agencies and bills by name. Returns matches with their Gov Relations page. Use it first to turn a name into a slug for get_firm, get_client or get_lobbyist.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A name or part of one, e.g. \"Pfizer\", \"Akin Gump\", \"Jane Smith\", \"defense\".",
                "type": "string"
              },
              "type": {
                "description": "Limit to one kind of result. Default any.",
                "enum": ["any", "lobbyist", "firm", "client", "issue", "agency", "bill"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search lobbyists, firms and clients"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f65d0c6f51238db9ed923f14fa3d57c822af12dad13b07527bed0494848ef46d"
        },
        {
          "name": "state_lobbying",
          "title": "State lobbying",
          "description": "Lobbying at the state level, from state lobbyist registration records. With a state only: how many lobbyists and clients it has and the busiest clients and firms. With a state and a name: the matching clients, firms and lobbyists in that state and who lobbies for whom, with pay where the state discloses it. With a name only: the states where an organization has registered lobbyists. Coverage grows as more states are added; the result lists the states available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Optional organization, firm or lobbyist name, e.g. \"Amazon\".",
                "type": "string"
              },
              "state": {
                "description": "Two-letter code or state name, e.g. \"TX\" or \"New York\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "State lobbying"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1e64763c36ff16c526b27d7193a9dbdc3d08270e28cd02543959d89e4efe756"
        },
        {
          "name": "who_lobbies_agency",
          "title": "Who lobbies a federal agency",
          "description": "The lobbying firms and the organizations that reported lobbying a given federal agency or chamber in the past 12 months, ranked by the number of reports naming it, with each organization's past-year lobbying spending. E.g. FDA, EPA, Department of Defense, Treasury, FCC, the White House, the Senate.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agency": {
                "description": "Agency name or acronym, e.g. \"FDA\", \"Pentagon\", \"Federal Communications Commission\".",
                "type": "string"
              }
            },
            "required": ["agency"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Who lobbies a federal agency"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d81b388cd9ec1a7c10d137c59700121ab41c995625353ddd7e492a07b65c72fe"
        },
        {
          "name": "who_lobbies_on",
          "title": "Who lobbies on an issue",
          "description": "The lobbying firms and lobbyists most active on a policy issue over the past 12 months, ranked by the number of disclosed lobbying activities. Issues are the LDA general issue areas, e.g. Health Issues, Defense, Taxation, Energy, Trade, Immigration, Agriculture, Telecommunications.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "issue": {
                "description": "Issue name, slug or three-letter LDA code, e.g. \"health\", \"Defense\", \"TAX\".",
                "type": "string"
              }
            },
            "required": ["issue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Who lobbies on an issue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17c4641acbd377346347412f629ba4c16ab6d5847c3a6d64f9ad259280c73b3d"
        },
        {
          "name": "who_lobbies_on_bill",
          "title": "Who lobbies on a bill",
          "description": "The companies and organizations whose lobbying reports name a specific bill in Congress, and the lobbying firms each one uses on it, with the bill's title, sponsor and latest action. Accepts a bill number (e.g. \"H.R. 1\", \"S. 1582\", \"HR 4366\") or words from its title (e.g. \"GENIUS Act\", \"farm bill\").",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bill": {
                "description": "Bill number or title words, e.g. \"H.R. 3633\" or \"CLARITY Act\".",
                "type": "string"
              },
              "congress": {
                "description": "Congress number, e.g. 119 for 2025 and 2026. Default the current Congress.",
                "maximum": 200,
                "minimum": 110,
                "type": "integer"
              }
            },
            "required": ["bill"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Who lobbies on a bill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e65505845f273dfbf6c018a0577c3b01027247e227d7f9f4a7f33fd461596f2b"
        }
      ],
