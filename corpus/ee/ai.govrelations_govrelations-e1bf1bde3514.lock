          },
          "digest": "sha256:34c5d7403d882a9845fff57846876d6427d1fb6e9d2b44c83aa7e5e46631a4b9"
        },
        {
          "name": "get_lobbyist",
          "title": "A lobbyist's clients and background",
          "description": "A registered federal lobbyist: current firm, clients in the past year, main issues, and the government positions they disclosed (the revolving door). Accepts a Gov Relations slug or a name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lobbyist": {
                "description": "Lobbyist name or slug.",
                "type": "string"
              }
            },
            "required": ["lobbyist"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A lobbyist's clients and background"
          },
          "behavior": {
