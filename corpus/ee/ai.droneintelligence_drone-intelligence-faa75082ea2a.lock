            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "awardee_contains": {
                "description": "Substring match on the awardee, e.g. \"DroneShield\"",
                "type": "string"
              },
              "layer": {
                "description": "Substring match, e.g. \"Defeat-kinetic\", \"Detect\", \"Integrate\"",
                "type": "string"
              },
              "theatre": {
                "description": "Substring match, e.g. \"United Kingdom\" or \"Europe\"",
