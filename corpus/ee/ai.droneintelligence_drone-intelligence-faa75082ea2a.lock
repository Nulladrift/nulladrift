          "title": "Query the vendor matrix",
          "description": "Query the 43-vendor counter-UAS matrix: each vendor's product, a quoted description and its source. Filter by layer or vendor name. Requires a tracker licence token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
