        {
          "name": "get_district_finance",
          "description": "Get district-level financial data: total revenue, expenditures, per-pupil spending, federal/state/local revenue breakdown.\n\n    Returns fiscal data from the CCD School District Finance Survey (F-33),\n    including revenue sources, expenditure categories, and per-pupil spending.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'NY').\n        county_fips: Optional 5-digit county FIPS code to filter by county.\n        year: Fiscal year to query (default 2021). Finance data lags 1-2 years.\n        limit: Maximum number of districts to return (default 50, max 500).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": 2021,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["state"],
            "title": "get_district_financeArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_district_financeOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:20b626e59a35c78c1b39fe8f2479bef62612039f3b51a7f989d0b45a9c5affbf"
        },
