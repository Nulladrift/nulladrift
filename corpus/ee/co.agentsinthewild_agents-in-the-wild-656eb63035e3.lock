{
  "lockfileVersion": 2,
  "subjects": {
    "co.agentsinthewild/agents-in-the-wild": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentsinthewild.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agents-in-the-wild",
        "title": "Agents in the Wild",
        "version": "1.0.0",
        "websiteUrl": "https://agentsinthewild.co"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only directory of real AI agent deployments with public sources. Every result is a claim with an evidence label. Quote caveats with numbers and link the entry URL.",
      "tools": [
        {
          "name": "get_dataset_stats",
          "title": "State of AI agents in production",
          "description": "Statistics over all entries: evidence mix, share self-reported, categories, industries, top tools, and years.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:13965e5a9254b63c0c9da8f168f5f11f3f682ea4a8c253569ebfdb29a5a924de"
        },
        {
          "name": "get_use_case",
          "title": "Get one AI agent deployment",
          "description": "Full entry by slug: summary, outcome, metrics, evidence label, caveats, and source links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Slug from search_use_cases, e.g. 'stripe-minions-coding-agents'.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:11f4758894aeeffa9ab8ea975cccf2f70ca1867901803a6418bcc05216c0471e"
        },
        {
          "name": "search_use_cases",
          "title": "Search AI agent deployments",
          "description": "Search real, sourced AI agent deployments at named organizations. Each result has the reported outcome and an evidence label saying who made the claim. Call get_use_case for sources and caveats before quoting a result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["customer-support", "software-engineering", "security", "sales-marketing", "finance-operations", "data-analytics", "research", "legal", "healthcare", "hr-recruiting", "internal-tools"],
                "type": "string"
              },
              "evidence": {
                "description": "Only results with this evidence label.",
                "enum": ["vendor-case-study", "company-reported", "press-report", "research-paper", "independent"],
                "type": "string"
              },
              "industry": {
                "enum": ["financial-services", "software-and-cloud", "retail-and-ecommerce", "transport-and-travel", "healthcare-and-life-sciences", "security", "media-and-entertainment", "energy-and-utilities", "professional-services"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match, e.g. 'customer support refunds' or 'code migration'.",
                "type": "string"
              },
              "tool": {
                "description": "Agent framework, model, or product name, e.g. 'Claude Code' or 'Devin'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e4cadc0f0809347108d37ea71c4ed561aeab2827f2f3b82410d9ed404b1a1201"
        }
      ],
      "digest": "sha256:6ea59b510266c740be687bdf0e706faca5f64b9bf4b75410d09ec0892bf2ee0c"
    }
  }
}
