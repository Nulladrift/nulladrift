      "instructions": "Subtensor Reference API — Bittensor blockchain documentation.\nRuntime v486, 28 pallets, 1596+ items. 7 tools, all accept format=\"text\"|\"json\".\n\nDISCOVERY PATTERN:\n1. subtensor_list(category=\"pallets\") → see all pallets\n2. subtensor_lookup(type=\"pallet\", name=\"SubtensorModule\") → item names\n3. subtensor_lookup(type=\"event\", pallet=\"SubtensorModule\", name=\"StakeAdded\") → full details\n4. subtensor_search(query=\"stake\") → find by keyword\n5. subtensor_explain(topic=\"concept\", name=\"staking\") → understand domain\n\nTOOLS:\n- subtensor_search: Find items by keyword across all types\n- subtensor_lookup: Get details on a pallet, event, call, storage, constant, error, or type\n- subtensor_list: Browse pallets, events, calls, storage, constants, errors, types, runtime APIs, mechanisms, workflows\n- subtensor_explore: Relationships, changelogs, removed items, migration guides, runtime versions\n- subtensor_explain: Concepts, workflows, mechanisms, runtime APIs/errors, extrinsic format, code examples\n- subtensor_preferences: Get/set session language, node URL, node type\n- subtensor_decode: Decode SCALE hex into labelled fields (RAO→TAO, hex→SS58)\n\nUNITS: Balances in RAO (1 TAO = 10^9 RAO). Accounts as SS58 prefix 42.\nKEY PALLETS: SubtensorModule (staking/neurons/subnets), Balances (TAO transfers), System (runtime info).\n\nFree reference API. No auth required. Powered by subtensor.com (bittensor.ai).",
      "tools": [
        {
          "name": "subtensor_decode",
          "title": "Decode SCALE data",
          "description": "Decode SCALE-encoded hex into labelled fields with RAO→TAO and hex→SS58 conversions applied. Omit pallet and name to identify an event or call from its two-byte (pallet index, item index) prefix — the usual case when you have bytes and want to know what they are.",
          "inputSchema": {
            "properties": {
              "format": {
                "description": "Response format: 'text' (compact, default) or 'json' (structured)",
                "enum": ["text", "json"],
                "type": "string"
              },
              "hex": {
                "description": "SCALE-encoded bytes as hex, with or without a 0x prefix. Whitespace is ignored.",
                "type": "string"
              },
              "kind": {
                "description": "What the bytes are: 'event' (default), 'call', or 'value' for a bare value of a given type",
                "enum": ["event", "call", "value"],
                "type": "string"
              },
              "name": {
                "description": "Event or call name. Must be given together with \"pallet\".",
                "type": "string"
              },
              "pallet": {
                "description": "Pallet of the event or call. Omit together with \"name\" to identify the item from the byte prefix instead.",
                "type": "string"
              },
              "type": {
                "description": "For kind=\"value\": the SCALE type to decode against, e.g. \"u64\", \"AccountId\", \"Vec<u16>\", \"Option<u32>\"",
                "type": "string"
              }
            },
            "required": ["hex"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "fields": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "conversion": {
                      "type": "string"
                    },
                    "display": {
                      "type": "string"
                    },
                    "error": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "raw": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    },
                    "value": {}
                  },
                  "required": ["raw", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "input": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "trailing_bytes": {
                "type": "string"
              }
            },
            "required": ["fields", "input", "kind", "trailing_bytes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
