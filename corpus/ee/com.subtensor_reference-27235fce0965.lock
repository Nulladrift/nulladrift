        {
          "name": "subtensor_lookup",
          "title": "Look up Subtensor item",
          "description": "Get detailed info about a specific pallet, event, call, storage item, constant, error, SCALE type, RPC method, protocol account, or EVM precompile. Accepts URN identifiers with optional #field.path drilling.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "For type=\"account\": an SS58 address to identify. Returns which protocol account it is, including the sub-index, or reports that it is an ordinary wallet.",
                "type": "string"
              },
              "format": {
                "description": "Response format: 'text' (compact, default) or 'json' (structured)",
                "enum": ["text", "json"],
                "type": "string"
              },
              "include": {
                "description": "For pallet lookup: filter to a specific item type with descriptions",
                "enum": ["events", "calls", "storage", "constants", "errors"],
                "type": "string"
              },
              "include_history": {
                "description": "Include full argument signatures for each version range (events/calls only)",
                "type": "boolean"
              },
              "include_removed": {
                "description": "Include removed/historical items (default: false)",
