        {
          "name": "subtensor_explain",
          "title": "Explain Subtensor concepts",
          "description": "Understand Bittensor concepts, workflows, mechanisms, runtime APIs, runtime errors, extrinsic format, or get code examples.",
          "inputSchema": {
            "properties": {
              "enum_slug": {
                "description": "For runtime_errors: get a specific error enum",
                "enum": ["dispatch", "token", "arithmetic", "transactional", "trie", "module"],
                "type": "string"
              },
              "format": {
                "description": "Response format: 'text' (compact, default) or 'json' (structured)",
                "enum": ["text", "json"],
                "type": "string"
              },
              "item_type": {
                "description": "For examples: type of item to generate code for",
                "enum": ["storage", "call", "event"],
                "type": "string"
              },
              "language": {
                "description": "For examples: filter to one language (overrides session preference)",
                "enum": ["typescript", "python-bt", "python-sub", "rust"],
                "type": "string"
              },
              "name": {
                "description": "Topic-specific name: concept name ('staking'), workflow ID ('add-stake'), mechanism ID ('yuma-consensus'), runtime API name ('NeuronInfoRuntimeApi'), or item name for examples",
                "type": "string"
              },
              "node_type": {
                "description": "For examples: 'lite' (current state) or 'archive' (historical patterns)",
                "enum": ["lite", "archive"],
                "type": "string"
              },
              "node_url": {
                "description": "For examples: WebSocket endpoint override",
                "type": "string"
              },
              "pallet": {
                "description": "Pallet name — required for examples (e.g., 'SubtensorModule')",
                "type": "string"
              },
              "preferences": {
                "description": "Preferences handle from subtensor_preferences(action=\"set\"). Carries language/node_url/node_type without a session. Explicit arguments on this call take precedence over the handle.",
