      "instructions": "Call these when a question turns on a specific paper's citations, references, support, refutation or replication record, or when a reference is about to be cited and should be grounded first; identify the work by DOI, arXiv id or OpenAlex id. CiteStamp grounds citations against a typed, identity-resolved graph that hard-separates asserted (human-signed) from inferred (machine-derived) edges. Every result carries a tier, an attribution, and provenance. Most inferred edges are attributed openalex-snapshot: bulk citation metadata projected from OpenAlex, which publishes it at source. The rest are openalex-extracted reference lists and zenodo-depositor-declared relations from CiteStamp's own sweeps; a small typed tier of supports/refutes edges is attributed forrt-fred - replication outcomes (successful/failed) coded by the FORRT Replication Database, CC BY 4.0 per edge, not signed claims. Inferred edges are not independent of the metadata they were derived from, and a sparse answer means the sweeps have not reached a work yet rather than that nothing cites it. Prefer asserted_only=true when you want only human-signed claims; leave it false for the broader recall. ANSWERS ARE PAGED: a well-cited work has thousands of edges and every result carries a page object with has_more and, where it is exact, inferred_total. Do not read one page as the complete answer - raise limit (max 1000) or page with offset while has_more is true, advancing by the limit you asked for rather than by the number of rows returned. Separate from the graph, retraction_listing reports whether the Retraction Watch database lists a DOI as retracted, from a dated export with its own attribution and licence; it does not check the publisher record. Before citing a reference, check_reference takes a DOI or the reference as written and says whether it resolves to a real work: found, confirm (with the reason), not found in the named sources on a date, or couldn't check. It reads Crossref, DataCite and doi.org, which answers for every DOI agency, and PubMed for a PubMed ID given without a DOI. A not-found is not proof that a work was never published.",
      "tools": [
        {
          "name": "check_reference",
          "title": "Check reference",
          "description": "Whether a reference resolves to a real work. Use when an answer is about to cite a paper. Give a DOI, arXiv id, PMID or reference as written. Answers found, confirm (with the reason), not found in the named sources on a date, or couldn't check. A not-found is not proof a work was never published.",
          "inputSchema": {
            "properties": {
              "identifier": {
                "description": "The reference to check: a DOI (10.x/y, doi:10.x/y or a doi.org URL), an arXiv id, a PubMed ID (PMID: 12345678), or the reference as written (a title or a full citation)",
                "type": "string"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:998877197e40421068286b2b9fc1dc11fc1034ddee755a0da233f694e8e3576c"
        },
        {
          "name": "edges_about",
          "title": "Edges about",
          "description": "Every edge touching the given work in either direction, each tagged asserted|inferred with attribution and provenance. Use when a user asks 'what is known about this paper's citations' or wants the whole neighbourhood in one call. Paged.",
          "inputSchema": {
            "properties": {
              "asserted_only": {
                "default": false,
                "description": "If true, restrict to human-signed (asserted) edges. If false (default), return both asserted and machine-inferred edges.",
                "type": "boolean"
              },
              "identifier": {
                "description": "DOI, arXiv id, OpenAlex id, or internal claim id",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "description": "Maximum edges to return per tier (default 100, max 1000). Well-cited works have thousands; the response reports has_more and inferred_total so you can tell a page from the whole answer.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "How many edges to skip, for paging. Advance by the LIMIT you asked for, not by the number of results you got back — duplicates are removed after the window is taken, so a page can return fewer rows than it consumed. Keep going while has_more is true.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "annotations": {
