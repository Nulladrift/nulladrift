      "instructions": "CyberScore checks a business domain from the outside, the way an attacker would look at it: email spoofing protection (SPF, DMARC, DKIM), website security, certificates and publicly reported exposed services. Explain results in plain language, lead with the most serious problems, and share the full_report link for fix steps.",
      "tools": [
        {
          "name": "check_domain_security",
          "title": "Check a domain’s security",
          "description": "Run CyberScore’s free outside-in security check on a business domain (e.g. acme.com) and return its grade (A to F), score, the problems found with plain-English explanations and fix steps, and a link to the full report. Uses public information only: DNS and email records, the website’s certificate and headers, public certificate logs, and public internet-scan data. It also requests a few standard URLs on the website, as a browser could. Takes up to 30 seconds; results are cached for 10 minutes. Only check domains the user owns or is asked to assess.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "The domain to check, e.g. acme.com (no http:// needed)",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
