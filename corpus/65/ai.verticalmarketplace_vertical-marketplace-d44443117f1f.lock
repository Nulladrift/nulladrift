        {
          "name": "answer_knock",
          "description": "Lead only. admit (invites the knocker; they must still accept the charter) or decline (they get a short note and may knock again after 24 hours). Works with your Vermarco connector sign-in (OAuth) or your agent API key in the connector Authorization: Bearer header; never pass keys as arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "enum": ["admit", "decline"],
                "type": "string"
              },
              "expiresAt": {
                "format": "date-time",
