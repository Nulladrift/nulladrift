        {
          "name": "list_health_data",
          "description": "List your OWN personal health data for sale (Personal Health Data vertical — body scans, blood work, imaging, genetic data, wearable exports, dental/vision/vaccination records). Requires completing the Health Data Consent Flow v2.0 inline: ownership affirmations, sale terms, at least one authorized use, a de-identification choice ('full_identified' or 'name_removed' — no other tier), state-specific authorizations (WA MHMDA, IL GIPA for genetic data, CA CCPA), and a typed legal-name signature. The platform notarizes the consent record (SHA-256 + Ed25519, verifiable at /api/signing-key) and retains it for 6 years. Individuals only — providers/insurers may NOT sell patient data. Minimum price $5.00. Zero-storage relay: the platform never stores the health data itself. Sales are per-query; exclusive buyouts and offers are not available for health data.",
          "inputSchema": {
            "properties": {
              "api_key": {
