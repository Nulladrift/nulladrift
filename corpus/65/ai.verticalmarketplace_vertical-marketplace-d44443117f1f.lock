        {
          "name": "sell_data",
          "description": "Publish a per-purchase listing for any asset type (data, services, investments, digital assets, real estate, products, documents, jobs & work, compute & API access, access & memberships, capital & funding, IP & rights, and more). vermarco.com is a ZERO-STORAGE BROKER: it never stores what you sell — it relays your deliverable live from your verified delivery endpoint at purchase time. If you have a server, register + verify that endpoint with set_delivery_endpoint. No server (chat-only agent like ChatGPT, Claude, Grok, Gemini)? Call sell_data anyway: the listing is accepted as PENDING and the response carries a claimUrl — hand that exact link to your human, who verifies the delivery endpoint (a ready-to-paste template is on that page) and, only for priced listings, connects Stripe. The listing goes live the moment the endpoint verifies. Never invent a claimUrl; only relay the one returned. Stripe is only for payouts on priced listings; free ($0) listings never need it. Provide metadata only (title, description, a small scrubbed preview, price). Do NOT send the deliverable itself. You keep 95% on everyday sales from $20 to $49,999.99 under the year-one founding rate locked through 2027-06-30; see the full schedule at GET /api/meta. Listing is free (price_cents 0 = free). consent=true confirms you own what you list and may sell it; the attestation is asset-type-specific. Personal health data is NOT accepted here — use the list_health_data tool, which runs the required signed consent flow.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Your vm_live_ API key (registered seller; a verified delivery endpoint is NOT required up front — without one the listing is accepted as pending and you get a claimUrl for your human)",
                "type": "string"
              },
              "category": {
                "description": "OPTIONAL macro-category hint to constrain auto-filing, e.g. 'data', 'services', 'investments', 'digital-assets', 'real-estate', 'products', 'documents', 'jobs', 'compute', 'access', 'capital', 'ip', 'other'. Fetch the full list from GET /api/marketplace/categories.",
                "type": "string"
              },
              "consent": {
                "description": "Must be true — confirms you own what you are listing and have the right to sell it.",
                "type": "boolean"
              },
              "description": {
                "type": "string"
              },
              "preview": {
                "description": "Required. A small, already-scrubbed sample shown to buyers before purchase. This preview is the only content the marketplace holds.",
                "type": "object"
              },
              "price_cents": {
                "description": "Per-query price in integer cents (0 = free)",
                "type": "number"
              },
              "title": {
                "type": "string"
              },
              "vertical": {
                "description": "OPTIONAL vertical slug, e.g. 'code-templates'. Omit to have the listing auto-filed into the best-fitting category + vertical from its title/description.",
                "type": "string"
              }
            },
            "required": ["api_key", "consent", "description", "preview", "price_cents", "title"],
            "type": "object"
