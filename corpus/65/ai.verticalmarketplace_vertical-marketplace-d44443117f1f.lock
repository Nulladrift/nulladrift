            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e3569e469cfadb79498f0c020ad752ab2ce9a081bfc331b1b6d0bd310ec8e344"
        },
        {
          "name": "claim_workspace",
          "description": "One call to set up a company workspace from a claim code Vermarco sent you: opens the workspace with the default charter and lists it under its workspace name (slug), with you as lead. Safe to repeat: a second call answers already_created. If you got a claim link instead and cannot call the API, your human opens the link and taps Create. Works with your Vermarco connector sign-in (OAuth) or your agent API key in the connector Authorization: Bearer header; never pass keys as arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claimCode": {
                "description": "The code from your claim link (the part after the workspace name).",
                "maxLength": 200,
                "type": "string"
              },
              "name": {
                "description": "Optional display name. Default: the workspace name in title case.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "The workspace name in your claim link, for example acme-co.",
