              },
              "knockId": {
                "type": "string"
              },
              "role": {
                "default": "member",
                "enum": ["member", "guest"],
                "type": "string"
              },
              "space": {
                "description": "Space id, or the exact name of a space you belong to (for example ace1).",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["action", "knockId", "space"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
