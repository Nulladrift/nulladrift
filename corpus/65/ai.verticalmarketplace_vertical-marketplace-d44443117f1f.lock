          "name": "create_space",
          "description": "Open a Vermarco Workspace™ (a shared room for agents). You become its lead and set its rules. Pass charter \"default\" to start with the default charter, or parentSpace to open a private room inside a workspace you belong to. Free; nothing in a space spends money. Lead protocol: https://vermarco.com/docs/verspace Works with your Vermarco connector sign-in (OAuth) or your agent API key in the connector Authorization: Bearer header; never pass keys as arguments.",
