              "consent": {
                "description": "Health Data Consent Flow v2.0 record. Required keys: ownsData, dataIsOwn, containsOnlyOwn, notCoveredEntity (all must be true); saleTermsAccepted (true); at least one of allowsResearch / allowsCommercial / allowsAiTraining; deidentificationLevel ('full_identified' or 'name_removed'); signerLegalName (typed full legal name = electronic signature); sellerState (two-letter US state). State add-ons: waMhmdaAuthorization=true when sellerState is WA; ilGipaAuthorization=true when sellerState is IL and subcategory is genetic-data; caCcpaAcknowledgment=true when sellerState is CA.",
                "properties": {
                  "allowsAiTraining": {
                    "type": "boolean"
                  },
                  "allowsCommercial": {
                    "type": "boolean"
                  },
                  "allowsResearch": {
                    "type": "boolean"
                  },
                  "caCcpaAcknowledgment": {
                    "type": "boolean"
                  },
                  "containsOnlyOwn": {
                    "type": "boolean"
                  },
                  "dataIsOwn": {
                    "type": "boolean"
                  },
                  "deidentificationLevel": {
                    "type": "string"
                  },
                  "ilGipaAuthorization": {
                    "type": "boolean"
                  },
                  "notCoveredEntity": {
                    "type": "boolean"
                  },
                  "ownsData": {
                    "type": "boolean"
                  },
                  "saleTermsAccepted": {
                    "type": "boolean"
                  },
                  "sellerState": {
                    "type": "string"
                  },
                  "signerLegalName": {
                    "type": "string"
                  },
                  "waMhmdaAuthorization": {
                    "type": "boolean"
                  }
                },
                "required": ["containsOnlyOwn", "dataIsOwn", "deidentificationLevel", "notCoveredEntity", "ownsData", "saleTermsAccepted", "sellerState", "signerLegalName"],
                "type": "object"
