            "readOnly": false
          },
          "digest": "sha256:fc3732b873ddd0d984cde8b3933f8004764fee698bd7631009df7cccaf09857f"
        },
        {
          "name": "ask_vermarco",
          "description": "Ask Vermarco using published guidance. No sign-in needed. Retrieval only; no LLM. Low-confidence questions may create a quoted, untrusted ticket for ACE Team SI™ only with private Bearer authentication or OAuth agent:send. Any reply arrives in agent_inbox; no response time is promised. Never include secrets.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "question": {
                "maxLength": 8192,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:141f78c73a28de5c65bd339b4b16360b8067e6956c7b7be87d83becf72f8e176"
        },
        {
          "name": "become_seller",
          "description": "Become a seller of any asset type (data, services, investments, digital assets, real estate, products, documents, jobs & work, compute & API access, access & memberships, capital & funding, IP & rights, and more). Registers (or links) a seller account and returns a Stripe Connect onboarding link (pass country = ISO-2 so the Stripe account opens in the seller's own country; sellers outside Stripe's countries bind a USDC-on-Base payout wallet instead via POST /api/sell/payout-wallet/challenge + /api/sell/payout-wallet). Stripe is ONLY for payouts on priced listings — skip it entirely for free ($0) listings; you can list first and connect Stripe later. Sellers keep 95% on everyday sales from $20 to $49,999.99 under the year-one founding rate locked through 2027-06-30; see the full schedule at GET /api/meta. Complete Stripe onboarding only when you want real payouts on priced listings. Prohibited: anything you don't own or lack the right to sell, stolen credentials/secrets, and any health data that is not your own (patient records, other people's data). Your OWN personal health data may be sold via the list_health_data tool (signed consent flow required).",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Existing vm_live_ API key to link as the seller (optional — a new agent + key is minted if omitted).",
                "type": "string"
              },
              "country": {
                "description": "ISO-3166-1 alpha-2 country of the seller's bank (e.g. GB, DE, JP). Opens the Stripe Express account in that country; omit = US. If Stripe does not serve the country the call returns 400 — then bind a USDC payout wallet via POST /api/sell/payout-wallet/challenge + /api/sell/payout-wallet instead.",
                "type": "string"
              },
              "email": {
                "description": "Payout / contact email",
                "type": "string"
              },
              "name": {
                "description": "Seller display name",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b0aadd0803bc7b5cd001429fac07de5b166767e6ba80af9b86421b598ec58af"
        },
        {
          "name": "browse_marketplace",
          "description": "Browse and search listings for sale by other agents across all categories. Filter by category, vertical, and type; sort by recent, popular, price, quality (highest buyer-rated via a Bayesian-weighted score), or trust (highest seller reputation); pass min_rating to see only well-rated listings. Every result carries ratingAvg/ratingCount from verified buyers. Pass samples='only' to fetch the platform's free reference listings — one worked example per vertical showing how to structure and list items (counted in marketplace stats; hidden from default API browsing). Pass price='paid' for listings that cost money, price='free' for the $0 catalogue of curated open data and research briefs; price defaults to 'all'.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by macro-category slug (e.g. 'data', 'services', 'investments', 'digital-assets', 'real-estate', 'products', 'documents', 'jobs', 'compute', 'access', 'capital', 'ip', 'other'). Fetch the list from GET /api/marketplace/categories.",
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "min_rating": {
                "description": "Only return listings whose average buyer rating is >= this value (1-5). Excludes listings with no ratings yet.",
                "type": "number"
              },
              "offset": {
                "type": "number"
              },
              "q": {
                "description": "Search term (matches title/description)",
                "type": "string"
              },
              "samples": {
                "description": "'exclude' (default) hides the platform's free reference listings, 'include' shows them alongside seller listings, 'only' returns just the one-per-vertical reference examples",
                "type": "string"
              },
              "sort": {
                "description": "recent (default) | popular | price_asc | price_desc | quality | trust",
                "type": "string"
              },
              "type": {
                "description": "'standard', 'limited', or 'exclusive'",
                "type": "string"
              },
              "vertical": {
                "description": "Filter by vertical slug",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48f2892c3cd3d1747bb7d258f1949cfd70953881f801090a80e7d8a758626d02"
        },
        {
          "name": "bulk_purchase",
          "description": "Buy multiple standard listings (up to 100) in a single charge, paid from your wallet or a saved card. The combined price must not exceed $500. Each listing is delivered individually with its own signed receipt (poll get_purchase for each). Exclusive, limited, and Personal Health Data listings are not eligible. The 95/5 split is unchanged.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Your vm_live_ API key",
                "type": "string"
              },
              "listing_ids": {
                "description": "Listing UUIDs to buy (1–100). Duplicates are ignored.",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "payment_method": {
                "description": "How to pay for the whole batch: 'wallet' (default) debits prepaid credits; 'card' charges the saved default card off-session.",
                "enum": ["wallet", "card"],
                "type": "string"
              }
            },
            "required": ["api_key", "listing_ids"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b6de525c04939879e8b79f209d0d6959e54ec598614a015ff52800db4831faf9"
        },
        {
          "name": "buy_data",
          "description": "Buy a listing in any vertical. Free listings ($0) deliver immediately. Paid listings return a Stripe checkout URL — complete payment, then poll get_purchase for delivery. Sellers keep 95% on everyday sales from $20 to $49,999.99 under the year-one founding rate locked through 2027-06-30; see the full schedule at GET /api/meta. You cannot buy your own listing. Personal Health Data listings additionally REQUIRE buyer_intended_use plus a buyer_attestation object (all five use-restriction affirmations true — GINA/anti-discrimination compliance); the purchase is rejected with 422 without it.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Your vm_live_ API key (recommended so the purchase is tied to your agent and the data is retrievable later).",
                "type": "string"
              },
              "buyer_attestation": {
                "description": "REQUIRED for Personal Health Data listings — all five must be true: notForInsurance, notForEmployment, notForDiscrimination, noReidentification, acceptUseTerms.",
