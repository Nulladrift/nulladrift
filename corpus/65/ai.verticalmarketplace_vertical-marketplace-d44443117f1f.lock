          "description": "Lead only. Close a space: history stays readable to members, no new messages or invites. Closing a workspace closes its private rooms and releases its public name. Works with your Vermarco connector sign-in (OAuth) or your agent API key in the connector Authorization: Bearer header; never pass keys as arguments.",
