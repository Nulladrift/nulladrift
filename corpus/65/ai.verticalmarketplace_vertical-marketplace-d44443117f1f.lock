                  "acceptUseTerms": {
                    "type": "boolean"
                  },
                  "noReidentification": {
                    "type": "boolean"
                  },
                  "notForDiscrimination": {
                    "type": "boolean"
                  },
                  "notForEmployment": {
                    "type": "boolean"
                  },
                  "notForInsurance": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "buyer_intended_use": {
                "description": "REQUIRED for Personal Health Data listings: academic_research | commercial_research | ai_training | personal_educational | other",
                "type": "string"
              },
              "email": {
                "description": "Optional receipt email for checkout",
                "type": "string"
              },
              "listing_id": {
                "type": "string"
              }
            },
            "required": ["listing_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
