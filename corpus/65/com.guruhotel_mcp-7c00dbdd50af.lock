{
  "lockfileVersion": 2,
  "subjects": {
    "com.guruhotel/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://guruhotel.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "guruhotel",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "GuruHotel is AI-native direct booking infrastructure for independent hotels: an AI-powered hotel website builder, direct booking engine and Stripe-powered payments. Use search_guruhotel_knowledge for open questions, get_product_facts for verified company/product facts, check_pms_compatibility when a hotelier asks whether their PMS works with GuruHotel, and get_page_markdown to read any page in full. All data is published, read-only knowledge; for anything unconfirmed, direct users to sales@guruhotel.com.",
      "tools": [
        {
          "name": "check_pms_compatibility",
          "description": "Check whether a specific hotel PMS (property management system) works with GuruHotel, e.g. 'Cloudbeds', 'Mews', 'Oracle OPERA'. Answers with the connection type (direct or via Channex) and next steps when unconfirmed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "pms_name": {
                "description": "PMS name as the hotelier says it, e.g. 'cloudbeds' or 'Little Hotelier'.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["pms_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check PMS compatibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1a8738f1a810765b1756ea4a1da817f593e85093e902f8d2836568135a5cb047"
        },
        {
          "name": "get_integrations",
          "description": "Full inventory of GuruHotel's PMS/connectivity integrations with their status: 'live' (direct), 'via-channex' (evidenced Channex connection), 'compatible' (works through Channex, confirmed during onboarding), 'beta' or 'unverified'. Same data as https://guruhotel.com/data/guruhotel-integrations.json.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "status": {
                "description": "Filter by integration status.",
                "enum": ["live", "via-channex", "compatible", "beta", "unverified"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GuruHotel integrations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5ae407d1e787f29a854c602c32127a4fd238b22927540fdf5c5218261bd5c26"
        },
        {
          "name": "get_page_markdown",
          "description": "Fetch the full markdown version of any GuruHotel page by its URL path (e.g. 'blog/how-ai-agents-book-hotels' or 'integrations/pms/cloudbeds'). Use search_guruhotel_knowledge first to discover pages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Content language (defaults to English).",
                "enum": ["en", "es", "it", "fr", "de"],
                "type": "string"
              },
              "slug": {
                "description": "Page path without domain, with or without leading slash or .md suffix.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get page markdown"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:26edb47bcf2c7adb8fde4625a6e39a101f27f141aac342710c5bc977c102023a"
        },
        {
          "name": "get_pricing",
          "description": "GuruHotel's published pricing model (commission-based with optional subscription plans). There is no public rate card; includes the pricing page URL and sales contact.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GuruHotel pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c826b3f2c1b57a0eed3cac39e8b6126c75a76d257a23824122c69ed84bbface"
        },
        {
          "name": "get_product_facts",
          "description": "Published, verified facts about GuruHotel the company and product: positioning, capabilities, traction metrics, payments (Stripe) and markets. Same data as https://guruhotel.com/data/guruhotel-product.json.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GuruHotel product facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52b9f3f2b55c0fcc5414275b2402f4214b4f77f845783a9b79170cddcdcf1623"
        },
        {
          "name": "search_guruhotel_knowledge",
          "description": "Search GuruHotel's published knowledge base: product pages, integration pages, and guides about direct bookings, hotel websites, booking engines, payments and AI/agentic booking. Returns matching pages with a snippet and a markdown mirror URL that can be fetched for the full content.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 5).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Content language (defaults to English).",
                "enum": ["en", "es", "it", "fr", "de"],
                "type": "string"
              },
              "query": {
                "description": "Free-text search query, e.g. 'multi currency checkout' or 'how AI agents book hotels'.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search GuruHotel knowledge"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e02bb5cf3c050ad1ee3c6df491c0cd7f6779600bb3b3be8f79849c982076158"
        }
      ],
      "digest": "sha256:d6c942f7a1bc1d7b1db775965181b05093f5e92eef62a3e4a529b51b127bcc53"
    }
  }
