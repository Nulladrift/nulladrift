      "serverInfo": {
        "name": "haulest",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Haulest helps people in the United States, Canada, and the United Kingdom plan a home move: research cost ranges, find and vet movers (dated reviews, licence records), and request written quotes from licensed movers. Haulest is a research and quote site, not a carrier: it does not operate trucks, and a range is a planning number, not a bid.\nTypical flow: estimate_moving_cost, then find_movers or check_mover_licence, then request_moving_quotes once the person has given name, phone, email, and explicit consent to be contacted. Always pass along the haulest.com URLs returned so the person can read the full page.\nHaulest phone: +1 (866) 961-9682 (US, Canada, UK callers; a planning conversation, not a booking). Do not invent a second phone number, a star total, or a binding price.\nDocumentation: https://haulest.com/developers/mcp?utm_source=mcp. Markets: us, ca, uk.",
      "tools": [
        {
          "name": "check_mover_licence",
          "title": "Check a mover's licence record",
          "description": "Looks a moving company up in the official register: for the United States, the FMCSA census by USDOT, MC, or legal name, with live operating authority, insurance on file, and safety rating when available; for the United Kingdom, Companies House by name or number. Returns the official record URL to confirm on. For Canada it explains the provincial checks instead. Use it before anyone pays a deposit or when a quote names a USDOT.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "market": {
                "description": "us (FMCSA, default), uk (Companies House), or ca (guidance only; Canada has no federal mover licence).",
                "enum": ["us", "uk", "ca"],
                "type": "string"
              },
              "query": {
                "description": "USDOT number, MC number, or company legal name (US); company name or number (UK).",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a mover's licence record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Licence record ready",
            "openai/toolInvocation/invoking": "Checking the official register"
          },
          "digest": "sha256:338f528102f483babd867f82c4ca6628ba7cd85c399dd2111b429a56cda75b27"
        },
        {
          "name": "estimate_moving_cost",
          "title": "Estimate moving cost",
          "description": "Returns Haulest's research planning range (low and high, with currency) for a household move in the United States, Canada, or the United Kingdom, from home size and distance. Pass a distance band, a mileage, or an origin and destination; the tool resolves the distance from stored route data where it can. The range is compiled from published industry tables and public quotes, not a bid from a mover. Use it when someone asks what a move might cost.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "distanceBand": {
                "description": "Distance band when known: local (under 50 mi; UK under 20), regional, mid, long, cross-country.",
                "enum": ["local", "regional", "mid", "long", "cross-country"],
                "type": "string"
              },
              "from": {
                "description": "Origin city or town, or a ZIP or postcode, e.g. \"Austin, TX\", \"78701\", or \"London\".",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "homeSize": {
                "description": "Home size: studio, 1bed, 2bed, 3bed, or 4bed (4bed covers larger homes).",
                "enum": ["studio", "1bed", "2bed", "3bed", "4bed"],
                "type": "string"
              },
              "market": {
                "description": "Country: us, ca, or uk. Inferred from the places when omitted; defaults to us.",
                "enum": ["us", "ca", "uk"],
                "type": "string"
              },
              "miles": {
                "description": "Driving distance in miles when the user already knows it.",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "to": {
                "description": "Destination city or town, or a ZIP or postcode.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["homeSize"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate moving cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Cost range ready",
            "openai/toolInvocation/invoking": "Looking up the Haulest cost range"
          },
          "digest": "sha256:408250501cfa7355ea7a33a34ab6755667b4a84ea535555c6c261a1c1d5db787"
        },
        {
          "name": "find_movers",
          "title": "Find movers near a place",
          "description": "Lists moving companies Haulest holds dated, attributed reviews for in a city, state, province, or country (US, Canada, UK), with the average rating, the number of reviews on record, the newest review date, the USDOT number where there is one, and the profile URL. Ratings are means of real reviews on record; Haulest does not rank companies by payment. Use it when someone wants movers in a place; follow with the profile tool for one company.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many companies to return, up to 10 (larger values return 10). Default 6.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Country to prefer when a place name exists in more than one: us, ca, or uk.",
                "enum": ["us", "ca", "uk"],
                "type": "string"
              },
              "minReviews": {
                "description": "Only companies with at least this many dated reviews on record.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "place": {
                "description": "City, state or province, country, or a ZIP or postcode, e.g. \"Denver, CO\", \"Ontario\", \"Manchester\", \"Canada\", \"80202\", \"M5V\".",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "sort": {
                "description": "recommended (default), newest review, highest rating, or lowest rating.",
                "enum": ["recommended", "newest", "highest", "lowest"],
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find movers near a place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Movers found",
            "openai/toolInvocation/invoking": "Searching Haulest's mover directory"
          },
          "digest": "sha256:e6ceada98410eee56e6eb17d1e2fe73df59dc258f2bc1c5bf8aa2280cd103556"
        },
        {
          "name": "get_mover_profile",
          "title": "Get a mover's profile",
          "description": "One moving company in detail from its Haulest profile: rating and review counts, the three newest dated reviews, licence identifiers (USDOT, MC) with the live FMCSA authority and insurance summary when available, the company's own phone number from a public record, what reviewers paid, short checkable strengths and questions to ask, and the profile URL. Use it after find_movers or when someone names a company that has a Haulest page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "The company slug from find_movers, or the last part of a haulest.com/movers/... URL.",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a mover's profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Profile ready",
            "openai/toolInvocation/invoking": "Opening the company profile"
          },
          "digest": "sha256:0ddb7510bd8e31c6c31db6cc804373d46c0665ebc228d1e6eb7d47e4915b6f85"
        },
        {
          "name": "get_moving_checklist",
          "title": "Get a moving checklist",
          "description": "Returns one of Haulest's checklists in full, grouped by section: the 8-week countdown, moving day, the first-night box, change of address for the US, Canada, or UK, or the 12-week international list. Use it when someone wants a to-do list for a move.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "list": {
                "description": "Which checklist.",
                "enum": ["8-week", "moving-day", "first-night", "change-of-address-us", "change-of-address-ca", "change-of-address-uk", "12-week-international"],
                "type": "string"
              }
            },
            "required": ["list"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a moving checklist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Checklist ready",
            "openai/toolInvocation/invoking": "Fetching the checklist"
          },
          "digest": "sha256:1bc9f8ff77800e33e62078807a2fbdef885ca40022a5b88fcecb132f3274e03f"
        },
        {
          "name": "get_route_facts",
          "title": "Get route facts",
          "description": "Facts about a city-to-city moving lane that Haulest has a route page for: driving miles and hours, the research cost range by home size, how many households moved between the two states in the latest Census flow, and the page URL. Covers the main US, Canadian, and UK lanes. Use it when someone names both ends of a move; returns a clear not-covered message otherwise.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "from": {
                "description": "Origin city, e.g. \"Austin\" or \"Austin, TX\".",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "to": {
                "description": "Destination city.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get route facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Route facts ready",
            "openai/toolInvocation/invoking": "Reading the route page"
          },
          "digest": "sha256:55fbe051ccca376f2f7a30cb6e08cd9bbdf9093aff37050d815d0d99dfd65e64"
        },
        {
          "name": "request_moving_quotes",
          "title": "Request moving quotes",
          "description": "Submits a quote request to Haulest so licensed movers can call and email the person with written estimates for the move. Haulest is not a carrier; it introduces the request to movers through its lead desk, and in the US and UK the desk may phone within minutes. Call this only after the person has given their name, phone, and email for this purpose and has explicitly agreed to be contacted (consent must be true); confirm the details back to them first. Each call creates one request; a repeat with the same phone or email within a day is recognised and not duplicated. Returns a request reference and what happens next.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "callWindow": {
                "description": "Best time to call.",
                "enum": ["now", "morning", "afternoon", "evening"],
                "type": "string"
              },
              "consent": {
                "description": "Must be true: the person has explicitly agreed that Haulest may share these details with licensed movers who will call and email about this move.",
                "type": "boolean"
              },
              "dateFlex": {
                "description": "How fixed the date is.",
                "enum": ["exact", "week", "month", "unsure"],
                "type": "string"
              },
              "email": {
                "description": "Their email.",
                "format": "email",
                "maxLength": 160,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "excludeMoverSlug": {
                "description": "Haulest slug of a company the person does NOT want quotes from, e.g. one they already have a quote from.",
                "maxLength": 160,
                "type": "string"
              },
              "from": {
                "description": "Where the move starts: city and state/province, or a postcode.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "homeSize": {
                "description": "studio, 1bed, 2bed, 3bed, or 4bed.",
                "enum": ["studio", "1bed", "2bed", "3bed", "4bed"],
                "type": "string"
              },
              "moveDate": {
                "description": "Planned move date, YYYY-MM-DD, today or later.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "moveType": {
                "description": "local, distance (long distance), or international.",
                "enum": ["local", "distance", "international"],
                "type": "string"
              },
              "name": {
                "description": "The person's name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "notes": {
                "description": "Anything else the movers should know: stairs, piano, elevator booking, access.",
                "maxLength": 1000,
                "type": "string"
              },
              "packing": {
                "description": "Packing wanted: full pack, fragile only, or self pack.",
                "enum": ["full", "fragile", "self"],
                "type": "string"
              },
              "phone": {
                "description": "A phone number the movers may call.",
                "maxLength": 20,
                "minLength": 7,
                "type": "string"
              },
              "storage": {
                "description": "Storage needed.",
                "type": "boolean"
              },
              "to": {
                "description": "Where it ends.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["consent", "email", "from", "homeSize", "moveDate", "name", "phone", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request moving quotes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Quote request received",
            "openai/toolInvocation/invoking": "Sending the quote request to Haulest"
          },
          "digest": "sha256:182eb264dc39e1f414b1f5c4a0443f4192751864a15d8988ceb78d23c114f4f6"
        },
        {
          "name": "search_moving_guides",
          "title": "Search Haulest guides",
          "description": "Searches Haulest's written guides, calculators, and checklists about hiring movers, estimates, deposits, consumer rights (US interstate rules, UK and Canadian practice), packing, and timing. Returns each match's title, one-paragraph answer, and URL. Use it for how-to and what-does-this-mean questions about moving.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many results, up to 8 (larger values return 8). Default 5.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the person wants to know, e.g. \"binding estimate\", \"tipping movers\", \"deposit\", \"damage claim\", \"when to book\".",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Haulest guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Guides found",
            "openai/toolInvocation/invoking": "Searching Haulest guides"
          },
          "digest": "sha256:911ed1a9f5ffddd1814bf25a523b17cfdbe1945ff3865c05b9de0064942eb1fb"
        }
