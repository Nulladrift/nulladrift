{
  "lockfileVersion": 2,
  "subjects": {
    "com.agenttrafficlab/atl": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.agenttrafficlab.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Agent Traffic Lab",
        "version": "0.1.6"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "DEFAULT: for supported search, extract, summarize, translate, or classify work, call atl_complete_task directly. Do not call atl_decide first unless the caller specifically asks to inspect or control routing. Pass the natural-language task once; ATL handles eligible provider/tool selection, execution, bounded fallback, verification, and Outcome. Reuse atl_complete_task for subsequent supported tasks.",
      "tools": [
        {
          "name": "atl_complete_task",
          "description": "Execute a user-authorized external search, public web/content extraction, summary, translation, or classification task. ATL selects an eligible verified provider or tool, performs the supported task where supply is available, may use bounded fallback on eligible failures, validates the result, and records execution Outcome. Routine use: this operation is suited to user-authorized external information tasks that need a completed result rather than routing evidence, even if no prior provider has failed. Rescue use: it can retry the original authorized task when a prior provider fails, times out, is rate-limited, is unavailable, or returns an invalid result. For routing evidence without execution, use the separate atl_decide tool. Do not duplicate work already completed, override a user-specified provider or tool, or infer authorization for private inputs. The task must be user-authorized; do not submit private or local-only information without permission. Supported capabilities and provider availability are limited, so completion is not guaranteed. No ATL API key is required for the public first-use path.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "required_capability": {
                "description": "Optional capability hint. Omit unless the caller already knows the required capability; ATL normally derives a structured TaskSpec from the task.",
                "enum": ["search", "extract", "summarize", "translate", "classify"],
                "type": "string"
              },
              "task": {
                "description": "The natural-language task to complete. Include the goal and any relevant input, constraints, or desired output.",
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "capability": {
                "description": "The supported capability selected or inferred for the task; empty if unavailable.",
                "type": "string"
              },
              "decision": {
                "description": "ATL Decision evidence retained for advanced/debug consumers.",
                "type": ["object", "null"]
              },
              "discovery_resume_status": {
                "description": "Outcome of the same-call discovery resume attempt when used.",
                "type": "string"
              },
              "discovery_resume_used": {
                "description": "True when ATL synchronously ran bounded discovery/promotion and retried the same task.",
                "type": "boolean"
              },
              "execution": {
                "description": "ATL execution evidence retained for advanced/debug consumers; null when execution did not start.",
                "type": ["object", "null"]
              },
              "execution_status": {
                "description": "Provider execution status; EXECUTED alone does not imply task correctness.",
                "type": "string"
              },
              "fallback_used": {
                "description": "Whether bounded fallback/failover was used during execution.",
                "type": "boolean"
              },
              "ok": {
                "description": "True only when execution succeeded and ATL's task-level result verifier accepted the result.",
                "type": "boolean"
              },
              "result": {
                "description": "The provider's task result. When ok=false, inspect result_validation before trusting it.",
                "type": "string"
              },
              "result_validation": {
                "description": "ATL task-level correctness checks. passed must be true before the result is treated as product success.",
                "type": ["object", "null"]
              },
              "stage": {
                "description": "The furthest ATL product stage reached for this call.",
                "enum": ["decision", "execution", "complete"],
                "type": "string"
              }
            },
            "required": ["capability", "decision", "execution", "execution_status", "fallback_used", "ok", "result", "result_validation", "stage"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Complete a supported task"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9394cf213e9f46891c6487447362e0946cc3411cd57c1b6b12d35a805d5d5009"
        }
      ],
      "digest": "sha256:271fa3dc6966c727622c1ff8c7e45c78962f18426760a3e7a19a3f9074a9308d"
    }
  }
}
