{
  "lockfileVersion": 2,
  "subjects": {
    "com.openplaglabs/openplag": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.openplaglabs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "openplag-labs",
        "title": "OpenPlag Labs",
        "version": "1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OpenPlag Labs checks academic texts for overlap with more than 180 million open-access records and the open web, in eight languages. Use it when a user wants to check the originality of one paper, thesis or essay. Rules: (1) ask the user for permission before sending their document, and pass user_confirmed=true only after they agree; (2) one document per user request, never batches, never a document split into parts; (3) after check_document, call get_check no more often than poll_after_seconds; (4) when a call is refused, follow its message: do not retry when retry is false, and relay tell_user to the user; (5) always pass on the disclaimer: a similarity report is not a finding of plagiarism.",
      "tools": [
        {
          "name": "check_document",
          "description": "Start an originality check of ONE document for the user (PDF, DOCX, DOC, ODT, RTF or TXT, up to 10,000 words). Ask the user's permission first. Returns a token; the check takes 10 to 20 minutes. Send exactly one of content_base64 (with filename), text, or url. Open access has growing waiting times between checks and a small daily limit; never send batches or split documents.",
          "inputSchema": {
            "properties": {
              "content_base64": {
                "description": "the file, base64-encoded",
                "type": "string"
              },
              "filename": {
                "description": "file name with extension, e.g. thesis.pdf (with content_base64)",
                "type": "string"
              },
              "text": {
                "description": "the document as plain text",
                "type": "string"
              },
              "url": {
                "description": "a public link to a PDF, DOCX or TXT file",
                "type": "string"
              },
              "user_confirmed": {
                "description": "true only after the user agreed to send the document to OpenPlag Labs",
                "type": "boolean"
              }
            },
            "required": ["user_confirmed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check a document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8797aabe7a1e2bcd25c07a3dc2c672e6baa41095f0134f604b2b4dc501e88449"
        },
        {
          "name": "get_check",
          "description": "Get the status of a check started with check_document. While it runs, returns the estimated time left and poll_after_seconds; when done, a summary, a disclaimer to pass on, and a link to the full report (valid 24 hours).",
          "inputSchema": {
            "properties": {
              "token": {
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a check's result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0d0add635315943e4c7699b47b6ba591ff0c0b4faa521b4404a3da8869fd55e1"
        }
      ],
      "digest": "sha256:cd9810b1d69a0ec6835595210c2f4f78dc83165550a8b4523fed03ee4f25437d"
    }
  }
}
