{
  "lockfileVersion": 2,
  "subjects": {
    "com.binarybirthday.www/binarybirthday": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.binarybirthday.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "binarybirthday",
        "title": "BinaryBirthday",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Converts birthdays, names, words and numbers to binary code and back. Every conversion includes links to personalized gifts (mug, tee, hoodie, phone case, card wallet, baby onesie) with the code pre-filled. Use date_to_binary for birthdays and anniversaries, text_to_binary for names and messages (up to 16 characters fit on a gift), and suggest_binary_gifts when the user wants a gift idea.",
      "tools": [
        {
          "name": "binary_to_number",
          "title": "Binary to number",
          "description": "Convert binary to a whole decimal number.",
          "inputSchema": {
            "properties": {
              "binary": {
                "description": "Binary such as \"11111101001\"",
                "type": "string"
              }
            },
            "required": ["binary"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7bb1d9ab526fe72611536a2de2118a0fe85803c56296b0f126bae2af90f546dd"
        },
        {
          "name": "binary_to_text",
          "title": "Binary to text",
          "description": "Decode binary (0s and 1s, spaced or not) into text, and also read it as a whole number.",
          "inputSchema": {
            "properties": {
              "binary": {
                "description": "Binary such as \"01001000 01101001\"",
                "type": "string"
              }
            },
            "required": ["binary"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4022aaffa828be4fe65430ed0219015fc132df13d768fcdc2930fe98c237e423"
        },
        {
          "name": "date_to_binary",
          "title": "Date to binary",
          "description": "Convert a date (birthday, anniversary, due date) to its BinaryBirthday code: 12-bit year, 4-bit month, 5-bit day. Returns gift links with the code pre-filled.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Date as YYYY-MM-DD, e.g. 1990-06-15",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:abf6d68845befd20712a4d7e22f56d4ad189daea746823623fe61fb40ba4b439"
        },
        {
          "name": "number_to_binary",
          "title": "Number to binary",
          "description": "Convert a whole decimal number to binary.",
          "inputSchema": {
            "properties": {
              "number": {
                "description": "Whole number, e.g. \"2025\"",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:867b705ff840687b847319e8d1305a3d56bb42dc1e2a589fc2b7a53d0c12b319"
        },
        {
          "name": "suggest_binary_gifts",
          "title": "Suggest binary gifts",
          "description": "Suggest personalized binary-code gifts for programmers, engineers, couples or new parents. Give a date or a short text and get each product with a link that pre-fills the code. Use when the user asks for gift ideas for a techie, a geek, an anniversary or a baby.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Optional date to encode, YYYY-MM-DD (birthday, wedding, baby's birth date)",
                "type": "string"
              },
              "text": {
                "description": "Optional name or short message to encode, up to 16 characters",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c23cb7171cd6a875e38aa6e6dcd1aeb1b4c9e0bf9dd58c70bbf9643969954278"
        },
        {
          "name": "text_to_binary",
          "title": "Text to binary",
          "description": "Convert text such as a name, initials or a short message to 8-bit binary (UTF-8). Text up to 16 characters also returns gift links.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "Text to convert, e.g. \"Emma\" or \"I love you\"",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a742d0eb09660a1d55035bc4e923ccb22a4cf814da67516f588ead9d1ccf3f8c"
        }
      ],
      "digest": "sha256:c987fb7aafc07a54c548fea0e7a28b3eb2d8762b287ce5ceccf6c3e2da05367b"
    }
  }
}
