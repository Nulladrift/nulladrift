      "transport": {
        "type": "http",
        "url": "https://www.endlesstravelplans.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Endless Travel Plans family trip budget",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Estimates what family trips cost from Endless Travel Plans' verified price data. Call estimate_family_trip_budget with a destination, nights, adults and the children's ages. Every figure carries its source class (curated, observed, benchmark or estimate), its date and a confidence score; quote the range, not just one number, and pass on calculator_url for live prices. An unsupported answer means ETP holds no data for that place: say so rather than estimating it yourself.",
      "tools": [
        {
          "name": "estimate_family_trip_budget",
          "title": "Estimate a family trip budget",
          "description": "Estimate what a family trip costs, broken down by getting there, staying, eating, getting around, parks and activities, and extras, with a low to high range, the source and date behind every figure, and a confidence score. Works for city trips, all-inclusive resorts, cruises and theme parks. Figures come from Endless Travel Plans' verified price data and the observed fares and room rates of real family budgets, never live prices; follow calculator_url for live prices. Places ETP has no data for come back as unsupported rather than a guess.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Adults travelling.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "children_ages": {
                "description": "Age of each child, one entry per child (ages decide seats, tickets and meal prices). Empty for no children.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 8,
                "type": "array"
              },
              "departure_city": {
                "description": "Home city or airport the family leaves from, for getting there. Without it, flights use a typical distance and say so.",
                "type": "string"
              },
              "destination": {
                "description": "Where the family is going: a city (\"Chicago\"), a theme park (\"Walt Disney World\"), a beach area for an all-inclusive (\"Cancun\"), or a cruise (\"Royal Caribbean Caribbean cruise\").",
                "type": "string"
              },
              "month": {
                "description": "Month of travel, as a name (\"July\") or number (\"7\"). Defaults to about two months out.",
                "type": "string"
              },
              "nights": {
                "description": "Nights away.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "style": {
                "description": "Travel style. Defaults to moderate.",
                "enum": ["budget", "moderate", "luxury"],
                "type": "string"
              },
              "trip_type": {
                "description": "city, all_inclusive, cruise or theme_park. Inferred from the destination when left out.",
                "enum": ["city", "all_inclusive", "cruise", "theme_park"],
                "type": "string"
              }
            },
            "required": ["adults", "destination", "nights"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6ffc261eddafd6c45789152d6d2f77d35f4df0273760870950253a95ceef930"
        }
      ],
      "digest": "sha256:3a880e733d919d2018d9d47b1aa5aaa53b89b8767d5b703c7645baf6fadeb57f"
    }
  }
