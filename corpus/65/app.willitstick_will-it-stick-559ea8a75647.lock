                "type": "string"
              },
              "motivation": {
                "description": "One line: what should these words do? Who should do, feel, or remember what? Example: 'Get a friend to actually try the book I loved.'",
                "type": "string"
              },
              "skip_questions": {
                "description": "Set true when the author declined the follow-up questions: returns the verdict on the words as they stand.",
