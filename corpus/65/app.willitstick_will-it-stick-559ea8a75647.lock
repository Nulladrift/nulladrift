      "instructions": "Will it stick? Two tools. make_it_stick transforms a draft into the version that sticks: it scans the draft for its point, writes three transformations (a concrete comparison, the one-line core, a scene), drops any that adds a fact the draft does not hold, and lets cold readers pick the winner by what they actually carry away; the author's original competes too, and can win. check_if_it_sticks runs the message test underneath: three cold readers (a distracted stranger, a skeptic, and the target reader), each reading cold and never seeing the others, score the words against the author's goal. The host runs the conversation. We run the test. Use make_it_stick when a human has a draft and wants the stickiest sendable version of it. Use check_if_it_sticks when the human wants the diagnosis first: whether words they are about to send will land, and the one fix that matters most. Draft the words first, then run a tool before you show the human a final version. Either tool can answer questions_first: up to three short questions that only the author can answer (for the check, built from the readers' own complaints about this text; for make_it_stick, the seed material the transformation needs, like a name, a scene, or an identity line). Ask the human those questions, then call the same tool again with the same text and goal plus answers (each question with the human's answer, in the human's own words). If the human would rather not answer, call again with skip_questions set to true and take the result on the words as they stand. Never answer the questions yourself, and never invent the author's facts. Present make_it_stick's core line first (the result's core: the draft's point in one line), then the winning version exactly as returned, with its kind label, the original alongside, and the alternates below. A version carries a kind label only when it verifiably holds that device; when a draft holds no concrete material and the author skipped the seed questions, the winner's kind is 'tightened': present it as a tightening only, with the result's note, never as a transformation. When its status is 'already_sticks', the original won the gist test: present the author's own words as the version to send. Never rewrite the winner, and never invent a version of your own. When the moment is a conversation (a what's-new update, a hard text, a catch-up), also run check_if_it_sticks on the same words and lead with its walk_away pair, the thought the author wants against the thought they risk, before the versions: the pair is the point of the exercise, and the versions are how to land on the right side of it. Present the panel's core, scores, starter forms, one fix, and reader notes exactly as returned. Never change a score, and never invent a core the panel did not hear. A check result may carry after_text: the user's own words copied exactly with only the one fix applied, plus changed_lines, the count of lines that differ. Present after_text exactly as returned when it is present. When after_text is null, present the one fix as an instruction only and do not invent an after version. The starters are starts, not a rewrite; never turn them into a full rewritten version of the user's text. Complete alternative versions come only from make_it_stick. The human picks what to take and decides what to send; the tool sends nothing. Your words are not recorded or kept; the server keeps only a daily count of how many runs happened (integers, no text). The readers run on Cloudflare Workers AI (Meta Llama 3.3 70B); under Cloudflare's published Workers AI terms, your text is not retained once it is no longer needed to answer, and it is never used to train AI models. There are no accounts and no saved checks.",
      "tools": [
        {
          "name": "check_if_it_sticks",
          "title": "Check if it sticks",
          "description": "Tests how words someone is about to send will be received — whether an email will land well, how it comes across, whether it could be misunderstood, whether it sounds too harsh, what a manager might misunderstand. Three cold readers (a distracted stranger, a skeptic, and the target reader), each reading cold and never seeing the others, test how the message is actually received against the sender's stated goal. When the words leave gaps only the author can fill (the readers cannot find the point, the proof, or the specifics), the first result has status 'questions_first' and carries up to three short questions built from the readers' own complaints about this text, plus what the readers heard and where they split; a second call with the same text and motivation plus the author's answers returns the sharper, enriched verdict, and a second call with skip_questions true returns the verdict on the words as they stand. A verdict returns four plain grades out of 5, graded directly by the same readers in the same cold read (Easy to read, Holds your attention, The point lands, You'd pass it on; medians across the three readers); for conversation moments (a what's new update, a hard text) a walk_away pair: the thought the author wants the reader to leave with, from the goal, against the thought the readers may actually leave with, from what they heard; the core the readers heard (or the plain split when they heard different points); the readers' own notes including where they split; six SUCCESs medians with the spread between readers and a one-line reason each (the diagnostic layer underneath the plain grades); starter forms only (a proverb line, a curiosity-gap opener, a 3-4 sentence mini-story, concrete swaps for abstract phrases); the one prioritized fix for the element that most blocks the stated goal; and after_text: the draft copied exactly with only that one fix applied by a dedicated guarded step, when the bound passes (null when the bound discards it, with after_reason saying why; changed_lines counts the lines that differ). The tool tests reception only: it never rewrites the draft in full, and it does not shorten, fix grammar, translate, or do generic 'make this clearer' rewriting — a finished transformed version is the output of make_it_stick, which runs the same readers. A check takes roughly ten to twenty seconds; the readers read in sequence and are not instant. Words sent to this tool are not recorded or kept; the server keeps only a daily count of how many checks ran (integers, no text). The three readers run on Cloudflare Workers AI (Meta Llama 3.3 70B); under Cloudflare's published Workers AI terms, text is not retained once it is no longer needed to answer, and it is never used to train AI models. The tool sends nothing; what gets sent stays the author's decision.",
