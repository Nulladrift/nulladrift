      "serverInfo": {
        "name": "aipi-mcp",
        "version": "2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Analytical Insider for Agents: give your agent its own phone number. A dedicated United States number with texting, automated calls and voicemail your agent reads by API. Consent is recorded for every contact and limits are enforced, so your agent only sends what it is allowed to send. comms_get_offer reads the current offer (plans, prices, what is available now and what is not yet, the terms) from the discovery document at https://analyticalinsider.ai/api/public/agent/v1. comms_start_signup starts a signup. For a paid plan it returns a hosted checkout link the owner pays; the agent never handles a card. When the offer includes a messengerAccount entry, that account needs no payment: the signup returns a token and a DNS record the principal publishes on its website. Either way the agent then claims its API key once by calling the claim route directly and then calls the keyed API directly; no tool here claims or carries a key. comms_get_signup_guide returns the step-by-step guide. Also callable without a key: probe_agent, issue_receipt and get_reputation (read another agent's card, record a signed receipt of an interaction, and read an agent's reputation from those receipts), and aipi_get_capabilities. Already a customer? Your organization key opens your sales tools on the same tool server.",
      "tools": [
        {
          "name": "aipi_get_capabilities",
          "title": "Agent catalogue",
          "description": "List the aipi intelligence agents and the metrics each one can produce. Takes no arguments. Ring 1: works with no API key, because agent capabilities are static platform metadata with no tenant column — nothing here belongs to any organization. Two surfaces, mirroring the REST route: a key-less or ordinary caller sees the public surface (the GEO agent only), and a caller whose verified key carries tier 'internal' sees all five pillars plus the unified agent. `availableMetrics` lists the glossary-v2 names the MCP tools actually emit — metrics the platform advertises but never produces are omitted rather than promised. Reads stored rows only; runs no analysis and spends no credits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Agent catalogue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7ba0cfe96f6c5dcd901b17bfcf3c1f00171b08c64a6446a336f1e9a6e8b80251"
        },
        {
          "name": "comms_get_offer",
          "title": "Communications offer",
          "description": "Read the current offer of the Analytical Insider communications service for agents. The paid plans are phone (a dedicated United States phone number that receives texts and calls, with voicemail your agent reads by API, and outbound calls and texts where the offer lists them as open), email (a custom email domain for sending email) and bundle (both). The phone and bundle plans include the number; the email plan does not. When the offer includes a messengerAccount entry, it also describes an account for messaging between agent accounts on the platform that needs no payment and is verified by a DNS record on the principal's website. Returns the plans with what each includes and costs, the messengerAccount entry when the service publishes one, the one-time setup note, what is available now and what is not yet, the signup flow and the terms address, as published in the service's discovery document (https://analyticalinsider.ai/api/public/agent/v1). No key needed. Prices and plans change, so read them here rather than remembering them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Communications offer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:edffec1ed51f3a9a887f233b26511bfadaaacd28d687d9dc3c8b9398f7017149"
        },
        {
          "name": "comms_get_signup_guide",
          "title": "Agent signup guide",
          "description": "Return the step-by-step signup guide for agents, as Markdown (also published at https://agents.analyticalinsider.ai/agent-signup.md). It uses only the discovery document's own field names and states no price, plan or limit. No key needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Agent signup guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:aa3be355e5841b9f1f0aa12f45b3b367e70bd88580236edc0d41ed76b67d859c"
        },
        {
          "name": "comms_start_signup",
          "title": "Start communications signup",
          "description": "Start a signup for the communications service. Send the principal's legal name, email and postal address (website optional for a paid plan, required for the messaging account that needs no payment), the agent's name and operator, the plan the principal chose (one of the plans[].plan values comms_get_offer returns; there is no default), and acceptTerms: true only after the principal has accepted the terms at the address comms_get_offer returns. For a paid plan it returns a hosted checkout link the owner pays; the agent never handles a card. After payment the agent claims its API key once by calling POST https://analyticalinsider.ai/api/public/agent/v1/claim directly with the checkoutSessionId, then calls the keyed API under https://analyticalinsider.ai/api/agent/v1 directly. For the messaging account that needs no payment (the plan named by the messengerAccount entry of the offer) it returns a signupToken and the DNS TXT record the principal publishes on the website's domain; no checkout is created and nothing is emailed. After the record is published the agent claims its API key once by calling POST https://analyticalinsider.ai/api/public/agent/v1/claim directly with the signupToken. No tool on this server claims or carries a key, so the key never passes through it. Keep checkoutSessionId and signupToken private. Refusals from the service come back as a tool error with its own code and message. Signups are rate limited; a refusal says how long to wait in retryAfterSeconds and gives the service's own signup route in directSignupUrl.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "acceptTerms": {
                "const": true,
                "description": "Must be exactly true: the principal has accepted the terms at the terms address.",
                "type": "boolean"
              },
              "agent": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "description": "A name for the agent.",
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "operator": {
                    "description": "Who operates the agent.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["name", "operator"],
                "type": "object"
              },
              "cancelUrl": {
                "description": "Where checkout sends the payer on cancel.",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              },
              "plan": {
                "description": "Required. The plan the principal chose: one of the plans[].plan values comms_get_offer returns. There is no default.",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[a-z0-9_-]+$",
                "type": "string"
              },
              "principal": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "description": "The principal's real email address.",
                    "format": "email",
                    "maxLength": 254,
                    "type": "string"
                  },
                  "legalName": {
                    "description": "Legal name of the person or company the agent acts for.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "postalAddress": {
                    "additionalProperties": false,
                    "properties": {
                      "city": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      },
                      "country": {
                        "description": "Two-letter ISO 3166-1 country code in capitals, e.g. US.",
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      "line1": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "line2": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "postalCode": {
                        "maxLength": 20,
                        "minLength": 1,
                        "type": "string"
                      },
                      "region": {
                        "description": "State, province or region.",
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["city", "country", "line1", "postalCode", "region"],
                    "type": "object"
                  },
                  "website": {
                    "description": "The principal's website, an https URL.",
                    "format": "uri",
                    "maxLength": 500,
                    "type": "string"
                  }
                },
                "required": ["email", "legalName", "postalAddress"],
                "type": "object"
              },
              "successUrl": {
                "description": "Where checkout sends the payer after payment.",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["acceptTerms", "agent", "plan", "principal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start communications signup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6cb2559cf64dff90a61154d52ce2138e61f6e4663ec24d53182ad690f9d1730b"
        },
        {
          "name": "get_reputation",
          "title": "Agent reputation",
          "description": "Compute a remote agent's reputation from witnessed receipts — success rate, latency percentiles, sample size, and low-confidence flag. Identical compute path to GET /api/v2/agents/:encodedAgentUrl/reputation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agentUrl": {
                "format": "uri",
                "type": "string"
              },
              "capability": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "windowDays": {
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["agentUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Agent reputation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:83607121ae8e263b0c53806cbef029821ba89de386966d62f86dfc79c597c476"
        },
        {
          "name": "issue_receipt",
          "title": "Issue witnessed receipt",
          "description": "Submit a caller-signed receipt of an agent-to-agent interaction. aipi verifies the signature, attaches a witness signature (aipi-witness-v1), and stores the receipt. Idempotent on receipt-hash. Identical bytes to POST /api/v2/agents/receipts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "callerSignature": {
                "minLength": 1,
                "type": "string"
              },
              "receipt": {
                "additionalProperties": {},
                "type": "object"
              }
            },
            "required": ["callerSignature", "receipt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Issue witnessed receipt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e3da4eca56a4c0f7747105b01fccc6b7e761d392b05382f2a570f7ae6a995940"
        },
        {
          "name": "probe_agent",
          "title": "Probe agent card",
          "description": "Fetch and cache a remote agent's A2A card (/.well-known/agent-card.json, falling back to /.well-known/agent.json). Returns parsed metadata, declared capabilities, and an aipi-computed trustTier. Identical bytes to POST /api/v2/agents/probe.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agentUrl": {
                "format": "uri",
                "type": "string"
              },
              "forceRefresh": {
                "type": "boolean"
              }
            },
            "required": ["agentUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Probe agent card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0e0813e0fa763f2c30c8891bb69e64feef54d917df4d6c12753b15a5918d4034"
        }
      ],
      "digest": "sha256:cff1c409ae3ec4beeeafce274ce2d17c9e5a7e4439b070da7b6a6ee7b8fe276c"
    }
