      "tools": [
        {
          "name": "check_public_wifi_risk",
          "title": "Check public Wi-Fi risk",
          "description": "Use this when the user is about to join, or is on, hotel, airport, café (coffee shop), rental, campus or other public Wi-Fi and asks \"is public wifi safe\", \"is hotel wifi safe\", whether to do banking or work there, whether a sign-in page or a network name looks fake (evil twin / fake wifi), or what to watch out for. Also use it when they ask who can see their browsing on hotel or café Wi-Fi (\"can the wifi owner see my history\", \"does incognito hide my browsing\", \"does a VPN protect me on public wifi\"): the card shows what the Wi-Fi owner, hotel, other guests or a VPN provider can and cannot see, and how HTTPS, a VPN or encrypted DNS change that. Fill in what the user said; use \"unknown\" or null for anything they did not say rather than guessing. Returns a 0–100 score (100 = no warning signs) from their answers, the signals behind it, advice per activity, who can see what, and a checklist for that venue. Do not use for home Wi-Fi security or hack worries (use secure_my_wifi), for recommending VPN or security products, to monitor or read another person's activity, or for getting onto a network without permission. Does not scan or connect to any network; works only from what the user tells ChatGPT.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "activities": {
                "default": [],
                "description": "What the user wants to do on this network.",
                "items": {
                  "enum": ["browsing", "streaming", "email_social", "banking_payments", "work_accounts", "file_sharing"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "certificateWarning": {
                "default": null,
                "description": "true if the device showed a certificate or \"not private\" warning.",
                "type": ["boolean", "null"]
              },
              "encryptedDns": {
                "default": false,
                "description": "Private DNS / DNS over HTTPS turned on.",
                "type": "boolean"
              },
              "httpsOnly": {
                "default": false,
                "description": "Only HTTPS sites (HTTPS-only mode on).",
                "type": "boolean"
              },
              "mobileDataAvailable": {
                "default": true,
                "type": "boolean"
              },
              "nameConfirmed": {
                "default": null,
                "description": "true if the exact network name was confirmed with staff or an official sign.",
                "type": ["boolean", "null"]
              },
              "security": {
                "default": "unknown",
                "description": "open = no password; shared_password = one password for everyone (e.g. on a card); private_password = only you have it; enterprise_login = personal username/password (e.g. eduroam).",
                "enum": ["open", "shared_password", "private_password", "enterprise_login", "unknown"],
                "type": "string"
              },
              "signInAsks": {
                "default": [],
                "description": "What the sign-in page asks for.",
                "items": {
                  "enum": ["room_and_name", "email", "phone", "social_login", "card_details", "access_code"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "signInPage": {
                "default": "unknown",
                "description": "Whether a sign-in (captive) page appeared and if its address started with https or http.",
                "enum": ["none", "https", "http", "unknown"],
                "type": "string"
              },
              "similarNetworkNames": {
                "default": null,
                "description": "true if several networks with similar names are visible.",
                "type": ["boolean", "null"]
              },
              "usingVpn": {
                "default": false,
                "type": "boolean"
              },
              "venue": {
                "description": "Where the Wi-Fi is.",
                "enum": ["hotel", "airport", "cafe", "rental", "campus", "home", "other"],
                "type": "string"
              }
            },
            "required": ["venue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://sentryfi/wifi-check-v4.html",
            "openai/toolInvocation/invoked": "Wi-Fi check ready",
            "openai/toolInvocation/invoking": "Checking the signals…",
            "ui": {
              "resourceUri": "ui://sentryfi/wifi-check-v4.html"
            },
            "ui/resourceUri": "ui://sentryfi/wifi-check-v4.html"
          },
          "digest": "sha256:292da337dee364035ba29e8811a810bad6146868d5ad24023ec266538195eb25"
        },
        {
          "name": "identify_wifi_devices",
          "title": "Identify devices on my Wi-Fi",
          "description": "Use this when the user asks \"who is on my wifi\", \"who is using my wifi\", sees an unknown device on their network, wants to identify devices connected to their router, asks \"what is this device on my network\", or wants a MAC address lookup (MAC address vendor) for one address. Pass the devices they pasted from their own router or app: the name and the first 6 characters of the MAC address (e.g. F0:18:98) for each; only the first 6 characters are used, and the rest of the address and the IP are not needed. For a single lookup pass one entry; if the user does not have the list yet, pass an empty list (and the router brand if known) to get the steps for finding it. Returns the maker of each device from the public IEEE registry, a likely device type, flags (private/randomized address, unknown maker, cameras and smart-home devices), which ones are worth checking, next steps and where to find the list for common routers. Do not use to scan a network, find a person or their location, monitor someone, or get into another person's network. Does not scan or connect to any network; works only from what the user tells ChatGPT.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "devices": {
                "description": "Devices from the router or app list, one entry per row. For a single MAC address lookup, pass one entry. Pass an empty list to get the steps for finding the list on the router.",
                "items": {
                  "properties": {
                    "mac": {
                      "description": "First 6 characters of the MAC address (AA:BB:CC or AABBCC). Only these are used; the rest of the address and the IP are not needed. A full or masked address (AA:BB:CC:xx:xx:xx) is accepted and cut to the first 6 characters right away.",
                      "maxLength": 32,
                      "type": "string"
                    },
                    "name": {
                      "description": "Device or host name as shown, e.g. \"Johns-iPhone\".",
                      "maxLength": 100,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "routerBrand": {
                "description": "Router or internet provider, if known. generic = not sure.",
                "enum": ["generic", "tp_link", "netgear", "asus", "xfinity", "eero", "google_nest", "orbi", "att", "spectrum", "other"],
                "type": "string"
              }
            },
            "required": ["devices"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://sentryfi/wifi-check-v4.html",
            "openai/toolInvocation/invoked": "Device list ready",
            "openai/toolInvocation/invoking": "Looking up the devices…",
            "ui": {
              "resourceUri": "ui://sentryfi/wifi-check-v4.html"
            },
            "ui/resourceUri": "ui://sentryfi/wifi-check-v4.html"
          },
          "digest": "sha256:b961995ee037c3be5521fb7a4ab2a5d08cd432c6c3ada46cedd54777f2767fd6"
        },
        {
          "name": "secure_my_wifi",
          "title": "Home Wi-Fi: secure it or check if it was hacked",
          "description": "Use this when the user asks how to secure their home Wi-Fi or router (\"how to secure my wifi\", \"secure wifi from hackers\", \"router security settings\"), how to change their Wi-Fi password or where it is shown, whether to turn off WPS or UPnP, whether to set up a guest network for smart-home devices, \"can my router or internet provider see my history at home\" or \"do I need a VPN at home\". Also use it when they suspect their own home Wi-Fi or router was hacked (\"is my wifi hacked\", \"is my router hacked\", \"someone is using my wifi\"): fill in the symptom answers they gave (unknown devices, a router login that stopped working, changed DNS, redirects or pop-ups, a Wi-Fi name or password that changed, slow internet, busy router lights) and use null for anything they did not say rather than guessing. Returns a router hardening checklist ranked by impact (admin password, WPA3/WPA2-AES, Wi-Fi password, firmware, WPS, remote admin, UPnP, guest/IoT network, network name, DNS), steps already done marked, brand-specific password steps and a neutral answer on privacy and VPNs at home; when symptoms are given it adds hack signals out of 100 (100 = none of the answers point to a break-in), common causes that are not a hack and ordered first steps. Do not use to hack, crack or get into a network the user does not own, to find or watch another person, to recommend VPN or security products, or for public Wi-Fi safety (use check_public_wifi_risk). Does not scan or connect to any network; works only from what the user tells ChatGPT.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adminPasswordDefault": {
                "default": null,
                "description": "true if the router admin password is still the default one from the sticker or manual.",
                "type": ["boolean", "null"]
              },
              "alreadyDone": {
                "default": [],
                "description": "Steps the user says they have already done; they are marked done and moved to the end.",
                "items": {
                  "enum": ["admin_password", "encryption", "wifi_password", "firmware", "wps_off", "remote_admin_off", "upnp_off", "guest_network", "ssid_rename", "dns"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "cantLogIntoRouter": {
                "default": null,
                "description": "true if the router admin password that used to work no longer works.",
                "type": ["boolean", "null"]
              },
              "dnsChanged": {
                "default": null,
                "description": "true if the router or a device shows DNS servers the user did not set.",
                "type": ["boolean", "null"]
              },
              "firmwareOutdated": {
                "default": null,
                "description": "true if router updates are not installed, or the router no longer gets updates.",
                "type": ["boolean", "null"]
              },
              "lightsAtNight": {
                "default": null,
                "description": "true if the router lights blink a lot when nobody seems to be using it.",
                "type": ["boolean", "null"]
              },
              "needsUpnp": {
                "default": null,
                "description": "true if a game console, voice chat or home server needs UPnP (e.g. \"strict NAT\" without it).",
                "type": ["boolean", "null"]
              },
              "passwordSharedWidely": {
                "default": null,
                "description": "true if the Wi-Fi password has been given to many people (neighbours, past guests, ex-roommates).",
                "type": ["boolean", "null"]
              },
              "redirectsOnAllDevices": {
                "default": null,
                "description": "true if the redirects/pop-ups happen on every device on this Wi-Fi, false if only on one device.",
                "type": ["boolean", "null"]
              },
              "redirectsOrPopups": {
                "default": null,
                "description": "true if browsers jump to odd sites, fake login pages or show pop-ups.",
                "type": ["boolean", "null"]
              },
              "routerBrand": {
                "description": "Router or internet provider, if known.",
                "enum": ["generic", "tp_link", "netgear", "asus", "xfinity", "eero", "google_nest", "orbi", "att", "spectrum", "other"],
                "type": "string"
              },
              "slowInternet": {
                "default": null,
                "description": "true if the internet has become slow.",
                "type": ["boolean", "null"]
              },
              "smartHome": {
                "default": "unknown",
                "description": "How many smart-home devices (cameras, plugs, bulbs, speakers, TVs) are on the network. many = moves the guest/IoT network step up.",
                "enum": ["none", "some", "many", "unknown"],
                "type": "string"
              },
              "unknownDevices": {
                "default": null,
                "description": "true if the router lists devices the user does not recognise.",
                "type": ["boolean", "null"]
              },
              "wifiSettingsChanged": {
                "default": null,
                "description": "true if the Wi-Fi name or password changed without the user doing it.",
                "type": ["boolean", "null"]
              },
              "wpsOn": {
                "default": null,
                "description": "true if WPS (push-button / PIN pairing) is on.",
                "type": ["boolean", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://sentryfi/wifi-check-v4.html",
            "openai/toolInvocation/invoked": "Checklist ready",
            "openai/toolInvocation/invoking": "Building your checklist…",
            "ui": {
              "resourceUri": "ui://sentryfi/wifi-check-v4.html"
            },
            "ui/resourceUri": "ui://sentryfi/wifi-check-v4.html"
          },
          "digest": "sha256:b417b92154e63e62ade23f42b8908fc7954a7a03a10c4420e1667d2397c13c26"
        }
