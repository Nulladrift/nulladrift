{
  "lockfileVersion": 2,
  "subjects": {
    "ai.profils/registry": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://profils.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "profils.ai",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "balance",
          "title": "Read the account balance",
          "description": "Returns the balance and recent movements of the account whose API key the transport carries.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c566fcfe1bf73fb3c12cfa5e95db9265c134c41829f92f16050b1092b3d2cc15"
        },
        {
          "name": "get_company",
          "title": "Read a company fiche",
          "description": "Free. The full fiche as Markdown, by SIREN.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "siren": {
                "description": "The 9 digit SIREN",
                "pattern": "^\\d{9}$",
                "type": "string"
              }
            },
            "required": ["siren"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:523ed58196c7afd463041d55b96a5a1c252a606f1b7fa94accc712fdd435d332"
        },
        {
          "name": "get_document",
          "title": "Download a filed document",
          "description": "Returns a 10 minute link to an official PDF: statutes, decisions, annual accounts (INPI RNE), a Sirene situation notice (INSEE) or a BODACC notice. Costs $0.0004 per document, paid from your balance (Authorization: Bearer) or with x402.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "closing": {
                "description": "Closing date of the accounts, for comptes",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "depot": {
                "description": "Filing date, for comptes",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "id": {
                "description": "The registry PDF id for acte and bilan, the notice id for bodacc",
                "pattern": "^[A-Za-z0-9-]{8,64}$",
                "type": "string"
              },
              "kind": {
                "description": "acte: statutes or decisions; bilan or comptes: annual accounts; avis-situation: the Sirene situation notice of an establishment; bodacc: a BODACC notice; marque, brevet, modele: the official INPI XML notice of a trademark (WIPO ST.66), a patent (ST.36) or a design (ST.86)",
                "enum": ["acte", "bilan", "comptes", "avis-situation", "bodacc", "marque", "brevet", "modele"],
                "type": "string"
              },
              "number": {
                "description": "The FR title number without the country prefix, for marque, brevet and modele",
                "pattern": "^\\d{6,10}$",
                "type": "string"
              },
              "siren": {
                "description": "For comptes",
                "pattern": "^\\d{9}$",
                "type": "string"
              },
              "siret": {
                "description": "The 14 digit SIRET, for avis-situation",
                "pattern": "^\\d{14}$",
                "type": "string"
              },
              "type": {
                "description": "Accounts type (C, S, K...), for comptes",
                "pattern": "^[A-Z0-9]{1,2}$",
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:36cde855afb850633b985de5b22189f778572400d8cad551fd6ccd73a7918ba9"
        },
        {
          "name": "search_companies",
          "title": "Search French companies",
          "description": "Free. Finds companies by name, SIREN, SIRET or activity.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "page": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A company name, SIREN, SIRET or activity, in French or English",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fd913e7804a5257e1ee1e868c9c798a30bfb2f8453fa2b9210541605fec17986"
        },
        {
          "name": "signup",
          "title": "Open a prepaid account",
          "description": "Opens a prepaid account and returns its API key. No human step and no payment is needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "label": {
                "description": "A name for the account, such as your agent",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3f17b6c0caf918be2f8601ba4eb90280e3b1ffe944aad098b2c5b9e3e8172111"
        },
        {
          "name": "top_up",
          "title": "Add prepaid credit",
          "description": "Adds credit to your account. Without a payment it answers how to pay (x402, MPP, card link); pay with any listed option and call it again with the payment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "The USD amount to add, as a decimal string such as \"5\" or \"0.50\"",
                "pattern": "^\\d+(\\.\\d{1,6})?$",
                "type": "string"
              }
            },
            "required": ["amount"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:44c2e0fd7575f0fa9295a919a8ebd67a979afef30034a9f29ca7d74b66236090"
        }
      ],
      "digest": "sha256:bd9ef062625727dce8f0318dc1bdc3c1842e0180db192cc41d5928b0c91b6814"
    }
  }
}
