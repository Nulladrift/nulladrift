          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "balance",
          "title": "Read the account balance",
          "description": "Returns the balance and recent movements of the account whose API key the transport carries.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
