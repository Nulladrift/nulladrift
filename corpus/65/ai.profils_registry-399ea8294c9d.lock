          },
          "digest": "sha256:3fe1ff502ac74a3fe96c4c91387dd9daf1bf44fbf6eb29477096060e5fa6a04e"
        },
        {
          "name": "get_company",
          "title": "Read a company fiche",
          "description": "Free. The full fiche as Markdown, by SIREN.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "siren": {
                "description": "The 9 digit SIREN",
                "pattern": "^\\d{9}$",
                "type": "string"
              }
            },
            "required": ["siren"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6a2305d4cd2499233de6b0fd6967351222ce34eacadbc16bcf2d182b0c59e80a"
        },
        {
          "name": "get_document",
          "title": "Download a filed document",
          "description": "Returns a 10 minute link to an official PDF: statutes, decisions, annual accounts (INPI RNE), a Sirene situation notice (INSEE) or a BODACC notice. Costs $0.0004 per document, paid from your balance (Authorization: Bearer) or with x402.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "closing": {
                "description": "Closing date of the accounts, for comptes",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "depot": {
                "description": "Filing date, for comptes",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "id": {
                "description": "The registry PDF id for acte and bilan, the notice id for bodacc",
                "pattern": "^[A-Za-z0-9-]{8,64}$",
                "type": "string"
              },
              "kind": {
                "description": "acte: statutes or decisions; bilan or comptes: annual accounts; avis-situation: the Sirene situation notice of an establishment; bodacc: a BODACC notice; marque, brevet, modele: the official INPI XML notice of a trademark (WIPO ST.66), a patent (ST.36) or a design (ST.86)",
                "enum": ["acte", "bilan", "comptes", "avis-situation", "bodacc", "marque", "brevet", "modele"],
                "type": "string"
              },
              "number": {
                "description": "The FR title number without the country prefix, for marque, brevet and modele",
                "pattern": "^\\d{6,10}$",
                "type": "string"
              },
              "siren": {
                "description": "For comptes",
                "pattern": "^\\d{9}$",
                "type": "string"
              },
              "siret": {
                "description": "The 14 digit SIRET, for avis-situation",
                "pattern": "^\\d{14}$",
                "type": "string"
              },
              "type": {
                "description": "Accounts type (C, S, K...), for comptes",
                "pattern": "^[A-Z0-9]{1,2}$",
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4ac79da78263a8ba1d2e3b177a5631b5b856fdfcaf1a43b149cda9ad277d4b59"
        },
        {
          "name": "search_companies",
          "title": "Search French companies",
          "description": "Free. Finds companies by name, SIREN, SIRET or activity.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "page": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A company name, SIREN, SIRET or activity, in French or English",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4ab30b7ee3b29e813e9f8dc7250d486e7179c218c1f2759ceb358de07e55103d"
        },
        {
          "name": "signup",
          "title": "Open a prepaid account",
          "description": "Opens a prepaid account and returns its API key. No human step and no payment is needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "label": {
                "description": "A name for the account, such as your agent",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0695c80df917e327a38425f3c41a56da76c2b62316c60146b12bc265ee8da89d"
        },
        {
          "name": "top_up",
          "title": "Add prepaid credit",
          "description": "Adds credit to your account. Without a payment it answers how to pay (x402, MPP, card link); pay with any listed option and call it again with the payment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "The USD amount to add, as a decimal string such as \"5\" or \"0.50\"",
                "pattern": "^\\d+(\\.\\d{1,6})?$",
                "type": "string"
              }
            },
            "required": ["amount"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:090176d15c4da3e214a19eea23feda0d4b9777c478d1a43b7f3e3c36bae6b295"
        }
      ],
