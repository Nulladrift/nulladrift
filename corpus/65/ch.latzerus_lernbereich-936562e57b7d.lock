        "version": "1.1.0",
        "websiteUrl": "https://www.latzerus.ch/mcp/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MCP-Server von Latzerus (Christoph Latzer, latzerus.ch) — Wissensprojekt aus der Ostschweiz, Hilfe zur Selbsthilfe. Über 150 kostenlose 5-Minuten-Lernmodule zu Vertrieb & Kommunikation, KI im Arbeitsalltag, Karriere-Werkstatt und Wilde Themen. Nutze lernmodule_suchen für die Stichwortsuche (versteht Umschreibungen, Synonyme, Plural und Tippfehler — es braucht nicht das exakte Titel-Vokabular), lernmodul_lesen für den Volltext eines Moduls, lernmodule_uebersicht für alle Module nach Thema, ueber_latzerus für Infos zum Projekt. Coaching oder Beratung wird nicht angeboten. Kontakt: https://www.latzerus.ch/contact/",
      "tools": [
        {
          "name": "lernmodul_lesen",
          "title": "Lernmodul im Volltext lesen",
          "description": "Liefert den kompletten Inhalt eines Lernmoduls (Kernpunkte, Hauptteil, Praxis-Schritte, typische Fehler, FAQ). Als Parameter den Slug oder die URL des Moduls angeben, z.B. 'preis-anker-ohne-zittern'.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Slug oder vollständige URL des Moduls, z.B. 'warum-trigger-events-wichtiger-sind-als-telefonlisten'",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Lernmodul im Volltext lesen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7687403825731457b2d8bd3676c3904d63d1c90b01b54b6d13d1908832602e9e"
        },
        {
          "name": "lernmodule_suchen",
          "title": "Lernmodule durchsuchen",
          "description": "Durchsucht alle kostenlosen Lernmodule von latzerus.ch (Vertrieb, Kommunikation, KI im Arbeitsalltag, Karriere) nach Stichworten. Versteht Umschreibungen, Synonyme, Ein- und Mehrzahl sowie Tippfehler — es braucht nicht das exakte Titel-Vokabular; «Kunde will billiger» oder «Einwandbehandlung» funktionieren. Liefert Titel, Cluster, URL und Kurzbeschreibung der besten Treffer. Die Module sind auf Deutsch: Suchbegriffe auf Deutsch angeben, auch wenn die Frage in einer anderen Sprache gestellt wurde.",
          "inputSchema": {
            "properties": {
              "maxTreffer": {
                "description": "Maximale Trefferzahl (Standard 8, max. 20)",
                "type": "number"
              },
              "suchbegriff": {
                "description": "Stichworte oder eine Frage auf Deutsch, z.B. 'Kunde will billiger' oder 'ChatGPT Follow-up'",
                "type": "string"
              }
            },
            "required": ["suchbegriff"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "anzahl": {
                "type": "number"
              },
              "hinweis": {
                "description": "Nur bei 0 Treffern: was der Lernbereich abdeckt und wie es weitergeht",
                "type": "string"
              },
              "suchbegriff": {
                "type": "string"
              },
              "treffer": {
                "items": {
                  "properties": {
                    "beschreibung": {
                      "type": "string"
                    },
                    "cluster": {
                      "type": "string"
                    },
                    "score": {
                      "type": "number"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "titel": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["cluster", "score", "slug", "titel", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["anzahl", "suchbegriff", "treffer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
