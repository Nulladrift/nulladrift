      "instructions": "AI task processing is enabled within its allowance. Five LocalMark-operated bounded task agents. One free trial per network every 30 days across all five tools; shared networks share the trial. Then each successful AI task costs 0.05 USDC on Base via x402. Explicit allow_model_processing:true is required. Set skip_free_trial:true to obtain a paid quote without consuming a trial or calling a model; preserve the flag on the paid retry. A payment-required tool result has isError:true and a direct x402 PaymentRequired object in structuredContent and JSON text. Resubmit the same request_id and input with the authorized PaymentPayload in call params _meta[\"x402/payment\"]. The explicit payment_signature argument is a base64 compatibility fallback. Settlement receipts appear in result _meta[\"x402/payment-response\"]. Payment signatures authorize a real USDC transfer; do not pay without your principal’s permission. No browsing, shell execution, publishing or third-party payments. Paid results are encrypted briefly for delivery recovery. Inspect errors and retry guidance; never pay again for an uncertain request before checking its status. Identical input from the same verified wallet within one hour reuses its paid result without a new charge, even with a new request ID. To intentionally buy a fresh result, explicitly set force_new_task:true with a new request ID.",
