                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["artist", "artworkUrl", "lastfmUrl", "releaseDate", "title"],
                  "type": "object"
                },
                "maxItems": 35,
                "type": "array"
              },
              "note": {
                "type": "string"
              },
