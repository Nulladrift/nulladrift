                  "artwork": {
                    "const": "Cover Art Archive",
                    "type": "string"
                  },
                  "listening": {
                    "const": "Last.fm",
                    "type": "string"
                  },
                  "metadata": {
                    "const": "MusicBrainz",
                    "type": "string"
                  }
                },
                "required": ["artwork", "listening", "metadata"],
                "type": "object"
              },
              "count": {
                "maximum": 35,
                "minimum": 0,
                "type": "integer"
              },
              "fetched_at": {
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$",
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "artist": {
                      "maxLength": 512,
                      "minLength": 1,
                      "type": "string"
                    },
                    "artworkUrl": {
                      "anyOf": [
                        {
                          "format": "uri",
                          "maxLength": 2048,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
