{
  "lockfileVersion": 2,
  "subjects": {
    "com.profullstack/tronbrowser": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tronbrowser.dev/mcp/tron"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tronbrowser",
        "version": "3.9"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "fetch_page",
          "title": "Fetch Web Page",
          "description": "Fetch a public web page as markdown, text, links or html. Obscura renders first (fast, light); the ungoogled-chromium engine takes over for JS-heavy pages and bot walls. engine=obscura|chromium pins one. Keyless; a few fetches at a time. 30 s render budget; a page that times out, returns 5xx, or whose host is unreachable is skipped for 30 days with an error starting \"FLAGGED until <ISO date>\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "engine": {
                "description": "Default auto",
                "enum": ["auto", "obscura", "chromium"],
                "type": "string"
              },
              "format": {
                "description": "Default markdown",
                "enum": ["markdown", "text", "links", "html"],
                "type": "string"
              },
              "max_chars": {
                "description": "Cut the answer here. Default 200000, max 400000.",
                "minimum": 1000,
                "type": "integer"
              },
              "timeout_s": {
                "description": "Total render budget in seconds (Obscura, then Chromium). Default and max 30.",
                "type": "number"
              },
              "url": {
                "description": "Public http(s) URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:40d819fe290a2be394aec297286d495dfedb2128f9e80b6d6f08a1a3835812de"
        },
        {
          "name": "screenshot_page",
          "title": "Screenshot Web Page",
          "description": "Render a public web page in the ungoogled-chromium engine and return a PNG of the viewport (1280x900).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public http(s) URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a58f5165d106b4fd014751b2aad309c995558f83064789b4e64880fd9d26151b"
        }
      ],
      "digest": "sha256:665e7519d6a9cbfff125d80a43d0d7be1167c9c61cd5905277e369cf910592b0"
    }
  }
