      "instructions": "PredictionMarketsPicks: Kalshi weather-market tools. 1) Every price, edge, rank and projection you state must come from a tool result in this conversation — never estimate a Kalshi or Polymarket price or fill in a missing edge. 2) Cite a row’s url or page_url when you quote its number. 3) An edge is model-vs-market disagreement, not a guarantee; WATCH rows are lower-confidence and labelled WATCH. 4) Most tools answer without an account; a Pro-only result returns requires_pro: true with an upgrade_url. 5) For Kalshi city-high prices beside the NWS forecast use weather_board; for weather edges use edge_alerts with feed \"weather\"; test a price against history with base_rate_gap, update a view with bayes_update, and size a position with calculate_ev and kelly_size.",
      "tools": [
        {
          "name": "base_rate_gap",
          "title": "Base Rate Gap",
          "description": "Use for \"how does this price compare to history\" and \"is the market ignoring the base rate\". Compares a market price with the historical base rate for a class of events: the gap in pp, a signal, and sample-size quality. Pass a known baseRateId (the parameter lists them) or your own baseRateValue.",
          "inputSchema": {
            "properties": {
              "baseRateId": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["incumbent_reelected", "fed_hold_unemp_below_4", "fed_cut_cpi_above_3", "recession_called_12mo", "sp500_positive_year", "bitcoin_above_100k_eoy", "gdp_growth_above_2", "cpi_above_3", "senate_incumbent_wins_primary", "vix_below_20_eoy", "interest_rate_cut_next_meeting", "major_sports_upset"],
                    "type": "string"
                  }
                ],
                "description": "Known base-rate id to look up (includes sample size + source)."
              },
              "baseRateValue": {
                "description": "Your own base rate in % (0–100), used when no baseRateId is given.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "marketPrice": {
                "description": "Current market price in cents / implied probability % (0–100). Needed for a real answer. Accepts 55, \"55%\", \"55¢\", \"$0.55\", 0.55 or American odds (+120 / -150) — all read as 55%.",
                "type": ["number", "string"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Base Rate Gap"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b2119b3d4d3f4ed42cbf755d9cbef7818708c6eca18a5c99ed4f7f9e0c929646"
        },
        {
          "name": "bayes_update",
          "title": "Bayesian Probability Update",
          "description": "Update a prior probability with one or more pieces of evidence using Bayes theorem. Given a prior and a list of evidence items (each with P(evidence | true) and P(evidence | false)), returns the posterior probability and the per-step chain. Use for \"update my estimate with new information\", \"posterior probability\", \"how does this news change the odds\".",
          "inputSchema": {
            "properties": {
              "evidence": {
                "description": "One or more evidence items, applied in order. Each item needs likelihoodIfTrue and likelihoodIfFalse on the 0–100 scale, e.g. [{ \"likelihoodIfTrue\": 80, \"likelihoodIfFalse\": 20 }].",
                "items": {
                  "properties": {
                    "label": {
                      "description": "Optional short caption for this evidence. Defaults to \"Evidence 1\", \"Evidence 2\", …",
                      "type": "string"
                    },
                    "likelihoodIfFalse": {
                      "description": "P(observing this evidence | hypothesis is false), in % (0–100).",
                      "type": ["number", "string"]
                    },
                    "likelihoodIfTrue": {
                      "description": "P(observing this evidence | hypothesis is true), in % (0–100).",
                      "type": ["number", "string"]
                    }
                  },
                  "required": ["likelihoodIfFalse", "likelihoodIfTrue"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "prior": {
                "description": "Prior probability the hypothesis is true, in % (0–100). Needed for a real answer. Accepts 55, \"55%\", \"55¢\", \"$0.55\", 0.55 or American odds (+120 / -150) — all read as 55%.",
                "type": ["number", "string"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Bayesian Probability Update"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ed3d0ad784c7130f599f4dc3291cc6adc37047b0fa30df604ba6fae4e2ccba67"
        },
        {
          "name": "calculate_ev",
          "title": "Calculate EV Edge",
          "description": "Use for \"is this contract mispriced\" and \"what is my edge\". Give a Kalshi, Polymarket US or Novig price in cents and your own probability; returns the % expected-value edge and a BUY / SELL / SKIP read, with that venue's fee.",
          "inputSchema": {
            "properties": {
              "marketPrice": {
                "description": "Current contract price in cents (1–99), equal to the implied probability in %. Required for a real answer. Accepts 55, \"55%\", \"55¢\", \"$0.55\", 0.55 or American odds (+120 / -150) — all read as 55%.",
                "type": ["number", "string"]
              },
              "novigMarket": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["pregame", "live", "futures"],
                    "type": "string"
                  }
                ],
                "description": "With venue novig: pregame (default), live or futures. Sets the fee. One of: pregame · live · futures."
              },
              "venue": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["kalshi", "polymarket-us", "novig"],
                    "type": "string"
                  }
                ],
                "description": "Where you would trade it: kalshi, polymarket-us or novig. Default kalshi. One of: kalshi · polymarket-us · novig."
              },
              "venuePrices": {
                "description": "The same contract's price on each venue, in cents. Adds EV after each venue's fee and best_venue.",
                "properties": {
                  "kalshi": {
                    "maximum": 99,
                    "minimum": 1,
                    "type": "number"
                  },
                  "novig": {
                    "maximum": 99,
                    "minimum": 1,
                    "type": "number"
                  },
                  "polymarket-us": {
                    "maximum": 99,
                    "minimum": 1,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "yourProbability": {
                "description": "Your own estimate of the true probability the contract resolves YES, in % (0–100). Required for a real answer. Accepts 55, \"55%\", \"55¢\", \"$0.55\", 0.55 or American odds (+120 / -150) — all read as 55%.",
                "type": ["number", "string"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "data_freshness": {},
              "edge_pct": {
                "description": "Expected-value edge, %."
              },
              "edge_pp": {
                "description": "Your probability minus the price, pp."
              },
              "example_call": {},
              "interpretation": {
                "description": "Plain-English read."
              },
              "market_price_cents": {
                "description": "Price used, cents."
              },
              "needs_input": {},
              "signal": {
                "description": "BUY / SELL / SKIP."
              },
              "sources": {},
              "tell_user": {
                "description": "Show this sentence to the user first.",
                "type": "string"
              },
              "timestamp": {
                "type": "string"
              },
              "your_probability_pct": {
                "description": "Probability used, %."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate EV Edge"
