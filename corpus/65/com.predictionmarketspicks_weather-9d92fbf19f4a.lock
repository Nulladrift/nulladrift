        {
          "name": "convert_probability",
          "title": "Convert Probability / Odds",
          "description": "Convert between implied probability, American odds, and decimal odds. Give one value and its format and get all three back (American odds carry no commas, e.g. +441 or -200). Use for \"what is +150 as a probability\", \"convert 62% to American odds\", \"decimal to implied odds\".",
          "inputSchema": {
            "properties": {
              "format": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["probability", "american", "decimal"],
                    "type": "string"
                  }
                ],
                "description": "Format of `value`: probability (0–100 %), american (e.g. -200 / +150), or decimal (e.g. 2.5). One of: probability · american · decimal."
              },
              "value": {
                "description": "The numeric value to convert. Needed for a real answer, with format.",
                "type": ["number", "string"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "american_odds": {
                "description": "American odds, no commas."
              },
              "data_freshness": {},
              "decimal_odds": {
                "description": "Decimal odds."
              },
              "example_call": {},
              "needs_input": {},
              "probability_pct": {
                "description": "Implied probability, %."
              },
              "sources": {},
              "tell_user": {
                "description": "Show this sentence to the user first.",
                "type": "string"
              },
              "timestamp": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert Probability / Odds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
