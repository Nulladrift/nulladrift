            "readOnly": true
          },
          "digest": "sha256:f326c5d1c8264d9488db96e565118aada62ece544e9c09a96058eb5920b6bdbe"
        },
        {
          "name": "edge_alerts",
          "title": "Edge Alerts (weather / commodity / mispricing)",
          "description": "Use for \"any edge on Kalshi\", \"where is the edge today\" and \"weather trade signals\". Our model alerts on Kalshi — weather, bitcoin/silver/gold/oil, mispricings — with feed, tier, side, price, model probability, edge and link. Real time with Pro; free is delayed 24h without the thesis. One identical, impersonal feed for every subscriber; filters only select. Informational, not investment advice.",
          "inputSchema": {
            "properties": {
              "feed": {
                "description": "Comma-separated feeds to include: weather, bitcoin, silver, gold, oil, mispricing, sports_arb, nfl. Omit for all.",
                "type": "string"
              },
              "limit": {
                "description": "Max alerts to return (default 25; 4 when the call has no arguments).",
                "type": ["number", "string", "null"]
              },
              "min_tier": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["SPECULATIVE", "MODERATE", "STRONG"],
                    "type": "string"
                  }
                ],
                "description": "Minimum confidence tier (returns that tier and above). One of: SPECULATIVE · MODERATE · STRONG."
              },
              "since": {
                "description": "ISO-8601 timestamp — only alerts created after it.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Edge Alerts (weather / commodity / mispricing)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7c3449f8a5fe3fd540980a715f89b620dfccd61e2d04dd4567e752d772bc817d"
        },
        {
          "name": "kelly_size",
          "title": "Kelly Position Size",
          "description": "Compute the optimal Kelly position size for a Kalshi, Polymarket US or Novig contract. Given your win probability, the market price (which sets the payout), your bankroll, and a Kelly fraction (full / half / quarter / eighth), returns the dollar stake and a risk rating. Use for \"how much should I stake\", \"what is my position size\", \"Kelly sizing for this trade\".",
          "inputSchema": {
            "properties": {
              "bankroll": {
                "description": "Total bankroll in dollars (e.g. 1000). Optional — omit it and the result is the % of bankroll to stake, without a dollar figure.",
                "type": ["number", "string"]
              },
              "fraction": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["full", "half", "quarter", "eighth"],
                    "type": "string"
                  }
                ],
                "description": "Kelly fraction to apply. Half-Kelly is the common sharp-money default. One of: full · half · quarter · eighth."
              },
              "marketPrice": {
                "description": "Contract price in cents (1–99). Sets the payout ratio. Omit both this and winProbability for the inputs and a worked example. Accepts 55, \"55%\", \"55¢\", \"$0.55\", 0.55 or American odds (+120 / -150) — all read as 55%.",
                "type": ["number", "string"]
              },
              "novigMarket": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["pregame", "live", "futures"],
                    "type": "string"
                  }
                ],
                "description": "With venue novig: pregame (default), live or futures. Sets the fee. One of: pregame · live · futures."
              },
              "venue": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["kalshi", "polymarket-us", "novig"],
                    "type": "string"
                  }
                ],
                "description": "Where you would trade it: kalshi, polymarket-us or novig. Default kalshi. One of: kalshi · polymarket-us · novig."
              },
              "winProbability": {
                "description": "Your probability the contract resolves YES, in % (0–100). Omit both this and marketPrice for the inputs and a worked example. Accepts 55, \"55%\", \"55¢\", \"$0.55\", 0.55 or American odds (+120 / -150) — all read as 55%.",
                "type": ["number", "string"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "applied_fraction_pct": {
                "description": "The fraction applied, %."
              },
              "data_freshness": {},
              "example_call": {},
              "full_kelly_pct": {
                "description": "Full-Kelly fraction of bankroll, %."
              },
              "needs_input": {},
              "rating": {
                "description": "Qualitative read of the sizing."
              },
              "sources": {},
              "stake_dollars": {
                "description": "Suggested stake in dollars (when a bankroll was given)."
              },
              "tell_user": {
                "description": "Show this sentence to the user first.",
                "type": "string"
              },
              "timestamp": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
