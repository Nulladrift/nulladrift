        },
        {
          "name": "validate_address",
          "description": "Validate and standardize one postal address (240+ countries; UK via the\n    official Royal Mail PAF with UDPRN + UPRN).\n\n    Give `country` as ISO-3 lowercase (e.g. usa, can, deu, gbr) plus EITHER a\n    free-text `address_line` OR fielded parts (street, house_number, city,\n    state, postcode). Returns an honest verdict — status \"verified\" (exact) or\n    \"corrected\" (fixed), or partial_match with reasons — plus the standardized\n    form, confidence, coordinates with an explicit accuracy_type, and, for\n    street-accurate USA/Canada matches, a FREE `enrichment` block (census\n    tract, block group, FIPS, CBSA/MSA, congressional district, school\n    district / Canadian equivalents).\n\n    Reading the verdict: `status` is only ever \"verified\" or \"corrected\". A\n    partial result has partial_match: true and NO `status`: the address was\n    not fully confirmed. Present it as \"partially matched\", with `reasons`\n    (e.g. house_number_unconfirmed, street_not_matched), `deliverable` and the\n    accuracy_type of the coordinate; never as valid, never as not found.\n    http_status 404 = not found.\n\n    Cost: 1 validation credit per successful lookup (verified, corrected, or a\n    partial result with a coordinate). No-match, errors and state/province-only\n    results are not charged: they are refunded automatically (you pay for\n    results, not attempts).",
          "inputSchema": {
            "properties": {
              "address_line": {
                "default": "",
                "title": "Address Line",
                "type": "string"
              },
              "city": {
                "default": "",
                "title": "City",
                "type": "string"
              },
              "country": {
                "title": "Country",
                "type": "string"
              },
              "house_number": {
                "default": "",
                "title": "House Number",
                "type": "string"
              },
              "postcode": {
                "default": "",
                "title": "Postcode",
                "type": "string"
              },
              "state": {
                "default": "",
                "title": "State",
                "type": "string"
              },
              "street": {
                "default": "",
                "title": "Street",
                "type": "string"
              }
            },
            "required": ["country"],
            "title": "validate_addressArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dfdd12a6bbf795b0f917e6b9c5501d7ce087f3cc6978c35218a78e1e84ea816e"
        },
        {
          "name": "validate_addresses_batch",
          "description": "Validate up to 50 addresses in one call (mixed countries allowed).\n\n    `addresses` is a list where each entry is either a free-text string, or an\n    object {\"input\": <string or fielded object>, \"country\": \"iso3\"}. Entries\n    without their own country use the `country` parameter. UK (gbr) rows are\n    routed individually to the Royal Mail PAF service; everything else goes\n    through the batch endpoint. Results come back in the same order, each with\n    the same shape as validate_address: a row with partial_match: true and no\n    `status` is partially matched (not confirmed; not valid, not not-found).\n\n    Cost: 1 validation credit per successfully validated row (same rule as\n    validate_address); failed rows are refunded. For files bigger than 50 rows,\n    call this tool repeatedly.",
          "inputSchema": {
            "properties": {
              "addresses": {
                "items": {},
                "title": "Addresses",
                "type": "array"
              },
              "country": {
                "default": "",
