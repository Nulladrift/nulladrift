      "instructions": "Acuris Geo: address validation (240+ countries, honest verified/corrected/partial verdicts) and geocoding, with FREE census & geographic enrichment for street-accurate USA/Canada matches (FIPS, census tract, block group, CBSA/MSA, congressional district, school district; Canadian equivalents). UK addresses run against the official Royal Mail PAF (UDPRN + UPRN). Authenticate by connecting with the header 'Authorization: Bearer <acuris api key>' (or X-Acuris-Key). No key yet? Use request_trial_key. Costs are per successful lookup and stated on each tool; failed lookups are refunded automatically. Reading validation results: status \"verified\" or \"corrected\" = the address was confirmed. partial_match: true with NO status = partially matched: the address was not fully confirmed; tell the user that, with the reasons, and never call it valid or not found. HTTP 404 = not found.",
      "tools": [
        {
          "name": "autocomplete_address",
          "description": "Address autocomplete (type-ahead): ranked, standardized address suggestions for a\n    partial input `q` (typed so far), with lat/lng whenever the reference row\n    carries a coordinate. Use it to help a person pick an address, then pass\n    the chosen one to validate_address.\n\n    `country` is ISO-3 lowercase. `limit` 1-50 (default 10). `state` narrows\n    USA/Canada. For UK (gbr) the query may be, or start with, a postcode:\n    a full or partial postcode returns every delivery point there (labelled\n    with building/organisation names). UK requests are served from the Royal\n    Mail PAF service; suggestions do not carry UDPRN/UPRN, so validate the\n    chosen address to get them.\n\n    Cost: billed exactly like the /suggest endpoint it wraps; see\n    https://www.acuris-geo.com/acuris-pricing/",
          "inputSchema": {
            "properties": {
              "country": {
                "title": "Country",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "q": {
                "title": "Q",
                "type": "string"
              },
              "state": {
                "default": "",
                "title": "State",
                "type": "string"
              }
            },
