        {
          "name": "request_trial_key",
          "description": "Get an instant FREE Acuris evaluation API key — 1,000 lookups (address\n    validation and geocoding together) plus 50 UK lookups, valid 30 days,\n    no card, no signup form. Idempotent: asking again with the same email\n    within 24h returns the SAME key.\n\n    BEFORE calling with accept_terms=true you MUST show the user both links\n    and get their explicit confirmation that they agree:\n      Terms of Service: https://api.acuris-geo.com/legal/terms\n      UK PAF Evaluation Terms: https://api.acuris-geo.com/legal/uk-evaluation-terms\n    Never set accept_terms=true on the user's behalf without that confirmation.\n    Without it the tool mints nothing and returns these links.\n\n    After receiving the key, reconfigure this MCP server connection with the\n    header \"Authorization: Bearer <key>\" (or set ACURIS_API_KEY for stdio).\n    UK (Royal Mail PAF) lookups are capped at 5 per UTC day while the key is\n    valid. Paid plans:\n    https://www.acuris-geo.com/acuris-pricing/",
          "inputSchema": {
            "properties": {
              "accept_terms": {
                "default": false,
                "title": "Accept Terms",
                "type": "boolean"
              },
              "email": {
                "title": "Email",
                "type": "string"
              }
            },
            "required": ["email"],
            "title": "request_trial_keyArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f4a3820d04c7ec85075a452f2e567235aeaf90f9b9c3aa409d6709fd19ff01e4"
        },
        {
          "name": "reverse_geocode",
          "description": "Coordinates → nearest address(es). Returns the closest reference\n    addresses to (lat, lng), nearest first, with distances.\n\n    Optional: `country` (ISO-3) to constrain the search, `radius_m`, `limit`.\n\n    Cost: 1 credit per successful lookup; an empty radius (no addresses found)\n    is refunded.",
          "inputSchema": {
