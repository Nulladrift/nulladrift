        {
          "name": "request_booking",
          "title": "Request a booking",
          "description": "Book a time for your user (confirm the details with them first). It goes to Ryan as a request: nothing is charged, he texts to confirm, and the customer gets an email with the details and a private link to change or cancel.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "add_ons": {
                "description": "Optional extras: pet-hair = Pet hair removal (+$35; with interior/full); shampoo = Carpet & seat shampoo (+$60; with interior/full); odor = Odor elimination (+$50; with interior/full); headlights = Headlight restoration (+$60; with wash/interior/exterior/full); engine = Engine bay cleaning (+$45; with exterior/full).",
                "items": {
                  "enum": ["pet-hair", "shampoo", "odor", "headlights", "engine"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "city": {
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "condition": {
                "description": "How it looks right now (first visit only; default lived): fresh = Basically clean; lived = Lived-in; kids = Kid-tested (+15%); dog = The dog's car now (+30%); yikes = We don't judge (+50%).",
                "enum": ["fresh", "lived", "kids", "dog", "yikes"],
                "type": "string"
              },
              "email": {
                "description": "Where the confirmation and change-or-cancel link go.",
                "format": "email",
                "maxLength": 120,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "gate_or_parking_notes": {
                "maxLength": 300,
                "type": "string"
              },
              "how_often": {
                "description": "onetime (default), biweekly = every 2 weeks (15% off each visit), monthly = every 4 weeks (10% off).",
                "enum": ["onetime", "biweekly", "monthly"],
                "type": "string"
              },
              "mud_run_code": {
                "description": "A Mud Run code (MUD-XXXX) earned with this email: 10% off a first Full detail.",
                "maxLength": 24,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "notes": {
                "maxLength": 600,
                "type": "string"
              },
              "ok_to_text": {
                "description": "Booking updates by text (default true).",
                "type": "boolean"
              },
              "phone": {
                "description": "Mobile number; Ryan texts to confirm.",
                "maxLength": 20,
                "minLength": 10,
                "type": "string"
              },
              "service": {
                "description": "Service: wash = Maintenance wash (from $79); interior = Interior detail (from $169); exterior = Exterior detail (from $149); full = Full detail (from $249); ceramic = Ceramic coating (from $899, one-time only).",
                "enum": ["wash", "interior", "exterior", "full", "ceramic"],
                "type": "string"
              },
              "start_time": {
                "description": "A start_time exactly as find_open_times returned it (ISO 8601, UTC).",
                "maxLength": 40,
                "type": "string"
              },
              "street": {
                "description": "Street address where the car will be.",
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              },
              "unit": {
                "maxLength": 60,
                "type": "string"
              },
              "vehicle": {
                "description": "Vehicle size: sedan = Sedan / coupe; suv = SUV / crossover; truck = Truck; xl = 3-row / van / XL.",
                "enum": ["sedan", "suv", "truck", "xl"],
                "type": "string"
              },
              "vehicle_description": {
                "description": "e.g. \"white 2021 Tesla Model 3\".",
                "maxLength": 80,
                "type": "string"
              },
              "zip": {
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["city", "email", "name", "phone", "service", "start_time", "street", "vehicle", "zip"],
            "type": "object"
          },
