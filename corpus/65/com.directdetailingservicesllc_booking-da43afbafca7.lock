        {
          "name": "check_service_area",
          "title": "Check the service area",
          "description": "Is a ZIP code in Ryan's service area? He covers Temecula, Murrieta, Menifee, Wildomar, French Valley, Winchester.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "zip": {
                "description": "5-digit ZIP of where the car will be.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
