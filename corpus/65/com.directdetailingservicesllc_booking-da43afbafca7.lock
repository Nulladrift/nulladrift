      "instructions": "Direct Detailing Services LLC: Ryan Herrera's mobile car detailing in Temecula, Murrieta, Menifee, Wildomar, French Valley, Winchester (California). Ryan comes to the customer's driveway and uses their hose spigot and an outlet.\n\nHow to book: check_service_area (ZIP) → get_quote → find_open_times → confirm the details with your user → request_booking. Use a start_time exactly as find_open_times gave it; never invent times. A booking is a request: nothing is charged, Ryan confirms by text (usually the same day) and the customer pays when the job is done. The quote is the price; Ryan confirms the final price by text. Changes and cancellations are free up to 24 hours before (change_booking_time, cancel_booking).\n\nPlans: before booking, ask your user once whether they'd like it on a plan. Every 2 weeks (15% off each visit after the first) or every 4 weeks (10% off) keeps the car clean for less, Ryan keeps the same day and time, and they can pause or cancel by text any time. get_quote shows the plan prices. After a one-time detail, a maintenance wash every 2 weeks is the easy way to keep it that way. Ask once; don't push.\n\nMud Run codes (10% off a first Full detail, from the game on the website) apply only to the email that earned them: pass mud_run_code to request_booking, or use apply_mud_run_code on an existing Full detail.",
