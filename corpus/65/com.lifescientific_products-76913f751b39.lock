        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lifescientific.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "com.lifescientific/products",
        "title": "Life Scientific product catalogue",
        "version": "0.2.0",
        "websiteUrl": "https://lifescientific.com/en/mcp",
        "icons": [
          {
            "src": "https://lifescientific.com/android-chrome-192x192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://lifescientific.com/android-chrome-512x512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Query the Life Scientific crop-protection catalogue directly — no API key required. Start with search_products to find a product by crop, target pest/disease, product type or market; call get_product for its full formulation, active ingredients (with FRAC/HRAC/IRAC resistance-group codes) and per-market registrations; check_authorization to confirm a product is approved for use in a specific market; and get_product_documents for the official label and safety data sheet. Pass a locale (en, es, fr, de, it, nl, pt, pl, ro, uk) to receive taglines and descriptions in that language — regulatory facts such as registration numbers, dose rates and pre-harvest intervals are authoritative and returned untranslated.\n\nRegistration numbers, dose rates, PHI and resistance-group codes are authoritative facts and are not translated.",
      "tools": [
        {
          "name": "check_authorization",
          "title": "Check market authorisation",
          "description": "Check whether a product is authorised in a specific market/region and, if so, return its registration status, number, pack sizes and approved uses. Use this to answer \"can I use product X in country Y?\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language for localised prose (taglines, descriptions). Defaults to \"en\". Regulatory facts are never translated.",
                "enum": ["en", "es", "fr", "de", "it", "nl", "pt", "pl", "ro", "uk"],
                "type": "string"
              },
              "region": {
                "description": "ISO alpha-2 market code, e.g. \"gb\", \"ie\", \"fr\".",
                "type": "string"
              },
              "slug": {
                "description": "Product slug.",
                "type": "string"
              }
            },
            "required": ["region", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:70e997ec6c8cbcdb7bb01b59a7e1fb497c87eed30f0d97b6ca0b25ce5ec1a559"
        },
        {
          "name": "get_product",
          "title": "Get product detail",
          "description": "Get the full detail for one product by its slug: active ingredients with resistance-group codes (FRAC/HRAC/IRAC), formulation, key uses, and per-market registrations with approved crop/target uses, PHI, pack sizes and safety summary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language for localised prose (taglines, descriptions). Defaults to \"en\". Regulatory facts are never translated.",
                "enum": ["en", "es", "fr", "de", "it", "nl", "pt", "pl", "ro", "uk"],
                "type": "string"
              },
              "slug": {
                "description": "Product slug (from search_products), e.g. \"spinosad-50\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24b24202bab9532159dbe5e80a4b8d5143541123c0713f34a95621a81cda07a0"
        },
        {
          "name": "get_product_documents",
          "title": "Get product documents (label / SDS)",
          "description": "Get the current regulatory documents for a product — the official product label and safety data sheet (SDS) per registered market, with download URLs and versions. Labels are market-specific: always use the document for the market where the product will be applied.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "region": {
                "description": "Optional ISO alpha-2 market code (e.g. \"gb\", \"ie\") to fetch one market only.",
                "type": "string"
              },
              "slug": {
                "description": "Product slug (from search_products).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:297ccf2535214d34cd9233fd03d9d4202b5dccf63c3ce8c1d78d9e1bc2019221"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search the Life Scientific crop-protection catalogue. Filter by free-text query (brand name, tagline, active ingredients, crops and pests), product type, crop, pest/disease/weed target, and/or market/region. Use this for problem-first questions like \"what controls septoria in wheat in Ireland?\". Returns a compact list of matching products. Pest/disease targets are not yet recorded for every market: if a target search in a market finds nothing, search that market by crop and type instead, and tell the user to confirm the target on the label (get_product_documents). Never conclude that no product controls it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "crop": {
                "description": "Crop name to match against approved uses (e.g. \"wheat\", \"potatoes\").",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 25).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language for localised prose (taglines, descriptions). Defaults to \"en\". Regulatory facts are never translated.",
                "enum": ["en", "es", "fr", "de", "it", "nl", "pt", "pl", "ro", "uk"],
                "type": "string"
              },
              "query": {
                "description": "Free-text search over name, tagline, active ingredients, crops and pests/diseases/weeds. Every word must match, in any order (e.g. \"septoria wheat\"). Best for pests and diseases.",
                "type": "string"
              },
              "region": {
                "description": "ISO alpha-2 market code to restrict to (e.g. \"gb\", \"ie\", \"fr\").",
                "type": "string"
              },
              "target": {
                "description": "Pest, disease or weed on an approved use in that market (e.g. \"septoria\", \"black-grass\"). Singular or plural.",
                "type": "string"
              },
              "type": {
                "description": "Restrict to one product type.",
                "enum": ["insecticide", "herbicide", "fungicide", "fertilizer", "growth-regulator", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae9e7ac634b5d841aba1e822f4c3b4bb4fd42007a0e0324b2199b247d35be96a"
        }
      ],
      "digest": "sha256:eb26b78c2d5bac7f145052b882dea8da2309c23a4e92dd473247e46c6d0d83e5"
    }
  }
