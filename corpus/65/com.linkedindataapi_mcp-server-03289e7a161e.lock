{
  "lockfileVersion": 2,
  "subjects": {
    "com.linkedindataapi/mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.linkedindataapi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "api-gateway-mcp-server",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "API Gateway — Real-time B2B professional profiles, company firmographics, employee directory, executive posts & hiring signals MCP Server. Discovery (initialize, tools/list) is unauthenticated. Pass header X-API-Key: <YOUR_KEY> (or Authorization: Bearer <YOUR_KEY>) when calling tools/call.",
      "tools": [
        {
          "name": "b2b_enrich_company",
          "description": "Resolve any LinkedIn company slug, URL, or corporate domain (e.g. \"stripe.com\") into verified headcount, industry, headquarters, organization ID, specialties, and website (10 Credits, 0 Credits on 404).",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "LinkedIn company slug (e.g. \"stripe\") or full LinkedIn company URL.",
                "type": "string"
              },
              "domain": {
                "description": "Corporate website domain (e.g. \"stripe.com\" or \"anthropic.com\").",
                "type": "string"
              },
              "refresh": {
                "description": "Set true to bypass the 14-day PostgreSQL hot cache.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Enrich Company Firmographics & Domain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:83cda9d430a140495aaff165de13c67c86d9ba48b06022971faad45032890da9"
        },
        {
          "name": "b2b_enrich_person",
          "description": "Enrich a public LinkedIn person profile by handle or URL without cookies (10 Credits = $0.001 base / $0.0004 Business, 0 Credits on 404). Returns full career timeline, education, skills, headline, current employer, location, and follower count.",
          "inputSchema": {
            "properties": {
              "refresh": {
                "description": "Set true to bypass the 7-day PostgreSQL hot cache and fetch live upstream.",
                "type": "boolean"
              },
              "url": {
                "description": "Optional full LinkedIn profile URL (alternative to username).",
                "type": "string"
              },
              "username": {
                "description": "LinkedIn profile public handle (e.g. \"satyanadella\") or full https://www.linkedin.com/in/... URL.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Enrich LinkedIn Person Profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:05cfc26aa79c37583400417f47fd8b6a9609bc35c0471132adec999b93669328"
        },
        {
          "name": "b2b_get_company_posts",
          "description": "Retrieve official LinkedIn company feed posts, product launches, and engagement metrics for a target company (10 Credits per call).",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "LinkedIn company slug (e.g. \"anthropic\" or \"stripe\").",
                "type": "string"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Company Official Posts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ac76f4d6971921f57ce579cc7442bc9cad0c8a0e3805573876ee5f1cf01ff2dc"
        },
        {
          "name": "b2b_get_person_posts",
          "description": "Retrieve recent public LinkedIn posts, commentary, and engagement metrics (likes, comments, reposts) for an executive handle (10 Credits per call).",
          "inputSchema": {
            "properties": {
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "username": {
                "description": "LinkedIn person handle (e.g. \"satyanadella\") or profile URL.",
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Executive Activity Posts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3229a47ace5f5a46ff4d2726fe51642005bd88121f16148ca7f68c4f2a953935"
        },
        {
          "name": "b2b_search_decision_makers",
          "description": "Search B2B decision-makers and company employees filtered by employer slug/domain, job title seniority (VP, CTO, Founder), keyword, and location (2 Credits per returned person, 0 Credits when empty).",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company LinkedIn slug (e.g. \"stripe\" or \"openai\").",
                "type": "string"
              },
              "company_domain": {
                "description": "Corporate root domain (e.g. \"stripe.com\").",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Geographic filter (e.g. \"San Francisco\", \"United States\").",
                "type": "string"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text keyword filter across headline, title, and bio.",
                "type": "string"
              },
              "title": {
                "description": "Role or seniority filter (e.g. \"VP Engineering\", \"CTO\", \"Head of Growth\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Company Employees & Decision-Makers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6bc1566c3a5f41ccca594bd8495e10740d014f5fef9f5bfc3c4ae404be5feefd"
        },
        {
          "name": "b2b_search_hiring_signals",
          "description": "Search active LinkedIn company job openings by company, role keyword, location, and remote flag to detect hiring velocity and technographic intent (2 Credits per job returned, 0 Credits when empty).",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company LinkedIn slug or name (e.g. \"stripe\", \"databricks\").",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Location filter (e.g. \"New York\", \"Remote\").",
                "type": "string"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Job title or technology keyword (e.g. \"Staff Rust Engineer\", \"Snowflake\").",
                "type": "string"
              },
              "remote": {
                "description": "Filter to remote-friendly roles.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Active Company Job Postings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0f7a86ecf2bfd75a5e1e7c11249b5e6d6c8a06dc41d51eb0838ff4b608f0c768"
        },
        {
          "name": "b2b_search_posts",
          "description": "Search public LinkedIn posts by buying-intent keyword or category topic (2 Credits per post returned, 0 Credits when empty).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search phrase (e.g. \"migrating from Clearbit\", \"SOC2 compliance automation\").",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search B2B Posts by Keyword"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:81b2b2b5ec98688734e4683617c073f9a33e6b4484e7b56faae1dbc5eaf5d0bf"
        }
      ],
      "digest": "sha256:33a6b270a563145709aa42076977057297b4f735666e554676a190c122143d4e"
    }
  }
}
