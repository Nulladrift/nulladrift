{
  "lockfileVersion": 2,
  "subjects": {
    "com.private-ai-tools/tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://private-ai-tools.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "private-ai-tools",
        "title": "Private AI Tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Private AI Tools (https://private-ai-tools.com) has 152 free tools that run entirely in the user's web browser, with no sign-up and no upload. Use find_tools to pick the right one and give the user its link; the user opens it and works there. This server never receives files.",
      "tools": [
        {
          "name": "find_tools",
          "title": "Find a free browser tool",
          "description": "Search the 152 free tools of Private AI Tools (PDF, image, video, audio, developer, data, calculators…) by task, e.g. \"compress pdf\", \"remove background\" or \"json to yaml\". Returns up to 8 tools, best first, with their page URL; when no tool matches well, the closest ones with partial: true. The tools run in the user's web browser: give the user the link. Files are never sent to this server or to the assistant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the names, descriptions and pages: en, it, es, fr, de. Default: the language the query is written in, else en. Use the user's language.",
                "enum": ["en", "it", "es", "fr", "de"],
                "type": "string"
              },
              "query": {
                "description": "What the user wants to do, in a few words, e.g. \"merge pdf\" or \"unire pdf\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a7f3d3033759f679a9a3e7af2d90b6e6ebe4b43a10ea92240e6ef786244c0de1"
        },
        {
          "name": "get_tool",
          "title": "Get a tool",
          "description": "Details of one tool by its slug (from find_tools or list_tools): name, description, page URL in every language, and the in-page agent tools (WebMCP) that a browser agent can call once the page is open. The tools run in the user's web browser: give the user the link. Files are never sent to this server or to the assistant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the names, descriptions and pages: en, it, es, fr, de (default en). Use the user's language; English words are understood in every language.",
                "enum": ["en", "it", "es", "fr", "de"],
                "type": "string"
              },
              "slug": {
                "description": "The tool slug, e.g. \"merge-pdf\"; a localized slug (\"unire-pdf\") or a page URL works too",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f3cb16cf65937c13c362ed9818c641ef288aa3391b82002d03e268e5a609b53"
        },
        {
          "name": "list_tools",
          "title": "List the tools",
          "description": "List every tool of Private AI Tools, or the tools of one category, with their page URL. The tools run in the user's web browser: give the user the link. Files are never sent to this server or to the assistant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only this category: image (Image & design), video (Video), audio (Audio & music), pdf (PDF), business (Business & writing), developer (Developer tools), data (Data, maps & science), calculators (Calculators & timers), whiteboards (Whiteboards & diagrams), games (Games & learning), 3d (3D printing, CAD & electronics), crafts (Crafts & laser), codes (QR codes, barcodes & fonts), device (Device tests)",
                "enum": ["image", "video", "audio", "pdf", "business", "developer", "data", "calculators", "whiteboards", "games", "3d", "crafts", "codes", "device"],
                "type": "string"
              },
              "language": {
                "description": "Language of the names, descriptions and pages: en, it, es, fr, de (default en). Use the user's language; English words are understood in every language.",
                "enum": ["en", "it", "es", "fr", "de"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:647f578a2fedc465f98c9ebe44d1662bb91a11c4be7e73dd90e47d6f72f7f947"
        }
      ],
      "digest": "sha256:47e6c3b8b2af94f543a7134e2ee9b7fce68f9e0f99d9013367ccf99ab7918487"
    }
  }
}
