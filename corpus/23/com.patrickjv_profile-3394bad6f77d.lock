      "instructions": "Public profile of Patrick Vieira, a platform engineer in London (not the footballer). Use get_profile, list_work, list_skills and list_faq for facts. Use request_intro only when a person has asked to contact him and approved the message. To book a meeting, use list_meeting_types and get_availability, then book_meeting only when a person has asked for that meeting; they confirm it by signing in with Google on the link it returns.\n\n# How to book a call with Patrick Vieira\n\n1. Call `list_meeting_types` to see the options (Consultation, 30 minutes; Recruiter intro, 15 minutes).\n2. Call `get_availability` with a type. It lists free times in London working hours, each with its UTC offset. Steps 1 and 2 need no sign-in.\n3. Agree a time with your person.\n4. Call `book_meeting` with the type, the start time and an optional note. Don't send their name or email address: those come from their sign-in. This doesn't reserve the time yet.\n5. Give your person the `confirm_url` from the result. They open it and sign in with Google before `link_expires` (within 60 minutes). That books the call in their name, and Google sends them the invite. If someone else has taken the time in the meantime, the page tells them.\n6. Call `get_booking_status` to check it's confirmed. Its status is one of `pending_confirmation`, `confirmed`, `declined`, `expired` or `cancelled`. If it says `pending_confirmation`, the booking isn't finished yet (your person may still be signing in, or the site may be finishing it): wait and check again, and don't book again. If it says `declined` or `expired`, start again from step 2.\n\nTo cancel, call `cancel_booking`. A request your person hasn't signed in on yet is withdrawn at once. If it returns a `confirm_url`, give it to your person: they sign in to cancel. If it says a cancellation email was sent, your person uses the link in that email. If it says the booking is still being finished, check again in a few minutes and cancel then. People can also book at https://patrickjv.com/book.\n",
      "tools": [
        {
          "name": "book_meeting",
          "title": "Book a meeting",
          "description": "Step 4 of the booking guide (get_booking_guide). Ask to book a time with Patrick Vieira for a person: returns a confirm_url to give them. Nothing is reserved yet, and nothing is emailed: the call is booked, in their name, when they open the link and sign in with Google (within 60 minutes). Don't send their name or email address: those come from their sign-in. Only use this when the person has asked for this meeting at this time. Do not retry on error. Then use get_booking_status. Privacy: until the person signs in, the site keeps only the type, time and note; see https://patrickjv.com/privacy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "note": {
                "description": "Optional: what the meeting is about, in plain text.",
                "maxLength": 500,
                "type": "string"
              },
              "start": {
                "description": "Start time exactly as given by get_availability (ISO 8601 with offset).",
                "maxLength": 40,
                "type": "string"
              },
              "type": {
                "description": "A meeting type id from list_meeting_types.",
                "enum": ["consultation", "recruiter-intro"],
                "type": "string"
              }
            },
            "required": ["start", "type"],
            "type": "object"
          },
