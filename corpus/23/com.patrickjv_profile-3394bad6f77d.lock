        {
          "name": "request_intro",
          "title": "Request an introduction",
          "description": "Send Patrick Vieira a short introduction by email on behalf of a person. Only use this when the person has asked you to contact him and has approved the message. Strictly rate-limited; at most a couple per sender per day. Do not retry on error. Privacy: the message is forwarded to Patrick's email and not stored by this site; rate-limit counters are hashed and expire daily.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Optional: name of the AI agent sending this on the person's behalf.",
                "maxLength": 100,
                "type": "string"
              },
              "from_email": {
                "description": "Email address Patrick should reply to (ASCII).",
                "maxLength": 254,
                "type": "string"
              },
              "from_name": {
                "description": "Full name of the person making the introduction.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "message": {
                "description": "The introduction itself, in plain text.",
                "maxLength": 2000,
                "minLength": 20,
                "type": "string"
              },
              "organisation": {
                "description": "Optional organisation.",
                "maxLength": 100,
                "type": "string"
              },
              "reason": {
