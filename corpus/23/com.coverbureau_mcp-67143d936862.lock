{
  "lockfileVersion": 2,
  "subjects": {
    "com.coverbureau/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://coverbureau.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "coi-validator-core",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_carrier",
          "title": "Check Carrier",
          "description": "Check an insurer by NAIC code or name: known, licensed, and adequately rated (spec §3.3). Provide at least one of naic or carrierName, plus state (required). Answers from an UNVERIFIED seed dataset (§4.5 datasetStatus) and returns a signed envelope. Needs no document. Use it when you have a carrier but no certificate; validate_coi already checks the carrier when you do.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "carrierName": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "Carrier name as printed on the certificate"
              },
              "minRating": {
                "anyOf": [
                  {
                    "type": "string"
                  }
                ],
                "description": "Minimum acceptable A.M. Best rating, e.g. \"A- VII\". Defaults to \"A- VII\""
              },
              "naic": {
                "anyOf": [
                  {
                    "pattern": "^\\d{5}$",
                    "type": "string"
                  }
                ],
                "description": "5-digit NAIC company code, e.g. \"25623\""
              },
              "state": {
                "description": "2-letter US state code, e.g. \"NY\" — REQUIRED",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9aafd274fc0a019943d88125a8eae4cb2c7d718b748d1951032ba61c048ff3e9"
        },
        {
          "name": "extract_coi",
          "title": "Extract COI",
          "description": "Read an ACORD 25 Certificate of Insurance into structured data (spec §3.1). Returns a signed envelope. Use it when you want the fields and will apply your own rules; for a verdict against requirements you supply use validate_coi instead - it extracts as part of its work, so calling both on one document pays for the same read twice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "document": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "data": {
                        "description": "Base64-encoded document bytes, no data: URI prefix",
                        "type": "string"
                      },
                      "kind": {
                        "const": "base64",
                        "type": "string"
                      },
                      "mediaType": {
                        "enum": ["application/pdf", "image/png", "image/jpeg"],
                        "type": "string"
                      }
                    },
                    "required": ["data", "kind", "mediaType"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "kind": {
                        "const": "url",
                        "type": "string"
                      },
                      "url": {
                        "description": "https URL, fetched server-side under the §7.2 SSRF limits",
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "required": ["kind", "url"],
                    "type": "object"
                  }
                ],
                "description": "The certificate to read: base64 bytes, or an https url fetched server-side (§3.5)"
              },
              "options": {
                "additionalProperties": false,
                "properties": {
                  "redactStored": {
                    "type": "boolean"
                  },
                  "returnConfidence": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:55541aeb1da7d7817ed9715306a86992b8e2d0a3c565b685c88f706096d14dda"
        },
        {
          "name": "validate_coi",
          "title": "Validate COI",
          "description": "Extract an ACORD 25 certificate AND judge it against a requirement profile (inline or profileId), returning a signed Verdict with per-check results, flags, and a risk score (spec §3.2). Use extract_coi instead if you only want the fields without a verdict; use check_carrier only when you have no certificate, since this tool already checks the carrier when your profile sets a carrier requirement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "document": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "data": {
                        "description": "Base64-encoded document bytes, no data: URI prefix",
                        "type": "string"
                      },
                      "kind": {
                        "const": "base64",
                        "type": "string"
                      },
                      "mediaType": {
                        "enum": ["application/pdf", "image/png", "image/jpeg"],
                        "type": "string"
                      }
                    },
                    "required": ["data", "kind", "mediaType"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "kind": {
                        "const": "url",
                        "type": "string"
                      },
                      "url": {
                        "description": "https URL, fetched server-side under the §7.2 SSRF limits",
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "required": ["kind", "url"],
                    "type": "object"
                  }
                ],
                "description": "The certificate to read: base64 bytes, or an https url fetched server-side (§3.5)"
              },
              "options": {
                "additionalProperties": false,
                "properties": {
                  "checkCarrier": {
                    "type": "boolean"
                  },
                  "evaluationDate": {
                    "type": "string"
                  },
                  "redactStored": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "requirements": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "carrier": {
                        "additionalProperties": false,
                        "properties": {
                          "minAmBestRating": {
                            "type": "string"
                          },
                          "mustBeLicensedInState": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "certificateHolderMustMatch": {
                        "$ref": "#/properties/requirements/anyOf/0/properties/insuredNameMustMatch"
                      },
                      "coverages": {
                        "additionalProperties": false,
                        "properties": {
                          "autoLiability": {
                            "$ref": "#/properties/requirements/anyOf/0/properties/coverages/properties/generalLiability"
                          },
                          "generalLiability": {
                            "additionalProperties": false,
                            "properties": {
                              "limits": {
                                "additionalProperties": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "min": {
                                      "type": "integer"
                                    }
                                  },
                                  "required": ["min"],
                                  "type": "object"
                                },
                                "type": "object"
                              },
                              "minDaysToExpiry": {
                                "minimum": 0,
                                "type": "integer"
                              },
                              "mustBeActive": {
                                "type": "boolean"
                              },
                              "requireAdditionalInsured": {
                                "type": "boolean"
                              },
                              "requireOccurrenceForm": {
                                "type": "boolean"
                              },
                              "requirePrimaryNonContributory": {
                                "type": "boolean"
                              },
                              "requireSubrogationWaiver": {
                                "type": "boolean"
                              },
                              "required": {
                                "type": "boolean"
                              }
                            },
                            "required": ["required"],
                            "type": "object"
                          },
                          "umbrellaExcess": {
                            "$ref": "#/properties/requirements/anyOf/0/properties/coverages/properties/generalLiability"
                          },
                          "workersComp": {
                            "$ref": "#/properties/requirements/anyOf/0/properties/coverages/properties/generalLiability"
                          }
                        },
                        "type": "object"
                      },
                      "formMustBeCurrent": {
                        "type": "boolean"
                      },
                      "insuredNameMustMatch": {
                        "additionalProperties": false,
                        "properties": {
                          "expected": {
                            "type": "string"
                          },
                          "mode": {
                            "enum": ["exact", "normalized", "fuzzy"],
                            "type": "string"
                          }
                        },
                        "required": ["expected", "mode"],
                        "type": "object"
                      },
                      "label": {
                        "type": "string"
                      },
                      "profileId": {
                        "type": "string"
                      },
                      "rulesetVersionPin": {
                        "type": "string"
                      }
                    },
                    "required": ["coverages"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "profileId": {
                        "type": "string"
                      }
                    },
                    "required": ["profileId"],
                    "type": "object"
                  }
                ],
                "description": "Either an inline RequirementProfile (§4.2) or { profileId } naming a stored profile (§3.2)"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6aaa1ffc6c5360fedaf4d1b4a14bb7aab0536de3243832e0fd912dc41ff807c7"
        }
      ],
      "digest": "sha256:7fa3c35ebb71bad67afba967b8777f2434e482cf7768c1105bd91801edc5bda8"
    }
  }
}
