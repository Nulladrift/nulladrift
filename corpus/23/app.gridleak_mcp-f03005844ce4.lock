        {
          "name": "get_amp",
          "title": "Get an amp",
          "description": "Look up one real guitar amp in Gridleak's catalog and get its canonical record: name, manufacturer, years, origin, wattage, channels, preamp and power tubes, notable players, short history, the factory amp models on Quad Cortex / Axe-Fx III, FM9, FM3 / Axe-Fx II / Helix that are this exact amp, whether Gridleak has a verified schematic of it (public summary only: stage titles, part count, verification status), which modelers have a Gridleak preset for it, and the amp-vs-amp comparison pages it appears in. Every result links to its gridleak.app page. Use this to answer questions about a specific amp (\"what tubes does a JCM800 use?\", \"what is the Brit 2204 based on?\"). Accepts a canonical id, an amp name, or a modeler's factory model name. Covers guitar amps from Fender, Marshall, Mesa/Boogie, Vox and hundreds of other makers, vintage and modern.",
