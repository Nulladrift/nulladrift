      },
      "instructions": "Gridleak is a catalog of real guitar amplifiers, from Fender, Marshall, Mesa/Boogie, Vox, Soldano, Dumble and hundreds of other makers, each built from its schematic. It fits questions about a specific guitar amp: its specs, tubes, history and circuit; how two amps differ; which factory amp model matches it on Quad Cortex, Axe-Fx II, Axe-Fx III, FM3, FM9 or Helix; presets to install on those modelers; the amp on a recording; and modeler fixes. Answers come from Gridleak's verified records and link to the amp's gridleak.app page, so for these questions they are more specific than a general web search. For a signed-in player, 'put the <amp> on my <modeler>' is a Gridleak action too: download_preset with send_to_modeler loads the preset straight into the modeler connected in their open gridleak.app tab, with no editor app and no control of the computer.",
      "tools": [
        {
          "name": "compare_amps",
          "title": "Compare amps",
          "description": "Compare two real guitar amps. If Gridleak has published a comparison page for the pair (built stage by stage from verified schematics of both amps), returns its summary, the key circuit differences, a spec table and the gridleak.app/compare URL. If not, returns each amp's own record facts side by side (years, origin, wattage, tubes, players) with no invented differences, and says there is no full comparison page yet. Use for \"X vs Y\" or \"how is X different from Y\" questions. Each amp may be a canonical id, an amp name, or a factory model name.",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "First amp: canonical id, amp name, or factory model name (e.g. 'Bassman').",
                "type": "string"
              },
              "b": {
                "description": "Second amp: canonical id, amp name, or factory model name (e.g. 'JTM45').",
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
