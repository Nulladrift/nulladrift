        {
          "name": "find_modeler_equivalent",
          "title": "Find the modeler equivalent",
          "description": "Translate between real amps and modeler factory amp models. Given a real amp (\"Dual Rectifier\", \"Vox AC30\"), returns the factory amp models on each modeler (or on one device) whose maker says they are that exact amp. Given a factory model name (\"Brit 2204\", \"Cali Rectifire\", \"Class-A 30W TB\"), returns the real amp it is, with a link to its gridleak.app page. Only exact twins are listed, never nearest-sounding models. Devices: quadcortex, axefx3 (the Axe-Fx III, FM9 and FM3 share one list; fm9 and fm3 are accepted too), axefx2, helix.",
