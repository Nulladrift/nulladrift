        {
          "name": "import_video_from_url",
          "title": "Import video from URL",
          "description": "Add a video to a channel from a direct media URL. THIS IS THE MAIN WAY TO ADD CONTENT over MCP — you cannot upload local file bytes through this interface, so if the owner has local files, ask them to host them somewhere reachable or upload via the app. The URL must be a direct, public, unauthenticated link to mp4/mov/m4v/mpeg/mpg/avi, or a FINITE .m3u8 (VOD, not a live stream) — not a web page, not behind a login, not a YouTube/Vimeo watch page. The server downloads it. Returns immediately; the asset then goes downloading -> pending -> transcoding -> ready. Duration counts against the weekly upload quota. Re-submitting the same URL to the same channel returns the original asset instead of importing twice.",
          "inputSchema": {
            "properties": {
              "channel_id": {
                "type": "integer"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "description": "Direct, public media URL",
                "type": "string"
              },
              "weight": {
                "description": "How often it plays, 0-10 (default 5). Set it here rather than after — see set_asset_weight.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["channel_id", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Import video from URL"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3020429cf99fa8bcc10db08a75a0cb868ae09efb3285d27bd7ac343b1bbeb3eb"
        },
        {
          "name": "import_youtube_video",
          "title": "Import YouTube video",
          "description": "Import a YouTube video that the OWNER UPLOADED THEMSELVES. This will not work for anyone else's video, by design — a channel built from other people's videos is a copyright problem for the owner.\n\nOwnership is proved by a tag only the uploader can add:\n  1. The owner's tag looks like 'MyTVChannelApp#<device-id>'. When the import fails for a missing tag, the 403 error message contains that account's exact tag string.\n  2. They paste that exact string into the video's description or tags on YouTube.\n  3. Retry the import.\n\nYou cannot do step 2 for them and you cannot bypass it. Public finished videos only: no live streams, no private or age-restricted videos, no playlists or channel URLs. Capped at 10 per day. Counts against the same weekly upload quota as everything else.",
          "inputSchema": {
            "properties": {
              "channel_id": {
                "type": "integer"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "description": "Overrides the YouTube title",
                "type": "string"
              },
              "url": {
                "description": "A single-video YouTube URL (watch, shorts or youtu.be)",
                "type": "string"
              },
              "weight": {
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["channel_id", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Import YouTube video"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9dc992d3d3951d7374940f92a31598dfd5c22c27482e24b1d2815224932b0796"
