          "description": "Create a 24/7 linear TV channel. It will NOT be live yet — a channel goes live automatically once it has at least 4 ready assets AND at least 15 minutes of total content. is_public lists it in Discover and is available on every subscription tier, including Starter.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "channel_type": {
                "description": "Use \"thematic\" unless the channel is tied to a place",
                "enum": ["thematic", "location"],
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "handle": {
                "description": "3-63 chars, lowercase a-z 0-9 and hyphens. Becomes {handle}.my-tv-channel.com",
                "type": "string"
              },
              "is_public": {
                "description": "List in Discover. Available on all tiers.",
                "type": "boolean"
              },
              "location": {
                "description": "Required only when channel_type is \"location\"",
                "properties": {
