                    "type": "number"
                  },
                  "longitude": {
                    "type": "number"
                  },
                  "name": {
                    "type": "string"
                  },
                  "radius_km": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "name": {
                "description": "Display name",
                "type": "string"
              },
              "orientation": {
                "description": "vertical = 9:16",
