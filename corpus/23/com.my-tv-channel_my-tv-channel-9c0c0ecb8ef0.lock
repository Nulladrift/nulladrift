        {
          "name": "set_asset_weight",
          "title": "Set asset weight",
          "description": "Change how often a video plays (weight 0-10, default 5; 0 removes it from rotation entirely), and optionally its title or tags. IMPORTANT ORDERING: weights only affect what actually airs when the schedule is (re)generated. A channel builds its schedule the instant it crosses the launch threshold, so weights set AFTER that are stored but do not air. Either set the weight when you import each video, or call regenerate_schedule afterwards. Weights are relative: identical weights across every video produce a uniform rotation, and the spread between them is what shapes airtime.",
          "inputSchema": {
            "properties": {
              "asset_id": {
                "type": "integer"
              },
              "tags": {
                "description": "Tag videos seqXX01, seqXX02 … (XX = any two letters) to force them to play in order as a mini-series.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "type": "string"
              },
              "weight": {
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["asset_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set asset weight"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:88698415d3cb48c2e48ec98d7b81b0d89a53c750fa0a0f1076635b0e6d771c6d"
        },
        {
          "name": "set_schedule_rules",
          "title": "Set schedule rules",
          "description": "Give the channel a durable schedule: fixed slots (\"news at 18:00\") and dayparts (\"no kids content after 22:00\"). The scheduler re-honours these on EVERY rebuild, so you set them once instead of babysitting the grid. **Pro tier or higher.**\n\nThis REPLACES the entire ruleset — send every rule you want, not just new ones. Sending an empty array removes all rules and returns the channel to plain weighted-random. Validate first with validate_schedule_rules.\n\nRule shapes:\n  time_slot      {rule_type:'time_slot', start_time:'18:00', end_time?:'21:00',\n                  days_mask:127, selector_type:'asset'|'tag'|'playlist',\n                  selector_value:<id|tag|[ids]>, priority?:0}\n  daypart_weight {rule_type:'daypart_weight', start_time:'22:00', end_time:'06:00',\n                  days_mask:127, selector_type:'asset'|'tag', selector_value:...,\n                  weight_multiplier:0-10}\n\ndays_mask is a bitmask: bit0=Mon … bit6=Sun. 127=daily, 31=Mon-Fri, 96=weekend.\nend_time on a time_slot makes it a BLOCK that keeps drawing from the selector until that time — that is how you get 'cartoons 06:00-09:00' rather than one cartoon.\nselector_type 'playlist' with an array of asset ids plays them IN ORDER.\nweight_multiplier 0 removes matching assets from that window entirely.\n\nSet `timezone` (IANA) or the times mean UTC, which is almost never what the owner meant. Slots start ON-OR-AFTER their time: the programme running into a slot is never cut short, so an 18:00 slot may begin at 18:02. That is intended.",
          "inputSchema": {
            "properties": {
              "channel_id": {
                "type": "integer"
              },
              "rules": {
                "description": "The COMPLETE ruleset. Empty array clears all rules.",
                "items": {
                  "properties": {
                    "days_mask": {
                      "maximum": 127,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "end_time": {
                      "description": "Required for daypart_weight; on a time_slot makes it a block",
                      "type": "string"
                    },
                    "priority": {
                      "description": "Higher wins when slots overlap",
                      "type": "integer"
                    },
                    "rule_type": {
                      "enum": ["time_slot", "daypart_weight"],
                      "type": "string"
                    },
                    "selector_type": {
                      "enum": ["asset", "tag", "playlist"],
                      "type": "string"
                    },
                    "selector_value": {
                      "description": "Asset id, tag name, or array of asset ids"
                    },
                    "start_time": {
                      "description": "HH:MM or HH:MM:SS, wall clock in the channel timezone",
                      "type": "string"
                    },
                    "weight_multiplier": {
                      "maximum": 10,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["rule_type", "selector_type", "selector_value", "start_time"],
                  "type": "object"
                },
                "type": "array"
              },
              "timezone": {
                "description": "IANA name, e.g. \"Europe/Paris\". Strongly recommended.",
                "type": "string"
              }
            },
            "required": ["channel_id", "rules"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set schedule rules"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f52b86247a00ca094962c7868f7662b091d76d400b929f878fae8ab371a26352"
        },
        {
          "name": "update_channel",
          "title": "Update channel",
          "description": "Update an existing channel: name, description, visibility, category, language, age rating, or the community chat link. Only send the fields you are changing.",
          "inputSchema": {
            "properties": {
              "age_classification": {
                "enum": ["4+", "9+", "13+", "16+", "18+"],
                "type": "string"
              },
              "allow_offline_download": {
                "type": "boolean"
              },
              "category": {
                "type": "string"
              },
              "channel_id": {
                "type": "integer"
              },
              "chat_channel_id": {
                "description": "Discord channel id within that server",
                "type": "string"
              },
              "chat_platform": {
                "description": "Community chat platform shown as an overlay on the player. Discord is the fully supported one; the others are accepted but only Discord has a working embed today.",
                "enum": ["discord", "guilded", "matrix", "revolt", "kick", "restream"],
                "type": "string"
              },
              "chat_server_id": {
                "description": "Discord server (guild) id — the owner must supply this; you cannot discover it",
                "type": "string"
              },
              "description": {
                "type": "string"
              },
