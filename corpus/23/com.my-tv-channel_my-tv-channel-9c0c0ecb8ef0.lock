      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Create and run 24/7 linear TV channels. Typical flow: get_account_status to learn the tier and quota, create_channel, import_video_from_url for each video (setting its weight as you go), poll get_transcode_status until meetsLaunchRequirements is true, then get_channel until scheduleStatus is 'active' and report {handle}.my-tv-channel.com to the owner. A channel needs 4+ ready videos and 15+ minutes before it can go live. If you change weights on an already-live channel, call regenerate_schedule or the change will not air.",
      "tools": [
        {
          "name": "archive_channel",
          "title": "Archive channel",
          "description": "Take a channel off the air and out of every listing. This ARCHIVES rather than destroys: the handle stays reserved and assets and schedule history are retained, so it can be restored. Refuses with 409 while transcodes are still running. Idempotent. This is the reversible way to take a channel down; delete_asset removes individual videos instead.",
          "inputSchema": {
            "properties": {
              "channel_id": {
                "type": "integer"
              }
            },
            "required": ["channel_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Archive channel"
          },
          "behavior": {
