        },
        {
          "name": "find_cinemas",
          "title": "Find cinemas",
          "description": "Cinemas near a place (with distance), or by name, optionally only those with IMAX, premium or comfort screens or of one chain.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chain": {
                "maxLength": 60,
                "type": "string"
              },
              "country": {
                "description": "Country to search in: \"ie\", \"uk\", \"au\" or a country name. Optional.",
                "maxLength": 40,
                "type": "string"
              },
              "has_comfy": {
                "type": "boolean"
              },
              "has_imax": {
                "type": "boolean"
              },
              "has_premium": {
                "type": "boolean"
              },
              "lat": {
                "description": "Latitude, with lon, instead of a place name. You can pass a town's coordinates yourself when its name is not found or is shared.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Longitude, with lat.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "name": {
                "description": "Search by cinema name instead of place.",
                "maxLength": 120,
                "type": "string"
              },
              "place": {
                "description": "Town, city, area or cinema neighbourhood, e.g. \"Dublin\", \"Leicester Square\", \"Parramatta\". A name in several countries gives the clear favourite and says so, or a list to choose from when none leads: add the country, e.g. \"Newcastle, Australia\". For a small town or suburb that is not found, pass its lat and lon instead.",
                "maxLength": 120,
                "type": "string"
              },
              "radius_km": {
                "maximum": 80,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
