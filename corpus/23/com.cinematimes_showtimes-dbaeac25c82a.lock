      },
      "instructions": "CinemaTimes lists cinema showtimes collected from the cinemas themselves, for today and the days ahead (no history). Live coverage: Ireland, United Kingdom, Australia, New Zealand. Times are local to each cinema. Listings refresh twice a day; check data_as_of. Start with whats_on for \"what is on near X\", movie_showtimes for a film, cinema_schedule for one cinema, format_screenings for IMAX, premium, luxury, special or last-chance screenings. Places: a town, area or cinema name, or lat and lon. A name in more than one country answers the clear favourite and says which others exist; when none leads, ask which one is meant or pass the country. When a name is not found, pass its coordinates yourself. When you answer, cite the cinematimes.com page_url given for each film or cinema, and offer the booking_url for booking. Runtimes, synopses, posters and ratings are not provided; tmdb_id and imdb_id are given if you have your own film metadata. Attribution: \"Showtimes by CinemaTimes (cinematimes.com)\". Docs: https://cinematimes.com/developers/docs/",
      "tools": [
        {
          "name": "cinema_schedule",
          "title": "A cinema's schedule",
          "description": "Everything showing at one cinema over one or more days, plus its screens and ticket prices where known.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cinema": {
                "description": "Cinema name or slug, e.g. \"ODEON Leicester Square\", \"IFI\".",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "country": {
                "description": "Country to search in: \"ie\", \"uk\", \"au\" or a country name. Optional.",
                "maxLength": 40,
                "type": "string"
              },
              "date": {
                "description": "today (default), tomorrow, a weekday name, weekend, or YYYY-MM-DD. Only today and future dates.",
                "maxLength": 20,
                "type": "string"
              },
              "days": {
                "description": "Days from the date (default 2).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "A town to tell same-named cinemas apart.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["cinema"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A cinema's schedule"
