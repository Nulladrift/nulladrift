{
  "lockfileVersion": 2,
  "subjects": {
    "com.lotsofsounds/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.lotsofsounds.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lotsofsounds",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "browse_samples",
          "title": "Browse free sample sounds",
          "description": "Return curated free CC0 sample sounds from the bounded Lots of Sounds catalog. No account is required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max 12",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Optional keyword filter over the free samples, e.g. 'rain'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["openid", "profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:03f33a91d623ca3a89654fd703597bee9011bf02c0ada2a953e04d64d1f71415"
        },
        {
          "name": "download_sound",
          "title": "Get a sound download link",
          "description": "Return a time-limited signed download URL that expires in one hour for a sound in the bounded Lots of Sounds catalog. A connected account is required. Use this only when the user is ready to download.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The sound id returned by search_sounds",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["openid", "profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:af1fd596b8e47626d2e1a84f715284069de6ede83d5656005efdba88ac45df8a"
        },
        {
          "name": "get_profile",
          "title": "Get connected profile",
          "description": "Return the stable Lots of Sounds profile connected to this request. Use it only to identify the active plugin account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Email address for display.",
                "format": "email",
                "type": "string"
              },
              "id": {
                "description": "Opaque profile ID that stays unchanged for this account.",
                "minLength": 1,
                "pattern": "\\S",
                "type": "string"
              },
              "name": {
                "description": "Display name for the connected profile.",
                "type": "string"
              },
              "nickname": {
                "description": "Label for the connected profile.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/profile": true,
            "securitySchemes": [
              {
                "scopes": ["openid", "profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:c455631482fa3111be1cdb41d5c285426106abe4d11e2e8a7fd89cb7af96a4c5"
        },
        {
          "name": "get_sound",
          "title": "Get sound details",
          "description": "Fetch full metadata for one sound in the bounded Lots of Sounds catalog by ID. A connected account is required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The sound id returned by search_sounds",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["openid", "profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:31015e6bfdef19b7250284849ed2d12267e13a94255eaa36d51074de24498333"
        },
        {
          "name": "search_sounds",
          "title": "Search sound effects",
          "description": "Search the bounded Lots of Sounds CC0 catalog by keyword, tags, category, and duration. A connected account is required. Each word in the query must match the sound name, description or a tag, so use short keywords and narrow the search with tags or max_duration. Results include timing (onset, peak and tail in milliseconds) and loudness (LUFS and true peak) when the sound has been analysed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["SFX", "MUSIC", "LOFI", "AMBIENT"],
                "type": "string"
              },
              "limit": {
                "description": "Max 100, default 20",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "max_duration": {
                "description": "Maximum duration in seconds",
                "type": "number"
              },
              "min_duration": {
                "description": "Minimum duration in seconds",
                "type": "number"
              },
              "order": {
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "page": {
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Keywords, e.g. 'card shuffle'. Every word must match the name, description or a tag. Use short words, not a sentence.",
                "type": "string"
              },
              "sort": {
                "enum": ["downloads", "created_at", "duration", "name"],
                "type": "string"
              },
              "tags": {
                "description": "Tags to match (AND logic)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["openid", "profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:20b094531412e24ad3756462946c7f0eaaa687c496e3337d73a64db812bdb9f0"
        }
      ],
      "digest": "sha256:a0960f720a281efb82caac396c45470aec9f69ecc6e985a4fa17ea9c11459b4d"
    }
  }
