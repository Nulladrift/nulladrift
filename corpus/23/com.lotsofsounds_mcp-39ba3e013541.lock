      "tools": [
        {
          "name": "browse_samples",
          "title": "Browse free sample sounds",
          "description": "Return curated free CC0 sample sounds from the bounded Lots of Sounds catalog. No account is required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max 12",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Optional keyword filter over the free samples, e.g. 'rain'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["openid", "profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:8030bc37632fc8a78ba3a47e9059078126048b48bdb16284c5655d2dbfd25838"
        },
        {
          "name": "download_sound",
          "title": "Get a sound download link",
          "description": "Return a time-limited signed download URL that expires in one hour for a sound in the bounded Lots of Sounds catalog. A connected account is required. Use this only when the user is ready to download.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The sound id returned by search_sounds",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["openid", "profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:cf543e2fd35856d45f4488f5b7189e3fc293243e779a9b3651d3520c42d9c8c9"
        },
        {
          "name": "get_profile",
          "title": "Get connected profile",
          "description": "Return the stable Lots of Sounds profile connected to this request. Use it only to identify the active plugin account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Email address for display.",
                "format": "email",
                "type": "string"
              },
              "id": {
                "description": "Opaque profile ID that stays unchanged for this account.",
                "minLength": 1,
                "pattern": "\\S",
                "type": "string"
              },
              "name": {
                "description": "Display name for the connected profile.",
                "type": "string"
              },
              "nickname": {
                "description": "Label for the connected profile.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/profile": true,
            "securitySchemes": [
              {
                "scopes": ["openid", "profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:4306a0c91fb8c768dc204f3b14c759692ae5f3d723eadf927f7ebbbda93753f1"
        },
        {
          "name": "get_sound",
          "title": "Get sound details",
          "description": "Fetch full metadata for one sound in the bounded Lots of Sounds catalog by ID. A connected account is required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The sound id returned by search_sounds",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["openid", "profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:19181bb285897a8670b873c6afcd866ddf11c06d2d6efbd5a196d1cd0dec1262"
        },
        {
          "name": "search_sounds",
          "title": "Search sound effects",
          "description": "Search the bounded Lots of Sounds CC0 catalog by keyword, tags, category, and duration. A connected account is required. Each word in the query must match the sound name, description or a tag, so use short keywords and narrow the search with tags or max_duration. Results include timing (onset, peak and tail in milliseconds) and loudness (LUFS and true peak) when the sound has been analysed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["SFX", "MUSIC", "LOFI", "AMBIENT"],
                "type": "string"
              },
              "limit": {
                "description": "Max 100, default 20",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "max_duration": {
                "description": "Maximum duration in seconds",
                "type": "number"
              },
              "min_duration": {
                "description": "Minimum duration in seconds",
                "type": "number"
              },
              "order": {
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "page": {
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Keywords, e.g. 'card shuffle'. Every word must match the name, description or a tag. Use short words, not a sentence.",
                "type": "string"
              },
              "sort": {
                "enum": ["downloads", "created_at", "duration", "name"],
                "type": "string"
              },
              "tags": {
                "description": "Tags to match (AND logic)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["openid", "profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:d21ad06ee0ad2477ea1f2ab8ac8e81b3574e9f82bec58c52f84ef980d13b2ecd"
        }
      ],
      "digest": "sha256:f50a9c8623ffe28529124619d91109600332bfba5a92696b2ee4120509c0f80a"
