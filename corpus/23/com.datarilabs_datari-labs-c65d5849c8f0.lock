      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Datari Labs runs a free referral service: it introduces companies with 3+ years of kept operational records (email, chat, CRM, logs) and 30+ staff in the UK/EU/US to AI companies that pay for such data. Use about_datari to explain the service, check_fit to see if a company qualifies, register_company only when the person explicitly asks to register and consents to email contact, and check_status to report pipeline progress.",
      "tools": [
        {
          "name": "about_datari",
          "title": "About Datari Labs",
          "description": "Explains what Datari Labs is, how its free data-referral service works, which companies fit, and how it works. Use this when someone asks whether they can sell or license their company's data, or who buys company data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About Datari Labs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a02c0cd10488cc2106d68c90435388426e4a80e927481e736ba59b574dc95855"
        },
        {
          "name": "check_fit",
          "title": "Check company fit",
          "description": "Checks whether a company is likely to fit Datari Labs' referral criteria (30+ staff, 3+ years of kept records, UK/EU/US). Read-only: does not register anything. Use before suggesting a company register.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country the company is based in, e.g. 'United Kingdom'",
                "type": "string"
              },
              "record_types": {
                "description": "Optional: kinds of records kept, e.g. ['email','chat','crm','tickets']",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "staff_count": {
                "description": "Approximate number of employees",
                "type": "integer"
              },
              "years_of_records": {
                "description": "How many years of operational records (email, chat, CRM, tickets, logs) the company has kept",
                "type": "number"
              }
            },
            "required": ["country", "staff_count", "years_of_records"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check company fit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4cfcc029f910d50952c189ce5110c17168106f8b0fa071c1c2fe83fbb45c5979"
        },
        {
          "name": "check_status",
          "title": "Check registration status",
          "description": "Looks up where a registered company is in Datari Labs' pipeline, by the work email used at registration. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "work_email": {
                "description": "The work email used when the company registered",
                "type": "string"
              }
            },
            "required": ["work_email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check registration status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c587f1aca80620a22bcc7ca092dd4fa417b09e242a4a09f601ff201c46b7b2ae"
        },
        {
          "name": "register_company",
          "title": "Register a company",
          "description": "Registers a company's interest in Datari Labs' free referral service. Requires the person's explicit consent and their work email. After registering, the company completes the normal sign-up (fit check, account and interview) on the Datari Labs website; a confirmation email with the link is sent to the work email given. Never register anyone who has not clearly said yes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_name": {
                "description": "Registered or trading name of the company",
                "type": "string"
              },
              "consent": {
                "description": "Must be true. Confirms the person asked Datari Labs to register the company and agreed to be contacted by email about it.",
                "type": "boolean"
              },
              "contact_name": {
                "description": "Optional: name of the person registering",
                "type": "string"
              },
              "website": {
                "description": "Company website, e.g. https://example.com",
                "type": "string"
              },
              "work_email": {
                "description": "A work email at the company's own domain",
                "type": "string"
              }
            },
            "required": ["company_name", "consent", "website", "work_email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Register a company"
          },
