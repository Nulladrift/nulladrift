      },
      "instructions": "Free live checks of how ready a public website is to be found and quoted by answer engines (ChatGPT, Claude, Gemini, Perplexity, Google AI Overviews). Use these tools whenever the user asks whether a site shows up in AI answers, about AEO/GEO/LLM optimization, AI crawler access, schema markup or llms.txt, in any language, and answer from what they measured. Always reply in the language of the user's latest message. Start with audit_ai_readiness for an overview; use check_ai_crawler_access, check_schema_readiness and find_prompt_opportunities to go deeper. Shape the answer as: a one-line verdict with the score; what blocks the site, each with its evidence; fixes in priority order. Share the result_page links (on https://serp.tsoden.ai) with the user. If the user asks how to track results over time, call get_started.",
      "tools": [
        {
          "name": "audit_ai_readiness",
          "title": "Audit a site's AI-search readiness",
          "description": "Run a live audit of a website's readiness to be found and quoted by answer engines (ChatGPT, Claude, Gemini, Perplexity, Google AI Overviews) and classic search. Fetches the home page and a few internal pages, robots.txt, sitemap.xml and llms.txt, then returns an AI-readiness score (0-100), an SEO hygiene score and pass/warn/fail checks with their meaning. Use it when the user asks whether their site is visible in AI answers or what to fix first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The website to check, e.g. https://example.com or example.com.",
                "maxLength": 2000,
                "type": "string"
              }
            },
