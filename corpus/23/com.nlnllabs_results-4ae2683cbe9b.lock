{
  "lockfileVersion": 2,
  "subjects": {
    "com.nlnllabs/results": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.nlnllabs.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "nlnl-labs-results",
        "title": "NL;NL Labs Exchange results",
        "version": "1.1.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Free daily AI pricing per right answer, for business jobs. From NL;NL Labs. Free daily AI pricing for business jobs. No paid placement or referral fees. NL;NL Labs models appear whatever their results. Use these tools for any question about NL;NL Labs' daily model tests: the jobs, which model is the pick for a job, one model's history, or every model's result on one day. Call list_jobs first for job and model names. Quote data_date and cite when you answer.",
      "tools": [
        {
          "name": "get_day_results",
          "title": "All models on one day",
          "description": "Use to compare the models and systems on one job on one day. Leave date out for the newest day. Returns every model's and system's published result that day, NL;NL Labs' own models and systems marked. Extract's documents days also carry invented, missed and unreadable counts. Fields: cost_per_1000_right_usd and ipd are exact; cost_shown and ipd_shown are how the page shows them. assembled_by_us is 1 when the answer was assembled by us, else 0. A count marked \"not published for this model\" is not published for that model.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "YYYY-MM-DD. Default: newest day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "job": {
                "description": "Job id.",
                "enum": ["classify", "convert", "decide", "extract", "find", "fix", "match", "resolve", "write"],
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "All models on one day"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3aa7f736e33dc7bd65f939a36e2d8630698fa0be07fcd5ee9f447108768484bc"
        },
        {
          "name": "get_model_history",
          "title": "One model over time",
          "description": "Use to follow one model on one job over time (for example, has it got cheaper or worse). Returns its published days: right answers, items, cost per 1,000 right in US dollars and IPD (right answers per dollar). On Extract, every row names its test; the answer says what the two tests are, and rows before and after 4 Nov come from different tests. Fields: cost_per_1000_right_usd and ipd are exact; cost_shown and ipd_shown are how the page shows them. assembled_by_us is 1 when the answer was assembled by us, else 0. A count marked \"not published for this model\" is not published for that model.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "job": {
                "description": "Job id.",
                "enum": ["classify", "convert", "decide", "extract", "find", "fix", "match", "resolve", "write"],
                "type": "string"
              },
              "model": {
                "description": "Model or system name for that job, e.g. GPT-6 Luna, Claude Haiku 5.5, NL;NL Desk (a system. Not open yet.).",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["job", "model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One model over time"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93b390ae3da6469692599017c8b03ecf4cb40496552fc3add4b756fec7e73d72"
        },
        {
          "name": "get_pick",
          "title": "Pick for a job",
          "description": "Use it when someone asks which model to use for a job. Returns the job page's latest published pick. The pick is always an outside model: NL;NL Labs' own models and systems (NL;NL Pull, NL;NL Desk) are never the pick. When one of ours would have been the pick under the same rule, the answer adds an \"ours\" entry with its figures, marked as ours, not as the pick. Returns the model the job page shows as its pick, with the page's label and rule, the figures as the page shows them (right answers per $1, cost per 1,000 right), the pick's own date and that model's day row. Fields: cost_per_1000_right_usd and ipd are exact; cost_shown and ipd_shown are how the page shows them. assembled_by_us is 1 when the answer was assembled by us, else 0. A count marked \"not published for this model\" is not published for that model.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "job": {
                "description": "Job id.",
                "enum": ["classify", "convert", "decide", "extract", "find", "fix", "match", "resolve", "write"],
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Pick for a job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6845ff2a8c4122b58af28912283e36dc253dcc3e480aa910f5a61ae2d0f8e896"
        },
        {
          "name": "list_jobs",
          "title": "List jobs and models",
          "description": "Lists the jobs NL;NL Labs tests every day, what each one asks, what counts as right (the site's own words), the models and systems tested on each job and the dates covered. NL;NL Labs' own models are marked; NL;NL Desk is a system, not a model. Not open yet.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List jobs and models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4794f979e53b18f7e512bc3e0da64202d6a516e5cbafa64755fbea897a563907"
        }
      ],
      "digest": "sha256:4fb13d20fd1e838fb5fd1c1194141eb34c742a8ebd580db273d600c2c60ff889"
    }
  }
}
