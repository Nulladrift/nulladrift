      "serverInfo": {
        "name": "edakon",
        "title": "EDAKON · herramientas del ciclo inmobiliario",
        "version": "1.0.0",
        "websiteUrl": "https://edakon.com/herramientas/servidor-mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Herramientas gratuitas de EDAKON (edakon.com) para el ciclo inmobiliario en España: calculadoras con la normativa española y datos oficiales del INE, glosario y guías. Cada resultado trae la URL de la página de EDAKON que lo explica: cítala. Los cálculos orientan; no sustituyen al pliego, al contrato ni a un asesor.",
      "tools": [
        {
          "name": "actualizar_renta_alquiler",
          "title": "Actualizar la renta del alquiler (IRAV, IPC)",
          "description": "Actualización anual de la renta de un alquiler de vivienda en España con los índices del INE (IPC, IRAV) y los topes legales vigentes (LAU art. 18 y RDL 29/2026: hasta el 31/12/2027, 2 % salvo nuevo pacto). Devuelve el porcentaje, la renta nueva y qué tope se aplica. Calculadora de EDAKON.",
          "inputSchema": {
            "properties": {
              "actualizacion": {
                "description": "Fecha en que toca actualizar (la anualidad), AAAA-MM-DD",
                "type": "string"
              },
              "clausula": {
                "description": "Qué dice el contrato: ipc, irav, fijo (un %), sinIndice o ninguna",
                "enum": ["ipc", "irav", "fijo", "sinIndice", "ninguna"],
                "type": "string"
              },
              "firma": {
                "description": "Fecha de firma del contrato, AAAA-MM-DD",
                "type": "string"
              },
              "pactado": {
                "description": "Con clausula=fijo: el porcentaje pactado",
                "type": "number"
              },
              "renta": {
                "description": "Renta mensual vigente en euros",
                "type": "number"
              }
            },
            "required": ["actualizacion", "clausula", "firma", "renta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Actualizar la renta del alquiler (IRAV, IPC)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de316f4200c3a084d503c7515295372c47be0fda5a0fd18dfaa09592eda2986e"
        },
        {
          "name": "buscar_glosario",
          "title": "Glosario del ciclo inmobiliario",
          "description": "Busca en el glosario de EDAKON (100 términos del ciclo inmobiliario en España: obra, contratación pública, promoción, venta, alquiler y facturación) y devuelve la definición, la norma de la que sale y el enlace.",
          "inputSchema": {
            "properties": {
              "consulta": {
                "description": "Término o palabras, p. ej. «retención de garantía» o «IRAV»",
                "type": "string"
              },
              "limite": {
                "description": "Máximo de resultados (1 a 8; 4 por defecto)",
                "type": "number"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Glosario del ciclo inmobiliario"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:197add0a59a39276618b8cbbe2c5dc88c445e9a128dba6e6d5fd6272b9661342"
        },
        {
          "name": "buscar_guias",
          "title": "Guías de EDAKON",
          "description": "Busca en las guías de EDAKON sobre construcción, promoción y alquiler en España (contratación pública, certificaciones, LOE, venta sobre plano, IVA, Verifactu, arrendamientos…), con la ley enlazada. Devuelve título, resumen, fecha de revisión y enlace.",
          "inputSchema": {
            "properties": {
              "consulta": {
                "description": "Tema, p. ej. «fianza alquiler local» o «subcontratación REA»",
                "type": "string"
              },
              "limite": {
                "description": "Máximo de resultados (1 a 6; 3 por defecto)",
                "type": "number"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Guías de EDAKON"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5c32958d1507e413d7012acc745aaf93e1ee922e18b93a0da783d7d64aeb49a"
        },
        {
          "name": "calcular_baja_temeraria",
          "title": "Calculadora de bajas temerarias (art. 85 RGLCAP)",
          "description": "Licitación de obra pública solo por precio y sin parámetros propios en el pliego: dice qué ofertas quedan en presunción de anormalidad (baja temeraria) con el art. 85 del RGLCAP (1, 2, 3 o más licitadores), con la media, las ofertas que salen de ella y el umbral. Importes en euros sin IVA. Calculadora de EDAKON.",
          "inputSchema": {
            "properties": {
              "ofertas": {
                "description": "Ofertas admitidas",
                "items": {
                  "properties": {
                    "grupo": {
                      "description": "Grupo de empresas, si lo hay (solo cuenta la oferta más baja del grupo)",
                      "type": "string"
                    },
                    "importe": {
                      "description": "Oferta en euros, sin IVA",
                      "type": "number"
                    },
                    "nombre": {
                      "description": "Licitador",
                      "type": "string"
                    }
                  },
                  "required": ["importe"],
                  "type": "object"
                },
                "type": "array"
              },
              "presupuesto": {
                "description": "Presupuesto base de licitación en euros, sin IVA",
                "type": "number"
              },
              "reducida": {
                "description": "El pliego reduce los porcentajes en un tercio (art. 85.5)",
                "type": "boolean"
              }
            },
            "required": ["ofertas", "presupuesto"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculadora de bajas temerarias (art. 85 RGLCAP)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:19eee696dcaaa9f703ba879b4a0b71712491d07f8751420ecf1052fde3570b6c"
        },
        {
          "name": "plazos_garantia_loe",
          "title": "Plazos de garantía de la LOE",
          "description": "Plazos de garantía de un edificio en España (Ley de Ordenación de la Edificación, art. 17): hasta qué fecha dura la garantía de acabados (1 año), habitabilidad (3) y estructura (10) desde la recepción de la obra y, con la fecha de un daño, qué garantías lo cubren y hasta cuándo se puede reclamar (2 años, art. 18). Calculadora de EDAKON.",
          "inputSchema": {
            "properties": {
              "dano": {
                "description": "Fecha en que apareció el daño, AAAA-MM-DD (opcional)",
                "type": "string"
              },
              "recepcion": {
                "description": "Fecha de recepción de la obra, AAAA-MM-DD",
                "type": "string"
              }
            },
            "required": ["recepcion"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plazos de garantía de la LOE"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a8f1dd342856ec184b862a10b2493c96ec20a7a9298fad17c8072f30cdeb0a3e"
        },
        {
          "name": "revision_precios_obra",
          "title": "Revisión de precios de obra pública",
          "description": "Revisión de precios de un contrato de obra pública en España: coeficiente Kt y revisión de cada certificación con las fórmulas tipo del RD 1359/2011 y los índices del INE, descontando el 20 % y el primer año (LCSP art. 103). Calculadora de EDAKON.",
          "inputSchema": {
            "properties": {
              "certificaciones": {
                "items": {
                  "properties": {
                    "importe": {
                      "type": "number"
                    },
                    "mes": {
                      "description": "AAAA-MM",
                      "type": "string"
                    }
                  },
                  "required": ["importe", "mes"],
                  "type": "object"
                },
                "type": "array"
              },
              "certificadoAntes": {
                "description": "Certificado antes de la primera certificación de la lista, en euros",
                "type": "number"
              },
              "finOfertas": {
                "description": "Fin del plazo de presentación de ofertas, AAAA-MM-DD",
                "type": "string"
              },
              "formalizacion": {
                "description": "Fecha de formalización del contrato, AAAA-MM-DD",
                "type": "string"
              },
              "formula": {
                "description": "Número de la fórmula tipo del RD 1359/2011, p. ej. 811",
                "type": "string"
              },
              "importeContrato": {
                "description": "Precio del contrato en euros, sin IVA",
                "type": "number"
              }
            },
            "required": ["certificaciones", "finOfertas", "formalizacion", "formula", "importeContrato"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Revisión de precios de obra pública"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ab8a34259975a8610da5035ea7effcb55e269c916961765aad50b7f1fff1322"
        },
        {
          "name": "valor_residual_suelo",
          "title": "Valor residual del suelo (ECO/805/2003)",
          "description": "Valor residual estático de un suelo (Orden ECO/805/2003, art. 42): cuánto se puede pagar por él según lo que se construirá y venderá. F = ventas · (1 − margen) − construcción − gastos − comercialización. Calculadora de EDAKON.",
          "inputSchema": {
            "properties": {
              "comercializacionPct": {
                "description": "Comercialización, % de las ventas",
                "type": "number"
              },
              "costeConstruccion": {
                "description": "Coste de construcción por contrata, €/m²",
                "type": "number"
              },
              "gastosPct": {
                "description": "Gastos necesarios, % del coste de construcción",
                "type": "number"
              },
              "margen": {
                "description": "Margen del promotor, % de las ventas (mínimo en vivienda primera residencia: 18)",
                "type": "number"
              },
              "otrosIngresos": {
                "description": "Otros ingresos por ventas en euros (opcional)",
                "type": "number"
              },
              "precioVenta": {
                "description": "Precio medio de venta, €/m² construido",
                "type": "number"
              },
              "superficie": {
                "description": "m² construidos",
                "type": "number"
              }
            },
            "required": ["comercializacionPct", "costeConstruccion", "gastosPct", "margen", "precioVenta", "superficie"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Valor residual del suelo (ECO/805/2003)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e52fbe239e60adc71882c3c05a49224ef167dfcff01f73e142d00e5e7eaec5b7"
        }
      ],
      "digest": "sha256:24c42d253c4dd106dbd530a95e581ca1100ce837b7ce437c062230cec98a33e7"
    }
  }
