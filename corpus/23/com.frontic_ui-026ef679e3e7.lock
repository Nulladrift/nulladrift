{
  "lockfileVersion": 2,
  "subjects": {
    "com.frontic/ui": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.ui.frontic.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "frontic-ui",
        "version": "0.8.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_add_command",
          "description": "Return the CLI command that adds Frontic UI items to a project.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "items": {
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7e43a426661f8640aaae282866cfeae02825728532bb544bf4df0146f2fe1675"
        },
        {
          "name": "get_item_docs",
          "description": "Return the docs of Frontic UI items: install command, examples, how the parts nest, every part's props, events and slots, what else the item exports, styling, source, and the API of the items its example uses.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "items": {
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a1ec3eebcf7dcbbb37f5fcf67c8f9b8c73648c12cb55b8a8c7606417087a672"
        },
        {
          "name": "get_item_examples",
          "description": "Return a Frontic UI item's examples as source, the main one first. Pass `example`, a slug such as `sale` for `price.sale.example.vue`, for one alone; `main` is the main example.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "example": {
                "type": "string"
              },
              "name": {
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:11c568db00ac9ff5a17e2eb2f63b8400b73e7c924e41e6e8932044bdc79d92f1"
        },
        {
          "name": "search_registry_items",
          "description": "Search Frontic UI items by name and description. An empty query lists all; `tier` narrows to ui, sections, templates, lib or composables. Read one with get_item_docs; get_item_examples gives its examples alone.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "type": "number"
              },
              "offset": {
                "type": "number"
              },
              "query": {
                "type": "string"
              },
              "tier": {
                "enum": ["ui", "sections", "templates", "lib", "composables"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bedbb88c65bde7962d538a16d09462a34a5bca261a38bf76a615b19ae803b4b3"
        }
      ],
      "prompts": [
        {
          "name": "build_with",
          "description": "Build something with Frontic UI items: the agent reads each item through this server, installs it and builds from it.",
          "arguments": [
            {
              "name": "items",
              "description": "Item names, comma-separated",
              "required": true
            },
            {
              "name": "goal",
              "description": "What to build",
              "required": true
            }
          ],
          "digest": "sha256:ab64ce1364c320782872b81cfe5ace5a3298c1a0f0eaf208f78fab67d4519390"
        }
      ],
      "digest": "sha256:60ac1f03f59f4198c5762ef2761b6fee439aa25f872920955a8bd822dc7eb29b"
    }
  }
}
