{
  "lockfileVersion": 2,
  "subjects": {
    "com.frontic/ui": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.ui.frontic.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "frontic-ui",
        "version": "0.8.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_add_command",
          "description": "Return the CLI command that adds Frontic UI items to a project.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "items": {
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e6f8333b5f5abc9a0c910614ac9612c26c2431c927ddc66deb739ccf4c39449c"
        },
        {
          "name": "get_item_docs",
          "description": "Return the docs of Frontic UI items: install command, examples, how the parts nest, every part's props, events and slots, what else the item exports, styling, source, and the API of the items its example uses.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "items": {
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6eda12feb50cc15efad44164bef7534beb8dfe7c7f3847ca9de5cd8393f376a5"
        },
        {
          "name": "get_item_examples",
          "description": "Return a Frontic UI item's examples as source, the main one first. Pass `example`, a slug such as `sale` for `price.sale.example.vue`, for one alone; `main` is the main example.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "example": {
                "type": "string"
              },
              "name": {
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:97f1279c757d78960f555f678614a0ad0f608c7a9ae7ccd2963d3a22a4ad0d87"
        },
        {
          "name": "search_registry_items",
          "description": "Search Frontic UI items by name and description. An empty query lists all; `tier` narrows to ui, sections, templates, lib or composables. Read one with get_item_docs; get_item_examples gives its examples alone.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "type": "number"
              },
              "offset": {
                "type": "number"
              },
              "query": {
                "type": "string"
              },
              "tier": {
                "enum": ["ui", "sections", "templates", "lib", "composables"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fd8244097088c3d231a0ee5ead68b5e7f049ff41012aa3bdf002812bac5b2c40"
        }
      ],
      "prompts": [
        {
          "name": "build_with",
          "description": "Build something with Frontic UI items: the agent reads each item through this server, installs it and builds from it.",
          "arguments": [
            {
              "name": "items",
              "description": "Item names, comma-separated",
              "required": true
            },
            {
              "name": "goal",
              "description": "What to build",
              "required": true
            }
          ],
          "digest": "sha256:ab64ce1364c320782872b81cfe5ace5a3298c1a0f0eaf208f78fab67d4519390"
        }
      ],
      "digest": "sha256:51715e25899fc57ae0b78975829c131d65883677397d1f5e23b28504d875b275"
    }
  }
}
