        {
          "name": "coldstate_batch_search",
          "description": "Run several knowledge-base queries in one call against a single consistent kb_snapshot. Returns each query with its ranked results — efficient and snapshot-consistent across the whole batch.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Optional domain filter applied to all queries",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Max results per query",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "queries": {
                "description": "1–10 queries",
                "items": {
                  "maxLength": 2000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["queries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Batch Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:04f74ba1fd82d58d9893863acc4e2eb9366a076a9743430d5898fef17f2a9e6e"
        },
        {
          "name": "coldstate_browse_documents",
          "description": "Browse documents in a ColdState index. Indexes are zero-knowledge, so each document is returned as your ref_id plus its state classification and E-score — no stored text. Map ref_id back to your own content.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "index_id": {
                "description": "Index ID, e.g. idx_...",
                "pattern": "^idx_[a-f0-9]+$",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Max documents to return",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Offset for pagination",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["index_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Browse Documents"
