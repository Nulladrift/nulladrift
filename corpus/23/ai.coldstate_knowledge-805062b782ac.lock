        {
          "name": "coldstate_resolve",
          "description": "Resolve a name, alias, or surface form to its canonical ColdState knowledge entry (id + title). Deterministic: an exact title match wins, else the top relevance-Ψ entry. Returns the canonical entry plus alternatives. Use the returned id with coldstate_fetch / coldstate_related.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 4,
                "description": "Max alternative candidates",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The name/term/alias to resolve",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Resolve Entity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6f1c790a921bbaae8d02ea06a48229ac2f544f9042d271263fcf662c2e7e7123"
        },
        {
          "name": "coldstate_search",
          "description": "Search a ColdState index by collection name or index ID. Returns ranked results with Ψ scores and state classification (CRYSTALLINE/FLUID/REACTIVE/DECOHERENT). Provide exactly one of `collection` or `index_id`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "collection": {
                "description": "Collection name to search (mutually exclusive with index_id)",
                "type": "string"
              },
              "index_id": {
                "description": "Index ID to search, e.g. idx_... (mutually exclusive with collection)",
                "pattern": "^idx_[a-f0-9]+$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max results to return",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Offset for pagination",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "The search query",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
