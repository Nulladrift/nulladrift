        {
          "name": "coldstate_verify",
          "description": "Verify a previously-cited knowledge fact is unchanged. Provide the entry id and the content_hash you stored earlier; returns whether it still matches the current knowledge base. The trust primitive for AI-to-AI fact-checking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
