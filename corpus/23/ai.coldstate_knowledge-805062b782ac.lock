          "name": "coldstate_stats",
          "description": "Deterministic statistics. With a `query`: total matches + state distribution of the top results. Without: global knowledge-base stats (entry count, domains, snapshot).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
