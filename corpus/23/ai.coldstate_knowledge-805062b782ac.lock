          "name": "coldstate_search_global",
          "description": "Search ColdState's global knowledge base (48.4M+ entries across 35 domains including SCIENCE, MEDICINE, TECHNOLOGY, HISTORY, etc). Returns deterministically ranked results with Ψ relevance scores and a state classification. Optionally filter by domain.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Filter by knowledge domain (e.g. MEDICINE, SCIENCE, TECHNOLOGY, HISTORY, LAW, CODE). Case-insensitive.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max results to return",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Offset for pagination",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
