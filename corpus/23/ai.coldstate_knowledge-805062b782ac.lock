        {
          "name": "coldstate_isomorph",
          "description": "Cross-domain structural analog: given a knowledge entry id, find its closest structural twin in each OTHER domain (\"same structure, different domain\"). Deterministic. Use coldstate_resolve to turn a name into an id first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Stable knowledge entry id, e.g. eng_... or soc_...",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Max cross-domain analogs (one per domain)",
                "maximum": 35,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Cross-domain Analog"
