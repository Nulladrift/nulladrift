        {
          "name": "coldstate_fetch",
          "description": "Fetch a single knowledge-base entry verbatim by its stable id (e.g. \"eng_000229f438f7cebd\"). Deterministic retrieval — returns the full record plus a content_hash and kb_snapshot for reproducible citation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Stable knowledge entry id, e.g. eng_... or soc_...",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
