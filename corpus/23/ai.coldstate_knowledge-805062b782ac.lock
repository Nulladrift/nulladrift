        {
          "name": "coldstate_related",
          "description": "Find knowledge entries deterministically related to a given entry id via ColdState's concept-cluster graph. Returns same-cluster and neighboring-cluster entries, each tagged with its relation and a cross_domain flag. Same id ⇒ same neighbors.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Stable knowledge entry id, e.g. eng_... or soc_...",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max related entries",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
