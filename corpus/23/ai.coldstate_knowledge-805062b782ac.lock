        {
          "name": "coldstate_explain",
          "description": "Explain why a specific document ranked for a query. Returns a per-term relevance breakdown and an overall match summary — deterministic and reproducible.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "doc_id": {
                "description": "Document ID, e.g. \"doc_42\" or \"42\"",
                "pattern": "^\\d+$|^doc_\\d+$",
                "type": "string"
              },
              "index_id": {
                "description": "Index ID, e.g. idx_...",
                "pattern": "^idx_[a-f0-9]+$",
                "type": "string"
              },
              "query": {
                "description": "The search query to explain against",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["doc_id", "index_id", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
