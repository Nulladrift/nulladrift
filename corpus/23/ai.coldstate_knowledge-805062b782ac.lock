      "tools": [
        {
          "name": "coldstate_batch_search",
          "description": "Run several knowledge-base queries in one call against a single consistent kb_snapshot. Returns each query with its ranked results — efficient and snapshot-consistent across the whole batch.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Optional domain filter applied to all queries",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Max results per query",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "queries": {
                "description": "1–10 queries",
                "items": {
                  "maxLength": 2000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["queries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Batch Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dd407f2e18b8afe9dfef2b86e7d02b0278dad9f9615027ba573f3a2ac1951c40"
        },
        {
          "name": "coldstate_browse_documents",
          "description": "Browse documents in a ColdState index. Indexes are zero-knowledge, so each document is returned as your ref_id plus its state classification and E-score — no stored text. Map ref_id back to your own content.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "index_id": {
                "description": "Index ID, e.g. idx_...",
                "pattern": "^idx_[a-f0-9]+$",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Max documents to return",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Offset for pagination",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["index_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Browse Documents"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5aa399e9f9d0730fbc64df570221a0b019f7a8440adada98b7c663eb960cd77c"
        },
