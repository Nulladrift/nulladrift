            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Number of paragraphs, 1-150, default 40",
                "maximum": 150,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Where to start, default 0; pass next_offset from the previous page",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "quarter": {
                "description": "Fiscal quarter key from get_company, such as 2027-q2. Omit for the latest.",
