          "description": "One quarter's results: headline, overview, reported figures (metrics: value as printed, number in currency units, ISO currency, unit currency|per_share|percent) with their source sentence, segments, outlook, a check of last quarter's outlook against what was reported, takeaways, management quotes, analyst Q&A and documents. Omit quarter for the latest; get_company lists the keys.",
