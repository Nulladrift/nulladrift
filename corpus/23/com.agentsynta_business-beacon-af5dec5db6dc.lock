{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentsynta/business-beacon": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentsynta.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agentsynta-business-beacon",
        "title": "AgentSynta",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public directory of opted-in AgentSynta businesses. Start generic buyer requests with search_all_offerings; no business slug is needed. Continue with next_cursor while has_more is true, keeping all criteria unchanged. Pages are not a snapshot: deduplicate by id and restart if listings change. Call get_offering by durable id before quoting current price or contacting the business; updates retain id, change updated_at, and withdrawn or inaccessible records return not found. Follow record_url only when non-null; mcp_record_tool identifies MCP lookup when REST is disabled. Use list_businesses/get_business_profile for business discovery and search_offerings for a known slug. Only call submit_inquiry when the offering's inquiry action permits it and the user explicitly authorizes the message and sharing their contact information; inquiries go to the business inbox. Never infer an order, payment, booking, price change or guaranteed response. Public pages/registry listing do not connect assistants automatically.",
      "tools": [
        {
          "name": "get_business_profile",
          "title": "Get business profile",
          "description": "Get a business's public profile: description, contact, location, timezone and operating hours.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Business slug, e.g. 'harbor-bean'. Use list_businesses to find one.",
                "pattern": "^[a-z0-9-]{3,50}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f10c3c2ec784e1ef6101a258eeb081e6ab9580af3e285d89b0a4939aa2d5b01c"
        },
        {
          "name": "get_offering",
          "title": "Get offering",
          "description": "Get the current public record of one offering by its id (from search_all_offerings or search_offerings).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Offering UUID.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dcf038181e8bf83099760db383b817c3f0f63175b54e3ab7f671bf6f40690d9f"
        },
        {
          "name": "list_businesses",
          "title": "List businesses",
          "description": "List published AgentSynta businesses, optionally filtered by name, industry or city.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 25).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Filter by name, industry or city.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:66874bbea7eb2cc5fba766fa9695f0a0e1cdce5a2cc1eeed510189b8a5d213c7"
        },
        {
          "name": "search_all_offerings",
          "title": "Search all offerings",
          "description": "Search eligible published offers across AgentSynta without a slug using literal keywords or conservative buyer criteria; returns applied criteria and stored match evidence, never FX or distance estimates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bedrooms": {
                "description": "Exact affirmative bedroom count from description or Bedrooms attribute, never inferred from Rooms=3+2.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "category": {
                "description": "Exact category (case-insensitive).",
                "maxLength": 80,
                "type": "string"
              },
              "currency": {
                "description": "Three-letter currency code; £ implies GBP, € implies EUR; bare $ requires explicit currency.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "cursor": {
                "description": "Use next_cursor from the previous page (works at any depth).",
                "maxLength": 400,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Textual offering locality or business city/region/country, e.g. London, Sydney or New York; never a distance claim. Only the alias groups Nicosia/Lefkoşa/Lefkosa/Nicossia and North Cyprus/NC are normalised.",
                "maxLength": 80,
                "type": "string"
              },
              "max_price": {
                "description": "Inclusive maximum price; currency required. Conflicting inferred budgets are rejected.",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Inclusive minimum price; currency required. No FX conversion.",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "description": "Use next_offset from the previous page.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Alias of query; conflicting aliases are rejected.",
                "maxLength": 300,
                "type": "string"
              },
              "query": {
                "description": "Literal search text; budget and bedroom phrases are understood, e.g. 'three bedroom home under £500,000'. Put the place in location (e.g. London), not in the query. Unsupported residual words remain literal constraints.",
                "maxLength": 300,
                "type": "string"
              },
              "type": {
                "enum": ["product", "service"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb436f2f2ecf74faae4d7d76de6e07794b844d2abaf7276aa1e66fd563ffdcd9"
        },
        {
          "name": "search_offerings",
          "title": "Search offerings",
          "description": "Search a business's published products and services with prices and (when shared) availability.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Use next_offset from the previous page.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Text to match in name, description, category, SKU or attributes.",
                "maxLength": 80,
                "type": "string"
              },
              "slug": {
                "description": "Business slug, e.g. 'harbor-bean'. Use list_businesses to find one.",
                "pattern": "^[a-z0-9-]{3,50}$",
                "type": "string"
              },
              "type": {
                "enum": ["product", "service"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ca67097f8fb99c4f18a460d9876b217bc5179fd9d4d56456ca31d26836e5864f"
        },
        {
          "name": "submit_inquiry",
          "title": "Submit inquiry",
          "description": "Send a customer inquiry to a business for human review. Cannot place orders or change prices; only use with the customer's consent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Name of the assistant submitting.",
                "maxLength": 120,
                "type": "string"
              },
              "contact_email": {
                "format": "email",
                "maxLength": 255,
                "type": "string"
              },
              "contact_name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "contact_phone": {
                "maxLength": 40,
                "type": "string"
              },
              "message": {
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "offering_id": {
                "description": "Optional offering id from search_offerings.",
                "format": "uuid",
                "type": "string"
              },
              "slug": {
                "description": "Business slug, e.g. 'harbor-bean'. Use list_businesses to find one.",
                "pattern": "^[a-z0-9-]{3,50}$",
                "type": "string"
              },
              "subject": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["contact_email", "contact_name", "message", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a08376a20397958796fe1c5d485798ab82e1a892d98d1b00b47cfbe07d28b06e"
        }
      ],
      "digest": "sha256:1942a9d7d27000d9b47361552f7cbe12bf940668a5b0385282b06425f6f02064"
    }
  }
}
