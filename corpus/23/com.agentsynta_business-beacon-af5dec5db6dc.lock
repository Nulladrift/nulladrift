{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentsynta/business-beacon": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentsynta.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agentsynta-business-beacon",
        "title": "AgentSynta Business Beacon",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public directory of AgentSynta businesses. For generic requests (e.g. 'villa in Cyprus') start with search_all_offerings, which needs no slug and returns each offering with its durable id, business slug, page links and inquiry path; then call get_offering with the id for the current record (updates keep the same id and change updated_at; a withdrawn offer returns not found); then call submit_inquiry with that business slug and offering_id. Otherwise use list_businesses to find a slug, get_business_profile for hours and contact info, search_offerings for products/services, and submit_inquiry to send a reviewed message to the business. No orders, payments or price changes are possible.",
      "tools": [
        {
          "name": "get_business_profile",
          "title": "Get business profile",
          "description": "Get a business's public profile: description, contact, location, timezone and operating hours.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Business slug, e.g. 'harbor-bean'. Use list_businesses to find one.",
                "pattern": "^[a-z0-9-]{3,50}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f10c3c2ec784e1ef6101a258eeb081e6ab9580af3e285d89b0a4939aa2d5b01c"
        },
        {
          "name": "get_offering",
          "title": "Get offering",
          "description": "Get the current public record of one offering by its id (from search_all_offerings or search_offerings).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Offering UUID.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dcf038181e8bf83099760db383b817c3f0f63175b54e3ab7f671bf6f40690d9f"
        },
        {
          "name": "list_businesses",
          "title": "List businesses",
          "description": "List published AgentSynta businesses, optionally filtered by name, industry or city.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 25).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Filter by name, industry or city.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:66874bbea7eb2cc5fba766fa9695f0a0e1cdce5a2cc1eeed510189b8a5d213c7"
        },
        {
          "name": "search_all_offerings",
          "title": "Search all offerings",
          "description": "Search published products and services across every AgentSynta business, no slug needed. Start here for generic requests like 'villa'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Exact category (case-insensitive).",
                "maxLength": 80,
                "type": "string"
              },
              "cursor": {
                "description": "Use next_cursor from the previous page (works at any depth).",
                "maxLength": 400,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Business city, region or country.",
                "maxLength": 80,
                "type": "string"
              },
              "offset": {
                "description": "Use next_offset from the previous page.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Text to match in offering name, description, category, SKU, attributes, or business name/industry.",
                "maxLength": 80,
                "type": "string"
              },
              "type": {
                "enum": ["product", "service"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:689c0a5531bfd0571abcc0762a9a346bbcbe5964f6e01699ec62d192c5f01ab3"
        },
        {
          "name": "search_offerings",
          "title": "Search offerings",
          "description": "Search a business's published products and services with prices and (when shared) availability.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Use next_offset from the previous page.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Text to match in name, description, category, SKU or attributes.",
                "maxLength": 80,
                "type": "string"
              },
              "slug": {
                "description": "Business slug, e.g. 'harbor-bean'. Use list_businesses to find one.",
                "pattern": "^[a-z0-9-]{3,50}$",
                "type": "string"
              },
              "type": {
                "enum": ["product", "service"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ca67097f8fb99c4f18a460d9876b217bc5179fd9d4d56456ca31d26836e5864f"
        },
        {
          "name": "submit_inquiry",
          "title": "Submit inquiry",
          "description": "Send a customer inquiry to a business for human review. Cannot place orders or change prices; only use with the customer's consent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Name of the assistant submitting.",
                "maxLength": 120,
                "type": "string"
              },
              "contact_email": {
                "format": "email",
                "maxLength": 255,
                "type": "string"
              },
              "contact_name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "contact_phone": {
                "maxLength": 40,
                "type": "string"
              },
              "message": {
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "offering_id": {
                "description": "Optional offering id from search_offerings.",
                "format": "uuid",
                "type": "string"
              },
              "slug": {
                "description": "Business slug, e.g. 'harbor-bean'. Use list_businesses to find one.",
                "pattern": "^[a-z0-9-]{3,50}$",
                "type": "string"
              },
              "subject": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["contact_email", "contact_name", "message", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a08376a20397958796fe1c5d485798ab82e1a892d98d1b00b47cfbe07d28b06e"
        }
      ],
      "digest": "sha256:0dad75a41cfb5b1bac78e35343dd0495c785990c05329af88b7aedaf3b43941c"
    }
  }
}
