{
  "lockfileVersion": 2,
  "subjects": {
    "ai.openmark/openmark": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://openmark.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "openmark",
        "title": "OpenMark",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OpenMark benchmarks LLMs on the user's own task with real API calls and deterministic scoring. Typical flow: call get_task_format, write a task YAML from the user's real prompt and a few realistic inputs with expected outputs, check it with validate_task (free; fix what it reports), pick 3-8 models with list_models, check the price with estimate_cost (or pass max_credits to run_benchmark; both take the app's run settings such as max_tokens, preset and temperature_discovery), call run_benchmark, then poll get_results with the job_id until it is completed (usually 1-5 minutes). get_results ranks by accuracy by default (highest score; ties go to the cheaper, then the faster model) and also lists the best pick for cost, speed and consistency. Ask the user what matters most and pass it as optimize_for; if a much cheaper model is within a couple of points of the winner, say so. Explain losses with the misses get_results lists. For images or documents, call prepare_attachments first. Offer watch_task so OpenMark re-tests the task when new models ship. If the user runs OpenClaw with the OpenMark Router plugin, export_openclaw_csv gives the routing file to save. Runs spend the user's OpenMark credits; get_account shows the balance and what each plan unlocks.",
      "tools": [
        {
          "name": "estimate_cost",
          "title": "Estimate a run's cost",
          "description": "Credits a run_benchmark call would use, before spending anything: the expected total, the split per model, the balance needed to start, the worst case, and the user's balance. Same inputs and run settings as run_benchmark. Use it to drop an expensive model, or to compare settings (e.g. max_tokens), before running.",
          "inputSchema": {
            "properties": {
              "custom_timeout": {
                "description": "Seconds per answer, with timeout_profile custom",
                "maximum": 600,
                "minimum": 120,
                "type": "integer"
              },
              "fail_fast": {
                "default": true,
                "description": "Stop a model after repeated errors to save credits. Set false to let every model finish, e.g. to diagnose failures",
                "type": "boolean"
              },
              "max_tokens": {
                "default": 1000,
                "description": "Output token limit per answer, 16 to 16000; 0 = no limit. Keep the default unless results show it was too low: a higher limit raises the credits needed to start. get_results flags models whose answers came back empty or near the limit; re-run those with a higher value",
                "maximum": 16000,
                "minimum": 0,
                "type": "integer"
              },
              "models": {
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "preset": {
                "description": "Like the app's presets: standard = 2 passes + snappy timeouts (the default), thorough = 3 passes + patient timeouts. Explicit stability_runs / timeout_profile override it",
                "enum": ["standard", "thorough"],
                "type": "string"
              },
              "stability_runs": {
                "default": 2,
                "description": "Passes per model; 2+ shows which models are consistent",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "task_yaml": {
                "description": "The full task YAML (a JSON object with the same fields also works)",
                "type": "string"
              },
              "temp_preference": {
                "default": "low",
                "description": "With temperature_discovery: which temperature wins a tie",
                "enum": ["low", "high"],
                "type": "string"
              },
              "temperature_discovery": {
                "default": false,
                "description": "Find each model's best temperature for this task. Costs about 6x as much",
                "type": "boolean"
              },
              "timeout_profile": {
                "default": "snappy",
                "description": "How long to wait per answer: snappy 45s, patient 90s, custom = custom_timeout",
                "enum": ["snappy", "patient", "custom"],
                "type": "string"
              },
              "upload_uid": {
                "description": "From prepare_attachments, so image and document tokens are counted",
                "type": "string"
              }
            },
            "required": ["models", "task_yaml"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6e07c7ef8dd91adbbf1011654f98e7911c97b2ed736a5ffdf09168e173e0c804"
        },
        {
          "name": "export_openclaw_csv",
          "title": "Export for the OpenClaw router",
          "description": "A completed job's results as the CSV the OpenMark Router plugin for OpenClaw reads (the same file as the app's Export > OpenClaw). Save it in the plugin's benchmarks folder, by default ~/.openclaw/workspace/plugins/openmark-router/benchmarks/, and OpenClaw routes this kind of task to the benchmark winner. Free.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:42e3fdf366e4cfd89ba54dccd04eef6b1274f7af0aa42efb59922510160de7f9"
        },
        {
          "name": "get_account",
          "title": "Account, credits and plans",
          "description": "The user's plan, credit balance and limits, and what a credit pack, Pro or Expert would unlock. Use it before large runs, or when a run is refused for credits or limits.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a42c12bb9a2919018f7445638a7aa36d0f6d66e94f96b1a6088ecb0e60dfa4af"
        },
        {
          "name": "get_results",
          "title": "Get benchmark results",
          "description": "Status of a benchmark job, and once completed the ranked results (score, stability, cost per run, latency), the tests each model missed with its answer, a recommendation for the chosen objective and quick picks for the others.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "type": "string"
              },
              "optimize_for": {
                "default": "accuracy",
                "description": "accuracy (same order as the app's results table): best score, then cheapest, then fastest. cost / speed / stability: cheapest / fastest / most consistent model within `tolerance` points of the top score",
                "enum": ["accuracy", "cost", "speed", "stability"],
                "type": "string"
              },
              "show_misses": {
                "default": true,
                "description": "List the tests each model got wrong, with the expected answer and the model's reply",
                "type": "boolean"
              },
              "tolerance": {
                "default": 2,
                "description": "Score points below the top score that still count as good enough",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:df6f17e506ac8b5a4af3914aca4e3538296d70cd8ff762a3fcbd40777f6fa74f"
        },
        {
          "name": "get_task_format",
          "title": "Task YAML format",
          "description": "How to write an OpenMark task: the YAML structure, all 18 scoring modes, and tips. Call this before writing a task. Pass a topic for the full detail on one subject (the app's Task Guide): fields, scoring, composite, chaining, documents, examples, best_practices, or a scoring mode name.",
          "inputSchema": {
            "properties": {
              "topic": {
                "description": "Optional: fields, scoring, composite, chaining, documents, examples, best_practices, or a scoring mode name such as regex_match",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa8634bf5d8274d87ca97be6409053dbba365f9e5d0ed7024907048c1c54b80a"
        },
        {
          "name": "list_models",
          "title": "List models",
          "description": "Current OpenMark model ids with list prices ($ per 1M tokens), as text and as a structured list. Use these ids in run_benchmark. Append @low, @medium or @high to a reasoning model id to set its reasoning effort.",
          "inputSchema": {
            "properties": {
              "images_only": {
                "description": "Only models that accept image attachments",
                "type": "boolean"
              },
              "max_output_price": {
                "description": "Only models at or below this $ per 1M output tokens",
                "type": "number"
              },
              "search": {
                "description": "Filter by id, name or provider, e.g. 'claude', 'gemini flash'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c2de6b0b8a4ffcac028f2226f48e838d9205db040391c7949034e60a65813f32"
        },
        {
          "name": "prepare_attachments",
          "title": "Prepare file attachments",
          "description": "Get an upload_uid and a one-hour upload link (no API key needed) for images, PDFs or text documents, with the exact curl command. Upload the files, reference them by file name in each test's attachments list, then pass the upload_uid to estimate_cost / run_benchmark.",
          "inputSchema": {
            "properties": {
              "file_names": {
                "description": "Optional: the local file paths to upload, to get a ready-to-run command",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:682d1a6c4e33b6c8636c8eaa52337ac019e532f560da0a125aa68f30971168f1"
        },
        {
          "name": "run_benchmark",
          "title": "Run a benchmark",
          "description": "Save a task (YAML, see get_task_format) to the user's OpenMark account and run it on the given models with real API calls. Returns a job_id and the expected cost; poll get_results. Spends the user's credits; pass max_credits to only start within a budget. Optional run settings match the app's Configure & Run panel (preset, stability_runs, max_tokens, temperature_discovery, temp_preference, timeout_profile, custom_timeout, fail_fast).",
          "inputSchema": {
            "properties": {
              "custom_timeout": {
                "description": "Seconds per answer, with timeout_profile custom",
                "maximum": 600,
                "minimum": 120,
                "type": "integer"
              },
              "fail_fast": {
                "default": true,
                "description": "Stop a model after repeated errors to save credits. Set false to let every model finish, e.g. to diagnose failures",
                "type": "boolean"
              },
              "max_credits": {
                "description": "Budget: if the expected cost is higher, nothing runs and you get the quote instead",
                "minimum": 1,
                "type": "integer"
              },
              "max_tokens": {
                "default": 1000,
                "description": "Output token limit per answer, 16 to 16000; 0 = no limit. Keep the default unless results show it was too low: a higher limit raises the credits needed to start. get_results flags models whose answers came back empty or near the limit; re-run those with a higher value",
                "maximum": 16000,
                "minimum": 0,
                "type": "integer"
              },
              "models": {
                "description": "Model ids from list_models",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "preset": {
                "description": "Like the app's presets: standard = 2 passes + snappy timeouts (the default), thorough = 3 passes + patient timeouts. Explicit stability_runs / timeout_profile override it",
                "enum": ["standard", "thorough"],
                "type": "string"
              },
              "stability_runs": {
                "default": 2,
                "description": "Passes per model; 2+ shows which models are consistent",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "task_yaml": {
                "description": "The full task YAML (a JSON object with the same fields also works)",
                "type": "string"
              },
              "temp_preference": {
                "default": "low",
                "description": "With temperature_discovery: which temperature wins a tie",
                "enum": ["low", "high"],
                "type": "string"
              },
              "temperature_discovery": {
                "default": false,
                "description": "Find each model's best temperature for this task. Costs about 6x as much",
                "type": "boolean"
              },
              "timeout_profile": {
                "default": "snappy",
                "description": "How long to wait per answer: snappy 45s, patient 90s, custom = custom_timeout",
                "enum": ["snappy", "patient", "custom"],
                "type": "string"
              },
              "upload_uid": {
                "description": "From prepare_attachments, when tests use attachments",
                "type": "string"
              }
            },
            "required": ["models", "task_yaml"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c0d857e7b92c31404cf80156e8efd42cefd63987dd481be55ac66837554b4c1b"
        },
        {
          "name": "validate_task",
          "title": "Check a task",
          "description": "Check a task YAML the way OpenMark will before running it: structure, scoring settings, and the test limit of the user's plan. Free, saves nothing. Returns the problems to fix and warnings worth a look.",
          "inputSchema": {
            "properties": {
              "task_yaml": {
                "description": "The full task YAML (a JSON object with the same fields also works)",
                "type": "string"
              }
            },
            "required": ["task_yaml"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b3e5300c6a91dd36250d7da7c95cd5fb308778a00d27517937ed0ce1b2bd8fd8"
        },
        {
          "name": "watch_task",
          "title": "Watch a task for better models",
          "description": "Watch the task of a completed job: when new or cheaper models ship, OpenMark re-tests up to 4 of them next to the user's pick and emails the user only when one beats it. Each check uses the user's credits at the normal rate.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "type": "string"
              },
              "model": {
                "description": "The model to keep as the pick (default: the best-scoring model). Use the model you recommended.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c5b90e205918441879d2a5f9253bec1edfa2e14bbed1d9a06cfab15f01c42c26"
        }
      ],
      "digest": "sha256:7c100b8636a7eca32a0b5ddb5901cb32d9ceb3c00fc3021c1abdad7bbb230d7a"
    }
  }
}
