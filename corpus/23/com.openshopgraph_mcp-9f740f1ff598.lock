      "serverInfo": {
        "name": "openshopgraph",
        "version": "0.1.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "OpenShopGraph is a read-only data source about online shops. Use find_shop to locate a shop, get_shop_policies and get_shipping_policy for what a shop states about returns, shipping, payment methods and legal notice (each fact with its source and the date it was checked), list_coupons for discount codes with their checkout-test status, and list_categories to browse. No account or sign-in is needed. A fact with collected:false is a gap in the data, not a statement about the shop: say so instead of guessing.",
      "tools": [
        {
          "name": "find_shop",
          "title": "Find an online shop",
          "description": "Look up an online shop the way a user asks about it: by name (\"zalando\"), domain or pasted URL (\"https://www.otto.de/\"), a question about a shop (\"is zalando legit\", \"rücksendung otto\", \"does bergzeit ship to austria\"), a misspelled name (\"zalandoo\") or a shop category in English or German (\"electronics\", \"möbel\"). It identifies the shop; it does not answer the question itself: the facts on returns, shipping, payment methods and trust are available through separate per-shop lookups by the found domain. Find online shops by name, domain fragment, country (ISO 3166-1 alpha-2, e.g. \"DE\") or exact category slug. Each result is a public shop profile (name, canonical domain, country, category); the source-dated facts on returns, shipping and payment methods are available through a separate per-shop policy lookup. Not a product or price search. Returns the public shop view only; shops still under internal review are not returned. `results` carries at most `limit` entries (default 50, max 100); `total_count` is the full match count before that cap and `truncated` is true when more results exist beyond the page (`offset`, default 0, selects the page). Multi-word queries are matched conjunctively: every word must be evidenced on a shop (name, domain or category). `ignored_terms` lists the words that matched nothing anywhere in the corpus and were therefore dropped to avoid an empty answer; a non-empty `ignored_terms` means the results answer a narrower question than the one asked. `match_quality` states how well the query was evidenced: \"full\" (every word found as a name/domain/category fragment; this is evidence of a fragment, not of relevance; results are ordered by match stage in name/domain: exact, then prefix, then word start, then substring, with category-only matches after them, ties by stable id), \"partial\" (some words are in `ignored_terms`; the results answer a narrower question), \"none\" (no match), \"corrected\" (the query as typed matched nothing, but a shop name or domain within typo distance exists: `results` and `total_count` are the matches for `corrected_query`, e.g. \"zalandoo\" -> \"zalando\", not for the query as typed). Question and intent words (\"is\", \"legit\", \"return policy\", \"rücksendung\", a delivery country such as \"austria\") and pasted URLs are reduced to the shop name or domain before matching; the dropped words are listed in `generic_terms_ignored`, and a delivery country is not a filter (`country` is where the shop is based). German category words like \"schuhe\" or \"möbel\" are matched against the English category slugs. For \"partial\", \"none\" and \"corrected\", `suggestions` carries hints: `categories` (known category slugs) and `shops` (domains within typo distance, e.g. \"bergzeitt\" -> bergzeit.de); both are empty for \"full\". `category_truncated` is true when category resolution hit its internal cap and the match set is a subset. `category` accepts only a slug from the shop category taxonomy; an unrecognized slug is rejected with an error and does not yield a silent empty `results`. `category` is additive to `query` (AND, not OR); `query: \"\"` browses a category without a name/domain filter.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "offset": {
                "type": "number"
              },
              "query": {
                "description": "Shop name, domain or pasted URL, a question naming a shop, or a category word (English or German), e.g. \"zalando\", \"bergzeit.de\", \"is otto legit\", \"elektronik\"; \"\" together with `category` browses a category.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find an online shop"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c3ce4782e34f004e1bda1e7644750ec82491964962e4ed7f74c2f8f9fd1e9c51"
        },
        {
          "name": "get_shipping_policy",
          "title": "Get shipping policy",
          "description": "What a shop STATES about its own shipping: which destinations it names, the delivery time it claims, and any free-shipping threshold, plus the date that statement was last checked and where it was read (policy_page or structured_data). This is a shop-level statement, NOT an offer and NOT a quote: it carries no carrier and no shipping price, because OpenShopGraph does not hold that data. The optional country (ISO 3166-1 alpha-2, e.g. \"DE\") adds a ships_to verdict derived from the stated destination list; \"unknown\" is a real answer there and means the statement does not settle it. When nothing has been collected for a shop, the reply says so explicitly (collected:false): a gap in the data, not a statement that the shop does not ship. The checked-at date marks how current the merchant's claim is.",
          "inputSchema": {
            "properties": {
              "country": {
                "type": "string"
              },
              "shop_domain": {
                "description": "Shop domain, e.g. \"otto.de\". An internal OpenShopGraph shop id is accepted here as well. The older field name `shop_id_or_domain` still works on every tool and means exactly the same thing.",
                "type": "string"
              }
            },
            "required": ["shop_domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get shipping policy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ce884b853eaf5ccaeca377bbb68955f002928d4fafb44ba4a2928f4e048dc77c"
        },
        {
          "name": "get_shop",
          "title": "Get shop facts",
          "description": "Get the public profile of one online shop by domain or id (name, canonical domain, country, category) and how many of its policy facts are sourced (`fields_belegt`); the facts on returns, shipping and payment methods are available through the separate policy lookup. Public view. Answers \"shop not found\" for shops still under internal review, identical to a genuinely unknown domain, so reviewers cannot be distinguished from typos. The offers array is present for schema stability and is empty for shops without ingested merchant offers. `fields_belegt` (\"n/m\") counts how many of the shop's policy facts carry a checked, sourced value, out of the m policy facts tracked per shop.",
          "inputSchema": {
            "properties": {
              "shop_domain": {
                "description": "Shop domain, e.g. \"otto.de\". An internal OpenShopGraph shop id is accepted here as well. The older field name `shop_id_or_domain` still works on every tool and means exactly the same thing.",
                "type": "string"
              }
            },
            "required": ["shop_domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get shop facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b79cf8eb2a64dccc3099987898fd47ec349562ab267b21f9046103f09cd8d6f"
        },
        {
          "name": "get_shop_policies",
          "title": "Get shop policies",
          "description": "What a shop STATES about its own policies, each fact with the date it was last checked and where it was read: return window in days (returns_days), free return label, tracking offered, payment methods, buyer-protection seal, plus the shipping statement (destinations, stated delivery time, free-shipping threshold). Answers questions such as \"how long can I return something at this shop?\". These are shop-level statements, NOT offers and NOT quotes: no carrier, no shipping price. Every fact in `policies` is an object with `collected`: when true it carries value, checked_at and source (policy_page = read from the shop, llm_gap_resolution = model-derived, not read from the shop); when false it carries a reason and means OpenShopGraph holds no checked value, a gap in the data and NOT a statement that the shop has no such policy. A fact whose value and check date are stored but whose source is unknown is also reported as collected:false (reason no_source): a value without a source is not shown. The optional country (ISO 3166-1 alpha-2, e.g. \"DE\") adds a ships_to verdict derived from the stated destination list; \"unknown\" is a real answer there. `checked_at` is the date a figure was last checked and marks how current a stated claim is.",
          "inputSchema": {
            "properties": {
              "country": {
                "type": "string"
              },
              "shop_domain": {
                "description": "Shop domain, e.g. \"otto.de\". An internal OpenShopGraph shop id is accepted here as well. The older field name `shop_id_or_domain` still works on every tool and means exactly the same thing.",
                "type": "string"
              }
            },
            "required": ["shop_domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get shop policies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:857bbfaad0906416818d4dc22575f438192d8975a19c1cd16cecf21c401c519a"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List the shop categories OpenShopGraph carries (for example fashion or electronics), to filter the shop search by category. The taxonomy: every category slug currently carried by at least one public shop, together with how many public shops carry it. The taxonomy is flat (no parent/child hierarchy, e.g. \"fashion\" and \"womens-clothing\" are siblings, not nested) and its slugs come from observed data, not from a fixed enum, so the set of slugs is known only from this response. The `category` filter of the shop search accepts only slugs from this response. A shop can carry more than one category, so the counts can add up to more than the number of shops.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f27d44f99b49ad004add62059de99a2d127c8844b9e6d9209db44cdbef5085e0"
        },
        {
          "name": "list_coupons",
          "title": "List coupons",
          "description": "List currently usable, source-dated discount codes for online shops, with verification status and what was withheld and why (an extra next to the shop facts). Optionally filtered by shop_domain (e.g. \"otto.de\"). A code is withheld from `results` when it is EXPIRED (valid_until has passed), when a real checkout test PROVED it does not work (verification_status \"verified_rejected\"), or when a display policy suppresses it on this channel/country. Nothing is withheld silently: `total_count` is the REAL number of codes the query found before any of that (for the collection list the full count over everything, not just the window), `examined` is how many codes this request looked at, and `withheld` breaks the difference down by reason ({expired, verified_rejected, reserved_test_domain, policy}); examined minus results.length equals the sum of `withheld`, and `note` states the same balance in one sentence. WITHOUT shop_domain the answer is one window of at most `limit` codes (default 100, max 100) starting at `offset` (default 0), ordered by a stable id: `truncated` is true when more codes lie beyond it and `next_offset` is the offset of the next page (null on the last page), so `truncated: false` marks the last page. limit/offset are rejected together with shop_domain, which already returns every code of that shop. An empty `results` is explained by `total_count` and `note`, which tell \"this shop has no codes at all\" apart from \"it has codes and every one of them is proven dead\". An UNKNOWN or internal-review shop_domain is a different answer again: it is an error (\"shop not found\"), not an empty list; and a backend failure is reported as a failure, not as an empty list. Each result carries validUntil: an ISO timestamp when the code has a stated expiry, or null when it is open-ended; null means unlimited, NOT unknown-and-expired, and a stated expiry can pass after the response was produced. Each result ALSO carries verificationStatus, the verdict of a real checkout test against this exact code: \"verified_applied\" means the code worked in an actual checkout attempt (the response carries no stored proof artifact); \"unverified\" means no proof exists either way yet: it is unknown, not a negative signal, and does not mean the code was tested and failed. (\"verified_rejected\" is defined as before but no longer appears in `results`; it is counted in `withheld.verified_rejected` instead.) lastVerifiedAt is the ISO timestamp of that most recent test, or null if the code has not been tested. A non-null lastVerifiedAt on an \"unverified\" code means it WAS tested but the test was inconclusive, which is not the same as a code for which no test was attempted. Each result also states where the code came from: source (how it was obtained, e.g. \"shop-owned-page\" = read from the shop's own page), source_url (the page it was read on) and seen_at (ISO timestamp of that reading); each is null when the record does not carry it.",
          "inputSchema": {
            "properties": {
              "limit": {
                "type": "number"
              },
              "offset": {
                "type": "number"
              },
              "shop_domain": {
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List coupons"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4711e337e693c0e61d3edf9ee4ecbbd45f7a74f215647b28f2c8f32a1ce33974"
        }
      ],
      "digest": "sha256:83da200bffeb93b4b4742fd181a0dede28ef0c5291fcb9e43e2bbc4795c99b3f"
    }
  }
