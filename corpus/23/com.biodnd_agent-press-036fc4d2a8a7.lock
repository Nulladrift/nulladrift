{
  "lockfileVersion": 2,
  "subjects": {
    "com.biodnd/agent-press": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "sse",
        "url": "https://agent-press.biodnd.com/sse"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "Agent Press MCP Server",
        "version": "1.18.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": false
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "news_company",
          "description": "Fetch recent company headlines for a given stock symbol.",
          "inputSchema": {
            "properties": {
              "end_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional ISO 8601 end date to filter newest headline."
              },
              "limit": {
                "default": 25,
                "description": "Maximum number of stories to return.",
                "type": "integer"
              },
              "provider": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional news provider identifier."
              },
              "start_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional ISO 8601 start date to filter oldest headline."
              },
              "symbol": {
                "description": "Ticker symbol to retrieve headlines for, e.g. AAPL.",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "_fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:9684c1693ee200b9107d54c88dd0e19a33b89fb5f5d48efe591c0faad0f41594"
        }
      ],
      "digest": "sha256:bdafd51a4981985848a5faa2b70ae6c9e949ca5bdae2c734be3f81254f2c7918"
    }
  }
