      },
      "transport": {
        "type": "http",
        "url": "https://mcp-factory.bowling-anthony.workers.dev/invoice-duplicate-recovery/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.mcpscores/invoice-duplicate-recovery",
        "title": "Invoice Duplicate Recovery",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Computes exact overpayments across caller-supplied approved invoices, payments, and recorded credits, and produces an evidence bundle for requesting vendor credit review. Never sends requests, never asserts legal refund entitlement, and never takes automatic financial action. Tool calls cost 0.05 USDC on Base. Initialization, tool discovery and unpaid price challenges are free. Send x402 v2 PAYMENT-SIGNATURE on the POST or params._meta['x402/payment']. Reuse the identical input and authorization when recovering a pending purchase; do not sign a fresh charge. Results are retained24hours. Structural validation only: unknown fields, wrong types, malformed IDs/currency/amount strings, or out-of-range minor_unit_digits are refused outright (admission fails) rather than reported as issues. Business-data problems (duplicate/conflicting invoice keys, duplicate or conflicting payment/credit IDs, missing invoice/payment links, currency mismatch between a payment and its invoice, amount precision exceeding the invoice minor_unit_digits, credits exceeding their linked payment) are reported as issues on the affected invoice, never silently guessed or repaired. Any issue touching an invoice suppresses that invoice summary and credit_request, even if a trustworthy subset would otherwise show an overpayment, so the evidence bundle never publishes a seemingly complete partial total. Exact duplicate records (identical full record sharing a payment_id, credit_id, or invoice vendor_id+invoice_id key) are recognized as repeated imports and counted once; distinct payment_ids against the same invoice are treated as separate real installments, not duplicates. All arithmetic is exact BigInt minor-unit math derived from canonical decimal strings; there is no rounding anywhere, and no floating point is used, so amounts far beyond Number.MAX_SAFE_INTEGER are handled exactly. No currency conversion is performed. A payment must share its invoice currency exactly to be included in that invoice totals. This tool never sends any request, never contacts the vendor, never asserts legal refund entitlement, and never performs any automatic financial action. Output is evidence for the caller to use at their own discretion. Bounded input only: payload <= 128 KiB, structural depth <= 10, <= 20000 total nodes, <= 500 invoices, <= 1000 payments, <= 1000 credits. Results at most 96 KiB; retry identical input and authorization within 24 hours to recover a purchase.",
      "tools": [
        {
          "name": "invoice_duplicate_recovery",
          "description": "Computes exact overpayments across caller-supplied approved invoices, payments, and recorded credits, and produces an evidence bundle for requesting vendor credit review. Never sends requests, never asserts legal refund entitlement, and never takes automatic financial action. Price: 0.05 USDC per completed bounded job on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "properties": {
                  "invoices": {
                    "minItems": 1
                  }
                },
                "required": ["invoices"]
              },
              {
                "properties": {
                  "payments": {
                    "minItems": 1
                  }
                },
                "required": ["payments"]
              },
              {
                "properties": {
                  "credits": {
                    "minItems": 1
                  }
                },
                "required": ["credits"]
              }
            ],
            "properties": {
              "credits": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "pattern": "^(0|[1-9]\\d{0,14})(\\.\\d{1,6})?$",
                      "type": "string"
                    },
                    "credit_id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "payment_id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["amount", "credit_id", "payment_id"],
                  "type": "object"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "invoices": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "Canonical non-negative decimal string, exact, no rounding.",
                      "pattern": "^(0|[1-9]\\d{0,14})(\\.\\d{1,6})?$",
                      "type": "string"
                    },
                    "currency": {
                      "pattern": "^[A-Z]{3}$",
                      "type": "string"
                    },
                    "invoice_id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "minor_unit_digits": {
                      "maximum": 6,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "vendor_id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["amount", "currency", "invoice_id", "minor_unit_digits", "vendor_id"],
                  "type": "object"
                },
                "maxItems": 500,
                "type": "array"
              },
              "payments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "pattern": "^(0|[1-9]\\d{0,14})(\\.\\d{1,6})?$",
                      "type": "string"
                    },
                    "currency": {
                      "pattern": "^[A-Z]{3}$",
                      "type": "string"
                    },
                    "invoice_id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "payment_id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "vendor_id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["amount", "currency", "invoice_id", "payment_id", "vendor_id"],
                  "type": "object"
                },
                "maxItems": 1000,
                "type": "array"
              }
            },
            "required": ["invoices", "payments"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a28319287ee2163a96989d85d348631343f3036dde809bb428e17eb66a8d12d"
        }
      ],
      "digest": "sha256:b15660ddcdaa6daff55bbdb3ec390e6eddbfc3e8d576462024f0511f763adbb1"
    }
  }
