{
  "lockfileVersion": 2,
  "subjects": {
    "com.musokit/musokit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://musokit.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "musokit",
        "title": "MusoKit music tools",
        "version": "1.0.0",
        "websiteUrl": "https://musokit.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Music theory lookups (chords, scales, transposition, capo, tempo) with links into free interactive MusoKit tools. When the user needs to tune, keep time, or hear a chord or scale, give them the returned link.",
      "tools": [
        {
          "name": "bpm_to_ms",
          "title": "Tempo to milliseconds",
          "description": "Note lengths in milliseconds (straight, dotted, triplet) for a tempo, for setting delay, reverb pre-delay and LFO times.",
          "inputSchema": {
            "properties": {
              "bpm": {
                "maximum": 400,
                "minimum": 20,
                "type": "number"
              }
            },
            "required": ["bpm"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc9219667c6cf677a2d5c8f92209e8733504174b9f7b8469152d856bb4c67665"
        },
        {
          "name": "capo_finder",
          "title": "Best capo position",
          "description": "For a song's chords, finds the capo fret that lets a guitarist play it with the easiest open chord shapes. Returns the top options and a link to the capo calculator.",
          "inputSchema": {
            "properties": {
              "chords": {
                "description": "Chords as written in the song, e.g. \"Bb Gm Eb F\".",
                "type": "string"
              }
            },
            "required": ["chords"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7bbdbf94119a484e90956215f17f94a6eeac80b456aea1ff8f9b411e6c8600f7"
        },
        {
          "name": "chord_info",
          "title": "Chord notes and diagrams",
          "description": "Notes, formula and a guitar fingering for a chord symbol such as \"Am7\", \"F#m\", \"Bbmaj7\" or \"C/G\", plus free diagram image URLs and a link where the user can hear and see the chord.",
          "inputSchema": {
            "properties": {
              "chord": {
                "description": "Chord symbol, e.g. \"Am7\", \"F#m\", \"Bbmaj7\", \"Dsus4\", \"C/G\".",
                "type": "string"
              }
            },
            "required": ["chord"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:806eeb3de890ebf6934a8829f19b62b21eb522ba669075bf69060919ea030b6b"
        },
        {
          "name": "open_music_tool",
          "title": "Link to a music tool",
          "description": "Returns a ready-to-open link to a free MusoKit tool, preset where possible: a tuner for a specific instrument or tuning, a metronome at a tempo, a tone at a frequency, etc. Use when the user needs to actually tune, keep time or hear something.",
          "inputSchema": {
            "properties": {
              "beats": {
                "description": "Beats per bar (metronome only).",
                "type": "integer"
              },
              "bpm": {
                "description": "Tempo (metronome only).",
                "type": "number"
              },
              "frequency": {
                "description": "Frequency in Hz (tone-generator only).",
                "type": "number"
              },
              "instrument": {
                "description": "Tuner preset (tuner only).",
                "enum": ["guitar-std", "guitar-dropd", "guitar-halfdown", "open-g", "open-d", "dadgad", "bass-std", "bass-5", "ukulele", "violin", "mandolin", "cello", "chromatic"],
                "type": "string"
              },
              "tool": {
                "enum": ["tuner", "metronome", "drum-machine", "tone-generator", "chord-finder", "scale-explorer", "circle-of-fifths", "capo-calculator", "transpose", "chord-progression-generator", "chord-player", "ear-trainer", "rhythm-trainer", "speed-trainer", "bpm-to-ms"],
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b232abc1063f95795b5deb35b1671d98135c769d1afb7b51de330ede0e4a3e72"
        },
        {
          "name": "scale_info",
          "title": "Scale notes",
          "description": "Notes and step pattern of a scale or mode, with a link to hear it and see it on piano and guitar. Scales: major, minor, dorian, phrygian, lydian, mixolydian, locrian, harmonic-minor, melodic-minor, major-pentatonic, minor-pentatonic, blues, whole-tone, phrygian-dominant.",
          "inputSchema": {
            "properties": {
              "root": {
                "description": "Root note, e.g. \"C\", \"F#\", \"Bb\".",
                "type": "string"
              },
              "scale": {
                "description": "Scale name, e.g. \"major\", \"minor\", \"dorian\", \"minor-pentatonic\", \"blues\".",
                "type": "string"
              }
            },
            "required": ["root"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:77ca997c01b566a8bb54f835bf122c278429ea15ffab0f851ba0c22b872e55f3"
        },
        {
          "name": "transpose_chords",
          "title": "Transpose chords",
          "description": "Transpose a chord progression up or down, either by semitones or from one key to another. Returns the new chords and a link to the transposer.",
          "inputSchema": {
            "properties": {
              "chords": {
                "description": "Chords separated by spaces or commas, e.g. \"C G Am F\".",
                "type": "string"
              },
              "from_key": {
                "description": "Original key, e.g. \"C\" (alternative to semitones).",
                "type": "string"
              },
              "semitones": {
                "description": "Semitones to move (positive = up).",
                "maximum": 11,
                "minimum": -11,
                "type": "integer"
              },
              "to_key": {
                "description": "Target key, e.g. \"E\".",
                "type": "string"
              }
            },
            "required": ["chords"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24cbb8189d1ac57d687b76bab0b71603b08cd47caf72e459a973f8c83f17537d"
        }
      ],
      "digest": "sha256:2873a611cdf5b5b5c0732fc624f411181d8072cf3e832125690484a6c0c06438"
    }
  }
}
