      "serverInfo": {
        "name": "space-mushroom",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Space Mushroom is an open materials platform where every number carries its source, conditions and method. Use find_materials to go from requirements to candidates (pass, fail or unknown, with evidence), list_claims and prove_claim to see and verify values, what_is_missing for coverage, and search_materials, get_material and compare for browsing. Use resolve_designation when you have a code (UNS, EN, DIN, JIS, AISI, ASTM) and need the grade. For spacecraft, launchers, engines, suits and other space products (what they are made of, by whom, in which part): find_products, search_products, get_product, product_parts, products_using_material, materials_used_by_function, standards_for, orgs_for, products_by_maker, engines_for_vehicle, vehicles_for_engine, product_graph and compare_products. A product links to material ids that work with get_material and list_claims. Always quote the source with a value. A value marked review \"ai_checked\" was re-read by an AI assistant, not a person. A product row with quote_status \"unmatched\" could not be found on its source page by the automatic check: treat it as unverified. Absence of data means \"not covered yet\", not \"not known to be safe\". Data licensed CC BY 4.0. Cite the source shown with each value and \"Space Mushroom (spacemushroom.com)\".",
      "tools": [
        {
          "name": "compare",
          "title": "Compare materials on one property",
          "description": "Line several materials up on one property, with each value, its conditions and its source. Values are also given in the property's canonical unit (value_canonical), so they can be ranked directly. Values measured under different conditions are listed separately and are not averaged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "materials": {
                "description": "Ids from search_materials",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 2,
                "type": "array"
              },
              "property": {
                "description": "For example thermal_runaway_onset or atomic_oxygen_erosion_yield",
                "type": "string"
              }
            },
            "required": ["materials", "property"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare materials on one property"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e4eb3788209ac63af5728faf31d9edac5f50dca9fe489079e323934e3c24988c"
        },
        {
          "name": "compare_products",
          "title": "Compare products",
          "description": "Put 2 to 6 products side by side: kind, maker, size / mass / orbit, depth label, counts, the materials each uses (and which are shared or unique), the materials per part function, the spec rows they have in common, standards, organizations and what each does not publish. Use it to choose between comparable products or to see how a design differs (\"CubeSat Kit structure vs EnduroSat structures\"). It reads the same sourced records as get_product; open that for the quotes. Specs are aligned by label, so differences in wording show as separate rows.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "products": {
                "description": "Product ids, titles or aliases",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:923599deb122b39b7fc634b4cffb05e9eabaed91092e10913c41a9ae5e1f5e11"
        },
        {
          "name": "engines_for_vehicle",
          "title": "Engines used by a vehicle",
          "description": "Which engines a launcher, stage or spacecraft uses, from relations a source states (engine part of vehicle, vehicle carries engine). Each engine comes with its stage or role (role, note), the quote and source, its makers and suppliers, and the material ids in it, so you can go on to get_product for the engine or products_using_material for its alloys. engine_known false means a source names the engine for this vehicle but the engine is not a product here yet (only its name is kept). Accepts an id, title or alias (F9, SLS).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "vehicle": {
                "description": "Vehicle product id, title or alias, for example ula-vulcan-centaur or Falcon 9",
                "type": "string"
              }
            },
            "required": ["vehicle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Engines used by a vehicle"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
