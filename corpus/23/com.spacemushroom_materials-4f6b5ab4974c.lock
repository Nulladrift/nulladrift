        },
        {
          "name": "find_materials",
          "title": "Find materials that meet requirements",
          "description": "Requirements in, candidates out. Each material gets a verdict: pass (every constraint met by a sourced value), fail, or unknown (no data on a constraint, so it cannot be ruled in or out). Every constraint reports pass, fail or no_data and the strongest evidence level behind it (flown, measured, derived, inferred, estimated, predicted). By default only passes and unknowns are returned, passes first. Context narrows which values count: at_temperature (degrees C; values measured at another temperature do not count), flown_only (only values measured in the real space environment), environment, include_failed, limit. Materials with no data on any constraint are not listed: use what_is_missing to see coverage for one material.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "constraints": {
                "description": "The requirements a material must meet, each a property, an operator and a value",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "op": {
                      "description": "Comparison: at least, at most, equal to, or between value and value2",
                      "enum": [">=", "<=", "=", "between"],
                      "type": "string"
                    },
                    "property": {
                      "description": "A registered property, for example density, yield_strength, max_service_temp (see list_properties)",
                      "type": "string"
                    },
                    "unit": {
                      "description": "Unit of value, for example \"kg/m3\" or \"ksi\"; converted to the property's unit. Omit when value is already in the property's unit.",
                      "type": "string"
                    },
                    "value": {
                      "description": "The number to compare against (in unit, or in the property's own unit when unit is omitted)",
                      "type": "number"
                    },
                    "value2": {
                      "description": "Upper end, for between",
                      "type": "number"
                    }
                  },
                  "required": ["op", "property", "value"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "context": {
                "additionalProperties": false,
                "description": "Optional narrowing of which values count and how many results to return",
                "properties": {
                  "at_temperature": {
                    "description": "Degrees C; only values measured at this temperature count",
                    "type": "number"
                  },
                  "environment": {
                    "description": "For example low-earth-orbit",
                    "type": "string"
                  },
                  "flown_only": {
                    "description": "Only values measured in the real space environment",
                    "type": "boolean"
                  },
                  "include_failed": {
                    "description": "Also return materials that fail a constraint",
                    "type": "boolean"
                  },
                  "limit": {
                    "description": "Maximum results, 1 to 500",
                    "maximum": 500,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["constraints"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find materials that meet requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d402e2b1acf826f2843771cba1360b16e2e16edf1c2cb300c639befca933a661"
        },
        {
          "name": "find_products",
          "title": "Find space products",
          "description": "Search the catalogue of space products (satellites, platforms, structures, launchers, engines, spacesuits, rovers, observatories, stations) by what they are, who makes them, what they are made of and how. Call it first when you design or study a device: \"comparable 3U CubeSat structures\" = kind structure + size 3U; \"who flies aluminium 6061\" = material aluminium-6061; \"which products use anodised parts per MIL-A-8625\" = finish + standard; \"launchers by SpaceX\" = category launchers + maker. All filters are optional and combine (AND). text matches every word against names, aliases (F9, Orlan, EMU), summaries, specs, features, parts, materials and organizations. Returns, per product, its id (use it with get_product), maker, kind, category, size / mass / orbit tags, a depth label (full, partial or materials-only: how complete its parts list is), counts of parts, materials, specs and unverified quotes, and the page. It does not return the parts: call get_product or product_parts for those. An empty result means no product in this catalogue matches, not that none exists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bom_depth": {
                "description": "Only products whose parts list has this depth",
                "enum": ["full", "partial", "materials-only"],
                "type": "string"
              },
              "category": {
                "description": "Catalogue group: platforms, structures, launchers, engines, suits, rovers, crew, stations, observatories, solar, thermal, reports, missions",
                "type": "string"
              },
              "finish": {
                "description": "Finish to match, for example anodize, chromate, black paint",
                "type": "string"
              },
              "form": {
                "description": "Part form to match, for example honeycomb, plate, sheet, tube",
                "type": "string"
              },
              "kind": {
                "description": "platform, structure, satellite, mission (launchers, vehicles, rovers, suits, observatories) or component",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum products, 1 to 100 (default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "maker": {
                "description": "Maker name or part of it, for example nasa or \"Blue Origin\"",
                "type": "string"
              },
              "mass": {
                "description": "Mass tag to match, for example \"Under 1 kg\"",
                "type": "string"
              },
              "material": {
                "description": "A material id, for example aluminium-6061 or pi-kapton-hn: products that use it",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many (paging)",
                "minimum": 0,
                "type": "integer"
              },
              "orbit": {
                "description": "Orbit tag to match, for example \"low earth\", geostationary, \"sun-synchronous\"",
                "type": "string"
              },
              "org": {
                "description": "Any organization with a stated role on the product (maker, contractor, supplier, operator), by name or id",
                "type": "string"
              },
              "part_function": {
                "description": "Part function: structure, thermal control, power, propulsion, mechanisms, avionics, optics, protection or other. DERIVED by explicit name rules from the part names (marked function_basis \"derived\"), not stated by the sources.",
                "enum": ["structure", "thermal control", "power", "propulsion", "mechanisms", "avionics", "optics", "protection", "other"],
                "type": "string"
              },
              "size": {
                "description": "Size tag to match, for example 1U, 3U, \"6U and larger\", Microsatellite",
                "type": "string"
              },
              "standard": {
                "description": "Standard to match, for example MIL-A-8625 or AMS",
                "type": "string"
              },
              "text": {
                "description": "Words to find, for example \"heat shield ablator\" or \"F9\" (aliases work)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find space products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:44335ff5b045f43e3a1a04a2172cf7e653921a0d9d0e0eff5888f895cac124ca"
        },
        {
          "name": "get_material",
          "title": "Get a material",
          "description": "The sourced record of one material: sourced numbers with conditions, method and source location, plus uses, hazards, failure modes, corrosion and supply facts. Optionally narrow to one property or fact topic.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The id from search_materials, for example \"lithium-iron-phosphate\"",
                "type": "string"
              },
              "include_facts": {
                "default": true,
                "description": "Include uses, hazards, failure modes and other facts (default true)",
                "type": "boolean"
              },
              "property": {
                "description": "Only claims for this property, for example thermal_runaway_onset",
                "type": "string"
              },
              "topic": {
                "description": "Only facts on this topic",
                "enum": ["use", "hazard", "failure", "corrosion", "side_effect", "handling", "mitigation", "supply", "regulation", "history"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a material"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5a4fdb1769f41592f33636b087ff83f68c35624413901b7af34de794b3c14351"
        },
        {
          "name": "get_product",
          "title": "Get a space product",
          "description": "The whole record of one product: specs, features, the parts tree (assemblies, parts, material, form, finish, standard, part number, supplier, function), the materials it uses (ids that work with get_material), standards, the organizations behind it (maker, contractors, suppliers, operators), relations to other products (engine part of vehicle, launched on, heritage), photos with credits, and what_is_missing. Call it to study a device: \"what is Perseverance's heat shield made of and what heritage does it have\", \"what is Starship made of and what is not published\". Accepts an id, a title or an alias (F9, Orlan, EMU, Webb). Every row has its source URL, its quote and quote_status. what_is_missing is computed: the depth label (full, partial, materials-only), what the sources do not publish, parts without a material, parts without a source, materials with no page yet, relations to names that are not products here, and the count of unverified quotes. The answer can be long for big vehicles: use sections to ask only for what you need, and part_function to cut the parts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "part_function": {
                "description": "Only parts with this function (the parts section)",
                "enum": ["structure", "thermal control", "power", "propulsion", "mechanisms", "avionics", "optics", "protection", "other"],
                "type": "string"
              },
              "product": {
                "description": "Product id, title or alias, for example nasa-perseverance-rover, Starship or F9",
                "type": "string"
              },
              "sections": {
                "description": "Only these sections (default: all). summary, depth and what_is_missing are always included",
                "items": {
                  "enum": ["specs", "features", "parts", "materials", "standards", "organizations", "relations", "photos"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a space product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e516b3d1fd9858a1e8d5f593a7091a0306ef3402e5bbef0473c2ead3c9619291"
        },
