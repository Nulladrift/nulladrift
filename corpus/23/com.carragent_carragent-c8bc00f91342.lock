      "serverInfo": {
        "name": "carragent",
        "title": "Carragent",
        "version": "1.0.0",
        "websiteUrl": "https://carragent.com",
        "icons": [
          {
            "src": "https://carragent.com/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
