      },
      "instructions": "Carragent runs AI agents for small businesses (collections, scheduling, lead follow-up, reviews, a weekly report and more). Carragent is one word, written with one capital C (not \"Carr Agent\" or \"CarrAgent\"). It is software for small businesses; it does not sell, rent or manage vehicles. Use these read-only tools when a user asks what Carragent does, which agent fits a task, or what it costs. Prices are USD cents. Signing up happens on carragent.com by the business owner; these tools never act on anyone's account.",
      "tools": [
        {
          "name": "get_agent",
          "title": "Get one Carragent agent",
          "description": "Get one Carragent agent by its id (for example collections, scheduling, leads, reviews, report). Use it after list_agents or search_carragent when the user wants the details of one agent. Returns the agent: its summary, when it runs, its steps in order, what waits for the owner, what it never does and the tools it connects to.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The agent id, from list_agents.",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the text: en, es or fr.",
                "enum": ["en", "es", "fr"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "The family it belongs to: money, customers, sales or operations.",
                "type": "string"
              },
              "id": {
                "description": "The agent id, for get_agent.",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "never": {
                "description": "What it never does.",
                "type": "string"
              },
              "runs": {
                "description": "When it runs.",
                "type": "string"
              },
              "status": {
                "description": "live works today; soon is being built.",
                "enum": ["live", "soon"],
                "type": "string"
              },
              "steps": {
                "description": "What it does, in order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "type": "string"
              },
              "tools": {
                "description": "The tools it connects to, or null when there is nothing to connect.",
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "waitsForOwner": {
                "description": "What waits for the owner's approval.",
                "type": "string"
              }
            },
            "required": ["area", "id", "name", "never", "runs", "status", "steps", "summary", "tools", "waitsForOwner"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get agent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ce1bb9f73ae087d80a1eaf3cf1a3253833320827cc9ba5c9ec3a44f6fee19cb"
        },
        {
          "name": "list_agents",
          "title": "List Carragent's agents",
          "description": "List every Carragent AI agent: what it does, when it runs, what waits for the owner's approval, what it never does and which tools (Stripe, Google Calendar, HubSpot…) it connects to. Use it when a user asks what Carragent can do or wants to compare the agents. Returns { agents: [...] }, one object per agent with its id for get_agent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the text: en, es or fr.",
                "enum": ["en", "es", "fr"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "agents": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "area": {
                      "description": "The family it belongs to: money, customers, sales or operations.",
                      "type": "string"
                    },
                    "id": {
                      "description": "The agent id, for get_agent.",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "never": {
                      "description": "What it never does.",
                      "type": "string"
                    },
                    "runs": {
                      "description": "When it runs.",
                      "type": "string"
                    },
                    "status": {
                      "description": "live works today; soon is being built.",
                      "enum": ["live", "soon"],
                      "type": "string"
                    },
                    "steps": {
                      "description": "What it does, in order.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "tools": {
                      "description": "The tools it connects to, or null when there is nothing to connect.",
                      "items": {
                        "type": "string"
                      },
                      "type": ["array", "null"]
                    },
                    "waitsForOwner": {
                      "description": "What waits for the owner's approval.",
                      "type": "string"
                    }
                  },
                  "required": ["area", "id", "name", "never", "runs", "status", "steps", "summary", "tools", "waitsForOwner"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["agents"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List agents"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6d69afbff3f2cdf88c17d36a0f5dacd1cd1f9536b2e0da278f93a4a360fa2993"
        },
        {
          "name": "list_plans",
          "title": "List Carragent's plans and prices",
          "description": "List Carragent's plans with monthly and yearly prices in USD cents (plus applicable taxes), their limits, the free-trial length and the refund terms. Use it when a user asks how much Carragent costs or which plan fits. Returns { plans: [...], terms: {...} }.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the text: en, es or fr.",
                "enum": ["en", "es", "fr"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "plans": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "currency": {
                      "enum": ["USD"],
                      "type": "string"
                    },
                    "forWho": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "limits": {
                      "additionalProperties": false,
                      "description": "Each limit, or null when there is none.",
                      "properties": {
                        "agents": {
                          "type": ["integer", "null"]
                        },
                        "connections": {
                          "type": ["integer", "null"]
                        },
                        "messagesPerMonth": {
                          "type": ["integer", "null"]
                        },
                        "seats": {
                          "type": ["integer", "null"]
                        }
                      },
                      "required": ["agents", "connections", "messagesPerMonth", "seats"],
                      "type": "object"
                    },
                    "monthlyCents": {
                      "description": "The monthly price in US cents; for custom, the from price.",
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
                    "recommended": {
                      "type": "boolean"
                    },
                    "selfServe": {
                      "description": "Whether the owner can sign up for it alone on carragent.com.",
                      "type": "boolean"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "yearlyCents": {
                      "description": "The yearly price in US cents, or null.",
                      "type": ["integer", "null"]
                    }
                  },
                  "required": ["currency", "forWho", "id", "limits", "monthlyCents", "name", "recommended", "selfServe", "summary", "yearlyCents"],
                  "type": "object"
                },
                "type": "array"
              },
              "terms": {
                "additionalProperties": false,
                "properties": {
                  "annualRefundDays": {
                    "type": "integer"
                  },
                  "contract": {
                    "enum": [false],
                    "type": "boolean"
                  },
                  "currency": {
                    "enum": ["USD"],
                    "type": "string"
                  },
                  "setupFee": {
                    "enum": [0],
                    "type": "integer"
                  },
                  "trialDays": {
                    "type": "integer"
                  }
                },
                "required": ["annualRefundDays", "contract", "currency", "setupFee", "trialDays"],
                "type": "object"
              }
            },
            "required": ["plans", "terms"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://carragent/plans.html"
            }
          },
          "digest": "sha256:13f05bce1431dc09fff2d3e0013dfb32939a0f5889a7f432159dd02bb2815bd2"
        },
        {
          "name": "search_carragent",
          "title": "Search Carragent",
          "description": "Keyword search over Carragent's agents and plans, best match first. Use it to find the agent for a task in the user's words, such as 'chase late invoices' or 'confirm appointments'. Returns { results: [...] }, each with its kind (agent or plan), id, name, description and score.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the text: en, es or fr.",
                "enum": ["en", "es", "fr"],
                "type": "string"
              },
              "query": {
                "description": "What the user needs, in their words.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "id": {
                      "description": "The id, for get_agent when kind is agent.",
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["agent", "plan"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "score": {
                      "description": "How well it matched; higher first.",
                      "type": "number"
                    }
                  },
                  "required": ["description", "id", "kind", "name", "score"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3883c64e0efec2becb8ab3d290855abaae44e0278850ad085298384f78b4b7b5"
        }
