      "serverInfo": {
        "name": "chatstack-app-cost-estimator",
        "title": "ChatStack App Cost Estimator",
        "version": "0.9.6",
        "description": "ChatStack App Cost Estimator estimates app and AI solution development costs and hours, scopes an MVP, and generates a software PRD (Product Requirements Document) with user stories, requirements, and a technical specification. Use when someone asks for an app or software development cost estimate, a software quote, estimated development hours, MVP scope, or a software PRD. Users explicitly choose “Review each step” to answer targeted questions and review outputs, or “Run it for me” to proceed through the workflow using stated assumptions. Estimates include assumptions and exclusions and are indicative, subject to project review. No portal account is required to start.",
