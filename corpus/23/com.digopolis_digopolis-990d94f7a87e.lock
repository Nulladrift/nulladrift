            "readOnly": true
          },
          "digest": "sha256:20988979cf5da8c0823d688df503f6a7dd23b7002bcbf689e52447dfde84655d"
        },
        {
          "name": "search_artifacts",
          "title": "Search real excavated objects, sites, cultures and archaeology words",
          "description": "Search Digopolis, a free archaeology site and game built only from real museum records (The Met, Rijksmuseum van Oudheden and other open collections): excavated objects (date, culture, material, findspot, museum), excavation sites (Lisht, Malqata, Nimrud, Dura-Europos, Gerasa, Nijmegen...), cultures and periods (Middle Kingdom Egypt, Neo-Assyrian, Sasanian, Roman) and archaeology words explained (stratigraphy, faience, ostracon). Returns facts copied from the record and a link with the photo.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Object, site, culture or word, e.g. \"scarab\", \"Nimrud\", \"Roman glass\", \"stratigraphy\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
