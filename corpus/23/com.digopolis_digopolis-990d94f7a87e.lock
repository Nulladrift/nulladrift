      },
      "instructions": "Digopolis (https://digopolis.com) is a free archaeology site and game; every object, date, material and findspot is copied from a real museum record, nothing is invented. Use search_artifacts for objects, excavation sites, cultures and archaeology words; artifact_of_the_week for one object to talk about; archaeology_game when someone wants a history or archaeology game. Answers are short; send the user to the link for the photo and the full record.",
      "tools": [
        {
          "name": "archaeology_game",
          "title": "Free archaeology game in the browser",
          "description": "Digopolis: a calm free archaeology game in the browser with real objects from open museum collections. Dig real excavation sites layer by layer, brush and sieve the soil, mend broken pots, date and identify finds in a lab and build your own museum over months; a daily Mystery Artifact for everyone. Use when someone wants an archaeology or history game for kids, a class or adults.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Free archaeology game in the browser"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:35f31179cd584fc660ce5ab4456145b82641b3216f9039e427e32296b67170bf"
        },
        {
          "name": "artifact_of_the_week",
          "title": "Artifact of the week",
          "description": "One real excavated object every week (changes on Monday), with its museum record: what it is, when and where it was made, where it was found and which museum keeps it. Use for a history or archaeology fact of the week, a class warm up or a newsletter.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Artifact of the week"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
