      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "idiom-mcp",
        "version": "4.1.3"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "idiom_solitaire",
          "title": "Idiom Solitaire",
          "description": "成语接龙：输入一个成语（如'一心一意'），返回可以接上的下一个成语列表（以上一成语尾字开头，含拼音、释义）。默认常规模式：优先首尾同字，同字不足时补同音字接龙；strict=True 为严格模式要求首尾必须同字。count 控制返回候选数量（1-20，默认5）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 5,
                "description": "返回候选成语数量，1-20，默认 5",
                "type": "integer"
              },
              "idiom": {
                "description": "起始成语，如 画蛇添足",
                "type": "string"
              },
              "strict": {
                "default": false,
                "description": "True=严格同字接龙；False=同字优先+同音兜底（默认）",
                "type": "boolean"
              }
            },
            "required": ["idiom"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:47858a81f90ec822256f8761abe9d71dfcbf41e5afc61ad143b28bea1db4880f"
        },
        {
          "name": "random_idiom",
          "title": "Random Idiom",
          "description": "随机返回一个成语（含拼音、释义、出处、例句），适合每日学成语、接龙开场、写作素材。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:9d871bfd829e83f436bcbd13cf2104cd803498b235f5b13acb2cb523c368246b"
        },
        {
          "name": "search_idiom",
          "title": "Search Idiom",
          "description": "检索中华成语：keyword 可为成语中的字（如'龙'）、完整成语、拼音（如 'wàng zǐ chéng lóng' 或 'wang'）或释义/出处关键词。返回成语、拼音、释义、出处、例句。库内收录约3.1万条成语。limit 控制返回条数（1-50，默认10）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "keyword": {
                "description": "关键字（成语用字/拼音/释义/出处），如 画蛇添足、long、 比喻",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "返回条数，1-50，默认 10",
                "type": "integer"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:59385731a04e30b6ac7d794885d471c45c69eeadb7ec3babdb7ca05df05e1a33"
        }
      ],
      "digest": "sha256:f6a55ce25fe176116b139e65084be1f6707e791da27ecda6a4a6217b78705421"
    }
  }
