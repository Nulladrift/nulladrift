{
  "lockfileVersion": 2,
  "subjects": {
    "app.ripey/ripey": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ripey.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ripey",
        "title": "Ripey",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ripey lets people and agents sell digital work (agent skills, workflows, templates, downloads) and get paid in USDC. Everything works on this one connection: call open_store (ask for a store name and the owner's email), keep the agent_key it returns, and pass agent_key to list_products, create_product, delete_draft, publish, checkout_link and sales_summary. Show each draft to the user and call publish only after they approve. Tell the user to save the agent_key (it controls the store) so they can manage it again in a new conversation. Payments are in test mode with simulated USDC.",
      "tools": [
        {
          "name": "checkout_link",
          "title": "Get a buy link",
          "description": "Return a link where a buyer can purchase a published product (opens the store with the product selected). Pass the store's agent_key (returned by open_store).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_key": {
                "description": "The store's agent key (rpy_…), returned by open_store",
                "type": "string"
              },
              "product_id": {
                "description": "Product id from list_products",
                "type": "string"
              }
            },
            "required": ["agent_key", "product_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9e31ac7af39646e9c8a379fffdf5fbdbd1a698fd25426c8499d92e421b91dc65"
        },
        {
          "name": "create_product",
          "title": "Draft a product",
          "description": "Create a DRAFT product in the store. Nothing goes live: show the user the draft (name, description, price) and ask them to approve before calling publish. Pass the store's agent_key (returned by open_store).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_key": {
                "description": "The store's agent key (rpy_…), returned by open_store",
                "type": "string"
              },
              "delivery_url": {
                "description": "Optional https link buyers get after paying (file, repo, Notion page, ...). The owner can instead upload the file itself in the dashboard.",
                "type": "string"
              },
              "description": {
                "description": "One or two sentences buyers will read",
                "type": "string"
              },
              "name": {
                "description": "Product name, e.g. 'Inbox Triage'",
                "type": "string"
              },
              "price_usd": {
                "description": "Price in US dollars, paid in USDC (1 USDC = 1 USD)",
                "maximum": 10000,
                "minimum": 1,
                "type": "number"
              },
              "type": {
                "description": "What kind of product it is",
                "enum": ["skill", "workflow", "template", "download", "other"],
                "type": "string"
              }
            },
            "required": ["agent_key", "description", "name", "price_usd"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4b0c0d4800c4bc485dd1571e291beafdb19d7afdf143a53ab4d960f2cbdc5bda"
        },
        {
          "name": "delete_draft",
          "title": "Delete a draft",
          "description": "Delete an unpublished draft the user doesn't want. Published products can't be deleted this way. Pass the store's agent_key (returned by open_store).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_key": {
                "description": "The store's agent key (rpy_…), returned by open_store",
                "type": "string"
              },
              "product_id": {
                "description": "Draft id from create_product, e.g. p_1a2b3c",
                "type": "string"
              }
            },
            "required": ["agent_key", "product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:48b22e1564241f00bf43cf36f7c95f223e3df39b0a54d2a770b9defdbd7df37b"
        },
        {
          "name": "list_products",
          "title": "List products",
          "description": "List the store's products with their id, price and status (draft or published). Pass the store's agent_key (returned by open_store).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_key": {
                "description": "The store's agent key (rpy_…), returned by open_store",
                "type": "string"
              }
            },
            "required": ["agent_key"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:985247df626158d0942dd6cfb3e2ffb0475b181d09e382821ead97d989157a17"
        },
        {
          "name": "open_store",
          "title": "Open a Ripey store",
          "description": "Open a new Ripey store for the user. Ask for the store name and the user's email first. Optionally takes the user's Solana wallet address (public address only, never a secret key); in test mode a demo address is used if omitted. Returns the store URL, a private dashboard link, and an agent_key: pass it to the other Ripey tools on this same connection to manage the store.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The store owner's email",
                "type": "string"
              },
              "name": {
                "description": "Store name, e.g. 'Atlas Works'",
                "type": "string"
              },
              "wallet": {
                "description": "Optional Solana public address where sales are paid",
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3fcafd2287d8d8db5a4071daa544c34c6cf86de26420f56bb19cbba3dd0559c0"
        },
        {
          "name": "publish",
          "title": "Publish a draft",
          "description": "Put an approved draft on the store so buyers can purchase it. Only call this after the user approves the draft. Pass the store's agent_key (returned by open_store).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_key": {
                "description": "The store's agent key (rpy_…), returned by open_store",
                "type": "string"
              },
              "product_id": {
                "description": "Draft id from create_product, e.g. p_1a2b3c",
                "type": "string"
              }
            },
            "required": ["agent_key", "product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9ad9c0902e355b5f19844b88dfa67861d0b16750e590b6fd90e8107a38c5b12f"
        },
        {
          "name": "sales_summary",
          "title": "Sales summary",
          "description": "Summarize the store's sales over the last N days (default 7): revenue, orders, customers and top products. Pass the store's agent_key (returned by open_store).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_key": {
                "description": "The store's agent key (rpy_…), returned by open_store",
                "type": "string"
              },
              "days": {
                "description": "How many days to look back (1-90)",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["agent_key"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:42749103b4096a8f2bdacc7b08aa9e9aab8b96fbf7dfc483cda1926e0c96a85e"
        }
      ],
      "digest": "sha256:c6715d5a597587e4e9531b0e930223e7494d75ee7efefdb86f37ce7ca89ab01e"
    }
  }
}
