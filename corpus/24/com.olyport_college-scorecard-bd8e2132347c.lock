      "tools": [
        {
          "name": "compare_schools",
          "description": "Compare multiple colleges or universities side by side.\n\n    Returns key metrics for each school including tuition, admission rate,\n    median earnings, debt, and completion rate for easy comparison.\n\n    Args:\n        school_ids: Comma-separated list of College Scorecard school IDs\n                    (e.g. '166027,166683,243780'). Use search_schools to find IDs.\n    ",
          "inputSchema": {
            "properties": {
              "school_ids": {
                "title": "School Ids",
                "type": "string"
              }
            },
            "required": ["school_ids"],
            "title": "compare_schoolsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "compare_schoolsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d890f436ee276efcedae6155dc48987c6f242a3f2c0d24b56c8be21c4874c36"
        },
        {
          "name": "get_field_of_study",
          "description": "Get earnings and debt data by field of study from the College Scorecard.\n\n    Returns median earnings and median debt for graduates of specific academic\n    programs. Can be filtered by school, by field name, or both.\n\n    Args:\n        school_id: College Scorecard school ID to see field-level data for one school.\n        field: Field of study name or keyword to search across schools\n               (e.g. 'Computer Science', 'Nursing', 'Business').\n    ",
          "inputSchema": {
            "properties": {
              "field": {
                "default": null,
                "title": "Field",
                "type": "string"
              },
              "school_id": {
                "default": null,
                "title": "School Id",
                "type": "integer"
              }
            },
            "title": "get_field_of_studyArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_field_of_studyOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:613e95db14ee7e5bccd1642692148b11cd091d6a338013f9ef5d9d3d2c20cad0"
        },
        {
          "name": "get_school_detail",
          "description": "Get detailed data for a specific college or university.\n\n    Returns comprehensive information including costs, admissions, demographics,\n    earnings outcomes, financial aid, debt levels, and completion rates.\n    Use school IDs from search_schools results.\n\n    Args:\n        school_id: The College Scorecard school ID (integer). Find IDs via search_schools.\n    ",
          "inputSchema": {
            "properties": {
              "school_id": {
                "title": "School Id",
                "type": "integer"
              }
            },
            "required": ["school_id"],
            "title": "get_school_detailArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_school_detailOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f3646c7a44a353d52e9167d73a0a774899daa9f69b2133295a3f3106354b593b"
        },
        {
          "name": "search_schools",
          "description": "Search colleges and universities in the College Scorecard database.\n\n    Returns matching schools with basic info: name, location, size, tuition,\n    admission rate, median earnings, and completion rate.\n\n    Args:\n        name: Full or partial school name to search (e.g. 'Harvard', 'community college').\n        state: Two-letter US state abbreviation (e.g. 'CA', 'NY') to filter by state.\n        zip_code: Five-digit ZIP code for location-based search. Use with distance parameter.\n        distance: Search radius in miles from zip_code. Only used when zip_code is provided.\n        degree_type: Filter by predominant degree type: '1' (certificate), '2' (associate),\n                     '3' (bachelor), '4' (graduate). Omit for all types.\n        limit: Maximum number of schools to return (default 25, max 100).\n    ",
          "inputSchema": {
            "properties": {
              "degree_type": {
                "default": null,
                "title": "Degree Type",
                "type": "string"
              },
              "distance": {
                "default": null,
                "title": "Distance",
                "type": "integer"
              },
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "name": {
                "default": null,
                "title": "Name",
                "type": "string"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              },
              "zip_code": {
                "default": null,
                "title": "Zip Code",
                "type": "string"
              }
            },
            "title": "search_schoolsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_schoolsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bccc1357b4d7b103cf9eb16851bc442de226e8b9aad4dcaea96abf320d462fa9"
        }
      ],
