{
  "lockfileVersion": 2,
  "subjects": {
    "app.getdroppy/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getdroppy.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "app.getdroppy/docs",
        "title": "Droppy docs",
        "version": "1.0.0",
        "websiteUrl": "https://getdroppy.app",
        "icons": [
          {
            "src": "https://getdroppy.app/assets/brand/droppy-icon-default-256.webp?v=2",
            "mimeType": "image/webp",
            "sizes": ["256x256"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This server answers questions about Droppy, a Mac app that turns the notch into a Dynamic Island with a file tray, clipboard manager, live activities, music controls and extensions called droplets. Use search_droppy_docs first for any how-to, setting, shortcut, permission, pricing or troubleshooting question, then fetch_droppy_page to read the best match in full before answering. Use list_droplets to see which droplets exist, which are built in and which come from the Droplet Store. Pricing, licensing and the trial are on /pricing.md and /docs/license; release notes are on /changelog. Every tool is read-only. To let an AI app act on Droppy on a Mac, the user switches on the MCP droplet in Droppy (Settings, Droplet Store, MCP), which runs a separate local server; /docs/mcp explains it.",
      "tools": [
        {
          "name": "fetch_droppy_page",
          "title": "Read a Droppy page",
          "description": "Read one page of getdroppy.app as Markdown, by URL or path, for example \"/docs/shelf\", \"https://getdroppy.app/docs/droplets/ring\" or \"/pricing.md\". Use it after search_droppy_docs to read a result in full.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_characters": {
                "default": 40000,
                "description": "Cut the page off after this many characters.",
                "maximum": 100000,
                "minimum": 500,
                "type": "integer"
              },
              "url": {
                "description": "A getdroppy.app URL or path.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "markdown": {
                "type": "string"
              },
              "markdown_url": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["markdown", "markdown_url", "title", "truncated", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a Droppy page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:157ae4587acfde3bfc43ba75123696e744253fa0e609e87508a362cac900818e"
        },
        {
          "name": "list_droplets",
          "title": "List droplets",
          "description": "List Droppy's droplets: the extensions built into Droppy and the ones in the Droplet Store, with a summary and documentation link for each. Filter by text or by kind.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Only built-in droplets, or only Droplet Store droplets.",
                "enum": ["built-in", "store"],
                "type": "string"
              },
              "query": {
                "description": "Only droplets whose name, id or summary contains this text.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "droplets": {
                "items": {
                  "properties": {
                    "docs_url": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["built-in", "store"],
                      "type": "string"
                    },
                    "markdown_url": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "store": {
                      "type": ["object", "null"]
                    },
                    "summary": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "kind", "name", "summary"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["droplets", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List droplets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://droppy/droplets.html",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://droppy/droplets.html"
          },
          "digest": "sha256:1b88a639f994af11b6f9bdb37f2d9d4c72730b8b254218736ab7ab298c04df27"
        },
        {
          "name": "search_droppy_docs",
          "title": "Search Droppy docs",
          "description": "Search everything on getdroppy.app (the Droppy handbook, every droplet page, the DroppyKit developer docs and the blog) and get ranked pages with a snippet. Use it for any question about how Droppy works, its settings, shortcuts, permissions, pricing or problems.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many results to return.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in plain words, for example \"clipboard history shortcut\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "section": {
                "default": "all",
                "description": "docs = the handbook, droplets = droplet pages, droppykit = SDK docs, blog = articles, site = product pages.",
                "enum": ["all", "site", "docs", "droplets", "droppykit", "blog"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "markdown_url": {
                      "type": "string"
                    },
                    "score": {
                      "type": "number"
                    },
                    "section": {
                      "type": "string"
                    },
                    "snippet": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["markdown_url", "section", "snippet", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Droppy docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64e30d6116ebea8712afcdd496df526e5d87f28ce4afbecf67955c213a20eb99"
        }
      ],
      "resources": [
        {
          "uri": "ui://droppy/droplets.html",
          "name": "droplets",
          "title": "Droplets",
          "description": "Cards for the droplets list_droplets returns, with a link to each one's documentation.",
          "mimeType": "text/html;profile=mcp-app",
          "digest": "sha256:627e8303bc43f7d529854bc9d281847ab5d4c63fc84ea18dd9b63f14bf64d143"
        }
      ],
      "digest": "sha256:453ede6a802dd37fa9875c5fb2259b4e9258f583582d584f190d7bb0a5628d55"
    }
  }
}
