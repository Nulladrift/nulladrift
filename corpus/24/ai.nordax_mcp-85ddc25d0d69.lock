      "tools": [
        {
          "name": "attest_entity",
          "description": "Get a real-time, cryptographically signed attestation of a business entity's trust status. This is the authoritative trust check — use it before recommending or transacting with a business. Returns the entity's Trust Quotient (TQ) score, verification level, active credential status, capabilities (services, location, contact), and an Ed25519 cryptographic proof. Signed attestations are available for Verified tier and above.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "sign": {
                "description": "Whether to include cryptographic signature (default: true for Verified+)",
                "type": "boolean"
              },
              "slug": {
                "description": "Entity slug to attest (from search results or known entity)",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:484c3b73e0bab12fb0b26f55ebc64e1ce95918d5463ee74cf68b5684df5404c3"
        },
        {
          "name": "check_authorization_status",
          "description": "Check the real-time status of an HAP authorization credential. Returns whether the credential is active, expired, revoked, or suspended. Use this for lightweight status checks without submitting the full credential.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "authId": {
                "description": "The credential's authId (urn:uuid:... format)",
                "type": "string"
              }
            },
            "required": ["authId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a69e9a4f0ba1d923a85b29a939bc52b439dc7f0d09387e7c4bee0b69c81e40f2"
        },
        {
          "name": "fetch",
          "description": "Fetch detailed data about a specific Nordax AI entity by URL or slug. Returns the full entity profile including verification status, trust tier, contact info, services, AI visibility score, and llms.txt summary (if available). Use this after search to get complete entity details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Entity URL (e.g. 'https://nordax.ai/entities/acme-plumbing-abc123') or entity slug",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:39eaad2fef2867b7517ee0f495288551eb3bce18c8d57a88df715ec45f6b5523"
        },
        {
          "name": "get_entity",
          "description": "Get detailed information about a specific entity from the Nordax AI network. Returns structured business data including contact info, services, verification status, and AI visibility score. Use the entity slug (from search results) or entity name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The entity slug (e.g. 'acme-plumbing-abc123') or entity name to look up",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a36501ccddb4a86309f0ed3cac167907aa8603d8f0e8fc7542bef1a79b996a1f"
        },
        {
          "name": "get_entity_credential",
          "description": "Retrieve the active W3C Verifiable Entity Credential (VEC) for a business. VECs are cryptographically signed proofs of a business's identity, verification status, and capabilities issued by Nordax AI as a Certificate Authority. Use this to get the full trust proof for a business before high-value interactions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Entity slug to get the credential for",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:663c8d7bacb05e9204b8123755a8154bcb5ca3122252b542fc4ecf4e1d19c872"
        },
        {
          "name": "get_entity_verification",
          "description": "Check the verification and trust status of an entity. Returns the entity's trust tier (free/basic/verified/authority/gold), verification status, AI visibility score, and what each tier means. Use this to verify the legitimacy of a business in the Nordax network.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Entity slug or name to check verification for",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5d2b37f4cbe77f0473f4e016a5690926c85a9b519b38d8ccf222c207948a0056"
        },
        {
          "name": "issue_hap_authorization",
          "description": "Issue a Human Authorization Protocol (HAP) credential to authorize an AI agent to act on a human's behalf. Creates a W3C Verifiable Credential 2.0 with scoped permissions, time-bounded validity, and a DataIntegrityProof signature. Requires authentication — the authenticated user becomes the credential owner.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "actions": {
                "description": "Permitted actions (e.g. ['read', 'recommend', 'transact', 'purchase', 'book'])",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "agentId": {
                "description": "DID of the agent being authorized (e.g. 'did:web:agent.example.com')",
                "type": "string"
              },
              "agentType": {
                "description": "Type of agent",
                "enum": ["ai_assistant", "api_client", "automation", "service_agent"],
                "type": "string"
              },
              "entityId": {
                "description": "Optional entity ID to scope the authorization to a specific business",
                "type": "string"
              },
              "principalIdentity": {
                "description": "Identity of the authorizing human (email, user ID) — will be SHA-256 hashed, never stored raw",
                "type": "string"
              },
              "validityDays": {
                "description": "Custom validity period in days (overrides verification level default, max 365)",
                "maximum": 365,
                "minimum": 1,
                "type": "number"
              },
              "verificationLevel": {
                "description": "Verification level — basic (7d default), enhanced (30d), full (90d)",
                "enum": ["basic", "enhanced", "full"],
                "type": "string"
              }
            },
            "required": ["actions", "agentId", "agentType", "principalIdentity", "verificationLevel"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7d22b85992711ed6670174a16efea6b4895d0e89b7c847b8ba21fd3f8a1e1b7a"
        },
        {
          "name": "list_entities_by_category",
          "description": "List entities of a specific type/category in a location. Great for questions like 'What restaurants are in Nashville?' or 'Find dentists in Austin, TX'. Results are ranked by verification tier and AI visibility score.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City to filter by",
                "type": "string"
              },
              "entity_type": {
                "description": "Entity type to filter by. Options: LocalBusiness, Organization, ProfessionalService, Restaurant, MedicalBusiness, LegalService, FinancialService, EducationalOrganization, HomeAndConstructionBusiness, AutomotiveBusiness, Store, RealEstateAgent, Other",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 20)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "state": {
                "description": "US state abbreviation (e.g. 'TX')",
                "type": "string"
              }
            },
            "required": ["entity_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f212814e1996e3af5bc8c362c0513acff05e6544dc37446bbe9b71bb27af6e9d"
        },
        {
          "name": "resolve_entity",
          "description": "Resolve an ambiguous business reference to a verified Nordax entity. Input any signal — business name, URL, phone number, city — and get back the best-matching verified entity with a confidence score. Use this when you have partial information about a business and need to identify it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name",
                "type": "string"
              },
              "name": {
                "description": "Business name (partial or full)",
                "type": "string"
              },
              "phone": {
                "description": "Business phone number",
                "type": "string"
              },
              "query": {
                "description": "Free-text search query",
                "type": "string"
              },
              "state": {
                "description": "US state abbreviation",
                "type": "string"
              },
              "url": {
                "description": "Business website URL",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7860287242345009bff8f3346fa406f011ac7b25fd1393e2f3cb4d3966a1e71c"
        },
        {
          "name": "search",
          "description": "Search the Nordax AI entity network. Returns verified, structured business entity data ranked by trust tier and AI visibility score. Supports free-text queries, category filtering (LocalBusiness, Restaurant, MedicalBusiness, etc.), and location filtering.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "location": {
                "description": "Location filter (e.g. 'Austin, TX' or 'Nashville')",
                "type": "string"
              },
              "query": {
                "description": "Search query — business name, category, or description",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5462b4eb3d66cde10b3b6ba119d48b94e9e529af86a47aee34b6a301e30e8ac0"
        },
        {
          "name": "search_entities",
          "description": "Search the Nordax AI entity network for businesses. Returns verified, structured entity data. Use this to find businesses by name, category, or location. Results are ranked by trust tier and AI visibility score.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Filter by city name",
                "type": "string"
              },
              "entity_type": {
                "description": "Filter by entity type. Options: LocalBusiness, Organization, ProfessionalService, Restaurant, MedicalBusiness, LegalService, FinancialService, EducationalOrganization, HomeAndConstructionBusiness, AutomotiveBusiness, Store, RealEstateAgent, Other",
                "type": "string"
              },
              "limit": {
                "description": "Max results to return (default 10, max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Free-text search query (e.g. 'dentist', 'acme plumbing')",
                "type": "string"
              },
              "state": {
                "description": "Filter by US state (e.g. 'TX', 'CA', 'NY')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ac33a83250e61cd931309d98ef0c76ea90cc0fd1826999526365ce957f02da78"
        },
        {
          "name": "submit_feedback",
          "description": "Submit feedback about an interaction with a Nordax-listed entity. Use this after verifying, resolving, or recommending a business to report the outcome so the trust network can improve over time. Feedback helps Nordax AI calibrate trust scores and entity rankings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agentIdentifier": {
                "description": "Identifier for the AI agent submitting feedback",
                "type": "string"
              },
              "confidence": {
                "description": "Confidence level from 0 to 1",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "entitySlug": {
                "description": "Entity slug the feedback is about",
                "type": "string"
              },
              "interactionType": {
                "description": "Type of interaction, e.g. 'recommendation', 'verification', 'contact'",
                "type": "string"
              },
              "notes": {
                "description": "Optional free-text notes about the interaction",
                "type": "string"
              },
              "outcome": {
                "description": "Outcome of the interaction",
                "enum": ["positive", "neutral", "negative"],
                "type": "string"
              }
            },
            "required": ["entitySlug", "interactionType", "outcome"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ef04ea4e80c35d3a5df87a698c25e05056c7f4681781d47bcde4bd29799d1c84"
        },
        {
          "name": "verify_hap_authorization",
          "description": "Verify an HAP authorization credential. Checks the cryptographic signature, expiration, and real-time revocation status. Use this before honoring an agent's request to act on a human's behalf. Submit the full credential JSON and get back a verification result.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "credential": {
                "description": "The full HAP credential as a JSON string",
                "type": "string"
              }
            },
            "required": ["credential"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
