{
  "lockfileVersion": 2,
  "subjects": {
    "com.bot2botlabs/warranty-desk": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://warranty.bot2botlabs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "warranty-desk",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call check_warranty with a brand (and optional product, category, purchase_date). Warranty lengths are never invented: coverage.months is null with confidence unknown when the brand's page does not state it.",
      "tools": [
        {
          "name": "check_warranty",
          "description": "Look up a brand's standard manufacturer warranty for the US: coverage length (only when the brand's page states it), what it excludes, and where to claim. Optional purchase_date places the term on a calendar. Mints a public TRACE receipt. Not store return windows.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "YYYY-MM-DD; default today",
                "type": "string"
              },
              "brand": {
                "description": "Brand name, e.g. Apple, Samsung, Nike",
                "type": "string"
              },
              "category": {
                "description": "Free text category, e.g. phone, tv, laptop",
                "type": "string"
              },
              "product": {
                "description": "Free text product, e.g. iPhone 15 Pro",
                "type": "string"
              },
              "purchase_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "region": {
                "default": "US",
                "description": "Only US in v0",
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c1739874a5c9906c42f48bf7ed3538d499f4630568e05696b31005874975426a"
        },
        {
          "name": "get_warranty_receipt",
          "description": "Fetch a public Warranty Desk TRACE receipt by id (wdr_...).",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8f244e3278083238b4aada78e7a43aea76233a71a6e889416029b22286a99e9d"
        }
      ],
      "digest": "sha256:71349d3575f52204b2d714881c8e44b0456adad89231a8d624ee4c205294c48c"
    }
  }
}
