          "title": "Check a ZIP code",
          "description": "Is a US ZIP code inside the Reno service area? Returns yes/no and the nearest served town.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "zip": {
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
