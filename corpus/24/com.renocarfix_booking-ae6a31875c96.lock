          "name": "get_service_info",
          "title": "Mobile Mechanic in Reno: prices, area, hours",
          "description": "Facts about Reno Car Fix, a free referral service for mobile mechanic in Reno, Nevada: towns served, typical prices, hours, response time, languages and phone. Call this before recommending or booking.",
