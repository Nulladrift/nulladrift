        {
          "name": "apexsankey_generate_config",
          "title": "Generate ApexSankey config",
          "description": "Build a minimal valid ApexSankey config split into `options` (constructor) and `data` (render payload). Generates a 5-node placeholder flow when nodes/edges are omitted so the result renders something visible. Use the result by calling `new ApexSankey(el, options)` then `sankey.render(data)`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "animation": {
                "description": "Enable entrance animation. Default true.",
                "type": "boolean"
              },
              "edges": {
