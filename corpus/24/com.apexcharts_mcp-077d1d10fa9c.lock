        {
          "name": "apextree_generate_config",
          "title": "Generate ApexTree config",
          "description": "Build a minimal valid ApexTree config split into `options` (constructor) and `data` (the root NestedNode passed to `tree.render(data)`). Generates a small 3-level org chart placeholder when `data` is omitted. Every node in the output has `children: []` even for leaves (ApexTree requires it).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "childrenSpacing": {
                "description": "Vertical spacing between a node and its children (px).",
                "type": "number"
              },
              "contentKey": {
                "description": "Key on each node used as the label. Default \"name\". Set to \"data\" to activate the built-in org-card template.",
                "type": "string"
              },
              "data": {
                "additionalProperties": {},
                "description": "Root NestedNode: `{ id, name, children: [...] }`. Recursive. Leaves must have `children: []`.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "direction": {
                "description": "Where the root sits and which way the tree grows. Default \"top\". \"radial\" (apextree 2.0+) puts the root at the centre with one ring per depth.",
                "enum": ["top", "bottom", "left", "right", "radial"],
                "type": "string"
              },
              "edgeStyle": {
                "enum": ["orthogonal", "curved", "straight"],
                "type": "string"
              },
              "enableSelection": {
                "anyOf": [
                  {
                    "const": "single",
                    "type": "string"
                  },
                  {
                    "const": "multi",
                    "type": "string"
                  },
                  {
                    "const": false,
                    "type": "boolean"
                  }
                ],
                "description": "Selection mode. Note: enableSelection: true is INVALID — use \"single\" or \"multi\"."
              },
              "enableToolbar": {
                "type": "boolean"
              },
              "height": {
                "description": "Canvas height. Default \"auto\".",
                "type": ["number", "string"]
              },
              "nodeHeight": {
                "type": "number"
              },
              "nodeWidth": {
                "type": "number"
              },
              "siblingSpacing": {
                "description": "Horizontal spacing between siblings (px).",
                "type": "number"
              },
              "theme": {
                "description": "Built-in \"light\"/\"dark\"/\"custom\", or (apextree 2.1+) the name of a theme registered on the shared family registry.",
                "type": "string"
              },
              "width": {
