        {
          "name": "apexmaps_generate_config",
          "title": "Generate ApexMaps config",
          "description": "Build a minimal valid ApexMaps options object for a geographic visualization. Supports the seven series types: choropleth (default), bubble, marker, arc, line, hexbin, pixel. Geometry comes from the built-in registry (e.g. \"world/countries\", \"us\", \"eu/nuts2\"), so no GeoJSON is needed. Generates a small placeholder dataset when data is omitted. Use the result with `new ApexMaps(el, options)` then `await map.render()`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "data": {
                "description": "Data array in the datum shape of `type`: choropleth and pixel rows `{ <key>, value }`, bubble/marker `{ lon, lat, ... }`, arc `{ from, to }`, line `{ path: [[lon,lat],...] }`, hexbin `{ lon, lat, value? }`. Omit for a placeholder dataset.",
                "items": {},
                "type": "array"
              },
              "joinBy": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "additionalItems": false,
                    "items": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "string"
                      }
                    ],
                    "maxItems": 2,
                    "minItems": 2,
                    "type": "array"
                  },
                  {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                ],
                "description": "Join spec: \"field\", [\"geoField\", \"dataField\"], or { geo, data }. Omit to use key auto-detection (the placeholder emits [\"iso_a3\", \"code\"])."
              },
              "map": {
                "description": "Geometry registry pack id or alias: \"world/countries\", \"us\", \"us/counties\", \"eu/nuts2\", \"jp/prefectures\", ... Default \"world/countries\".",
                "type": "string"
              },
              "palette": {
                "description": "Palette name for the value scale (e.g. \"blues\", \"viridis\", \"okabeIto\").",
                "type": "string"
              },
              "projection": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                ],
                "description": "Projection name or spec object. Omit to use the pack default (recommended: packs like \"us\" already pick albersUsa)."
              },
              "seriesName": {
                "description": "Series display name (legend / tooltip).",
                "type": "string"
              },
              "themeMode": {
                "description": "Theme mode. Omit to leave theme out of the config, so the library default applies and an Ignite UI add-on can pick its own light or dark variant.",
                "enum": ["light", "dark", "auto"],
                "type": "string"
              },
              "type": {
                "description": "Series type. Default \"choropleth\". \"hexbin\" bins points into a hex lattice (density); it takes points, never region-keyed rows. \"pixel\" is a choropleth drawn as a lattice of dots: the same region-keyed rows, join and scale.",
                "enum": ["choropleth", "bubble", "marker", "arc", "line", "hexbin", "pixel"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
