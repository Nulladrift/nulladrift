        {
          "name": "apexgantt_generate_config",
          "title": "Generate ApexGantt config",
          "description": "Build a minimal valid ApexGantt options object. Generates a placeholder schedule (phases, dependencies, a milestone) when `tasks` is omitted, so the result can be rendered as-is. The placeholder dates are emitted in whatever `inputDateFormat` is chosen, so they parse without further work.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "baseline": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "additionalProperties": true,
                    "properties": {
                      "color": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                ],
                "description": "Enable planned-vs-actual baseline track. Tasks must supply a per-task `baseline: { start, end }`."
              },
              "enableCriticalPath": {
                "description": "Highlight the longest dependency chain on render.",
                "type": "boolean"
              },
              "enableSelection": {
                "description": "Enable `getSelectedTasks()` / `setSelectedTasks()` / `selectionChange` event.",
                "type": "boolean"
              },
              "height": {
                "description": "Chart height in px, emitted as the top-level `height` option (default 600 here; the library default is 500px).",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "inputDateFormat": {
                "description": "dayjs format for parsing date strings. Default is ApexGantt's own default \"MM-DD-YYYY\". Common alternatives: \"YYYY-MM-DD\", \"DD/MM/YYYY\".",
                "type": "string"
              },
              "tasks": {
                "description": "Task array (`series`). Each task: { id, name, startTime, endTime?, progress?, type?, parentId?, dependency? }. Give single-date markers `type: \"milestone\"` (3.19 and earlier throw on a missing endTime otherwise).",
                "items": {},
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Generate ApexGantt config"
