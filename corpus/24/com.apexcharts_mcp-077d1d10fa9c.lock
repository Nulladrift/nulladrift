        {
          "name": "apexcharts_generate_config",
          "title": "Generate ApexCharts config",
          "description": "Build a minimal valid ApexCharts options object for a given chart type. Picks the correct series data format (axis vs non-axis) and supplies placeholder data when none is given. Use this as the starting point for a chart. Since apexcharts 8.0 the Tier 2 types (waterfall, dumbbell, streamgraph, raincloud, violin, icicle, sunburst, unit, waffle) are outside the default bundle: the page also needs that type's add-on import next to 'apexcharts', or `import ApexCharts from 'apexcharts/full'`; apexcharts_list_types names the import per type.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "categories": {
                "description": "xaxis categories (axis charts) or labels (pie/donut/etc).",
                "items": {
                  "type": "string"
                },
                "maxItems": 10000,
                "type": "array"
              },
              "height": {
                "description": "Chart height in px (default 350).",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "horizontal": {
                "description": "Render bars horizontally. Honored only for bar and dumbbell (column is vertical by definition).",
                "type": "boolean"
              },
              "series": {
                "description": "Optional series data in the format required by the chart type.",
                "items": {},
                "type": "array"
              },
              "stacked": {
                "description": "Stack series. Honored only for bar, column, area and line chart types.",
                "type": "boolean"
              },
              "title": {
                "description": "Optional chart title.",
                "type": "string"
              },
              "type": {
                "description": "ApexCharts chart.type value (e.g. \"line\", \"bar\", \"pie\").",
                "enum": ["line", "area", "bar", "column", "scatter", "bubble", "rangeArea", "rangeBar", "funnel", "pyramid", "waterfall", "dumbbell", "streamgraph", "raincloud", "histogram", "candlestick", "boxPlot", "violin", "heatmap", "treemap", "icicle", "radar", "pie", "donut", "polarArea", "radialBar", "gauge", "sunburst", "unit", "waffle"],
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
