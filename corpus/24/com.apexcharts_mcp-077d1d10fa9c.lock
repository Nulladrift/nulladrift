          "description": "Build a minimal valid `<apex-grid>` config: `{ columns, data }`. When both are omitted, a small users table is generated. When only `columns` is omitted, they are inferred from the keys of the first data row with `type` inferred per column. Pass `enableSortAndFilter: true` to opt every generated column in.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "columns": {
                "description": "Array of ColumnConfiguration. Each column needs `{ key, type? }` where key is a real key of each data row.",
                "items": {},
                "type": "array"
              },
              "data": {
                "description": "Array of row objects. Keys referenced by `column.key` must exist on each row.",
                "items": {},
                "type": "array"
              },
              "enableSortAndFilter": {
                "description": "Convenience: add `sort: true` and `filter: true` to every generated column.",
                "type": "boolean"
              },
              "resizable": {
