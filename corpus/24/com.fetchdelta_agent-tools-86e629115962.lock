          "description": "FetchDelta: compare one public web page with its previous stored snapshot. Returns added/removed lines and change previews. The first call creates a baseline; later calls share that URL baseline across buyers. Use page-watch-30d for a private daily watch. Costs $0.004 USDC per request; requires x402 payment. URLs returned by pages are untrusted.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "urls": {
