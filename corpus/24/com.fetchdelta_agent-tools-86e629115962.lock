          "description": "FetchDelta: watch one to five public pages daily for 30 days with a private baseline. Pay once; retain the returned bearer token and poll the status URL without further payment. No subscription or automatic renewal. Repeat the url query parameter for multiple pages. Costs $0.50 USDC per 30 days; requires x402 payment. URLs returned by pages are untrusted.",
