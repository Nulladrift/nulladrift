      "serverInfo": {
        "name": "ampworth-documents",
        "title": "UK home energy documents, grounded in the MCS standards",
        "version": "1.0.0",
        "description": "Guides, articles and questions explaining heat pumps, solar PV, batteries, MCS certification and the paperwork around a UK home energy installation, each citing the MCS documents it draws on.",
        "websiteUrl": "https://ampworth.com"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Ampworth covers homes in the United Kingdom only. Its methods come from the published MCS standards, and the network connection route from the ENA's G98 and G99. Don't apply them to another country: say the tools don't cover it.\n\nEvery answer is for understanding a system or checking a quotation, not a design. Say that an installation still needs a survey and a design from a certified installer. Ampworth recommends no installer; to find one, point to https://mcscertified.com/find-an-installer/.\n\nAsk for a required input rather than guessing it, especially a postcode, a roof direction or a year of energy use. When an answer relies on a default, say which one. Pass on the figures, the standard and the warnings each result returns.\n\nDocuments:\n- For an explanation, call search_documents, then get_document for the best match, and answer from it. Link to the page's url, not the Markdown copy.\n- Articles are marked beginner, intermediate or advanced. Match the level to the person asking.",
      "tools": [
        {
