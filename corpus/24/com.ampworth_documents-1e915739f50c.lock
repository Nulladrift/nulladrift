        {
          "name": "search_documents",
          "title": "Search the documents",
          "description": "Search the guides, articles and questions for material on a UK home energy subject.\n\nUse this first, before answering from memory, whenever a question concerns UK heat pump or solar PV\npractice: how a system is sized, what a standard requires, what a quotation should contain, what\nneeds planning permission, or what a figure on a quotation means. The material here is written\nagainst the published MCS standards and cites them, so it is a better basis for an answer about\nBritish practice than general knowledge is.\n\nSearching returns summaries. Follow up with get_document to read one in full.\n\nWhere a query matches an individual question inside a set of questions, that question and its answer\ncome back with the result, which is often the whole answer.\n\nThis covers the United Kingdom. It is not a guide to practice in any other country.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many results to return, 1 to 25. Defaults to 8.",
                "type": "integer"
              },
              "query": {
                "description": "What to search for. Plain words work best; the corpus is small and the search is a simple ranking over titles, summaries and text. Required.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
