          "title": "Read one document in full",
          "description": "Fetch the full text of one guide, article or set of questions by its slug, as Markdown, not\nHTML. Slugs come from search_documents or list_documents.\n\nThe answer carries the MCS documents the text draws on, and the ids of any calculators on this site\nthat do the arithmetic the text describes. Where the document is a set of questions, each question and\nanswer comes back separately.\n\nCite the MCS document, not this site, when the point being made is a requirement of a standard.",
