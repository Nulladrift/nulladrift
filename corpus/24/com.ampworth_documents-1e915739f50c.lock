        {
          "name": "list_documents",
          "title": "List what the documents cover",
          "description": "Lists every document, optionally filtered by kind ('guide', 'article' or 'faq'), by category, or, for guides, by the reader they are written for. Guides are shelved by perspective: 'considering', 'buying', 'selling', 'installing' and 'learning'. The first four are plain language and name no standards; 'learning' carries the methods and the citations. Match the perspective to the person asking. Use this to see the shape of what is covered before searching, or when a search returned nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Filter by category: 'heat-pumps', 'solar-pv', 'batteries', 'standards' or 'paperwork'. Optional.",
                "type": "string"
              },
              "kind": {
                "description": "Filter by kind: 'guide', 'article' or 'faq'. Optional.",
                "type": "string"
              },
              "level": {
                "description": "Articles only. Filter by how much the piece assumes: 'beginner', 'intermediate' or 'advanced'. Use it to match the person asking, so somebody new is not sent to an advanced piece.",
                "type": "string"
              },
              "perspective": {
                "description": "Guides only. Filter by who the guide is written for: 'considering' (still deciding), 'buying' (about to commit), 'selling' (sells these systems), 'installing' (fits them) or 'learning' (wants the technical detail). Use this to match the reader: the first four are plain language and name no standards, the fifth carries the methods and citations.",
                "type": "string"
              }
            },
            "type": "object"
