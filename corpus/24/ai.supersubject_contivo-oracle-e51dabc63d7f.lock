      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "contivo-oracle",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "cast_hexagram",
          "description": "Cast a hexagram for an I-Ching consultation. Returns the primary hexagram, the six lines (6=old yin, 7=young yang, 8=young yin, 9=old yang from bottom to top), any moving lines, and the changing hexagram if there are moving lines. Pass `seed` to make the cast deterministic (useful for testing or for reproducing a reading).",
          "inputSchema": {
            "properties": {
              "method": {
                "default": "coins",
                "description": "coins = three-coin toss (most common); yarrow = traditional 50-stalk probabilities; random = uniformly pick one of the 64 hexagrams with no moving lines.",
                "enum": ["coins", "yarrow", "random"],
                "type": "string"
              },
              "question": {
                "description": "The question being asked (not used for casting, returned in result for context).",
                "type": "string"
              },
              "seed": {
                "description": "Optional seed for deterministic casting.",
                "type": ["string", "number"]
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:18470a072017b97d851c9de6d1ed8bfd2d5eceb19c11673fbfe5fe77856e141d"
        },
        {
          "name": "cast_tarot",
          "description": "Draw one upright Major Arcana card for reflection. Uses a deterministic one-card Waite-Smith Major Arcana method and returns a selected source excerpt from Arthur Edward Waite's public-domain 1910/1922 text. Pass `seed` to reproduce the same draw.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "The question being reflected on (not used to influence the draw).",
                "type": "string"
              },
              "seed": {
                "description": "Optional deterministic draw seed.",
                "type": ["string", "number"]
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:138edcb33bb52018716eab1ff7b8483d8a60c1ac1348709d3bfbcf9e422ba75e"
        },
        {
          "name": "divine",
          "description": "Ask the I Ching. See your next step. Cast a hexagram, show the classical sources first, then offer a thoughtful reflection grounded in those sources. Sources first. Reflection, not prediction. The divine name remains stable for oracle/divination client compatibility. Supports English, Chinese, Japanese, Korean, Spanish, French, German, Portuguese, Italian, Russian, Arabic, Hindi, Indonesian, and English+Chinese bilingual output. Daily quota: 30 completed readings per device_id (or per anonymous IP if no device_id is supplied); timeout, provider failure, incomplete response, and cancellation do not consume it.",
          "inputSchema": {
            "properties": {
              "device_id": {
                "description": "Optional opaque identifier for quota tracking. If omitted, IP-derived.",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "enum": ["en", "zh", "zh-Hant", "ja", "ko", "es", "fr", "de", "pt", "it", "ru", "ar", "hi", "id", "bilingual"],
                "type": "string"
              },
              "method": {
                "default": "coins",
                "enum": ["coins", "yarrow", "random"],
                "type": "string"
              },
              "question": {
                "description": "The question to consult on.",
                "type": "string"
              },
              "seed": {
                "description": "Deterministic cast seed.",
                "type": ["string", "number"]
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f880b435fff193484bc1e6937a64211fe2acbe0aa0b0a3fb0030f69f2424cc04"
        },
        {
          "name": "lookup_hexagram",
          "description": "Return the full classical sources for a hexagram by its number (1–64): judgment (卦辞), image (大象), Tuan commentary, Zhu Xi 周易本义, Yang Tian Cai modern explanation, Contivo Oracle's separately labelled Chinese reading aid, and historical anecdote — with available Chinese and English source material.",
          "inputSchema": {
            "properties": {
              "compact": {
                "default": false,
                "description": "If true, omit authorities (long classical commentary). Returns only structural fields.",
                "type": "boolean"
              },
              "locale": {
                "default": "both",
                "enum": ["en", "zh", "both"],
                "type": "string"
              },
              "number": {
                "description": "Hexagram number 1-64 in King Wen sequence.",
                "maximum": 64,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6688a6242c3e58626f8f28b04ad725d267e6bb703dd60128392053e4c831f2dd"
        },
        {
          "name": "lookup_yilin",
          "description": "Look up the 焦氏易林 verse for a primary hexagram changing into another hexagram. This is a local classical-source lookup, not an AI reading.",
          "inputSchema": {
            "properties": {
              "changing_number": {
                "description": "Changing hexagram number 1-64.",
                "maximum": 64,
                "minimum": 1,
                "type": "integer"
              },
              "primary_number": {
                "description": "Primary hexagram number 1-64.",
                "maximum": 64,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["changing_number", "primary_number"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b4787506eab8334a9d92d19840c3b8ff8ebb1912e57c87ddddf7b348fd140644"
        },
        {
          "name": "tarot_reading",
          "description": "Ask one real question through a single upright Waite-Smith Major Arcana card. Returns a direct calibrated answer first, the named card and bound Arthur Edward Waite 1910 source excerpt, a practical reality check, and one observable next step. No reversals, astrology, redraw loop, or guaranteed prediction. Daily quota is shared with completed divine and Two Lenses readings.",
          "inputSchema": {
            "properties": {
              "device_id": {
                "description": "Optional opaque identifier for quota tracking. If omitted, IP-derived.",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "enum": ["en", "zh", "zh-Hant", "ja", "ko", "es", "fr", "de", "pt", "it", "ru", "ar", "hi", "id", "bilingual"],
                "type": "string"
              },
              "question": {
                "description": "The real question to reflect on.",
                "type": "string"
              },
              "seed": {
                "description": "Deterministic Tarot draw seed.",
                "type": ["string", "number"]
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c53c2c06e4c363f52637acef3cc77d21eb59d232d2ffaa6359c98c388eac1e6c"
        },
        {
          "name": "two_lenses",
          "description": "Bring one real question to two independent symbolic traditions: a source-first I-Ching cast and one upright Waite-Smith Major Arcana card. Returns a clear calibrated answer first, then five grounded sections covering the I Ching lens, Tarot lens, shared themes, different emphasis, and next step. Direction without guaranteed prediction or mutual-confirmation claims. Daily quota is shared with completed divine readings.",
          "inputSchema": {
            "properties": {
              "device_id": {
                "description": "Optional opaque identifier for quota tracking. If omitted, IP-derived.",
                "type": "string"
              },
              "iching_seed": {
                "description": "Deterministic I-Ching cast seed.",
                "type": ["string", "number"]
              },
              "locale": {
                "default": "en",
                "enum": ["en", "zh", "zh-Hant", "ja", "ko", "es", "fr", "de", "pt", "it", "ru", "ar", "hi", "id", "bilingual"],
                "type": "string"
              },
              "method": {
                "default": "coins",
                "enum": ["coins", "yarrow", "random"],
                "type": "string"
              },
              "question": {
                "description": "The same real question for both lenses.",
                "type": "string"
              },
              "tarot_seed": {
                "description": "Deterministic Tarot draw seed.",
                "type": ["string", "number"]
              }
            },
            "required": ["question"],
            "type": "object"
