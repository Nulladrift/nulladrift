                        },
                        "kind": {
                          "enum": ["document"],
                          "type": "string"
                        }
                      },
                      "required": ["document_id", "kind"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              },
              "note": {
                "anyOf": [
                  {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "request_id": {
                "type": "string"
              }
            },
            "required": ["compliance_case_id", "materials", "request_id"],
            "type": "object"
          },
          "annotations": {
