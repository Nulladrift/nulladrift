        {
          "name": "add_compliance_material",
          "title": "Add compliance material",
          "description": "Add compliance material. Add text or completed documents in materials to an accepted or in-progress compliance_case_id using request_id and optional note (up to 2000 characters); returns done without charging credits.\n补充合规材料。用 request_id、compliance_case_id、materials 及可选 note（最多2000字）补充已受理或办理中的文字、已上传文件；返回 done，不扣额度。",
          "inputSchema": {
            "properties": {
              "compliance_case_id": {
                "type": "string"
              },
              "materials": {
                "items": {
                  "anyOf": [
                    {
                      "properties": {
