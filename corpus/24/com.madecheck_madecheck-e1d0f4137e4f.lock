      "instructions": "MadeCheck provides two free, rate-limited tools: estimate_landed_cost and list_import_requirements. For the other tools, get a key at https://madecheck.com. Pay only on the website.\n\nMadeCheck 提供到岸成本估算和品类合规门槛两项免费、限次功能。其余功能请到 https://madecheck.com 拿钥匙；钱只在网页上付。",
      "tools": [
        {
          "name": "accept_compliance_quote",
          "title": "Accept compliance quote",
          "description": "Accept compliance quote. Accept the compliance_case_id for free using request_id; returns completion state, zero charged_cents and any free-file queue notice. File preparation is free; new requests share a limit of three per email in 30 days and 20 starts per UTC day, with extras queued.\n接受报价。用 compliance_case_id、request_id 免费受理补齐包；返回受理状态、charged_cents=0 和排队提示。文件免费；新单同邮箱30天最多开始3单，全站UTC日最多开始20单，超额排队。",
          "inputSchema": {
            "properties": {
              "compliance_case_id": {
                "type": "string"
              },
              "request_id": {
                "type": "string"
              },
              "source_tag": {
                "anyOf": [
                  {
                    "type": "string"
