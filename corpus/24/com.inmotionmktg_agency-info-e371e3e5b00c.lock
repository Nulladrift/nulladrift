            "readOnly": true
          },
          "digest": "sha256:6fa48c4bcd2a323b3bb84320a8269a94808a07b657b7b7b99a273da2acf4668d"
        },
        {
          "name": "list_services",
          "title": "List services",
          "description": "List every service In Motion Marketing offers (SEO, paid ads, content, HubSpot, RevOps, web design, graphic design, app development and their sub-services) with a one-line summary and the URL of each page, as Markdown. Use to check whether the agency does a specific kind of B2B marketing work.",
          "inputSchema": {
            "properties": {},
