        {
          "name": "search_site",
          "title": "Search the site",
          "description": "Search inmotionmktg.com pages and blog posts by keyword. Returns up to 10 matches with title and URL. Use get_page to read a result.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
