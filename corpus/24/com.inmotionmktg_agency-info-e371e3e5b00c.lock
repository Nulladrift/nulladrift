      "serverInfo": {
        "name": "com.inmotionmktg/agency-info",
        "title": "In Motion Marketing",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only information about In Motion Marketing, a B2B marketing agency (SEO, paid ads, content, HubSpot, web design, app development and more). Use list_services to see what the agency offers, get_pricing for plans and prices, list_case_studies for client results, search_site to find pages or blog posts, get_page to read any page as Markdown, and get_strategy_call_link when the user wants to talk to the agency. Nothing here books, buys or changes anything.",
      "tools": [
        {
          "name": "get_page",
          "title": "Read a page",
          "description": "Read one page of inmotionmktg.com as Markdown, given its path (for example /seo-agency/, /blog/cold-email-best-practices/ or /about/). Use after list_services or search_site to get the full details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "path": {
                "description": "Path on inmotionmktg.com, starting with /",
                "maxLength": 200,
                "pattern": "^\\/[a-z0-9\\-\\/]*$",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e410f196b3f6e54054ab531e2f12d07c7ed0d84351fbd7ad63c2a24436da2283"
        },
        {
          "name": "get_pricing",
          "title": "Get pricing",
          "description": "Get In Motion Marketing's current plans and prices (Advisory, Growth and Scale) in USD as Markdown, with what each plan includes, the terms and who each plan fits. Use when a user asks what the agency costs or which plan suits them.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c9fa77ead864ed3b120c705c04013c87c5c0590d35a39caeebf7194210115f6b"
        },
        {
          "name": "get_strategy_call_link",
          "title": "Get the strategy call link",
          "description": "Get the link to book a free 20-minute strategy call with In Motion Marketing. Use when a user wants to talk to the agency, get a quote or start a project. Returns a URL the user opens to pick a time; this tool books nothing.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e02772a69efd54ac27c4c660f51c72adae1a443032121a6d1415a459a6ed4c56"
        },
        {
          "name": "list_case_studies",
          "title": "List case studies",
          "description": "List In Motion Marketing's published client results and case studies as Markdown, with the client, the work and the outcome, and links to each case study. Use when a user asks for proof, examples or results.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
