        {
          "name": "post_review_merge",
          "title": "Post review merge",
          "description": "Merge staged rows into one pending row: N same-pair trades (split fills of one order, e.g. a TWAP) or one outgoing + one incoming one-sided leg\n\nTwo shapes. (1) Every leg is a pending staged two-legged trade (row_type 'transaction') with the same from/to asset ids and kind: any number (>= 2) fold into one pending trade; amounts and values sum (value is null if any fill has none), tx_date is the latest fill's, note is the first non-empty one. (2) Exactly two one-sided legs, one outgoing (-) and one incoming (+), at least one staged: same ticker becomes a transfer (basis carries over), else a swap. Merged staged rows get status 'merged' and cannot be restored. The result stays pending: confirm it with /api/review/confirm. Returns {id, kind} plus combined (row count) for shape 1. (POST /api/review/merge)",
          "inputSchema": {
            "properties": {
              "legs": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "source": {
                      "description": "'staged' = a review-queue row; 'adjustment' = a live position adjustment (shape 2 only)",
                      "enum": ["staged", "adjustment"],
                      "type": "string"
                    }
                  },
                  "required": ["id", "source"],
                  "type": "object"
                },
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["legs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false,
            "title": "Post review merge"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3115dc247dc1e581c37781273b0ce48afdd2c28a9ce85d966b8ce44c86e7621a"
        },
