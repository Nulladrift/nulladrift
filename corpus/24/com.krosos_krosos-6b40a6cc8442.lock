        {
          "name": "log_trade",
          "description": "Log a trade (buy / sell / swap), expressed as from-asset to to-asset. Same body and validation as POST /api/transactions.",
          "inputSchema": {
            "properties": {
              "allow_new_values": {
                "description": "Create accounts/providers/tickers not yet in reference-data. Default false.",
                "type": "boolean"
              },
              "description": {
                "type": "string"
              },
              "from_account": {
                "type": "string"
              },
              "from_amount": {
                "example": 1000,
                "type": "number"
              },
              "from_asset": {
                "type": "string"
              },
              "from_category": {
                "type": "string"
              },
              "from_description": {
                "type": "string"
              },
              "from_provider": {
                "type": "string"
              },
              "from_risk": {
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "from_ticker": {
                "type": "string"
              },
              "overall_eur_value": {
                "description": "The trade's total value in the ledger's base currency (the field name is historical: EUR was the only base)",
                "example": 1000,
                "type": "number"
              },
              "to_account": {
                "type": "string"
              },
              "to_amount": {
                "example": 8.5,
                "type": "number"
              },
              "to_asset": {
                "type": "string"
              },
              "to_category": {
                "type": "string"
              },
              "to_description": {
                "type": "string"
              },
              "to_provider": {
                "type": "string"
              },
              "to_risk": {
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "to_ticker": {
                "type": "string"
              },
              "tx_date": {
                "description": "Today or tomorrow at the latest (the user's own calendar day); later dates are rejected",
                "example": "2026-06-17",
                "format": "date",
                "type": "string"
              },
              "tx_time": {
                "description": "Optional HH:MM on the user's own clock; orders rows within the same day. Omitted: an edit keeps the stored time, a new row takes the current time",
                "example": "14:30",
                "type": "string"
              }
            },
            "required": ["from_account", "from_amount", "from_asset", "from_provider", "from_ticker", "overall_eur_value", "to_account", "to_amount", "to_asset", "to_provider", "to_ticker", "tx_date"],
            "type": "object"
