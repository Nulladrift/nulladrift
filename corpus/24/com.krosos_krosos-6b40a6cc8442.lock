            "readOnlyHint": false,
            "title": "Sync connections"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:36dee0410f3f03c37d9d570054f20c66d943588f32e663826e8fa4f56948b7d6"
        }
      ],
