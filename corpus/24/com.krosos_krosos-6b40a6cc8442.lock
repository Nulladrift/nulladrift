        {
          "name": "log_trade",
          "title": "Log trade",
          "description": "Log a trade (buy / sell / swap), expressed as from-asset to to-asset. Same body and validation as POST /api/transactions.",
          "inputSchema": {
            "properties": {
              "allow_new_values": {
                "description": "Create accounts/providers/tickers not yet in reference-data. Default false.",
                "type": "boolean"
              },
              "description": {
                "type": "string"
              },
              "from_account": {
                "type": "string"
              },
              "from_amount": {
                "example": 1000,
                "type": "number"
              },
              "from_asset": {
                "type": "string"
              },
              "from_category": {
                "type": "string"
              },
              "from_description": {
                "type": "string"
              },
              "from_provider": {
                "type": "string"
              },
              "from_risk": {
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "from_ticker": {
                "type": "string"
              },
              "overall_eur_value": {
                "description": "The trade's total value in the ledger's base currency (the field name is historical: EUR was the only base)",
                "example": 1000,
                "type": "number"
              },
              "to_account": {
                "type": "string"
              },
              "to_amount": {
                "example": 8.5,
                "type": "number"
              },
              "to_asset": {
                "type": "string"
              },
              "to_category": {
                "type": "string"
              },
              "to_description": {
                "type": "string"
              },
              "to_provider": {
                "type": "string"
              },
              "to_risk": {
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "to_ticker": {
                "type": "string"
              },
              "tx_date": {
                "description": "Today or tomorrow at the latest (the user's own calendar day); later dates are rejected",
                "example": "2026-06-17",
                "format": "date",
                "type": "string"
              },
              "tx_time": {
                "description": "Optional HH:MM on the user's own clock; orders rows within the same day. Omitted: an edit keeps the stored time, a new row takes the current time",
                "example": "14:30",
                "type": "string"
              }
            },
            "required": ["from_account", "from_amount", "from_asset", "from_provider", "from_ticker", "overall_eur_value", "to_account", "to_amount", "to_asset", "to_provider", "to_ticker", "tx_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Log trade"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c760e24e8db47dfc51323e911e6479ec9050174142e81a9b02bc532cd750a404"
        },
        {
          "name": "propose_holdings_import",
          "title": "Propose holdings import",
          "description": "Prepare an import of what the user owns and owes: one row per current holding, not their transaction history. Saves a draft only. Nothing is added until the user reviews and imports it in Krosos, so this works on a read-only connection. asset is one of the asset classes in get_reference_data. Amounts are in base_currency: convert first. Cash: ticker is the currency code and quantity the balance. A pension pot: ticker is the currency code and quantity the amount. A home, a car or another valuable: a short ticker of its own, quantity 1, and value what it is worth today. What is owed (mortgage, debt, provision): quantity is the amount owed. invested is the cost basis (0 if unknown).",
          "inputSchema": {
            "properties": {
              "rows": {
                "items": {
                  "properties": {
                    "account": {
                      "type": "string"
                    },
                    "asset": {
                      "type": "string"
                    },
                    "category": {
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "invested": {
                      "description": "Cost basis, ≥ 0",
                      "type": "number"
                    },
                    "provider": {
                      "type": "string"
                    },
                    "quantity": {
                      "type": "number"
                    },
                    "realized": {
                      "description": "Realized P/L, ≥ 0",
                      "type": "number"
                    },
                    "risk": {
                      "maximum": 4,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "ticker": {
                      "type": "string"
                    },
                    "value": {
                      "description": "Pension, valuables and property only: what the holding is worth today in total, in the base currency. On a ticker of its own (a home, a car) it sets the price when the ticker has none, and must match the price it already has. On the base currency it must equal quantity",
                      "type": "number"
                    }
                  },
                  "required": ["account", "asset", "quantity"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Propose holdings import"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:95be203fd1b3690eb6675a6ebcc4b86db3f1bd078918abdac25ed45f4e28c774"
        },
        {
          "name": "propose_net_worth_history_import",
          "title": "Propose net worth history import",
          "description": "Prepare an import of the user's past net worth: one total per date, from old statements or another tracker's export. Saves a draft only. Nothing is added until the user reviews and imports it in Krosos, so this works on a read-only connection. total_value_eur is the whole net worth that day in base_currency (the field name is historical): convert first; it may be negative. A date that already has a figure is replaced when imported.",
          "inputSchema": {
            "properties": {
              "rows": {
                "items": {
                  "properties": {
                    "date": {
                      "format": "date",
                      "type": "string"
                    },
                    "total_value_eur": {
                      "type": "number"
                    }
                  },
                  "required": ["date", "total_value_eur"],
                  "type": "object"
                },
                "maxItems": 5000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Propose net worth history import"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:abe1f6e834f5d426830ac5ce9fcd88bc7609aee411ed08cfdbb1af6b842ade16"
        },
        {
          "name": "record_balance_adjustment",
          "title": "Record balance adjustment",
          "description": "Record a signed quantity change on one holding (a balance update that is not a trade). Same body and validation as POST /api/position-adjustments.",
          "inputSchema": {
            "properties": {
              "account": {
                "type": "string"
              },
              "allow_new_values": {
                "type": "boolean"
              },
              "asset": {
                "type": "string"
              },
              "provider": {
                "type": "string"
              },
              "quantity_delta": {
                "description": "Signed quantity change (non-zero)",
                "type": "number"
              },
              "ticker": {
                "type": "string"
              },
              "tx_date": {
                "description": "Today or tomorrow at the latest (the user's own calendar day); later dates are rejected",
                "format": "date",
                "type": "string"
              },
              "tx_time": {
                "description": "Optional HH:MM on the user's own clock; orders rows within the same day. Omitted: an edit keeps the stored time, a new row takes the current time",
                "example": "14:30",
                "type": "string"
              }
            },
            "required": ["account", "asset", "provider", "quantity_delta", "ticker", "tx_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Record balance adjustment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c9a4a3d2a6df1c6508ebbe4302d4affd54d0edab36c247376c3a11ca67170cee"
        },
        {
          "name": "refresh_prices",
          "title": "Refresh prices",
          "description": "Fetch fresh market prices now. With no ticker this refreshes every priced holding; with one it refreshes just that ticker.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Provider symbol when it differs from the ticker",
                "type": "string"
              },
              "ticker": {
                "description": "Omit to refresh every ticker",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Refresh prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1bb280a98ed2da78b5e3b345896e35afd3bc30aee421fdfbad51108f4cbdf851"
        },
        {
          "name": "sync_connections",
          "title": "Sync connections",
          "description": "Sync every linked connection in one pass: push the latest balance into each linked holding, and stage new transactions into the review queue. Reports what was written, what was staged and any per-provider errors.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
