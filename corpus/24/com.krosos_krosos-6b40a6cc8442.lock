        {
          "name": "propose_holdings_import",
          "title": "Propose holdings import",
          "description": "Prepare an import of what the user owns and owes: one row per current holding, not their transaction history. Saves a draft only. Nothing is added until the user reviews and imports it in Krosos, so this works on a read-only connection. asset is one of the asset classes in get_reference_data. Amounts are in base_currency: convert first. Cash: ticker is the currency code and quantity the balance. A pension pot: ticker is the currency code and quantity the amount. A home, a car or another valuable: a short ticker of its own, quantity 1, and value what it is worth today. What is owed (mortgage, debt, provision): quantity is the amount owed. invested is the cost basis (0 if unknown).",
          "inputSchema": {
            "properties": {
              "rows": {
                "items": {
                  "properties": {
                    "account": {
                      "type": "string"
                    },
                    "asset": {
                      "type": "string"
                    },
                    "category": {
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "invested": {
                      "description": "Cost basis, ≥ 0",
                      "type": "number"
                    },
                    "provider": {
                      "type": "string"
                    },
                    "quantity": {
                      "type": "number"
                    },
                    "realized": {
                      "description": "Realized P/L, ≥ 0",
                      "type": "number"
                    },
                    "risk": {
                      "maximum": 4,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "ticker": {
                      "type": "string"
                    },
                    "value": {
                      "description": "Pension, valuables and property only: what the holding is worth today in total, in the base currency. On a ticker of its own (a home, a car) it sets the price when the ticker has none, and must match the price it already has. On the base currency it must equal quantity",
                      "type": "number"
                    }
                  },
                  "required": ["account", "asset", "quantity"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Propose holdings import"
