{
  "lockfileVersion": 2,
  "subjects": {
    "app.motionfab/library": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://motionfab.app/api/library/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "motion-fab-library",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Motion Fab's community library: recipes and the motion-design techniques taken out of their videos. A recipe is a short video people made in Motion Fab (HTML, CSS and JavaScript: HyperFrames compositions animated with GSAP, three.js, shaders and the like) with the prompt that makes one like it: find recipes with `search_recipes` and read one whole, prompt included, with `get_recipe`. A technique is one standalone composition that loads nothing but CDN libraries and Google Fonts: search them in English with `search_techniques`, describing the effect you want, then read the code of the ones that fit with `get_technique`. Every recipe and technique links to its page on motionfab.app.",
      "tools": [
        {
          "name": "get_recipe",
          "title": "Get a recipe",
          "description": "One published recipe whole: its prompt (sections in tags such as <direction> and <music>), what the reader brings (`inputs`: a video, a logo...), the template and model it was made with, its video, and its techniques (id, name, kind) whose standalone code get_technique gives. Use the prompt as a starting point for a similar video in Motion Fab or with your own tools.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "A recipe id or slug from search_recipes.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "description": "The language of the texts; default en.",
                "enum": ["en", "ru", "de", "es", "fr", "it", "ar", "th"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7d31d851c950768e112d90119a022896fe7d7c02b32b8ac38a9fce9bc681996a"
        },
        {
          "name": "get_technique",
          "title": "Get a technique",
          "description": "One technique with its code: `code.html`, `code.css` and `code.js` make one standalone composition (CDN libraries and Google Fonts only), plus everything search_techniques gives. Adapt it to your piece rather than pasting it whole.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "An id from search_techniques.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ba10ea4d60bbd7c2cab3776a7172cdaebd7f0d7a2aacdb17fe7b28564c53161f"
        },
        {
          "name": "search_recipes",
          "title": "Search recipes",
          "description": "Motion Fab's published community recipes: short videos people made, each with the prompt that makes one like it. Without `query` the newest first; with it, recipes whose English title or prompt has those words. Each has its id, slug, title, one-sentence summary, the Motion Fab template it was made with, tags, the AI model, its page on motionfab.app, its video and how often it was used. The prompt and the techniques come with get_recipe.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "The language of titles and summaries; default en.",
                "enum": ["en", "ru", "de", "es", "fr", "it", "ar", "th"],
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "English words, such as \"neon logo reveal\".",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "tag": {
                "enum": ["launch-video", "explainer", "kinetic-type", "logo-reveal", "ui-animation", "charts-data", "maps", "3d", "particles", "characters", "social-ad", "title-sequence", "music-visual"],
                "type": "string"
              },
              "template": {
                "description": "A Motion Fab template id, such as simple-motion.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a4482b8ba5951912a2f53fe2f60c478be3d506e9c1a95713d86814aacdeba55d"
        },
        {
          "name": "search_techniques",
          "title": "Search techniques",
          "description": "The techniques nearest in meaning to `query` (English works best: what the effect looks like or what it is for, such as \"text that rises out of a blur\" or \"a glitch transition between scenes\"), best first, with `score` (cosine similarity, 1 is the same). Each has its id, name, kind, description, when to use it, its libraries, the runtime and template of its recipe, the second of the recipe's video it is seen best in, a link to the recipe and to that frame. No code: read it with get_technique.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "Only techniques of this kind.",
                "enum": ["typography", "transition", "shape", "camera", "3d", "data", "layout", "color", "texture", "character", "particles", "other"],
                "type": "string"
              },
              "library": {
                "description": "Only techniques using a library whose name has this, such as gsap or three.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Default 8.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 1000,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9005fd67370742ff7ed903022e3cefb94982ee8d7c5ae0f719f2323fdffd4522"
        }
      ],
      "digest": "sha256:ae1ab1110b8dae1e916b9e84e187e30a33e730d9c78d2c618ec6c176b5a408db"
    }
  }
}
