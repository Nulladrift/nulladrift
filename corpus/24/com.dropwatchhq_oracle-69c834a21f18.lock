{
  "lockfileVersion": 2,
  "subjects": {
    "com.dropwatchhq/oracle": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://oracle.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "hobby-market-oracle",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Hobby Market Oracle: tools for collectible price-fairness, recall safety, in-stock drops, card grading guidance, and class-action settlements. Call tools/list to enumerate.",
      "tools": [
        {
          "name": "check_in_stock",
          "description": "Check whether a hobby item has recently dropped or restocked across the specialty shops we monitor for a niche. Returns recent in-stock matches (new + restock) with direct buy links. Use when an agent wants to find where a sold-out collectible is currently available.",
          "inputSchema": {
            "properties": {
              "niche": {
                "description": "Hobby niche: tcg, lego, funko, keebs, vinyl, aqua",
                "enum": ["tcg", "lego", "funko", "keebs", "vinyl", "aqua"],
                "type": "string"
              },
              "query": {
                "description": "Product name to match against recent drops, e.g. 'Prismatic Evolutions' or 'Millennium Falcon'.",
                "type": "string"
              }
            },
            "required": ["niche", "query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e328c8795bf3866be72fe3e0d41a8969c0d25a10f1575dcb7db25de24ade362f"
        },
        {
          "name": "check_recall",
          "description": "Search active consumer product recalls (CPSC, FDA, NHTSA and more) by keyword. Returns matching recalls with agency, hazard, affected products, and remedy. Use when an agent needs to know if a product, brand, baby/food/vehicle item has been recalled before recommending or buying it.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Keyword to search recalls, e.g. 'stroller', 'peloton', 'infant formula'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de19df076353ffe98adbec4cb06c8506b6cf9e9ef5f5974e79b90f32eb17acca"
        },
        {
          "name": "check_scalper_price",
          "description": "Check whether a hobby item's asking price is fair or scalped. Compares a price you're seeing against current retail across tracked specialty shops for the niche. Returns a verdict (fair/high/scalped), the retail price band, and where to buy at retail. Use when an agent or user wants to know if a Pokémon box, LEGO set, Funko, keyboard, vinyl, or aquarium item is overpriced.",
          "inputSchema": {
            "properties": {
              "niche": {
                "description": "Hobby niche: tcg, lego, funko, keebs, vinyl, aqua",
                "enum": ["tcg", "lego", "funko", "keebs", "vinyl", "aqua"],
                "type": "string"
              },
              "price": {
                "description": "Optional: the asking price you're seeing, to get a scalped/fair verdict.",
                "type": "number"
              },
              "query": {
                "description": "Product name, e.g. 'Pokemon 151 Booster Box' or 'LEGO 10307 Eiffel Tower'.",
                "type": "string"
              }
            },
            "required": ["niche", "query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:06a76498d4eea31f6c8656a7b5f38204f60132bf705ee5b96327bd1aa63b2452"
        },
        {
          "name": "find_settlements",
          "description": "Find open class-action settlements you may be eligible to claim (often no proof of purchase required). Returns settlements with payout, claim deadline, proof requirements, and the official claim URL. Use when an agent wants to surface free-money / consumer-rights opportunities for a user.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Optional keyword to filter settlements, e.g. 'data breach', 'apple', 'privacy'. Omit to list the most recent open settlements.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:110cf290c178e92654463dc55d899a593dea9904bae16875d60542e1bf1dddd3"
        },
        {
          "name": "grade_card_centering",
          "description": "Estimate a trading card's centering and rough PSA-style grade from a photo. NOTE: the centering measurement runs client-side in the browser (computer vision on the uploaded image) and is not server-callable here. This tool returns guidance plus a link to the live CardGrade tool where the agent or user can run the analysis.",
          "inputSchema": {
            "properties": {
              "image_url": {
                "description": "URL or description of the card image (informational; analysis runs in-browser).",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4e160e570bacf04bc49a09df0424dba906785e391b8dc66bab418824dd943a8e"
        }
      ],
      "digest": "sha256:4b92d96b8ac0ac8e36c4407c658fdd5bbd349158ecc5a3f4ff37fc0813f4bd6e"
    }
  }
}
