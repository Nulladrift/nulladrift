{
  "lockfileVersion": 2,
  "subjects": {
    "com.coinfuty/coinfuty": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.coinfuty.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "coinfuty",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Free crypto futures market data from Coinfuty (coinfuty.com): open interest, funding rates, long/short ratios, liquidations, volume — live and historical, aggregated across major exchanges. All values USD, timestamps UTC. Start with get_coins_markets to discover symbols, get_coin_summary for a single coin.",
      "tools": [
        {
          "name": "get_coin_summary",
          "title": "Coin Derivatives Summary",
          "description": "Full derivatives snapshot for one coin: price and market cap, open interest with 1h/4h/12h/24h change, volume, liquidations (total/long/short), long/short ratio per exchange, and current funding rate per exchange (OI-weighted aggregate included). The single best tool for “what's happening with X futures”.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "symbol": {
                "description": "Coin ticker, e.g. BTC",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:72d755f03b43b7c57f1803fae0073fd16fea00f47906c05a8458ce3b11826114"
        },
        {
          "name": "get_coins_markets",
          "title": "Coin Futures Market Screener",
          "description": "List coins with live futures market data: price, 1h/24h/7d price change, open interest (with 24h change), current funding rate (OI-weighted, % per interval), 24h volume, 24h liquidations, 24h long/short ratio, and market cap. Sortable; filter to specific symbols with `symbols`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Rows to return, default 20, max 100",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "order": {
                "description": "Default desc",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "sort": {
                "description": "Sort field, default `oi` (open interest)",
                "enum": ["oi", "price", "volume_24h", "market_cap", "funding_rate", "liq_24h", "ls_24h", "price_pct_24h", "oi_pct_24h", "trending_score_24h"],
                "type": "string"
              },
              "symbols": {
                "description": "Restrict to these tickers, e.g. [\"BTC\",\"ETH\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f1eeb1ffbbf36494d4c4c2c8f2fbd8140a7f0cabb66401e16eb806d6794731e9"
        },
        {
          "name": "get_exchange_breakdown",
          "title": "Per-Exchange Breakdown (OI, long/short, liquidation, volume)",
          "description": "How one coin's futures activity splits across exchanges. metric=oi returns each exchange's open interest USD with 1h/4h/12h/24h % change (window ignored); long_short returns ratio + taker buy/sell volume per exchange; liquidation returns long/short liquidation USD; volume returns traded volume USD with % changes. `total` is the coin-level aggregate.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "metric": {
                "enum": ["oi", "long_short", "liquidation", "volume"],
                "type": "string"
              },
              "symbol": {
                "description": "Coin ticker, e.g. BTC",
                "type": "string"
              },
              "window": {
                "description": "Lookback window, default 24h (ignored for oi)",
                "enum": ["1h", "4h", "12h", "24h"],
                "type": "string"
              }
            },
            "required": ["metric", "symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48b2a67fa4f48623db8b93750c5f3329ba50d8cfad336dc35f165f1b4e83b8df"
        },
        {
          "name": "get_funding_rates",
          "title": "Funding Rates by Exchange",
          "description": "Current and accumulated funding rates for one coin on every exchange that lists it: current rate (% per settlement interval, stablecoin- and token-margined), accumulated 1d/7d/30d/1y, settlement interval hours, and next funding time. Includes the OI-weighted aggregate rate.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "symbol": {
                "description": "Coin ticker, e.g. BTC",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:11a29fd4450aafb12a94de511fbad07895a69a0fd64e062944f94da3a849390e"
        },
        {
          "name": "get_market_overview",
          "title": "Crypto Futures Market Overview",
          "description": "Aggregated crypto futures market snapshot: total open interest (USD, with 1h/24h % change), total liquidations (24h), Fear & Greed index, average RSI across coins, plus a 30-day daily series of open interest and liquidations. Data aggregated across major exchanges.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:628f16984996705931315466cb2c96d29dbd08928c1c912c17d632ed41677077"
        },
        {
          "name": "get_price_history",
          "title": "Historical Series (price, OI, funding, long/short, liquidation, volume)",
          "description": "Historical time series for one coin. metric=price returns OHLC candles with volume; oi returns open-interest candles (USD); funding returns OI-weighted funding-rate candles (% per interval); long_short returns ratio + taker buy/sell volume; liquidation returns long/short liquidation USD; volume returns taker buy/sell volume USD. Timestamps are UTC ISO 8601, newest N points.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Number of most recent points, default 100",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "metric": {
                "enum": ["price", "oi", "funding", "long_short", "liquidation", "volume"],
                "type": "string"
              },
              "symbol": {
                "description": "Coin ticker, e.g. BTC",
                "type": "string"
              },
              "tf": {
                "description": "Timeframe per point, default 1d",
                "enum": ["1h", "4h", "12h", "1d"],
                "type": "string"
              }
            },
            "required": ["metric", "symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:657c9f04c6536fb49c49d5435aba735ea7f3ebb33e65a89121a4eae077aff315"
        },
        {
          "name": "list_exchanges",
          "title": "Derivatives Exchanges",
          "description": "Top cryptocurrency derivatives exchanges tracked by Coinfuty, with open interest, 24h volume, 24h liquidations, futures maker/taker fees, number of markets, and CMC rank.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2ad03ccc3fc20bb15585835a01a9434a77028bb0483525fa22566852050868f9"
        }
      ],
      "digest": "sha256:e4baf1f91d5eb8bedee9406c95e8993618db1c2c066bb78f4f6845e722c0d30e"
    }
  }
}
