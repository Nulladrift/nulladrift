          },
          "digest": "sha256:d848a0d6c93e95275f851dbc29d683c8e90710caf712b393e274b6448313e92d"
        },
        {
          "name": "press_chart",
          "title": "Press chart",
          "description": "A chart of the official, unofficial and in-game split, or the brands with the most sourced entries, plus a ready SVG. Always includes \"Source: gta6brands.com\" and a link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "mix (default) or top_brands",
                "enum": ["mix", "top_brands"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
