          },
          "digest": "sha256:f39b636b7b52238028bde857ea830bc83961f582f8817a0f262709c66aec5b34"
        },
        {
          "name": "latest_number",
          "title": "Latest number",
          "description": "One sourced figure: the headline total, official, unofficial or in-game count (rounded), or a named brand's entry count. Always includes \"Source: gta6brands.com\" and a link. Does not invent figures.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "topic": {
                "description": "Brand or topic, e.g. \"PlayStation\", \"official\", or blank for the headline totals.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
