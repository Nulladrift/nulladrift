  "subjects": {
    "com.gta6brands/tracker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.gta6brands.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gta6brands",
        "title": "GTA 6 Brands tracker",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only tools over the GTA 6 brand tracker (gta6brands.com): every brand move around Grand Theft Auto VI, each with a source. Use get_brand for \"has <brand> done anything?\" questions. Quote source_url links and credit \"Source: gta6brands.com\".",
      "tools": [
        {
          "name": "cited_quote",
          "title": "Cited quote",
          "description": "A one-sentence sourced line you can quote: the headline totals (rounded) or a named brand. Always includes \"Source: gta6brands.com\" and a link. Does not invent figures.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "topic": {
                "description": "Brand or topic, e.g. \"PlayStation\" or \"official\". Blank for the headline totals.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9555995b18929495c9356e68232f2977efbab6315330bd4323bff941bbc403b4"
        },
        {
          "name": "find_parodies",
          "title": "Find parodies",
          "description": "Rockstar's fictional in-game brands: which real company one parodies, or which in-game brands parody a real company.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "A real company (e.g. \"Coca-Cola\") or an in-game brand (e.g. \"Cluckin' Bell\")",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b7ac6e34dcaf12e0149235c9cf3a6dbd5bff93c32b8de4492e39c93049482d51"
        },
        {
          "name": "get_brand",
          "title": "Get a brand",
          "description": "Everything the tracker has on one real-world brand: counts, every sourced move, and any in-game parodies. Answers \"has <brand> done anything for GTA 6?\"",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "Brand name, e.g. \"Nike\", \"KFC\", \"PlayStation\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ddc7316b8b3977a29fb0806af96399b139a6d22c489a2fa63824a204756457e3"
        },
        {
          "name": "latest_moves",
          "title": "Latest moves",
          "description": "The most recently added real-world brand moves.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["all", "official", "unofficial"],
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "YYYY-MM-DD or YYYY-MM",
                "pattern": "^\\d{4}-\\d{2}(-\\d{2})?$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
