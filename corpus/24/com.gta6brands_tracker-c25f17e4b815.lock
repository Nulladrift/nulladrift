        },
        {
          "name": "search_brands",
          "title": "Search brands and entries",
          "description": "Search the tracker for brands, titles, summaries, places and parodies. Returns matching brands and entries, newest first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Brand, place or words, e.g. \"Nike\" or \"London\"",
