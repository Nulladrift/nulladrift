      "instructions": "Check and Launch launch-readiness guidance for AI-built apps. Start with get_started. You do the checking; these tools only return guidance, and Check and Launch fetches nothing and stores nothing. Record progress in LAUNCH-CHECK.md in the user's project. Teach as you go, at the user's level. Never give a pass, fail, or score, and never tell the user the app is ready to publish or launch: list what's still open instead.",
      "tools": [
        {
          "name": "explain",
          "title": "Explain a check or topic",
          "description": "Explain one check in full, at the user's level: what it is, why it matters, what could happen if it's left, how to look into it, how to fix it, how to confirm the fix, and how to report it. Also teaches a learning topic, such as database-security or payments (get_started lists them).",
          "inputSchema": {
            "properties": {
              "builder": {
                "description": "Only show the note for this builder. Leave out to see every builder's note.",
                "enum": ["lovable", "bolt", "replit", "base44", "claude-code", "cursor", "other"],
                "type": "string"
              },
              "id": {
                "description": "A check id (from list_checks or review_area), or a learning topic id (from get_started).",
                "type": "string"
              },
              "level": {
                "description": "How much detail to explain in: beginner (the default), intermediate or advanced.",
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
