      "resources": [
        {
          "uri": "checkandlaunch://learn/accessibility",
          "name": "accessibility",
          "title": "Accessibility",
          "description": "Accessibility means people can use your app however they use a device: with a keyboard instead of a mouse, a screen reader instead of their eyes, large text, or a shaky hand on a small screen. Most of it comes down to using the right building blocks and testing a few things by hand.",
          "mimeType": "text/markdown",
          "digest": "sha256:9d858b27d90b39476354d4af72343cdb151c20c6c79893903a6e8721c5345abc"
        },
        {
          "uri": "checkandlaunch://learn/api-security",
          "name": "api-security",
          "title": "API security",
          "description": "Your app's server functions (edge functions, API routes) can be called by anyone, not only by your own pages. Each one needs to check who's calling, whether they're allowed to do this, and whether the data they sent makes sense.",
          "mimeType": "text/markdown",
          "digest": "sha256:b7c5bbb5bd584456e6ba3cc9fd2a917ae3d1f1ee788802af89c4c295dd55f833"
        },
        {
          "uri": "checkandlaunch://learn/backups-recovery",
          "name": "backups-recovery",
          "title": "Backups and recovery",
          "description": "Your app is made of code and data, and they're backed up separately. GitHub keeps your code. Your database host may or may not keep your data, depending on your plan. Know both before launch, and test a restore before you need one.",
          "mimeType": "text/markdown",
          "digest": "sha256:c0c184e33222cb7a6890c9433600b1494a06a276d1e349b579a32b1c225fc94a"
        },
        {
          "uri": "checkandlaunch://learn/database-security",
          "name": "database-security",
          "title": "Database security and RLS",
          "description": "In most apps built with Lovable or Bolt, the browser talks straight to the database using a key that anyone can see. That's normal and safe, but only if every table has rules that decide who can read and change each row. Those rules are your app's real security.",
          "mimeType": "text/markdown",
          "digest": "sha256:68c54290832402a71c1bb857d5df8a984082598ea7e0781f8576eeb874d78534"
        },
        {
          "uri": "checkandlaunch://learn/hosting-deployment",
          "name": "hosting-deployment",
          "title": "Hosting and deployment",
          "description": "Your app lives in two places: the editor where you build it, and the live site people visit. They're not the same, and changes only reach the live site when you publish. Moving to your own domain means updating every setting that mentions the old address.",
          "mimeType": "text/markdown",
          "digest": "sha256:8e1dc28741c2b5c6b96918445c67fdcdd3cfdc0f0faed9a592c1567fd7424881"
        },
        {
          "uri": "checkandlaunch://learn/launch-preparation",
          "name": "launch-preparation",
          "title": "Preparing for launch day",
          "description": "Launch day goes best when the app works for a stranger, the words are written in advance, and your time is kept free to reply. Most of the work happens in the week before: checking, writing and planning, so the day itself is about people, not fixes.",
          "mimeType": "text/markdown",
          "digest": "sha256:b642bcba32f71a7e18934a08d19bc119b53f7c9122087b6a6ad9c7d9c2d3e8a9"
        },
        {
          "uri": "checkandlaunch://guides/levels",
          "name": "levels",
          "title": "Levels of explanation",
          "description": "How to explain findings at beginner, intermediate and advanced level.",
          "mimeType": "text/markdown",
          "digest": "sha256:c9bb1cc6997c835648dba0573dbc51e0c94325233ba5d4781be17ad002cf75ea"
        },
        {
          "uri": "checkandlaunch://learn/monitoring-errors",
          "name": "monitoring-errors",
          "title": "Monitoring and error handling",
          "description": "Things will break after launch. What matters is that users see a clear message when they do, and that you find out quickly, from a tool rather than an annoyed user. That needs good error states in the app, error tracking, and a simple uptime alert.",
          "mimeType": "text/markdown",
          "digest": "sha256:4d385328e3752b8ee01055895cd1604140caea6eeed059988afb2887620234f9"
        },
        {
          "uri": "checkandlaunch://learn/payments",
          "name": "payments",
          "title": "Taking payments",
          "description": "Taking payments has two halves: the checkout, where the customer pays, and the confirmation, where your app finds out the payment succeeded and gives access. Most launch problems are in the second half, and in the gap between test mode and live mode.",
          "mimeType": "text/markdown",
          "digest": "sha256:49867043c9943feaf39eed26501c2ed7997ddd578d8ce4cec911a959a420b9d3"
        },
        {
          "uri": "checkandlaunch://learn/privacy-gdpr",
          "name": "privacy-gdpr",
          "title": "Privacy and GDPR basics",
          "description": "If your app stores an email address, it handles personal data. Privacy law, such as GDPR in the UK and EU, asks you to collect only what you need, say what you do with it, keep it safe, and let people see or delete it. This is guidance, not legal advice.",
          "mimeType": "text/markdown",
          "digest": "sha256:26730c39d577840764f34ae4b45fe0c057c8284fc634e608f3c8dcd6da83feae"
        },
        {
          "uri": "checkandlaunch://guides/progress-file",
          "name": "progress-file",
          "title": "The LAUNCH-CHECK.md progress file",
          "description": "How to record launch-check progress in LAUNCH-CHECK.md in the user's project.",
          "mimeType": "text/markdown",
          "digest": "sha256:70ad1531537a5e2c67e68d83682843f24485ab638e4bc6c04630347cd9e37eb6"
        },
        {
          "uri": "checkandlaunch://learn/secrets",
          "name": "secrets",
          "title": "Environment variables and secrets",
          "description": "Some keys are made to be public, and some must stay secret. Secret keys belong in your builder's secrets settings and should only be used in server code. Anything in front-end code is readable by every visitor, and anything ever committed to git stays in its history.",
          "mimeType": "text/markdown",
          "digest": "sha256:88d05dfb4036997e8f99f694cc456d8646c8d1e1be8b980ffc16cf5f672e7970"
        },
        {
          "uri": "checkandlaunch://learn/seo-basics",
          "name": "seo-basics",
          "title": "SEO and sharing basics",
          "description": "Search engines and social platforms read your page's HTML to decide what to show: the title, the description and the preview image. Apps built with Lovable and Bolt build their pages in the browser, so the information in `index.html` matters more than you might expect.",
          "mimeType": "text/markdown",
          "digest": "sha256:e8223cfdbc3b699bd2e1ff6880426402d6cfaf869bbd4d858cc5b2a97107b505"
        },
        {
          "uri": "checkandlaunch://learn/sign-in-and-access",
          "name": "sign-in-and-access",
          "title": "Sign-in and who can see what",
          "description": "Sign-in answers \"who is this?\". Access control answers \"what are they allowed to do?\". AI builders set up sign-in quickly, but the second question is where most launch problems hide: an app can know exactly who someone is and still show them other people's data.",
          "mimeType": "text/markdown",
          "digest": "sha256:6a5b528e64e2c118590da5ef3e4b60080b98660d56e757fea3fc98392a51faf2"
        },
        {
          "uri": "checkandlaunch://guides/statuses",
          "name": "statuses",
          "title": "Statuses and wording",
          "description": "The statuses to use for each check, and the words to avoid.",
          "mimeType": "text/markdown",
          "digest": "sha256:3bed180594d40f3bd5b8bb0869ea4ee1fa9d86fcf8c8c8ba8d31618e43124f5e"
        }
      ],
