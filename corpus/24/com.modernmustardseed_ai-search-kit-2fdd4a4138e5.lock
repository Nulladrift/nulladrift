{
  "lockfileVersion": 2,
  "subjects": {
    "com.modernmustardseed/ai-search-kit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.modernmustardseed.com/ai-search-kit"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "AI Search Kit by Modern Mustard Seed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AI Search Kit audits and builds what AI answer engines read on a business website. audit_ai_readiness checks one page, its robots.txt rules for each AI crawler, structured data, llms.txt, canonical and sitemap. generate_local_business_schema and generate_llms_txt write the files. check_entity_consistency compares name, address and phone across profiles. validate_structured_data checks pasted JSON-LD. Every rule cites a public spec or vendor document. All tools are read-only.",
      "tools": [
        {
          "name": "audit_ai_readiness",
          "title": "Audit AI search readiness",
          "description": "Audit one public web page for what AI answer engines and their crawlers rely on. Reads the page plus its site's robots.txt, llms.txt and sitemap, then reports: for each AI crawler and control token (OAI-SearchBot, ChatGPT-User, GPTBot, Claude-SearchBot, Claude-User, ClaudeBot, PerplexityBot, Perplexity-User, Googlebot, Google-Extended, Applebot, Applebot-Extended) whether robots.txt allows it on this page under RFC 9309 matching; noindex and nosnippet directives; JSON-LD validity against the schema.org vocabulary and Google's LocalBusiness rules; whether the name, phone and address in the markup also appear on the visible page; llms.txt format; canonical tag; and sitemap. Every finding cites the public spec or vendor document behind it, with the date it was read. Results are cached for 10 minutes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "default": "summary",
                "description": "\"summary\" (default) lists only findings that warn, fail or inform; \"full\" includes passing findings with their sources.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "url": {
                "description": "The page to audit, such as example.com or https://example.com/locations/denver. Public http and https only.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Audit AI search readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:19060c06916e04d075646cd3b275ac0bb29e2cd60ea455bb69c5f03dea672877"
        },
        {
          "name": "check_entity_consistency",
          "title": "Check entity consistency",
          "description": "Compare a business's name, phone, street, city, region and postal code across up to 8 sources, such as its website, Google Business Profile, Facebook page and directory listings. For each source give a url to read (JSON-LD first, then tap-to-call links and page text) and/or the facts shown on it; supplied facts win, and are needed for sites that block automated readers. Formats are normalized (\"123 North Main Street, Suite 4\" matches \"123 N Main St Ste 4\", \"(406) 555-0100\" matches \"+1 406-555-0100\"), then each field is reported as consistent, variant or mismatch, with the exact fixes. Give business to compare against a canonical record instead of the majority.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business": {
                "description": "The canonical name, phone and address every source should match.",
                "properties": {
                  "address_locality": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "address_region": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 40,
                    "type": "string"
                  },
                  "postal_code": {
                    "maxLength": 20,
                    "type": "string"
                  },
                  "street_address": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "profiles": {
                "items": {
                  "properties": {
                    "address_locality": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "address_region": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "label": {
                      "description": "A short name for this source, such as \"Website\" or \"Yelp\".",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "name": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "phone": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "postal_code": {
                      "maxLength": 20,
                      "type": "string"
                    },
                    "street_address": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "url": {
                      "description": "A page that shows the business: its own website, a directory listing, a social profile.",
                      "maxLength": 2048,
                      "minLength": 3,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["profiles"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check entity consistency"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:645bd80a69999e5e7044a349f6198c78e46d68b80acaa585b05a46db758ddb19"
        },
        {
          "name": "generate_llms_txt",
          "title": "Generate llms.txt",
          "description": "Write an llms.txt file in the llmstxt.org format: an H1 with the site name, a blockquote summary, optional details, H2 sections of \"- [title](url): note\" links, and an Optional section for secondary pages. Give url to build it from the live site (home page, sitemap, and up to 30 pages' own titles and meta descriptions, honoring the site's robots.txt and skipping noindex pages), or give site_name and sections to build it from your own facts; supplied fields override what is read from the site. The result is checked against the format before it is returned. Nothing is published.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "details": {
                "description": "Optional markdown notes between the summary and the link sections. Headings are not allowed there.",
                "maxLength": 3000,
                "type": "string"
              },
              "max_pages": {
                "default": 20,
                "description": "How many pages to read from the site, 1 to 30. Default 20.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "optional_links": {
                "description": "Secondary links for the Optional section.",
                "items": {
                  "properties": {
                    "description": {
                      "maxLength": 400,
                      "type": "string"
                    },
                    "title": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "url": {
                      "maxLength": 2048,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["title", "url"],
                  "type": "object"
                },
                "maxItems": 40,
                "type": "array"
              },
              "sections": {
                "description": "H2 file lists, each with links.",
                "items": {
                  "properties": {
                    "links": {
                      "items": {
                        "properties": {
                          "description": {
                            "maxLength": 400,
                            "type": "string"
                          },
                          "title": {
                            "maxLength": 200,
                            "minLength": 1,
                            "type": "string"
                          },
                          "url": {
                            "maxLength": 2048,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["title", "url"],
                        "type": "object"
                      },
                      "maxItems": 60,
                      "minItems": 1,
                      "type": "array"
                    },
                    "title": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["links", "title"],
                  "type": "object"
                },
                "maxItems": 15,
                "type": "array"
              },
              "site_name": {
                "description": "The H1. Required when url is not given.",
                "maxLength": 120,
                "type": "string"
              },
              "summary": {
                "description": "One or two sentences for the blockquote.",
                "maxLength": 500,
                "type": "string"
              },
              "url": {
                "description": "A public site to read, such as example.com.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Generate llms.txt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b0b774cb5de0a2480c0fc76259c6a57b191807cee600fa1e1b17f7274a330f09"
        },
        {
          "name": "generate_local_business_schema",
          "title": "Generate LocalBusiness schema",
          "description": "Turn a local business's facts into schema.org JSON-LD. Chooses the most specific LocalBusiness subtype from business_type (for example \"roofing company\" becomes RoofingContractor) or takes schema_type as given, writes only properties schema.org defines for that type, formats hours, phone and 24 hour or closed days the way Google documents, then validates the output against the schema.org vocabulary. Returns the JSON-LD, a ready-to-paste script tag, the type chosen with alternatives, and cited notes on anything left out. No network access; nothing is published.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "accepts_reservations": {
                "description": "Food businesses only.",
                "type": "boolean"
              },
              "address_country": {
                "description": "Two-letter ISO country code, such as \"US\".",
                "maxLength": 60,
                "type": "string"
              },
              "address_locality": {
                "description": "City or town.",
                "maxLength": 100,
                "type": "string"
              },
              "address_region": {
                "description": "State, province or region, such as \"MT\".",
                "maxLength": 100,
                "type": "string"
              },
              "area_served": {
                "description": "Places served: plain names, or objects with a type (City, State, AdministrativeArea, Country, Place) and an optional Wikidata or Wikipedia URL in same_as.",
                "items": {
                  "anyOf": [
                    {
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    {
                      "properties": {
                        "name": {
                          "maxLength": 120,
                          "minLength": 1,
                          "type": "string"
                        },
                        "same_as": {
                          "maxLength": 2048,
                          "type": "string"
                        },
                        "type": {
                          "enum": ["City", "State", "AdministrativeArea", "Country", "Place"],
                          "type": "string"
                        }
                      },
                      "required": ["name"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 50,
                "type": "array"
              },
              "business_type": {
                "description": "Plain words for what the business is, such as \"plumber\", \"dental office\" or \"coffee shop\".",
                "maxLength": 120,
                "type": "string"
              },
              "currencies_accepted": {
                "description": "ISO 4217 codes such as USD.",
                "items": {
                  "maxLength": 3,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "description": {
                "maxLength": 1000,
                "type": "string"
              },
              "email": {
                "maxLength": 200,
                "type": "string"
              },
              "founders": {
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "founding_date": {
                "description": "YYYY-MM-DD.",
                "maxLength": 10,
                "type": "string"
              },
              "hide_street_address": {
                "description": "True for a service-area business that does not serve customers at its address.",
                "type": "boolean"
              },
              "hours": {
                "description": "Regular opening hours. Days not listed read as closed.",
                "items": {
                  "properties": {
                    "closes": {
                      "description": "Such as \"17:30\" or \"5:30 PM\". \"24:00\" means midnight.",
                      "maxLength": 20,
                      "type": "string"
                    },
                    "days": {
                      "description": "Day names, \"weekdays\", \"weekends\" or a range like \"Monday-Friday\".",
                      "items": {
                        "maxLength": 30,
                        "type": "string"
                      },
                      "maxItems": 7,
                      "minItems": 1,
                      "type": "array"
                    },
                    "opens": {
                      "description": "Such as \"8:00\", \"8 AM\" or \"08:00\".",
                      "maxLength": 20,
                      "type": "string"
                    }
                  },
                  "required": ["closes", "days", "opens"],
                  "type": "object"
                },
                "maxItems": 14,
                "type": "array"
              },
              "images": {
                "items": {
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "latitude": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "logo": {
                "description": "Logo image URL.",
                "maxLength": 2048,
                "type": "string"
              },
              "longitude": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "menu_url": {
                "description": "Food businesses only.",
                "maxLength": 2048,
                "type": "string"
              },
              "name": {
                "description": "Business name as shown on the storefront, website and Google profile.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "open_24_7": {
                "description": "True when the business is open 24 hours every day. Overrides hours.",
                "type": "boolean"
              },
              "payment_accepted": {
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "postal_code": {
                "maxLength": 20,
                "type": "string"
              },
              "price_range": {
                "description": "Such as \"$$\" or \"$100-$300\". Under 100 characters.",
                "maxLength": 99,
                "type": "string"
              },
              "same_as": {
                "description": "Official profile URLs that identify the business: Google Business Profile, Facebook, LinkedIn, Yelp, Wikidata.",
                "items": {
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "schema_type": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "maxItems": 3,
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "An exact schema.org LocalBusiness subtype, or up to three, such as \"Plumber\". Overrides business_type."
              },
              "seasonal_closures": {
                "description": "Closed periods, dates as YYYY-MM-DD.",
                "items": {
                  "properties": {
                    "valid_from": {
                      "maxLength": 10,
                      "type": "string"
                    },
                    "valid_through": {
                      "maxLength": 10,
                      "type": "string"
                    }
                  },
                  "required": ["valid_from", "valid_through"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "serves_cuisine": {
                "description": "Food businesses only.",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "services": {
                "description": "Services offered, written as Offer items.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "street_address": {
                "maxLength": 200,
                "type": "string"
              },
              "telephone": {
                "description": "Primary customer phone number. North American numbers are written as +1-AAA-BBB-CCCC.",
                "maxLength": 40,
                "type": "string"
              },
              "url": {
                "description": "The business website or location page.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Generate LocalBusiness schema"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ebac8744c7b133ba7c2319c2627276e6ce5d819310d580ac500630a880c05262"
        },
        {
          "name": "validate_structured_data",
          "title": "Validate structured data",
          "description": "Validate pasted JSON-LD against the schema.org vocabulary (every type, property, domain, range and enumeration value) and Google's documented rules for LocalBusiness and Organization markup: required name and address, recommended properties, hh:mm:ss hours, 5 decimal coordinates, priceRange length, self-serving reviews, sameAs. Accepts one block, several blocks, or the script tags around them. Each issue cites its source. No network access.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "json_ld": {
                "description": "JSON-LD text. Script tags are stripped; several script blocks are each validated.",
                "maxLength": 200000,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["json_ld"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate structured data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9e0570666c3a1e0e5ed91eb750f8363c626f4f10900ad71f8588262a87c1c155"
        }
      ],
      "digest": "sha256:0d78e41e3d27cf5c7fd6d72f11eacaac840282ccd242e3ebd29ba0adada6f36e"
    }
  }
}
