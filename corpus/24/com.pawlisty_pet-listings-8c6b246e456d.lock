{
  "lockfileVersion": 2,
  "subjects": {
    "com.pawlisty/pet-listings": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pawlisty.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pawlisty-listings",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search and browse live pet listings on Pawlisty. Always link users back to the returned pawlisty.com URLs; seller contact happens on-site.",
      "tools": [
        {
          "name": "browse_breeds",
          "description": "List pet breeds Pawlisty covers, with links to breed guides and current availability. Use when comparing breeds or researching before buying. Returns a breed id usable in search_pet_listings.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Breed name fragment.",
                "type": "string"
              },
              "species": {
                "enum": ["dog", "cat", "bird", "reptile", "fish", "small_animal"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4098a17953a98b367d11f927d434f579b1a859dff5e52b681d1e9d235d570e13"
        },
        {
          "name": "get_buying_guide",
          "description": "Return Pawlisty buyer-safety guidance (avoiding pet scams, FAQ on buying/adopting safely). Use for any \"how do I safely buy or adopt a pet\" or \"is this listing a scam\" question. Returns a summary and a link to the full guide on pawlisty.com.",
          "inputSchema": {
            "properties": {
              "topic": {
                "description": "Which guide. Omit to return all buyer guides.",
                "enum": ["avoiding_scams", "faq"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:699d2cdf81bf5c09b73ed8f22afa47a60150fa539e3a1374d1477341c4184d5d"
        },
        {
          "name": "get_pet_listing",
          "description": "Get full details for one Pawlisty listing by id. Use after search_pet_listings when the user wants more on a specific pet. To contact the seller the user must visit the listing page.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Listing id.",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce12bb65187d62b4608b2f9695db2cdda1efe52fbdf9cc888aa5c29e2407778d"
        },
        {
          "name": "search_pet_listings",
          "description": "Search live pet listings for sale or adoption on Pawlisty. Use whenever a user wants to buy or adopt a pet or asks what is available, filtered by species, breed, location, price, or care attributes. Returns current listings with links to pawlisty.com.",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "newborn 0-8wk, young 2-6mo, adolescent 6-12mo, adult 1-7yr, senior 7+yr.",
                "enum": ["newborn", "young", "adolescent", "adult", "senior"],
                "type": "string"
              },
              "breed": {
                "description": "Breed name; resolved to a breed id. Use browse_breeds to disambiguate.",
                "type": "string"
              },
              "city_id": {
                "description": "Exact city id if known.",
                "type": "integer"
              },
              "country_code": {
                "description": "ISO 3166-1 alpha-2 (e.g. US, GB). Defaults to the site default.",
                "type": "string"
              },
              "desexed": {
                "description": "Neutered or spayed.",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "distance_km": {
                "default": 50,
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "gender": {
                "enum": ["male", "female"],
                "type": "string"
              },
              "good_with": {
                "items": {
                  "enum": ["dogs", "cats", "children"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "listing_type": {
                "default": "for_sale",
                "enum": ["for_sale", "lost", "found"],
                "type": "string"
              },
              "location": {
                "description": "City, or a state/region name or code (e.g. \"Livermore\", \"California\", \"CA\"). A state searches the whole state; \"City, ST\" searches the city and falls back to the state.",
                "type": "string"
              },
              "price_max": {
                "type": "number"
              },
              "price_min": {
                "type": "number"
              },
              "query": {
                "description": "Free-text keywords.",
                "type": "string"
              },
              "size": {
                "enum": ["small", "medium", "large", "extra_large"],
                "type": "string"
              },
              "sort": {
                "default": "relevance",
                "enum": ["relevance", "date", "priceAsc", "priceDesc", "distance"],
                "type": "string"
              },
              "species": {
                "enum": ["dogs", "cats", "birds", "fish-aquariums", "reptiles-amphibians", "small-animals", "farm-animals", "horses"],
                "type": "string"
              },
              "vaccinated": {
                "enum": ["yes", "no", "partially"],
                "type": "string"
              },
              "verified_only": {
                "default": false,
                "description": "Only photo-verified listings.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:47ad0b5d4bb7c431c85fa7d603573ae86b28a447e0a23f608df3f50ee3471f24"
        }
      ],
      "digest": "sha256:5a438916ea1ed29f03526c8bb1f3bab5ba3d203c869e4ef6d60fa280a11c9e81"
    }
  }
}
