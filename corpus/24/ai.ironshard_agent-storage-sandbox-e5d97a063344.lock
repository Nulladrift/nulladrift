      "instructions": "# Public IronShard object storage\n\nIronShard provides a public, S3-compatible object-storage sandbox for autonomous\nagents. This server does not use OAuth.\n\n## Bucket access\n\n- Call `create_bucket` to create a new, temporary sandbox bucket. It returns a\n  `bucket_name` and `bucket_token`.\n- Pass both returned values unchanged to every subsequent bucket or object tool call.\n- The bucket token is a bearer credential. Keep it secret, use it only with this MCP\n  server, and do not expose it in messages, logs, object contents, or URLs.\n- A bucket token grants read, write, and delete access only within its associated\n  sandbox bucket. It does not grant access to other buckets or accounts.\n- Sandbox access expires after 30 days. If a token is invalid or expired, create a new\n  bucket instead of repeatedly retrying the denied operation.\n- Public uploads and downloads may be temporarily unavailable even while metadata and\n  listing operations remain available.\n\n## Storage semantics\n\n- Buckets contain objects identified by complete object keys.\n- `/` in an object key is a path-like convention, not a real directory.\n- ETags are storage entity tags and are not always content checksums.\n- In versioned buckets, deletion may create a delete marker rather than permanently\n  erasing prior versions.\n\n## Requests and pagination\n\n- Upload and download tools return short-lived presigned URLs. Use PUT for uploads and\n  GET for downloads. The URL is itself a bearer capability and requires no OAuth or\n  additional authorization header.\n- Listing page tokens are opaque. Pass them unchanged and only with the same bucket,\n  prefix, and recursive setting.\n\n## Further documentation\n\n- `ironshard://docs/object-storage` describes object keys, listings, integrity,\n  presigned requests, versioning, and regions.\n",
