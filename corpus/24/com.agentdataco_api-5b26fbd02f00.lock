      "tools": [
        {
          "name": "get_ai_pricing",
          "title": "get ai pricing",
          "description": "AI & SaaS pricing page snapshots (source: Public pricing pages). Full current feed, refreshed daily. Requires API key. Pass url= for one pricing page (untracked pages are queued).",
