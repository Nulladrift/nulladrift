        {
          "name": "get_history",
          "title": "get history",
          "description": "Daily time series for ONE entity from the append-only archive (Starter: last 30 days, Pro: full archive). Max 90-day window per call (from..to); up to 90 rows per page, use nextCursor as `cursor` for the next page. No whole-feed dumps. Fair use: 200 (Starter) / 1,000 (Pro) history+trends calls per day per key; keys scanning many distinct entities/dates very fast are throttled for 1 hour (429). Bulk/full-archive access: data licence from $499/mo, hello@agentdataco.com. Requires API key.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "nextCursor from the previous page",
                "type": "string"
              },
              "entity": {
                "description": "owner/repo, MCP server name, OpenRouter model id, pricing page URL, \"model:<hf id>\", HN item id",
                "type": "string"
              },
              "feed": {
                "enum": ["github-ai-repos", "show-hn-ai", "mcp-servers", "hf-trending", "llm-pricing", "ai-pricing"],
                "type": "string"
              },
              "from": {
                "description": "YYYY-MM-DD (default: to minus 30 days)",
                "type": "string"
              },
              "limit": {
                "default": 31,
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "YYYY-MM-DD (default today); max 90 days after from",
                "type": "string"
              }
            },
            "required": ["entity", "feed"],
            "type": "object"
          },
