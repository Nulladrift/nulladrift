            "properties": {
              "limit": {
                "default": 50,
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Case-insensitive full-text filter",
                "type": "string"
              },
              "since": {
                "description": "ISO date; only rows created/updated on or after",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
