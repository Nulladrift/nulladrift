        {
          "name": "project_create",
          "title": "Create Spala Project",
          "description": "AUTH REQUIRED; WRITES TO THE SPALA CONTROL PLANE. Creates a real Spala project with the supplied project name in an accessible organization. Provisioning is asynchronous; the response reports the provisioning state, a retry interval, and a retry budget. Accepts an organization id when multiple organizations are available and automatically scopes a sole organization. This operation is not idempotent.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Create a real Spala project in an organization available to the authenticated user.",
            "properties": {
              "name": {
                "description": "Human-readable name for the new Spala project.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
