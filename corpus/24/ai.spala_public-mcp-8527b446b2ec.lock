          "name": "project_connect",
          "title": "Connect Spala Project",
          "description": "AUTH REQUIRED; IDEMPOTENT PROJECT CONNECTION WRITE. Prepares one accessible Spala project for agent access. Accepts one installer client (codex, roo, claude-code, cursor, a2a); when omitted, returns a client-selection response without executable arguments. Pending projects return project_provisioning with status 202 and retryAfterSeconds. Returns a client-specific workspace binding plan: protected one-time bootstrap for Codex, Roo, and Cursor; verifier-bound delegated bootstrap for Claude Code.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Provide exactly one project selector and a supported agentic workspace client (codex, roo, claude-code, or cursor) to receive executable installer argv.",
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "bootstrapChallenge": {
                    "description": "S256 challenge returned by project prepare. The verifier remains only in the local credential store.",
                    "pattern": "^[A-Za-z0-9_-]{43}$",
                    "type": "string"
                  },
                  "bootstrapRequestId": {
                    "description": "Non-secret local request ID returned by project prepare. Claude Code only.",
                    "pattern": "^claim_[A-Za-z0-9_-]{20,80}$",
                    "type": "string"
                  },
                  "client": {
                    "description": "Target MCP client for @spala-ai/mcp-install. Omit to receive client_selection_required without an executable mutation plan.",
                    "enum": ["codex", "roo", "claude-code", "cursor", "a2a"],
                    "type": "string"
                  },
                  "profile": {
                    "description": "Set to guided to preserve the compact build-and-test surface through project handoff. Omit for the default full compatibility surface.",
                    "enum": ["guided"],
                    "type": "string"
                  },
                  "projectId": {
                    "description": "Exact Spala project ID. Mutually exclusive with subdomain.",
                    "maxLength": 256,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["projectId"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "bootstrapChallenge": {
                    "description": "S256 challenge returned by project prepare. The verifier remains only in the local credential store.",
                    "pattern": "^[A-Za-z0-9_-]{43}$",
                    "type": "string"
                  },
                  "bootstrapRequestId": {
                    "description": "Non-secret local request ID returned by project prepare. Claude Code only.",
                    "pattern": "^claim_[A-Za-z0-9_-]{20,80}$",
                    "type": "string"
                  },
                  "client": {
                    "description": "Target MCP client for @spala-ai/mcp-install. Omit to receive client_selection_required without an executable mutation plan.",
                    "enum": ["codex", "roo", "claude-code", "cursor", "a2a"],
                    "type": "string"
                  },
                  "organizationId": {
                    "description": "Optional organization ID returned for the signed-in account.",
