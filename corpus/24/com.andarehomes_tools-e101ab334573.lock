      "serverInfo": {
        "name": "andare-homes-free-tools",
        "title": "Andare Homes free renovation tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free renovation tools for Toronto and Ontario homeowners from Andare Homes. Each tool returns the answer, its source and a link to the tool page and the free quote form. Preliminary planning only.",
      "tools": [
        {
          "name": "accessible-ramp-and-doorway-calculator",
          "title": "Accessible ramp and doorway calculator",
          "description": "Ramp length for a rise at the Ontario Building Code 1 in 12 gradient, a slope check, or a doorway clear width check, using Section 3.8. Preliminary planning only. Example: /api/tools/accessible-ramp-and-doorway-calculator?mode=len&units=mm&rise=600",
          "inputSchema": {
            "properties": {
              "door": {
                "description": "Which doorway (mode door): path = barrier-free path of travel; suite-wide = bathroom or bedroom door in a suite served by a corridor 1,060 mm or wider; suite-narrow = same, corridor narrower than 1,060 mm",
                "enum": ["path", "suite-wide", "suite-narrow"],
                "type": "string"
              },
              "mode": {
                "description": "len = ramp length needed for a rise (needs rise); slope = check an existing slope (needs rise and run); door = doorway clear width (needs width and door)",
                "enum": ["len", "slope", "door"],
                "type": "string"
              },
              "rise": {
                "description": "Total rise (modes len and slope) (units)",
                "type": "number"
              },
              "run": {
                "description": "Horizontal run (mode slope) (units)",
                "type": "number"
              },
              "units": {
                "description": "Units of rise, run and width",
                "enum": ["mm", "in"],
                "type": "string"
              },
              "width": {
                "description": "Clear width with the door open (mode door) (units)",
                "type": "number"
              }
            },
            "required": ["mode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0dad4830ae88773955072710aaf0c2c3df90bc3eadd658e0b722b381decc3a76"
        },
        {
          "name": "basement-ceiling-height-and-egress-checker",
          "title": "Basement ceiling height and egress checker",
          "description": "Tests basement ceiling height, height under beams and ducts, and stair headroom against Ontario Building Code Part 9, for a house basement or a secondary suite. Window sizes are tested by the egress window size calculator. Preliminary planning only. Example: /api/tools/basement-ceiling-height-and-egress-checker?units=mm&type=suite&ceiling=2000&obstruction=1900&stair=1980",
          "inputSchema": {
            "properties": {
              "bedroom": {
                "description": "house only: a bedroom is planned in the basement",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "bedroom_low": {
                "description": "house with bedroom only: lowest ceiling in the bedroom (units)",
                "type": "number"
              },
              "bedroom_share": {
                "description": "house with bedroom only: percent of the required bedroom floor area with a ceiling of 2,300 mm or more (%)",
                "type": "number"
              },
              "ceiling": {
                "description": "Finished ceiling height over the main part of the space, floor to underside of the finished ceiling (units)",
                "type": "number"
              },
              "obstruction": {
                "description": "Lowest clear height under a beam or duct (units)",
                "type": "number"
              },
              "share": {
                "description": "house only: percent of the basement floor area with a ceiling of 2,100 mm or more (default 100 when the ceiling is 2,100 mm or more, otherwise 0) (%)",
                "type": "number"
              },
              "stair": {
                "description": "Clear height over the basement stair, measured from the line through the tread nosings (units)",
                "type": "number"
              },
              "type": {
                "description": "house = basement of a house without a secondary suite; suite = secondary suite",
                "enum": ["house", "suite"],
                "type": "string"
              },
              "units": {
                "description": "Units of every height",
                "enum": ["mm", "in"],
                "type": "string"
              }
            },
            "required": ["ceiling", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52648d23035ad436b473f1fa7cf4ccff22b5aeb920dc3525674b83debc40728d"
        },
        {
          "name": "bathroom-exhaust-fan-calculator",
          "title": "Bathroom exhaust fan calculator",
          "description": "Minimum bathroom exhaust fan rating in CFM from room size, ceiling height and fixtures, using the Home Ventilating Institute guidance. Preliminary planning only. Example: /api/tools/bathroom-exhaust-fan-calculator?units=ft&length=8&width=10&height=8",
          "inputSchema": {
            "properties": {
              "fixtures": {
                "description": "Comma separated fixtures in the room; needed only when the room is over 100 sq ft",
                "type": "string"
              },
              "height": {
                "description": "Ceiling height (units)",
                "type": "number"
              },
              "length": {
                "description": "Room length (units)",
                "type": "number"
              },
              "units": {
                "description": "Units of length, width and height",
                "enum": ["ft", "m"],
                "type": "string"
              },
              "width": {
                "description": "Room width (units)",
                "type": "number"
              }
            },
            "required": ["length", "width"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9afa65fc4df5eea1b2ab6ecf0241c6bc7c69ddacddc72a12f1e5ea6bb01f404"
        },
        {
          "name": "deck-permit-and-guard-checker-toronto",
          "title": "Deck permit and guard checker for Toronto",
          "description": "Says whether a deck in Toronto needs a building permit, whether a guard is required, the minimum guard height, opening size and stair handrail rule, from the City of Toronto and Ontario Building Code Part 9. Preliminary planning only. Example: /api/tools/deck-permit-and-guard-checker-toronto?units=mm&height=900&attached=yes&roofed=no&exit=no&risers=4&guard_height=900&gap=90",
          "inputSchema": {
            "properties": {
              "attached": {
                "description": "The deck is attached to the house",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "exit": {
                "description": "The deck forms part of an exit required under the Building Code",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "gap": {
                "description": "Planned clear opening between pickets or balusters (units)",
                "type": "number"
              },
              "guard_height": {
                "description": "Planned guard height (units)",
                "type": "number"
              },
              "height": {
                "description": "Height of the finished deck surface above the adjacent finished grade (units)",
                "type": "number"
              },
              "risers": {
                "description": "Number of risers on the deck stairs (whole number)",
                "type": "number"
              },
              "roofed": {
                "description": "The deck has a roof",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "units": {
                "description": "Units of height, guard height and gap",
                "enum": ["mm", "in"],
                "type": "string"
              }
            },
            "required": ["attached", "exit", "height", "roofed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a63d9639ef276cc1c29a6c3fb5a4fc051fb2988a6fe51a82b0fa62dfb359bc69"
        },
        {
          "name": "egress-window-size-calculator",
          "title": "Egress window size calculator",
          "description": "Tests a bedroom escape window against Ontario Building Code Article 9.9.10.1: open area of at least 0.35 m2, no dimension under 380 mm, sill height and window well clearance. Preliminary planning only. Example: /api/tools/egress-window-size-calculator?units=mm&type=casement&width=600&height=700&floor=basement&well=yes&well_clearance=600",
          "inputSchema": {
            "properties": {
              "floor": {
                "description": "basement = window in a basement area; above = any other floor",
                "enum": ["basement", "above"],
                "type": "string"
              },
              "height": {
                "description": "Clear height of the unobstructed open portion with the window fully open (units)",
                "type": "number"
              },
              "sill": {
                "description": "Sill height above the floor (tested only when floor is above) (units)",
                "type": "number"
              },
              "type": {
                "description": "Window type",
                "enum": ["casement", "awning", "single-hung", "double-hung", "sliding", "hopper", "other"],
                "type": "string"
              },
              "units": {
                "description": "Units of width, height, sill and clearance",
                "enum": ["mm", "in"],
                "type": "string"
              },
              "well": {
                "description": "The window opens into a window well",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "well_clearance": {
                "description": "Clearance in front of the window inside the well (units)",
                "type": "number"
              },
              "width": {
                "description": "Clear width of the unobstructed open portion with the window fully open (units)",
                "type": "number"
              }
            },
            "required": ["floor", "height", "type", "width"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84153f87f6cc8572b38cc68655b030a9c354ca42411fa79962c7068657cb7e83"
        },
        {
          "name": "garden-suite-zoning-checker",
          "title": "Garden suite zoning checker",
          "description": "Checks height, separation, floor area, setbacks and lot coverage of a garden suite against Toronto By-law 849-2025. Preliminary planning only. Example: /api/tools/garden-suite-zoning-checker?zone=yes&laneway=no&lot_area=400&lot_depth=40&lot_frontage=10&house_gfa=180&house_footprint=90&ancillary_footprint=40&suite_height=4&separation=5&suite_gfa=50&rear_setback=2&side_setback=1.5&one_storey=yes&rear_openings=no&side_openings=yes",
          "inputSchema": {
            "properties": {
              "ancillary_footprint": {
                "description": "Footprint of all ancillary buildings together, including the suite (m2)",
                "type": "number"
              },
              "house_footprint": {
                "description": "House footprint (m2)",
                "type": "number"
              },
              "house_gfa": {
                "description": "House gross floor area, all floors (m2)",
                "type": "number"
              },
              "laneway": {
                "description": "Property abuts a public laneway",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "lot_area": {
                "description": "Lot area (m2)",
                "type": "number"
              },
              "lot_depth": {
                "description": "Lot depth (m)",
                "type": "number"
              },
              "lot_frontage": {
                "description": "Lot frontage (m)",
                "type": "number"
              },
              "one_storey": {
                "description": "Suite is one storey",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "rear_openings": {
                "description": "Rear lot line abuts a residential-zone lot and the rear wall has openings more than 4.0 m above grade",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "rear_setback": {
                "description": "Rear yard setback (m)",
                "type": "number"
              },
              "separation": {
                "description": "Distance from the main wall of the house (m)",
                "type": "number"
              },
              "side_openings": {
                "description": "Side wall facing a side lot line (not a street) has doors or windows",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "side_setback": {
                "description": "Smallest side yard setback (m)",
                "type": "number"
              },
              "suite_gfa": {
                "description": "Suite gross floor area, all floors including a basement (m2)",
                "type": "number"
              },
              "suite_height": {
                "description": "Suite height from average grade (m)",
                "type": "number"
              },
              "zone": {
                "description": "Property is in a residential zone (R, RD, RS, RT, RM)",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              }
            },
            "required": ["ancillary_footprint", "house_footprint", "house_gfa", "laneway", "lot_area", "lot_depth", "lot_frontage", "one_storey", "rear_openings", "rear_setback", "separation", "side_openings", "side_setback", "suite_gfa", "suite_height", "zone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:215da4ec8ce44cbe9bcb42ec642199cb9c7ec7d36ea5ee05410ba5698e5742f7"
        },
        {
          "name": "renovation-materials-calculator",
          "title": "Paint, drywall and flooring calculator",
          "description": "How much paint, how many drywall sheets or how many boxes of flooring a rectangular room needs, with an adjustable waste allowance. Quantities only. Preliminary planning only. Example: /api/tools/renovation-materials-calculator?material=paint&units=ft&length=12&width=10&height=8&openings=40&coats=2&coverage=350",
          "inputSchema": {
            "properties": {
              "box_coverage": {
                "description": "Coverage printed on one box of flooring (floor) (sq ft or m2)",
                "type": "number"
              },
              "ceiling": {
                "description": "Include the ceiling (paint and drywall)",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "coats": {
                "description": "Number of coats (paint)",
                "type": "number"
              },
              "coverage": {
                "description": "Coverage printed on the paint can (paint) (sq ft per gallon or m2 per litre)",
                "type": "number"
              },
              "height": {
                "description": "Ceiling height (paint and drywall) (units)",
                "type": "number"
              },
              "length": {
                "description": "Room length (units)",
                "type": "number"
              },
              "material": {
                "description": "What to calculate",
                "enum": ["paint", "drywall", "floor"],
                "type": "string"
              },
              "openings": {
                "description": "Doors and windows to subtract (paint and drywall) (area in sq ft or m2)",
                "type": "number"
              },
              "sheet": {
                "description": "Drywall sheet length in feet, 4 ft wide (drywall)",
                "enum": ["8", "10", "12"],
                "type": "string"
              },
              "units": {
                "description": "ft = feet, sq ft and gallons; m = metres, m2 and litres",
                "enum": ["ft", "m"],
                "type": "string"
              },
              "waste": {
                "description": "Waste allowance in percent (drywall and floor) (%)",
                "type": "number"
              },
              "width": {
                "description": "Room width (units)",
                "type": "number"
              }
            },
            "required": ["length", "material", "width"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
