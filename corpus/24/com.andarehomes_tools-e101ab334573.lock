          "digest": "sha256:9ac601d907f39c88d8fc78b7bedf2e52b35d58951125225263893480a3a03c0e"
        },
        {
          "name": "second-suite-requirements-checklist",
          "title": "Second suite requirements checklist",
          "description": "A checklist of Ontario Building Code, Planning Act, Fire Code and City of Toronto items to check before adding a secondary suite to a house, each with its section number. Preliminary planning only. Example: /api/tools/second-suite-requirements-checklist?building=detached&smaller=yes&units_now=1&location=basement&fuel=yes&parking=one&rental=yes",
          "inputSchema": {
            "properties": {
              "building": {
                "description": "Existing building type",
                "enum": ["detached", "semi", "row", "other"],
                "type": "string"
              },
              "fuel": {
                "description": "A fuel-burning appliance, flue, fireplace or attached garage is in or next to the suite",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "location": {
                "description": "Where the suite will be",
                "enum": ["basement", "above", "addition"],
                "type": "string"
              },
              "parking": {
                "description": "Parking spaces available for the suite",
                "enum": ["none", "one", "more"],
                "type": "string"
              },
              "rental": {
                "description": "The suite will be rented",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "smaller": {
                "description": "The new unit will be smaller than the main unit",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "units_now": {
                "description": "Dwelling units in the house now",
                "enum": ["1", "2"],
                "type": "string"
              }
            },
            "required": ["building", "fuel", "location", "parking", "rental", "smaller", "units_now"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf62cc8c2fc6dda4965bad1d8e87141078b0a22dfbe4ebc0a3f50ecc90d852d7"
        },
        {
          "name": "stair-calculator-ontario",
          "title": "Stair calculator for Ontario",
          "description": "Gives the number of risers allowed for a total rise, the rise and run of each option, and tests headroom and width against Ontario Building Code Part 9 Section 9.8. Preliminary planning only. Example: /api/tools/stair-calculator-ontario?units=mm&type=private&rise=2600&run=3500&headroom=1980&width=900",
          "inputSchema": {
            "properties": {
              "headroom": {
                "description": "Clear height over the stair (units)",
                "type": "number"
              },
              "rise": {
                "description": "Total rise from finished floor to finished floor (units)",
                "type": "number"
              },
              "run": {
                "description": "Total horizontal run available (units)",
                "type": "number"
              },
              "type": {
                "description": "private = stairs inside or outside a house or dwelling unit; public = public stairs in a residential building",
                "enum": ["private", "public"],
                "type": "string"
              },
              "units": {
                "description": "Units of rise, run, headroom and width",
                "enum": ["mm", "in"],
                "type": "string"
              },
              "width": {
                "description": "Stair width (units)",
                "type": "number"
              }
            },
            "required": ["rise"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
