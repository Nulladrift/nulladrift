        {
          "name": "toronto-building-permit-checker",
          "title": "Toronto building permit checker",
          "description": "Says whether a project in Toronto needs a building permit, usually does not, or depends, with the City source for the answer. Preliminary planning only. Example: /api/tools/toronto-building-permit-checker?project=deck&h=high&att=yes&exit=no",
          "inputSchema": {
            "properties": {
              "att": {
                "description": "deck: Will the deck be attached to the house? | shed: Will it be attached to a house, garage or any other structure?",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "bt": {
                "description": "opening: What kind of building is it?",
                "enum": ["house", "other"],
                "type": "string"
              },
              "chg": {
                "description": "opening: Will the work affect the structural support or create a new exit?",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "exit": {
                "description": "deck: Will it have a roof, or will it be part of a required exit from the house?",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "h": {
                "description": "deck: How high will the finished deck level be above the adjacent finished grade?",
                "enum": ["low", "high", "unsure"],
                "type": "string"
              },
              "ht": {
                "description": "fence: How tall will it be?",
                "enum": ["t12", "t20", "over"],
                "type": "string"
              },
              "kind": {
                "description": "opening: What is the work? | plumbing: What is the plumbing work?",
                "enum": ["new", "repl", "add", "valve"],
                "type": "string"
              },
              "lb": {
                "description": "wall: Is the wall load bearing?",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "mech": {
                "description": "basement: Will it include new plumbing or heating work?",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "plumb": {
                "description": "kitchen: Will you add or move plumbing, such as relocating a sink, shower, tub, toilet or drain? | shed: Will it have plumbing?",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "pool": {
                "description": "fence: Is the fence a swimming pool enclosure?",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "project": {
                "description": "What is being built",
                "enum": ["basement", "deck", "wall", "opening", "kitchen", "plumbing", "shed", "roofing", "fence"],
                "type": "string"
              },
              "scope": {
                "description": "kitchen: Is the work limited to replacing cabinets, counters, finishes and fixtures in the same locations?",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "size": {
                "description": "shed: What is the gross floor area?",
                "enum": ["small", "exact", "big"],
                "type": "string"
              },
              "struct": {
                "description": "basement: Will it include structural or material alterations, such as adding or removing walls, excavation, underpinning or a new basement entrance? | roofing: Will the work include any structural repair, such as replacing rafters, trusses or framing, or changing the roof shape?",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "suite": {
                "description": "basement: Will the work create a second suite or any additional dwelling unit?",
                "enum": ["yes", "no"],
                "type": "string"
              },
