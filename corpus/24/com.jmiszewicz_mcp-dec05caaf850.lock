        {
          "name": "estimateWebsite",
          "title": "Wycena strony",
          "description": "Orientacyjna wycena w modelu jmiszewicz (lustro konfiguratora https://jmiszewicz.com/oferta/). Tylko liczy - nic nie zapisuje i nie wysyła. Zwraca widełki PLN netto, pozycje, zawartość pakietu (includes), a gdy format nie jest podany - rekomendację z uzasadnieniem (reason). Formaty: start (Strona na start: 1 strona), firmowa i marka (do 5 stron w cenie, ze stroną główną; każda kolejna +350 zł) - do pakietów doliczane moduły (moduł zawarty w pakiecie nie jest doliczany); landing (od 700 zł) i ewizytowka (wizytówka cyfrowa, od 300 zł) - cena „od\", BEZ modułów; narzedzie = strona funkcyjna (kalkulator/kreator/konfigurator; moduły jako elementy, wycena indywidualna); odoo = strona lub sklep na Odoo (wycena indywidualna, BEZ modułów, licencje Odoo po stronie klienta). Liczbę stron podaj w pages - strony ponad pakiet policzą się same.",
          "inputSchema": {
            "properties": {
              "extraPages": {
                "description": "Liczba stron ponad pakiet - 350 zł netto za każdą. Zwykle zbędne: wystarczy pages. Podane jawnie ma pierwszeństwo przed pages.",
                "minimum": 0,
                "type": "integer"
              },
              "modules": {
                "description": "Moduły dodatkowe. Przy pakietach doliczane do ceny: podstrony (+350 za każdą stronę ponad pakiet - wystarczy podać pages), copy (+800), logo (+1500), sklep (+3500), integracje (+1200), seo = widoczność w Google+ (+900), migracja (+500), ai (+700). Moduł zawarty w pakiecie nie jest doliczany (firmowa: ai; marka: ai, logo, seo). Przy narzedzie moduły są tylko elementami do wyceny (nie sumują). landing, ewizytowka i odoo modułów nie przyjmują.",
                "items": {
                  "enum": ["podstrony", "copy", "logo", "sklep", "integracje", "seo", "migracja", "ai"],
                  "type": "string"
                },
                "type": "array"
              },
              "package": {
                "description": "Format bazowy: start (Strona na start: 1 dopracowana strona, od 2000 zł), firmowa (do 5 stron ze stroną główną + blog + widoczność w Google w Twoim mieście + przygotowanie pod AI, od 4600 zł, najczęściej wybierany), marka (logo + identyfikacja + strona na miarę do 5 stron + widoczność rozszerzona + przygotowanie pod AI, od 7300 zł), landing (jedna skupiona strona pod jedną akcję, od 700 zł, bez modułów), ewizytowka (wizytówka cyfrowa: QR/link/karta NFC, kontakt, sociale, kolejne ekrany z filmem lub galerią, od 300 zł, bez modułów), narzedzie (strona funkcyjna; wycena indywidualna), odoo (strona lub sklep internetowy na Odoo; wycena indywidualna, bez modułów). Pominięty → rekomendacja automatyczna (spośród pakietów) z uzasadnieniem.",
                "enum": ["start", "firmowa", "marka", "landing", "ewizytowka", "narzedzie", "odoo"],
                "type": "string"
              },
              "pages": {
                "description": "Łączna liczba stron serwisu, ze stroną główną (blog = 1 strona, niezależnie od liczby wpisów). Przy pakietach strony ponad limit (start: 1, firmowa i marka: 5) są doliczane po 350 zł netto; bez package służy też do rekomendacji.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
