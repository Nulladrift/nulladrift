      "instructions": "Serwer pracowni jmiszewicz (Jakub Miszewicz): strony internetowe, sklepy (także na Odoo) i wizytówki cyfrowe dla firm; Poznań i Wielkopolska - na miejscu; cała Polska - zdalnie. estimateWebsite liczy orientacyjną wycenę (PLN netto) - bez skutków ubocznych. createProjectBrief porządkuje dane z rozmowy w brief - bez skutków ubocznych i bez zgody. submitInquiry WYSYŁA e-mail do wykonawcy: najpierw wywołaj z dryRun: true (podgląd), pokaż go użytkownikowi i dopiero po jego wyraźnej zgodzie na tę wysyłkę wywołaj z userConsent: true.",
