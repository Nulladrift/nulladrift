{
  "lockfileVersion": 2,
  "subjects": {
    "com.profullstack/obscura": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://obscura.openmcp.logicsrc.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "obscura",
        "version": "0.2.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "fetch_page gets a public web page through a stealth headless browser. Ask for markdown to read it, links to navigate, original for feeds.",
      "tools": [
        {
          "name": "fetch_page",
          "title": "Fetch Web Page",
          "description": "Fetch a public web page through Obscura, a stealth headless browser that renders JavaScript and presents Chrome's TLS fingerprint, so pages that answer curl with 403 usually answer this. Returns the page as markdown (default), plain text, its links, the rendered HTML, or the original bytes. No credential needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "description": "markdown (default) for reading; text for a plain dump; links for every href; html for the rendered DOM (large); original for the raw response body, best for feeds and XML.",
                "enum": ["markdown", "text", "html", "links", "original"],
                "type": "string"
              },
              "max_chars": {
                "description": "Cut the answer to this many characters. Default 200000.",
                "minimum": 1000,
                "type": "integer"
              },
              "stealth": {
                "description": "Chrome 145 TLS fingerprint and tracker blocking. Default true.",
                "type": "boolean"
              },
              "timeout_seconds": {
                "description": "Navigation timeout. Default 30, at most 60.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "url": {
                "description": "The page, http or https, on a public host.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e59b76a1cdde4ae7f932aac43136260e0ef1cd163da7af70ac6cb9477cf871af"
        }
      ],
      "digest": "sha256:ff653f1fc366fe8f2948ae803cb10d340c7981bc48246930a29c1093a98e4f31"
    }
  }
}
