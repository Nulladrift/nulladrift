                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "multi_city_json": {
                "description": "Multi-city itinerary (required when type=3): a JSON-string array of legs, e.g. '[{\"departure_id\":\"CDG\",\"arrival_id\":\"NRT\",\"date\":\"2026-06-27\"},{\"departure_id\":\"NRT\",\"arrival_id\":\"LAX\",\"date\":\"2026-07-03\"}]'. Each leg may include an optional \"times\" field (same format as outbound_times).",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "outbound_date": {
                "description": "Outbound date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "outbound_times": {
                "description": "Outbound time window as comma-separated hours (0-23). 2 values = departure range 'min,max' (e.g. '4,18'); 4 values add an arrival range (e.g. '4,18,3,19').",
                "type": "string"
              },
              "return_date": {
                "description": "Return date, YYYY-MM-DD. Required when type=1 (round trip).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "return_times": {
                "description": "Return time window, same format as outbound_times. Only valid when type=1.",
                "type": "string"
              },
              "show_hidden": {
                "description": "Include hidden flight results. Default false.",
                "type": "boolean"
              },
              "sort_by": {
                "description": "Sort order: 1 = top flights (default), 2 = price, 3 = departure time, 4 = arrival time, 5 = duration, 6 = emissions.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "stops": {
                "description": "Max stops: 0 = any (default), 1 = nonstop only, 2 = 1 stop or fewer, 3 = 2 stops or fewer. When stops=1 finds no nonstop flight, the server automatically retries without the filter and returns connecting flights with a `note`; send a departure_token/booking_token from those with the same params but no stops.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "travel_class": {
                "description": "Travel class: 1 = economy (default), 2 = premium economy, 3 = business, 4 = first.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
