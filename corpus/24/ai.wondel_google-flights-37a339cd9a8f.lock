        {
          "name": "google_flights_search",
          "title": "Search Google Flights (SerpAPI)",
          "description": "Search Google Flights live via SerpAPI. Returns best_flights and other_flights (each with legs, airlines, times, duration, layovers, price and carbon emissions), plus price_insights and airport info. Supports round trip (type=1, needs return_date), one way (type=2) and multi-city (type=3 via multi_city_json). Two-step flows: pass a departure_token from a prior result to get the returning flights / next leg, or a booking_token to get booking options — re-send the original search params alongside either token. Prices are in `currency` (default USD). IDs are AIRPORT codes, never city/metro codes: TYO, NYC, LON, PAR, MIL, ROM, OSA, CHI, WAS return NO results (live-verified) — send the airports instead (TYO → 'HND,NRT'; NYC → 'JFK,EWR,LGA'; LON → 'LHR,LGW,STN,LTN'; PAR → 'CDG,ORY'; MIL → 'MXP,LIN,BGY'; ROM → 'FCO,CIA') or the city's Google kgmid (e.g. '/m/07dfk' for Tokyo). Result shape: { note?, source, fetchedAt, query, search_metadata: { google_flights_url }, search_parameters, best_flights: [...], other_flights: [...], price_insights, airports } — the two itinerary lists are `best_flights` and `other_flights` (there is no `flights` or `deals` key at the top level, and an itinerary is never a bare flight). Each itinerary: { flights: [{ departure_airport: { name, id, time }, arrival_airport: { name, id, time }, duration, airplane, airline, airline_logo, travel_class, flight_number, legroom, extensions }], layovers: [{ duration, name, id, overnight }], total_duration, carbon_emissions, price, type, airline_logo, departure_token, booking_token } — `price` is the whole-itinerary price in `currency`, `duration`/`total_duration` are minutes, and the per-leg times are local 'YYYY-MM-DD HH:MM' strings. Feed `departure_token` back for the return leg and `booking_token` for booking options. A top-level `note` appears only when stops=1 found no nonstop flight and the server retried without the stop filter: the itineraries are then connecting flights, and their tokens need the same params re-sent without `stops` — tell the user that no direct flights were found and connecting flights are shown.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Number of adults. Default 1.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "arrival_id": {
                "description": "Arrival AIRPORT IATA code(s) (e.g. 'HND,NRT') or a Google location kgmid (e.g. '/m/07dfk' for Tokyo). Comma-separate multiple. NOT a city/metro code — TYO, LON, PAR, MIL, ROM, OSA return no results; list the airports instead.",
                "type": "string"
              },
              "bags": {
                "description": "Number of carry-on bags. Default 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "booking_token": {
                "description": "Token from a prior result, used to fetch booking options for a selected itinerary. Re-send the same search params alongside it. Mutually exclusive with departure_token.",
                "type": "string"
              },
              "children": {
                "description": "Number of children. Default 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "currency": {
                "description": "Currency of returned prices (ISO code, e.g. 'USD', 'EUR'). Default USD.",
                "type": "string"
              },
              "deep_search": {
                "description": "Run a deeper search that matches the Google Flights browser results more closely (slower). Default false.",
                "type": "boolean"
              },
              "departure_id": {
                "description": "Departure AIRPORT IATA code(s) (3-letter, uppercase, e.g. 'WAW' or 'WAW,WMI') or a Google location kgmid (/m/… or /g/…). Comma-separate multiple. NOT a city/metro code — TYO, NYC, LON, PAR, MIL, ROM return no results; list the airports instead (NYC → 'JFK,EWR,LGA'). Used for type 1/2; for multi-city (type 3) use multi_city_json instead.",
                "type": "string"
              },
              "departure_token": {
                "description": "Token from a prior result, used to select an outbound flight and fetch the returning flights (round trip) or the next leg (multi-city). Re-send the same search params alongside it. Mutually exclusive with booking_token.",
                "type": "string"
              },
              "emissions": {
                "description": "Emissions filter: 1 = less emissions only. Omit for no filter.",
                "maximum": 1,
                "minimum": 1,
                "type": "integer"
              },
              "exclude_airlines": {
                "description": "Exclude these airlines: comma-separated 2-letter IATA codes, or an alliance (STAR_ALLIANCE, SKYTEAM, ONEWORLD). Mutually exclusive with include_airlines.",
                "type": "string"
              },
              "exclude_basic": {
                "description": "Exclude basic-economy fares. Only for domestic US flights with travel_class=1. Default false.",
                "type": "boolean"
              },
              "exclude_conns": {
                "description": "Connecting airports to exclude: comma-separated 3-letter IATA codes (e.g. 'CDG,LHR').",
