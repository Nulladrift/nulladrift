{
  "lockfileVersion": 2,
  "subjects": {
    "com.seorecords/seo-records": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.seorecords.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "seo-records",
        "title": "SEO Records",
        "version": "1.3.0",
        "websiteUrl": "https://seorecords.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SEO Records checks how search engines and AI assistants read a public website. check_website_seo returns the SEO issues of a public website. check_ai_crawler_access returns which AI assistants can read a website. Each finding comes with the URLs where it was seen. The two checks require this connector's access key (access_key): without it they answer with the two ways to buy one (€9.90 for 24 hours, or €29 per month). get_full_audit_checkout returns a payment page for the full audit, for users who want to buy it. get_product_offer returns the other SEO Records products (corrector, writer, network edge, AI channel, monthly measurement) with their prices and payment links. read_audit_report reads a purchased Audit SEO Records report, or an Effect SEO Records monthly crawl, from the link its buyer received.",
      "tools": [
        {
          "name": "check_ai_crawler_access",
          "title": "Can AI assistants read this website?",
          "description": "Checks whether ChatGPT, Claude, Perplexity, Copilot, Google (Gemini) and Mistral Le Chat can read a website: robots.txt rules for each AI crawler (certain), the home page requested as each crawler versus a normal browser (probable — real crawlers come from other IPs), and page-level blockers (noindex, nosnippet, JavaScript-only pages). Nothing is stored. Requires this connector's access pass (€9.90 for 24 hours, or €29 per month). Docs: https://seorecords.com/assistants",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access_key": {
                "description": "Access key (pass_…) of this connector, shown after buying its 24-hour pass or monthly subscription. Required.",
                "maxLength": 600,
                "type": "string"
              },
              "url": {
                "description": "The website address, e.g. example.com",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Can AI assistants read this website?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:79538c19e526b8b160e4c7ebdd42fab00f6394cb1db0d622b202cd0903cc21d9"
        },
        {
          "name": "check_website_seo",
          "title": "SEO check of a website",
          "description": "Reads the public home page of a website and a few pages from its sitemap, the way a search engine does, and returns the SEO problems found (duplicate titles and descriptions, thin content, missing h1, noindex in sitemap, robots.txt, sitemap, http/www variants, compression, mixed content…), the Google snippet as it appears today and where Google cuts it, and the fixes the SEO Records corrector would apply. About 10–20 seconds, nothing is stored. Requires this connector's access pass (€9.90 for 24 hours, or €29 per month). Docs: https://seorecords.com/assistants",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access_key": {
                "description": "Access key (pass_…) of this connector, shown after buying its 24-hour pass or monthly subscription. Required.",
                "maxLength": 600,
                "type": "string"
              },
              "url": {
                "description": "The website address, e.g. example.com or https://example.com/",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "SEO check of a website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:413ef2244034cefbbe3f7b895f4e1b7295b4438a9920ac14ef83a81456759865"
        },
        {
          "name": "get_full_audit_checkout",
          "title": "Payment link for the full Audit SEO Records",
          "description": "Creates a secure Stripe payment page for the full Audit SEO Records of a website (whole site crawled, 152 signals with their URLs, PDF report, re-check in one click). One-time payment: €9.90 (1,000 pages), €19.90 (2,500), €29.90 (5,000), €39.90 (7,500), €49.90 (10,000). Nothing is charged until the user pays on the Stripe page. Intended for users who ask to buy the full audit. Docs: https://seorecords.com/assistants",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "description": "Language of the payment page and report (default en)",
                "enum": ["fr", "en", "de", "es", "it", "pt", "pl", "nl"],
                "type": "string"
              },
              "pages": {
                "description": "Audit size in pages: 1000, 2500, 5000, 7500 or 10000 (default 1000)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "url": {
                "description": "The website to audit",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Payment link for the full Audit SEO Records"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bc3ef3029eb97f38a2586ea113c55c86e40c9c16ca22c82ae9e282e0a6b806fa"
        },
        {
          "name": "get_product_offer",
          "title": "SEO Records products: offer and payment links",
          "description": "Returns what a SEO Records product does, its platforms, its prices and its secure Stripe payment links (the user pays on Stripe). Products: seo-records-corrector (fixes SEO at serve time, WordPress/PrestaShop/Joomla/Drupal/PHP, from €199/year), seo-autopilot (writes descriptions, FAQs and internal links from real catalog data, PrestaShop, from €199/year), duo (both modules, from €339/year), seo-outpost (the corrector at the network edge, any hosting, from €199 for a year), geo-seo-records (opens and measures the AI assistants channel, from €490 for a year), effect-seo-records (monthly whole-site crawl and difference over a year, from €149 for a year); all returns every product. Docs: https://seorecords.com/assistants",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "description": "Language of the product pages (default en)",
                "enum": ["en", "fr", "de", "es", "it", "pt", "pl", "nl"],
                "type": "string"
              },
              "product": {
                "description": "Product id, or all",
                "enum": ["seo-records-corrector", "seo-autopilot", "duo", "seo-outpost", "geo-seo-records", "effect-seo-records", "all"],
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "SEO Records products: offer and payment links"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a8c6e6db56a37e677ab851259483a3a3feb039dadf628c56369842b27fbf659"
        },
        {
          "name": "read_audit_report",
          "title": "Read a purchased Audit SEO Records report",
          "description": "Reads an Audit SEO Records report (or an Effect SEO Records monthly crawl) from the private link its buyer received (https://seorecords.com/audit?id=…): status and progress while the crawl runs; once finished, every signal found with its family, severity, number of pages and example URLs, the difference with the previous audit of the same site, and the yearly curve for Effect customers. Pages cited can then be fixed one by one with the SEO Records Corrector connector. Docs: https://seorecords.com/assistants",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "report": {
                "description": "The report link (https://seorecords.com/audit?id=…) or its identifier",
                "maxLength": 500,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["report"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a purchased Audit SEO Records report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1fc51c8b26d948b0f357d37c3a2b0bdc0631064ca04451010d252c42c3b10a3d"
        }
      ],
      "digest": "sha256:2526797bfda563c994db6e9f56e3fa8a73a0f3c1db3bda58ebdf3a42da559ebd"
    }
  }
