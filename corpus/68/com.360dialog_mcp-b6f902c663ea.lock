      "instructions": "360Dialog MCP Server exposes 360Dialog Hub, Meta Business Agent, and Sandbox tools for managing accounts, phone numbers/channels,\ntemplates, balance, diagnostics, sandbox messaging, and configuring Meta Business Agent. It also exposes inbox tools, which can be used by clients on the premium plan.\n\nKey rules:\n- Use 'list_skills' to find workflows that can help assist the user with their question or issue.\n- Use documentation tools for WhatsApp API and WhatsApp Business Platform questions.\n- Use 'get_self' first to identify the logged-in user, account scope, client ID, partner ID, and permissions.\n- Use 'inbox_list_inboxes' to see if the user has access to any inboxes.\nIf the user does not have an inbox, all other inbox tool calls will fail.\n- Use 'list_channels' to find onboarded phone numbers/channels and their client, partner, WABA, project, and channel IDs.\n- The user is logged into one account at a time and can only act within that account. Partners can manage client channels; clients can manage only their own channels.\n- Payment responsibility depends on partner setup: direct-paid clients pay invoices/top up balance themselves; partner-paid clients rely on the partner to handle invoices and balance.\n- Sandbox is separate from Hub. Users can register a personal number and send test messages from the sandbox WhatsApp account; sandbox numbers only work with 'sandbox_' tools.\n- Meta Business Agent is set up per-channel/phone number. Tools starting with 'mba_' are dedicated to the Meta Business Agent.",
      "tools": [
        {
          "name": "block_users",
          "title": "Block users",
          "description": "Block WhatsApp users from messaging a channel.\n\nIdentify each user by phone number or by BSUID; pass at least one of 'phone_numbers' and 'user_ids'.\n\nOnly a business can block users who recently messaged it, so some users can fail. The result lists which succeeded and which failed with the reason.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel_id": {
                "description": "Needs to end with 'CH'.",
                "maxLength": 8,
                "minLength": 8,
                "pattern": "(?i)^[a-z0-9]+ch$",
                "type": "string"
              },
              "phone_numbers": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Phone numbers of the WhatsApp users to block, in international format without '+' or spaces, for example ['49100100200']."
              },
              "user_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Business-scoped user IDs (BSUIDs) of the WhatsApp users to block, for users whose phone number isn't known. 'list_blocked_users' shows each blocked user's BSUID."
              }
            },
            "required": ["channel_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "channel_id": {
                "type": "string"
              },
              "failed": {
                "items": {
                  "properties": {
                    "input": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null
                    },
                    "reasons": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["reasons"],
                  "type": "object"
                },
                "type": "array"
              },
              "succeeded": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["channel_id", "failed", "succeeded"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Block users"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": ["client"]
            }
          },
          "digest": "sha256:3070e4c32d2ecc89c7cc6f8741d11ef30bc91c9856db68bb861bd8dda4ba8073"
        },
        {
          "name": "change_user_role",
          "title": "Change user role",
          "description": "Change the role of an existing user of the account. Users cannot change their own role.\n\nClient users change users of their own client account, partner users users of the partner account.\n\nThe user may be prompted by 360Dialog for an OTP code delivered to their email address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "role": {
                "description": "New role. 'partner-owner' or 'partner-member' on a partner account, 'client-owner' or 'client-member' on a client account.",
                "enum": ["partner-owner", "partner-member", "client-owner", "client-member"],
                "type": "string"
              },
              "user_id": {
                "description": "Needs to end with 'U'. Use 'list_users' to find a user's ID.",
                "maxLength": 7,
                "minLength": 7,
                "pattern": "(?i)^[a-z0-9]+u$",
                "type": "string"
              }
            },
            "required": ["role", "user_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "account": {
                "type": "string"
              },
              "changed": {
                "type": "boolean"
              },
              "message": {
                "type": "string"
              },
              "role": {
                "type": "string"
              },
              "user_id": {
                "type": "string"
              }
            },
            "required": ["account", "changed", "message", "role", "user_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change user role"
          },
          "behavior": {
            "destructive": true,
