        {
          "name": "mba_update_ui_skill",
          "title": "Update a UI skill",
          "description": "Change the title, the status or the instruction of one UI skill by its id. This is a partial update: a field you omit keeps its stored value. Use it to enable or disable a component without deleting it. A UI skill is NOT an agent skill (mba_list_agent_skills): an agent skill is instruction text that shapes what the agent says, a UI skill lets the agent send one kind of rich WhatsApp component and tells it when to send that component. Known limitation: component_type and flow_id cannot be changed - delete the UI skill and create a new one instead. A flow UI skill cannot be enabled until its flow is published.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "instruction": {
                "description": "Tells the agent when to send this component, e.g. 'Send this when the customer asks to browse the catalog'.",
                "type": "string"
              },
              "instruction_id": {
                "description": "UI skill id.",
                "type": "string"
              },
              "status": {
                "description": "Whether the agent may send this component. Only an enabled UI skill is available to the agent.",
                "enum": ["enabled", "disabled"],
                "type": "string"
              },
              "title": {
                "description": "Human-readable name for the UI skill.",
                "type": "string"
              }
            },
            "required": ["app_id", "instruction_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "A single UI skill",
            "properties": {
              "component_type": {
                "description": "The type of rich message this UI skill sends. Known values: carousel_quick_reply, carousel_url, cta_url, flow, image, interactive_list, interactive_reply_buttons, location, location_request.",
                "type": ["string", "null"]
              },
              "created_at": {
                "description": "The timestamp when the UI skill was created",
                "type": ["integer", "null"]
              },
              "flow_id": {
                "description": "The identifier of the associated flow. Only present for flow skills",
                "type": ["integer", "null"]
              },
              "id": {
                "description": "A unique identifier for the UI skill",
                "type": ["string", "null"]
              },
              "instruction": {
                "description": "A description telling the AI agent when to send this UI skill",
                "type": ["string", "null"]
              },
              "status": {
                "description": "Whether this UI skill is enabled and available to the AI agent. Known values: disabled, enabled.",
                "type": ["string", "null"]
              },
              "title": {
                "description": "A human-readable name for the UI skill",
                "type": ["string", "null"]
              },
              "updated_at": {
                "description": "The timestamp when the UI skill was last updated",
                "type": ["integer", "null"]
              }
            },
            "type": "object"
