        {
          "name": "mba_get_eval_results",
          "title": "Read evaluation results",
          "description": "Read an evaluation job by its job_id. While the job runs this gives the status (QUEUED or RUNNING) and the progress. When the job fails it gives the error. When the job completes it gives the aggregated report: the summary text, the average conversation and turn scores, the highlights and the top failure categories. There is no separate summary call: a completed job already carries that report. For the per-conversation transcripts and per-turn labels, take the ids from `eval_ids_by_score` and call mba_get_eval_details. This tool adds a `details` key when it can read those ids for you.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "job_id": {
                "description": "Job id returned by start_eval_run.",
                "type": "string"
              }
            },
            "required": ["app_id", "job_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Current job status and results (if completed)",
            "properties": {
              "details": {
                "description": "The details of each conversation. Only a COMPLETED job has them.",
                "properties": {
                  "evaluations": {
                    "description": "List of evaluation results",
                    "items": {
                      "description": "A per-conversation evaluation result",
                      "properties": {
                        "creation_time": {
                          "description": "Unix timestamp when the evaluation was created",
                          "type": ["integer", "null"]
                        },
                        "custom_success_criteria": {
                          "description": "JSON array of client-specified success criteria strings",
                          "type": ["string", "null"]
                        },
                        "eval_case_id": {
                          "description": "ID of the eval case that defined the scenario and success criteria",
                          "type": ["string", "null"]
                        },
                        "id": {
                          "description": "The evaluation ID",
                          "type": ["string", "null"]
                        },
                        "per_turn_labels": {
                          "description": "JSON array of per-turn label integers",
                          "type": ["string", "null"]
                        },
                        "reasons": {
                          "description": "JSON array of {category, score, description, recommended_actions} objects",
                          "type": ["string", "null"]
                        },
                        "score": {
                          "description": "Overall evaluation score from the judge LLM",
                          "type": ["integer", "null"]
                        },
                        "transcript": {
                          "description": "JSON object with system_prompt and transcript_turns for the evaluated conversation",
                          "type": ["string", "null"]
                        },
                        "update_time": {
                          "description": "Unix timestamp when the evaluation was last updated",
                          "type": ["integer", "null"]
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "type": ["array", "null"],
                    "uniqueItems": false
                  }
                },
                "type": ["object", "null"]
              },
              "error": {
                "description": "Error details when status is FAILED",
                "properties": {
                  "code": {
                    "description": "Error code (e.g. SIMULATION_FAILED)",
                    "type": ["string", "null"]
                  },
                  "failed_case_ids": {
                    "description": "IDs of cases that failed",
                    "items": {
                      "type": ["string", "null"]
                    },
                    "type": ["array", "null"],
                    "uniqueItems": false
                  },
                  "message": {
                    "description": "Human-readable error message",
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "progress": {
                "description": "Progress information while the job is running",
                "properties": {
                  "completed": {
                    "description": "Number of eval cases completed",
                    "type": ["integer", "null"]
                  },
                  "current_stage": {
                    "description": "Current pipeline stage. Known values: simulation, evaluation, insights, done.",
                    "type": ["string", "null"]
                  },
                  "total": {
                    "description": "Total number of eval cases in the job",
                    "type": ["integer", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "result": {
                "description": "Full result payload when status is COMPLETED",
                "properties": {
                  "avg_conversation_score": {
                    "description": "Average score across evaluated conversations (range: 1-5)",
                    "type": ["number", "null"]
                  },
                  "avg_turn_score": {
                    "description": "Average score across evaluated turns (range: 1-5)",
                    "type": ["number", "null"]
                  },
                  "creation_time": {
                    "description": "Unix timestamp when the insight report was created",
                    "type": ["integer", "null"]
                  },
                  "eval_ids_by_score": {
                    "description": "JSON object grouping evaluation IDs by score",
                    "type": ["string", "null"]
                  },
                  "highlights": {
                    "description": "JSON array of highlight objects with description and evaluation IDs",
                    "type": ["string", "null"]
                  },
                  "summary": {
                    "description": "Natural-language summary of overall agent performance",
                    "type": ["string", "null"]
                  },
                  "summary_id": {
                    "description": "The unique identifier for the summary report",
                    "type": ["string", "null"]
                  },
                  "top_failure_categories": {
                    "description": "JSON array of failure category objects with category, evaluation IDs, and recommended actions",
                    "type": ["string", "null"]
                  },
                  "update_time": {
                    "description": "Unix timestamp when the insight report was last updated",
                    "type": ["integer", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "status": {
                "description": "Job status. Known values: QUEUED, RUNNING, COMPLETED, FAILED.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
