            "properties": {
              "channel_id": {
                "description": "Needs to end with 'CH'.",
                "maxLength": 8,
                "minLength": 8,
                "pattern": "(?i)^[a-z0-9]+ch$",
                "type": "string"
              },
              "phone_numbers": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
