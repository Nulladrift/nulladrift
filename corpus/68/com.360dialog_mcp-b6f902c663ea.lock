        {
          "name": "mba_list_catalog_products",
          "title": "List catalog products",
          "description": "List the products of one catalog connected to this channel's WhatsApp Business Account. A product's retailer_id is the product_retailer_id that product messages take. Known limitation: a catalog that is NOT CONNECTED to this WABA, or that does not exist, returns 403 Catalog not accessible - get valid ids from mba_list_product_catalogs. This list is CURSOR-PAGINATED: it returns {data, paging} - page with the `after` cursor from paging.cursors, and stop when paging carries no `next` link, because a page can be empty and still have more after it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after": {
                "description": "Cursor - return the page immediately after it.",
                "type": "string"
              },
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "before": {
                "description": "Cursor - return the page immediately before it.",
                "type": "string"
              },
              "catalog_id": {
                "description": "The catalog ID, as list_product_catalogs returns it.",
                "type": "string"
              },
              "fields": {
                "description": "Comma-separated fields to return, e.g. id,retailer_id,name,price,image_url,availability.",
                "type": "string"
              },
              "filter": {
                "description": "Meta product filter as a JSON string, e.g. {\"availability\":{\"eq\":\"in stock\"}}.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum entries per page. A page can be shorter.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["app_id", "catalog_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Products of a product catalog",
            "properties": {
              "data": {
                "description": "Products of the catalog; which fields are present depends on the fields query parameter",
                "items": {
                  "description": "A catalog product",
                  "properties": {
                    "availability": {
                      "description": "Product availability: in stock, out of stock, preorder, available for order, discontinued, pending, mark_as_sold",
                      "type": ["string", "null"]
                    },
                    "currency": {
                      "description": "ISO 4217 currency code of the price",
                      "type": ["string", "null"]
                    },
                    "description": {
                      "description": "Product description",
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "Meta ID of the product item",
                      "type": ["string", "null"]
                    },
                    "image_url": {
                      "description": "URL of the main product image",
                      "type": ["string", "null"]
                    },
                    "name": {
                      "description": "Product title",
                      "type": ["string", "null"]
                    },
                    "price": {
                      "description": "Formatted price with currency symbol",
                      "type": ["string", "null"]
                    },
                    "retailer_id": {
                      "description": "Retailer ID (SKU) of the product, as set in the catalog; use it as product_retailer_id in product messages",
                      "type": ["string", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"],
                "uniqueItems": false
              },
              "paging": {
                "description": "Cursor pagination. next/previous point back at this API; follow them directly, or page manually with the after/before query parameters",
                "properties": {
                  "cursors": {
                    "description": "Page cursors",
                    "properties": {
                      "after": {
                        "description": "Cursor of the next page",
                        "type": ["string", "null"]
                      },
                      "before": {
                        "description": "Cursor of the previous page",
                        "type": ["string", "null"]
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "next": {
                    "description": "URL of the next page as issued by Meta",
                    "type": ["string", "null"]
                  },
                  "previous": {
                    "description": "URL of the previous page as issued by Meta",
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
