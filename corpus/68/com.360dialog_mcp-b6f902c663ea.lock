                      "description": "Image used for products without an image, or while a product image is unavailable",
                      "type": ["string", "null"]
                    },
                    "fallback_image_url": {
                      "description": "Fallback images used for auto-generated dynamic items",
                      "items": {
                        "type": ["string", "null"]
                      },
                      "type": ["array", "null"],
                      "uniqueItems": false
                    },
                    "feed_count": {
                      "description": "Total number of feeds used by the catalog",
                      "type": ["integer", "null"]
                    },
                    "id": {
                      "description": "ID of the catalog",
                      "type": ["string", "null"]
                    },
                    "is_catalog_segment": {
                      "description": "Whether this is a catalog segment rather than a full catalog",
                      "type": ["boolean", "null"]
                    },
                    "is_local_catalog": {
                      "description": "Whether this is a local catalog",
                      "type": ["boolean", "null"]
                    },
                    "name": {
                      "description": "Name of the catalog, given by its creator",
                      "type": ["string", "null"]
                    },
                    "product_count": {
                      "description": "Total number of products in the catalog",
                      "type": ["integer", "null"]
