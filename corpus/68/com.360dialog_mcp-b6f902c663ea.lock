        {
          "name": "getchat_send_message",
          "title": "Send message",
          "description": "Send a message into an existing conversation, as the business.\n\nThis is inbox-scoped sending: it posts into an existing conversation with\ncorrect threading. Outside the 24-hour customer-care window, WhatsApp only\npermits template messages — other types are rejected with an explanation.",
