                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The type-specific message object, following the WhatsApp Business API shape. For type=text: {\"body\": \"...\"}. For image/video: {\"link\": \"https://...\", \"caption\"?}. For document: {\"link\": \"https://...\", \"filename\"?, \"caption\"?}. For audio/sticker: {\"link\": \"...\"}. For template: {\"name\": \"...\", \"language\": {...}, \"components\": [...]}. For interactive/location/contacts: the corresponding WABA object."
              },
              "conversation_id": {
                "description": "The conversation's contact WhatsApp ID (phone-style like '4915112345678', or business-scoped). Take it from list_conversations or search_conversations results; do not guess it.",
                "type": "string"
              },
              "type": {
                "default": "text",
                "description": "WhatsApp message type of `content`.",
                "enum": ["text", "image", "video", "audio", "document", "sticker", "template", "interactive", "location", "contacts"],
                "type": "string"
              }
