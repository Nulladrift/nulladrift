          "description": "Read the usage caps in force for the agent, each with its budget_id. Returns {budgets}; an empty array means no cap is set and usage is unlimited. Known limitations: budgets are ONLY SERVED for the business that owns this number's WABA; any other business_id is refused with an error that says so. For a number whose business is not known to 360dialog yet, budgets are not available and this tool returns an error that says so. When several caps are set, whichever is reached first stops the agent until its window resets, and the agent then hands conversations to the business. Token caps apply across the WHOLE BUSINESS MANAGER, so every agent in that portfolio shares them; AI-turn caps apply per conversation. These tools set and read caps and do not report usage against them: mba_get_agent_usage_insights reports billed usage, keyed on the billable account ID and not on business_id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "business_id": {
                "description": "The Meta Business Manager ID of the business that owns this number's WABA. No other tool returns it: it is the WABA's owner business in Meta Business Suite, and the 360dialog hub shows it on the channel.",
                "type": "string"
              }
            },
            "required": ["app_id", "business_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The budgets configured for the agent",
            "properties": {
              "budgets": {
                "description": "The budgets configured for the agent. When more than one is set, whichever is reached first takes effect. An empty array means no cap is set and usage is unlimited",
                "items": {
                  "description": "A single budget configured for the agent",
                  "properties": {
                    "budget_id": {
                      "description": "Stable identifier for this budget. Pass it back on a subsequent set request to edit or preserve this budget",
                      "type": ["string", "null"]
                    },
                    "max_budget": {
                      "description": "The maximum allowed usage, in the given unit, within the time window",
                      "type": ["integer", "null"]
                    },
                    "time_window": {
                      "description": "The rolling period usage is totalled over, measured in the timezone of the WhatsApp Business Account. Known values: one_day, seven_days, fourteen_days, thirty_days.",
                      "type": ["string", "null"]
                    },
                    "unit_type": {
                      "description": "What the budget measures: token usage or AI agent turns. Known values: token, ai_turn.",
                      "type": ["string", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"],
                "uniqueItems": false
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read the agent budgets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
