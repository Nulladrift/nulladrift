        {
          "name": "mba_send_message",
          "title": "Send a WhatsApp message",
          "description": "Send a WhatsApp message to a consumer and release thread control back to the agent. The body is the WhatsApp Cloud API message object - set `type` and the matching payload key (text, template, interactive, image, ...). This messages a real person: it is subject to the platform's send eligibility rules, and outside a 24-hour customer service window only an approved template will be delivered.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "recipient_type": {
                "description": "Defaults to individual.",
                "type": "string"
              },
              "template": {
                "description": "Used when type is template.",
                "type": "object"
              },
              "text": {
                "description": "Used when type is text, e.g. {\"body\": \"Hello\"}.",
                "type": "object"
              },
              "to": {
                "description": "Consumer's WhatsApp number in E.164 format.",
                "type": "string"
              },
              "type": {
                "description": "Message type, e.g. text, template, interactive, image.",
                "type": "string"
              }
            },
            "required": ["app_id", "to", "type"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "contacts": {
                "items": {
                  "properties": {
                    "input": {
                      "description": "Recipient identifier as sent in the request (phone number or BSUID)",
                      "type": ["string", "null"]
                    },
                    "user_id": {
                      "description": "Business-scoped user ID (BSUID) of the recipient. Present only for businesses onboarded to BSUID",
                      "type": ["string", "null"]
                    },
                    "wa_id": {
                      "description": "WhatsApp ID of the recipient",
                      "type": ["string", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"],
                "uniqueItems": false
              },
              "messages": {
                "items": {
                  "properties": {
                    "id": {
                      "type": ["string", "null"]
                    },
                    "message_status": {
                      "description": "Known values: accepted, held_for_quality_assessment, paused.",
                      "type": ["string", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"],
                "uniqueItems": false
              },
              "messaging_product": {
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a WhatsApp message"
