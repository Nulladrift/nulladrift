              "agent_event_id": {
                "description": "The ID of the recorded agent event, when one was created",
                "type": ["string", "null"]
              },
              "status": {
                "description": "\"accepted\" when the event is successfully enqueued",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send an agent event"
