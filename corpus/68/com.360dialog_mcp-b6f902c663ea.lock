          "title": "List inboxes",
          "description": "List the WhatsApp inboxes the calling 360dialog user can access.\n\nCall this first when you don't know which `channel_id` to pass to the\nother tools: each entry pairs a `channel_id` with its inbox URL and\nWhatsApp number (`wa_id`). Entries without a `channel_id` cannot be\ndriven through these tools.\n\nThe listing covers the caller's own client accounts, plus every inbox under\na partner the caller administers. It never reaches another tenant: a client\nuser is not shown other clients' inboxes, including ones managed by the same\npartner. An empty list does not mean no inbox exists; pass a known\n`channel_id` to the other tools directly.",
