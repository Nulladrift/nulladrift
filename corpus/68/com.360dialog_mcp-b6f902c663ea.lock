        {
          "name": "mba_get_conversation_insights",
          "title": "Read conversation insights",
          "description": "Read how many conversations the agent replied in over a date range (ai_threads), and how many are currently handed from the agent to the business and still awaiting a business reply (ai_handoffs). Counts are per conversation, not per message, and match the business's own agent summaries. Returns {data: [one row]}, each metric as {count}, present only when requested. Known limitation: ai_handoffs is a SNAPSHOT of the present moment - it ignores start_date and end_date. The range may span at most 90 days, counting both ends, and each requested metric costs a separate scan, so ask only for what you need.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "end_date": {
                "description": "Last day to include, YYYY-MM-DD in the business time zone. Inclusive.",
                "format": "date",
                "type": "string"
              },
              "metrics": {
                "description": "Which metrics to return. Omit for all of them.",
                "items": {
                  "enum": ["ai_handoffs", "ai_threads"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "start_date": {
                "description": "First day to include, YYYY-MM-DD in the business time zone. Inclusive.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["app_id", "end_date", "start_date"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The conversation insights for the requested range",
            "properties": {
              "data": {
                "description": "A single row covering the requested range. An array so a future per-day breakdown does not break callers",
                "items": {
                  "description": "Conversation and handoff counts for the requested range",
                  "properties": {
                    "ai_handoffs": {
                      "description": "Conversations currently handed from the AI agent to the business and still awaiting a business reply. This is a snapshot of the present moment, not a count over the requested range: it is the same figure whatever start_date and end_date you send. A conversation drops out of it once the business replies. Present only when the metric was requested",
                      "properties": {
                        "count": {
                          "description": "The number of conversations this metric counts. What it counts, and whether the requested date range applies to it, is described on the metric itself",
                          "type": ["integer", "null"]
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "ai_threads": {
                      "description": "Conversations the AI agent replied in at least once between start_date and end_date, counted once however many messages each contains. Present only when the metric was requested",
                      "properties": {
                        "count": {
                          "description": "The number of conversations this metric counts. What it counts, and whether the requested date range applies to it, is described on the metric itself",
                          "type": ["integer", "null"]
                        }
                      },
                      "type": ["object", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"],
                "uniqueItems": false
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read conversation insights"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": ["no-aud", "scope:read:agent"]
            }
          },
          "digest": "sha256:f7231858a6c57b12b87e00b0154e1c78fc66a68b92654cd28149ee55b8e71545"
        },
        {
          "name": "mba_get_conversation_turns",
          "title": "Read conversation turns",
          "description": "Read the ordered turns of the most recent conversation between the agent and one customer. Each turn carries its turn_id, conversation_id and the observed steps - LLM calls with a preview of the model output, and tool calls with the tool name, input and output - plus latency and status where available. Use it to see why the agent answered the way it did. Malformed records, and tool responses that cannot be matched to a tool call, may be missing. This list is CURSOR-PAGINATED: it returns {data, paging} - page with the `after` cursor from paging.cursors, and stop when paging carries no `next` link, because a page can be empty and still have more after it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after": {
                "description": "Cursor - return the page immediately after it.",
                "type": "string"
              },
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "before": {
                "description": "Cursor - return the page immediately before it.",
                "type": "string"
              },
              "end_timestamp_ms": {
                "description": "Only turns that started at or before this Unix time in milliseconds.",
                "type": "integer"
              },
              "limit": {
                "description": "Maximum entries per page. A page can be shorter.",
                "minimum": 1,
                "type": "integer"
              },
              "start_timestamp_ms": {
                "description": "Only turns that started at or after this Unix time in milliseconds.",
                "type": "integer"
              },
              "user_phone_number": {
                "description": "The customer: a phone number in digits only with the country code (15551234567, no + or separators), a Business-Scoped User ID such as US.2788620304833812, or the conversation_id returned by test_agent. Prefer the BSUID for a customer who has ever used a WhatsApp username - their phone number may be unknown, which returns Consumer not found.",
                "type": "string"
              }
            },
            "required": ["app_id", "user_phone_number"],
            "type": "object"
          },
          "outputSchema": {
            "description": "A paginated list of conversation turns",
            "properties": {
              "data": {
                "description": "This array represents the page of data returned",
                "items": {
                  "description": "A single turn of a conversation with its observed steps",
                  "properties": {
                    "conversation_id": {
                      "description": "App-scoped opaque identifier for the conversation containing this turn",
                      "type": ["string", "null"]
                    },
                    "e2e_latency_ms": {
                      "description": "Elapsed time, in milliseconds, from when the agent receives the customer message that starts the turn until the agent finishes producing its response, including model and tool-call processing time, if available",
                      "type": ["integer", "null"]
                    },
                    "message_id": {
                      "description": "WhatsApp Cloud API message ID for the customer message that started the turn, reconstructed for the authorized consumer identity when available",
                      "type": ["string", "null"]
                    },
                    "steps": {
                      "description": "Ordered steps observed during the turn",
                      "items": {
                        "description": "A single step observed during a conversation turn",
                        "properties": {
                          "latency_ms": {
                            "description": "Latency for the step in milliseconds, if available",
                            "type": ["integer", "null"]
                          },
                          "llm_output_preview": {
                            "description": "A truncated preview of the model output, for LLM calls",
                            "type": ["string", "null"]
                          },
                          "status": {
                            "description": "The step status: SUCCESS, ERROR, or TIMEOUT. Known values: SUCCESS, ERROR, TIMEOUT.",
                            "type": ["string", "null"]
                          },
                          "tool_input": {
                            "description": "The input arguments passed to the tool, for tool calls",
                            "type": ["string", "null"]
                          },
                          "tool_name": {
                            "description": "The name of the tool used by this step, for tool calls",
                            "type": ["string", "null"]
                          },
                          "tool_output": {
                            "description": "The output returned by the tool, for tool calls",
                            "type": ["string", "null"]
                          },
                          "type": {
                            "description": "The type of step: LLM_CALL or TOOL_CALL. Known values: LLM_CALL, TOOL_CALL.",
                            "type": ["string", "null"]
                          }
                        },
                        "type": ["object", "null"]
                      },
                      "type": ["array", "null"],
                      "uniqueItems": false
                    },
                    "timestamp": {
                      "description": "Timestamp of the turn in milliseconds since epoch, if available",
                      "type": ["integer", "null"]
                    },
                    "turn_id": {
                      "description": "Stable identifier for the turn",
                      "type": ["string", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"],
                "uniqueItems": false
              },
              "paging": {
                "description": "Cursor pagination",
                "properties": {
                  "cursors": {
                    "description": "Page cursors",
                    "properties": {
                      "after": {
                        "description": "Cursor of the next page",
                        "type": ["string", "null"]
                      },
                      "before": {
                        "description": "Cursor of the previous page",
                        "type": ["string", "null"]
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "next": {
                    "description": "URL of the next page as issued by Meta",
                    "type": ["string", "null"]
                  },
                  "previous": {
                    "description": "URL of the previous page as issued by Meta",
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read conversation turns"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": ["no-aud", "scope:read:agent"]
            }
          },
          "digest": "sha256:93340c0e477e4cbb3d42cd78cd90ef6089411b94be30677d92b00f21a7f9da5d"
        },
        {
          "name": "mba_get_eval_details",
          "title": "Read evaluation details",
          "description": "Read per-conversation evaluation results - scores, per-turn labels, reasons and the transcript. Takes eval_ids, which is a different kind of id from the job_id that mba_get_eval_results takes. Read them from the eval_ids_by_score field of a completed job. mba_get_eval_results already adds these details when it can read that field, so call this tool when it could not.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "eval_ids": {
                "description": "Comma-separated evaluation ids.",
                "type": "string"
              }
            },
            "required": ["app_id", "eval_ids"],
            "type": "object"
          },
          "outputSchema": {
            "description": "List of evaluation results",
            "properties": {
              "evaluations": {
                "description": "List of evaluation results",
                "items": {
                  "description": "A per-conversation evaluation result",
                  "properties": {
                    "creation_time": {
                      "description": "Unix timestamp when the evaluation was created",
                      "type": ["integer", "null"]
                    },
                    "custom_success_criteria": {
                      "description": "JSON array of client-specified success criteria strings",
                      "type": ["string", "null"]
                    },
                    "eval_case_id": {
                      "description": "ID of the eval case that defined the scenario and success criteria",
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "The evaluation ID",
                      "type": ["string", "null"]
                    },
                    "per_turn_labels": {
                      "description": "JSON array of per-turn label integers",
                      "type": ["string", "null"]
                    },
                    "reasons": {
                      "description": "JSON array of {category, score, description, recommended_actions} objects",
                      "type": ["string", "null"]
                    },
                    "score": {
                      "description": "Overall evaluation score from the judge LLM",
                      "type": ["integer", "null"]
                    },
                    "transcript": {
                      "description": "JSON object with system_prompt and transcript_turns for the evaluated conversation",
                      "type": ["string", "null"]
                    },
                    "update_time": {
                      "description": "Unix timestamp when the evaluation was last updated",
                      "type": ["integer", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"],
                "uniqueItems": false
              }
            },
            "type": "object"
