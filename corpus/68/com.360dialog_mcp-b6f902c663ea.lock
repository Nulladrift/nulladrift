      "serverInfo": {
        "name": "360Dialog MCP Server",
        "version": "2.0.4",
        "websiteUrl": "https://docs.360dialog.com/docs",
        "icons": [
          {
            "src": "data:image/png;base64,"
          }
        ]
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": false
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "360Dialog MCP Server exposes 360Dialog Hub, Meta Business Agent, and Sandbox tools for managing accounts, phone numbers/channels,\ntemplates, balance, diagnostics, sandbox messaging, and configuring Meta Business Agent. It also exposes inbox tools, which can be used by clients on the premium plan.\n\nKey rules:\n- Use 'list_skills' to find workflows that can help assist the user with their question or issue.\n- Use documentation tools for WhatsApp API and WhatsApp Business Platform questions.\n- Use 'get_self' first to identify the logged-in user, account scope, client ID, partner ID, and permissions.\n- Use 'inbox_list_inboxes' to see if the user has access to any inboxes.\nIf the user does not have an inbox, all other inbox tool calls will fail.\n- Use 'list_channels' to find onboarded phone numbers/channels and their client, partner, WABA, project, and channel IDs.\n- The user is logged into one account at a time and can only act within that account. Partners can manage client channels; clients can manage only their own channels.\n- Payment responsibility depends on partner setup: direct-paid clients pay invoices/top up balance themselves; partner-paid clients rely on the partner to handle invoices and balance.\n- Sandbox is separate from Hub. Users can register a personal number and send test messages from the sandbox WhatsApp account; sandbox numbers only work with 'sandbox_' tools.\n- Meta Business Agent is set up per-channel/phone number. Tools starting with 'mba_' are dedicated to the Meta Business Agent.",
      "tools": [
        {
          "name": "get_client_documentation_page",
          "title": "Get client documentation page",
          "description": "Get a documentation page from the 360Dialog client documentation at https://docs.360dialog.com/docs. Fetch the full markdown content of a specific documentation page from Client Documentation. Use this when you have a page URL and want to read its content. Accepts full URLs (e.g. https://docs.360dialog.com/docs/getting-started). Since `searchDocumentation` returns partial content, use `getPage` to retrieve the complete page when you need more details. The content includes links you can follow to navigate to related pages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The URL of the page to fetch",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get client documentation page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": ["no-aud"]
            }
          },
          "digest": "sha256:af5038218c53f10b5cc060b219ac82d96f0ec6728eda6fddcbfb2347b79b3160"
        },
        {
          "name": "get_skill",
          "title": "Get skill",
          "description": "Get the full guide for one skill returned by 'list_skills', as markdown.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "A skill's 'name' field, as returned by list_skills.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "found": {
                "type": "boolean"
              },
              "skill": {
                "anyOf": [
                  {
                    "description": "A skill's full body, as returned by get_skill",
                    "properties": {
                      "content": {
                        "type": "string"
                      },
                      "description": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "tags": {
                        "default": [],
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "title": {
                        "type": "string"
                      },
                      "updated_at": {
                        "type": "string"
                      }
                    },
                    "required": ["content", "description", "name", "title", "updated_at"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["found"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get skill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": ["no-aud"]
            }
          },
          "digest": "sha256:c8fbedd9030d66a91cb2864c4a72faac2cba06efc26caf839c81764ac0434dd5"
        },
        {
          "name": "list_skills",
          "title": "List skills",
          "description": "List the 360Dialog skills available to you.\n\nA skill is a curated, up-to-date how-to guide for a 360Dialog process (e.g. drafting a\ncompliant WhatsApp template, diagnosing a channel that stopped sending). Call this tool\nBEFORE answering any \"how do I...\" question about 360Dialog products or processes -\nit tells you which skills exist and when to use them. Once you find a match, call\n'get_skill' with its 'name' to read the full guide.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "skills": {
                "items": {
                  "description": "A skill as listed by list_skills. Maps 1:1 onto a published GitBook page",
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "tags": {
                      "default": [],
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "updated_at": {
                      "type": "string"
                    }
                  },
                  "required": ["description", "name", "title", "updated_at"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["skills"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List skills"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": ["no-aud"]
            }
          },
          "digest": "sha256:9e99ef67434f2741caa2ef1fe056d25300f19557f27c29b108a22c9c58edab42"
        },
        {
          "name": "search_client_documentation",
          "title": "Search client documentation",
          "description": "Search the 360Dialog client documentation at https://docs.360dialog.com/docs. Search across the documentation to find relevant information, code examples, API references, and guides. Use this tool when you need to answer questions about Client Documentation, find specific documentation, understand how features work, or locate implementation details. The search returns contextual content with titles and direct links to the documentation pages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search client documentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": ["no-aud"]
            }
          },
          "digest": "sha256:4291475c53d6332d24cc715ac88c687717c055719eebf44d4e1d5f08e628f8a1"
        },
