            "fastmcp": {
              "tags": ["no-aud", "scope:read:agent"]
            }
          },
          "digest": "sha256:1aeb97cda0bfd7770aa4e13427a4c2daca249bf6915700d864ee9d72f6e1749d"
        },
        {
          "name": "mba_get_agent_event",
          "title": "Read agent event status",
          "description": "Read the processing status of an event submitted with mba_send_agent_event. Status is one of request_received, processing, sent, failed, skipped or success; failed and skipped carry error_message and skipped_reason. This is the only way to find out whether an accepted event actually reached the consumer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_event_id": {
                "description": "Event id returned by send_agent_event.",
                "type": "string"
              },
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              }
            },
            "required": ["agent_event_id", "app_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The current processing status of an agent event",
            "properties": {
              "created_at": {
                "description": "The ISO 8601 timestamp at which the agent event was received",
                "type": ["string", "null"]
              },
              "error_message": {
                "description": "Summary of failure, if event state is FAILED. One of: agent_not_enabled (the agent is turned off for this\nphone number), agent_temporarily_unavailable (retry later), billing_not_configured (payment method missing or\nbilling details incomplete), consumer_not_in_agent_audience (consumer excluded by an allowlist or rollout),\nevent_content_rejected (the event text was declined), thread_not_owned_by_agent (another participant owns the\nconversation), internal_server_error (any other failure)",
                "type": ["string", "null"]
              },
              "event_type": {
                "description": "The partner-defined event identifier supplied when the event was submitted, e.g. document_verified",
                "type": ["string", "null"]
              },
              "skipped_reason": {
                "description": "Summary of skip reason, if event state is SKIPPED",
                "type": ["string", "null"]
              },
              "status": {
                "description": "The current processing status of the agent event. Known values: request_received, processing, sent, failed, skipped, success.",
                "type": ["string", "null"]
              },
              "updated_at": {
                "description": "The ISO 8601 timestamp at which the agent event status was last updated",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read agent event status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": ["no-aud", "scope:read:agent"]
            }
          },
          "digest": "sha256:2085230cb512b7297ae101f9985f12296f391ebcca2b49f33414b8989b5c43f6"
        },
        {
          "name": "mba_get_agent_event_insights",
          "title": "Read agent event insights",
          "description": "Read what happened to the events sent to the agent (mba_send_agent_event) over a date range, one row per event type, busiest first: how many were received, how many the agent successfully processed, and the mean end-to-end latency. Successfully processed means the agent sent its message, not that the message was delivered. Figures are rolled up once a day, so the most recent day may still be incomplete. Known limitation: the dates are in PACIFIC TIME, not the business time zone, and the range may span at most 30 days, counting both ends.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "end_date": {
                "description": "Last day to include, YYYY-MM-DD in Pacific Time. Inclusive.",
                "format": "date",
                "type": "string"
              },
              "event_type": {
                "description": "Return only this event type, named as it was sent. Omit for every event type.",
                "type": "string"
              },
              "start_date": {
                "description": "First day to include, YYYY-MM-DD in Pacific Time. Inclusive.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["app_id", "end_date", "start_date"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The agent event insights for the requested range",
            "properties": {
              "avg_e2e_latency_ms": {
                "description": "Mean time in milliseconds from receiving an event to the agent finishing with it, across every event type in the range. Null when nothing ran end to end",
                "type": ["number", "null"]
              },
              "data": {
                "description": "One row per event type received in the range, busiest first. Empty when no event of yours was received",
                "items": {
                  "description": "Volume, completion, and latency for a single agent event type",
                  "properties": {
                    "avg_e2e_latency_ms": {
                      "description": "Mean time in milliseconds from receiving one of these events to the agent finishing with it, over every request in the range that ran end to end. Null when none did",
                      "type": ["number", "null"]
                    },
                    "event_type": {
                      "description": "The event type these figures cover, exactly as you sent it in the agent event request",
                      "type": ["string", "null"]
                    },
                    "received": {
                      "description": "Requests of this event type that arrived over the range, counted once each and summed across days",
                      "type": ["integer", "null"]
                    },
                    "successfully_processed": {
                      "description": "Requests of this event type the agent finished handling, summed across days. Requests that were turned away, skipped, or failed are not counted here. Finishing means the agent sent its message; it is not a delivery signal, and does not guarantee the message reached the customer device",
                      "type": ["integer", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"],
                "uniqueItems": false
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read agent event insights"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": ["no-aud", "scope:read:agent"]
            }
          },
          "digest": "sha256:77c6153faf4ab12ed314016b47984b764755f113e69580943633980ff6efff0a"
        },
        {
