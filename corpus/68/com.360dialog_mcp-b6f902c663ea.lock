        {
          "name": "getchat_mark_conversation_as_read",
          "title": "Mark conversation as read",
          "description": "Mark one conversation's messages as read by the calling user.\n\nPass `up_to_timestamp` after reviewing a conversation so that messages\narriving in the meantime stay unread. The read mark only moves forward: a\ntimestamp older than the caller's current mark changes nothing. Read state\nis per inbox user: this clears the unread count for the caller only, not\nfor other agents. The inbox also marks the messages as read on WhatsApp,\nso the contact sees read receipts. Only conversations whose messages you\ncan read can be marked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel_id": {
                "description": "The 360dialog channel ID of the inbox to operate on.",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation's contact WhatsApp ID (phone-style like '4915112345678', or business-scoped). Take it from list_conversations or search_conversations results; do not guess it.",
                "type": "string"
              },
              "up_to_timestamp": {
                "anyOf": [
                  {
                    "minimum": 1,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Timestamp of the last message you reviewed, taken from get_conversation results; messages up to and including it are marked read, newer ones stay unread. Omit to mark everything currently in the conversation."
              }
            },
            "required": ["channel_id", "conversation_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Mark conversation as read"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": ["no-aud", "scope:write:inbox"]
            }
          },
          "digest": "sha256:422e6eeebe013b1a6076a20ddaecd72d2eb304dcf7a2082660a1e7cfafdee481"
        },
