                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null
                    },
                    "metadata": {
                      "additionalProperties": true,
                      "default": {},
                      "type": "object"
                    },
                    "type": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "type": "string"
              },
              "ready": {
                "type": "boolean"
              }
            },
            "required": ["actions_required", "message", "ready"],
            "type": "object"
