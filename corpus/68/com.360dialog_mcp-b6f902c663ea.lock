        {
          "name": "mba_get_agent_usage_insights",
          "title": "Read agent usage insights",
          "description": "Read the billed usage of a Meta Business Agent account over a billing date range, one entry per HOUR, DAY or MONTH bucket: billable messages, billable tokens, and cost in the account's currency. Returns {usage}; an empty array means no usage in the range. Each entry carries its bucket start and end (Unix seconds, end exclusive), plus channel and sender_id when they are in dimensions. Metrics left out of metric_types are omitted from every entry, not returned as null. Tokens are BILLED tokens, the figure on the invoice, which can be fewer than the tokens the agent consumed. Known limitations: usage insights are ONLY AVAILABLE for numbers whose stack uses its own WABA access token; for any other number this tool returns an error that says so. The range is start INCLUSIVE, end EXCLUSIVE, and dates are evaluated in the billable account's timezone, so a day bucket can be 23 or 25 hours long. MONTH needs a range of whole months: start on the 1st, end on the last day of a month.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "billable_account_id": {
                "description": "The billable account ID of the Meta Business Agent account. No other tool returns it: Meta Billing Hub shows it under Accounts > Meta Business Agent accounts. It is not the Business Manager ID the budget tools take.",
                "type": "string"
              },
              "channels": {
                "description": "Only usage on these messaging surfaces.",
                "items": {
                  "enum": ["whatsapp"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "dimensions": {
                "description": "Split each bucket by these axes. Omit to total the whole agent per bucket.",
                "items": {
                  "enum": ["channel", "sender_id"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "end": {
                "description": "End of the range, Unix seconds. Exclusive: buckets that start before it.",
                "type": "integer"
              },
              "granularity": {
                "description": "Size of each bucket.",
                "enum": ["HOUR", "DAY", "MONTH"],
                "type": "string"
              },
              "metric_types": {
                "description": "Which metrics to return. Omit for all of them.",
                "items": {
                  "enum": ["billable_messages", "billable_tokens", "cost"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "sender_ids": {
                "description": "Only usage attributed to these sending entities.",
                "items": {
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "start": {
                "description": "Start of the range, Unix seconds. Inclusive: buckets that start at or after it.",
                "type": "integer"
              }
            },
            "required": ["app_id", "billable_account_id", "end", "granularity", "start"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The agent usage over the requested date range",
            "properties": {
              "usage": {
                "description": "One entry per billing-time bucket, optionally broken down by channel and/or sending entity. An empty array means the agent had no usage in the requested range",
                "items": {
                  "description": "Billable messages, billable tokens, and charges for a single billing-time bucket",
                  "properties": {
                    "billable_messages": {
                      "description": "Number of billable messages in this bucket. Present only when billable_messages is in metric_types. Included by default when metric_types is not passed",
                      "type": ["integer", "null"]
                    },
                    "billable_tokens": {
                      "description": "Number of billable tokens in this bucket. Present only when billable_tokens is in metric_types. Included by default when metric_types is not passed",
                      "type": ["integer", "null"]
                    },
                    "channel": {
                      "description": "Messaging surface the usage occurred on: whatsapp. Present only when channel is in dimensions. Known values: whatsapp.",
                      "type": ["string", "null"]
                    },
                    "cost": {
                      "description": "Charges for the usage in this bucket, in your Meta Business Agent account's currency. Omitted from the row entirely, not returned as null, when cost is excluded from metric_types. Included by default when metric_types is not passed",
                      "type": ["number", "null"]
                    },
                    "end": {
                      "description": "End of the billing-time bucket, as a Unix timestamp (seconds). Exclusive: it equals the start of the next bucket. Buckets follow hour, day, and month boundaries in the billable account's timezone, so a day can be 23 or 25 hours long when daylight saving time changes",
                      "type": ["integer", "null"]
                    },
                    "sender_id": {
                      "description": "The per-channel sending entity the usage is attributed to. Present only when sender_id is in dimensions",
                      "type": ["string", "null"]
                    },
                    "start": {
                      "description": "Start of the billing-time bucket, as a Unix timestamp (seconds). The bucket starts at an hour, day, or month boundary in the billable account's timezone",
                      "type": ["integer", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"],
                "uniqueItems": false
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read agent usage insights"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": ["no-aud", "scope:read:agent"]
            }
          },
          "digest": "sha256:77639a9fe18e0409b21095d508dbb33f3d682bd7256262d48cb48a31e477d0cb"
        },
        {
          "name": "mba_get_business_info",
          "title": "Read business info",
          "description": "Read the business information the agent uses to answer customers. Returns empty or default values when none has been configured. Known limitation: business info is a CLOSED six-field schema - business_description, contact_info, delivery_and_shipping, payment_method, purchase_info, return_policy. Any other key is rejected. Knowledge that does not fit one of these six fields belongs in an FAQ (mba_create_faq), an agent skill (mba_create_agent_skill), a crawled website (mba_create_website) or an uploaded file (mba_upload_file) - not here.",
