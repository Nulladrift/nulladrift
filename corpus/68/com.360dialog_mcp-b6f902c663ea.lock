        {
          "name": "wait_for_onboarding_step",
          "title": "Wait for onboarding step",
          "description": "Wait for a server-side onboarding step to finish, then report back.\n\nEmbedded Signup and payment setup finish in the person's browser. This tool\npolls the hub every 5 seconds for up to 45 seconds and returns one of:\n\n- \"done\": The step finished.\n- \"pending\": Still not finished. Call this tool again to keep waiting.\n- \"failed\": There was an error.\n\n'channel_id' and 'phone_number' are returned back once a channel is found so you can pass\n'phone_number' into the next call once you have it. When 'phone_number' is omitted, 'candidates'\nlists the client's most recently created channels - check it if you're unsure the right number\nwas picked (e.g. two users connecting numbers on the same 360Dialog client account).\n\nOnly use this for the short waits during onboarding. This tool is NOT suitable for display name\napproval, WABA approval, or business verification scenarios, as they take days, not seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "phone_number": {
                "anyOf": [
                  {
                    "format": "phone",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The phone number to wait for - optional. If absent for 'number_connected' and 'channel_live', reports back with top 3 recently connected/went live phone numbers. If present, it checks the status for the specific phone number. Not relevant for 'payment_connected'."
              },
              "step": {
                "description": "Which step to wait for: 'number_connected' (a new phone number was added), 'payment_connected' (the client has a payment method), or 'channel_live' (the number is ready to send messages).",
                "enum": ["number_connected", "payment_connected", "channel_live"],
                "type": "string"
              }
            },
            "required": ["step"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "candidates": {
                "anyOf": [
                  {
                    "items": {
                      "properties": {
                        "availability_status": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null
                        },
                        "channel_id": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null
                        },
                        "created_at": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null
                        },
                        "phone_number": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "channel_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "detail": {
                "type": "string"
              },
              "observed": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "phone_number": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "state": {
                "enum": ["done", "pending", "failed"],
                "type": "string"
              }
            },
            "required": ["detail", "state"],
            "type": "object"
          },
