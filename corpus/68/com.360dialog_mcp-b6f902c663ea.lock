                "default": null,
                "description": "Phone numbers of the WhatsApp users to unblock, in international format without '+' or spaces, for example ['49100100200']."
              },
              "user_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Business-scoped user IDs (BSUIDs) of the WhatsApp users to unblock, for users whose phone number isn't known. 'list_blocked_users' shows each blocked user's BSUID."
              }
            },
            "required": ["channel_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
