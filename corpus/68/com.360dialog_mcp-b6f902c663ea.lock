        {
          "name": "mba_get_tool_call_insights",
          "title": "Read tool call insights",
          "description": "Read how each of the business's own tools performed over a date range, one row per tool, busiest first: how many conversations called it, its mean latency, and its success, error and timeout rates (0 to 1; timeouts count as errors too). Only tools the business supplied are reported. thread_count counts a conversation once per day, so one that called the tool on three days counts three times. Figures are rolled up once a day, so the most recent day may still be incomplete. Known limitation: the range may span at most 30 days, counting both ends.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "end_date": {
                "description": "Last day to include, YYYY-MM-DD in the business time zone. Inclusive.",
                "format": "date",
                "type": "string"
              },
              "start_date": {
                "description": "First day to include, YYYY-MM-DD in the business time zone. Inclusive.",
                "format": "date",
                "type": "string"
              },
              "tool_name": {
                "description": "Return only this tool, named as it was registered. Omit for every tool called.",
                "type": "string"
              }
            },
            "required": ["app_id", "end_date", "start_date"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The tool call insights for the requested range",
            "properties": {
              "data": {
                "description": "One row per tool called in the range, busiest first. Empty when no tool of yours was called",
                "items": {
                  "description": "Call volume, latency, and health for a single tool",
                  "properties": {
                    "avg_latency_ms": {
                      "description": "Mean time the tool took to respond, in milliseconds, over every call in the range that was timed. Null when none were timed",
                      "type": ["number", "null"]
                    },
                    "error_rate": {
                      "description": "Share of calls that returned an error, between 0 and 1. Timeouts are errors, so they are included here as well as in timeout_rate. Null when no call in the range reported an outcome",
                      "maximum": 1,
                      "minimum": 0,
                      "type": ["number", "null"]
                    },
                    "success_rate": {
                      "description": "Share of calls that returned without an error, between 0 and 1. Null when no call in the range reported an outcome",
                      "maximum": 1,
                      "minimum": 0,
                      "type": ["number", "null"]
                    },
                    "thread_count": {
                      "description": "Conversations that called this tool, counted once per day and summed over the range. A conversation that called the tool on three separate days counts three times",
                      "type": ["integer", "null"]
                    },
                    "timeout_rate": {
                      "description": "Share of calls that timed out, between 0 and 1. A subset of error_rate. Null when no call in the range reported an outcome",
                      "maximum": 1,
                      "minimum": 0,
                      "type": ["number", "null"]
                    },
                    "tool_name": {
                      "description": "The tool these figures cover, as you named it when you registered it. Only tools you supplied are reported",
                      "type": ["string", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"],
                "uniqueItems": false
              }
            },
            "type": "object"
          },
