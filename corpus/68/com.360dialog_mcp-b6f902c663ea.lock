        {
          "name": "list_templates",
          "title": "List templates",
          "description": "List templates for a WABA (WhatsApp Business Account). If you do not have a waba_account_id ending in 'WA' (case-insensitive), run the 'list_channels' tool first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name_filter": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Template name to search for. If one is not provided, leave blank."
              },
              "status_filter": {
                "anyOf": [
                  {
                    "enum": ["approved", "pending", "paused", "rejected"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Filter templates by status. Allowed values are 'approved', 'pending', 'paused', 'rejected'. Leave blank if not needed."
              },
              "waba_account_id": {
                "description": "Needs to end with 'WA'.",
                "maxLength": 8,
                "minLength": 8,
                "pattern": "(?i)^.*wa$",
                "type": "string"
              }
