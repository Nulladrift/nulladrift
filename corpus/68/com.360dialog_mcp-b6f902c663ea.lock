          "name": "create_partner_change_request",
          "title": "Create partner change request",
          "description": "Request that the client's numbers move to a new partner. The new partner has to approve the request; then the\nnumbers are moved, which changes who manages them and who is billed.\n\nALWAYS call 'preview_partner_change_request' first with the same arguments, show its result to the user and\nget their confirmation before calling this tool. This tool also runs the preview itself and does NOT create the\nrequest when the preview finds issues; it then returns the issues instead.\n\nThe user may be prompted by 360Dialog for an OTP code delivered to their email address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel_bundles": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "description": "Which payment plan (bundle) of the new partner a number moves onto. Needed when the new partner bills clients.",
                      "properties": {
                        "bundle_id": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null,
                          "description": "ID of the new partner's payment plan for this number."
                        },
                        "channel_id": {
                          "description": "Needs to end with 'CH'.",
                          "maxLength": 8,
                          "minLength": 8,
                          "pattern": "(?i)^.*ch$",
                          "type": "string"
                        }
                      },
                      "required": ["channel_id"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. Which payment plan of the new partner each number moves onto. Only needed when the new partner bills its clients."
              },
              "channel_ids": {
                "description": "IDs of the numbers (channels) to move. Use 'list_channels' to find them. All numbers of a WABA have to move together.",
                "items": {
                  "description": "Needs to end with 'CH'.",
                  "maxLength": 8,
                  "minLength": 8,
                  "pattern": "(?i)^.*ch$",
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "target_client_id": {
                "anyOf": [
                  {
                    "maxLength": 10,
                    "minLength": 10,
                    "pattern": "(?i)^.*cl$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. ID of an existing client at the new partner to move the numbers into. Only for a partial move (not all numbers of the client). Needs to end with 'CL'."
              },
              "target_partner_id": {
                "description": "ID of the partner the numbers should move to. Needs to end with 'PA'.",
                "maxLength": 8,
                "minLength": 8,
                "pattern": "(?i)^.*pa$",
                "type": "string"
