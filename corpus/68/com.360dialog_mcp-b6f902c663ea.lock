                "format": "date",
                "type": "string"
              },
              "metrics": {
                "description": "Which metrics to return. Omit for all of them.",
                "items": {
                  "enum": ["ai_handoffs", "ai_threads"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "start_date": {
                "description": "First day to include, YYYY-MM-DD in the business time zone. Inclusive.",
                "format": "date",
                "type": "string"
              }
