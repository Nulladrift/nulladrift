        {
          "name": "mba_replace_agent_budgets",
          "title": "Replace the agent budgets",
          "description": "Set the usage caps for the agent. Returns the caps in force after the write. This is a FULL REPLACEMENT of the set: send again every cap to keep, because any cap left out is removed, and an empty array clears all caps and returns the agent to unlimited. To edit an existing cap, pass back its budget_id from mba_get_agent_budgets; omit budget_id to add a new cap. Two caps with the same unit_type and time_window pair are rejected. Known limitations: budgets are ONLY SERVED for the business that owns this number's WABA; any other business_id is refused with an error that says so. For a number whose business is not known to 360dialog yet, budgets are not available and this tool returns an error that says so. When several caps are set, whichever is reached first stops the agent until its window resets, and the agent then hands conversations to the business. Token caps apply across the WHOLE BUSINESS MANAGER, so every agent in that portfolio shares them; AI-turn caps apply per conversation. These tools set and read caps and do not report usage against them: mba_get_agent_usage_insights reports billed usage, keyed on the billable account ID and not on business_id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "budgets": {
                "description": "The complete set of caps. An empty array removes every cap.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "budget_id": {
                      "description": "The id get_agent_budgets returned for an existing cap. Pass it to edit or keep that cap; omit it to add a new cap.",
                      "type": "string"
                    },
                    "max_budget": {
                      "description": "The maximum usage, in unit_type, within time_window.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "time_window": {
                      "description": "The rolling period usage is totalled over, in the timezone of the WABA.",
                      "enum": ["one_day", "seven_days", "fourteen_days", "thirty_days"],
                      "type": "string"
                    },
                    "unit_type": {
                      "description": "What the cap measures: token usage or AI agent turns.",
                      "enum": ["token", "ai_turn"],
                      "type": "string"
                    }
                  },
                  "required": ["max_budget", "time_window", "unit_type"],
                  "type": "object"
                },
                "type": "array"
              },
              "business_id": {
                "description": "The Meta Business Manager ID of the business that owns this number's WABA. No other tool returns it: it is the WABA's owner business in Meta Business Suite, and the 360dialog hub shows it on the channel.",
                "type": "string"
              }
            },
            "required": ["app_id", "budgets", "business_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Replace the agent budgets"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": ["no-aud", "scope:write:agent"]
            }
          },
          "digest": "sha256:9cfa8197345a54baa8337e24cd3899952aea16ba8b3346dc5629948f3fe31da6"
        },
        {
