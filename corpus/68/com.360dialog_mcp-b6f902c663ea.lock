{
  "lockfileVersion": 2,
  "subjects": {
    "com.360dialog/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
