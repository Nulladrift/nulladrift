                    }
                  },
                  "required": ["input", "wa_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "messages": {
                "default": [],
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "type": "array"
              },
              "messaging_product": {
                "const": "whatsapp",
                "default": "whatsapp",
                "type": "string"
              }
