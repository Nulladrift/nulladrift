        {
          "name": "sandbox_send_message",
          "title": "(Sandbox) Send message",
          "description": "Send a message on the 360Dialog sandbox. Messages can only be sent to the user's phone number that was used during sandbox registration.\n\nThe payload must be a JSON string matching the WhatsApp messages endpoint body.\n\nInteractive message example: use this only when there is an active conversation window, which lasts 24 hours since the customer's last message.\n\n{\n  \"messaging_product\": \"whatsapp\",\n  \"to\": \"{{recipient_phone_number}}\",\n  \"type\": \"text\",\n  \"text\": {\n    \"body\": \"{{message_body}}\"\n  }\n}\n\nTemplate message example: use this when there is no active conversation window, or when sending an approved template message. You can only send the 'marketing_message' template.\n\n{\n  \"messaging_product\": \"whatsapp\",\n  \"to\": \"{{recipient_phone_number}}\",\n  \"type\": \"template\",\n  \"template\": {\n    \"name\": \"marketing_message\",\n    \"language\": {\n      \"policy\": \"deterministic\",\n      \"code\": \"en\"\n    },\n    \"components\": [\n      {\n        \"type\": \"header\",\n        \"parameters\": [\n          {\n            \"type\": \"image\",\n            \"image\": {\n              \"link\": \"https://placehold.co/600x315/34D399/FFFFFF/png?text=Summer+Sale!\"\n            }\n          }\n        ]\n      }\n    ]\n  }\n}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Sandbox API key",
                "type": "string"
              },
              "payload": {
                "description": "JSON body of the WhatsApp message to send. Use a text payload only inside an active 24-hour customer service window; use a template payload to start or continue conversations outside that window.",
                "type": "string"
              }
            },
            "required": ["api_key", "payload"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
