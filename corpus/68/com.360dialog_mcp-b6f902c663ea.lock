            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "example": {
                "anyOf": [
                  {},
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "message": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "template_id": {
                "type": "string"
              },
              "template_name": {
                "type": "string"
              }
            },
            "required": ["template_id", "template_name"],
            "type": "object"
