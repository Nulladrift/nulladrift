      "instructions": "360Dialog MCP Server exposes 360Dialog Hub, Meta Business Agent, and Sandbox tools for managing accounts, phone numbers/channels,\ntemplates, balance, diagnostics, sandbox messaging, and configuring Meta Business Agent. It also exposes the get.chat inbox MCP, which can be used by\ncustomers that have access to the get.chat platform.\n\nKey rules:\n- Use 'list_skills' to find workflows that can help assist the user with their question or issue.\n- Use documentation tools for WhatsApp API and WhatsApp Business Platform questions.\n- Use 'get_self' first to identify the logged-in user, account scope, client ID, partner ID, and permissions.\n- Use 'getchat_list_inboxes' to see if the user has access to any inboxes. Only 360Dialog direct customers (whose partner is 360Dialog) users have access to a get.chat inbox.\nIf the user does not have a get.chat inbox, all other get.chat tool calls will fail.\n- Use 'list_channels' to find onboarded phone numbers/channels and their client, partner, WABA, project, and channel IDs.\n- The user is logged into one account at a time and can only act within that account. Partners can manage client channels; clients can manage only their own channels.\n- Payment responsibility depends on partner setup: direct-paid clients pay invoices/top up balance themselves; partner-paid clients rely on the partner to handle invoices and balance.\n- Sandbox is separate from Hub. Users can register a personal number and send test messages from the sandbox WhatsApp account; sandbox numbers only work with 'sandbox_' tools.\n- Meta Business Agent is set up per-channel/phone number. Tools starting with 'mba_' are dedicated to the Meta Business Agent.",
      "tools": [
        {
          "name": "check_number_eligibility",
          "title": "Check number eligibility",
          "description": "Check whether a phone number can be onboarded for this client before handing over the onboarding link.\n\nThis tool only checks 360Dialog's own database and this client's channel quota. It does not ask\nWhatsApp/Meta anything, so a number already active on WhatsApp elsewhere (including the personal\napp) can still come back eligible here.",
