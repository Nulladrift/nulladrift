        {
          "name": "create_template",
          "title": "Create template",
          "description": "Use this tool to create a WhatsApp message template.\n\nFor this tool's 'template_json' property, pass a JSON matching this shape:\n\n{\n  \"name\": string,\n  \"language\": string,\n  \"category\": \"MARKETING\" | \"AUTHENTICATION\" | \"UTILITY\",\n  \"components\": Component[],\n}\n\nGeneral rules:\n- name must be lowercase snake_case.\n- category must be uppercase.\n- language must be a WhatsApp locale code such as \"en_US\", \"tr\", \"es\", \"pt_BR\".\n- Only include fields supported by the component variant.\n- Do not include null fields.\n- Components should normally be ordered as:\n  1. header, if any\n  2. body\n  3. footer, if any\n  4. buttons, if any\n- A template can have at most one header, one body, one footer, and one buttons component.\n- BODY is required unless the user is clearly creating a special authentication template handled elsewhere.\n- HEADER and FOOTER are optional.\n- BUTTONS are optional.\n\nComponent variants:\n\n1. Text header without variables\n\n{\n  \"type\": \"HEADER\",\n  \"format\": \"text\",\n  \"text\": \"Your order update\"\n}\n\nUse this when the header is plain text.\n\n2. Text header with variables\n\n{\n  \"type\": \"HEADER\",\n  \"format\": \"TEXT\",\n  \"text\": \"Hi {{1}}\",\n  \"example\": {\n    \"header_text\": [\"Alice\"]\n  }\n}\n\nRules:\n- Text header supports template variables.\n- If text contains variables, include example.header_text.\n- The example array must contain sample values in the same order as the variables appear.\n- For named parameters, the placeholder names appear in text, but the examples are still values.\n\n3. Image header\n\n{\n  \"type\": \"HEADER\",\n  \"format\": \"IMAGE\",\n  \"example\": {\n    \"header_handle\": [\"https://example.com/sample-image.jpg\"]\n  }\n}\n\nUse this when the template header should contain an image.\nThe example should be a sample image handle or URL when available.\n\n4. Video header\n\n{\n  \"type\": \"HEADER\",\n  \"format\": \"VIDEO\",\n  \"example\": {\n    \"header_handle\": [\"https://example.com/sample-video.mp4\"]\n  }\n}\n\nUse this when the template header should contain a video.\nThe example should be a sample video handle or URL when available.\n\n5. Document header\n\n{\n  \"type\": \"HEADER\",\n  \"format\": \"DOCUMENT\",\n  \"example\": {\n    \"header_handle\": [\"https://example.com/sample-document.pdf\"]\n  }\n}\n\nUse this when the template header should contain a document.\nThe example should be a sample document handle or URL when available.\n\n6. Location header\n\n{\n  \"type\": \"HEADER\",\n  \"format\": \"LOCATION\"\n}\n\nUse this when the template should display a location/map header.\n\nImportant:\n- For template creation, LOCATION is only the header format.\n- Do not put latitude, longitude, address, or name in the template creation component.\n- The actual location values are supplied later when sending the approved template, not when creating the template.\n\n7. Body without variables\n\n{\n  \"type\": \"BODY\",\n  \"text\": \"Your order has shipped and is on the way.\"\n}\n\nUse this for the main message text.\n\n8. Body with variables\n\n{\n  \"type\": \"BODY\",\n  \"text\": \"Hi {{1}}, your order {{2}} has shipped.\",\n  \"example\": {\n    \"body_text\": [\n      [\"Alice\", \"ORD-12345\"]\n    ]\n  }\n}\n\nRules:\n- If body text contains variables, include example.body_text.\n- body_text is an array containing one array of sample values.\n- The inner array values must match the variables in order of appearance.\n- Use placeholders like {{1}}, {{2}}.\n\n9. Footer\n\n{\n  \"type\": \"FOOTER\",\n  \"text\": \"Reply STOP to unsubscribe.\"\n}\n\nRules:\n- Footer is plain text only.\n- Do not use variables in footer text.\n\n10. Buttons wrapper\n\n{\n  \"type\": \"BUTTONS\",\n  \"buttons\": [\n    Button\n  ]\n}\n\nRules:\n- Buttons must be inside a single component whose type is \"BUTTONS\".\n- Do not place button objects directly in components.\n- Button text should be short and action-oriented.\n\nButton variants:\n\nA. Quick reply button\n\n{\n  \"type\": \"QUICK_REPLY\",\n  \"text\": \"Confirm\"\n}\n\nUse when the user should tap a predefined reply.\n\nB. Phone number button\n\n{\n  \"type\": \"PHONE_NUMBER\",\n  \"text\": \"Call us\",\n  \"phone_number\": \"+15551234567\"\n}\n\nUse when the user should call a business phone number.\nphone_number must include country code.\n\nC. Static URL button\n\n{\n  \"type\": \"URL\",\n  \"text\": \"View order\",\n  \"url\": \"https://example.com/orders\"\n}\n\nUse when the button always opens the same URL.\n\nD. Dynamic URL button\n\n{\n  \"type\": \"URL\",\n  \"text\": \"View order\",\n  \"url\": \"https://example.com/orders/{{1}}\",\n  \"example\": [\"ORD-12345\"]\n}\n\nRules:\n- Use this when the final URL path or query contains a variable.\n- The example array contains the sample value for the dynamic URL part.\n\nE. Copy code button\n\n{\n  \"type\": \"COPY_CODE\",\n  \"example\": \"SAVE20\"\n}\n\nUse for coupon or promo-code templates.\nThe button copies the provided code when the template is sent.\n\nG. OTP button\n\n{\n  \"type\": \"OTP\",\n  \"otp_type\": \"COPY_CODE\",\n  \"text\": \"Copy code\"\n}\n\nFor one-tap OTP:\n\n{\n  \"type\": \"OTP\",\n  \"otp_type\": \"ONE_TAP\",\n  \"text\": \"Copy code\",\n  \"autofill_text\": \"Autofill\",\n  \"package_name\": \"com.example.app\",\n  \"signature_hash\": \"abc123\"\n}\n\nRules:\n- Use OTP buttons only for authentication templates - category should be \"AUTHENTICATION\". Authentication templates can only be created for WABAs that have a 2,000 messaging limit or above.\n- Do not use marketing or utility wording in authentication templates.\n\nExamples:\n\nUtility order update with named parameters:\n\n{\n  \"name\": \"order_shipped_update\",\n  \"language\": \"en_US\",\n  \"category\": \"UTILITY\",\n  \"components\": [\n    {\n      \"type\": \"HEADER\",\n      \"format\": \"TEXT\",\n      \"text\": \"Order {{1}} update\",\n      \"example\": {\n        \"header_text\": [[\"ORD-12345\"]]\n      }\n    },\n    {\n      \"type\": \"BODY\",\n      \"text\": \"Hi {{1}}, your order has shipped and should arrive by {{2}}.\",\n      \"example\": {\n        \"body_text\": [\n          [\"Alice\", \"Friday\"]\n        ]\n      }\n    },\n    {\n      \"type\": \"FOOTER\",\n      \"text\": \"Thank you for shopping with us.\"\n    },\n    {\n      \"type\": \"BUTTONS\",\n      \"buttons\": [\n        {\n          \"type\": \"URL\",\n          \"text\": \"Track order\",\n          \"url\": \"https://example.com/orders/{{1}}\",\n          \"example\": [\"ORD-12345\"]\n        }\n      ]\n    }\n  ]\n}\n\nUtility store location template:\n\n{\n  \"name\": \"store_location_info\",\n  \"language\": \"en_US\",\n  \"category\": \"UTILITY\",\n  \"components\": [\n    {\n      \"type\": \"HEADER\",\n      \"format\": \"location\"\n    },\n    {\n      \"type\": \"BODY\",\n      \"text\": \"Hi {{1}}, here is the location of our {{2}} store.\",\n      \"example\": {\n        \"body_text\": [\n          [\"Alice\", \"Downtown\"]\n        ]\n      }\n    }\n  ]\n}",
