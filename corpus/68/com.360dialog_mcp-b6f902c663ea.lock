        {
          "name": "update_channel_profile",
          "title": "Update channel profile",
          "description": "Update the WhatsApp profile for this channel (a.k.a. phone number.)\n\nThe user may be prompted by 360Dialog for an OTP code delivered to their email address. Make them aware of the OTP requirement.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel_id": {
                "description": "Needs to end with 'CH'.",
                "maxLength": 8,
                "minLength": 8,
                "pattern": "(?i)^[a-z0-9]+ch$",
                "type": "string"
              },
              "new_profile": {
                "additionalProperties": false,
                "description": "Changes to the business profile. This is a PATCH request, so only pass fields the user wants changed. If you want to clear a field, set it to null. If you don't want to change a field, omit it from the JSON.\n        \n        e.g. JSON with no changes: {}\n        \n        e.g. JSON that only changes about text: { \"about_text\": \"Hello world\" }",
                "properties": {
                  "about_text": {
                    "anyOf": [
                      {
                        "maxLength": 256,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "About text. Set to a string to update; set to null to clear; omit to leave unchanged."
                  },
                  "business_description": {
                    "anyOf": [
                      {
                        "maxLength": 512,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Business description. Set to a string to update; set to null to clear; omit to leave unchanged."
                  },
                  "business_vertical": {
                    "anyOf": [
                      {
                        "enum": ["ALCOHOL", "APPAREL", "AUTO", "BEAUTY", "EDU", "ENTERTAIN", "EVENT_PLAN", "FINANCE", "GOVT", "GROCERY", "HEALTH", "HOTEL", "NONPROFIT", "ONLINE_GAMBLING", "OTC_DRUGS", "OTHER", "PHYSICAL_GAMBLING", "PROF_SERVICES", "RESTAURANT", "RETAIL", "TRAVEL"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Set to a vertical to update; set to null to clear; omit to leave unchanged."
                  },
                  "contact_email": {
                    "anyOf": [
                      {
                        "format": "email",
                        "maxLength": 256,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Contact email. Set to a string to update; set to null to clear; omit to leave unchanged."
                  },
                  "full_address": {
                    "anyOf": [
                      {
                        "maxLength": 256,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Full address. Set to a string to update; set to null to clear; omit to leave unchanged."
                  },
                  "websites": {
                    "anyOf": [
                      {
                        "items": {
                          "format": "uri",
                          "maxLength": 2083,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 2,
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Websites. Set to a list to update; set to null to clear; omit to leave unchanged."
                  }
                },
                "type": "object"
              },
              "project_id": {
                "description": "Needs to end with 'PR'.",
                "maxLength": 8,
                "minLength": 8,
                "pattern": "(?i)^[a-z0-9]+pr$",
                "type": "string"
              }
            },
            "required": ["channel_id", "new_profile", "project_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "channel_id": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "updated": {
                "type": "boolean"
              }
            },
            "required": ["channel_id", "message", "updated"],
            "type": "object"
          },
