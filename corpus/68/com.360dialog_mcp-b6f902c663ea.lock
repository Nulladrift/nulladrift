                "type": "string"
              },
              "event": {
                "additionalProperties": false,
                "properties": {
                  "description": {
                    "description": "What happened, in words the agent can act on (max 1024 characters).",
                    "type": "string"
                  },
                  "payload": {
                    "description": "Opaque JSON-ENCODED STRING passed to the agent as-is (max 4096 characters).",
                    "type": "string"
                  },
                  "type": {
                    "description": "Event type (max 256 characters).",
                    "type": "string"
                  }
                },
                "required": ["description", "payload", "type"],
