                  "required": ["reasons"],
                  "type": "object"
                },
                "type": "array"
              },
              "succeeded": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["channel_id", "failed", "succeeded"],
