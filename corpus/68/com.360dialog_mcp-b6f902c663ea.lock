          "outputSchema": {
            "description": "Product catalogs connected to the WhatsApp Business Account",
            "properties": {
              "data": {
                "description": "Catalogs connected to the WhatsApp Business Account",
                "items": {
                  "description": "A product catalog. Only id and name are returned by default; request other fields with the fields query parameter",
                  "properties": {
                    "business": {
                      "description": "Business that owns the catalog",
                      "properties": {
                        "id": {
                          "description": "Business ID",
                          "type": ["string", "null"]
                        },
                        "name": {
                          "description": "Business name",
                          "type": ["string", "null"]
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "checkout_urls": {
                      "description": "Checkout URLs, one per sell-to country; omitted when none is configured",
                      "items": {
                        "description": "Checkout URL for one sell-to country",
                        "properties": {
                          "country": {
                            "description": "Two-letter country code",
                            "type": ["string", "null"]
                          },
                          "url": {
                            "description": "Checkout URL",
                            "type": ["string", "null"]
                          }
                        },
                        "type": ["object", "null"]
                      },
                      "type": ["array", "null"],
                      "uniqueItems": false
                    },
                    "da_display_settings": {
                      "additionalProperties": {},
                      "description": "Image display settings (background cropping, padding) for items in each Dynamic Ad format",
                      "type": ["object", "null"]
