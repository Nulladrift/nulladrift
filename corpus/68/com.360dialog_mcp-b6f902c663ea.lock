        {
          "name": "preview_partner_change_request",
          "title": "Preview partner change request",
          "description": "Check whether numbers can move to a new partner, without creating a request. Runs the same pre-flight checks\nas 'create_partner_change_request' and reports every issue that would block the move (for example a number\nthat cannot move, a missing company detail, or a request that is already in progress).\n\nNothing is created or changed. Show the result to the user, then, if it is clear, call\n'create_partner_change_request' with the same arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel_bundles": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "description": "Which payment plan (bundle) of the new partner a number moves onto. Needed when the new partner bills clients.",
                      "properties": {
                        "bundle_id": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "default": null,
                          "description": "ID of the new partner's payment plan for this number."
                        },
                        "channel_id": {
                          "description": "Needs to end with 'CH'.",
                          "maxLength": 8,
                          "minLength": 8,
                          "pattern": "(?i)^.*ch$",
                          "type": "string"
                        }
                      },
                      "required": ["channel_id"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. Which payment plan of the new partner each number moves onto. Only needed when the new partner bills its clients."
              },
              "channel_ids": {
                "description": "IDs of the numbers (channels) to move. Use 'list_channels' to find them. All numbers of a WABA have to move together.",
                "items": {
                  "description": "Needs to end with 'CH'.",
                  "maxLength": 8,
                  "minLength": 8,
                  "pattern": "(?i)^.*ch$",
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "target_client_id": {
                "anyOf": [
                  {
                    "maxLength": 10,
                    "minLength": 10,
                    "pattern": "(?i)^.*cl$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. ID of an existing client at the new partner to move the numbers into. Only for a partial move (not all numbers of the client). Needs to end with 'CL'."
              },
              "target_partner_id": {
                "description": "ID of the partner the numbers should move to. Needs to end with 'PA'.",
                "maxLength": 8,
                "minLength": 8,
                "pattern": "(?i)^.*pa$",
                "type": "string"
              }
            },
            "required": ["channel_ids", "target_partner_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "actions_required": {
                "items": {
                  "properties": {
                    "action_id": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null
                    },
                    "description": {
                      "anyOf": [
                        {
