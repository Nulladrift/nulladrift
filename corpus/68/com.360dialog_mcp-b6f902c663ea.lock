        {
          "name": "mba_create_ui_skill",
          "title": "Create a UI skill",
          "description": "Give the agent one more rich WhatsApp component to send, and the instruction that says when to send it. Returns the created UI skill with its id. A UI skill is NOT an agent skill (mba_list_agent_skills): an agent skill is instruction text that shapes what the agent says, a UI skill lets the agent send one kind of rich WhatsApp component and tells it when to send that component. Known limitation: component_type is FIXED AT CREATION and cannot be changed afterwards. flow_id is required when component_type is `flow`, and is refused for every other type; a flow UI skill also cannot be enabled until the flow itself is published.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "component_type": {
                "description": "The kind of rich message this UI skill sends. Cannot be changed after creation.",
                "enum": ["carousel_quick_reply", "carousel_url", "cta_url", "flow", "image", "interactive_list", "interactive_reply_buttons", "location", "location_request"],
                "type": "string"
              },
              "flow_id": {
                "description": "The flow to send. Required when component_type is `flow`, refused otherwise.",
                "type": "integer"
              },
              "instruction": {
                "description": "Tells the agent when to send this component, e.g. 'Send this when the customer asks to browse the catalog'.",
                "type": "string"
              },
              "status": {
                "description": "Whether the agent may send this component. Only an enabled UI skill is available to the agent.",
                "enum": ["enabled", "disabled"],
                "type": "string"
              },
              "title": {
                "description": "Human-readable name for the UI skill.",
                "type": "string"
              }
            },
            "required": ["app_id", "component_type", "instruction", "status", "title"],
            "type": "object"
          },
          "outputSchema": {
            "description": "A single UI skill",
            "properties": {
              "component_type": {
                "description": "The type of rich message this UI skill sends. Known values: carousel_quick_reply, carousel_url, cta_url, flow, image, interactive_list, interactive_reply_buttons, location, location_request.",
                "type": ["string", "null"]
              },
              "created_at": {
                "description": "The timestamp when the UI skill was created",
                "type": ["integer", "null"]
              },
              "flow_id": {
                "description": "The identifier of the associated flow. Only present for flow skills",
                "type": ["integer", "null"]
              },
              "id": {
                "description": "A unique identifier for the UI skill",
                "type": ["string", "null"]
              },
              "instruction": {
                "description": "A description telling the AI agent when to send this UI skill",
                "type": ["string", "null"]
              },
              "status": {
                "description": "Whether this UI skill is enabled and available to the AI agent. Known values: disabled, enabled.",
                "type": ["string", "null"]
              },
              "title": {
                "description": "A human-readable name for the UI skill",
                "type": ["string", "null"]
              },
              "updated_at": {
                "description": "The timestamp when the UI skill was last updated",
                "type": ["integer", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a UI skill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": ["no-aud", "scope:write:agent"]
            }
          },
          "digest": "sha256:98216a1003910bc73e5a69165c51a62e1368be03537b85a5e15d857f0a40b060"
