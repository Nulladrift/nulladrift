        {
          "name": "mba_get_conversation_turns",
          "title": "Read conversation turns",
          "description": "Read the ordered turns of the most recent conversation between the agent and one customer. Each turn carries its turn_id, conversation_id and the observed steps - LLM calls with a preview of the model output, and tool calls with the tool name, input and output - plus latency and status where available. Use it to see why the agent answered the way it did. Malformed records, and tool responses that cannot be matched to a tool call, may be missing. This list is CURSOR-PAGINATED: it returns {data, paging} - page with the `after` cursor from paging.cursors, and stop when paging carries no `next` link, because a page can be empty and still have more after it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after": {
                "description": "Cursor - return the page immediately after it.",
                "type": "string"
              },
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "before": {
                "description": "Cursor - return the page immediately before it.",
                "type": "string"
              },
              "end_timestamp_ms": {
                "description": "Only turns that started at or before this Unix time in milliseconds.",
                "type": "integer"
              },
              "limit": {
                "description": "Maximum entries per page. A page can be shorter.",
                "minimum": 1,
                "type": "integer"
              },
              "start_timestamp_ms": {
                "description": "Only turns that started at or after this Unix time in milliseconds.",
                "type": "integer"
              },
              "user_phone_number": {
                "description": "The customer: a phone number in digits only with the country code (15551234567, no + or separators), a Business-Scoped User ID such as US.2788620304833812, or the conversation_id returned by test_agent. Prefer the BSUID for a customer who has ever used a WhatsApp username - their phone number may be unknown, which returns Consumer not found.",
                "type": "string"
              }
            },
            "required": ["app_id", "user_phone_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read conversation turns"
