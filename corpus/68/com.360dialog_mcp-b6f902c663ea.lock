        {
          "name": "get_template_json_example",
          "title": "Get template JSON example",
          "description": "Sending messaging templates in WhatsApp API / 360Dialog API requires a JSON body in the API request.\n\nThe API request can be hard to form, as the body must declare in JSON what each parameter in the JSON should\nbe filled as.\n\nThis tool creates a valid example JSON body that the user can later modify before sending the template to WhatsApp users.\n\nIt is recommended that you use this tool after creating a template, or after the user asks how to send a template.\nDisplay the JSON result of this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "template_id": {
                "description": "Needs to end with 'WT'. Use 'list_templates' to find a template's ID.",
                "maxLength": 22,
                "minLength": 22,
                "pattern": "(?i)^.*wt$",
                "type": "string"
              },
              "waba_account_id": {
                "description": "Needs to end with 'WA'.",
                "maxLength": 8,
                "minLength": 8,
                "pattern": "(?i)^.*wa$",
                "type": "string"
              }
            },
            "required": ["template_id", "waba_account_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "example": {
                "anyOf": [
                  {},
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "message": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "template_id": {
                "type": "string"
              },
              "template_name": {
                "type": "string"
              }
            },
            "required": ["template_id", "template_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
