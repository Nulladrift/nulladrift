                "enum": ["ALLOWLISTED_ONLY", "EVERYONE"],
                "type": "string"
              },
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "followup": {
                "additionalProperties": false,
                "description": "Following up with an inactive user.",
                "properties": {
                  "enabled": {
                    "type": "boolean"
                  },
                  "followup_interval_in_seconds": {
                    "enum": [0, 300, 900, 1800, 3600, 7200, 28800, 86400],
                    "type": "integer"
                  },
                  "message": {
                    "type": "string"
                  }
                },
                "required": ["enabled"],
                "type": "object"
              },
              "handoff": {
                "additionalProperties": false,
                "description": "Handing the conversation to a human agent.",
                "properties": {
                  "enabled": {
                    "type": "boolean"
                  },
                  "message": {
                    "type": "string"
                  }
                },
                "required": ["enabled"],
                "type": "object"
              },
              "rollout": {
                "additionalProperties": false,
                "description": "Whether the agent responds at all. Disabling it stops the AI answering on every thread.",
                "properties": {
                  "enabled": {
                    "type": "boolean"
                  }
                },
                "required": ["enabled"],
                "type": "object"
              }
            },
            "required": ["app_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "The AI agent settings for an entity",
            "properties": {
              "agent_id": {
                "description": "Unique identifier for this agent configuration. Use this ID to target a specific agent in update or delete operations",
                "type": ["string", "null"]
              },
              "ai_audience": {
                "description": "Controls which consumers the AI agent responds to. EVERYONE = all consumers (default), ALLOWLISTED_ONLY = only phone numbers in the allowlist. Null for non-WhatsApp entities. Known values: ALLOWLISTED_ONLY, EVERYONE.",
                "type": ["string", "null"]
              },
              "channel": {
                "description": "The channel/platform these settings apply to. Known values: email, instagram, line, messenger, sms, tiktok, unknown, webchat, whatsapp.",
                "type": ["string", "null"]
              },
              "followup": {
                "description": "Settings for following up with an inactive user. Null if not configured",
                "properties": {
                  "enabled": {
                    "description": "Whether followup is enabled. true to enable, false to disable",
                    "type": ["boolean", "null"]
                  },
                  "followup_interval_in_seconds": {
                    "description": "The time in seconds of user inactivity before the followup message is sent. Setting to 0 will disable followup. Known values: 0, 300, 900, 1800, 3600, 7200, 28800, 86400.",
                    "type": ["integer", "null"]
                  },
                  "message": {
                    "description": "The message sent to follow up with the user after inactivity",
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "handoff": {
                "description": "Settings for handing over the conversation to a human agent. Null if not configured",
                "properties": {
                  "enabled": {
                    "description": "Whether handoff to a human agent is enabled. true to enable, false to disable",
                    "type": ["boolean", "null"]
                  },
                  "message": {
                    "description": "The message displayed to the user when a handoff to a human agent occurs",
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "rollout": {
                "description": "Rollout configuration for the AI agent, containing the enabled flag and future gradual rollout fields",
                "properties": {
                  "enabled": {
                    "description": "Whether the AI agent is currently enabled. true for on, false for off",
                    "type": ["boolean", "null"]
                  }
                },
                "type": ["object", "null"]
              }
            },
            "type": "object"
          },
