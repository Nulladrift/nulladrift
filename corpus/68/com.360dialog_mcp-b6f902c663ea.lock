        {
          "name": "mba_get_connector_logs",
          "title": "Read connector logs",
          "description": "Read the connector's third-party error logs, or aggregated failure patterns when summary_only is true. Only errors from the third-party system are included, so an empty result means no failures, not no traffic. Known limitation: the time range must not exceed 7 DAYS, and only the last 7 days are retained - start_time defaults to 24 hours ago and end_time to now. Unlike the other list tools this one does return an object: {data: [...], stats: {...}}, with stats present only when include_stats is true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app_id": {
                "description": "The 360dialog channel's app_id. Identifies which WhatsApp number the agent belongs to.",
                "type": "string"
              },
              "connector_id": {
                "description": "Connector id.",
                "type": "string"
              },
              "end_time": {
                "description": "End of the range, Unix seconds.",
                "type": "integer"
              },
              "include_stats": {
                "description": "Add aggregate statistics.",
                "type": "boolean"
              },
              "limit": {
                "description": "Default 100.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "start_time": {
                "description": "Start of the range, Unix seconds. Must be within the last 7 days.",
                "type": "integer"
              },
              "summary_only": {
                "description": "Return failure patterns instead of entries.",
                "type": "boolean"
              },
              "tool_id": {
                "description": "Restrict to one connector tool.",
                "type": "string"
              },
              "top_n": {
                "description": "Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["app_id", "connector_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Log entries or failure patterns, with optional statistics",
            "properties": {
              "data": {
                "description": "Array of log entries or failure patterns depending on query mode",
                "items": {
                  "description": "A log entry (individual mode) or failure pattern (summary_only mode)",
                  "properties": {
                    "error_message": {
                      "description": "Error message from the failed operation",
                      "type": ["string", "null"]
                    },
                    "event_time": {
                      "description": "ISO 8601 UTC timestamp of when the error event occurred (individual log entry mode)",
                      "type": ["string", "null"]
                    },
                    "failure_code_name": {
                      "description": "Human-readable name of the failure code (e.g. TRANSPORT_ERROR)",
                      "type": ["string", "null"]
                    },
                    "last_seen": {
                      "description": "ISO 8601 UTC timestamp of the most recent occurrence (summary_only mode)",
                      "type": ["string", "null"]
                    },
                    "occurrences": {
                      "description": "Number of times this failure pattern occurred (summary_only mode)",
                      "type": ["integer", "null"]
                    },
                    "tool_name": {
                      "description": "The tool that was being used when the error occurred",
                      "type": ["string", "null"]
                    }
                  },
                  "type": ["object", "null"]
                },
                "type": ["array", "null"],
                "uniqueItems": false
              },
              "stats": {
                "description": "Aggregate statistics for the queried time window, present when include_stats is true",
                "properties": {
                  "avg_latency_s": {
                    "description": "Average execution latency in seconds",
                    "type": ["number", "null"]
                  },
                  "exception_count": {
                    "description": "Number of failed tool executions",
                    "type": ["integer", "null"]
                  },
                  "p95_latency_s": {
                    "description": "95th percentile execution latency in seconds",
                    "type": ["number", "null"]
                  },
                  "p99_latency_s": {
                    "description": "99th percentile execution latency in seconds",
                    "type": ["number", "null"]
                  },
                  "start_count": {
                    "description": "Total number of tool execution starts",
                    "type": ["integer", "null"]
                  },
                  "success_count": {
                    "description": "Number of successful tool executions",
                    "type": ["integer", "null"]
                  },
                  "success_rate": {
                    "description": "Ratio of successful executions to total starts",
                    "type": ["number", "null"]
                  },
                  "time_window_seconds": {
                    "description": "Number of seconds in the statistics time window. Reflects the actual covered window, which may be smaller than the requested range if the most recent logs have not yet been processed.",
                    "type": ["integer", "null"]
                  }
                },
                "type": ["object", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read connector logs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": ["no-aud", "scope:read:agent"]
            }
          },
