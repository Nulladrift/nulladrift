        {
          "name": "get_webhook",
          "title": "Get webhook",
          "description": "Get a channel's (a.k.a. phone number's) webhook URL, and check if the optional webhook headers are set.\n\nWebhook headers are optional. They can be set using the 'set_webhook' tool, which also sets the webhook URL.\nWhen webhook headers are set, 360Dialog will send webhooks to the channel's webhook URL and add the specified headers.\n\nThis helps only authenticated requests pass through app firewalls, if the user has any.\n\nExample:\n\nIf webhook URL is `https://foo.com/webhook`, and webhook headers are set to {\"x-360dialog-webhook-security\": \"RANDOM-STRING\"},\nthe webhook URL will receive POST requests like this:\n\nPOST https://foo.com/webhook\nHEADERS\n    x-360dialog-webhook-security: RANDOM-STRING",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel_id": {
                "description": "Needs to end with 'CH'.",
                "maxLength": 8,
                "minLength": 8,
                "pattern": "(?i)^.*ch$",
                "type": "string"
              }
            },
            "required": ["channel_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "configured": {
                "type": "boolean"
              },
              "masked_headers": {
                "additionalProperties": {
                  "type": "string"
                },
                "default": {},
                "type": "object"
              },
              "message": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "webhook": {
                "anyOf": [
                  {
                    "properties": {
                      "headers": {
                        "default": [],
                        "items": {
                          "additionalProperties": {
                            "type": "string"
                          },
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["configured"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get webhook"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": ["client"]
            }
          },
