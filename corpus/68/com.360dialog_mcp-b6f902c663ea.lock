        {
          "name": "unblock_users",
          "title": "Unblock users",
          "description": "Unblock WhatsApp users so they can message a channel again.\n\nIdentify each user by phone number or by BSUID; pass at least one of 'phone_numbers' and 'user_ids'.\nFor a user that 'list_blocked_users' shows without a phone number, pass the BSUID in 'user_ids'.\n\nThe result lists which users were unblocked and which failed with the reason.",
          "inputSchema": {
