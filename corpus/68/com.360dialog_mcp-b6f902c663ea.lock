        {
          "name": "get_onboarding_status",
          "title": "Get onboarding status",
          "description": "Get a phone number's status on whether a number is live, what type of messages it can send today,\nand suggestions for what's next.\n\nA live number can send free-form replies inside the 24-hour customer service window immediately\n(meaning if someone messages the number, the user can respond to the message using the API).\nTemplate messages are separately blocked until Meta reviews a submitted template (template reviews\ntake up to 48 hours.)\n\nLack of business verification is not a blocker. Unverified businesses can only send 250 templates\nto unique users per 24 hours.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel_id": {
                "anyOf": [
                  {
                    "maxLength": 8,
                    "minLength": 8,
                    "pattern": "(?i)^.*ch$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Needs to end with 'CH'."
              },
              "phone_number": {
                "anyOf": [
                  {
                    "format": "phone",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The phone number of the number being onboarded"
              }
            },
            "required": ["channel_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
