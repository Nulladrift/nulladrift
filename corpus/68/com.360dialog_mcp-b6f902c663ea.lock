        {
          "name": "get_messaging_analytics",
          "title": "Get messaging analytics",
          "description": "Show messages sent, delivered and billed for a phone number (channel) over a date range, and their cost.\n\nWithout dates it covers the last 7 days; ranges over 90 days are summarised by month. Days follow the WhatsApp Business Account's timezone, and today (or this month) appears only once it's over. Rate limited, so prefer one call covering the whole range.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel_id": {
                "description": "Needs to end with 'CH'.",
                "maxLength": 8,
                "minLength": 8,
                "pattern": "(?i)^[a-z0-9]+ch$",
                "type": "string"
              },
              "end_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Last day to include, as an ISO date like 2026-05-07. Defaults to today."
              },
              "granularity": {
                "anyOf": [
                  {
                    "enum": ["daily", "monthly"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Report by day or by calendar month. Defaults to daily; ranges over 90 days are always monthly."
              },
              "start_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
