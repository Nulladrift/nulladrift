        {
          "name": "update_channel_profile",
          "title": "Update channel profile",
          "description": "Update the WhatsApp profile for this channel (a.k.a. phone number.)\n\nThe user may be prompted by 360Dialog for an OTP code delivered to their email address. Make them aware of the OTP requirement.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel_id": {
                "description": "Needs to end with 'CH'.",
                "maxLength": 8,
                "minLength": 8,
                "pattern": "(?i)^.*ch$",
                "type": "string"
              },
              "new_profile": {
                "additionalProperties": false,
                "description": "Changes to the business profile. This is a PATCH request, so only pass fields the user wants changed. If you want to clear a field, set it to null. If you don't want to change a field, omit it from the JSON.\n        \n        e.g. JSON with no changes: {}\n        \n        e.g. JSON that only changes about text: { \"about_text\": \"Hello world\" }",
                "properties": {
                  "about_text": {
                    "anyOf": [
                      {
                        "maxLength": 256,
                        "type": "string"
                      },
                      {
                        "type": "null"
