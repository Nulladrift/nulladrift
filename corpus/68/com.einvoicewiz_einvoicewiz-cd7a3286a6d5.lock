{
  "lockfileVersion": 2,
  "subjects": {
    "com.einvoicewiz/einvoicewiz": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://einvoicewiz.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "einvoicewiz",
        "version": "1.26.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Generate and validate EN 16931 e-invoices for the German and French mandates: Factur-X / ZUGFeRD 2.x (PDF/A-3 with embedded CII XML) and XRechnung 3.0 (pure XML, KOSIT rules). A plain PDF invoice is NOT a legal e-invoice in Germany (since 2025-01-01) or France (since 2026-09-01); use these tools when a recipient is an EU business or authority that requires a compliant file. Every file that passes validation receives a permanent verification certificate (EIW-…) the recipient can check. Validation failures are never charged. If you have no API key, call signup(email) first (20 free credits).",
      "tools": [
        {
          "name": "check_credits",
          "description": "Credits remaining and calls used for an API key.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "default": "",
                "title": "Api Key",
                "type": "string"
              }
            },
            "title": "check_creditsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6f6eafb1a59cb0e3eda74dd5110a38074c5bab82db7cca17f679a884d2a28d4b"
        },
        {
          "name": "create_facturx_pdf",
          "description": "Your existing PDF invoice + invoice JSON → Factur-X / ZUGFeRD PDF/A-3 with embedded XML (1 credit).\n\n    pdf_base64: the original PDF, base64-encoded (max 15 MB). Returns {pdf_base64, cert_id, verify_url,\n    credits_left}. The output is validated (EN 16931 + PDF/A-3) before delivery; failures are not charged.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "default": "",
                "title": "Api Key",
                "type": "string"
              },
              "invoice": {
                "additionalProperties": true,
                "title": "Invoice",
                "type": "object"
              },
              "pdf_base64": {
                "title": "Pdf Base64",
                "type": "string"
              }
            },
            "required": ["invoice", "pdf_base64"],
            "title": "create_facturx_pdfArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8a155f42181064b173fbcace7e3e59e4565f0998a46f5e5a830b80564b5c46e2"
        },
        {
          "name": "generate_einvoice_xml",
          "description": "Invoice JSON → validated EN 16931 CII XML (1 credit; failures free).\n\n    profile: \"en16931\" (Factur-X/ZUGFeRD data, B2B) or \"xrechnung\" (German public sector; needs\n    invoice.buyer_reference = Leitweg-ID and seller contact_email/contact_phone).\n    Invoice schema: see https://einvoicewiz.com/openapi.json  (required: invoice_number, issue_date,\n    currency, seller{name,country}, buyer{name,country}, lines[{name,qty,unit_price,vat_rate}]).\n    Returns {xml, validation, verify:{id,url}, credits_left}. On 422 the body lists the violated rules.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "default": "",
                "title": "Api Key",
                "type": "string"
              },
              "invoice": {
                "additionalProperties": true,
                "title": "Invoice",
                "type": "object"
              },
              "profile": {
                "default": "en16931",
                "title": "Profile",
                "type": "string"
              }
            },
            "required": ["invoice"],
            "title": "generate_einvoice_xmlArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ee4eabec232e41f33ce2c936d89a7570b997113300fb7c33342b57ee2237567b"
        },
        {
          "name": "lookup_certificate",
          "description": "Look up a verification certificate (EIW-…) — free, no key. Confirms which file hashes passed validation and when.",
          "inputSchema": {
            "properties": {
              "cert_id": {
                "title": "Cert Id",
                "type": "string"
              }
            },
            "required": ["cert_id"],
            "title": "lookup_certificateArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9b41eb74f8aefc3c171dfc156901d43c4bff13ef04efa96de8179e510ae7a60c"
        },
        {
          "name": "signup",
          "description": "Create an einvoicewiz API key with 20 free credits (no card). The key is shown once — store it.",
          "inputSchema": {
            "properties": {
              "email": {
                "title": "Email",
                "type": "string"
              }
            },
            "required": ["email"],
            "title": "signupArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:933364b54138861dd44721a4a8e9c950e598e6fd2fd7c729e97d04c8b37fbedc"
        },
        {
          "name": "validate_einvoice",
          "description": "Validate a Factur-X / ZUGFeRD / XRechnung file (PDF or XML, base64) against EN 16931 + KOSIT + PDF/A (1 credit).\n\n    Returns the rule-level report {result:{status, errors[], warnings[], profile}, verify, credits_left}.\n    verify is set only when the file passed.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "default": "",
                "title": "Api Key",
                "type": "string"
              },
              "file_base64": {
                "title": "File Base64",
                "type": "string"
              }
            },
            "required": ["file_base64"],
            "title": "validate_einvoiceArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a848f7987ad9f0f89382b5a135aa70c7e95dbb0a4cc45f7c203cb77aff443631"
        },
        {
          "name": "which_format_do_i_need",
          "description": "Decision helper (free, no key): which e-invoice format a recipient needs and whether a plain PDF is still acceptable.",
          "inputSchema": {
            "properties": {
              "recipient_country": {
                "title": "Recipient Country",
                "type": "string"
              },
              "recipient_is_public_authority": {
                "default": false,
                "title": "Recipient Is Public Authority",
                "type": "boolean"
              }
            },
            "required": ["recipient_country"],
            "title": "which_format_do_i_needArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:962969cfded9661faeffdf53f4abcea33f41a9415316a858d5b1ec0044e29207"
        }
      ],
      "digest": "sha256:0e3535ea0754ab664533ba597f7a9eccac813d1ecabd2e3018aa0effeae03eed"
    }
