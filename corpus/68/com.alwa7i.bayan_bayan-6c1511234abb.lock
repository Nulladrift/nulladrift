{
  "lockfileVersion": 2,
  "subjects": {
    "com.alwa7i.bayan/bayan": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bayan.alwa7i.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "bayan",
        "title": "البيان — Bayan Islamic encyclopedia",
        "version": "1.0.0",
        "websiteUrl": "https://bayan.alwa7i.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "البيان (bayan.alwa7i.com) موسوعة إسلامية عربية: أحاديث بدرجاتها وتخريجها، وآيات بتفسيرها، ورواة، ومقالات. Use `search` first when you only have words; then get_hadith / get_verse for details. When you quote a result, cite Bayan and give the item's `link` so the reader can verify it on the site. Results are Arabic. Do not present a grade or takhrij that is not in the result.",
      "tools": [
        {
          "name": "get_article",
          "title": "مقالة",
          "description": "One Bayan article by its slug (from list_articles or search): full text and link.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7be553a0811d48a4ac3db57a5c3016cfdf224ef32d36ceac6698ef1e579cd1bf"
        },
        {
          "name": "get_hadith",
          "title": "حديث",
          "description": "A hadith by book and its number as cited (e.g. Sahih al-Bukhari 1 = «إنما الأعمال بالنيات»), or by `seq` from a search result or a site link: its text, grade, takhrij (where known), narrators, related Bayan articles and the link to its page.",
          "inputSchema": {
            "properties": {
              "book": {
                "description": "Book slug: sahih-al-bukhari, sahih-muslim, sabil-al-rashad, sunan-abi-dawud, jami-al-tirmidhi, sunan-al-nasai, sunan-ibn-majah, musnad-ahmad, al-muwatta",
                "type": "string"
              },
              "number": {
                "description": "The hadith's number in the book, as it is cited",
                "type": "integer"
              },
              "seq": {
                "description": "Alternatively, its place in the book (the `seq` of search results and site links)",
                "type": "integer"
              }
            },
            "required": ["book"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a8fbc7e265a598e7eb9e979ec1f5549bda9dbbc8ee770058bf7ffcf8286b37e6"
        },
        {
          "name": "get_narrator",
          "title": "راوٍ",
          "description": "A hadith narrator by name: the link to his page on Bayan (his grade in the books of jarh wa ta'dil) and related articles.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Arabic name, e.g. «الوليد بن مسلم»",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ec198aaa7841442f3676657fe4cf6c03b9784baecdd52f5ae6d13d7ab8e859dc"
        },
        {
          "name": "get_verse",
          "title": "آية وتفسيرها",
          "description": "A Qur'an verse by surah and ayah number, with passages of its tafsir from the classical books and the link to its page.",
          "inputSchema": {
            "properties": {
              "ayah": {
                "minimum": 1,
                "type": "integer"
              },
              "surah": {
                "maximum": 114,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["ayah", "surah"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:faf0b29edddd172d208bba6417df4c41b1fa0a8ff20799ddbe1b8d78c825c6c4"
        },
        {
          "name": "list_articles",
          "title": "مقالات البيان",
          "description": "Bayan's published articles and answers, newest first, with links (paged).",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category slug",
                "type": "string"
              },
              "page": {
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:539ac7a48a45c9aacd01fcb364f0b4a826e520e2ac8d6806e5e5cf21265cfd14"
        },
        {
          "name": "search",
          "title": "بحث في البيان",
          "description": "Search Bayan (Arabic Islamic encyclopedia) for verses, hadiths (Sabil al-Rashad, Sahih al-Bukhari, Sahih Muslim) and articles containing the given Arabic words. Returns a few of each with links to the site.",
          "inputSchema": {
            "properties": {
              "q": {
                "description": "Arabic words, e.g. «إنما الأعمال بالنيات»",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6ae9724de5638e26684678adc492a9e2081657671e6970e10b0c3f4f72bcc7b9"
        }
      ],
      "digest": "sha256:5b56617e78497b2b8f9a5bbe3075de46725c5ae3b3fde799f0356b4f4ba0a273"
    }
  }
}
