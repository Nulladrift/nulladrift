        {
          "name": "websiteSourceCode_files_search",
          "title": "Search source files",
          "description": "Finds text across every source file and returns one entry per matching line with its file name, line, and column. Call this first to locate code, then read only the files it names with websiteSourceCode.files.read. `pattern` is literal text unless `isRegex` is set, and matching is line by line, so a pattern cannot span a newline. Narrow with `nameGlob` and `type`, ask for surrounding lines with `contextLines`, or set `filesOnly` for the cheapest orientation. Results are cursor-paginated over matches.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "caseSensitive": {
                "description": "Match case exactly. Defaults to `true`.",
                "type": "boolean"
              },
              "contextLines": {
                "description": "Surrounding lines to return on each side of a match (0 to 3). Defaults to 0.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "cursor": {
                "description": "Opaque cursor from the previous page. Pass the returned `version` too to keep the search pinned.",
                "type": "string"
              },
              "filesOnly": {
                "description": "Return one entry per matching file, with no line detail.",
                "type": "boolean"
              },
              "isRegex": {
                "description": "Read `pattern` as a regular expression. JavaScript syntax works, including `\\b`, `\\d`, lookahead, and lazy quantifiers; named capture groups are not supported.",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Maximum matches to return per page. Defaults to 20, maximum 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "maxMatchesPerFile": {
                "description": "Maximum matches from any one file (up to 50). Defaults to 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "nameGlob": {
                "description": "Only search names matching this glob. `*` and `?` stop at a `/`; `**` crosses them, for example `blog/**`.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "pattern": {
                "description": "Text to find. Literal unless `isRegex` is set. Matched line by line, so `^` and `$` anchor to line boundaries and a pattern cannot span a newline.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "target": {
                "description": "Version alias to read: `head` (default) or `published`.",
                "enum": ["head", "published"],
                "type": "string"
              },
              "type": {
                "description": "Only search files of this type.",
                "enum": ["page", "component", "module", "server_function", "global_css", "not_found", "website_config", "custom_head_start", "custom_head_end", "custom_body_start", "custom_body_end"],
                "type": "string"
              },
              "version": {
                "description": "Explicit source version. Takes precedence over `target`.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "websiteId": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["pattern", "websiteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "method": "post",
