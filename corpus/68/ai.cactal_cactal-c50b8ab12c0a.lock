          "description": "Read the matching Cactal skill before acting: source-editing-workflow before source edits, design-direction for design, copywriting for words. Required skills are included.\n\n- analytics: Traffic, visitors, referrers, and other analytics reports\n- assets-and-media: Find, import, or place images, video, fonts, favicons\n- cms-content-editing: Create, edit, publish, schedule, or delete CMS items\n- cms-data-in-pages: Show CMS content on pages with definePage queries\n- cms-item-queries: Filter, search, and sort CMS item lists\n- cms-modeling: Create or change CMS collections and fields\n- copywriting: Write or rewrite website copy\n- design-direction: New visual design or restyling of palette, type, and layout\n- forms: Forms, submissions, and notification recipients\n- imports-and-modules: Imports, components, and shared modules\n- npm-packages: Add, upgrade, or debug npm packages\n- page-metadata-and-seo: Page metadata, SEO, social cards, and sitemaps\n- pages-and-routes: Create pages, routes, URL params, and a custom 404\n- publishing-and-recovery: Publish, roll back, restore, or unpublish the website\n- rendering-and-browser-apis: Browser-only APIs, Intl, and server render failures\n- server-functions: Server functions and website secrets\n- shaders: Build GPU effects with Paper Shaders or custom GLSL\n- source-editing-workflow: Read before any page, component, CSS, or config edit\n- source-files-and-naming: Create, delete, or name source files\n- styling-and-css: Global CSS, Tailwind theme, and fonts\n- validate-and-preview: Checks, diagnostics, screenshots, and deployments\n- web-research: Public web facts and studying reference sites\n- website-config: Redirects, response headers, and website_config\n- website-settings-and-domains: Rename the website or slug, hosts, custom domains, DNS",
          "inputSchema": {
