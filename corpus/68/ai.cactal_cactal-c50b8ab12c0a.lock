        {
          "name": "websiteAnalytics_query_get",
          "title": "Query analytics totals and breakdowns",
          "description": "Returns aggregate engagement totals — page views, distinct visitors, visits, bounces, and total time in seconds — for a date range, optionally broken down by one dimension. Use it to answer \"how much traffic did the site get\" and \"what are the top pages/referrers/countries\" style questions; use the timeseries endpoint when you need values over time instead. `startAt` and `endAt` are Unix epoch milliseconds; optional filter parameters (path, referrer, country, event, UTM fields, ...) narrow the data. Without `dimension` the response carries the totals alone. With `dimension` (e.g. `path` for top pages, `referrer` for top referrers, `country` for top countries) the response also carries `rows`: up to `limit` (default 25, max 1000) values of that dimension ranked by page views, each with its own engagement totals. Requires a plan that includes analytics (403 otherwise); all-zero totals until the website is published and has traffic.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "browser": {
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "cohort": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "device": {
                "type": "string"
              },
              "dimension": {
                "description": "Break the range down by this dimension, e.g. `path` for top pages, `referrer` for top referrers, `country` for top countries. Omit for totals only.",
                "enum": ["path", "entry", "exit", "title", "query", "referrer", "channel", "domain", "country", "region", "city", "browser", "os", "device", "language", "screen", "event", "hostname", "tag", "distinctId"],
                "type": "string"
              },
              "distinctId": {
                "type": "string"
              },
              "endAt": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "event": {
                "type": "string"
              },
              "hostname": {
                "type": "string"
              },
              "language": {
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Maximum number of dimension rows to return (default 25, max 1000). Only used when `dimension` is set.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "os": {
                "type": "string"
              },
              "path": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "referrer": {
                "type": "string"
              },
