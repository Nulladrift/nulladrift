          "title": "List items in a collection",
          "description": "Returns the collection’s active items in manual (drag) order by default, 20 per page (max 100); paginate with `cursor` or with 1-based `page` offsets, not both. Filter with `published` (`true` / `false`) and a JSON-encoded `filter` map of `{ fieldKey: { operator: value } }` — operators `eq`, `neq`, `in`, `nin`, `gt`, `gte`, `lt`, `lte`, `contains`, `startsWith`, `endsWith`, and `exists`, plus `slug` equality on reference fields; metadata keys are `id`, `slug`, `publishedAt`, `publishAt`, `createdAt`, and `updatedAt`. Combine clauses with `filterLogic` (`and` by default, or `or`). `search` accepts a query string (1–200 characters) or JSON `{ \"query\", \"fields\" }` to restrict which text fields are searched; `sort` accepts JSON `{ \"kind\": \"field\" | \"meta\", \"field\", \"direction\": \"asc\" | \"desc\" }`, where sortable metadata fields are `id`, `slug`, `publishedAt`, `publishAt`, `createdAt`, `updatedAt`, and `position`. `depth` (0–3, default 0) embeds referenced items in place of their ids, one level per unit.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "collectionId": {
                "minLength": 1,
                "type": "string"
              },
              "cursor": {
                "type": "string"
              },
              "depth": {
                "default": 0,
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "filter": {
                "type": "string"
              },
              "filterLogic": {
                "enum": ["and", "or"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "published": {
                "anyOf": [
                  {
                    "const": "true",
                    "type": "string"
                  },
                  {
                    "const": "false",
                    "type": "string"
                  }
                ]
              },
              "search": {
                "type": "string"
              },
              "sort": {
                "type": "string"
              }
            },
            "required": ["collectionId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
