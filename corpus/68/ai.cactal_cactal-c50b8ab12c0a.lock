        {
          "name": "websitePreview_capture",
          "title": "Capture a page screenshot",
          "description": "Renders one page of the site in a real browser and returns the image, so you can check layout, spacing, and responsive behaviour that source-level checks cannot see. `path` is site-relative and may include a query string, so dynamic routes are captured with real values rather than placeholders. Focus the capture with `selector` (plus optional `padding` for surrounding context) or a `clip` rectangle in CSS pixels from the top-left of the page; the region is scrolled into view and captured within the configured viewport, so it must fit inside it, and these options exclude each other and `fullPage`. Fonts, images, and (for `fullPage`) lazy content are awaited before the capture, and CSS animations are fast-forwarded to their end state by default. Fails with 409 when the draft build is still in progress or has failed; poll `websiteSourceCode.deployment.status` and retry.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "clip": {
                "description": "Crop to this rectangle, in CSS pixels from the top-left of the rendered page at the chosen viewport; it is scrolled into view and must fit within the viewport. Only for regions no selector frames.",
                "properties": {
                  "height": {
                    "maximum": 2000,
                    "minimum": 1,
                    "type": "number"
                  },
                  "width": {
                    "maximum": 2000,
                    "minimum": 1,
                    "type": "number"
                  },
                  "x": {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "y": {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["height", "width", "x", "y"],
                "type": "object"
              },
              "colorScheme": {
                "description": "Browser color preference to emulate. Omit it to use the renderer default.",
                "enum": ["dark", "light"],
                "type": "string"
              },
              "delayMs": {
                "description": "Extra settle time before capturing, in milliseconds.",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "freezeAnimations": {
                "default": true,
                "description": "Fast-forward CSS animations and transitions to their end state so captures are deterministic.",
                "type": "boolean"
              },
              "fullPage": {
                "default": false,
                "description": "Capture the whole scrollable page instead of just the viewport. Excludes `selector` and `clip`.",
                "type": "boolean"
              },
              "padding": {
                "description": "CSS pixels of surrounding page to include on every side of the `selector` match.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "path": {
                "default": "/",
                "description": "Site-relative path to render, including any query string, e.g. `/blog/my-post`.",
                "maxLength": 2048,
                "pattern": "^\\/([^/\\\\\\s][^\\\\\\s]*)?$",
                "type": "string"
              },
              "scrollTo": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                ],
                "description": "Scroll to a CSS selector or an absolute Y offset before capturing."
              },
              "selector": {
                "description": "Crop to the first element matching this CSS selector, scrolled into view. Preferred: it follows the layout at every viewport.",
                "minLength": 1,
                "type": "string"
              },
              "target": {
                "default": "head",
                "description": "`head` renders the current draft; `published` renders the live site.",
                "enum": ["head", "published"],
                "type": "string"
              },
              "viewport": {
                "default": "desktop",
                "description": "Device class to render at.",
                "enum": ["desktop", "tablet", "mobile"],
                "type": "string"
              },
              "waitForSelector": {
                "description": "Wait for this CSS selector to match before capturing.",
                "minLength": 1,
                "type": "string"
              },
              "websiteId": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["websiteId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "method": "post",
            "operationId": "websitePreview.capture",
            "path": "/v1/websitePreview/capture",
            "requiredCapability": "websitePreview.capture",
            "securitySchemes": [
              {
                "scopes": ["mcp", "offline_access"],
                "type": "oauth2"
              }
            ]
          },
