        {
          "name": "websites_list",
          "title": "List websites",
          "description": "Lists accessible websites. By default returns active websites: use `organizationId` to scope one organization, `scope=shared` without it for direct grants outside your memberships, or `scope=all` with it to combine both; supports `sort` by `createdAt`, `updatedAt`, or `name` and case-insensitive `search`, and each item includes `organizationSlug`, `primaryHostname`, and whether it is `shared`. Pass `status=deleted` with `organizationId` (requires organization-level trash access) to list restorable soft-deleted websites instead, each with its deletion time and purge deadline; deleted rows drop out when their 30-day restore window expires. Both modes use cursor pagination (default 20 per page, maximum 100). Fetch one website with `websites.get`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cursor": {
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "organizationId": {
                "minLength": 1,
                "type": "string"
              },
              "scope": {
                "enum": ["shared", "all"],
                "type": "string"
              },
              "search": {
                "maxLength": 200,
                "type": "string"
              },
              "sort": {
                "enum": ["createdAt", "updatedAt", "name"],
                "type": "string"
              },
              "status": {
                "description": "Which websites to list. Defaults to `active`. `deleted` returns the organization’s restorable soft-deleted websites (requires `organizationId` and organization-level trash access) with their deletion time and purge deadline.",
                "enum": ["active", "deleted"],
                "type": "string"
              }
            },
            "type": "object"
