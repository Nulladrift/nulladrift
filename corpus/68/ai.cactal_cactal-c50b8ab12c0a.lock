                "type": "string"
              },
              "startAt": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "tag": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "utmCampaign": {
                "type": "string"
              },
