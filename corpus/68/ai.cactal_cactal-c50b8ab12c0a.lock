        {
          "name": "cms_fields_update",
          "title": "Update a field",
          "description": "Updates `displayName`, `description`, `required`, `isUnique`, `example`, and (for `option` fields only) `config`; `type` and `targetCollectionId` are immutable. Setting `required: true` is rejected until every active item has a valid value for the field. Setting `isUnique: true` enforces uniqueness on all future writes and fails with a conflict when existing values already collide; unique is not supported for `plain_text`, `markdown`, `multi_reference`, `image`, `gallery`, or `file` fields. Pass `key` to rename the field’s key: the key is atomically migrated in every stored item’s `data` in the same transaction (no values are lost), a conflict is returned when the new key is already used in the collection, and when the website has a published version the rename is validated against the published site’s content queries. Pass `position: \"first\"` or `\"last\"`, or `\"before\"` / `\"after\"` together with `anchorFieldId`, to move the field within the collection’s display order.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "anchorFieldId": {
                "description": "Sibling field to move against when `position` is `\"before\"` or `\"after\"`.",
                "minLength": 1,
                "type": "string"
              },
              "config": {
                "properties": {
                  "choices": {
                    "items": {
                      "properties": {
                        "id": {
                          "maxLength": 100,
                          "minLength": 1,
                          "type": "string"
                        },
                        "label": {
                          "maxLength": 200,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["id", "label"],
                      "type": "object"
                    },
                    "maxItems": 1000,
                    "minItems": 1,
                    "type": "array"
                  },
                  "multiple": {
                    "type": "boolean"
                  }
                },
                "required": ["choices"],
                "type": "object"
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "displayName": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "example": {},
              "fieldId": {
                "minLength": 1,
                "type": "string"
              },
              "isUnique": {
                "type": "boolean"
              },
              "key": {
                "description": "New key for the field — a rename. Omit to keep the current key. Atomically migrates the key in every stored item’s `data`, so no values are lost.",
                "pattern": "^[a-z][a-z0-9_]{0,63}$",
                "type": "string"
              },
              "position": {
                "description": "Moves the field within the collection’s display order. Omit to leave the order unchanged. `\"before\"` / `\"after\"` require `anchorFieldId`.",
                "enum": ["before", "after", "first", "last"],
                "type": "string"
              },
              "required": {
                "type": "boolean"
              }
            },
            "required": ["fieldId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "method": "patch",
            "operationId": "cms.fields.update",
            "path": "/v1/cms/fields/:fieldId",
            "requiredCapability": "cms.fields.update",
            "securitySchemes": [
              {
                "scopes": ["mcp", "offline_access"],
                "type": "oauth2"
              }
            ]
