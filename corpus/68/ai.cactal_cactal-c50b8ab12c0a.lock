                "type": "string"
              },
              "depth": {
                "default": 0,
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "itemId": {
                "description": "Item id. Provide either this or the `collectionId` + `slug` pair.",
                "minLength": 1,
                "type": "string"
              },
              "published": {
                "anyOf": [
                  {
                    "const": "true",
                    "type": "string"
                  },
                  {
                    "const": "false",
                    "type": "string"
                  }
                ],
                "description": "Only match a published (`\"true\"`) or draft (`\"false\"`) item; a mismatch reads as not found. Omit to match either."
