        {
          "name": "webResearch_screenshot",
          "title": "Capture an external page",
          "description": "Renders an external public page in a real browser and returns the image, to study a reference site or the user's existing site: its layout, hierarchy, density, and feel. Consent banners and overlays are dismissed first. Focus with `selector` (plus `padding`) or `clip` and page down with `scrollTo`; external pages render in their own color scheme and never full page. Capture your own website with `websitePreview.capture`. Charged in AI credits to the website's organization.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "clip": {
                "description": "Crop to this rectangle, in CSS pixels from the top-left of the rendered page at the chosen viewport; it is scrolled into view and must fit within the viewport. Only for regions no selector frames.",
                "properties": {
                  "height": {
                    "maximum": 2000,
                    "minimum": 1,
                    "type": "number"
                  },
                  "width": {
                    "maximum": 2000,
                    "minimum": 1,
                    "type": "number"
                  },
                  "x": {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "y": {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["height", "width", "x", "y"],
                "type": "object"
              },
              "delayMs": {
                "description": "Extra settle time before capturing, in milliseconds.",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "freezeAnimations": {
                "default": true,
                "description": "Fast-forward CSS animations and transitions to their end state so captures are deterministic.",
                "type": "boolean"
              },
              "padding": {
                "description": "CSS pixels of surrounding page to include on every side of the `selector` match.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "scrollTo": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                ],
                "description": "Scroll to a CSS selector or an absolute Y offset before capturing."
              },
              "selector": {
                "description": "Crop to the first element matching this CSS selector, scrolled into view. Preferred: it follows the layout at every viewport.",
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "Absolute public http(s) URL of the page to capture.",
                "format": "uri",
