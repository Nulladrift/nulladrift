        {
          "name": "cms_items_create",
          "title": "Create an item",
          "description": "Creates an item at the end of the collection’s manual order. Scalar values go in `data` keyed by field key and are validated against the field types — unknown keys are rejected, required fields must be present, `plain_text` and `markdown` are capped at 1,048,576 bytes (markdown must not contain raw HTML), `date` values are ISO 8601 with timezone, and `color` values are normalized to hex. Relationship and asset values go in the side maps: `references` (`reference`: an item id; `multi_reference`: an ordered array of up to 1,000 ids), `images` (`image`: an asset id or `{ assetId, altText }`; `gallery`: an ordered array of up to 25 of those), and `files` (`file`: an asset id or `{ assetId }`). `slug` is optional — it is derived from `data.title` or `data.name` when omitted. Set a non-future `publishedAt` to create an already-published item, or a future `publishAt` to schedule it; the two fields are mutually exclusive.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "collectionId": {
                "minLength": 1,
                "type": "string"
              },
              "data": {
                "additionalProperties": {},
                "default": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "files": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "anyOf": [
                        {
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "properties": {
                            "assetId": {
                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "required": ["assetId"],
                          "type": "object"
                        }
                      ]
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "images": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "anyOf": [
                        {
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "additionalProperties": false,
                          "properties": {
                            "altText": {
                              "anyOf": [
                                {
                                  "maxLength": 2000,
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "assetId": {
                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "required": ["assetId"],
                          "type": "object"
                        }
                      ]
                    },
                    {
                      "items": {
                        "anyOf": [
                          {
                            "minLength": 1,
                            "type": "string"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "altText": {
                                "anyOf": [
                                  {
                                    "maxLength": 2000,
                                    "type": "string"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ]
                              },
                              "assetId": {
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": ["assetId"],
                            "type": "object"
                          }
                        ]
                      },
                      "maxItems": 25,
                      "type": "array"
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "publishAt": {
                "anyOf": [
                  {
                    "format": "date-time",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Future absolute timestamp for scheduled publication. Cannot be combined with `publishedAt`."
              },
              "publishedAt": {
                "anyOf": [
                  {
                    "format": "date-time",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Initial publication timestamp. Must not be in the future. Omit for a draft, or use `publishAt` to schedule publication."
              },
              "references": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "minLength": 1,
                      "type": "string"
                    },
                    {
                      "items": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 1000,
                      "type": "array"
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
