      "instructions": "Cactal builds and runs production websites: React + Tailwind source, CMS content, assets, forms, domains, analytics, and publishing. Before working on something, read the matching guide with skills_read. profile_get names the organizations and websites you can use. Read websiteKnowledge_project_get before working on a website. Publishing changes the live site, so publish only when the user asks.\n\nBefore building a new website, ask what it is for and for any link where it already appears online (a current site, Google listing, Instagram, or Yelp), unless the user already said, so it is built from their real details and photos.\n\nEditing: find files with websiteSourceCode_files_search or websiteSourceCode_files_list, read with websiteSourceCode_files_read, and change them with websiteSourceCode_files_strReplace (many files in one commit; dryRun previews) or websiteSourceCode_files_upsert. Edits become draft versions and never touch the live site. Check with websiteSourceCode_head_check and look at the draft with websitePreview_capture. Publish with websiteSourceCode_head_publish, passing the checked version, then poll websiteSourceCode_deployment_status. websiteSourceCode_published_unpublish takes a site offline and keeps its history.\n\nRecord what the user states that later work needs with websiteKnowledge_agentNotes_edit.\n\nServer functions are source files that run on the server with the website's secrets as env. Test one on the draft with websiteFunctions_invoke, which makes its real outgoing requests, and debug with websiteFunctions_runs_list. MCP never sets or reads secret values: websiteSecrets_list shows which names exist, and the user adds or replaces values at the link it returns. Never ask the user to paste a secret into the conversation.\n\ndocs_search and docs_read cover setup, the API reference, limits, and plans. Plans and billing change in the Cactal dashboard, never here.\n\nFailed calls return isError with a kind, a message, and usually a suggestion naming the next step.",
      "tools": [
