        {
          "name": "websiteAnalytics_timeseries_get",
          "title": "Get an analytics time series",
          "description": "Returns one traffic time series bucketed by `unit` (`year`, `month`, `day`, `hour`, or `minute`). `series` selects which: `pageviews` returns parallel `pageviews` and `sessions` arrays with one point per time bucket (and accepts `compare` — `prev` or `yoy` — to request comparison data for the previous period or year), while `events` returns tracked custom-event counts as one `events` point per event name per time bucket. Only the requested series' fields are present in the response. `startAt` and `endAt` are Unix epoch milliseconds; `timezone` is an IANA name (e.g. `America/New_York`) that controls bucket boundaries; optional filter parameters narrow the data. The series is capped to the most recent `maxPoints` time buckets (default 30, max 500); a `truncated` field reports when the cap was applied. Requires a plan that includes analytics (403 otherwise); empty until the website is published and has traffic.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "browser": {
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "cohort": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "compare": {
                "description": "Request comparison data alongside the primary series: `prev` for the previous period, `yoy` for the same range one year earlier. Only valid when `series` is `pageviews`.",
                "enum": ["prev", "yoy"],
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "device": {
                "type": "string"
              },
              "distinctId": {
                "type": "string"
              },
              "endAt": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "event": {
                "type": "string"
              },
              "hostname": {
                "type": "string"
              },
              "language": {
                "type": "string"
              },
              "maxPoints": {
                "default": 30,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "os": {
                "type": "string"
              },
              "path": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "referrer": {
                "type": "string"
              },
              "region": {
                "type": "string"
              },
              "segment": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "series": {
                "description": "Which time series to return: `pageviews` for page views and sessions per bucket, `events` for tracked custom-event counts per event name per bucket.",
                "enum": ["pageviews", "events"],
                "type": "string"
              },
              "startAt": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "tag": {
                "type": "string"
              },
              "timezone": {
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "unit": {
                "enum": ["year", "month", "day", "hour", "minute"],
                "type": "string"
              },
              "utmCampaign": {
                "type": "string"
              },
              "utmContent": {
                "type": "string"
              },
              "utmMedium": {
                "type": "string"
              },
              "utmSource": {
                "type": "string"
              },
              "utmTerm": {
                "type": "string"
              },
