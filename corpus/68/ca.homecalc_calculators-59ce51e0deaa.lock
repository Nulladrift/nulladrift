                "description": "Down payment in CAD",
                "minimum": 0,
                "type": "number"
              },
              "firstTimeBuyerNewBuild": {
                "default": false,
                "description": "First-time buyer buying a new build (30-year insured amortization)",
                "type": "boolean"
              },
              "homePrice": {
                "description": "Purchase price in CAD",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "province": {
                "default": "Ontario",
                "description": "Province, for sales tax on the premium",
                "enum": ["Ontario", "British Columbia", "Alberta", "Quebec", "Manitoba", "Saskatchewan", "Nova Scotia", "New Brunswick", "Newfoundland and Labrador", "Prince Edward Island"],
                "type": "string"
              }
            },
            "required": ["downPayment", "homePrice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d98e93a06909e37fed0a7843b81052f4738473d52dfaddb716c8cb1083d163c9"
        },
        {
          "name": "cost_of_selling",
          "title": "Cost of Selling a House Calculator (Canada)",
          "description": "Total cost of selling a Canadian home and what you walk away with: commission + GST/HST (province starting rates, all overridable), legal fees, mortgage discharge fee and other costs, then net proceeds after the mortgage is paid off.",
