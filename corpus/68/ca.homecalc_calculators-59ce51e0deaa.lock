        {
          "name": "mortgage_penalty",
          "title": "Mortgage Prepayment Penalty Calculator (IRD)",
          "description": "Estimate the penalty to break a Canadian mortgage: three months' interest vs the interest rate differential (IRD), incl. the big-bank posted-rate method. Fixed = greater of the two; variable = usually three months' interest. The three optional rate inputs are lender-specific: if omitted, illustrative site defaults are used (the answer can be several times off) and listed in `assumedInputs` — show them to the user and have them confirm with their lender.",
          "inputSchema": {
            "examples": [
              {
                "balance": 400000,
                "contractRatePct": 4.29,
                "monthsRemaining": 30,
                "postedAtOriginationPct": 6.49,
                "todaysPostedForClosestTermPct": 6.09
              }
            ],
            "properties": {
              "balance": {
                "description": "Outstanding mortgage balance in CAD",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "contractRatePct": {
                "description": "Your contract rate as a percent, e.g. 5.25",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "currentRateForRemainingTermPct": {
                "description": "Monoline method: today's rate for the remaining term (percent). Omit if unknown (assumption is flagged).",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "lenderMethod": {
                "default": "big-bank",
                "description": "Big banks use the posted-rate IRD, monolines actual rates. Either can be larger, depending on the original discount vs today's posted rate.",
                "enum": ["big-bank", "monoline"],
                "type": "string"
              },
              "monthsRemaining": {
                "description": "Months remaining in the term",
                "maximum": 120,
                "minimum": 0,
                "type": "number"
              },
              "postedAtOriginationPct": {
                "description": "Big-bank method: posted (not discounted) rate when signed, from the mortgage documents. Can change the penalty several-fold. Omit if unknown (assumption is flagged).",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "rateType": {
                "default": "fixed",
                "description": "Fixed or variable mortgage",
                "enum": ["fixed", "variable"],
                "type": "string"
              },
              "todaysPostedForClosestTermPct": {
                "description": "Big-bank method: the lender's posted rate today for the closest term. Omit if unknown (assumption is flagged).",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["balance", "contractRatePct", "monthsRemaining"],
            "type": "object"
          },
