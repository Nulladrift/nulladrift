{
  "lockfileVersion": 2,
  "subjects": {
    "ca.homecalc/calculators": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://homecalc.ca/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "homecalc",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "HomeCalc.ca provides accurate, source-backed Canadian mortgage and real-estate calculators. Use these tools to answer Canadian home-buying, mortgage, and tax math questions with 2026 figures: mortgages (payment, amortization, stress test, qualifying, renewal, prepayment, penalty, CMHC, HELOC, reverse), buying and selling costs (land transfer tax, closing costs, commission, property tax), income and capital gains tax, and investing (cap rate, flips, rent vs buy, renovations, development). Every result includes a source link on homecalc.ca and is an estimate, not financial advice — surface both to the user.",
      "tools": [
        {
          "name": "bc_home_flipping_tax",
          "title": "BC Home Flipping Tax Calculator",
          "description": "Estimate British Columbia's home flipping tax on a property sold within 730 days: 20% tapering to 0% between 366 and 730 days, with a $20,000 primary-residence deduction (only if held at least 365 days).",
          "inputSchema": {
            "examples": [
              {
                "daysHeld": 500,
                "taxableIncome": 120000
              }
            ],
            "properties": {
              "daysHeld": {
                "description": "Days owned before the sale",
                "minimum": 0,
                "type": "number"
              },
              "isPrimaryResidence": {
                "default": false,
                "description": "Lived in it as a primary residence",
                "type": "boolean"
              },
              "taxableIncome": {
                "description": "Proceeds minus cost to acquire minus cost to improve (may be negative)",
                "type": "number"
              }
            },
            "required": ["daysHeld", "taxableIncome"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:80ce8c2d00cad41bf6375d582bd0f412b3508e4b1ef6876881e767de73bb908b"
        },
        {
          "name": "bc_rescission_period",
          "title": "BC Home Buyer Rescission Period Calculator",
          "description": "British Columbia's 3-business-day home buyer rescission period: the deadline (11:59 p.m. on the third business day after acceptance, skipping weekends and BC statutory holidays) and the 0.25% fee to rescind.",
          "inputSchema": {
            "examples": [
              {
                "acceptanceDate": "2026-11-02",
                "purchasePrice": 400000
              }
            ],
            "properties": {
              "acceptanceDate": {
                "description": "Date the offer was accepted, YYYY-MM-DD",
                "type": "string"
              },
              "purchasePrice": {
                "description": "Accepted purchase price in CAD, for the 0.25% fee",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["acceptanceDate", "purchasePrice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f3e91c6ff42485ce27452682f9f36fb58010d7e2bb540efdf887d4366a7050a"
        },
        {
          "name": "cap_rate",
          "title": "Cap Rate & Rental Property Calculator (Canada)",
          "description": "Canadian rental property analysis: cap rate, net operating income, gross rent multiplier, expense ratio, annual cash flow and cash-on-cash return, with the cap rate compared to typical local yields. Mortgage math uses Canadian semi-annual compounding.",
          "inputSchema": {
            "examples": [
              {
                "annualOperatingExpenses": 9500,
                "city": "hamilton",
                "downPayment": 130000,
                "monthlyGrossRent": 3400,
                "purchasePrice": 650000
              }
            ],
            "properties": {
              "amortizationYears": {
                "default": 25,
                "description": "Mortgage amortization in years",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              },
              "annualOperatingExpenses": {
                "description": "Annual operating expenses in CAD (tax, insurance, management, maintenance, landlord utilities); excludes the mortgage",
                "minimum": 0,
                "type": "number"
              },
              "city": {
                "default": "other",
                "description": "City used for the cap-rate benchmark range",
                "enum": ["toronto", "vancouver", "calgary", "edmonton", "ottawa", "montreal", "halifax", "winnipeg", "hamilton", "kitchener-waterloo", "other"],
                "type": "string"
              },
              "downPayment": {
                "description": "Down payment in CAD. Set equal to purchasePrice for an all-cash purchase.",
                "minimum": 0,
                "type": "number"
              },
              "interestRatePct": {
                "default": 5.49,
                "description": "Mortgage rate as a percent, e.g. 5.49",
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              },
              "monthlyGrossRent": {
                "description": "Gross monthly rent for all units in CAD",
                "minimum": 0,
                "type": "number"
              },
              "propertyType": {
                "default": "single-family",
                "description": "Used for down payment warnings",
                "enum": ["single-family", "multi-unit", "commercial", "mixed-use"],
                "type": "string"
              },
              "purchasePrice": {
                "description": "Purchase price in CAD",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "vacancyRatePct": {
                "default": 5,
                "description": "Vacancy allowance as a percent of gross rent",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["annualOperatingExpenses", "downPayment", "monthlyGrossRent", "purchasePrice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e372becaa563060af54f4c94b59f5c46e3858cc0fc0cf19d65930b3535a0414"
        },
        {
          "name": "capital_cost_allowance",
          "title": "Capital Cost Allowance (CCA) Calculator",
          "description": "CRA capital cost allowance on a business or rental asset: class rate, year-1 CCA (half-year rule, AIIP or the post-2024 accelerated incentive, by acquisition date), tax saving at your marginal rate, a 5-year schedule, and recapture or terminal loss on disposal.",
          "inputSchema": {
            "examples": [
              {
                "acquisitionDate": "2026-03-01",
                "annualIncome": 120000,
                "assetCost": 400000,
                "assetPreset": "building",
                "province": "ON"
              }
            ],
            "properties": {
              "acquisitionDate": {
                "description": "Date acquired, YYYY-MM-DD; omitted = half-year rule",
                "type": "string"
              },
              "annualIncome": {
                "default": 80000,
                "description": "Taxable income before CCA, for the marginal rate",
                "minimum": 0,
                "type": "number"
              },
              "assetCost": {
                "description": "Capital cost of the asset in CAD",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "assetPreset": {
                "default": "building",
                "description": "Asset type; 'custom' uses ccaClass",
                "enum": ["building", "equipment", "computer", "vehicle", "clean-energy", "custom"],
                "type": "string"
              },
              "ccaClass": {
                "description": "CCA class id (e.g. class8, class50), used when assetPreset='custom'",
                "enum": ["class1", "class3", "class6", "class8", "class10", "class10.1", "class12", "class16", "class17", "class43", "class43.1", "class43.2", "class50", "class53", "class54", "class55"],
                "type": "string"
              },
              "disposalDate": {
                "description": "Date sold, YYYY-MM-DD, with disposalProceeds",
                "type": "string"
              },
              "disposalProceeds": {
                "default": 0,
                "description": "Proceeds if the asset is sold, for recapture or terminal loss",
                "minimum": 0,
                "type": "number"
              },
              "existingUCC": {
                "default": 0,
                "description": "Undepreciated capital cost already in the class; 0 for a new purchase",
                "minimum": 0,
                "type": "number"
              },
              "netRentalIncomeBeforeCCA": {
                "description": "Rental building only: net rental income before CCA (CCA can't create a rental loss)",
                "type": "number"
              },
              "province": {
                "default": "ON",
                "description": "Province/territory code for the marginal tax rate, e.g. ON",
                "enum": ["ON", "BC", "AB", "QC", "MB", "SK", "NS", "NB", "PE", "NL", "NT", "YT", "NU"],
                "type": "string"
              }
            },
            "required": ["assetCost"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ca0c5e8d7da86d27f813a485162b0fe2a3e6d279662ba8c0bc405207cad44a4"
        },
        {
          "name": "capital_gains_tax",
          "title": "Canadian Capital Gains Tax Calculator",
          "description": "Estimate Canadian capital gains tax on selling real estate, stocks, crypto, a business or a rental. Applies the flat 50% inclusion rate, principal-residence exemption, lifetime capital gains exemption for QSBC shares, capital-loss offsets and rental CCA recapture, then taxes the gain on top of other income at federal + provincial brackets.",
          "inputSchema": {
            "examples": [
              {
                "annualIncome": 85000,
                "purchasePrice": 600000,
                "salePrice": 900000,
                "sellingCosts": 40000
              }
            ],
            "properties": {
              "annualIncome": {
                "default": 0,
                "description": "Other annual income in CAD; the gain is taxed on top of it",
                "minimum": 0,
                "type": "number"
              },
              "assetType": {
                "default": "real-estate",
                "description": "What was sold; decides which exemptions apply",
                "enum": ["real-estate", "stocks", "crypto", "business", "rental", "other"],
                "type": "string"
              },
              "buyingCosts": {
                "default": 0,
                "description": "Land transfer tax, legal and other buying costs",
                "minimum": 0,
                "type": "number"
              },
              "capitalImprovements": {
                "default": 0,
                "description": "Capital improvements added to the adjusted cost base",
                "minimum": 0,
                "type": "number"
              },
              "capitalLosses": {
                "default": 0,
                "description": "Capital losses (prior or current) to offset the gain",
                "minimum": 0,
                "type": "number"
              },
              "ccaClaimedToDate": {
                "description": "Rental only: total CCA claimed to date",
                "minimum": 0,
                "type": "number"
              },
              "isPrincipalResidence": {
                "default": false,
                "description": "Real estate only: claim the principal residence exemption",
                "type": "boolean"
              },
              "isQSBC": {
                "default": false,
                "description": "Business only: qualified small business corporation shares (LCGE)",
                "type": "boolean"
              },
              "landValue": {
                "description": "Rental only: land portion of the sale price (splits land vs building gain)",
                "minimum": 0,
                "type": "number"
              },
              "lcgeRemaining": {
                "default": 0,
                "description": "Remaining lifetime capital gains exemption room in CAD",
                "minimum": 0,
                "type": "number"
              },
              "originalBuildingCost": {
                "description": "Rental only: original building cost for CCA recapture",
                "minimum": 0,
                "type": "number"
              },
              "province": {
                "default": "Ontario",
                "description": "Province/territory of residence",
                "enum": ["Ontario", "British Columbia", "Alberta", "Quebec", "Manitoba", "Saskatchewan", "Nova Scotia", "New Brunswick", "PEI", "Newfoundland & Labrador", "Northwest Territories", "Nunavut", "Yukon"],
                "type": "string"
              },
              "purchasePrice": {
                "description": "Original purchase price in CAD",
                "minimum": 0,
                "type": "number"
              },
              "salePrice": {
                "description": "Gross sale proceeds in CAD",
                "minimum": 0,
                "type": "number"
              },
              "sellingCosts": {
                "default": 0,
                "description": "Commission, legal and other selling costs",
                "minimum": 0,
                "type": "number"
              },
              "taxYear": {
                "default": 2026,
                "description": "Tax year of the disposition",
                "maximum": 2035,
                "minimum": 2020,
                "type": "number"
              },
              "taxpayerType": {
                "default": "individual",
                "description": "Who sold the asset",
                "enum": ["individual", "corporation", "trust"],
                "type": "string"
              },
              "yearsDesignated": {
                "default": 0,
                "description": "Years designated as your principal residence",
                "minimum": 0,
                "type": "number"
              },
              "yearsOwned": {
                "default": 0,
                "description": "Years owned (for principal-residence proration)",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["purchasePrice", "salePrice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c764eb727637c4c3b80f27ccf9c56dcbb8da315b9b93a3cbcb1bdf63ff963488"
        },
        {
          "name": "closing_costs",
          "title": "Closing Cost Calculator (Canada)",
          "description": "Cash needed to close a Canadian home purchase in any province or territory: land transfer tax (with first-time-buyer rebates, Toronto MLTT, NRST), land title and mortgage registration fees (listed separately), CMHC premium + PST, legal/inspection/appraisal/moving allowances, new-build GST/HST.",
          "inputSchema": {
            "examples": [
              {
                "downPaymentPct": 10,
                "homePrice": 600000,
                "isFirstTimeBuyer": true,
                "province": "Ontario"
              }
            ],
            "properties": {
              "amortizationYears": {
                "default": 25,
                "description": "Amortization in years (30 adds the CMHC surcharge)",
                "maximum": 30,
                "minimum": 5,
                "type": "number"
              },
              "appraisal": {
                "default": 350,
                "description": "Appraisal in CAD",
                "minimum": 0,
                "type": "number"
              },
              "downPaymentPct": {
                "default": 20,
                "description": "Down payment as a percent of price",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "homeInspection": {
                "default": 500,
                "description": "Home inspection in CAD",
                "minimum": 0,
                "type": "number"
              },
              "homePrice": {
                "description": "Purchase price in CAD",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "isFirstTimeBuyer": {
                "default": false,
                "description": "First-time buyer (LTT rebates where they exist)",
                "type": "boolean"
              },
              "isForeignBuyer": {
                "default": false,
                "description": "Foreign buyer (Ontario NRST / Toronto MNRST)",
                "type": "boolean"
              },
              "isToronto": {
                "default": false,
                "description": "Ontario only: in the City of Toronto (adds MLTT)",
                "type": "boolean"
              },
              "legalFees": {
                "default": 2000,
                "description": "Legal fees allowance in CAD",
                "minimum": 0,
                "type": "number"
              },
              "movingCosts": {
                "default": 2000,
                "description": "Moving costs in CAD",
                "minimum": 0,
                "type": "number"
              },
              "occupancy": {
                "default": "primary",
                "description": "New builds: live in it or rent it out",
                "enum": ["primary", "rental"],
                "type": "string"
              },
              "propertyTaxAdjustment": {
                "default": 0,
                "description": "Prepaid property tax reimbursed to the seller",
                "minimum": 0,
                "type": "number"
              },
              "propertyType": {
                "default": "existing",
                "description": "Resale or newly built",
                "enum": ["existing", "newBuild"],
                "type": "string"
              },
              "province": {
                "default": "Ontario",
                "description": "Province or territory",
                "enum": ["Ontario", "British Columbia", "Quebec", "Alberta", "Manitoba", "Nova Scotia", "New Brunswick", "Saskatchewan", "PEI", "Newfoundland & Labrador", "Northwest Territories", "Nunavut", "Yukon"],
                "type": "string"
              },
              "titleInsurance": {
                "default": 400,
                "description": "Title insurance in CAD",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["homePrice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66f048ee37d12c7d2a94e58aa8069dd4caeac381b6725f4840351eca013302f3"
        },
        {
          "name": "cmhc_insurance",
          "title": "CMHC Mortgage Insurance Premium Calculator",
          "description": "CMHC (mortgage default insurance) premium for any down payment under 20% on a Canadian home: premium rate and amount added to the mortgage, provincial sales tax on the premium (ON, QC, SK — paid in cash at closing), and the insured mortgage total.",
          "inputSchema": {
            "examples": [
              {
                "downPayment": 60000,
                "homePrice": 600000
              }
            ],
            "properties": {
