        {
          "name": "debt_service_ratio",
          "title": "GDS / TDS Debt Service Ratio Calculator",
          "description": "Gross (GDS) and total (TDS) debt service ratios from income, housing costs and other debts, against the 39% / 44% limits. Condo fees count at 50%. Use the payment at the stress-test rate for a qualifying view.",
          "inputSchema": {
            "examples": [
              {
                "annualIncome": 120000,
                "mortgagePayment": 2400,
                "otherDebtsMonthly": 400
              }
            ],
            "properties": {
              "annualIncome": {
                "description": "Applicant's gross annual income in CAD",
                "minimum": 0,
                "type": "number"
              },
              "coApplicantIncome": {
                "default": 0,
                "description": "Co-applicant gross annual income in CAD (0 if none)",
                "minimum": 0,
                "type": "number"
              },
              "condoFeesMonthly": {
                "default": 0,
                "description": "Monthly condo fees in CAD (50% counted)",
                "minimum": 0,
                "type": "number"
              },
              "heatingMonthly": {
                "default": 150,
                "description": "Monthly heating cost in CAD",
                "minimum": 0,
                "type": "number"
              },
              "mortgagePayment": {
                "description": "Monthly mortgage principal + interest in CAD",
                "minimum": 0,
                "type": "number"
              },
              "otherDebtsMonthly": {
                "default": 0,
                "description": "Other monthly debt payments in CAD",
                "minimum": 0,
                "type": "number"
              },
              "propertyTaxMonthly": {
                "default": 300,
                "description": "Monthly property tax in CAD",
                "minimum": 0,
                "type": "number"
              }
            },
