        {
          "name": "add_preview_domain",
          "title": "Use a domain for previews",
          "description": "Asks to put the person's own domain on a project's previews. With git_branch, the domain always shows that one preview's latest version (staging.acme.com shows staging); without it, every preview gets its own address under the domain (fix-header.preview.acme.com), which needs a subdomain, not the bare domain. Owners and admins of the project only. Nothing happens until you approve it in CodeGene: the answer gives a link to the request, which waits there for 15 minutes. Send the person that link; you cannot approve it. Then call get_approval with the requestId to learn how it ended. Once approved, the answer of get_approval lists the two records to add where the domain is managed, in that provider's own field names; CodeGene then checks for them, issues certificates and adds preview addresses by itself.",
          "inputSchema": {
