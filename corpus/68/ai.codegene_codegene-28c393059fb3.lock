        {
          "name": "share_report",
          "title": "Share a report by a public link",
          "description": "Makes a public link to a report (https://reports.codegene.ai/...): ANYONE who has the address can read the report, without signing in, until the link ends 1, 7 or 30 days from now. It shows the newest version and moves to each later version once that version passes CodeGene's share check. Only the workspace's owners and admins may make one, and every owner and admin is told an assistant made it. Make one only when the person asks to share the report outside the workspace. First read the report: set contains_no_personal_data only after checking that it, its title and the label hold no names, email addresses, phone numbers or other details of real people, or list in named_people each person it names who agreed to be named, with a reference to their agreement. CodeGene still checks the report itself. Asking again on the same terms hands back the same open link, renewed from now, at the same address.",
