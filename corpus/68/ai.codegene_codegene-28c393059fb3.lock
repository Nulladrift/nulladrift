        "name": "codegene",
        "title": "CodeGene",
        "version": "0.1.0",
        "description": "Check on and change the websites CodeGene builds for your business, from your own AI assistant.",
        "websiteUrl": "https://codegene.ai/ai-assistants",
        "icons": [
          {
            "src": "https://app.codegene.ai/logo.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://app.codegene.ai/mark.svg",
