        {
          "name": "request_change",
          "title": "Ask CodeGene to change a site",
          "description": "Asks CodeGene's Builder for a change to a project: new content, a design change, a new feature, or something broken to fix. It is a QUESTION for the person, never a start: the person approves it, in a prompt your client shows them (when it can) or on the CodeGene page whose link the answer gives. Never approve or answer it yourself, and never tell the person it is done until get_approval says so. Once approved, a plan comes back first, and nothing on the site changes until the person approves that plan in CodeGene. Use list_tasks or get_task to follow it. If a prompt you expected never appeared, do not ask again: call get_approval with the requestId from an earlier answer, or ask with finish_with set to \"link\" next time.",
