          "description": "Makes the short motion film of a task's preview, with a poster, the same film CodeGene makes on its own when a task is ready to try: the planner picks the template (in the style asked for, if any), the workspace's saved video style (and its notes) shapes it, and the design gate checks it; it is attached to the task's report and its poster is emailed to the task's author. Give the task, a style only when the person asked for one, and an extension only when the film should show a browser extension of theirs over the pages. Answers started or already_started with the run id (a video of a task already being made is answered, never started twice), invalid (no task you can see, or the workspace's allowance is used up) or unavailable (try later). It does not wait: read it with get_task_video; a film takes a few minutes once a render machine is free.",
