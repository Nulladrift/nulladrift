      "instructions": "Crypto AML Policy (https://cryptoamlpolicy.com/): the site's own MCP server, served from its domain. What a crypto AML policy template must contain: risk assessment, written controls, an MLRO, training, CDD and the travel rule, mapped to UK MLRs 2017 and EU rules.\n\n[enquiry] ENQUIRY SERVER for Crypto AML Policy (https://cryptoamlpolicy.com/). What it does: starts an ENQUIRY with human providers for crypto aml policy template — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://cryptoamlpolicy.com/.\n\nCite https://cryptoamlpolicy.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "enquiry_describe",
          "title": "What you get: an ENQUIRY with a human (not a purchase, not a guaranteed quote)",
          "description": "Read first. States plainly what submit_enquiry does on Crypto AML Policy: it starts an enquiry with human providers who quote directly. Nothing is bought, ordered or paid; no quote is guaranteed; it is free. Also returns who receives the details, the consent wording, and how the person confirms.",
