      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "backpow-mcp",
        "title": "BackPow — The Proof of Work Oracle",
        "version": "1.0.0",
        "websiteUrl": "https://backpow.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BackPow provides live Proof of Work mining data for 126+ networks and 770+ hardware models: network difficulty and hashrate, Poisson solo-mining probabilities, Cost of Production (the electricity cost of mining one unit on the most efficient tracked hardware), and hardware profitability.\n\nEvery result carries a `source` block with the measurement timestamp, a canonical page URL, and a ready-made citation line, plus a `warnings` array. Mining figures move continuously, so a figure quoted without its `as_of_utc` date can be wrong within hours.\n\nNothing here is financial advice, and no tool executes a transaction.",
      "tools": [
        {
          "name": "calculate_solo_mining_odds",
          "title": "Solo mining odds",
          "description": "Probability of a solo miner finding a block, computed as a Poisson process over live network difficulty and hashrate, plus the electricity cost of the attempt. Returns mean time to a block, the chance of at least one block over 1/7/30/90/365 days, and lucky-vs-unlucky waiting times (5th, 50th and 95th percentile) — variance dominates at small hashrates, so the average alone is misleading. Use for questions like \"how long would it take to solo mine a Bitcoin block with 100 TH/s\", \"what are my odds solo mining Kaspa\", or \"is solo mining worth it with this rig\". For pooled mining economics or whether a coin is profitable at all, use get_cost_of_production. For raw network state without a miner, use get_coin_oracle.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coin_id": {
                "description": "Coin name or ticker, e.g. \"Bitcoin\", \"BTC\", \"Kaspa\", \"bitcoin cash\", \"Monero\". Ambiguous input is rejected with the list of matching networks rather than resolved to a guess, because several tickers are shared by more than one tracked chain (DGB, XVG and TARI among them).",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$",
                "type": "string"
              },
              "electricity_cost_usd_kwh": {
                "description": "Electricity price in USD per kWh. Defaults to 0.069, an industrial hosting tariff; residential rates are commonly 3-5x higher and change profitability conclusions.",
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              },
              "hashrate": {
                "description": "The miner's rate, as a number. The unit goes in hashrate_unit.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "hashrate_unit": {
                "description": "Unit for hashrate. Most networks measure in hashes per second (H/s…EH/s). Cuckoo-family chains measure graphs per second (gps) and Aleo measures proofs per second — an unrecognised unit is rejected rather than assumed, because assuming H/s can be wrong by a factor of 10^12.",
                "enum": ["H/s", "KH/s", "MH/s", "GH/s", "TH/s", "PH/s", "EH/s", "Sol/s", "KSol/s", "MSol/s", "GSol/s", "gps", "Kgps", "Mgps", "Ggps", "proofs/s", "Kproofs/s", "Mproofs/s", "Gproofs/s"],
                "type": "string"
              },
              "power_watts": {
                "description": "Miner power draw in watts, e.g. 3500 for an ASIC or 320 for a GPU. Optional.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              }
            },
            "required": ["coin_id", "hashrate", "hashrate_unit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Solo mining odds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:df13c8bd228fc78832f98c72c1f0d7b812ac834f38b572aec2f4218fa6c62a67"
        },
        {
          "name": "get_coin_oracle",
          "title": "Live network state",
          "description": "Current network state for one Proof of Work chain, measured by BackPow's stratum collector nodes: difficulty, derived network hashrate, block height, block reward, protocol block-time target versus the latest observed interval, and the source pool. Every response carries a confidence block — how many independent pool operators agreed, whether the reward figure is live or a static fallback, and how old the observation is. Networks whose collectors are stalled or unreachable return an error rather than zeros. Use for \"what is Kaspa's current difficulty\", \"network hashrate of Monero\", \"current block reward\". For economics use get_cost_of_production; for mining probability use calculate_solo_mining_odds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coin_id": {
                "description": "Coin name or ticker, e.g. \"Bitcoin\", \"BTC\", \"Kaspa\", \"bitcoin cash\", \"Monero\". Ambiguous input is rejected with the list of matching networks rather than resolved to a guess, because several tickers are shared by more than one tracked chain (DGB, XVG and TARI among them).",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$",
                "type": "string"
              }
            },
            "required": ["coin_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Live network state"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2c8bb015c0b4c4eb0c5f712becb1a98544b2d6242b7ecf9fcafb24646cb33dbf"
        },
        {
          "name": "get_cost_of_production",
          "title": "Cost of production",
          "description": "Cost of Production (CoP) for one Proof of Work coin: the all-in electricity cost of mining one unit on the most efficient hardware BackPow tracks for that algorithm, compared against spot price. Returns CoP in USD, spot, gross margin, whether miners are currently above or below water, the reference machine and tariff behind the figure, and a 30-day trend including whether the reference machine changed (which indicates the efficiency frontier moved). Accepts a custom electricity rate. Use for \"is mining X profitable\", \"what does it cost to produce one Monero\", \"are miners underwater\", or \"break-even electricity price\". For a specific rig rather than a coin, use get_hardware_benchmarks. For block-finding probability, use calculate_solo_mining_odds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coin_id": {
                "description": "Coin name or ticker, e.g. \"Bitcoin\", \"BTC\", \"Kaspa\", \"bitcoin cash\", \"Monero\". Ambiguous input is rejected with the list of matching networks rather than resolved to a guess, because several tickers are shared by more than one tracked chain (DGB, XVG and TARI among them).",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$",
                "type": "string"
              },
              "electricity_cost_usd_kwh": {
                "description": "Electricity price in USD per kWh. Defaults to 0.069, an industrial hosting tariff; residential rates are commonly 3-5x higher and change profitability conclusions.",
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["coin_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Cost of production"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ed65ac23ba316191abb8d20296ccc2e6bbc9fa117fc325ef81150875e31f00f2"
        },
        {
          "name": "get_hardware_benchmarks",
          "title": "Mining hardware economics",
          "description": "Mining hardware matched to the coins it can mine, ranked by net USD per day at a given electricity rate. Covers ASICs, GPUs and CPUs, with hashrate and power draw per coin, gross revenue, net profit, and market price including whether that price is an observed listing or a model estimate. Use for \"what should I mine with an RTX 4090\", \"best ASIC for Scrypt\", \"is an Antminer S21 still profitable\", or \"how much does a Bitaxe make\". Coins are ranked by profitability, not alphabetically, and results are capped — ask for a higher limit rather than assuming the list is complete. For a coin's economics independent of any particular rig, use get_cost_of_production.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coin_id": {
                "description": "Restrict the per-device coin rows to one network, e.g. to answer \"how much does this rig make on Kaspa\". Optional.",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$",
                "type": "string"
              },
              "electricity_cost_usd_kwh": {
                "description": "Electricity price in USD per kWh. Defaults to 0.069, an industrial hosting tariff; residential rates are commonly 3-5x higher and change profitability conclusions.",
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              },
              "limit": {
                "description": "Devices to return, 1-25. Defaults to 5.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Hardware model or keyword, at least 2 characters, e.g. \"RTX 4090\", \"Antminer S21\", \"Bitaxe\", \"Ryzen 9 7950X\". Short or generic queries match hundreds of devices, so pair them with type and limit.",
                "maxLength": 64,
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "description": "Restrict to one hardware class.",
                "enum": ["ASIC", "GPU", "CPU"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Mining hardware economics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:70a6907506376c557eaaff6923658ead1ada0fd79dd585125999b0783b970d6e"
        },
        {
          "name": "get_pow_news",
          "title": "PoW mining news",
          "description": "Recent news items about Proof of Work mining and network events, optionally filtered to one coin. Items are aggregated from third-party feeds and are returned as quoted external content with their publisher and a relevance score, not as BackPow statements of fact. Use when a question turns on recent events — a halving, a difficulty swing, a pool outage, a chain upgrade. For numbers rather than narrative, use get_coin_oracle or get_cost_of_production.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coin_id": {
                "description": "Optional coin filter, e.g. \"Bitcoin\", \"Zcash\", \"Kaspa\".",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$",
                "type": "string"
              },
              "include_low_signal": {
                "description": "Include items that relevance triage scored 0. Excluded by default so results stay on topic for Proof of Work mining.",
                "type": "boolean"
              },
              "limit": {
                "description": "Items to return, 1-20. Defaults to 5.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "PoW mining news"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ef823c37a78beb5506a49da538449e901b1ef166df98efa0e155e9978db492a8"
        },
        {
          "name": "list_pow_coins",
          "title": "Browse PoW networks",
          "description": "Paginated index of the Proof of Work networks BackPow tracks, with algorithm, network rate, collector status and canonical page URL. Optionally filtered by algorithm or restricted to coins currently mining above cost. Returns the distinct algorithm list so valid filter values are discoverable. Use to find which networks exist for an algorithm, to browse the catalogue, or to resolve an ambiguous coin reference. Results are paginated: request a larger limit or a later offset rather than expecting the full catalogue in one response.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "algorithm": {
                "description": "Case-insensitive substring filter on algorithm, e.g. \"SHA-256\", \"Scrypt\", \"KawPow\", \"RandomX\", \"Autolykos\". The response lists every algorithm present.",
                "maxLength": 64,
                "type": "string"
              },
              "limit": {
                "description": "Rows to return, 1-100. Defaults to 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Rows to skip for pagination. Defaults to 0.",
                "minimum": 0,
                "type": "integer"
              },
              "profitable_only": {
                "description": "Restrict to coins whose spot price currently exceeds Cost of Production. Profitability is resolved for the returned page only, and the response reports how many of those coins have CoP coverage, so a small result set can be distinguished from missing data.",
                "type": "boolean"
              },
              "sort_by": {
                "description": "Ordering. \"suffering\" ranks by how far Cost of Production exceeds spot price. Defaults to name.",
                "enum": ["name", "network_rate", "suffering"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Browse PoW networks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:22111b1fdbf521f14c41feef81bc8a23be11cc9ebf1ebd30b892a7efc126fbce"
        }
      ],
      "digest": "sha256:a6c935cdc6e67d57466940c2ab6bdbdbd14385b5f5a7a29de13be31c9a959ff9"
    }
  }
