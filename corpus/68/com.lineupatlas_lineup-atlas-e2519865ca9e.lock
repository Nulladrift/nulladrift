        {
          "name": "search_artists",
          "title": "Search artists",
          "description": "DJs and live acts listed on Lineup Atlas, by name or genre, optionally only those playing in a city.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Only artists with an upcoming date in this city.",
                "type": "string"
              },
              "limit": {
                "description": "How many results (1 to 20, default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of the texts and page links (default: en).",
                "enum": ["fr", "en", "de", "es", "nl", "it", "pt"],
                "type": "string"
              },
              "query": {
                "description": "An artist name or a genre.",
                "type": "string"
