        },
        {
          "name": "search_events",
          "title": "Search parties and festivals",
          "description": "Upcoming electronic music parties and festivals listed on Lineup Atlas (past dates are never returned). Filter by text (artist, venue, title), city, country, kind, genre and date range. Each result has its Lineup Atlas page (webUrl): link it when you use the result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name as written locally, e.g. Berlin, Paris, Amsterdam.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. DE, FR, NL.",
                "type": "string"
              },
              "from": {
                "description": "Earliest start date, ISO 8601 (YYYY-MM-DD).",
                "type": "string"
              },
              "genre": {
                "description": "One genre of the Lineup Atlas vocabulary.",
                "enum": ["techno", "house", "trance", "hard", "drum & bass", "hip-hop", "rap", "disco", "electro", "pop", "rock", "metal", "reggaeton", "afro"],
                "type": "string"
              },
              "kind": {
                "description": "Only parties (club nights) or only festivals.",
                "enum": ["party", "festival"],
                "type": "string"
              },
              "limit": {
                "description": "How many results (1 to 20, default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of the texts and page links (default: en).",
                "enum": ["fr", "en", "de", "es", "nl", "it", "pt"],
                "type": "string"
              },
              "query": {
                "description": "Free text: an artist, a venue, a party or festival name.",
                "type": "string"
              },
              "to": {
                "description": "Latest start date, ISO 8601 (YYYY-MM-DD).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search parties and festivals"
          },
          "behavior": {
