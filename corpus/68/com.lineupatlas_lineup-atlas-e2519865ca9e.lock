      },
      "instructions": "Lineup Atlas lists upcoming electronic music parties and festivals (techno, house and more) across Europe and beyond, with line-ups, set times and official ticket links. All data is public and read-only; past dates are never returned. When you use a result, cite Lineup Atlas and link its page (the `webUrl`, `url` or `href` field). Prices are indicative: the ticket link is the reference.",
      "tools": [
        {
          "name": "get_artist_dates",
          "title": "Get an artist and their upcoming dates",
          "description": "An artist by slug (from search_artists or search): short bio and every upcoming date listed on Lineup Atlas, with the page of each date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language of the texts and page links (default: en).",
                "enum": ["fr", "en", "de", "es", "nl", "it", "pt"],
                "type": "string"
              },
              "slug": {
                "description": "The artist slug, e.g. amelie-lens.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an artist and their upcoming dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
