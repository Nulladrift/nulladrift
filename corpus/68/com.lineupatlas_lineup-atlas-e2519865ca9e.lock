        {
          "name": "search",
          "title": "Search everything",
          "description": "The Lineup Atlas search box: artists, parties, festivals, venues, cities and promoters matching a text, strongest first, each with its page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language of the texts and page links (default: en).",
                "enum": ["fr", "en", "de", "es", "nl", "it", "pt"],
                "type": "string"
              },
              "query": {
                "description": "At least two characters.",
