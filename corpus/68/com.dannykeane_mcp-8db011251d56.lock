      "serverInfo": {
        "name": "dannykeane.com",
        "title": "Danny Keane",
        "version": "1.0.0",
        "description": "Danny Keane's profile as typed, read-only tools: background, work history, and contact. The site's pages and documentation have their own server at https://dannykeane.com/docs/mcp.",
        "websiteUrl": "https://dannykeane.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public, read-only, unauthenticated server for Danny Keane's professional profile. Tools: get_profile_page (Danny Keane's background: a first-person story of his career, then a table with one row per company (role or focus, and a highlight), from the terminal's about command. Returns plain text with Markdown links. The optional section selects story or career; without it, both are returned. The site's /about page as a document is get_doc, slug about, on https://dannykeane.com/docs/mcp.), get_work_history (Danny Keane's roles, newest first: one line each with company, title and years, then side projects and advising. The optional company (a slug from that list) selects one role in detail: title, dates and a first-person account of the work. Returns plain text with Markdown links. get_profile_page has the shorter story.), get_contact (Get how to reach Danny Keane: email, LinkedIn, Twitter, GitHub, Figma and his investing firm, one channel per line, then his San Francisco local time and usual reply time. Pass channel for one of them. Returns plain text. It only shows the channels; it sends no message.). No writes, no side effects, no auth required. To read or search the site's pages and documentation, use the docs server at https://dannykeane.com/docs/mcp.",
      "tools": [
        {
          "name": "get_contact",
          "description": "Get how to reach Danny Keane: email, LinkedIn, Twitter, GitHub, Figma and his investing firm, one channel per line, then his San Francisco local time and usual reply time. Pass channel for one of them. Returns plain text. It only shows the channels; it sends no message.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "channel": {
                "description": "One way to reach him. Absent, all of them are returned.",
                "enum": ["email", "linkedin", "twitter", "github", "figma", "investing"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ce961241b7111a3491380237768717c230300f7912ec479ec2bd912069e03c0"
        },
        {
          "name": "get_profile_page",
          "description": "Danny Keane's background: a first-person story of his career, then a table with one row per company (role or focus, and a highlight), from the terminal's about command. Returns plain text with Markdown links. The optional section selects story or career; without it, both are returned. The site's /about page as a document is get_doc, slug about, on https://dannykeane.com/docs/mcp.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "section": {
                "description": "story (the narrative) or career (role, focus, outcome per company). Absent, both are returned.",
                "enum": ["story", "career"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://dannykeane-com/about-card"
            }
          },
          "digest": "sha256:1fbc430410279a17d10b6fb2dfbdc70cf987dd65954204ec2b907dee97cba301"
        },
        {
          "name": "get_work_history",
          "description": "Danny Keane's roles, newest first: one line each with company, title and years, then side projects and advising. The optional company (a slug from that list) selects one role in detail: title, dates and a first-person account of the work. Returns plain text with Markdown links. get_profile_page has the shorter story.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "description": "One role to detail, by slug. Absent, the full history is returned.",
                "enum": ["guild", "jasper", "titan", "youtube", "zesty", "truphone", "neverbland", "figmanage", "figma", "mars", "composition"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
