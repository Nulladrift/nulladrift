      "serverInfo": {
        "name": "dannykeane.com",
        "title": "Danny Keane",
        "version": "1.0.0",
        "description": "Danny Keane's profile as typed, read-only tools: background, work history, and contact. The site's pages and documentation have their own server at https://dannykeane.com/docs/mcp.",
        "websiteUrl": "https://dannykeane.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public, read-only, unauthenticated server for Danny Keane's professional profile. Tools: get_profile_page (Read Danny Keane's background: a first-person story of his career, then a table with one row per company (role or focus, and a highlight). Use it to learn who Danny is; it is the terminal's about command. Returns plain text with Markdown links. Pass section story or career for one half. For the site's /about page as a document, call get_doc with slug about on https://dannykeane.com/docs/mcp.), get_work_history (List Danny Keane's roles, newest first: one line each with company, title and years, then side projects and advising. Pass company (a slug from that list) for one role in detail: title, dates and a first-person account of the work. Returns plain text with Markdown links. Use it for career questions; get_profile_page has the shorter story.), get_contact (Get how to reach Danny Keane: email, LinkedIn, Twitter, GitHub, Figma and his investing firm, one channel per line, then his San Francisco local time and usual reply time. Pass channel for one of them. Returns plain text. It only shows the channels; it sends no message.). No writes, no side effects, no auth required. To read or search the site's pages and documentation, use the docs server at https://dannykeane.com/docs/mcp.",
      "tools": [
        {
          "name": "get_contact",
          "description": "Get how to reach Danny Keane: email, LinkedIn, Twitter, GitHub, Figma and his investing firm, one channel per line, then his San Francisco local time and usual reply time. Pass channel for one of them. Returns plain text. It only shows the channels; it sends no message.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "channel": {
                "description": "One way to reach him. Omit for all of them.",
                "enum": ["email", "linkedin", "twitter", "github", "figma", "investing"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:43324b81ac42fe897938d934ef04bf473e68dea56eb3284410974aba5ca3e0c9"
        },
        {
          "name": "get_profile_page",
          "description": "Read Danny Keane's background: a first-person story of his career, then a table with one row per company (role or focus, and a highlight). Use it to learn who Danny is; it is the terminal's about command. Returns plain text with Markdown links. Pass section story or career for one half. For the site's /about page as a document, call get_doc with slug about on https://dannykeane.com/docs/mcp.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "section": {
                "description": "story (the narrative) or career (role, focus, outcome per company). Omit for both.",
                "enum": ["story", "career"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://dannykeane-com/about-card"
            }
          },
          "digest": "sha256:a99d07919ba0024c23f404f5b8683cdda01daca91b9f30d378fef96859b4882a"
        },
        {
          "name": "get_work_history",
          "description": "List Danny Keane's roles, newest first: one line each with company, title and years, then side projects and advising. Pass company (a slug from that list) for one role in detail: title, dates and a first-person account of the work. Returns plain text with Markdown links. Use it for career questions; get_profile_page has the shorter story.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "description": "One role to detail, by slug. Omit for the full history.",
                "enum": ["guild", "jasper", "titan", "youtube", "zesty", "truphone", "neverbland", "figmanage", "figma", "mars", "composition"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
