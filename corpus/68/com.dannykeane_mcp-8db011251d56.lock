      "serverInfo": {
        "name": "dannykeane.com",
        "title": "Danny Keane",
        "version": "1.0.0",
        "description": "Danny Keane's profile as typed, read-only tools: background, work history, and contact. The site's pages and documentation have their own server at https://dannykeane.com/docs/mcp.",
        "websiteUrl": "https://dannykeane.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public, read-only, unauthenticated server for Danny Keane's professional profile. Tools: get_profile_page (Get Danny Keane's profile page: his story and career table, the same as the terminal's about command. Pass section for just the story or just the career table. For the site's /about page, call get_doc with slug about on https://dannykeane.com/docs/mcp.), get_work_history (Get Danny Keane's full work history including roles at Guild.ai, Jasper.ai, Titan, Google/YouTube, Zesty, and side projects. Pass company for one role in detail.), get_contact (Get Danny Keane's contact information including email, LinkedIn, Twitter, GitHub, and Figma. Pass channel for one of them.). No writes, no side effects, no auth required. To read or search the site's pages and documentation, use the docs server at https://dannykeane.com/docs/mcp.",
      "tools": [
        {
          "name": "get_contact",
          "description": "Get Danny Keane's contact information including email, LinkedIn, Twitter, GitHub, and Figma. Pass channel for one of them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "channel": {
                "description": "One way to reach him. Omit for all of them.",
                "enum": ["email", "linkedin", "twitter", "github", "figma", "investing"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:576f119328067d394fdbe5804008b1bd7eb70202877b9232d0fff21acc2d0b0f"
        },
        {
          "name": "get_profile_page",
          "description": "Get Danny Keane's profile page: his story and career table, the same as the terminal's about command. Pass section for just the story or just the career table. For the site's /about page, call get_doc with slug about on https://dannykeane.com/docs/mcp.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "section": {
                "description": "story (the narrative) or career (role, focus, outcome per company). Omit for both.",
                "enum": ["story", "career"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://dannykeane-com/about-card"
            }
          },
          "digest": "sha256:9a9ca44aa615defdf4d2ff3e92fe784923d5bce6fbde08e52c03fa06f6d38642"
        },
        {
          "name": "get_work_history",
          "description": "Get Danny Keane's full work history including roles at Guild.ai, Jasper.ai, Titan, Google/YouTube, Zesty, and side projects. Pass company for one role in detail.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "description": "One role to detail, by slug. Omit for the full history.",
                "enum": ["guild", "jasper", "titan", "youtube", "zesty", "truphone", "neverbland", "figmanage", "figma", "mars", "composition"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f4f40995214774fb6ebdd9378c7679261039a86d8dcb94266fb2ebec730a13d"
        }
      ],
