      "instructions": "This is the DPOLens community version. It searches GDPR and the UAE's data protection law, and returns the clause itself, word for word, with the key, document and version to cite it by.\n\nSearch DPOLens before writing or changing code that collects, stores, logs, shares or deletes personal data, and before answering a question about what a policy or the law requires.\n\nPersonal data includes names, email addresses, phone numbers, postal addresses, identity document numbers, payment details, location, device identifiers, IP addresses, and anything else that can be linked back to a person.\n\nDo not answer from memory. A remembered article number is not a citation, and the version in force here may not be the version you were trained on.\n\nQuote the clause you relied on and give its key, document and version, so the person reading your code can check it.\n\nQuestions that work well:\n\n  how long can we keep a deleted user's account data\n  do we need consent to log IP addresses for debugging\n  what has to happen when somebody asks for a copy of their data\n\nStart with search_policies. Use get_clause when a result points at another clause, or when\nyou need the whole of an article rather than the part that matched. list_documents and\nget_document say what this version can cite at all.\n\nDPOLens returns what the documents say. It does not decide whether something is lawful, and a question with real consequences belongs with the people responsible for it.\n\nAn organisation that runs DPOLens itself searches its own policies beside the law, with a log of every question and every change: github.com/alkhatibdev/dpolens.\n\nQuestions asked here are kept 30 days, with nothing about who asked: dpolens.com/privacy.",
      "tools": [
        {
          "name": "get_clause",
          "title": "Read one clause",
          "description": "Read one clause by its key, with where it sits and what sits beneath it.\n\nUse it when a search result points at another clause, or when you need the whole\nof an article rather than the part that matched. The call is recorded, with the\nkey that was read rather than a question.\n",
          "inputSchema": {
            "properties": {
              "as_of": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Read the clause as it stood on this date",
                "title": "As Of"
              },
              "key": {
                "description": "A canonical key, such as gdpr:art-17:para-1",
                "title": "Key",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Which language to prefer, as a two letter code",
                "title": "Lang",
                "type": "string"
              },
              "whole_subtree": {
                "default": false,
                "description": "Also return this clause and everything beneath it in reading order, which is what you want for a whole article",
                "title": "Whole Subtree",
                "type": "boolean"
              }
            },
            "required": ["key"],
            "title": "get_clauseArguments",
            "type": "object"
          },
