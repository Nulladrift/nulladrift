      },
      "transport": {
        "type": "http",
        "url": "https://api.mcpcensus.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "mcp-census",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Before adding, enabling or calling any MCP server, run a Census stamp (census_stamp) or audit the whole config (census_audit_config). Stop on BLOCK. Ask a human on REVIEW. Treat UNKNOWN as REVIEW. PASS is not a malware scan or permission review. census_credits shows the wallet. Search and select one exact canonical server name. census_policy_list returns the exact policy contract. Existing lookup, stats, recent, coverage, and watch tools remain available.",
      "tools": [
        {
          "name": "census_audit_config",
          "title": "Audit an MCP client config",
          "description": "Audit a whole MCP client config in one call (.mcp.json, claude_desktop_config.json, .cursor/mcp.json, .vscode/mcp.json, Codex config.toml text). Resolves every entry without guessing (url → remote_url, npx → npm package, uvx → PyPI package) and returns one PASS / REVIEW / BLOCK / UNKNOWN verdict per entry under a built-in policy, plus CENSUS-AUDIT/1 text, valid_until_epoch and exit_code (1 on any BLOCK). UNKNOWN is never upgraded to PASS. Cost 1 credit per config per UTC day; keyless callers get one config of ≤25 entries per IP per day. Not a malware scan; PASS is not a sandbox. Strip env/headers before sending.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "config": {
                "anyOf": [
                  {
                    "type": "object"
                  },
                  {
                    "type": "string"
                  },
                  {
                    "type": "array"
                  }
                ],
                "description": "The config document: an object with mcpServers | servers | mcp_servers, a list under entries[], or raw text (JSON or Codex config.toml)"
              },
              "format": {
                "enum": ["json", "toml"],
                "type": "string"
              },
              "policy_id": {
                "default": "builtin:baseline",
                "enum": ["builtin:baseline", "builtin:first-party", "builtin:strict"],
                "type": "string"
              },
              "previous_tools_digests": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "alias → tools_digest from your last audit; sets tools_drift per entry",
                "type": "object"
              },
              "strict": {
                "default": false,
                "description": "exit_code 2 when any entry is REVIEW or UNKNOWN",
                "type": "boolean"
              }
            },
            "required": ["config"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Audit an MCP client config"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:530826ff71a05d9c4f4989332e114ec1ae33794ce9a7bc4bef81974281dc7da5"
        },
        {
          "name": "census_changes",
          "title": "Census change feed",
          "description": "The Census change feed (CENSUS-CHANGES/1): observed transitions across every server — server_new, remote_down, remote_up, tools_changed, health_change, verified_change, security, endpoint_moved, registry_status, spec_era_change. Cursor-paginated: pass next_cursor back as since. Filter by events, server_names or namespace_domain. Only real transitions, never 'still fine'. Unmetered in v1; poll hourly. Not a malware scan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "events": {
                "description": "Event names to include (default all)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "default": 100,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "namespace_domain": {
                "description": "Registrable domain of a DNS-verified namespace, e.g. notion.com",
                "type": "string"
              },
              "server_names": {
                "description": "Exact canonical names to include (≤50)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "since": {
                "description": "next_cursor from the previous page, or an RFC 3339 time for the first call",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Census change feed"
          },
          "behavior": {
