        {
          "name": "census_preflight",
          "title": "Run MCP server preflight",
          "description": "Evaluate one exact MCP server under a documented built-in install policy. Returns PASS, REVIEW, or BLOCK with evidence reasons, freshness, digests, and explicit limits. This is a first gate, not a security audit. refresh=if_stale requires x-api-key.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "policy_id": {
                "default": "builtin:baseline",
                "enum": ["builtin:baseline", "builtin:first-party", "builtin:strict"],
                "type": "string"
              },
              "refresh": {
                "default": "never",
                "enum": ["never", "if_stale"],
                "type": "string"
              },
              "server_name": {
                "description": "Exact canonical Census server name",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["server_name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "audit_id": {
                "type": ["string", "null"]
              },
              "audit_signed": {
                "const": false
              },
              "decision": {
                "enum": ["PASS", "REVIEW", "BLOCK"],
                "type": "string"
              },
              "decision_input_digest": {
                "pattern": "^sha256:",
                "type": "string"
              },
              "decision_scope": {
                "const": "public_evidence_policy"
              },
              "engine_version": {
                "type": "string"
              },
              "evaluated_at": {
                "format": "date-time",
                "type": "string"
              },
              "facts": {
                "type": "object"
              },
              "facts_digest": {
                "pattern": "^sha256:",
                "type": "string"
              },
              "limitations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "meaning": {
                "type": "string"
              },
              "ok": {
                "const": true
              },
              "policy": {
                "additionalProperties": false,
                "properties": {
                  "digest": {
                    "pattern": "^sha256:",
                    "type": "string"
                  },
                  "id": {
                    "type": "string"
                  },
                  "revision": {
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["digest", "id", "revision"],
                "type": "object"
              },
              "reasons": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "evidence": {
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "result": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "evidence", "result", "summary"],
                  "type": "object"
                },
                "type": "array"
              },
              "server_name": {
                "type": "string"
              },
              "valid_until": {
                "format": "date-time",
                "type": "string"
              }
            },
            "required": ["audit_id", "audit_signed", "decision", "decision_input_digest", "decision_scope", "engine_version", "evaluated_at", "facts", "facts_digest", "limitations", "meaning", "ok", "policy", "reasons", "server_name", "valid_until"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Run MCP server preflight"
          },
          "behavior": {
