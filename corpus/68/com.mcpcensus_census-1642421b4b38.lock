        {
          "name": "census_policy_list",
          "title": "List MCP Census policies",
          "description": "List the exact immutable Preflight v1 built-in policy objects, canonical ruleset, and policy digests. Unmetered.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "audit_signed": {
                "const": false
              },
              "ok": {
                "const": true
              },
              "policies": {
                "items": {
                  "type": "object"
                },
                "maxItems": 3,
                "minItems": 3,
                "type": "array"
              },
