        {
          "name": "data_point",
          "title": "單值查詢（point）",
          "description": "取「一個標的 × 一個欄位 × 一個時點」的單值，如 0050 的折溢價、基金最新淨值、USD/TWD 匯率、景氣對策信號綜合分數。dataset 取自 data_catalog 的 point 清單；回應必附單位、資料日與來源。Single current value for one security and field.",
