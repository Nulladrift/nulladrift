          "description": "Read a CVE's descriptions, severity, affected software/version evidence, source references, KEV and EPSS. Large affected-software lists are paginated; inspect the returned cursor and completeness fields.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "affected_after": {
                "default": 0,
                "description": "Cursor returned by the preceding page; zero starts at the beginning",
                "minimum": 0,
                "type": "integer"
              },
              "affected_limit": {
                "default": 20,
                "description": "Maximum results in this page, from 1 to 50",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "cve_id": {
                "description": "CVE identifier, for example CVE-2024-3094",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["cve_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a CVE with source evidence"
          },
          "behavior": {
