        },
        {
          "name": "cve_history",
          "title": "Read hosted CVE revision history",
          "description": "Read normalized source revisions retained after hosted monitoring starts. Version claims can refer to shared affected_groups by group_id. Initial hosted observations establish a baseline; the initial snapshot is not a complete historical archive. Inspect returned coverage and pagination.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after": {
                "default": 0,
                "description": "Cursor returned by the preceding page; zero starts at the beginning",
                "minimum": 0,
                "type": "integer"
              },
              "cve_id": {
                "description": "CVE identifier, for example CVE-2024-3094",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum results in this page, from 1 to 50",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "source": {
                "description": "Optional source identifier, such as cve_list_v5 or nvd",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["cve_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read hosted CVE revision history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b827545775a65bc9748d0832e884c713f67babc91bb2b0594e82cb6677fea68c"
        },
        {
          "name": "cve_search",
          "title": "Search CVEs and software versions",
          "description": "Search the hosted Excession Labs CVE database. Choose recent modification, new publication, or known-exploitation priority. Software/version filters match source assertions; they do not evaluate whether an installation is affected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ecosystem": {
                "description": "Exact source ecosystem name, case-insensitive",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "include_unaffected": {
                "default": false,
                "description": "Include software assertions explicitly marked unaffected or fixed",
                "type": "boolean"
              },
              "kev": {
                "description": "True selects CISA KEV members; false selects records known not to be listed",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Maximum results in this page, from 1 to 50",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Result offset, up to 10000; use specific filters for broad queries",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "package": {
                "description": "Exact source package name, case-insensitive",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "product": {
                "description": "Exact source product name, case-insensitive",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "published_since": {
                "description": "Inclusive UTC publication date or ISO timestamp, for example 2026-11-01",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "Substring to find in the indexed CVE text, at least three characters",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "sort": {
                "default": "priority",
                "description": "priority orders known exploitation first; recent orders source modifications; published orders new publication dates",
                "enum": ["priority", "recent", "published"],
                "type": "string"
              },
              "vendor": {
                "description": "Exact source vendor name, case-insensitive",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "version": {
                "description": "Literal source version value; version ranges are returned as evidence, not evaluated",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
