      "instructions": "Tools for excessionlabs.ai, operated by Excession Labs, a security lab. Search CVE intelligence and public research pages. CVE and information tools are read-only and need no key. request_security_test sends a request for a person who asked for one and needs an agent key from POST https://excessionlabs.ai/agent/auth. The read-only CVE connector is also available at /mcp/cve. No account access or model execution.",
      "tools": [
        {
          "name": "cve_changes",
          "title": "Read new and changed CVE records",
          "description": "Read hosted changes after a saved sequence cursor. Process the page before resuming with next_after. This is a read-only feed; it does not create a notification subscription.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after": {
                "default": 0,
                "description": "Cursor returned by the preceding page; zero starts at the beginning",
                "minimum": 0,
                "type": "integer"
              },
              "cve_id": {
                "description": "CVE identifier, for example CVE-2024-3094",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum results in this page, from 1 to 50",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "source": {
                "description": "Optional source identifier",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read new and changed CVE records"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:891388b09be1980452fc2ff61d3d1cf09564d24d0b804ad86875560cb3ebab69"
        },
