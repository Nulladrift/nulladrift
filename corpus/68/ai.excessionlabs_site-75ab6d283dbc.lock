{
  "lockfileVersion": 2,
  "subjects": {
    "ai.excessionlabs/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://excessionlabs.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ai.excessionlabs/site",
        "title": "Excession Labs: site search and security test requests",
        "version": "1.2.0",
        "websiteUrl": "https://excessionlabs.ai"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for excessionlabs.ai, operated by Excession Labs, a security lab. Search and read public pages and find how to contact the lab. These tools are read-only and need no key. request_security_test sends a security test request for a person who asked for one; it needs an agent key from POST https://excessionlabs.ai/agent/auth. No account access or model execution.",
      "tools": [
        {
          "name": "get_page",
          "title": "Get a page as Markdown",
          "description": "Read one public page of excessionlabs.ai as Markdown. Use a path from search_site or llms.txt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "Page path or full URL on excessionlabs.ai, for example '/', '/about/' or '/security-assessment/'",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3f4cb635818aa1c67010263b9710d9c467ead84e00a786a6f3d6fa34f502394b"
        },
        {
          "name": "how_to_contact",
          "title": "How to contact Excession Labs",
          "description": "Return the ways a person can contact Excession Labs: the request form, email, and the request_security_test tool for agents.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:946072cc8dc61d1936ed19b1712e316c562a2d1ce62026dd0cc695c05ae6c7cf"
        },
        {
          "name": "request_security_test",
          "title": "Request a security test from Excession Labs",
          "description": "Send a request for a security test (web application, API, multi-tenant SaaS isolation or AI application) to Excession Labs on behalf of a person who asked for it. Needs an agent key (POST https://excessionlabs.ai/agent/auth, then Authorization: Bearer <key>). Excession Labs replies to the person by email to agree scope; testing starts only after a written scope and written authorization from the system owner. Never include passwords, API keys or customer data. Limits: 5 requests a day per key, 3 a day per email address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "authorized": {
                "description": "Must be true: the person owns these systems or may arrange a test of them",
                "type": "boolean"
              },
              "company": {
                "description": "The person's company or organization name",
                "maxLength": 160,
                "type": "string"
              },
              "email": {
                "description": "The person's work email; Excession Labs replies here",
                "maxLength": 200,
                "type": "string"
              },
              "name": {
                "description": "The person's name",
                "maxLength": 120,
                "type": "string"
              },
              "notes": {
                "description": "Other context from the person, up to 2,000 characters. No credentials or customer data.",
                "maxLength": 2000,
                "type": "string"
              },
              "person_consent": {
                "description": "Must be true: the person asked for this request and agreed to be contacted by email",
                "type": "boolean"
              },
              "reason": {
                "description": "Why the person needs the test",
                "enum": ["customer_request", "compliance", "launch", "routine", "incident", "other"],
                "type": "string"
              },
              "targets": {
                "description": "Systems to test: URLs, API base URLs or short descriptions. No credentials.",
                "items": {
                  "maxLength": 300,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "test_type": {
                "description": "Kind of test: web_app, api, saas_multi_tenant, ai_application (LLM app or agent) or other",
                "enum": ["web_app", "api", "saas_multi_tenant", "ai_application", "other"],
                "type": "string"
              },
              "timeline": {
                "description": "When the person needs the result, in their words",
                "maxLength": 120,
                "type": "string"
              },
              "website": {
                "description": "Company website",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["authorized", "email", "name", "person_consent", "targets", "test_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e3fc782f030c69a46a8178a80753dc6d4ec1a704b7e1c09c75d69cad3afdb413"
        },
        {
          "name": "search_site",
          "title": "Search excessionlabs.ai",
          "description": "Search the public pages and research notes on excessionlabs.ai. Returns titles, URLs and one-line summaries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "description": "Maximum number of results to return (1 to 20, default 8)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to search for, for example 'security assessment' or 'authorization testing'",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd02d34f7b8af7eafc83e5492890db807767b083c636f37c1b35f5410c8fd40a"
        }
      ],
      "digest": "sha256:97062519c01e72f6fa60e571b2f9a36a9f46279b429baf26fa418f2a4c4b3b55"
    }
  }
}
