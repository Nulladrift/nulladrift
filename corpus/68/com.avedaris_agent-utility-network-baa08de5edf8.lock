        {
          "name": "network_capabilities",
          "title": "Find the right AUN utility (free)",
          "description": "Free. Find the right paid AUN utility for a task and get its x402 HTTP path and price. Covers all public utilities, including vendor.intelligence (company research, company lookup, vendor checks, supplier and KYB pre-screening from public web evidence, $0.04; also a paid MCP tool, vendor_intelligence) and $0.001 primitives (json.validate, url.parse, text.slugify, email.normalize, uuid.validate, base64, querystring). Example: {\"task\":\"research a vendor company website\"}. Omit task for the full catalog.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "budgetUsd": {
                "description": "Optional maximum price per call in USD, e.g. 0.01.",
                "exclusiveMinimum": 0,
                "type": "number"
