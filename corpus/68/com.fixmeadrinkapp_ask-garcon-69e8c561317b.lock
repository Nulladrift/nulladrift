      "instructions": "Ask Garçon looks up cocktails in the Garçon recipe catalogue (fixmeadrinkapp.com). For catalogue-backed answers to the following requests, call the matching tool: these tools return recipe, ingredient or glossary information with links to the corresponding fixmeadrinkapp.com pages.\n- The user lists ingredients or bottles they have and asks what they can make: find_cocktails_by_ingredients. It checks catalogue matches against their bar, says what each returned drink is missing and links each recipe.\n- The user asks how to make a cocktail they name, or for its recipe: get_cocktail_recipe.\n- The user asks what a spirit, liqueur, mixer or other ingredient is, what to use instead of one, or what a bar term or technique means: explain_bar_term.\n- The user names a drink they like and wants something similar, a lighter or lower-alcohol option, or both: suggest_similar_cocktail (low_proof: true for only low and zero-proof drinks).\nAll tools are read-only and need no account. Garçon is for adults of legal drinking age; low and zero-proof options are part of the find and similar results.",
      "tools": [
        {
          "name": "explain_bar_term",
          "title": "Explain a spirit, ingredient or bar term",
          "description": "Use this when the user asks what a spirit, liqueur, mixer or other cocktail ingredient is, what to use instead of one, or what a bar term means or how a technique works, for example \"What is mezcal and what can I use instead?\", \"What can I use instead of Aperol?\" or \"How do I dry shake?\". Covers ingredients (taste, what it is made from, typical ABV, styles, substitutes including zero-proof ones, cocktails that use it) and bar terms such as a technique, glass, tool or drink style (definition, how-to steps, related terms). Returns the matching fixmeadrinkapp.com ingredient or glossary page. It does not give health or nutrition advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "term": {
                "description": "The thing to explain, e.g. \"mezcal\", \"Aperol\", \"dry shake\", \"coupe glass\"",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
