        {
          "name": "find_cocktails_by_ingredients",
          "title": "Find cocktails from your ingredients",
          "description": "Use this when the user names ingredients or bottles they have and asks what cocktails, drinks or mocktails they can make with them, for example \"What can I make with gin, lime and soda?\" or \"I have rum and pineapple juice, any ideas?\". Checks their ingredients against the Garçon recipe catalogue on fixmeadrinkapp.com. Do not use it for one named drink (use get_cocktail_recipe) or for drinks like one they name (use suggest_similar_cocktail). Returns up to 8 free recipes ranked by fewest missing ingredients, each with what they have, what is missing and its fixmeadrinkapp.com page, plus up to 2 low or zero-proof options. A word that could mean several bottles, such as \"vermouth\", is never assumed: drinks that need one kind list it under depends_on, so ask the user which bottle they have when it matters. partial: true means the per-call lookup budget ran out before every candidate was ranked. Water and saline are assumed; garnishes never block a match. Optional filters: strength (zero_or_low covers mocktails and low-ABV drinks) and flavour notes. Recipes are for adults of legal drinking age. It does not give health or nutrition advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "flavors": {
                "description": "Flavour notes to prefer; a drink matches if it has any of them",
                "items": {
                  "enum": ["citrusy", "fruity", "herbal", "tropical", "spicy", "floral", "woody", "creamy", "nutty", "smoky", "chocolate", "coffee", "berry", "mint", "vanilla", "savory", "vegetal"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "ingredients": {
                "description": "What the user has, in their own words, one item each, e.g. [\"gin\", \"limes\", \"simple syrup\"]",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "description": "How many drinks to return (default 5)",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "strength": {
                "description": "zero_or_low for mocktails and low-ABV drinks; omit for any strength",
                "enum": ["zero_or_low", "medium", "strong"],
                "type": "string"
              }
            },
            "required": ["ingredients"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "bar": {
                "additionalProperties": false,
                "properties": {
                  "assumed_staples": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "not_checked": {
                    "description": "Unfamiliar names left unchecked because of the per-request lookup limit",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "not_recognised": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "recognised": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "could_be": {
                          "description": "One bottle that may be any of these; a recipe that needs one shows it under depends_on, never under have",
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "matched_as": {
                          "description": "Catalogue names this word definitely covers",
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "single_bottle": {
                          "const": true,
                          "description": "matched_as are substitutes from one bottle: it covers at most one of them in a recipe",
                          "type": "boolean"
                        },
                        "you_said": {
                          "type": "string"
                        }
                      },
                      "required": ["matched_as", "you_said"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["assumed_staples", "not_recognised", "recognised"],
                "type": "object"
              },
              "cocktails": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "base_spirit": {
                      "type": "string"
                    },
                    "can_make_now": {
                      "description": "True only when nothing is missing and nothing depends on which bottle you have",
                      "type": "boolean"
                    },
                    "depends_on": {
                      "description": "Ingredients a vague word may cover: the drink works only if your <you_said> is this <ingredient>",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "ingredient": {
                            "type": "string"
                          },
                          "you_said": {
                            "type": "string"
                          }
                        },
                        "required": ["ingredient", "you_said"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "flavors": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "have": {
                      "description": "Recipe ingredients your bar definitely covers",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "minutes": {
                      "type": "number"
                    },
                    "missing": {
                      "description": "Required ingredients you do not have",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "missing_garnish": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "strength": {
                      "description": "Non Alcoholic, Low, Medium, Strong or Very Strong",
                      "type": "string"
                    },
                    "url": {
                      "description": "Canonical recipe page on fixmeadrinkapp.com",
                      "type": "string"
                    }
                  },
                  "required": ["can_make_now", "flavors", "have", "missing", "name", "strength", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "low_proof_options": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "base_spirit": {
                      "type": "string"
                    },
                    "can_make_now": {
                      "description": "True only when nothing is missing and nothing depends on which bottle you have",
                      "type": "boolean"
                    },
                    "depends_on": {
                      "description": "Ingredients a vague word may cover: the drink works only if your <you_said> is this <ingredient>",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "ingredient": {
                            "type": "string"
                          },
                          "you_said": {
                            "type": "string"
                          }
                        },
                        "required": ["ingredient", "you_said"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "flavors": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "have": {
                      "description": "Recipe ingredients your bar definitely covers",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "minutes": {
                      "type": "number"
                    },
                    "missing": {
                      "description": "Required ingredients you do not have",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "missing_garnish": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "strength": {
                      "description": "Non Alcoholic, Low, Medium, Strong or Very Strong",
                      "type": "string"
                    },
                    "url": {
                      "description": "Canonical recipe page on fixmeadrinkapp.com",
                      "type": "string"
                    }
                  },
                  "required": ["can_make_now", "flavors", "have", "missing", "name", "strength", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "more_ideas_url": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "partial": {
                "const": true,
                "description": "Set when the per-call lookup budget ran out before every recipe that could rank higher was checked",
                "type": "boolean"
              },
              "unavailable": {
                "description": "Parts of the answer that could not be loaded this time",
                "items": {
                  "const": "low_proof_options",
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["bar", "cocktails", "low_proof_options", "more_ideas_url"],
            "type": "object"
          },
