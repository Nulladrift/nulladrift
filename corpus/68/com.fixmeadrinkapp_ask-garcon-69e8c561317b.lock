            "additionalProperties": false,
            "properties": {
              "also_matches": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "definition": {
                "type": "string"
              },
              "details": {
                "items": {
