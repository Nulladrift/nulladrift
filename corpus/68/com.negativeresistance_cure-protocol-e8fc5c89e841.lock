                                "exclusiveMinimum": 0,
                                "maximum": 1000000,
                                "type": "number"
                              },
                              "week": {
                                "maximum": 104,
                                "minimum": 0,
                                "multipleOf": 0.25,
                                "type": "number"
                              }
                            },
                            "required": ["value", "week"],
                            "type": "object"
