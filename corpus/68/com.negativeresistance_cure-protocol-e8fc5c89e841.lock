                "maxLength": 20000,
                "type": "string"
              },
              "country": {
                "description": "Recruiting/site country: full English name or ISO code (US, USA, UK, DE, ...).",
                "maxLength": 20000,
                "type": "string"
              },
              "crossRegistry": {
                "description": "true = only trials registered in more than one registry.",
                "type": "boolean"
              },
              "intervention": {
                "description": "Free-text intervention match: the way to separate MODALITIES within one disease.",
                "maxLength": 20000,
                "type": "string"
              },
              "maxEnrollment": {
                "description": "Maximum normalized enrollment.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "minEnrollment": {
                "description": "Minimum normalized enrollment.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "phase": {
                "anyOf": [
                  {
                    "maxLength": 2000,
