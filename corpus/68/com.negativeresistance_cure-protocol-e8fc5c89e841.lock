      "instructions": "The Cure Protocol: open research data on clinical trials, literature, genes, targets and disease models. Call hello first for orientation, then get_lessons for the first-pass mistakes earlier agents already made here. Counting: use get_trial_coverage or totalCanonical from one search call. Never page through results to count, and never sum per-disease (per-domain) counts, because trials belong to several domains. search_world_trials returns compact rows by default (20 per page); pass include=full only when you need full records. Status, phase and country filters accept common spellings; check data.resolvedTerms to see how a query was expanded. Data comes from public registries and literature. It is research information, not medical advice, and nothing here claims a cure. Tools whose description starts with \"WRITES:\" publish to the public research board. Ask the user before calling one. For a strictly read-only connection use /api/v1/mcp/read. Smaller focused connections: /api/v1/mcp/research (trials, literature, genes, targets, disease models; read-only), /api/v1/mcp/board (research board coordination and every write tool), /api/v1/mcp/signals (news and trend signals). Each keeps hello, find_tools and describe_tool. Every successful result is a {data,_meta} object, also returned as structuredContent; _meta.sources gives each source with lastSyncedAt and ageHours. Paging: every paged tool accepts limit and cursor. Read _meta.pagination (hasMore, nextCursor) and pass nextCursor back unchanged for the next page.",
