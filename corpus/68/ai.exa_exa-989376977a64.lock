{
  "lockfileVersion": 2,
  "subjects": {
    "ai.exa/exa": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.exa.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "exa-search-server",
        "title": "Exa",
        "version": "3.5.1",
        "description": "Exa web search, page fetching and research-agent tools for AI agents over MCP.",
        "websiteUrl": "https://exa.ai",
        "icons": [
          {
            "src": "https://exa.ai/images/logo/exa-logomark-blue.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://exa.ai/images/favicon-32x32.png",
            "mimeType": "image/png",
            "sizes": ["32x32"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Only use tools returned by tools/list. If web_search_exa is listed, use it to find relevant pages and current information by describing the page you want to find. If web_fetch_exa is listed, use it to read known URLs when search highlights are insufficient or you already have a URL. If agent_run is listed, use it for multi-step research, list-building, or enrichment. If a run is still running, continue with its runId rather than starting a duplicate run.",
      "tools": [
        {
          "name": "web_fetch_exa",
          "title": "Fetch Web Pages",
          "description": "Read a webpage's full content as clean markdown. Use after web_search_exa when highlights are insufficient or to read any URL.\n\nBest for: Extracting full content from known URLs. Batch multiple URLs in one call.\nReturns: Clean text content and metadata from the page(s).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "maxCharacters": {
                "description": "Maximum characters to extract per page (default: 3000)",
                "minimum": 1,
                "type": "number"
              },
              "urls": {
                "description": "URLs to read. Batch multiple URLs in one call.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ebd69b1e62726b2278b0e0568c3969e9ea9f085bee621e2588a56bc11694b88c"
        },
        {
          "name": "web_search_exa",
          "title": "Web Search",
          "description": "Search the web for any topic and get clean, ready-to-use content.\n\n      Best for: Finding current information, news, facts, people, companies, or answering questions about any topic.\n      Returns: Clean text content from top search results.\n\n      Query tips:\n      describe the ideal page, not keywords. \"blog post comparing React and Vue performance\" not \"React vs Vue\".\n      Use category:people / category:company to search through Linkedin profiles / companies respectively.\n      If highlights are insufficient, follow up with web_fetch_exa on the best URLs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "numResults": {
                "description": "Number of search results to return (default: 10).",
                "type": "number"
              },
              "objective": {
                "description": "Goal for this search turn; say which documents should rank first, which should be excluded, and what specific facts or figures to pull from them.",
                "maxLength": 4096,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "Natural language search query. Should be a semantically rich description of the ideal page, not just keywords. Optionally include category:<type> (company, people) to focus results — e.g. 'category:people John Doe software engineer'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["objective", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2aec5bf895df3cafb8165c8edde3727b111f897de71441272c52b7535f6d6fee"
        }
      ],
      "resources": [
        {
          "uri": "exa://tools/list",
          "name": "tools_list",
          "description": "List of available Exa tools and their descriptions",
          "mimeType": "application/json",
          "digest": "sha256:38f00316561813934477a76b4e02361c179cf95949ed4ded3630f88195c5c7a4"
        }
      ],
      "prompts": [
        {
          "name": "web_search_help",
          "description": "Get help with web search using Exa",
          "digest": "sha256:653af071633b4e0d119cc4187f62f223e477600c55bcd0afb07aec62f2d2e0fa"
        }
      ],
      "digest": "sha256:c3e18c0f0e345482ab9b6a0a3baa5ea989696cec8537e2b496de79e30be02521"
    }
  }
}
