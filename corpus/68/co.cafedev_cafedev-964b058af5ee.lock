{
  "lockfileVersion": 2,
  "subjects": {
    "co.cafedev/cafedev": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.cafedev.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cafedev",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Search and inspect open technology jobs in Latin America. Return CafeDev job and application URLs exactly as provided by the tools.",
      "tools": [
        {
          "name": "get_company",
          "title": "Get a CafeDev company",
          "description": "Get company details and its number of open jobs by slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:18ab8e346a51e65e0ca2160b29b5612338f7f2a545d47942377c35adc8888330"
        },
        {
          "name": "get_job",
          "title": "Get a CafeDev job",
          "description": "Get the full details of an open job by its CafeDev ID, including up to 3 related open jobs for a similar role.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f03aa5668527b6b79871f92e4143ed953e1c911b59eda90fa6a3b3a2d6defa05"
        },
        {
          "name": "list_companies",
          "title": "List CafeDev companies",
          "description": "List companies that currently have open jobs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e3314fd7dc1348ed6f8353711e95b17e5f4eedccef7ab6eb8bd1cf4194d5d5e7"
        },
        {
          "name": "search_jobs",
          "title": "Search CafeDev jobs",
          "description": "Search open technology jobs. Omit query to list the newest jobs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:76f04d5c84f1b2b9a2661e63a0d4ffcd997c07e6808905d6eb07172601d400cc"
        }
      ],
      "digest": "sha256:fe2f2c6de4d0606b2aa5ce9789db05fe30991bd1aab44ad57a994014322c90f6"
    }
