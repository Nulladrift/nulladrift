{
  "lockfileVersion": 2,
  "subjects": {
    "co.cafedev/cafedev": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.cafedev.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cafedev",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Search and inspect open technology jobs in Latin America. Return CafeDev job and application URLs exactly as provided by the tools.",
      "tools": [
        {
          "name": "get_company",
          "title": "Get a CafeDev company",
          "description": "Get company details and its number of open jobs by slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0985ebefc7acab68840ed2d1d5757848813c10fdaa9bb1abda8a1bd524ece6ed"
        },
        {
          "name": "get_job",
          "title": "Get a CafeDev job",
          "description": "Get the full details of an open job by its CafeDev ID, including up to 3 related open jobs for a similar role.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e7a1817eb6b08f9059e8949c09ce2c24fcb1bfc7781aa405e628f68d95fc93af"
        },
        {
          "name": "list_companies",
          "title": "List CafeDev companies",
          "description": "List companies that currently have open jobs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4a0c77256e6081ec68181b96e5068346c63fefba85e6d6b2d3a042bdf242ec92"
        },
        {
          "name": "search_jobs",
          "title": "Search CafeDev jobs",
          "description": "Search open technology jobs. Omit query to list the newest jobs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:642036ce5c93c4542e5a39b81af7f2b2a366bf08b19bc5b1e9309f7dd93f7aa5"
        }
      ],
      "digest": "sha256:a7bb0b318797e36a9011b4aa4fa23afeb07f09a1d9273908af38ee31c1bd6eb9"
    }
  }
}
