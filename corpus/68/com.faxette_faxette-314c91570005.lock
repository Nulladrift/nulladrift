        {
          "name": "get_inbound_fax",
          "title": "Open a received fax",
          "description": "Use this for one received fax: who sent it, when, how many pages, and pdf_url, a link to its PDF for 5 minutes, for apps that can download files. Getting the link marks the fax read for the person. To read what the fax says in the chat, use read_inbound_fax instead. Needs the person to sign in to Faxette.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The fax's id from get_inbound_faxes.",
                "minLength": 1,
                "type": "string"
              },
              "organization": {
                "description": "The organization's id from get_organizations. Ask the person which one if there are several.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id", "organization"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "document_deleted": {
                "description": "True once the document has been deleted. Faxette deletes them 30 days after they arrive.",
                "type": "boolean"
              },
              "document_deleted_on": {
                "anyOf": [
                  {
                    "format": "date",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "When the document is or was deleted."
              },
              "failure_reason": {
                "type": ["string", "null"]
              },
              "from_number": {
                "description": "Who sent it. Null when the sender hid their number.",
                "type": ["string", "null"]
              },
              "id": {
                "description": "Pass it to get_inbound_fax or read_inbound_fax.",
                "type": "string"
              },
