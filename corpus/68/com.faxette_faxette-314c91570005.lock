        {
          "name": "send_fax",
          "title": "Send a fax",
          "description": "Use this to send a fax from the person's Faxette credit, or an organization's fax on its plan or card. For an organization's fax, pass the payment_method from get_fax's payment_option once the person agrees to it, and for saved_card its quote; amount_cents isn't needed. Only for a fax in their account that's ready to pay for: call get_fax first. Show the prepared PDF with open_fax_review or its review_url. Have the person confirm the destination, documents and credit_price, explain that it comes from their credit, and call this only once they clearly agree. If get_account shows their credit doesn't cover it, give them the status page instead, where they can pay for this fax by card. For the EU connector, also explain that sending starts immediately and the person's right to cancel ends once the fax is delivered. Obtain their explicit agreement before setting immediate_sending_consent to true. Needs the person to sign in to Faxette; calling it while they aren't asks the app to sign them in.",
