                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "id": {
                "description": "The fax's id, from create_fax, get_faxes or get_fax.",
                "minLength": 1,
                "type": "string"
              },
              "immediate_sending_consent": {
                "description": "Required as true for EU credit sends, only after the person explicitly agrees to immediate sending and acknowledges that their right to cancel ends on delivery. Never infer this from agreement to the price alone.",
                "type": "boolean"
              },
              "payment_method": {
                "description": "Only for an organization's fax: the payment_option's payment_method the person agreed to. If it changed, Faxette refuses with payment_changed: call get_fax and confirm again.",
                "enum": ["plan", "saved_card"],
                "type": "string"
              },
              "quote": {
                "description": "The credit_quote returned by get_fax for the exact destination, PDF and price the person reviewed and approved. After quote_changed or quote_required, show the new proof and obtain fresh approval.",
