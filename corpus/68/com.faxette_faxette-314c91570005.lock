      "serverInfo": {
        "name": "faxette",
        "title": "Faxette",
        "version": "0.7.1",
        "description": "Send a fax to the US, Canada, Mexico, Puerto Rico, Costa Rica, the EU, the UK, Switzerland, Norway, Iceland, Liechtenstein, Monaco, Montenegro, Ukraine and the Isle of Man from a chat. The person checks it and pays per fax on Faxette's status page.",
        "websiteUrl": "https://www.faxette.com/mcp"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This connector sends faxes to the US, Canada, Mexico, Puerto Rico, Costa Rica, the EU, the UK, Switzerland, Norway, Iceland, Liechtenstein, Monaco, Montenegro, Ukraine and the Isle of Man. It can't fax anywhere else, so tell the person which countries it covers. Once the person signs in, it only faxes to their account's countries: the US, Canada, Mexico, Puerto Rico and Costa Rica for a US account, and the EU, the UK, Switzerland, Norway, Iceland, Liechtenstein, Monaco, Montenegro, Ukraine, the Isle of Man, the US and Canada for a European one. Without signing in, a fax to the US or Canada goes through Faxette's US service. If the conversation shows the person is in Europe, pass region \"eu\" to create_document and create_fax so it goes through the European service instead. The person pays on Faxette's status page, or, when signed in, from their credit with send_fax once they agree to the price. Never ask for card details. Sending a fax doesn't need a Faxette account. Signing in keeps the person's faxes in their account, where get_account, get_faxes and get_fax read them.\n\n1. Use lookup_fax_number to search Faxette's checked catalog. Show the number, official source and verification date, and have the person confirm the destination. If there is no match, find the number on the office's own website, never a search snippet or an unverified directory. Never guess.\n2. Ask the person for the email address where Faxette sends the receipt and updates. Never guess it.\n3. If you can read the files, upload each with create_document, in the order they should be faxed. If you can't, call create_fax without document_ids and tell the person to add their files on the status page.\n4. Give the person the status_url. They check the fax number, documents and price there, and pay to send it. If they're signed in and their credit covers the fax's credit_price, you can offer to send it from their credit with send_fax instead, once they agree to that price. Never say a fax is sent or paid until get_fax_status or get_fax says so.\n5. Check the status only when the person asks, or at most once a minute while it's sending.\n6. If a form needs a handwritten signature, tell the person to print, sign and scan it before uploading.\n7. Don't repeat the contents of medical or legal documents in the chat beyond what's needed.\n8. Show the exact prepared PDF in the review interface or private review_url before asking for sending approval. An amount alone is not approval for changed documents. For a credit send, use the current credit_quote and obtain fresh approval after quote_changed. Keep payment on Faxette's browser page when using the embedded interface.\n9. Use get_capabilities to check supported countries, languages, formats and pricing rules. Pass an explicit language only when the person chooses it. Use resend_fax for an eligible failed fax after confirming the destination; never create a replacement fax just to retry. Use get_fax_report for delivery records.\n10. Organizations: get_organizations lists the organizations the person let this app use. Pass an organization's id as organization. If there are several and the person hasn't said which, ask; never guess. If there are none, tell the person to reconnect the app and select the organization.\n11. An organization's inbox: get_inbound_faxes lists received faxes, get_inbound_fax gives a PDF link for 5 minutes, and read_inbound_fax shows the pages. Use read_inbound_fax only when the person asks what a fax says. Opening a fax either way marks it read for the person.\n12. Before block_sender, confirm the number with the person and tell them future faxes from it will be deleted as they arrive, without anyone being emailed. unblock_sender undoes it.\n13. To send as an organization, pass organization to create_fax. get_fax then shows payment_option: the organization's plan, with no charge, or a hold on its card on file, charged when the fax is delivered. Tell the person which, and call send_fax with that payment_method only once they agree. If payment_option is null, the organization needs an owner to add a card or start a plan in Billing.",
      "tools": [
        {
          "name": "block_sender",
          "title": "Block a fax number",
          "description": "Use this only after the person confirms they want to block a number: future faxes from it to the organization are deleted as they arrive, and nobody is emailed. Pass inbound_fax_id to block the number a received fax came from, or number for a number the person gives you. Faxes already in the inbox stay. unblock_sender undoes it. Needs the person to sign in to Faxette.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "inbound_fax_id": {
                "description": "A received fax from get_inbound_faxes.",
                "minLength": 1,
                "type": "string"
              },
              "number": {
                "description": "A fax number the person gave you, in international format, like +12125550100.",
                "minLength": 1,
                "type": "string"
              },
              "organization": {
                "description": "The organization's id from get_organizations. Ask the person which one if there are several.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["organization"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "blocked_at": {
                "format": "date-time",
