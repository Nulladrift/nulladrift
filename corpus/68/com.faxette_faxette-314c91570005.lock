        {
          "name": "create_document",
          "title": "Upload a file",
          "description": "Use this to add a file the person gave you to a fax: a PDF, or a photo saved as JPG, PNG, WEBP or HEIC, up to 20 MB. Call it once per file, before create_fax, in the order the files should be faxed. It returns document_id, upload_url and upload_headers: PUT the file's exact bytes to upload_url with those headers within 5 minutes, then pass document_id to create_fax within an hour. Nothing is faxed or charged. If you can't read the file's bytes, don't use this: call create_fax without document_ids, and the person adds the file on the status page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "byte_size": {
                "description": "The file's exact size in bytes.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "checksum": {
                "description": "The file's MD5 digest, base64-encoded, as printed by: openssl md5 -binary <file> | base64",
                "minLength": 1,
                "type": "string"
              },
              "content_type": {
                "description": "The file's media type. It must match the file's contents.",
                "enum": ["application/pdf", "image/jpeg", "image/png", "image/webp", "image/heic", "image/heif"],
                "type": "string"
              },
              "fax_number": {
                "description": "The fax number the file will be faxed to, in international format, like +14155552671. Numbers in the US, Canada, Mexico, Puerto Rico, Costa Rica, the EU, the UK, Switzerland, Norway, Iceland, Liechtenstein, Monaco, Montenegro, Ukraine and the Isle of Man only. Use the same number in create_fax.",
                "type": "string"
              },
              "filename": {
                "description": "The file's name with its extension, like referral.pdf.",
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "description": "For a fax to the US or Canada from a person who isn't signed in and who the conversation shows is in Europe: pass \"eu\" to send it through Faxette's European service. It's ignored for other numbers and when the person is signed in. Pass the same value to create_document and create_fax.",
                "enum": ["eu"],
                "type": "string"
              }
            },
            "required": ["byte_size", "checksum", "content_type", "fax_number", "filename"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "document_id": {
                "description": "Pass this to create_fax in document_ids.",
                "type": "string"
              },
              "upload_headers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Send these headers, unchanged, with the PUT.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "upload_url": {
                "description": "PUT the file's exact bytes here within 5 minutes.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["document_id", "upload_headers", "upload_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
