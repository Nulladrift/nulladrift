        {
          "name": "get_account",
          "title": "See who is signed in",
          "description": "Use this to see which Faxette account the person signed in with: their name, email, credit, and whether it's the US or EU copy. Needs the person to sign in to Faxette; calling it while they aren't asks the app to sign them in. It changes nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "credit": {
                "additionalProperties": false,
                "description": "The account's credit, which send_fax spends.",
                "properties": {
                  "amount_cents": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "currency": {
                    "description": "usd or eur.",
                    "type": "string"
                  }
                },
                "required": ["amount_cents", "currency"],
                "type": "object"
              },
              "email": {
                "description": "Where Faxette sends receipts and updates for faxes started while signed in.",
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "name": {
                "type": ["string", "null"]
              },
              "region": {
                "description": "Which copy of Faxette the account is on.",
                "enum": ["us", "eu"],
                "type": "string"
              }
            },
            "required": ["credit", "email", "id", "name", "region"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["account:read", "faxes:read", "faxes:write", "faxes:send", "inbox:read", "inbox:write"],
                "type": "oauth2"
              }
