        {
          "name": "create_fax",
          "title": "Start a fax",
          "description": "Use this once the person has confirmed the fax number, and given you their email if they aren't signed in. It creates the fax and returns status_url, the page where the person checks the fax number, documents and price, and pays to send it. Nothing is sent or charged until they pay there. Pass the document_ids from create_document. Without them, the fax waits on the status page for the person to add their files. Choose a private random idempotency_key for each intentional new fax. Reuse the exact same key and request after a timeout or request_in_progress; never change the key just to retry. The key is retained for 24 hours. To check a fax, use get_fax_status or get_fax.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "content": {
                "description": "Text approved by the person, rendered as a PDF before the uploaded documents. Markdown supports headings, lists, tables and links as printed text. Images, raw HTML and remote assets are refused. Always show the generated proof before sending.",
                "properties": {
                  "format": {
                    "enum": ["text", "markdown"],
                    "type": "string"
                  },
                  "text": {
                    "maxLength": 50000,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["format", "text"],
                "type": "object"
              },
              "cover_page": {
                "description": "An optional cover page. Confirm its wording with the person first. It counts toward the total pages; omit if not requested.",
                "properties": {
                  "message": {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  "recipient": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "sender": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "subject": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "document_ids": {
                "description": "The document_id of each file from create_document, in the order they're faxed. Up to 10. Leave it out to let the person add files on the status page.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "email": {
                "description": "The person's email address, where Faxette sends the receipt and updates. Ask the person for it. Leave it out when they're signed in: their account's email is used.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "fax_number": {
                "description": "The fax number the fax goes to, in international format, like +14155552671. Numbers in the US, Canada, Mexico, Puerto Rico, Costa Rica, the EU, the UK, Switzerland, Norway, Iceland, Liechtenstein, Monaco, Montenegro, Ukraine and the Isle of Man only.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "A private random UUID for this intentional new fax. Keep it unchanged for retries of the same request within 24 hours.",
                "pattern": "^[A-Za-z0-9_.-]{32,128}$",
                "type": "string"
              },
              "language": {
                "description": "The language the person chooses for the fax page, checkout and emails. Check get_capabilities for this region. Omit to use the account preference or regional default.",
                "minLength": 1,
                "type": "string"
              },
              "organization": {
                "description": "To send as an organization: its id from get_organizations. The fax belongs to the organization and is paid by its plan or card. Leave it out for the person's own fax.",
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "description": "For a fax to the US or Canada from a person who isn't signed in and who the conversation shows is in Europe: pass \"eu\" to send it through Faxette's European service. It's ignored for other numbers and when the person is signed in. Pass the same value to create_document and create_fax.",
                "enum": ["eu"],
                "type": "string"
              }
            },
            "required": ["fax_number", "idempotency_key"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attempt": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The current attempt to dial the fax number."
              },
              "checkout_available": {
                "description": "True when the person can pay on the status page.",
                "type": "boolean"
              },
              "checkout_quote": {
                "type": ["string", "null"]
              },
              "document_errors": {
                "description": "Files Faxette couldn't use. position is the file's number in the fax. The person fixes them on the status page.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "message": {
                      "type": "string"
                    },
                    "position": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "reason": {
                      "type": "string"
                    }
                  },
                  "required": ["message", "position", "reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "failure_reason": {
                "anyOf": [
                  {
                    "enum": ["temporary", "wrong_number", "our_side"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "For a failed fax: temporary (busy or no answer on every attempt), wrong_number (no fax machine answered), or our_side."
              },
              "fax_number": {
                "type": "string"
              },
              "id": {
                "description": "The fax's id. Pass it to get_fax when the person is signed in.",
                "type": "string"
              },
              "language": {
                "type": ["string", "null"]
              },
              "max_attempts": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "next_attempt_at": {
                "anyOf": [
                  {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "When the next attempt dials, if the line was busy or didn't answer."
              },
              "page_count": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Null until the pages are counted."
              },
              "payment": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "amount_cents": {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "currency": {
                        "description": "usd or eur.",
                        "type": "string"
                      },
                      "method": {
                        "enum": ["card", "credit"],
                        "type": "string"
                      },
                      "status": {
                        "type": "string"
                      },
                      "tax_cents": {
                        "anyOf": [
                          {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "required": ["amount_cents", "currency", "method", "status", "tax_cents"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The person's payment once they start paying, by card or from their credit. amount_cents includes tax."
              },
              "price": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "amount_cents": {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "currency": {
                        "description": "usd or eur.",
                        "type": "string"
                      }
                    },
                    "required": ["amount_cents", "currency"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Before tax. Null until the pages are counted."
              },
              "resend_by": {
                "anyOf": [
                  {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "For a failed fax: until when the person can correct the fax number on the status page and send it again."
              },
              "review_url": {
                "description": "A private review link, valid for 30 minutes. Give it to the person so they can inspect the prepared PDF before paying.",
                "format": "uri",
                "type": "string"
              },
              "status": {
                "description": "draft: waiting for files, or for a file to be fixed. processing_documents: counting pages. documents_ready: ready to pay. awaiting_payment: the person is paying. scheduled: paid, about to dial. sending, delivered, failed. canceled: not paid in time.",
                "enum": ["draft", "processing_documents", "documents_ready", "awaiting_payment", "scheduled", "sending", "delivered", "failed", "canceled"],
                "type": "string"
