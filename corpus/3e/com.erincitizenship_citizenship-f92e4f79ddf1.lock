          "description": "Sends the person's details to Erin Citizenship for a free eligibility review, exactly like the form on https://erincitizenship.com/check. We read the family line and reply by email; a confirmation email arrives shortly. Only call this after the person has clearly asked to send their details to Erin Citizenship, and set confirmed_by_person to true. Never guess an email address.",
