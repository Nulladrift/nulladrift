      "instructions": "Erin Citizenship runs Irish citizenship by descent cases for Americans with Irish roots, from the free eligibility check to the passport. We have our own specialists in Ireland and run the whole case. get_overview returns our published facts (who qualifies, dual citizenship, timeline, cost, process) and get_faq returns our published answers to common questions. check_eligibility applies the same logic as the eligibility check on https://erincitizenship.com/check and lists the facts still missing and the first documents to gather. Its result is preliminary; our team confirms every case. get_document_checklist, estimate_cost_timeline and find_records return our published guidance on documents, on cost and timeline, and on where the ancestor's records are kept. start_case sends the person's details to us for a free review by email. It requires the person's explicit go-ahead, recorded as confirmed_by_person.",
      "tools": [
        {
          "name": "check_eligibility",
          "title": "Check Irish citizenship eligibility",
          "description": "Quick read of whether a family line qualifies for Irish citizenship by descent, based on the closest ancestor born on the island of Ireland (Northern Ireland included). Gives the same preliminary read as the eligibility check on https://erincitizenship.com/check, plus the facts still missing, anything that closes the route, and the first documents to gather. Ask the person for each answer; use \"not_sure\" when they don't know. The result is preliminary: our team confirms every case.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ancestor": {
                "description": "Closest ancestor born on the island of Ireland: parent, grandparent, great_grandparent_or_further, or not_sure.",
                "enum": ["parent", "grandparent", "great_grandparent_or_further", "not_sure"],
                "type": "string"
              }
            },
            "required": ["ancestor"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "blockers": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "eligibility_check_url": {
                "type": "string"
              },
              "explanation": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "first_documents": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "headline": {
                "type": "string"
              },
              "missing_facts": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "next_step": {
                "type": "string"
              },
              "preliminary": {
                "type": "boolean"
              },
              "verdict": {
                "enum": ["likely", "possible", "unlikely", "needs_review"],
                "type": "string"
              }
            },
            "required": ["blockers", "eligibility_check_url", "explanation", "first_documents", "headline", "missing_facts", "next_step", "preliminary", "verdict"],
            "type": "object"
          },
          "annotations": {
