{
  "lockfileVersion": 2,
  "subjects": {
    "com.meshkore/meshkore": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.meshkore.com/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "meshkore-mcp",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "call_agent",
          "description": "Invoke a skill on a live MeshKore agent. Reads the agent's A2A card (/.well-known/agent.json) for its live URL and advertised skills, then POSTs your params to <card.url>/v1/<skill-id> — MeshKore routes, it never proxies the call. Before dispatching it checks the Oracle's probe verdict and refuses fast, with a reason, if the agent was last seen NOT serving its advertised skills. Payment: this tool does NOT pay on your behalf and settles nothing. It reports the price the agent's card declares so you can decide; if the agent answers HTTP 402 you get that back with its payment details. Pricing the tool cannot parse is refused outright rather than assumed free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "The MeshKore agent id (from search_agents).",
                "type": "string"
              },
              "params": {
                "additionalProperties": true,
                "description": "Skill-specific parameters; sent verbatim as the JSON request body.",
                "type": "object"
              },
              "skill": {
                "description": "The skill id to invoke, exactly as the agent's card advertises it (e.g. 'search-hotels', 'generate-tweet'). See list_skills or the `skills` field of search_agents.",
                "type": "string"
              }
            },
            "required": ["agent_id", "skill"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b154aa57a137537dc41506535f592f321a94a96e9911ce33ef00ec969d13eed2"
        },
        {
          "name": "list_skills",
          "description": "List the well-known MeshKore skill vocabulary. Each entry is an { id, title, description, input_modes, output_modes } record that agents advertise in their A2A card. Use the returned ids as the `skill` argument to call_agent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Optional substring filter matched against skill id, title, and description.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8493b84a7a9d62201c28f563e9041741ca3f115b28b1ed871f00727ef7ac24d0"
        },
        {
          "name": "search_agents",
          "description": "Search the MeshKore Oracle for agents matching a natural-language prompt. Returns a ranked list with id, name, skills, declared price, and — the field to act on — `operational`: whether a recent PROBE found the agent's card resolving and every skill it advertises answering at POST /v1/<skill-id>. `online` only means a heartbeat arrived; `operational: null` means never probed, which is unknown, not failed. Pass `operational_only: true` to see only agents verified as serving. The MeshKore standard is router-not-broker: this tool never proxies skill calls, it points at agents you then invoke via call_agent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max number of results (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "operational_only": {
                "description": "Return only agents a recent probe VERIFIED are serving every skill their card advertises. Stricter than 'online'. Never-probed agents are excluded — unknown is not verified.",
                "type": "boolean"
              },
              "prompt": {
                "description": "Natural-language description of the agent you want.",
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4f1bf3b1c761446d4f6496b287f686f9f1e35cd066af63325ab33a40b0a93dd2"
        }
      ],
      "digest": "sha256:d87e0250a288cf32a14c82479cf7de518c60f4092586cd4af545392f4860a1ad"
    }
  }
}
