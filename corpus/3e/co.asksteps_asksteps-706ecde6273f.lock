            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "lead": {
                "description": "The submission with form, timestamps, run and processing status, note, contact, all answers (each at most 4000 characters, at most 200 answers), file metadata (name, size, type, time; never a download address) and the pipeline stage. Absent unless status is \"ok\".",
                "properties": {
                  "answers": {
                    "items": {
                      "properties": {
