        {
          "name": "asksteps_get_form",
          "title": "asksteps: read one form as an editable structure",
          "description": "Reads one form of the connected asksteps account as a structure of steps and fields — the same shape asksteps_update_form takes. Requires \"forms:read\". ALWAYS call this before asksteps_update_form: the write replaces the whole form, so you need the current state to keep what you are not changing. The answer also tells you whether writing is allowed at all (field \"editable\").",
          "inputSchema": {
            "properties": {
              "form_id": {
                "description": "The form id, as returned by asksteps_list_forms.",
                "type": "string"
              }
            },
            "required": ["form_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "blockedBy": {
                "description": "Why writing is blocked, in one sentence. Empty when editable.",
                "type": "string"
              },
              "editable": {
                "description": "Whether asksteps_update_form may write this form back. When false, DO NOT try — the form contains things this format cannot describe, and writing would delete them. Tell the user to edit it in the asksteps studio instead, and say why.",
                "type": "boolean"
              },
              "formId": {
                "description": "The id of the form, to pass back to asksteps_update_form.",
                "type": "string"
              },
              "name": {
                "description": "The name of the form as the customer sees it in their account.",
                "type": "string"
              },
              "note": {
                "description": "One sentence for the user, explaining the outcome and what to do next.",
                "type": "string"
              },
              "screensBlockedBy": {
                "description": "Why the intro/success/dismiss pages must not be sent back, in one sentence. Empty when they may be. When this is set, still change the form — just leave \"screens\" out of the spec, and the existing pages stay untouched.",
                "type": "string"
              },
              "spec": {
                "description": "The structure of the form: steps and fields, in the same shape asksteps_update_form expects.",
                "properties": {
                  "name": {
                    "description": "Name of the form, shown to the person who opens it. Keep it short and concrete.",
                    "type": "string"
                  },
                  "screens": {
                    "description": "The pages shown before and after the form. Omit to leave them as they are.",
                    "properties": {
                      "dismiss": {
                        "description": "Page shown when a funnel ends in dismissal. Funnels only — a form has no such exit.",
                        "properties": {
                          "blocks": {
                            "$ref": "#/properties/spec/properties/screens/properties/intro/properties/blocks",
                            "description": "The blocks of the page, top to bottom.",
                            "items": {}
                          },
                          "confetti": {
                            "description": "Confetti animation. Success page only.",
                            "type": ["boolean", "null"]
                          },
                          "enabled": {
                            "description": "Whether the page is shown. Only meaningful for the intro page; success and dismiss are always shown when reached.",
                            "type": ["boolean", "null"]
                          }
                        },
                        "type": ["object", "null"]
                      },
                      "intro": {
                        "description": "Optional page shown BEFORE the first step. Set enabled = true to show it.",
                        "properties": {
                          "blocks": {
                            "description": "The blocks of the page, top to bottom.",
                            "items": {
                              "properties": {
                                "href": {
                                  "description": "Where a \"button\" leads. Leave empty on the intro page — there the button starts the form instead of following a link.",
                                  "type": "string"
                                },
                                "text": {
                                  "description": "The text of the block. For \"button\" this is its label. Ignored for \"divider\".",
                                  "type": "string"
                                },
                                "type": {
                                  "description": "Block type. One of: \"heading\", \"text\", \"button\", \"divider\".",
                                  "type": "string"
                                },
                                "variant": {
                                  "description": "Style variant of the block, e.g. \"neutral\" or \"accent\". Optional.",
                                  "type": "string"
                                }
                              },
                              "type": "object"
                            },
                            "type": "array"
                          },
                          "confetti": {
                            "description": "Confetti animation. Success page only.",
                            "type": ["boolean", "null"]
                          },
                          "enabled": {
                            "description": "Whether the page is shown. Only meaningful for the intro page; success and dismiss are always shown when reached.",
                            "type": ["boolean", "null"]
                          }
                        },
                        "type": ["object", "null"]
                      },
                      "success": {
                        "description": "Page shown after a successful submission.",
                        "properties": {
                          "blocks": {
                            "$ref": "#/properties/spec/properties/screens/properties/intro/properties/blocks",
                            "description": "The blocks of the page, top to bottom.",
                            "items": {}
                          },
                          "confetti": {
                            "description": "Confetti animation. Success page only.",
                            "type": ["boolean", "null"]
                          },
                          "enabled": {
                            "description": "Whether the page is shown. Only meaningful for the intro page; success and dismiss are always shown when reached.",
                            "type": ["boolean", "null"]
                          }
                        },
                        "type": ["object", "null"]
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "settings": {
                    "description": "Form-wide settings. Omit to leave them as they are.",
                    "properties": {
                      "leadConfirmation": {
                        "description": "Send a confirmation email to the person who filled in the form. Off by default. Only switch this on when the user explicitly asks for it — the address is unverified.",
                        "type": ["boolean", "null"]
                      },
                      "progressBar": {
                        "description": "Show a progress bar across the steps. Omit to leave unchanged.",
                        "type": ["boolean", "null"]
                      },
                      "submitLabel": {
                        "description": "Label of the submit button. Empty keeps the current one.",
                        "type": "string"
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "steps": {
                    "description": "The steps of the form. Each step becomes one page with back/next navigation. Group fields that belong together; three to eight fields per step reads well.",
                    "items": {
                      "properties": {
                        "description": {
                          "description": "One sentence under the heading explaining what this step asks for. Optional.",
                          "type": "string"
                        },
                        "fields": {
                          "description": "The fields of this step, in the order they should appear.",
                          "items": {
                            "properties": {
                              "consentRequired": {
                                "description": "Whether that consent checkbox must be ticked. Only meaningful with ConsentText.",
                                "type": ["boolean", "null"]
                              },
                              "consentText": {
                                "description": "Consent checkbox text under a \"contact\" block. Empty means no checkbox.",
                                "type": "string"
                              },
                              "contactFields": {
                                "description": "The sub-fields of a \"contact\" block, in order. Leave empty to keep the default set (salutation, first name, last name, email, phone).",
                                "items": {
                                  "properties": {
                                    "enabled": {
                                      "description": "Whether the field is shown at all.",
                                      "type": "boolean"
                                    },
                                    "key": {
                                      "description": "Field key. A standard one — \"anrede\", \"name\", \"lastname\", \"email\", \"phone\", \"address\", \"postcode\", \"city\" — or your own name for a custom field.",
                                      "type": "string"
                                    },
                                    "label": {
                                      "description": "Label. Empty on a standard field keeps the translated default; required on a custom one.",
                                      "type": "string"
                                    },
                                    "options": {
                                      "description": "Selectable values for a custom \"select\" field.",
                                      "items": {
                                        "type": "string"
                                      },
                                      "type": "array"
                                    },
                                    "placeholder": {
                                      "description": "Placeholder inside the field. Optional.",
                                      "type": "string"
                                    },
                                    "required": {
                                      "description": "Whether it must be filled in.",
                                      "type": "boolean"
                                    },
                                    "type": {
                                      "description": "Type of a CUSTOM field: \"text\", \"textarea\", \"email\", \"phone\", \"number\", \"date\", \"select\", \"checkbox\". Ignored for the standard keys.",
                                      "type": "string"
                                    },
                                    "width": {
                                      "description": "Width in the contact block's own grid: \"full\", \"twothirds\", \"half\" or \"third\".",
                                      "type": "string"
                                    }
                                  },
                                  "type": "object"
                                },
                                "type": "array"
                              },
                              "decimals": {
                                "description": "Decimal places for \"number\". Optional.",
                                "type": ["integer", "null"]
                              },
                              "display": {
                                "description": "For \"checkbox-group\": \"list\" (options listed one below the other, the default) or \"dropdown\" (a dropdown showing the picked options as tags). Optional.",
                                "type": "string"
                              },
                              "icon": {
                                "description": "Icon name for a \"boolean\" tile. Optional.",
                                "type": "string"
                              },
                              "label": {
                                "description": "Label shown above the field. For text-block, this is the text itself.",
                                "type": "string"
                              },
                              "max": {
                                "description": "Highest accepted value. A number for \"number\", HH:mm for \"time\". Optional.",
                                "type": "string"
                              },
                              "mediaUrl": {
                                "description": "Absolute https URL of the picture or video, for \"image\", \"video\" and \"image-choice\". You cannot upload files here — point at something already online, or let the user add the file in the asksteps studio.",
                                "type": "string"
                              },
                              "min": {
                                "description": "Lowest accepted value. A number for \"number\", HH:mm for \"time\". Optional.",
                                "type": "string"
                              },
                              "options": {
                                "description": "Selectable values. Required for \"select\" and \"checkbox-group\", ignored otherwise.",
                                "items": {
                                  "type": "string"
                                },
                                "type": "array"
                              },
                              "placeholder": {
                                "description": "Placeholder or helper text inside the field. Optional.",
                                "type": "string"
                              },
                              "required": {
                                "description": "Whether the person must fill this in. Ignored for \"text-block\" (it asks nothing) and for \"contact\" (that block carries its own per-field settings).",
                                "type": "boolean"
                              },
                              "rowTitle": {
                                "description": "Group heading placed above this field. A non-empty value also starts a new row, so this is how you split a step into named sections.",
                                "type": "string"
                              },
                              "selection": {
                                "description": "For \"checkbox-group\": \"single\" (exactly one option may be picked, e.g. yes/no, gender, a membership class) or \"multiple\" (any number, the default). Optional.",
                                "type": "string"
                              },
                              "tableColumns": {
                                "description": "Column labels of a \"table\".",
                                "items": {
                                  "type": "string"
                                },
                                "type": "array"
                              },
                              "tableRows": {
                                "description": "Row labels of a \"table\".",
                                "items": {
                                  "type": "string"
                                },
                                "type": "array"
                              },
                              "type": {
                                "description": "Field type. One of: \"text\" (single line), \"text-area\" (multi-line), \"number\", \"date\", \"time\", \"select\" (dropdown, needs options), \"checkbox-group\" (choice group, needs options; one or several answers, see Selection), \"boolean\" (single yes/no checkbox), \"file\" (upload), \"signature\" (drawn signature), \"image-upload\" (the visitor uploads one photo, e.g. a passport photo), \"contact\" (the built-in contact block: name, email, phone — use this instead of building those three by hand), \"text-block\" (explanatory text, not an input), \"table\" (a grid to fill in), \"image-choice\" (a picture to pick), \"image\", \"video\". Two more element types exist but are set only in the asksteps studio: appointment booking and custom HTML. A form that contains one of them can be read here but not written (\"editable\" is false and \"blockedBy\" says why).",
                                "type": "string"
                              },
                              "unit": {
                                "description": "Unit shown next to a \"number\", e.g. \"EUR\" or \"kg\". Optional.",
                                "type": "string"
                              },
                              "variant": {
                                "description": "Role of a \"text-block\": \"body\", \"lead\" or \"note\". Optional.",
                                "type": "string"
                              },
                              "width": {
                                "description": "Width in a 12-column grid: 12 = full width (default), 6 = half, 4 = third. Put short related fields like first and last name side by side with 6 and 6.",
                                "type": "integer"
                              }
                            },
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "title": {
                          "description": "Heading of the step. Optional.",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "themeId": {
                    "description": "Design id. The designs shipped with the product (e.g. \"classic\" or \"midnight\") are listed by asksteps_list_themes; the account's own designs (\"design-<number>\") by asksteps_list_designs, which needs a connected account. Leave empty to keep the form's current design (or the default on a new form). An unknown id is rejected — it is never silently replaced by the default.",
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "status": {
                "description": "Outcome. One of: \"ok\", \"not_connected\", \"not_found\", \"not_a_form\" (this is a funnel with branching — use asksteps_get_funnel and asksteps_update_funnel), \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              },
              "themeCustomized": {
                "description": "True when the form uses a hand-built design instead of one of the shipped designs or one of the account's own designs. The themeId in the spec then does NOT describe what the user sees — say so instead of naming the preset. False for an own design (\"design-<number>\"): that id describes it. Leaving themeId empty keeps the design; setting it replaces it.",
                "type": "boolean"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "asksteps: read one form as an editable structure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a7ae8b753e50875ee8e2b880ba50873b40a524beeef05e00f3dbc5dacd9c1962"
        },
