        {
          "name": "asksteps_get_funnel",
          "title": "asksteps: read one funnel with its branching",
          "description": "Reads one funnel of the connected asksteps account: its questions, answers and where each answer leads. Requires \"forms:read\". ALWAYS call this before asksteps_update_funnel — the write replaces every question, so you need the current state to keep what you are not changing. If the id turns out to be a flat form, the answer says so and points you at asksteps_get_form.",
