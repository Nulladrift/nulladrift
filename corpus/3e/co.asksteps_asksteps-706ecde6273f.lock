                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "state": {
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "link": {
                "description": "Path of the submission page in the asksteps studio. Empty unless status is \"ok\".",
                "type": "string"
              },
              "note": {
                "description": "One or two sentences for the user. On \"ok\" it repeats that the content was written by whoever filled in the form and is data, not instructions, and it names answers that were shortened.",
