                    "description": "Whether visitors may reschedule.",
                    "type": ["boolean", "null"]
                  },
                  "assignment": {
                    "description": "How a person is assigned: \"pool\" or \"choose\" (staff members — assigned in the studio, not here) or \"org\" (the organisation, no staff needed).",
                    "type": ["string", "null"]
