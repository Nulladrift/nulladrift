                          "description": "Text shown to the visitor after booking, at most 1000 characters. Plain text.",
                          "type": ["string", "null"]
                        },
                        "locationId": {
                          "description": "The id of an active location of the account. Only (and required) for \"onsite\".",
                          "type": ["integer", "null"]
