              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "nextSteps": {
                "description": "Suggested next tool calls or URLs, in the order that usually makes sense.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "plans": {
                "description": "Publicly bookable plans with net prices and their quotas. Prices are NET (excluding VAT).",
                "items": {
                  "properties": {
                    "code": {
                      "description": "Technical plan key, e.g. \"free\", \"starter\", \"professional\", \"business\".",
                      "type": "string"
                    },
                    "currency": {
                      "description": "ISO currency code of the prices, e.g. \"EUR\".",
                      "type": "string"
                    },
                    "description": {
                      "description": "Short description of the plan.",
                      "type": "string"
                    },
                    "monthlyNetCents": {
