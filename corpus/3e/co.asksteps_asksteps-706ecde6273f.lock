        {
          "name": "asksteps_set_appointment_type_active",
          "title": "asksteps: switch an appointment type on or off (needs the account's mandate)",
          "description": "Switches an appointment type on (active = true, people can then book it) or off (active = false). Requires \"automation:write\". Both directions need the account's mandate \"activate\" and work in three steps: without it the answer is \"confirmation_required\" with the studio link and NOTHING happens — hand the user the url; with the mandate and without confirm the answer is \"input_required\" with the findings and what the switch does — read it to the user and ask; only with confirm = true it is carried out, and the account owner is emailed about it. Switching on needs bookable staff unless the assignment is \"org\" (\"invalid\" with \"no_bookable_staff\" otherwise — staff is assigned in the studio). Public booking is never changed by this tool.",
          "inputSchema": {
            "properties": {
              "active": {
                "description": "true to switch on, false to switch off.",
                "type": "boolean"
              },
              "confirm": {
                "default": false,
                "description": "Set to true only AFTER the user has explicitly agreed. Without it nothing is switched.",
                "type": "boolean"
              },
              "type_id": {
                "description": "The appointment type id.",
                "type": "integer"
              }
            },
            "required": ["active", "type_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "active": {
                "description": "Whether the appointment type is switched on after the call.",
                "type": "boolean"
              },
              "issues": {
                "description": "The findings that block (or would block) switching on, with path and code. \"no_bookable_staff\" means staff has to be assigned in the studio first.",
                "items": {
                  "properties": {
                    "code": {
                      "description": "Machine-readable code, for example \"address_not_allowed\", \"out_of_range\", \"invalid_theme\" or \"unknown_shortcode\".",
                      "type": "string"
                    },
                    "path": {
                      "description": "Where the problem is, for example \"parts[2].settings.templateId\", \"edges[0].condition\" or \"durationMinutes\". Indices count in the list you sent.",
                      "type": "string"
                    },
                    "shortcode": {
                      "description": "The shortcode at fault, when the problem is a shortcode. Empty otherwise.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "missing": {
                "description": "The parameters you still have to supply: [\"confirm\"] on \"input_required\".",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "description": "One or two sentences for the user. On \"input_required\" it says what the switch does.",
                "type": "string"
              },
              "status": {
                "description": "Outcome. One of: \"activated\", \"deactivated\", \"unchanged\" (already in that state), \"input_required\" (the mandate is there; read note and issues, ask the user and call again with confirm = true), \"confirmation_required\" (the account has not authorised an agent to do this: NOTHING happened, give the user the url), \"invalid\" (the checks failed, for example \"no_bookable_staff\"), \"stale\" (someone switched it meanwhile: NOTHING happened, read it again), \"not_found\", \"rate_limited\", \"not_connected\", \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              },
              "typeId": {
                "description": "The id of the appointment type.",
