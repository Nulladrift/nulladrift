                "description": "First day of the receiving period as yyyy-MM-dd, inclusive. Omit for no lower bound.",
                "type": ["string", "null"]
              },
              "page": {
                "default": 1,
                "description": "Page number, starting at 1.",
                "type": "integer"
              },
              "page_size": {
                "default": 20,
                "description": "How many per page, at most 50.",
                "type": "integer"
              },
              "search": {
                "default": null,
                "description": "Free text over name, email and phone of the contact. Omit for no text filter.",
                "type": ["string", "null"]
              },
              "stage": {
                "default": null,
                "description": "Pipeline stage by its key, for example \"new\" or \"won\". An unknown key gives an empty list. Omit for all.",
                "type": ["string", "null"]
              },
              "state": {
                "default": null,
                "description": "Processing status: \"new\", \"open\", \"done\" or \"archived\". Omit for all.",
                "type": ["string", "null"]
              },
              "to": {
                "default": null,
                "description": "Last day of the receiving period as yyyy-MM-dd, inclusive (the whole day). Omit for no upper bound.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "leads": {
                "description": "One page of submissions. Absent unless status is \"ok\".",
                "properties": {
                  "items": {
                    "items": {
                      "properties": {
