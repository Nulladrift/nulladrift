                                "type": ["integer", "null"]
                              },
                              "display": {
                                "description": "For \"checkbox-group\": \"list\" (options listed one below the other, the default) or \"dropdown\" (a dropdown showing the picked options as tags). Optional.",
                                "type": "string"
                              },
                              "icon": {
