        {
          "name": "asksteps_delete_form",
          "title": "asksteps: delete a form and its submissions",
          "description": "Deletes a form or funnel from the connected account — together with every submission it has collected. Requires \"forms:write\". The first call NEVER deletes: it returns \"confirmation_required\" and the number of submissions that would be lost. Read that number out to the user, get their agreement, and only then call again with confirm = true. This cannot be undone.",
          "inputSchema": {
            "properties": {
