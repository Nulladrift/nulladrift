{
  "lockfileVersion": 2,
  "subjects": {
    "co.asksteps/asksteps": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.asksteps.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "asksteps",
        "title": "asksteps",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {}
      },
      "instructions": "asksteps turns existing fillable PDF forms, multi-step forms and branching funnels into online forms, and collects the submissions.\nStart with asksteps_get_capabilities: it answers plan, price and limit questions in one call.\nUse asksteps_search_docs to quote what the product actually does instead of describing it from memory. If nothing matches, the feature most likely does not exist — say so rather than assuming it.\nEverything reachable on this connection without credentials is public website and pricing information. No customer data is available here.",
      "tools": [
        {
          "name": "asksteps_analyze_pdf",
          "title": "asksteps: check whether a PDF form can be digitised",
          "description": "Analyses a fillable PDF form and reports its fields, pages and whether asksteps can digitise it. Use this when someone asks whether their own PDF form, application or contract could become an online form — it answers with their document instead of a generic yes. Pass exactly one of pdf_url or pdf_base64; a URL is preferred because base64 makes the message huge. The file is analysed in memory and is NOT stored. Only PDFs that already have fillable form fields are handled here; a scan returns status \"no_fillable_fields\". Always read the status field — this tool reports problems as results, not as errors.",
          "inputSchema": {
            "properties": {
              "pdf_base64": {
                "default": null,
                "description": "The PDF as base64. Only for files that are not reachable by URL; keep it small.",
                "type": ["string", "null"]
              },
              "pdf_url": {
                "default": null,
                "description": "Publicly reachable https URL of the PDF. Must not point into a private network.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "fieldCount": {
                "description": "Total number of fillable fields found, before the returned list was capped.",
                "type": "integer"
              },
              "fields": {
                "description": "The fillable fields in reading order. Capped — see fieldsOmitted.",
                "items": {
                  "properties": {
                    "kind": {
                      "description": "Field kind from the PDF: \"text\", \"multiline\", \"checkbox\", \"radio\", \"combo\", \"list\" or \"signature\".",
                      "type": "string"
                    },
                    "label": {
                      "description": "Label read from the form next to the field. Empty when none could be read.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Technical field name from the PDF. Often cryptic — this is the issuer's name, not a label.",
                      "type": "string"
                    },
                    "options": {
                      "description": "Selectable values, for checkbox, radio and choice fields. Empty otherwise.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "page": {
                      "description": "1-based page number the field sits on.",
                      "type": "integer"
                    }
                  },
                  "required": ["kind", "label", "name", "options"],
                  "type": "object"
                },
                "type": "array"
              },
              "fieldsOmitted": {
                "description": "How many further fields exist but were left out of the list. 0 when the list is complete.",
                "type": "integer"
              },
              "fileName": {
                "description": "File name, derived from the URL or from the supplied name. Empty when unknown.",
                "type": "string"
              },
              "nextSteps": {
                "description": "Suggested next steps for the user, in the order that usually makes sense.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "description": "One sentence explaining the outcome, suitable for showing to the user.",
                "type": "string"
              },
              "pageCount": {
                "description": "Number of pages. 0 when the document could not be read.",
                "type": "integer"
              },
              "pages": {
                "description": "Field count per page, for the pages that actually carry fields. Each of these becomes one step of the online form by default. Pages without fields (cover sheets, leaflets) are absent here, so this list can be shorter than pageCount.",
                "items": {
                  "properties": {
                    "fieldCount": {
                      "description": "Number of fillable fields on this page.",
                      "type": "integer"
                    },
                    "page": {
                      "description": "1-based page number.",
                      "type": "integer"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "Outcome of the analysis. One of: \"analyzed\" (fields were found), \"no_fillable_fields\" (readable PDF, but nothing to fill — most likely a scan), \"unreadable\" (not a readable PDF, or password-protected), \"blocked\" (the URL was refused, e.g. it points into a private network), \"too_large\" (over the size limit), \"invalid_request\" (the arguments were wrong), \"rate_limited\" (too many calls — wait a minute and retry).",
                "type": "string"
              }
            },
            "required": ["fields", "fileName", "nextSteps", "note", "pages", "status"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "asksteps: check whether a PDF form can be digitised"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ec26e24538fba3274a8bdc6fa572c66138a459c896a344f56c89b47437c85589"
        },
        {
          "name": "asksteps_assign_site",
          "title": "asksteps: put a form under one of the account's subdomains",
          "description": "Wires a form to one of the subdomains the account ALREADY holds, under a path of your choosing. Requires \"publish:write\". It does NOT create a subdomain or a domain — that needs DNS records and certificates and is done by a person. If the name does not exist, the answer lists the ones that do; read those out instead of guessing. Wiring alone does not publish: afterwards call asksteps_publish_form with target \"whitelabel\".",
          "inputSchema": {
            "properties": {
              "form_id": {
                "description": "The form or funnel id.",
                "type": "string"
              },
              "path": {
                "default": null,
                "description": "Path under that subdomain, e.g. \"bewerbung\". Leave empty to derive it from the form name.",
                "type": ["string", "null"]
              },
              "subdomain": {
                "description": "The subdomain label the account holds, e.g. \"kunde1\" for kunde1.asksteps.co.",
                "type": "string"
              }
            },
            "required": ["form_id", "subdomain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "availableSubdomains": {
                "description": "The subdomains this account holds, so you can name the choices instead of guessing.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "description": "One sentence for the user.",
                "type": "string"
              },
              "status": {
                "description": "Outcome. One of: \"assigned\", \"not_connected\", \"not_found\" (no subdomain with that name in the account), \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              },
              "url": {
                "description": "The address the form is now reachable at once it is published on that channel.",
                "type": "string"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "asksteps: put a form under one of the account's subdomains"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a00801e43b87b433114dfc48d0b89eb8e7e85b84b80407c46dcb95374fdd416e"
        },
        {
          "name": "asksteps_change_plan",
          "title": "asksteps: move a paid account to another plan",
          "description": "Moves an account that already pays to a different plan. THIS SPENDS THE CUSTOMER'S MONEY. Requires \"billing:write\", the account owner, and a purchase mandate the owner granted in the studio with a maximum plan, a spending cap and an expiry date. The first call NEVER changes anything: it returns \"confirmation_required\" together with the exact net price. Read that price to the user, get their agreement, and only then call again with confirm = true. A downgrade needs the mandate to allow it, because shrinking limits can switch features off. If the account has no subscription with the payment provider yet, you get \"checkout_required\" and a link — a first purchase is not something an agent can complete. Every executed change is emailed to the account owner.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "default": false,
                "description": "Set to true only AFTER you told the user the price and they agreed. Without it nothing is charged.",
                "type": "boolean"
              },
              "interval": {
                "default": null,
                "description": "\"month\" (default) or \"year\". A yearly change commits twelve months at once.",
                "type": ["string", "null"]
              },
              "plan_code": {
                "description": "Plan code to move to.",
                "type": "string"
              }
            },
            "required": ["plan_code"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "interval": {
                "description": "The billing interval this price refers to: \"month\" or \"year\".",
                "type": "string"
              },
              "note": {
                "description": "One sentence for the user. On \"confirmation_required\" it names the plan, the price and what changes — read it out before asking.",
                "type": "string"
              },
              "planCode": {
                "description": "The plan code after the change, when something changed.",
                "type": "string"
              },
              "priceCents": {
                "description": "The net price per interval in cents, so you can state it exactly instead of estimating.",
                "type": "integer"
              },
              "status": {
                "description": "Outcome. One of: \"changed\" (the plan is now different), \"confirmation_required\" (read the note to the user and call again with confirm = true if they agree), \"checkout_required\" (give them the url; only they can enter payment details), \"not_allowed\" (outside the mandate — the note says which limit), \"rate_limited\" (too many plan changes in the last minute — wait a minute; nothing was charged), \"not_connected\", \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              },
              "url": {
                "description": "Link where the user completes the purchase themselves. Give it to them verbatim.",
                "type": "string"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "asksteps: move a paid account to another plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3ae39c6178c08237deadc032e33144f3d6f5c7aaff1fc78e45bafd491dc9f637"
        },
        {
          "name": "asksteps_create_appointment_type",
          "title": "asksteps: create an appointment type (inactive)",
          "description": "Creates an appointment type from its settings (name, duration, grid, ways to attend, assignment, rules). Requires \"automation:write\". It is created INACTIVE and without public booking, whatever you send, and without staff — staff is assigned in the studio, which an agent cannot do. Switching on is a separate step (asksteps_set_appointment_type_active), which needs the account's mandate and otherwise answers \"confirmation_required\". Name, durationMinutes, slotIntervalMinutes and modes are required; call asksteps_get_automation_catalog for the limits and asksteps_list_designs or asksteps_list_themes for themeId. Answers with the issues (path and code) when something is wrong.",
          "inputSchema": {
            "properties": {
              "spec": {
                "description": "The settings of the new appointment type.",
                "properties": {
                  "allowReschedule": {
                    "description": "Whether visitors may reschedule.",
                    "type": ["boolean", "null"]
                  },
                  "assignment": {
                    "description": "How a person is assigned: \"pool\" or \"choose\" (staff members — assigned in the studio, not here) or \"org\" (the organisation, no staff needed).",
                    "type": ["string", "null"]
                  },
                  "bookableFrom": {
                    "description": "First bookable day as \"yyyy-MM-dd\" (inclusive). An empty string removes the limit.",
                    "type": ["string", "null"]
                  },
                  "bookableUntil": {
                    "description": "Last bookable day as \"yyyy-MM-dd\" (inclusive). An empty string removes the limit.",
                    "type": ["string", "null"]
                  },
                  "bufferAfterMinutes": {
                    "description": "Buffer after an appointment in minutes, 0 to 240.",
                    "type": ["integer", "null"]
                  },
                  "bufferBeforeMinutes": {
                    "description": "Buffer before an appointment in minutes, 0 to 240.",
                    "type": ["integer", "null"]
                  },
                  "cancellationDeadlineHours": {
                    "description": "Hours before the start up to which a visitor can cancel, 0 to 720.",
                    "type": ["integer", "null"]
                  },
                  "color": {
                    "description": "Colour as \"#RRGGBB\". An empty string removes it.",
                    "type": ["string", "null"]
                  },
                  "description": {
                    "description": "Description, at most 2000 characters. Empty text removes it.",
                    "type": ["string", "null"]
                  },
                  "durationMinutes": {
                    "description": "Duration of one appointment in minutes, 5 to 480. Required when creating.",
                    "type": ["integer", "null"]
                  },
                  "excludedDates": {
                    "description": "Days that are not bookable, each \"yyyy-MM-dd\", at most 366. Replaces the stored list; an empty list clears it.",
                    "items": {
                      "type": "string"
                    },
                    "type": ["array", "null"]
                  },
                  "intakeFunnelId": {
                    "description": "The id of a questionnaire form of this account that visitors fill in before booking. An empty string removes it. A form that receives external submissions cannot be used.",
                    "type": ["string", "null"]
                  },
                  "inviteValidityDays": {
                    "description": "How many days an invitation link stays valid, 1 to 60.",
                    "type": ["integer", "null"]
                  },
                  "key": {
                    "description": "Short key of the appointment type: lowercase letters, digits and \"-\", 2 to 40 characters. Omit to derive it from the name (creating) or keep it (changing).",
                    "type": ["string", "null"]
                  },
                  "maxAdvanceDays": {
                    "description": "How many days ahead appointments can be booked, 1 to 365.",
                    "type": ["integer", "null"]
                  },
                  "meetingLeadMinutes": {
                    "description": "Minutes before the start from which an online meeting can be joined, 0 to 60.",
                    "type": ["integer", "null"]
                  },
                  "minNoticeMinutes": {
                    "description": "Shortest notice before an appointment in minutes, 0 to 43200.",
                    "type": ["integer", "null"]
                  },
                  "modes": {
                    "description": "The ways to attend, one to four of \"online\", \"onsite\" (needs locationId of an active location of the account — locations are created in the studio), \"phone\" and \"visitor_address\". Replaces the stored list. Required when creating.",
                    "items": {
                      "properties": {
                        "closingText": {
                          "description": "Text shown to the visitor after booking, at most 1000 characters. Plain text.",
                          "type": ["string", "null"]
                        },
                        "locationId": {
                          "description": "The id of an active location of the account. Only (and required) for \"onsite\".",
                          "type": ["integer", "null"]
                        },
                        "mode": {
                          "description": "\"online\", \"onsite\", \"phone\" or \"visitor_address\".",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": ["array", "null"]
                  },
                  "name": {
                    "description": "Name, at most 120 characters. Required when creating.",
                    "type": ["string", "null"]
                  },
                  "requireAcceptance": {
                    "description": "Appointments have to be accepted internally. Only with assignment \"org\"; otherwise false.",
                    "type": ["boolean", "null"]
                  },
                  "slotIntervalMinutes": {
                    "description": "Grid of the offered start times in minutes, 5 to 240. Required when creating.",
                    "type": ["integer", "null"]
                  },
                  "themeId": {
                    "description": "Design of the booking page: a shipped design id (asksteps_list_themes) or \"design-<number>\" of the account (asksteps_list_designs). An empty string goes back to the account default. Unknown or foreign ids are rejected (invalid_theme).",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              }
            },
            "required": ["spec"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "active": {
                "description": "Whether the appointment type is switched on. A created one is always false.",
                "type": "boolean"
              },
              "issues": {
                "description": "The problems found, with path and code. Empty unless status is \"invalid\".",
                "items": {
                  "properties": {
                    "code": {
                      "description": "Machine-readable code, for example \"address_not_allowed\", \"out_of_range\", \"invalid_theme\" or \"unknown_shortcode\".",
                      "type": "string"
                    },
                    "path": {
                      "description": "Where the problem is, for example \"parts[2].settings.templateId\", \"edges[0].condition\" or \"durationMinutes\". Indices count in the list you sent.",
                      "type": "string"
                    },
                    "shortcode": {
                      "description": "The shortcode at fault, when the problem is a shortcode. Empty otherwise.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "One or two sentences for the user. After \"created\" it says that the type is inactive and what is still missing.",
                "type": "string"
              },
              "status": {
                "description": "Outcome. One of: \"created\" (inactive, not publicly bookable), \"updated\", \"invalid\" (the issues say exactly what to fix; nothing was saved), \"confirmation_required\" (the appointment type is switched on and the account has not authorised an agent to change it: NOTHING was written, give the user the url), \"stale\" (someone switched the type on or off since you read it: NOTHING was written, read it again), \"rate_limited\" (too many changes to live objects in the last minute), \"not_found\", \"not_connected\", \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              },
              "typeId": {
                "description": "The id of the appointment type.",
                "type": "integer"
              },
              "url": {
                "description": "Path of the editor in the asksteps studio.",
                "type": "string"
              },
              "warnings": {
                "description": "Warning codes of the saved type, for example \"no_bookable_staff\" (assign staff in the studio before switching on).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "asksteps: create an appointment type (inactive)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:070eb470ae7f7c562dbcfc32fb9fdf1a72b0ab17c41b5c8ddefc06b4a90e2219"
        },
        {
          "name": "asksteps_create_draft",
          "title": "asksteps: turn a described form into an openable draft",
          "description": "Turns a form you have designed with the user into a draft and returns a link. Opening the link shows the form in the asksteps builder, where the user can change it and save it — no account is needed to look at it. Use this once you and the user agree on what the form should ask; it is the step that turns the conversation into something they can actually use. It does NOT write into anyone's account: a human always saves it. Give the returned url to the user verbatim. For digitising an existing PDF, do not rebuild it here — the analysis only shows you part of a large form. Point the user at the PDF import in the product instead. If the draft is rejected, the note says exactly what to fix; correct it and call again.",
          "inputSchema": {
            "properties": {
              "spec": {
                "description": "The form: a name and its steps with their fields.",
                "properties": {
                  "name": {
                    "description": "Name of the form, shown to the person who opens it. Keep it short and concrete.",
                    "type": "string"
                  },
                  "screens": {
                    "description": "The pages shown before and after the form. Omit to leave them as they are.",
                    "properties": {
                      "dismiss": {
                        "description": "Page shown when a funnel ends in dismissal. Funnels only — a form has no such exit.",
                        "properties": {
                          "blocks": {
                            "$ref": "#/properties/spec/properties/screens/properties/intro/properties/blocks",
                            "description": "The blocks of the page, top to bottom.",
                            "items": {}
                          },
                          "confetti": {
                            "description": "Confetti animation. Success page only.",
                            "type": ["boolean", "null"]
                          },
                          "enabled": {
                            "description": "Whether the page is shown. Only meaningful for the intro page; success and dismiss are always shown when reached.",
                            "type": ["boolean", "null"]
                          }
                        },
                        "type": ["object", "null"]
                      },
                      "intro": {
                        "description": "Optional page shown BEFORE the first step. Set enabled = true to show it.",
                        "properties": {
                          "blocks": {
                            "description": "The blocks of the page, top to bottom.",
                            "items": {
                              "properties": {
                                "href": {
                                  "description": "Where a \"button\" leads. Leave empty on the intro page — there the button starts the form instead of following a link.",
                                  "type": "string"
                                },
                                "text": {
                                  "description": "The text of the block. For \"button\" this is its label. Ignored for \"divider\".",
                                  "type": "string"
                                },
                                "type": {
                                  "description": "Block type. One of: \"heading\", \"text\", \"button\", \"divider\".",
                                  "type": "string"
                                },
                                "variant": {
                                  "description": "Style variant of the block, e.g. \"neutral\" or \"accent\". Optional.",
                                  "type": "string"
                                }
                              },
                              "type": "object"
                            },
                            "type": "array"
                          },
                          "confetti": {
                            "description": "Confetti animation. Success page only.",
                            "type": ["boolean", "null"]
                          },
                          "enabled": {
                            "description": "Whether the page is shown. Only meaningful for the intro page; success and dismiss are always shown when reached.",
                            "type": ["boolean", "null"]
                          }
                        },
                        "type": ["object", "null"]
                      },
                      "success": {
                        "description": "Page shown after a successful submission.",
                        "properties": {
                          "blocks": {
                            "$ref": "#/properties/spec/properties/screens/properties/intro/properties/blocks",
                            "description": "The blocks of the page, top to bottom.",
                            "items": {}
                          },
                          "confetti": {
                            "description": "Confetti animation. Success page only.",
                            "type": ["boolean", "null"]
                          },
                          "enabled": {
                            "description": "Whether the page is shown. Only meaningful for the intro page; success and dismiss are always shown when reached.",
                            "type": ["boolean", "null"]
                          }
                        },
                        "type": ["object", "null"]
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "settings": {
                    "description": "Form-wide settings. Omit to leave them as they are.",
                    "properties": {
                      "leadConfirmation": {
                        "description": "Send a confirmation email to the person who filled in the form. Off by default. Only switch this on when the user explicitly asks for it — the address is unverified.",
                        "type": ["boolean", "null"]
                      },
                      "progressBar": {
                        "description": "Show a progress bar across the steps. Omit to leave unchanged.",
                        "type": ["boolean", "null"]
                      },
                      "submitLabel": {
                        "description": "Label of the submit button. Empty keeps the current one.",
                        "type": "string"
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "steps": {
                    "description": "The steps of the form. Each step becomes one page with back/next navigation. Group fields that belong together; three to eight fields per step reads well.",
                    "items": {
                      "properties": {
                        "description": {
                          "description": "One sentence under the heading explaining what this step asks for. Optional.",
                          "type": "string"
                        },
                        "fields": {
                          "description": "The fields of this step, in the order they should appear.",
                          "items": {
                            "properties": {
                              "consentRequired": {
                                "description": "Whether that consent checkbox must be ticked. Only meaningful with ConsentText.",
                                "type": ["boolean", "null"]
                              },
                              "consentText": {
                                "description": "Consent checkbox text under a \"contact\" block. Empty means no checkbox.",
                                "type": "string"
                              },
                              "contactFields": {
