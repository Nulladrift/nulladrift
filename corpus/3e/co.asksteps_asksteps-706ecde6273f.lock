                              "type": "string"
                            },
                            "name": {
                              "type": "string"
                            }
                          },
                          "type": ["object", "null"]
                        },
                        "state": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "page": {
                    "type": "integer"
                  },
                  "pageSize": {
                    "type": "integer"
                  },
                  "total": {
                    "type": "integer"
                  },
