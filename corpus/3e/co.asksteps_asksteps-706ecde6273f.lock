                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "screens": {
                    "description": "The pages shown before and after the funnel: intro, success and dismiss.",
                    "properties": {
                      "dismiss": {
                        "description": "Page shown when a funnel ends in dismissal. Funnels only — a form has no such exit.",
                        "properties": {
                          "blocks": {
