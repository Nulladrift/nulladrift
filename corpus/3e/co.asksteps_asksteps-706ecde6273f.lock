        {
          "name": "asksteps_create_funnel",
          "title": "asksteps: create a branching funnel",
          "description": "Creates a conversational funnel in the connected asksteps account: one question at a time, where each answer decides what comes next. Requires \"forms:write\". Use this instead of asksteps_create_form when answers should lead to DIFFERENT follow-up questions, or when someone should be able to be ruled out part-way through. Give every question a short ref (\"budget\", \"contact\") and point each answer's target at another ref, at \"next\", at \"success\" or at \"dismiss\". The first question in the list is where the funnel starts. It is NOT published; publishing is a separate step.",
          "inputSchema": {
            "properties": {
              "spec": {
                "description": "The funnel: a name and its questions with their answers and targets.",
                "properties": {
                  "name": {
                    "description": "Name of the funnel, shown to the person who opens it in their account.",
                    "type": "string"
                  },
                  "nodes": {
