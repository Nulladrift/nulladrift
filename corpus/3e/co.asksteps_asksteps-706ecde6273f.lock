                "default": false,
                "description": "Set to true only AFTER the user has agreed, knowing how many submissions go with it.",
                "type": "boolean"
              },
              "form_id": {
                "description": "The form or funnel id.",
                "type": "string"
              }
            },
            "required": ["form_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "leadCount": {
                "description": "How many submissions this form has collected. Deleting the form deletes them too.",
                "type": "integer"
              },
              "note": {
                "description": "One sentence for the user. On \"confirmation_required\" it says how many submissions would be lost — read that number out loud before asking.",
                "type": "string"
              },
              "status": {
                "description": "Outcome. One of: \"deleted\", \"confirmation_required\" (read the note and call again with confirm = true if the user really wants this), \"not_connected\", \"not_found\", \"rate_limited\" (too many calls in the last minute — wait a minute), \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
