        {
          "name": "asksteps_update_message_template",
          "title": "asksteps: replace the content of a message template",
          "description": "Changes a message template. Requires \"automation:write\". IMPORTANT: this REPLACES the content completely — call asksteps_get_message_template first, change what the user asked for, send the content back whole and pass its updatedAt as expected_updated_at: if someone changed the template in the meantime the answer is \"stale\" and nothing is overwritten. A template with an \"html\" block is refused (\"not_editable\"). A template that an active workflow or an active or paused process sends from can only be changed with the account's mandate \"activate\": without it the answer is \"confirmation_required\", NOTHING was written, and you hand the user the url. The channel cannot be changed.",
          "inputSchema": {
            "properties": {
              "expected_updated_at": {
                "description": "The updatedAt value of asksteps_get_message_template (or of your last change).",
                "type": "string"
              },
              "spec": {
                "description": "The new template. name, category, defaultLocale and attachIcs stay when omitted; content replaces the stored content.",
                "properties": {
                  "attachIcs": {
                    "description": "Whether the email carries a calendar file (.ics). Email only. Stays when omitted while changing.",
                    "type": ["boolean", "null"]
                  },
                  "category": {
                    "description": "\"lead\", \"booking\", \"team\" or \"general\". Defaults to \"general\" when creating, stays when changing.",
                    "type": ["string", "null"]
                  },
                  "channel": {
                    "description": "\"email\" or \"sms\". Only when creating; it cannot be changed later. Defaults to \"email\".",
                    "type": ["string", "null"]
                  },
                  "content": {
                    "description": "The content, in the format of asksteps_get_automation_catalog: {\"schema\":1,\"locales\":{\"de\":{\"subject\":\"…\",\"preheader\":\"…\",\"blocks\":[{\"id\":\"b1\",\"type\":\"text\",\"html\":\"<p>…</p>\"}]}}} for email, {\"schema\":1,\"locales\":{\"de\":{\"text\":\"…\"}}} for sms. Block types: heading, text, button, image (absolute https source, no upload), divider, spacer, booking-details. A block of type \"html\" is rejected. Shortcodes like {{contact.firstname}} are checked against the catalog. Replaces the stored content completely when changing; omit to keep it.",
                    "type": ["object", "null"]
                  },
                  "defaultLocale": {
                    "description": "The language shown when a visitor's language has no version, for example \"de\". Defaults to \"de\" when creating.",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "description": "Name, at most 120 characters. Required when creating.",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "template_id": {
                "description": "The template id.",
                "type": "integer"
              }
            },
            "required": ["expected_updated_at", "spec", "template_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "inLiveUse": {
                "description": "Whether an active workflow or an active or paused process sends from this template.",
                "type": "boolean"
              },
              "issues": {
                "description": "The problems found, with path and code (and the shortcode when it is one). Empty unless status is \"invalid\".",
                "items": {
                  "properties": {
                    "code": {
                      "description": "Machine-readable code, for example \"address_not_allowed\", \"out_of_range\", \"invalid_theme\" or \"unknown_shortcode\".",
                      "type": "string"
                    },
                    "path": {
                      "description": "Where the problem is, for example \"parts[2].settings.templateId\", \"edges[0].condition\" or \"durationMinutes\". Indices count in the list you sent.",
                      "type": "string"
                    },
                    "shortcode": {
                      "description": "The shortcode at fault, when the problem is a shortcode. Empty otherwise.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "One or two sentences for the user.",
                "type": "string"
              },
              "spec": {
                "description": "The template as saved — after cleaning (for example a dangerous link target removed). Check it against what you meant to send.",
                "properties": {
                  "attachIcs": {
                    "description": "Whether the email carries a calendar file (.ics). Email only. Stays when omitted while changing.",
                    "type": ["boolean", "null"]
                  },
                  "category": {
                    "description": "\"lead\", \"booking\", \"team\" or \"general\". Defaults to \"general\" when creating, stays when changing.",
                    "type": ["string", "null"]
                  },
                  "channel": {
                    "description": "\"email\" or \"sms\". Only when creating; it cannot be changed later. Defaults to \"email\".",
                    "type": ["string", "null"]
                  },
                  "content": {
                    "description": "The content, in the format of asksteps_get_automation_catalog: {\"schema\":1,\"locales\":{\"de\":{\"subject\":\"…\",\"preheader\":\"…\",\"blocks\":[{\"id\":\"b1\",\"type\":\"text\",\"html\":\"<p>…</p>\"}]}}} for email, {\"schema\":1,\"locales\":{\"de\":{\"text\":\"…\"}}} for sms. Block types: heading, text, button, image (absolute https source, no upload), divider, spacer, booking-details. A block of type \"html\" is rejected. Shortcodes like {{contact.firstname}} are checked against the catalog. Replaces the stored content completely when changing; omit to keep it.",
                    "type": ["object", "null"]
                  },
                  "defaultLocale": {
                    "description": "The language shown when a visitor's language has no version, for example \"de\". Defaults to \"de\" when creating.",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "description": "Name, at most 120 characters. Required when creating.",
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "status": {
                "description": "Outcome. One of: \"created\" (not used by any workflow or process yet, so nothing is sent), \"updated\", \"invalid\" (the issues say exactly what to fix; nothing was saved), \"stale\" (the template was changed since you read it: read it again and redo the change), \"not_editable\" (it contains an html block), \"confirmation_required\" (a workflow or process in use sends from it and the account has not authorised an agent to change it: NOTHING was written, give the user the url), \"limit_reached\" (the account holds the maximum number of templates), \"rate_limited\" (too many changes to live objects in the last minute), \"not_found\", \"not_connected\", \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              },
              "templateId": {
                "description": "The id of the template.",
                "type": "integer"
              },
              "updatedAt": {
                "description": "Pass this value as expected_updated_at to the next change.",
                "type": "string"
              },
              "url": {
                "description": "Path of the editor in the asksteps studio.",
                "type": "string"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "asksteps: replace the content of a message template"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0aa6c3f2b6c1382d54d63f636b12112329693d6a5408cb5c6ea05482c13a6c1b"
        },
        {
          "name": "asksteps_update_process",
          "title": "asksteps: replace the building blocks and transitions of a process",
          "description": "Changes a process of the connected asksteps account. Requires \"automation:write\". IMPORTANT: this REPLACES the building blocks and transitions completely — every block and transition you do not send is gone, together with the state it holds in open cases. Call asksteps_get_process first, change what the user asked for and send the result back whole. A block sent back with the key it was read with keeps its identity, position and open-case state; workflows assigned in the studio are never touched. A draft can be changed freely. An ACTIVE or PAUSED process can only be changed with the account's mandate \"activate\" (a paused process keeps sending for open cases): without it the answer is \"confirmation_required\", NOTHING was written, and you hand the user the url. An active process also refuses structural changes (\"pause_required\"); name, description and labels still work. A fixed recipient address cannot be set; it is kept on the block it was on.",
          "inputSchema": {
            "properties": {
              "process_id": {
                "description": "The process id, as returned by asksteps_list_processes or asksteps_get_process.",
                "type": "integer"
              },
              "spec": {
                "description": "The complete new process. Anything omitted is deleted.",
                "properties": {
                  "description": {
                    "description": "Short description, at most 1000 characters. May be empty.",
                    "type": "string"
                  },
                  "edges": {
                    "description": "The transitions between building blocks. Replaced completely on a change, so send every transition you keep.",
                    "items": {
                      "properties": {
                        "condition": {
                          "description": "Optional condition group {\"all\":[…]} or {\"any\":[…]} built from the conditions in asksteps_get_automation_catalog. Omit for \"otherwise\" or no condition. The order of the transitions of one exit is their priority.",
                          "type": ["object", "null"]
                        },
                        "delivery": {
                          "description": "How the visitor is led on: \"direct\" (same visit, only where the exit allows it), \"email\" (a message template sent to the visitor, set \"template\") or \"team\" (nothing is sent; the step waits in the case). Omit only for a transition into an \"end\" block.",
                          "type": ["string", "null"]
                        },
                        "from": {
                          "description": "Key of the block the transition leaves.",
                          "type": "string"
                        },
                        "port": {
                          "description": "The exit of that block, as listed for its kind in asksteps_get_automation_catalog (for example \"submitted\" or \"completed\").",
                          "type": "string"
                        },
                        "template": {
                          "description": "The id of the message template for delivery \"email\". It must be an email template that may go to visitors and exist in this account. Ignored for other deliveries.",
                          "type": ["integer", "null"]
                        },
                        "to": {
                          "description": "Key of the block the transition leads to.",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "name": {
                    "description": "Name of the process, at most 120 characters.",
                    "type": "string"
                  },
                  "parts": {
                    "description": "The building blocks. Exactly one has start = true when the process is switched on. IMPORTANT when changing: a block you leave out is removed (together with the state it holds in open cases), so send every block you keep.",
                    "items": {
                      "properties": {
                        "addressSet": {
                          "description": "Read only, ignored on writing: true when an email block sends to a fixed address that is stored but not shown. Writing the block back keeps that address. You cannot set or change it; recipient \"address\" on any other block is rejected (address_not_allowed).",
                          "type": "boolean"
                        },
                        "key": {
                          "description": "Key of the block, used only to connect transitions inside this request: lowercase letters, digits, \"_\" and \"-\", at most 16 characters. A block that is already stored is read as \"p<number>\" — send that key back unchanged to keep the block (and what it holds in open cases). A new block gets a key of your choice.",
                          "type": "string"
                        },
                        "kind": {
                          "description": "The kind of the block, one of the kinds listed by asksteps_get_automation_catalog (\"form\", \"appointment\", \"email\", \"info\", \"end\"). Changing the kind of a stored key replaces the block with a new one.",
                          "type": "string"
                        },
                        "label": {
                          "description": "Label shown in the process editor and in cases. May be empty.",
                          "type": ["string", "null"]
                        },
                        "ref": {
                          "description": "What the block refers to: the form id for \"form\", the appointment type id (as text) for \"appointment\". Omit for kinds without a reference. The value \"@keep\" keeps the stored reference of an existing block; it is how a form that receives external submissions is read, and it cannot be used on a new block.",
                          "type": ["string", "null"]
                        },
                        "settings": {
                          "description": "Settings of the block, shaped by the settingsSchema of its kind in asksteps_get_automation_catalog. Omit for {}. A fixed recipient address of an email block is never part of it: read as addressSet, kept when you write the block back, and not settable.",
                          "type": ["object", "null"]
                        },
                        "start": {
                          "description": "true for the single block that starts the process (a form or an appointment type). Omit or false for all others.",
                          "type": "boolean"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              }
            },
            "required": ["process_id", "spec"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "issues": {
                "description": "The problems found, with path and code. Empty unless status is \"invalid\".",
                "items": {
                  "properties": {
                    "code": {
                      "description": "Machine-readable code, for example \"address_not_allowed\", \"out_of_range\", \"invalid_theme\" or \"unknown_shortcode\".",
                      "type": "string"
                    },
                    "path": {
                      "description": "Where the problem is, for example \"parts[2].settings.templateId\", \"edges[0].condition\" or \"durationMinutes\". Indices count in the list you sent.",
                      "type": "string"
                    },
                    "shortcode": {
                      "description": "The shortcode at fault, when the problem is a shortcode. Empty otherwise.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "limit": {
                "description": "The plan limit. Only on \"quota_exceeded\".",
                "type": "integer"
              },
              "note": {
                "description": "One or two sentences for the user. On \"confirmation_required\" and \"pause_required\" it says why.",
                "type": "string"
              },
              "processId": {
                "description": "The id of the process.",
                "type": "integer"
              },
              "processStatus": {
                "description": "The status of the process after the call: \"draft\", \"active\" or \"paused\". A created process is always \"draft\".",
                "type": "string"
              },
              "quotaKey": {
                "description": "The limit that was reached, for example \"processes.max\". Only on \"quota_exceeded\".",
                "type": "string"
              },
              "status": {
                "description": "Outcome. One of: \"created\" (a draft exists, nothing is switched on), \"updated\", \"invalid\" (the issues say exactly what to fix; nothing was saved), \"quota_exceeded\" (the account holds as many processes as its plan allows), \"pause_required\" (the process is active and this change touches its structure — it can only be made while the process is paused), \"confirmation_required\" (the process is active or paused and the account has not authorised an agent to change it: NOTHING was written, give the user the url), \"stale\" (the process was switched on, paused or otherwise changed in status since you read it: NOTHING was written, read it again), \"rate_limited\" (too many changes to live objects in the last minute), \"not_found\", \"not_connected\", \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              },
              "url": {
                "description": "Path of the process editor in the asksteps studio. Hand it to the user; a process created here shows its blocks laid out when the studio opens it.",
                "type": "string"
              },
              "used": {
                "description": "How many the account holds. Only on \"quota_exceeded\".",
                "type": "integer"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "asksteps: replace the building blocks and transitions of a process"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:151d1e3cd2c93f9651884012ff02c22b2de99d30abe500944f901f22addfe41c"
        },
        {
          "name": "asksteps_update_publication",
          "title": "asksteps: change the address or visibility of a published form",
          "description": "Changes the public address (slug), who may find it, or the page password of a form that is ALREADY published. Requires \"publish:write\". No mandate is needed: nothing new goes online, only the address and the audience change. A form without a page yet answers \"not_found\" — use asksteps_publish_form first, that is where the address is decided. Renaming keeps the old address as a redirect, so links already in circulation still work. Ask the user before changing a slug: the address is what they have given out.",
          "inputSchema": {
            "properties": {
              "form_id": {
                "description": "The form or funnel id.",
                "type": "string"
              },
              "password": {
                "default": null,
                "description": "Page password. Empty string removes it; leave the parameter out to keep it.",
                "type": ["string", "null"]
              },
              "slug": {
                "default": null,
                "description": "New path, e.g. \"kontakt\". Leave empty to keep the current one.",
                "type": ["string", "null"]
              },
              "visibility": {
                "default": null,
                "description": "\"public\" (listed and indexable), \"unlisted\" (only via the link) or \"password\". Leave empty to keep the current setting.",
                "type": ["string", "null"]
              }
            },
            "required": ["form_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "description": "One sentence for the user, naming what changed.",
                "type": "string"
              },
              "slug": {
                "description": "The path the page now lives at.",
                "type": "string"
              },
              "status": {
                "description": "Outcome. One of: \"updated\", \"not_connected\", \"not_found\" (the form has no published page yet — publish it first), \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              },
              "url": {
                "description": "The public address after the change.",
                "type": "string"
              },
              "visibility": {
                "description": "Who may find it: \"public\", \"unlisted\" or \"password\".",
                "type": "string"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "asksteps: change the address or visibility of a published form"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:90117317af6f5c4ebd52f1ef1cb647bbd5d31fd46442b90f1c74f35b480ba2e4"
        }
      ],
      "digest": "sha256:94a182d3fddd0f70a5d8b9a83d5d951106d517c22086d964df967828c7ea5da3"
    }
