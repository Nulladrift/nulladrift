        {
          "name": "asksteps_publish_form",
          "title": "asksteps: publish a form, or get the link to publish it",
          "description": "Publishes a form or funnel — or, when the account has not authorised an agent to publish, returns the link where the user does it themselves. Requires \"publish:write\". Read the status: \"confirmation_required\" means NOTHING happened and you should hand over the url; \"input_required\" means you must ask the user for the fields listed in \"missing\" and call again; \"published\" means it is live at the returned url. NEVER invent a slug — it becomes a public address that stays in circulation. Ask the user. Publishing puts the form on the open internet, with the legal obligations that come with a public page; say so before you ask. Taking a form offline (publish = false) always works and needs no mandate.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "default": false,
                "description": "Set to true only AFTER the user has explicitly agreed. Without it nothing is switched.",
                "type": "boolean"
              },
              "form_id": {
                "description": "The form or funnel id.",
                "type": "string"
              },
              "publish": {
                "default": true,
                "description": "true to publish (default), false to take it offline again.",
                "type": "boolean"
              },
              "slug": {
                "default": null,
                "description": "The path the form should live at, e.g. \"kontakt\". Ask the user; never make one up.",
                "type": ["string", "null"]
              },
              "target": {
                "default": null,
                "description": "Where to publish: \"page\" (a page on the asksteps platform, the usual choice) or \"whitelabel\" (the customer's own subdomain or domain). Defaults to \"page\".",
                "type": ["string", "null"]
              },
              "visibility": {
                "default": null,
                "description": "Who may find it: \"public\" (listed and indexable), \"unlisted\" (only via the link) or \"password\". Ask the user.",
                "type": ["string", "null"]
              }
            },
            "required": ["form_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "missing": {
                "description": "The parameters you still have to supply, by name. Ask the user for each of them and call again with all of them plus confirm = true. Never invent a slug — it becomes a public address that stays in circulation.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "description": "One sentence for the user. On \"confirmation_required\" make clear that nothing has been published yet.",
                "type": "string"
              },
              "status": {
                "description": "Outcome. One of: \"published\" (it is live now), \"unpublished\" (taken offline), \"input_required\" (the mandate is there but something is missing — see missing), \"confirmation_required\" (no mandate: give the user the url and let them do it), \"not_connected\", \"not_found\", \"not_allowed\" (the mandate does not cover this channel), \"rate_limited\" (too many calls in the last minute — wait a minute), \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              },
              "target": {
                "description": "The channel this answer is about: \"page\" (a page on the asksteps platform) or \"whitelabel\" (the customer's own subdomain or domain).",
                "type": "string"
              },
              "url": {
                "description": "The public address of the form once it is live, or the link where the user confirms the publication themselves.",
                "type": "string"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "asksteps: publish a form, or get the link to publish it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:55038f2abec73bf147518667dae9febd62008e435ce9a7ce306f77177680fd85"
        },
        {
          "name": "asksteps_save_as_template",
          "title": "asksteps: save a form or funnel as an own template",
          "description": "Saves an existing form or funnel of the connected asksteps account as an own template, so new forms can start from it (asksteps_create_from_template; it is listed by asksteps_list_account_templates). Requires \"forms:write\". A template carries the whole structure, design and pages, but never a PDF binding — a form built from a PDF is saved without it. Forms that receive external submissions cannot be saved. The account's template quota applies: the answer is \"quota_exceeded\" with limit and usage when it is reached. A template has no effect on visitors; it is just a stored starting point.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": null,
                "description": "A category to find it by, for example \"contact\". May be empty.",
                "type": ["string", "null"]
              },
              "description": {
                "default": null,
                "description": "Short description of what the template is for. May be empty.",
                "type": ["string", "null"]
              },
              "form_id": {
                "description": "The id of the form or funnel, as returned by asksteps_list_forms.",
                "type": "string"
              },
              "name": {
                "default": null,
                "description": "Name of the template. Leave empty to keep the form's own name.",
                "type": ["string", "null"]
              }
            },
            "required": ["form_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "limit": {
                "description": "The plan limit. Only on \"quota_exceeded\".",
                "type": "integer"
              },
              "note": {
                "description": "One or two sentences for the user.",
                "type": "string"
              },
              "quotaKey": {
                "description": "The limit that was reached (\"templates.max\"). Only on \"quota_exceeded\".",
                "type": "string"
              },
              "status": {
                "description": "Outcome. One of: \"created\", \"not_found\" (no form or funnel with that id in the account, or one that cannot be a template), \"quota_exceeded\" (the account holds as many own templates as its plan allows), \"not_connected\", \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              },
              "templateId": {
                "description": "The id of the new template. Pass it to asksteps_create_from_template; it is listed by asksteps_list_account_templates.",
                "type": "string"
              },
              "used": {
                "description": "How many own templates the account holds. Only on \"quota_exceeded\".",
                "type": "integer"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "asksteps: save a form or funnel as an own template"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:438e9cfaa245dbca15a2074e574cd2c250c45fa7bdc61b531afe4f925996de31"
        },
        {
          "name": "asksteps_search_docs",
          "title": "asksteps: search the public documentation",
          "description": "Searches the public asksteps website and returns the matching passages with their URLs. Use it to quote or cite what the product actually does instead of describing it from memory, and to check whether a feature exists at all. An empty result means no page mentions the term — treat that as 'probably not a feature', not as 'search failed'; the note field says which of the two it is.",
