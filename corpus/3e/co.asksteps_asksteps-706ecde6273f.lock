                        "type": "string"
                      },
                      "phone": {
                        "type": "string"
                      },
                      "postcode": {
                        "type": "string"
                      },
                      "salutation": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "createdAt": {
                    "type": "string"
                  },
                  "files": {
                    "items": {
                      "properties": {
                        "fileName": {
                          "type": "string"
