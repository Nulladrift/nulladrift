        {
          "name": "asksteps_set_process_active",
          "title": "asksteps: switch a process on or pause it (needs the account's mandate)",
          "description": "Switches a process on (active = true) or pauses it (active = false). Requires \"automation:write\". Both directions need the account's mandate \"activate\" (granted by the account owner in the studio under AI agents) and work in three steps: without the mandate the answer is \"confirmation_required\" with the studio link and NOTHING happens — hand the user the url; with the mandate and without confirm the answer is \"input_required\" with the findings and what the switch does — read it to the user and ask; only with confirm = true it is carried out, and the account owner is emailed about it. Switching on makes the process start for every new submission and lets email reach visitors; pausing stops new cases but running cases keep going. \"invalid\" lists the checks that failed.",
          "inputSchema": {
            "properties": {
              "active": {
                "description": "true to switch on, false to pause.",
                "type": "boolean"
              },
              "confirm": {
                "default": false,
                "description": "Set to true only AFTER the user has explicitly agreed. Without it nothing is switched.",
                "type": "boolean"
              },
              "process_id": {
                "description": "The process id.",
                "type": "integer"
              }
            },
            "required": ["active", "process_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "issues": {
                "description": "The findings that block (or would block) switching on, with path and code.",
                "items": {
                  "properties": {
                    "code": {
                      "description": "Machine-readable code, for example \"address_not_allowed\", \"out_of_range\", \"invalid_theme\" or \"unknown_shortcode\".",
                      "type": "string"
                    },
                    "path": {
                      "description": "Where the problem is, for example \"parts[2].settings.templateId\", \"edges[0].condition\" or \"durationMinutes\". Indices count in the list you sent.",
                      "type": "string"
                    },
                    "shortcode": {
                      "description": "The shortcode at fault, when the problem is a shortcode. Empty otherwise.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "missing": {
                "description": "The parameters you still have to supply: [\"confirm\"] on \"input_required\".",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "description": "One or two sentences for the user. On \"input_required\" it says what the switch does and how many findings there are.",
                "type": "string"
              },
              "processId": {
                "description": "The id of the process.",
                "type": "integer"
              },
              "processStatus": {
                "description": "The status of the process after the call.",
                "type": "string"
              },
              "status": {
                "description": "Outcome. One of: \"activated\", \"paused\", \"unchanged\" (already in that state), \"input_required\" (the mandate is there; read note and issues, ask the user and call again with confirm = true), \"confirmation_required\" (the account has not authorised an agent to do this: NOTHING happened, give the user the url), \"invalid\" (the checks failed; see issues), \"not_found\", \"rate_limited\", \"not_connected\", \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              },
              "url": {
                "description": "Path of the process in the asksteps studio, where the user does it themselves.",
                "type": "string"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "asksteps: switch a process on or pause it (needs the account's mandate)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5733f8be2fb2589967ac0660288f30f95deedeecddc202e77e67e2c253b85013"
        },
        {
          "name": "asksteps_start_checkout",
          "title": "asksteps: get the link where the user books a plan",
          "description": "Returns the link where the user books a plan themselves, with that plan preselected, and the exact net price. Requires \"billing:write\". NOTHING is bought by this call and nothing can be: the customer enters their payment details with the payment provider and gives the statutory acknowledgement personally — asksteps never sees card data, and that declaration is not one a machine can make for someone. Use this for a FIRST purchase. To move an existing paid account between plans, use asksteps_change_plan instead.",
          "inputSchema": {
            "properties": {
              "interval": {
                "default": null,
                "description": "\"month\" (default) or \"year\".",
                "type": ["string", "null"]
              },
              "plan_code": {
                "description": "Plan code: \"starter\", \"professional\" or \"business\". Call asksteps_get_capabilities for the catalogue.",
                "type": "string"
              }
            },
            "required": ["plan_code"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "interval": {
                "description": "The billing interval this price refers to: \"month\" or \"year\".",
                "type": "string"
              },
              "note": {
                "description": "One sentence for the user. On \"confirmation_required\" it names the plan, the price and what changes — read it out before asking.",
                "type": "string"
              },
              "planCode": {
                "description": "The plan code after the change, when something changed.",
                "type": "string"
              },
              "priceCents": {
                "description": "The net price per interval in cents, so you can state it exactly instead of estimating.",
                "type": "integer"
              },
              "status": {
                "description": "Outcome. One of: \"changed\" (the plan is now different), \"confirmation_required\" (read the note to the user and call again with confirm = true if they agree), \"checkout_required\" (give them the url; only they can enter payment details), \"not_allowed\" (outside the mandate — the note says which limit), \"rate_limited\" (too many plan changes in the last minute — wait a minute; nothing was charged), \"not_connected\", \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              },
              "url": {
                "description": "Link where the user completes the purchase themselves. Give it to them verbatim.",
                "type": "string"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "asksteps: get the link where the user books a plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:96b5aa97053f782449613779c550f62c93916caeb6d1dc808fdff32fbfb8e007"
        },
        {
          "name": "asksteps_update_appointment_type",
          "title": "asksteps: change settings of an appointment type",
          "description": "Changes the settings you send of an appointment type; everything you leave out stays as it is — including the on/off switch, public booking, the public link and the assigned staff, which this tool never touches. Lists you send (excludedDates, modes) replace the stored list; an empty string removes color, bookableFrom, bookableUntil, intakeFunnelId or themeId. Requires \"automation:write\". An INACTIVE type can be changed freely. A type that is switched on can only be changed with the account's mandate \"activate\": without it the answer is \"confirmation_required\", NOTHING was written, and you hand the user the url. Call asksteps_get_appointment_type first.",
          "inputSchema": {
            "properties": {
              "spec": {
                "description": "The settings to change. Fields you omit stay unchanged.",
                "properties": {
                  "allowReschedule": {
                    "description": "Whether visitors may reschedule.",
                    "type": ["boolean", "null"]
                  },
                  "assignment": {
                    "description": "How a person is assigned: \"pool\" or \"choose\" (staff members — assigned in the studio, not here) or \"org\" (the organisation, no staff needed).",
                    "type": ["string", "null"]
                  },
                  "bookableFrom": {
                    "description": "First bookable day as \"yyyy-MM-dd\" (inclusive). An empty string removes the limit.",
                    "type": ["string", "null"]
                  },
                  "bookableUntil": {
                    "description": "Last bookable day as \"yyyy-MM-dd\" (inclusive). An empty string removes the limit.",
                    "type": ["string", "null"]
                  },
                  "bufferAfterMinutes": {
                    "description": "Buffer after an appointment in minutes, 0 to 240.",
                    "type": ["integer", "null"]
                  },
                  "bufferBeforeMinutes": {
                    "description": "Buffer before an appointment in minutes, 0 to 240.",
                    "type": ["integer", "null"]
                  },
                  "cancellationDeadlineHours": {
                    "description": "Hours before the start up to which a visitor can cancel, 0 to 720.",
                    "type": ["integer", "null"]
                  },
                  "color": {
                    "description": "Colour as \"#RRGGBB\". An empty string removes it.",
                    "type": ["string", "null"]
                  },
                  "description": {
                    "description": "Description, at most 2000 characters. Empty text removes it.",
                    "type": ["string", "null"]
                  },
                  "durationMinutes": {
                    "description": "Duration of one appointment in minutes, 5 to 480. Required when creating.",
                    "type": ["integer", "null"]
                  },
                  "excludedDates": {
                    "description": "Days that are not bookable, each \"yyyy-MM-dd\", at most 366. Replaces the stored list; an empty list clears it.",
                    "items": {
                      "type": "string"
                    },
                    "type": ["array", "null"]
                  },
                  "intakeFunnelId": {
                    "description": "The id of a questionnaire form of this account that visitors fill in before booking. An empty string removes it. A form that receives external submissions cannot be used.",
                    "type": ["string", "null"]
                  },
                  "inviteValidityDays": {
                    "description": "How many days an invitation link stays valid, 1 to 60.",
                    "type": ["integer", "null"]
                  },
                  "key": {
                    "description": "Short key of the appointment type: lowercase letters, digits and \"-\", 2 to 40 characters. Omit to derive it from the name (creating) or keep it (changing).",
                    "type": ["string", "null"]
                  },
                  "maxAdvanceDays": {
                    "description": "How many days ahead appointments can be booked, 1 to 365.",
                    "type": ["integer", "null"]
                  },
                  "meetingLeadMinutes": {
                    "description": "Minutes before the start from which an online meeting can be joined, 0 to 60.",
                    "type": ["integer", "null"]
                  },
                  "minNoticeMinutes": {
                    "description": "Shortest notice before an appointment in minutes, 0 to 43200.",
                    "type": ["integer", "null"]
                  },
                  "modes": {
                    "description": "The ways to attend, one to four of \"online\", \"onsite\" (needs locationId of an active location of the account — locations are created in the studio), \"phone\" and \"visitor_address\". Replaces the stored list. Required when creating.",
                    "items": {
                      "properties": {
                        "closingText": {
                          "description": "Text shown to the visitor after booking, at most 1000 characters. Plain text.",
                          "type": ["string", "null"]
                        },
                        "locationId": {
                          "description": "The id of an active location of the account. Only (and required) for \"onsite\".",
                          "type": ["integer", "null"]
                        },
                        "mode": {
                          "description": "\"online\", \"onsite\", \"phone\" or \"visitor_address\".",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": ["array", "null"]
                  },
                  "name": {
                    "description": "Name, at most 120 characters. Required when creating.",
                    "type": ["string", "null"]
                  },
                  "requireAcceptance": {
                    "description": "Appointments have to be accepted internally. Only with assignment \"org\"; otherwise false.",
                    "type": ["boolean", "null"]
                  },
                  "slotIntervalMinutes": {
                    "description": "Grid of the offered start times in minutes, 5 to 240. Required when creating.",
                    "type": ["integer", "null"]
                  },
                  "themeId": {
                    "description": "Design of the booking page: a shipped design id (asksteps_list_themes) or \"design-<number>\" of the account (asksteps_list_designs). An empty string goes back to the account default. Unknown or foreign ids are rejected (invalid_theme).",
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "type_id": {
                "description": "The appointment type id.",
                "type": "integer"
              }
            },
            "required": ["spec", "type_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "active": {
                "description": "Whether the appointment type is switched on. A created one is always false.",
                "type": "boolean"
              },
              "issues": {
                "description": "The problems found, with path and code. Empty unless status is \"invalid\".",
                "items": {
                  "properties": {
                    "code": {
                      "description": "Machine-readable code, for example \"address_not_allowed\", \"out_of_range\", \"invalid_theme\" or \"unknown_shortcode\".",
                      "type": "string"
                    },
                    "path": {
                      "description": "Where the problem is, for example \"parts[2].settings.templateId\", \"edges[0].condition\" or \"durationMinutes\". Indices count in the list you sent.",
                      "type": "string"
                    },
                    "shortcode": {
                      "description": "The shortcode at fault, when the problem is a shortcode. Empty otherwise.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "One or two sentences for the user. After \"created\" it says that the type is inactive and what is still missing.",
                "type": "string"
              },
              "status": {
                "description": "Outcome. One of: \"created\" (inactive, not publicly bookable), \"updated\", \"invalid\" (the issues say exactly what to fix; nothing was saved), \"confirmation_required\" (the appointment type is switched on and the account has not authorised an agent to change it: NOTHING was written, give the user the url), \"stale\" (someone switched the type on or off since you read it: NOTHING was written, read it again), \"rate_limited\" (too many changes to live objects in the last minute), \"not_found\", \"not_connected\", \"error\". Authorisation can also refuse before the tool runs: \"plan_required\" (the account's plan does not include agent access), \"not_enabled\" (the account owner has not switched agent access on), \"permission_denied\" (the connected user's role lacks the permission; the note names it), \"mandate_required\" (the owner has not granted a mandate for this). The note then says what the user has to do.",
                "type": "string"
              },
              "typeId": {
                "description": "The id of the appointment type.",
                "type": "integer"
              },
              "url": {
                "description": "Path of the editor in the asksteps studio.",
                "type": "string"
              },
              "warnings": {
                "description": "Warning codes of the saved type, for example \"no_bookable_staff\" (assign staff in the studio before switching on).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "asksteps: change settings of an appointment type"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7db1a065a10057e2f9b2a64eb90fe2d31c0e2d4fd20ce7e9453348ad9afed375"
        },
        {
          "name": "asksteps_update_form",
          "title": "asksteps: replace an existing form",
          "description": "Replaces an existing form of the connected asksteps account. Requires \"forms:write\". IMPORTANT: this REPLACES the whole form — every step and field you do not send is gone. Call asksteps_get_form first, change what the user asked for, and send the result back complete. Forms built from a PDF and forms containing elements this format cannot describe are refused; the answer says which and why. The publication state is never changed.",
