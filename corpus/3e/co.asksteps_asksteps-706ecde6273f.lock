                "description": "Why writing is blocked, in one sentence. Empty when editable.",
                "type": "string"
              },
              "editable": {
                "description": "Whether asksteps_update_funnel may write this funnel back. When false, DO NOT try — it contains things this format cannot describe, and writing would delete them.",
                "type": "boolean"
              },
              "funnelId": {
                "description": "The id of the funnel, to pass back to asksteps_update_funnel.",
                "type": "string"
              },
