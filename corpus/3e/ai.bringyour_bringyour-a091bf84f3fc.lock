          "description": "Free no-data preview for building a user's first setup in any of the 13 supported tools. Does not accept GitHub handles, generated memories, mappings, or file content.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "to": {
                "description": "Target tool id, e.g. claude-code, codex, cursor. Use list_targets for the full matrix.",
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
