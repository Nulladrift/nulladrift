        {
          "name": "preview_move",
          "description": "Free no-data preview for moving a harness between any two of the 13 supported tools (Claude Code, Cursor, Codex, OpenClaw, Aider, Continue, Cline, Goose, Zed, Roo Code, ChatGPT, Claude.ai, Copilot). Returns feasibility copy only. Does not accept or return mappings, file paths, generated content, or validation notes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Source tool id, e.g. claude-code, cursor, codex, openclaw, aider, continue, cline, goose, zed, roo, chatgpt, claude-ai. Use list_targets for the full matrix.",
                "type": "string"
              },
              "to": {
                "description": "Target tool id, e.g. codex, cursor, claude-code, copilot. Use list_targets for the full matrix.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90ac270afbe547f9734228358d7644fb53b8000569f68c028f76c86ffc68f6b9"
        },
        {
          "name": "quote_lifetime_license",
          "description": "Quote a Bring Your AI lifetime license or Team Migration Pack in USD. The team pack includes one guided migration and onboarding for up to 10 people plus lifetime licenses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_country": {
                "description": "Optional ISO country code.",
                "type": "string"
              },
              "currency": {
                "description": "Optional requested currency. Only USD is currently supported.",
                "type": "string"
              },
              "locale": {
                "description": "Optional BCP 47 locale.",
                "type": "string"
              },
              "product_id": {
                "description": "Optional product id. Defaults to bringyour_founder_lifetime.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10ef598c0454c30c2cae27ce39f99f041fbf878a4a88f9dbeea840834bacf2ac"
        },
        {
          "name": "start_checkout",
          "description": "Start checkout. With payment_mode=stripe_spt plus shared_payment_granted_token and buyer_email, settles a Stripe PaymentIntent and returns the signed license without opening a browser.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_email": {
                "description": "Email bound to the issued license. Required for stripe_spt settlement.",
                "type": "string"
              },
              "email": {
                "description": "Alias for buyer_email.",
                "type": "string"
              },
              "payment_mode": {
                "description": "stripe_payment_link, stripe_link, link, stripe_checkout, stripe_acp, stripe_spt, or x402.",
                "type": "string"
              },
              "product_id": {
                "description": "Optional product id. Defaults to bringyour_founder_lifetime.",
                "type": "string"
              },
              "shared_payment_granted_token": {
                "description": "Link-issued Stripe shared payment token. Required for stripe_spt settlement.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
