{
  "lockfileVersion": 2,
  "subjects": {
    "com.iride360/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.iride360.com/api/public/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "iride360-booking",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Book ground transportation with iRide360, a Los Angeles chauffeur service (executive sedan and luxury SUV only).\n\nBooking flow (two stages, in order):\n1. iride_get_quote for the live fare and a quote_id.\n2. Read the customer the exact fare, vehicle, pickup date and pickup time, and get explicit approval of all of them.\n3. Only then iride_create_booking. iRide360 emails a secure review-and-pay link; the ride is confirmed only after payment.\n\nRules:\n- Never say a ride is confirmed before payment is received.\n- Never invent, change or negotiate a price; quote and book only what the engine returns.\n- Confirm the exact pickup date AND time for THIS trip before booking. Never assume a time, apply a default, or reuse a time mentioned earlier in the conversation — if the pickup time is not clearly stated for this trip, ask for it.\n- Airport pickups: set the pickup time from the flight's scheduled arrival, allowing time to deplane and collect bags, and read it back to the customer to confirm. Never book an airport pickup at a time unrelated to the flight arrival.\n- Existing bookings: iride_find_booking, then iride_verify_caller (two matching factors) before details or changes.\n- Multiple stops, more than one vehicle, or anything the tools can't do: iride_request_callback — don't promise it yourself.\n- Every tool response includes next_action (proceed | ask_for_more_info | verify_caller | create_callback | transfer_to_dispatch) — follow it.",
      "tools": [
        {
          "name": "iride_cancel_booking",
          "title": "Request a cancellation",
          "description": "24+ hours before pickup: records a cancellation request for admin to refund. Otherwise transfer to dispatch.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "airline_cancelled_flight": {
                "default": false,
                "type": "boolean"
              },
              "reason": {
                "default": "",
                "maxLength": 300,
                "type": "string"
              },
              "verification_token": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["airline_cancelled_flight", "reason", "verification_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a cancellation"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cfbd2f5ea0b9ab6446965b82e26577dd15d4e8ade5d202ffaca1e43f57f130f6"
        },
        {
          "name": "iride_create_booking",
          "title": "Create a reservation from a quote",
          "description": "Books from a saved quote and emails the secure payment link. Only gratuity may be reselected; no caller-supplied prices. Confirmed once paid. Before booking, confirm the exact pickup date and time with the customer — never assume one, apply a default, or reuse a time from earlier in the conversation. For an airport pickup, set the pickup time from the flight's scheduled arrival (allow time to deplane and collect bags) and read it back to confirm.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "airline": {
                "default": "",
                "maxLength": 80,
                "type": "string"
              },
              "email": {
                "format": "email",
                "maxLength": 180,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "first_name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "flight_number": {
                "default": "",
                "maxLength": 20,
                "type": "string"
              },
              "gratuity_percent": {
                "anyOf": [
                  {
                    "const": 0,
                    "type": "number"
                  },
                  {
                    "const": 15,
                    "type": "number"
                  },
                  {
                    "const": 18,
                    "type": "number"
                  },
                  {
                    "const": 20,
                    "type": "number"
                  },
                  {
                    "const": 25,
                    "type": "number"
                  }
                ]
              },
              "last_name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "meet_greet_name": {
                "default": "",
                "maxLength": 120,
                "type": "string"
              },
              "mobile": {
                "maxLength": 40,
                "minLength": 10,
                "pattern": "^[+\\d\\s().-]*$",
                "type": "string"
              },
              "notes": {
                "default": "",
                "maxLength": 500,
                "type": "string"
              },
              "quote_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "vehicle_type": {
                "enum": ["sedan", "suv"],
                "type": "string"
              }
            },
            "required": ["airline", "email", "first_name", "flight_number", "last_name", "meet_greet_name", "mobile", "notes", "quote_id", "vehicle_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a reservation from a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90eb096268bacbea2e5f99e2956a84b94bef14c0528a7b42ddb2efa3aaa3e376"
        },
        {
          "name": "iride_find_booking",
          "title": "Find an existing booking",
          "description": "Finds up to 3 bookings by caller ID, confirmation number, or last name + pickup date. Masked data only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirmation_number": {
                "maxLength": 30,
                "type": "string"
              },
              "last_name": {
                "maxLength": 80,
                "type": "string"
              },
              "pickup_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find an existing booking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:67b0d30b4047ac73390d1ae9cdc6c3134537acd417bec706d8a834fba9f940b9"
        },
        {
          "name": "iride_get_booking",
          "title": "Get verified booking details",
          "description": "Verified booking details (no email, card or payment data).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "verification_token": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["verification_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get verified booking details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c4f466bdc3eef1fb88c5444b6af4d0dd68205da7dd8da8e0f6cf8ec8a1c6cced"
        },
        {
          "name": "iride_get_knowledge",
          "title": "Get iRide360 policy & service info",
          "description": "Fleet, service area, airports, policies, child seats and FAQ.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "topic": {
                "default": "all",
                "enum": ["all", "fleet", "service_area", "airports", "policies", "child_seats", "faq"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get iRide360 policy & service info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c030e162f8ade204b27def595b41a7ae6182eeb31c772cd5fdcf95d6a1be464"
        },
        {
          "name": "iride_get_quote",
          "title": "Get a live iRide360 quote",
          "description": "Prices a trip with the live pricing engine. Returns vehicles that fit and a quote_id valid 30 minutes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bags": {
                "default": 0,
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "child_seats": {
                "default": 0,
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "dropoff": {
                "default": "",
                "maxLength": 300,
                "type": "string"
              },
              "gratuity_percent": {
                "anyOf": [
                  {
                    "const": 0,
                    "type": "number"
                  },
                  {
                    "const": 15,
                    "type": "number"
                  },
                  {
                    "const": 18,
                    "type": "number"
                  },
                  {
                    "const": 20,
                    "type": "number"
                  },
                  {
                    "const": 25,
                    "type": "number"
                  }
                ],
                "default": 20
              },
              "hours": {
                "maximum": 18,
                "minimum": 3,
                "type": "integer"
              },
              "meet_and_greet": {
                "default": false,
                "type": "boolean"
              },
              "passengers": {
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "pickup": {
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              },
              "service_type": {
                "enum": ["airport_pickup", "airport_dropoff", "point_to_point", "hourly"],
                "type": "string"
              },
              "stops": {
                "default": [],
                "items": {
                  "maxLength": 300,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "time": {
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "vehicle_type": {
                "enum": ["sedan", "suv"],
                "type": "string"
              }
            },
            "required": ["bags", "child_seats", "date", "dropoff", "gratuity_percent", "meet_and_greet", "passengers", "pickup", "service_type", "stops", "time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a live iRide360 quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:23f6013f9701db1df5c623138e75f3ca795e9c7467b791e7e2bf9b9388f41c2b"
        },
        {
          "name": "iride_modify_booking",
          "title": "Modify a verified booking",
          "description": "Keeps the 4-hour change lock and new-pickup notice (12h transfers, 3h hourly). Unpaid tip-only edits apply; paid/pending-payment tips need staff approval. Other price increases and stops still need approval; never charges/refunds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "changes": {
                "additionalProperties": false,
                "properties": {
                  "bags": {
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "dropoff_address": {
                    "maxLength": 300,
                    "minLength": 3,
                    "type": "string"
                  },
                  "flight_number": {
                    "maxLength": 20,
                    "type": "string"
                  },
                  "gratuity_percent": {
                    "anyOf": [
                      {
                        "const": 0,
                        "type": "number"
                      },
                      {
                        "const": 15,
                        "type": "number"
                      },
                      {
                        "const": 18,
                        "type": "number"
                      },
                      {
                        "const": 20,
                        "type": "number"
                      },
                      {
                        "const": 25,
                        "type": "number"
                      }
                    ]
                  },
                  "passenger_first_name": {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "passenger_last_name": {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "passenger_phone": {
                    "maxLength": 40,
                    "minLength": 10,
                    "pattern": "^[+\\d\\s().-]*$",
                    "type": "string"
                  },
                  "passengers": {
                    "maximum": 14,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "pickup_address": {
                    "maxLength": 300,
                    "minLength": 3,
                    "type": "string"
                  },
                  "pickup_date": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "pickup_time": {
                    "pattern": "^\\d{1,2}:\\d{2}$",
                    "type": "string"
                  },
                  "special_requests": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "stops": {
                    "items": {
                      "maxLength": 300,
                      "minLength": 3,
                      "type": "string"
                    },
                    "maxItems": 3,
                    "type": "array"
                  },
                  "vehicle_type": {
                    "enum": ["sedan", "suv"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "verification_token": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["changes", "verification_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Modify a verified booking"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:34b1e00553519a072d084d30e6a2053c3567f7c6ccac6ebca9835153b8f41096"
        },
        {
          "name": "iride_request_callback",
          "title": "Request a dispatch callback",
          "description": "Creates a dispatch callback task and alerts the team.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "booking_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "maxLength": 40,
                "minLength": 10,
                "pattern": "^[+\\d\\s().-]*$",
                "type": "string"
              },
              "reason": {
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "urgency": {
                "default": "normal",
                "enum": ["low", "normal", "high"],
                "type": "string"
              }
            },
            "required": ["name", "phone", "reason", "urgency"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a dispatch callback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:989a2a27aee27864f666ccd7d63019a549db517718204271107803cd65eb95a9"
        },
        {
          "name": "iride_verify_caller",
          "title": "Verify the customer owns the booking",
          "description": "Checks two matching factors. Returns a 15-minute token for that booking. 3 failures lock the caller for 1 hour.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "booking_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "confirmation_number": {
                "maxLength": 30,
                "type": "string"
              },
              "last_name": {
                "maxLength": 80,
                "type": "string"
              },
              "pickup_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["booking_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Verify the customer owns the booking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b1d4485f6b1555201ba518bd229031329f8564b882bd6cdc4a06163060aec80b"
        }
      ],
      "digest": "sha256:558f53e279fe0c65cfd1feab21aa383e78e328317fa0cf2d22d7ad3a0fa54dbf"
    }
  }
}
