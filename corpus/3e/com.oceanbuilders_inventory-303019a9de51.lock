    "com.oceanbuilders/inventory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.oceanbuilders.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ocean-builders",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Ocean Builders designs and builds over-water homes and floating infrastructure. Unit sales have not opened yet. Ocean Builders is preparing to launch its flagship developments in two new markets; prospective buyers can register their interest. Use submit_inquiry to register a prospective buyer's interest; the team follows up by email.",
      "tools": [
        {
          "name": "submit_inquiry",
          "title": "Register a buyer inquiry with the sales team",
          "description": "Registers a prospective buyer's interest with the Ocean Builders sales team. Requires the buyer's real name and email (with their consent to be contacted); the team follows up by email. Returns a neutral acknowledgment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "elapsed_ms": {
                "description": "Milliseconds the end user spent composing this inquiry, when known.",
                "minimum": 0,
                "type": "integer"
              },
              "email": {
                "description": "The prospective buyer's email address (they consent to be contacted).",
                "maxLength": 180,
                "type": "string"
              },
              "message": {
                "description": "What they are interested in, questions, timeline — anything for the sales team.",
                "maxLength": 4000,
                "type": "string"
              },
              "name": {
                "description": "The prospective buyer's full name.",
                "maxLength": 180,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Optional phone number, international format preferred.",
                "maxLength": 50,
                "type": "string"
              },
              "website": {
                "description": "Leave empty.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f3ca1fda44d7d9eeb251be786facfb08fe870616c2b3f64159e7c18f38ce83c4"
        }
      ],
      "digest": "sha256:0e74bb8c127c9f1d330d333f5d90af86cac580126eb4d0bade3d4c4101edc698"
    }
  }
