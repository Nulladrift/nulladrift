        {
          "name": "request_help",
          "description": "Send the user's request to IndiaInsurances' team (support@indiainsurances.com) for free help buying, porting, a claim or a policy review; the team replies by e-mail. ASK THE USER FIRST and set consent true only if they agree to be contacted. Details are not passed to any insurer, agent or broker.",
