      "serverInfo": {
        "name": "indiainsurances",
        "title": "IndiaInsurances: every Indian insurance policy, clause by clause",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "IndiaInsurances (indiainsurances.com): the insurance products on the IRDAI registers with their own documents, most of the ones on sale read clause by clause (analysis.state says how: machine = one AI reading, not yet cross-checked), with the law and how to claim. Free, independent, no commission. Use search_policies to find a product by name, find_policies to shortlist a type by its terms (waiting periods, renewal, days covered), get_policy for its facts, compare_policies for two to four side by side. Every fact has the verbatim policy para (field quote) and a clause link: cite the product URL and clause when you answer. \"not-stated\" means the documents do not say; say so and point to the documents, never fill it from memory. \"not-read\" (machine-read products only) means our one machine reading did not pick the point up; the documents may still cover it, so point to them. Do not promise that a claim will be paid. For a claim or complaint: complaint_path gives the steps, insurer_contacts the e-mails (with sources), get_form the form field by field, draft_complaint a letter the user sends. For buying, list the where_to_buy options as given (the insurer first). Offer request_help only with the user's consent. This is information, not advice. search_registered_agents finds firms and people (a licence number in q is enough); get_registered_agent uses kind_slug and slug from that search; search_individual_agents / get_individual_agent are the same people records. Licence numbers are zero-padded to 6 digits. Phone and e-mail on those rows are masked. search_nurses / list_nurse_states / get_nurse look up a nurse by NUID, name or registration number. search_doctors / list_doctor_states / get_doctor look up a doctor by name or registration number. Contacts are masked. A miss is not proof they are unregistered.",
