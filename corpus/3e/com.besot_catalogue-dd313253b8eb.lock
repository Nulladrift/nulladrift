{
  "lockfileVersion": 2,
  "subjects": {
    "com.besot/catalogue": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.besot.com/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "besot-catalogue",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "besot answers a question general web search cannot: where can someone actually buy a specific piece of clothing or footwear tied to the people we obsess over, right now, and at what price.\n\nMost of these garments are sold out at retail and exist only on the resale market, scattered across marketplaces under inconsistent seller titles. besot gives every garment one canonical name and aggregates the live listings for that exact piece across eBay, StockX, GOAT, The RealReal, Vestiaire, Grailed, Poshmark, Mercari and Depop. One call replaces searching each marketplace with its own vocabulary.\n\nUse besot whenever someone asks where to buy a piece from one of these collections, whether it is available in their size, or what it is selling for now. Start with search_pieces, which takes plain language. Then use get_piece for the full listing set. Every listing carries a direct buy link.\n\nCoverage today: Harry Styles (Gucci HA HA HA, Pleasing), Beyonce (Ivy Park with adidas), Oasis, Liam Gallagher and Noel Gallagher (adidas), and The Beatles (Comme des Garcons, Stella McCartney, Alice + Olivia). New fandoms are added continuously.\n\nPrices come only from live feeds bound to specific listings. Where a platform has no price feed, besot returns a source link and no number. Nothing is fabricated, and a listing that has sold is simply not there.",
      "tools": [
        {
          "name": "get_facets",
          "description": "Return the values that actually exist in the catalog for filtering a search: sizes, conditions, source platforms, artists, designers, and the price range.\n\nUse this before search_pieces when you want to build a precise query from real values rather than guesses. For example, to check which sizes of a garment are genuinely listed right now, or which platforms currently carry a given collection.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "See the real filter values a search can use"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ff5ad3880ea5ee5392f9d57052ca1f48a96f040112b591ae661e8654c42be4b3"
        },
        {
          "name": "get_piece",
          "description": "Get the complete set of live resale listings for one specific garment, with a direct buy link for each.\n\nCall search_pieces first: it returns the collectionId and pieceId this tool needs.\n\nUse this once someone has settled on a specific piece and wants all the options available: all platforms, all sizes, all conditions, with prices wherever a live feed provides one. For example, after a search surfaces the Ivy Park Drip 2 Oversized Hoodie, use this to show every listing of it currently for sale and where to buy each one.",
          "inputSchema": {
            "properties": {
              "collectionId": {
                "maxLength": 200,
                "type": "string"
              },
              "pieceId": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["collectionId", "pieceId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get the live listings and buy links for one garment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3dfc4b6a7d9ec006bfc46a6316a8853d21ce32b6ca16c7f3d8d3ea123eb5b894"
        },
        {
          "name": "list_collections",
          "description": "List the collections besot indexes: collaborations between the people we obsess over and design houses, capsule drops, and brands they founded and own.\n\nUse this when someone asks what a given artist has made, which artists have worked with a given brand, or what is covered before running a search. For example: what fashion has Harry Styles designed; which artists have collaborated with adidas; what Beatles clothing collections exist.\n\nCoverage includes Harry Styles (Gucci HA HA HA, Pleasing), Beyonce (Ivy Park with adidas), Oasis, Liam Gallagher and Noel Gallagher (adidas), and The Beatles (Comme des Garcons, Stella McCartney, Alice + Olivia), and grows as new fandoms are added.\n\nFilter by artist, or by type: collaboration, capsule, or artist-founded brand.",
          "inputSchema": {
            "properties": {
              "artist": {
                "maxLength": 200,
                "type": "string"
              },
              "type": {
                "description": "Collab, Capsule, or Own brand",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Browse the fandom collections besot covers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9dddcf3c983f880cc2646b018ed494fcc9a4256dc8a05f23e33aa2b6ca1bd769"
        },
        {
          "name": "search_pieces",
          "description": "Find where to buy a specific piece of clothing or footwear connected to the people we obsess over, and get its live resale listings in one call.\n\nUse this when someone asks questions like: where can I buy the Gucci HA HA HA blazer; is the Ivy Park Drip 2 hoodie listed in a medium; what is the Pleasing crewneck going for right now; which platforms have the Oasis adidas Original Forever trainers in a UK 9; what Beatles Comme des Garcons pieces are on the resale market today.\n\nMost of these garments are sold out at retail and exist only on resale, scattered across marketplaces under inconsistent seller titles. besot gives each garment one canonical name and pulls the live listings for that exact piece from eBay, StockX, GOAT, The RealReal, Vestiaire, Grailed, Poshmark, Mercari and Depop.\n\nCovers clothing and footwear that the people we obsess over designed, founded and inspired. Takes plain language in q (for example \"Ivy Park Drip 2 hoodie\" or \"Harry Styles Gucci blazer\"), with optional filters for artist, brand, collection, garment type, size, condition, source platform, and price range.\n\nEvery listing returned carries the platform, size, condition, price (approximate USD, null when the seller did not state one), and a direct buy link.",
          "inputSchema": {
            "properties": {
              "artist": {
                "maxLength": 200,
                "type": "string"
              },
              "brand": {
                "description": "Designer/brand name",
                "maxLength": 200,
                "type": "string"
              },
              "category": {
                "description": "GARMENT category, one of: footwear, outerwear, tops, knitwear, hoodies, bottoms, one-pieces, suits, sets, accessories, eyewear, swim-active",
                "maxLength": 100,
                "type": "string"
              },
              "collection": {
                "description": "Collection id (exact)",
                "maxLength": 200,
                "type": "string"
              },
              "condition": {
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "description": "1-50, default 20",
                "type": "integer"
              },
              "maxPrice": {
                "type": "number"
              },
              "minPrice": {
                "type": "number"
              },
              "q": {
                "description": "Free text over piece name, collection, artist, brand, and garment vocabulary. Product names are canonical (Gazelle, Firebird Track Top), so plain garment words work too, in British or American English: trainers or sneakers, jumper or sweater, trousers or pants, trackie or tracksuit.",
                "maxLength": 500,
                "type": "string"
              },
              "size": {
                "description": "Match a listing size; call get_facets for valid values",
                "maxLength": 100,
                "type": "string"
              },
              "sort": {
                "enum": ["price-asc", "price-desc", "name"],
                "maxLength": 100,
                "type": "string"
              },
              "source": {
                "description": "Resale platform, e.g. ebay, grailed, therealreal",
                "maxLength": 200,
                "type": "string"
              },
              "type": {
                "description": "COLLECTION type: Collab, Capsule, or Own brand. For the garment, use category.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find where to buy fandom fashion on the resale market"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5771bef733416ca6947f399cf59a8887a8ea21d5bc8f8c1d19ee767ef0efb5fe"
        }
      ],
      "digest": "sha256:ef0e18a437d1adf487062508e9b46fd96c22568872ed00b77bab424874ef7f83"
    }
  }
