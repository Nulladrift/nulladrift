        {
          "name": "forbered_bestilling",
          "title": "Forbered bestilling",
          "description": "Vis en bestillingsforhåndsvisning for én Fjordgull Original-boks per leveringssyklus, med løpende abonnementspris, leveringsstatus og lenke til Fjordgulls bestillingsside. Oppretter ingen ordre, avtale, betaling eller lagerreservasjon. Bruk når brukeren uttrykkelig vil bestille. Kunden fullfører på nettstedet og godkjenner Vipps-avtalen selv. Ikke be om telefon, e-post, kortopplysninger eller helseopplysninger.",
