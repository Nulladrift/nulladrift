      "tools": [
        {
          "name": "check_pdf_accessibility",
          "title": "Check a PDF's accessibility against PDF/UA",
          "description": "Check whether a PDF is accessible by PDF/UA, the ISO standard for accessible PDF.\n\nveraPDF checks the machine-checkable rules of PDF/UA: tags, structure, alt\ntext present, fonts, metadata. Whether alt text or reading order make sense\nstill needs a person.\n\nInput: `pdf_base64` is the PDF as base64, at most 4 MB decoded; or pass the\nfile as a download link in `file`. `profile` is \"ua1\" or \"ua2\".\n\nReturns `compliant` (true or false), `profile_name`, `statement`,\n`passed_rules`, `failed_rules` and `top_failed_rules`: up to 10 failed rules\nwith their `id` (clause and test number), `specification`, `description` and\n`failed_checks`. A file that is not a PDF fails with `not_a_pdf`; an\nunavailable veraPDF with `engine_unavailable`. For the full report, use the\nREST API (`POST /v1/verapdf/api/validate/ua1`).\n\nCredits: 10 per call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file": {
                "default": null,
                "description": "The file as a download link, instead of `pdf_base64`. In ChatGPT, pass the user's uploaded file here. Other clients can set `download_url` to a public https URL.",
                "properties": {
                  "download_url": {
                    "description": "A public https URL of the file.",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "An identifier for the file. ChatGPT sets it; other clients may pass any label, such as the file name.",
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "pdf_base64": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The PDF, base64-encoded. At most 4 MB decoded."
              },
              "profile": {
                "default": "ua1",
                "description": "\"ua1\" (the default) checks against PDF/UA-1 (ISO 14289-1), \"ua2\" against PDF/UA-2 (ISO 14289-2).",
                "enum": ["ua1", "ua2"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a PDF's accessibility against PDF/UA"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "openai/fileParams": ["file"],
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:12c13db1b8936787faf82052dd4f12543b2785fc809e7ca4dc280beba8b23c6c"
        },
        {
          "name": "validate_pdfa",
          "title": "Validate a PDF against PDF/A",
          "description": "Check whether a PDF conforms to PDF/A, the ISO archiving standard, with veraPDF.\n\nInput: `pdf_base64` is the PDF as base64, at most 4 MB decoded; or pass the\nfile as a download link in `file`. `profile` picks the PDF/A part and level.\n\nReturns `compliant` (true or false), `profile_name` (the profile veraPDF\nused), `statement`, `passed_rules`, `failed_rules` and `top_failed_rules`:\nup to 10 failed rules with their `id` (clause and test number),\n`specification`, `description` and `failed_checks`. A file that is not a PDF\nfails with `not_a_pdf`; an unavailable veraPDF with `engine_unavailable`.\nFor the full report in JSON, XML or HTML, use the REST API\n(`POST /v1/verapdf/api/validate/{profile}`).\n\nCredits: 2 per call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file": {
                "default": null,
                "description": "The file as a download link, instead of `pdf_base64`. In ChatGPT, pass the user's uploaded file here. Other clients can set `download_url` to a public https URL.",
                "properties": {
                  "download_url": {
                    "description": "A public https URL of the file.",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "An identifier for the file. ChatGPT sets it; other clients may pass any label, such as the file name.",
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "pdf_base64": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The PDF, base64-encoded. At most 4 MB decoded."
              },
              "profile": {
                "default": "auto",
                "description": "The PDF/A part and level, such as \"2b\" or \"3a\". \"auto\" (the default) checks against the part the file declares, and against PDF/A-1b when it declares none.",
                "enum": ["auto", "1a", "1b", "2a", "2b", "2u", "3a", "3b", "3u", "4", "4e", "4f"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Validate a PDF against PDF/A"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "openai/fileParams": ["file"],
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:de979ef6a71b4e212619e08d75add980c84888ac2f384b2d8e2a6fb2acf5874a"
        }
      ],
      "digest": "sha256:ab939f5f83bc6dd8c7763da415f50fc81ad50acabf9894a1f75f27e69a68d364"
    }
  }
