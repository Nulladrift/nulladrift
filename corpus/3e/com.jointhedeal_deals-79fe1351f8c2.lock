      "serverInfo": {
        "name": "jointhedeal",
        "title": "JoinTheDeal",
        "version": "1.5.0",
        "websiteUrl": "https://jointhedeal.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "JoinTheDeal (jointhedeal.com, C2P HEALTH) turns shared demand into group prices for Southern California households, especially Korean-American families. Driven by people: shoppers request a product, back it with a small refundable deposit, and when enough are waiting JoinTheDeal asks the seller for a group price. Use it after you find the public lowest price elsewhere.\n1) Call search_deals (or search_requests) for the item. If a group_deal matches (sold by JoinTheDeal): tell the user the group price, goal, joined, the deal window (starts/ends) and the payment terms exactly as given (payment_short, deposit_text). If public_low_* fields exist, quote that price, seller and checked_at as JoinTheDeal's own check. Southern California delivery only; sales tax extra.\n2) If only a requested item matches: say how many are waiting and how many paid a deposit, that it has no price yet and is not a promise, and give join_url or deposit_url.\n3) If nothing matches (jtd_match=false), give request_url so the user can start a request.\ndeal_finder items are other sellers' offers, for comparison only (not sold by JoinTheDeal): price as shown on the seller site at checked_at; tell the user to confirm there. seller_ref_price_text/seller_pct_off are the seller's own claims. deal_grade is JoinTheDeal's opinion, not a guarantee.\nNever invent or calculate prices, savings, discounts, counts or deadlines. Quote fields as given. Never collect names, emails or phone numbers in chat.",
      "tools": [
        {
          "name": "get_deal",
          "title": "Get one deal",
          "description": "Full details of one deal by its id (from search_deals). Group deals include goal, joined (paid participants), deal window, what is included, region, payment terms (payment_short, deposit_text) and JoinTheDeal's own public-low price check when available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Deal id from search_deals.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one deal"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:534ab49e77e45eabd1aeab8272c45592cee89833a283486de56f57da7b9da7a8"
        },
        {
          "name": "list_categories",
          "title": "List categories and sellers",
          "description": "Categories and sellers that currently have deals, with counts, and when the data was last updated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories and sellers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:80cc866d71a5c7d8587fca2f4a653aebafb40f987a006dcac6ad887c28ef56c6"
        },
        {
          "name": "request_group_deal",
          "title": "Request a group deal",
          "description": "Get the link to JoinTheDeal's request form for a product the user wants, and see first whether the same item is already requested or on sale as a group deal (then the user should join that instead). This tool does not submit anything and takes no personal information: the user opens the link and fills in the form themselves. When enough people back the same item with a refundable deposit, JoinTheDeal asks the seller for a group price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "item": {
                "description": "Product name the user wants (optional). Do not include names, emails or phone numbers.",
                "maxLength": 200,
                "type": "string"
              },
              "model": {
                "description": "Model number if known (optional).",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Request a group deal"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c22597ccdbc57814ee7aff96ddfdf50e09659d3b2dfaa96ae2027a2a0ed31bea"
        },
        {
          "name": "search_deals",
          "title": "Search deals",
          "description": "Search JoinTheDeal: group deals sold by JoinTheDeal (with goal, joined count, deal window, payment terms), requested deals (people gathering, no price yet) and Deal Finder offers from other sellers (comparison reference only). Results come in that order. Filter by keywords, category, event, seller and price range. If nothing of JoinTheDeal matches (jtd_match=false) the response carries request_url for the user to start a request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category or subcategory name or part of it (see list_categories), e.g. \"Korean grocery\", \"Fishing\", \"Robot vacuums\".",
                "maxLength": 80,
                "type": "string"
              },
              "deal_type": {
                "default": "all",
                "description": "group_deal = sold by JoinTheDeal; requested = people gathering for an item (no price yet); deal_finder = sold by another seller (comparison only).",
                "enum": ["all", "group_deal", "requested", "deal_finder"],
                "type": "string"
              },
              "event": {
                "description": "Event tag, e.g. \"black-friday-2026\" (deals the seller itself labels Black Friday / Cyber Monday). See list_categories events.",
                "maxLength": 40,
                "type": "string"
              },
              "include_expired": {
                "default": false,
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in USD.",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Minimum price in USD. Offers without a single dollar price (e.g. \"Up to $800 off\") are left out when a price filter is used.",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Keywords, e.g. \"rice cooker\", \"air purifier\", \"mattress queen\". All words must match.",
                "maxLength": 200,
                "type": "string"
              },
              "seller": {
                "description": "Seller name or part of it, e.g. \"CUCKOO\", \"LG\", \"H Mart\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search deals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b97e019b573b978197ec59a4ad5933261a72cbe771926919f5395162198c3aba"
        },
        {
          "name": "search_requests",
          "title": "Search requested deals",
          "description": "Requested deals: items shoppers asked JoinTheDeal to make a group deal for. Shows how many are waiting, how many paid a refundable deposit, the deposit goal and deadline, and the stage (requested / checking = asking the seller / open / closed). No price until a deal opens. No personal data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug or name part, e.g. kitchen, grocery, beauty, electronics, baby, pets.",
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords; all words must match the item name.",
                "maxLength": 200,
                "type": "string"
              },
              "stage": {
                "default": "active",
                "description": "active = requested + checking + open (default).",
                "enum": ["active", "requested", "checking", "open", "closed", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search requested deals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c45ee09fb6e6c214223041830d34cc3b7516a7c65c5fd3e2dc4beb6f08ad05d"
        }
      ],
