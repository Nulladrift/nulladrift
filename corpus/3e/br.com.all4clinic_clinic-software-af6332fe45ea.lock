      },
      "transport": {
        "type": "http",
        "url": "https://api.all4clinic.com.br/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "All4Clinic",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "    All4Clinic is practice management software for medical and aesthetic clinics in Brazil (scheduling, patient\n    records, quotes, finance, inventory, team and WhatsApp). Content is in Brazilian Portuguese; answer in the\n    person's language. Use search_help (then read_help_article) for \"how do I ... in All4Clinic\" questions and quote\n    the guide's link. When the result includes panel_url, give that link so the person opens the screen in the clinic app. Use list_plans for prices and what each plan includes (pass users and units to get the cheapest plan that fits). Use list_help_topics for \"what can it do / does it have X\" (guides by area) and get_signup_info for the trial and how to start. Use get_faq for buyer questions (LGPD and security, apps, several units, migration, support, digital signature, what the AI does). Use find_meeting_times when the person\n    asks for a product presentation or a team training session, and give them the link of the time they choose:\n    they confirm it on the page with their name, e-mail and WhatsApp. This connector never reads clinic or patient\n    data; never ask for patient details, passwords or card numbers in the chat.",
      "tools": [
        {
          "name": "find_meeting_times",
          "title": "Find times for a presentation or training",
          "description": "Find open times (Brasília time) for an online All4Clinic product presentation (\"apresentacao\", for clinics evaluating the system) or a team training session (\"treinamento\", for clinics already using it). Each time comes with a booking_url that opens the booking page with that day and time chosen; the person confirms there with their name, e-mail and WhatsApp. Nothing is booked by this tool.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "First day to look at, YYYY-MM-DD. Defaults to the next available day.",
                "type": "string"
              },
              "type": {
                "description": "\"apresentacao\" = product presentation for a clinic evaluating All4Clinic; \"treinamento\" = training for the team of a clinic that already uses it.",
                "enum": ["apresentacao", "treinamento"],
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find times for a presentation or training"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df1e3f3054335ba4649ee3bbc811122bbb7ee34df72cfc30f54a1f0c668d1cdb"
        },
        {
          "name": "get_faq",
          "title": "Answer buyer questions: security, LGPD, apps, migration, support",
          "description": "Answers from the All4Clinic website for the questions a clinic asks before buying: LGPD and data security, permissions and audit trail, several units and professionals, mobile and Windows apps, digital signature validity, how patients pay, what the AI does and does not do, migrating from another system and support. Optional query filters the answers (Portuguese or English keywords); without it returns all of them. For how-to steps inside the product use search_help.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Optional keywords, e.g. \"LGPD\", \"aplicativo\", \"migrar\", \"suporte\", \"unidades\". Empty returns every answer.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Answer buyer questions: security, LGPD, apps, migration, support"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9471c71f4c66fc271e3b26daa90b2b425c9e3532dd0a0770f957601b3cdcc523"
        },
        {
          "name": "get_signup_info",
          "title": "How to start using All4Clinic",
          "description": "How a clinic starts with All4Clinic: free trial length, where to create the account (link with the chosen plan when given) and, once the account exists, the path to the first appointment step by step (first patient, first appointment, clinic phone, professionals' working hours, team, WhatsApp), each with where it is in the system and its guide link. Working hours do not hide free slots on the agenda. Use it also for \"I created the account, now what?\". Creates nothing: the person signs up and does each step in the system.",
          "inputSchema": {
            "properties": {
              "plan": {
                "description": "Optional plan key from list_plans, to get the sign-up link already on that plan.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to start using All4Clinic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0492244e3bd17d53d8be2283716f99c64839534d92780475160f3d995efc1b0d"
        },
        {
          "name": "list_help_topics",
          "title": "Browse what All4Clinic does, by area",
          "description": "List every help-center guide grouped by area of the system (agenda, patients, medical records, finance, inventory, WhatsApp, fiscal, telemedicine...). Use it for \"what can All4Clinic do?\", \"does it have X?\" or to pick the right guide before read_help_article. Pass a section to see only its guides.",
          "inputSchema": {
            "properties": {
              "section": {
                "description": "Optional area slug from a previous call, e.g. \"agenda\", \"financeiro\", \"prontuario\", \"whatsapp\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse what All4Clinic does, by area"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fbf72193cf064f86af86968a099ca3bd9684c7d133515688736a9236e4c72bb7"
        },
        {
          "name": "list_plans",
          "title": "List plans and prices",
          "description": "List the All4Clinic subscription plans on sale: monthly price in BRL, highlights, what each plan includes and the link to sign up for it. Pass users and/or units (how many people use the system, how many branches) to get the cheapest plan that fits in 'recommended_plan'.",
          "inputSchema": {
            "properties": {
              "units": {
                "description": "How many clinic branches. Optional.",
                "type": "integer"
              },
              "users": {
                "description": "How many people will log in (doctors, reception, staff). Optional.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List plans and prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:346ffdbab17ae47c1f614104577decdbc3cca3f567872f62dfa0c509d3c5fff3"
        },
        {
          "name": "read_help_article",
          "title": "Read a help guide",
          "description": "Read the full text of one All4Clinic help guide, given its link from search_help (e.g. https://ajuda.all4clinic.com.br/agenda/agendar). When the guide names the screen, the response includes panel_url: the link to open that screen in the clinic app.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The guide link returned by search_help.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a help guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b222c0ed8fac762b5116f9c5f1a55a334e58cbc3c77848c7302490c1da553c5"
        },
        {
          "name": "search_help",
          "title": "Search the All4Clinic help center",
          "description": "Search the All4Clinic help center (step-by-step guides in Brazilian Portuguese; English keywords like 'appointment' or 'inventory' work too) for how to do something in the system: scheduling, patients, medical records, quotes, finance, inventory, team, WhatsApp. Returns up to 3 guides with title, link and the most relevant passage. When a result includes panel_url, that is the screen in the clinic app (https://dash.all4clinic.com.br) where the person does the task: give them that link. Use read_help_article for the full guide.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What the person wants to do, in Portuguese or English keywords, e.g. \"repetir agendamento\", \"cadastrar kit no estoque\", \"assinatura digital\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the All4Clinic help center"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab09163ad67c4195bfb69589f9fedafb8f730eea264b7458b1d22b297564dbb0"
        }
      ],
      "digest": "sha256:e202b180a8e39b22e239d042fb6785d09c9eebba1bb2fa84ead79d956363bc78"
    }
  }
