      "tools": [
        {
          "name": "book_delivery",
          "title": "Book a delivery",
          "description": "Book a $2.99 robot delivery from a registered store in one call. Send store_id, dropoff_address and dropoff_phone; order_ref is the store's own order number (required at an open store); ready_at starts the 2-hour promise and defaults to now. The answer is yes or no now: a decline carries retry_after_seconds and a capacity.available webhook follows when capacity frees. A live key holds the posted price from the organization's Wallet; a test key creates a simulated robot delivery.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["store_id"]
              },
              {
                "required": ["pickup_address"]
              }
            ],
            "properties": {
              "declared_value_cents": {
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "dropoff_address": {
                "maxLength": 400,
                "minLength": 1,
                "pattern": "\\S",
                "type": "string"
              },
              "dropoff_phone": {
                "maxLength": 25,
                "minLength": 7,
                "pattern": "^(?=(?:\\D*\\d){7,15}\\D*$)\\+?[0-9()\\-.\\s]+$",
                "type": "string"
              },
              "idempotency_key": {
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "merchant_order_reference": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {
                  "maxLength": 500,
                  "type": "string"
                },
                "maxProperties": 20,
                "propertyNames": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "order_ref": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "parcel": {
                "additionalProperties": false,
                "properties": {
                  "height_in": {
                    "exclusiveMinimum": 0,
                    "maximum": 200,
                    "type": "number"
                  },
                  "length_in": {
                    "exclusiveMinimum": 0,
                    "maximum": 200,
                    "type": "number"
                  },
                  "weight_lb": {
                    "exclusiveMinimum": 0,
                    "maximum": 1000,
                    "type": "number"
                  },
                  "width_in": {
                    "exclusiveMinimum": 0,
                    "maximum": 200,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "pickup_address": {
                "maxLength": 400,
                "minLength": 1,
                "pattern": "\\S",
                "type": "string"
              },
              "pickup_name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "pickup_phone": {
                "maxLength": 25,
                "minLength": 7,
                "pattern": "^(?=(?:\\D*\\d){7,15}\\D*$)\\+?[0-9()\\-.\\s]+$",
                "type": "string"
              },
              "ready_at": {
                "format": "date-time",
                "type": "string"
              },
              "robomart_version": {
                "enum": ["2026-09-04", "2026-09-06", "2026-10-06"],
                "type": "string"
              },
              "store_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["dropoff_address", "dropoff_phone", "idempotency_key"],
            "type": "object"
          },
