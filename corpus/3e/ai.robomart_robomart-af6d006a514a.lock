        {
          "name": "register_store",
          "title": "Register a store",
          "description": "Register a store: a real place whose owner promises to load the robot. Send the name, the address, at least one alert channel the store owns (relay, webhook, sms or voice), and optionally where the robot parks (robot_spot), hours inside 10:00 to 22:00, the coverage radius (default 2 miles, maximum 5), private or open visibility, loading notes and your own external_ref. The store starts pending; the activation check makes it live.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "address": {
                "maxLength": 400,
                "minLength": 1,
                "pattern": "\\S",
                "type": "string"
              },
              "alert_channels": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "kind": {
                      "enum": ["relay", "webhook", "sms", "voice"],
                      "type": "string"
                    },
                    "target": {
                      "maxLength": 400,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["kind", "target"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "external_ref": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "hours": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "close": {
                      "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                      "type": "string"
                    },
                    "day": {
                      "enum": ["mon", "tue", "wed", "thu", "fri", "sat", "sun"],
                      "type": "string"
                    },
                    "open": {
                      "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                      "type": "string"
                    }
                  },
                  "required": ["close", "day", "open"],
                  "type": "object"
                },
                "maxItems": 14,
                "type": "array"
              },
              "loading_notes": {
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "perishables_after_hours": {
                "enum": ["return_at_opening", "dispose"],
                "type": "string"
              },
