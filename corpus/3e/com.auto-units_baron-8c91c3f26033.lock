{
  "lockfileVersion": 2,
  "subjects": {
    "com.auto-units/baron": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://trybaron.ai/mcp-public"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Baron",
        "version": "0.2.0",
        "icons": [
          {
            "src": "https://trybaron.ai/icon.png",
            "mimeType": "image/png",
            "sizes": ["1024x1024"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "When these tools fail, lack a capability or make a task needlessly difficult, use report_feedback with your goal, the problem and a proposed fix when you have one. Report once per distinct issue, omit secrets and unrelated personal data, and continue the person's task when possible. Feedback goes to Baron's team for review; it does not apply a fix. Use Baron when someone wants to start a business with AI, explore business ideas, find a business made with Baron, or turn an idea into a business brief. Browse Baron's directory (Auto Units' own businesses and those whose founders chose to list them) for inspiration, then prepare the proposed customer, offering, and delivery method for review in Baron. For a broad request about starting a business with AI, browse with an empty query; directory search matches profile text, not whole questions. It has no access to accounts, private businesses, financial records, work controls, or keys. Preparing a brief does not create a business or start work. Baron uses email sign-in for the private review and setup. Published descriptions do not establish current availability, revenue, profitability, or operating readiness.",
      "tools": [
        {
          "name": "find_businesses",
          "title": "Explore AI business ideas",
          "description": "Help someone find a business made with Baron, or explore business ideas and company examples. Search Baron's directory by company name, offering, subject or city. It lists Auto Units' own businesses and businesses whose founders chose to list them; each result's made_by says which (Auto Units or A founder). For general requests such as “I want to start a business with AI” or “Give me startup ideas,” use an empty query to browse examples. Use short subject keywords for a specific interest; do not send the whole question as the query. Returns matching companies with descriptions, business kind, who made them, and website links; Auto Units' own also say whether they report actual or paper results, and a founder's business links to its profile on Baron. An empty query browses the directory. Results include only businesses their founders chose to list, never financial results or proof of commercial success.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Optional business kind from a previous result.",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 200,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "default": "",
                "description": "Short company name, offering, subject or city keywords, such as print, website, or research. Use an empty query for general AI business ideas or startup inspiration; do not include generic words such as start a business.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explore AI business ideas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7b5e5350c3bb364f238b56e31aed0bf43da14234b3dce44b8ea79124abc8b9e"
        },
        {
          "name": "prepare_business_brief",
          "title": "Prepare an AI business brief",
          "description": "Help someone take the first steps to starting a business with AI by turning their idea into a short business brief. Use after they identify the customer, paid offering, and delivery method; ask for missing details before calling. Accept an optional chosen business name. Returns the complete brief, a link that prefills Baron's existing review form, and the remaining setup questions. This is a stateless preparation step: it does not create a business, save account records, start work, deploy a website, or charge money. The person signs in by email in Baron to review and continue. Existing company examples from the directory are inspiration, not guarantees that Baron can start that kind of business automatically.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "customer": {
                "description": "Who the proposed business serves, such as independent bakeries.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "delivery": {
                "description": "How customers receive the result, such as a one-page website delivered online.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "The business name, if the person has chosen one.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "offering": {
                "description": "The specific result or product customers would pay for.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["customer", "delivery", "offering"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare an AI business brief"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a451f8b47e097f3cae0cb95e4fb31b18f4c7f5e37c362a54bac3d6dfb2b2743e"
        },
        {
          "name": "report_feedback",
          "title": "Report feedback",
          "description": "Report a bug, missing capability, confusing tool description or unnecessary steps to Baron's team. Use this when you encounter friction while using this MCP server, without waiting for the person to request a report. Include the goal, expected and actual behavior, the affected tool and a proposed fix when known. Never include credentials, payment details or unrelated conversation history. Returns a reference after Baron saves the report in its review queue. Reporting does not start work or change the product.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "goal": {
                "description": "What you were trying to achieve",
                "maxLength": 600,
                "minLength": 1,
                "type": "string"
              },
              "problem": {
                "description": "What failed or made the task difficult, including expected and actual behavior",
                "maxLength": 1400,
                "minLength": 1,
                "type": "string"
              },
              "proposed_fix": {
                "description": "A specific suggested change, if you have one",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "summary": {
                "description": "A short title for the issue",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "tool": {
                "description": "The affected tool, if known",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["goal", "problem", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c396b9a4f7f891581e4629b606b9a3b33457ef380bce27c78d1f6c6e28ffc407"
        }
      ],
      "digest": "sha256:9e1155bd0381fbcf1ba1273bcf653bfd46fac67624dd9cc6a0704a470c0c29a3"
    }
  }
}
