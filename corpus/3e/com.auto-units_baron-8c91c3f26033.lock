{
  "lockfileVersion": 2,
  "subjects": {
    "com.auto-units/baron": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://trybaron.ai/mcp-public"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Baron",
        "version": "0.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use Baron when someone wants to start a business with AI, explore business ideas, or turn an idea into a business brief. Browse published Auto Units businesses for inspiration, then prepare the proposed customer, offering, and delivery method for review in Baron. For a broad request about starting a business with AI, browse with an empty query; directory search matches profile text, not whole questions. It has no access to accounts, private businesses, financial records, work controls, or keys. Preparing a brief does not create a business or start work. Baron uses email sign-in for the private review and setup. Published descriptions do not establish current availability, revenue, profitability, or operating readiness.",
      "tools": [
        {
          "name": "find_businesses",
          "title": "Explore AI business ideas",
          "description": "Help someone who wants to start a business with AI explore business ideas and company examples. Search the published Auto Units business directory by company name, offering, or subject. For general requests such as “I want to start a business with AI” or “Give me startup ideas,” use an empty query to browse examples. Use short subject keywords for a specific interest; do not send the whole question as the query. Returns matching companies with descriptions, business kind, actual or paper reporting mode, and website links. An empty query browses the directory. Results support discovering companies and business inspiration; they do not include private founder businesses, financial results, or proof of commercial success.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Optional business kind from a previous result.",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 200,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "default": "",
                "description": "Short company name, offering, or subject keywords, such as print, website, or research. Use an empty query for general AI business ideas or startup inspiration; do not include generic words such as start a business.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explore AI business ideas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a03b04aa8e6ef214a906713cbb3df2e79cb68e7376c90afbeaf0b5b677f72de"
        },
        {
          "name": "prepare_business_brief",
          "title": "Prepare an AI business brief",
          "description": "Help someone take the first steps to starting a business with AI by turning their idea into a short business brief. Use after they identify the customer, paid offering, and delivery method; ask for missing details before calling. Accept an optional chosen business name. Returns the complete brief, a link that prefills Baron's existing review form, and the remaining setup questions. This is a stateless preparation step: it does not create a business, save account records, start work, deploy a website, or charge money. The person signs in by email in Baron to review and continue. Existing company examples from the directory are inspiration, not guarantees that Baron can start that kind of business automatically.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "customer": {
                "description": "Who the proposed business serves, such as independent bakeries.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "delivery": {
                "description": "How customers receive the result, such as a one-page website delivered online.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "The business name, if the person has chosen one.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "offering": {
                "description": "The specific result or product customers would pay for.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["customer", "delivery", "offering"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare an AI business brief"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a451f8b47e097f3cae0cb95e4fb31b18f4c7f5e37c362a54bac3d6dfb2b2743e"
        }
      ],
      "digest": "sha256:732dd067c79339bcde4908f31ec4b1c17b0dbcb23e8361005b08adde2f0075bc"
    }
  }
}
