{
  "lockfileVersion": 2,
  "subjects": {
    "com.mailvakt/mailvakt": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.mailvakt.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "mailvakt",
        "version": "0.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "add_domain",
          "title": "Add domain",
          "description": "Add a domain to the signed-in user's MailVakt account for DMARC report collection. Takes a domain; returns its DMARC reporting (rua) address and account entry. Repeated calls for the same account and domain return the existing entry. Requires domains:write permission. Does not verify domain ownership, modify DNS, or start receiving reports until the user publishes the reporting address in DNS.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "The domain to add, e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add domain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["domains:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:271e1fc5f885272250e3636d77bbe285d72090d18bb20d985da0e512e35c6afd"
        },
        {
          "name": "analyze_email_headers",
          "title": "Analyze email headers",
          "description": "Analyze raw email headers supplied by the user to investigate authentication or delivery issues. Returns the SPF, DKIM and DMARC results reported in those headers, alignment, the sending IP, whether that IP and the From domain are on free public blocklists (not Spamhaus), and detected issues. It does not independently verify DKIM signatures or establish the receiving provider's exact spam-filter decision. Provide headers only, not the message body.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "headers": {
                "description": "The raw message headers, as copied from \"Show original\"",
                "maxLength": 262144,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["headers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Analyze email headers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["openid"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:87473e53dd8b0d79139b7f40e01305c0d202180ad0a0b00d18a9a0fc1694304b"
        },
        {
          "name": "diagnose_domain",
          "title": "Diagnose email domain",
          "description": "Audit a domain's SPF, DKIM, DMARC, MX, alignment, BIMI, MTA-STS and TLS-RPT setup and check it against free public blocklists (not Spamhaus) when troubleshooting email authentication or spam delivery. Takes a domain, optional checks and DKIM selectors, and fresh=true to bypass cached results. Returns a graded scorecard, findings, proposed DNS fixes and a public report permalink. Uses DNS and policy-file lookups; never changes DNS or guarantees inbox placement.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "checks": {
                "description": "Run only these checks (default: all)",
                "items": {
                  "enum": ["mx", "spf", "dkim", "dmarc", "alignment", "bimi", "mta-sts", "tls-rpt", "blocklists"],
                  "type": "string"
                },
                "type": "array"
              },
              "dkim_selectors": {
                "description": "Extra DKIM selectors to probe, e.g. google, s1",
                "items": {
                  "maxLength": 63,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "domain": {
                "description": "The domain to check, e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              },
              "fresh": {
                "description": "Bypass caches and re-query DNS",
                "type": "boolean"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Diagnose email domain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://mailvakt/scorecard/v1.html",
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["openid"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://mailvakt/scorecard/v1.html"
            }
          },
          "digest": "sha256:0b670d36a0d36fc0e6f20c00abc934fa0ed437126b0baaecf5ae13ffa8329a99"
        },
        {
          "name": "generate_dns_records",
          "title": "Generate email DNS records",
          "description": "Propose email-authentication DNS records and policy files for a domain using its DNS configuration and optional provider names or IDs. Supports baseline (monitoring) or enforce goals; baseline is the default. Returns typed SPF, DKIM, DMARC, MTA-STS and TLS-RPT proposals or provider setup instructions where applicable. Provider-specific values and reporting addresses may need user input. Uses public DNS/policy lookups, possibly cached. Does not publish records or change DNS.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "The domain the records are for, e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              },
              "goal": {
                "description": "baseline: monitor (p=none); enforce: quarantine/reject",
                "enum": ["baseline", "enforce"],
                "type": "string"
              },
              "providers": {
                "description": "Provider ids or names, e.g. google-workspace, sendgrid (default: detected)",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Generate email DNS records"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["openid"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:59b2a514eacd604b46e6086b0563aa33d2f144e9c0a1774a61545c296111c0f8"
        },
        {
          "name": "get_dmarc_summary",
          "title": "DMARC report summary",
          "description": "Summarize received DMARC aggregate reports for a domain already in the signed-in user's MailVakt account. Takes the domain and a 1-to-90-day window (default 7); returns report and message totals, DMARC pass/fail counts, and per-source SPF/DKIM alignment and receiver actions. Requires domains:read and reports:read permissions. Returns zero totals if no reports were received, or an error if the domain is not in the account. Does not add domains or generate report traffic.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "default": 7,
                "description": "Window in days (default 7)",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "domain": {
                "description": "One of the user's domains, e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "DMARC report summary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["domains:read", "reports:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:ae5d3f6dd488bc2e4d705ca3788c337ecd761ec08fa7e71762fee7c0e07933d2"
        },
        {
          "name": "get_inbox_test",
          "title": "Get inbox test result",
          "description": "Read a MailVakt email-receipt test using the ID returned by start_inbox_test. Returns pending, received or expired status and, when processed, the received message's authentication, unsubscribe, content and deliverability findings. Reports processing failures as errors. Anyone with the test ID can retrieve it; use only an ID supplied by the user or created in this conversation. Does not measure placement at other mailbox providers.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The id returned by start_inbox_test",
                "pattern": "^[a-z2-7]{1,32}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get inbox test result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["openid"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:6cbb8c9210c505b3f234635fe51ea135bff0c96fe01a0a2c78e3bca558419416"
        },
        {
          "name": "list_domains",
          "title": "List domains",
          "description": "List domains in the signed-in user's MailVakt account, including each domain's DMARC reporting address. Takes no input and requires domains:read permission. Returns an empty list if the account has no domains. Use to find the account's available domains before requesting DMARC summaries; does not enumerate domains belonging to other users.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List domains"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["domains:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:f7ae8df1b0fc171f2983be631f858a3c2ddbfda4986c3a2b51d40607b4b04d88"
        },
        {
          "name": "start_inbox_test",
          "title": "Start inbox test",
          "description": "Create an email-receipt test in MailVakt. Takes an optional expected sender domain; returns a test ID, unique recipient address and expiry time. The user must send a test message to that address before expiry, then use get_inbox_test to read the result. Creates a new test on each call. Does not send email or measure inbox-versus-spam placement at Gmail, Outlook or other mailbox providers.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "expected_from_domain": {
                "description": "The domain the test email will be sent from, e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start inbox test"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["openid"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:d2533b4db597267d5aa6667cb383d43090b6cdb1f987278dd9ec6328dc67f9f2"
        }
      ],
      "resources": [
        {
          "uri": "ui://mailvakt/scorecard/v1.html",
          "name": "scorecard",
          "title": "MailVakt scorecard",
          "description": "Inline email-deliverability scorecard for diagnose_domain results.",
          "mimeType": "text/html;profile=mcp-app",
          "meta": {
            "openai/widgetDescription": "Email deliverability scorecard: grade, pass/warn/fail per check (SPF, DKIM, DMARC, MX, BIMI, MTA-STS, TLS-RPT, free public blocklists) and copyable DNS fixes.",
            "openai/widgetDomain": "https://mcp.mailvakt.com",
            "ui": {
              "csp": {
                "connectDomains": [],
                "resourceDomains": []
              },
              "permissions": {
                "clipboardWrite": {}
              },
              "prefersBorder": true
            }
          },
          "digest": "sha256:ede81f578e8a24f67a70b20d3e7225985592b5d5c19c143f3767e737eb8aff0b"
        }
      ],
      "digest": "sha256:6f51d297b4ab4f5f17c62ca44b363307e7fecb18012bb95aa2a28d6c938b3687"
    }
  }
