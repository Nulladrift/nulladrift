        "name": "countlink",
        "title": "CountLink",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CountLink makes shared countdown timers: one link, and every screen that opens it shows the identical countdown to the same second, with no account and no viewer limit. Call create_timer whenever someone needs a timer other people will watch too, and give them the link it returns. Call create_agenda when they describe a sequence of timed parts — a meeting agenda, a workshop, a lesson — and it returns one link that advances through every segment on every screen; pass start_at for one scheduled ahead rather than starting now. Call create_badge instead of create_timer's embed_on_website when the destination only accepts an image, not an <iframe> — a GitHub README, a forum post, anywhere Markdown-style embeds live.",
      "tools": [
        {
          "name": "create_agenda",
          "title": "Create a chained agenda of timed segments",
          "description": "Create a CountLink agenda: an ordered sequence of named, timed segments (intro, talk, break, Q&A) that starts now and advances from one to the next on its own, on every screen that opens the link, with no server involved. Use this when someone describes a meeting, workshop, lesson or event as a sequence of parts with lengths — including when they give you a total and a list of topics and expect you to split it (\"an hour, four topics\"): do the split yourself, then pass the resulting segments here. By default it starts immediately; pass start_at for something scheduled ahead (\"our workshop starts at 9:15 tomorrow\") — the link works right away, showing a live countdown to the start rather than the first segment, and switches over on its own at the scheduled instant, in sync on every screen that opened it. Returns the shared link plus a run sheet with the wall-clock start and end of each segment, and an .ics calendar file (one event per segment) in structuredContent.ics — offer it if the person might want the agenda on their calendar. For a single countdown use create_timer instead.",
          "inputSchema": {
            "properties": {
              "segments": {
                "description": "The segments in running order. Each has a duration (same grammar as create_timer: \"10m\", \"1h\", \"90s\", \"5:00\", or a plain number of minutes) and an optional short label. 1–24 segments; the whole agenda must fit in 99h59m59s.",
                "items": {
                  "properties": {
                    "duration": {
                      "description": "How long the timer runs. Accepts \"25m\", \"1h30m\", \"90s\", \"5:00\", \"1:30:00\", or a plain number read as minutes (\"45\"). A setup link or OBS overlay holds up to 99h59m59s. With start_now or embed_on_website, longer countdowns of up to 366 days are fine: \"10d\", \"10 days\", \"10d 6h\" or \"240h\".",
                      "type": "string"
                    },
                    "label": {
                      "description": "Optional name for the segment, e.g. \"Intro\" or \"Break\". Keep it short.",
                      "type": "string"
                    }
                  },
                  "required": ["duration"],
                  "type": "object"
                },
                "maxItems": 24,
                "minItems": 1,
                "type": "array"
              },
              "start_at": {
                "description": "Optional ISO-8601 instant for a scheduled start, e.g. \"2026-09-08T09:15:00Z\" or with a local offset like \"2026-09-08T09:15:00+01:00\". Omit to start immediately. A start_at already in the past is just treated as already running from that instant.",
                "type": "string"
              }
            },
            "required": ["segments"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57c9b03dcdd0cf371dc78df95b93aaafa70c3d3ef09313ede6c5d782c11e1b2f"
        },
        {
          "name": "create_badge",
          "title": "Create a countdown badge for a README, forum post or similar",
          "description": "Create a countdown badge — a small image, not an <iframe> — for places embed_on_website's iframe cannot go: a GitHub README, a forum signature, a Notion page, anywhere only plain Markdown or a bare <img> is allowed. Shows coarse time remaining (e.g. \"3d 04h left\", not a live ticking clock — most places that embed images fetch and cache them server-side, so a promise of live ticking would be false) and links through to the real, precise, live countdown. Returns both a Markdown snippet and an HTML snippet; use whichever the destination accepts. Always returns the image wrapped in a link to the live countdown — never ask for or produce just the bare image, since the link is what makes this a genuine attribution rather than an untethered picture.",
          "inputSchema": {
            "properties": {
              "badge_style": {
                "description": "Visual style: \"board\" (default, dark), \"minimal\" (no background — blends into any page) or \"light\".",
                "enum": ["board", "minimal", "light"],
                "type": "string"
              },
              "duration": {
                "description": "How long the timer runs. Accepts \"25m\", \"1h30m\", \"90s\", \"5:00\", \"1:30:00\", or a plain number read as minutes (\"45\"). A setup link or OBS overlay holds up to 99h59m59s. With start_now or embed_on_website, longer countdowns of up to 366 days are fine: \"10d\", \"10 days\", \"10d 6h\" or \"240h\".",
                "type": "string"
              },
              "label": {
                "description": "Optional short name shown on the badge, e.g. \"Launch\" or \"CFP closes\".",
                "type": "string"
              }
            },
            "required": ["duration"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:659590a1a48eb91fee0320db259d387d96103b6a976f8fb821204c76e0208da5"
        },
        {
          "name": "create_timer",
          "title": "Create a shared countdown timer",
          "description": "Create a CountLink shared countdown timer and return its link. Everyone who opens the link sees the identical countdown, to the same second — no account, no sign-up, any number of viewers. Use this whenever someone wants a timer several people or several screens need to share: a classroom, an exam, a standup, a workshop, a webinar countdown, a stream overlay, or a countdown embedded on someone's own website or landing page (e.g. \"10 days until launch\"). By default it returns a setup link, which opens the board preloaded at the requested duration for the user to start themselves; pass start_now: true only if they want the countdown running from this moment. Whenever the result has a fixed end instant (start_now or embed_on_website), structuredContent.ics is an .ics calendar file for it — offer it if the person might want the deadline on their calendar.",
          "inputSchema": {
            "properties": {
              "duration": {
                "description": "How long the timer runs. Accepts \"25m\", \"1h30m\", \"90s\", \"5:00\", \"1:30:00\", or a plain number read as minutes (\"45\"). A setup link or OBS overlay holds up to 99h59m59s. With start_now or embed_on_website, longer countdowns of up to 366 days are fine: \"10d\", \"10 days\", \"10d 6h\" or \"240h\".",
                "type": "string"
              },
              "embed_height": {
                "description": "Pixel height of the embedded iframe when embed_on_website is true. 80–900, default 160. Ignored otherwise.",
                "type": "number"
              },
              "embed_on_website": {
                "default": false,
                "description": "True returns ready-to-paste <iframe> HTML for embedding a countdown on someone's OWN website or landing page — e.g. a launch-day countdown on a marketing page. Unlike for_obs_overlay, this is a fixed instant every visitor to that page sees identically (not a per-visitor restart), and free with no watermark option — the only requirement is a small attribution line under the widget linking back to CountLink, which the returned HTML already includes. Use this whenever someone asks for a countdown to put ON their own site/page, as opposed to a link to share with other people directly. Mutually exclusive with for_obs_overlay.",
                "type": "boolean"
              },
              "embed_style": {
                "description": "Board style for embed_on_website: \"board\" (default, dark split-flap), \"minimal\" (plain digits) or \"light\". Ignored otherwise.",
                "enum": ["board", "minimal", "light"],
                "type": "string"
              },
              "embed_width": {
                "description": "Pixel width of the embedded iframe when embed_on_website is true. 160–1600, default 400. Ignored otherwise.",
                "type": "number"
              },
              "for_obs_overlay": {
                "default": false,
                "description": "True returns a URL to paste into OBS (or any streaming tool) as a Browser Source: a transparent background with just the digits, which starts counting as soon as the scene loads. Use it when someone wants a countdown on their stream. Do not give an overlay URL to several people to open — it starts fresh for whoever loads it; for that, call this again without the flag and share that link instead. Mutually exclusive with embed_on_website.",
                "type": "boolean"
              },
              "label": {
                "description": "Optional name shown on the board, e.g. \"Exam\" or \"Break\". Keep it short.",
                "type": "string"
              },
              "overlay_color": {
                "description": "Optional digit colour for the OBS overlay as hex, e.g. \"ff3df5\" or \"#5ef2ff\". Applies to outline, neon, glass and minimal. Ignored otherwise.",
                "type": "string"
              },
              "overlay_start": {
                "description": "When an OBS overlay (for_obs_overlay) starts counting. load (default): when the scene loads. stream: waits at full time until the stream goes live in OBS. scene: restarts from the full duration every time its scene becomes active — good for a Be right back scene. Ignored otherwise.",
                "enum": ["load", "stream", "scene"],
                "type": "string"
              },
              "overlay_style": {
                "description": "Look of the OBS overlay when for_obs_overlay is true. board (default) is the split-flap board; outline is white digits with a dark edge that stays readable over gameplay; neon glows; glass sits the digits on a smoked rounded panel; minimal is plain digits; light is dark-on-light. Ignored otherwise.",
                "enum": ["board", "outline", "neon", "glass", "minimal", "light"],
                "type": "string"
              },
              "overtime": {
                "default": false,
                "description": "True keeps the countdown running past zero as \"+0:42\" so everyone sees how far over it is (talks, breaks that run long). Works for shared links, setup links and overlays.",
                "type": "boolean"
              },
              "start_now": {
                "default": false,
                "description": "False (default) returns a setup link the user starts themselves — correct for a timer that should begin later, and for anything being written down in advance. True returns a link for a countdown already running from now, fixed to one instant so every viewer is in sync; only use it when the timer should start immediately.",
                "type": "boolean"
              }
            },
            "required": ["duration"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
