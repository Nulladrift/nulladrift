        },
        {
          "name": "describe_timer_link",
          "title": "Explain a CountLink link",
          "description": "Given a countlink.app URL, say what it encodes: whether it is a running countdown or a not-yet-started setup link, its label, and how much time is left. Use it when someone pastes a CountLink link and asks what it is or when it ends.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "A countlink.app timer URL.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
