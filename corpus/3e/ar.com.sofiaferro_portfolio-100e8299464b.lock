{
  "lockfileVersion": 2,
  "subjects": {
    "ar.com.sofiaferro/portfolio": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.sofiaferro.com.ar/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "sofia-ferro-portfolio",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This server exposes the portfolio of Sofia Ferro, a software engineer and creative technologist based in Buenos Aires, Argentina, working at the intersection of code, language and hardware: expanded literature, bots, IoT, creative coding and installations. Content is bilingual (Spanish \"es\" — the default — and English \"en\"). Use list_projects/get_project for her art and engineering projects, get_manifesto for her manifesto on programming as practice, get_resume for a JSON Resume v1.0.0 document, and contact to send her a message. She posts on X as @svfonx. The same content is also available as plain markdown at https://www.sofiaferro.com.ar (append .md to any page URL, or send Accept: text/markdown; see /llms.txt).",
      "tools": [
        {
          "name": "contact",
          "title": "Contact Sofia",
          "description": "Send a message to Sofia Ferro (delivered to her inbox by email). Use this to propose an intro call, a collaboration, or anything else on behalf of your user. Always include who is reaching out and how Sofia can reply (email or other contact info). Rate-limited; if unavailable, email svf.inbox@gmail.com directly instead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "contact_info": {
                "description": "How Sofia can reply: an email address or similar.",
                "maxLength": 320,
                "minLength": 3,
                "type": "string"
              },
              "message": {
                "description": "The message for Sofia (max 2000 characters).",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Name of the person (or agent + principal) reaching out.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "purpose": {
                "default": "other",
                "description": "Why you are reaching out: \"intro_call\", \"collab\" or \"other\".",
                "enum": ["intro_call", "collab", "other"],
                "type": "string"
              }
            },
            "required": ["contact_info", "message", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6a301829089228d9888a08755bb7a1b13145c3b8b72f8ccca40f87b7eb979982"
        },
        {
          "name": "get_manifesto",
          "title": "Get manifesto",
          "description": "Sofia Ferro's manifesto on programming as embodied practice — error as path, the practice that stays when everything else changes. Returns title, summary and the full markdown text. For her ongoing thinking, see X: https://x.com/svfonx",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "default": "es",
                "description": "Content language: \"es\" (Spanish, default) or \"en\" (English).",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eb2213fe50e5b6c1715bc58a5cbabdca7c780b4dd37ec0a33cf1d4c5bbea8cce"
        },
        {
          "name": "get_project",
          "title": "Get project",
          "description": "Get one of Sofia Ferro's projects in full: metadata (category, date, tech, links, images) plus title, summary and the complete markdown body. Use list_projects first to discover valid slugs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "default": "es",
                "description": "Content language: \"es\" (Spanish, default) or \"en\" (English).",
                "enum": ["es", "en"],
                "type": "string"
              },
              "slug": {
                "description": "Project slug, e.g. \"pit0nisa\" (see list_projects).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e2fead21106f1de6b5194d84f6b6146ef77e1d4e9d3abb4dc078618a592fa8c7"
        },
        {
          "name": "get_resume",
          "title": "Get resume",
          "description": "Sofia Ferro's full resume as a JSON Resume v1.0.0 document (basics, skills, projects). The resume is maintained in English only, so the locale parameter is currently ignored. Canonical URL: https://www.sofiaferro.com.ar/api/resume.json",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "default": "es",
                "description": "Content language: \"es\" (Spanish, default) or \"en\" (English).",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0c589556b4a5085cd28836618ab752d8fe9f66c0694e5292fb98f22cab5338de"
        },
        {
          "name": "list_projects",
          "title": "List projects",
          "description": "List Sofia Ferro's published projects (electronic art, expanded literature, bots, IoT, hardware, creative coding, installations). Returns slug, title, summary, category, date, tech stack and links for each project, newest first. Optionally filter by category. Use get_project with a slug for the full write-up.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Filter by category. One of: literatura-expandida, bots, iot, hardware, creative-coding, instalacion.",
                "enum": ["literatura-expandida", "bots", "iot", "hardware", "creative-coding", "instalacion"],
                "type": "string"
              },
              "locale": {
                "default": "es",
                "description": "Content language: \"es\" (Spanish, default) or \"en\" (English).",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:067cbf857f559ec57a4699ef2200a444eeb73075ebf93d90e4f745f3b176c248"
        }
      ],
      "digest": "sha256:d5d227b4018f3fdeee0af03ed60366886c772a9d7f00b8f7ad484a4880c38a7b"
    }
  }
}
