{
  "lockfileVersion": 2,
  "subjects": {
    "com.dataandapis/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dataandapis.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "dataandapis",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Data and APIs (dataandapis.com) is a catalog of 125+ REST APIs over public and official datasets: sanctions lists, barcodes, IP intelligence, company registries, healthcare providers, recalls, holidays, geography, finance and more. Use search_apis to find the right API for a question, get_api to read its endpoints and parameters, and call_api to fetch live data. call_api needs the user's API key (free at https://dataandapis.com/sign-up, 500 tokens a month). Every API shares one key.",
      "tools": [
        {
          "name": "call_api",
          "title": "Call an API endpoint",
          "description": "Make a live request to a dataandapis.com API with the user's API key (sent as X-Api-Key on this MCP connection). Give the API slug, the endpoint path from get_api (path parameters already filled in, e.g. '/v1/products/3017620422003'), optional query parameters and, for POST, a JSON body. Most calls cost 1 token.",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "JSON body for POST endpoints."
              },
              "method": {
                "default": "GET",
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "path": {
                "description": "Endpoint path such as '/v1/screen'. A leading '/v1' is added when missing.",
                "type": "string"
              },
              "query": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Query parameters.",
                "type": "object"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["path", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0fd81bcfbe3f26733b77370dc62ea82aa2bd251089e920a76a205e8a72c6202d"
        },
        {
          "name": "get_api",
          "title": "Get an API's endpoint reference",
          "description": "Full reference for one API: every endpoint with method, path, path and query parameters with example values, request body and an example response, plus the token cost per call. Use the slug from search_apis.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "API slug, e.g. 'sanctions' or 'barcode-lookup'.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3cd3be06c7598da4fc33895bfb17c69d735f0f11de258e41130c243bcb86c9dd"
        },
        {
          "name": "search_apis",
          "title": "Search the API catalog",
          "description": "Find APIs on dataandapis.com by the data they provide (e.g. 'sanctions screening', 'barcode nutrition', 'IP geolocation', 'company by domain', 'public holidays'). Returns up to 10 matches with slug, one-line summary, base URL and docs. Follow with get_api for the endpoints.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What data or capability you are looking for, in plain words.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c7ce6428a2d55c1e077fe74fa16509e7e7f5fa4a0f23fbab9fd97faab861350b"
        }
      ],
      "digest": "sha256:eb4d23fca7d70e6005331f4f2e451186d47febafd3a6450ba683c757e5fae9bb"
    }
  }
}
