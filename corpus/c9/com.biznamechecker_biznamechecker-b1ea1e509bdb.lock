{
  "lockfileVersion": 2,
  "subjects": {
    "com.biznamechecker/biznamechecker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://biznamechecker.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "biznamechecker",
        "version": "1.1.0+tools.9c76810cc8cd66ab"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use check_business_name first when someone asks “Can I use this business name?”, “Is this name available?”, “Anything stopping me from using it?”, or wants a complete name check. It checks all four areas in one dated, sourced answer. Use check_llc_name when they ask whether an LLC name is available or registrable in specific states; check_trademark_conflicts for trademark conflicts; check_domain_availability for whether domains are available or taken; and check_social_handles for whether social handles are available or taken. Use get_state_naming_rules for LLC naming rules and get_trademark for a known federal serial number. Results are checks, not reservations or legal clearance.",
      "tools": [
        {
          "name": "check_business_name",
          "title": "Check a business name",
          "description": "Can I use this business name, and is anything stopping me? Check all four areas in one pass: LLC availability, federal trademark conflicts, domains, and social handles. Returns dated verdicts, sources, and the full results URL. Start here for a general business-name availability question. LLC results are preliminary, not reservations; trademark results are a conflict screen, not clearance.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "name": {
                "description": "The business, LLC, or trademark name from the conversation. An LLC designator is optional.",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "states": {
                "description": "Up to 5 jurisdictions for the LLC name check. Omit when no state was given.",
                "items": {
                  "enum": ["AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "FL", "GA", "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME", "MD", "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", "NJ", "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY", "DC"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "tlds": {
                "description": "Up to 5 top-level domains from the conversation. Omit to check com.",
                "items": {
                  "enum": ["com", "net", "org", "co", "io", "us", "biz"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a business name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d1bcddbd8d98d735a799142cc644e5e35b5e3ee28608043c3a292311d89056c5"
        },
        {
          "name": "check_domain_availability",
          "title": "Check domain availability",
          "description": "Is this domain available or taken? Check a name across up to five TLDs using a registered-zone index, live DNS, and the registry's RDAP record. Each row names its status and source, and the answer includes the full results URL. Use check_business_name instead for a complete name check.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "name": {
                "description": "The business, LLC, or trademark name from the conversation. An LLC designator is optional.",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "tlds": {
                "description": "Up to 5 top-level domains from the conversation. Omit to check com.",
                "items": {
                  "enum": ["com", "net", "org", "co", "io", "us", "biz"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check domain availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2cd80bdcfb6fcfcb389b31867b347fb81435dde7a630d1f31b7260e057c9b41b"
        },
        {
          "name": "check_llc_name",
          "title": "Check LLC name availability",
          "description": "Is this LLC name available, and can it be registered in these states? Returns a dated preliminary or live verdict for each state, the source registry portal, and the full results URL. This is not a name reservation; the state confirms at filing. Use check_business_name instead when the question is about anything else that could stop use of the name.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "name": {
                "description": "The business, LLC, or trademark name from the conversation. An LLC designator is optional.",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "states": {
                "description": "Up to 5 two-letter state or DC codes from the conversation.",
                "items": {
                  "pattern": "^[A-Z]{2}$",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["name", "states"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check LLC name availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1b09b11eb53d1ac6440ce7c74b0907f9dea5c7023221cac17fa4e89dc373cdf"
        },
        {
          "name": "check_social_handles",
          "title": "Check social handles",
          "description": "Are these social handles available or taken? Check the handle derived from a business name on 23 social platforms: github, bluesky, twitch, mastodon.social, instagram, youtube, pinterest, snapchat, telegram, tumblr, vimeo, substack, devto, threads, reddit, linkedin, medium, x, facebook, tiktok, dribbble, linktree, patreon. Each row gives a status or says a manual check is needed, and the answer includes the full results URL. Use check_business_name instead for a complete name check.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "name": {
                "description": "The business, LLC, or trademark name from the conversation. An LLC designator is optional.",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check social handles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:811798b8fc82a2a5170fcd069773ee1bd473892405c456c9a811a61c14739240"
        },
        {
          "name": "check_trademark_conflicts",
          "title": "Search federal trademarks",
          "description": "Could this business name conflict with a federal trademark? Returns matching marks, status, classes, owner, record links, the register date, and the full results URL. Optional filters can narrow or rank the search. This is a conflict screen, not legal advice and not trademark clearance. Use check_business_name instead for a complete name check.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "goods_description": {
                "description": "Optional goods or services; leave unset for a conflict check.",
                "maxLength": 500,
                "type": "string"
              },
              "include_dead": {
                "description": "Optional; include dead marks separately when true.",
                "type": "boolean"
              },
              "industry": {
                "description": "Optional industry phrase; leave unset for a conflict check.",
                "maxLength": 60,
                "type": "string"
              },
              "mode": {
                "description": "Optional; leave unset for a conflict check. A set value narrows the match mode.",
                "enum": ["exact", "prefix", "fuzzy", "phonetic"],
                "type": "string"
              },
              "name": {
                "description": "The business, LLC, or trademark name from the conversation. An LLC designator is optional.",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "nice_classes": {
                "description": "Optional Nice classes for the goods or services; leave unset for a conflict check.",
                "items": {
                  "maximum": 45,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "owner": {
                "description": "Optional owner filter; leave unset for a conflict check.",
                "maxLength": 120,
                "type": "string"
              },
              "status": {
                "description": "Optional status scope; leave unset for a conflict check of live and pending marks.",
                "enum": ["live", "pending", "dead", "all"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search federal trademarks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:973e7906b828c8c1926da9cea962cb69bda3d47941f6cd16db717bfb2ee7a498"
        },
        {
          "name": "get_state_naming_rules",
          "title": "Get state LLC naming rules",
          "description": "What are this state's LLC naming rules? Returns the required designator, restricted-word note, recorded statute citation, state registry search portal, and results site URL. No name availability check is performed.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "state": {
                "description": "Two-letter USPS code, or DC.",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get state LLC naming rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c6b9f18bf482d5a5d15e2d98915c588e794037b492ab066af07b7d71b2d988d"
        },
        {
          "name": "get_trademark",
          "title": "Get a federal trademark record",
          "description": "What does this federal trademark serial number identify? Returns the mark, status, owner, dates, classes, goods and services, first use, publication, pseudo mark, register date, and the TSDR record link.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "serial": {
                "description": "USPTO serial number, 7 to 9 digits.",
                "pattern": "^[0-9]{7,9}$",
                "type": "string"
              }
            },
            "required": ["serial"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a federal trademark record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac8e8bf1aeb1dbe64654fac5f8d27d10278fc982a1c7f40265ea08b64cef2b99"
        }
      ],
      "digest": "sha256:0ffb56c6d31981c20689a90a04f0722f1aa02e86a8c6b68a07aaf6fd025a327c"
    }
  }
}
