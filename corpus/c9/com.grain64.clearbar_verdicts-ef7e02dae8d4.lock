    "com.grain64.clearbar/verdicts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://clearbar.grain64.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "clearbar-verdicts",
        "title": "Clearbar verdicts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ask which LLM is the cheapest one that still clears a quality bar for a task. list_verdicts shows every published verdict (task, cheapest passing model, cost per successful task); get_verdict(slug) gives the full table, the run file and the script to re-run it. Figures are measured on public datasets with retries and failures counted; the dated price snapshot is in every answer. To get the same verdict on your own examples, open the app_url in the answer.",
      "tools": [
        {
          "name": "get_verdict",
          "title": "Get one verdict: cheapest passing model, cost, failures",
          "description": "The full verdict for one task: the cheapest model that clears the bar, its pass rate and cost per successful task in US dollars, the baseline model it is compared with, every candidate's status, plus links to the verdict page, the run file (JSON) and the script that re-runs it. Get the slug from list_verdicts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Verdict slug from list_verdicts, for example sms-spam.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02d76a0d3df27dc4dede229ae7b41bae7f99ff06c589697fde80649fb7b1cf8c"
        },
        {
          "name": "list_verdicts",
          "title": "List verdicts: which model is cheapest for each task",
          "description": "Which LLM is the cheapest that still passes? Lists every published Clearbar verdict: the task, the pass bar, the cheapest passing model, its cost per successful task (retries and failures counted) and the page to check it. Optional filter by task type.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task": {
                "description": "Only verdicts of this task type, for example classification, extraction or tool-call.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6944df29319438da18298a0159900c2ffb44b54a2658426e11926539a9f7aa97"
        }
