      "instructions": "Create family-friendly greeting text or cards in 15 languages and 30 occasions. Call list_greeting_options to discover supported languages, occasions and styles. The service does not publish messages or access user accounts. Shared web links omit recipient names and expire after 30 days. A generated card can be used directly in the conversation.",
      "tools": [
        {
          "name": "create_greeting_card",
          "title": "Create a greeting card",
          "description": "Create a downloadable PNG greeting with occasion-matched background, curated phrases and optional decorations. Optional first name is rendered in this response only. Creates a reusable design link without the name, available to anyone with the link for 30 days. Free with watermark. Does not post to social networks.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "background": {
                "default": "auto",
                "description": "auto matches the occasion; other categories still obey cultural safety rules.",
                "enum": ["auto", "all", "nature", "flowers", "animals", "coffee", "celebration", "Mare", "Laghi", "Fiumi", "Cascate", "Montagne", "Boschi", "Deserti", "Neve", "Cieli", "Prati"],
                "type": "string"
              },
              "decorations": {
                "default": "random",
                "enum": ["random", "none"],
                "type": "string"
              },
              "format": {
                "default": "4:5",
                "enum": ["9:16", "4:5", "1:1", "16:9"],
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Language code; hi is Hindi. Use list_greeting_options for supported languages.",
                "enum": ["it", "en", "fr", "es", "de", "pt", "ar", "zh", "ja", "ko", "th", "ru", "hi", "el", "he"],
                "type": "string"
              },
              "name": {
                "default": "",
                "description": "Optional first name, up to 30 characters. Omit sensitive or identifying details. Never stored with a shared design.",
                "maxLength": 100,
                "type": "string"
              },
              "occasion": {
                "default": "morning",
                "enum": ["morning", "afternoon", "evening", "night", "birthday", "congratulations", "christmas", "newyear", "lunarnewyear", "mothersday", "fathersday", "weddinganniversary", "anniversary", "ramadan", "eid", "thankyou", "getwell", "wedding", "newbaby", "graduation", "baptism", "firstcommunion", "confirmation", "barmitzvah", "hanukkah", "roshhashanah", "pesach", "eidaladha", "diwali", "vesak"],
                "type": "string"
              },
              "previousCodes": {
                "default": [],
                "description": "Recent phrase codes from this conversation to avoid repeats; do not send chat history.",
                "items": {
                  "maxLength": 100,
                  "pattern": "^[a-z]+:[a-z]+:\\d+:\\d+:\\d+(?::(?:sweet|cheerful|simple|motivational))?$",
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "style": {
                "default": "sweet",
                "description": "Writing and visual style: sweet and tender, cheerful, simple and elegant, or motivational. The selected style changes the actual greeting wording.",
                "enum": ["sweet", "cheerful", "simple", "motivational"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "card": {
                "additionalProperties": false,
                "properties": {
                  "backgroundId": {
                    "maxLength": 100,
                    "pattern": "^[\\w-]+$",
                    "type": "string"
                  },
                  "backgroundVeil": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "emoji": {
                    "enum": ["none", "hearts", "flowers", "stars", "bear", "bow", "balloons"],
                    "type": "string"
                  },
                  "indices": {
                    "items": [
                      {
                        "maximum": 1000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "maximum": 1000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "maximum": 1000,
                        "minimum": 0,
                        "type": "integer"
                      }
                    ],
                    "maxItems": 3,
                    "minItems": 3,
                    "type": "array"
                  },
                  "locale": {
                    "enum": ["it", "en", "fr", "es", "de", "pt", "ar", "zh", "ja", "ko", "th", "ru", "hi", "el", "he"],
                    "type": "string"
                  },
                  "name": {
                    "const": "",
                    "type": "string"
                  },
                  "occasion": {
                    "enum": ["morning", "afternoon", "evening", "night", "birthday", "congratulations", "christmas", "newyear", "lunarnewyear", "mothersday", "fathersday", "weddinganniversary", "anniversary", "ramadan", "eid", "thankyou", "getwell", "wedding", "newbaby", "graduation", "baptism", "firstcommunion", "confirmation", "barmitzvah", "hanukkah", "roshhashanah", "pesach", "eidaladha", "diwali", "vesak"],
                    "type": "string"
                  },
                  "phraseStyle": {
                    "enum": ["sweet", "cheerful", "simple", "motivational"],
                    "type": "string"
                  },
                  "stickers": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "id": {
                          "enum": ["bear", "bow", "hearts", "flowers", "balloons", "stars"],
                          "type": "string"
                        },
                        "position": {
                          "enum": ["topLeft", "topRight", "bottomLeft", "bottomRight"],
                          "type": "string"
                        }
                      },
                      "required": ["id", "position"],
                      "type": "object"
                    },
                    "maxItems": 4,
                    "type": "array"
                  },
                  "style": {
                    "enum": ["sweet", "cheerful", "simple", "motivational"],
                    "type": "string"
                  },
                  "version": {
                    "const": 1,
                    "type": "number"
                  }
                },
                "required": ["backgroundId", "emoji", "indices", "locale", "name", "occasion", "stickers", "style", "version"],
                "type": "object"
              },
              "code": {
                "maxLength": 100,
                "pattern": "^(?:it|en|fr|es|de|pt|ar|zh|ja|ko|th|ru|hi|el|he):(?:morning|afternoon|evening|night|birthday|congratulations|christmas|newyear|lunarnewyear|mothersday|fathersday|weddinganniversary|anniversary|ramadan|eid|thankyou|getwell|wedding|newbaby|graduation|baptism|firstcommunion|confirmation|barmitzvah|hanukkah|roshhashanah|pesach|eidaladha|diwali|vesak):\\d+:\\d+:\\d+(?::(?:sweet|cheerful|simple|motivational))?$",
                "type": "string"
              },
              "editUrl": {
                "format": "uri",
                "pattern": "^https:\\/\\/generategreetings\\.com\\/s\\/[A-Za-z0-9_-]{24}\\?utm_source=(?:chatgpt|claude|mcp)&utm_medium=referral&utm_campaign=(?:morning|afternoon|evening|night|birthday|congratulations|christmas|newyear|lunarnewyear|mothersday|fathersday|weddinganniversary|anniversary|ramadan|eid|thankyou|getwell|wedding|newbaby|graduation|baptism|firstcommunion|confirmation|barmitzvah|hanukkah|roshhashanah|pesach|eidaladha|diwali|vesak)&utm_content=card(?:&format=(?:9%3A16|4%3A5|1%3A1|16%3A9))?$",
                "type": "string"
              },
              "expiresAt": {
                "format": "date-time",
                "type": "string"
              },
              "format": {
                "enum": ["9:16", "4:5", "1:1", "16:9"],
                "type": "string"
              },
              "imageUrl": {
                "format": "uri",
                "pattern": "^https:\\/\\/generategreetings\\.com\\/s\\/[A-Za-z0-9_-]{24}\\/image\\?format=(?:9%3A16|4%3A5|1%3A1|16%3A9)$",
                "type": "string"
              },
              "linkOmitsName": {
                "const": true,
                "type": "boolean"
              },
              "locale": {
                "enum": ["it", "en", "fr", "es", "de", "pt", "ar", "zh", "ja", "ko", "th", "ru", "hi", "el", "he"],
                "type": "string"
              },
              "nameIncludedInImage": {
                "type": "boolean"
              },
              "occasion": {
                "enum": ["morning", "afternoon", "evening", "night", "birthday", "congratulations", "christmas", "newyear", "lunarnewyear", "mothersday", "fathersday", "weddinganniversary", "anniversary", "ramadan", "eid", "thankyou", "getwell", "wedding", "newbaby", "graduation", "baptism", "firstcommunion", "confirmation", "barmitzvah", "hanukkah", "roshhashanah", "pesach", "eidaladha", "diwali", "vesak"],
                "type": "string"
              },
              "text": {
                "maxLength": 6000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["card", "code", "editUrl", "expiresAt", "format", "imageUrl", "linkOmitsName", "locale", "nameIncludedInImage", "occasion", "text"],
            "type": "object"
          },
