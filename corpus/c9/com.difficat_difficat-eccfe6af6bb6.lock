                "type": "string"
              },
              "idempotencyKey": {
                "description": "Retry key: under a prepaid balance, the same value within 24 hours is not charged again and answers DUPLICATE_REQUEST with the first jobId.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "maxPages": {
                "description": "Without paths: pages discovery compares, default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxPriceUsd": {
                "description": "Spend cap in USD: a job priced above it is refused before any challenge.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "paths": {
                "description": "Pages to compare, each starting with /; skips discovery.",
                "items": {
                  "maxLength": 2048,
                  "minLength": 1,
                  "pattern": "^\\/(?![/\\\\])",
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "previewUrl": {
                "description": "The preview or staging site (full URL), compared as Site B.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "productionUrl": {
                "description": "The production site (full URL), compared as Site A.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "threshold": {
                "description": "Visual diff tolerance as a fraction from 0 (exact) to 1: 0.05 means 5%. The web app takes a percentage; the API does not.",
