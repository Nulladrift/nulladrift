        {
          "name": "diff_deploy",
          "title": "Diff deploy",
          "description": "Use when a staging or preview deploy should match production, or a migrated site its old one: it compares the pages of both origins and answers only the pages that are missing, changed or look different. Free up to 40 pages, once per client address, no key needed.",
          "inputSchema": {
