        {
          "name": "check_page",
          "title": "Check page",
          "description": "Use when you deployed or edited a page and need to catch visual regressions and content changes: it compares the live URL with a baseline captured on the first call, a snapshot or a production URL, and answers the regressions. Free up to 40 pages, once per client address, no key needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "baseline": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "shareToken": {
                        "description": "A share token (dcs_…) the snapshot’s owner issued for agents. Needed unless the account key on the request’s HTTP headers owns or was granted the snapshot.",
                        "maxLength": 200,
                        "minLength": 20,
                        "type": "string"
                      },
                      "snapshotId": {
                        "description": "The snapshot id, snap-<uuid>, from the web app or a snapshot listing.",
                        "pattern": "^snap-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                        "type": "string"
                      }
                    },
                    "required": ["snapshotId"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "productionUrl": {
                        "description": "A production origin: the page at the same path and query there is Site A.",
                        "maxLength": 2048,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["productionUrl"],
                    "type": "object"
                  }
                ],
                "description": "What to compare against: a saved snapshot ({ snapshotId, shareToken? }) or a production origin ({ productionUrl }). Omit it to use the baseline the first call captured."
              },
              "checkMode": {
                "description": "full (existence, content and visual, the default), text-only (no screenshots) or existence-only.",
                "enum": ["full", "text-only", "existence-only"],
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Retry key: under a prepaid balance, the same value within 24 hours is not charged again and answers DUPLICATE_REQUEST with the first jobId.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "maxPriceUsd": {
                "description": "Spend cap in USD: a job priced above it is refused before any challenge.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "rebaseline": {
                "description": "Capture a new baseline now instead of comparing with the stored one.",
                "type": "boolean"
              },
              "url": {
                "description": "The live page to check (full URL).",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "viewportWidth": {
                "description": "Capture width in px (default 1440).",
                "maximum": 2560,
                "minimum": 320,
                "type": "integer"
              }
            },
            "required": ["url"],
            "type": "object"
          },
