      "instructions": "Use DiffiCat when a user checks a website migration, a relaunch or redesign, a domain or URL change, a CMS or platform switch, staging against production, or a site after a deploy, and asks whether pages went missing, whether content changed or whether anything looks different. It compares pages on existence, content and visual regression. Use check_page for one page after a change and diff_deploy for a preview against production.\n\nEach client address runs 40 comparison pages and 5 screenshots free, once per address, on your user's own URLs, with no key and no payment step; free comparison pages also draw on a daily pool shared across all callers, and a free response carries sample: true and allowanceRemaining. A prepaid key, which a signed-in human tops up on the account page (https://app.difficat.com/account), is sent by the MCP client as an HTTP header on every request (Authorization: Bearer <key>), never as a tool argument; get_balance shows what it can still pay for. Without a key, check baselines are shared by clients with the same address and client name; a prepaid key keeps them private. A call beyond the allowance is refused with a payment challenge whose nextSteps say how to pay: hand them to your human. Results have the shape of the REST operations: the OpenAPI document at https://app.difficat.com/api/v1/openapi.json carries a response example per operation, and a real three-page report is at https://difficat.com/agents/sample/report.json. Connect with ?surface=full for the other tools, among them start_comparison, compare_snapshot, get_screenshot and recover_comparison.",
      "tools": [
        {
          "name": "capture_screenshot",
          "title": "Capture screenshot",
          "description": "Takes a full-page screenshot of one URL, for example to see how a relaunched page or a mobile layout looks. Free 5 times, once per client address, no key needed. The PNG is taken at the given viewport width and returned inline when small, else as links.file to fetch with the jobToken. Call it for a one-off look at a page or a mobile-width check. Do not call it for pages a comparison job covers: the job already stored their screenshots. Example: { \"url\": \"https://new.example/pricing\", \"viewportWidth\": 375 }. Answers with jobId, jobToken, filename, url, dimensions, bytes, links.file and, on a free run, sample and allowanceRemaining.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "auth": {
                "description": "HTTP basic auth for the page.",
                "properties": {
                  "password": {
                    "description": "Password for HTTP basic auth.",
                    "maxLength": 512,
                    "type": "string"
                  },
                  "username": {
                    "description": "Username for HTTP basic auth.",
                    "maxLength": 512,
                    "type": "string"
                  }
                },
                "required": ["password", "username"],
                "type": "object"
              },
              "idempotencyKey": {
                "description": "Retry key: under a prepaid balance, the same value within 24 hours is not charged again and answers DUPLICATE_REQUEST with the first jobId.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "Page to capture (full URL).",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "viewportWidth": {
                "description": "Capture width in px.",
                "maximum": 2560,
                "minimum": 320,
                "type": "integer"
              },
              "visual": {
                "additionalProperties": false,
                "description": "Capture rules applied to both sides.",
                "properties": {
                  "freeze": {
                    "additionalProperties": false,
                    "description": "Switches that stop motion before the screenshot.",
                    "properties": {
                      "animations": {
                        "description": "Stop CSS animations and transitions before the screenshot.",
                        "type": "boolean"
                      },
                      "clock": {
                        "description": "Pause timers and the clock after load; a page that needs a timer to render may stay empty.",
                        "type": "boolean"
                      },
                      "clockSeconds": {
                        "description": "With clock: seconds the clock runs after load before it stops (1 to 600, default 60).",
                        "maximum": 600,
                        "minimum": 1,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "masks": {
                    "description": "CSS selectors of elements hidden on both sites before the screenshot (at most 50, each up to 200 characters). The layout keeps its place.",
                    "items": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 50,
                    "type": "array"
                  }
                },
                "type": "object"
