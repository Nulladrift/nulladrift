      "serverInfo": {
        "name": "DrawSQL",
        "version": "1.3.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DrawSQL turns a database schema into an interactive, editable entity-relationship diagram.\n\nAnonymous (no account needed):\n- `visualize_schema` — when a user wants to see, share, or edit a database schema as\n  a diagram. Pass either a SQL `ddl` dump (CREATE TABLE / ALTER TABLE statements) or a\n  DrawSQL `schema` patch (JSON). Returns a `drawsql.app/draw` link that opens the\n  diagram in the browser, ready to edit, share, or export.\n\nLimits: the free canvas shows at most 20 tables (larger DDL opens with the first 20).\nLinks are anonymous; an unopened link expires after 30 days, and opening it extends\nthe expiry by a year. Saving to a free account keeps the diagram permanently.\n\nWith a DrawSQL API token (send `Authorization: Bearer <token>`; create one under\nAccount → API tokens — paid plans):\n- `list_diagrams` — the diagrams visible to the token (names, ids, table counts, URLs).\n- `get_schema` — a diagram's schema as compact markdown. Consult it before writing\n  queries or migrations against a schema the team keeps in DrawSQL.\n- `get_diagram_link` — the canonical URL to cite or share.\n- `get_driver_rules` — a driver's data types and the schema patch format. Read it\n  before writing a patch.\n- `get_proposal_status` — the outcome of a proposal: pending, applied, declined, or\n  expired.\n\nWith a token that also carries the `write` ability:\n- `create_diagram` — create a diagram in the token's team from SQL DDL or a schema\n  patch. Returns within 15 seconds; a longer import comes back as `importing`, and\n  `get_diagram_link` reports when it is `ready`.\n- `propose_diagram_changes` — propose a schema patch to an existing diagram. A human\n  reviews and applies it in DrawSQL; nothing changes until then.\n- Call order for a change:\n  `list_diagrams → get_schema → get_driver_rules → propose_diagram_changes → get_proposal_status`.",
      "tools": [
        {
          "name": "visualize_schema",
          "title": "Visualize schema",
          "description": "Create an interactive, editable DrawSQL entity-relationship diagram from a database schema. Return a shareable drawsql.app/draw link.",
          "inputSchema": {
            "properties": {
              "ddl": {
                "description": "SQL CREATE TABLE and ALTER TABLE statements. Provide either this field or `schema`, but not both.",
                "type": "string"
              },
              "driver": {
                "description": "Database dialect, one of: mysql, pgsql, sqlsrv. Defaults to mysql.",
                "enum": ["mysql", "pgsql", "sqlsrv"],
                "type": "string"
              },
              "schema": {
                "description": "A DrawSQL schema patch encoded as a JSON string. Top-level keys: tables, relationships, groups, sticky_notes. Example: {\"tables\":[{\"name\":\"users\",\"columns\":[{\"name\":\"id\",\"type\":\"bigint\"}]},{\"name\":\"posts\",\"columns\":[{\"name\":\"id\",\"type\":\"bigint\"},{\"name\":\"user_id\",\"type\":\"bigint\"}],\"parent_name\":\"Content\"}],\"relationships\":[{\"type\":\"one-to-many\",\"source_table\":\"users\",\"source_column\":\"id\",\"target_table\":\"posts\",\"target_column\":\"user_id\"}],\"groups\":[{\"name\":\"Content\"}],\"sticky_notes\":[{\"content\":\"Draft\"}]}. Relationship types: one-to-one, one-to-many, many-to-one (hyphenated). Identifiers (names, uuids, references) match exactly: no leading/trailing whitespace or control characters, table and group names unique, uuids unique across the whole patch, and entries repeating a uuid must repeat its name. Full format: https://drawsql.app/llms-full.txt. Provide either this field or `ddl`, but not both.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a2ca79eae1cff55b85f0b322b6fc3c59c31bb3695d991d8f9582a19e1f4bb6a2"
        }
      ],
      "digest": "sha256:878f40f66b1db5400789d5d1afb407aeba3902e8d3f4b18ec4691793db703e8f"
    }
  }
