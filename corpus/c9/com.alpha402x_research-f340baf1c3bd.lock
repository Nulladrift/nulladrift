      "serverInfo": {
        "name": "alpha402x-research",
        "title": "alpha402x — original equity research, payable per call (x402)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "alpha402x publishes original, cited equity research that an agent can buy per call over the x402 protocol (USDC on Base) — no account, no API key. These tools are free: browse the catalog (list_research), read a product's exact payment terms (get_product_terms), check 10-Q coverage for any U.S. ticker (check_10q_coverage), pull a COMPLETE sample card free in the exact schema the paid cards return (get_sample_card), look up a three-year line-item trajectory sheet (get_line_item_trajectory), find a company's 10-K/10-Q filing bundle — filing HTML plus IS/BS/CF workbook as a ZIP (get_sec_filing_bundle), and learn the payment flow (how_to_pay_x402). Paid retrieval happens over plain HTTPS against the returned URLs using an x402-capable client (e.g. @x402/fetch) and the operator's funded wallet. Descriptive research, cited to source; not investment advice.",
      "tools": [
        {
          "name": "check_10q_coverage",
          "title": "Check 10-Q coverage for a ticker",
          "description": "Free coverage check against SEC EDGAR for any U.S. ticker: confirms whether 10-Q Highlights can serve it, lists available fiscal periods (newest first), and returns the payable URLs. No charge; the paid product is the extraction itself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "period": {
                "description": "Optional fiscal period like fy2026-q1; checks that this dated variant exists",
                "type": "string"
              },
              "ticker": {
                "description": "U.S. ticker symbol, e.g. AAPL",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4aa0069de52631653fade1c77fa78a7e93cc16882ddaa37cc348ec46406a4691"
        },
        {
          "name": "get_line_item_trajectory",
          "title": "Get a line-item trajectory sheet",
          "description": "Three fiscal years of income statement, balance sheet and cash flow lines for one company, in one standard layout, scaled to revenue, with per-year slopes where computed. Levels and slopes only. AMD and AVGO return the COMPLETE sheet free, in the exact schema every paid sheet uses. Any other covered ticker returns its payable URL and x402 terms ($0.05 per call). Tickers outside the covered list return not_covered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "A covered ticker, e.g. AMD (free), AVGO (free) or AAPL (paid)",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:30a80e9bcb439dfb571ab2319a5003d4369fd1191c01a3f9ee4e474833f87941"
        },
        {
          "name": "get_product_terms",
          "title": "Get a product's payment terms",
          "description": "Exact x402 payment terms for one payable URL or product path (price, asset, network, payTo, scheme). The live 402 response's PAYMENT-REQUIRED header remains the authoritative terms document; this tool mirrors the same constants the gates are built from.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "A payable path or URL, e.g. /10q-highlights/AAPL, /wacc-build/AAPL/fye-2025-09-27, /quarterly-quant-card/AMD/fy2026-q2, /quarterly-qual-card/AMD/fy2026-q2, /profiles/100x-floor, /5x-stock-empirical-profile",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ddd00a9fa08ccd4054bb801d58c09e3d90f3348db297b77c4b91f33fcb9b14aa"
        },
        {
          "name": "get_sample_card",
          "title": "Get a complete card, free",
          "description": "One COMPLETE quarterly card, free — the identical payload the paid route returns for that card, not a trimmed preview. Two company-quarters (AMD fy2026-q2, MRVL fy2027-q2) are published free in both the quantitative and qualitative families, in the exact schema and field names every paid card uses, so a parser written against a sample works unchanged against any card you buy. Use it as a zero-cost integration test before paying for coverage. Any other ticker returns not_a_sample.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "family": {
                "description": "Which card family to return. Defaults to quantitative.",
                "enum": ["quantitative", "qualitative"],
                "type": "string"
              },
              "ticker": {
                "description": "AMD or MRVL — the two company-quarters published free",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fcfa1f923313d7a682cfecb26bab60c25a96e44301580b34147dbc9bcf676c0b"
        },
        {
          "name": "get_sec_filing_bundle",
          "title": "Find a 10-K / 10-Q filing bundle",
          "description": "One company's SEC 10-K or 10-Q as a ZIP: the filing HTML as filed, the SEC-rendered consolidated statements in a workbook (IS, BS, CF where present; the manifest names the sheets, and a two-sheet workbook is disclosed on the bundle), a manifest naming the accession, and a pointer to the quarterly cards for the same filing. Source material only; nothing inferred. Lists every bundle held for the ticker with its free manifest URL; AMD, MRVL, AVGO and MRCY are free in full. Other bundles return their payable URL and x402 terms ($0.05 each). Tickers with no bundle return not_covered. The ZIP bytes themselves are only served over the HTTP routes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Optional bundle slug like 10q-2026-06-27 or 10k-2026-07-03; defaults to listing every bundle held for the ticker",
                "type": "string"
              },
              "ticker": {
                "description": "U.S. ticker, e.g. AMD (free), AAPL (paid)",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:39d28039445ee3d6427ecded544d3536927cd61d96df32e10056ba6c2567c272"
        },
