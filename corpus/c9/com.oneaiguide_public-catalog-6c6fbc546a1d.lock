        {
          "name": "compare_tools",
          "description": "Compare 2 to 5 distinct approved tools by UUID or canonical slug. Facts share the public profile's official-source and freshness policy: verified/partial have current support; stale/unknown have no current value. Unknown is not false.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "enum": ["en", "de", "fr", "es", "nl", "ar"],
                "type": "string"
              },
              "toolIds": {
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["toolIds"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e2f452f277a6cbbffd88fc86986a5fa135ebbe9fb55ef4b2ca54c8568b130329"
        },
        {
