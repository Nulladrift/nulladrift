          },
          "digest": "sha256:53d0978527103accae14c638d3145506160e0ab683f8f1c5dcf6c48817369003"
        }
      ],
      "digest": "sha256:b2fb7c253437ca3afa2af04ef2d6352ffdd640542cd399a5792e55c8323e6c6c"
