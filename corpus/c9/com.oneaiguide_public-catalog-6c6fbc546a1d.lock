          },
          "digest": "sha256:a5ac97479ce7da136dc2047e53d291e4b65182b34cf0d04079fd3d8d9a7cc404"
        },
        {
          "name": "search_tools",
          "description": "Search approved One AI Guide tools with typo-tolerant, singular/plural, and chatbot-aware matching.",
          "inputSchema": {
