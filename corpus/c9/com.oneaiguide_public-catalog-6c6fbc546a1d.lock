{
  "lockfileVersion": 2,
  "subjects": {
    "com.oneaiguide/public-catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://oneaiguide.com/api/mcp/v1"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "one-ai-guide-public",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "compare_tools",
          "description": "Compare 2 to 5 distinct approved tools by UUID or canonical slug. Facts share the public profile's official-source and freshness policy: verified/partial have current support; stale/unknown have no current value. Unknown is not false.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "enum": ["en", "de", "fr", "es", "nl", "ar"],
                "type": "string"
              },
              "toolIds": {
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["toolIds"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1324db1318293f6746efaac52d2363d8e3c54c12e6a49c2bc5e726a48801bd7"
        },
        {
          "name": "get_guide",
          "description": "Get a published guide by slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "enum": ["en", "de", "fr", "es", "nl", "ar"],
                "type": "string"
              },
              "slug": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d09ebdb1ba8ae2f3cc4d211568f09553bd017a3dba76ddc5417e7ec3176b619"
        },
        {
          "name": "get_stack",
          "description": "Get a public approved stack.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "locale": {
                "enum": ["en", "de", "fr", "es", "nl", "ar"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3fdcf0bb8e55fb7b5fce4fa7292d1ba212acf32592a43876c10c9702c3c7961"
        },
        {
          "name": "get_tool",
          "description": "Get one approved tool by UUID or canonical slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "enum": ["en", "de", "fr", "es", "nl", "ar"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16eb573db826bbf49c867626c9776c904f70cd675050dd5c3c4669e2faa79908"
        },
        {
          "name": "list_guides",
          "description": "List published guides linked only to approved tools.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
