          },
          "digest": "sha256:2cf50dee7c5d8f5604ad1f63d0b10d71c1f05dfd07c0564d095770a733d06fbc"
        },
        {
          "name": "list_stacks",
          "description": "List approved public or template stacks whose tools are approved.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "enum": ["en", "de", "fr", "es", "nl", "ar"],
                "type": "string"
