        {
          "name": "get_file",
          "title": "Get file",
          "description": "Fetches a file from a URL and returns it in a format suitable for FastMcP.\n\nThis tool can be used to fetch any file type, including images, PDFs, etc.\nThe framework will handle the encoding and packaging of the file.\n\nScope: one URL per call, with the result returned into the conversation.\nFor many URLs, a whole site, output written to a file or directory,\nresumable jobs, or a scheduled re-run, use the ScrapingBee CLI instead —\n`scrapingbee scrape --input-file urls.txt --output-dir results`,\n`scrapingbee crawl URL --save-pattern ...`, `scrapingbee schedule --every`.\nThis server has no batch, crawl, file-output or scheduling equivalent.\n\nDocs: https://www.scrapingbee.com/documentation/remote-mcp/",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cookies": {
                "default": "",
                "description": "Semicolon-separated cookies to send to the target.",
                "type": "string"
              },
              "country_code": {
                "default": "",
                "description": "ISO 3166-1 alpha-2 country code (e.g. \"fr\", \"us\") to\nroute the request through an IP in that country. Only takes effect\nwhen premium_proxy is True.",
                "type": "string"
              },
              "custom_google": {
                "default": false,
                "description": "Set to True if the url is a google domain in the following\nformat: <subdomain>.google.<top-level-domain>\n(Example: translate.google.com, mail.google.com, www.google.co.in etc)",
                "type": "boolean"
              },
              "device": {
                "default": "desktop",
                "description": "desktop (default) or mobile.",
                "type": "string"
              },
              "premium_proxy": {
                "default": false,
                "description": "Whether to use a premium proxy for the request.\nUse it only if you are getting blocked by the website.",
                "type": "boolean"
              },
              "render_js": {
                "default": false,
                "description": "Whether to use headless-browser rendering (default False).",
                "type": "boolean"
              },
              "session_id": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Integer 0–10000000 to reuse an IP for up to 5 minutes."
              },
              "timeout": {
                "default": 140000,
                "description": "Request timeout in milliseconds (1000–140000, default 140000).",
                "type": "integer"
              },
              "url": {
                "description": "The URL of the file to fetch.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
