          "title": "Ask ChatGPT",
          "description": "This tool allows you to send a prompt to OpenAI's ChatGPT via ScrapingBee\nand get back the generated response.\n\nScope: one query per call. To run many queries in one pass, or to write\nresults to disk instead of into the conversation, use the ScrapingBee CLI —\n`scrapingbee <command> --input-file queries.txt --output-dir results`.",
