        {
          "name": "extract_page_data",
          "title": "Extract page data",
          "description": "Scrape a URL using ScrapingBee and extract specific data using\nCSS or XPath selectors.\n\nScope: one URL per call, with the result returned into the conversation.\nFor many URLs, a whole site, output written to a file or directory,\nresumable jobs, or a scheduled re-run, use the ScrapingBee CLI instead —\n`scrapingbee scrape --input-file urls.txt --output-dir results`,\n`scrapingbee crawl URL --save-pattern ...`, `scrapingbee schedule --every`.\nThis server has no batch, crawl, file-output or scheduling equivalent.\n\nDocs: https://www.scrapingbee.com/documentation/remote-mcp/",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ai_extract_rules": {
                "default": "",
                "description": "JSON string of AI extraction rules.",
                "type": "string"
              },
              "ai_selector": {
                "default": "",
                "description": "CSS selector to focus AI extraction on part of the page.",
                "type": "string"
              },
              "auto_mode": {
                "default": true,
                "description": "On by default — ScrapingBee automatically picks the cheapest\nconfiguration that successfully fetches the page, escalating proxy\nstrength only as needed (you are charged only for the winning\nconfig). To choose a configuration yourself instead, use one of:\nauto_mode=False for the classic tier (no proxy, cheapest),\npremium_proxy=True, or stealth_proxy=True — the two proxy flags\noverride auto_mode on their own, so auto_mode=False is only needed\nfor the classic tier. Setting render_js also switches to manual.",
                "type": "boolean"
              },
              "block_resources": {
                "default": true,
                "description": "Block images/CSS to speed up rendering.",
                "type": "boolean"
              },
              "cookies": {
                "default": "",
                "description": "Semicolon-separated cookies to send to the target.",
                "type": "string"
              },
              "country_code": {
                "default": "",
                "description": "ISO 3166-1 alpha-2 country code (e.g. \"fr\", \"us\") to\nroute the request through an IP in that country. Only takes effect\nwhen premium_proxy or stealth_proxy is True.",
                "type": "string"
              },
              "custom_google": {
                "default": false,
                "description": "Set to True if the url is a google domain in the following\nformat: <subdomain>.google.<top-level-domain>\n(Example: translate.google.com, mail.google.com, www.google.co.in etc)",
                "type": "boolean"
              },
              "device": {
                "default": "desktop",
                "description": "desktop (default) or mobile.",
                "type": "string"
              },
              "extract_rules": {
                "description": "A JSON string defining extraction rules.\n\n          SIMPLE SYNTAX:\n          Use {\"key_name\": \"css_or_xpath_selector\"} format.\n          - CSS selector example: {\"title\": \"h1\", \"price\": \"span.price\"}\n          - XPath selector example:\n                {\"title\": \"//h1\", \"items\": \"//div[@class='item']\"}\n          - Extract attribute value of an element using @<attribute>\n                or if you are using extended syntax <element>@<attribute>,\n                for example: {\"image\": \"img@src\"},\n                \"link\": {\"selector\": \"a\",\"output\": \"@href\"}\n\n          Note: Selectors starting with \"/\" are treated as XPath,\n          otherwise CSS.\n\n          EXTENDED SYNTAX:\n          For more control, use a dict with these options:\n          - \"selector\": CSS or XPath selector string (required)\n          - \"type\": \"item\" (single element, default) or\n                \"list\" (multiple elements)\n          - \"output\": It is also possible to add extraction rules inside\n                the output option in order to create powerful extractors.\n\n          Extended example:\n           {\n                \"title\" : \"h1\",\n                \"subtitle\" : \"#subtitle\",\n                \"articles\": {\n                    \"selector\": \".card\",\n                    \"type\": \"list\",\n                    \"output\": {\n                        \"title\": \".post-title\",\n                        \"link\": {\n                            \"selector\": \".post-title\",\n                            \"output\": \"@href\"\n                        },\n                        \"description\": \".post-description\"\n                    }\n                }\n            }",
                "type": "string"
              },
              "js_scenario": {
                "default": "",
                "description": "Stringified JSON object of browser interaction instructions.",
                "type": "string"
              },
              "json_response": {
                "default": false,
                "description": "Return the full JSON envelope instead of the raw body.",
                "type": "boolean"
              },
              "max_cost": {
                "default": 0,
                "description": "Optional credit ceiling for auto_mode (integer >= 1). The request\nwill not escalate to a configuration costing more than this many credits.\n0 means no ceiling. Ignored unless auto_mode is True.",
                "type": "integer"
              },
              "premium_proxy": {
                "default": false,
                "description": "Manual option: use a premium proxy (middle tier of\nclassic/premium/stealth). Setting this disables auto_mode.",
                "type": "boolean"
              },
              "render_js": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Whether to use headless-browser rendering. Setting this\nexplicitly switches the request to manual configuration\n(disables auto_mode)."
              },
              "session_id": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Integer 0–10000000 to reuse an IP for up to 5 minutes."
              },
              "stealth_proxy": {
                "default": false,
                "description": "Manual option: use a stealth proxy (strongest tier of\nclassic/premium/stealth). Setting this disables auto_mode.",
                "type": "boolean"
              },
              "timeout": {
                "default": 140000,
                "description": "Request timeout in milliseconds (1000–140000, default 140000).",
                "type": "integer"
              },
              "url": {
                "description": "The URL of the page to scrape.",
                "type": "string"
              },
              "wait": {
                "default": 0,
                "description": "Milliseconds to wait after page load (0–35000).",
                "type": "integer"
              },
              "wait_browser": {
                "default": "domcontentloaded",
                "description": "domcontentloaded (default), load, networkidle0, networkidle2.",
                "type": "string"
              },
              "wait_for": {
                "default": "",
                "description": "CSS or XPath selector to wait for before returning.",
                "type": "string"
              },
              "window_height": {
                "default": 1080,
                "description": "Viewport height (default 1080).",
                "type": "integer"
              },
              "window_width": {
                "default": 1920,
                "description": "Viewport width (default 1920).",
                "type": "integer"
              }
            },
            "required": ["extract_rules", "url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:1dcf0d68b406aef6d3ca0958f055ec10548686d8dd06f9aa1a28dbcd4d38daf2"
        },
        {
          "name": "fast_search",
          "title": "Fast web search",
          "description": "Search the web using ScrapingBee's Fast Search API and return structured\nresults. This is the PRIMARY tool for web searches — it returns clean\norganic results and top stories in under one second at a lower credit cost.\n\nUSE THIS TOOL FIRST for any general web search. Only fall back to\nget_google_search_results if you need specialized search types such as\nnews, maps, Google Lens, shopping, image search, or Google AI mode.\n\nScope: one query per call. To run many queries in one pass, or to write\nresults to disk instead of into the conversation, use the ScrapingBee CLI —\n`scrapingbee <command> --input-file queries.txt --output-dir results`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country_code": {
                "default": "us",
                "description": "ISO 3166-1 alpha-2 country code to localize results\n(Example: us, fr, de, in, gb, br, etc.).",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of the search results (Example: en, fr, de, etc.).",
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "The page number to return. Default is 1,\nuse page=2 for the second page, etc.",
                "type": "integer"
              },
              "search": {
                "description": "The search query to use.\nMake sure to URL-encode special characters such as :, & or +.",
                "type": "string"
              },
              "tag": {
                "default": "",
                "description": "Response-header label only.",
                "type": "string"
              }
            },
            "required": ["search"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
