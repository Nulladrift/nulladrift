  "subjects": {
    "com.aiw3b.limitreceipts/plan-fit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://limitreceipts.aiw3b.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "limitreceipts-plan-fit",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "plan_fit ranks published coding-agent prices. tier=full may require x402 payment. This server never signs or pays.",
      "tools": [
        {
          "name": "plan_fit",
          "description": "Rank coding-agent plans from LimitReceipts. tier=free needs no payment and returns one plan with source_url and verified_date. If audience is omitted, tier=free defaults it to individual and tier=full defaults it to any. tier=full requires x402; this server returns the payment requirements and does not sign or pay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Optional filter. Omitted on tier=free defaults to individual. Omitted on tier=full defaults to any. Explicit individual, team, or any is honoured on both tiers.",
                "enum": ["individual", "team", "any"],
                "type": "string"
              },
              "budget": {
                "description": "Optional max monthly USD.",
                "minimum": 0,
                "type": "number"
              },
              "limit": {
                "description": "Full tier only. Default 5, max 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "models": {
                "description": "Optional comma-separated substrings matched against plan models.",
                "type": "string"
              },
              "tier": {
                "description": "free returns one plan. full requires x402 payment.",
                "enum": ["free", "full"],
                "type": "string"
              },
              "type": {
                "description": "Tool kind filter. cli matches cli or both. editor matches editor or both.",
                "enum": ["cli", "editor", "both", "any"],
                "type": "string"
              },
              "usage": {
                "description": "Required usage band.",
                "enum": ["light", "moderate", "heavy"],
                "type": "string"
              }
            },
            "required": ["usage"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c4512cd9076c90cea8b4f65227ae1905e0b7ed2c7cc9eb6c0403d3f43ef0c574"
        },
        {
          "name": "plan_fit_info",
          "description": "Describe plan-fit query params, tiers, price, networks, facilitators, and whether each network has a receiving wallet configured.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
