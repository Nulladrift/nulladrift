            "readOnly": true
          },
          "digest": "sha256:b018a13a9a495f7a8851d59fb6c4d982dfff9787fe4edee1d91d25851eac5176"
        },
        {
          "name": "dealer_competitor_position",
          "title": "Dealer competitor position",
          "description": "Where your ask sits among today's tracked US dealer asks for one product. Example: {\"product\":\"american-gold-eagle-1oz\",\"your_price\":4199,\"payment\":\"bank\"}.",
          "inputSchema": {
