        {
          "name": "melt_value",
          "title": "Melt value and scrap gold calculator",
          "description": "Melt (intrinsic metal) value of any gold, silver or platinum item or scrap jewelry at the latest spot: weight x purity (or gold karat) x spot. Supports troy oz, grams, kilograms and pennyweight, plus an optional buyer offer comparison (% of melt and below-spot warning). Standard tool free; for a version fine-tuned or customized to your business, email for pricing via https://bullionpricecheck.com/contact/.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "karat": 14,
                "weight": 10
              }
            ],
            "properties": {
              "karat": {
                "description": "Gold karat for scrap gold or jewelry (e.g. 10, 14, 18, 22, 24 where 24k=0.999). Use instead of purity.",
                "maximum": 24,
                "minimum": 1,
                "type": "number"
              },
              "metal": {
                "default": "gold",
                "description": "Metal (defaults to gold when karat is given). Palladium is not tracked.",
                "enum": ["gold", "silver", "platinum"],
                "type": "string"
              },
              "offer_usd": {
                "description": "Optional buyer offer in USD to compare against full melt value (returns pct_of_melt).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "purity": {
                "description": "Metal fineness as a fraction (0-1), e.g. 0.999, 0.9167 (22k), 0.925 (sterling), 0.90 (90% coin silver). Defaults to 1 when karat is omitted.",
                "exclusiveMinimum": 0,
                "maximum": 1,
                "type": "number"
              },
              "unit": {
                "description": "Weight unit: ozt = troy ounce (default for bullion), g = gram (default when karat is given), kg = kilogram, dwt = pennyweight.",
                "enum": ["ozt", "g", "kg", "dwt"],
