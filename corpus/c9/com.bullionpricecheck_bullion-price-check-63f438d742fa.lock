        {
          "name": "buyback_compare",
          "title": "Compare firm dealer buyback bids",
          "description": "Compare a bid to recorded dealer buyback bids, spot and melt tiers. Example: {\"product\":\"american-silver-eagle-1oz\",\"caller_bid_usd\":52}.",
          "inputSchema": {
            "$defs": {
              "charge": {
                "additionalProperties": false,
                "properties": {
                  "amount": {
                    "$ref": "#/$defs/money"
                  },
                  "status": {
                    "enum": ["known", "unknown"]
                  }
                },
                "required": ["status"],
                "type": "object"
              },
              "content": {
                "additionalProperties": false,
                "properties": {
                  "fine_ozt": {
                    "$ref": "#/$defs/decimal"
                  },
                  "purity": {
                    "additionalProperties": false,
                    "properties": {
                      "fraction": {
                        "$ref": "#/$defs/decimal"
                      },
                      "karat": {
                        "$ref": "#/$defs/decimal"
                      }
                    },
                    "type": "object"
                  },
                  "weight": {
                    "additionalProperties": false,
                    "properties": {
                      "unit": {
                        "enum": ["g", "dwt", "ozt"]
                      },
                      "value": {
                        "$ref": "#/$defs/decimal"
                      }
                    },
                    "required": ["unit", "value"],
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "decimal": {
                "maxLength": 20,
                "pattern": "^(?:\\d+(?:\\.\\d*)?|\\.\\d+)$",
                "type": "string"
              },
              "identifier": {
                "maxLength": 64,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$",
                "type": "string"
              },
              "money": {
                "additionalProperties": false,
                "properties": {
                  "amount": {
                    "$ref": "#/$defs/decimal"
                  },
                  "currency": {
                    "pattern": "^[A-Za-z]{3}$",
                    "type": "string"
                  }
                },
                "required": ["amount", "currency"],
                "type": "object"
              },
              "product": {
                "additionalProperties": false,
                "properties": {
                  "content": {
                    "$ref": "#/$defs/content"
                  },
                  "form": {
                    "enum": ["bar", "coin", "round", "grain", "other"]
                  },
                  "metal": {
                    "enum": ["gold", "silver", "platinum", "palladium"]
                  },
                  "name": {
                    "maxLength": 121,
                    "type": "string"
                  },
                  "product_id": {
                    "$ref": "#/$defs/identifier"
                  }
                },
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "format": "date-time",
                "type": "string"
              },
              "bids": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bid_id": {
                      "$ref": "#/$defs/identifier"
                    },
                    "dealer_id": {
                      "$ref": "#/$defs/identifier"
                    },
                    "fees": {
                      "$ref": "#/$defs/charge"
                    },
                    "payment_method": {
                      "enum": ["wire", "ach", "check", "cash", "card", "crypto", "other"]
                    },
                    "product": {
                      "$ref": "#/$defs/product"
                    },
                    "quantity": {
                      "$ref": "#/$defs/decimal"
                    },
                    "quantity_basis": {
                      "const": "each"
                    },
                    "quoted_at": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "shipping": {
                      "$ref": "#/$defs/charge"
                    },
                    "unit_bid": {
                      "$ref": "#/$defs/money"
                    }
                  },
                  "required": ["bid_id", "dealer_id", "fees", "payment_method", "product", "quantity", "quantity_basis", "quoted_at", "shipping", "unit_bid"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "caller_bid_usd": {
                "type": ["number", "string"]
              },
              "dealer_id": {
                "type": "string"
              },
              "freshness_max_age_seconds": {
                "type": ["string", "integer", "number"]
              },
              "include_bpc_bids": {
                "default": true,
                "type": "boolean"
              },
              "payment_method": {
                "enum": ["wire", "ach", "check", "cash", "card", "crypto", "other"],
                "type": "string"
              },
              "product": {
                "type": "string"
              },
              "quantity": {
                "type": ["number", "string", "integer"]
              },
              "subject_product": {
                "$ref": "#/$defs/product"
              },
              "your_bid_usd": {
                "type": ["number", "string"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare firm dealer buyback bids"
          },
          "behavior": {
