        {
          "name": "dealer_quote_scenarios",
          "title": "Dealer quote scenarios",
          "description": "For a dealer: up to 3 buy or sell margin scenarios for one tracked product, side by side. Each scenario price uses the quote tool's margin rule on Bullion Price Check spot (sell = melt x (1 + margin_pct/100) + margin_usd; buy = melt x (1 - margin_pct/100) - margin_usd), in exact arithmetic, with the total for the quantity, % of melt, the premium per fine troy oz and per fine gram, the sell-minus-buy spread for each pair, and where each price sits among today's rankable dealer asks (sell) or recorded buyback bids (buy). Only prices within the shared freshness limit are counted (sold-out listings excluded and counted); statistics are medians with their n, and fewer than 3 gives insufficient_data. With a stale or untimed spot the status is spot_stale and every scenario price and placement is null. Placement is withheld (spot_moved) when the dealer prices were checked well before a spot move. Bid statistics need 3 distinct dealers. Placement compares per-unit list prices; volume pricing is not tracked. Weekend and US market holiday labels never relax freshness. Shows the scenarios in the order entered and does not choose between them. Aggregates only, no dealer names. Standard tool free; for a version fine-tuned or customized to your business, email for pricing via https://bullionpricecheck.com/contact/.",
