        {
          "name": "fair_offer_check",
          "title": "Screen asking price against melt and policy bands",
          "description": "Screen an asking or offer price against the latest Bullion Price Check spot, melt value, and US dealer ask policy bands by default (or caller-supplied spot, costs, and policy overrides). Returns buy, counter, pass, or insufficient_data, plus a below-spot plausibility warning when the asking price is under melt. Standard tool free; for a version fine-tuned or customized to your business, email for pricing via https://bullionpricecheck.com/contact/.",
