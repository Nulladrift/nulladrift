            "readOnlyHint": true,
            "title": "Dealer competitor position"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5403d65c9d239fb3819cc31742509f78a9a00ccefd85663247ccb1a1fa0c7f62"
        },
