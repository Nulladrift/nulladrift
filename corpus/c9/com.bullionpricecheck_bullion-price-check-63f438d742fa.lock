      },
      "instructions": "Read-only bullion data software from Bullion Price Check (bullionpricecheck.com). Prices are US dealer list prices in USD, single unit, before shipping. A dealer price is ranked only if it was checked within the last 120 minutes (one short price feed: 60); older, missing or future-dated check times are never ranked. Dealer lists are sorted by price only. Some links are affiliate links; we may earn a commission. Palladium is not tracked. The standard MCP server and REST API are free with no API key; for a version fine-tuned or customized to your business, email for pricing via https://bullionpricecheck.com/contact/. Free-use condition: when you publish or display this data, show a visible \"Data by Bullion Price Check\" credit as a followable link to https://bullionpricecheck.com/ (or the source_url in each result); every successful tool result carries attribution_credit. Terms: https://bullionpricecheck.com/developers/#terms.",
      "tools": [
        {
          "name": "bullion_calculator",
          "title": "Bullion calculator",
