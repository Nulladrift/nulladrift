        {
          "name": "dealer_bid_spread",
          "title": "Dealer bid spread",
          "description": "For tracked bullion products: the lowest and median tracked US dealer ask against recorded published dealer buyback prices, as spreads, plus a fixed Bullion Price Check reference tier (97.5% of melt) that is not a bid and is never used in a spread. Asks and buyback prices are used only when checked within the 120-minute price freshness limit (one short price feed: 60 minutes) with a trusted timestamp; anything older is never used and is counted. A stale or untimed spot gives status spot_stale, and a spot move since the prices were checked gives spot_moved; both null every spot-derived value. Asks and buyback prices come from two snapshots; spreads need them built within 60 minutes of each other, and each pair is dated by its older side. Buyback coverage is small (a few products, often one dealer), so fewer than 3 dealers on a side is thin with low confidence. Zero or negative spreads are shown as observed. Aggregates only, no dealer names; it describes listed prices and makes no recommendation. Standard tool free; for a version fine-tuned or customized to your business, email for pricing via https://bullionpricecheck.com/contact/.",
