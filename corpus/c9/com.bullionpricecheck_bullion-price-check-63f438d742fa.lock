        {
          "name": "dealer_price_opportunity",
          "title": "Unusual premium readings",
          "description": "Finds unusual premiums, discounts and pricing gaps in the current Bullion Price Check tracked market. For each tracked product: today's lowest and median dealer premium over melt (percent and USD per fine troy ounce) and the pricing gap between them, each compared with the product's own daily history. Lists high_premiums (unusually high premium), discounts (unusually low premium against the product's own history) and pricing_gaps (unusually wide spread between the lowest and median offer). Listed only with at least 30 history days AND |z| >= 3, where z uses a spread floor of 0.25 pp and is shown capped at 5, AND at least minimum_deviation_pp from the history median; with fewer days nothing is listed. Products are held back (held_back, with reasons, never listed) when, at any dealer price used, spot moved at least spot_move_hold_pct (default 0.5%) since that price's time (spot_moved) or that move cannot be checked (spot_move_unknown), because dealer prices lag spot; when the usually cheapest dealer has no fresh price today or fewer than 80% of the usual dealers do; or when the stored history is old. period_days 1: day-over-day against yesterday's daily median, low-confidence, in day_over_day_changes only. Uses only in-stock bank (check/ACH/wire) offers within the 120-minute price freshness limit and a spot price within its 120-minute limit. A description of the market, not advice; no dealer names.  States the date each product's stored history reaches 30 days (history_reaches_30_days_on); the 30-day listing rule is not lowered and history is not backfilled.Standard tool free; for a version fine-tuned or customized to your business, email for pricing via https://bullionpricecheck.com/contact/.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "metal": "all",
                "period_days": 30
              },
              {
                "metal": "silver",
                "minimum_deviation_pp": 1,
                "period_days": 7
              },
              {
                "metal": "gold",
                "period_days": 1
              },
              {
                "metal": "gold",
                "period_days": 30,
                "spot_move_hold_pct": 1
              }
            ],
            "properties": {
              "metal": {
                "default": "all",
                "description": "gold, silver, platinum or all (default). Palladium is not tracked.",
                "enum": ["gold", "silver", "platinum", "all"],
                "type": "string"
              },
              "minimum_deviation_pp": {
                "default": 0.5,
                "description": "Smallest difference from the reference (history median, or yesterday for period_days 1), in percentage points, for a product to be listed. Default 0.5.",
                "maximum": 50,
                "minimum": 0,
                "pattern": "^(?:\\d+(?:\\.\\d+)?|\\.\\d+)$",
                "type": ["number", "string"],
                "x-decimal": true
              },
              "period_days": {
                "default": 30,
                "description": "History to compare with: 1 (yesterday only, day over day, low-confidence, never listed), 7 or 30 (default) calendar days before today (America/New_York). Listing needs 30 history days.",
                "enum": [1, 7, 30],
                "type": "integer"
              },
              "spot_move_hold_pct": {
                "default": 0.5,
                "description": "Spot move at any dealer price used (spot at that price's time vs the current spot), in percent (either direction), at or above which a product is held back instead of listed (dealer prices lag spot). Default 0.5.",
                "maximum": 20,
                "minimum": 0.1,
                "pattern": "^(?:\\d+(?:\\.\\d+)?|\\.\\d+)$",
                "type": ["number", "string"],
                "x-decimal": true
              }
            },
            "type": "object"
          },
