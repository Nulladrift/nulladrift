          "name": "bullion_trends_snapshot",
          "title": "Historical bullion search-interest snapshot",
          "description": "Read one persisted US Google Trends dealer search-interest series by plain keyword (e.g. \"gold price\", \"silver price\", \"1 oz gold bar price\", \"sell gold coins\", \"buy silver rounds\", \"american eagle silver coin price\", \"canadian maple leaf silver coin price\") or by query_id; zero network calls. Returns 0–100 relative search-interest scores (NOT search volume, unit sales, demand, or price forecasts) and always reports the data age (as_of, data_age_days, observation_age_days, stale, freshness). Standard tool free; for a version fine-tuned or customized to your business, email for pricing via https://bullionpricecheck.com/contact/.",
