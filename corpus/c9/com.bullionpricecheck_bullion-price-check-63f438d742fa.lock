        {
          "name": "inventory_aging_exposure",
          "title": "Inventory aging, carry cost and melt exposure",
          "description": "Value bullion inventory lots and compute aging buckets, carry cost, melt exposure, and US dealer market ask/bid totals using Bullion Price Check's latest spot and dealer data by default (or caller-supplied spot, carry rate, and position overrides). Accepts either shorthand lots (product, quantity, cost_basis_usd) or detailed positions. Under the lots shorthand, carry_annual_rate defaults to 0 (no carry cost unless you pass a rate); detailed positions default to 0.08. Standard tool free; for a version fine-tuned or customized to your business, email for pricing via https://bullionpricecheck.com/contact/.",
          "inputSchema": {
            "$defs": {
              "content": {
                "additionalProperties": false,
                "properties": {
                  "fine_ozt": {
                    "$ref": "#/$defs/decimal"
                  },
                  "purity": {
                    "additionalProperties": false,
                    "properties": {
                      "fraction": {
                        "$ref": "#/$defs/decimal"
                      },
                      "karat": {
                        "$ref": "#/$defs/decimal"
                      }
                    },
                    "type": "object"
                  },
                  "weight": {
                    "additionalProperties": false,
                    "properties": {
                      "unit": {
                        "enum": ["g", "dwt", "ozt"]
                      },
                      "value": {
                        "$ref": "#/$defs/decimal"
                      }
                    },
                    "required": ["unit", "value"],
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "decimal": {
                "maxLength": 20,
                "pattern": "^(?:\\d+(?:\\.\\d*)?|\\.\\d+)$",
                "type": "string"
              },
              "identifier": {
                "maxLength": 64,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$",
                "type": "string"
              },
              "money": {
                "additionalProperties": false,
                "properties": {
                  "amount": {
                    "$ref": "#/$defs/decimal"
                  },
                  "currency": {
                    "pattern": "^[A-Za-z]{3}$",
                    "type": "string"
                  }
                },
                "required": ["amount", "currency"],
                "type": "object"
              },
              "spotEntry": {
                "additionalProperties": false,
                "properties": {
                  "as_of": {
                    "maxLength": 40,
                    "type": "string"
                  },
                  "price_per_fine_ozt": {
                    "$ref": "#/$defs/money"
                  },
                  "source": {
                    "$ref": "#/$defs/identifier"
                  }
                },
                "required": ["as_of", "price_per_fine_ozt", "source"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "examples": [
              {
                "lots": [
                  {
                    "cost_basis_usd": 500,
                    "product": "american-silver-eagle-1oz",
                    "quantity": 10
                  }
                ]
              }
            ],
            "properties": {
              "age_buckets": {
                "description": "Pass \"documented_default\" (default) or custom bucket list.",
                "oneOf": [
                  {
                    "const": "documented_default"
                  },
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "max_days": {
                          "oneOf": [
                            {
                              "$ref": "#/$defs/decimal"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "min_days": {
                          "$ref": "#/$defs/decimal"
                        },
                        "name": {
                          "$ref": "#/$defs/identifier"
                        }
                      },
                      "required": ["max_days", "min_days", "name"],
                      "type": "object"
                    },
                    "maxItems": 12,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "as_of": {
                "description": "Evaluation timestamp (ISO-8601). Defaults to live BPC refresh time.",
                "format": "date-time",
                "type": "string"
              },
              "carry_annual_rate": {
                "description": "Annual carry rate as a decimal (for example \"0.08\" for 8%). Defaults to 0 under the lots shorthand, and to \"0.08\" when you send detailed positions.",
                "type": ["string", "number"]
              },
              "day_count": {
                "default": "actual_365",
                "description": "Day-count convention for carry cost. Only actual_365.",
                "enum": ["actual_365"],
                "type": "string"
              },
              "lots": {
                "description": "Shorthand inventory lots (tracked product slug/name, quantity, optional cost_basis_usd). When you use lots (and not positions), carry_annual_rate defaults to 0.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "acquired_on": {
                      "type": "string"
                    },
                    "cost_basis_usd": {
                      "type": ["number", "string"]
                    },
                    "position_id": {
                      "type": "string"
                    },
                    "product": {
                      "type": "string"
                    },
                    "quantity": {
                      "type": ["integer", "number", "string"]
                    },
                    "sku": {
                      "type": "string"
                    },
                    "unit_acquisition_cost": {
                      "type": ["number", "string", "object"]
                    }
                  },
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "positions": {
                "description": "Inventory positions (or pass lots shorthand).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "acquired_on": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "content": {
                      "$ref": "#/$defs/content"
                    },
                    "metal": {
                      "enum": ["gold", "silver", "platinum", "palladium"]
                    },
                    "position_id": {
                      "$ref": "#/$defs/identifier"
                    },
                    "quantity": {
                      "$ref": "#/$defs/decimal"
                    },
                    "sku": {
                      "$ref": "#/$defs/identifier"
                    },
                    "unit_acquisition_cost": {
                      "$ref": "#/$defs/money"
                    }
                  },
                  "required": ["acquired_on", "content", "metal", "position_id", "quantity", "sku", "unit_acquisition_cost"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "sensitivity": {
                "additionalProperties": false,
                "description": "Optional what-if grid: carry_annual_rates and named spot_shocks (multipliers).",
                "properties": {
                  "carry_annual_rates": {
                    "items": {
                      "$ref": "#/$defs/decimal"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "spot_shocks": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "multiplier": {
                          "$ref": "#/$defs/decimal"
