        {
          "name": "dealer_product_demand",
          "title": "Dealer search interest (Google Trends)",
          "description": "Google Trends US search interest for bullion terms (generic gold and silver price searches, product terms and buy/sell terms) from Bullion Price Check's stored weekly snapshot: latest week, 4-week averages and change, peak and low. It is search interest only, not sales, orders or inventory demand. A term needs at least 8 stored weeks (else insufficient_history) and at least 8 non-zero weeks with a peak of 5 (else low_signal); terms that round to 0 in every week are no_signal; all of these return null values, never zero demand. On the current snapshot only the generic gold price and silver price terms carry a signal. Shows the snapshot's retrieval age and flags it stale after 7 days or when the latest week is more than 14 days old. No live calls; it makes no recommendation. Standard tool free; for a version fine-tuned or customized to your business, email for pricing via https://bullionpricecheck.com/contact/.",
