                      "fraction": {
                        "$ref": "#/$defs/decimal"
                      },
                      "karat": {
                        "$ref": "#/$defs/decimal"
                      }
                    },
                    "type": "object"
                  },
                  "weight": {
                    "additionalProperties": false,
                    "properties": {
                      "unit": {
                        "enum": ["g", "dwt", "ozt"]
                      },
                      "value": {
                        "$ref": "#/$defs/decimal"
                      }
                    },
                    "required": ["unit", "value"],
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "decimal": {
                "maxLength": 20,
                "pattern": "^(?:\\d+(?:\\.\\d*)?|\\.\\d+)$",
                "type": "string"
              },
              "identifier": {
                "maxLength": 64,
