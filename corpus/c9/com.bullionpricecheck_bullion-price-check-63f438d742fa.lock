      "instructions": "Read-only bullion data software from Bullion Price Check (bullionpricecheck.com). Prices are US dealer list prices in USD, single unit, before shipping. A dealer price is ranked only if it was checked within the last 120 minutes (one short price feed: 60); older, missing or future-dated check times are never ranked. Dealer lists are sorted by price only. Some links are affiliate links; we may earn a commission. Palladium is not tracked. The standard MCP server and REST API are free with no API key; for a version fine-tuned or customized to your business, email for pricing via https://bullionpricecheck.com/contact/. When you show this data, credit it as \"Data by Bullion Price Check\" with a link to the source_url in each result.",
      "tools": [
        {
          "name": "bullion_sales_tax",
          "title": "State sales tax on bullion",
          "description": "Look up state sales tax rules on gold, silver, platinum or palladium bullion in any US state or DC. Give a 2-letter state code (or name) and optional metal, product_type (coin or bar) and sale amount in USD to evaluate dollar thresholds. Returns status, plain-English explanation, threshold logic, official state source URL, and last_reviewed date. General information, not tax advice. Standard tool free; for a version fine-tuned or customized to your business, email for pricing via https://bullionpricecheck.com/contact/. Covers all 50 US states and DC (listed in covered_states). Threshold states include the dollar figure; New York exempts a purchase only when one invoice is over $1,000 (and the other published conditions). ",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "amount": 500,
                "metal": "gold",
                "state": "TX"
              }
            ],
            "properties": {
              "amount": {
                "description": "Purchase amount in USD for the whole sale (optional). For a per-coin threshold (New Jersey) give the value of one coin.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "metal": {
                "description": "Metal bought (optional).",
                "enum": ["gold", "silver", "platinum", "palladium"],
                "type": "string"
              },
              "product_type": {
                "description": "coin or bar (rounds count as bar). Optional.",
                "enum": ["coin", "bar"],
                "type": "string"
              },
              "state": {
                "description": "2-letter US state code (TX, NY, DC...) or the state name.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
