        {
          "name": "dealer_feed_validate",
          "title": "Validate dealer offer feed",
          "description": "Validate dealer product and offer records against the latest Bullion Price Check spot and catalog specs by default (or caller-supplied overrides). Flags stale quotes, below-melt offers, unknown stock, missing payment methods, and quantity-tier conflicts, and evaluates scoped cheapest claims (requiring >=2 distinct dealers with fresh, in-stock, single-unit, same-payment offers). Standard tool free; for a version fine-tuned or customized to your business, email for pricing via https://bullionpricecheck.com/contact/.",
          "inputSchema": {
            "$defs": {
              "content": {
                "additionalProperties": false,
                "properties": {
                  "fine_ozt": {
                    "$ref": "#/$defs/decimal"
                  },
                  "purity": {
                    "additionalProperties": false,
                    "properties": {
                      "fraction": {
                        "$ref": "#/$defs/decimal"
                      },
                      "karat": {
                        "$ref": "#/$defs/decimal"
                      }
                    },
                    "type": "object"
                  },
                  "weight": {
                    "additionalProperties": false,
                    "properties": {
                      "unit": {
                        "enum": ["g", "dwt", "ozt"]
                      },
                      "value": {
                        "$ref": "#/$defs/decimal"
                      }
                    },
                    "required": ["unit", "value"],
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "decimal": {
                "maxLength": 20,
                "pattern": "^(?:\\d+(?:\\.\\d*)?|\\.\\d+)$",
                "type": "string"
              },
              "identifier": {
                "maxLength": 64,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$",
                "type": "string"
              },
              "money": {
                "additionalProperties": false,
                "properties": {
                  "amount": {
                    "$ref": "#/$defs/decimal"
                  },
                  "currency": {
                    "pattern": "^[A-Za-z]{3}$",
                    "type": "string"
                  }
                },
                "required": ["amount", "currency"],
                "type": "object"
              },
              "product": {
                "additionalProperties": false,
                "properties": {
                  "content": {
                    "$ref": "#/$defs/content"
                  },
                  "form": {
                    "enum": ["bar", "coin", "round", "grain", "other"]
                  },
                  "metal": {
                    "enum": ["gold", "silver", "platinum", "palladium"]
                  },
                  "name": {
                    "maxLength": 121,
                    "type": "string"
                  },
                  "product_id": {
                    "$ref": "#/$defs/identifier"
                  }
                },
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "examples": [
              {
                "records": [
                  {
                    "dealer_id": "shop-a",
                    "offer": {
                      "unit_price": 4260
                    },
                    "product": "american-gold-eagle-1oz"
                  }
                ]
              }
            ],
            "properties": {
              "as_of": {
                "description": "Evaluation timestamp (ISO-8601). Defaults to Bullion Price Check latest price refresh when omitted.",
                "format": "date-time",
                "type": "string"
              },
              "freshness_max_age_seconds": {
                "description": "Maximum quote age in seconds (defaults to \"86400\" = 24 hours).",
                "type": ["string", "integer", "number"]
              },
              "payment_scope": {
                "description": "Optional payment method scope.",
                "enum": ["wire", "ach", "check", "cash", "card", "crypto", "other"],
                "type": "string"
              },
              "records": {
                "description": "Dealer offer records to validate and compare against live BPC melt.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "dealer_id": {
                      "$ref": "#/$defs/identifier"
                    },
                    "offer": {
                      "additionalProperties": false,
                      "properties": {
                        "payment_methods": {
                          "items": {
                            "enum": ["wire", "ach", "check", "cash", "card", "crypto", "other"]
                          },
                          "type": "array"
                        },
                        "quantity_tiers": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "max_qty": {
                                "oneOf": [
                                  {
                                    "$ref": "#/$defs/decimal"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ]
                              },
                              "min_qty": {
                                "$ref": "#/$defs/decimal"
                              },
                              "unit_price": {
                                "$ref": "#/$defs/money"
                              }
                            },
                            "required": ["max_qty", "min_qty", "unit_price"],
                            "type": "object"
                          },
                          "maxItems": 10,
                          "type": "array"
                        },
                        "quoted_at": {
                          "maxLength": 40,
                          "type": "string"
                        },
                        "stock": {
                          "additionalProperties": false,
                          "properties": {
                            "quantity": {
                              "$ref": "#/$defs/decimal"
                            },
                            "status": {
                              "enum": ["in_stock", "out_of_stock", "unknown"]
                            }
                          },
                          "required": ["status"],
                          "type": "object"
                        },
                        "unit_price": {
                          "oneOf": [
                            {
                              "type": ["number", "string"]
