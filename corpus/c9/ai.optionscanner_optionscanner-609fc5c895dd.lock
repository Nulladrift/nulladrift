            "properties": {
              "contracts": {
                "default": 1,
                "description": "Number of contracts, 100 shares each. Default 1.",
                "maximum": 100000,
                "minimum": 1,
                "title": "Contracts",
                "type": "integer"
              },
              "days": {
                "anyOf": [
                  {
                    "maximum": 3650,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Days to expiration, for the chance of profit. Optional.",
                "title": "Days"
              },
              "iv_pct": {
                "anyOf": [
                  {
                    "maximum": 1000,
