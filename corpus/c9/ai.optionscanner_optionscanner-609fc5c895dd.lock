                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Implied volatility, percent per year, for the chance of profit. Optional.",
                "title": "Iv Pct"
              },
              "premium": {
                "description": "Premium received per share, in dollars.",
                "maximum": 10000000,
                "title": "Premium",
                "type": "number"
              },
              "price": {
                "description": "Stock price in dollars.",
                "maximum": 10000000,
                "title": "Price",
