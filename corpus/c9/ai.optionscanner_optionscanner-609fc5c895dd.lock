      "instructions": "Optionscanner's free options calculators and Learn library, for any assistant. Tools price multi-leg trades (profit_calculator, what_if, list_strategies), compute the expected move, credit and debit spread figures, covered call, cash-secured put and iron condor figures, probability of profit and position size, and search or read the Learn articles, glossary and research. Every figure is a model estimate for education, before commissions and fees. The server holds no account data and places no orders. Each result carries the page on optionscanner.ai it came from; show that link with the numbers.",
