        {
          "name": "cash_secured_put",
          "title": "Cash-secured put calculator",
          "description": "Cash-secured put figures: cash set aside, premium income, breakeven and effective purchase price if assigned, the discount to the stock price, return on the cash, maximum loss, and the model's chance of finishing above the breakeven when implied volatility and days are given.",
