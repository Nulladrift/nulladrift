        {
          "name": "profit_calculator",
          "title": "Options profit calculator",
          "description": "Price any options trade with up to eight legs: maximum profit and loss, breakevens, net credit or debit, the model's chance of profit at expiration and the expected move. Pass a strategy name (for example iron_condor or bull_put_spread) to build standard legs from the stock price, or pass the legs yourself with strikes and prices. Ask it for the max loss on a spread, the breakeven on a straddle, or the chance a condor finishes profitable. Returns a link that opens the same trade in the Optionscanner calculator.",
          "inputSchema": {
            "$defs": {
              "LegIn": {
                "properties": {
                  "days": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "This leg's own days to expiration, when it differs from the trade's.",
                    "title": "Days"
                  },
                  "iv_pct": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "This leg's own implied volatility in percent, when it differs from the trade's.",
                    "title": "Iv Pct"
                  },
                  "premium": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Price per share at entry. Estimated from volatility when omitted.",
                    "title": "Premium"
                  },
                  "qty": {
                    "default": 1,
                    "description": "Contracts for an option leg, shares for a stock leg.",
                    "exclusiveMinimum": 0,
                    "title": "Qty",
                    "type": "number"
                  },
                  "side": {
                    "enum": ["buy", "sell"],
                    "title": "Side",
                    "type": "string"
                  },
                  "strike": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Strike price in dollars. Required for a call or put.",
                    "title": "Strike"
                  },
                  "type": {
                    "enum": ["call", "put", "stock"],
                    "title": "Type",
                    "type": "string"
                  }
                },
                "required": ["side", "type"],
                "title": "LegIn",
                "type": "object"
              }
            },
            "properties": {
              "days": {
                "description": "Days to expiration.",
                "title": "Days",
                "type": "number"
              },
              "iv_pct": {
                "description": "Implied volatility, percent per year (30 means 30 percent).",
                "title": "Iv Pct",
                "type": "number"
              },
              "legs": {
                "anyOf": [
                  {
                    "items": {
                      "$ref": "#/$defs/LegIn"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The legs of the trade, up to eight. Each has a side (buy or sell), a type (call, put or stock), a strike for options, a quantity, and optionally the price per share paid or received; a missing price is estimated from the implied volatility.",
                "title": "Legs"
