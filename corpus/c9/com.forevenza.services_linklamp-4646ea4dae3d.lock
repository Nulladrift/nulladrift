          "name": "submit_request",
          "title": "Send Linklamp a requirement",
          "description": "Send Linklamp a requirement (Switch swap or repatch visit in Dearborn, MI, under your remote engineer). The request is recorded with a reference at once. Linklamp reads the scope, open questions and any words kept as written, then prices and schedules the visit and emails a proposal: visit duties, exclusions, price and a proposed time inside the client's window. Without an email address the request is still recorded, reply_by_email is listed in missing_specifications, and no proposal can be sent until an address is given in a continuation. Nothing is ordered, booked or committed until the buyer agrees terms; a time is confirmed only on the appointment status page, after a provider confirms it. Contact details are kept apart from the requirement, while we correspond or do business and for 24 months after, so a later request picks up where it left off; ask us to delete them at any time. It is answered with a receipt: keep its id and token to read its status (request_status), to add details later (continuation) and to act on an offer made in reply. A requirement is not an order and costs nothing.",
