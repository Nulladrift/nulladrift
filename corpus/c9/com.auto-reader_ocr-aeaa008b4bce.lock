{
  "lockfileVersion": 2,
  "subjects": {
    "com.auto-reader/ocr": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.auto-reader.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "auto-reader-ocr",
        "title": "Auto-Reader OCR — Arabic-first OCR & translation",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Auto-Reader OCR extracts text from images (GPU OCR) and translates it across 13+ languages. It is Arabic-first (Arabic/Persian/Urdu accuracy is its strength), manga-aware for vertical Japanese, and auto-detects the script/language when you pass lang=\"auto\". No account setup is needed: any tool that requires a key will auto-provision a free trial key on first use and return it to you — pass that key as the api_key argument on later calls, or set an Authorization: Bearer header. Use create_api_key with an email for the larger free tier, and get_usage to watch your remaining credits. When a call reports being out of credits, the error carries a prefilled checkout link to hand to your human.",
      "tools": [
        {
          "name": "create_api_key",
          "description": "Provision a new Auto-Reader OCR API key instantly, with no human steps. Pass an optional email to unlock the larger free tier (about 100 credits/day, vs about 50/day for an email-less trial key). Store the returned key and pass it as api_key on future calls.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Optional email to attach for the larger free tier and a verification link.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:69f4796cf3ac844807389d9e96514c487c42f2a10b722606c44b6feb33ee4809"
        },
        {
          "name": "extract_document",
          "description": "Extract STRUCTURED FIELDS from a document image: invoices, receipts, ID cards — or any custom JSON schema you supply. Every field returns {value, confidence, box} where the confidence and box come from the OCR geometry (never model guesswork); absent fields are null. preset=\"zatca\" additionally decodes the Saudi ZATCA e-invoice QR (TLV) and cross-validates it against the printed fields — use it for Saudi tax invoices. Arabic-first accuracy. 2 credits/page (zatca 4).",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional Auto-Reader OCR key (nsk_live_...). If omitted, a free trial key is auto-provisioned and returned to you in the result.",
                "type": "string"
              },
              "image_base64": {
                "description": "The document image as base64 (data: URI prefix accepted).",
                "type": "string"
              },
              "lang": {
                "default": "auto",
                "description": "Language hint; default auto.",
                "type": "string"
              },
              "preset": {
                "description": "Built-in schema. Use zatca for Saudi e-invoices (adds QR validation).",
                "enum": ["invoice", "receipt", "id", "zatca"],
                "type": "string"
              },
              "schema": {
                "description": "Custom extraction schema instead of a preset: an object whose keys are the fields you want, values describing them, e.g. {\"policy_number\": \"string|null\"}.",
                "type": "object"
              }
            },
            "required": ["image_base64"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:efd6f44d2375febc2854fe4699c32d77d1160ae16c2933e1566f03e7bfaacdba"
        },
        {
          "name": "get_usage",
          "description": "Check your Auto-Reader OCR key: tier, remaining daily free credits, prepaid credit balance, subscription allowance, and per-minute rate limit. Use it to throttle yourself before hitting a limit.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional key (nsk_live_...). Auto-provisioned if omitted.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:afdc3ddeb100f8508cf306dd7a3c3017d58b9b349c1ed66e8b5e4b031a8ad327"
        },
        {
          "name": "ocr_and_translate",
          "description": "One call: OCR an image, then translate every line into target_lang. Arabic-first OCR and manga-aware Japanese with right-to-left-aware layout, followed by LLM translation. Automatic source-language detection. Provide the image as base64. Ideal for reading foreign documents, signs, manga, or receipts end-to-end in a single step.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional key (nsk_live_...). Auto-provisioned if omitted.",
                "type": "string"
              },
              "image_base64": {
                "description": "The image encoded as base64 (a data: URI prefix is accepted and stripped).",
                "type": "string"
              },
              "target_lang": {
                "description": "Language to translate into, as a name or code (e.g. English, ar, ja).",
                "type": "string"
              }
            },
            "required": ["image_base64", "target_lang"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8f047d5917ba4f758eda4e893d3a9bbc52c2e69295777b15c5c4434b92f8f628"
        },
        {
          "name": "ocr_image",
          "description": "Extract text from an image with GPU OCR. Best-in-class Arabic (plus Persian/Urdu) accuracy, manga-aware vertical Japanese, and strong English, French, Spanish, German, Chinese, Korean, Russian, Italian and Portuguese — 13+ languages. Automatic language and script detection with lang=\"auto\". Returns reading-order layout text (right-to-left aware, paragraph-gapped) that is ready to feed an LLM or show a human, plus the detected language, the engine used, and the number of text blocks found. Provide the image as base64. Use the mode hint (document | receipt | manga | scene) to tune detection.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional Auto-Reader OCR key (nsk_live_...). If omitted, a free trial key is auto-provisioned and returned to you in the result.",
                "type": "string"
              },
              "image_base64": {
                "description": "The image encoded as base64 (a data: URI prefix is accepted and stripped).",
                "type": "string"
              },
              "lang": {
                "default": "auto",
                "description": "Language/script hint. Default \"auto\" detects it. Codes: ar, fa, ur, en, fr, es, de, ja, zh, ko, ru, it, pt.",
                "type": "string"
              },
              "mode": {
                "default": "document",
                "description": "Content hint that tunes detection and prompts. Default \"document\".",
                "enum": ["document", "receipt", "manga", "scene"],
                "type": "string"
              },
              "quality": {
                "default": "standard",
                "description": "\"standard\" (default) lets a confidence gate decide whether the vision model re-reads the page. \"high\" always re-reads it — use when accuracy matters more than cost or latency (costs 2 extra credits and adds a few seconds). You are charged the extra ONLY when it actually applies: check quality_applied in the result, and notice tells you why if it is false (receipt mode, a manga-engine page, an out-of-scope language, or the vision read failing its quality guards).",
                "enum": ["standard", "high"],
                "type": "string"
              }
            },
            "required": ["image_base64"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fb7296b3a923546ab39edcb840fe4f5d8f197213cd321e2911f02da65e459425"
        },
        {
          "name": "read_manga",
          "description": "OCR a comic/manga page, routed by LANGUAGE (not the blanket \"manga = Japanese\" assumption). Japanese goes to the manga specialist reader that reads vertical, hand-lettered speech bubbles in right-to-left order; Korean manhwa, Chinese manhua and other scripts use their own OCR pack; low-confidence pages escalate to the vision model. Returns text blocks in reading order plus the detected language, the engine used, and whether the page is vertical. Provide the image as base64. Pass lang explicitly (ko/zh/...) for the best non-Japanese result; default \"auto\" detects it.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional Auto-Reader OCR key (nsk_live_...). If omitted, a free trial key is auto-provisioned and returned to you in the result.",
                "type": "string"
              },
              "image_base64": {
                "description": "The manga/comic page as base64 (a data: URI prefix is accepted and stripped).",
                "type": "string"
              },
              "lang": {
                "default": "auto",
                "description": "Language hint. Default \"auto\". Codes: ja (manga specialist), ko, zh, ar, en, fr, es, de, ru, it, pt.",
                "type": "string"
              }
            },
            "required": ["image_base64"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b54ae023e67270a99083364ad2dea31fb6f8ea1cb5171ead4fdc4ab64c1644a9"
        },
        {
          "name": "translate_text",
          "description": "Translate text between 13+ languages with an LLM. Arabic-first quality, with formality control (formal/informal) and optional context to disambiguate meaning. Handles both short dictionary-style word lookups and full documents. Returns the translation and, when available, alternative phrasings. For a WHOLE book (EPUB/DOCX/TXT/PDF), use the REST API instead: upload with POST /v1/illustrate/book/analyse, then POST /v1/text-book {analysis_id, mode: translate|rewrite|extract} (1 credit per 3,000 chars; see /llms.txt).",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional key (nsk_live_...). Auto-provisioned if omitted.",
                "type": "string"
              },
              "context": {
                "description": "Optional background text that improves accuracy (it is not translated).",
                "type": "string"
              },
              "formality": {
                "description": "Optional register for the output.",
                "enum": ["formal", "informal"],
                "type": "string"
              },
              "target_lang": {
                "description": "Target language, as a name or code (e.g. English, Arabic, ar, ja, fr).",
                "type": "string"
              },
              "text": {
                "description": "The text to translate.",
                "type": "string"
              }
            },
            "required": ["target_lang", "text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5a168670d07f87f6c7024ee034443134ed71c612f80c8fc0569ea057d805904b"
        }
      ],
      "digest": "sha256:094a882011a58d9f1749a1c8b735181a731404aeebaf93711330586a4a68a862"
    }
  }
}
