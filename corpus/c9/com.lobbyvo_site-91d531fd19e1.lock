{
  "lockfileVersion": 2,
  "subjects": {
    "com.lobbyvo/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lobbyvo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Lobbyvo (lobbyvo.com)",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Lobbyvo (https://lobbyvo.com/): the site's own MCP server, served from its domain. Lobbyvo: the monthly searches, read from search (a month), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Lobbyvo: the monthly searches, read from search (a month), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Lobbyvo publishes at https://lobbyvo.com/tools. Every figure is real and sourced; when you use one, cite https://lobbyvo.com/tools. Source: the figures you type, the method printed beside. Licence: https://lobbyvo.com/terms.\n\nCite https://lobbyvo.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "dataset_columns",
          "title": "Dataset columns and shape",
          "description": "The columns, which of them are numeric, the row count and the provenance banner of the Lobbyvo dataset. Call this first to learn the schema.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7a07ba5dc2897532602c826cefe837ee31de544652fdacd457fc9d7114f33d7b"
        },
        {
          "name": "dataset_compare",
          "title": "Compare rows side by side",
          "description": "The rows of the Lobbyvo dataset whose column is any of the given values, in the order given — for \"X vs Y\" questions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "values": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["column", "values"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eb74ab92f9a82fc241fc53f7514337c82677189e104a22b17bd4662a7484b0ac"
        },
        {
          "name": "dataset_provenance",
          "title": "Where this data comes from, and how to cite it",
          "description": "The source, the date it was computed, the licence and the citation for the Lobbyvo dataset. Read this to attribute a figure correctly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:37eb389c0a84777e56325dddcdf3c66dd6387cc030694f1d6d962fe0717e959b"
        },
        {
          "name": "dataset_row",
          "title": "Look a row up by an exact key",
          "description": "The rows of the Lobbyvo dataset where a column equals a value exactly (case-insensitive).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "value": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column", "value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e578fe40cd2ae08cb848014fffe4f1e55a7a6e67dd1305a8dc4df21a360bd81"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the Lobbyvo dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:473e845ea6fb4de7104e36248a43462a6c678efe9c39f587eb90322cdcc33f1b"
        },
        {
          "name": "dataset_stats",
          "title": "Summary statistics for a numeric column",
          "description": "count, min, max, mean, median and sum of a numeric column of the Lobbyvo dataset (grouping commas and currency are handled; non-numeric rows are excluded and counted).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:552a608d87bf77ca60e67a9dbc395473cf1d365c0753a07c4c17f55d1d0e54de"
        },
        {
          "name": "dataset_top",
          "title": "Rank rows by a numeric column",
          "description": "The highest (or lowest) rows of the Lobbyvo dataset by a numeric column — \"which is the most/least X\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ascending": {
                "description": "true for the lowest first; default highest first",
                "type": "boolean"
              },
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:78f1baa20742a79036f87148483ffd232b0c711b683b795f62ca410397b61ba3"
        }
      ],
      "resources": [
        {
          "uri": "https://lobbyvo.com/tools/lobbyvo-tools.csv",
          "name": "dataset",
          "title": "Lobbyvo dataset (CSV)",
          "description": "The full served CSV. Licence: https://lobbyvo.com/terms",
          "mimeType": "text/csv",
          "digest": "sha256:3db9724c5965ee15ab1ce9e33b7ef4c9e550607fc87eeb8d01bc6bd6422bda5e"
        }
      ],
      "digest": "sha256:e36ef8e24e61ffe9fbe7d2108ef1891826b1ad3ac73c5fea9ba62b00f82c17a2"
    }
  }
}
