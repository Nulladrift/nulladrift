{
  "lockfileVersion": 2,
  "subjects": {
    "com.asinrating/asinrating": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://asinrating.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "asinrating",
        "title": "ASIN Rating",
        "version": "dev",
        "websiteUrl": "https://asinrating.com"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ASIN Rating is a read-only product fact database for Amazon US.\nUse list_categories to discover covered leaf categories, get_sub_category_brief for a category brief,\nget_top100 for the platform public ranking, get_product for the nine-section product dossier,\nsearch_products for literal product/brand/model search, compare_products for side-by-side facts,\nget_price and get_price_change for stored price history, get_brand for brand aggregates,\nrequest for field-filtered product data, and scrap_page for a live price snapshot.\n\nEvery result carries a meta block with as_of, confidence, basis and coverage where applicable.\nRankings are the platform public order, not a recommendation. Missing data is reported as 暂无数据;\nnever infer a zero, an estimate, or a substitute product.",
      "tools": [
        {
          "name": "compare_products",
          "title": "Compare Products",
          "description": "Place 2 to 5 products side by side in a fixed dimension order. Missing values remain 暂无数据; no winner or recommendation is produced.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asins": {
                "description": "2 to 5 distinct 10-character ASINs",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["asins"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare Products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d41ee99eae442a4c830f7276d4b51b6a1a77cb043f839f4a9106bd2a8fb3637"
        },
        {
          "name": "get_brand",
          "title": "Get Brand",
          "description": "Return brand registry aggregates: product count, complete-profile count, category distribution, price bands and per-platform social coverage. Brand names are platform names; no alias merging is performed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand_name": {
                "description": "platform brand name or brand slug",
                "type": "string"
              }
            },
            "required": ["brand_name"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Brand"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6bedea14087f1127287cf929c944fb5b016d67a60c1247f784045638686a575d"
        },
        {
          "name": "get_price",
          "title": "Get Price",
          "description": "Return the latest stored price and the plain product-page URL. This is a stored snapshot, not a real-time quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asin": {
                "description": "10-character Amazon ASIN",
                "type": "string"
              }
            },
            "required": ["asin"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd9f990ecc8de9872c8b1ebf70516c268da5545dcf59f37a19002db3c26963fc"
        },
        {
          "name": "get_price_change",
          "title": "Get Price Change",
          "description": "Return 180-day stored price statistics: current price, low, high, average, sample count and the current position within the recorded range. History only; no forecast.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asin": {
                "description": "10-character Amazon ASIN",
                "type": "string"
              }
            },
            "required": ["asin"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Price Change"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0cad9dc458e1430fef11ba40a916fa93df5517cd1cfa239f59554ac09b887f1a"
        },
        {
          "name": "get_product",
          "title": "Get Product",
          "description": "Return the complete product dossier. The nine display sections are always present in fixed order; a missing section keeps its title and status no_data with 暂无数据.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asin": {
                "description": "10-character Amazon ASIN",
                "type": "string"
              }
            },
            "required": ["asin"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:870115210b5cbcd76dfcea90208342af9b214f9c405fb4abcd313ff72d6e61b9"
        },
        {
          "name": "get_sub_category_brief",
          "title": "Get Category Brief",
          "description": "Return a structured brief for one leaf category, or one brief per leaf under a parent category. Includes scale, price distribution, brand concentration, pain points and selling points; every figure carries a numerator, denominator and as_of.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category_id": {
                "description": "top-level category slug from list_categories",
                "type": ["null", "string"]
              },
              "subcategory_id": {
                "description": "leaf subcategory slug from list_categories",
                "type": ["null", "string"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Category Brief"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a22a9d2e11151e2582b56b0e18312512a44e7561a5f6ba6c4ae30f0738712b31"
        },
        {
          "name": "get_top100",
          "title": "Get Top-100 Ranking",
          "description": "Return the platform public ranking order for a leaf category, or one list per leaf under a parent category. limit is 1-100 and offset paginates each list. Items are never scored or re-sorted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category_id": {
                "description": "top-level category slug from list_categories",
                "type": ["null", "string"]
              },
              "limit": {
                "description": "maximum items per list, 1 to 100 (default 100)",
                "type": "integer"
              },
              "offset": {
                "description": "zero-based offset within each list (default 0)",
                "type": "integer"
              },
              "subcategory_id": {
                "description": "leaf subcategory slug from list_categories",
                "type": ["null", "string"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Top-100 Ranking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d91ccb4d2730083c3db3b45ea2af0cfdf40b05f517f6c35726373d7deef21725"
        },
        {
          "name": "list_categories",
          "title": "List Categories",
          "description": "List the fixed leaf-category registry grouped by parent category. Each leaf carries the product count, complete-profile count and last update time. Use the returned category_id or subcategory_id with the other tools.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:54813cc59ea223df0f11f76e4f035a00487e836d2e36d8b298bf991a8722b9a5"
        },
        {
          "name": "request",
          "title": "Request Data",
          "description": "Return product data by ASIN or Amazon product URL with optional field filters. Set live=true to append a live price and stock snapshot.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asin": {
                "description": "10-character Amazon ASIN; mutually exclusive with url",
                "type": ["null", "string"]
              },
              "fields": {
                "description": "optional field filter; omit for the full dossier",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "live": {
                "description": "append a live price/stock scrape when true",
                "type": "boolean"
              },
              "url": {
                "description": "Amazon product page URL; mutually exclusive with asin",
                "type": ["null", "string"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Request Data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2e59f4ff3725676bc68ec2c663000f4c43d5c35ea8fd45e0c32b38fa51dd7ad4"
        },
        {
          "name": "scrap_page",
          "title": "Scrape Page Live",
          "description": "Fetch a live product-page snapshot for price, stock, Buy Box seller, rating and review count. Pass an ASIN or an Amazon product URL. The response carries data_as_of and is_stale.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asin": {
                "description": "10-character Amazon ASIN; mutually exclusive with url",
                "type": ["null", "string"]
              },
              "url": {
                "description": "Amazon product page URL; mutually exclusive with asin",
                "type": ["null", "string"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Scrape Page Live"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:52cd355df9f1ab6d54afd2911a13037488a459bb946faa0abab880dfb9d98f1b"
        },
        {
          "name": "search_products",
          "title": "Search Products",
          "description": "Literal substring search over product title, brand name and model number. Optional category, price and rating filters and explicit sort orders are supported. Natural-language and similarity search are not supported.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category_id": {
                "description": "optional category_id or subcategory_id from list_categories",
                "type": ["null", "string"]
              },
              "limit": {
                "description": "maximum results, 1 to 50 (default 20)",
                "type": "integer"
              },
              "max_price": {
                "description": "inclusive maximum stored USD price",
                "type": ["null", "number"]
              },
              "min_price": {
                "description": "inclusive minimum stored USD price",
                "type": ["null", "number"]
              },
              "min_rating": {
                "description": "inclusive minimum stored rating, 0 to 5",
                "type": ["null", "number"]
              },
              "offset": {
                "description": "zero-based result offset (default 0)",
                "type": "integer"
              },
              "query": {
                "description": "1 to 8 literal terms; title, brand or model match",
                "type": "string"
              },
              "sort": {
                "description": "price_asc, price_desc, rating_desc or review_count_desc; omit for relevance order",
                "type": ["null", "string"]
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f885a2c13554ff76a406bbc162756bd4c62f0b8e17761b033616b044aed396f8"
        }
      ],
      "digest": "sha256:1bbe1de7bcdb13c1af7702a3d5d81c9f0cc0cd04ceb40383e8d82cebf6c5b8d6"
    }
  }
}
