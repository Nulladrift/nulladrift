      "instructions": "OFACScreen screens a person or company name (screen_entity) or a street address (screen_address) against 14 sanctions and export-control lists. list_sanctions_sources gives each list its code for the lists argument, whether it is core (searched when a screening names no lists) and when it was last updated. A score is name similarity, not a finding that a match is the same party: confirm a date of birth, an address or an ID document before acting on it. Free, no account, 25 screenings a day from each internet address, shared by screen_entity and screen_address; in ChatGPT, each user has their own 25. A screening is not recorded and produces no document: its report_url opens the same search on ofacscreen.com, where a timestamped PDF record of it can be bought. search finds listed entries by name and fetch returns one entry's record, each with a link to cite. To screen a name, use screen_entity.",
