{
  "lockfileVersion": 2,
  "subjects": {
    "com.getbillwatchdog/billwatch": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getbillwatchdog.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "billwatch",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BillWatch publishes US advertised base prices for streaming and VPN plans. search_deals filters current plans; get_price_history shows price changes over time. Prices are listed prices, before taxes and extra fees. BillWatch makes no recommendations.",
      "tools": [
        {
          "name": "get_price_history",
          "description": "Pricing changes over time for one BillWatch plan: dated snapshots of the listed monthly price and billing terms. Use search_deals to find plan ids.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plan_id": {
                "description": "The plan id, e.g. 'hulu-live-tv-only'.",
                "type": "string"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:efe08abf4e920bb306bbad4ea976f623a3a1ff714be8ae35e750e08c95acd5fc"
        },
        {
          "name": "search_deals",
          "description": "Download current BillWatch deal data and filter by category, provider or plan. Returns US advertised base prices for streaming and VPN plans (listed prices, before taxes and extra fees). verified: true means the price was confirmed on the provider's official page within its freshness window. By default only current, verified plans are returned; set include_unverified to also see stale or discontinued plans. Results are sorted by listed monthly-equivalent price, cheapest first. BillWatch makes no recommendations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only return plans in this category.",
                "enum": ["streaming", "vpn"],
                "type": "string"
              },
              "include_unverified": {
                "description": "Also include plans that are unverified or no longer sold. Default false.",
                "type": "boolean"
              },
              "max_monthly_usd": {
                "description": "Only return plans whose listed monthly-equivalent price is at most this many USD.",
                "type": "number"
              },
              "plan_id": {
                "description": "Return only the plan with this exact id, e.g. 'hulu-live-tv-only'.",
                "type": "string"
              },
              "provider": {
                "description": "Only return plans whose provider name contains this text (case-insensitive), e.g. 'NordVPN'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bcf3acb366c8d3e38e298a87c1279155e522dc4bc8ff75f6b9b39f8ac0394b4d"
        }
      ],
      "digest": "sha256:e065598565d6bb28dc29f26bd52b92d505338fd054fbf41d3a78338dd402b4eb"
    }
  }
}
