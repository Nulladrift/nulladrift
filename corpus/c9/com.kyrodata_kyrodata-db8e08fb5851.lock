      },
      "instructions": "Kyrodata serves Brazilian foreign-trade (MDIC/ComexStat), production, supply/demand, climate and commodity forecast data. Values are USD FOB and kg unless a field says otherwise. Comparisons are like-for-like: `kyrodata_resolve_comparison_window` returns the labeled equal-length window that the other tools use, and every result carries `window.label`. \"No signal\" is a valid state. Numbers live in `structuredContent`; the text is the same numbers formatted. Labels are in Portuguese (pt-BR). Each tool's description states its credit class; `kyrodata_get_credit_balance` is free.",
      "tools": [
        {
          "name": "kyrodata_compare_trade",
          "title": "Compare exports/imports between equal windows",
          "description": "Compares Brazil's exports or imports between two equal-length windows (like-for-like), in value (USD FOB) and in volume (kg). `mode` changes the reading: quarterly, semestral, annual, ytd and rolling_3m/6m/12m look a year back and hold the season constant, while monthly and semestral_sequential compare against the period immediately before and cross one. `codes` and `countryIds` filter both windows alike and combine: together they isolate one product to one partner (1201 soybean to 160 China); omitted, every product and partner counts. The result carries both windows, the % change of each metric, the window label, whether it crosses a season, and the monthly series spanning both, capped at 24 months. This returns the FIGURES of a comparison — kyrodata_resolve_comparison_window only names the window, and kyrodata_list_trade_series hands over raw monthly points without comparing them. Credit class: comex (up to 2 comex tools per 60-second session = 1 credit).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "codes": {
                "description": "Products to filter by, as HS codes — 4 digits (heading), 6 (subheading) or 8 (Brazilian NCM), up to 10. Omit for every product. kyrodata_resolve_entity turns a product name into its code.",
                "items": {
                  "pattern": "^\\d{4}(\\d{2}|\\d{4})?$",
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "countryIds": {
                "description": "Partner countries to filter by, as ids from kyrodata_resolve_entity. Omit for every partner.",
                "items": {
                  "pattern": "^[A-Za-z0-9]{1,6}$",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "flow": {
                "description": "Direction of the trade flow, from Brazil’s side: `export` leaves the country, `import` enters it.",
                "enum": ["export", "import"],
                "type": "string"
              },
              "mode": {
                "description": "Which pair of equal-length windows to compare. Against the same period a year earlier: `quarterly`, `semestral`, `annual`, `ytd` (January to the last published month) and `rolling_3m`/`6m`/`12m`. Against the period immediately before, which crosses a season: `monthly` and `semestral_sequential`. Use `ytd` when the question names no period.",
                "enum": ["monthly", "quarterly", "semestral", "semestral_sequential", "annual", "ytd", "rolling_3m", "rolling_6m", "rolling_12m"],
                "type": "string"
              },
              "response_format": {
                "description": "How much of the answer to return. `concise` (the default) carries the headline figures; `detailed` adds the row-level series behind them and counts against the export quota.",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "required": ["flow", "mode"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "caveats": {
                "description": "Reading caveats.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "credits": {
                "description": "charged, balance (null = unlimited), resetAt, session {charged, endsAt} of the 60-s billing session.",
                "type": "object"
              },
              "data": {
                "description": "Raw numbers behind the text.",
                "type": "object"
              },
              "dataVersion": {
                "description": "Identity of the data that answered.",
                "type": "string"
              },
              "denied": {
                "description": "When status = denied: reason, feature, upgradeUrl.",
                "type": "object"
              },
              "error": {
                "description": "Failure message when status = error.",
                "type": "string"
              },
              "links": {
                "description": "screen = product page with these numbers.",
                "type": "object"
              },
              "memo": {
                "description": "true = identical call in the last 10 min, served again: 0 credits.",
                "type": "boolean"
              },
              "rows": {
                "description": "Table rows; detailed only, capped per tool.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "sources": {
                "description": "Per source: label, nameable, asOf.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "ok = data; denied = plan; error = failure or timeout.",
                "enum": ["ok", "denied", "error"],
                "type": "string"
              },
              "window": {
                "description": "Like-for-like window: from, to (YYYY-MM), label, months, crossesSeason.",
                "type": "object"
              }
            },
            "required": ["caveats", "credits", "data", "dataVersion", "links", "memo", "sources", "status"],
            "type": "object"
          },
