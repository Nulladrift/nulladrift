                "description": "First month of the window, as YYYYMM (200403 = March 2004). Omit for the last twelve published months.",
                "maximum": 209912,
                "minimum": 200001,
                "type": "integer"
              },
              "limit": {
                "description": "How many partner countries to return, largest first by value.",
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "response_format": {
