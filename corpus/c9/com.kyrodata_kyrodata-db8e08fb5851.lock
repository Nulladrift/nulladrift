                  "pattern": "^\\d{4}(\\d{2}|\\d{4})?$",
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "flow": {
                "description": "Direction of the trade flow, from Brazil’s side: `export` leaves the country, `import` enters it.",
                "enum": ["export", "import"],
                "type": "string"
