      "instructions": "데이터와통찰(datawatongchal.com) 통합 커넥터: 데이터와통찰의 모든 분야 커넥터 도구를 한 주소에 담았다.\n분야별로 따로 쓰려면 각 분야 커넥터(조달 /mcp/g2b, 상권 /mcp/store, 부동산 /mcp/realestate, 땅 /mcp/pointology, 기업 /mcp/corp, 공시 /mcp/dart, 수출입 /mcp/trade, 창업지원 /mcp/startup, 국방조달 /mcp/d2b, 공시지가 /mcp/landprice, 인구 /mcp/population)를 붙여도 된다. 도구 이름의 앞머리(g2b_ · store_ · re_ · point_ · corp_ · dart_ · trade_ · startup_ · d2b_ · lp_ · pop_)가 분야다.\nonto_describe(개념 사전)·onto_resolve(낱말 → 분야별 코드)는 모든 커넥터에 있다. 땅·거래는 법정동, 인구·가게·기업은 행정동 자료라 한 동네를 여러 분야로 물을 때, 회사를 조달·공시·국민연금으로 이어 볼 때 onto_resolve 를 먼저 불러라.\n한 질문이 여러 분야에 걸치면(예: 한 동네의 집값·가게·공공사업) 분야마다 도구를 하나씩 불러 함께 답하라.\n아래는 분야별 읽는 법이다.\n\n[조달 데이터와통찰]\n조달 데이터와통찰(datawatongchal.com): 한국 공공조달(나라장터) 데이터. 판단은 당신(AI)이, 이 서버는 정리된 데이터와 읽는 법을 준다. 자세한 안내 https://datawatongchal.com/mcp/docs\n\n- 흐름: 발주계획(g2b_order_plans) → 사전규격(g2b_prespecs) → 입찰공고(g2b_search_notices) → 낙찰(g2b_award_stats) → 계약(g2b_contracts). 한 사업의 경과는 g2b_bid_timeline. 원하는 데이터가 없으면 사용자 동의와 이메일을 받아 request_data.\n- 보유: 2023-01-01~오늘(응답 data_range). 그 전은 '없음'이 아니라 '보유 기간 밖'. 2025-01-01~05 는 차세대 나라장터 전환으로 원본에 공고·낙찰·사전규격이 없고(누락 아님), 1월 중순까지 낙찰이 적다.\n- 공통 인자: keywords=공고명에 쓰이는 같은 뜻 표현들(또는). '구축'·'개발' 같은 넓은 말을 단독으로 넣지 마라(예: SI → [\"정보시스템\",\"시스템 구축\",\"시스템구축\",\"SI\"]). must_include=모두 들어 있어야 할 낱말(그리고). 짧은 영문 약어는 대문자 온전한 낱말로만 맞춘다. region=수요기관 소재지(시도·시군구, 쉼표로 여럿). 지역은 agency 가 아니라 region 으로. agency=수요기관 이름 일부('조달청'을 넣을 때만 지방청 대행분 포함). days=최근 며칠, 특정 기간은 date_from·date_to(YYYY-MM-DD). 실제 적용 기간은 query_range. 금액은 원.\n- 거르는 조건이 하나도 없으면 최근 1개월만 찾고 notes 첫 줄에 알린다. 사용자에게 '최근 1개월 기준'이라고 말하라. 긴 기간의 건수·추이·분포는 g2b_breakdown 한 번으로(목록 도구를 나눠 여러 번 부르지 마라). 직접 정한 분류는 segments 에 한꺼번에, 구체적인 묶음을 먼저.\n- summary 는 조건에 맞는 전체 집계다(목록 길이와 무관). region_unknown(주소록에 없어 지역을 모르는 건수)도 밝혀라. region_limit 는 참가 업체 지역 제한으로 다른 것이다.\n- 업체 수주 규모·순위·점유는 계약이 기준(수의계약 포함): g2b_contracts 의 summary.top_vendors_by_amount(지분·차수 반영). 낙찰(g2b_award_stats)은 경쟁 강도(참가 수·낙찰률)를 볼 때다. 낙찰만 보면 수의계약이 빠진다.\n- 낙찰률은 계약 방법별로: 수의시담·협상에의한계약(96~97%)을 경쟁 입찰과 섞지 말고 by_contract_method 의 같은 낙찰 방법끼리 비교하라.\n- 계약 금액: '각 수요기관' 단가계약은 여러 기관의 총한도라 합계·순위에 더하지 마라. 장기계속계약은 총액과 이번 차수 금액(this_amount_krw)이 다르다. info_project 로 정보화사업을 거른다.\n- 마감 직후 같은 이름의 '재입찰공고'는 대개 유찰 신호다.\n- 갱신: 공고 1시간·사전규격 3시간·낙찰·발주계획 6시간·계약 하루. source.last_updated_kst 로 \"○시 기준\"이라고 말하라. 출처는 조달청 나라장터(공공데이터포털 OpenAPI). 원문 링크는 notes 의 링크 틀에 항목의 번호를 넣어 붙여라.\n\n\n[상권 데이터와통찰]\n상권 데이터와통찰(datawatongchal.com): 한국의 영업 중인 가게(상가업소) 데이터. 소상공인시장진흥공단 상가(상권)정보 분기 판(2023-03부터)을 행정동·업종별로 정리했다. 판단은 당신(AI)이, 이 서버는 정리된 숫자와 읽는 법을 준다.\n\n- 도구: 지역·업종의 점포 수와 순위는 store_count(group_by=industry 업종 순위, region 바로 아래 지역 순위, dong 지역 안 모든 행정동 순위: 전국 행정동 순위도 한 번에). 판별 늘고 준 흐름은 store_trend. 브랜드·상호는 store_brand. 판 목록과 판별 주의점은 store_editions.\n- 지역(region)은 행정구역 이름: '서울', '서울 중랑구', '면목본동'. 같은 이름의 구가 여러 시도에 있으면(중구 등) 합쳐지니 시도를 앞에 붙여라. 업종(industry)은 상권 업종 이름: 소분류(카페·치킨·미용실·편의점·요가/필라테스 학원), 중분류, 대분류(음식·소매 등).\n- 업종을 정하지 않은 순위는 사무실 위주 업종(경영 컨설팅·광고 대행 등 과학·기술, 시설관리·임대)을 뺀 '가게' 기준이다. 넣으려면 include_office=true.\n- 점포 수는 원자료의 업소 수다. 신규·폐업(new·gone)은 같은 가게(상호+지번주소+업종) 기준이지만 원자료 수집 범위 변화가 섞이므로 '실제 개업·폐업'이 아니라 '목록에 새로 오르고 빠진 가게'라고 말하라. notes 의 판별 주의점(예: 2024-12 점포 급증은 수집 확대)을 답에 함께 밝혀라.\n- 브랜드 숫자는 상호명으로 센 것이라 공식 매장 수가 아니다. 같은 브랜드도 한글·영문 표기가 섞여 있으니(메가엠지씨커피·메가MGC커피, GS25·지에스25) store_brand 의 name 에 쉼표로 함께 넣어라. matched_names 로 다른 가게가 섞였는지 확인하라.\n- 출처는 소상공인시장진흥공단 상가(상권)정보(공공데이터포털). 답에 기준 판(예: 2026년 9월 판)을 밝혀라. 숫자는 참고용이며 창업 등 판단에는 현장 확인이 필요하다고 덧붙여라.\n\n\n[부동산 데이터와통찰]\n부동산 데이터와통찰(datawatongchal.com): 한국 부동산 실거래가. 국토교통부 실거래가 공개 자료(2020-01 계약분부터, 매일 갱신) 2,400만 건을 지역·종류·면적별로 정리했다. 판단은 당신(AI)이, 이 서버는 정리된 숫자와 읽는 법을 준다.\n\n- 도구: 지역·기간의 거래량과 가격(중위값) 흐름·지역 순위는 re_stats. 개별 거래 목록(최근 거래, 비싼 순, 이름·면적·가격 조건)은 re_deals. 아파트 단지 하나의 시세(면적별 연도별 매매·전세, 최근 거래)는 re_complex. 상가·오피스의 임대료·공실률·수익률(한국부동산원 상업용부동산 임대동향조사, 상권 단위 분기)은 re_commercial.\n- kind(종류): apt 아파트 · rh 연립·다세대(빌라) · sh 단독·다가구 · offi 오피스텔 · land 토지 · nrg 상업업무용 · silv 분양권·입주권 · indu 공장·창고. deal(거래): trade 매매 · jeonse 전세 · wolse 월세(전월세는 apt·rh·sh·offi 만).\n- region 은 행정구역 이름: '서울', '서울 강남구', '분당구', '대치동'(법정동). 같은 이름의 구가 여러 시도에 있으면 합쳐지니 시도를 앞에 붙여라. 기간은 date_from·date_to(YYYY-MM). 금액은 원.\n- 거래 중위가는 가격지수가 아니라 '그때 거래된 집'의 중간값이라 거래 구성(지역·면적)이 바뀌면 시세와 반대로 움직일 수 있다. 시도·전국의 오름·내림은 하위 지역별(group_by=region)·면적대별(area)로 나눠 확인하고, 단지 시세는 re_complex 로 같은 단지·같은 면적을 비교하라.\n- 가격은 평균이 아니라 중위값이다. 해제(취소)된 매매는 빼고 cancelled 로 따로 센다. 최근 1~2개월은 신고 기한(30일) 때문에 건수가 아직 적으니 '거래 급감'으로 읽지 마라.\n- approx=true 인 중위값은 근사다(여러 달을 요약표로 합친 경우). 답에 근사라고 밝히거나, 기간을 한 해로 맞추거나 시군구로 좁혀 다시 불러라.\n- 예산·투자 질문(예: '5천만 원으로 살 만한 중랑구 사무실')에는 거래 목록을 늘어놓지 말고 판단을 도와라. ① 그 예산으로 실제 거래가 있는 후보를 2~3개로 묶어 비교하라. 원하는 종류가 없으면 종류(상가 칸 nrg·오피스텔 offi·빌라 rh)나 이웃 시군구로 넓혀라. ② 후보마다 되팔기 쉬움(최근 12개월 거래 수, 같은 건물에서 되풀이되는 거래)과 가격 흐름(re_stats group_by=year)을 붙여라. ③ 지분(share)·직거래·10㎡ 안팎의 아주 작은 칸·오래된 건물 거래는 시세가 아닐 수 있으니 따로 말하라. ④ 예산이 모자라면 지분이 아닌 중개거래 기준으로 현실적인 최저선을 밝혀라. ⑤ 상가·사무실은 re_commercial 로 그 지역 상권의 ㎡당 임대료·공실률·투자수익률(한국부동산원 분기 조사)을 붙여라. 이 서버에 없는 것(매물 호가, 개별 건물 임대료)은 없다고 말하고, 무엇을 어디서 어떤 순서로 확인할지 제시하라. 상권(store_) 도구가 함께 있으면 그 동네 업종 흐름도 보라.\n- 출처는 국토교통부 실거래가 공개시스템(공공데이터포털). 답에 기간과 '해제 제외 중위값' 기준을 밝히고, 숫자는 참고용이며 거래·투자 판단에는 현장·등기 확인이 필요하다고 덧붙여라.\n\n\n[Pointology 데이터와통찰]\nPointology 데이터와통찰(datawatongchal.com): 좌표 하나로 그 땅의 정보를 AI 가 바로 읽는 구조로 준다(한반도). 주소·지번·지목·공시지가·용도지역 같은 등록 정보와, 위성으로 본 토지피복·식생(NDVI)·레이더·지표온도·지형 같은 관측을 함께 담았다. 판단은 당신(AI)이, 이 서버는 출처와 시점이 붙은 값을 준다.\n\n- 도구: 주소·장소 이름을 좌표로 바꾸는 것은 point_find. 한 점의 전체 정보는 point_info(식별 identifiers · 등록 속성 attributes · 관측 observations). 행정·지적·용도지역·규제·건축물·도로·주변 시설 같은 국토공간정보만 필요하면 point_geo.\n- point_info·point_geo 의 입력은 경도(lon)·위도(lat) WGS84 다. 사용자가 주소나 장소 이름으로 말하면 먼저 point_find 로 좌표를 얻어라. 장소 이름은 전국의 같은 이름이 후보로 나오니(은마아파트 등) 사용자가 말한 지역과 맞는 후보를 고르고, 지역이 없으면 시군구를 붙여 다시 찾거나 사용자에게 물어라. 답에는 \"○○ 지번 기준\"이라고 밝혀라. 10m 격자라 좌표가 조금만 달라도 옆 필지가 된다.\n- 값마다 source(출처)·as_of(시점, 모르면 unknown)·cadence(갱신 주기)가 붙는다. 답에 시점을 밝혀라. null 인 칸은 '없음'이 아니라 '이 점에 자료 없음·조회 실패'이고 사유는 errors 에 있다.\n- 식생(observations.vegetation): latest(최근 관측)와 baseline_same_season(예년 같은 철의 중앙값·범위)을 먼저 비교하라. 구름 낀 날은 관측이 없다. 전체 시계열이 필요할 때만 timeseries=true(응답이 커진다).\n- point_geo 의 building·transport·facility 는 그 점이 아니라 반경(search_radius_m) 안의 값이다.\n- 공시지가·용도지역 등은 참고용이다. 거래·인허가 판단에는 토지이음·정부24 원문 확인이 필요하다고 덧붙여라.\n\n\n[기업 데이터와통찰]\n기업 데이터와통찰(datawatongchal.com): 한국 기업(사업장) 데이터. 국민연금 가입 사업장 월별 판(2026-01부터, 사업장마다 가입자 수·신규·상실·고지금액, 업종·주소와 그 변화)과 데이터바우처 가공 공급기업 소개를 한 기업 단위로 이었다. 판단은 당신(AI)이, 이 서버는 정리된 숫자와 읽는 법을 준다.\n\n- 도구: 조건(이름·지역·업종·규모·출처)에 맞는 기업 목록과 몇 개월 전 대비 가입자 증감 순위(sort=growth|decline)는 corp_search. 기업 한 곳의 월별 규모 추이·바뀐 기록(업종·주소·가입 상태)·신고 소득 수준·서비스 소개는 corp_profile(이름이 여러 곳에 맞으면 후보를 주니 사용자에게 확인하거나 ckey 로 다시 불러라). 기간 안에 새로 나오고 사라지고 업종·주소를 바꾼 기업은 corp_changes. 업종·지역·규모별 기업 수와 가입자 합계는 corp_stats.\n- 변화가 핵심이다: 규모 하나보다 흐름(늘었나 줄었나, 언제 업종을 바꿨나, 판에서 사라졌나)을 함께 말하라. 판에서 사라진 기업(status '최근 판에 없음')은 폐업으로 단정하지 말고 '국민연금 공개 목록에서 빠짐'으로 말하라.\n- 지역(region)은 행정구역 이름('서울 강남구', '판교동'), 업종(industry)은 국민연금 업종 이름의 일부('소프트웨어', '음식점', '건설'). 여러 표현은 쉼표로 함께.\n- 규모는 국민연금 가입자 수다. 실제 직원 수가 아니다(임원·일용·60세 이상 등은 빠질 수 있다). 공개 대상은 가입자 3인 이상 법인과 10인 이상 개인 사업장이라 작은 사업장은 없다.\n- 사업자등록번호는 앞 6자리만 공개된다. 같은 이름의 사업장이 여럿이면 주소·업종으로 가려라. 본사와 지점이 따로 가입했으면 따로 나온다.\n- avg_income_krw(1인 평균 신고 소득)는 고지금액으로 거꾸로 계산한 추정치이고 상한이 있어 고소득 기업은 낮게 나온다. '신고 소득 수준'으로 말하라.\n- 데이터바우처(source=voucher)는 정부 데이터바우처 사업의 데이터 가공 공급기업이다. 소개 글은 기업이 낸 요약이라 기업 자신의 주장으로 전하라. 국민연금과 이어지지 않은 기업(match none·ambiguous)은 규모가 없다.\n- 출처와 기준 월(as_of)을 답에 밝혀라. 투자·거래 판단에는 재무제표·신용정보 등 추가 확인이 필요하다고 덧붙여라.\n\n\n[공시 데이터와통찰]\n공시 데이터와통찰(datawatongchal.com): 한국 금융감독원 전자공시(DART). 공시 대상 회사 목록(약 12만 곳), 상장사 기업개황, 공시 목록(최근 3년부터 매일), 상장사 주요 재무 계정(2015년부터, 분기 포함)을 정리했다. 판단은 당신(AI)이, 이 서버는 정리된 숫자와 읽는 법을 준다.\n\n- 도구: 공시 찾기(회사·유형·제목 낱말·시장·기간)는 dart_filings. 회사 한 곳의 개황·최근 재무·최근 공시·국민연금 사업장 규모는 dart_company. 한 회사의 연간·분기 재무 추이는 dart_financials(full=true 면 한 해 전체 재무제표를 바로 가져온다). 상장사 매출·이익 순위와 증가율 순위는 dart_rank.\n- 회사 이름이 여러 곳에 맞으면 후보를 준다. 사용자에게 확인하거나 corp_code·stock_code(종목코드)로 다시 불러라.\n- 공시 유형(kind): A 정기공시(사업·분기보고서) B 주요사항보고(유상증자·합병·자기주식 등) C 발행공시 D 지분공시(대량보유·임원 소유) E 기타공시 F 외부감사관련 G 펀드 H 자산유동화 I 거래소공시(공정공시·조회공시) J 공정위공시. 사건을 찾을 때는 유형과 제목 낱말(keywords)을 함께 써라(예: kind=B, keywords='유상증자').\n- 제목 앞 [기재정정]은 앞 공시를 고친 것이라 같은 사건을 두 번 세지 마라. 원문은 항목의 url 로 붙여라.\n- 금액은 원. 연결(CFS)이 없으면 별도(OFS) 값이다. 분기 손익은 그 3개월 값이다. 결산월이 12월이 아닌 회사가 있다.\n- 공시 내용은 회사가 쓴 것이고 금융감독원은 정확성을 보장하지 않는다. 투자 판단을 대신하지 말고 출처(DART)와 보고서 날짜를 밝혀라.\n- 국민연금 가입자 수는 기업 커넥터와 같은 값이다(사업자번호 앞 6자리+이름으로 이음). 실제 직원 수가 아니다.\n\n\n[수출입 데이터와통찰]\n수출입 데이터와통찰(datawatongchal.com): 한국 관세청 수출입무역통계. 2015년 1월부터 HS 10자리 품목 × 나라(약 245곳) × 월의 수출·수입 금액(USD)과 중량(kg)을 정리했다. 판단은 당신(AI)이, 이 서버는 정리된 숫자와 읽는 법을 준다.\n\n- 도구: 품목 이름으로 HS 코드 찾기는 trade_items. 품목·나라의 월·연 추이와 같은 기간 주요 상대(품목이면 나라별, 나라면 품목별)는 trade_trend. 품목·나라 순위(금액·전년 대비 증가율)는 trade_rank. 이번 달 1~10일·1~20일 수출 속보(주요 품목·나라 10개씩)와 월 총괄은 trade_flash(월간 품목별 자료보다 한 달 빠르다).\n- 품목은 HS 코드 앞자리로 묶는다: 2자리 류(85 전기기기) ⊃ 4자리 호(8542 집적회로) ⊃ 6자리 소호(854232 메모리) ⊃ 10자리 세번. 품목 이름을 모르면 먼저 trade_items 로 코드를 찾아라. 반도체는 8542(집적회로)와 8541·8486 등이 섞여 있어 어떤 코드로 셌는지 밝혀라.\n- 나라는 한글 이름(미국, 베트남) 또는 2자리 코드(US, VN). 금액은 미국 달러다(원화로 바꿀 때는 환율 기준을 밝혀라).\n- 증감은 1년 전 같은 기간과 비교한 yoy 를 써라. 진행 중인 해의 연 합계를 앞 해 전체와 비교하지 마라.\n- 최근 달은 잠정치라 나중에 고쳐질 수 있다. 출처(관세청 수출입무역통계)와 기준 달을 밝혀라.\n\n\n[창업지원 데이터와통찰]\n창업지원 데이터와통찰(datawatongchal.com): 정부·지자체·공공기관의 창업·중소기업 지원사업 공고. 창업진흥원 K-Startup 사업공고와 중소벤처기업부 기업마당 지원사업 공고를 매일 모아 정리했다. 판단은 당신(AI)이, 이 서버는 정리된 공고와 읽는 법을 준다.\n\n- 도구: 조건(낱말·지역·분야·업력·마감)으로 공고 찾기는 startup_search(기본: 지금 신청 가능, 마감 가까운 순). 회사에 맞는 공고는 startup_match: 사업자등록번호(bizno)를 주면 창업기업 확인서로 창업일을, 회사 이름을 주면 국민연금 사업장에서 지역·업력을 가져온다(예비창업자는 region·stage 만). 공고 하나의 신청 대상·제외 대상·평가 방법·신청 방법은 startup_notice. 창업기업 확인서 조회는 startup_cert. 창업보육센터 등 입주 공간(호실·좌석·임대료)은 startup_space. 무료 온라인 창업 강좌는 startup_edu. 가게 자리(입지)는 startup_location: 그 지역 상권의 ㎡당 임대료·공실률, 업종 권리금, 점포 수 흐름을 한 번에 준다.\n- 업력(stage): 예비창업자·1년미만·2년미만·3년미만·5년미만·7년미만·10년미만. 업력 조건은 K-Startup 공고에만 칸으로 있다. 기업마당 공고는 stage_check 가 붙으면 본문에서 확인하라.\n- 지역은 시도 이름(서울, 경기, 충남 …). 그 시도 공고와 전국 공고를 함께 준다.\n- summary.total 은 두 출처에 겹친 같은 공고를 묶은 뒤의 건수다(duplicates_merged 를 밝혀라). 마감일 없는 공고(상시·예산 소진시까지)는 끝에 있다.\n- 신청 자격(업종·매출·대표자 나이·지역 소재 기간 등)은 공고마다 다르다. 단정하지 말고 '원문 확인'을 권하라. 원문 링크(url)를 붙이고 source.last_updated_kst 로 '○시 기준'이라고 말하라.\n\n\n[국방조달 데이터와통찰]\n국방조달 데이터와통찰(datawatongchal.com): 방위사업청 국방전자조달(d2b)의 군수품·시설 조달. 무기·군수품·군 시설 공사는 나라장터가 아니라 여기서 발주된다. 판단은 당신(AI)이, 이 서버는 정리된 데이터와 읽는 법을 준다.\n\n- 흐름: 조달계획(stage=plan, 발주 예정월) → 입찰공고(notice: 국내·시설·국외 경쟁입찰, 개찰일) 와 공개수의협상계획(ntat, 견적서 제출 마감일) → 입찰결과(result, 국내) → 계약(contract: 국내·시설·국외, 계약일). 모두 d2b_search 하나로, stage 와 scope(domestic·facility·foreign)로 고른다.\n- 곧 개찰하는 공고는 stage=notice, upcoming=true. 기관(부대)은 ornt 에 이름 일부(예: '육군군수사령부', '공군') 또는 발주기관 코드.\n- 업체 수주 규모·순위는 d2b_vendors(계약 금액, 기본 최근 1년). 업체는 이름으로만 묶인다(원천에 사업자등록번호 없음). 동명이인 회사를 단정하지 마라.\n- 한 건의 원문 칸 전부와 취소공고·변경계약 이력은 d2b_detail(id).\n- 같은 사업의 여러 줄(취소공고·변경계약)은 묶음마다 최신 줄 하나로 센다. summary.rows_merged 를 밝혀라. 공고 금액(기초예비가격)과 계약 금액을 서로 더하지 마라.\n- 보유: 2023-01-01~. 공고는 앞으로의 개찰 예정분이 있지만 조달계획은 대개 이번 달까지만 있다(다음 해 계획을 미리 주지 않는다). 그 전은 '없음'이 아니라 '보유 기간 밖'. 거르는 조건이 없으면 최근 1개월만 찾는다(notes 첫 줄).\n- 나라장터(조달 커넥터 g2b_*)와는 따로 센다. 국방부·각 군의 일반 용역·물품 일부는 나라장터에 있으니 둘 다 보라. source.last_updated_kst 로 '○시 기준'이라고 말하라. 원문은 국방전자조달시스템(d2b.go.kr)에서 공고번호·계약번호로 확인하라고 안내하라.\n\n\n[공시지가 데이터와통찰]\n공시지가 데이터와통찰(datawatongchal.com): 한국 개별공시지가. 국토교통부가 해마다 필지마다 정하는 1월 1일 기준 ㎡당 땅값(원)을 전국 약 3,600만 필지 모두 담았다(지금은 2026년 한 해). 판단은 당신(AI)이, 이 서버는 정리된 숫자와 읽는 법을 준다.\n\n- 도구: 지역 안에서 가장 비싼·싼 필지는 lp_rank(order=top|bottom, land=all|general|san|std|noroad, jimok). 지역의 분포(필지 수·최저·분위수·중위·최고)와 바로 아래 지역 순위(시도→시군구→읍면동)는 lp_stats(group_by=jimok 이면 지목별 분포). 필지 하나의 값·지목·면적·용도지역·토지이용상황과 그 동네·시군구 안에서의 순위는 lp_parcel(지번 주소 또는 필지번호 PNU 19자리).\n- 지목(jimok)은 토지특성정보(반기 갱신)를 필지번호로 이은 것이다: 대·전·답·임야·도로·공장용지·잡종지 등 28종. '쓸 수 있는 땅 중 가장 싼 곳'은 land=noroad(도로 제외) 또는 jimok 으로 지목을 정해 물어라(가장 싼 필지는 대개 산골 도로 땅이다).\n- 지역(region)은 행정구역 이름: '서울', '서울 강남구', '역삼동', '세종 소정면'. 같은 이름의 구(중구 등)는 여러 시도를 합치니 시도를 앞에 붙여라. 광주·전남은 2026년 전남광주통합특별시로 합쳐졌다('광주'는 옛 광주 5개 구로 센다).\n- 공시지가는 세금·부담금의 기준 가격이지 시세가 아니다. 대개 시세보다 낮다. '공시지가 기준'이라고 밝히고, 실제 거래 가격이 필요하면 부동산 도구(re_deals kind=land)를 함께 써라.\n- 분포는 산·전답이 많은 지역일수록 중위값이 낮다. 지역을 비교할 때 중위값과 함께 필지 수, 산 번지 비율(san_parcels)을 보라. 가장 싼 땅은 대개 산골 도로 땅이나 임야다(도로 제외는 land=noroad).\n- 도로명 주소는 받지 않는다: Pointology 도구(point_find)로 지번을 찾은 뒤 lp_parcel 에 넣어라. 출처는 국토교통부 개별공시지가정보·토지특성정보(브이월드). 답에 기준연도(source.year)를 밝혀라.\n\n\n[인구 데이터와통찰]\n인구 데이터와통찰(datawatongchal.com): 한국 주민등록 인구. 행정안전부 주민등록 인구통계를 전국·시도·시군구·읍면동(행정동)마다 성별·5세별로 담았다. 2011~지난해는 연말(12월 말) 값, 올해는 달말 값(매달 초 전달 값 추가). 판단은 당신(AI)이, 이 서버는 정리된 숫자와 읽는 법을 준다.\n\n- 도구: 지역 하나의 인구(총·남·여, 5세별, 유소년·생산연령·고령 비율, 중위 나이, 지난해 말 대비 증감)는 pop_stats. 지역 안 하위 지역 순위(인구·증감·고령 비율·청년 비율 등)는 pop_rank(level=child 바로 아래, sgg 시군구 전부, emd 읍면동 전부). 2011년부터의 흐름은 pop_trend.\n- 나이 구간은 age_from·age_to(5세 단위, 예: 청년 20~39세 → age_from=20, age_to=39). 정의가 다른 '청년'(19~34세 등)은 5세 단위에 맞춰 근사했다고 밝혀라.\n- 지역(region)은 행정구역 이름: '서울', '서울 강남구', '수원시', '역삼1동'. 같은 이름(중구 등)은 여러 시도를 합치니 시도를 앞에 붙여라. 2026-07 광주·전남이 전남광주통합특별시로 합쳐졌다('광주'는 옛 광주 5개 구, '전남'은 옛 전라남도로 센다). 인천은 2026-07 중구·동구·서구가 제물포구·영종구·서해구·검단구로 바뀌어 옛 구는 2026년 6월까지만 있다.\n- 기간(period)은 '2025'(연말) 또는 '2026-10'(달말). 비우면 가장 최근 달. 답에 기준 시점(source.period_label)을 밝혀라.\n- 주민등록 인구는 주민등록을 한 내국인이다(외국인 제외). 실제 사는 사람(생활인구)과 다를 수 있다. 출처는 행정안전부 주민등록 인구통계(국가데이터처 KOSIS).\n",
