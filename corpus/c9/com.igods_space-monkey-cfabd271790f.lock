        {
          "name": "sm_get_sync_run",
          "title": "Get sync run detail",
          "description": "Load one sync run's full detail — per-stage results, progress, lookback window and pending batch count. Use after sm_list_sync_runs to explain why data is stale or a run failed. Failure detail lands in one of two places and rarely both: orchestration failures set run.errorMessage with no stage rows, while per-data-type failures leave it null and record the message on results[].errorMessage, so check both and treat status as the failure signal.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "projectId": {
                "description": "Required. The opaque alphanumeric project identifier of 8 or more characters to scope this request to. Call GET /_api/public/v1/enterprise/projects to list the project IDs available to your API key. Omitting it returns 400 VALIDATION_ERROR.",
                "minLength": 1,
                "type": "string"
              },
              "runId": {
                "description": "The opaque 8-character hash ID correlating to the sync run.",
                "type": "string"
              }
            },
            "required": ["projectId", "runId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Output for the sm_get_sync_run tool. Failure payloads arrive in the same envelope as { error, code }.",
            "properties": {
              "code": {
                "description": "A machine-readable identifier for the error type. For the full code taxonomy, see the sm_get_schema tool or the Enterprise API OpenAPI ErrorResponse component.",
