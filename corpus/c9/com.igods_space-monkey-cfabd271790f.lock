            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "campaignId": {
                "description": "The opaque string identifier for the campaign as assigned by Mailchimp. List campaigns to obtain this ID. If the ID is invalid or does not exist in the project, the endpoint will return a 404 error.",
                "minLength": 1,
                "type": "string"
              },
              "projectId": {
                "description": "Required. The opaque alphanumeric project identifier of 8 or more characters to scope this request to. Call GET /_api/public/v1/enterprise/projects to list the project IDs available to your API key. Omitting it returns 400 VALIDATION_ERROR.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["campaignId", "projectId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Output for the sm_get_campaign tool. Failure payloads arrive in the same envelope as { error, code }.",
            "properties": {
              "campaignMeta": {
                "additionalProperties": true,
                "description": "Metadata for a campaign, including raw stringified JSON variate settings. May be null.",
                "properties": {
                  "campaignType": {
                    "description": "Mailchimp campaign type, or null when unknown.",
                    "type": ["string", "null"]
                  },
                  "variateSettings": {
                    "description": "Raw JSON string passed verbatim",
