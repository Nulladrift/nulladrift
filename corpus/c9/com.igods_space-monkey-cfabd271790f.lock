        {
          "name": "sm_get_member_timeline",
          "title": "Get member activity timeline",
          "description": "Replay one member's raw activity events in time order. Use to establish when someone last paid attention and what triggered it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "clickedFilter": {
                "default": "all",
                "description": "Filter timeline events to only those where the campaign was clicked, not clicked, or 'all' to ignore click status. Defaults to \"all\" when omitted.",
                "enum": ["all", "clicked", "not_clicked"],
                "type": "string"
              },
              "cursor": {
                "description": "Opaque keyset pagination cursor returned as `nextCursor` by the previous page. Must be replayed with identical query filters.",
                "type": "string"
              },
              "dateFrom": {
                "description": "Inclusive ISO-8601 calendar date (UTC) lower bound for the time range in YYYY-MM-DD format. Omit to leave the start of the time window unbounded.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "dateTo": {
                "description": "Inclusive ISO-8601 calendar date (UTC) upper bound for the time range in YYYY-MM-DD format. Omit to leave the end of the time window unbounded or use the endpoint's default.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "maxTimeToClick": {
                "description": "Maximum elapsed time from the campaign send until the member's first click, in minutes. Omit to impose no upper bound.",
                "minimum": 0,
                "type": "number"
              },
              "maxTimeToOpen": {
                "description": "Maximum elapsed time from the campaign send until the member's first open, in minutes. Omit to impose no upper bound.",
                "minimum": 0,
                "type": "number"
              },
              "minTimeToClick": {
                "description": "Minimum elapsed time from the campaign send until the member's first click, in minutes. Omit to impose no lower bound.",
                "minimum": 0,
                "type": "number"
              },
              "minTimeToOpen": {
                "description": "Minimum elapsed time from the campaign send until the member's first open, in minutes. Omit to impose no lower bound.",
                "minimum": 0,
                "type": "number"
              },
              "openedFilter": {
                "default": "all",
                "description": "Filter timeline events to only those where the campaign was opened, not opened, or 'all' to ignore open status. Defaults to \"all\" when omitted.",
                "enum": ["all", "opened", "not_opened"],
                "type": "string"
              },
              "pageSize": {
                "default": 100,
                "description": "Maximum number of rows to return per page. Omit to use the default page size of 100. MCP tool calls are capped at 100 rows per page to protect the model's context window.",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "projectId": {
                "description": "Required. The opaque alphanumeric project identifier of 8 or more characters to scope this request to. Call GET /_api/public/v1/enterprise/projects to list the project IDs available to your API key. Omitting it returns 400 VALIDATION_ERROR.",
                "minLength": 1,
                "type": "string"
              },
              "sortBy": {
                "default": "timestamp",
                "description": "The field used to order the timeline. Defaults to ordering by the most recent timestamp first.",
                "enum": ["timestamp", "activity_type", "campaign_title"],
                "type": "string"
              },
              "sortDir": {
                "default": "desc",
                "description": "The direction to sort the timeline results. Can be 'asc' for ascending or 'desc' for descending. Defaults to \"desc\" when omitted.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "subjectFilter": {
                "description": "Filter the timeline by a case-insensitive partial match on the campaign subject line. Omit to include all subjects.",
                "type": "string"
              },
              "subscriberHash": {
                "description": "The member's Mailchimp-style lowercase MD5 subscriber hash (canonical member key).",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["projectId", "subscriberHash"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Output for the sm_get_member_timeline tool. Failure payloads arrive in the same envelope as { error, code }.",
            "properties": {
              "code": {
                "description": "A machine-readable identifier for the error type. For the full code taxonomy, see the sm_get_schema tool or the Enterprise API OpenAPI ErrorResponse component.",
                "type": "string"
              },
              "data": {
                "description": "Response rows for the enclosing tool.",
                "items": {
                  "additionalProperties": true,
                  "description": "Chronological list of all actions taken by a member.",
                  "properties": {
                    "activityType": {
                      "description": "Kind of tracked action.",
                      "type": "string"
                    },
                    "campaignId": {
                      "description": "Campaign identifier, or null for non-campaign actions.",
                      "type": ["string", "null"]
                    },
                    "campaignTitle": {
                      "description": "Campaign title, or null for non-campaign actions.",
                      "type": ["string", "null"]
                    },
                    "timestamp": {
                      "description": "ISO 8601 UTC timestamp.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Clicked URL, or null when absent.",
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "error": {
                "description": "A human-readable error message detailing what went wrong.",
                "type": "string"
              },
              "hasMore": {
                "description": "True if additional results exist beyond this page.",
                "type": "boolean"
              },
              "nextCursor": {
                "description": "A keyset cursor marking the continuation point. Contract: this value is non-null if and only if `hasMore` is true. Clients MUST echo this token verbatim on the subsequent request and MUST NEVER attempt to parse or manually construct it.",
                "type": ["string", "null"]
              },
              "pageSize": {
                "description": "The maximum number of items returned in this page.",
                "type": "integer"
              },
              "projectId": {
                "description": "An opaque alphanumeric project identifier of 8 or more characters identifying a Space Monkey Project. Treat this value as entirely opaque; do not parse, sequentialize, or auto-generate it.",
                "type": "string"
              },
              "subscriberHash": {
                "description": "The 32-character lowercase hex MD5 hash of the member's downcased email address. This is the canonical unique identifier for members exposed across the Enterprise API, identical to Mailchimp's core behavior. The API will never expose internal synthetic BigQuery UUIDs.",
                "type": "string"
              }
            },
            "type": "object"
          },
