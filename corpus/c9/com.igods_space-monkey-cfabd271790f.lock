              },
              "error": {
                "description": "A human-readable error message detailing what went wrong.",
                "type": "string"
              },
              "performance": {
                "additionalProperties": true,
                "description": "Detailed performance for individual campaigns. May be null.",
                "properties": {
                  "bounceRate": {
                    "description": "Bounces divided by emails sent, as a percentage from 0 to 100.",
                    "type": ["number", "null"]
                  },
                  "campaignId": {
                    "description": "Campaign identifier.",
                    "type": "string"
                  },
                  "clickRate": {
                    "description": "Unique clicks divided by delivered, as a percentage from 0 to 100.",
                    "type": ["number", "null"]
