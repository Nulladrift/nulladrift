        {
          "name": "sm_get_member_campaigns",
          "title": "Get member campaign responses",
          "description": "List the individual campaigns one member received, opened or clicked. This email-level drill-down is often empty even for highly engaged members, so always keep a fallback. For the inverse view — the members who responded to one campaign — use sm_list_campaign_responders.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "clickedFilter": {
                "default": "all",
