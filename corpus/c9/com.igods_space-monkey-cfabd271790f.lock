        {
          "name": "sm_get_variate",
          "title": "Analyze variate campaign",
          "description": "Analyse a variate (A/B) campaign — per-variant reports, statistical significance, engagement velocity, audience quality and geo split. Only meaningful for multivariate campaigns. All metrics come from synced BigQuery tables rather than a live Mailchimp read, so they are only as current as the project's last sync run, whose cadence is per-project: manual, daily or weekly.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "campaignId": {
                "description": "The opaque string identifier for the campaign as assigned by Mailchimp. List campaigns to obtain this ID. If the ID is invalid or does not exist in the project, the endpoint will return a 404 error.",
                "pattern": "^[a-zA-Z0-9_-]+$",
                "type": "string"
              },
              "projectId": {
                "description": "Required. The opaque alphanumeric project identifier of 8 or more characters to scope this request to. Call GET /_api/public/v1/enterprise/projects to list the project IDs available to your API key. Omitting it returns 400 VALIDATION_ERROR.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["campaignId", "projectId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Output for the sm_get_variate tool. Failure payloads arrive in the same envelope as { error, code }.",
            "properties": {
              "audienceQuality": {
                "description": "Per-variant audience-quality rows.",
                "items": {
                  "additionalProperties": true,
                  "description": "Measures the quality of audience engaging with the campaign.",
                  "properties": {
                    "avgClicksPerMember": {
                      "description": "Mean clicks per member.",
                      "type": "number"
                    },
                    "avgEngagementScore": {
                      "description": "Mean engagement score in the variant, or null.",
                      "type": ["number", "null"]
                    },
                    "avgMemberRating": {
                      "description": "Mean member rating in the variant, or null.",
                      "type": ["number", "null"]
                    },
                    "avgOpensPerMember": {
                      "description": "Mean opens per member.",
                      "type": "number"
                    },
                    "clickToOpenRate": {
                      "description": "Click-to-open rate for the variant.",
                      "type": "number"
                    },
                    "leaderCount": {
                      "description": "Leaders in the variant.",
                      "type": "integer"
                    },
                    "repeatClickers": {
                      "description": "Members who clicked more than once.",
                      "type": "integer"
                    },
                    "repeatOpeners": {
                      "description": "Members who opened more than once.",
                      "type": "integer"
                    },
                    "totalEngagedMembers": {
                      "description": "Engaged members in the variant.",
                      "type": "integer"
                    },
                    "variantLabel": {
                      "description": "Variant label.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
