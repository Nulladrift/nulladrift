      "instructions": "Space Monkey turns Mailchimp campaign and audience engagement data into queryable intelligence on top of a BigQuery pipeline. Resolve the project first with sm_list_projects whenever the user names a company rather than a project ID, then use the leaders/members/campaigns/insights tools to answer engagement questions — every tool call is synchronous, there is no async job or polling to manage. Tool families do not overlap: the sm_get_member_* tools answer member-level composition and lifecycle questions (status, rating, rep, language, signup cohorts, churn, retention), while the sm_get_insights_* tiers answer Mailchimp-list and campaign-level aggregates (per-audience sizes, unsubscribe and cleaned counts, open and click rates, the subscriber-growth series) — when a question could be served by either, pick by whose subject it is and call one, not both. All tools are strictly read-only: nothing here sends email or mutates Mailchimp data, but each tools/call still debits both the MCP and Enterprise API quotas, so avoid redundant calls. Read space-monkey://analyst-preamble (or call sm_get_knowledge if your client cannot read MCP resources) before interpreting any metric. tools/call requires an OAuth 2.1 access token; your client can discover the authorization server automatically, or you may still send a legacy Enterprise API key as Authorization: Bearer sm_... HTTP header.",
