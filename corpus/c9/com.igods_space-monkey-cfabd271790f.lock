        {
          "name": "sm_list_at_risk",
          "title": "Find at-risk members",
          "description": "Find previously engaged members whose recent activity has collapsed, for building save lists. Note its engagementScore is a raw decayed score that can be negative, unlike the leaders percentile.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "botFilter": {
                "default": "all",
                "description": "Filter out members whose interactions appear to be automated bot activity. Select 'suspected-bot' for only bots, 'clean' to exclude bots, or 'all' to ignore. Defaults to \"all\" when omitted.",
                "enum": ["all", "suspected-bot", "clean"],
                "type": "string"
              },
              "cursor": {
                "description": "Opaque keyset pagination cursor returned as `nextCursor` by the previous page. Must be replayed with identical query filters.",
                "type": "string"
              },
              "insiderFilter": {
                "default": "all",
                "description": "Filter out members with internal company email domains or recognized insider addresses. Select 'exclude' to hide them, 'only' to show only them, or 'all' to ignore. Defaults to \"all\" when omitted.",
                "enum": ["all", "exclude", "only"],
                "type": "string"
              },
              "maxPrior": {
                "description": "Maximum count of engagement actions prior to the recent drop-off. Omit to impose no upper bound.",
                "minimum": 0,
                "type": "number"
              },
              "maxRating": {
                "description": "Maximum Mailchimp member star rating to include, from 1 to 5. Omit to include every rating.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "minPrior": {
                "description": "Minimum count of engagement actions prior to the recent drop-off. Omit to impose no lower bound.",
                "minimum": 0,
                "type": "number"
              },
              "minRating": {
                "description": "Minimum Mailchimp member star rating to include, from 1 to 5. Omit to include every rating.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "default": 100,
                "description": "Maximum number of rows to return per page. Omit to use the default page size of 100. MCP tool calls are capped at 100 rows per page to protect the model's context window.",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "projectId": {
                "description": "Required. The opaque alphanumeric project identifier of 8 or more characters to scope this request to. Call GET /_api/public/v1/enterprise/projects to list the project IDs available to your API key. Omitting it returns 400 VALIDATION_ERROR.",
                "minLength": 1,
                "type": "string"
              },
              "rep": {
                "description": "Filter by an exact match on the assigned sales representative's name. Omit to include members assigned to any rep.",
                "type": "string"
              },
              "search": {
                "description": "Filter subscribers by a case-insensitive partial match on their email address, first name, or last name. Omit to skip text filtering.",
                "type": "string"
              },
              "sortBy": {
                "default": "active_actions_recent",
                "description": "The field used to order the at-risk subscribers list. Defaults to the number of recent active actions.",
                "enum": ["active_actions_recent", "active_actions_prior", "email_address", "member_rating"],
                "type": "string"
              },
              "sortDir": {
                "default": "asc",
                "description": "The direction to sort the at-risk results. Can be 'asc' for ascending or 'desc' for descending. Defaults to \"asc\" when omitted.",
                "enum": ["asc", "desc"],
                "type": "string"
              }
            },
            "required": ["projectId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Output for the sm_list_at_risk tool. Failure payloads arrive in the same envelope as { error, code }.",
            "properties": {
              "code": {
                "description": "A machine-readable identifier for the error type. For the full code taxonomy, see the sm_get_schema tool or the Enterprise API OpenAPI ErrorResponse component.",
                "type": "string"
              },
              "distribution": {
                "description": "Rating-bucket distribution of the at-risk population.",
                "items": {
                  "additionalProperties": true,
                  "description": "Distribution of at-risk subscribers grouped by member rating.",
                  "properties": {
                    "avgPriorActions": {
                      "description": "Mean prior-window action count in the bucket.",
                      "type": "number"
                    },
                    "maxPriorActions": {
                      "description": "Highest prior-window action count in the bucket.",
                      "type": "integer"
                    },
                    "memberRating": {
                      "description": "Rating bucket.",
                      "type": "integer"
                    },
                    "subscriberCount": {
                      "description": "Members in the rating bucket.",
                      "type": "integer"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "error": {
                "description": "A human-readable error message detailing what went wrong.",
                "type": "string"
              },
              "hasMore": {
                "description": "True if additional results exist beyond this page.",
                "type": "boolean"
              },
              "nextCursor": {
                "description": "A keyset cursor marking the continuation point. Contract: this value is non-null if and only if `hasMore` is true. Clients MUST echo this token verbatim on the subsequent request and MUST NEVER attempt to parse or manually construct it.",
                "type": ["string", "null"]
              },
              "pageSize": {
                "description": "The maximum number of items returned in this page.",
                "type": "integer"
              },
              "projectId": {
                "description": "An opaque alphanumeric project identifier of 8 or more characters identifying a Space Monkey Project. Treat this value as entirely opaque; do not parse, sequentialize, or auto-generate it.",
                "type": "string"
              },
              "quadrantData": {
                "description": "Per-member rows for the prior-vs-recent activity quadrant.",
                "items": {
                  "additionalProperties": true,
                  "description": "Detailed scatter-quadrant plotting data for at-risk members.",
                  "properties": {
                    "activeActionsPrior": {
                      "description": "Count of engagement actions in the prior comparison window.",
                      "type": "integer"
                    },
                    "daysSinceLastActivity": {
                      "description": "Days since the member's last tracked action.",
                      "type": "integer"
                    },
                    "emailAddress": {
                      "description": "The member's email address.",
                      "type": "string"
                    },
                    "engagementScore": {
                      "description": "Composite engagement score for the member or cohort. Note: This is the raw unbounded time-decayed score that can be negative.",
                      "type": "number"
                    },
                    "firstName": {
                      "description": "The member's first name, or null when unavailable.",
                      "type": ["string", "null"]
                    },
                    "lastName": {
                      "description": "The member's last name, or null when unavailable.",
                      "type": ["string", "null"]
                    },
                    "memberRating": {
                      "description": "Integer Mailchimp engagement rating for the member (1-5), or null when unrated.",
                      "type": "integer"
                    },
                    "repName": {
                      "description": "Internal owner or rep assigned to the member, or null when unassigned.",
                      "type": ["string", "null"]
                    },
                    "totalClicks": {
                      "description": "Total click events, counting repeat clicks.",
                      "type": "integer"
                    },
                    "totalOpens": {
                      "description": "Total open events, counting repeat opens by the same member.",
                      "type": "integer"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "repBreakdown": {
                "description": "Per-rep rollup of the at-risk population.",
                "items": {
                  "additionalProperties": true,
                  "description": "Breakdown of at-risk counts grouped by sales rep/owner.",
                  "properties": {
                    "atRiskCount": {
                      "description": "At-risk members assigned to the rep.",
                      "type": "integer"
                    },
                    "avgEngagementScore": {
                      "description": "Mean engagement score for the rep's at-risk members.",
                      "type": "number"
                    },
                    "avgPriorActions": {
                      "description": "Mean prior actions for the rep's at-risk members.",
                      "type": "number"
                    },
                    "repName": {
                      "description": "Rep name for the row.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "subscribers": {
                "description": "At-risk member rows.",
                "items": {
                  "additionalProperties": true,
                  "description": "Represents an individual at-risk member. Semantic conflict note: engagementScore here is the RAW unbounded decayed score, can be negative.",
                  "properties": {
                    "activeActionsPrior": {
                      "description": "Count of engagement actions in the prior comparison window.",
                      "type": "integer"
                    },
                    "activeActionsRecent": {
                      "description": "Count of engagement actions in the recent comparison window.",
                      "type": "integer"
                    },
                    "emailAddress": {
                      "description": "The member's email address.",
                      "type": "string"
                    },
                    "engagementScore": {
                      "description": "Composite engagement score for the at-risk member. Note: This is the raw unbounded time-decayed score that can be negative.",
                      "type": ["number", "null"]
                    },
                    "firstName": {
                      "description": "The member's first name, or null when unavailable.",
                      "type": ["string", "null"]
                    },
                    "isLeader": {
                      "description": "True when the member qualifies as a leader by engagement.",
                      "type": ["boolean", "null"]
                    },
                    "lastActivityAt": {
                      "description": "ISO 8601 UTC timestamp.",
                      "type": ["string", "null"]
                    },
                    "lastName": {
                      "description": "The member's last name, or null when unavailable.",
                      "type": ["string", "null"]
                    },
                    "memberRating": {
                      "description": "Integer Mailchimp engagement rating for the member (1-5), or null when unrated.",
                      "type": ["integer", "null"]
                    },
                    "repName": {
                      "description": "Internal owner or rep assigned to the member, or null when unassigned.",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "Subscription status of the member.",
                      "type": "string"
                    },
                    "subscriberHash": {
                      "description": "Opaque 32-hex-character per-member identifier (MD5 of the lowercased/trimmed email address). It is deterministic and stable across calls, making it safe as a global join key when correlating a member across tools, though it will change if the member changes email address.",
                      "type": "string"
                    },
                    "totalClicks": {
                      "description": "Total click events, counting repeat clicks.",
                      "type": ["integer", "null"]
                    },
                    "totalOpens": {
                      "description": "Total open events, counting repeat opens by the same member.",
                      "type": ["integer", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
