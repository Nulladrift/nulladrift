{
  "lockfileVersion": 2,
  "subjects": {
    "be.agimo/agimo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.agimo.be/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agimo",
        "version": "1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Search Belgian real-estate listings for sale or rent. Read-only. Every listing has a url to its agency's page.",
      "tools": [
        {
          "name": "get_listing",
          "description": "One listing in full, by id.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5d4fb9a041a6287ef936b192c9883a9f247c01e3eb3c5bdd6eabdca43e9ab6bb"
        },
        {
          "name": "search_listings",
          "description": "How many listings match, and 24 of them (price, bedrooms, area, city, url). Use `offset` to get the next 24. `count_capped` true means more than `count` match.",
          "inputSchema": {
            "properties": {
              "areas": {
                "default": [],
                "description": "deelgemeente codes like \"24104A\"; a bare municipality NIS selects all of it",
                "items": {
                  "type": "string"
                },
                "title": "Areas",
                "type": "array"
              },
              "bbox": {
                "anyOf": [
                  {
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "west,south,east,north; ignored when areas are set",
                "title": "Bbox"
              },
              "energy_label": {
                "anyOf": [
                  {
                    "enum": ["A++", "A+", "A", "B", "C", "D", "E", "F", "G"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "worst EPC / PEB label accepted; homes with no label are left out",
                "title": "Energy Label"
              },
              "exclude_under_option": {
                "default": false,
                "description": "leave out the homes under option: a buyer is already signing",
                "title": "Exclude Under Option",
                "type": "boolean"
              },
              "features": {
                "default": [],
                "description": "every one the ad says the home has, such as pool or sauna",
                "items": {
                  "enum": ["pool", "sauna", "jacuzzi", "garden", "terrace", "garage", "elevator", "solar", "heat_pump", "air_con", "fireplace", "view", "sea", "ev_charger", "pets", "furnished", "new_build"],
                  "type": "string"
                },
                "title": "Features",
                "type": "array"
              },
              "limit": {
                "default": 24,
                "maximum": 200,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "listing_type": {
                "anyOf": [
                  {
                    "enum": ["buy", "rent"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Listing Type"
              },
              "max_bedrooms": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "most bedrooms accepted: a person who wants one or two, not five",
                "title": "Max Bedrooms"
              },
              "min_bedrooms": {
                "default": 0,
                "minimum": 0,
                "title": "Min Bedrooms",
                "type": "number"
              },
              "min_sqm": {
                "default": 0,
                "description": "minimum habitable area, m2",
                "minimum": 0,
                "title": "Min Sqm",
                "type": "number"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "place": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "a place name like \"Gent\" or \"Ixelles\": the deelgemeente of that name, never a whole municipality; adds to `areas`",
                "title": "Place"
              },
              "price_max": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Price Max"
              },
              "price_min": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Price Min"
              },
              "property_types": {
                "default": [],
                "items": {
                  "enum": ["house", "apartment", "room", "garage", "office", "land", "commercial", "industrial", "hospitality", "building"],
                  "type": "string"
                },
                "title": "Property Types",
                "type": "array"
              },
              "sort": {
                "default": "newest",
                "enum": ["newest", "price_asc", "price_desc", "surface_desc"],
                "title": "Sort",
                "type": "string"
              },
              "sources": {
                "default": [],
                "description": "agency domains",
                "items": {
                  "type": "string"
                },
                "title": "Sources",
                "type": "array"
              }
            },
            "title": "SearchArgs",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:20415e0a839ca777c0d4c512767279a2a498520e6d980311e2c61e17cdee3c34"
        }
      ],
      "digest": "sha256:85d11b3d911ea858eee2ba39316887c1517ef4f0070b7fcf90a5e7e5fbf97bf9"
    }
  }
}
