      "instructions": "core.blue offers private, self-describing memories for agents: one house per customer, on a machine of its own. This server is the adviser. It answers from a manual, never from a model. Status: preview; a house of your own cannot be had yet, `open_sandbox` gives you one for three hours. Start with `about`: it lists every topic of the manual with a summary. Read one with `read_topic`; `search_library` finds topics by your own words. `pricing` is the offer as data. `recommend` turns what you need into a report for the person you act for, and says so when a house is the wrong choice; for the plain question whether a house fits, it alone answers. What you ask here is recorded to improve the manual and deleted after each evaluation; send nothing secret. Before you leave, please call `leave_feedback`: what you noticed, what bothered you, what is missing.",
      "tools": [
        {
          "name": "about",
          "title": "About core.blue",
          "description": "What core.blue is, in a form you can paste into a report: the product in one paragraph, what is live and what is not, what to call next, and every topic of the manual with a summary. Call this first.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "desk": {
                "description": "Whether request_house takes requests: 'closed' (it sends nothing and takes nothing) or 'waiting-list' (a person can confirm a request and is written to once when houses can be had; no house is built yet).",
                "type": "string"
              },
              "how_to_proceed": {
                "description": "What to call next, in order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "manual": {
                "description": "The version of the manual these answers come from; cite it in a report.",
                "properties": {
                  "commit": {
                    "description": "The commit of the source this manual was built from.",
                    "type": "string"
                  },
                  "generated_at": {
                    "description": "When this manual was built, UTC.",
                    "type": "string"
                  },
                  "topics": {
                    "description": "How many topics the manual has.",
                    "type": "integer"
                  }
                },
                "required": ["commit", "generated_at", "topics"],
                "type": "object"
              },
              "name": {
                "description": "The name of the product.",
                "type": "string"
              },
              "status": {
                "description": "What is live today and what is not.",
                "type": "string"
              },
              "summary": {
                "description": "What core.blue is, in one paragraph you can paste into a report.",
                "type": "string"
              },
              "topics": {
                "description": "Every topic of the manual in reading order, with a summary: choose from here and call read_topic.",
                "items": {
                  "properties": {
                    "group": {
                      "description": "The part of the manual the topic belongs to.",
                      "type": "string"
                    },
                    "slug": {
                      "description": "The stable identifier of the topic; pass it to read_topic.",
                      "type": "string"
                    },
                    "status": {
                      "description": "'draft' or 'published'. A draft has not been reviewed by the operator yet.",
                      "type": "string"
                    },
                    "summary": {
                      "description": "One or two sentences that answer the question the title asks.",
                      "type": "string"
                    },
                    "title": {
                      "description": "The title of the topic.",
                      "type": "string"
                    }
                  },
                  "required": ["group", "slug", "status", "summary", "title"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["desk", "how_to_proceed", "manual", "name", "status", "summary", "topics"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About core.blue"
