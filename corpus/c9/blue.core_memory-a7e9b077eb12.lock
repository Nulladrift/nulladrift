        {
          "name": "recommend",
          "title": "Recommend a house",
          "description": "Call this once you know what the person you act for needs: whether a house fits, which size, what it costs per month, and a report in Markdown you can pass on. It advises against a house where one is the wrong choice. Name every need that applies, from this vocabulary. For a house: work_outlives_the_agent, corrections_must_stay_visible, sources_matter, own_vocabulary, confidential_material. Against: only_user_preferences_across_chats, only_retrieval_over_text, millisecond_answers_at_high_volume, running_jobs_or_compute, nobody_will_model. Deciding the size: one_person, an_organization, data_must_stay_in_own_network, scanned_documents, names_found_automatically, large_material. Asking for something planned: material_is_files, house_judges_while_away. Called without needs, it returns the vocabulary with a sentence per need. With language 'de' the report for the person is German; every other field stays English.",
          "inputSchema": {
            "properties": {
              "data_gb": {
                "default": null,
                "description": "How much material there is, in gigabytes, if you know. Used to calculate additional volume.",
                "type": ["number", "null"]
              },
              "in_your_words": {
                "default": null,
                "description": "Optional: what the person asked you for, in one or two sentences of your own. It is recorded so that we learn which questions we did not foresee. It is not interpreted and does not change the answer.",
                "type": ["string", "null"]
              },
              "language": {
                "default": "en",
                "description": "Language of 'report', the text for the person: 'en' or 'de'. Default 'en'. Every other field stays English.",
                "type": "string"
              },
              "needs": {
                "default": null,
                "description": "The needs that apply, as words of the vocabulary. Omit to get the vocabulary.",
                "items": {
                  "type": ["string", "null"]
                },
                "type": ["array", "null"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cites": {
                "description": "The topics this answer rests on, each with the hash of its body.",
                "items": {
                  "properties": {
                    "sha256": {
                      "description": "SHA-256 of its body as served.",
                      "type": "string"
                    },
                    "slug": {
                      "description": "The slug of the topic.",
                      "type": "string"
                    }
                  },
                  "required": ["sha256", "slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "gaps": {
                "description": "What you asked for that is not available yet, the most important first.",
                "items": {
                  "properties": {
                    "need": {
                      "description": "The need that asked for it. Null for a gap that concerns every house.",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "Always 'planned, no date' today.",
                      "type": "string"
                    },
                    "topic": {
                      "description": "The slug of the topic that says more.",
                      "type": "string"
                    },
                    "what": {
                      "description": "What is missing.",
                      "type": "string"
                    }
                  },
                  "required": ["need", "status", "topic", "what"],
                  "type": "object"
                },
                "type": "array"
              },
              "manual": {
                "description": "The version of the manual; the report cites it.",
                "properties": {
                  "commit": {
                    "description": "The commit of the source this manual was built from.",
                    "type": "string"
                  },
                  "generated_at": {
                    "description": "When this manual was built, UTC.",
                    "type": "string"
                  },
                  "topics": {
                    "description": "How many topics the manual has.",
                    "type": "integer"
                  }
                },
                "required": ["commit", "generated_at", "topics"],
                "type": "object"
              },
              "next_steps": {
                "description": "What to call next.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "price": {
                "description": "What the recommended house costs. Null when a house does not fit or no need was named.",
                "properties": {
                  "amounts_are": {
                    "description": "'net' or 'gross'.",
                    "type": ["string", "null"]
                  },
                  "calculation": {
                    "description": "How the total comes about, in words and numbers.",
                    "type": "string"
                  },
                  "currency": {
                    "description": "The currency of the amounts.",
                    "type": ["string", "null"]
                  },
                  "house_per_month": {
                    "description": "The price of the house per month. Null if not decided.",
                    "type": ["number", "null"]
                  },
                  "size": {
                    "description": "The size the price is for.",
                    "type": "string"
                  },
                  "test_once": {
                    "description": "The one-off price of the 14-day test of this size. Null if there is none.",
                    "type": ["number", "null"]
                  },
                  "total_per_month": {
                    "description": "House and volume together, per month. Null if a part is not decided.",
                    "type": ["number", "null"]
                  },
                  "volume_gb": {
                    "description": "The additional volume the calculation assumes, in gigabytes; 0 if none.",
                    "type": "integer"
                  },
                  "volume_per_month": {
                    "description": "The price of that volume per month. Null if it cannot be calculated.",
                    "type": ["number", "null"]
                  }
                },
                "required": ["amounts_are", "calculation", "currency", "house_per_month", "size", "test_once", "total_per_month", "volume_gb", "volume_per_month"],
                "type": ["object", "null"]
              },
              "reasons": {
                "description": "One entry per need you named: what it means for a house, and the topic that backs it.",
                "items": {
                  "properties": {
                    "kind": {
                      "description": "'for' a house, 'against' it, deciding the 'size', or naming a 'gap'.",
                      "type": "string"
                    },
                    "need": {
                      "description": "The need, as you named it.",
                      "type": "string"
                    },
                    "sentence": {
                      "description": "What the need means for a house.",
                      "type": "string"
                    },
                    "topic": {
                      "description": "The slug of the topic that backs the sentence.",
                      "type": "string"
                    }
                  },
                  "required": ["kind", "need", "sentence", "topic"],
                  "type": "object"
                },
                "type": "array"
              },
              "report": {
                "description": "The report for the person you act for, in Markdown, ready to pass on. Empty when no need was named.",
                "type": "string"
              },
              "size": {
                "description": "The size of house that follows from the needs today. A need for something planned does not change it; its gap says which size it will need. Null when a house does not fit or no need was named.",
                "type": ["string", "null"]
              },
              "verdict": {
                "description": "'fits', 'fits_with_gaps', 'does_not_fit', or 'say_what_you_need' when no need was named.",
                "type": "string"
              },
              "vocabulary": {
                "description": "The needs you can name. Filled only when you named none.",
                "items": {
                  "properties": {
                    "kind": {
                      "description": "'for' a house, 'against' it, deciding the 'size', or naming a 'gap'.",
                      "type": "string"
                    },
                    "need": {
                      "description": "The word to pass in 'needs'.",
                      "type": "string"
                    },
                    "sentence": {
                      "description": "What the need means for a house.",
                      "type": "string"
                    }
                  },
                  "required": ["kind", "need", "sentence"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["cites", "gaps", "manual", "next_steps", "price", "reasons", "report", "size", "verdict", "vocabulary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend a house"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
