        {
          "name": "request_house",
          "title": "Request a house",
          "description": "Ask for a house on its own VM for the person you act for. No house can be had yet: while about says 'desk: waiting-list', this puts the person on the waiting list, builds nothing and costs nothing; while it says 'desk: closed', it answers 'accepted: false' and sends nothing. This sends an e-mail to a person: call it only when they know it is coming. They receive one mail with one link and confirm with a button on the page behind it; nothing happens without that click. Returns a ticket to follow with house_status.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "E-mail address of the person who will confirm and own the house. One address, name@domain.tld.",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of the mail and of the page the person confirms on: 'en' or 'de'. Default 'en'.",
                "type": "string"
              },
              "size": {
                "default": "economy",
                "description": "Size of the machine: 'economy' (small VM) or 'premium' (larger VM). Both run the same software. Default 'economy'.",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "accepted": {
                "description": "True if the request was taken and a ticket exists. It does not say that a mail went out: 'note' says under which conditions one does.",
                "type": "boolean"
              },
              "note": {
                "description": "What happened and what to do next.",
                "type": "string"
              },
              "ticket": {
                "description": "The ticket of the request. Null if it was not accepted.",
                "properties": {
                  "address": {
                    "description": "The address of the house once it exists. Null before.",
                    "type": ["string", "null"]
                  },
                  "id": {
                    "description": "The ticket id; pass it to house_status.",
                    "type": "string"
                  },
                  "note": {
                    "description": "What to do next.",
                    "type": "string"
                  },
                  "state": {
                    "description": "One of: requested (waits for the person's click), confirmed (the person clicked), expired (not confirmed in time), declined (the person said no); later: building, trial, licensed, dormant, exported, deleted.",
                    "type": "string"
                  }
                },
                "required": ["address", "id", "note", "state"],
                "type": ["object", "null"]
              }
            },
            "required": ["accepted", "note", "ticket"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a house"
          },
          "behavior": {
            "destructive": false,
