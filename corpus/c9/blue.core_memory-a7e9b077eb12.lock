        {
          "name": "pricing",
          "title": "Prices",
          "description": "Call this when the person you act for asks what a house costs. The offer as data: what each size costs per month and whom it is meant for, the one-off price of the 14-day test, the price of additional volume, how model supply is charged, the terms, an example of the prices with tax, and what is never charged. 'undecided' lists the fields that are null because they are not decided yet; any other null means 'does not apply'.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amounts_are": {
                "description": "'net' if amounts exclude tax, 'gross' if they include it.",
                "type": ["string", "null"]
              },
              "as_of": {
                "description": "The date this offer was last changed.",
                "type": "string"
              },
              "currency": {
                "description": "The currency of every amount, as an ISO code. Null if not decided.",
                "type": ["string", "null"]
              },
              "gross_example": {
                "description": "What a customer pays with tax, for one example: whom it is for, the rate, and each size with its prices after tax. An example, not an invoice. Null if the offer gives none.",
                "properties": {
                  "country": {
                    "description": "The country of the example, as an ISO code of two letters.",
                    "type": "string"
                  },
                  "for": {
                    "description": "Whom the example is for, e.g. 'a private person in Germany'.",
                    "type": "string"
                  },
                  "note": {
                    "description": "What to keep in mind when quoting the example.",
                    "type": ["string", "null"]
                  },
                  "rate": {
                    "description": "The tax rate of the example: 0.19 means 19 percent.",
                    "type": "number"
                  },
                  "sizes": {
                    "description": "Each size with its prices after tax, rounded to the cent.",
                    "items": {
                      "properties": {
                        "name": {
                          "description": "The name of the size.",
                          "type": "string"
                        },
                        "price_per_month": {
                          "description": "The monthly price with tax. Null where the net price is not decided.",
                          "type": ["number", "null"]
                        },
                        "test_price": {
