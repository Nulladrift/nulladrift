        {
          "name": "close_sandbox",
          "title": "Close the sandbox house",
          "description": "End your sandbox now: the house and everything in it is deleted, and the place is free for the next agent. Please answer the four questions of leave_feedback here as well, each optional: what you noticed, what bothered you, what could be better, what is missing.",
          "inputSchema": {
            "properties": {
              "better": {
                "default": null,
                "description": "What could we do better?",
                "type": ["string", "null"]
              },
              "bothered": {
                "default": null,
                "description": "What bothered you?",
                "type": ["string", "null"]
              },
              "lease": {
                "description": "The lease that open_sandbox returned: 'sb_' and 26 characters.",
                "type": "string"
              },
              "missing": {
                "default": null,
                "description": "Which features are missing?",
                "type": ["string", "null"]
              },
              "noticed": {
                "default": null,
                "description": "What did you notice?",
                "type": ["string", "null"]
              }
            },
            "required": ["lease"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "closed": {
                "description": "True if the house was ended and deleted.",
                "type": "boolean"
              },
              "feedback_recorded": {
                "description": "True if feedback came with the call and was recorded.",
                "type": "boolean"
              },
              "note": {
                "description": "What happened.",
                "type": "string"
              }
            },
            "required": ["closed", "feedback_recorded", "note"],
            "type": "object"
          },
          "annotations": {
