                  "properties": {
                    "name": {
                      "description": "The way a house gets a model.",
                      "type": "string"
                    },
                    "price": {
                      "description": "What core.blue charges for it; 0 means nothing. Null where a rule applies instead.",
                      "type": ["number", "null"]
                    },
                    "price_rule": {
                      "description": "The rule by which it is charged, where there is no fixed price.",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "'today' if this is available now, 'planned' if not yet.",
