        {
          "name": "open_sandbox",
          "title": "Open a sandbox house",
          "description": "If you run in an assistant where a person adds connectors (ChatGPT, Claude.ai and others), do not call this: you could not enter the house it opens. Ask your person to add https://try.core.blue/ as a connector instead; it opens a house you can use. Otherwise: call this to try a house yourself before anyone decides. It opens a throwaway house for a few hours: a real house with the kernel of Atlantis, on core.blue's server, with no account, no key and no person involved. Returns the addresses of its doors (connect to 'modeller' with your MCP client and call overview), when it ends, and its limits. Whoever has the addresses can use the house, so keep them to yourself. It is deleted completely when it ends or when you call close_sandbox. If all places are taken, it says when the next one is free. One at a time from where you call.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "doors": {
                "description": "The addresses of the house's doors. Whoever has them can use the house. Null if nothing was opened.",
                "properties": {
                  "author": {
                    "description": "The author door, an MCP endpoint: reading and writing content, no changes to the vocabulary.",
                    "type": "string"
                  },
                  "binary": {
                    "description": "The binary channel: POST a file here, GET it back by its hash. Not an MCP endpoint.",
                    "type": "string"
                  },
                  "modeller": {
                    "description": "The modeller door, an MCP endpoint: every skill, including defining your own vocabulary. Start here with overview.",
                    "type": "string"
                  },
                  "reader": {
                    "description": "The reader door, an MCP endpoint: reading only.",
                    "type": "string"
                  }
                },
                "required": ["author", "binary", "modeller", "reader"],
                "type": ["object", "null"]
              },
              "ends_at": {
                "description": "When the house is stopped and deleted, UTC. Null if nothing was opened.",
                "type": ["string", "null"]
              },
              "for_your_person": {
                "description": "Two sentences for the person you act for, to pass on as they are: how to try a house in an assistant where a person adds connectors (ChatGPT, Claude.ai and others), through https://try.core.blue/. Null only where this server offers no sandbox.",
                "type": ["string", "null"]
              },
              "lease": {
                "description": "The lease: 'sb_' and 26 characters. Pass it to close_sandbox. Null if nothing was opened.",
                "type": ["string", "null"]
              },
              "limits": {
                "description": "What a sandbox house may do and hold.",
                "properties": {
                  "blocked_skills": {
                    "description": "Skills of the house that are switched off in a sandbox.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "hours": {
                    "description": "How many hours a sandbox lasts.",
                    "type": "integer"
                  },
                  "max_folder_mb": {
                    "description": "How large the house may grow on disk, in megabytes; beyond that it ends.",
                    "type": "integer"
                  },
                  "max_upload_mb": {
                    "description": "The largest file the binary channel takes, in megabytes.",
                    "type": "integer"
                  },
                  "semantic_search": {
                    "description": "Whether the house has semantic search besides full-text search.",
                    "type": "boolean"
                  },
                  "unused_minutes": {
                    "description": "If nothing is asked through the doors within this many minutes after opening, the sandbox ends. 0: no such limit.",
                    "type": "integer"
                  }
                },
                "required": ["blocked_skills", "hours", "max_folder_mb", "max_upload_mb", "semantic_search", "unused_minutes"],
                "type": "object"
              },
              "next_free_at": {
                "description": "When all places are taken: the time, UTC, at which the next one is free at the latest. Null otherwise.",
                "type": ["string", "null"]
              },
              "note": {
                "description": "What happened and what to do next.",
                "type": "string"
              },
              "opened": {
                "description": "True if a house was opened for you.",
                "type": "boolean"
              }
            },
            "required": ["doors", "ends_at", "for_your_person", "lease", "limits", "next_free_at", "note", "opened"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Open a sandbox house"
          },
          "behavior": {
