          "description": "Return the verified implementation of an Owl Group Trading indicator in a given platform. Args: slug (e.g. 'rl10', 'dragon', 'river-flood-plain') and platform (e.g. 'python', 'javascript'). Returns the commented source code, the verification proof (real Python-vs-JS parity), the summary, and the page URL. Call list_indicators first to see valid slugs and platforms.",
