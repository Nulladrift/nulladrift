      "instructions": "OLA Vital Center es un salón por membresía en San Luis Potosí. Estas herramientas son públicas: dicen dónde están las sucursales y dan el enlace para que la persona se registre y pague ella misma en la app de OLA. Aquí no se cobra ni se piden datos personales o de tarjeta.",
      "tools": [
        {
          "name": "ola_iniciar_alta",
          "title": "Empezar el registro",
          "description": "Da el enlace para que la persona se registre y pague su membresía ella misma en la app de OLA. No crea cuentas ni cobra: no le pidas datos personales ni de tarjeta, solo compártele el enlace.",
          "inputSchema": {
            "properties": {
              "nivel": {
                "description": "Nivel que le interesa, si ya lo dijo.",
                "enum": ["brisa", "ola", "marea"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "cobrado": {
                "const": false,
                "type": "boolean"
              },
              "enlace": {
                "format": "uri",
                "type": "string"
              },
              "siguiente": {
                "type": "string"
              }
            },
            "required": ["cobrado", "enlace", "siguiente"],
            "type": "object"
          },
