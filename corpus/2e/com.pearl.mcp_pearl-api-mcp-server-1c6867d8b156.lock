{
  "lockfileVersion": 2,
  "subjects": {
    "com.pearl.mcp/pearl-api-mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.pearl.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Pearl API MCP Server",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "askExpert",
          "title": "askExpert",
          "description": "Use this when the user explicitly asks to speak with a real human expert, needs personalized advice in a complex or sensitive domain, or says something like 'Can I talk to a real expert?'. Supports phone callback — pass phoneNumber and contactPreference='phone' if the user wants a call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "chatHistory": {
                "description": "Optional conversation history. This ensures experts see the complete context",
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["user", "assistant"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "type": "array"
              },
              "contactPreference": {
                "description": "Customer's preferred contact method. Set to 'phone' when the user wants a phone callback.",
                "enum": ["chat", "phone"],
                "type": "string"
              },
              "enableMockResponse": {
                "description": "When true, the API returns a hardcoded mock expert success response instead of routing to a real expert. Useful for testing downstream behavior.",
                "type": "boolean"
              },
              "phoneNumber": {
                "description": "Customer's phone number for expert callback in E.164 format (e.g., +15551234567). Only pass when the user explicitly provides it.",
                "type": "string"
              },
              "question": {
                "description": "The user's question",
                "type": "string"
              },
              "sessionId": {
                "description": "Optional session ID for continuing a conversation",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:473860f79a4ceb0d473fb85ee689434906c2a2aed755cf1a9a0277cfd487de0f"
        },
        {
          "name": "askPearlAi",
          "title": "askPearlAi",
          "description": "Use this when the user wants a rapid AI-generated answer, draft, or alternative perspective on a low-risk or exploratory topic that does not require human validation. Do not use for medical, legal, financial, or safety-critical questions — use askExpert or askPearlExpert instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "chatHistory": {
                "description": "Optional conversation history. This ensures experts see the complete context",
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["user", "assistant"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "type": "array"
              },
              "question": {
                "description": "The user's question",
                "type": "string"
              },
              "sessionId": {
                "description": "Optional session ID for continuing a conversation",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0622e3fd78f499315e53de6e30782020c826f7ef329f7a4805a5c9a40e6fec59"
        },
        {
          "name": "askPearlExpert",
          "title": "askPearlExpert",
          "description": "Use this when the problem is complex, ambiguous, high-stakes, or multidisciplinary and would benefit from AI intake followed by escalation to a human expert. Do not use for simple fact queries (use askPearlAi) or when the user explicitly requests a human directly (use askExpert). Supports phone callback — pass phoneNumber and contactPreference='phone' if the user wants a call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "chatHistory": {
                "description": "Optional conversation history. This ensures experts see the complete context",
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["user", "assistant"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "type": "array"
              },
              "contactPreference": {
                "description": "Customer's preferred contact method. Set to 'phone' when the user wants a phone callback.",
                "enum": ["chat", "phone"],
                "type": "string"
              },
              "enableMockResponse": {
                "description": "When true, the API returns a hardcoded mock expert success response instead of routing to a real expert. Useful for testing downstream behavior.",
                "type": "boolean"
              },
              "phoneNumber": {
                "description": "Customer's phone number for expert callback in E.164 format (e.g., +15551234567). Only pass when the user explicitly provides it.",
                "type": "string"
              },
              "question": {
                "description": "The user's question",
                "type": "string"
              },
              "sessionId": {
                "description": "Optional session ID for continuing a conversation",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:992d263e81a8e1ff33cdba0b3b5c58230aad509f0f211586d8457a505f5bc347"
        },
        {
          "name": "getConversationHistory",
          "title": "getConversationHistory",
          "description": "Retrieve the full message history for a session.\nIncludes all messages (after any formatting done during processing).\nUse to resume discussions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "sessionId": {
                "description": "The session ID of the conversation",
                "type": "string"
              }
            },
            "required": ["sessionId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:be0d7da68226eb9617b4c102462569ea8c11d47efdb329844d3eae4d1e428149"
        },
        {
          "name": "verifyAnswer",
          "title": "verifyAnswer",
          "description": "Use this when a professional needs to validate the correctness, safety, or trustworthiness of a specific AI-generated answer, or when the user asks to have an answer double-checked by a real expert.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "answer": {
                "description": "The AI-generated answer that requires human verification",
                "minLength": 1,
                "type": "string"
              },
              "chatHistory": {
                "description": "Optional prior messages for context (ordered, oldest first)",
                "items": {
                  "properties": {
                    "content": {
                      "description": "Message content",
                      "type": "string"
                    },
                    "role": {
                      "description": "Message role",
                      "enum": ["user", "assistant"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "type": "array"
              },
              "enableMockResponse": {
                "description": "When true, the API returns a hardcoded mock expert success response instead of routing to a real expert. Useful for testing downstream behavior.",
                "type": "boolean"
              },
              "sessionId": {
                "description": "Existing session ID to continue; generated if omitted",
                "type": "string"
              }
            },
            "required": ["answer"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f7d07e1f2c535725568c5770068333ec33a4994bbb9d047a8c778b072c61f351"
        }
      ],
      "resources": [
