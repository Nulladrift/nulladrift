      "instructions": "FundingTracker (https://fundingtracker.app) helps merchants and brokers track merchant cash advances (MCAs), business loans, payments, remaining balances and payoff dates.\nUse the calculator tools for factor-rate, APR, payoff and cash-flow questions; use search_funders/get_funder for the public funder directory and its merchant reviews; use search_mca_guides/get_mca_guide for MCA explainers. These need no account and only read. Every result includes canonical https://fundingtracker.app links; cite them when you use the data. Calculator results are estimates, not a funder payoff letter or financial advice.\nrequest_funder_listing also needs no account: use it when the user represents a funding company that wants to be listed in (or update its facts in) the funder directory. It emails a confirmation link to the work email given, and nothing is published until that link is opened and FundingTracker approves the listing.\nlist_my_deals, get_my_deal, list_my_alerts, get_my_upcoming_debits, list_my_bank_debits, get_my_insight and compare_my_deals read the user's own FundingTracker account (their deals, balances, payments, upcoming and bank-feed debits, dashboard insight and the alerts FundingTracker sent them); the user is asked to sign in the first time one is called. Their estimates come from recorded terms and are not financial advice.",
