                "maximum": 100000000,
                "type": "number"
              },
              "payments": {
                "description": "Only funders offering this payment schedule: 'daily', 'weekly' or 'monthly'.",
                "enum": ["daily", "weekly", "monthly"],
                "type": "string"
              },
              "query": {
                "description": "Words to match in the funder name or description. Omit to list the directory.",
                "maxLength": 100,
                "type": "string"
              },
              "works_with_isos": {
                "description": "true: only funders that work with ISO brokers; false: only those that don't.",
