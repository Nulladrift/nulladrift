        {
          "name": "request_funder_listing",
          "title": "Request a funder directory listing",
          "description": "Ask FundingTracker to list a funding company (direct funder, ISO/broker or other) in its public funder directory, or to update the facts of a company already listed: max deal, payment schedules, whether it works with ISO brokers, and states served. No sign-in needed; use it only for a company the user represents. FundingTracker emails a confirmation link to contact_email, which should be at the company website's domain (another domain gets a closer review). Nothing is published until that link is opened and FundingTracker approves the listing. Returns the request status, e.g. waiting for email confirmation. One open request per website; rate-limited.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "description": "Company name as it should appear in the directory, e.g. 'Biz Capital Miami'.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "contact_email": {
                "description": "Work email at the company's own domain. A confirmation link is sent here; an email at another domain gets a closer review.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "contact_name": {
                "description": "Name of the person requesting the listing.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "max_deal": {
                "description": "Largest deal funded, in USD, e.g. 250000.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "payments": {
                "description": "Payment schedules offered: any of 'daily', 'weekly', 'monthly'.",
                "items": {
                  "enum": ["daily", "weekly", "monthly"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "states": {
                "anyOf": [
                  {
                    "const": "all",
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 60,
                    "type": "array"
                  }
                ],
                "description": "U.S. states served: 'all' for nationwide, or two-letter codes like ['FL', 'GA', 'TX']."
              },
              "type": {
                "description": "'direct_funder' (funds deals from its own capital), 'broker' (ISO/broker) or 'other'.",
                "enum": ["direct_funder", "broker", "other"],
                "type": "string"
              },
              "website": {
                "description": "Company website, e.g. 'bizcapitalmiami.com'.",
                "maxLength": 200,
                "minLength": 4,
                "type": "string"
              },
              "works_with_isos": {
                "description": "Whether the company works with ISO brokers.",
                "type": "boolean"
              }
            },
            "required": ["company", "contact_email", "contact_name", "website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a funder directory listing"
          },
          "behavior": {
            "destructive": false,
