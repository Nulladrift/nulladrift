        {
          "name": "calculate_mca_apr",
          "title": "MCA factor rate to APR",
          "description": "Convert a merchant cash advance factor rate into total payback, cost of capital, payment size, number of payments and effective APR. Daily payments are business days (21 per month, 252 per year); weekly is 4.33 per month. APR discounts each payment to present value, the same formula as the FundingTracker MCA calculator.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "advance": {
                "description": "Funded advance amount in USD, e.g. 50000.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "factor_rate": {
                "description": "Factor rate, e.g. 1.35 (total payback = advance x factor rate). Between 1.0 and 2.0.",
                "maximum": 2,
                "minimum": 1,
                "type": "number"
              },
              "payment_frequency": {
                "default": "daily",
                "description": "Payment frequency: 'daily' (business days, Mon-Fri) or 'weekly'.",
                "enum": ["daily", "weekly"],
                "type": "string"
              },
              "term_months": {
                "description": "Repayment term in months (1-24), e.g. 6.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["advance", "factor_rate", "term_months"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "advance": {
                "type": "number"
              },
              "calculator_url": {
                "type": "string"
              },
              "cost_of_capital": {
                "type": "number"
              },
              "effective_apr_percent": {
                "type": "number"
              },
              "factor_rate": {
                "type": "number"
              },
              "learn_more_url": {
                "type": "string"
              },
              "method": {
                "type": "string"
              },
              "number_of_payments": {
                "type": "number"
              },
              "payment_amount": {
                "type": "number"
              },
              "payment_frequency": {
                "enum": ["daily", "weekly"],
                "type": "string"
              },
              "term_months": {
                "type": "number"
              },
              "total_payback": {
                "type": "number"
              }
            },
            "required": ["advance", "calculator_url", "cost_of_capital", "effective_apr_percent", "factor_rate", "learn_more_url", "method", "number_of_payments", "payment_amount", "payment_frequency", "term_months", "total_payback"],
            "type": "object"
