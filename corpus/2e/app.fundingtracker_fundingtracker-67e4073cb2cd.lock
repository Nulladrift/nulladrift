        {
          "name": "estimate_mca_payoff",
          "title": "MCA payoff estimate",
          "description": "Estimate the remaining balance, payments left and projected payoff date of a merchant cash advance from the advance amount, factor rate, amount already paid and the daily or weekly payment. Remaining balance = total payback - amount paid; daily payments skip weekends.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "advance": {
                "description": "Funded advance amount in USD, e.g. 50000.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "amount_paid": {
                "default": 0,
                "description": "Total already repaid in USD. Defaults to 0.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "as_of_date": {
                "description": "Date to project from (YYYY-MM-DD). Defaults to today (UTC).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "factor_rate": {
                "description": "Factor rate, e.g. 1.35 (total payback = advance x factor rate). Between 1.0 and 2.0.",
                "maximum": 2,
                "minimum": 1,
                "type": "number"
              },
              "payment_amount": {
                "description": "The daily or weekly payment amount in USD, e.g. 450.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "payment_frequency": {
                "default": "daily",
                "description": "Payment frequency: 'daily' (business days, Mon-Fri) or 'weekly'.",
                "enum": ["daily", "weekly"],
                "type": "string"
              }
            },
            "required": ["advance", "factor_rate", "payment_amount"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "advance": {
                "type": "number"
              },
              "amount_paid": {
                "type": "number"
              },
              "as_of_date": {
                "type": "string"
              },
              "calculator_url": {
                "type": "string"
              },
              "calendar_days_left": {
                "type": "number"
              },
              "estimated_payoff_date": {
                "type": "string"
              },
              "factor_rate": {
                "type": "number"
              },
              "learn_more_url": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "payment_amount": {
                "type": "number"
              },
              "payment_frequency": {
                "enum": ["daily", "weekly"],
                "type": "string"
              },
              "payments_left": {
                "type": "number"
              },
              "percent_paid": {
                "type": "number"
              },
              "remaining_balance": {
                "type": "number"
              },
              "total_payback": {
                "type": "number"
              }
            },
            "required": ["advance", "amount_paid", "as_of_date", "calculator_url", "calendar_days_left", "estimated_payoff_date", "factor_rate", "learn_more_url", "note", "payment_amount", "payment_frequency", "payments_left", "percent_paid", "remaining_balance", "total_payback"],
            "type": "object"
          },
