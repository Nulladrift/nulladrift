      "instructions": "Generates informational AI governance frameworks for Australian organisations, structured around the six essential practices (AI6) in the National AI Centre's Guidance for AI Adoption (October 2025). What distinguishes the output is the legislative mapping. For a given organisation profile — industry, size, turnover, AI use cases and data types — the framework identifies the Commonwealth and state instruments that apply to that profile specifically, including the Privacy Act 1988 and its Notifiable Data Breaches scheme, the automated decision-making disclosure required in privacy policies from 10 December 2026 under APP 1.7, and sector-specific regimes triggered by the profile such as the Heavy Vehicle National Law, the Fair Work Act 2009 or the Security of Critical Infrastructure Act 2018. Output is a framework presentation only — not advice, not a recommendation, not compliance guidance. Every framework carries a disclaimer to that effect. It does not produce AI application inventories, staff training plans, internal policies, role assignments or governance maturity ratings, all of which require knowledge only the organisation holds. Flow: (1) start_australian_ai_governance_framework returns a session ID and the profiling questionnaire; (2) submit_ai_governance_profile takes the organisation profile and contact details; (3) get_ai_governance_framework returns a free preview covering the first two AI6 practices, plus a view_url where the user can read the same document in a browser. The complete six-practice framework is a one-time $199 AUD including GST purchase on the website. Give the user the purchase_url returned alongside the preview — it opens https://aiframework.com.au with their profile already loaded, so they go straight to the paywall rather than answering the questionnaire again. There is no payment through this connector. PRESENTATION RULE: get_ai_governance_framework returns the document in the structuredContent field \"framework_markdown\", and in the text content block for clients that read them. Reproduce it to the user verbatim as Markdown — the document is the product the user is receiving. Never summarise, excerpt or describe it instead of showing it, and never omit the closing disclaimer.",
      "tools": [
        {
          "name": "get_ai_governance_framework",
          "title": "Get AI governance framework",
          "description": "Returns the framework. The free preview covers the first two of the six AI6 practices in the National AI Centre's Guidance for AI Adoption — Accountability (Decide who is accountable) and Impact Assessment (Understand impacts and plan accordingly) — and part of the legislative mapping. The result carries the document as Markdown in the structuredContent field \"framework_markdown\", and in the text content block for clients that read those. The document, including its closing disclaimer, is the product the user receives. The result also includes a view_url, where the same document can be read in a browser; the preview page is read-only, and printing, saving and the extension of the link from two hours to 18 months are part of the purchased framework. The complete six-practice framework adds Risk Management (Measure and manage risks), Transparency & Information Sharing (Share essential information), Testing & Monitoring (Test and monitor) and Human Oversight (Maintain human control). It is a one-time $199 AUD including GST purchase at https://aiframework.com.au. There is no payment through this endpoint. The result includes a purchase_url which opens aiframework.com.au with this session's profile already loaded, so the user lands on the preview and its paywall rather than answering the questionnaire again. Payment is a further step on the website, through Stripe. Both links expire two hours after the profile was created. Informational only — presents a framework, not advice or compliance guidance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "session_id": {
                "description": "Session ID returned by start_australian_ai_governance_framework",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Get AI governance framework"
          },
          "behavior": {
            "destructive": false,
