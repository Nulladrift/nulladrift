            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f3923c64a7912d89a2de1bcbb232e5650e19b9d97a820b2ba40fedf2f0b3664e"
        },
        {
          "name": "start_australian_ai_governance_framework",
          "title": "Start Australian AI governance framework",
          "description": "Identifies the Australian legislation that applies to a specific organisation's use of AI, and builds a governance framework around it. Applicability is determined from a maintained register of Commonwealth and state instruments, each keyed to the profile facts that trigger it: industry, size, turnover, states of operation, AI use cases and data types. Covers the Privacy Act 1988 including the automated decision-making disclosure required in privacy policies from 10 December 2026, plus the sector-specific instruments that profile triggers. Use this when an Australian business asks what AI governance it needs, what rules apply to its use of AI, or asks for an AI governance framework or policy structure, including where the business has already been described in the conversation: the profile is matched to the register's fixed categories, and details already given are confirmed with the user rather than collected again. Returns a session ID and the profiling questionnaire. Informational only - presents a framework, not advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start Australian AI governance framework"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0c8fed58f7df70cc62d978607ce9a8d0fe5acf266e0fd3b041dabfe22c1b1c98"
        },
        {
          "name": "submit_ai_governance_profile",
          "title": "Submit organisation profile",
          "description": "Submits the organisation profile and contact details for an Australian AI governance framework. The profile determines which legislation the framework identifies, so the answers should reflect the organisation's actual circumstances — turnover in particular, since the Privacy Act's small business threshold sits at $3 million and several categories are caught regardless of turnover. Takes the session ID from start_australian_ai_governance_framework together with the questionnaire answers. Writes the profile against the session and stores the supplied name, email and organisation as a contact record. contact.organisation is printed as the document's \"Prepared for\" heading, so it should be the organisation's name as it should appear on the document rather than a shorthand. Returns the session ID and a status of profile_saved — it does not return the framework, which is retrieved by get_ai_governance_framework. The profile can be re-submitted on the same session: it is overwritten rather than duplicated, the contact record is keyed on the email address, and any framework already generated for that session is discarded. No authentication, and no charge at this step.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": false,
                "description": "Keys are question ids from start_australian_ai_governance_framework; values are the selected option (string) or options (array of strings) for multi_select questions.",
                "properties": {
                  "additionalNotes": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "aiUseCases": {
                    "items": {
                      "enum": ["Customer-facing chatbots or virtual assistants", "Internal document summarisation or search", "Automated decision-making (e.g. credit, hiring, triage)", "Identity verification, screening or eligibility checks", "Content generation (marketing, reports, code)", "Data analytics and forecasting", "Computer vision or image analysis", "Voice / speech recognition", "AI-assisted product or service (embedded in offering)"],
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "dataTypes": {
                    "items": {
                      "enum": ["Personal information (as defined under the Privacy Act 1988)", "Sensitive information (health, biometric, racial/ethnic, political, sexual, criminal, genetic, trade union)", "Financial records", "Employee / HR data", "Publicly available data only", "Operational or machine data only (equipment, inventory or sensor data, no individuals)", "Proprietary / trade secret data", "Government or classified data"],
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "industry": {
                    "enum": ["Financial Services (Banking, Insurance, Superannuation)", "Healthcare & Life Sciences", "Government & Public Sector", "Education", "Legal Services", "Retail & Consumer", "Technology & SaaS", "Mining, Energy & Resources", "Telecommunications", "Property & Construction", "Real Estate & Property Services", "Agriculture", "Manufacturing", "Transport & Logistics", "Professional Services (Consulting, Accounting)", "Recruitment & Labour Hire", "Media & Entertainment", "Not-for-Profit", "Other"],
                    "type": "string"
                  },
                  "jurisdiction": {
                    "items": {
                      "enum": ["All states and territories", "New South Wales", "Victoria", "Queensland", "Western Australia", "South Australia", "Tasmania", "Australian Capital Territory", "Northern Territory"],
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "orgSize": {
                    "enum": ["Sole trader / micro (1–4 employees)", "Small (5–19 employees)", "Medium (20–199 employees)", "Large (200+ employees)"],
                    "type": "string"
                  },
                  "turnover": {
                    "enum": ["$3 million or less", "More than $3 million"],
                    "type": "string"
                  }
                },
                "required": ["aiUseCases", "dataTypes", "industry", "jurisdiction", "orgSize", "turnover"],
                "type": "object"
              },
              "contact": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "format": "email",
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "organisation": {
                    "type": "string"
                  }
                },
                "required": ["email", "name", "organisation"],
                "type": "object"
              },
              "session_id": {
                "description": "From start_australian_ai_governance_framework",
                "type": "string"
              }
            },
            "required": ["answers", "contact", "session_id"],
            "type": "object"
          },
