        {
          "name": "get_child_summary",
          "title": "Child's SAT prep summary",
          "description": "A summary of how the child is doing, enough for most questions about the child: this week's practice, which is the last 7 days as the parent portal counts them, and status (ahead, on_track, behind, or not_enough_data, measured against the child's daily goal), the skills the portal says need focused attention, the top 2 focus areas, the latest tutor update, the next test date, and contextWeNeed. For when a parent asks how their child is doing. child is optional when the parent has one child on SATCoach. Not for predicting or estimating an SAT score: status measures practice against the daily goal only. Requires a connected SATCoach parent account.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {},
              {
                "child": "c_Q3m9xT2bLk7vN0pRw4sY1A"
              }
            ],
            "properties": {
              "child": {
                "description": "The child's reference, from the list of the parent's children. Optional when the parent has one child on SATCoach.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "asOf": {
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                "type": "string"
              },
              "child": {
                "pattern": "^c_[A-Za-z0-9_-]{22}$",
                "type": "string"
              },
              "contextWeNeed": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "child": {
                      "pattern": "^c_[A-Za-z0-9_-]{22}$",
                      "type": "string"
                    },
                    "field": {
                      "enum": ["goal", "pastTests", "upcomingTests"],
                      "type": "string"
                    },
                    "label": {
                      "maxLength": 30,
                      "minLength": 1,
                      "type": "string"
                    },
                    "question": {
