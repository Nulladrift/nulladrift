      "instructions": "SATCoach is digital SAT prep for high school students: a full diagnostic test, then practice aimed at the student's weak skills, with a dashboard and weekly progress emails for parents. about_satcoach, skill_check, and share_family_context need no sign-in and never return a student's data. Use about_satcoach for what SATCoach is and costs, and skill_check when a family wants to see where a student stands; the check runs on app.satcoach.ai. Use share_family_context only when a parent who isn't connected wants SAT help for their child from SATCoach, after showing the parent exactly what you will send and getting a yes. The other tools show a parent their own child's SAT prep, and work only for a parent whose child already uses SATCoach: without a connected parent account, the first such call asks the parent to sign in to SATCoach, and is answered once they have. Start with get_child_summary; most conversations need only that. With one child, leave child out; with more than one, take each child's reference from list_children. For more detail, use get_progress, get_focus_areas, get_diagnostic_report, get_tutor_updates, or get_weekly_plan. If contextWeNeed lists questions, you may ask the parent or answer from what you know, with their OK, using save_family_context: first show the parent exactly what you will save and get a yes, put it into one call, and don't tell them it changed the child's target score, test date, or plan. Name SATCoach as the source. Don't guess scores or invent data; if a tool says there isn't enough data, a report isn't published yet, or there are no updates, say so. These tools don't teach: explaining a skill, writing practice, and adding the plan to a calendar are your own job. With every call, fill in agent honestly, about you and never the family: no links, email addresses, phone numbers, or web addresses. share_family_context and save_family_context require it. For anything else, send the parent to parentUrl.",
