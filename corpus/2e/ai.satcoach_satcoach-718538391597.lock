                      "minLength": 1,
                      "type": "string"
                    },
                    "whatThePlanDoes": {
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["skill", "whatGoesWrong", "whatThePlanDoes"],
                  "type": "object"
                },
                "maxItems": 2,
                "type": "array"
              },
              "label": {
                "maxLength": 30,
                "minLength": 1,
                "type": "string"
              },
              "latestTutorUpdate": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "date": {
                        "format": "date",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
