          "description": "Public facts about SATCoach: who it's for, what it does, the test it supports (the digital SAT), current prices, how to start, and how parents connect their own assistant. For questions about SATCoach, or about SAT prep that targets a student's weak skills and keeps parents informed. It doesn't explain SAT problems, write practice questions, or give general study advice. It returns no student data.",
