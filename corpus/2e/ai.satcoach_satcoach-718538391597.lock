                },
                "required": ["accuracy", "dailyGoal", "daysCounted", "daysPracticed", "from", "questionsDone", "to"],
                "type": "object"
              }
            },
            "required": ["asOf", "child", "contextWeNeed", "focusAreas", "label", "latestTutorUpdate", "needsFocusedAttention", "nextTestDate", "parentUrl", "source", "status", "summary", "thisWeek"],
            "type": "object"
          },
