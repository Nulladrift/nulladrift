        {
          "name": "get_job",
          "title": "Get a job",
          "description": "Full details of one job by its id from search_jobs: facts, salary, description (usually a jopp brief) and the link to the original advert.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The job id from search_jobs.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "advantageLanguages": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "applyUrl": {
                "description": "The original advert: the employer's or source's page to read it in full and apply.",
                "type": "string"
              },
              "category": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "key": {
                        "type": "string"
                      },
                      "label": {
                        "type": "string"
                      }
                    },
                    "required": ["key", "label"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "company": {
                "type": "string"
              },
              "contractType": {
                "anyOf": [
                  {
                    "enum": ["permanent", "temporary", "internship", "apprenticeship", "freelance"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "description": {
                "description": "Markdown. Usually jopp's brief, a factual summary of the advert; the original advert at applyUrl is authoritative.",
                "type": "string"
              },
              "education": {
                "description": "Lowest education the advert asks for.",
                "type": ["string", "null"]
              },
              "experience": {
                "description": "Years of experience the advert asks for.",
                "type": ["string", "null"]
              },
              "id": {
                "type": "string"
              },
              "industry": {
                "type": ["string", "null"]
              },
              "isAgency": {
                "type": "boolean"
              },
              "language": {
                "anyOf": [
                  {
                    "enum": ["de", "fr", "it", "en", "other"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Language of title and description."
              },
              "leadership": {
                "anyOf": [
                  {
                    "enum": ["team_lead", "people_manager"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "locations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "offerKind": {
                "anyOf": [
                  {
                    "enum": ["job", "apprenticeship", "internship", "trainee", "working_student", "freelance", "taster", "not_a_job", "unknown"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "publishedAt": {
                "type": ["string", "null"]
              },
              "requiredLanguages": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "role": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "key": {
                        "type": "string"
                      },
                      "label": {
                        "type": "string"
                      }
                    },
                    "required": ["key", "label"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "salary": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "basis": {
                        "enum": ["stated", "estimated"],
                        "type": "string"
                      },
                      "currency": {
                        "type": "string"
                      },
                      "max": {
                        "type": ["number", "null"]
                      },
                      "min": {
                        "type": ["number", "null"]
                      },
                      "period": {
                        "type": ["string", "null"]
                      },
                      "text": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["basis", "currency", "max", "min", "period", "text"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "\"stated\" comes from the advert. \"estimated\" is a jopp estimate of the yearly salary at 100 % workload and is not from the advert."
              },
              "seniority": {
                "anyOf": [
                  {
                    "enum": ["entry", "professional", "senior", "lead", "management"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "start": {
                "description": "An ISO date, \"immediately\" or \"by_agreement\".",
                "type": ["string", "null"]
              },
              "status": {
                "enum": ["open", "closed"],
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "description": "The job on jopp.ai.",
                "type": "string"
              },
              "withJoppAccount": {
                "additionalProperties": false,
                "description": "What a person can do with this job after signing in to jopp.",
                "properties": {
                  "signInUrl": {
                    "type": "string"
                  },
                  "text": {
                    "type": "string"
                  }
                },
                "required": ["signInUrl", "text"],
                "type": "object"
              },
              "workMode": {
                "anyOf": [
                  {
                    "enum": ["onsite", "hybrid", "remote"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "workload": {
                "type": ["string", "null"]
              }
            },
            "required": ["advantageLanguages", "applyUrl", "category", "company", "contractType", "description", "education", "experience", "id", "industry", "isAgency", "language", "leadership", "locations", "offerKind", "publishedAt", "requiredLanguages", "role", "salary", "seniority", "start", "status", "title", "url", "withJoppAccount", "workMode", "workload"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
