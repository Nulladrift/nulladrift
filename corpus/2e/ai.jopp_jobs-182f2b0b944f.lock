{
  "lockfileVersion": 2,
  "subjects": {
    "ai.jopp/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://jopp.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "jopp",
        "title": "jopp – Jobs in der Schweiz",
        "version": "1.0.0",
        "description": "Search open jobs in Switzerland and read jopp job briefs.",
        "websiteUrl": "https://jopp.ai",
        "icons": [
          {
            "src": "https://jopp.ai/symbol.svg",
            "mimeType": "image/svg+xml"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "jopp (jopp.ai) is a job search for Switzerland and Liechtenstein. It lists open positions collected from employer career sites and public job boards; a job leaves the search when jopp finds its advert taken offline. Job content is mostly German, some French, Italian or English.\n\nUse search_jobs to find jobs and get_job for the full details of one. Filter by canton codes (map a city to its canton, e.g. Zürich → ZH, Lausanne → VD); list_categories returns the category and role keys for precise occupation filters.\n\nLehrstellen (Swiss vocational apprenticeships, Berufslehre) are a separate list: search_jobs returns regular jobs and internships by default and never a Lehrstelle. Pass segment \"apprenticeships\" to search the Lehrstellen instead; get_job reads either.\n\nDescriptions are jopp briefs: factual summaries of the advert written by jopp; a job is listed only once its brief exists, and a brief can lag a changed advert by a few minutes. The original advert at applyUrl is authoritative and is where people apply. Salaries with basis \"estimated\" are jopp estimates, not from the advert. Each job's url is its page on jopp.ai.",
      "tools": [
        {
