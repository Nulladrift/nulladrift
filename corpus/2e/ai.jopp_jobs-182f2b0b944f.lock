        {
          "name": "search",
          "title": "Search jobs (simple)",
          "description": "Keyword search over open jobs in Switzerland; returns ids, titles and links. search_jobs offers filters and more fields.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Keywords, e.g. \"Pflegefachfrau Bern\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search jobs (simple)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62eecf64621a4032e41e789199fe9b2a18b19ce881d5e196e017e1538471d038"
        },
        {
          "name": "search_jobs",
          "title": "Search jobs in Switzerland",
          "description": "Search open jobs in Switzerland and Liechtenstein by keywords and filters. Only jobs whose advert is still online are returned. Lehrstellen are listed only with segment apprenticeships. Returns up to 20 jobs per page, newest first for filter-only searches; keyword searches rank by relevance, favouring recent adverts and mixing companies. Use get_job for a job's full description.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "advertLanguages": {
                "description": "Language the advert is written in.",
                "items": {
                  "enum": ["de", "fr", "it", "en", "other"],
                  "type": "string"
                },
                "type": "array"
              },
              "cantons": {
                "description": "Two-letter canton codes (ZH, BE, VD, GE, …) or LI for Liechtenstein.",
                "items": {
                  "enum": ["AG", "AI", "AR", "BE", "BL", "BS", "FR", "GE", "GL", "GR", "JU", "LU", "NE", "NW", "OW", "SG", "SH", "SO", "SZ", "TG", "TI", "UR", "VD", "VS", "ZG", "ZH", "LI"],
                  "type": "string"
                },
                "maxItems": 27,
                "type": "array"
              },
              "category": {
                "description": "A category key from list_categories.",
                "maxLength": 60,
                "type": "string"
              },
              "contractTypes": {
                "description": "Not for segment apprenticeships.",
                "items": {
                  "enum": ["permanent", "temporary", "internship", "freelance"],
                  "type": "string"
                },
                "type": "array"
              },
              "cursor": {
                "description": "nextCursor of a previous search_jobs result; the other arguments are then ignored.",
                "maxLength": 4000,
                "type": "string"
              },
              "excludeAgencies": {
                "description": "Leave out recruitment agencies.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "publishedWithinDays": {
                "anyOf": [
                  {
                    "const": 1,
                    "type": "number"
                  },
                  {
                    "const": 3,
                    "type": "number"
                  },
                  {
                    "const": 7,
                    "type": "number"
                  },
                  {
                    "const": 14,
                    "type": "number"
                  },
                  {
                    "const": 30,
                    "type": "number"
                  }
                ]
              },
              "query": {
                "description": "Keywords matched against job title, company and description, with German word forms (e.g. \"Pflegefachfrau\", \"Software Engineer Python\"). All words must match; use OR between alternatives, \"quotes\" for phrases and -word to exclude. Place names match only the text; use cantons to filter by location.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "requiredLanguages": {
                "description": "Only jobs that require all of these languages.",
                "items": {
                  "enum": ["de", "fr", "it", "en"],
                  "type": "string"
                },
                "type": "array"
              },
              "role": {
                "description": "A role key from list_categories; requires its category.",
                "maxLength": 60,
                "type": "string"
              },
              "salaryStated": {
                "description": "Only jobs whose advert states a salary.",
                "type": "boolean"
              },
              "segment": {
                "default": "jobs",
                "description": "jobs (default): regular jobs and internships. apprenticeships: only Lehrstellen (Swiss vocational apprenticeships, Berufslehre). A search lists one of the two, never both.",
                "enum": ["jobs", "apprenticeships"],
                "type": "string"
              },
              "seniorities": {
                "items": {
                  "enum": ["entry", "professional", "senior", "lead", "management"],
                  "type": "string"
                },
                "type": "array"
              },
              "workModes": {
                "items": {
                  "enum": ["onsite", "hybrid", "remote"],
                  "type": "string"
                },
                "type": "array"
              },
              "workloadMax": {
                "description": "Highest workload in percent of full time (10–100).",
                "maximum": 100,
                "minimum": 10,
                "type": "integer"
              },
              "workloadMin": {
                "description": "Lowest workload in percent of full time (10–100).",
                "maximum": 100,
                "minimum": 10,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "nextCursor": {
                "description": "Pass as cursor for the next page; null at the end.",
                "type": ["string", "null"]
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "company": {
                      "type": "string"
                    },
                    "contractType": {
                      "anyOf": [
                        {
                          "enum": ["permanent", "temporary", "internship", "apprenticeship", "freelance"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "id": {
                      "type": "string"
                    },
                    "isAgency": {
                      "description": "True when a recruitment agency posted the job.",
                      "type": "boolean"
                    },
                    "locations": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "publishedAt": {
                      "description": "ISO date the job was published or first seen.",
                      "type": ["string", "null"]
                    },
                    "salary": {
                      "description": "Salary as stated in the advert, if any.",
                      "type": ["string", "null"]
                    },
                    "seniority": {
                      "anyOf": [
                        {
                          "enum": ["entry", "professional", "senior", "lead", "management"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "summary": {
                      "description": "A short excerpt of the job description.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The job on jopp.ai.",
                      "type": "string"
                    },
                    "workMode": {
                      "anyOf": [
                        {
                          "enum": ["onsite", "hybrid", "remote"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "workload": {
                      "description": "Workload in percent of full time, e.g. \"80–100 %\".",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["company", "contractType", "id", "isAgency", "locations", "publishedAt", "salary", "seniority", "summary", "title", "url", "workMode", "workload"],
                  "type": "object"
                },
                "type": "array"
              },
              "searchUrl": {
                "description": "The same search on jopp.ai.",
                "type": "string"
              },
              "total": {
                "description": "How many open jobs match.",
                "type": "number"
              }
            },
            "required": ["nextCursor", "results", "searchUrl", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search jobs in Switzerland"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a1cba85477b64138030d2c42e60c0578f189a0fd56a3204bab1adad97521aed0"
        }
      ],
      "digest": "sha256:97df5e26952b3878ba14461c6cb128558e257a109580c13cf6fcb8607fae3d54"
    }
  }
