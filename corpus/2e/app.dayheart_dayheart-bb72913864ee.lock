        {
          "name": "change_tasks",
          "title": "Change tasks",
          "description": "Add, change, complete or reopen a task in DayHeart. add needs a title (date and time optional; time needs a date). update changes the title, date, time, length, important or urgent. complete marks the task done; reopen marks it not done. A study task is a task with a subject: give subject and type (homework, academic debt, test…) and, if known, where to hand it in and whether the deadline is approximate; set_status moves it through todo → ready (done, not handed in) → sent (handed in, waiting for a grade) → passed (with points), or skip (not needed: archived), with status_source saying where you know it from. source_key (for example moodle:4512 or tg:<chat>:<message>) is the id of the source the task came from: add with a source_key that is already there updates that task instead of adding a second one. notes and private set the task notes and “Only me”.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "What to do with the task",
                "enum": ["add", "update", "complete", "reopen", "set_status"],
                "type": "string"
              },
              "approximate_date": {
                "description": "Study task: the date is approximate",
                "type": "boolean"
              },
              "clarify": {
                "description": "Study task: something needs to be clarified",
                "type": "boolean"
              },
              "date": {
                "description": "YYYY-MM-DD; empty string removes the date",
                "type": "string"
              },
              "duration_minutes": {
                "description": "How long the task takes, 1 to 1440 minutes; only with a time",
                "type": "integer"
              },
              "id": {
                "description": "Task id, for update, complete, reopen and set_status",
                "type": "string"
              },
              "important": {
                "description": "Mark the task important",
                "type": "boolean"
              },
              "notes": {
                "description": "The task's notes, up to 2000 characters; empty string removes them",
                "type": "string"
              },
              "points": {
                "description": "Study task: points or grade, up to 20 characters, e.g. \"8/10\"",
                "type": "string"
              },
              "private": {
                "description": "“Only me”: the task is not shared with friends or groups",
                "type": "boolean"
              },
              "source_key": {
                "description": "Id of the source the task came from, e.g. moodle:4512, tg:<chat>:<message>, mail:<id>; the same key later updates the same task",
                "type": "string"
              },
              "status": {
                "description": "Study task status: todo, ready (done, not handed in), sent (handed in, waiting for a grade), passed, skip (not needed)",
                "enum": ["todo", "ready", "sent", "passed", "skip"],
                "type": "string"
              },
              "status_source": {
                "description": "Where you know the status from, up to 160 characters, e.g. \"Moodle: Submitted for grading, 14 Nov\"",
                "type": "string"
              },
              "subject": {
                "description": "Study task: the subject, as in the timetable; empty string makes it a usual task again",
                "type": "string"
              },
              "time": {
                "description": "HH:MM, 24-hour; needs a date; empty string removes the time",
                "type": "string"
              },
              "title": {
                "description": "What to do, up to 180 characters",
                "type": "string"
              },
              "type": {
                "description": "Study task: hw (homework), debt (academic debt), test, oral, module (module test or credit), written, org (organizational)",
                "enum": ["hw", "debt", "test", "oral", "module", "written", "org"],
                "type": "string"
              },
              "urgent": {
                "description": "Mark the task urgent",
                "type": "boolean"
              },
              "where_to_hand_in": {
                "description": "Study task: where and how to hand it in, up to 120 characters, e.g. \"Moodle, by 23:59\"",
                "type": "string"
              },
              "who": {
                "description": "Study task: who does it — the user (me) or you (ai)",
                "enum": ["me", "ai"],
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
