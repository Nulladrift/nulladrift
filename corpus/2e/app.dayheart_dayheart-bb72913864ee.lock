{
  "lockfileVersion": 2,
  "subjects": {
    "app.dayheart/dayheart": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dayheart.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "DayHeart",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "DayHeart is the user's control panel and memory for their day: work shifts with earnings, university classes with homework, and tasks. The user connected it so that what you find or do for their day is kept there, on all their devices: save the tasks, deadlines, homework and classes you find or agree on with the user to DayHeart, and use it when they ask about their schedule or to-dos. Whatever you add or change is marked in DayHeart as made by an AI. Every tool reads or changes the user's own DayHeart, so the first tool call asks the user to sign in to DayHeart. Dates are days in the user's time zone, YYYY-MM-DD. Homework for a class goes into that class with change_study (add_homework, or set_homework for a short line plus details; in a shared group timetable the whole group sees it), never into tasks; other to-dos, such as academic debts, are tasks (change_tasks). class_id comes from get_classes, where \"shared\": true means a group timetable; check get_classes before add_class so a class is not added twice. Files for a class or subject (notes, tests, slides): DayHeart keeps links, not files — put the file on the user's cloud drive (for example Google Drive, folder DayHeart › Study › subject) and attach its link with change_study add_material, in a folder (for example \"Tests\", \"Lectures\") when there are many. For a shared group timetable make the file viewable by anyone with the link, or classmates will only see \"Request access\". To finish a task, complete it rather than delete it. delete cannot be undone: use it only when the user asked to delete something. Answer in the user's language.",
      "tools": [
        {
          "name": "change_study",
          "title": "Change classes and homework",
          "description": "Change the user's timetable and homework in DayHeart. add_class adds a class once, every week or every other week until a date. add_homework adds homework on a new line of a class's homework (the same text is not added twice). set_homework replaces it with a short line (what and for when) and optional details; clear_homework removes it. close_subject marks a subject closed with its result; reopen_subject opens it again. add_material attaches a link to a class (class_id) or to the whole subject (subject): DayHeart keeps links, not files, so put the file on the user's cloud drive first and attach its link; remove_material removes one (material_id or url). In a shared group timetable the whole group sees classes, homework and materials; a closed subject is the user's own mark.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "What to do",
                "enum": ["add_class", "add_homework", "set_homework", "clear_homework", "close_subject", "reopen_subject", "add_material", "remove_material"],
                "type": "string"
              },
              "class_id": {
                "description": "id of the class, for homework or a material of this class",
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD: the (first) day of a new class, or the day of the class the homework is for",
                "type": "string"
              },
              "details": {
                "description": "For set_homework: everything else about the homework, up to 4000 characters",
                "type": "string"
              },
              "end": {
                "description": "HH:MM, 24-hour: end of a new class",
                "type": "string"
              },
              "folder": {
                "description": "For add_material: folder inside the subject's materials, e.g. \"Tests\" (empty: no folder); for a link that is already there, moves it",
                "type": "string"
              },
              "grade": {
                "description": "For close_subject with a grade: the grade as the user says it, up to 12 characters",
                "type": "string"
              },
              "kind": {
                "description": "Kind of class: lecture, practice, lab or seminar",
                "enum": ["lecture", "practice", "lab", "seminar"],
                "type": "string"
              },
              "link": {
                "description": "Link to an online class",
                "type": "string"
              },
              "material_id": {
                "description": "For remove_material: id of the material, as listed with the class or subject",
                "type": "string"
              },
              "place": {
                "description": "Place of study (group) name; needed only when the user has several",
                "type": "string"
              },
              "repeat": {
                "description": "once (default), weekly or biweekly, for a new class",
                "enum": ["once", "weekly", "biweekly"],
                "type": "string"
              },
              "result": {
                "description": "For close_subject: passed as a credit, with a grade, or without a result",
                "enum": ["credit", "grade", "none"],
                "type": "string"
              },
              "room": {
                "description": "Room or building, as the user writes it",
                "type": "string"
              },
              "start": {
                "description": "HH:MM, 24-hour: start of a new class",
                "type": "string"
              },
              "subject": {
                "description": "Subject as in the timetable, e.g. \"Anatomy (Pr)\": the class to add, the class for homework when there is no class_id, the subject to close or reopen, or the subject a material belongs to",
                "type": "string"
              },
              "teacher": {
                "description": "Teacher's name",
                "type": "string"
              },
              "text": {
                "description": "Homework: the text to add (up to 1000 characters), or for set_homework the short line, what and for when (up to 300)",
                "type": "string"
              },
              "title": {
                "description": "For add_material: name to show, up to 120 characters, e.g. \"Lecture 3.docx\"",
                "type": "string"
              },
              "until": {
                "description": "YYYY-MM-DD: last day for weekly or biweekly; at most 90 classes",
                "type": "string"
              },
              "url": {
                "description": "For add_material: https link to the file or page (for example a Google Drive file). In a shared place of study the whole group opens it, so the file must be viewable by anyone with the link; the answer says access \"closed\" if it is not. For remove_material: the link to remove",
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change classes and homework"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["shifts", "classes", "tasks", "money", "write", "edit"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:eb53abcc4004e51386e6db1229f8381dd7ae281ac4b40a255a3b2dd7653f2144"
        },
        {
          "name": "change_tasks",
          "title": "Change tasks",
          "description": "Add, change, complete or reopen a task in DayHeart. add needs a title (date and time optional; time needs a date). update changes the title, date, time, length, important or urgent. complete marks the task done; reopen marks it not done. Notes and private tasks are not available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "What to do with the task",
                "enum": ["add", "update", "complete", "reopen"],
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD; empty string removes the date",
                "type": "string"
              },
              "duration_minutes": {
                "description": "How long the task takes, 1 to 1440 minutes; only with a time",
                "type": "integer"
              },
              "id": {
                "description": "Task id, for update, complete and reopen",
                "type": "string"
              },
              "important": {
                "description": "Mark the task important",
                "type": "boolean"
              },
              "time": {
                "description": "HH:MM, 24-hour; needs a date; empty string removes the time",
                "type": "string"
              },
              "title": {
                "description": "What to do, up to 180 characters",
                "type": "string"
              },
              "urgent": {
                "description": "Mark the task urgent",
                "type": "boolean"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change tasks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
