        {
          "name": "change_habits",
          "title": "Change habits",
          "description": "Track the user's habits in DayHeart. mark marks a habit for today or a past day (a count habit: value is the amount for the day, without value one more; a quit habit: a slip that day); unmark removes the day's mark. add adds a habit (title; kind check, count with target and unit, or quit; days of the week; section of the day; reminder times). update changes the title, target, unit, days, section or reminders; archive and restore hide a habit or bring it back.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "What to do",
                "enum": ["mark", "unmark", "add", "update", "archive", "restore"],
                "type": "string"
              },
              "date": {
                "description": "For mark and unmark: YYYY-MM-DD, today or a past day. Default: today",
                "type": "string"
              },
              "days": {
                "description": "Days of the week. Default: every day",
                "items": {
                  "enum": ["sun", "mon", "tue", "wed", "thu", "fri", "sat"],
                  "type": "string"
                },
                "type": "array"
              },
              "id": {
                "description": "Habit id, from the habits list",
                "type": "string"
              },
              "kind": {
                "description": "For add: check (done or not), count (an amount toward a target) or quit (a habit the user is quitting)",
                "enum": ["check", "count", "quit"],
                "type": "string"
              },
              "reminders": {
                "description": "Reminder times HH:MM, up to 6; an empty list removes them",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "section": {
                "description": "Part of the day",
                "enum": ["morning", "day", "evening", "other"],
                "type": "string"
              },
              "target": {
                "description": "Count habit: the amount for a day, 1 to 100000",
                "type": "integer"
              },
              "title": {
                "description": "Habit name, up to 120 characters",
                "type": "string"
              },
              "unit": {
                "description": "Count habit: unit, up to 20 characters, e.g. \"glasses\"",
                "type": "string"
              },
              "value": {
                "description": "For mark of a count habit: the amount for the day, 0 to 100000",
                "type": "integer"
              }
            },
            "required": ["action"],
            "type": "object"
          },
