                "scopes": ["shifts", "classes", "tasks", "money", "write", "edit", "habits", "settings", "state", "finance", "people", "notes"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:c44ed8d2a5990adfaf61bfa494ea3188d34f8576ada7588f9d88f1e1cd9d6658"
        },
        {
          "name": "change_finance",
          "title": "Change finance",
          "description": "Record the user's money in DayHeart. add adds an operation: an expense (with a category by name, or Other), an income, or a loan (lent — the user gave money, borrowed — the user took money; with the person and a due date). Amounts are in the main currency. The same operation sent again within 10 minutes counts as a repeat of the request; two identical ones need different notes. update changes an operation: amount, date, note, category, expense or income, and for a loan the person, due date or returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "What to do",
                "enum": ["add", "update"],
                "type": "string"
              },
              "amount": {
                "description": "Amount in the main currency, e.g. 12.5",
                "type": "number"
              },
              "category": {
                "description": "Expense category name, as in the user's categories; Other — no category",
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD. Default: today",
                "type": "string"
              },
              "due": {
                "description": "Loan: return by YYYY-MM-DD; empty string removes it",
                "type": "string"
              },
              "id": {
                "description": "Operation id, for update",
                "type": "string"
              },
              "note": {
                "description": "What it was, up to 200 characters",
                "type": "string"
              },
              "person": {
                "description": "Loan: who, up to 80 characters",
                "type": "string"
              },
              "returned": {
                "description": "Loan: the money is back",
                "type": "boolean"
              },
              "type": {
                "description": "expense, income, lent or borrowed",
                "enum": ["expense", "income", "lent", "borrowed"],
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change finance"
          },
          "behavior": {
