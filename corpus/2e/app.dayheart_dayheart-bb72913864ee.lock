{
  "lockfileVersion": 2,
  "subjects": {
    "app.dayheart/dayheart": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dayheart.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "DayHeart",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {},
        "tools": {}
      },
      "instructions": "DayHeart is the user's control panel and memory for their day: work shifts with earnings, university classes with homework, and tasks. The user connected it so that what you find or do for their day is kept there, on all their devices: save the tasks, deadlines, homework and classes you find or agree on with the user to DayHeart, and use it when they ask about their schedule or to-dos. Whatever you add or change is marked in DayHeart as made by an AI. Every tool reads or changes the user's own DayHeart, so the first tool call asks the user to sign in to DayHeart. Dates are days in the user's time zone, YYYY-MM-DD. Homework for a class goes into that class with change_study (add_homework, or set_homework for a short line plus details; in a shared group timetable the whole group sees it), never into tasks; other to-dos, such as academic debts, are tasks (change_tasks). class_id comes from get_classes, where \"shared\": true means a group timetable; check get_classes before add_class so a class is not added twice. Files for a class or subject (notes, tests, slides): DayHeart keeps links, not files — put the file on the user's cloud drive (for example Google Drive, folder DayHeart › Study › subject) and attach its link with change_study add_material, in a folder (for example \"Tests\", \"Lectures\") when there are many. For a shared group timetable make the file viewable by anyone with the link, or classmates will only see \"Request access\". Give each material its kind (guide, task, notes…) and source. What a teacher announced for a subject (dates, credit format, where to hand in) goes to that subject with change_study post_announcement, not into tasks; get_materials shows materials and announcements. What the user's study group will see (homework, classes, materials and announcements in a shared place) you add only after the user said yes to it: ask first. Handing in work, taking tests and writing to teachers happen outside DayHeart, and only with the user's explicit yes. Things to hand in for a subject (homework to submit, academic debts, tests, oral answers) are study tasks: change_tasks with subject and type; get_study_tasks lists them. Move the status with set_status and say in status_source where you know it from. Give source_key when the task or homework comes from a message, a Moodle item or an email, so the same source is never added twice. To finish a task, complete it rather than delete it; a study task that is not needed gets status skip (archived). delete cannot be undone: use it only when the user asked to delete something. Habits the user tracks: when they say they did one (drank water, went for a run), mark that habit for the day instead of adding a task; a count habit takes the amount. Mood and health entries are private health records the user chose to share: read them when the user asks, without diagnoses or medical advice, and add an entry only from what the user tells you about how they feel or slept. Money the user spends or receives is an operation in their finances; earnings from work shifts are counted separately. Birthdays and important dates of people the user knows live with those people; add a birthday to the person, not as a task. Change the user's settings only when they ask for it. When the user has to decide something (share with the group or not, which option), ask_user puts a card with answer buttons in DayHeart; read the answer later with get_answers. get_changes tells what the user changed since your last visit: keep its cursor. Answer in the user's language.",
      "tools": [
        {
          "name": "ask_user",
          "title": "Ask the user",
          "description": "Ask the user a question with 2 to 4 answer buttons. It appears as a card at the top of Study in DayHeart (or Tasks, when Study is off), with a push notification or a bot message; the user taps an answer, and the card disappears. The user may also close it without answering; a question not answered in 7 days expires. Up to 10 questions can wait at once; the same question is not asked twice while waiting, and a source_key that was already asked is never asked again: you get that question back with its answer — use a new source_key for a new question.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "options": {
                "description": "2 to 4 short answers, up to 40 characters each, e.g. [\"Yes, the whole group\", \"Only me\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "question": {
                "description": "The question, up to 300 characters, e.g. \"Notes for Anatomy, topic 9 are ready. Share them with the group?\"",
                "type": "string"
              },
              "source_key": {
                "description": "Id of what the question is about, e.g. moodle:4512; a key already asked returns that question and its answer instead of asking again",
                "type": "string"
              },
              "subject": {
                "description": "The subject the question is about, if any",
                "type": "string"
              }
            },
            "required": ["options", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Ask the user"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
