        {
          "name": "change_study",
          "title": "Change classes and homework",
          "description": "Change the user's timetable and homework in DayHeart. add_class adds a class once, every week or every other week until a date. add_homework adds homework on a new line of a class's homework (the same text is not added twice). set_homework replaces it with a short line (what and for when) and optional details; clear_homework removes it. close_subject marks a subject closed with its result; reopen_subject opens it again. archive_subject hides a subject with all its kinds of classes, as \"Archive subject\" in the app (in a shared place only its owner can); restore_subject brings it back. post_announcement adds a short announcement to a subject (what the teacher said: dates, credit format, where to hand in) with its source; pin_announcement pins or unpins it (in a shared place only its owner); remove_announcement removes one. add_material attaches a link to a class (class_id) or to the whole subject (subject): DayHeart keeps links, not files, so put the file on the user's cloud drive first and attach its link; remove_material removes one (material_id or url). With source_key (for example tg:<chat>:<message>) homework from the same source goes to the same class and is not added twice. In a shared group timetable the whole group sees classes, homework, materials and announcements, so add them there once the user agreed; a closed subject is the user's own mark.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "What to do",
                "enum": ["add_class", "add_homework", "set_homework", "clear_homework", "close_subject", "reopen_subject", "archive_subject", "restore_subject", "add_material", "remove_material", "post_announcement", "pin_announcement", "remove_announcement"],
                "type": "string"
              },
              "announcement_id": {
                "description": "For pin_announcement and remove_announcement: id of the announcement, as listed with the subject",
                "type": "string"
              },
              "class_id": {
                "description": "id of the class, for homework or a material of this class",
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD: the (first) day of a new class, or the day of the class the homework is for",
                "type": "string"
              },
              "details": {
                "description": "For set_homework: everything else about the homework, up to 4000 characters",
                "type": "string"
              },
              "end": {
                "description": "HH:MM, 24-hour: end of a new class",
                "type": "string"
              },
              "folder": {
                "description": "For add_material: folder inside the subject's materials, e.g. \"Tests\" (empty: no folder); for a link that is already there, moves it",
                "type": "string"
              },
              "grade": {
                "description": "For close_subject with a grade: the grade as the user says it, up to 12 characters",
                "type": "string"
              },
              "kind": {
                "description": "For add_class: kind of class — lecture, practice, lab or seminar. For add_material: guide, template, task (an assignment), notes, slides or sheet",
                "enum": ["lecture", "practice", "lab", "seminar", "guide", "template", "task", "notes", "slides", "sheet"],
                "type": "string"
              },
              "link": {
                "description": "Link to an online class",
                "type": "string"
              },
              "material_id": {
                "description": "For remove_material: id of the material, as listed with the class or subject",
                "type": "string"
              },
              "pinned": {
                "description": "For post_announcement and pin_announcement: pinned on top of the subject",
                "type": "boolean"
              },
              "place": {
                "description": "Place of study (group) name; needed only when the user has several",
                "type": "string"
              },
              "repeat": {
                "description": "once (default), weekly or biweekly, for a new class",
                "enum": ["once", "weekly", "biweekly"],
                "type": "string"
              },
              "result": {
                "description": "For close_subject: passed as a credit, with a grade, or without a result",
                "enum": ["credit", "grade", "none"],
                "type": "string"
              },
              "room": {
                "description": "Room or building, as the user writes it",
                "type": "string"
              },
              "source": {
