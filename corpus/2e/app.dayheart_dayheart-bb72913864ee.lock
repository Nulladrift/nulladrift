{
  "lockfileVersion": 2,
  "subjects": {
    "app.dayheart/dayheart": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dayheart.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "DayHeart",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "DayHeart is the user's day planner: work shifts with earnings, university classes and tasks. Every tool reads or changes the user's own DayHeart, so the first tool call asks the user to sign in to DayHeart. Dates are days in the user's time zone, YYYY-MM-DD. Homework for a class always goes into that class with add_homework (into the group's homework when the timetable is shared), never into tasks; other to-dos, such as academic debts, are tasks (add_task). class_id comes from get_classes, where \"shared\": true means a group timetable; check get_classes before add_class so a class is not added twice. Answer in the user's language.",
      "tools": [
        {
          "name": "add_class",
          "title": "Add a class to the timetable",
          "description": "Add a class (lesson) to the user's timetable in DayHeart: one class, or the same class every week or every other week (for alternating weeks) until a date. It goes into a place of study; in a shared group place the whole group gets it. Look and room, teacher and link come from an existing class of the same subject in that place when there is one. The same class at the same day and time is not added twice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "YYYY-MM-DD: the (first) day of the class",
                "type": "string"
              },
              "end": {
                "description": "HH:MM, 24-hour",
                "type": "string"
              },
              "kind": {
                "description": "Kind of class: lecture, practice, lab or seminar",
                "enum": ["lecture", "practice", "lab", "seminar"],
                "type": "string"
              },
              "link": {
                "description": "Link to an online class",
                "type": "string"
              },
              "place": {
                "description": "Place of study (group) name; needed only when the user has several",
                "type": "string"
              },
              "repeat": {
                "description": "once (default), weekly or biweekly",
                "enum": ["once", "weekly", "biweekly"],
                "type": "string"
              },
              "room": {
                "description": "Room or building, as the user writes it",
                "type": "string"
              },
              "start": {
                "description": "HH:MM, 24-hour",
                "type": "string"
              },
              "subject": {
                "description": "Subject, as it should appear, e.g. \"Anatomy (Pr)\"",
                "type": "string"
              },
              "teacher": {
                "description": "Teacher's name",
                "type": "string"
              },
              "until": {
                "description": "YYYY-MM-DD: last day for weekly or biweekly; at most 90 classes",
                "type": "string"
              }
            },
            "required": ["date", "end", "start", "subject"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a class to the timetable"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["shifts", "classes", "tasks", "money", "write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:a001112a2c645396b2fbd1406c36ec17b164f716dbbbb436a6e0a10f40da8e2e"
        },
        {
          "name": "add_homework",
          "title": "Write homework into a class",
          "description": "Write homework into a class in DayHeart: it goes into that class's Homework field, not into tasks; in a shared group timetable the whole group sees it. Takes the class id, or the subject and the date of the class it is due for; without a date it goes to the next class of that subject. The text is added on a new line after homework that is already there; the same text twice is not added again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "class_id": {
                "description": "id of the class",
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD: day of the class the homework is due for",
                "type": "string"
              },
              "subject": {
                "description": "Subject as in the timetable, e.g. \"Anatomy (Pr)\"",
                "type": "string"
              },
              "text": {
                "description": "The homework, up to 1000 characters",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Write homework into a class"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["shifts", "classes", "tasks", "money", "write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:3caf0e58c89d18c6d7dec9268943ae93b29393de0caf847247d7b78cbba18245"
        },
        {
          "name": "add_task",
          "title": "Add a task",
          "description": "Add a task to DayHeart. Date and time are optional; time needs a date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "time": {
                "description": "HH:MM, 24-hour",
                "type": "string"
              },
              "title": {
                "description": "What to do, up to 180 characters",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
