      "tools": [
        {
          "name": "analyze_image",
          "description": "Analyze an image\n\nFetch an image from a URL or base64 and return its metadata: size in bytes, pixel dimensions, source format, and what it costs every supported vision model in tokens. Always free. Dimensions are omitted if the image header cannot be read. Also reports whether the input carries a C2PA (Content Credentials) manifest and in which container; the manifest is not validated.\n\n### Responses:\n\n**200**: Successful Response (Success Response)\nContent-Type: application/json\n\n**Example Response:**\n```json\n{\n  \"size_bytes\": 1,\n  \"c2pa_manifest\": true\n}\n```",
          "inputSchema": {
            "properties": {
              "source": {
                "description": "Image source: a public URL (https://...) or a base64-encoded string (optionally as a data URI like data:image/png;base64,...).",
                "title": "source",
                "type": "string"
              }
            },
            "required": ["source"],
            "title": "analyze_imageArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ec89ac3794e08ad322a45c3ac1bbc25ab546ab0fc028b0dd7b8f4af182059c1a"
        },
        {
          "name": "compress_image",
          "description": "Compress an image\n\nRe-encode an image with quality/format options to reduce file size. Supports jpeg, png, webp, tiff, gif. Instead of a q number you can set quality_target (0-1]: the smallest file with SSIM at or above the target, searched on the worker (jpeg, webp, avif; flat surcharge; outcome reported in X-Pictomancer-Quality-* headers). If the output is not smaller than the input, the request is free (X-Pig-Billed: 0) and does not consume free-tier quota. Optional enhancement modifiers: denoise (1-3), equalize, sharpen (applied denoise -> equalize -> op -> sharpen).\n\n### Responses:\n\n**200**: Processed image binary (Success Response)\nContent-Type: application/json\nContent-Type: image/jpeg\n\n**Example Response:**\n```json\n\"string\"\n```\nContent-Type: image/png\n\n**Example Response:**\n```json\n\"string\"\n```\nContent-Type: image/webp\n\n**Example Response:**\n```json\n\"string\"\n```",
          "inputSchema": {
            "properties": {
              "autorot": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Apply EXIF orientation before compressing. Opt-in; default false, which preserves current byte-for-byte behavior.",
                "title": "autorot",
                "type": "boolean"
              },
              "delivery": {
                "discriminator": {
                  "mapping": {
                    "callback_url": "#/components/schemas/CallbackDelivery",
                    "inline": "#/components/schemas/InlineDelivery",
                    "put_url": "#/components/schemas/PutUrlDelivery"
                  },
                  "propertyName": "mode"
                },
                "oneOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "mode": {
                        "const": "inline",
                        "default": "inline",
                        "title": "Mode",
                        "type": "string"
                      }
                    },
                    "title": "InlineDelivery",
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "headers": {
                        "anyOf": [
                          {
                            "additionalProperties": {
                              "type": "string"
                            },
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Optional storage headers to include on the PUT call (Content-Type, Cache-Control, x-amz-acl, etc.). Whitelisted at SSRF layer.",
                        "title": "Headers"
                      },
                      "mode": {
                        "const": "put_url",
                        "title": "Mode",
                        "type": "string"
                      },
                      "put_url": {
                        "description": "Customer-signed presigned PUT URL where the optimized bytes will be written. Must be https://. Cloud credentials never reach our infrastructure; only the URL itself is used and discarded after the request.",
                        "format": "uri",
                        "maxLength": 2083,
                        "minLength": 1,
                        "title": "Put Url",
                        "type": "string"
                      }
                    },
                    "required": ["mode", "put_url"],
                    "title": "PutUrlDelivery",
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "callback_url": {
                        "description": "Customer endpoint where the optimized bytes will be POSTed. Must be https://. For async/large jobs. We send an X-Pig-Sha256 header of the body so the receiver can verify integrity. No credentials are stored on our side; secure the endpoint with a token in the URL itself.",
                        "format": "uri",
                        "maxLength": 2083,
                        "minLength": 1,
                        "title": "Callback Url",
                        "type": "string"
                      },
                      "headers": {
                        "anyOf": [
                          {
                            "additionalProperties": {
                              "type": "string"
                            },
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Optional headers to include on the POST call (Content-Type, Cache-Control, x-amz-*, etc.). Whitelisted at SSRF layer.",
                        "title": "Headers"
                      },
                      "mode": {
                        "const": "callback_url",
                        "title": "Mode",
                        "type": "string"
                      },
                      "secret": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Optional HMAC secret. When set, we sign the POST body with HMAC-SHA256 and send 'X-Pig-Signature: sha256=<hex>'. Used per request and never stored. Recompute the HMAC on your endpoint to authenticate the callback (constant-time compare).",
                        "title": "Secret"
                      }
                    },
                    "required": ["callback_url", "mode"],
                    "title": "CallbackDelivery",
                    "type": "object"
                  }
                ],
                "title": "delivery",
                "type": "string"
              },
              "denoise": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Median denoise before compressing: radius 1-3 (window 3x3 to 7x7). Opt-in; no surcharge.",
                "title": "denoise",
                "type": "integer"
              },
              "equalize": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Auto-contrast (histogram equalisation of the value channel; hue and saturation preserved) before compressing. Opt-in.",
                "title": "equalize",
                "type": "boolean"
              },
              "format": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Output format: jpeg, png, webp, tiff, gif, or avif. If omitted, the original format is preserved.",
                "title": "format",
                "type": "string"
              },
              "q": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Quality (1-100). Lower = smaller file. Typical values: 60-80 for web, 85-95 for print. Maps to libvips Q parameter.",
                "title": "q",
                "type": "integer"
              },
              "quality_target": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Target SSIM (0-1]: the worker searches for the smallest file that still scores at least this. Alternative to q; mutually exclusive with it. Requires an explicit format among jpeg, webp, avif. Carries a flat surcharge for the extra encodes.",
                "title": "quality_target",
                "type": "number"
              },
              "sharpen": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Unsharp-mask sharpen after compressing (libvips defaults). Opt-in.",
                "title": "sharpen",
                "type": "boolean"
              },
              "source": {
                "description": "Image source: a public URL (https://...) or a base64-encoded string (optionally as a data URI like data:image/png;base64,...).",
                "title": "source",
                "type": "string"
              },
              "strip": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Strip metadata (EXIF, ICC profile, etc.) from the output. Reduces file size slightly.",
                "title": "strip",
                "type": "boolean"
              }
            },
            "required": ["source"],
            "title": "compress_imageArguments",
            "type": "object"
