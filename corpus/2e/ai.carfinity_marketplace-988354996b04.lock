{
  "lockfileVersion": 2,
  "subjects": {
    "ai.carfinity/marketplace": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://carfinity.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "carfinity",
        "title": "Carfinity car marketplace",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Carfinity provides data on new and used cars listed for sale by US dealers. Each car is compared with similar cars in its local market. search_cars finds cars from a plain-language request. get_car returns one car's details and the reasons for its rank. compare_cars compares up to several cars. market_summary returns prices and counts for a model in a market. best_deals lists the top-ranked cars of a market. dealer_info returns a dealer's details. list_markets lists the covered markets. buyer_research returns monthly research on discounts and prices by state. draft_dealer_message returns a draft message and sends nothing. Prices are dealers' advertised prices before tax, title and registration. Results include the link to each car's page on carfinity.ai.",
      "tools": [
        {
          "name": "best_deals",
          "title": "Best deals in a market",
          "description": "The best-ranked car deals in one market right now: the top deals overall, then SUVs, trucks, sedans, hybrids and cars under $20,000. Each car comes with its price, how far under its market price it is, and its link. Use it for 'what are the best car deals in Pittsburgh' or 'best used car deals near Dallas'.",
          "inputSchema": {
            "properties": {
              "condition": {
                "description": "Only new or only used cars. Leave out for both.",
                "enum": ["new", "used"],
                "type": "string"
              },
              "market": {
                "description": "Market slug from list_markets, for example 'pittsburgh-pa'.",
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6200101528d047fef0549c29af5de440620296be2fa60cba44662dfa7961260f"
        },
        {
          "name": "buyer_research",
          "title": "Car buying research",
          "description": "Carfinity's research for car buyers, from today's dealer inventory. Topic 'best_new_cars': the new models with the biggest discounts off sticker price this month, for the whole country or one market. Topic 'best_states': every state ranked by what the same new models cost there against the national average. Quote the figures with the month and link the page given.",
          "inputSchema": {
            "properties": {
              "market": {
                "description": "Market slug, for best_new_cars in one market. Leave out for the whole country.",
                "type": "string"
              },
              "topic": {
                "description": "Which research to return.",
                "enum": ["best_new_cars", "best_states"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:30e70bc7709031e9374cbf4f7e32000988b4f4a99580ffce8ea5c402df731c66"
        },
        {
          "name": "compare_cars",
          "title": "Compare cars",
          "description": "Compare 2 to 4 cars side by side on price, market price, percent under market, score, rank, mileage and dealer, and say which is the best deal.",
          "inputSchema": {
            "properties": {
              "car_ids": {
                "description": "Car ids from search_cars.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["car_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:271ff47459aebd89cc14ffbd5e10ab6009bd36d59e77d49f8ca6a1690eb91b9b"
        },
        {
          "name": "dealer_info",
          "title": "Look up a dealer",
          "description": "A dealer's name, address, phone and website, how many new and used cars it has listed, and its best-ranked cars.",
          "inputSchema": {
            "properties": {
              "dealer": {
                "description": "Dealer name or website domain.",
                "type": "string"
              },
              "market": {
                "description": "Market slug, to narrow a common name.",
                "type": "string"
              }
            },
            "required": ["dealer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:25b470832adf3be6364dcf686264699538f09cd6776644fa4f2493fdb3671b0a"
        },
        {
          "name": "draft_dealer_message",
          "title": "Draft a message to the dealer",
          "description": "Draft a message to the dealer about one car for the shopper to review: it asks about availability, the out-the-door price with fees, add-ons and history. Returns the draft text only. Nothing is sent to the dealer. Ask the shopper before calling this, and use only the name and contact they gave you.",
          "inputSchema": {
            "properties": {
              "car_id": {
                "description": "Car id from search_cars.",
                "type": "string"
              },
              "contact": {
                "description": "Email or mobile number the shopper wants answers sent to, as they gave it.",
                "type": "string"
              },
              "first_name": {
                "description": "The shopper's first name, as they gave it.",
                "type": "string"
              },
              "note": {
                "description": "Anything else the shopper wants asked, in their words.",
                "maxLength": 300,
                "type": "string"
              },
              "questions": {
                "description": "What to ask. Default: availability and out-the-door price.",
                "items": {
                  "enum": ["available", "otd", "addons", "history"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["car_id", "contact", "first_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:47fa06a46dd2435a7c7303f7b77e3d495f8593a81c41f9e1853be27259e41539"
        },
        {
          "name": "get_car",
          "title": "Get one car",
          "description": "Full details of one car: price against its market price, why it ranks where it does in plain sentences, mileage, color, drivetrain, photos count, the dealer and its phone, and the page to open. Use the id from search_cars.",
          "inputSchema": {
            "properties": {
              "car_id": {
                "description": "The 12-character id of the car, or its Carfinity URL.",
                "type": "string"
              }
            },
            "required": ["car_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:13fc5e30fc769c7f34ab851af5aec38af6fd8b4e540608ed277be98138b211fa"
        },
        {
          "name": "list_markets",
          "title": "List markets",
          "description": "The markets Carfinity covers, with the number of cars in each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f42869ff2867f77c121857d76da0dd948fe10107a0553ebc788071e95bd44424"
        },
        {
          "name": "market_summary",
          "title": "Summarize a market",
          "description": "How many of a model (or kind of car) are for sale in a market, the median advertised price and mileage, the price range, and the share priced under market. Use it for questions like 'what does a used Camry cost in Dallas' or 'is now a good time'.",
          "inputSchema": {
            "properties": {
              "market": {
                "description": "Market slug from list_markets. Optional if the query names the city.",
                "type": "string"
              },
              "query": {
                "description": "A model or kind of car, with new or used, for example 'used Toyota Camry', 'new Ford F-150', 'used SUV under $30k'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:48eddde04d0f1b6bb45d4d7a1f6f986f98d4fe6d664aec1ebeab48c36139d46e"
        },
        {
          "name": "search_cars",
          "title": "Search cars for sale",
          "description": "Search new and used cars for sale at local dealers, in plain language. Every car comes back with its advertised price, its market price, how far under or over market it is, a deal label, a 0 to 100 score and its rank among comparable cars. Use a market name in the query or the market argument. Returns up to 10 cars per call, best deals first.",
          "inputSchema": {
            "properties": {
              "market": {
                "description": "Market slug from list_markets, for example 'dallas-tx'. Optional if the query names the city.",
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page of results, 10 cars each.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the shopper wants, in their words. Examples: 'used SUV under $30k AWD', 'new Honda CR-V', 'certified Toyota under 40,000 miles', 'something cheap on gas for commuting'.",
                "type": "string"
              },
              "sort": {
                "default": "best",
                "description": "Order of results.",
                "enum": ["best", "price", "price-desc", "miles", "newest"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1e535641afa538db3e0d2186276369bbba5b849ac4875d3c3117876f6d5983f9"
        }
      ],
      "digest": "sha256:6756a38333581ce7af614be2a1292a12b985124dadd8628eda6790042cee62d3"
    }
  }
}
