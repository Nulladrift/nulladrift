      "tools": [
        {
          "name": "compare_county_industries",
          "description": "Get a breakdown of all industries in a county.\n\n    Returns business pattern data for all 2-digit NAICS sectors in a\n    specific county. Useful for understanding the economic composition\n    of a community for grant narratives.\n\n    Args:\n        state: Two-letter state abbreviation (e.g. 'CA', 'TX', 'NY').\n        county_fips: 3-digit county FIPS code (e.g. '037' for Los Angeles County).\n        year: Data year (default 2021). Available: 2012-2021.\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "title": "County Fips",
                "type": "string"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": 2021,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["county_fips", "state"],
            "title": "compare_county_industriesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "compare_county_industriesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:577d673c37a6aeb1a6bb37d7775db6ddb4e005f2ac782b8d42262648a4864aa7"
        },
        {
          "name": "get_county_business_patterns",
          "description": "Get business establishment, employment, and payroll data by county.\n\n    Returns County Business Patterns data from the Census Bureau showing\n    the number of business establishments, employees, and annual payroll\n    for a given geography and optional industry filter.\n\n    Args:\n        state: Two-letter state abbreviation (e.g. 'CA', 'TX', 'NY').\n        county_fips: 3-digit county FIPS code (e.g. '037' for Los Angeles).\n            If omitted, returns data for all counties in the state.\n        naics_code: NAICS 2017 industry code to filter by (e.g. '72' for\n            Accommodation/Food, '62' for Healthcare, '23' for Construction).\n            If omitted, returns totals across all industries.\n        year: Data year (default 2021). Available: 2012-2021.\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "County Fips"
              },
              "naics_code": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Naics Code"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": 2021,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["state"],
            "title": "get_county_business_patternsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_county_business_patternsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1bcaa39e3e0faf1cd7840d66a4db43c11a4e86f2719f1c53110172cc27fdb254"
        },
        {
          "name": "get_state_business_summary",
          "description": "Get state-level business pattern summary.\n\n    Returns aggregate establishment, employment, and payroll data for an\n    entire state, optionally filtered by industry. Useful for state-level\n    economic overviews in grant applications.\n\n    Args:\n        state: Two-letter state abbreviation (e.g. 'CA', 'TX', 'NY').\n        naics_code: NAICS 2017 industry code to filter by (e.g. '72' for\n            Accommodation/Food, '62' for Healthcare). Omit for all industries.\n        year: Data year (default 2021). Available: 2012-2021.\n    ",
          "inputSchema": {
            "properties": {
              "naics_code": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Naics Code"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": 2021,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["state"],
            "title": "get_state_business_summaryArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_state_business_summaryOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a39653e2a9c8ef64d3baedf013207865424aba50d9e7dce5d5bdc52311747ea8"
        }
      ],
      "digest": "sha256:a6350ada81294dedca97f565d10387162a555249d99336b229d1e5687ec77226"
    }
  }
