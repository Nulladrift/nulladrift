            "openai/widgetAccessible": true
          },
          "digest": "sha256:7fc4099b73a47b1c59fc5adacc7a83af2963c159b25ff0a99304113647ec5faa"
        },
        {
          "name": "get_venue",
          "title": "Get Venue Details",
          "description": "Read a single venue dossier by venue_id (dated show history, stage dimensions, and source links) without spending a free reveal. Note: `search_venues` already returns genres, capacity, music days, and booking contacts and populates the interactive widget, so only call `get_venue` when you need dated show history or stage specs not already in `search_venues`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "venue_id": {
                "description": "Venue slug identifier (e.g. \"tractor-tavern-seattle-wa\").",
                "type": "string"
              }
            },
            "required": ["venue_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Venue Details"
          },
          "behavior": {
