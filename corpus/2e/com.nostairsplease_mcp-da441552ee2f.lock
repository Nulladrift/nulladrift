        {
          "name": "search_venues",
          "title": "Search Live Music Venues",
          "description": "Search live music venues across all 50 US states by keyword, state, regional drive-time area, town or multi-stop driving route corridor (stops, or near / to / within_miles), venue type, room capacity, usual music days, or saved favorites. Returns each venue with its genres, capacity, usual music days, and (for All Access or revealed venues) booking contacts and renders the interactive No Stairs Please directory widget.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Regional drive-time area (e.g. \"WA · Puget Sound\").",
                "type": "string"
              },
              "favorites_only": {
                "description": "Filter to venues saved in the signed-in user account.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum number of venues to return (1-50, default 25).",
                "type": "number"
              },
              "max_capacity": {
                "description": "Maximum room capacity (e.g. 25, 50, 100, 200, 300, 500).",
                "type": "number"
              },
              "min_capacity": {
                "description": "Minimum room capacity (e.g. 500 for 500+ cap rooms).",
                "type": "number"
              },
              "music_days": {
                "description": "Filter by usual live music days of the week (All Access or revealed venues).",
                "items": {
                  "enum": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
                  "type": "string"
                },
                "type": "array"
              },
              "near": {
                "description": "Origin town (\"Bellingham, WA\") or \"lat, lng\" coordinate pair.",
                "type": "string"
              },
              "offset": {
                "description": "Pagination offset (default 0).",
                "type": "number"
              },
              "query": {
                "description": "Keyword query matching venue name, city, address, venue type, or (with a signed-in account / All Access) genres, performers, and booking contacts. Omit narrow genre keywords when searching a town or route so all matching venues are returned with their genre tags for comparison.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code (e.g. \"WA\", \"OR\", \"CO\", \"CA\", \"TX\") or full state name.",
                "type": "string"
              },
              "stops": {
                "description": "Ordered list of 2 to 15 towns or \"lat, lng\" stops to build a multi-stop driving route (e.g. [\"Seattle, WA\", \"Spokane, WA\", \"Missoula, MT\", \"Bozeman, MT\"]). Venues are returned in stop-to-stop progression order along the road.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "to": {
                "description": "Optional destination town (\"Portland, OR\") or \"lat, lng\" to search along a driving route corridor from near to to.",
                "type": "string"
              },
              "venue_type": {
                "description": "Venue category such as \"Music venue\", \"Bar & pub\", \"Brewery & taproom\", \"Restaurant\", \"Coffee shop\", \"Winery & tasting room\", \"Hall & arts center\", \"Outdoor stage\", \"Listening room\", \"Hotel & resort\", \"Ski area\", \"Church\", \"Community space\".",
                "type": "string"
              },
              "within_miles": {
                "description": "Maximum distance in miles from near or from the driving route corridor (default 25).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Live Music Venues"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/venues-v4.html",
            "openai/toolInvocation/invoked": "Opened No Stairs Please",
            "openai/toolInvocation/invoking": "Searching No Stairs Please...",
            "openai/widgetAccessible": true,
            "ui": {
