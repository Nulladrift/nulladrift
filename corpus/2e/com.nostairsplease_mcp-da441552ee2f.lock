  "subjects": {
    "com.nostairsplease/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nostairsplease.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "no-stairs-please",
        "title": "No Stairs Please",
        "version": "1.0.0",
        "description": "Live music venue directory with booking contacts, room capacity, usual music nights, and performer show history across all 50 US states.",
        "websiteUrl": "https://nostairsplease.com",
        "icons": [
          {
            "src": "https://nostairsplease.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://nostairsplease.com/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app", "text/html+skybridge"]
          }
        },
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Always call `search_venues` once per turn to find venues by city, state, regional area, multi-stop driving route (`stops` or `near` / `to` / `within_miles`), venue type, room capacity (`max_capacity`, `min_capacity`), usual music days, or saved favorites, and to populate the interactive No Stairs Please widget. `search_venues` already returns each venue's genres, capacity, usual music days, and (for All Access or revealed venues) booking contacts. Avoid calling `get_venue` on multiple search results unless the user specifically asks for dated show history or stage dimensions on a single venue. When 2+ stops are passed in `stops` (e.g. [\"Seattle, WA\", \"Spokane, WA\", \"Missoula, MT\"]), `search_venues` routes along actual highways and returns venues in stop-to-stop progression order. Call `reveal_venue` only when the user explicitly asks to unlock full booking contacts, music nights, and dated show history for a specific venue. Use `find_by_performer` to check where a band or solo performer has played. Access levels (`anonymous`, `account`, `pass`) determine whether full contacts and show dates are included immediately. Never invent or guess unrevealed contact emails or phone numbers.",
      "tools": [
        {
          "name": "find_by_performer",
          "title": "Find Venues by Performer",
          "description": "Search performer show history across the directory. With All Access, returns every venue where the performer has past or upcoming show listings along with dates and source URLs. Without All Access, returns aggregate show and venue counts across states from the public performer index.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_possible": {
                "description": "Include fuzzy / possible lineup matches (default false).",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum venues to return (1-50, default 20).",
                "type": "number"
              },
              "performer": {
                "description": "Band or solo artist name to search.",
                "type": "string"
              },
              "period": {
                "description": "Filter shows by time period (default \"all\").",
                "enum": ["all", "upcoming", "past"],
                "type": "string"
              },
              "state": {
                "description": "Optional two-letter state code filter.",
                "type": "string"
              }
            },
            "required": ["performer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Venues by Performer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/venues-v4.html",
            "openai/toolInvocation/invoked": "Opened No Stairs Please",
            "openai/toolInvocation/invoking": "Searching performer history...",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://widget/venues-v4.html",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:053d8985c809f83ea55b2a7e4b1e2d2a621c178139bca40e3856cb58fa86e472"
        },
        {
          "name": "get_profile",
          "title": "Get Account & Access Status",
          "description": "Return the current user account profile, access level (anonymous, account, or pass), All Access expiration date, remaining free venue reveals, and saved venues count.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
