      "serverInfo": {
        "name": "signupbouncer",
        "title": "SignupBouncer",
        "version": "1.2.0",
        "websiteUrl": "https://signupbouncer.com/docs/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SignupBouncer checks signups for disposable (burner) email domains, Gmail dot and +tag aliases, domains that cannot receive mail, and datacenter, VPN and Tor IPs. When the user asks for code that checks or blocks new signups in their app, call integration_guide with their stack. The code it returns gives SignupBouncer 1.5 seconds to answer, and lets the signup through on any failure. Use check_email to judge one address (and optionally an IP), explain_reason to explain a reason code from any SignupBouncer answer, and lookup_burner_domain to ask whether a domain is on the burner list without a DNS lookup. check_email and lookup_burner_domain are the free checker. They are rate-limited per IP address (or per account when the client sends an API key). Calls through claude.ai, Claude Desktop and Claude's mobile apps come from Anthropic's servers, and everyone using them shares 300 checks a minute and 5,000 a day. We don't store or log the email or IP address check_email is asked to check, or the domain or address sent to lookup_burner_domain. We do store the domain of each email check_email checks, with its mail servers, in a cache for up to an hour. For the rate limits we keep a keyed hash of the calling IP address, or of the account when the client sends a key, for up to 24 hours. When the client sends a key, we also keep a hash of the key in memory, and keyed hashes of the calling IP address and its network (/24 or /64), for up to two minutes. The IP hashes limit guessed keys. A valid key's hash is also stored with its account. An app checks its real signups through the REST API or the Supabase hook (https://signupbouncer.com/docs). With an API key in the Authorization header, get_rules reads an app's rules and update_rules changes them. update_rules changes which real signups that app refuses, so confirm each change with the user before you call it. update_rules saves the settings it changes, including any text such as the block message, with the app's other settings. We keep them until the user changes them again or deletes the account, or for 7 days after the user removes the app. They stay in our encrypted nightly backups for about 31 days after that, longer if a nightly backup fails.",
      "tools": [
        {
          "name": "check_email",
          "title": "Check a signup email (and IP)",
          "description": "Checks one email address, and optionally the signup's IP address, the way SignupBouncer checks a new signup. Returns the result as \"verdict\" (allow, challenge or block), a 0-100 score, the reasons with their reason codes, the normalized inbox (Gmail dots and +tags folded) and the IP's network. When the domain looks like a typo of a big mail provider (gmial.com), \"suggestion\" holds the corrected address. Looks up the domain's mail servers live. Every reason is listed, including ones only paid plans count. We don't store or log the email or IP address it checks. We cache the email's domain and its mail servers for up to an hour. For the rate limits we keep a keyed hash of the calling IP address, or of the account when the client sends a key, for up to 24 hours. When the client sends a key, we also keep a hash of the key in memory, and keyed hashes of the calling IP address and its network (/24 or /64), for up to two minutes. The IP hashes limit guessed keys. A valid key's hash is also stored with its account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The email address to check.",
                "maxLength": 320,
                "type": "string"
              },
              "ip": {
