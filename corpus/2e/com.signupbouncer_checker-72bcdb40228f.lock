                  "type": "object"
                },
                "type": "array"
              },
              "score": {
                "type": "number"
              },
              "suggestion": {
                "description": "The corrected address when the domain looks like a typo of a big mail provider. Absent otherwise. It does not change the score.",
                "type": "string"
              },
              "verdict": {
                "enum": ["allow", "challenge", "block"],
                "type": "string"
              }
            },
            "required": ["reasons", "score", "verdict"],
            "type": "object"
