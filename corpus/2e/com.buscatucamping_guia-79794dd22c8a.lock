{
  "lockfileVersion": 2,
  "subjects": {
    "com.buscatucamping/guia": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.buscatucamping.com/mcp-guia"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "buscatucamping-guia",
        "title": "BuscaTuCamping: guía de campings",
        "version": "0.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "BuscaTuCamping es la guía de campings de España, Portugal, Francia, Andorra, Suiza, Italia, Marruecos y Alemania (más de 10.900 fichas con temporada verificada en la web de cada camping). Use buscar_campings para encontrar campings en una zona (población, provincia, comunidad o nombre), con filtros de perros, piscina, bungalows, playa y fechas de apertura (un día o un rango). Use campings_cerca cuando el viajero pregunte dónde dormir cerca de donde está (por ejemplo «estoy en ... con la autocaravana, ¿dónde paso la noche?»): campings abiertos esa noche ordenados por distancia a una posición o a un lugar, con filtros de autocaravana (estación de servicio o vaciado) y perros. Use ficha_camping para los datos de un camping concreto: temporada con la fecha en que se verificó, precio orientativo por noche, servicios, contacto y ofertas vigentes. Cite siempre el nombre del camping y enlace su url (su ficha en buscatucamping.com), donde el usuario ve fotos, mapa y cómo llegar. La temporada y el precio son orientativos y del año que se indica: recomiende confirmar con el camping antes de viajar o reservar. Para planificar un viaje por carretera y saber dónde dormir cada noche, está el conector de rutas de BuscaTuCamping: https://www.buscatucamping.com/mcp.",
      "tools": [
        {
          "name": "buscar_campings",
          "title": "Buscar campings",
          "description": "Busca campings de la guía BuscaTuCamping en una zona (población, provincia, comunidad o nombre del camping), con filtros opcionales de país, perros, piscina, bungalows, playa y fechas de apertura (un día con abierto_en o un rango con abierto_desde y abierto_hasta). Devuelve hasta 30 campings con su población, estado de temporada, precio orientativo si lo hay y la URL de su ficha.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "abierto_desde": {
                "description": "YYYY-MM-DD: inicio de la estancia (con abierto_hasta, máximo 31 días): solo campings abiertos todos esos días.",
                "type": "string"
              },
              "abierto_en": {
                "description": "YYYY-MM-DD: solo campings abiertos ese día.",
                "type": "string"
              },
              "abierto_hasta": {
                "description": "YYYY-MM-DD: último día de la estancia.",
                "type": "string"
              },
              "bungalows": {
                "description": "Solo campings con bungalows.",
                "type": "boolean"
              },
              "limite": {
                "description": "Máximo de resultados, por defecto 15.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "pais": {
                "description": "Limitar a un país.",
                "enum": ["España", "Portugal", "Francia", "Andorra", "Suiza", "Italia", "Marruecos", "Alemania"],
                "type": "string"
              },
              "perros": {
                "description": "Solo campings que admiten perros.",
                "type": "boolean"
              },
              "piscina": {
                "description": "Solo campings con piscina.",
                "type": "boolean"
              },
              "playa": {
                "description": "Solo campings junto a una playa de mar.",
                "type": "boolean"
              },
              "texto": {
                "description": "Zona o nombre: población, provincia, comunidad o parte del nombre del camping (p. ej. \"Cantabria\", \"Conil\", \"Costa\").",
                "type": "string"
              }
            },
            "required": ["texto"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar campings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:292a4f9c0c44dd71b377f7d4a8bbdeec42faaaa3f4067869300178a575c45084"
        },
        {
          "name": "campings_cerca",
          "title": "Campings cerca para dormir",
          "description": "Campings más cercanos a una posición o a un lugar para dormir una noche concreta (por defecto hoy), ordenados por distancia en línea recta, con su estado de temporada esa noche, si tienen servicio para autocaravanas (estación de servicio o vaciado de aguas/WC químico), si admiten perros, precio orientativo y la URL de su ficha. Para preguntas del tipo «estoy en X con la autocaravana, ¿dónde puedo dormir esta noche cerca?». Indique lat y lng o un lugar.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "autocaravana": {
                "description": "Solo campings con estación de servicio para autocaravanas o vaciado de WC químico.",
                "type": "boolean"
              },
              "fecha": {
                "description": "YYYY-MM-DD de la noche; por defecto hoy.",
                "type": "string"
              },
              "lat": {
                "description": "Latitud de la posición del viajero.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limite": {
                "description": "Máximo de resultados, por defecto 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitud de la posición del viajero.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "lugar": {
                "description": "Si no hay coordenadas: población o lugar donde está el viajero (p. ej. \"Burgos\", \"Tarifa\").",
                "type": "string"
              },
              "perros": {
                "description": "Solo campings que admiten perros.",
                "type": "boolean"
              },
              "radio_km": {
                "description": "Distancia máxima en línea recta, por defecto 20 km.",
                "maximum": 60,
                "minimum": 2,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Campings cerca para dormir"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d609be9ff290f705237ee0b3cb4b5cf36811a3e5b01016623f39d6a84a6697a6"
        },
        {
          "name": "ficha_camping",
          "title": "Ficha de camping",
          "description": "Datos de un camping de la guía BuscaTuCamping: población, provincia, país, coordenadas, dirección, teléfono, web, temporada (estado en la fecha, detalle y cuándo y dónde se verificó), precio orientativo por noche de una parcela, servicios, si admite perros, ofertas vigentes y la URL de su ficha. Identifíquelo por id (el que devuelve buscar_campings) o por la URL de su ficha.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "fecha": {
                "description": "Fecha del viaje YYYY-MM-DD (por defecto hoy). Decide el estado de temporada de cada camping.",
                "type": "string"
              },
              "id": {
                "description": "Identificador del camping en BuscaTuCamping.",
                "type": "integer"
              },
              "url": {
                "description": "URL de la ficha en buscatucamping.com.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ficha de camping"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b14cf44260ef3e7e70483523f18190e91c291315134051cb2cce2eb9ba80697d"
        }
      ],
      "digest": "sha256:b37e0b97a2187bc849a0c215502a099157c4c588b0d4d8b22a747e7e13879c65"
    }
  }
