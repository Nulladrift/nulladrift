{
  "lockfileVersion": 2,
  "subjects": {
    "com.cazimedia.agentnative/data-exchange": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentnative.cazimedia.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agentnative-data-exchange",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Start with free discovery and sample tools. If a discovered dataset is not query-ready, call request_dataset_materialization once and poll get_materialization_status until complete. Never call request_paid_access without explicit approval from the human owner.",
      "tools": [
        {
          "name": "aggregate_imported_dataset",
          "title": "Aggregate an official dataset",
          "description": "Use this paid read-only tool for deterministic grouped statistics instead of downloading rows and calculating locally. Returns bounded count, sum, average, minimum, or maximum groups with dataset provenance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dataset_id": {
                "type": "string"
              },
              "field": {
                "type": "string"
              },
              "group_by": {
                "type": "string"
              },
              "metric": {
                "enum": ["count", "sum", "avg", "min", "max"]
              },
              "top": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["dataset_id", "group_by"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ed5e99e53f149014280c17463994111dd51c52a1f4a69b020392cb093a37c15"
        },
        {
          "name": "get_coverage_status",
          "title": "Get public-data coverage status",
          "description": "Use this free operational tool to decide whether available public-data coverage is sufficient or whether to request a missing capability. Returns discovery, materialization, queryable-row, queue, failure, and freshness counts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:801bf9e1bfe657d69ea30b6283e4296aaab92bcee3c66e9f0569f76b4a94809e"
        },
        {
          "name": "get_materialization_status",
          "title": "Check dataset materialization",
          "description": "Poll a durable materialization job. A complete result includes the query-ready dataset ID plus free sample and paid query URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "materialization_id": {
                "pattern": "^job_[a-f0-9]{24}$",
                "type": "string"
              }
            },
            "required": ["materialization_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5820a08083b043d74a6e78b70e6412eb74077d822dc13d67802a1a6b98f7b325"
        },
        {
          "name": "list_imported_datasets",
          "title": "List queryable official datasets",
          "description": "Use this free tool when an agent needs only datasets that can be sampled or queried now. Returns fully published warehouse snapshots with dataset IDs, row counts, freshness, and provenance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:124d9c18b7d669abf12449755bf8251bb9417b6acc69180b5d9e51b0ec08be94"
        },
        {
          "name": "list_official_sources",
          "title": "List official government sources",
          "description": "Use this free tool to inspect which federal, state, city, police, education, and other official source scopes AgentNative currently covers. Returns each source's importer, discovery state, and materialized coverage; it does not return dataset rows.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c06c85efa4406f7627631050b0eb1109dd53eabdcd652239ca2f7bdcb3ca750"
        },
        {
          "name": "query_imported_dataset",
          "title": "Query an imported official dataset",
          "description": "Use this paid read-only tool after sample_imported_dataset confirms the data is suitable. Returns up to 100 normalized rows from a published snapshot with bounded pagination, one exact-match filter, freshness, and provenance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dataset_id": {
                "type": "string"
              },
              "filter_field": {
                "type": "string"
              },
              "filter_value": {
                "type": "string"
              },
              "skip": {
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "top": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["dataset_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf414f1bd45c0066f05ed18ff4ef17db01b01d82c4e653298764a4341a6a336b"
        },
        {
          "name": "query_us_federal_register",
          "title": "Query the US Federal Register",
          "description": "Use this paid read-only tool when the free Federal Register briefing is insufficient. Returns up to 100 normalized official records filtered by date or document type, with deterministic provenance and direct source URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "end_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "start_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "top": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "enum": ["NOTICE", "PRORULE", "RULE", "PRESDOCU"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8146a49e88d75135c1099eb1faa7091e093f104f39c36cb3ddbccd8a804353c9"
        },
        {
          "name": "request_capability",
          "title": "Request a missing data capability",
          "description": "Use this state-changing tool only when existing discovery and coverage tools cannot satisfy the task. Records demand for a missing dataset, aggregation, insight, filter, freshness level, or export; repeated requests increase autonomous build priority.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "capability": {
                "enum": ["dataset", "filter", "aggregation", "insight", "freshness", "export"],
                "type": "string"
              },
              "dataset": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "example_query": {
                "maxLength": 240,
                "type": "string"
              },
              "source_url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["capability", "dataset"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d8ca118cf35c702a10732065d9e2239281706deb723423642a2357322d9cd0a4"
        },
        {
          "name": "request_dataset_materialization",
          "title": "Make a discovered dataset query-ready",
          "description": "Queue a discovered official dataset for prioritized detached ingestion. This free idempotent operation returns a durable job ID; poll get_materialization_status until it supplies sample and query URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "discovered_dataset_id": {
                "description": "Exact catalog ID returned by search_discovered_datasets.",
                "pattern": "^disc_[a-f0-9]{24}$",
                "type": "string"
              }
            },
            "required": ["discovered_dataset_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e52bd3a4fb08580bb2a63c4564ae6574647ab87cc872a546730cb9767e30a2b1"
        },
        {
          "name": "request_paid_access",
          "title": "Create a Stripe access checkout",
          "description": "Use this state-changing tool only after free samples demonstrate value and the human owner approves payment. Creates a Stripe Checkout plus one-time claim URL; choose the $5 pass for research or $5/month subscription for recurring workflows.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plan": {
                "default": "pass",
                "enum": ["pass", "subscription"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dab8067e152fef8e733967e625144e9330b82ff1d7ee9678aa27cfd8bce0b6b7"
        },
        {
          "name": "sample_imported_dataset",
          "title": "Sample an official dataset for free",
          "description": "Use this free tool to evaluate a query-ready official dataset before paying. Returns three normalized rows, deterministic summaries, freshness, and provenance; use query_imported_dataset only after the sample proves useful.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dataset_id": {
                "description": "Exact query-ready dataset ID returned by list_imported_datasets.",
                "type": "string"
              }
            },
            "required": ["dataset_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:79bb505593a2f0b5d4013afd53ffb28b7e919ca811a36e957d626a81d72319f0"
        },
        {
          "name": "sample_us_federal_register",
          "title": "Get a free Federal Register briefing",
          "description": "Use this free no-auth tool for current US regulatory activity or to evaluate AgentNative before paying. Returns three Federal Register records plus deterministic aggregates over the latest 25 documents, direct record URLs, provenance, and rate-limit status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7cf436c3cb8edf43cc52888d8a21d0e88f21a3941add9019f61b852872aaa73f"
        },
        {
          "name": "search_discovered_datasets",
          "title": "Search discovered government datasets",
          "description": "Use this free tool to find datasets across all discovered official sources, including candidates not yet queryable. Returns catalog matches and materialization state; use list_imported_datasets when only query-ready data is acceptable.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum matches to return; defaults to the service limit.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional title or description keywords.",
                "maxLength": 100,
                "type": "string"
              },
              "source_id": {
                "description": "Optional exact official source ID returned by list_official_sources.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b349b54f59baaecbcff0ec94fd0abef7490f068b9ddb775cb3d7c58b79796a4d"
        },
        {
          "name": "search_public_datasets",
          "title": "Search public datasets",
          "description": "Use this free tool first when an agent needs official US federal data but does not yet know the dataset ID. Searches normalized catalog metadata and returns matching datasets with provenance; it does not query dataset rows.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Plain-language topic, agency, or dataset keywords, such as employment, schools, or air quality.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b3a52914f88d8bd57a48719580cb3e3d9b7c15fd68f4bfb8996bd81e0e57a07d"
        }
      ],
      "digest": "sha256:0af9c176c3bec41c6fd43b2edd04891d1f26575df5018bd127d44e3f5803df73"
    }
  }
}
