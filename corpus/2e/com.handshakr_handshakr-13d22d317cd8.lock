{
  "lockfileVersion": 2,
  "subjects": {
    "com.handshakr/handshakr": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hxshsvkjtvcvmqevguuz.supabase.co/functions/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "handshakr-mcp",
        "title": "Handshakr MCP",
        "version": "0.3.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Tools for reading the Handshakr register of B2B suppliers: search suppliers, fetch one supplier by slug, read the live public activity feed, and get trending categories. Only suppliers an AI agent may read are returned; each says whether it is contactable, which is true only for suppliers who switched agent access on. Read-only: nothing here can commit a supplier to anything.",
      "tools": [
        {
          "name": "get_public_pulse",
          "title": "Get public pulse",
          "description": "Recent public activity in the Handshakr register: suppliers newly published and source pulse events. Only suppliers an AI agent may read are named.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 25,
                "description": "How many recent events to return (1 to 100, default 25).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ca4c259faedf998d9f791d7453557adce4e9d226c43861258a4ee5306c685237"
        },
        {
          "name": "get_seller",
          "title": "Get seller",
          "description": "Fetch one Handshakr supplier an AI agent may read, by slug. `contactable` says whether the supplier has switched agent access on and may be approached. `description` and `category` are the company's own words or null; text Handshakr wrote from public sources is in `handshakr_summary` / `handshakr_category`, labelled, and is not a fact about the company. `trust_score` is null: no score is computed. `trading_name_of`, when not null, names the registered company this listing is a trading name of (legal name, company number, the passport holding its Companies House record): listings that share a company number there are one company, not several. `verifiable_record` is the latest signed, append-only version of the public passport: its version, sha256, log position, and where to fetch the W3C Verifiable Credential and its status.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The seller's URL slug.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:930d128c533f28d2a4b22b46097452037336503e24b1df8b6bfaab08404490ce"
        },
        {
          "name": "get_trending_categories",
          "title": "Get trending categories",
          "description": "Top trending supplier categories among the suppliers an AI agent may read, this week vs last week, with delta percentage. Returns available:false with a reason when too few recently published profiles are categorised to compute a trend, an empty result is never a silent zero.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 8,
                "description": "How many categories to return (1 to 30, default 8).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2b92e15feec07a920acb93f0cf06abe2e60d66397d848ac8c01d2f3a536f4357"
        },
        {
          "name": "search_sellers",
          "title": "Search sellers",
          "description": "Search the Handshakr suppliers an AI agent may read, by keyword and optional category. Returns name, slug, category, location, description and `contactable`: true only for suppliers who have switched agent access on, the only ones an agent may approach. Claimed suppliers who have not consented are not returned. `description` and `category` are the company's own words or null; text Handshakr wrote from public sources is in `handshakr_summary` / `handshakr_category`, labelled, and is not a fact about the company. `trust_score` is null: no score is computed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Optional category filter (e.g. 'SaaS', 'Design').",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of suppliers to return (1 to 50, default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search term matched against seller name and description.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f4779c40370c845959551f768e31844b3fb5c0060bb69c5187a6437655109665"
        }
      ],
      "digest": "sha256:3f7efa99313a381ce199998ee9f81bc3ba5d5eae3a3f2a491af76dce04ade2f7"
    }
  }
}
