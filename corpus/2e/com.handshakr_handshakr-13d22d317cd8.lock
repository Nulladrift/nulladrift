      },
      "transport": {
        "type": "http",
        "url": "https://hxshsvkjtvcvmqevguuz.supabase.co/functions/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "handshakr-mcp",
        "title": "Handshakr MCP",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Tools for reading the Handshakr register of B2B suppliers: search suppliers (optionally narrowed by category, industry and delivery, which filter and never rank), fetch one supplier by slug with its classifications and register checks, read the live public activity feed, and get trending categories. Only suppliers an AI agent may read are returned; each says whether it is contactable, which is true only for suppliers who switched agent access on. Read-only: nothing here can commit a supplier to anything.",
      "tools": [
        {
          "name": "get_public_pulse",
          "title": "Get public pulse",
          "description": "Recent public activity in the Handshakr register: suppliers newly published and source pulse events. Only suppliers an AI agent may read are named.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 25,
                "description": "How many recent events to return (1 to 100, default 25).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ca4c259faedf998d9f791d7453557adce4e9d226c43861258a4ee5306c685237"
        },
        {
          "name": "get_seller",
          "title": "Get seller",
          "description": "Fetch one Handshakr supplier an AI agent may read, by slug. `contactable` says whether the supplier has switched agent access on and may be approached. `description` and `category` are the company's own words or null; text Handshakr wrote from public sources is in `handshakr_summary` / `handshakr_category`, labelled, and is not a fact about the company. `trust_score` is null: no score is computed. `trading_name_of`, when not null, names the registered company this listing is a trading name of (legal name, company number, the passport holding its Companies House record): listings that share a company number there are one company, not several. `verifiable_record` is the latest signed, append-only version of the public passport: its version, sha256, log position, and where to fetch the W3C Verifiable Credential and its status. `classification` is the register's three classifications: { what_they_do, who_its_for, delivery } each { slug, top_slug, name, method, method_label, source } or null with `unknown_reason` saying why, and `taxonomy_version`; `method` is supplier, label, sic (Companies House SIC code) or website (their own website text, not reviewed). `register_checks` lists what public sources said on a date (DNS, TLS, security.txt, GLEIF, ICO, SEC EDGAR): observations, not claims; `not_checked` means nothing observed yet, and sanctions appear only as `no_match` against all four lists. Each is null when it could not be read.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The seller's URL slug.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1db66be61233cb3a45fcb0586e15bbb3b3faea17ac608fc2a28a81a0e29df229"
        },
        {
          "name": "get_trending_categories",
          "title": "Get trending categories",
          "description": "Top trending supplier categories among the suppliers an AI agent may read, this week vs last week, with delta percentage. Returns available:false with a reason when too few recently published profiles are categorised to compute a trend, an empty result is never a silent zero.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 8,
                "description": "How many categories to return (1 to 30, default 8).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2b92e15feec07a920acb93f0cf06abe2e60d66397d848ac8c01d2f3a536f4357"
        },
        {
          "name": "search_sellers",
          "title": "Search sellers",
          "description": "Search the Handshakr suppliers an AI agent may read, by keyword, optionally narrowed by the register's three classifications: `category` (what they do: a top category slug such as 'software-engineering', or a subcategory), `industry` (who it's for, e.g. 'legal-technology') and `delivery` ('software', 'services' or 'hardware'), combined with AND. A classification only narrows the results; it never changes which supplier comes first (contactable first, then by name). Returns name, slug, category, location, description, `contactable` (true only for suppliers who have switched agent access on, the only ones an agent may approach) and `classification`: { what_they_do, who_its_for, delivery } each { slug, top_slug, name, method, method_label, source } or null with `unknown_reason` saying why, and `taxonomy_version`. `method` is supplier, label, sic (Companies House SIC code) or website (their own website text, not reviewed). Claimed suppliers who have not consented are not returned. `description` and `category` are the company's own words or null; text Handshakr wrote from public sources is in `handshakr_summary` / `handshakr_category`, labelled, and is not a fact about the company. `trust_score` is null: no score is computed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Optional. What they do: a category slug (e.g. 'software-engineering', 'it-services', or a subcategory such as 'managed-it-services'). A value that is not a category slug is matched against the listing's category label instead, as before.",
                "type": "string"
              },
              "delivery": {
                "description": "Optional. How it is delivered: software, services or hardware.",
                "enum": ["software", "services", "hardware"],
                "type": "string"
              },
              "industry": {
                "description": "Optional. Who it's for: an industry slug (e.g. 'legal-technology', 'healthcare-life-sciences').",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of suppliers to return (1 to 50, default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search term matched against seller name and description.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:189c63be5ea45a364b7d36a37b32bbb3e82eddf311c2132c7cb3d1158d620614"
        }
      ],
      "digest": "sha256:93ac0b2d1497d471c0713884b444ca67a9a2ad1c39263a88461ce627931552a5"
    }
  }
