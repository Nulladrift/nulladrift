        {
          "name": "get",
          "title": "Abrir um item publicado",
          "description": "PT: Abrir um item publicado. Abre um item já publicado, pela URL ou pelo slug, e devolve o texto no ar, com as fontes que já estão na página. Só de leitura.\nEN: Open a published item. Opens an already published item, by URL or slug, and returns the live text, with the sources already on the page. Only for reading.\nES: Abrir un elemento publicado. Abre un elemento ya publicado, por URL o por slug, y devuelve el texto publicado, con las fuentes que ya están en la página. Solo de lectura.",
