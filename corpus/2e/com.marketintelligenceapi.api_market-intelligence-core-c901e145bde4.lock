        {
          "name": "decision.pre_trade",
          "title": "Pre trade check",
          "description": "Right before a trade: 'I want to buy (or sell) SYMBOL - is now a good moment?'. Returns a verdict (FAVORABLE, CAUTION, UNFAVORABLE), a score and the checks behind it: order flow, momentum, volatility, adverse events, market regime and news/filings of the last 24h. Use when you already know the symbol and side and only need go/no-go timing; for an action with conviction use decision.lite.",
          "inputSchema": {
            "properties": {
              "side": {
                "default": "buy",
                "description": "The side you intend to trade: buy or sell",
                "enum": ["buy", "sell"],
                "type": "string"
              },
              "symbol": {
                "description": "e.g. ETHUSD, BTCUSD, NVDA, TSLA",
                "type": "string"
              },
              "window": {
                "default": "5m",
                "description": "Aggregation window of the live trade buckets: 1m, 5m (default) or 15m",
                "enum": ["1m", "5m", "15m", "1h", "4h", "24h"],
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
