      "instructions": "Compact profile of the Market Intelligence MCP server (18 tools). Start with decision.lite (action with conviction for one symbol), decision.pre_trade (go/no-go timing for a side) or market.opportunities (goal-driven scan); token.verdict before buying a token, macro.fed_odds and markets.prediction for market-implied odds, defi.yields for lending rates. decision.sample and feedback.send are free; every other tools/call is paid per call with x402 (USDC on Base, Polygon, Arbitrum, World Chain or Solana, or EURC): an unpaid call returns isError true with the x402 PaymentRequired in structuredContent; retry with the signed payment in params._meta[\"x402/payment\"]. The prompts should_i_trade, check_token_before_buying, market_briefing and explain_symbol_move chain these tools. The full server with every tool is /mcp.",
      "tools": [
        {
          "name": "decision.lite",
          "title": "Decision lite",
          "description": "Cheap live decision ($0.10): action (STRONG_BUY..STRONG_SELL), direction, conviction, a GO/WAIT answer for a side, the stance of each pillar and the measured hit rate. Same engine as get_decision on the full server /mcp ($1), without the trade plan, execution check, evidence and risks. Use as the default decision; decision.pre_trade answers only go/no-go timing for a side, decision.sample is free but an hour old.",
          "inputSchema": {
            "properties": {
              "side": {
                "description": "Optional: answers GO / GO_SMALL / WAIT / NO_GO for this side",
                "enum": ["buy", "sell"],
                "type": "string"
              },
              "symbol": {
                "description": "Crypto pair (ETHUSD), US ticker (NVDA) or ISIN",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Decision lite"
