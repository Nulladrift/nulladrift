        {
          "name": "event_screen",
          "title": "Compare news and price responses",
          "description": "Find news where an initial price move reversed, faded by at least half, or continued by the later sample. Or find published analysis of exposure for other companies (read-through), separately from price evidence. Supports ticker, topic and dates. Uses a bounded event sample, not all stocks; returns the actual numbers and headline links, never trade recommendations.",
          "inputSchema": {
            "properties": {
              "end_utc": {
                "description": "Exclusive end timestamp with timezone. Overrides the relative look-back window.",
                "type": "string"
              },
              "hours": {
                "description": "Look back 1-336 hours; default 72.",
                "type": "integer"
              },
              "include_thin": {
                "description": "Default false excludes thin trading from price-path screens.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum results, 1-20; default 10.",
                "type": "integer"
              },
              "min_initial_move_pct": {
                "description": "Minimum absolute one-minute move; default 0.5%. Not used for read_through.",
                "type": "number"
              },
              "query": {
                "description": "Up to eight headline words, all required, e.g. SpaceX.",
                "type": "string"
              },
              "screen": {
                "description": "reversal crosses the original price; faded gives back at least half; continued extends the first move; read_through finds potential effects on other companies.",
                "enum": ["reversal", "faded", "continued", "read_through"],
                "type": "string"
              },
              "start_utc": {
                "description": "Inclusive start timestamp with timezone, e.g. 2026-10-14T00:00:00-04:00.",
                "type": "string"
              },
              "ticker": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of_utc": {
                "type": "string"
              },
              "count": {
                "type": "integer"
              },
              "data_note": {
                "type": "string"
              },
              "data_status": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "events": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
