        {
          "name": "request_event_correction",
          "title": "Report an issue with an event listing",
          "description": "Report an issue with an event listing. Anyone can flag an event as wrong, gone, cancelled, postponed or moved to a new date (rescheduled, with `newStartDate`); an admin reviews every request, none is applied on its own. Browser forms pass Turnstile; programmatic callers send an API key instead.",
          "inputSchema": {
            "properties": {
              "contactEmail": {
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "kind": {
                "description": "postponed: new date to come; rescheduled: it has a new date (give it as newStartDate)",
                "enum": ["correct", "remove", "cancelled", "postponed", "rescheduled"],
                "type": "string"
              },
              "message": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "newStartDate": {
                "description": "For a rescheduled request: the event's new start date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "slug": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "turnstileToken": {
                "type": "string"
              },
              "website": {
                "type": "string"
              }
            },
            "required": ["kind", "message", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
