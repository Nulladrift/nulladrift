      "serverInfo": {
        "name": "greener-closet",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Greener Closet answers questions about what clothing is made of: a fabric or care label's fiber percentages, a clothing product link, a clothing brand's materials, one fiber such as polyester, modal, Tencel or spandex, and finding clothing with or without certain fibers. It scores clothing by disclosed fibers and does not lab-test garments, so never present a score as proof a garment is safe or free of PFAS, dyes or finishes. Each result includes a markdown link to greenercloset.com. Put that link in your reply as given, so the user can open the full breakdown. For a product not in the catalog, give the analyze-on-site link instead of guessing its composition. Tools: check_fabric_label scores a pasted fiber composition; check_product looks up a product URL; check_brand summarizes a brand's analyzed products; find_alternatives finds analyzed products by type, fiber and brand; explain_fiber explains a fiber.",
      "tools": [
        {
          "name": "check_brand",
          "title": "Check a clothing brand",
          "description": "Use this when the user asks about a clothing brand's materials or sustainability, for example \"is Vuori sustainable\", \"is Vuori non-toxic\", \"does Vuori use PFAS\", \"is Lululemon mostly polyester\" or \"what are Quince clothes made of\". Returns how the brand's products that Greener Closet has analyzed score, how many contain synthetic fibers, and any sourced claims on file. It never rates the company itself, and it can't say whether a brand uses PFAS finishes. Do not use this for one product (use check_product) or to find other brands (use find_alternatives).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "description": "The brand name, e.g. \"Vuori\", \"Pact\", \"Carter's\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "status": {
                "enum": ["found", "no_products", "not_found"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a clothing brand"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:94db4770896e3b9dfdca98a671cacb73979e8b3cdca2b25b7e0ae9ae0f57bd84"
        },
        {
          "name": "check_fabric_label",
          "title": "Check a fabric label",
          "description": "Use this when the user gives a garment's fiber composition or care-label text (for example \"60% cotton, 40% polyester\" or \"100% merino wool\") and asks whether it's good, sustainable, synthetic, plastic-based or a better choice than another label, for example \"my shirt label says 52% organic cotton, 48% recycled polyester. is that good?\" or \"95% cotton 5% elastane vs 60% cotton 40% polyester, which is better\". To compare labels, call it once per label. Returns Greener Closet's 0-100 score, the synthetic share and the main concerns. If the percentages don't add up to 100, it reports the gap instead of a score. Do not use this for a product URL (use check_product) or for a general question about one fiber (use explain_fiber).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "composition": {
                "description": "The fiber composition as written on the label, e.g. \"52% organic cotton, 48% recycled polyester\".",
                "maxLength": 1000,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["composition"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "status": {
                "enum": ["scored", "incomplete", "unrecognized", "invalid"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a fabric label"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9aed2fd8f284ac5db3738f360a6468b03d83ec3cc352491ab74a1c2bb8473207"
        },
        {
          "name": "check_product",
          "title": "Check a clothing product",
          "description": "Use this when the user shares a link to a clothing product page and asks what it's made of, whether it contains polyester or other synthetics, whether it's 100% cotton, or how sustainable it is, for example \"what is this shirt made of? <link>\". Returns Greener Closet's stored fiber breakdown and score when the product is in its catalog. Otherwise it returns a link where the user can analyze the product on greenercloset.com. Do not use this for pasted label text (use check_fabric_label) or for a product described without a URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "The full product page URL, e.g. https://www.patagonia.com/product/...",
                "maxLength": 2048,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "status": {
                "enum": ["found", "not_in_catalog", "invalid_url"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a clothing product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/outputTemplate": "ui://greenercloset/product-cards-v2.html",
            "openai/toolInvocation/invoked": "Checked Greener Closet",
            "openai/toolInvocation/invoking": "Checking Greener Closet…",
            "ui": {
              "resourceUri": "ui://greenercloset/product-cards-v2.html"
            },
            "ui/resourceUri": "ui://greenercloset/product-cards-v2.html"
          },
          "digest": "sha256:aa78327669ac9a98d8b1a690228cc1734a5915bc2f079bfdca6c1765a3feb3ca"
        },
        {
          "name": "explain_fiber",
          "title": "Explain a fiber",
          "description": "Use this when the user asks what a clothing fiber is or whether it's natural, synthetic or a concern to wear, for example \"is modal a natural fiber\", \"is polyester bad for you\", \"what is Tencel\", \"is rayon a natural fiber\", \"is spandex as bad as polyester\" or \"what is regenerated cellulose\". Returns Greener Closet's reviewed guide with sources when one exists, and says plainly when it has only limited information. Do not use this to score a whole garment label (use check_fabric_label).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fiber": {
                "description": "One fiber or fiber family, e.g. \"polyester\", \"Tencel\", \"bamboo viscose\", \"regenerated cellulose\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["fiber"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "status": {
                "enum": ["guide", "fiber_family", "ambiguous", "limited", "unknown"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a fiber"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:22995e523f3e48f2b7fd211d815fa47d4f6d458ff1a1cc8bc682186c8708ff34"
        },
        {
          "name": "find_alternatives",
          "title": "Find clothing by fiber content",
          "description": "Use this when the user wants clothing with specific fiber content or an alternative to a brand, for example \"leggings like Lululemon without polyester\", \"Vuori dupes without synthetic fabric\", \"natural fiber underwear for women\", \"linen shirts for men with no synthetics\" or \"polyester-free socks\". For a PFAS-free request it can find clothing with no synthetic fibers, but fiber content is not a PFAS test. Returns products Greener Closet has analyzed, highest score first, with their disclosed fiber breakdown. Fiber exclusions only count products whose full composition is disclosed. It doesn't filter by price. Do not use this to check one product or brand (use check_product or check_brand).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "department": {
                "enum": ["women", "men", "kids", "baby"],
                "type": "string"
              },
              "excludeAllSynthetics": {
                "description": "True when the user wants no synthetic fibers at all.",
                "type": "boolean"
              },
              "excludeFibers": {
                "description": "Fibers the products must not contain, e.g. [\"polyester\", \"nylon\"]. Recycled versions are excluded too.",
                "items": {
                  "maxLength": 40,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "limit": {
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "minScore": {
                "description": "Lowest Greener Closet score to include. Defaults to 70.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "productType": {
                "description": "What kind of clothing, e.g. \"leggings\", \"socks\", \"t-shirt\", \"dress\", \"pajamas\".",
                "maxLength": 60,
                "type": "string"
              },
              "replaceBrand": {
                "description": "A brand the user wants an alternative to; its products are excluded.",
                "maxLength": 80,
                "type": "string"
              },
              "requireFibers": {
                "description": "Fibers the products must contain, e.g. [\"linen\"] or [\"merino wool\"].",
                "items": {
                  "maxLength": 40,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "status": {
                "enum": ["found", "none", "invalid"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find clothing by fiber content"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
