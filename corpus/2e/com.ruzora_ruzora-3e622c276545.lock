                "maxLength": 1024,
                "type": "string"
              },
              "company": {
                "description": "Company name",
                "maxLength": 200,
                "type": "string"
              },
              "full_name": {
                "description": "Full name",
                "maxLength": 200,
                "type": "string"
              },
              "role_count": {
                "description": "How many engineers",
                "enum": ["one", "two_three", "four_plus", "not_sure"],
                "type": "string"
              },
              "runway": {
                "description": "Company runway: under 6 months, 6-12, 12-18, 18+, or bootstrapped without revenue",
                "enum": ["lt_6mo", "6_12mo", "12_18mo", "18_plus_mo", "bootstrapped_no_revenue"],
                "type": "string"
              },
              "seat_budget": {
                "description": "Monthly budget per engineer: under $4,500, $4,500-5,999, $6,000-7,999, $8,000+, or not sure",
