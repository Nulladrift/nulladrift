      "serverInfo": {
        "name": "atlasyield",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AtlasYield is an independent judgment layer for on-chain yield. Scores are research, not investment advice. Call check_route_survival before any deposit; blocking:true means refuse.",
      "tools": [
        {
          "name": "check_route_survival",
          "title": "Check route survival",
          "description": "Can a deposit into this vault be exited at size, measured today? Returns the daily round-trip route screen (USDC -> position -> USDC): verdict, USD in/out, fraction retained, the path probed, and when. blocking:true means refuse the deposit (NO_ROUTE, DANGEROUS, UNPRICEABLE). reasonClass says why: protocol_refused (the protocol's own router refuses, the vault is dead) vs no_aggregator_quote (no same-chain swap into the underlying, common for LP vaults; redeeming by hand may still work). The probe is SAME-CHAIN only: USDC on the vault's own chain. It says nothing about bridging in from elsewhere. Route tracking covers EVM chains only: a Solana vault returns tracked:false (not tracked, neither a pass nor a failure). A vault that was never screened returns screened:false with no verdict — never a fabricated one. Call this BEFORE moving money. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Vault contract address (0x…)",
                "minLength": 3,
                "type": "string"
              },
              "chainId": {
                "description": "EVM chain id of the vault",
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["address", "chainId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:abe4b1c74117743e23468b79cf0a3c1179258465257423b08c17acd853375e95"
        },
        {
          "name": "compare_vaults",
          "title": "Compare vaults",
          "description": "Side-by-side Atlas Scores for 2-8 vaults: composite, label, four pillars, live APY/TVL, data quality, yieldQuality and exitSafety, with a ranking by composite. Unscored vaults come back found:false rather than silently dropped. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "vaults": {
                "description": "2-8 vaults to compare, any mix of chains",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "description": "Vault contract address (0x…); case-insensitive",
                      "minLength": 3,
                      "type": "string"
                    },
                    "chainId": {
                      "description": "EVM chain id",
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["address", "chainId"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["vaults"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ddbcb21a66b78dcbd66b9af0cd8ea222d90d0d8e7805b55bace2e218e43df1c"
        },
        {
          "name": "explain_vault_score",
          "title": "Explain vault score",
          "description": "Why a vault has its Atlas Score: all 16 factors (15 additive across four pillars + the multiplicative exploit-history modifier), each with sub-score (0-100), weight, raw input and a plain-English label, grouped by pillar, plus the three weakest factors. Exactly what the engine computed at scoredAt, not a recomputation. Returns found:false when unscored. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Vault contract address (0x…); case-insensitive",
                "minLength": 3,
                "type": "string"
              },
              "chainId": {
                "description": "EVM chain id, e.g. 1 (Ethereum), 8453 (Base), 42161 (Arbitrum)",
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["address", "chainId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9cc2c5cc537668ae939c1489c498f55f3f35ba304492d28f4909e81387d3c692"
        },
        {
          "name": "find_vaults",
          "title": "Find vaults",
          "description": "Start here when you do not already have a vault address. Answers \"which vaults for this asset on this chain?\": returns a short ranked list (default 5, max 10) of scored vaults with composite, label, live APY/TVL, risk flags (thin_tvl, apy_outlier, ...), whether a deposit can reach it (routable), and a citable page URL. It also returns what the filters REMOVED: counts per filter, the best-ranked dropped vaults with reasons, near-miss asset symbols, and whether more matched than were returned. Vaults with no deposit route and rows scored on fallback data are excluded. Ranked by the chosen metric, a ranking and not a recommendation. A flag is a caution, not a verdict, and no flag does not mean safe. Take a chosen vaultId/address to check_route_survival before any deposit. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asset": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "Underlying asset symbol, or a list of up to 10, e.g. USDC or [\"USDC\",\"USDT0\"]. Exact match: USDC does not include syrupUSDC (similarAssets lists near misses)"
              },
              "chain": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "exclusiveMinimum": 0,
                    "type": "integer"
                  }
                ],
                "description": "Chain name (base, ethereum, arbitrum, optimism, bnb, solana) or EVM chain id"
              },
              "limit": {
                "description": "Rows to return, default 5, max 10",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "minApy": {
                "description": "Minimum live APY in percentage points, e.g. 10 for 10%",
                "minimum": 0,
                "type": "number"
              },
              "minScore": {
                "description": "Minimum Atlas composite (0-100)",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "minTvlUsd": {
                "description": "Minimum live TVL in USD",
                "minimum": 0,
                "type": "number"
              },
              "protocolId": {
                "description": "Protocol slug, e.g. morpho, aave-v3, pendle",
                "minLength": 1,
                "type": "string"
              },
              "sortBy": {
                "description": "Rank by this, descending. Default composite",
                "enum": ["composite", "apy", "tvl"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
