        {
          "name": "explain_vault_score",
          "title": "Explain vault score",
          "description": "Why a vault has its Atlas Score: all 16 factors (15 additive across four pillars + the multiplicative exploit-history modifier), each with sub-score (0-100), weight, raw input and a plain-English label, grouped by pillar, plus the three weakest factors. Exactly what the engine computed at scoredAt, not a recomputation. Returns found:false when unscored. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Vault contract address (0x…); case-insensitive",
                "minLength": 3,
                "type": "string"
              },
              "chainId": {
                "description": "EVM chain id, e.g. 1 (Ethereum), 8453 (Base), 42161 (Arbitrum)",
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["address", "chainId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
