          },
          "digest": "sha256:336fe0085a086432fba5219b39d5309011da8ebd0cf5618bf5b0659d98ce23e7"
        },
        {
          "name": "find_vaults",
          "title": "Find vaults",
          "description": "Start here when you do not already have a vault address. Answers \"which vaults for this asset on this chain?\": returns a short ranked list (default 5, max 10) of scored vaults with composite, label, live APY/TVL, risk flags (thin_tvl, apy_outlier, ...), whether a deposit can reach it (routable), and a citable page URL. It also returns what the filters REMOVED: counts per filter, the best-ranked dropped vaults with reasons, near-miss asset symbols, and whether more matched than were returned. Vaults with no deposit route and rows scored on fallback data are excluded. Ranked by the chosen metric, a ranking and not a recommendation. A flag is a caution, not a verdict, and no flag does not mean safe. Take a chosen vaultId/address to check_route_survival before any deposit. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asset": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "Underlying asset symbol, or a list of up to 10, e.g. USDC or [\"USDC\",\"USDT0\"]. Exact match: USDC does not include syrupUSDC (similarAssets lists near misses)"
              },
              "chain": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "exclusiveMinimum": 0,
                    "type": "integer"
                  }
                ],
                "description": "Chain name (base, ethereum, arbitrum, optimism, bnb, solana) or EVM chain id"
              },
              "limit": {
                "description": "Rows to return, default 5, max 10",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "minApy": {
                "description": "Minimum live APY in percentage points, e.g. 10 for 10%",
                "minimum": 0,
                "type": "number"
              },
              "minScore": {
                "description": "Minimum Atlas composite (0-100)",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "minTvlUsd": {
                "description": "Minimum live TVL in USD",
                "minimum": 0,
                "type": "number"
              },
              "protocolId": {
                "description": "Protocol slug, e.g. morpho, aave-v3, pendle",
                "minLength": 1,
                "type": "string"
              },
              "sortBy": {
                "description": "Rank by this, descending. Default composite",
                "enum": ["composite", "apy", "tvl"],
                "type": "string"
              }
            },
            "type": "object"
          },
