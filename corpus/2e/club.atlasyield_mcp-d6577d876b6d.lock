      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AtlasYield is an independent judgment layer for on-chain yield. Scores are research, not investment advice. Call check_route_survival before any deposit; blocking:true means refuse.",
      "tools": [
        {
          "name": "check_route_survival",
          "title": "Check route survival",
          "description": "Can a deposit into this vault be exited at size, measured today? Returns the daily round-trip route screen (USDC -> position -> USDC): verdict, USD in/out, fraction retained, the path probed, and when. blocking:true means refuse the deposit (NO_ROUTE, DANGEROUS, UNPRICEABLE). reasonClass says why: protocol_refused (the protocol's own router refuses, the vault is dead) vs no_aggregator_quote (no same-chain swap into the underlying, common for LP vaults; redeeming by hand may still work). The probe is SAME-CHAIN only: USDC on the vault's own chain. It says nothing about bridging in from elsewhere. Route tracking covers EVM chains only: a Solana vault returns tracked:false (not tracked, neither a pass nor a failure). A vault that was never screened returns screened:false with no verdict — never a fabricated one. Call this BEFORE moving money. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Vault contract address (0x…)",
                "minLength": 3,
                "type": "string"
              },
              "chainId": {
                "description": "EVM chain id of the vault",
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["address", "chainId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ac09a5da2883b3ae15d5ad6f3c0d767331a5751073cbef9df8080a74d19a4f95"
        },
        {
          "name": "compare_vaults",
          "title": "Compare vaults",
          "description": "Side-by-side Atlas Scores for 2-8 vaults: composite, label, four pillars, live APY/TVL, data quality, yieldQuality and exitSafety, with a ranking by composite. Unscored vaults come back found:false rather than silently dropped. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "vaults": {
                "description": "2-8 vaults to compare, any mix of chains",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "description": "Vault contract address (0x…); case-insensitive",
                      "minLength": 3,
                      "type": "string"
                    },
                    "chainId": {
                      "description": "EVM chain id",
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["address", "chainId"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["vaults"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
