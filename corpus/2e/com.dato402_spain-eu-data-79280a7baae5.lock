      },
      "instructions": "dato402: official Spanish and EU data for agents — BORME company registry, public tenders (PLACSP), public grants (BDNS), the BOE official gazette, EU funding calls (Funding & Tenders) and EU-wide tenders (TED), Catastro, CPI/rent updates (INE), PVPC electricity prices, fuel prices, Spanish tax ID / IBAN / EU VAT validation, ECB rates, Euribor and mortgage calculator, AEAT tax calendar, minimum wage/IPREM/legal interest, geocoding (CartoCiudad), municipality population (INE), AEMET weather, IGN earthquakes, holidays and business days, and domain security checks. All tools are read-only. Validation, calendar, currency, domain, travel, electricity, CPI, Euribor/mortgage, tax calendar, official indicators, geocoding, municipality, weather and earthquake tools are free. Premium data tools (company registry, BOE, tenders, grants, Catastro, website audit) are free up to 100 calls per day per client; for more, call the equivalent x402 HTTP endpoint (USDC on Base). Catalog: https://dato402.com/openapi.json",
      "tools": [
        {
          "name": "airport_search",
          "title": "Airport search worldwide by IATA/ICAO code, city or name, or",
          "description": "Airport search worldwide by IATA/ICAO code, city or name, or nearest airports to coordinates. Returns codes, type, country, coordinates, elevation and scheduled service.\n\nES: Busca aeropuertos de todo el mundo por código IATA/ICAO, ciudad o nombre, o los más cercanos a unas coordenadas. Devuelve códigos, tipo, país, coordenadas, altitud y si tiene vuelos regulares.\n\nFree tool (no API key, no payment). Official Spanish/EU open data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "description": "Latitud (alternativa a q)",
                "type": "string"
              },
              "limite": {
                "description": "Resultados (1-50, por defecto 10)",
                "type": "string"
              },
              "lon": {
                "description": "Longitud",
                "type": "string"
              },
              "pais": {
                "description": "Código ISO del país (opcional), p. ej. ES",
                "type": "string"
              },
              "q": {
                "description": "Código IATA/ICAO, ciudad o nombre, p. ej. MAD o Valencia",
                "type": "string"
              },
              "radio_km": {
                "description": "Radio en km (1-500, por defecto 100)",
                "type": "string"
              },
              "solo_regulares": {
                "description": "true para solo aeropuertos con vuelos regulares",
                "type": "string"
              }
