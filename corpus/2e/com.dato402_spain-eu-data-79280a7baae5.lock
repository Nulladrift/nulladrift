        {
          "name": "eu_economy_indicators",
          "title": "Economic dashboard for an EU country from Eurostat",
          "description": "Economic dashboard for an EU country from Eurostat: GDP growth (year and quarter, total and per capita), unemployment and youth unemployment, public debt and deficit (% of GDP), inflation, minimum wage and population, each with its period and the EU average.\n\nES: Panel económico de un país de la UE con Eurostat: PIB (variación anual y trimestral, total y per cápita), paro total y juvenil, deuda y déficit públicos (% PIB), inflación, salario mínimo y población. Cada dato con su periodo y la media de la UE.\n\nFree tool (no API key, no payment). Official Spanish/EU open data.",
          "inputSchema": {
