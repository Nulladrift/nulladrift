        {
          "name": "amount_in_words",
          "title": "Amount in words for invoices, cheques and contracts followin",
          "description": "Amount in words for invoices, cheques and contracts following Spanish RAE rules (veintiún, cien/ciento, un millón de euros), in euros, dollars or plain numbers, up to trillions. English output too. Parses 1.234,50 and 1,234.50.\n\nES: Importe en letras para facturas, cheques y contratos según las reglas de la RAE (veintiún, cien/ciento, un millón de euros), en euros, dólares o sin moneda, hasta billones. También en inglés. Interpreta 1.234,50 y 1,234.50.\n\nFree tool (no API key, no payment). Official Spanish/EU open data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idioma": {
                "description": "es (por defecto) o en",
                "type": "string"
              },
              "moneda": {
