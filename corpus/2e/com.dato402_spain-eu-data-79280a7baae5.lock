        {
          "name": "barcode_isbn_validate",
          "title": "Validates barcodes and identifiers",
          "description": "Validates barcodes and identifiers: EAN-8, EAN-13/GTIN-13, UPC-A, GTIN-14, ISBN-10, ISBN-13 (converts ISBN-10 to 13 and back) and ISSN. Returns the correct check digit, the GS1 prefix (country or organization that issued it) and the ISBN language area.\n\nES: Valida códigos de barras e identificadores: EAN-8, EAN-13/GTIN-13, UPC-A, GTIN-14, ISBN-10, ISBN-13 (convierte ISBN-10↔13) e ISSN. Indica el dígito de control correcto, el prefijo GS1 (país u organización que lo asignó) y el área de idioma del ISBN.\n\nFree tool (no API key, no payment). Official Spanish/EU open data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "codigo": {
