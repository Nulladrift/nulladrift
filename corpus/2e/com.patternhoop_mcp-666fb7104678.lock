{
  "lockfileVersion": 2,
  "subjects": {
    "com.patternhoop/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://patternhoop.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "patternhoop",
        "title": "PatternHoop",
        "version": "1.0.0",
        "websiteUrl": "https://patternhoop.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PatternHoop is a free photo-to-cross-stitch pattern maker (patternhoop.com). These read-only tools look up DMC and Anchor thread colours, convert a thread between DMC and Anchor by colour (approximate, not an official equivalent), match any colour to DMC threads, work out pattern and fabric sizes, and search the cross-stitch blog. Making a pattern from a photo happens in the browser editor at https://patternhoop.com/en; send people there.",
      "tools": [
        {
          "name": "convert_thread",
          "title": "Convert a thread between DMC and Anchor",
          "description": "Find the threads of the other brand closest to a DMC or Anchor thread, nearest first, each with its CIEDE2000 colour difference and a rating: same (deltaE below 2), close (below 5), noticeable (below 10) or far. Calculated by colour: approximate, not an official manufacturer equivalent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "description": "Its number, e.g. \"310\", \"Blanc\", \"5\" for 05; a leading \"DMC \" or \"Anchor \" is fine",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "from": {
                "description": "Brand of the thread to convert: dmc or anchor",
                "enum": ["dmc", "anchor"],
                "type": "string"
              },
              "limit": {
                "default": 3,
                "description": "How many threads of the other brand to return (1–6)",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["code", "from"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:eb983128322d97be6db10db356639639f13b692d3fdaa4407282d0d524afdba2"
        },
        {
          "name": "find_nearest_dmc_colors",
          "title": "Nearest DMC threads to a colour",
          "description": "Find the DMC threads closest to any colour (hex like #ff6600 or rgb(255,102,0)), ranked by CIEDE2000 colour difference, the same matching the pattern maker uses. deltaE below 2 is hard to tell apart; above 10 is clearly a different colour.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "color": {
                "description": "Colour as #rrggbb, #rgb or rgb(r, g, b)",
                "maxLength": 32,
                "minLength": 3,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many threads to return (1–20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["color"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9fa0c6a0deece2d50b7b13acb500e5d92a22e35260ecc186ad6bf176b3465884"
        },
        {
          "name": "get_anchor_color",
          "title": "Anchor thread by number",
          "description": "Look up an Anchor stranded cotton colour by its number (\"403\", \"2\", \"Anchor 403\"): name, hex and RGB, colour family.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "description": "Anchor number as printed on the skein, e.g. \"403\"",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:07641b47de4c291a229b9addbfc3fced3447c045f89584155249bace17611b65"
        },
        {
          "name": "get_dmc_color",
          "title": "DMC thread by number",
          "description": "Look up a DMC stranded cotton colour by its number (\"310\", \"3865\", \"Blanc\", \"B5200\"): name, hex and RGB, colour family.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "description": "DMC number as printed on the skein, e.g. \"310\"",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cd2ec3cff624ca5771879f6793be7e17cec524a9d2812c06bd64b65881b2b5a7"
        },
        {
          "name": "list_dmc_colors",
          "title": "List DMC threads",
          "description": "List DMC stranded cotton colours (489 in total), optionally by colour family or by a search in the number and name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "family": {
                "description": "Colour family",
                "enum": ["reds", "pinks", "oranges", "yellows", "greens", "blues", "purples", "browns", "neutrals", "whites"],
                "type": "string"
              },
              "limit": {
                "default": 100,
                "description": "Most threads to return",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of a number or a name, e.g. \"blue\" or \"31\"",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:09626e8b0ba6ed0adb5e7e68db40c6da6e325223e1f705000675e166104cde91"
        },
        {
          "name": "pattern_size",
          "title": "Finished size, fabric and floss for a pattern",
          "description": "For a cross-stitch pattern of width × height stitches on Aida 11, 14, 16 or 18: the finished size in cm and inches, the piece of fabric to cut (5 cm spare on each side) and how many full stitches one 8 m skein covers with 2 strands.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "aida": {
                "default": 14,
                "description": "Aida count, stitches per inch: 11, 14, 16 or 18",
                "type": "number"
              },
              "height": {
                "description": "Height in stitches",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "width": {
                "description": "Width in stitches",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["height", "width"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f77ceae0e53fa2cb539c89528e9a2773aad7622f545a8b6104cfd0011bd370b1"
        },
        {
          "name": "search_articles",
          "title": "Search the cross-stitch blog",
          "description": "Search PatternHoop blog articles about cross-stitch (choosing photos, Aida fabric, threads) in any of the seven site languages. Returns titles, summaries and links; every article page also answers Accept: text/markdown.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "description": "Most articles to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language: en, ru, uk, es, pl, de or pt",
                "enum": ["ru", "en", "uk", "es", "pl", "de", "pt"],
                "type": "string"
              },
              "query": {
                "description": "Words to look for; empty lists every article",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
