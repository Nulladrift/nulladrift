{
  "lockfileVersion": 2,
  "subjects": {
    "com.fxsocket/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fxsocket.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "fxsocket",
        "title": "FxSocket",
        "version": "1.0.0",
        "description": "Read-only access to MetaTrader 4, MetaTrader 5 and cTrader accounts connected to FxSocket: balances, positions, trade history, quotes, symbol specs and candles.",
        "websiteUrl": "https://fxsocket.com/docs/mcp",
        "icons": [
          {
            "src": "https://fxsocket.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FxSocket gives read-only access to the MetaTrader 4, MetaTrader 5 and cTrader trading accounts linked to this API key: balances, open positions, closed trades, quotes, symbol specifications and price history. It cannot place, modify or close orders.\n\nStart with list_accounts to get account ids. Symbol names are broker-specific (EURUSD at one broker, EURUSD.sd or EURUSDm at another), so look them up with search_symbols before asking for quotes or candles. Money is in each account's deposit currency: never add amounts across currencies, use the totals_by_currency the tools return. Times and date filters are in the broker's server time, not UTC.",
      "tools": [
        {
          "name": "get_account",
          "title": "Get account details",
          "description": "One account in full, read live from its terminal: financials (balance, equity, margin, free margin, margin level, leverage, currency), account settings (margin mode, stop-out level, whether trading is allowed) and terminal health (broker connection, login state, and in health.account.authError the broker's reason when it refused the login, e.g. Invalid account for a wrong password). Takes one account_id from list_accounts; if part of the read fails, the rest is still returned and the failure is listed under errors. For balance and equity across several accounts at once, use list_accounts with include_balances; for positions, use get_open_positions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_id": {
                "description": "An account_id from list_accounts.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["account_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get account details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7bfaef678b489f9f1d00ed82fe1504c28adc34581d395a2c4ff59218a752d80f"
        },
        {
          "name": "get_open_positions",
          "title": "Get open positions",
          "description": "Open positions and pending orders on one or more accounts, newest first, with per-account counts, floating profit and swap, and totals per currency. Lists at most 300 orders across all accounts; counts and totals always cover everything. Narrow it with symbol (EURUSD also matches EURUSD.sd) and kind (position or pending); omit account_ids to read every account. Only what is open now: for closed trades, win rate or realised profit, use get_trade_history.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_ids": {
                "description": "Account ids from list_accounts. Omit to read every account this key can see.",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "kind": {
                "default": "any",
                "description": "position = filled trades, pending = resting limit/stop orders.",
                "enum": ["any", "position", "pending"],
                "type": "string"
              },
              "symbol": {
                "description": "Only this instrument. Matches broker suffixes too, so EURUSD also matches EURUSD.sd and EURUSDm.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get open positions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbde0bd73cf43a2eaae35deec0b27de9e3fe59489c6dae2a4e6464700ca0a144"
        },
        {
          "name": "get_price_history",
          "title": "Get price history",
          "description": "OHLC candles for one symbol from this account's broker. Returns the most recent `limit` bars (default 100, max 500) in the window; omit from/to for the latest bars. A window spanning more than 20000 bars is refused (narrow it or pick a larger timeframe). For the current price only, use get_quotes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_id": {
                "description": "An account_id from list_accounts.",
                "format": "uuid",
                "type": "string"
              },
              "from": {
                "description": "Start of the window. Date (YYYY-MM-DD) or ISO-8601 datetime, in the broker's server time.",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "symbol": {
                "description": "Exact broker symbol name (see search_symbols).",
                "type": "string"
              },
              "timeframe": {
                "description": "Bar size, M1 to MN1. The same nine on MT4, MT5 and cTrader.",
                "enum": ["M1", "M5", "M15", "M30", "H1", "H4", "D1", "W1", "MN1"],
                "type": "string"
              },
              "to": {
                "description": "End of the window. Defaults to now. Date (YYYY-MM-DD) or ISO-8601 datetime, in the broker's server time.",
                "type": "string"
              }
            },
            "required": ["account_id", "symbol", "timeframe"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get price history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a4728c71c9d5db1205f954082ea3ec82aa5bf66011c2d7a697998e3f00c67b1"
        },
        {
          "name": "get_quotes",
          "title": "Get live quotes",
          "description": "Latest bid, ask and spread for up to 20 symbols, read live from this account's terminal, so prices are the broker's own. A symbol the broker does not know is listed under errors while the others still return; if none resolve, the call fails. The current price only: for past prices use get_price_history, for contract size, swaps or sessions use get_symbol_info.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_id": {
                "description": "An account_id from list_accounts.",
                "format": "uuid",
                "type": "string"
              },
              "symbols": {
                "description": "Exact broker symbol names (see search_symbols).",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["account_id", "symbols"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get live quotes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d277fd2de810513f4d0218b793ed11915cb9ac23e6671938aea828a1d5b1fb3"
        },
        {
          "name": "get_symbol_info",
          "title": "Get symbol specification",
          "description": "Contract specification for one symbol at this account's broker, read live from its terminal: digits, contract size, tick size and value, minimum/maximum/step volume, stops level, current spread, swap rates, commissions and trading sessions. symbol must be the broker's exact name, so look it up with search_symbols first; an unknown symbol fails the call with the terminal's reason. For just the live bid and ask of several symbols, get_quotes is lighter.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_id": {
                "description": "An account_id from list_accounts.",
                "format": "uuid",
                "type": "string"
              },
              "symbol": {
                "description": "Exact broker symbol name (see search_symbols).",
                "type": "string"
              }
            },
            "required": ["account_id", "symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get symbol specification"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:544bc66b6abf5dd5726aef90f549bf77d385b38371967342183fe7628d908f21"
        },
        {
          "name": "get_trade_history",
          "title": "Get closed trades",
          "description": "Closed positions (one row per round trip) on one or more accounts, with per-account stats: trade count, wins, losses, win rate, net profit after commission and swap, best and worst trade, and a per-symbol breakdown. Defaults to the last 7 days; the window can be up to 366 days. Lists at most 300 trades across all accounts, newest first; the stats always cover the whole window. Each trade has its open and close price and time and the stop-loss and take-profit it closed with (sl, tp; 0 = not set, and always 0 on cTrader). For positions that are still open, use get_open_positions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_ids": {
                "description": "Account ids from list_accounts. Omit to read every account this key can see.",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "from": {
                "description": "Start of the window. Date (YYYY-MM-DD) or ISO-8601 datetime, in the broker's server time.",
                "type": "string"
              },
              "symbol": {
                "description": "Only this instrument. Matches broker suffixes too, so EURUSD also matches EURUSD.sd and EURUSDm.",
                "type": "string"
              },
              "to": {
                "description": "End of the window (a bare date includes that whole day). Defaults to now. Date (YYYY-MM-DD) or ISO-8601 datetime, in the broker's server time.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get closed trades"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7421099cdce03fee79dd785782a72e9345a884a05f4f2bd2afca0246e8d011e"
        },
        {
          "name": "list_accounts",
          "title": "List trading accounts",
          "description": "Every MT4, MT5 and cTrader account linked to this API key: id, nickname, platform, broker server, login and connection status (connected / connecting / disconnected / error). Call this first: the other tools take its account_id values. Set include_balances to also read each account's live balance, equity and floating profit from its terminal, plus totals per currency; that reads at most 50 accounts, and one that cannot be read gets a balance_error instead of failing the call. For one account's margin, leverage and settings, use get_account instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_balances": {
                "default": false,
                "description": "Also read live balance, equity and floating profit from each account's terminal (one extra read per account, so slower).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List trading accounts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:19bff230c6899bd35f050926e5a5b13cf9067d503bae8a5c092407fe44c62924"
        },
        {
          "name": "search_symbols",
          "title": "Search symbols",
          "description": "Find the exact symbol names an account's broker uses, by case-insensitive substring. Brokers spell instruments differently (EURUSD, EURUSD.sd, EURUSDm, XAUUSD.r), so look a name up here before calling get_quotes, get_symbol_info or get_price_history. Returns up to limit names (default 100) with how many matched and whether the list was cut; names only, one symbol's contract details come from get_symbol_info.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_id": {
                "description": "An account_id from list_accounts.",
                "format": "uuid",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "description": "Most names to return; truncated says whether more matched.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Case-insensitive substring, e.g. EUR or XAU. Omit to list all.",
                "type": "string"
              }
            },
            "required": ["account_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search symbols"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ec2b1b4c5e1cfa42b264005ce3238e538fb854c082e561764f02338be66a138a"
        }
      ],
      "digest": "sha256:6125953b60760c6a9bf20693b6c70616bc514b60b38cdd14dfa51234caddc4ef"
    }
  }
}
