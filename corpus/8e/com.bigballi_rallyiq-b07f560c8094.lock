        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RallyIQ: tennis scouting models built from 11,822 shot-by-shot charted ATP and WTA matches (the Match Charting Project). Use get_game_plan for a matchup (forecast, where to serve, how to return, rally patterns to favour and avoid), get_player for one player's strengths, weaknesses and serving habits, explain_match for why a charted match went the way it did, and get_leaders for rankings such as direction choice, execution or the most exploitable serve. Values marked per_100 are points gained or lost per 100 shots (or serves, or returns) against an average tour player in the same position. Margins are 90% intervals. Charted matches lean toward big events and well-known players, so forecasts are scouting estimates, not betting lines. The data is licensed CC BY-NC-SA 4.0, which requires attribution to the Match Charting Project wherever these numbers appear.",
      "tools": [
        {
          "name": "explain_match",
          "title": "Explain a charted tennis match",
          "description": "Why a charted match went the way it did: points won, and each player's gain or loss against expectation split into direction choice, shot selection and execution, by stroke and by set, the loser's biggest leaks and the points each player left on the table by not choosing the best-value direction. Finds the most recent charted match for a player, narrowed by opponent, tournament or year, and lists other matching matches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "opponent": {
                "description": "The other player (optional), e.g. \"Jannik Sinner\", \"Swiatek\", \"Alcaraz\". Misspellings and surnames alone are fine.",
                "maxLength": 80,
                "type": "string"
              },
              "player": {
                "description": "A player in the match, e.g. \"Jannik Sinner\", \"Swiatek\", \"Alcaraz\". Misspellings and surnames alone are fine.",
                "maxLength": 80,
                "type": "string"
              },
              "tournament": {
                "description": "Words from the tournament name, e.g. \"Wimbledon\", \"Roland Garros\", \"Indian Wells\".",
                "maxLength": 60,
                "type": "string"
              },
              "year": {
                "description": "Season of the match.",
                "maximum": 2100,
                "minimum": 1960,
                "type": "integer"
              }
            },
            "required": ["player"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a charted tennis match"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f4e5733b5789833ba1268145c8762897116770bc5db76be1524fdb9d6550f50"
        },
        {
          "name": "get_game_plan",
          "title": "Tennis game plan for a matchup",
          "description": "A scouting game plan for one player against an opponent, from 11,822 shot-by-shot charted ATP and WTA matches: the match forecast with a 90% range (same tour only), where to serve first serves on each court against this returner and the optimal mix, which returns work best against this server, the rally shots to favour and to avoid, what the opponent tends to serve, career shot ratings side by side, style compatibility and the charted head-to-heads. Optionally for one surface.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "opponent": {
                "description": "The opponent, e.g. \"Jannik Sinner\", \"Swiatek\", \"Alcaraz\". Misspellings and surnames alone are fine.",
                "maxLength": 80,
                "type": "string"
              },
              "player": {
                "description": "The player the plan is for, e.g. \"Jannik Sinner\", \"Swiatek\", \"Alcaraz\". Misspellings and surnames alone are fine.",
                "maxLength": 80,
                "type": "string"
              },
              "surface": {
                "description": "Court surface for the forecast and rally plan (default all).",
                "enum": ["all", "hard", "clay", "grass"],
                "type": "string"
              }
            },
            "required": ["opponent", "player"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Tennis game plan for a matchup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://rallyiq/game-plan-v1.html",
            "ui": {
              "resourceUri": "ui://rallyiq/game-plan-v1.html"
            }
          },
          "digest": "sha256:2735506ce89cd3af9452f9e035f03e2245c2370a9478f1bc23a92f3bbc38364b"
        },
        {
          "name": "get_leaders",
          "title": "Tennis tactical leaderboards",
          "description": "Top 10 ATP or WTA players on one tactical measure: direction_choice: Picks the more valuable direction for the stroke being hit (per 100 shots, opponent-adjusted). execution: Gets more out of a shot than the same choice usually yields (per 100 shots, opponent-adjusted). shot_selection: Chooses strokes worth more than the position average; partly reflects the ball they were given (per 100 shots, opponent-adjusted). fewest_points_left: Smallest gap per 100 shots between the direction chosen and the best-value direction for that stroke. most_exploitable_serve: Points per 100 first serves an optimal direction mix would win over the current one, allowing for returners reading a habit. serve_off_equilibrium: First-serve directions that win at clearly different rates (p < 0.01): usage-weighted gap per 100 first serves and the direction to use more. long_rallies_hold_up: Execution from the ninth shot of a rally on, minus the player's own earlier-rally execution, per 100 shots (ATP only). long_rallies_fade: The same long-rally measure, most fading first (ATP only). adaptability: Moves the first-serve mix toward what has been winning in earlier sets, per 100 first serves. A weak habit, not a proven gain. adapts_fastest: The same, every two to three service games, per 100 first serves. Players need at least 5,000 modelled shots.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "board": {
                "description": "Which leaderboard.",
                "enum": ["direction_choice", "execution", "shot_selection", "fewest_points_left", "most_exploitable_serve", "serve_off_equilibrium", "long_rallies_hold_up", "long_rallies_fade", "adaptability", "adapts_fastest"],
                "type": "string"
              },
              "scope": {
                "description": "active: charted in the last three seasons (default); all_eras: every era.",
                "enum": ["active", "all_eras"],
                "type": "string"
              },
              "tour": {
                "description": "atp (default) or wta.",
                "enum": ["atp", "wta"],
                "type": "string"
              }
            },
            "required": ["board"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Tennis tactical leaderboards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bca56416b334df8b1947b1268d71b05dce2ea773464b92096c44c08a11d7acbe"
        },
        {
          "name": "get_player",
          "title": "Tennis player scouting report",
          "description": "One charted player's scouting report, found by name: serve and return points won against an average opponent, shot ratings per 100 shots (direction choice, shot selection, execution, long rallies, points left on the table) with tour percentiles, first-serve direction habits per court including on break points, how exploitable the serve is and the optimal mix, the shots they hurt opponents with most and the shots they are most exposed to, best-equipped opponents, stylistically similar players and recent charted matches. When the name matches several players it returns the best match and lists the others.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The player, e.g. \"Jannik Sinner\", \"Swiatek\", \"Alcaraz\". Misspellings and surnames alone are fine.",
                "maxLength": 80,
                "type": "string"
              },
              "tour": {
                "description": "Restrict the name search to one tour when a surname is shared (e.g. Williams).",
                "enum": ["atp", "wta"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Tennis player scouting report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9bfe0eb9ea97094f8fb8a3c3ad0c6516a85a31c81695cdb881fa60e01dcc5fc5"
        }
