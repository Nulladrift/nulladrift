          "digest": "sha256:e3ed1505482503fd6bb325c0f850cf67863ed6aeb4cea4adb5299d97dd04daee"
        },
        {
          "name": "list_products",
          "title": "List Products",
          "description": "List every product in the Business Suite line with its included skills. FREE.\n\nTakes no arguments. Typical input {} returns a list of 30 product objects, each\n{\"slug\": \"smb-ops-desk\", \"name\": ..., \"tagline\": ..., \"skills\":\n[\"Skill A\", ...], \"free_skill\": \"Gateway Skill Name\"}. Use the returned\nslug values with get_free_skill, get_full_product, or get_full_skill.\n\nReturns metadata only - no persona text and no skill instructions. Use\nwhen the caller wants to see what this server covers. Not for keyword\nsearch across the whole 138-product catalog, which the catalog server's\nsearch_catalog does, and not for instructions the caller can act on\n(get_free_skill). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:97aa9ad3da9f252313e5ed8b52b48b384e5f38f85ff0d9cf00a467aab23c3388"
        },
        {
          "name": "loan_payment",
          "title": "Loan Payment",
          "description": "Compute an amortized loan payment: monthly payment, total paid, total interest. FREE.\n\nAdministrative math only, not financial advice. Typical input\n{\"principal\": 250000, \"annual_rate_pct\": 6.5, \"years\": 30} returns\n{\"monthly_payment\": 1580.17, \"months\": 360, \"total_paid\": ...,\n\"total_interest\": ...}.\n\nUse for a fixed-rate amortized loan. Not for interest-free schedules - the\nmerchant server's installment_plan splits a total without interest. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"principal and years must be > 0\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_rate_pct": {
                "description": "Annual interest rate as a percentage, 0 to 100, e.g. 6.5 for 6.5%.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "principal": {
                "description": "Loan amount; must be greater than 0, e.g. 250000.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "years": {
                "description": "Loan term in years; must be greater than 0; fractions allowed, e.g. 30.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["annual_rate_pct", "principal", "years"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Loan Payment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:436b22a185de9dee8d7a73f3f3bd8524314637bb44528be5914786a8798603fb"
        },
        {
          "name": "target_price",
          "title": "Target Price",
          "description": "Compute the selling price needed to hit a target margin percentage. FREE.\n\nTypical input {\"unit_cost\": 12, \"target_margin_pct\": 60} returns\n{\"required_price\": 30.0, \"unit_margin\": 18.0,\n\"equivalent_markup_pct\": 150.0}.\n\nThe inverse of unit_economics - solves for price from a target margin. Use\nwhen the margin is the fixed requirement. Not when the price is already\nset. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"target_margin_pct must be between 0 and 100\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "target_margin_pct": {
                "description": "Desired gross margin percentage, strictly between 0 and 100, e.g. 60 for a 60% margin.",
                "exclusiveMaximum": 100,
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "unit_cost": {
                "description": "Variable cost per unit; must be 0 or greater, e.g. 12.0.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["target_margin_pct", "unit_cost"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Target Price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:a7b1d47aacce2eb34fc9401a38bd3069ffcf6ef15bb099548317a14c2e950ac9"
        },
        {
          "name": "unit_economics",
          "title": "Unit Economics",
          "description": "Calculate unit economics: margin, break-even, LTV:CAC, and a plain reading. FREE.\n\nTypical input {\"price\": 49, \"unit_cost\": 12, \"fixed_costs_monthly\": 8000}\nreturns {\"unit_margin\": 37.0, \"margin_pct\": 75.5, \"markup_pct\": 308.3,\n\"breakeven_units_per_month\": 216.2, \"reading\": [\"...\"]}. LTV fields\nappear when cac is provided.\n\nUse when price, variable cost, and fixed costs are known and margin or\nbreak-even is the question. Not for cash position over time (cash_runway)\nand not for solving backward from a target margin (target_price). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"price must be > 0\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cac": {
                "default": 0,
                "description": "Customer acquisition cost; a value greater than 0 enables LTV and LTV:CAC. Default 0 (skipped).",
                "type": "number"
              },
              "fixed_costs_monthly": {
                "default": 0,
                "description": "Fixed monthly costs; a value greater than 0 enables the break-even calculation. Default 0 (skipped).",
                "type": "number"
              },
              "price": {
                "description": "Selling price per unit; must be greater than 0, e.g. 49.0.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "purchases_per_customer": {
                "default": 1,
                "description": "Average lifetime purchases per customer used for LTV. Default 1.",
                "type": "number"
              },
              "unit_cost": {
                "description": "Variable cost per unit, in the same currency as price, e.g. 12.0.",
                "type": "number"
              },
              "units_per_month": {
                "default": 0,
                "description": "Expected sales volume per month; a value greater than 0 enables the monthly profit projection. Default 0 (skipped).",
                "type": "number"
              }
            },
            "required": ["price", "unit_cost"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Unit Economics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
