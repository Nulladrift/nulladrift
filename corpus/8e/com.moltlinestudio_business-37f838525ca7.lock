      },
      "instructions": "Moltline's Business Suite: 30 industry/operations persona-skill products (finance admin, bookkeeping support, legal-office ops, real estate, hospitality, SMB operations and more). Free: list_products, get_free_skill, unit_economics. Premium: get_full_product, get_full_skill.",
      "tools": [
        {
          "name": "cash_runway",
          "title": "Cash Runway",
          "description": "Compute months of cash runway and the projected out-of-cash date. FREE.\n\nTypical input {\"cash_balance\": 120000, \"monthly_burn\": 15000,\n\"monthly_revenue\": 5000} returns {\"runway_months\": 12.0,\n\"net_burn_monthly\": 10000, \"projected_out_of_cash\": \"YYYY-MM-DD\"}; when\nrevenue covers burn it returns {\"runway\": \"infinite at current numbers\n(revenue covers burn)\", ...}.\n\nUse when a cash balance and a monthly burn are known. Not for per-unit\nprofitability (unit_economics). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"cash_balance must be >= 0\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cash_balance": {
                "description": "Cash on hand today; must be 0 or greater, e.g. 120000.",
                "minimum": 0,
                "type": "number"
              },
              "monthly_burn": {
                "description": "Total monthly outflow in the same currency as cash_balance, e.g. 15000.",
                "type": "number"
              },
              "monthly_revenue": {
                "default": 0,
                "description": "Monthly inflow netted against burn, e.g. 5000. Default 0.",
                "type": "number"
              }
            },
            "required": ["cash_balance", "monthly_burn"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cash Runway"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:ac18024f32e020bc797010e8ad6031e7bdd59356fe14a70b2c84241abf3f8a00"
        },
        {
          "name": "get_free_skill",
          "title": "Get Free Skill",
          "description": "Load a product's free gateway skill with its complete instructions. FREE.\n\nTypical input {\"slug\": \"smb-ops-desk\"} returns {\"slug\": \"smb-ops-desk\",\n\"skill\": \"<skill name>\", \"instructions\": \"<full skill text>\"}.\n\nReturns exactly one skill - the product's free gateway skill - chosen\nautomatically from the slug, with no plan required. Use when the caller\nwants usable instructions immediately. Not for the product's other skills:\nthose are named and need get_full_skill with a skill_name, which requires\na paid plan. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"unknown slug '<value>'. Use list_products.\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Product slug exactly as returned by list_products, e.g. \"smb-ops-desk\"; must be non-empty.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Free Skill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:4668c0099a4878fd4975c4b8d0bc2f630389e38f06977282e4d387720fb91eb8"
        },
        {
          "name": "get_full_product",
          "title": "Get Full Product",
          "description": "Load one product in full: its persona plus every paid skill. PREMIUM (license).\n\nTypical input {\"slug\": \"smb-ops-desk\"} returns {\"slug\": ..., \"name\": ...,\n\"persona\": \"<persona text>\", \"skills\": [{\"name\": ..., \"instructions\":\n...}, ...], \"free_skill\": {...}}.\n\nReturns persona plus every skill for one product. Use when the caller\nwants the whole product. Not for a single skill (get_full_skill) and not\nfor a free look, which list_products and get_free_skill provide with no\nplan. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"unknown slug '<value>'\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Product slug exactly as returned by list_products, e.g. \"smb-ops-desk\"; must be non-empty.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Full Product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:8bdcb6c35c2e61964a999c3a8ed49a9b059c516622f3715c5a41b9788abed03b"
        },
        {
          "name": "get_full_skill",
          "title": "Get Full Skill",
          "description": "Load one paid skill's complete instructions from a product. PREMIUM (license).\n\nTypical input {\"slug\": \"smb-ops-desk\", \"skill_name\": \"invoice-chaser\"}\nreturns {\"slug\": ..., \"skill\": ..., \"instructions\": \"<full skill text>\"}.\n\nReturns one named skill, selected by skill_name. Use when the caller wants\none specific paid skill. Not for the free gateway skill, which\nget_free_skill returns with no plan, and not for every skill at once\n(get_full_product). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"unknown slug '<value>'\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "skill_name": {
                "description": "Exact skill name as listed in that product's \"skills\" array from list_products, e.g. \"invoice-chaser\"; must be non-empty.",
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "Product slug exactly as returned by list_products, e.g. \"smb-ops-desk\"; must be non-empty.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["skill_name", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Full Skill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
