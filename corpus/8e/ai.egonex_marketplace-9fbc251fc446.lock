        {
          "name": "search_offers",
          "title": "Search Egonex listings",
          "description": "Search listings on Egonex, a marketplace where individual people sell things and services directly. Use it when your user wants to buy, hire, book, rent or commission something from a person rather than a store, for example:\n- items, new or used: cameras and lenses, phones, laptops, bikes, furniture, clothing, collectibles, instruments, gear;\n- lessons and coaching: languages, music, tutoring and test prep, fitness, cooking, art, coding;\n- services in person: photography, repairs (bikes, electronics, film cameras), cleaning, moving help, pet care, babysitting, beauty, tours;\n- online and freelance work: design, writing and editing, translation, software, marketing, consulting, video editing;\n- digital goods, tickets, handmade and custom work.\nEach result is one listing with a price and unit (per item, package, hour, session, day, week, month, night, person or project; USD), how it is delivered (in person in a city, online, or either), for physical items its condition (new or used), brand / model / gtin when the seller gave them, and ships = true when the seller posts it (your user enters the shipping address when paying on Egonex, or you pass it to pay_order when you pay), delivery_days when the seller states a usual delivery time (days to ship for posted items), up to 4 photo URLs, the listing's own page, ask_url / order_url links a person can open, and the seller: seller.name (the name on their public page; use it when you mention the seller), their public page, seller.answers_questions (true = ask_seller gets an answer right away), seller.trusted (true = Egonex's Trusted badge, given automatically for the seller's recent trading on Egonex, not set by the seller) and, when there are 3 or more, seller.orders_completed; seller.review_count and seller.average_rating (1 to 5 stars, one decimal) appear when the seller has counted buyer reviews (buyers rate the item they bought from 1 to 5 stars), with seller.positive_count / seller.negative_count (4–5 stars / 1–3 stars), and seller.positive_rate (0 to 100, rounded down) once there are 10 or more. Results are ranked by how well they match the query words (rarer words count more; listings that match only common words are left out); among results that match equally well (and are equally close, for in-person services), sellers whose counted buyer reviews average more stars come first (a seller with only a few reviews counts as closer to 4 stars), and sellers with no reviews sit in the middle, level with a 4-star average; each result's relevance says whether the listing itself (its title and description, not the store's name or intro) matches all or only some words, and matched_words / missing_words say which. Online, remote and in person in query never bring in a listing by themselves: among equally good matches, listings whose title says it come first, then those delivered that way; a listing that is neither counts as some. Only the first 12 search words of query are used (filler words like for, near or cheap don't count, nor do two-letter words in lowercase or a single letter on its own: write abbreviations in capitals, such as QA or IT, and give a letter another word, such as C++ tutor); the rest come back in unused_words. When nothing matches, the response says so and lists the categories that have listings; a search within a category or a store returns that category's or store's other listings instead, marked other_filters. query can be in any language. When it isn't English, Egonex also searches an English translation of it; when it has words too short to search, ends with a place (and city is empty), matches nothing or has a word no listing uses, Egonex searches a rewrite instead. searched_as says what was searched. Put the place in city, not in query (listing cities are not matched against query words): in-person listings in that city come first, then those nearby (same metro area or within about 30 miles), and add the state when several places share the name (Portland, OR). Online, either-way and shipped listings are always included, and in-person listings without a city that don't ship come back with city_unknown = true (ask the seller before suggesting one to someone far away). Use store to list one seller's storefront. Each listing has availability (in_stock; sold-out listings are left out of results) and stock_left when only 1 to 3 are left. When you suggest a listing to your user, give them its url (the listing's own page) so they can open it. No account or API key is needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "One category. Goods: electronics (electronics & accessories), fashion (clothing & shoes), jewelry (jewelry, bags & accessories), beauty (beauty & personal care), home (home & living), toys (toys & games), baby (baby & maternity), sports (sports & outdoor gear), hobbies (collectibles & hobbies), art (art, handmade & craft supplies), pets (pet supplies), books (books, music & movies), food (food & drinks). Services: lessons (lessons & tutoring), local (local services: repairs, cleaning, moving, pet care, babysitting, beauty, photography), creative (design, writing, translation, video, music), professional (software, AI setup, marketing, legal, accounting). digital (templates, e-books, courses, apps, AI agent skills, media files), rentals (tickets & vouchers), other.",
                "enum": ["electronics", "fashion", "jewelry", "beauty", "home", "toys", "baby", "sports", "hobbies", "art", "pets", "books", "food", "lessons", "local", "creative", "professional", "digital", "rentals", "other"],
                "type": "string"
              },
              "city": {
                "description": "City for in-person listings, e.g. \"San Francisco\" or \"Portland, OR\". In-person listings in that city come first, then those nearby (same metro area or within about 30 miles); listings done only in person elsewhere are left out. Add the state when several places share the name. In-person listings without a city are kept and marked city_unknown (unless they ship); online, either-way and shipped listings are always included and rank after local ones.",
                "type": "string"
              },
              "condition": {
                "description": "Physical items: new = only new items; used = new and used. Listings that don't state a condition are included.",
                "enum": ["new", "used"],
                "type": "string"
              },
              "delivery": {
                "description": "onsite = in person only, remote = online only, hybrid = either.",
                "enum": ["onsite", "remote", "hybrid"],
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
