        {
          "name": "message_seller",
          "title": "Message the seller for your user",
          "description": "Send a message to the seller of a listing as your user: a question Ego couldn't answer, a custom request, or whether a sold-out listing will be back. If your user has connected their Egonex account to you with permission to act for them (egonex.write), the message is sent right away from that account into their Egonex chat with the seller: the result has status message_sent, there is nothing for your user to confirm (its confirm_url only opens the request's page), and check_request with the returned id shows the seller's replies (seller_replies). Sending the same text about the same listing again within 2 minutes returns the earlier request instead of sending it twice. Nothing is sent, and the error says why, when it is your user's own listing, when your user's Egonex account has to finish setting up first (verify a phone number or finish signing up), when your user has reached Egonex's daily limit of new people to contact, when the message contains your user's delivery code (contains_delivery_code: that code only goes to the seller face to face, when the item is in your user's hands), or after 20 messages from that account within 60 seconds. Otherwise (no connected account, or a read-only connection) it returns a confirm_url for your user: nothing is sent until they open it and confirm. They need only an email address, no Egonex account. The message then goes to the seller's Egonex chat as your user, and the seller replies there (a buyer without an Egonex account gets the reply by email); check_request shows what the seller wrote only with a connected Egonex account that is this request's buyer. Use check_request with the returned id to see whether it was sent (message_sent). To get an answer from the seller's assistant (Ego) right away instead, use ask_seller.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Your name, shown to your user when they confirm.",
                "maxLength": 60,
                "type": "string"
              },
              "message": {
                "description": "What the seller gets from your user, up to 1000 characters.",
                "maxLength": 1000,
                "type": "string"
              },
              "offer_id": {
                "description": "The listing id from search_offers (the 8-character id at the end of a listing page URL also works).",
                "type": "string"
              }
            },
            "required": ["message", "offer_id"],
            "type": "object"
          },
