      "instructions": "Egonex is a marketplace where individual people sell items (new and used), services in person or online, lessons, digital goods, tickets and custom work, often with their own AI assistant answering buyers. Typical flow: search_offers, then ask_seller if your user needs a detail, then quote_order for the full price with shipping and sales tax, then request_order with that quote_id and give the confirm_url to your user. Prices are per listing in USD; when the seller allows it, Ego may agree a lower price with you in ask_seller (deal), and request_order with that deal_id uses it. Orders always need your user's confirmation on the confirm_url page (an email address is enough, no Egonex account needed); payment happens there. After an order is placed, everything about it (confirming delivery, a problem with it, a refund or a cancellation) is handled on Egonex, in your user's chat with the seller (a buyer without an Egonex account opens it from the link in Egonex's email), not through these tools. Listings only show what sellers made public, and they change often, so search again instead of relying on old results. Questions you ask with ask_seller go to the seller in a conversation on Egonex under an anonymous visitor identity: the seller's Ego may answer right away, and you can read later replies from the seller with check_conversation and the conversation_id. set_buyer_email leaves your user's email address in such a conversation: after they confirm it from a link Egonex emails them (once per conversation), the conversation and the messages already sent in it move to the Egonex account for that address, where your user can read and answer the seller's replies, and what you ask sellers in it is then sent from that account. If you can get a Stripe Shared Payment Token for your user, pay_order pays for a request_order order directly, without the confirm page.",
      "tools": [
        {
          "name": "ask_seller",
          "title": "Ask about a listing",
          "description": "Ask the seller of a listing one question, or send them a message: availability, condition, what is included, timing, location, sizes, how shipping or delivery works. Your first question opens a conversation with the seller on Egonex under an anonymous visitor identity (no email address or Egonex account needed), and the seller sees every question in their Egonex inbox. Pass the conversation_id from the answer with every later question in the same conversation, about this or another listing; each seller you ask gets their own chat in that conversation. If the seller has their assistant (Ego) answering (seller.answers_questions is true in search results), Ego replies in the chat and the reply comes back in this response; Ego declines questions that are not about this store (reason declined). About the listing you ask about, when the seller has set a lowest price, Ego can also talk price with you about that listing: it may counter once, and when you agree a price the answer has deal (deal.id, valid for 24 hours, for one request_order). For 24 hours it holds the price it named to you and won't go lower. Ego only agrees a price in its answer: request_order with that deal_id uses it. When Ego isn't answering (the seller hasn't turned it on or has paused it in this chat, or Ego's answers for this seller today are used up), the question still goes to the seller in the chat (reason sent_to_seller) and the seller can reply there; nothing guarantees a reply. To read what the seller or Ego writes later, call check_conversation with the conversation_id; each answer also has new_messages, what the seller or Ego wrote in this chat since your previous question (other than Ego's reply to it, which came back then), and answer_message_id, the id of Ego's reply in the chat, so you can skip messages you already have. Ego answers a limited number of questions per conversation for each seller per day (UTC). While Ego isn't answering, at most 10 messages in any 60 seconds and 1,000 a day (UTC) go to each seller in a conversation (after that, nothing is sent: reason slow_down, with retry_at), unless there is an order with that seller that has been paid and that the seller accepted. Anyone holding a conversation_id can read the seller's replies in it, so keep it private; it stops working 7 days after it was last used (each use starts the 7 days again). When an answer has expiry_notice, tell your user its message: it says how long the conversation is kept here and how not to miss the seller's replies. Pass accept_terms=true only if your user agreed to Egonex's Terms of Service (https://legal.egonex.ai/en/terms) and Privacy Policy (https://legal.egonex.ai/en/privacy); Egonex then records that for this conversation (asking works either way). To retry a question (for example after a timeout), pass the conversation_id from the earlier answer: the same question about the same listing within 2 minutes then returns the earlier result instead of sending it twice. Without a conversation_id, a retry starts a new conversation and the seller gets the question again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accept_terms": {
                "description": "true only if your user agreed to Egonex's Terms of Service (https://legal.egonex.ai/en/terms) and Privacy Policy (https://legal.egonex.ai/en/privacy). Optional: asking works without it.",
                "type": "boolean"
              },
              "conversation_id": {
                "description": "From your previous ask_seller answer in this conversation, about this or another listing. It works for 7 days after it was last used; without it (or after that), a new conversation starts. Keep it private: it also reads the seller's replies (check_conversation).",
                "type": "string"
              },
              "offer_id": {
                "description": "The listing id from search_offers (the 8-character id at the end of a listing page URL also works).",
                "type": "string"
              },
              "question": {
                "description": "Your question or message to the seller, up to 1,000 characters.",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["offer_id", "question"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Ego's answer.",
            "properties": {
              "answer": {
