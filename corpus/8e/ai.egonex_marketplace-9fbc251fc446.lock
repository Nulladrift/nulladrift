        {
          "name": "submit_return_shipment",
          "title": "Tell Egonex the return was shipped",
          "description": "Tell Egonex your user shipped the item back, for a refund where the seller asked for it back (check_request shows status return_requested and refund.stage awaiting_return, and refund.return says where to send it, the prepaid label when the seller provides one, who pays the shipping and the ship_by date). Pass the request_id, the return parcel's tracking number and its carrier when known. It is checked the same way as on Egonex: 6 to 40 letters or digits (spaces and dashes are ignored), not the tracking number the seller used to send the order, and a carrier from the list (other with carrier_name, or none). Egonex then tracks the parcel: the money comes back when the seller confirms receipt, or automatically at refund.return.confirm_by (3 days after it's delivered); if the seller says the returned item has a problem, Egonex members or Egonex decide; a parcel not delivered by refund.return.delivery_deadline (14 days after shipping) goes to Egonex. If nothing is shipped by ship_by, the request closes with no refund and the order completes. Until the parcel is delivered, calling it again with the same number returns the same result, and a new number replaces the old one (the shipped time and the delivery deadline stay). Returns the refund as request_refund does, with refund.return. Needs your user's Egonex account connected to you with permission to act for them (egonex.write), and that account must be the order's buyer: without such a connection (none, or a read-only one), nothing is done and the result is an error ending in (connection_required); when the connected account isn't the order's buyer, nothing is done (not_found). Without a connection, this is done on Egonex, in your user's chat with the seller. At most 5 calls a minute per connected account (slow_down). Nothing is changed when the refund isn't waiting for a return (return_not_open). Errors end with their code in parentheses. Only call this after your user says they shipped the item back and gave you the tracking number.",
