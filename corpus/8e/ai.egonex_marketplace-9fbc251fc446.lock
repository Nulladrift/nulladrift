        {
          "name": "request_order",
          "title": "Order a listing for your user",
          "description": "Start an order for one listing on your user's behalf. Returns a confirm_url: your user opens it, checks the listing and price, enters an email address and pays on Egonex (payments are processed by Stripe). Nothing is ordered or charged until they confirm, and no Egonex account is needed. Use note for what the seller needs to know, such as dates, quantity, size, or where a service is done in person. Physical items always ship: your user enters the shipping address when they pay on Egonex. Use check_request with the returned id to see whether your user confirmed. A sold-out listing, or one whose seller isn't taking new orders right now, can't be ordered (error listing_unavailable); ask_seller can still ask whether it will be back. A listing with options (size, color...) lists its variants: ask your user which one and pass its variant_id (variant_required without one). Errors end with their code in parentheses (for example (listing_unavailable), (deal_expired), (invalid_input)). Pass quote_id from quote_order to order at that quote (its deal_id comes with it); payment then has quote_id and quoted_total for pay_order.",
