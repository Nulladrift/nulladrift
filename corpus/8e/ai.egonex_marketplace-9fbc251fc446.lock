                "required": ["city", "country", "line1", "name"],
                "type": "object"
              },
              "shipping_address_confirmed": {
                "description": "true only if you read shipping_address back to your user and they said it's right. Required with shipping_address on the call that charges.",
                "type": "boolean"
              }
            },
            "required": ["accept_terms", "buyer_email", "request_id", "shared_payment_token"],
