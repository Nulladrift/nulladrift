        {
          "name": "withdraw_order",
          "title": "Withdraw an order the seller hasn't accepted",
          "description": "Withdraw, as your user, an order that was sent to the seller and that the seller hasn't accepted yet (check_request shows waiting_for_seller). Nothing was charged for it and nothing is: the order closes (closed_unpaid, close_reason buyer_withdrew) and the seller sees it was withdrawn. It can't be undone; to buy it again, make a new request. Returns the request as check_request does. Needs your user's Egonex account connected to you with permission to act for them (egonex.write), and that account must be the order's buyer: without such a connection (none, or a read-only one), nothing is done and the result is an error ending in (connection_required); when the connected account isn't the order's buyer, nothing is done (not_found). Without a connection, this is done on Egonex, in your user's chat with the seller. At most 5 calls a minute per connected account (slow_down). Nothing is changed once the seller has accepted (seller_accepted: nothing has been charged, and the order closes on its own if nobody pays by order.pay_by), when the order was already paid (already_paid), or for any other order that isn't waiting for the seller (not_withdrawable), and not while the order's open payment page can't be closed (order_busy: try again in a moment). Calling it again for an order your user already withdrew returns the same result. Errors end with their code in parentheses. Only call this when your user asks to withdraw the order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request_id": {
                "description": "The id returned by request_order (check_request shows the order it led to).",
                "type": "string"
              }
            },
            "required": ["request_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "A request made with message_seller or request_order, and the order it led to.",
