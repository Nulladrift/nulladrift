              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "What your user wants, in a few words, e.g. \"spanish lessons for kids\", \"used fujifilm camera\", \"logo design\", \"road bike tune-up\". Matched as whole words and their word forms (lesson / lessons, colorized / colorization) against listing titles and descriptions; a word naming a category (pets, electronics, fashion, clothing, jewelry, makeup, furniture, toys, baby, camping, hobbies, crafts, books, food, tickets, rentals, templates, video, or the same in Chinese, Japanese or Korean) also matches listings in that category. Store names, intros and listing cities are not matched (put places in city). Rarer words count more, and listings that match only common words are left out. Online, remote and in person never bring in a listing by themselves: among equally good matches, listings whose title says it come first, then those delivered that way (either-way listings count as both). To keep only one kind use delivery, which is exact: delivery=remote leaves out either-way listings. Only the first 12 search words are used, so put the most important first. Write abbreviations in capitals (QA, PR, IT).",
