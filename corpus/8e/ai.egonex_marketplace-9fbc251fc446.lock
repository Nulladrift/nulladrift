        {
          "name": "preview_refund",
          "title": "Preview a refund before asking for it",
          "description": "See what a refund request for an order would do before your user decides. Pass the request_id and the amount your user wants back in USD (up to order.amount, which includes shipping; sales tax is refunded in proportion). It only reads: nothing is requested or changed. Returns the path (refund_now: the seller hasn't marked the order delivered, so it is refunded right away and the order is canceled; seller_decides: the seller has 48 hours to agree or disagree, no answer counts as agreeing, and if they disagree, Egonex members vote or Egonex decides), and for each possible outcome what your user gets back and every deduction: your user's share of the payment processing fee (processing_fee_paid_by says who pays it: it depends on the reason, see rules), the review fee when members vote to refund (2% of the order, at least $0.50), shipping that isn't refunded when the seller disagrees, and the sales tax refunded. After the seller marked the order delivered, also pass reason_category as your user says: not_received or damaged_or_not_as_described for any order, changed_mind only for a physical item (services and digital products don't have it; listing_kind says which). It decides who pays the payment processing fee and whether the item goes back, caps a changed_mind refund at the item price (max_refund: the original shipping isn't refunded), and request_refund uses it. For a shipped physical item, return says what the seller can choose (ask for the item back or refund without it), what happens if they don't answer, who pays the return shipping and the deadlines: ship within 7 days, the money comes back when the seller confirms receipt or 3 days after delivery, and nothing is refunded when nothing is shipped in time. Also the deadline for the seller, Egonex's refund rules, Egonex buyer protection, and a preview_id that request_refund can use for 15 minutes. Your user sees these amounts and deductions before deciding. Needs your user's Egonex account connected to you with permission to act for them (egonex.write), and that account must be the order's buyer: without such a connection (none, or a read-only one), nothing is done and the result is an error ending in (connection_required); when the connected account isn't the order's buyer, nothing is done (not_found). Without a connection, this is done on Egonex, in your user's chat with the seller. At most 5 calls a minute per connected account (slow_down). (It needs egonex.write, like request_refund, because only request_refund can use its preview_id.) A refund can be requested once per order, while it is paid and not completed: otherwise the error says why (refund_not_allowed, refund_already_requested; payment_processing right after the payment, for a minute). At most 30 previews an hour per connected account (slow_down). Errors end with their code in parentheses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "How much your user wants back, in USD with at most 2 decimals: up to order.amount (items and shipping). Sales tax comes back in proportion on top.",
                "minimum": 0.01,
                "type": "number"
              },
              "reason_category": {
                "description": "Why your user wants the refund, as they say: required after the seller marked the order delivered (check_request status delivered), ignored before. changed_mind is only for a physical item. It decides who pays the payment processing fee and whether the item goes back; request_refund uses the same one.",
                "enum": ["not_received", "damaged_or_not_as_described", "changed_mind"],
                "type": "string"
              },
              "request_id": {
                "description": "The id returned by request_order (check_request shows the order it led to).",
                "type": "string"
              }
            },
            "required": ["amount", "request_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amount": {
                "description": "The amount asked for, USD (items and shipping, before sales tax).",
                "type": "number"
              },
              "buyer_protection": {
                "description": "Egonex buyer protection.",
                "type": "string"
              },
              "currency": {
                "description": "usd.",
                "type": "string"
              },
              "expires_at": {
                "description": "request_refund can use preview_id until then (RFC 3339).",
                "type": "string"
              },
              "listing_kind": {
                "description": "What was bought: physical, service or digital (after delivery, changed_mind is only for physical).",
                "enum": ["physical", "service", "digital"],
                "type": "string"
              },
              "max_refund": {
                "description": "With this reason the refund is at most this, USD: the item price, without the original shipping (physical changed_mind).",
                "type": "number"
              },
              "next": {
                "description": "What happens next.",
                "type": "string"
              },
              "order_amount": {
                "description": "The most that can be asked for, USD: the order amount (items and shipping).",
                "type": "number"
              },
              "order_id": {
                "description": "The order.",
                "type": "string"
              },
              "outcomes": {
                "description": "Each possible outcome: what your user gets back and every deduction.",
                "items": {
                  "properties": {
                    "buyer_gets": {
                      "description": "What your user gets back, USD (sales tax included; 0 when not refunded).",
                      "type": "number"
                    },
                    "order": {
                      "description": "What happens to the order: canceled (refunded, also when partly) or completed (the seller is paid).",
                      "type": "string"
                    },
                    "outcome": {
                      "description": "Which outcome.",
                      "enum": ["refund_now", "seller_agrees", "refund_after_return", "return_not_shipped", "jury_refunds", "jury_declines", "egonex_refunds", "egonex_declines"],
                      "type": "string"
                    },
                    "processing_fee": {
                      "description": "Deducted from what your user gets: their share of the payment processing fee, USD.",
                      "type": "number"
                    },
                    "processing_fee_paid_by": {
                      "description": "Who pays the payment processing fee: buyer (deducted, see processing_fee), seller or egonex.",
                      "enum": ["buyer", "seller", "egonex"],
                      "type": "string"
                    },
                    "refunded": {
                      "description": "true = money comes back; false = no refund.",
                      "type": "boolean"
                    },
                    "review_fee": {
                      "description": "Deducted: the review fee when Egonex members vote to refund, USD.",
                      "type": "number"
                    },
                    "sales_tax_refunded": {
                      "description": "Sales tax refunded with it, USD (included in buyer_gets).",
                      "type": "number"
                    },
                    "shipping_not_refunded": {
                      "description": "Deducted: shipping that isn't refunded, USD.",
                      "type": "number"
                    },
                    "when": {
                      "description": "When this outcome happens.",
                      "type": "string"
                    }
                  },
                  "required": ["buyer_gets", "order", "outcome", "refunded", "when"],
                  "type": "object"
                },
                "type": "array"
              },
              "path": {
                "description": "refund_now (refunded right away, the order is canceled) or seller_decides (the seller answers first).",
                "enum": ["refund_now", "seller_decides"],
                "type": "string"
              },
              "preview_id": {
                "description": "Pass it to request_refund with the same request_id and amount before expires_at.",
                "type": "string"
              },
              "processing_fee": {
                "description": "The payment processing fee of this payment, USD; who pays it, and how much, is in each outcome.",
                "type": "number"
              },
              "reason_category": {
                "description": "After the seller marked the order delivered: the reason used, which decides who pays the payment processing fee.",
                "enum": ["not_received", "damaged_or_not_as_described", "changed_mind"],
                "type": "string"
              },
              "request_id": {
                "description": "The request.",
                "type": "string"
              },
              "return": {
                "description": "After delivery, for a shipped physical item: whether and how it goes back.",
                "properties": {
                  "egonex_reviews_after_days": {
                    "description": "A return parcel not delivered within these days goes to Egonex.",
                    "type": "integer"
                  },
                  "if_seller_does_not_answer": {
                    "description": "What happens when the seller doesn't answer in time.",
                    "enum": ["refund", "refund_only", "return", "egonex_review"],
                    "type": "string"
                  },
                  "return_shipping_paid_by": {
                    "description": "Who pays the return shipping: seller (the seller provides a prepaid label) or buyer (unless the seller sends a prepaid label anyway).",
                    "enum": ["buyer", "seller"],
                    "type": "string"
                  },
                  "seller_can_choose": {
                    "description": "What the seller can choose when they agree: return (ask for the item back) or refund_only (your user keeps it).",
                    "items": {
                      "description": "",
                      "enum": ["return", "refund_only"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "seller_confirms_within_days": {
                    "description": "Days the seller has after delivery to confirm receipt, or it's refunded automatically.",
                    "type": "integer"
                  },
                  "ship_within_days": {
                    "description": "Days your user has to ship it and pass the tracking number, or no refund.",
                    "type": "integer"
                  }
                },
                "required": ["egonex_reviews_after_days", "if_seller_does_not_answer", "return_shipping_paid_by", "seller_can_choose", "seller_confirms_within_days", "ship_within_days"],
                "type": "object"
              },
              "rules": {
                "description": "Egonex's refund rules.",
                "type": "string"
              },
              "sales_tax": {
                "description": "Sales tax paid on the order, USD (refunded in proportion).",
                "type": "number"
              },
              "seller_missed_delivery_deadline": {
                "description": "The seller is past the delivery deadline and hasn't marked the order delivered: asking now refunds the whole order (whatever amount), and the seller pays the payment processing fee.",
                "type": "boolean"
              },
              "seller_respond_by": {
                "description": "seller_decides: if asked now, the seller answers by then (RFC 3339).",
                "type": "string"
              },
              "shipping": {
                "description": "Shipping in the order amount, USD; absent when the order has none.",
                "type": "number"
              }
            },
            "required": ["amount", "buyer_protection", "currency", "expires_at", "listing_kind", "next", "order_amount", "order_id", "outcomes", "path", "preview_id", "processing_fee", "request_id", "rules", "sales_tax"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e2f00db48b0f67e07eed5ee056809af767b40a98b64222af8a92f9d18f1d799"
        },
        {
          "name": "quote_order",
          "title": "Get the full price before ordering",
          "description": "Get the full price before your user orders: the items (price × quantity, at the agreed price with deal_id), shipping, sales tax and the total in USD, when the charge happens, and Egonex buyer protection (returns and refunds follow it). It only reads: nothing is ordered, reserved or charged. Pass offer_id for a new order, or request_id for an order already sent to the seller (when the seller accepts first: quote it once check_request shows ready_to_pay, right before the pay_order that charges). For an item that ships pass shipping_address; for other items, where Egonex adds sales tax, pass buyer_location. Egonex uses them only to calculate shipping and sales tax and doesn't store them. Returns a quote_id that lasts 15 minutes: pass it to request_order and pay_order, and get a payment token for exactly total. pay_order then charges exactly that total, or nothing when something changed or the quote expired (quote_changed / quote_expired): call quote_order again. Quotes that calculate sales tax are limited to 15 a minute for the same listing from the same client (slow_down). Errors end with their code in parentheses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_location": {
                "additionalProperties": false,
