              "deal": {
                "description": "The price Ego agreed with you (only when it agreed one). Pass deal.id as deal_id to request_order within 24 hours; that request then keeps this price for pay_order and for the order your user pays on Egonex.",
                "properties": {
                  "amount": {
                    "description": "unit_price × quantity, before shipping and tax.",
                    "type": "number"
                  },
                  "currency": {
                    "description": "usd.",
                    "type": "string"
                  },
                  "delivery_days": {
                    "description": "Agreed delivery time in days after payment (pay_order uses it when you leave delivery_days out).",
                    "type": "integer"
                  },
                  "expires_at": {
                    "description": "Use it in request_order before this time (RFC 3339).",
                    "type": "string"
                  },
                  "id": {
                    "description": "Pass it as request_order's deal_id (works for one request).",
                    "type": "string"
                  },
                  "list_price": {
                    "description": "The listed price per unit when it was agreed, USD.",
                    "type": "number"
                  },
                  "quantity": {
                    "description": "How many units the price was agreed for: pay_order takes at most this many (rounded down, at least 1).",
                    "type": "number"
                  },
                  "unit": {
                    "description": "What one unit is (as in the listing's price).",
                    "type": "string"
