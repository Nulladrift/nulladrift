{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpscores/food-facts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://food-facts.bowling-anthony.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.mcpscores/food-facts",
        "title": "MCPFax Food Facts",
        "version": "1.0.2",
        "websiteUrl": "https://mcpscores.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Someone asked whether they can eat this and all you have is the barcode. Tool calls are x402-paid in USDC on Base: send the base64 X-PAYMENT header on this POST /mcp request (or params._meta['x402/payment']). food_by_barcode costs $0.005. initialize, ping and tools/list are free, as are request_data and demand_report. Data is Open Food Facts, crowd-sourced and openly licensed: coverage is uneven and records can be sparse, so check dataCompleteness and treat null as unknown rather than zero. An unknown barcode returns not_found and is NOT charged.",
      "tools": [
        {
          "name": "demand_report",
          "title": "What agents are asking for most (free)",
          "description": "FREE, no payment. The aggregate of what agents have told us they are looking for, most-requested first, with the categories nothing available yet serves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Window in days, default 30, max 90.",
                "examples": ["30"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:461261ad42bf84d61377fdd16143b94cfa57291dcfeff96122da0471054405cb"
        },
        {
          "name": "food_by_barcode",
          "title": "Packaged food facts by barcode",
          "description": "Look up a packaged food by its barcode and get the fields that answer \"can this person eat this?\" — ingredients, allergens, traces, additives, Nutri-Score, NOVA processing group and per-100g nutrition. Data is from Open Food Facts, which is crowd-sourced and openly licensed: coverage is uneven by country and a product can be listed with most nutrition empty, so every response carries a completeness flag and missing values are null rather than estimated. A barcode not in the database returns not_found and is NOT charged. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "barcode": {
                "description": "6-14 digit product barcode, e.g. '737628064502'.",
                "examples": ["737628064502"],
                "type": "string"
              }
            },
            "required": ["barcode"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4b145018974dc6d1b67a803ffe43cdeae1b74cb25f2f30f51d1b620f259e89ff"
        },
        {
          "name": "request_data",
          "title": "Tell us what data you are looking for (free)",
          "description": "FREE, no payment. Describe in your own words the data you are trying to buy — anything, not just food — and get back whether we operate a service that supplies it, with the MCP endpoint if so. Every request is catalogued so repeatedly-requested data gets built. Nothing identifying is stored, only the words of the request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "need": {
                "description": "What you are looking for.",
                "examples": ["live electricity spot prices by ZIP"],
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c4b3ccd887fd12481e8d6f52034961c9d00652358352f40d2faecbaeff350cd"
        }
      ],
      "digest": "sha256:05b37afc52ba9d87881d0780810559e981b05ca3d8d390802e84923cac9cb63a"
    }
  }
