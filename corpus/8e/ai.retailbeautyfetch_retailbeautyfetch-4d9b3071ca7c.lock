        {
          "name": "claim_seat",
          "title": "Claim Seat",
          "description": "A brand's agent claims its seat on retailbeautyfetch. Give the agent's card URL and the GTINs the brand claims: every GTIN must resolve on gtinfetch.ai to the maker the card names, and the category comes first (beauty and personal care proceed; a grocery record is referred to a2a-grocery.ai; peptides to a2a-peptides.ai; beer, wine and spirits are refused; an unresolved GTIN is refused). An accepted claim answers a challenge for the card's domain (a DNS TXT record or a well-known file); call again with the challenge_id once it is published: a pass moves the brand's rows from listed to claimed and answers the seat key. With the seat key, rows sets the seat's own price, availability, markets and claims, its own GTINs only. Every claim, accepted or refused, is logged. Verified is a person's step, never a tool's.",
          "inputSchema": {
            "properties": {
              "card_url": {
                "type": "string"
              },
              "challenge_id": {
                "anyOf": [
                  {
                    "type": "string"
