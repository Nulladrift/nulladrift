      "instructions": "Product record from gtinfetch.ai (signed); hub layer: seat, market, claim, price, availability. Agent-to-Agent (A2A) + Model Context Protocol (MCP) hub for cosmetics. Business to business: brands, manufacturers, retailers, distributors and their AI agents (wefetch). Call resolve_jurisdiction, then resolve_actor, then gate_transaction before any availability, price, documents, order or handoff tool; those tools refuse without an allow decision. Eighteen markets on thirteen rule sets; every record field carries its source page; every response carries notice; every record carries claim_status (listed · claimed · verified). A brand's agent claims its seat with claim_seat: its GTINs resolve on gtinfetch.ai to the maker its card names, the brand proves its domain, and its rows move from listed to claimed. Artificial intelligence makes mistakes. A2A Cosmetics is an information source, not a recommendation. Rules differ by jurisdiction — refer to the regulator in your jurisdiction for the information that applies to you.",
      "tools": [
        {
          "name": "a2a_handoff",
          "title": "A2A Handoff",
          "description": "Hand the buyer to the right agent over Agent-to-Agent (A2A): with an allow decision the order intent goes to the counterparty's agent (envelope + card URL); with a deny, the market agent of the ship-to (the regulator's home page beside it) — a referral, never a sale to a consumer.",
