{
  "lockfileVersion": 2,
  "subjects": {
    "com.iberimo/rentals": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.iberimo.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "iberimo",
        "version": "1.0.0",
        "description": "Holiday rentals from iberimo: search, prices for given dates and booking links.",
        "websiteUrl": "https://www.iberimo.com"
      },
      "capabilities": {
        "completions": {},
        "logging": {},
        "tools": {}
      },
      "instructions": "Search, describe and price the holiday rentals of this website. Start with find_destinations, then search_rentals with dates and party, get_rental for details and get_quote for the exact price of a stay. Bookings and payments are made by the traveller on the website through the booking_url; nothing can be reserved from here.",
      "tools": [
        {
          "name": "compare_rentals",
          "title": "Compare rentals",
          "description": "Sets two to four holiday rentals side by side: capacity, rooms, surface, amenities, rating, location and indicative price per night.",
          "inputSchema": {
            "properties": {
              "language": {
                "default": "en",
                "enum": ["fr", "en", "es", "de"],
                "type": "string"
              },
              "rentalIds": {
                "description": "Ids returned by search_rentals.",
                "items": {
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["rentalIds"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b481de0f507bb1e9083c28426d81baf8fac81bd5d78201e65fa50cf4ed592ae6"
        },
        {
          "name": "find_cheapest_stay",
          "title": "Find the cheapest dates",
          "description": "Prices the bookable stays of a given length in one rental between two dates and returns them cheapest first, with the link to book each. At most four stays are priced; when more exist, they are sampled evenly across the period.",
          "inputSchema": {
            "properties": {
              "adults": {
                "default": 2,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "children": {
                "default": 0,
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              },
              "from": {
                "description": "First arrival date to consider, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "language": {
                "default": "en",
                "enum": ["fr", "en", "es", "de"],
                "type": "string"
              },
              "nights": {
                "default": 7,
                "maximum": 28,
                "minimum": 1,
                "type": "integer"
              },
              "rentalId": {
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Last arrival date to consider, YYYY-MM-DD; at most 92 days after from.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["from", "rentalId", "to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88a7dc3a89a9fd48aa40343a24dd19910065e957ad2b4359319f5325250ec76a"
        },
        {
          "name": "find_destinations",
          "title": "Find destinations",
          "description": "Finds the places Poplidays rents holiday homes in (towns, resorts, regions) from a name. Returns their id, needed by search_rentals.",
          "inputSchema": {
            "properties": {
              "language": {
                "default": "en",
                "description": "Language of the answer and of the links.",
                "enum": ["fr", "en", "es", "de"],
                "type": "string"
              },
              "query": {
                "description": "Place name, e.g. \"Val Thorens\" or \"Biarritz\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:70e2d462f76e3fb8ba3926a689c0b373e32d43f1bd10e531a8f816689cf26aed"
        },
        {
          "name": "get_availability",
          "title": "Show when a rental is free",
          "description": "Lists the stays that can be booked in one holiday rental (arrival, departure, nights) between two dates, without prices. Use get_quote or find_cheapest_stay to price them.",
          "inputSchema": {
            "properties": {
              "from": {
                "default": null,
                "description": "First arrival date to consider, YYYY-MM-DD; today when omitted.",
                "format": "date",
                "type": ["null", "string"]
              },
              "nights": {
                "default": null,
                "description": "Only stays of exactly this many nights.",
                "maximum": 28,
                "minimum": 1,
                "type": ["null", "integer"]
              },
              "rentalId": {
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "default": null,
                "description": "Last arrival date to consider, YYYY-MM-DD; at most 92 days after from.",
                "format": "date",
                "type": ["null", "string"]
              }
            },
            "required": ["rentalId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e017673762ed35f22204acddee8adfde2721c8bae2ee388f53a4ae72636d4949"
        },
        {
          "name": "get_destination_guide",
          "title": "Destination guide",
          "description": "Gives the Poplidays guide to a destination when one is written: overview and frequently asked questions (when to go, getting there, what to do).",
          "inputSchema": {
            "properties": {
              "destinationId": {
                "description": "Id returned by find_destinations.",
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "default": "en",
                "enum": ["fr", "en", "es", "de"],
                "type": "string"
              }
            },
            "required": ["destinationId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6680c3c69745132ace5badae5c3699986f7b1dabd3669a99071e9c93a7588fbe"
        },
        {
          "name": "get_quote",
          "title": "Quote a stay",
          "description": "Prices a stay in one holiday rental for given dates and party: availability, total, discount, mandatory fees, cancellation terms, and the link to book it on the website.",
          "inputSchema": {
            "properties": {
              "adults": {
                "default": 2,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "arrival": {
                "description": "Arrival date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "children": {
                "default": 0,
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              },
              "departure": {
                "description": "Departure date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "language": {
                "default": "en",
                "enum": ["fr", "en", "es", "de"],
                "type": "string"
              },
              "rentalId": {
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["arrival", "departure", "rentalId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7910f7c1eded0ae4d88a3088053e12fd5f1a38c8423d8d1cf9078e86f3576b1a"
        },
        {
          "name": "get_rental",
          "title": "Describe a holiday rental",
          "description": "Describes one holiday rental: capacity, rooms, amenities, guest rating and latest reviews, location, indicative price per night and cancellation terms.",
          "inputSchema": {
            "properties": {
              "language": {
                "default": "en",
                "enum": ["fr", "en", "es", "de"],
                "type": "string"
              },
              "rentalId": {
                "description": "Id returned by search_rentals.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["rentalId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4320f0da8222d4c084c8b001245307de15f92457c9f74ed7009d55fef162da57"
        },
        {
          "name": "last_minute_deals",
          "title": "Last-minute deals",
          "description": "Lists discounted rentals for a one-week stay starting next Saturday, optionally in one destination or by holiday theme, with the price of the week and a link to book it.",
          "inputSchema": {
            "properties": {
              "adults": {
                "default": 2,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "children": {
                "default": 0,
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              },
              "destinationId": {
                "default": null,
                "description": "Id returned by find_destinations; anywhere when omitted.",
                "minimum": 1,
                "type": ["null", "integer"]
              },
              "language": {
                "default": "en",
                "enum": ["fr", "en", "es", "de"],
                "type": "string"
              },
              "maxResults": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "theme": {
                "default": null,
                "enum": ["sea", "mountain", "countryside", "city"],
                "type": ["null", "string"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f99687e2f0081ae51afd486ecc0b5f7303a1213f6ccc90cd022f59f5cc026835"
        },
        {
          "name": "search_rentals",
          "title": "Search holiday rentals",
          "description": "Lists available holiday rentals in a destination for given dates and party, with the total price of the stay (mandatory fees included) and a link to book it.",
          "inputSchema": {
            "properties": {
              "adults": {
                "default": 2,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "arrival": {
                "description": "Arrival date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "children": {
                "default": 0,
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              },
              "departure": {
                "description": "Departure date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "destinationId": {
                "description": "Id returned by find_destinations.",
                "minimum": 1,
                "type": "integer"
              },
              "features": {
                "default": [],
                "description": "Features every rental must have.",
                "items": {
                  "enum": ["private-swimming-pool", "shared-swimming-pool", "jacuzzi", "sauna", "hammam", "pets-allowed", "disabled-access", "baby-bed", "foot-of-the-slopes", "seafront", "sea-view", "mountain-view", "lake-view", "garden", "terrace", "parking", "internet-access", "washing-machine", "dish-washer", "bed-linen-included", "towels-included", "cleaning-included"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array",
                "uniqueItems": true
              },
              "language": {
                "default": "en",
                "enum": ["fr", "en", "es", "de"],
                "type": "string"
              },
              "maxPrice": {
                "default": null,
                "description": "Highest total price of the stay, in euros.",
                "minimum": 1,
                "type": ["null", "integer"]
              },
              "maxResults": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "rentalType": {
                "default": null,
                "enum": ["house", "apartment", "chalet", "villa", "studio", "gite", "bed-and-breakfast", "mobil-home", "bungalow", "camping", "docked-boat"],
                "type": ["null", "string"]
              }
            },
            "required": ["arrival", "departure", "destinationId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0a7466282b9caa5a91a3f8f76410be48119954197349e41f5ccf4a499a6ac0e2"
        },
        {
          "name": "start_booking",
          "title": "Start a booking",
          "description": "Returns the website link that opens the rental with the dates and party filled in, where the traveller checks the price and books. Nothing is reserved until they do.",
          "inputSchema": {
            "properties": {
              "adults": {
                "default": 2,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "arrival": {
                "description": "Arrival date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "children": {
                "default": 0,
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              },
              "departure": {
                "description": "Departure date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "language": {
                "default": "en",
                "enum": ["fr", "en", "es", "de"],
                "type": "string"
              },
              "rentalId": {
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["arrival", "departure", "rentalId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:73648a038f7137d199c77f9b09a128720b02496951bcb9e688e6614f4ccfc472"
        }
      ],
      "digest": "sha256:ba528e23957a5573ea0b1859611b9232a22f928a8eb0223fbe5ac234a4e56ef2"
    }
  }
