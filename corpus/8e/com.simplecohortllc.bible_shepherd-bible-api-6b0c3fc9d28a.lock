            "readOnly": true
          },
          "digest": "sha256:6a3f9bd4ed0735434174639ea6f59ef4664d510f91afb8c1ccea5fb19357ac68"
        },
        {
          "name": "bible_verse",
          "title": "Fetch a verse",
          "description": "Return a specific verse, with red letter data if available.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "book": {
                "minLength": 1,
                "type": "string"
              },
              "chapter": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "translation": {
                "default": "KJV",
                "minLength": 1,
                "type": "string"
              },
              "verse": {
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["book", "chapter", "verse"],
            "type": "object"
          },
          "annotations": {
