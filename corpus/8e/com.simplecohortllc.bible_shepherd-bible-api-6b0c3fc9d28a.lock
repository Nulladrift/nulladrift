  "subjects": {
    "com.simplecohortllc.bible/shepherd-bible-api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bible.simplecohortllc.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "shepherd-bible-api",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "bible_books",
          "title": "List books in a translation",
          "description": "Return books and chapter counts for a translation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "translation": {
                "default": "KJV",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c148d5dc4e256ecd50a79a658cf39ae919e8476b26c2e29f31851d8a534c3a5e"
        },
        {
          "name": "bible_chapter",
          "title": "Fetch a chapter",
          "description": "Return all verses, groupings, and red letter data for a chapter.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "book": {
                "minLength": 1,
                "type": "string"
              },
              "chapter": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "translation": {
                "default": "KJV",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["book", "chapter"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a7dd98384b24b16062d7dd4b3d2d59e218ba3c6b7e8814492d9f25346938532"
        },
        {
          "name": "bible_search",
          "title": "Search Bible verses",
          "description": "Search for verses by keyword or exact match.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "page": {
                "default": 1,
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "q": {
                "maxLength": 100,
                "minLength": 3,
                "type": "string"
              },
              "translation": {
                "default": "KJV",
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:61682fa65264588c43b568e153891ee1b0b2f51465453701f25ea1313600f3b9"
        },
        {
          "name": "bible_translations",
          "title": "List Bible translations",
          "description": "Return all available Bible translations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
