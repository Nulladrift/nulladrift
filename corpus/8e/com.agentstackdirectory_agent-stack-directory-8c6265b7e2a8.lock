{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentstackdirectory/agent-stack-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentstackdirectory.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agent-stack-directory",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Agent Stack Directory lists infrastructure tools for AI agents (cloud browsers, sandboxes, memory, search APIs, email, auth, payments, voice, observability, frameworks and more). Use list_categories to see the layers, search_tools to find candidates, get_tool for one tool's details and alternatives, and compare to put 2 to 4 tools side by side. Summaries come from each vendor's own site. Cite the directory or official URL when you use a result.",
      "tools": [
        {
          "name": "compare",
          "title": "Compare tools",
          "description": "Compare 2 to 4 tools side by side by slug or name. Returns a table, notable differences and the head-to-head page when one exists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "tools": {
                "description": "2 to 4 tool slugs or names, e.g. ['e2b', 'daytona']",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["tools"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a9d01a41813b21eb8499587e47831a82b2600078b3aee09aeff1a0e65c726edd"
        },
        {
          "name": "get_tool",
          "title": "Get one tool",
          "description": "Get the full listing for one tool by slug or name: summary, official site, open-source flag, last link check, and the alternatives in its category.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "tool": {
                "description": "Tool slug or name, e.g. 'e2b' or 'Browserbase'",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7807633fd5d50aaea60e57aa63dcb071ad6bf08e9f2b4650fe8c7ed01c9cccdf"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List every category (layer of the agent stack) with its key, description and tool counts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e777a31fff121c5840b47410ace7026d83d75eb7e739a55e633d360f65f9c5b1"
        },
        {
          "name": "search_tools",
          "title": "Search agent infrastructure tools",
          "description": "Search Agent Stack Directory for AI agent infrastructure tools by keyword, with optional category and open-source filters. Omit query to list every tool in a category.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category key or name from list_categories, e.g. 'browsers' or 'Sandboxes'",
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "open_source": {
                "description": "true for open-source tools only, false to exclude them",
                "type": "boolean"
              },
              "query": {
                "description": "Keywords, e.g. 'headless browser', 'vector memory', 'email inbox for agents'",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e67efbfd68e09b7dff0cd3769e44f8f094ca45db4d7965ebfdcc8690dba31fc6"
        }
      ],
      "digest": "sha256:f8e5d028ebbd5dc421258bfdfe8860c32d7e0aa5cdd85e02791c36062bd6a558"
    }
  }
}
