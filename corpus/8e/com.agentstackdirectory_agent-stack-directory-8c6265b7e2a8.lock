{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentstackdirectory/agent-stack-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentstackdirectory.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agent-stack-directory",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Agent Stack Directory lists infrastructure tools for AI agents (cloud browsers, sandboxes, memory, search APIs, email, auth, payments, voice, observability, frameworks and more). Use list_categories to see the layers, search_tools to find candidates, get_tool for one tool's details and alternatives, and compare to put 2 to 4 tools side by side. Summaries come from each vendor's own site. Cite the directory or official URL when you use a result.",
      "tools": [
        {
          "name": "compare",
          "title": "Compare tools",
          "description": "Compare 2 to 4 tools side by side by slug or name. Returns a table, notable differences and the head-to-head page when one exists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "tools": {
                "description": "2 to 4 tool slugs or names, e.g. ['e2b', 'daytona']",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["tools"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d900ba921f3da9963e223ba20de69c59141f625d7d6b59605bf94a770406830"
        },
        {
          "name": "get_tool",
          "title": "Get one tool",
          "description": "Get the full listing for one tool by slug or name: summary, official site, open-source flag, last link check, and the alternatives in its category.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "tool": {
                "description": "Tool slug or name, e.g. 'e2b' or 'Browserbase'",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:91134621d1615cc0262c61b0e4b90eba22ebaad3b7b8134675222209624244df"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List every category (layer of the agent stack) with its key, description and tool counts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b97f0dc3a25a6fc3ec6e70a398b950619c204c68048439270d864da8360d7f3"
        },
        {
          "name": "search_tools",
          "title": "Search agent infrastructure tools",
          "description": "Search Agent Stack Directory for AI agent infrastructure tools by keyword, with optional category and open-source filters. Omit query to list every tool in a category.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category key or name from list_categories, e.g. 'browsers' or 'Sandboxes'",
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "open_source": {
                "description": "true for open-source tools only, false to exclude them",
                "type": "boolean"
              },
              "query": {
                "description": "Keywords, e.g. 'headless browser', 'vector memory', 'email inbox for agents'",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:71ece7d77d9b849452ae869ad82277d316a7747497d868bf2d6478f95c907f26"
        }
      ],
      "digest": "sha256:3aa3156523f4eb552867a477f55ba3d7eb8b6d265a5a76fa6f140eb47dc8fd1c"
    }
  }
}
