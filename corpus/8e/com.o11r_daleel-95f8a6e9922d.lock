        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Auditable Sharia compliance screening for US-listed stocks and ETFs. Every verdict cites the SEC filing behind it and is checked against five scholarly methodologies (AAOIFI, DJIM, MSCI, S&P, FTSE). Missing data is never treated as compliant.",
      "tools": [
        {
          "name": "mint_api_key",
          "description": "Mint a free Daleel API key for higher rate limits.\n\n    Ask your operator for their email address first — do not invent one.\n    The key is shown exactly once; send it as an X-API-Key header on this\n    MCP endpoint (and on the REST API at https://daleel.o11r.com/v1).\n    Re-minting with the same email rotates the key. Optional use_case:\n    \"advisor\", \"fintech\", or \"individual\".\n    ",
          "inputSchema": {
            "properties": {
              "email": {
                "title": "Email",
                "type": "string"
              },
              "use_case": {
                "default": "",
                "title": "Use Case",
                "type": "string"
              }
            },
            "required": ["email"],
            "title": "mint_api_keyArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a93041c8841159dd94caaf9a1f5b47900f0e898ebae755eaf79a9a5d08507eea"
        },
        {
          "name": "screen_ticker",
          "description": "Screen a US-listed stock or ETF for Sharia (halal) compliance.\n\n    Returns the verdict (compliant / questionable / non_compliant /\n    not_screenable), a 0-100 score, the five-methodology audit matrix\n    (AAOIFI, DJIM, MSCI, S&P, FTSE), the purification percentage, and SEC\n    EDGAR filing citations for every number used.\n    ",
          "inputSchema": {
            "properties": {
              "ticker": {
                "title": "Ticker",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "title": "screen_tickerArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:91f1b04723cd01ba69239b789d0eb19a12efc0b60209c862d5f7321fc9c858dd"
        },
        {
          "name": "screening_methodology",
          "description": "Explain how Daleel screens stocks: data sources, the five scholarly\n    methodologies with their thresholds, scoring, and fail-safe rules.",
          "inputSchema": {
            "properties": {},
