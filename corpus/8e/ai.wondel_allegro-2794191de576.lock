{
  "lockfileVersion": 2,
  "subjects": {
    "ai.wondel/allegro": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.wondel.ai/allegro/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Allegro",
        "title": "Allegro MCP",
        "version": "1.0.0",
        "description": "Live offers on Allegro.pl: search, browse a category, fetch one offer.",
        "websiteUrl": "https://mcps.wondel.ai/servers/allegro/",
        "icons": [
          {
            "src": "https://mcps.wondel.ai/favicon.svg",
            "mimeType": "image/svg+xml"
          },
          {
            "src": "https://mcps.wondel.ai/logo-96-inverse.png",
            "mimeType": "image/png",
            "sizes": ["96x96"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from Allegro.pl (https://allegro.pl) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "allegro_browse_category",
          "title": "Browse an Allegro category",
          "description": "Browse live Allegro.pl offers within a category (by Allegro category id or full category URL), with the same filters as allegro_search. Data is scraped live via a stealth browser, so a call may take ~30–120s.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Allegro category id or full https://allegro.pl/kategoria/... URL",
                "minLength": 1,
                "type": "string"
              },
              "condition": {
                "description": "Item condition filter",
                "enum": ["new", "used"],
                "type": "string"
              },
              "limit": {
                "description": "Max offers to return (default 24)",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "phrase": {
                "description": "Optional search text within the category",
                "type": "string"
              },
              "priceFrom": {
                "description": "Minimum price in PLN",
                "minimum": 0,
                "type": "number"
              },
              "priceTo": {
                "description": "Maximum price in PLN",
                "minimum": 0,
                "type": "number"
              },
              "sort": {
                "description": "Result ordering (default: relevance)",
                "enum": ["relevance", "price-asc", "price-desc", "newest", "popularity"],
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2bbabeb05a3e32aaea878da1f0e5c1fa9a8c5330dca4eea63b1f3e662ac424dc"
        },
        {
          "name": "allegro_get_offer",
          "title": "Get an Allegro offer",
          "description": "Fetch details of a single Allegro.pl offer by id or URL (title, price, seller, condition, description summary, parameters, images). Data is scraped live via a stealth browser, so a call may take ~30–120s.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "offerId": {
                "description": "Allegro offer id (numeric) or full https://allegro.pl/oferta/... URL",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["offerId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1de0d2c6d740f994a61fd6a65b33f862ac32e6a866263d7af6c8f2eaeb6217f3"
        },
        {
          "name": "allegro_search",
          "title": "Search Allegro offers",
          "description": "Search live Allegro.pl marketplace offers by phrase, with optional price range, condition and sort. Returns titles, prices, sellers and offer URLs. Data is scraped live via a stealth browser, so a call may take ~30–120s. Result shape: { source, fetchedAt, query, count, offers: [...], note } — the list key is `offers`, never `items` or `results`. Each offer: { title, price, currency, url, seller, condition, imageUrl }; `price` is the formatted string Allegro renders (e.g. \"3 499,00\"), not a number.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "condition": {
                "description": "Item condition filter",
                "enum": ["new", "used"],
                "type": "string"
              },
              "limit": {
                "description": "Max offers to return (default 24)",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "phrase": {
                "description": "Search text, e.g. 'iphone 15 128gb'",
                "minLength": 1,
                "type": "string"
              },
              "priceFrom": {
                "description": "Minimum price in PLN",
                "minimum": 0,
                "type": "number"
              },
              "priceTo": {
                "description": "Maximum price in PLN",
                "minimum": 0,
                "type": "number"
              },
              "sort": {
                "description": "Result ordering (default: relevance)",
                "enum": ["relevance", "price-asc", "price-desc", "newest", "popularity"],
                "type": "string"
              }
            },
            "required": ["phrase"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "count": {
                "type": "number"
              },
              "fetchedAt": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "offers": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "condition": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "currency": {
                      "type": "string"
                    },
                    "imageUrl": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "price": {
                      "type": "string"
                    },
                    "seller": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["currency", "price", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["count", "fetchedAt", "note", "offers", "query", "source"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2c4326f3afcb4d5af3210bd8dd6672dfce1ec251a2f548cdd2deec62b632acaf"
        }
      ],
      "digest": "sha256:5dc1280b9ab349575035c858a701aef91007e9f8f72fc642cddb2e9864ed131a"
    }
  }
}
