{
  "lockfileVersion": 2,
  "subjects": {
    "com.devdocs10/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://devdocs10.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "devdocs10",
        "title": "DevDocs10",
        "version": "1.0.0",
        "websiteUrl": "https://devdocs10.com/ai-tools"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DevDocs10 (devdocs10.com) has beginner-to-professional guides for Swift, Python, JavaScript, CSS and HTML, with tested code examples. Use search_docs to find articles, then get_doc to read one as Markdown.",
      "tools": [
        {
          "name": "get_doc",
          "title": "Read a DevDocs10 article",
          "description": "Get a DevDocs10 article as Markdown, including tested example output and browser support where available.",
          "inputSchema": {
            "properties": {
              "path": {
                "description": "Article path from search_docs, e.g. \"swift/swift-structs\", \"/articles/swift/swift-structs\", or a full devdocs10.com URL",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a1c5ccfdb82023d5a51214d2729da998eeadc9cdf13820809dbb2fb726e6f4fa"
        },
        {
          "name": "list_docs",
          "title": "List DevDocs10 articles",
          "description": "List DevDocs10 articles grouped by topic. Without a section, lists the sections and their topic groups.",
          "inputSchema": {
            "properties": {
              "section": {
                "enum": ["swift", "javascript", "css", "html", "python"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b438d2acb163c28a143f5d5c1bd7108fc7aee8eab2f9f67cb509a4974356e6bb"
        },
        {
          "name": "search_docs",
          "title": "Search DevDocs10",
          "description": "Search DevDocs10 guides (Swift, Python, JavaScript, CSS, HTML) by keywords. Returns the best-matching articles with their paths; read one with get_doc.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (default 8)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. \"swift actors\" or \"css container queries\"",
                "type": "string"
              },
              "section": {
                "description": "Optional: limit to one language",
                "enum": ["swift", "javascript", "css", "html", "python"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:18a055ee7a628b574b58898d954cabd94417f30d82a666fc7a7d2482a2ae232b"
        }
      ],
      "digest": "sha256:47116749594308ef7ceabb343716af4a7c60ef589e20bc6b82252b859e58792e"
    }
  }
}
