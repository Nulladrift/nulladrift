{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kwekuanansi/scam-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kwekuanansi.ai/mcp/scam-check"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "kweku-anansi-scam-check",
        "title": "Ghana Scam Check",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ghana Scam Check compares a message or call about money with fraud patterns reported in Ghana, and gives the reporting channels of Ghana's authorities and mobile networks, each with its source. Never tell someone a message is safe on its strength, and never ask for a PIN or a code. It covers Ghana only and cannot trace or recover money.",
      "tools": [
        {
          "name": "scams.check_message",
          "title": "Check a message for known scams",
          "description": "Use this when someone in Ghana shares a text, a WhatsApp message or an account of a phone call about mobile money, a bank, a prize, a job, an investment, a delivery or a request for money, and wants to know whether it looks like a known fraud. It returns the fraud patterns the message resembles, what to do, and where to report in Ghana, each with its source. Do not use it to tell someone a message is safe, for fraud outside Ghana, or to trace or recover money. Do not pass PINs or one-time codes to it: leave them out of the message.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "message": {
                "description": "The message as received, or a short account of the call. Leave out any PIN or code.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "explore_url": {
                "type": "string"
              },
              "limits": {
                "type": "string"
              },
              "report_to": {
                "type": "array"
              },
              "resembles": {
                "type": "array"
              },
              "sources_read_on": {
                "type": "string"
              },
              "standing_advice": {
                "type": "array"
              },
              "warning_signs": {
                "type": "array"
              }
            },
            "required": ["limits", "report_to", "resembles", "sources_read_on", "standing_advice", "warning_signs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02c1761db622691b2e5d831b22af33971d43172eb7786b16e44598f08d6bba34"
        },
        {
          "name": "scams.list_patterns",
          "title": "Common scams in Ghana",
          "description": "Use this when someone asks which mobile-money or online frauds are common in Ghana, or how a named one works (for example the \"wrong transfer\" call, SIM swap, or a prize that needs a payment). Do not use it for fraud outside Ghana, and do not present the list as complete: it covers patterns the authorities and networks have described.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pattern": {
                "description": "One pattern, for its full description. Leave out for the list.",
                "enum": ["pin_or_code_request", "wrong_transfer", "prize_needs_payment", "approval_prompt", "whatsapp_code_takeover", "sim_swap", "fake_bank_agent", "investment_platform", "job_or_recruitment_fee", "advance_fee", "fake_shop", "fake_business_listing", "known_contact_in_need"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "limits": {
                "type": "string"
              },
              "patterns": {
                "type": "array"
              },
              "sources_read_on": {
                "type": "string"
              }
            },
            "required": ["limits", "patterns", "sources_read_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c4af6b16ff194502fd19dae9d8d2ddac8dc79a73524a964254f4c5e44be0c9ae"
        },
        {
          "name": "scams.where_to_report",
          "title": "Where to report fraud in Ghana",
          "description": "Use this when someone in Ghana asks where to report mobile-money or online fraud, or what to do after sending money to a fraudster. It gives the reporting channels of the Cyber Security Authority, the networks, the police and the Bank of Ghana, and the steps to take in order. Do not use it for other countries, and do not suggest that money will be recovered: the authorities say recovery is difficult once money is withdrawn.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "money_already_sent": {
                "description": "true if money has already left the wallet.",
                "type": "boolean"
              },
              "network": {
                "description": "The mobile-money network involved: mtn, telecel or at. Leave out to get all three.",
                "enum": ["mtn", "telecel", "at"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "limits": {
                "type": "string"
              },
              "report_to": {
                "type": "array"
              },
              "sources_read_on": {
                "type": "string"
              },
              "steps": {
                "type": "array"
              }
            },
            "required": ["limits", "report_to", "sources_read_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:236dc1530876bf4512eaaa5f5412be87287e2b7e56d8372d4a0bb92bfa74abc3"
        }
      ],
      "digest": "sha256:add3273ef8bc564533998a6b09e8f0cd41e7f90d25fcc253896fd76e1204a241"
    }
  }
}
