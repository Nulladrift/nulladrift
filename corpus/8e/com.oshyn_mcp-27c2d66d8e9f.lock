        {
          "name": "get_discoverability_assessment",
          "description": "USE AFTER a Discoverability Assessment job completes (via `discoverability_assessment_status`) or\r\nwhen the user provides an assessment run ID. Retrieves LLM brand-positioning results — NOT website\r\nSEO (`query_company_scores` discoverability/seo) or site reliability (`get_site_report_status`).\r\n\r\nRetrieves a completed Discoverability Assessment by its run ID from the Oshyn public API and\r\nreturns a human-friendly interpretation alongside the raw payload.\r\n\r\nREQUIRED INPUT: the run ID (GUID) of the assessment. If the user did not provide it,\r\nask them for it BEFORE invoking this tool (e.g. \"Please provide the Discoverability Assessment\r\nrun ID (a GUID like 11111111-2222-3333-4444-555555555555).\").\r\n\r\nThe response includes:\r\n- A short headline and natural-language narrative (markdown) with the top strengths,\r\n  gaps vs competitors, competitive landscape, recommended actions, and strategic insights.\r\n- The public assessment URL (if available).\r\n- Contact email and name from the report (when present), used only if the user later opts in to Oshyn follow-up.\r\n- Agent instructions in `Message` for presenting results and handling contact the same way as Budget Estimator\r\n  and DXP Matchmaker: after showing results, briefly offer the contact URL or to forward their details;\r\n  only call `prompt_oshyn_contact_request` if the user proactively asks to be contacted.\r\n- The full raw assessment payload for any further inspection.\r\n\r\nPresent the narrative markdown to the user, then follow the contact guidance in `Message`.",
          "inputSchema": {
            "properties": {
              "reportId": {
                "description": "The run ID of the Discoverability Assessment to retrieve. Must be a valid GUID. If the user has not provided it, ask them first.",
                "type": "string"
              }
            },
            "required": ["reportId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:08a649f13cd9fa75a4d0b8dcabbf54352c375d62c61eedf0faab7873fd3b21b8"
        },
