        {
          "name": "query_company_scores",
          "description": "Returns Digital Trust Index company score rows as JSON for analysis. Use dataSet: all, rscore,\r\nperformance, security, accessibility, or discoverability.\r\n\r\nOne row per company per calendar month — the index publishes a single measurement per\r\ncompany per period, so two scans in the same month collapse to the later one.\r\n\r\nNOTE: dataSet discoverability/seo is website SEO metrics — NOT LLM brand discoverability.\r\nFor LLM/AI brand discoverability assessments use `start_discoverability_assessment`.",
          "inputSchema": {
            "properties": {
              "dataSet": {
                "description": "Dataset: all | rscore | performance | security | accessibility | discoverability | seo (website SEO only — not LLM brand discoverability)",
                "type": "string"
              },
              "from": {
                "description": "Inclusive start (ISO-8601).",
                "format": "date-time",
                "type": "string"
              },
              "gicsSector": {
                "default": null,
                "description": "GICS sector label; only for dataSet=all.",
                "type": ["string", "null"]
              },
              "hadErrors": {
                "default": null,
                "description": "Filter by HadErrors.",
                "type": ["boolean", "null"]
              },
              "industryGroup": {
                "default": null,
                "description": "GICS industry group label; only for dataSet=all.",
                "type": ["string", "null"]
              },
              "industryGroupCode": {
                "default": null,
                "description": "GICS industry group code (4 digits); only for dataSet=all.",
                "type": ["string", "null"]
              },
              "maxRows": {
                "default": null,
                "description": "Cap rows returned; default 500.",
                "type": ["integer", "null"]
              },
              "sector": {
                "default": null,
                "description": "Removed — renamed to gicsSector. Passing it is an error, not a silent no-op.",
                "type": ["string", "null"]
              },
              "sectorCode": {
                "default": null,
                "description": "GICS sector code (2 digits); only for dataSet=all.",
                "type": ["string", "null"]
              },
              "subIndustry": {
                "default": null,
                "description": "Removed — the Digital Trust Index no longer publishes sub-industry. Passing it is an error.",
                "type": ["string", "null"]
              },
              "to": {
                "default": null,
                "description": "Inclusive end (ISO-8601); omit for now UTC.",
                "format": "date-time",
                "type": ["string", "null"]
              },
              "version": {
                "default": null,
                "description": "Exact Version filter.",
                "type": ["integer", "null"]
              },
              "versionSince": {
                "default": null,
                "description": "Minimum Version (>=).",
                "type": ["integer", "null"]
              }
            },
            "required": ["dataSet", "from"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6f5c48c0d2cfb15925f4e1396cb526961e7cd43985aa59992d89fea4d997e047"
