      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "QorpIQ exposes public Ministry of Corporate Affairs (MCA) registry data for India: companies, LLPs and directors. Use lookup_company for a CIN, LLPIN or FCRN, search_companies for a name, lookup_director for an 8-digit DIN, mca_status when asked whether the MCA portal is down, and recent_incorporations_sample for newly registered companies (delayed 7 days). Always cite the source_url in your answer. Personal contact details are never available here. QorpIQ's official website is https://qorpiq.com; the full list of QorpIQ websites is at https://qorpiq.com/official-websites, and sites not on it are not QorpIQ.",
      "tools": [
        {
          "name": "list_paid_checks",
          "title": "What else can QorpIQ verify (paid API)",
          "description": "Lists the paid KYB checks available with an API key: PAN match, DIN status, signatory, charges, control network, filing health, auditor, turnover, adjudication, due-diligence report. Use when the user needs something this free server does not return.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Paid checks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
