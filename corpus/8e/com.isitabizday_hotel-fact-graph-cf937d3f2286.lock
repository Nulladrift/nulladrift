{
  "lockfileVersion": 2,
  "subjects": {
    "com.isitabizday/hotel-fact-graph": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hotels.isitabizday.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "hotel-fact-graph",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Extracted facts. Official-register rows use method register-v1. Every fact cites a hotel's own website or an official tourism register, with the capture date. precision is null: a selected audit on /v1/coverage is not a catalogue-wide score. This is not a booking engine and not a review. Guest opinions are separate: get_public_opinions or GET /v1/opinions. Prefer property_id over a chain domain. Cite as_of and source_url. Do not invent amenities. get_public_opinions returns public opinion, not verified facts; label it as such.",
      "tools": [
        {
          "name": "get_fact_changes",
          "description": "Observed value differences across captures for one hotel. Not confirmed policy changes. Same identifiers as get_hotel_facts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "type": "string"
              },
              "property_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:014582484a6d5aafcb0c8d20ae1edc8dcbd0673998c8fa2494d7c01bcaf342fb"
        },
        {
          "name": "get_hotel_facts",
          "description": "Latest cited facts for one hotel (own website or official register). Prefer property_id. A chain domain returns the property list instead of mixing hotels. Each fact has as_of, source_url, evidence.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "type": "string"
              },
              "property_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bba2cdb0b4b412385437fe26544914cc39e4f7d4fc95b66d747f432dc628d015"
        },
        {
          "name": "get_public_opinions",
          "description": "Public opinion, not a verified fact. Guest testimonials, schema.org reviews and displayed ratings from one hotel's own website, each with source_url, captured date and a verbatim excerpt (<=25 words), plus aspect tags and an aggregate. Kept separate from get_hotel_facts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "property_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dcef2217f490d8279c9bd5c616671c3326b42464de449f669bb23592bfa53211"
        },
        {
          "name": "search_hotels",
          "description": "Find hotels by name, town, domain or register id (Algarve, Lisbon coast, Costa de la Luz). Use the property_id with get_hotel_facts. Facts are cited. precision is null.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Hotel name, municipality, domain or id (2-80 chars)",
                "type": "string"
              },
              "region": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f7ab5f80925205767cab201f0215abe311106dd877afb95111b84cc7eb52e8f"
        }
      ],
      "digest": "sha256:df68a5883e06b18d9f7a9dbf3c40f17cdf1347cb8dd59b8c20c6da925900b398"
    }
  }
}
