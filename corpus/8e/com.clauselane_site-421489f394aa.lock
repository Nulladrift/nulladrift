          "digest": "sha256:6b9f21dd973314504ead64c8399ea32291c0752e51f1f10e7993eeedb95cb9b4"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the Clauselane dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
