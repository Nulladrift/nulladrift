          },
          "digest": "sha256:a7f14eceb5d27c05b7bee6a63cb16ff5070b290b9de91802601e977b054ddf79"
        },
        {
          "name": "dataset_compare",
          "title": "Compare rows side by side",
          "description": "The rows of the Clauselane dataset whose column is any of the given values, in the order given — for \"X vs Y\" questions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "values": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["column", "values"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5cfd235d25e7c3de3e23292393deea5ba7de76f8059e7d981ed3e3bc75eae7de"
        },
        {
          "name": "dataset_provenance",
          "title": "Where this data comes from, and how to cite it",
          "description": "The source, the date it was computed, the licence and the citation for the Clauselane dataset. Read this to attribute a figure correctly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
