        {
          "name": "delete_profile",
          "title": "Delete references or the profile",
          "description": "Use this when the user asks to delete their data. Pass the profile_key and ref_ids to delete only those references, or leave ref_ids out to delete the whole profile: every reference, description and saved rule. Deletion is permanent. Returns how many references were deleted.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "profile_key": "tp_604a48a85c9a4da5a2a15ba7b4198f1b"
              }
            ],
            "properties": {
              "profile_key": {
                "description": "The profile_key that add_refs returned. Keep it: it is the only way back to this profile and it is not recoverable.",
                "pattern": "^tp_[0-9a-f]{32}$",
                "type": "string"
              },
              "ref_ids": {
                "description": "Delete only these references and keep the profile. Leave out to delete the whole profile: every reference, description and saved rule.",
                "items": {
                  "pattern": "^r_[0-9a-f]{6}$",
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              }
            },
            "required": ["profile_key"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "UTC date of this answer.",
                "type": "string"
              },
              "deleted": {
                "enum": ["profile", "refs"],
                "type": "string"
              },
              "refs_deleted": {
                "type": "integer"
              },
              "source": {
                "type": "string"
              },
              "status": {
                "enum": ["deleted"],
                "type": "string"
              }
            },
            "required": ["as_of", "deleted", "refs_deleted", "source", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Delete references or the profile",
            "openai/toolInvocation/invoking": "Delete references or the profile..."
          },
          "digest": "sha256:ec6d77a6fbbdf383464c0820e1b69b6548e7536fff0c1a9382246f7f28d64c99"
        },
        {
          "name": "describe_style",
          "title": "Describe the shared style",
          "description": "Describe the shared style. Use this when the user asks what their references have in common or wants rules to design by, such as \"what is my taste?\". Pass the profile_key and optionally ref_ids to use only some references. Returns concrete rules for layout, type, texture and hierarchy, a palette of hex colors with how many references use each, and the most common style tags. The rules are suggestions to confirm with the user, then keep with save_profile.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "profile_key": "tp_604a48a85c9a4da5a2a15ba7b4198f1b"
              }
            ],
            "properties": {
              "profile_key": {
                "description": "The profile_key that add_refs returned. Keep it: it is the only way back to this profile and it is not recoverable.",
                "pattern": "^tp_[0-9a-f]{32}$",
                "type": "string"
              },
              "ref_ids": {
                "description": "Only use these references; leave out to use all of them.",
                "items": {
                  "pattern": "^r_[0-9a-f]{6}$",
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              }
            },
            "required": ["profile_key"],
            "type": "object"
