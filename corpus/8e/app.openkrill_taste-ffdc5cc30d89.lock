              "profile": {
                "properties": {
                  "avoid": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "hierarchy": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "layout": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "notes": {
                    "type": "string"
                  },
