        {
          "name": "get_schema",
          "description": "Returns the data model of the Artsdata Knowledge Graph: its entity classes (Event, Place, Organization, Person, LivePerformanceWork...), the properties of each with required/optional, cardinality, value types, linked classes and allowed values, the controlled vocabularies, the SPARQL prefixes, and conventions for querying. Derived from the Artsdata Ontology and the Artsdata CORE graph SHACL shapes. Call this before writing a SPARQL query to run with sparql_query against https://query.artsdata.ca/query, since Artsdata's model is not general knowledge. Takes no input.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Request schema for the get_schema tool. The tool takes no arguments.",
            "properties": {},
            "title": "GetSchemaRequest",
            "type": "object",
            "version": "1.0.0"
          },
          "outputSchema": {
            "$defs": {
              "curies": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "property": {
                "additionalProperties": false,
                "properties": {
                  "classes": {
                    "$ref": "#/$defs/curies",
                    "description": "Class(es) of the linked node."
                  },
                  "datatypes": {
                    "$ref": "#/$defs/curies"
                  },
                  "description": {
                    "type": "string"
                  },
                  "equivalent_properties": {
                    "$ref": "#/$defs/curies"
                  },
                  "has_value": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "in": {
                    "description": "Allowed values.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "label": {
                    "type": "string"
                  },
                  "language_in": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "max_count": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "min_count": {
                    "description": "Only present when greater than 1.",
                    "minimum": 2,
                    "type": "integer"
                  },
                  "node_kind": {
                    "enum": ["IRI", "Literal", "BlankNode", "BlankNodeOrIRI", "BlankNodeOrLiteral", "IRIOrLiteral"],
                    "type": "string"
                  },
                  "path": {
                    "description": "SPARQL property path.",
                    "type": "string"
                  },
                  "pattern": {
                    "description": "Regex the value (as a string) matches.",
                    "type": "string"
                  },
                  "range": {
                    "$ref": "#/$defs/curies"
                  },
                  "required": {
                    "description": "sh:minCount >= 1.",
                    "type": "boolean"
                  },
                  "severity": {
                    "description": "Omitted for sh:Violation.",
                    "type": "string"
                  },
                  "sub_property_of": {
                    "$ref": "#/$defs/curies"
                  },
                  "unique_lang": {
                    "type": "boolean"
                  },
                  "value_shape": {
                    "additionalProperties": false,
                    "properties": {
                      "label": {
                        "type": "string"
                      },
                      "properties": {
                        "items": {
                          "$ref": "#/$defs/property"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["properties"],
                    "type": "object"
                  }
                },
                "required": ["path", "required"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Response schema for the get_schema tool: the Artsdata data model (ontology + CORE graph SHACL shapes) compiled into a class-centric digest. IRIs are CURIEs over `prefixes` (or <full-IRI> when no prefix fits); property paths are SPARQL 1.1 property paths.",
            "properties": {
              "about": {
                "additionalProperties": false,
                "properties": {
                  "description": {
                    "type": "string"
                  },
                  "modified": {
                    "type": "string"
                  },
                  "namespace": {
                    "format": "uri",
                    "type": "string"
                  },
                  "source": {
                    "description": "Turtle file the digest was compiled from.",
                    "format": "uri",
                    "type": "string"
                  },
                  "sparql_endpoint": {
                    "format": "uri",
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "version": {
                    "type": "string"
                  }
                },
                "required": ["source", "sparql_endpoint"],
                "type": "object"
              },
              "classes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "alternate_names": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "class": {
                      "description": "Class to use with rdf:type / a.",
                      "type": "string"
                    },
                    "comment": {
                      "type": "string"
                    },
                    "equivalent_classes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "label": {
                      "type": "string"
                    },
                    "properties": {
                      "items": {
                        "$ref": "#/$defs/property"
                      },
                      "type": "array"
                    },
                    "shapes": {
                      "description": "SHACL node shapes merged into this entry.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "subclass_of": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["class", "properties"],
                  "type": "object"
                },
                "type": "array"
              },
              "conventions": {
                "description": "How to read the digest and write SPARQL against the graph.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "prefixes": {
                "additionalProperties": {
                  "format": "uri",
                  "type": "string"
                },
                "description": "Prefix name -> namespace IRI.",
                "type": "object"
              },
              "vocabularies": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "classes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "label": {
                      "type": "string"
                    },
                    "property": {
                      "type": "string"
                    },
                    "scheme": {
                      "description": "skos:ConceptScheme the property's values are in.",
                      "type": "string"
                    }
                  },
                  "required": ["property", "scheme"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["about", "classes", "conventions", "prefixes", "vocabularies"],
            "title": "GetSchemaResponse",
            "type": "object",
            "version": "1.0.0"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1f64c842e859136d51d93fa557fc9fc554e488a4bd9855971b90c1dcaef95cd9"
        },
        {
          "name": "search_entities",
          "description": "Tool to search for entities in the Artsdata knowledge graph by name, with optional filters on entity type and on the controlled vocabulary (skos:ConceptScheme) a concept belongs to. Each result has a markdown-link `label` like '[Name (K12-345)](https://kg.artsdata.ca/resource/K12-345)': use it verbatim when mentioning the entity.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Request schema for the search_entities tool.",
            "properties": {
              "in_scheme": {
                "description": "Optional list of Artsdata controlled vocabulary (skos:ConceptScheme) URIs (e.g., ['http://kg.artsdata.ca/resource/ArtsdataEventTypes']). Paired with types: ['http://www.w3.org/2004/02/skos/core#Concept']. Use it to find a concept URI by its label (e.g., the event type for 'exhibition') for use in search_events under has_event_type_concept. Can be left empty.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "language": {
                "default": "en",
                "description": "Language code, restricted to 'en' or 'fr'.",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Number of results to return.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Non-empty mandatory search query.",
                "minLength": 1,
                "type": "string"
              },
              "types": {
                "description": "Optional list of type filters; can be empty.",
                "items": {
                  "enum": ["http://kg.artsdata.ca/ontology/Event", "http://kg.artsdata.ca/ontology/Place", "http://kg.artsdata.ca/ontology/Person", "http://kg.artsdata.ca/ontology/Organization", "http://dbpedia.org/ontology/Agent", "http://www.w3.org/2004/02/skos/core#Concept"],
                  "format": "uri",
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["query"],
            "title": "SearchQueryRequest",
            "type": "object",
            "version": "1.0.0"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Response schema for the search_entities tool.",
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "type": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "id": {
                            "format": "uri",
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          }
                        },
                        "required": ["id", "name"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "uri": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "type", "uri"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "title": "SearchEntitiesResponse",
            "type": "object",
            "version": "1.0.0"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b2545396e23795d3782bf5bbbe371e46350548af4722aca87b0340867bbb512"
