        {
          "name": "search_events",
          "description": "Tool to search for events in the Artsdata knowledge graph by place, artist, organization, has_event_type_concept and language. Places, artists and organizations are Artsdata entity URIs; the has_event_type_concept filter takes concept URIs from the Artsdata Event Types vocabulary (adr:ArtsdataEventTypes), not schema.org classes. Resolve any name or label to its URI with search_entities first. Places must be venues; for events in a city or region, use sparql_query (see the places parameter). At least one filter is required. Entity URIs end in the Artsdata ID (K\\d+-\\d+, e.g. K12-345); cite it with the entity name.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Request schema for the search_events tool.",
            "properties": {
              "artists": {
                "description": "Optional list of Artsdata artist URIs (e.g., [\"http://kg.artsdata.ca/resource/K2-6574\"]). If you only have a name, use search_entities (types: ['http://kg.artsdata.ca/ontology/Person']) to find its URI first. Can be left empty.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "has_event_type_concept": {
                "description": "Optional list of concept URIs from the Artsdata Event Types vocabulary (http://kg.artsdata.ca/resource/ArtsdataEventTypes). Must be valid concept URIs (e.g., http://kg.artsdata.ca/resource/ClassicalMusicPerformance). Non-matching inputs—such as text labels, schema.org classes, or external vocabularies—will return zero results without throwing an error. Resolve any name or label to its URI with search_entities first",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "language": {
                "default": "en",
                "description": "Language for the labels in the response (e.g. 'en', 'fr'); default is 'en'. This selects the output language only — it does NOT filter events by the language they are performed in.",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Number of results to return.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "organizations": {
                "description": "Optional list of Artsdata organization URIs (e.g., [\"http://kg.artsdata.ca/resource/K5-72\"]). If you only have a name, use search_entities (types: ['http://kg.artsdata.ca/ontology/Organization']) to find its URI first. Can be left empty.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "places": {
                "description": "Optional list of Artsdata VENUE URIs (e.g., [\"http://kg.artsdata.ca/resource/K11-2\"]) for a theatre, hall, auditorium, room or stage. Only venue URIs work: a city, region or country (e.g. 'Toronto', 'Ontario', 'Canada') is not a venue and returns no events. First find the venue's URI with search_entities (types: ['http://kg.artsdata.ca/ontology/Place']) using the venue name. A venue URI also covers the rooms and halls inside it (schema:containedInPlace). To find events in a city or region, use sparql_query. Can be left empty.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "startDateFrom": {
                "description": "Optional lower bound filter. Includes events starting on or after this date/time. ISO 8601 format (YYYY-MM-DD or YYYY-MM-DDTHH:mm:ssZ).",
                "type": "string"
              },
              "startDateTo": {
                "description": "Optional upper bound filter. Includes events starting on or before this date/time. ISO 8601 format (YYYY-MM-DD or YYYY-MM-DDTHH:mm:ssZ).",
                "type": "string"
              }
            },
            "title": "SearchEventsRequest",
            "type": "object",
            "version": "1.0.0"
          },
          "outputSchema": {
            "$defs": {
              "additionalProperty": {
                "additionalProperties": false,
                "properties": {
                  "predicate": {
                    "additionalProperties": false,
                    "properties": {
                      "label": {
                        "type": "string"
                      },
                      "uri": {
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "required": ["label", "uri"],
                    "type": "object"
                  },
                  "values": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["predicate", "values"],
                "type": "object"
              },
              "entityDetails": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "description": "Artsdata identifier of the referenced entity.",
