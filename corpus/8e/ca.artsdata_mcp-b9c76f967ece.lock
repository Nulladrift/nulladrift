      "instructions": "Access Artsdata's public APIs through a secure, lightweight, LLM-optimized layer designed for efficient querying by autonomous agents and users alike. SPARQL endpoint: https://query.artsdata.ca/query. To answer a question with SPARQL, call get_schema to learn the data model, write the query and run it with sparql_query, then use get_entity (details of a URI) or search_entities (URI from a name) as needed. When you mention an event, place, person or organization that has an Artsdata URI (http://kg.artsdata.ca/resource/K12-345), cite its Artsdata ID (the ID matching K\\d+-\\d+ at the end of the URI) on first mention, formatted as 'Name (K12-345)'. search_entities results include a ready-made markdown-link `label` showing that format; use it. Take IDs only from tool results, never invent them; entities with other URIs (e.g. Wikidata) have no Artsdata ID. To find the ID of an entity you only know by name, use search_entities. Sources: a property's asserted value is the answer; other sources may only claim a different value (see get_schema about.description). When asked who says or which sources claim a value (e.g. 'who says the name is...'), follow the sources convention of get_schema with sparql_query. Answer with the asserted value and its sources first, then differing claimed values with theirs; name each source by its dataset's schema:name and link its schema:maintainer (add https:// if it has no scheme).",
      "tools": [
        {
          "name": "get_entity",
          "description": "Tool to get entities details from Artsdata Knowledge Graph by entity URI. Entity URIs end in the Artsdata ID (K\\d+-\\d+, e.g. K12-345); cite it with the entity name. The result's `sources` lists the datasets the entity was built from: name them when you answer about the entity, linking `url` when present, else by `name`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Request schema for the get_entity tool.",
            "properties": {
              "uri": {
                "description": "The Artsdata entity URI.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["uri"],
            "title": "GetEntityRequest",
            "type": "object",
            "version": "1.0.0"
          },
          "outputSchema": {
            "$defs": {
              "additionalProperty": {
                "additionalProperties": false,
                "properties": {
                  "predicate": {
                    "additionalProperties": false,
                    "properties": {
                      "label": {
                        "type": "string"
                      },
                      "uri": {
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "required": ["label", "uri"],
                    "type": "object"
                  },
                  "values": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["predicate", "values"],
                "type": "object"
              },
              "entityDetails": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "description": "Artsdata identifier of the referenced entity.",
                    "type": "string"
                  },
                  "name": {
                    "description": "Preferred label of the referenced entity, in the requested language when available.",
                    "type": "string"
                  },
                  "uri": {
                    "description": "URI of the referenced entity.",
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["id", "uri"],
                "type": "object"
              },
              "multiLingualString": {
                "additionalProperties": false,
                "properties": {
                  "language": {
                    "description": "BCP 47 language tag (e.g., 'en', 'fr').",
                    "type": "string"
                  },
                  "value": {
                    "type": "string"
                  }
                },
                "required": ["value"],
                "type": "object"
              },
              "stringList": {
                "type": "string"
              },
              "typeItem": {
                "additionalProperties": false,
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "uri": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["label", "uri"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Response schema for the get_entity tool.",
            "properties": {
              "additional_properties": {
                "items": {
                  "$ref": "#/$defs/additionalProperty"
                },
                "type": "array"
              },
              "alternate_names": {
                "items": {
                  "$ref": "#/$defs/multiLingualString"
