      "instructions": "n0brains market-intel server (read-only data; journal tools write only to your own private journal). tools/list and initialize are open so unauthenticated catalog discovery works. AGENT PLAYBOOK — follow this instead of exploring the catalog tool-by-tool:\n\nn0brains = measured market intel (crypto + HIP-3 stocks/metals/indices). Every\nnumber carries its own honesty metadata. The server does the synthesis FOR\nyou — prefer the composite tools; do not rebuild them from the raw feed.\n\nPICK THE WORKFLOW THAT MATCHES THE ASK:\n\n1) \"Find me a trade\" -> get_actionable_signals. Check has_trade_signal; render\n   reads[] (never empty when any read exists; actionable=false items are\n   context, not trades). Nothing gate-passed? rank_trades('BTC,ETH,SOL,...')\n   -> best setup_score, respect tradeable+reason+warnings. Grade the\n   candidate: check_trade(asset, side, entry, stop, target, leverage)\n   -> A..F + flags + falsifiers. Pro: log_trade it.\n\n2) \"Should I take THIS trade?\" -> check_trade FIRST (one call: event risk,\n   crowding, liq distance vs vol, stop-in-noise, proven-edge conflict, RR).\n   Add get_positioning(coin) for who's crowded, get_event_outlook for\n   scheduled events inside the horizon. That's the whole vet.\n\n3) \"What's going on with <coin>?\" -> get_state(coin) — one call: price,\n   intraday consensus, swing outlook, levels, options, macro regime. Drill\n   only if asked: get_positioning (crowding), get_long_short (who is long\n   where, by real source), get_levels/get_indicators (structure + Fib),\n   get_liquidation_map (magnets), get_options (vol),\n   get_sentiment/get_mindshare_coin (attention). Pro prose write-up you can\n   quote verbatim: get_state_brief(coin).\n\n4) \"Market overview / morning brief\" -> get_market_brief (one call). Deeper:\n   get_market_regime + get_liquidity_map + get_cross_asset_flows +\n   get_economic_calendar(days_ahead=7). Conditioning: get_market_analogs.\n   Attention: get_mindshare. Alt rotation: get_rotation.\n\n5) Alt-coin VETTING (forensics) -> get_trust FIRST (honeypot / mint / tax /\n   insider screen — a bullish read on a honeypot is worthless), then\n   get_manipulation (pump probability, cascade risk) and get_narrative\n   (is the story building or dying, 1h/4h/24h). find_similar_signals shows\n   what similar past setups looked like.\n\nMONITORING: get_signals_since(since_timestamp=cursor, asset?, signal_type?),\ncarry the returned server_timestamp forward. Do not poll list_signals.\nUNIVERSE + QUOTA: get_checkable_assets = what check_trade/get_trade_plan can\nprice (honor degraded:true — incomplete list, retry). get_usage = your call\nbudget; get_check_history includes free_checks_remaining_today.\n\nHOW TO READ n0brains DATA (do not skip):\n- action_hint=ignore => NOT a trade, whatever direction/urgency say. Only\n  action_hint=trade_signal cleared the proven per-(type,direction) gate.\n- historical_edge on each signal = that (type|direction|regime) cell's\n  measured record; win_rate 0.15 means the cell LOSES on 24h. Never echo a\n  signal's direction without its cell record.\n- confidence=null => anti-predictive cell (calibration_inverted_in_cell).\n- n_signals overstates (overlapping windows) — weigh n_eff and n_measured.\n- Swing outlooks are proven at 7-30d horizons; suggested hold = the proven\n  horizon; never an intraday claim.\n- calibration:\"uncalibrated\" (macro conviction, rotation, regime) = context\n  weighting only, never sizing.\n- tradeable:false + reason on plans is a decision, not an error — surface\n  the reason to the user.\n- Whale reads are fade-corrected AT SOURCE; do not re-invert them.\n- get_price is the canonical spot; a payload whose own spot disagrees\n  materially is stale — discount it.\n\nRECEIPTS: get_proof (full board, + horizon='7d|14d|30d' swing boards +\nasset_class boards), get_performance (by signal type), get_discovery (mined\npattern edges), get_check_history (YOUR past checks with resolved outcomes),\nhttps://n0brains.com/proof.\nTIERS: free = check_trade 3/day, 15-min delayed signals, levels/performance/\nregime/macro/calendar. Pro = real-time everything + private trade journal\n(log_trade/close_trade/get_journal).\n",
