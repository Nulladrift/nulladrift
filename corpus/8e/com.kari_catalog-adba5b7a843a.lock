{
  "lockfileVersion": 2,
  "subjects": {
    "com.kari/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.kari.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kari-catalog",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "kari — сеть магазинов обуви и одежды в России, Казахстане и Беларуси. Сервер только читает каталог.\nСтрана: ru, kz или by — по запросу пользователя. Город — find_city, его city_id передавай в остальные инструменты.\nТовары — search_products (листай page), подробности и размеры — get_product, где забрать размер — check_availability, адреса и часы магазинов — find_stores.\nУ безразмерных товаров (sizes пустой) check_availability вызывай без size.\nЦены — в валюте страны; old_price и discount_percent есть, только если товар уценён на сайте.\nПокупка и самовывоз — на сайте по ссылке url; в корзину сервер ничего не кладёт.\n\nkari sells shoes and clothing in Russia, Kazakhstan and Belarus. Read-only catalog.\nPick country (ru, kz, by) from the user request; get city_id via find_city and pass it on.\nUse search_products (page through results), get_product for details and sizes, check_availability for stores holding a size, find_stores for addresses and hours.\nFor items without sizes (empty sizes) call check_availability without size.\nPrices are in local currency; old_price and discount_percent appear only for marked-down items.\nPurchase and pickup happen on the website via url; this server has no cart.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability in stores",
          "description": "Which kari stores in the city can hand over this size and when (pickup). Up to 10 stores; quantities are not disclosed. Omit size for items without sizes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "articul": {
                "description": "Product articul (kari SKU) from search_products",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "city_id": {
                "description": "city_id returned by find_city",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "Country: ru — Russia, kz — Kazakhstan, by — Belarus",
                "enum": ["ru", "kz", "by"],
                "type": "string"
              },
              "size": {
                "description": "Size from get_product; omit for items without sizes",
                "maxLength": 10,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["articul", "city_id", "country"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "stores": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "pickup": {
                      "type": "string"
                    },
                    "store_id": {
                      "type": "string"
                    }
                  },
                  "required": ["address", "name", "pickup", "store_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "total_stores": {
                "type": "number"
              }
            },
            "required": ["stores", "total_stores"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b9b20067d1f17c636b928f6102c3944229b3ee8ddb062989075d096bc92495bf"
        },
        {
          "name": "find_city",
          "title": "Find city",
          "description": "Find a city where kari operates by part of its name. Returns up to 10 cities with city_id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country: ru — Russia, kz — Kazakhstan, by — Belarus",
                "enum": ["ru", "kz", "by"],
                "type": "string"
              },
              "query": {
                "description": "Part of the city name, e.g. \"алм\"",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["country", "query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "city_id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["city_id", "name"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["cities"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f8704083661de459716bf2aeacb4c72875fe61305e61431a1faa5fe02f426c39"
        },
        {
          "name": "find_stores",
          "title": "Find stores",
          "description": "List kari stores in a city with address, opening hours and coordinates. Filter by part of the name, address, mall or metro station. 10 stores per page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city_id": {
                "description": "city_id returned by find_city",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "Country: ru — Russia, kz — Kazakhstan, by — Belarus",
                "enum": ["ru", "kz", "by"],
                "type": "string"
              },
              "page": {
                "description": "Page number, from 1",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of the store name, address, mall or metro station",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["city_id", "country"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "page": {
                "type": "number"
              },
              "stores": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "type": "string"
                    },
                    "hours": {
                      "type": "string"
                    },
                    "location": {
                      "additionalProperties": false,
                      "properties": {
                        "lat": {
                          "type": "number"
                        },
                        "lng": {
                          "type": "number"
                        }
                      },
                      "required": ["lat", "lng"],
                      "type": "object"
                    },
                    "name": {
                      "type": "string"
                    },
                    "store_id": {
                      "type": "string"
                    }
                  },
                  "required": ["address", "hours", "name", "store_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "number"
              }
            },
            "required": ["page", "stores", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8ea20e52c489bd8910301072b1eb292d0ffbd4dbd0394a747272d5d10d88d8ed"
        },
        {
          "name": "get_product",
          "title": "Get product",
          "description": "Product details by articul: price, images, color, composition, rating and sizes with availability in the city. Items without sizes have an empty sizes list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "articul": {
                "description": "Product articul (kari SKU) from search_products",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "city_id": {
                "description": "city_id from find_city. Default: capital",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "Country: ru — Russia, kz — Kazakhstan, by — Belarus",
                "enum": ["ru", "kz", "by"],
                "type": "string"
              }
            },
            "required": ["articul", "country"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "articul": {
                "type": "string"
              },
              "available": {
                "description": "Can be ordered in this city (store or warehouse). Not the same as pickup today: call check_availability for stores and timing",
                "type": "boolean"
              },
              "brand": {
                "type": "string"
              },
              "color": {
                "description": "Absent when the product has no color in the catalog",
                "type": "string"
              },
              "composition": {
                "type": "string"
              },
              "currency": {
                "description": "ISO currency code: RUB, KZT or BYN",
                "type": "string"
              },
              "discount_percent": {
                "description": "Discount badge in percent, as on the website",
                "type": "number"
              },
              "images": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "type": "string"
              },
              "old_price": {
                "description": "Crossed-out price; present only when the website shows a markdown",
                "type": "number"
              },
              "price": {
                "description": "Selling price as on the website",
                "type": "number"
              },
              "rating": {
                "additionalProperties": false,
                "properties": {
                  "count": {
                    "type": "number"
                  },
                  "value": {
                    "type": "number"
                  }
                },
                "required": ["count", "value"],
                "type": "object"
              },
              "sizes": {
                "description": "Empty for items without sizes. available: can be ordered in this city, store or warehouse",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "available": {
                      "type": "boolean"
                    },
                    "size": {
                      "type": "string"
                    }
                  },
                  "required": ["available", "size"],
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["articul", "available", "brand", "currency", "images", "name", "price", "sizes", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:10fb8ff480159660bed6029a04901c268ca1d359e7c3b0caa40b3f3881e50287"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search the kari catalog (shoes, clothing, bags, accessories) with filters. Returns products with price, size range and a link to the website. sizes is the size range of the model, not stock: check stock with get_product or check_availability.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "maxLength": 100,
                "type": "string"
              },
              "city_id": {
                "description": "city_id from find_city; prices and stock depend on the city. Default: capital",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "Country: ru — Russia, kz — Kazakhstan, by — Belarus",
                "enum": ["ru", "kz", "by"],
                "type": "string"
              },
              "limit": {
                "description": "Products per page, 1–20, default 10",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page number, from 1",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "price_max": {
                "minimum": 0,
                "type": "number"
              },
              "price_min": {
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "What to look for, in the user language, e.g. \"белые кроссовки\"",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "size": {
                "description": "Size as on the website, e.g. \"38\"",
                "maxLength": 10,
                "type": "string"
              },
              "sort": {
                "enum": ["relevance", "price_asc", "price_desc", "rating", "discount"],
                "type": "string"
              }
            },
            "required": ["country", "query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hint": {
                "type": "string"
              },
              "page": {
                "type": "number"
              },
              "products": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "articul": {
                      "type": "string"
                    },
                    "brand": {
                      "type": "string"
                    },
                    "currency": {
                      "description": "ISO currency code: RUB, KZT or BYN",
                      "type": "string"
                    },
                    "discount_percent": {
                      "description": "Discount badge in percent, as on the website",
                      "type": "number"
                    },
                    "image": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "old_price": {
                      "description": "Crossed-out price; present only when the website shows a markdown",
                      "type": "number"
                    },
                    "price": {
                      "description": "Selling price as on the website",
                      "type": "number"
                    },
                    "sizes": {
                      "description": "Size range of the model, regardless of stock",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["articul", "brand", "currency", "image", "name", "price", "sizes", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "number"
              }
            },
            "required": ["page", "products", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1429d8bd730a42d09a8cfd660d8e89a0b154fd4f7fca3881f82af93d42401719"
        }
      ],
      "digest": "sha256:49126bfae504cda19cac7605830978495a4e07e956568234de624a82216a8a5c"
    }
  }
}
