        {
          "name": "generate_ui_pack",
          "title": "Generate UI Pack",
          "description": "Get a cost preview for an exact component list and batch breakdown, then generate using the returned signed quote. Every paid raster/SVG batch is 100 credits; one pack action can contain several batches. Fonts are free. Defaults to dry-run; never alter the quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dryRun": {
                "default": true,
                "description": "Show the user estimatedCredits and ask whether to proceed, unless already authorized in this session. Prefer the client native question UI with Approve / Decline / Discuss choices; otherwise accept any unambiguous conversational approval. Never require a fixed phrase or magic word. Then set false and supply the returned quote.",
                "type": "boolean"
              },
              "idempotencyKey": {
                "description": "Reuse the same key when retrying a confirmed request.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "packId": {
                "description": "Owned UI Pack ID.",
                "format": "uuid",
                "type": "string"
              },
              "quote": {
                "additionalProperties": {},
                "description": "Unmodified signed quote returned by the dry-run. Required when dryRun is false.",
                "type": "object"
              },
              "request": {
                "additionalProperties": false,
                "properties": {
                  "components": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "description": {
                          "type": "string"
                        },
                        "indicatorAttachment": {
