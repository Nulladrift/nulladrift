        {
          "name": "start_project_export",
          "title": "Build complete game project",
          "description": "FREE. Queue a durable complete Phaser, Godot or Unity project export. First review with get_project_export_review and pass its version and selected starting map/player. Returns a job ID immediately; poll get_project_export_status until ready. No generation credits are spent.",
