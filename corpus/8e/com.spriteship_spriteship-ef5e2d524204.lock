        {
          "name": "set_asset_runtime_intent",
          "title": "Set an asset's runtime render intent",
          "description": "FREE and SYNCHRONOUS (no jobId — do not poll). Declare how an asset revision should be rendered at runtime: plain_image, particle_emitter, deformable_strip, repeat_fill, nine_slice or shader_effect. path_follow is accepted only for backward compatibility; do not set it on new assets. Draw and configure motion per placement in the level editor instead. The intent and its config flow into every engine export made AFTER this edit. Set tileIndex to target one tile of a tileset/staged asset.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assetId": {
                "description": "Asset id or slug.",
                "type": "string"
              },
              "config": {
                "additionalProperties": {},
                "description": "Intent-specific config. Validated and clamped server-side; unknown keys are dropped.",
                "type": "object"
              },
              "iterationId": {
                "description": "Revision (iteration) id to stamp.",
                "type": "string"
              },
              "runtimeUse": {
                "description": "The render intent. plain_image clears any previous intent. path_follow is legacy-only; new path motion is authored per placement in the level editor.",
                "enum": ["plain_image", "particle_emitter", "deformable_strip", "repeat_fill", "nine_slice", "shader_effect", "path_follow"],
                "type": "string"
              },
              "tileIndex": {
                "description": "Target one tile (tileset/staged only).",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["assetId", "iterationId", "runtimeUse"],
            "type": "object"
          },
