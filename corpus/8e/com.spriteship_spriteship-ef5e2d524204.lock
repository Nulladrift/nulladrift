      "instructions": "New generated image and animation exports may contain a SpriteShip watermark until the first successful payment, subject to support overrides. Old generations remain exempt. Use returned delivery URLs and export bytes; do not construct original URLs or remove watermarks. Re-run plan_sync after payment or support changes.\n\nSpriteShip generates 2D game art (characters with animated spritesheets, tilesets, terrain, brushable Materials, backgrounds, levels) and exports it to Phaser, Godot, Unity, GameMaker, Tiled, Sparrow XML character atlases, and Unreal/Paper2D (beta). Unreal is visual import, not automatic gameplay; native Unreal verification is pending.\n\nRIGHTS: use only content the user owns or has permission to use and distribute. If rights to reference images, artwork, fonts, music or code are unclear, ask before using them and offer an original alternative. Do not source third-party game assets or imitate protected branding as a shortcut. Preserve required licenses and notices. Format compatibility grants no third-party content or trademark rights and implies no endorsement. Use neutral Sparrow XML labels; fnf remains the stable technical identifier.\n\nGAME WORKFLOW: use API/MCP for SpriteShip operations, including Materials; never open or automate the SpriteShip dashboard as fallback. For UI-only map edits, give the user a direct link and steps. Propose varied useful collections across relevant asset categories, preserve explicit counts and budget, and show the signed plan and supported imageAspectRatio before spend. Read whoami.mapLimits and the saved map before recommending level size from camera and movement requirements. Wait for a required user-authored map before claiming a playable mapped level. After jump generation inspect phaseProposal and offer its free phase split. Inspect existing per-item/revision colliders and exported placement geometry before asking users to draw collision. Navigation shapes remain generic: preserve collidable, solid and custom fields and implement only the user's requested game behavior.\n\nSKILL UPDATES: the current customer skill is 0.7.9. Once when starting SpriteShip work in a session, use get_integration_status if available, with the version actually read from local SpriteShip instructions (omit when unknown). If update_available, tell the user once what changed and link the returned updateGuidePath on this configured SpriteShip server. If unknown, briefly offer the current skill and /docs/agent-skill#updates; do not claim their installed copy is outdated. A newer local copy must not be downgraded. Checks are advisory: continue compatible work if offline or unavailable, do not retry repeatedly, change files, or infer consent to update. Reconnect/refresh the client's tool catalog after server updates; this server does not push updates into existing sessions.\n\nTASK ROUTING: a broad game vision or story should become a repository-aware MVP art plan before image/video generation: inspect the game code and existing SpriteShip work, use generate_project_intake when a validated project/style foundation is missing, separate now from later, and obtain phase approval. A specific asset, refinement, export or update stays on the direct path without a forced tutorial. If ambiguous, ask which path the user wants; \"skip the plan\" selects direct work. SpriteShip provides and integrates an art pack, not automatic gameplay, level design, navigation, map editing, or runtime certification. Every paid call still needs its own exact dry-run quote and approval; approving a plan is not spending approval.\n\nPERMISSIONS: before promising generation, use whoami when available and check for credits:spend. If a required scope is missing, explain that the current key still supports its granted read/free operations but cannot be upgraded. Give the user the setupUrl returned by SCOPE_MISSING, tell them to create a replacement key with the required permission, replace it only in private MCP settings, reconnect, and verify again. Never ask them to paste a key into chat or reinstall the skill.\n\nSPENDING: tools marked PAID cost the user real money. They default to dryRun:true, which returns a cost quote and generates nothing. Never pass dryRun:false until you have shown the user estimatedCredits from a dryRun call and they have approved that specific amount in this conversation. Ask a normal confirmation question: prefer the client native question UI with Approve / Decline / Discuss choices when available, otherwise accept any unambiguous conversational approval. Never require the user to type a fixed phrase, magic word, or repeat the amount. A request to \"generate something\" starts that approval flow — it is not itself approval.\n\nWORKING WITH RESULTS: binary URLs are presigned and expire in about an hour — download them immediately, and never store or commit one. Characters and UI packs change-track via the opaque contentVersion token (compare for equality only); projects, assets and maps use updatedAt. For UI packs use the downloaded archive token and saved engine/selection in plan_sync; keep the existing local folder. UI requests use UI Pack tools directly, not character creation. Read the project style guide first; adopting its changes into an existing pack is explicit and never regenerates saved art. Packs provide artwork/components, not game logic or UI placement in Game Preview. Most write tools return a jobId to poll with get_job; generate_pose has no job and is polled with list_character_poses instead. Generations take minutes, not seconds. For a character animation job, status:\"done\" is pipeline completion only: follow its animationQualityGate to get_character and do not export, sync, or claim readiness until every affected animation is ready or you have reported the unresolved review to the user.\n\nPrefer the free tools where they do the job: frame curation, duplicating an animation, and promoting a pose to a still are no-AI operations that never touch the ledger.",
      "tools": [
        {
          "name": "animate_asset",
          "title": "Animate an asset",
          "description": "PAID (image-to-video; Wan 3.0 costs 150 credits/second, so each default 2-second pair is 300 credits; total cost scales with duration × pair count). Animate ANY asset type — the animation lands on the source asset and its still image is preserved. For grid assets (tileset/staged) pass pairs of tile indices; a self-loop { from: n, to: n } makes one tile loop seamlessly. ASK THE USER WHICH STAGES FIRST. Call get_asset, describe the tiles you can see, and get an explicit answer on which is the START and which is the END before you spend. \"Animate the treasure box\" does not tell you whether they mean closed→open, open→closed, or the lid alone, and guessing wrong bills them for a clip they cannot use. The server rejects a grid animate with no pairs (400) precisely so that this choice is always made deliberately — do not satisfy it by defaulting to 0→last. Confirmed background-removal provider failures already fall back automatically on the server, without a new user charge. There is no daily removal retry lockout; honor reported cooldowns and unknown-task safeguards if recovery still fails. For already-authorized generation, automatically execute a zero-credit recovery quote and poll it; no renewed approval or refund. Never duplicate a running recovery. Limit automatic retries to two per failed job per session; stop on recurring failure or any paid quote. DEFAULTS TO A COST PREVIEW — see the dryRun argument. Returns { jobId } — poll get_job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assetId": {
                "description": "Asset id or slug.",
                "type": "string"
              },
              "closeLoop": {
                "description": "Single-image assets — reuse the start frame as the end frame so the clip loops.",
                "type": "boolean"
              },
              "dryRun": {
                "default": true,
                "description": "DEFAULTS TO TRUE. While true this returns only a cost quote ({ estimatedCredits, balance, spendCapDaily, spentLast24h, capRemaining }) and executes nothing. Show the user estimatedCredits, then ask a normal confirmation question. Prefer the client's native question UI with Approve / Decline / Discuss choices when available; otherwise accept any unambiguous conversational approval. Never require a fixed phrase or ask the user to type a magic word. Only after approval, re-call with dryRun:false to actually spend.",
                "type": "boolean"
              },
              "durationSeconds": {
                "description": "Clip length, clamped server-side to 2-10s.",
                "maximum": 10,
                "minimum": 2,
                "type": "number"
              },
              "idempotencyKey": {
                "description": "Optional Idempotency-Key for the real (dryRun:false) call. Omit and one is minted per call. Reuse the SAME value when retrying a call that failed with ENTITY_BUSY / 402 / 429 so the retry cannot double-dispatch.",
                "minLength": 1,
                "type": "string"
              },
              "iterationId": {
                "description": "Revision (iteration) id to animate.",
                "type": "string"
              },
              "motionHint": {
                "description": "Extra motion guidance folded into the prompt.",
                "type": "string"
              },
              "pairs": {
                "description": "Grid assets only — which tile transitions to animate. Omit for single-image assets.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "from": {
                      "description": "Start tile index.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "to": {
                      "anyOf": [
                        {
                          "minimum": 0,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "End tile index, or null for prompt-driven motion."
                    }
                  },
                  "required": ["from", "to"],
                  "type": "object"
                },
                "type": "array"
              },
              "videoModel": {
                "description": "Override the video model.",
                "type": "string"
              }
            },
            "required": ["assetId", "iterationId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Animate an asset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:035a898cd6f83b67e9f660a906a8a5aec6919efc10c8c197e64a312807982cbc"
        },
        {
          "name": "approve_automatic_pose_fallback",
          "title": "Approve an automatic pose decision",
          "description": "Successful automatic poses now continue without review, including imports. Four-direction setup stays automatic and eight-direction keeps its existing selection. Imported generation preserves source rendering rather than project style. Use this tool only when get_job returns a pending automaticPoseFallback. If poseReview is present, this is a historical imported-pose checkpoint from an earlier flow: show originalUrl and poseUrl side by side and ask the user to check style, complete head/body and unwanted ground/scenery. Submit choice=\"generated\" only after they accept that exact pose, or choice=\"original\" to use their original character; include poseVersion from poseReview.version. Use cancel_job to cancel. Without poseReview, pose creation failed: ask whether to continue with the default pose or cancel, and use choice=\"original\" to continue. Never approve automatically. Both choices resume the original approved animation request at normal video cost. Accepted generated poses are reused without another review until regenerated.",
