                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "playerCharacterId": {
                "type": "string"
              },
              "projectId": {
                "type": "string"
              },
              "startMapId": {
                "type": "string"
              }
            },
            "required": ["engine", "expectedVersion", "playerCharacterId", "projectId", "startMapId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Build complete game project"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:422498276caae4cc154d3df302fd8d3f20b7b57a690ad070e83031a777f0c10c"
        },
        {
          "name": "suggest_motion_hint",
          "title": "Suggest a motion hint for a staged asset",
          "description": "PAID but very cheap (one configured text-model call) and SYNCHRONOUS — returns { hint, cost } inline, no jobId. Reads a STAGED asset's prompt plus the stage pairs you intend to animate and writes the one-sentence motion description to pass as animate_asset's motionHint. Use it when you are about to spend 300 credits on a default video and are unsure what to write: a few credits here protects that spend. Object States assets only — any other type answers 400.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assetId": {
                "description": "Object States asset id or slug.",
                "type": "string"
              },
              "dryRun": {
                "default": true,
                "description": "DEFAULTS TO TRUE. While true this returns only a cost quote ({ estimatedCredits, balance, spendCapDaily, spentLast24h, capRemaining }) and executes nothing. Show the user estimatedCredits, then ask a normal confirmation question. Prefer the client's native question UI with Approve / Decline / Discuss choices when available; otherwise accept any unambiguous conversational approval. Never require a fixed phrase or ask the user to type a magic word. Only after approval, re-call with dryRun:false to actually spend.",
                "type": "boolean"
              },
              "idempotencyKey": {
                "description": "Optional Idempotency-Key for the real (dryRun:false) call. Omit and one is minted per call. Reuse the SAME value when retrying a call that failed with ENTITY_BUSY / 402 / 429 so the retry cannot double-dispatch.",
                "minLength": 1,
                "type": "string"
              },
              "pairs": {
                "description": "The stage transitions you plan to animate — context for the hint, nothing is generated from them.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "from": {
                      "description": "Start stage index.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "to": {
                      "anyOf": [
                        {
                          "minimum": 0,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "End stage index, or null for open-ended motion."
                    }
                  },
                  "required": ["from", "to"],
                  "type": "object"
                },
                "maxItems": 32,
                "type": "array"
              }
            },
            "required": ["assetId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Suggest a motion hint for a staged asset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5913589121958bd8fab8777da304b1d09f1c3288e040b5b512a9fa5dcd1937a2"
