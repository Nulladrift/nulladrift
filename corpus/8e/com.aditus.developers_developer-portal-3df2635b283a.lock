        {
          "name": "list_modules",
          "title": "List API modules",
          "description": "All top-level ADITUS API modules with direction (inbound = your systems call ADITUS, outbound = ADITUS data into your systems), endpoint counts and documentation URLs. Also lists the integration guides.",
