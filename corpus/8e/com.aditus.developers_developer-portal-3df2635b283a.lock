      "serverInfo": {
        "name": "aditus-developer-docs",
        "title": "ADITUS Developer Documentation",
        "version": "1.0.0",
        "websiteUrl": "https://developers.aditus.com/mcp",
        "icons": [
          {
            "src": "https://developers.aditus.com/icon-512.png",
