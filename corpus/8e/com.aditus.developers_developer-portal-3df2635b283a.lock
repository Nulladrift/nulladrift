            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only documentation for the ADITUS event-technology APIs (ticketing, registration, access, accreditation, Business Intelligence) and the Shop Micro Frontend.\nStart with search_docs for a topic, list_modules for orientation, then get_endpoint for the full contract (parameters, body, example responses) or get_guide for integration guides.\nShop Micro Frontend: 'micro-frontend' is the compact contract for coding agents, 'micro-frontend-docs' the complete human documentation, 'micro-frontend-overview' the non-technical overview (what it is, purchase flow, base setup, add-on levels) for questions from non-developers.\nAPI hosts are per customer: request examples use the {{API_BASE_URL}} placeholder; never invent a hostname.\nADITUS also offers an MCP server over the ADITUS API itself (a customer's own event data). That server is NOT this one: it requires an API client for the customer system; customers arrange it with their ADITUS Customer Success Manager. This documentation server is public, read-only and needs no credentials.",
      "tools": [
        {
          "name": "get_endpoint",
          "title": "Get endpoint details",
          "description": "Full contract of one endpoint: method, URL, auth, query and header parameters, request body example, example responses (large bodies truncated, full text on the docs page). Accepts the endpoint id from search/list, or 'METHOD /path'. Path parameters may use any name or spelling (':cart', '{cartId}', a concrete value); a leading '/api' or '/v1' is ignored. Some routes are recorded several times with different query parameters: a reference without query string resolves to the recording without query parameters, a reference with a query string (e.g. '?$expand=All') to the recording with exactly (or at least) those keys. If that still leaves several recordings, the result is { ambiguous: true, candidates: [{ id, name, method, path }] } instead of the contract — call again with one of the candidate ids. When nothing matches, the error lists the nearest endpoints of that method.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "endpoint": {
                "description": "Endpoint id (e.g. 'ticket-purchase-registration/cart/create-cart') or 'POST /api/shop/cart'",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:02782fae3dbcf87c58b88bef9e4e7de58b3ba19e159b427d5db152b233aee5de"
        },
        {
          "name": "get_guide",
          "title": "Get an integration guide",
          "description": "Markdown of an integration guide. 'micro-frontend' is the compact Shop Micro Frontend contract for coding agents (mounting, sessions, styling, Web Component, lifecycle, security); 'micro-frontend-docs' is the complete Micro Frontend documentation as on the website; 'micro-frontend-overview' is the non-technical overview (what it is, purchase flow, base setup, add-on levels); module guides such as 'guidelines' or 'webhooks' come from the API reference. Pass a section heading to fetch only that section.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "guide": {
                "description": "Guide id, e.g. 'micro-frontend', 'micro-frontend-docs', 'micro-frontend-overview', 'guidelines', 'webhooks'",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "section": {
                "description": "Optional section heading (or slug) to return only that part",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["guide"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d29d6f7697094b3bd0150440d65bef3a7afe96cfcc74283eefa949273a3bd018"
        },
        {
          "name": "list_endpoints",
          "title": "List endpoints of a module",
          "description": "Every endpoint of one module (id, method, path, sub-group, one-line summary). Use the module id from list_modules.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "module": {
                "description": "Module id, e.g. 'ticket-purchase-registration'",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["module"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
