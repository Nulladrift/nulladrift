      "instructions": "MCP server for retrospectives and planning poker. Tool names follow the domain.scope.action convention (for example, retro.teams.list, poker.games.list). API tokens can be scoped to specific teams — if your token is team-scoped, only data from those teams is accessible. Start with retro.teams.list to discover available teams.\n\nRetrospectives: retro.boards.list shows completed and ongoing boards. For each board you can call retro.board.messages.list, retro.board.summary.get, retro.board.actions.list, retro.board.insights.list, retro.board.health.get, and retro.board.roti.get. Use retro.boards.search to find retrospectives by keyword. retro.team.members.list gives the team roster — take user IDs from it for the assign_to argument. With write scope you can use retro.actions.create, retro.actions.update, retro.actions.complete, retro.board.messages.update, and retro.board.messages.delete_own.\n\nWorking through a board: read it with retro.board.messages.list and retro.board.summary.get, then call retro.board.insights.list — its suggested_actions with status \"pending\" are the system's proposals. Turn the ones the team agrees on into real action items with retro.board.suggested_actions.promote (it keeps the wording and the link to the cluster, so do not retype them through retro.actions.create), and drop the rest with retro.board.suggested_actions.reject. Both need the team owner, an admin, a facilitator or the board creator, as in the interface.\n\nPlanning poker: poker.sources.list tells which issue trackers a team has connected and what each can do — call it before anything that touches Jira or Linear. To prepare a session: poker.iterations.list to find a sprint, poker.games.create to open a game, poker.game.tasks.import to pull the sprint tasks into it (or poker.game.tasks.add for tasks that live outside a tracker). Give participants the url returned by the game tools. During the session: poker.game.task.select, then poker.game.task.reveal once people have voted, then poker.game.task.sync to write the estimate back to the tracker. Estimates come only from revealed votes — there is no tool to set a number directly, and no tool to vote on behalf of the client. Every poker tool that changes a game requires the caller to be the team owner or an admin.",
      "tools": [
        {
          "name": "poker.game.get",
          "title": "Get Poker Game Tool",
          "description": "Returns one planning poker game: its estimation scale, progress, the task currently on the table and the link participants use to join. Use poker.game.tasks.list for the tasks themselves.",
          "inputSchema": {
            "properties": {
              "game_id": {
                "description": "The ID of the poker game.",
                "type": "string"
              }
            },
            "required": ["game_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get Poker Game Tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:800079cd61fb5ccf60b5a28483f50f8bab163f0064646766e2538676545268ed"
        },
        {
          "name": "poker.game.task.reveal",
          "title": "Reveal Poker Task Tool",
          "description": "Reveals the cards of a task and computes its estimate from the votes cast — this is the only way an estimate appears, there is no way to set a number directly. Pass reveal=false to hide the cards again and drop the estimate, which also clears the votes for a re-vote. Only the team owner or an admin can change a game. Requires mcp:write scope.",
          "inputSchema": {
            "properties": {
              "game_id": {
                "description": "The ID of the poker game.",
                "type": "string"
              },
              "reveal": {
                "description": "true (default) — reveal the cards and compute the estimate. false — hide them, clear the votes and the estimate.",
                "type": "boolean"
              },
              "task_id": {
                "description": "The ID of the task to reveal.",
                "type": "string"
              }
            },
            "required": ["game_id", "task_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "title": "Reveal Poker Task Tool"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:615314a51c6ca6abff2352d7694b2e18ea2eaf1d8d1f3bd1f224a464b2963da4"
        },
        {
