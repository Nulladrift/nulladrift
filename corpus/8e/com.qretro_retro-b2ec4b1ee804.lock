        {
          "name": "retro.board.messages.list",
          "title": "Get Board Messages Tool",
          "description": "Returns all participant messages (cards) for a retrospective board, organized by template columns (e.g. \"What went well\", \"What didn't go well\"). Includes text, sentiment, category, grouping, and vote counts.",
