          "inputSchema": {
            "properties": {
              "game_id": {
                "description": "The ID of the poker game.",
                "type": "string"
              },
              "task_id": {
                "description": "The ID of the task whose estimate goes to the tracker — see needs_sync in poker.game.tasks.list.",
                "type": "string"
              }
            },
            "required": ["game_id", "task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
