        {
          "name": "poker.game.tasks.import",
          "title": "Import Poker Tasks Tool",
          "description": "Pulls tasks from a connected issue tracker into a poker game. Give it either iteration_ref from poker.iterations.list to take a whole sprint, or query to search by text and issue key. Tasks already in the game are skipped. Only the team owner or an admin can change a game. Requires mcp:write scope.",
          "inputSchema": {
            "properties": {
              "game_id": {
                "description": "The ID of the poker game to import into.",
                "type": "string"
              },
              "iteration_ref": {
                "description": "The ref of an iteration from poker.iterations.list — imports every task of that sprint.",
                "type": "string"
              },
              "limit": {
                "description": "How many tasks to pull at most. Default: 50, maximum: 100.",
                "type": "integer"
              },
              "query": {
                "description": "Text or issue key to search for, when importing without an iteration.",
                "type": "string"
              },
              "source": {
                "description": "Tracker to import from, for example jira. Required only when the team has several trackers connected.",
                "type": "string"
              }
            },
            "required": ["game_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "title": "Import Poker Tasks Tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d87cb2992ca684c717e84b85664a3a33e3f889a99834803f20bb492ff7e58a53"
        },
