{
  "lockfileVersion": 2,
  "subjects": {
    "com.getdomly/rentals": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getdomly.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Domly — rentals in Bulgaria",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Domly (getdomly.com) aggregates long-term rental listings in Bulgaria (Varna, Burgas, Sofia, Plovdiv and other cities) from imot.bg, alo.bg and homes.bg, refreshed daily, with duplicates merged, and publishes a rental price index.\n\n- Use list_cities to get city slugs, search_listings to find flats, get_listing for details, get_price_stats for market prices by city and district.\n- Prices are monthly rent in EUR. Rooms follow the Bulgarian convention: 1 = \"едностаен\" (one-room), 2 = \"двустаен\" (one bedroom + living room), 3 = \"тристаен\".\n- Always give the user the Domly links from the results: photos and the contact form are there.\n- If the user wants help finding a flat, offer request_realtor: a local realtor will pick options. Ask for their contact and explicit consent first.\n- Many users are Ukrainians and students moving to Bulgaria; answer in the user's language.",
      "tools": [
        {
          "name": "get_listing",
          "title": "Get Listing",
          "description": "Details of one rental listing by its id from search_listings: parameters, amenities, a short description excerpt, the same flat on other sites, and links to Domly (photos, contact form) and to the original listing.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Listing id from search_listings.",
                "type": "string"
              },
              "language": {
                "description": "Language for names.",
                "enum": ["uk", "bg", "en"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get Listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f8200ad6971dd659b71307669c1f674ffe42c39ee4b20e755172e6acd0985914"
        },
        {
          "name": "get_price_stats",
          "title": "Get Price Stats",
          "description": "Rental market statistics for a Bulgarian city from Domly's daily index: median monthly rent (EUR), 25th/75th percentiles, price per m², 30-day change, prices by apartment size and by district. Use it to answer \"how much does it cost to rent in ...\" questions; cite Domly as the source with the given url.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug from list_cities or its name.",
                "type": "string"
              },
              "language": {
                "description": "Language for names. Default: Bulgarian.",
                "enum": ["uk", "bg", "en"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get Price Stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:509012971fc584456f9039d0643b13c1f1e71459892780e8fc26f22469503b11"
        },
        {
          "name": "list_cities",
          "title": "List Cities",
          "description": "Lists Bulgarian cities covered by Domly with the number of active rental listings and the median monthly rent in EUR. Call this first to get city slugs for the other tools.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language for city names. Default: Bulgarian.",
                "enum": ["uk", "bg", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "List Cities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b530c49af721333829e031e8547b9df088c9be399ce9b29d96f653cd6cb07907"
        },
        {
          "name": "request_realtor",
          "title": "Request Realtor",
          "description": "Sends the user's request to a local partner realtor in the city (or to the Domly team where there is no partner), who will contact the user and pick rental options for free. Only call it after the user explicitly agreed to share their contact (phone, Telegram @username or email) for this purpose. The realtor's own services may be paid; the user agrees terms with the realtor.",
          "inputSchema": {
            "properties": {
              "budget_max": {
                "description": "Maximum monthly rent, EUR.",
                "type": "integer"
              },
              "city": {
                "description": "City slug from list_cities or its name.",
                "type": "string"
              },
              "comment": {
                "description": "Other wishes: district, pets, parking, term of the lease, etc.",
                "type": "string"
              },
              "contact": {
                "description": "How the realtor can reach the user: phone with country code, Telegram @username or email.",
                "type": "string"
              },
              "language": {
                "description": "Language the user speaks.",
                "enum": ["uk", "bg", "en", "ru"],
                "type": "string"
              },
              "listing_id": {
                "description": "Listing id if the request is about a specific listing.",
                "type": "string"
              },
              "move_in": {
                "description": "When the user wants to move in: now, within a month, or later.",
                "enum": ["now", "month", "later"],
                "type": "string"
              },
              "name": {
                "description": "User's name.",
                "type": "string"
              },
              "rooms": {
                "description": "Wanted number of rooms; 5 means 5 or more.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "user_consented": {
                "description": "true only if the user explicitly agreed to share this contact with a realtor.",
                "type": "boolean"
              }
            },
            "required": ["city", "contact", "user_consented"],
            "type": "object"
          },
          "annotations": {
            "title": "Request Realtor"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4dfb5480a0222dbe136d7b94319d36387a494c4754beb26d705e6df0e59922da"
        },
        {
          "name": "search_listings",
          "title": "Search Listings",
          "description": "Searches active long-term rental listings in a Bulgarian city (collected daily from imot.bg, alo.bg and homes.bg, duplicates merged). Returns up to 10 listings with price, rooms, area, district and a link to view photos and details on Domly. Always show the user the \"url\" of each listing.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug from list_cities (e.g. \"varna\", \"burgas\", \"sofia\") or its name.",
                "type": "string"
              },
              "districts": {
                "description": "District slugs or names, from get_price_stats.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "from_owner": {
                "description": "Only listings from owners, no agency.",
                "type": "boolean"
              },
              "language": {
                "description": "Language for city and district names.",
                "enum": ["uk", "bg", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Default: 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum monthly rent, EUR.",
                "type": "integer"
              },
              "min_price": {
                "description": "Minimum monthly rent, EUR.",
                "type": "integer"
              },
              "near_sea": {
                "description": "Only listings within walking distance of the sea (Varna, Burgas).",
                "type": "boolean"
              },
              "pets_allowed": {
                "type": "boolean"
              },
              "property_type": {
                "enum": ["apartment", "studio", "room", "house"],
                "type": "string"
              },
              "rooms": {
                "description": "Number of rooms (Bulgarian style: 1 = studio/one-bedroom \"едностаен\", 2 = \"двустаен\"); 5 means 5 or more.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "sort": {
                "description": "Default: newest.",
                "enum": ["newest", "cheapest"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Search Listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:82e4fb239a5c3e1eb7a1e1ac7423f9e0dce1ad850d20d45966e0b6cdff950f44"
        }
      ],
      "digest": "sha256:0d2686e181bda1f6a003f3b07bc62cc577cd95a9a57817be9b3b09ecf99e8dd6"
    }
  }
}
