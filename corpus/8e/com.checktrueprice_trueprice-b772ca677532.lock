{
  "lockfileVersion": 2,
  "subjects": {
    "com.checktrueprice/trueprice": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://checktrueprice.com/api/mcp/shopping"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "trueprice",
        "title": "Trueprice",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Price history for products at 145,000+ stores and coupon codes that Trueprice's AI shopping agents tested in a real cart. Daily history starts 2026-11-13. Earlier prices appear only as labelled archived snapshots (Wayback Machine, since 2025-01) in `archived`, never mixed into the daily points, stats or deal score.",
      "tools": [
        {
          "name": "cheapest_path",
          "title": "Cheapest way to buy",
          "description": "The cheapest way to buy a product Trueprice tracks (same as POST /api/v1/prices/optimize): the exact steps (sale, each code, shipping, tax, rewards) with each step's amount, source_id (the code's deals id or the product URL), confidence and checked_at, then checkout_total = items − eligible discounts + shipping + tax (tax only with user.taxRate), effective_cost after rewards (null without one), codes rejected and why (not stackable, minimum not met, new customers only, expired), assumptions, and snapshot_id: the purchase_paths row that reproduces every number. Maths is deterministic code, never a model; ranking never follows commission. Pass a product URL, or domain + handle, or your own offers/coupons/rewards. path is null when nothing is buyable.",
          "inputSchema": {
            "properties": {
              "coupons": {
                "description": "{code, store, kind: percent|fixed|ship_percent|ship_fixed, value, min_spend?, stackable?, new_customer_only?, expires_at?}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "domain": {
                "type": "string"
              },
              "handle": {
                "type": "string"
              },
              "offers": {
                "description": "Your own offers: {store, url, price, checked_at, compare_at?, currency?, shipping?, available?, kind?, ref?}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "rewards": {
                "description": "{source, kind: percent|fixed, value, checked_at, store?, cap?, min_spend?}",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "description": "Product page URL (a tracked Shopify store or any store page Trueprice tracks)",
                "type": "string"
              },
              "user": {
                "properties": {
                  "firstOrder": {
                    "type": "boolean"
                  },
                  "region": {
                    "type": "string"
                  },
                  "taxRate": {
                    "description": "0.0625 = 6.25%",
                    "type": "number"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cheapest way to buy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d747ad98aa3e37bf139695126b41746fba49bcc192355de41d9939351a041030"
        },
        {
          "name": "find_products",
          "title": "Product Finder",
          "description": "Filter every product Trueprice tracks across its Shopify stores, like the Product Finder at /product-finder (same filters, same results as GET /api/v1/finder). Drops are % below the product's highest in-stock price in the last 7 or 30 days (daily history starts 2026-11-13). new_days = listed by the store within N days (first seen after Trueprice's first read of that store). One currency at a time (default USD). Sorts: drop (dropped products first, biggest drop first), new (new listings first), price (lowest first), rating (best rated first), reviews (most reviewed first), rank (each product type's cheapest in-stock products first). Each row has rating + reviews from the store's review app and type_rank (#rank cheapest of `of` in-stock products of its product_type and currency). 20 results a page; each has a url to its Trueprice price-history page.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand (Shopify vendor), exact, any case",
                "type": "string"
              },
              "currency": {
                "description": "ISO currency, default USD",
                "type": "string"
              },
              "drop_30d": {
                "description": "Minimum % drop over 30 days (1-100)",
                "type": "number"
              },
              "drop_7d": {
                "description": "Minimum % drop over 7 days (1-100)",
                "type": "number"
              },
              "has_code": {
                "description": "Only stores with a checked promo code",
                "type": "boolean"
              },
              "in_stock": {
                "type": "boolean"
              },
              "max_price": {
                "type": "number"
              },
              "min_price": {
                "type": "number"
              },
              "min_rating": {
                "description": "Minimum star rating from the store's review app",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "min_reviews": {
                "description": "Minimum number of reviews",
                "minimum": 1,
                "type": "integer"
              },
              "new_days": {
                "description": "Only products newly listed in the last N days",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "product_type": {
                "description": "Shopify product type, exact, any case",
                "type": "string"
              },
              "query": {
                "description": "Words that must all be in the title",
                "type": "string"
              },
              "sort": {
                "default": "drop",
                "enum": ["drop", "new", "price", "rating", "reviews", "rank"],
                "type": "string"
              },
              "store": {
                "description": "Store domain, e.g. example.com",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Product Finder"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7db4b0db9400c8041add630dbfb0d8a80cdf998555dbc13e87d2b532bd4e163"
        },
        {
          "name": "find_store",
          "title": "Store by brand name",
          "description": "Store domains for a brand or site name (e.g. \"Nike\", \"allbirds\"): `with_codes` = domains with promo codes a real cart accepted (count in working_codes; read them with store_codes), `tracked_prices` = domains whose product prices Trueprice reads daily (product count). Empty lists mean Trueprice doesn't cover that brand yet.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Brand, store name or domain",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Store by brand name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:15178b1eeaf0393600f8fed4f76fa7879bbe6233503d761fa7e96fe781bcc5b8"
        },
        {
          "name": "lookup_gtin",
          "title": "Same product by barcode",
          "description": "Every tracked Shopify listing with this barcode (GTIN / UPC / EAN), across stores: domain, handle, title, price and stock of that option, and its Trueprice URL. Barcodes come from the stores' own product data; coverage grows as products are read.",
          "inputSchema": {
            "properties": {
              "gtin": {
                "description": "8, 12, 13 or 14 digits (UPC-A, EAN-13, GTIN-14)",
                "type": "string"
              }
            },
            "required": ["gtin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Same product by barcode"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63bb6386839598e8c5d1c1cc88067dbfc6ebd07ac02ece2277f63bdeb72b5f4c"
        },
        {
          "name": "lookup_price",
          "title": "Price history for a product URL",
          "description": "True price (the lowest price the product really sold at that we know of, from daily checks and archived snapshots: `true_price`), price history, deal score, checked promo code and product spec (description, tags, options, SKUs, weights, images) for a product page URL of a Shopify store Trueprice tracks (e.g. https://example.com/products/blue-mug). History (`points`) starts the day Trueprice first read the product; `archived` holds earlier prices from archived copies of the store's page (Wayback Machine, since 2025-01), labelled \"archived snapshot\": snapshots, not daily checks, and not used in the stats or deal score.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The product page URL; a ?variant=<id> in it returns that option's own history",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price history for a product URL"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:118cbd5bd6b133bca8b15cad185de51971b6eb32bfb7f708d864416f36505e82"
        },
        {
          "name": "product_history",
          "title": "Product price history",
          "description": "True price (`true_price`: lowest price it really sold at, from daily checks and archived snapshots), Stats per 30/90/180/365-day and all-time window (`stats.windows`: low/high with dates, average, price at window start, out-of-stock %, drop count, is_lowest, last_price_change), star rating and review count with history (`rating`), reviews from the store's review app (`reviews`: rating, count, star histogram, 3 recent reviews, Q&A, what reviewers mention), category rank among same-type products across stores (`category_rank`: #cheapest of N in stock, 30-day drop rank), units in stock per option (`stock`: qty, null = not limited, with its change history; `variants[].stock`), live price, every recorded price change, archived snapshots from before tracking began (`archived`, labelled \"archived snapshot\", not used in stats or score), 30/90-day and all-time low/average/high, deal score, checked promo code and product spec (description, tags, options, SKUs, weights, images) for one product.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Store domain, e.g. example.com",
                "type": "string"
              },
              "handle": {
                "description": "Shopify product handle",
                "type": "string"
              },
              "variant": {
                "description": "Optional option (variant) id from `variants[].id`: that size/colour's own price history",
                "type": "string"
              }
            },
            "required": ["domain", "handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Product price history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:82d72d8066e8694c98c485ba8f9de6211109e6767fc7847ef321e612f7ffd3ec"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Find products by title words across every store Trueprice tracks. Returns store domain and handle for product_history.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:30de5089c37564b3c4554811bb543a3e0f78b3c8261fb32e1f82294b384d35fa"
        },
        {
          "name": "store_codes",
          "title": "Checked promo codes",
          "description": "Promo codes for a store that Trueprice applied in a real cart and the store accepted.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Store domain, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Checked promo codes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7eb04c6538e092d8f15884c967bf5cd647b2ed2654f6845a540aae95d3ebe43a"
        }
      ],
      "digest": "sha256:85d0a51847be7e3e85e9d0f0d5cb1a488a5f15834a237989a7a421cdcdf48804"
    }
  }
}
