{
  "lockfileVersion": 2,
  "subjects": {
    "com.ryufin/stocks": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ryufin.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ryufin",
        "title": "Ryufin",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ryufin serves figures for 3,000+ US-listed stocks straight from SEC filings and end-of-day prices: price, market value, P/E, returns, the company's own description, its reported financial history and its current reports. It does not grade, score or rate stocks. Start with search_stocks when you only have a company name, then get_stock_overview, get_financial_history or get_company_news. Quote the numbers as given and cite the page URL. Research data, not investment advice.",
      "tools": [
        {
          "name": "get_company_news",
          "title": "What the company told the SEC",
          "description": "The company's own recent current reports (8-K), newest first: the date, what kind of event, the company's own sentence and a link to the filing on sec.gov.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "ticker": {
                "description": "US ticker symbol, e.g. NVDA or BRK-B",
                "pattern": "^[A-Za-z0-9.-]{1,10}$",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b93e2ae9379fa854570979183952c0adf2f02e77f91ce9310bdf9418916c4f1"
        },
        {
          "name": "get_financial_history",
          "title": "Reported figures over time",
          "description": "A reported financial series for one stock from its SEC filings, trailing twelve months or single quarters, newest last. Metrics: pe, revenue, net_income, eps, gross_margin, op_margin, net_margin, roe, roa, roic, fcf.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "metric": {
                "enum": ["pe", "revenue", "net_income", "eps", "gross_margin", "op_margin", "net_margin", "roe", "roa", "roic", "fcf"],
                "type": "string"
              },
              "periods": {
                "default": 12,
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "ticker": {
                "description": "US ticker symbol, e.g. NVDA or BRK-B",
                "pattern": "^[A-Za-z0-9.-]{1,10}$",
                "type": "string"
              },
              "view": {
                "default": "ttm",
                "enum": ["ttm", "quarterly"],
                "type": "string"
              }
            },
            "required": ["metric", "ticker"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5af3f986ad45a1498a26d3d968f783964b4775ec0dc577c6ab8d29464c199092"
        },
        {
          "name": "get_stock_overview",
          "title": "Stock overview",
          "description": "Price, market value, P/E, returns, sector and what the company says it does, verbatim from its latest annual report.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "US ticker symbol, e.g. NVDA or BRK-B",
                "pattern": "^[A-Za-z0-9.-]{1,10}$",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e33290e9ba6fdfcac9ce27c2febaf7c35db0cb1399350dd279548432e2e2aff"
        },
        {
          "name": "search_stocks",
          "title": "Find a stock",
          "description": "Find US-listed companies Ryufin covers by ticker or company name. Returns ticker, name, sector, market value and the Ryufin page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Ticker or part of the company name",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf284c2040e3358fd0ba0beac384d52ee699d2fbf6cc14a464da14d2b13b20b4"
        }
      ],
      "digest": "sha256:144b75ed3980ec0c30e9e5c4e2bf203c312bb48154a0fb41e9b10ebd6ca4e907"
    }
  }
}
