{
  "lockfileVersion": 2,
  "subjects": {
    "com.eltrabajito/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://eltrabajito.com/mcp/public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "eltrabajito-directory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "El Trabajito is a free directory of independent workers and small businesses in Costa Rica, in Spanish and English. This server is read-only. To answer \"who is a good <service> in <place>\", call top_rated (or search_businesses), then get_business_reviews for the ones you recommend. Ratings and reviews come from signed-in users and are not verified by the directory, and the directory does not verify licences or the quality of work: say so when you recommend someone. Always give the profile url so the person can contact them (WhatsApp or phone).",
      "tools": [
        {
          "name": "get_business",
          "description": "Full public profile of one worker or business: about, services, service area, how to contact them (phone, WhatsApp, email, website, social pages), payment methods, rating and a link to the page. Give the slug from search_businesses.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language of the names and links in the answer (default es).",
                "enum": ["es", "en"],
                "type": "string"
              },
              "slug": {
                "description": "The profile slug, exactly as returned by search_businesses or top_rated (for example \"carlos-jimenez\").",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a business"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f9fc2b0100609545233d51c4d523f75e7852ae7bbf8b2c33f05ed9146f33ebcb"
        },
        {
          "name": "get_business_reviews",
          "description": "Customer reviews of one profile, newest first (rating, text, date, first name and initial). Reviews are written by signed-in users; the directory does not verify that the reviewer hired the person.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language of the names and links in the answer (default es).",
                "enum": ["es", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Reviews per page, up to 10 (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page of reviews, newest first, starting at 1 (default 1).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The profile slug, exactly as returned by search_businesses or top_rated (for example \"carlos-jimenez\").",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get reviews"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:46c6d0e221b54a832708c2ee1faf030984f809f91abde1c2875558eba241f78e"
        },
        {
          "name": "list_categories",
          "description": "Every category that has at least one live profile, grouped, with the number of profiles and the slug to use in the other tools.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language of the names and links in the answer (default es).",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b9202de6a955c5c1660d417c4eca165ef19be41a2af1f29a8359ee593f5d7b5"
        },
        {
          "name": "search_businesses",
          "description": "Search the directory of independent workers and small businesses in Costa Rica (gardeners, painters, plumbers, electricians, cleaners, bakers, mechanics and more). Results are ranked by customer rating, then by number of reviews. Pass a free-text query (\"panadera\", \"plumber\"), optionally a category slug from list_categories, a place name, a minimum rating or kind. Always include the profile url when you recommend someone.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug from list_categories, for example \"painting\".",
                "type": "string"
              },
              "kind": {
                "description": "Restrict to individual workers (person) or companies (business). Leave out for both.",
                "enum": ["person", "business"],
                "type": "string"
              },
              "language": {
                "description": "Language of the names and links in the answer (default es).",
                "enum": ["es", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Up to 10 (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "minRating": {
                "description": "Only return profiles whose average rating is at least this many stars (0 to 5). Unrated profiles are excluded when it is above 0. Default 0.",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "place": {
                "description": "Town or area, for example \"Santa Ana\" or \"Heredia\".",
                "type": "string"
              },
              "query": {
                "description": "What the person needs, in Spanish or English.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search businesses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e1a9afa41ca8c02876e571fb4753636a8d46465e078f3cca3211a87c7eb94ac"
        },
        {
          "name": "top_rated",
          "description": "The best-rated profiles in a category, optionally in one area, ranked by average rating and then by number of reviews: the answer to \"who is a good X in Y\". Unrated profiles come last and say so.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug from list_categories.",
                "type": "string"
              },
              "language": {
                "description": "Language of the names and links in the answer (default es).",
                "enum": ["es", "en"],
                "type": "string"
              },
              "limit": {
                "description": "How many profiles to return, up to 10 (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "place": {
                "description": "Area name; only areas with at least three profiles are listed separately, otherwise all of the category is returned.",
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Top rated in a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e228e629a459183d605e17c5d04b3733077c6eeb345ae134ea268940b17f05f6"
        }
      ],
      "digest": "sha256:3c55a7b9ce15c13051fb12cd75ec0b9c2189544670a9cd52fd2913362349a96e"
    }
  }
}
