{
  "lockfileVersion": 2,
  "subjects": {
    "com.fillprompt/fillprompt": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fillprompt.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "fillprompt",
        "title": "fillprompt.com prompts",
        "version": "1.1.0",
        "websiteUrl": "https://fillprompt.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "fillprompt.com is a free library of AI prompts for images, video and text. Browse curated packs at https://fillprompt.com/packs and open-source collections at https://fillprompt.com/sources. Use list_filters for valid models, categories, packs and source keys; search_prompts (or random_prompt) to find candidates — narrow with type, model, category or source (e.g. hodios, samux); get_prompt for the full text and slots. Fill slots with the user's details, link the prompt page, and credit the author/collection.",
      "tools": [
        {
          "name": "get_prompt",
          "title": "Get prompt",
          "description": "Get the full text of one fillprompt.com prompt by its page URL or slug, with its fill-in slots, sample images or video, and credit to the original author. Fill the slots with the user's details before using the prompt, and keep the credit when you share it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ref": {
                "description": "The prompt page URL from search_prompts (e.g. https://fillprompt.com/prompt/...) or its slug.",
                "type": "string"
              },
              "type": {
                "description": "Helps when a bare slug is given.",
                "enum": ["image", "video", "text"],
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58e73a17aedb544f0ca7c9086777d258000394b2654c68b08c597e4c6fa8e80c"
        },
        {
          "name": "list_filters",
          "title": "List filters",
          "description": "List image categories, text types, AI models, open-source collection keys (sources), and curated packs on fillprompt.com, with counts. Pass source/category/model values into search_prompts; open pack or source URLs for browsing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e21c4a416a39438baa8c708c9ac752e16a61979d29538afe3c906a9dc78a428d"
        },
        {
          "name": "random_prompt",
          "title": "Random prompt",
          "description": "Get one fillprompt.com prompt picked at random, in full (the same shape as get_prompt), for requests like \"surprise me\" or \"give me an idea for a poster\" that have no search query. Narrow it with type, model, category or source.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Image category (e.g. \"poster\") or text prompt type (e.g. \"agent\"). See list_filters.",
                "type": "string"
              },
              "model": {
                "description": "Only prompts written for this AI model, e.g. \"Nano Banana\", \"Seedance\", \"Claude\". See list_filters.",
                "type": "string"
              },
              "source": {
                "description": "Only prompts from one open-source collection key (e.g. \"hodios\", \"samux\").",
                "type": "string"
              },
              "type": {
                "description": "Only image, video or text prompts.",
                "enum": ["image", "video", "text"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1fceb670644732043a5a3aa9eb92d467b47fff9e42c70e8249c4ad26b4e54de"
        },
        {
          "name": "search_prompts",
          "title": "Search prompts",
          "description": "Search over 12,961 free, ready-to-copy AI prompts on fillprompt.com: image prompts (GPT Image, Nano Banana, Seedream and more), video prompts (Seedance, Gemini Omni, Grok Imagine and more) and text prompts (system prompts, agent prompts, roles). Returns titles, page URLs and short previews; call get_prompt for the full text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Image category (e.g. \"product-brand\", \"poster\") or text prompt type (e.g. \"agent\", \"developer\"). See list_filters.",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "How many results to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "description": "Only prompts written for this AI model, e.g. \"Nano Banana\", \"Seedance\", \"Claude\". See list_filters.",
                "type": "string"
              },
              "query": {
                "description": "What the prompt should make, in plain words, e.g. \"coffee product photo on marble\" or \"code review agent\".",
                "type": "string"
              },
              "source": {
                "description": "Only prompts from one open-source collection key (e.g. \"hodios\", \"samux\", \"superdesign\"). See list_filters text.sources.",
                "type": "string"
              },
              "type": {
                "description": "Only image, video or text prompts.",
                "enum": ["image", "video", "text"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e57955f5589238da69cc5fa7ca7d7cc07b11d7489b1d82dceefebc5bab704ea"
        }
      ],
      "digest": "sha256:2aa958203baa5fcc931b92020d965b34516fedfcbeaa2f96a284eec02b4f81e4"
    }
  }
}
