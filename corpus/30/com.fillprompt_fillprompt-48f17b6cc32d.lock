{
  "lockfileVersion": 2,
  "subjects": {
    "com.fillprompt/fillprompt": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fillprompt.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "fillprompt",
        "title": "fillprompt.com prompts",
        "version": "1.0.0",
        "websiteUrl": "https://fillprompt.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "fillprompt.com is a free library of AI prompts for images, video and text. Use search_prompts to find candidates (or random_prompt for an idea when there is no query), get_prompt to read one in full, then fill its slots with the user's details. Link the prompt page and credit the author when you share a prompt.",
      "tools": [
        {
          "name": "get_prompt",
          "title": "Get prompt",
          "description": "Get the full text of one fillprompt.com prompt by its page URL or slug, with its fill-in slots, sample images or video, and credit to the original author. Fill the slots with the user's details before using the prompt, and keep the credit when you share it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ref": {
                "description": "The prompt page URL from search_prompts (e.g. https://fillprompt.com/prompt/...) or its slug.",
                "type": "string"
              },
              "type": {
                "description": "Helps when a bare slug is given.",
                "enum": ["image", "video", "text"],
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58e73a17aedb544f0ca7c9086777d258000394b2654c68b08c597e4c6fa8e80c"
        },
        {
          "name": "list_filters",
          "title": "List filters",
          "description": "List the image categories, text prompt types and AI models on fillprompt.com, with how many prompts each has. Use the values with search_prompts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:879bea78d4e990cced0d123a70c72bc3914b9cf4808f91f59540ee5410a191da"
        },
        {
          "name": "random_prompt",
          "title": "Random prompt",
          "description": "Get one fillprompt.com prompt picked at random, in full (the same shape as get_prompt), for requests like \"surprise me\" or \"give me an idea for a poster\" that have no search query. Narrow it with type, model or category.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Image category (e.g. \"poster\") or text prompt type (e.g. \"agent\"). See list_filters.",
                "type": "string"
              },
              "model": {
                "description": "Only prompts written for this AI model, e.g. \"Nano Banana\", \"Seedance\", \"Claude\". See list_filters.",
                "type": "string"
              },
              "type": {
                "description": "Only image, video or text prompts.",
                "enum": ["image", "video", "text"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a833fd1ec739cfdfe12fbf33944382da00b2d2135f30d342c9e0c45cf58d5c37"
        },
        {
          "name": "search_prompts",
          "title": "Search prompts",
          "description": "Search over 7,000 free, ready-to-copy AI prompts on fillprompt.com: image prompts (GPT Image, Nano Banana, Seedream and more), video prompts (Seedance, Grok Imagine) and text prompts (system prompts, agent prompts, roles). Returns titles, page URLs and short previews; call get_prompt for the full text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Image category (e.g. \"product-brand\", \"poster\") or text prompt type (e.g. \"agent\", \"developer\"). See list_filters.",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "How many results to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "description": "Only prompts written for this AI model, e.g. \"Nano Banana\", \"Seedance\", \"Claude\". See list_filters.",
                "type": "string"
              },
              "query": {
                "description": "What the prompt should make, in plain words, e.g. \"coffee product photo on marble\" or \"code review agent\".",
                "type": "string"
              },
              "type": {
                "description": "Only image, video or text prompts.",
                "enum": ["image", "video", "text"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:456207c4ae115ed340d26ae892e56c24f889197b5516276aa5b9bb7954607be4"
        }
      ],
      "digest": "sha256:0531d5f8f5614473427e93c48cf2028de067cff0c59fb5f5ab466bfb90a846e5"
    }
  }
}
