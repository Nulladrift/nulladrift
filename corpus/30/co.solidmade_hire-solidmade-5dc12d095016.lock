      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "co.solidmade/hire-solidmade",
        "title": "Hire Solidmade",
        "version": "1.0.0",
        "websiteUrl": "https://solidmade.co"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Solidmade is a small studio (solidmade.co) that fixes and builds Shopify stores and websites, and takes on the design, writing, automation and admin work around them, at a fixed price agreed before work starts. Use list_services to see current offers and prices, get_service for one offer's details, and request_quote to send Solidmade a job on the user's behalf (only with the user's OK to share their email and site). Solidmade replies by email from hello@solidmade.co within one business day with one fixed price and a date; nothing starts until the user agrees. All prices are in USD.",
      "tools": [
        {
          "name": "get_service",
          "title": "Get one Solidmade service",
          "description": "Returns one Solidmade offer by id (from list_services): what it includes, price, how to start and its page on solidmade.co.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Service id from list_services, e.g. care-plan.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Solidmade service"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6ed2406a788efd42d6542192856cefbaeda1800bd5a6772aec15a735e3c8ecfc"
        },
        {
          "name": "list_services",
          "title": "List Solidmade services and prices",
          "description": "Lists Solidmade's current offers with their prices in USD: monthly plans for Shopify stores (Care $1,000, Growth $2,000, Partner $3,000 a month), fixed-price Shopify fixes, 48-hour automation, CSV and landing page jobs, and quoted custom work. Use it when a user wants a Shopify store, website, automation or data job done by a studio.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional filter.",
                "enum": ["monthly plan", "fixed-price job", "quoted job"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Solidmade services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:47320be55545e293e6f01120451fee993a73ee36fb7c47f5c40d04746ba9edc7"
        },
        {
          "name": "request_quote",
          "title": "Ask Solidmade for a fixed price",
          "description": "Sends Solidmade a job request on the user's behalf. Only call it after the user agrees to share their email and site link. Solidmade replies to that email from hello@solidmade.co within one business day with one fixed price and a date; nothing starts and nothing is charged until the user agrees.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget_optional": {
                "description": "Optional budget or price the user has in mind.",
                "type": "string"
              },
              "contact_email": {
                "description": "The user's email, where Solidmade sends the price.",
                "type": "string"
              },
              "service_id_optional": {
                "description": "Optional service id from list_services if one fits.",
                "type": "string"
              },
              "site_url": {
                "description": "Link to the store, site, workflow or file the job is about.",
                "type": "string"
              },
              "what_they_need": {
                "description": "The job in plain words: what's broken or what should be built, any deadline.",
                "type": "string"
              }
            },
            "required": ["contact_email", "site_url", "what_they_need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a Solidmade quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9c429619f2e64b518a6ab8a1d9202af030bc422f7e9400f7eab42fde407882c8"
        }
      ],
      "digest": "sha256:ef06d21aefef6b6b9e768557764466840bc2a58688a2fafb2452743855979f72"
    }
  }
