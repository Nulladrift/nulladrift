        {
          "name": "calculate_actuarial_pv",
          "title": "Actuarial present value",
          "description": "Actuarial present value engine. Discount expected cash flows with mortality, survival, and risk adjustment for insurance and benefit obligations, generalising IFRS 17 (fulfilment cash flows), IAS 19 (employee benefits), IFRS 2 (share-based payments), and IAS 37 (provisions). Use this for regulated IFRS/HKFRS obligations only; it does NOT do generic project or scenario probability weighting (use calculate_expected_value). Methods: ifrs17_gmm: cash_flows, discount_rate, risk_adjustment; ifrs17_paa: premiums, claims_cash, acquisition_cash_flows, coverage_periods; ifrs17_vfa: cash_flows, discount_rate, underlying_items_return, risk_adjustment; ias19_puc: projected_benefits, discount_rate, attribution_years; ias37_provision: outcomes, probabilities, discount_rate, periods. Supply exactly one method with its declared inputs (no defaults). An unknown method, a missing input, or an extra field returns an error envelope (code INVALID_ARGUMENT) instead of raising.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acquisition_cash_flows": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Acquisition cash flows in reporting currency."
              },
              "attribution_years": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Years of service for attribution (>=1)."
              },
              "cash_flows": {
                "anyOf": [
                  {
                    "items": {},
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Projected cash flows in reporting currency, indexed t=1..n."
              },
              "claims_cash": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Expected claims in reporting currency."
              },
              "coverage_periods": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Coverage periods for the PAA (>=1)."
              },
              "discount_rate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Discount rate as a decimal (0.10 = 10%); pre-tax when method=viu_pre_tax."
              },
              "method": {
                "description": "Formula to apply; the tool description lists the exact inputs each value requires.",
                "enum": ["ifrs17_gmm", "ifrs17_paa", "ifrs17_vfa", "ias19_puc", "ias37_provision"],
                "type": "string"
              },
              "outcomes": {
                "anyOf": [
                  {
                    "items": {},
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Outcome values aligned with probabilities."
              },
              "periods": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Number of periods n (>=1)."
              },
              "premiums": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Premiums in reporting currency."
              },
              "probabilities": {
                "anyOf": [
                  {
                    "items": {},
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Cumulative success probability per period in [0,1], aligned with cash_flows."
              },
              "projected_benefits": {
                "anyOf": [
                  {
                    "items": {},
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Projected benefits per service year."
              },
              "risk_adjustment": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Explicit risk adjustment for non-financial risk."
              },
              "underlying_items_return": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Return on underlying items (decimal)."
              }
            },
            "required": ["method"],
            "type": "object"
          },
