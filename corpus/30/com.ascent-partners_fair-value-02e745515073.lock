              },
              "coupon_rate": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Annual coupon rate (decimal)."
              },
              "credit_spread": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Credit spread over the risk-free rate (decimal)."
              },
              "face": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Bond face value."
              },
              "maturity": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Time to expiry in years (0.5 = six months); > 0."
              },
              "method": {
                "description": "Formula to apply; the tool description lists the exact inputs each value requires.",
                "enum": ["lattice_tsf", "lattice_intensity", "finite_difference", "lsmc", "quantlib"],
                "type": "string"
              },
              "put_schedule": {
                "anyOf": [
                  {
                    "items": {},
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Investor put schedule [{date_years, price}]; pass [] when there is none."
              },
              "rights_priority": {
                "anyOf": [
                  {
                    "enum": ["holder", "issuer"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Which right prevails when call and put coincide."
              },
              "risk_free": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Continuously-compounded risk-free rate (decimal)."
              },
              "spot": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Spot price of the underlying (or FX rate for garman_kohlhagen)."
              },
              "volatility": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Annualized volatility (decimal, 0.30 = 30%); > 0."
              }
            },
            "required": ["method"],
            "type": "object"
          },
          "outputSchema": {
