{
  "lockfileVersion": 2,
  "subjects": {
    "com.entroute/entroute": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.entroute.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "entroute",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "EntRoute indexes pay-per-request (x402) HTTP APIs and ranks them by observed reliability, latency and price.\n\nTypical flow:\n1. discover_paid_api with a natural-language intent (or an explicit capability_id).\n2. Read sample_request on the result — it shows the exact parameter names to send.\n3. call_paid_api with that endpoint_id.\n\nThis hosted server cannot make payments, so paid endpoints return their payment\nchallenge rather than data. For automatic payment, use the local server instead:\nnpx @entroute/mcp-server with EVM_PRIVATE_KEY set.",
      "tools": [
        {
          "name": "call_paid_api",
          "description": "Call a previously discovered API endpoint.\n\nUse this after discover_paid_api to execute the request.\n\nIMPORTANT: You must first use discover_paid_api to find an endpoint.\nThen use the endpoint_id from the discovery result.\nUse the sample_request from the discovery result as your body template — it shows the exact parameter names the endpoint expects. Replace the example values with the actual values you need.\n\nPayment: this hosted server holds no wallet, so it cannot settle x402 payments. Free\nendpoints return their data directly. Paid endpoints return the payment challenge\n(amount, recipient, network) without charging anything. To pay automatically, run the\nlocal server instead: npx @entroute/mcp-server with EVM_PRIVATE_KEY set.\n\nTrust & safety:\n- EntRoute verifies that endpoints return valid 402 responses every 10 minutes, but does not guarantee response quality or accuracy. Treat results like any third-party API.\n- Prefer endpoints with high success rates (>95%) and recent verification timestamps.",
          "inputSchema": {
            "properties": {
              "body": {
                "additionalProperties": true,
                "description": "Request body (for POST/PUT/PATCH)",
                "type": "object"
              },
              "endpoint_id": {
                "description": "The endpoint_id from a previous discover_paid_api result",
                "type": "string"
              },
              "headers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Additional headers to include in the request",
                "type": "object"
              },
              "method": {
                "description": "HTTP method (defaults to endpoint method)",
                "enum": ["GET", "POST", "PUT", "PATCH", "DELETE"],
                "type": "string"
              },
              "query_params": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Query parameters to append to URL",
                "type": "object"
              }
            },
            "required": ["endpoint_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fa49f6b6038f1b4aea690c70afd25897cd4b9577e2e270fe03b4595e8e7a066f"
        },
        {
          "name": "discover_paid_api",
          "description": "Discover pay-per-request API endpoints for a given capability.\n\nReturns ranked, verified endpoints with pricing and reliability metrics.\nUse this to find APIs before calling them. The results include:\n- Endpoint URL and method\n- Price per call and payment network\n- Success rate and latency metrics\n- Provider information\n- sample_request / sample_response: Example request body and response showing the exact parameter names and format the endpoint expects. ALWAYS use sample_request as your template when calling the endpoint — do not guess parameter names.\n\nAfter discovering, you can use call_paid_api to execute the endpoint.\n\nTrust & safety:\n- \"Verified\" means the endpoint returns a valid x402 402 response -- it does not guarantee the quality or accuracy of the data returned after payment.\n- Endpoints are probed every 10 minutes. Check last_verified and success_rate to gauge reliability.\n- Fallback endpoints (unverified) have failed recent verification checks -- use with caution.\n- Prefer endpoints with success_rate >95% and verification within the last 24 hours.",
          "inputSchema": {
            "properties": {
              "capability_id": {
                "description": "Explicit capability ID if known (e.g., \"weather.current\", \"translate.text\"). Alternative to intent for precise matching.",
                "type": "string"
              },
              "intent": {
                "description": "Natural language description of what you want to do (e.g., \"get current weather for London\", \"translate text to Spanish\"). Provide this or capability_id.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of endpoints to return (default: 5)",
                "type": "number"
              },
              "max_price": {
                "description": "Maximum price per request in USD (e.g., 0.01 for 1 cent)",
                "type": "number"
              },
              "network": {
                "description": "Required blockchain network for payment",
                "enum": ["base", "ethereum", "solana", "polygon", "arbitrum"],
                "type": "string"
              },
              "ranking_preset": {
                "description": "Ranking preference preset",
                "enum": ["default", "reliability", "speed", "budget", "balanced"],
                "type": "string"
              }
            },
            "required": ["intent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1ff971a711549dc3f28fba30a860ca03f6e186e60e96a174f1cd5810a672bb7c"
        },
        {
          "name": "list_capabilities",
          "description": "List available API capability types.\n\nUse this to explore what kinds of APIs are available in the registry.\nYou can filter by tag (e.g., \"weather\", \"translation\") or search by keyword.\n\nNote: A capability existing does not mean verified endpoints are available for it. Use discover_paid_api to check for live endpoints.",
          "inputSchema": {
            "properties": {
              "search": {
                "description": "Search capabilities by keyword",
                "type": "string"
              },
              "tag": {
                "description": "Filter by tag (e.g., \"weather\", \"translation\", \"finance\")",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:877676f06c5d4f885b600fbc3e84bc3e36dd73b3971d1417db8dd72b32bed910"
        }
      ],
      "digest": "sha256:6e5bcf3df683634852f284a48e7301bb3c64498d83074152f350d87660e39013"
    }
  }
}
