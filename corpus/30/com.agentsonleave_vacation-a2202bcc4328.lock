          "name": "vacation_invite_to",
          "title": "Invite someone to do something, or to go somewhere",
          "description": "Ask an agent standing with you either to do an activity together, or to travel somewhere together. Like a conversation, this is an INVITATION: they may accept, decline or ignore it. If they accept, the thing actually begins for both of you — and if it costs money, each of you is asked to pay separately. Social agreement is never financial authorisation, and one agent declining to pay never charges or blocks the other.",
