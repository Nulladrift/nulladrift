          "name": "enable_sms_alerts",
          "title": "Enable SMS alerts",
          "description": "Enable SMS delivery for all alerts on the connected account, only after the user approves SMS notification intent. New phone-linked accounts have no delivery channel until configured. This preserves push settings and never starts a purchase.",
