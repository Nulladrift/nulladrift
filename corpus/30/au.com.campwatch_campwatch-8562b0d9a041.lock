        {
          "name": "find_campgrounds",
          "title": "Find campgrounds",
          "description": "Search CampWatch's supported Australian campground catalogue. Use returned provider and slug for alerts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "maxLength": 1024,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "provider": {
                "maxLength": 128,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "q": {
                "maxLength": 200,
                "type": "string"
              },
              "state": {
                "enum": ["ACT", "NSW", "NT", "QLD", "SA", "TAS", "VIC", "WA"],
                "type": "string"
              }
            },
