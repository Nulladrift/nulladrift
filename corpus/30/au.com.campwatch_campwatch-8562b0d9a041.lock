{
  "lockfileVersion": 2,
  "subjects": {
    "au.com.campwatch/campwatch": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.campwatch.com.au/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "campwatch",
        "version": "0.3.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Find Australian campgrounds and manage availability alerts. Availability is a snapshot, never a booking guarantee. Ask the user to approve campground, dates, party size and SMS notification intent before creating alerts. After approval, enable SMS alerts for the account with enable_sms_alerts before creating an SMS alert. This affects all alerts on that account; do not enable without consent. Use only the linked account's existing credits. Explain insufficient entitlements without promoting upgrades, displaying prices or linking to checkout. Purchases and subscriptions are unavailable through these tools. CampWatch does not book campsites. Never request SMS codes or card details in chat; use phone account linking.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check campground availability",
          "description": "Check current availability for a campground, dates and party size. A result is a snapshot; errors do not prove no availability.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adults": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "checkIn": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "$ref": "#/properties/checkIn"
              },
              "children": {
                "default": 0,
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "infants": {
                "default": 0,
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "provider": {
                "maxLength": 128,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "slug": {
                "$ref": "#/properties/provider"
              }
            },
            "required": ["adults", "checkIn", "checkOut", "provider", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "demo": {
                "type": "boolean"
              },
              "notice": {
                "type": "string"
              },
              "result": {}
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:3a8514ea4ab775104a12551e16a111eb5d89331463fa287cea605c091a0da09a"
        },
        {
          "name": "create_alert",
          "title": "Create an availability alert",
          "description": "Create an SMS/push alert after the user approves target, dates and party size. Use a new idempotencyKey for each intended alert; reuse it on retries. Available-now results can consume an alert credit under CampWatch's existing rules.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dates": {
                "additionalProperties": false,
                "properties": {
                  "checkIn": {
                    "minLength": 1,
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "checkOut": {
                    "minLength": 1,
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["checkIn", "checkOut"],
                "type": "object"
              },
              "excludedCampgroundSlugs": {
                "default": [],
                "items": {
                  "maxLength": 128,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "idempotencyKey": {
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "partySize": {
                "additionalProperties": false,
                "properties": {
                  "adults": {
                    "maximum": 10,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "children": {
                    "default": 0,
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "infants": {
                    "default": 0,
                    "maximum": 10,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["adults"],
                "type": "object"
              },
              "siteTypeFilter": {
                "default": [],
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "target": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "kind": {
                        "const": "campground",
                        "type": "string"
                      },
                      "provider": {
                        "default": "nsw",
                        "minLength": 1,
                        "type": "string"
                      },
                      "slug": {
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["kind", "slug"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "kind": {
                        "const": "park",
                        "type": "string"
                      },
                      "parkSlug": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "provider": {
                        "default": "nsw",
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["kind", "parkSlug"],
                    "type": "object"
                  }
                ]
              },
              "watchOptions": {
                "additionalProperties": false,
                "default": {},
                "properties": {
                  "campsiteFilter": {
                    "items": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 40,
                    "type": "array"
                  },
                  "campsiteFilterMode": {
                    "anyOf": [
                      {
                        "enum": ["ANY_NIGHT", "MUST_INCLUDE", "RESTRICT_TO"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "flexibleStartDays": {
                    "maximum": 30,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "startDayFilter": {
                    "anyOf": [
                      {
                        "enum": ["weekend", "weekday"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              }
            },
            "required": ["dates", "idempotencyKey", "partySize", "target"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "demo": {
                "type": "boolean"
              },
              "notice": {
                "type": "string"
              },
              "result": {}
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["alerts:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:86e01a9a732c5359d4db07766543d4692bec4bef3e423c8d196f24696a33832b"
        },
