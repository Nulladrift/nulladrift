                        "type": "integer"
                      },
                      "cap": {
                        "type": "integer"
                      },
                      "expires_at": {
                        "type": "string"
                      },
                      "status": {
                        "enum": ["bound", "unbound"],
                        "type": "string"
                      },
                      "to_bind": {
                        "additionalProperties": true,
                        "properties": {
                          "door": {
                            "type": "string"
                          },
                          "field": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Compact claim-stub reminder. Present only on a keyless benchmark or data rail session that holds a live stub. status is bound after a delivered birth and unbound before it."
              },
              "compute_receipt": {
