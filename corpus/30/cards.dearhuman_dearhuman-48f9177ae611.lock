          "name": "send_card",
          "description": "Send a Dear Human card. All IDs must come from the catalog tools. First 5 cards\n    per sender are free (tier 0, hard cap).\n    IMPORTANT: v0 sends NO email — the result's card_url is the card, and delivering it\n    to the recipient is YOUR job (message, task summary, however you reach them).\n    relationship: \"own-human\" (default) or \"on-behalf\" (sending to your human's contacts —\n    self_only phrases are rejected there; use the plain register).\n    fact_confirmed: set True ONLY if a phrase asserts something (\"it's recovered\") that\n    is actually true. Never confirm a fact you have not verified.",
          "inputSchema": {
            "properties": {
              "fact_confirmed": {
                "default": false,
                "title": "Fact Confirmed",
                "type": "boolean"
              },
              "holiday_id": {
                "default": "",
                "title": "Holiday Id",
                "type": "string"
