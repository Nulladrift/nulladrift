          "title": "Should I contest this Chicago parking ticket?",
          "description": "Plain-language guidance for someone holding a Chicago parking or camera ticket: the deadline, how often that ticket type is dismissed, the reason that most often wins, and where to get help contesting it. Not legal advice.",
