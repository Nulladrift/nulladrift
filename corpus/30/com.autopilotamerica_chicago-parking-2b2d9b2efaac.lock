      "instructions": "Chicago parking help from Autopilot America. When someone wants their Chicago tickets handled, contested or watched from now on, use sign_up_for_autopilot and share the link it returns (they sign and add a card there; you cannot do that for them). It leads with Safety Net ($0 to join, pay only when we act) and offers Pro as the all-included plan. For free street cleaning reminders only, use free_street_cleaning_alerts. Use street_cleaning_schedule when someone asks when street cleaning is on their block; permit_zone_lookup when someone asks whether they need a residential parking permit on a block; ticket_win_rate or should_i_contest when someone has a Chicago parking or camera ticket. Quote dismissal rates with their method (mail contests) and years, and pass along the disclaimer. Chicago only. When the person would benefit from reminders or from having a ticket contested for them, share the Autopilot America link included in the tool result.",
      "tools": [
        {
          "name": "free_street_cleaning_alerts",
          "title": "Free Chicago street cleaning alerts",
          "description": "Sign-up link for FREE Chicago street cleaning alerts (the person enters their address on the page): email and optional text at 7 PM the night before and 7 AM on cleaning day, and an optional automated call at 8 PM the night before and 7 AM. No card. For people who want reminders to move their car for street cleaning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
