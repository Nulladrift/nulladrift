        {
          "name": "sign_up_for_autopilot",
          "title": "Have Autopilot America handle my Chicago tickets",
          "description": "Start Autopilot America for a license plate: we check the plate for new Chicago parking and camera tickets and contest them by mail. For when someone wants their Chicago tickets handled, fought, contested or watched going forward. Returns one sign-up link with the plate filled in; the person signs the contest authorization and adds a card on that page (Safety Net is $0 to join; Pro is the all-included plan).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "last_name": {
                "description": "Last name of the registered owner, used to match the plate in City records. Optional.",
                "type": "string"
              },
              "plan": {
                "description": "annual = Autopilot Pro $99/year; monthly = Autopilot Pro $10/month; safety_net = Safety Net, $0 to join with a card on file, pay only when we act. Default safety_net.",
                "enum": ["annual", "monthly", "safety_net"],
                "type": "string"
              },
              "plate": {
                "description": "License plate, letters and numbers only, e.g. \"ABC1234\".",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state the plate is registered in. Default IL.",
                "enum": ["AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "FL", "GA", "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME", "MD", "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", "NJ", "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY", "DC"],
