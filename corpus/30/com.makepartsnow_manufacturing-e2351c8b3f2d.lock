      "instructions": "Make Parts Now makes custom parts in-house: SLS nylon (PA12, TPU), FDM 3D printing, and CNC-machined 6061 aluminum or C360 brass, shipped within the US.\nFlow: get_capabilities -> upload_part (wait until status is 'ready' with get_part, or pass wait_seconds up to 30 to wait in the same call) -> create_quote with items -> set ship_to and speed with update_quote -> pay.\nPayment: create_checkout_link returns a Stripe URL for a human to pay by card. pay_with_crypto pays autonomously in USDC via x402 (agent accounts only).\nWithout a key, call create_agent_account first and send the returned key as 'Authorization: Bearer <key>' on later requests.\nNever upload CUI, ITAR, or export-controlled files; uploads require no_controlled_data=true.\nOpen quotes count toward a per-account limit (50 by default): list_quotes shows them, and discard_quote closes the ones you no longer need.\nTool errors read '<status>: <CODE>: <message>', for example '429: RATE_LIMITED: ... Retry after 60s.'; /llms.txt lists the codes.",
