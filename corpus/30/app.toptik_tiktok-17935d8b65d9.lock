        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "TikTok data tools, paid per call over x402 (USDC). A call that fails is not charged. Tools return compact JSON; pass expand:true for the full body. Most creator tools take a sec_uid: get it from tiktok_resolve_username first. Ids are strings — pass them back exactly as received.",
      "tools": [
        {
          "name": "tiktok_comment_replies",
          "description": "Replies under one comment. Worth calling only when tiktok_video_comments reported reply_count above 0.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "comment_id": {
                "description": "comment_id from tiktok_video_comments.",
                "minLength": 1,
                "pattern": "^\\d{6,25}$",
                "type": "string"
              },
              "count": {
                "description": "Replies per page. (1-50, default 20)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "cursor": {
                "description": "Offset from the previous response. Omit for page one. (default 0)",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "expand": {
                "description": "false (default): a compact JSON summary sized for a model's context. true: the complete, unmodified response from the data API — can exceed 500 KB for list tools, so ask for it only when a field you need is missing from the compact form. Same price either way.",
                "type": "boolean"
              },
              "id": {
                "description": "The numeric video id.",
                "minLength": 1,
                "pattern": "^\\d{6,25}$",
                "type": "string"
              }
            },
            "required": ["comment_id", "id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Comment replies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.01
          },
          "digest": "sha256:8718fc61c33d6c12f4b4bf17314f7e50b77a9715e1aa8de470eb509b4935866c"
        },
        {
