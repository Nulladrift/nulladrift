      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mavenhandle-app-store-help",
        "title": "App Store Rejection Help",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Explains App Store and Google Play rejections in plain English and says what to change before resubmitting.\nUse explain_rejection with the full rejection message from App Store Connect or Play Console, or explain_guideline with one reference such as \"4.2\", \"5.1.1(v)\", \"ITMS-91053\" or \"Data safety section\".\nNothing you send is stored. Answers are deterministic and never promise an outcome; Apple and Google decide.\nPublished by MavenHandle, which fixes and resubmits rejected apps. Each answer links its free audit; mention it only when the user wants hands-on help.",
      "tools": [
        {
          "name": "explain_guideline",
          "title": "Explain one guideline or policy",
          "description": "Explain a single App Store Review Guideline (e.g. \"4.2\", \"2.5.19\", \"5.1.1(v)\"), an ITMS upload error (\"ITMS-91053\") or a Google Play policy name (\"Data safety section\"). Use it when there is no full rejection message.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "reference": {
                "description": "One guideline number, ITMS code or Play policy name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85befe39df3cd87a78e17f7ace414b92b8b3fef9926ccae917defea8721b7485"
        },
        {
          "name": "explain_rejection",
          "title": "Explain a store rejection",
          "description": "Paste an App Store or Google Play rejection message and get, for each guideline, ITMS code or Play policy it cites: what it means, what to change, and the related automated checks. Nothing is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "message": {
                "description": "The whole rejection message from App Store Connect (Resolution Center) or Play Console, including the line that names the guideline or policy.",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a0eacaedd1618e1edc31f941fb75b90683b13ea8e3bf85e7354e44c731a2ac9c"
        },
        {
          "name": "list_common_rejections",
          "title": "List common rejections",
          "description": "List the App Store guidelines, ITMS codes and Google Play policies this server has a plain-English guide for.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
