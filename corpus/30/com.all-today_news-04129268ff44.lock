          "name": "news_ticker",
          "title": "News ticker",
          "description": "The day's most important headlines as ultra-short lines (the ticker of the site), with the canonical url of each article. Default today (Vienna time).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "day": {
                "description": "Calendar day YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "language": {
                "description": "Language code, default en. en and de are written by the editorial AI; other reader languages (fr, es, it, ja ...) are machine translations.",
                "maxLength": 16,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
