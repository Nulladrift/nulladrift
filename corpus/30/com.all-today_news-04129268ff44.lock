          "title": "Search news",
          "description": "Full-text search over All Today posts (title, key points, text, tags), newest first, optionally within a topic and a date range. Same fields as latest_news.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Topic id from list_categories.",
                "enum": ["welt", "politik", "markt", "technologie", "forschung", "bildung", "gesundheit", "umwelt", "gesellschaft", "kultur", "sport", "unterhaltung"],
                "type": "string"
              },
              "from": {
