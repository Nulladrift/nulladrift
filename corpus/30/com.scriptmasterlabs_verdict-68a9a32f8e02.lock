{
  "lockfileVersion": 2,
  "subjects": {
    "com.scriptmasterlabs/verdict": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://verdict.scriptmasterlabs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "scriptmasterlabs-verdict-protocol",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Inspect live status, freeze research capsules, check hash integrity, and recompute supplied Jev jury votes. Deterministic tools are stateless. verdict_decide invokes the existing paid Jev service only with caller authorization and caller payment proof; no wallet signing or trades. Supplied jury reports are not authenticated.",
      "tools": [
        {
          "name": "verdict_compile_capsule",
          "title": "Compile a decision capsule",
          "description": "Freeze caller-supplied research state into a timestamped SHA256 capsule using the production compiler. Stateless: no persistence, Jev call, signature, paid receipt, trade approval or settlement. The timestamp changes each compilation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "capsule": {
                "additionalProperties": false,
                "properties": {
                  "contradiction": {
                    "type": "number"
                  },
                  "execution": {
                    "enum": ["ELIGIBLE", "INELIGIBLE"],
                    "type": "string"
                  },
                  "instrument": {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "metadata": {
                    "type": "object"
                  },
                  "regime": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "support": {
                    "type": "number"
                  },
                  "thesis": {
                    "enum": ["LONG_CANDIDATE", "SHORT_CANDIDATE", "NEUTRAL"],
                    "type": "string"
                  }
                },
                "required": ["contradiction", "execution", "instrument", "regime", "support", "thesis"],
                "type": "object"
              }
            },
            "required": ["capsule"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compile a decision capsule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc8657157bc0ea379148b4b8f70e37f13770de3458c7c9a952789129e4978aa4"
        },
        {
          "name": "verdict_contract",
          "title": "Verdict API contract",
          "description": "Read the live Verdict Protocol OpenAPI contract and separate paid HTTP service requirements. This tool never calls /decide or /seal and cannot authorize payments or forward keys. Paid HTTP tiers: /decide is $0.25 USDC and /seal is $0.01 USDC via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verdict API contract"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:26d7e580e3bccfb118af97a9b7095b61ff787895f7a62db532807455bb21262c"
        },
        {
          "name": "verdict_decide",
          "title": "Run paid BYOK Jev verdict",
          "description": "Invoke the existing /decide service: five Jev jurors over a frozen capsule, with persisted signed receipt. Without payment returns the fresh x402 challenge. Requires caller Jev key in X-JEV-API-KEY and a caller-created PAYMENT-SIGNATURE header or payment_signature argument. Never creates a wallet signature or submits trades. model_spend_authorized=true is required before paid execution. Paid: $0.25 USDC via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "capsule": {
                "additionalProperties": false,
                "properties": {
                  "contradiction": {
                    "type": "number"
                  },
                  "execution": {
                    "enum": ["ELIGIBLE", "INELIGIBLE"],
                    "type": "string"
                  },
                  "instrument": {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "metadata": {
                    "type": "object"
                  },
                  "regime": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "support": {
                    "type": "number"
                  },
                  "thesis": {
                    "enum": ["LONG_CANDIDATE", "SHORT_CANDIDATE", "NEUTRAL"],
                    "type": "string"
                  }
                },
                "required": ["contradiction", "execution", "instrument", "regime", "support", "thesis"],
                "type": "object"
              },
              "model_spend_authorized": {
                "const": true,
                "type": "boolean"
              },
              "payment_signature": {
                "maxLength": 16384,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["capsule"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Run paid BYOK Jev verdict"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e22a71659fe6ec44eb54879c6f7ae0d7594006dc1c2f9692a1518a0396d50d7"
        },
        {
          "name": "verdict_review_jury",
          "title": "Review supplied Jev jury votes",
          "description": "Validate five uniquely identified caller-supplied juror votes and recompute the production jury aggregation. No new Jev evaluation occurs. The report is untrusted input: aggregation does not authenticate issuance, correctness, independence, trade approval or payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "capsule": {
                "additionalProperties": false,
                "properties": {
                  "contradiction": {
                    "type": "number"
                  },
                  "execution": {
                    "enum": ["ELIGIBLE", "INELIGIBLE"],
                    "type": "string"
                  },
                  "hash": {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  },
                  "instrument": {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "metadata": {
                    "type": "object"
                  },
                  "regime": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "support": {
                    "type": "number"
                  },
                  "thesis": {
                    "enum": ["LONG_CANDIDATE", "SHORT_CANDIDATE", "NEUTRAL"],
                    "type": "string"
                  },
                  "timestamp": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "version": {
                    "const": "v1",
                    "type": "string"
                  }
                },
                "required": ["contradiction", "execution", "hash", "instrument", "regime", "support", "thesis", "timestamp", "version"],
                "type": "object"
              },
              "votes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "confidence": {
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "decision": {
                      "enum": ["PROCEED", "WAIT", "NO_TRADE"],
                      "type": "string"
                    },
                    "juror": {
                      "enum": ["CAUSAL", "HISTORIAN", "SKEPTIC", "MICROSTRUCTURE", "TAIL_RISK"],
                      "type": "string"
                    },
                    "model": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "probability": {
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["confidence", "decision", "juror", "model", "probability"],
                  "type": "object"
                },
                "maxItems": 5,
                "minItems": 5,
                "type": "array"
              }
            },
            "required": ["capsule", "votes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Review supplied Jev jury votes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:faa04883936c68dbf213e6821c512069b6a02794f55492d780ff4c1801f39ef6"
        },
        {
          "name": "verdict_status",
          "title": "Verdict runtime status",
          "description": "Read current readiness and decision-only service identity. Configuration readiness is not proof of a fresh Jev evaluation or settlement. No model, wallet or trade call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verdict runtime status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c48541bdff001b6b3cd9f95edea9fb37b80189669f46776fe1cdf9baa0e9b7f1"
        },
        {
          "name": "verdict_verify_capsule",
          "title": "Check capsule hash integrity",
          "description": "Recompute the hash of a supplied frozen capsule. A matching hash proves internal integrity only, not source truth, SML issuance, receipt authenticity, Jev execution or payment. No model or wallet call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "capsule": {
                "additionalProperties": false,
                "properties": {
                  "contradiction": {
                    "type": "number"
                  },
                  "execution": {
                    "enum": ["ELIGIBLE", "INELIGIBLE"],
                    "type": "string"
                  },
                  "hash": {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  },
                  "instrument": {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "metadata": {
                    "type": "object"
                  },
                  "regime": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "support": {
                    "type": "number"
                  },
                  "thesis": {
                    "enum": ["LONG_CANDIDATE", "SHORT_CANDIDATE", "NEUTRAL"],
                    "type": "string"
                  },
                  "timestamp": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "version": {
                    "const": "v1",
                    "type": "string"
                  }
                },
                "required": ["contradiction", "execution", "hash", "instrument", "regime", "support", "thesis", "timestamp", "version"],
                "type": "object"
              }
            },
            "required": ["capsule"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check capsule hash integrity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:156c64f422697bb5650dc2927d04fac7e12d0d3d0eee5281741923388129cf56"
        }
      ],
      "digest": "sha256:76496fcb44681e6e758978a55924aff9a907e7d63138bb6c13fa602196b85ed2"
    }
  }
}
