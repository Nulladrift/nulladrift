      "instructions": "Promotion Pros sells custom branded merchandise (promotional products) to businesses. Prices are USD per unit and depend on quantity; decoration setup is a one-time charge per order. Use search_catalog to find products and quote_price for a quantity-specific total, then either give the buyer the deep_link to finish on promotionpros.com or, when they want something to keep, forward or get approved, issue a real document with create_instant_quote. create_instant_quote is the only tool here that writes: it needs the buyer's full name, work email and phone, it emails them a numbered quote with a PDF and a link they can pay from, and calling it twice issues two quotes. Confirm the configuration, the quantity and the email with the buyer first. Products are titled for what they are, not for the occasion they are bought for, so searching \"Thanksgiving gift\" or \"holiday party favor\" will miss. For an occasion, holiday or gifting ask, browse a category instead: pass `category` with no `query`, then narrow by product type. The gifting categories are the current year's gift guide, \"Special Occasions\" and \"Boxes & Gift Baskets\" — take their exact names from facets.categories rather than assuming them. A search that matches nothing returns the categories worth browsing in facets.categories.",
      "tools": [
        {
          "name": "create_instant_quote",
          "title": "Issue a formal quote",
          "description": "Issue a real, numbered Promotion Pros quote for a configuration priced with quote_price, and email it to the buyer. Returns the quote number, the reconciled price breakdown, a PDF, a link to the quote page and a link that takes the buyer straight to payment. Requires the buyer's full name, work email and phone number — ask for them, and confirm the configuration and the quantity, before calling this. This writes: it creates an order record and sends mail, and calling it twice issues two quotes to the same person. The price is recomputed live by promotionpros.com, so it can differ slightly from quote_price's snapshot; the numbers returned here are the quoted ones. Shipping and tax are not in the quote until the buyer adds a delivery address on the quote page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "color": {
                "description": "Product color name, from get_product_options.",
                "maxLength": 60,
                "type": "string"
              },
              "company": {
                "maxLength": 200,
                "type": "string"
              },
              "destination_state": {
                "description": "Where it ships to, for the arrival estimate recorded on the quote: a US state code (\"IL\") or name. Omit if unknown.",
                "maxLength": 40,
                "type": "string"
              },
              "email": {
                "description": "The buyer's work email. The quote is sent here, so confirm it before calling.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "full_name": {
                "description": "The buyer's full name, as they gave it.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "imprint_colors": {
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "imprint_method": {
                "description": "Decoration method name, from get_imprint_options.",
                "maxLength": 80,
                "type": "string"
              },
              "phone": {
                "description": "A phone number to reach the buyer on. Required by the quote desk.",
                "maxLength": 40,
                "minLength": 5,
                "type": "string"
              },
              "product": {
                "description": "Identify the product by exactly one of slug, id or sku.",
                "properties": {
                  "id": {
                    "description": "The catalog product id, as returned by search_catalog.",
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  "sku": {
                    "description": "The Promotion Pros SKU shown on the product page.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "slug": {
                    "description": "The product page path, e.g. \"blue-ceramic-mug-11oz\" — from a search result's handle or a promotionpros.com URL.",
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "quantity": {
                "description": "Total pieces. Below the method's minimum, the quote is issued at the minimum.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "rush": {
                "type": "boolean"
              },
              "sizes": {
                "description": "Per-size quantities for apparel; replaces quantity.",
                "items": {
                  "properties": {
                    "quantity": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "size": {
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["quantity", "size"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["email", "full_name", "phone", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Issue a formal quote"
          },
          "behavior": {
