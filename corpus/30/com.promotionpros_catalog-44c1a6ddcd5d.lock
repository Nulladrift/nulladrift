        {
          "name": "search_catalog",
          "title": "Search the Promotion Pros catalog",
          "description": "Find custom branded merchandise by keywords (e.g. \"insulated tumbler\", \"trade show tote bag\", \"eco pen\") with optional category, color, size and price filters. Returns product summaries with a from-price and the handle to pass to get_product or quote_price. Results are ranked by relevance unless sorted by price. Omit `query` to browse: with a `category` and no keywords this returns that category, which is how to answer an occasion or gifting ask. When nothing matches, facets.categories lists the categories worth browsing instead and `notes` says so.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "A category name from a previous result's facets, e.g. \"Drinkware\", \"2026 Gift Guide\".",
                "maxLength": 100,
                "type": "string"
              },
              "color": {
                "maxLength": 60,
                "type": "string"
              },
              "page": {
                "description": "Zero-based page.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "page_size": {
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "price_max": {
                "description": "Maximum from-price per unit, USD.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "price_min": {
                "description": "Minimum from-price per unit, USD.",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Keywords, a product name, or a SKU. Omit to browse everything the other filters allow.",
                "maxLength": 200,
                "type": "string"
              },
              "size": {
                "maxLength": 40,
                "type": "string"
              },
              "sort": {
                "enum": ["relevance", "price_asc", "price_desc"],
                "type": "string"
              }
            },
            "type": "object"
          },
