          "title": "Estimate delivery date",
          "description": "When an order placed today would arrive: the standard FedEx Ground date and, when the product offers it, the rush date — both in one call. Give the buyer's US state for a real shipping lane; dates are business days from today in Central time and include the free proof, production and transit. Rush skips the proof wait and starts the same business day when artwork arrives before noon Central.",
