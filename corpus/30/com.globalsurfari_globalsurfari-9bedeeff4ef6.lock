      "serverInfo": {
        "name": "globalsurfari",
        "title": "Global Surfari Surf Forecasts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Open surf forecast server - no authentication required. Use get_surf_forecast with coordinates, or get_surf_forecast_by_spot with a beach name. Forecasts are 7 days from NOAA wave model data; heights in feet, wind in mph.",
      "tools": [
        {
          "name": "get_surf_forecast",
          "title": "Get surf forecast for coordinates",
          "description": "7 day surf forecast (wave height in feet, wave period in seconds, wind speed in mph, wind direction in degrees) for the nearest coastal forecast point to a latitude/longitude. Data from NOAA wave models.",
          "inputSchema": {
            "properties": {
              "latitude": {
                "description": "Latitude in decimal degrees (-90 to 90)",
                "type": "number"
              },
              "longitude": {
                "description": "Longitude in decimal degrees (-180 to 180)",
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f472dae72872a0641159d3ebaab7be54b67dbd15d8b71e30b19af8dcbe67ba7a"
        },
        {
          "name": "get_surf_forecast_by_spot",
          "title": "Get surf forecast for a named spot",
          "description": "7 day surf forecast for a named surf spot. Tries saved Global Surfari locations first, then geocodes the name. Example: \"Bondi Beach\", \"Mavericks\", \"Bells Beach\".",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Surf spot or beach name",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:79035ddc341eae30f7cce61839132df1d495630bc56bf266dc2881858acaf6be"
        },
        {
