{
  "lockfileVersion": 2,
  "subjects": {
    "com.getgenko/prior-auth-docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://priorauth.getgenko.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.getgenko/prior-auth-docs",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public, read-only knowledge server for Genko Prior Auth (prior authorization packets for dental, aesthetics and physiotherapy practices). It serves the public website's documentation, guides, specialty checklists, pricing and product facts. It has no access to any practice's or patient's data, and it cannot sign anyone up, submit anything or change anything. Prefer get_product_facts, get_pricing and check_fit over guessing.",
      "tools": [
        {
          "name": "check_fit",
          "title": "Does Genko Prior Auth fit this practice?",
          "description": "Say whether Genko Prior Auth supports a practice's specialty (own form, general form, or not supported) and what it offers there, from what the product implements. A payer can be given, but the product does not evaluate payers or payer rules, and the answer says so.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "payer": {
                "description": "Optional payer name. The product does not evaluate payers; the answer says so.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "specialty": {
                "description": "The practice's specialty in plain words, e.g. 'dental', 'physical therapy', 'aesthetics', 'optometry'.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["specialty"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "caveats": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "fit": {
                "description": "dedicated = own code lists and findings form; generic_form = general form; not_supported = no",
                "enum": ["dedicated", "generic_form", "not_supported"],
                "type": "string"
              },
              "next_step": {
                "type": "string"
              },
              "page_url": {
                "type": ["string", "null"]
              },
              "payer": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "evaluated": {
                        "const": false,
                        "type": "boolean"
                      },
                      "statement": {
                        "type": "string"
                      }
                    },
                    "required": ["evaluated", "statement"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "specialty": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "key": {
                        "type": "string"
                      },
                      "label": {
                        "type": "string"
                      }
                    },
                    "required": ["key", "label"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "summary": {
                "type": "string"
              },
              "what_it_offers": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["caveats", "fit", "next_step", "page_url", "payer", "specialty", "summary", "what_it_offers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Does Genko Prior Auth fit this practice?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3fe0f972f4b54993de47cd4b3ddd42a182b49ede13846ee62cd2332b7c4d4217"
        },
        {
          "name": "get_packet_checklist",
          "title": "What Prior Auth collects for a specialty",
          "description": "What Genko Prior Auth collects for a prior authorization request in a specialty (dental, aesthetics, physiotherapy, or the generic form): request details, structured-findings fields and choices, and code systems. Useful for 'what goes in a packet'. No patient data, no code descriptors.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "specialty": {
                "description": "Practice type. 'generic' is the form every other practice type uses.",
                "enum": ["dental", "aesthetics", "physiotherapy", "generic"],
                "type": "string"
              }
            },
            "required": ["specialty"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "code_areas": {
                "additionalProperties": false,
                "properties": {
                  "curated_diagnosis_codes": {
                    "type": "number"
                  },
                  "curated_procedure_codes": {
                    "type": "number"
                  },
                  "diagnosis_code_system": {
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  },
                  "procedure_code_systems": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["curated_diagnosis_codes", "curated_procedure_codes", "diagnosis_code_system", "note", "procedure_code_systems"],
                "type": "object"
              },
              "label": {
                "type": "string"
              },
              "page_url": {
                "type": ["string", "null"]
              },
              "request_records": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "specialty": {
                "type": "string"
              },
              "structured_findings": {
                "additionalProperties": false,
                "properties": {
                  "groups": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "description": {
                          "type": ["string", "null"]
                        },
                        "fields": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "choices": {
                                "items": {
                                  "type": "string"
                                },
                                "type": "array"
                              },
                              "hint": {
                                "type": ["string", "null"]
                              },
                              "kind": {
                                "type": "string"
                              },
                              "label": {
                                "type": "string"
                              },
                              "required": {
                                "type": "boolean"
                              }
                            },
                            "required": ["choices", "hint", "kind", "label", "required"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "only_if_relevant": {
                          "type": "boolean"
                        },
                        "title": {
                          "type": "string"
                        }
                      },
                      "required": ["description", "fields", "only_if_relevant", "title"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "intro": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": ["groups", "intro", "title"],
                "type": "object"
              }
            },
            "required": ["code_areas", "label", "page_url", "request_records", "specialty", "structured_findings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What Prior Auth collects for a specialty"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6db35e9103ab02fb256ad181f69486931062156ac23246901ec516221586f307"
