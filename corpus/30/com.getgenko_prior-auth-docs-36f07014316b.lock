        {
          "name": "search_docs",
          "title": "Search Genko Prior Auth public docs",
          "description": "Search Genko Prior Auth's public site: docs, prior authorization guides, specialty pages (dental, aesthetics, physiotherapy), pricing, facts and agent information. Returns up to 10 ranked pages with URL and snippet; read one in full with get_page. Public content only, no practice or patient data.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Most results to return (1-10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in plain words, e.g. 'appeal a denied physiotherapy request', 'dental crown', 'how much does it cost'.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "path": {
                      "type": "string"
                    },
                    "section": {
                      "type": "string"
                    },
                    "snippet": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["path", "section", "snippet", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["query", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Genko Prior Auth public docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
