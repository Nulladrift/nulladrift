        {
          "name": "get_page",
          "title": "Read a public Genko Prior Auth page",
          "description": "Read one public Genko Prior Auth page as Markdown (the same text as its .md version), by path or URL, e.g. '/pricing', '/facts', '/docs/faq'. Public pages only; the signed-in app is never available.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "path": {
                "description": "Public page path, e.g. '/', '/docs/faq', '/guides/what-is-prior-authorization', '/specialties/dental', '/pricing'. A '.md' suffix or a full URL on this site also works.",
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^(\\/|https?:\\/\\/)[^\\s]*$",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "markdown": {
                "type": "string"
              },
              "path": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["markdown", "path", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a public Genko Prior Auth page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:187f1bfa518c7a7fd11591ac5caa417cb26e0966550052cebc8d986064f19757"
        },
        {
          "name": "get_pricing",
          "title": "Genko Prior Auth plans and prices",
          "description": "Current Genko Prior Auth plans in US dollars per practice per month, with each plan's monthly draft and AI-token limits and the free trial's terms. Use this to answer 'how much does it cost'; never estimate prices.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "const": "USD",
                "type": "string"
              },
              "draft_definition": {
                "type": "string"
              },
              "how_to_start": {
                "type": "string"
              },
              "plans": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ai_tokens_per_month": {
                      "type": ["number", "null"]
                    },
                    "drafts_per_month": {
                      "type": ["number", "null"]
                    },
                    "monthly_price_usd": {
                      "description": "null = custom pricing by agreement",
                      "type": ["number", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "note": {
                      "type": ["string", "null"]
                    },
                    "slug": {
                      "type": "string"
                    }
                  },
                  "required": ["ai_tokens_per_month", "drafts_per_month", "monthly_price_usd", "name", "note", "slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "trial": {
                "additionalProperties": false,
                "properties": {
                  "ai_tokens": {
                    "type": "number"
                  },
                  "card_required": {
                    "type": "boolean"
                  },
                  "days": {
                    "type": "number"
                  },
                  "drafts": {
                    "type": "number"
                  }
                },
                "required": ["ai_tokens", "card_required", "days", "drafts"],
                "type": "object"
              },
              "updated": {
                "description": "Date the prices were last confirmed against the billing database (YYYY-MM-DD)",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["currency", "draft_definition", "how_to_start", "plans", "trial", "updated", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Genko Prior Auth plans and prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df02bded1e332c09b004086790e80de474374d51d6084a2b00cb09e13410a9a8"
