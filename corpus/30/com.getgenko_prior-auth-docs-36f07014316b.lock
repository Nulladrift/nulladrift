            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "facts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    }
                  },
                  "required": ["answer", "question"],
                  "type": "object"
                },
                "type": "array"
              },
              "json_url": {
                "type": "string"
              },
              "not_yet": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "payers": {
                "additionalProperties": false,
                "properties": {
                  "does_not": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "evaluates_payer_rules": {
                    "type": "boolean"
                  },
                  "modelled_as": {
                    "type": "string"
                  }
                },
                "required": ["does_not", "evaluates_payer_rules", "modelled_as"],
                "type": "object"
              },
              "pricing": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "const": "USD",
