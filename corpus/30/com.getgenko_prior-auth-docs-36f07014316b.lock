                        "type": "number"
                      },
                      "drafts": {
                        "type": "number"
                      }
                    },
                    "required": ["ai_tokens", "days", "drafts"],
                    "type": "object"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["currency", "plans", "practice_connector", "trial", "url"],
                "type": "object"
              },
