        {
          "name": "get_product_facts",
          "title": "Genko Prior Auth facts to quote",
          "description": "Checked facts about Genko Prior Auth: what it is and isn't, who it's for, stage, specialties, how payers are handled, security, limits, pricing and what exists for agents. Same source as /facts and /facts.json. Quote these instead of guessing.",
