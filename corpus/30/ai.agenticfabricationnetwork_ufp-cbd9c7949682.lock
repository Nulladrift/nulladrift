        {
          "name": "get_cart",
          "title": "Read a cart",
          "description": "Read a cart: every part with its quote, the rules on it (constraints_asked), its pick (selection) and what the pick comes to — the shop, the price, the shipping speed and the arrival date — plus whether that option can be ordered right now (checkout.state: \"ready\"; \"needs_check\" = the shop has to confirm it first; \"checking\" = the shop is answering, read again shortly; \"not_orderable\" = pick another option; checkout.reason says why in a sentence and checkout.code says it as one word — on a \"needs_check\" part, \"confirmation_lapsed\" or \"never_confirmed\" mean reconfirm true will ask its one shop (and so will checkout_cart, by itself), \"ask_limited\" means the option is chosen and its shop is asked when the user pays, while \"rechecking\" (the part was copied from a shared cart and its shops are still being asked: read the cart again) and \"shop_asks_off\" (the network is not asking shops for this part right now) mean reconfirm true will start nothing for it). now is the network's own clock when the answer was made: work out the time left until checkout.confirmed_until from now, not from your own clock. by_shop groups the picked parts by the shop that makes them with subtotals and shipping, and total_cents is what the picked parts cost together. Parts with nothing picked are listed in unpicked_item_ids and are in no total. A plain read asks no shop. Pass reopen true when the user comes back to a cart: parts older than 24 hours are then asked about again, once, one part at a time (the answer's reopen says \"asked\", \"none_needed\", or \"press_needed\" — the old parts were already asked about again once and nothing was done to the cart since; pass pressed true only when the user asks for today's prices). picked.stale, picked.answered_at, picked.eta_days and picked.eta_approximate read as they do on an offer: when eta_approximate is true say \"about N days\", never the date. HOW LONG A PRICE HOLDS: a shop's confirmation of a picked option is good for 15 minutes. While it stands the part reads \"ready\" and checkout.confirmed_until says until when — tell the user the time they have. After it the part is NOT lost: it keeps its pick and its price and reads \"needs_check\" again. It is confirmed again by its one shop (nobody else is asked) when its option is chosen, and by checkout_cart itself when the user pays; reconfirm true on get_cart starts the same asks ahead of time — read the cart again and \"ready\" means the price stands. checkout.code \"ask_limited\" means the option is chosen and its shop will be asked when the user pays. When a part carries price_changed, the shop's answer moved the price or the arrival (direction \"up\", \"down\", or \"same\" when only the arrival moved) — tell the user the old and the new figure before they pay. checkout_cart stops ONCE by itself when the cart's total came back higher than the user agreed to (price_went_up). A part whose prices passed their 24-hour expiry is given a new quote by the read itself (quoted_anew true, price_source \"instant\"): it shows our instant prices again, its pick is kept, no shop was asked, and its shop confirms the pick when asked. SHIPPING IN A CART: by_shop[].shipping says how each shop's parts ship. mode \"ships_separately\" = each part is its own order with that shop and its own package, and pays its own shipping; mode \"combined\" = the shop takes those parts as ONE order and ships them together. Tell the user which it is, in the words of shipping.reason. Name a shipping saving ONLY when shipping.saved_cents is above zero, and only that amount — never promise or hint at a saving for buying several parts from one shop otherwise. When shipping.code is \"speeds_differ\", the parts of that shop are picked at different shipping speeds; you may tell the user that the shop sends parts together only at one speed, and read the cart again after they change a pick — do not state what it would save before the cart shows it. A SHARED CART: status \"shared\" means the cart came by a link and can only be read and copied. Never change it, pick on its parts' quotes, run check_offer on them or check it out — each of those is refused (cart_shared). Copy it with fork_cart and work on the copy, which is the user's own cart. A COPIED CART: copied true is present on a cart that was copied from a shared one; a cart never says which cart it was copied from. Each part's price_source says whose prices it shows: \"shared\" = recent shop prices that were copied with nobody asked — the prices of the person who shared the cart as they stood when it was copied, or the shops' own answers to this same part and request from the last 24 hours; \"instant\" = our instant prices, because the shared prices could not be copied (they were too old, or still coming in) — no shop has been asked about that part on this quote yet; \"own\" = this cart's own quote of the part, its shops asked. A pick that travelled with the cart but matches no option now reads selection_match.status \"none\": that part is still to choose. The buyer, the address, the email and any coupon never travel with a cart. PARTS OLDER THAN 24 HOURS: a shop's answer is shown for 24 hours. A cart copied with fork_cart inside them asks nobody: every part comes with its answers as they stand. A part whose answers are OLDER than 24 hours shows our instant prices first, and (unless the copy was for_link or recheck false) its shops are then asked about it again, one part at a time. Each such part's recheck says where it stands: \"queued\" = priced, its shops are asked when its turn comes; \"asking\" = its shops are being asked now; \"done\" = the shops' answers are in. A part with no recheck is under 24 hours old and nothing is pending for it. A part's quote_id CHANGES when its turn comes, so read quote_id off get_cart every time and never keep an old one. Until every such part reads done, tell the user the prices and dates may still move, and read the cart again; do not start a second copy to hurry it. A picked part goes first and its picked option is confirmed with its shop as part of it. HOW A CART WORKS: each part in a cart IS a quote — its material, finish, quantity, rules and its pick (selection) live on that part's quote, and nothing is kept twice. To change a part, call refine_quote on its quote_id and pass cart_item_id: the cart follows the part to the new quote by itself. To pick the option to order for a part, store the pick on its quote (refine_quote selection). The cart_id is the only key to the cart — whoever holds it can read and change it — so give it only to the user it belongs to, and never put it in a link you did not get from the network.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cart_id": {
                "description": "The cart to read (cart_…)",
                "type": "string"
              },
              "pressed": {
                "description": "With reopen true: true = the user asked for today's prices. Needed only after an answer whose reopen read \"press_needed\"",
                "type": "boolean"
              },
              "reconfirm": {
                "description": "true = also have each picked part that reads \"needs_check\" confirmed by its one shop (nobody else is asked). The answer comes back at once with those parts \"checking\" — read the cart again for the result. Use it when the user opens the cart to pay; leave it out for a plain look",
                "type": "boolean"
              },
              "reopen": {
                "description": "true = the user came back to this cart: parts whose answers are older than 24 hours are asked about again, once, one part at a time (answers anyone got for the same part in the last 24 hours are copied first, and then nobody is asked). The only cart read that may ask every shop about a part. Leave it out for a plain look",
                "type": "boolean"
              }
            },
            "required": ["cart_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f05c19a63af06e7f0ced0e5fafcd9f4bbf398700424f00cd0f9ee0fba2759aff"
        },
        {
          "name": "get_fabrication_quote",
          "title": "Get fabrication quote",
          "description": "Get fabrication price and delivery offers for a design file or an existing AFN part number. Supports 3D printing, CNC machining, sheet metal, decals, print, and apparel. If the user just provides a file and asks for a price, omit process so AFN can route it to suitable makers. Provide the design as design_file (an attachment or generated file) or file_url (a public URL). For a reorder, pass the UFP part number as part_number instead of a file; locked parts also require share_key from the owner's share link. A .ufp part container is accepted as a design file, and its saved specification applies unless the user changes it. Some offers carry manufacturability_check: the price is set; the shop is confirming it can make the part as drawn (status \"checking\" for about expected_s seconds, then passed or failed; a status of \"repriced\" means passed — the price shown is the shop's, never say it changed) — present them as real prices; create_checkout on one that is still checking waits for the shop's answer and never orders a price the shop has not confirmed. Pass instant_only true only when the user wants instant prices without any shop being asked (a demo, a quick look): the quote comes back complete at once, every offer carries its instant price with manufacturability_check.status \"unchecked\", and nothing on that quote can be checked or ordered — check_offer answers without asking the shop and create_checkout refuses. Quotes made from it with refine_quote, and re-quotes of its .ufp part file, stay instant-only; to order, quote the same part again without instant_only. Pass lazy true when the user wants to look at prices now and have a shop asked only for the offer they pick: no shop is asked to make the quote, it comes back complete at once, and every offer carries our instant price with manufacturability_check.status \"unchecked\". Unlike instant_only, such a quote CAN be ordered: run check_offer on the offer the user picks (that asks its one shop), and create_checkout once the check passes. A shop we have no instant price for has no offer on a lazy quote — say so if the user asks where a shop is, and quote the part again without lazy to ask every shop. Quotes made from it with refine_quote stay lazy. HOW OLD AN ANSWER IS: a shop's answer is shown for 24 hours, to everyone with the same request (the same design bytes with the same everything asked), so a quote of a part someone priced in the last 24 hours comes back complete at once with those answers and no shop is asked again. An offer says when its shop answered (answered_at). Past 15 minutes it reads stale: true — it is shown at that price and the shop confirms it again before anyone pays (check_offer, or checking out, asks that one shop). A shipping option of such an offer carries eta_approximate: true: say \"about N days\" from eta_days and never state its eta_date as a date, because no shop stands behind a date until it confirms again. If a quote carries answers_pending, someone else is asking the shops about this same request right now and these are our instant prices: call reopen_quote with that quote_id after retry_after_s seconds. TO PLACE EXACTLY ONE ORDER WITH NO MISTAKES: (1) on get_fabrication_quote list only that shop in vendors and state the pick in selection — the shop, plus the material, finish and shipping speed wanted; (2) read selection_match on the quote: status \"one\" means exactly one option answers the pick, \"many\" means say more in the pick (color, thickness, quantity), \"none\" means nothing on the quote answers it; (3) call create_checkout with quote_id and selection true — it orders that one option at the picked shipping speed, or refuses and creates nothing (selection_not_unique: the pick is not exactly one option; selection_speed_unavailable: the option does not show the picked speed now — an order never takes another speed in its place). It returns the payment link as always: the user pays on that page, nothing is charged without them. An offer whose manufacturability_check reads status \"unchecked\" with reason \"network_restarted\" was being confirmed by its shop when the network restarted, so the answer never came: tell the user, in these words, \"A new version of AFN has been released, please refresh the page\". Nothing is lost — the price stands and the offer can simply be checked again with check_offer. Say it once, when a tool's own text tells you to; the same reason still on an offer on a later read is history, not news.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "attachment_urls": {
                "description": "Additional files for the SAME part — the PDF drawing next to the STEP, spec sheets, BOMs. Pass everything the user gave you; UFP works out which file is the part and which are supporting documents.",
                "items": {
                  "$ref": "#/properties/file_url"
                },
                "maxItems": 10,
                "type": "array"
              },
              "bend_count": {
                "description": "Number of bends in the design (bend lines must be in the file). Prices CNC bending; omit for flat parts",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "bends": {
                "description": "Sheet-metal bend lines, each as TWO POINTS in the part's own mm frame (flat DXF parts use z=0: a bend from (0,12.7) to (76.2,12.7) is p1 [0,12.7,0], p2 [76.2,12.7,0]). angle_deg is the target bend angle (90 = a right-angle flange), direction \"up\"/\"down\" is the fold direction relative to the flat pattern, radius_mm the requested inside radius (omit it — the shop resolves to its tooling and reports what it used). Pass these when the user articulates WHERE the bends go; a bare \"it has 2 bends\" is bend_count, not this.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "angle_deg": {
                      "exclusiveMaximum": 180,
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "direction": {
                      "enum": ["up", "down"],
                      "type": "string"
                    },
                    "face_id": {
                      "type": "integer"
                    },
                    "id": {
                      "maxLength": 32,
                      "minLength": 1,
                      "type": "string"
                    },
                    "line": {
                      "additionalProperties": false,
                      "properties": {
                        "p1": {
                          "items": {
                            "type": "number"
                          },
                          "maxItems": 3,
                          "minItems": 3,
                          "type": "array"
                        },
                        "p2": {
                          "$ref": "#/properties/bends/items/properties/line/properties/p1"
                        }
                      },
                      "required": ["p1", "p2"],
                      "type": "object"
                    },
                    "radius_mm": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "source": {
                      "enum": ["detected", "user"],
                      "type": "string"
                    }
                  },
                  "required": ["angle_deg", "direction", "line"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "callouts": {
                "description": "Dimensions you read off the user's drawing that matter (\"hole_diameter 6.5mm ±0.1\"). The tightest tolerance prunes vendors that cannot hold it.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "critical": {
                      "type": "boolean"
                    },
                    "name": {
                      "type": "string"
                    },
                    "tolerance_mm": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "unit": {
                      "enum": ["mm", "in"],
                      "type": "string"
                    },
                    "value": {
                      "type": "number"
                    }
                  },
                  "required": ["name", "unit", "value"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "color": {
                "description": "ONLY a color the user actually asked for — NEVER pick one for them. fdm_print: Filament color for fdm_print (e.g. black, red); resin_print: Resin color for resin_print (e.g. gray, white, black); powder_print: Powder part color: raw gray/white, or a dye (\"black\", \"dark blue\") — vendor-resolved; elastomer_print: Elastomer part color — VCJ parts ship raw; asks resolve with an honest substitution note; cnc: Colour for cnc: with finish anodized it is the anodize colour, otherwise the stock's own colour (black Delrin, clear acrylic). Colour WORDS only; each maker resolves the shade and says what it landed on; laser_cut: Colour of the flat stock for laser_cut (black, clear, natural…). Colour WORDS only; each maker quotes the materials it stocks in that colour and drops the ones that cannot be it; print: Print color ask (\"full color\", \"black and white\"). Vendors that only price full color note the substitution; apparel: Garment color for apparel (\"black\", \"heather gray\") — vendor-resolved",
                "type": "string"
              },
              "cut": {
                "description": "Decal cut style — pass the user's words verbatim (\"triangle\", \"die cut\", \"circle\"). Known: contour|square|oval|kiss_cut; anything else gets closest-match offers with a substitution note. Omit to compare the main options",
                "type": "string"
              },
              "deadline": {
                "description": "Latest acceptable delivery date, ISO YYYY-MM-DD",
                "type": "string"
              },
              "design_data_url": {
                "description": "Inline design bytes as a data: URL (base64), for MCP clients that cannot pass a file reference",
                "pattern": "^data\\:",
                "type": "string"
              },
              "design_file": {
                "additionalProperties": false,
                "description": "The design file itself (user-attached or generated image/STL). ChatGPT supplies {file_id, download_url} automatically when the user attached a file — just bind the attachment here.",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "elastomer_finish": {
                "description": "Elastomer post-processing: as_printed (VCJ parts ship raw — the whole lane today)",
                "type": "string"
              },
              "elastomer_technology": {
                "description": "Elastomer process: vapor_cure_jetting (VCJ). Omit to let the vendor pick its default lane for the material",
                "type": "string"
              },
              "file_url": {
                "description": "Public URL of the design file — only when the design lives at a URL",
                "type": "string"
              },
              "finish": {
                "description": "cnc: CNC surface finish: standard|anodized|polished|bead_blasted (default standard); sheetmetal: as_cut (default) | deburred | anodized | powder_coat — anodized is aluminum-only; powder coat protects mild steel for outdoor use",
                "type": "string"
              },
              "food_safe": {
                "description": "Must be vendor-certified food safe",
                "type": "boolean"
              },
              "height_in": {
                "description": "Decal height in inches (default 3)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "high_temp": {
                "description": "Must tolerate sustained heat (vendor heat-resistance claim)",
                "type": "boolean"
              },
              "inserts": {
                "description": "PEM-style hardware inserts pressed into holes of a sheet-metal part — one record per hole. `insert` is the species (nut | flush_nut | standoff | blind_standoff | stud) and `thread` its size (\"M4\", \"1/4-20\"); both are required. When known, add length_mm (standoff/stud post length), the hole's center (located_at_mm, part's own mm frame), its axis, the drilled diameter, and `points` — the signed unit vector the insert's functional side faces (flip = negate). Pass these when the user asks for press-in nuts/standoffs/studs; sheet-metal shops with a hardware service price them, and every other shop — on every process, 3D printing and laser cutting included — is left out with the reason rather than pricing the part without its hardware.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "axis": {
                      "$ref": "#/properties/bends/items/properties/line/properties/p1"
                    },
                    "depth_mm": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "drilled_diameter_mm": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "face_id": {
                      "type": "integer"
                    },
                    "hole": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "insert": {
                      "enum": ["nut", "flush_nut", "standoff", "blind_standoff", "stud"],
                      "type": "string"
                    },
                    "length_mm": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "located_at_mm": {
                      "additionalProperties": false,
                      "properties": {
                        "x": {
                          "type": "number"
                        },
                        "y": {
                          "type": "number"
                        },
                        "z": {
                          "type": "number"
                        }
                      },
                      "required": ["x", "y", "z"],
                      "type": "object"
                    },
                    "points": {
                      "$ref": "#/properties/bends/items/properties/line/properties/p1"
                    },
                    "thread": {
                      "maxLength": 32,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["insert", "thread"],
                  "type": "object"
                },
                "maxItems": 200,
                "type": "array"
              },
              "instant_only": {
                "description": "true = instant prices only: no shop is asked about the part, now or later on this quote. The quote is complete at once; its offers read \"unchecked\" and cannot be checked or ordered (routing.instant_only is true on the response). Omit for a regular quote — the only kind that can be ordered",
                "type": "boolean"
              },
              "lazy": {
                "description": "true = our instant prices first, and a shop asked only when the user picks an offer: no shop is asked to make the quote, which is complete at once with every offer \"unchecked\" (routing.lazy is true on the response). Run check_offer on the offer the user picks — that asks its one shop — and create_checkout once the check passes. A shop we have no instant price for has no offer on such a quote. Omit for a regular quote, which asks the shops now",
                "type": "boolean"
              },
              "material": {
                "description": "ONLY a material the user actually asked for — NEVER guess or default one (a silent \"pla\" on a bare file drop prunes every maker that does not stock it; OMIT instead and each process quotes across its stocked materials so every maker can bid). fdm_print: pla|petg|asa (free-form — \"abs\", \"polycarbonate\" asks resolve to the closest stocked filament with a substitution note); resin_print: standard|tough|high_temp|high_detail resin (free-form asks resolve to the closest supported resin); powder_print: Powder-bed nylon: nylon_12|nylon_12_smooth|nylon_11|nylon_12_gf|nylon_12_esd|nylon_12_white|nylon_pa2200|nylon_12_sls|tpu (free-form — \"PA12\", \"glass filled\" resolve to the closest stocked powder); elastomer_print: Jetted elastomer: tepu_30a|tepu_50a (free-form — \"TPU\", \"soft rubber\" resolve to the closest stocked durometer); cnc: aluminum_6061|aluminum_7075|stainless_304|titanium|brass|acetal|delrin|abs|nylon_pa6|peek|acrylic (free-form asks resolve to the closest supported stock); sheetmetal: mild_steel|aluminum_5052|stainless_304 (free-form — \"steel\", \"5052\", \"stainless\" resolve; unknown asks get closest-match offers). Omit to compare the defaults; laser_cut: acrylic|plywood|mdf|delrin|uhmw|hdpe|g10|carbon_fiber|mild_steel|aluminum_5052|stainless_304 (free-form — \"plexiglass\", \"birch\" resolve; unknown asks get closest-match offers); decal: vinyl|holographic|transparent|glitter (free-form — \"chrome\" etc. gets closest matches)",
                "type": "string"
              },
              "materials": {
                "description": "The materials the user will accept, when they name SEVERAL or a family rather than one (\"plastic or metal\", \"delrin or PLA\", \"any aluminum\") — each word a family (\"plastic\", \"metal\", \"wood\") or a specific material (\"pla\", \"delrin\", \"aluminum_6061\"). Only options in a listed material are shown; which shops are asked does not change. For ONE specific material use material instead: a stated material rules and this list is set aside (the quote says so). Usually OMIT: pass it only when the user names the materials they accept",
                "items": {
                  "maxLength": 48,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 24,
                "type": "array"
              },
              "max_budget_usd": {
                "description": "Hard budget cap in USD, all-in",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "metal_alloy": {
                "description": "Metal AM alloy: stainless_316l|stainless_17_4ph|titanium_ti64|aluminum_alsi10mg|inconel_718|cobalt_chrome|tool_steel_h13|copper (free-form asks like \"Ti-6Al-4V\" resolve to the closest stocked powder)",
                "type": "string"
              },
              "metal_finish": {
                "description": "Metal AM post-processing: as_printed|bead_blast|machined_critical|polished|heat_treated (as_printed keeps support witness marks)",
                "type": "string"
              },
              "metal_technology": {
                "description": "Metal AM process: laser_powder_bed (SLM/DMLS/LPBF)|binder_jet|ebm. Omit to let the vendor pick its default for the alloy",
                "type": "string"
              },
              "min_vendor_reviews": {
                "description": "Only vendors with at least this many verified-purchase reviews",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "min_vendor_stars": {
                "description": "Only vendors whose displayed review rating is at least this many stars (1-5). Vendors with no reviews yet are excluded — the filter demands demonstrated quality",
                "maximum": 5,
                "minimum": 1,
                "type": "number"
              },
              "outdoor_rated": {
                "description": "Must survive outdoor exposure",
                "type": "boolean"
              },
              "paper": {
                "description": "Paper stock — free-form (\"matte\", \"glossy\", \"recycled\", \"14pt\"). Resolved to the closest stock the vendor runs",
                "type": "string"
              },
              "part_number": {
                "description": "UFP part number from a previous paid order (UFP-… or part_…). Reorders: replaces design_file/file_url entirely; any other fields provided override the stored spec",
                "type": "string"
              },
              "placement": {
                "description": "Print placement for apparel: front (default) | back | front_back",
                "type": "string"
              },
              "powder_finish": {
                "description": "Powder post-processing: as_printed (raw powder surface) | vapor_polished | polished",
                "type": "string"
              },
              "powder_technology": {
                "description": "Powder process: mjf (HP Multi Jet Fusion) | sls (laser sintering). Omit to let the vendor pick its default lane for the material",
                "type": "string"
              },
              "process": {
                "description": "What to fabricate. If the user just drops a file and asks for a price, OMIT this — UFP detects the file type (artwork, mesh — STL/OBJ/PLY/3MF/AMF, BREP — STEP/IGES, DXF) and routes it to every process that can make it; the response's routing.also_possible lists processes UFP can't quote yet",
                "enum": ["fdm_print", "resin_print", "powder_print", "metal_print", "elastomer_print", "cnc", "sheetmetal", "laser_cut", "decal", "print", "apparel"],
                "type": "string"
              },
              "processes": {
                "description": "Only quote these fabrication processes — a constraint that narrows the auto-routing fan. Friendly terms accepted (\"sheet metal\", \"3d printing\", \"cnc\", \"laser\"); unmappable terms are reported, never an error. Usually OMIT: auto-routing quotes every process that can make the file. Pass it only when the user explicitly limits the process. One exception, for a flat part: a sheet-metal shop that laser-cuts flat stock is still returned under [\"laser\"] — its offer keeps process \"sheetmetal\" and carries also_processes [\"laser_cut\"] (one offer, listed under both; never two)",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "product": {
                "description": "print: Print product kind: business_cards|flyers|posters. Omit to quote every kind the artwork fits; apparel: apparel: t_shirt|hoodie|long_sleeve|tank_top (free-form — \"tee\", \"crewneck\" resolve to the closest product)",
                "type": "string"
              },
              "proven_spec_orders": {
                "description": "Only vendors with at least N completed orders for this exact process+material — \"a vendor that prints PC reliably\"",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "quantities": {
                "description": "Quantities the user actually wants — pass [1] or [2] if that's the ask. Vendors with a higher minimum quote AT their minimum and the offer notes it (requested_quantity). Default: 25 for decals, 1 for prints; a part_number reorder defaults to the quantity last purchased",
                "items": {
                  "exclusiveMinimum": 0,
                  "type": "integer"
                },
                "maxItems": 5,
                "type": "array"
              },
              "requirements": {
                "description": "Verbatim context terms from the user — materials, finishes, certifications, tolerances (\"UV resistant\", \"anodized: red\", \"iso 13485\", \"tolerance: 0.1mm\"). UFP applies what it can and reports what it could not; unresolvable terms are logged for vendor sourcing. Do not interrogate the user to fill this — pass what they said.",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "selection": {
                "additionalProperties": false,
                "description": "The pick: the ONE option to order, named by what it is rather than by an offer id (ids change when a quote is priced again). vendor = the shop as it appears on offers (friendly names accepted); spec = the resolved options the option must carry, each optional — material, color, finish, thickness_in (leave one out, or null, and it does not narrow the pick); process and quantity likewise optional; shipping_speed = the word the shipping option itself goes by (\"standard\", \"express\", \"ground\"), omitted = the cheapest speed. Storing a pick changes no price and never asks every shop. CHOOSING STARTS THAT ONE SHOP'S CHECK: on a quote you already have, a pick that comes to exactly one option whose shop answered more than 15 minutes ago (or was never asked) has that one shop asked to confirm it, and the answer already says so. Every quote read then carries selection and selection_match { status \"one\" | \"none\" | \"many\", matched, offer_id, shipping_option_id, speed_fallback, confirmed_until, check { state \"running\" | \"fresh\" | \"not_started\", code, retry_after_s }, price_changed }: check \"fresh\" = the shop's answer is under 15 minutes old; \"running\" = that shop is being asked now; \"not_started\" = nobody is being asked and code says why (\"ask_limited\" = the pick is kept and the shop is asked when the user pays; \"quote_expired\" = these answers are over 24 hours old: call reopen_quote, the pick is kept). Usually OMIT: pass it when the user has settled on one option, or to order by create_checkout with selection true",
                "properties": {
                  "process": {
                    "$ref": "#/properties/process"
                  },
                  "quantity": {
                    "exclusiveMinimum": 0,
                    "maximum": 100000,
                    "type": "integer"
                  },
                  "shipping_speed": {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "spec": {
                    "additionalProperties": {
                      "anyOf": [
                        {
                          "maxLength": 120,
                          "type": "string"
                        },
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "properties": {
                      "color": {
                        "anyOf": [
                          {
                            "maxLength": 48,
                            "minLength": 1,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "finish": {
                        "anyOf": [
                          {
                            "maxLength": 48,
                            "minLength": 1,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "material": {
                        "anyOf": [
                          {
                            "maxLength": 48,
                            "minLength": 1,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "thickness_in": {
                        "anyOf": [
                          {
                            "exclusiveMinimum": 0,
                            "maximum": 1,
                            "type": "number"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "type": "object"
                  },
                  "vendor": {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["vendor"],
                "type": "object"
              },
              "share_key": {
                "description": "Share key for a LOCKED part — the k=… value from the owner's share link (…/part/UFP-…?k=KEY). Required with part_number when the part is locked; omit otherwise",
                "type": "string"
              },
              "ship_to_zip": {
                "description": "Destination US ZIP code, exactly as the user stated it. OMIT if the user has not given one — NEVER guess or invent a ZIP. Without it, prices come back all-in with shipping to an assumed central-US destination, flagged on routing.ship_to",
                "pattern": "^\\d{5}(-\\d{4})?$",
                "type": "string"
              },
              "ships_from": {
                "description": "Only vendors that ship from these countries/regions (\"only US vendors\", \"keep it domestic\") — an INCLUDE list. Friendly terms accepted (\"US\", \"Europe\", \"Germany\", \"China\", \"UK\"); unmappable terms are reported, never an error. Vendors whose origin is unknown or whose network is worldwide (origin not guaranteed) are excluded, each with a note saying why. Usually OMIT: pass it only when the user explicitly limits where vendors ship from",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "shore_a": {
                "description": "Numeric Shore A durometer ask (10-95, e.g. 40). Resolved to the NEAREST stocked durometer with a substitution note — never a silent swap",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "sides": {
                "description": "single|double sided printing (defaults: cards double, flyers/posters single)",
                "type": "string"
              },
              "size": {
                "description": "Print size — pass the user's words verbatim (\"letter\", \"24x36\", \"half letter\"). Cards are 3.5x2; flyers 8.5x5.5|8.5x11|11x17; posters 12x18 through 36x48. Unknown sizes get closest-match offers",
                "type": "string"
              },
              "submersible": {
                "description": "Must survive submersion in water",
                "type": "boolean"
              },
              "tapping": {
                "description": "Tapped (threaded) holes for a sheet-metal or CNC-machined part — one record per hole the user wants threads cut into. `thread` is the callout in the user's words (\"M6\", \"M4 x 0.7\", \"1/4-20\") and is all that's required; when known, add the hole's center in the part's own mm frame (located_at_mm), its unit axis, the pre-tap drilled diameter, and depth_mm so the shop taps the right hole. Pass these when the user asks for threaded/tapped holes; shops whose connector can price and order threads on that process price them, and every other shop — on every process, 3D printing and laser cutting included — is left out with the reason rather than pricing the part without its threads. Take the threads off to see prices without them.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "axis": {
                      "$ref": "#/properties/bends/items/properties/line/properties/p1"
                    },
                    "depth_mm": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "drilled_diameter_mm": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "face_id": {
                      "type": "integer"
                    },
                    "hole": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "located_at_mm": {
                      "additionalProperties": false,
                      "properties": {
                        "x": {
                          "type": "number"
                        },
                        "y": {
                          "type": "number"
                        },
                        "z": {
                          "type": "number"
                        }
                      },
                      "required": ["x", "y", "z"],
                      "type": "object"
                    },
                    "thread": {
                      "maxLength": 32,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["thread"],
                  "type": "object"
                },
                "maxItems": 200,
                "type": "array"
              },
              "thickness_in": {
                "description": "sheetmetal: Sheet thickness in inches (e.g. 0.063 = 14 ga aluminum). Quoted at the nearest stocked thickness; omit for ~16 ga default; laser_cut: Nominal thickness in inches; quoted at the vendor's nearest stocked thickness. Omit for the material's common stock",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "units": {
                "description": "sheetmetal: DXF drawing units: \"mm\" (default) or \"in\". STEP files carry their own units; laser_cut: DXF drawing units: \"mm\" (default) or \"in\"",
                "type": "string"
              },
              "vendors": {
                "description": "Only these specific vendors/makers (\"just quote Slant 3D\") — an INCLUDE list of vendor names as they appear on offers. Friendly names accepted (\"A3D\", \"slant 3d\"); unmatched names are reported, never an error. Usually OMIT: pass it only when the user explicitly names the vendors they want",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 32,
                "type": "array"
              },
              "vendors_exclude": {
                "description": "Shops to leave out (\"anyone but Slant 3D\", \"not A3D or Fictiv\") — shop names as they appear on offers; friendly names accepted (\"A3D\", \"slant 3d\"), and a name that matches no shop is reported, never an error. A shop on this list is never asked and never shown. Works beside vendors: the shops shown are the vendors list (or everyone) minus this list, so a shop named on both is left out. Usually OMIT: pass it only when the user names shops they do not want",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 32,
                "type": "array"
              },
              "width_in": {
                "description": "Decal width in inches (default 3)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "within_days": {
                "description": "Arrival within this many calendar days from today (\"within 10 days\", \"in two weeks\" → 14). Counted from the day the quote is READ, so it keeps meaning \"within N days of now\" — the day is the UTC date, the one arrival dates on offers (eta_date) are written in, so compare against those dates rather than a local calendar; an option keeps only the shipping speeds that arrive in time. With deadline as well, the earlier date rules. Use deadline instead when the user names a date",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
