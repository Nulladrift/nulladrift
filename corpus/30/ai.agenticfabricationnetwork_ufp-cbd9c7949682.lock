        {
          "name": "leave_review",
          "title": "Leave vendor review",
          "description": "Record the user's verified-purchase review of how a UFP order turned out. YOUR JOB IS TO STRUCTURE THE FEEDBACK: turn what the user actually said into stars (1-5 overall) and facet scores — \"the cut was sloppy\" -> quality, \"parts arrived 2 days late\" -> timeliness, \"wrong color\" -> accuracy. Keep the optional comment to a short factual summary of their words; never embellish. ALWAYS draft the review (stars, facets, comment) and confirm it with the user BEFORE calling this tool — e.g. \"I'll rate this 2 stars with timeliness 1 because it arrived 2 days late — send it?\". One review per order: submitting again updates the existing review. If you do not have the order id from this conversation, ask the user for it (it is on their receipt email and order page); never guess one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "claims": {
                "additionalProperties": false,
                "description": "CHECKABLE claims from the user's feedback — the network stamps each against its own records (the ordered spec, polled tracking + delivery events) and attaches evidence chips to the review. Only pass what the user actually asserted.",
                "properties": {
                  "delivery_claim": {
                    "description": "The user's delivery claim (\"never showed up\" -> not_delivered)",
                    "enum": ["not_delivered", "late", "on_time"],
                    "type": "string"
                  },
                  "received_material": {
                    "description": "Material the user says actually ARRIVED, when they complain it differs from the order (\"they sent aluminum\")",
                    "maxLength": 80,
                    "type": "string"
                  },
                  "received_quantity": {
                    "description": "Count the user says actually arrived, when it differs from the order",
                    "exclusiveMinimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "comment": {
                "description": "Short factual summary of the user's feedback, in their spirit — optional",
                "maxLength": 2000,
                "type": "string"
              },
              "facets": {
                "additionalProperties": false,
                "description": "Score only the facets the user actually spoke to",
                "properties": {
                  "accuracy": {
                    "description": "How well the item matched the ordered spec/design",
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "quality": {
                    "description": "Build/print/cut quality",
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "timeliness": {
                    "description": "Delivery speed vs the quoted ETA",
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "order_id": {
                "description": "The UFP order being reviewed (ord_…), from create_checkout or get_order_status in this conversation, or from the user's receipt email / order page",
                "type": "string"
              },
              "stars": {
                "description": "Overall rating the user confirmed, 1-5",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["order_id", "stars"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
