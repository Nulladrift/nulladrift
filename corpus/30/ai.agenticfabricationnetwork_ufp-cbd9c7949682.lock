        {
          "name": "reopen_quote",
          "title": "Reopen a quote someone came back to",
          "description": "Use when the user comes back to a part priced earlier (a saved quote_id), or when a quote carried answers_pending. A quote's answers are shown for 24 hours. Inside them this returns the same quote and asks nobody (reopened \"same\"). Past them it makes a NEW quote of the same file, configuration, rules and pick — work from the quote_id it returns: with the answers anyone got for this same part and request in the last 24 hours (\"copied\", nobody asked); else by asking the shops once (\"asked\" — the offers fill in like any new quote); else, when someone is asking about it right now, at our instant prices (\"waiting\": call this again after answers_pending.retry_after_s seconds). \"press_needed\" = this quote was itself made by reopening an old one and nothing was picked or changed on it since, so nobody is asked again by itself: pass pressed true only when the user asks for today's prices. A quote of a shared cart, a part already paid for, or instant prices only comes back as it reads. Do not use it to look at a board again. HOW OLD AN ANSWER IS: a shop's answer is shown for 24 hours, to everyone with the same request (the same design bytes with the same everything asked), so a quote of a part someone priced in the last 24 hours comes back complete at once with those answers and no shop is asked again. An offer says when its shop answered (answered_at). Past 15 minutes it reads stale: true — it is shown at that price and the shop confirms it again before anyone pays (check_offer, or checking out, asks that one shop). A shipping option of such an offer carries eta_approximate: true: say \"about N days\" from eta_days and never state its eta_date as a date, because no shop stands behind a date until it confirms again. If a quote carries answers_pending, someone else is asking the shops about this same request right now and these are our instant prices: call reopen_quote with that quote_id after retry_after_s seconds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "pressed": {
                "description": "true = the user asked for today's prices. Needed only after reopened read \"press_needed\"",
                "type": "boolean"
              },
              "quote_id": {
                "description": "The quote to reopen",
                "type": "string"
              }
