        {
          "name": "check_offer",
          "title": "Ask the shop to confirm an offer",
          "description": "Run the shop's manufacturability check on ONE offer whose manufacturability_check.status is \"unchecked\" (the price stands from the shop's own pricing, but no shop was asked for that material / finish yet) or still \"checking\". The network asks that shop once for exactly this option — its material, gauge, finish, quantity and the quote's destination — and lands the answer on the SAME offer: passed (orderable at the shown price; a status of \"repriced\" means exactly the same — the price shown is the shop's, never tell the user it changed) or failed (the shop could not confirm the part: the offer cannot be ordered and is no longer listed on the quote — the answer still carries it, with a plain message; tell the user and carry on with the offers that are listed). Call it when the user settles on such an offer and before create_checkout (checkout refuses an unchecked offer). Waits up to wait_s (default 45) for the shop; pending: true means the shop is still answering — re-read the quote shortly. Nothing else on the quote changes. On an instant-only quote (routing.instant_only true) no shop is asked: the offer comes back unchanged with a plain message — relay it, and quote the part again without instant_only if the user wants to order. On a lazy quote (routing.lazy true) this call is how a shop is asked at all: it asks the one shop of this offer, and the offer can be ordered once it passes. A shop's confirmation of an offer is good for 15 minutes: while it stands the offer carries confirmed_until (an ISO time) and can be ordered. After it the offer is NOT failed and NOT removed — it keeps its place and the price the shop last confirmed, and its manufacturability_check reads status \"unchecked\" with reason \"confirmation_lapsed\". CHOOSING STARTS THAT SHOP'S CHECK: when the user settles on an option and you store the pick, that one shop is asked again by itself (the answer's selection_match.check reads \"running\"), and create_checkout and checkout_cart ask it themselves too when it still needs confirming — nobody else is asked, and no separate check_offer call is needed. Pay when it lands: the checkout waits for it. If the shop's price came back higher than the user agreed to, the checkout stops ONCE (price_went_up, with the old and the new figure) and nothing is created: tell the user both figures, then send the same call again. An offer whose manufacturability_check reads status \"unchecked\" with reason \"network_restarted\" was being confirmed by its shop when the network restarted, so the answer never came: tell the user, in these words, \"A new version of AFN has been released, please refresh the page\". Nothing is lost — the price stands and the offer can simply be checked again with check_offer. Say it once, when a tool's own text tells you to; the same reason still on an offer on a later read is history, not news.",
