                "description": "The pick: the ONE option to order, named by what it is rather than by an offer id (ids change when a quote is priced again). vendor = the shop as it appears on offers (friendly names accepted); spec = the resolved options the option must carry, each optional — material, color, finish, thickness_in (leave one out, or null, and it does not narrow the pick); process and quantity likewise optional; shipping_speed = the word the shipping option itself goes by (\"standard\", \"express\", \"ground\"), omitted = the cheapest speed. Storing a pick changes no price and never asks every shop. CHOOSING STARTS THAT ONE SHOP'S CHECK: on a quote you already have, a pick that comes to exactly one option whose shop answered more than 15 minutes ago (or was never asked) has that one shop asked to confirm it, and the answer already says so. Every quote read then carries selection and selection_match { status \"one\" | \"none\" | \"many\", matched, offer_id, shipping_option_id, speed_fallback, confirmed_until, check { state \"running\" | \"fresh\" | \"not_started\", code, retry_after_s }, price_changed }: check \"fresh\" = the shop's answer is under 15 minutes old; \"running\" = that shop is being asked now; \"not_started\" = nobody is being asked and code says why (\"ask_limited\" = the pick is kept and the shop is asked when the user pays; \"quote_expired\" = these answers are over 24 hours old: call reopen_quote, the pick is kept). Usually OMIT: pass it when the user has settled on one option, or to order by create_checkout with selection true. On refine_quote: an object stores the pick, null clears it, omitted keeps the one the quote has. Sent alone it is stored on the SAME quote at once (the same quote id comes back, nothing re-prices, no shop is asked); sent with other changes it rides onto the new quote"
              },
              "ship_to_zip": {
                "description": "Destination US ZIP code, exactly as the user stated it — use this when the user provides their ZIP after a quote priced to the assumed central-US destination (routing.ship_to); the refined prices become theirs. NEVER guess or invent a ZIP",
                "pattern": "^\\d{5}(-\\d{4})?$",
                "type": "string"
              },
              "ships_from": {
                "description": "Only vendors that ship from these countries/regions (\"only US vendors\", \"just European shops\", \"keep it domestic\") — an INCLUDE list naming where the user DOES want vendors from. A CONSTRAINT like processes: non-matching vendors drop instantly (nothing re-prices), further refines inherit the filter, and [\"any\"] clears it to show vendors everywhere again. Friendly terms accepted (\"US\", \"Europe\", \"Germany\", \"China\", \"UK\"). Vendors whose origin is unknown or whose network is worldwide (a specific origin cannot be guaranteed) are excluded, each with an honest note. For \"nothing from X\" asks, pass the regions the user does want instead",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "sort_by": {
                "description": "\"Organize by\": re-order the quote's offer cards (\"sort by cheapest\" → \"price\"; \"soonest arrival first\" → \"arrival\"; \"best rated\" → \"rating\"; \"total_price\" = part + cheapest shipping; \"recommended\" restores the default price+speed rank). PURE PRESENTATION — answers instantly on the same quote, never re-prices or drops offers, and the ordering sticks across re-reads, streaming, and later refines until changed",
                "enum": ["recommended", "price", "unit_price", "total_price", "arrival", "rating"],
                "type": "string"
              },
              "sort_direction": {
                "description": "Flip a sort_by ordering: \"desc\" reverses the key's natural direction (\"most expensive first\" = sort_by \"price\" + \"desc\"). Only meaningful with sort_by",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "sort_label": {
                "description": "Short human wording for a sort_order, displayed on the board (\"most green first\") — required with sort_order, since only you know what your order means",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "sort_order": {
                "description": "EXPLICIT card order for asks only you can judge (\"sort the most green to the top\"): look at the offers' preview images, decide the order yourself, and pass the offer ids first-on-top. Offers you leave out (including ones that stream in later) land below the listed ones in the default rank. Pass sort_label with it",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "submersible": {
                "type": "boolean"
              },
              "tapping": {
                "anyOf": [
                  {
                    "description": "Tapped (threaded) holes for a sheet-metal or CNC-machined part — one record per hole the user wants threads cut into. `thread` is the callout in the user's words (\"M6\", \"M4 x 0.7\", \"1/4-20\") and is all that's required; when known, add the hole's center in the part's own mm frame (located_at_mm), its unit axis, the pre-tap drilled diameter, and depth_mm so the shop taps the right hole. Pass these when the user asks for threaded/tapped holes; shops whose connector can price and order threads on that process price them, and every other shop — on every process, 3D printing and laser cutting included — is left out with the reason rather than pricing the part without its threads. Take the threads off to see prices without them.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "axis": {
                          "$ref": "#/properties/bends/anyOf/0/items/properties/line/properties/p1"
                        },
                        "depth_mm": {
                          "exclusiveMinimum": 0,
                          "type": "number"
                        },
                        "drilled_diameter_mm": {
                          "exclusiveMinimum": 0,
                          "type": "number"
                        },
                        "face_id": {
                          "type": "integer"
                        },
                        "hole": {
                          "minimum": 1,
                          "type": "integer"
                        },
                        "located_at_mm": {
                          "additionalProperties": false,
                          "properties": {
                            "x": {
                              "type": "number"
                            },
                            "y": {
                              "type": "number"
                            },
                            "z": {
                              "type": "number"
                            }
                          },
                          "required": ["x", "y", "z"],
                          "type": "object"
                        },
                        "thread": {
                          "maxLength": 32,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["thread"],
                      "type": "object"
                    },
                    "maxItems": 200,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "New tapped-hole records for this part — a spec change: sheet lanes requote with exactly these taps (the list REPLACES the previous one, never patches it). Same shape as on get_fabrication_quote: thread callout (\"M6\", \"1/4-20\") required, hole geometry optional. Pass null to REMOVE every tap"
              },
              "thickness_in": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 1,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "New sheet thickness in INCHES (\"make it in 1/8\" → 0.125) — a spec change: sheet lanes requote at the nearest stocked gauge, flagging the substitution when the match isn't close. Pass null to REMOVE a previously asked thickness — back to the material's default gauge"
              },
              "undo_last_step": {
                "description": "GO BACK EXACTLY ONE STEP (\"undo that\", \"go back\", \"put it back how it was\"): the network restores the previous quote's stored spec and constraints EXACTLY — never reconstructed from conversation — and re-prices where needed. Send it ALONE (no other args besides quote_id); combining it with changes is rejected. The quote's steps[] names what each undo would take back — steps[0] is the newest. Undo resets the baseline like any unlabeled refine, so open comparison scenarios close. Undoing the original quote is rejected with honest wording — relay it",
                "type": "boolean"
              },
              "vendors": {
                "description": "Only these specific vendors/makers (\"only show A3D Manufacturing\", \"just Slant 3D and Fictiv\") — an INCLUDE list of vendor names as they appear on offers. A CONSTRAINT like processes: other vendors' offers drop instantly (nothing re-prices), further refines inherit the filter, and [\"any\"] clears it to show every vendor again. Friendly names accepted (\"A3D\", \"slant 3d\"); unmatched names are reported, never an error. This is THE way to answer \"show me everything vendor X offers\" — the filtered quote lists that vendor's complete lineup",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 32,
                "type": "array"
              },
              "vendors_exclude": {
                "description": "Shops to leave out (\"anyone but Slant 3D\", \"not A3D or Fictiv\") — shop names as they appear on offers; friendly names accepted (\"A3D\", \"slant 3d\"), and a name that matches no shop is reported, never an error. A shop on this list is never asked and never shown. Works beside vendors: the shops shown are the vendors list (or everyone) minus this list, so a shop named on both is left out. Usually OMIT: pass it only when the user names shops they do not want. On a refine: naming more shops answers at once from what the quote holds (no shop is asked); [\"any\"] or clear [\"vendors_exclude\"] removes the list, and the shops that come back are priced then",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 32,
                "type": "array"
              },
              "within_days": {
                "description": "Arrival within this many calendar days from today (\"within 10 days\", \"in two weeks\" → 14). Counted from the day the quote is READ, so it keeps meaning \"within N days of now\" — the day is the UTC date, the one arrival dates on offers (eta_date) are written in, so compare against those dates rather than a local calendar; an option keeps only the shipping speeds that arrive in time. With deadline as well, the earlier date rules. Use deadline instead when the user names a date. On a refine it answers at once from what the quote holds, tighter or looser; clear [\"within_days\"] removes it",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["quote_id"],
            "type": "object"
          },
