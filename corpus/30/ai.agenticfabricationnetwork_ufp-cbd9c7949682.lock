        {
          "name": "get_fabrication_quote",
          "title": "Get fabrication quote",
          "description": "Get fabrication price and delivery offers for a design file or an existing AFN part number. Supports 3D printing, CNC machining, sheet metal, decals, print, and apparel. If the user just provides a file and asks for a price, omit process so AFN can route it to suitable makers. Provide the design as design_file (an attachment or generated file) or file_url (a public URL). For a reorder, pass the UFP part number as part_number instead of a file; locked parts also require share_key from the owner's share link. A .ufp part container is accepted as a design file, and its saved specification applies unless the user changes it. Some offers carry manufacturability_check: the price is set; the shop is confirming it can make the part as drawn (status \"checking\" for about expected_s seconds, then passed, repriced, or failed) — present them as real prices and never call create_checkout on one while it is still checking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "attachment_urls": {
                "description": "Additional files for the SAME part — the PDF drawing next to the STEP, spec sheets, BOMs. Pass everything the user gave you; UFP works out which file is the part and which are supporting documents.",
                "items": {
                  "$ref": "#/properties/file_url"
                },
                "maxItems": 10,
                "type": "array"
              },
              "bend_count": {
                "description": "Number of bends in the design (bend lines must be in the file). Prices CNC bending; omit for flat parts",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "bends": {
                "description": "Sheet-metal bend lines, each as TWO POINTS in the part's own mm frame (flat DXF parts use z=0: a bend from (0,12.7) to (76.2,12.7) is p1 [0,12.7,0], p2 [76.2,12.7,0]). angle_deg is the target bend angle (90 = a right-angle flange), direction \"up\"/\"down\" is the fold direction relative to the flat pattern, radius_mm the requested inside radius (omit it — the shop resolves to its tooling and reports what it used). Pass these when the user articulates WHERE the bends go; a bare \"it has 2 bends\" is bend_count, not this.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "angle_deg": {
                      "exclusiveMaximum": 180,
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "direction": {
