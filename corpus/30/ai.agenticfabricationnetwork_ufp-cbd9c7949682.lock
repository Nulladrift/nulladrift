        {
          "name": "fork_cart",
          "title": "Copy a shared cart",
          "description": "Copy a cart: the same parts in the same order, each configured and picked as it was. Use it when the user opens a shared cart, so that nothing they change reaches the cart it was copied from; work on the cart_id this returns from then on. By default the copy is a NEW cart; pass into_cart_id (an open cart the user already holds) to add the copied parts to that cart instead — one call, and that cart is the answer. Use it with for_link true when the user wants to share their own cart: the copy is then a shared cart (status \"shared\") that can only be read and copied, and its cart_id is the one to hand out — never hand out the cart_id of the cart the user is working on. Pass item_ids to copy only those parts (one part shared by itself is a cart of one). Each part of the answer says quoted_anew: true when a new quote was made for it, false when the shared quote was copied. WHAT EACH WAY COSTS IN SHOP CONTACT: no shop is asked to make any copy, and the answer comes back at once with every part priced. A for_link copy never contacts a shop, then or later. A copy with recheck false never contacts a shop either — use it when you only want to read what is in a shared cart. Any other copy (the default, for a user who opened a shared cart to act on it) asks nobody when the cart's answers are under 24 hours old: each part comes with its shops' answers as they stand. Only a part whose answers are older than 24 hours is asked about again after the copy answers — its shops, as an ordinary quote of that part would ask them, one part at a time — and if anyone got answers for this same part and request in the last 24 hours those are copied instead with nobody asked. Never copy the same cart twice to refresh it — read the copy you have. LIMITS: copies are limited per caller a minute and a day, and the quotes the re-check will really start count against the caller's quote limit (a part whose shops are already being asked, or are queued to be asked, for another copy of the same request starts none); when you act for a person and say so (on_behalf_of), that person has their own counts of copies and of re-check quotes, a minute and a day; over a limit the answer is rate_limited with the seconds to wait, nothing is made and no shop is asked — wait, do not retry at once. A cart id that matches no cart answers \"unknown cart\" and nothing else. When it is the into_cart_id cart that is not known, the answer is an error with error \"into_cart_unknown\": nothing was copied — copy again without into_cart_id to get a new cart. A SHARED CART: status \"shared\" means the cart came by a link and can only be read and copied. Never change it, pick on its parts' quotes, run check_offer on them or check it out — each of those is refused (cart_shared). Copy it with fork_cart and work on the copy, which is the user's own cart. A COPIED CART: copied true is present on a cart that was copied from a shared one; a cart never says which cart it was copied from. Each part's price_source says whose prices it shows: \"shared\" = recent shop prices that were copied with nobody asked — the prices of the person who shared the cart as they stood when it was copied, or the shops' own answers to this same part and request from the last 24 hours; \"instant\" = our instant prices, because the shared prices could not be copied (they were too old, or still coming in) — no shop has been asked about that part on this quote yet; \"own\" = this cart's own quote of the part, its shops asked. A pick that travelled with the cart but matches no option now reads selection_match.status \"none\": that part is still to choose. The buyer, the address, the email and any coupon never travel with a cart. PARTS OLDER THAN 24 HOURS: a shop's answer is shown for 24 hours. A cart copied with fork_cart inside them asks nobody: every part comes with its answers as they stand. A part whose answers are OLDER than 24 hours shows our instant prices first, and (unless the copy was for_link or recheck false) its shops are then asked about it again, one part at a time. Each such part's recheck says where it stands: \"queued\" = priced, its shops are asked when its turn comes; \"asking\" = its shops are being asked now; \"done\" = the shops' answers are in. A part with no recheck is under 24 hours old and nothing is pending for it. A part's quote_id CHANGES when its turn comes, so read quote_id off get_cart every time and never keep an old one. Until every such part reads done, tell the user the prices and dates may still move, and read the cart again; do not start a second copy to hurry it. A picked part goes first and its picked option is confirmed with its shop as part of it. HOW A CART WORKS: each part in a cart IS a quote — its material, finish, quantity, rules and its pick (selection) live on that part's quote, and nothing is kept twice. To change a part, call refine_quote on its quote_id and pass cart_item_id: the cart follows the part to the new quote by itself. To pick the option to order for a part, store the pick on its quote (refine_quote selection). The cart_id is the only key to the cart — whoever holds it can read and change it — so give it only to the user it belongs to, and never put it in a link you did not get from the network.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cart_id": {
                "description": "The shared cart to copy (cart_…)",
                "type": "string"
              },
              "for_link": {
                "description": "true = make the copy a shared cart, to hand out in a link: it can be read and copied, never changed or checked out, and it never contacts a shop. Omit when the user is opening a cart someone shared",
                "type": "boolean"
              },
              "into_cart_id": {
                "description": "An OPEN cart the user already holds (cart_…): the copied parts are added to it, after its own parts, and that cart is returned. Refused, with nothing copied, when the cart would hold more than 24 parts or is shared or ordered. Omit to get a new cart. Never together with for_link",
                "type": "string"
              },
              "item_ids": {
                "description": "Copy only these parts — their item_id values from the shared cart. Omit to copy every part",
                "items": {
                  "type": "string"
                },
                "maxItems": 24,
                "minItems": 1,
                "type": "array"
              },
              "on_behalf_of": {
                "description": "For a client that serves many people from one place: its own opaque id for the person it is acting for (never a name or an email), so that person gets a copy limit of their own. Omit otherwise",
                "maxLength": 64,
                "type": "string"
              },
              "recheck": {
                "description": "false = contact no shop at all: the copy keeps the prices it was given (use it to read a shared cart). Omit (the default): a part whose answers are under 24 hours old is copied with them and nobody is asked; a part older than that is asked about again after the copy answers, one part at a time. Never true together with for_link",
                "type": "boolean"
              }
            },
            "required": ["cart_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
