        {
          "name": "create_cart",
          "title": "Start a cart",
          "description": "Start a cart, for a user who wants several parts and one payment. Pass items to put parts in at once; each is named by quote_id (a quote you already have — its shops are not asked again), or by file_id or file_url (a design that has no quote yet — it gets one ordinary quote, priced exactly as get_fabrication_quote would price it). Returns the cart with its cart_id. HOW A CART WORKS: each part in a cart IS a quote — its material, finish, quantity, rules and its pick (selection) live on that part's quote, and nothing is kept twice. To change a part, call refine_quote on its quote_id and pass cart_item_id: the cart follows the part to the new quote by itself. To pick the option to order for a part, store the pick on its quote (refine_quote selection). The cart_id is the only key to the cart — whoever holds it can read and change it — so give it only to the user it belongs to, and never put it in a link you did not get from the network.",
