        {
          "name": "create_checkout",
          "title": "Create checkout",
          "description": "Create the order and get a hosted payment link for a chosen offer. Call this as soon as the user picks an offer + shipping speed. This tool takes NO personal details: never ask for — and never pass — a name, address, email, or phone; the secure payment page collects the shipping address, email, and phone (and billing) itself, even when the user volunteered them in chat. Returns checkout_url — AFN's order page (what is being made, by which shop, the all-in price) with a Continue to payment button to the secure hosted payment page; give the link to the user. UFP places the vendor order automatically after payment. An offer whose manufacturability_check.status is still \"checking\" is refused (offer_not_ready, with retry_after_s): the price is set; the shop is confirming it can make the part as drawn — wait for the check to pass before calling, and never call this on a checking offer. An offer whose status is \"unchecked\" (no shop asked for that option yet — the price stands) needs check_offer first; check out once it reads passed or repriced.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "coupon_code": {
                "description": "Coupon code, only if the user provided one (early-adopter codes from the AFN team). Case-insensitive. The discount appears on the payment page; a 100%-off code makes the total $0 with no card required. Never invent or guess a code.",
                "type": "string"
              },
              "offer_id": {
                "type": "string"
              },
              "return_url": {
                "description": "Exact URL of the page the user is on right now, IF the client application knows it (a web app embedding this tool passes its own page URL). The post-payment page shows a 'Return to <site>' button pointing here. Omit when unknown — never invent one.",
                "type": "string"
              },
              "shipping_option_id": {
                "description": "One of the offer's shipping option ids",
                "type": "string"
              }
            },
            "required": ["offer_id", "shipping_option_id"],
            "type": "object"
          },
