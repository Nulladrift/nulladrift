        {
          "name": "find_customers",
          "title": "Find customers for a business",
          "description": "Start a new search for potential customers of the user's business: recent public posts by people who are asking for, or want to buy, what the business sells. Only for finding new customers when the user asks for that; it does not list or rank leads the user already has. A search saves a campaign in the user's EvenLeads account, uses one search from their plan and takes one to three minutes. Takes a plain description of the business (and its website if known) and returns a search id right away with the first results as they arrive. The user must be signed in with EvenLeads.",
          "inputSchema": {
            "properties": {
              "business": {
                "description": "What the business sells and to whom, in the user's own words. One to three sentences is enough.",
                "type": "string"
              },
              "campaign_id": {
                "description": "Only when the user explicitly asks to run a new search on one of their existing campaigns, by its campaign id. Not for showing that campaign's leads.",
                "type": "integer"
              },
              "ideal_customers": {
                "description": "Optional: who the best customers are (industry, size, situation).",
                "type": "string"
              },
              "website": {
                "description": "The business website, if the user gave one.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "dashboard_url": {
                "type": "string"
              },
              "leads": {
                "items": {
                  "properties": {
                    "author": {
                      "type": "string"
                    },
                    "author_url": {
                      "type": "string"
                    },
                    "campaign_id": {
                      "type": "integer"
                    },
                    "community": {
                      "type": "string"
                    },
                    "id": {
                      "type": "integer"
                    },
                    "platform": {
                      "type": "string"
                    },
                    "posted_at": {
                      "type": "string"
                    },
                    "reason": {
                      "description": "Why this post matches the business.",
                      "type": "string"
                    },
                    "score": {
                      "description": "AI match score, 0-10.",
                      "type": "integer"
                    },
                    "status": {
                      "enum": ["new", "contacted", "closed", "not_relevant"],
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "platform", "score", "status", "title"],
