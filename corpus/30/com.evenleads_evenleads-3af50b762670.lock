      "instructions": "EvenLeads finds potential customers in recent public posts (Reddit, LinkedIn, X and more) where people ask for what a business sells. To show leads the user already has (my leads, best leads, top leads) call get_my_leads; never start a search for that. Only when the user asks to find or search for NEW customers: call find_customers with a plain description of the business, tell them the search has started, then call get_search_status until it is done and show the leads with their links. Use draft_reply to write a message for a lead; the user sends it themselves with the link in the result. Never invent leads or links. For freelance or agency services, find_hiring_requests gives instant results without signing in. get_my_leads and list_my_campaigns read what the account already has; get_account shows what is left in the plan. Tools that use the account ask the user to sign in with EvenLeads once.",
      "tools": [
        {
          "name": "draft_reply",
          "title": "Draft a message to a lead",
          "description": "Write a first message for one lead, in the tone set on its campaign: either a private message to the author or a public reply under the post. Returns the text and a link that opens the right place to send it (with the text filled in where the platform allows). Nothing is sent: the user sends it themselves. Each draft counts toward the reply drafts in the user's EvenLeads plan.",
          "inputSchema": {
            "properties": {
              "lead_id": {
                "description": "The id of a lead in the user's account.",
                "type": "integer"
              },
              "type": {
                "description": "direct_message (private, default) or comment (public reply under the post).",
                "enum": ["direct_message", "comment"],
                "type": "string"
              }
            },
            "required": ["lead_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "lead_id": {
                "type": "integer"
              },
              "post_url": {
                "type": "string"
              },
              "send": {
