                    "enum": ["chat", "reply", "profile", "post"],
                    "type": "string"
                  },
                  "prefilled": {
                    "description": "True when the link opens with the text already filled in.",
                    "type": "boolean"
                  },
                  "template": {
                    "description": "The link with __TEXT__ in place of the URL-encoded message, when prefilled.",
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "type": {
                "enum": ["direct_message", "comment"],
                "type": "string"
              }
            },
            "type": "object"
          },
