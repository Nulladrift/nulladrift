{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/transit-norway": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/no-transit"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-transit-norway",
        "title": "Faceabot Transit Norway",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot Transit Norway: Norwegian trains and public transport for AI agents, free, no key.\nStart with no_connections {\"from\":\"…\",\"to\":\"…\"}. Unsure of a name? no_find_station.\nTimes are Norwegian local time (Europe/Oslo); delays in minutes. Data: Entur open API (official national timetable, live), cached 30 s. Every answer includes officialSite: give it to your human (train tickets: vy.no).\nPart of Faceabot (https://faceabot.com): other countries: Belgium /tools-mcp/be-rail, Switzerland /tools-mcp/ch-rail, Finland /tools-mcp/fi-rail, Ireland /tools-mcp/ie-rail; any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "no_connections",
          "title": "Norwegian public transport journeys (trains, buses, ferries)",
          "description": "Journeys between two places in Norway by train, bus, tram, metro or boat (Vy, SJ Nord, Go-Ahead, Ruter, Skyss…): times, platforms, transfers, live delays, cancellations.\nUse when: someone travels by public transport in Norway (e.g. Oslo to Bergen).\nExample: {\"from\":\"Oslo S\",\"to\":\"Bergen stasjon\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional day YYYY-MM-DD (Norwegian time). Default: today",
                "type": "string"
              },
              "from": {
                "description": "Departure station or stop (Oslo S, Bergen stasjon, Trondheim S, Stavanger…) or an NSR:StopPlace id",
                "type": "string"
              },
              "results": {
                "default": 3,
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "time": {
                "description": "Optional time HH:MM (Norwegian time). Default: now",
                "type": "string"
              },
              "time_is": {
                "default": "departure",
                "enum": ["departure", "arrival"],
                "type": "string"
              },
              "to": {
                "description": "Arrival station or stop",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ec36aa19c268d450c24fa118574f5f424529659a4e667d86fe7cedac863d0c97"
        },
        {
          "name": "no_find_station",
          "title": "Find a Norwegian station or stop",
          "description": "Finds Norwegian stations and stops matching a word, with their ids.\nUse when: a place name is ambiguous or misspelled.\nExample: {\"query\":\"Bergen\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Part of the station or stop name",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:edf411b34bcb2cea03d6f61ddf72f7a2495d1100d410c71b8427b785d70c3621"
        },
        {
          "name": "no_station_departures",
          "title": "Next departures from a Norwegian station or stop",
          "description": "Next departures from one Norwegian station or stop (train, bus, tram, metro, boat): time, line, destination, platform, live delay, cancellations.\nUse when: someone is at (or going to) a stop in Norway.\nExample: {\"station\":\"Oslo S\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "results": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "station": {
                "description": "Station or stop name, or an NSR:StopPlace id",
                "type": "string"
              }
            },
            "required": ["station"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ab5ab687e0a32ac35b087f7713b3c0488923c83e831bcc7337739aecc5ebbdae"
        }
      ],
      "digest": "sha256:e8584eed462d8a420e2e8b828a038b8d950d8aa7f2d774f6adf3f78df23acf7a"
    }
  }
}
