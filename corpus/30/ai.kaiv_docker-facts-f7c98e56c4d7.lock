      "serverInfo": {
        "name": "Docker Facts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This is an MCP server managed by Kaiva Bridge. Each tool carries a JSON Schema for its input: read inputSchema before calling rather than guessing argument names. Check readOnlyHint and destructiveHint before calling; a tool without them may change data. When Kaiva Bridge refuses or cannot complete a call, it returns isError with a machine-readable `error` code and a message saying whether to fix the arguments, wait, or stop retrying.",
      "tools": [
        {
          "name": "check_image_tag",
          "title": "Check Image Tag",
          "description": "Does this image:tag exist, how big is it, and which platforms does it cover?\n\nUse this before writing a FROM line or a compose file. On a hit it returns size, platforms, arm64/amd64 support and the digest. On a miss it says whether the IMAGE exists but the tag is wrong, and lists real tags newest first so the caller can correct itself. Defaults to tag \"latest\" when none is given.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Docker image name as you would write it in a FROM line: \"node\", \"postgres\", \"grafana/grafana\". Official images may omit the \"library/\" prefix.",
                "type": "string",
                "x-in": "query"
              },
              "tag": {
                "default": "latest",
                "description": "Tag to check, e.g. \"20-alpine\". Defaults to \"latest\".",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check Image Tag"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3e6e98dc784786832fd49c8f05c61bd66cc82fa740045599b7d163e559d8bd3e"
        },
        {
          "name": "get_image_info",
          "title": "Get Image Info",
          "description": "Repository facts: official status, pulls, stars, whether it is archived.\n\nUse to judge whether an image is the canonical one and still maintained. Archived images still pull but receive no security patches.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Docker image name as you would write it in a FROM line: \"node\", \"postgres\", \"grafana/grafana\". Official images may omit the \"library/\" prefix.",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Image Info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:630e678562801642a2ec84a47345d8fe022dc807fc593278cf0c96493eb9493b"
        },
        {
          "name": "list_image_tags",
          "title": "List Image Tags",
          "description": "Real tags for an image, most recently updated first.\n\nUse when choosing a tag rather than verifying one. Each entry carries size and platform list, so a choice can be made without a second call.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "description": "How many tags to return, 1 to 100. Defaults to 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer",
                "x-in": "query"
              },
              "name": {
                "description": "Docker image name as you would write it in a FROM line: \"node\", \"postgres\", \"grafana/grafana\". Official images may omit the \"library/\" prefix.",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List Image Tags"
          },
          "behavior": {
            "destructive": false,
