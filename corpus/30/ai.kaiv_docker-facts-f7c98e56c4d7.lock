{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kaiv/docker-facts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.kaiv.ai/api/bridge/mcp/docker-facts-adc41b39"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "Docker Facts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "\"Docker Facts\" is a governed MCP server hosted by Kaiva Bridge. Tools carry a JSON Schema for both input and, where the source documents one, output. Read inputSchema before calling rather than guessing argument names. Every tool here is read-only unless its annotations say otherwise — check readOnlyHint and destructiveHint before calling. A failed call returns isError with a machine-readable `error` code and a message saying whether to fix the arguments, wait, or stop retrying.",
      "tools": [
        {
          "name": "check_image_tag",
          "title": "Check Image Tag",
          "description": "Does this image:tag exist, how big is it, and which platforms does it cover?\n\nUse this before writing a FROM line or a compose file. On a hit it returns size, platforms, arm64/amd64 support and the digest. On a miss it says whether the IMAGE exists but the tag is wrong, and lists real tags newest first so the caller can correct itself. Defaults to tag \"latest\" when none is given.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Docker image name as you would write it in a FROM line: \"node\", \"postgres\", \"grafana/grafana\". Official images may omit the \"library/\" prefix.",
                "type": "string",
                "x-in": "query"
              },
              "tag": {
                "default": "latest",
                "description": "Tag to check, e.g. \"20-alpine\". Defaults to \"latest\".",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "available_tags": {
                "description": "Present only on a miss: real tags, newest first, so the caller can correct itself.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "digest": {
                "description": "Content digest, for pinning.",
                "nullable": true,
                "type": "string"
              },
              "exists": {
                "description": "Whether this exact image:tag exists on Docker Hub.",
                "type": "boolean"
              },
              "image": {
                "type": "string"
              },
              "image_exists": {
                "description": "Present only on a miss. Distinguishes a wrong tag from a wrong image name.",
                "type": "boolean"
              },
              "last_updated": {
                "description": "When the tag was last pushed (ISO 8601). A tag untouched for years is usually the wrong choice.",
                "nullable": true,
                "type": "string"
              },
              "meaning": {
                "description": "One sentence, safe to show a user verbatim.",
                "type": "string"
              },
              "platforms": {
                "description": "os/arch strings this tag was built for, e.g. \"linux/arm64\".",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reference": {
                "description": "The full reference, safe to paste into a FROM line.",
                "type": "string"
              },
              "size_mb": {
                "description": "Compressed size in MB.",
                "nullable": true,
                "type": "number"
              },
              "status": {
                "description": "Docker Hub tag status, e.g. \"active\".",
                "nullable": true,
                "type": "string"
              },
              "suggestion": {
                "description": "Present only on a miss: the most recently updated real tag.",
                "nullable": true,
                "type": "string"
              },
              "supports_amd64": {
                "type": "boolean"
              },
              "supports_arm64": {
                "description": "Answers the Apple Silicon and Graviton question directly.",
                "type": "boolean"
              },
              "tag": {
                "type": "string"
              }
            },
            "required": ["exists", "image", "meaning", "tag"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check Image Tag"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f2b0d4c6f754e6d05a50fbbc9356882dd392b5ffa7c914171ea70eea6fb20a2c"
        },
        {
          "name": "get_image_info",
          "title": "Get Image Info",
          "description": "Repository facts: official status, pulls, stars, whether it is archived.\n\nUse to judge whether an image is the canonical one and still maintained. Archived images still pull but receive no security patches.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Docker image name as you would write it in a FROM line: \"node\", \"postgres\", \"grafana/grafana\". Official images may omit the \"library/\" prefix.",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "description": {
                "nullable": true,
                "type": "string"
              },
              "exists": {
                "type": "boolean"
              },
              "hub_url": {
                "description": "Page a human can open.",
                "type": "string"
              },
              "image": {
                "type": "string"
              },
              "is_archived": {
                "description": "Archived images still pull but receive no further updates, including security patches.",
                "type": "boolean"
              },
              "last_updated": {
                "nullable": true,
                "type": "string"
              },
              "official": {
                "description": "True for Docker Official Images (the \"library\" namespace).",
                "type": "boolean"
              },
              "pulls": {
                "nullable": true,
                "type": "integer"
              },
              "stars": {
                "nullable": true,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Image Info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:60b1ffeddabf8bdd516dbce48102d0fcfe2eb5ae656025de1bacd32277b25498"
        },
        {
          "name": "list_image_tags",
          "title": "List Image Tags",
          "description": "Real tags for an image, most recently updated first.\n\nUse when choosing a tag rather than verifying one. Each entry carries size and platform list, so a choice can be made without a second call.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "description": "How many tags to return, 1 to 100. Defaults to 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer",
                "x-in": "query"
              },
              "name": {
                "description": "Docker image name as you would write it in a FROM line: \"node\", \"postgres\", \"grafana/grafana\". Official images may omit the \"library/\" prefix.",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "exists": {
                "type": "boolean"
              },
              "image": {
                "type": "string"
              },
              "newest_first": {
                "description": "Tags are ordered by last update, most recent first.",
                "type": "boolean"
              },
              "tags": {
                "items": {
                  "properties": {
                    "last_updated": {
                      "nullable": true,
                      "type": "string"
                    },
                    "platforms": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "size_mb": {
                      "nullable": true,
                      "type": "number"
                    },
                    "tag": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List Image Tags"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:532526cd3f5496bf23bf085beac7a7c9826b064bd4efa202c46dfff80ca1f11d"
        }
      ],
      "digest": "sha256:063bcbfd41a7b1d8c3c2462b24ed0b7d61d7a7aa1e54e71ab4773c06acb94d9e"
    }
  }
}
