{
  "lockfileVersion": 2,
  "subjects": {
    "com.companydata/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://companydata.com/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "companydata-mcp",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CompanyData MCP: company_search, company_enrich, field_lookup (cities). Docs: https://companydata.com/product/mcp-server/",
      "tools": [
        {
          "name": "company_enrich",
          "title": "Company export (enrich)",
          "description": "Full company record (GET /api/company/export with ID and export=true) with the field set in your subscription.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ID": {
                "description": "Company ID from search results.",
                "type": "string"
              },
              "page": {
                "description": "Page number.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "pageSize": {
                "description": "Results per page.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "scrollId": {
                "description": "Scroll ID from the previous page.",
                "type": "string"
              },
              "useScroll": {
                "description": "Use scrolling for large exports.",
                "type": "boolean"
              }
            },
            "required": ["ID"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Company export (enrich)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1b9c031ef3b8fac6e54b445f702064aa39d1ef60c90428bc8218a6d43744b9df"
        },
        {
          "name": "company_search",
          "title": "Company search",
          "description": "Search companies from official business registers in 200+ countries. Same query parameters as GET /api/company/search of the CompanyData API.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "filters": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Query parameters for GET /api/company/search, e.g. search, countryCode, page, pageSize, statusCode.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["filters"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Company search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0efa9961e1bf7a870620f3e9488971f9ec7e99d4738a62d6745ca0cf1fa6c437"
        },
        {
          "name": "field_lookup",
          "title": "Location lookup",
          "description": "GET /api/cities for the exact city values used by search and export.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "countries": {
                "description": "Optional countries query param (ISO code).",
                "type": "string"
              },
              "limit": {
                "description": "Optional limit (default 100).",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "search": {
                "description": "Autocomplete search string (query param search).",
                "type": "string"
              }
            },
            "required": ["search"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Location lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5fbe5a52c774ee2b7cd1cf5e2ff53221e95261a105bebb1ee1b07bf9013b79eb"
        }
      ],
      "digest": "sha256:5dabcea929022c22bb1378cb7cc2c45c408f9cf6158d0f09e174476131251116"
    }
  }
