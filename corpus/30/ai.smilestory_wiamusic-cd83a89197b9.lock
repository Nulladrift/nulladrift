          },
          "digest": "sha256:a37407c754b6cd2a12aeb608ef51ff20cd65327ed500d5f8168ba37fd8fb1a2d"
        },
        {
          "name": "list_catalog_facets",
          "title": "List catalog genres, keys, languages",
          "description": "List the current WIA Music catalog facets: genres, musical keys, vocal types, languages and total song count. Useful before calling search_songs. (카탈로그 장르·키·언어 목록.)",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List catalog genres, keys, languages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0460a9a3b1718ca49a66dd6237c991ceb86928bab02c882fcdc9e9b63e747a4b"
        },
        {
          "name": "search_songs",
          "title": "Search WIA Music catalog",
          "description": "Search the public WIA Music catalog of original K-pop / K-trot / K-ballad songs (each sold as a 1-of-1 bundle with sheet music). Filter by text, genre, musical key, BPM range, or available score formats. Read-only; purchasing is done on the website. For copyright screening of arbitrary audio use the Music Check MCP. (WIA Music 공개 카탈로그 검색. 구매는 웹에서.)",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bpm_max": {
                "maximum": 300,
                "minimum": 30,
                "type": "integer"
              },
              "bpm_min": {
                "maximum": 300,
                "minimum": 30,
                "type": "integer"
              },
              "formats": {
                "description": "Require all listed score formats",
                "items": {
                  "enum": ["PDF", "MusicXML", "MIDI"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "genre": {
                "description": "Exact genre, e.g. K-Pop, K-Trot, K-Ballad. Use list_catalog_facets for current values",
                "maxLength": 40,
                "type": "string"
              },
              "has_lyrics": {
                "type": "boolean"
              },
              "has_mr": {
                "description": "Has an instrumental (MR) track",
                "type": "boolean"
              },
              "key": {
                "description": "Musical key, e.g. 'A minor' (case-insensitive exact match)",
                "maxLength": 20,
                "type": "string"
              },
              "limit": {
                "description": "Default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Match in title or artist",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search WIA Music catalog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
