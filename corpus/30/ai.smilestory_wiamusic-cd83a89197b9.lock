        "websiteUrl": "https://wiamusic.smilestory.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only WIA Music catalog. Purchases and downloads are available only on the website (use page_url). Prices are not provided by this server. For copyright screening of arbitrary audio use the separate Music Check MCP.",
      "tools": [
        {
          "name": "get_song",
          "title": "Get one WIA Music song",
          "description": "Get full public details of one WIA Music catalog song by slug (key, BPM, formats, links). Read-only; purchase only on the website. (WIA Music 곡 상세 조회.)",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Song slug, e.g. afterimage",
                "pattern": "^[a-z0-9][a-z0-9-]{0,79}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one WIA Music song"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:63d954002d9353239d0a843844d8eed21660b548d70207fffe0ca056f5f08256"
        },
        {
          "name": "get_song_lineage",
          "title": "Get song lineage (versions and release records)",
          "description": "Public version tree of a WIA Music song: the original and any derived versions with their receipt-verification links, plus public release records. Contains no buyer or personal data. (곡 계보: 원본·파생 버전·발매 기록. 개인정보 없음.)",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Song slug",
                "pattern": "^[a-z0-9][a-z0-9-]{0,79}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
