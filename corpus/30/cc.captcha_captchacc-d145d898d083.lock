      "tools": [
        {
          "name": "create_challenge",
          "title": "Create Challenge",
          "description": "Create a live captcha.cc challenge for a site key and allowed hostname. Useful for smoke tests and integration checks.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "hostname": {
                "description": "Hostname configured on the captcha.cc site.",
                "minLength": 1,
                "type": "string"
              },
              "site_key": {
                "description": "Public captcha.cc site key.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["hostname", "site_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:df873f02633d7f33ec0f4e53461e0fbda270d1bb65327780a0c17b37fad1308a"
        },
        {
          "name": "make_siteverify_request",
          "title": "Make Siteverify Request",
          "description": "Return a server-side fetch example for redeeming a captcha.cc proof token exactly once.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "proof_token_expression": {
                "default": "req.body.proofToken",
                "minLength": 1,
                "type": "string"
              },
              "secret_env_var": {
                "default": "CAPTCHA_CC_SECRET_KEY",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:aa0eefa7b5177b980009f94262e1a5ddcca0712fccedd4560a302fc8d75c6cc5"
        },
        {
          "name": "make_widget_snippet",
          "title": "Make Widget Snippet",
          "description": "Return a minimal browser SDK snippet for mounting captcha.cc and submitting the proof token to an application endpoint.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "element_id": {
                "default": "captcha",
                "description": "DOM element id where the widget should mount.",
                "minLength": 1,
                "type": "string"
              },
              "form_id": {
                "default": "contact-form",
                "description": "Form id to attach submit handling to.",
                "minLength": 1,
                "type": "string"
              },
              "site_key": {
                "description": "Public captcha.cc site key, for example pk_live_xxx.",
                "minLength": 1,
                "type": "string"
              },
              "submit_path": {
                "default": "/submit-form",
                "description": "Application endpoint that receives the proof token.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["site_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
