{
  "lockfileVersion": 2,
  "subjects": {
    "cc.captcha/captchacc": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://captcha.cc/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "captcha-cc-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_challenge",
          "title": "Create Challenge",
          "description": "Create a live captcha.cc challenge for a site key and allowed hostname. Useful for smoke tests and integration checks.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "hostname": {
                "description": "Hostname configured on the captcha.cc site.",
                "minLength": 1,
                "type": "string"
              },
              "site_key": {
                "description": "Public captcha.cc site key.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["hostname", "site_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ba39e0591051cab83ef57e8fe006c44e2147c9f164135818a131c4206f891d59"
        },
        {
          "name": "make_siteverify_request",
          "title": "Make Siteverify Request",
          "description": "Return a server-side fetch example for redeeming a captcha.cc proof token exactly once.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "proof_token_expression": {
                "default": "req.body.proofToken",
                "minLength": 1,
                "type": "string"
              },
              "secret_env_var": {
                "default": "CAPTCHA_CC_SECRET_KEY",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:035bfe4a48ef43ad11ec9a3c60409f39ed0089a28570dfc0ac10cf2ad7b8a2c0"
        },
        {
          "name": "make_widget_snippet",
          "title": "Make Widget Snippet",
          "description": "Return a minimal browser SDK snippet for mounting captcha.cc and submitting the proof token to an application endpoint.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "element_id": {
                "default": "captcha",
                "description": "DOM element id where the widget should mount.",
                "minLength": 1,
                "type": "string"
              },
              "form_id": {
                "default": "contact-form",
                "description": "Form id to attach submit handling to.",
                "minLength": 1,
                "type": "string"
              },
              "site_key": {
                "description": "Public captcha.cc site key, for example pk_live_xxx.",
                "minLength": 1,
                "type": "string"
              },
              "submit_path": {
                "default": "/submit-form",
                "description": "Application endpoint that receives the proof token.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["site_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e187ed3b955df0019800a7be8029f840e60b81d35cbef8d866e62df87161af9a"
        }
      ],
      "resources": [
        {
          "uri": "captchacc://knowledge",
          "name": "knowledge",
          "title": "captcha.cc Knowledge",
          "description": "How to integrate captcha.cc browser challenges, audio challenges, and one-time server proof redemption.",
          "mimeType": "text/markdown",
          "digest": "sha256:944583c66ed6148ccde60c417526f9850c780f7abbbbc32a2829906b30191a95"
        }
      ],
      "digest": "sha256:72a27cea73f05d046acc0c80608e14a16b24fc5fec8725a18e4cafc11b146a2d"
    }
  }
}
