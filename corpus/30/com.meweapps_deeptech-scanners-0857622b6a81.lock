{
  "lockfileVersion": 2,
  "subjects": {
    "com.meweapps/deeptech-scanners": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://meweapps.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "meweapps-deeptech-scanners",
        "title": "MeWeApps Deep-Tech Scanners",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free scanners from MeWeApps.com. Each result includes a shareable report URL; full remediation packs are available on the report page.",
      "tools": [
        {
          "name": "battery_passport_check",
          "title": "EU Battery Passport readiness check",
          "description": "Check an EU battery passport (pasted JSON or a passport/QR resolver URL) against Regulation (EU) 2023/1542: scope for the battery category, unique identifier, Annex XIII public fields, restricted-data exposure, dynamic state-of-health data and carbon footprint. Passports are required from 18 Feb 2027 for EV, LMT and >2 kWh industrial batteries.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["ev", "lmt", "industrial", "sli", "portable"],
                "type": "string"
              },
              "json": {
                "description": "Passport JSON (mode json)",
                "type": "string"
              },
              "mode": {
                "enum": ["json", "url"],
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "url": {
                "description": "Passport or Digital Link URL (mode url)",
                "type": "string"
              }
            },
            "required": ["category", "mode"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b41540f6d47b1bb3d08ff30611edf90a9fd681e9a385459f7a205e4efb0ee117"
        },
        {
          "name": "cra_disclosure_scan",
          "title": "CRA / PSTI vulnerability-disclosure scan",
          "description": "Scan a vendor domain for EU Cyber Resilience Act and UK PSTI vulnerability-handling readiness: RFC 9116 security.txt (Contact, Expires, Policy, Canonical), coordinated vulnerability disclosure policy, CSAF provider metadata, SBOM and support-period statements.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:edb6757ab4d06710e5125b396d53e74e723ddebb01c17b0e096925b48f29732f"
        },
        {
          "name": "green_claims_scan",
          "title": "Green claims & sustainability credentials scan",
          "description": "Read a company website for environmental claims and greenwashing risk under EU Directive 2024/825 (from 27 Sep 2026) and the UK CMA Green Claims Code, find evidence and credentials (SBTi, ISO 14001, B Corp, reports), and measure the site's own footprint (green hosting, carbon.txt, page weight, CO2 per view).",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48c991a15bc82a9fa47795cf5779015b5040773d8dda319b8b52b008e8243281"
        },
        {
          "name": "nanoform_reach_check",
          "title": "EU REACH nanoform SDS check",
          "description": "Check a nanomaterial against the EU nanomaterial definition (2022/C 229/01), REACH Annex II (Regulation 2020/878) Safety Data Sheet nanoform requirements and ISO/TR 13014 characterisation coverage. Accepts particle size data (nm), BET surface area, density and optional SDS text.",
          "inputSchema": {
            "properties": {
              "d10": {
                "type": "number"
              },
              "d50": {
                "type": "number"
              },
              "d90": {
                "type": "number"
              },
              "density": {
                "description": "g/cm3",
                "type": "number"
              },
              "materialName": {
                "type": "string"
              },
              "preset": {
                "enum": ["graphene", "mwcnt", "tio2", "silver", "cdse", "silica", "zno"],
                "type": "string"
              },
              "sdsText": {
                "description": "Full Safety Data Sheet text (optional)",
                "type": "string"
              },
              "shape": {
                "type": "string"
              },
              "ssa": {
                "description": "Specific surface area m2/g",
                "type": "number"
              }
            },
            "required": ["materialName"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b375c3335db2f758f8fd6faeda25a364b9c42834d4489f78829297b58b382e0"
        },
        {
          "name": "openapi_to_mcp_preview",
          "title": "OpenAPI to MCP preview",
          "description": "Convert an OpenAPI/Swagger spec (JSON/YAML text or URL) or a cURL command into MCP tool definitions, with an AI-agent readiness score and EU AI Act Article 50 transparency notes.",
          "inputSchema": {
            "properties": {
              "input": {
                "type": "string"
              }
            },
            "required": ["input"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f83ce71c345828e0957f56493a3ba885d7fb83506c7a5f4615944cf2078b46b0"
        },
        {
          "name": "pqc_tls_scan",
          "title": "Post-quantum TLS scan",
          "description": "Live TLS handshake test of a public domain: X25519MLKEM768 / SecP256r1MLKEM768 post-quantum hybrid key exchange, TLS 1.3, TLS 1.2 and legacy downgrade exposure, certificate key and HSTS. Returns a 0-100 readiness score, Harvest-Now-Decrypt-Later risk and findings.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain or host:port, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d08a69d1d349309fa55fdd803333c0c84895d3d1405d34c049c5a03e79bae129"
        },
        {
          "name": "sgrna_qc",
          "title": "CRISPR sgRNA / FASTA / HL7 / manifest QC",
          "description": "Heuristic QC for CRISPR guide RNAs (GC%, PAM for SpCas9/SaCas9/Cas12a, poly-T, homopolymers, seed checks), FASTA sequences (GC%, candidate SpCas9 sites), HL7 v2 headers or sample manifests (chain of custody, PHI). Not a substitute for genome-wide off-target search.",
          "inputSchema": {
            "properties": {
              "input": {
                "description": "Guides (one per line), FASTA, HL7 message or CSV",
                "type": "string"
              },
              "nuclease": {
                "enum": ["SpCas9", "SaCas9", "Cas12a"],
                "type": "string"
              }
            },
            "required": ["input"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1629912ea8de126691dd53ab51c6f2ab1e0da7e9bdfce3ee9e6c67547195c5ad"
        },
        {
          "name": "urdf_validate",
          "title": "URDF generate / validate",
          "description": "Validate a URDF robot description (structure, joint limits, inertia plausibility, collision geometry) or generate one from a natural-language spec such as '6-DOF arm with parallel gripper'.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "Natural-language robot spec",
                "type": "string"
              },
              "urdf": {
                "description": "URDF XML to validate",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d4851bcc5de0f3c1355c20641825b64efcf80abc7abf78dfdadbdefe9a8c6d4"
        }
      ],
      "digest": "sha256:4eece3b85dd06a8f2af8c373f2ddec1a28027b4f83f7a8aebe1835c9ba07663e"
    }
  }
}
