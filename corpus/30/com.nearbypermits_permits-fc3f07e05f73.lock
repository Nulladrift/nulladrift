        },
        {
          "name": "list_cities",
          "title": "List supported cities",
          "description": "List the US cities and counties with building permit data, with each one's slug for the other tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
