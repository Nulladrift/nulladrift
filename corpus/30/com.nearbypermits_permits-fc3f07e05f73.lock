          },
          "digest": "sha256:d94f1c91b2c87e632647c841c1afb3b135cc79f459ef256352f425ea58402882"
        },
        {
          "name": "permits_at_address",
          "title": "Permits at an address",
          "description": "Use this tool when someone asks which building, remodeling or demolition permits exist at an address, whether a house had permitted work, or what is permitted next door. It returns the building permits on record at that street address in a supported city or county (Los Angeles, New York City, Chicago, San Francisco, Seattle, Austin, Cincinnati, Mesa, New Orleans, Fort Worth, Columbus, San Diego, Detroit, Nashville, Raleigh, Phoenix, San Antonio, Minneapolis, Montgomery County, Boston, Pittsburgh, Washington, Denver, Los Angeles County, Wake County, Miami, Miami-Dade County, Hillsborough County, Cape Coral, Port St. Lucie, Alachua County, Kansas City, Baltimore, Sacramento County, Memphis, Las Vegas, Tacoma, Boulder, Cambridge, Somerville, Marin County, Pierce County, Cary, Cleveland, Arlington, Naperville, Tempe, Anaheim, Riverside), newest first and at most 200: type of work, description, date, status and reported cost, from city and county open data checked around the clock. count is how many are listed; when capped is true there are more, and total gives the city's full count when it was read (else null). history_limited means the city's full history didn't load, so the list is our copy only. The address can be typed loosely (a missing N or S, \"Drive\" for \"Dr\", a trailing city, state or ZIP, a unit): it is matched to the spelling the city files. When more than one address matches (N and S Holly Dr), the answer lists them in did_you_mean; ask which one is meant and call again with it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Street address with house number, e.g. '867 N Iliff St'. New York: include the borough, e.g. '180 West Street, Brooklyn'.",
                "type": "string"
              },
              "city": {
                "description": "City slug, e.g. los-angeles, new-york, chicago",
                "type": "string"
              }
            },
            "required": ["address", "city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:af4102ca14ae1a037011161149874088e9eb654feb79cdaf8e75a438028f1f76"
        },
        {
          "name": "permits_near",
          "title": "Permits near an address or a point",
          "description": "Use this tool when someone asks what is being built near an address or a place: new buildings next door, construction on the block, what's permitted around a home they might buy or rent. Give a city and street address, or a latitude and longitude. The tool returns building permits within a radius (default 400 meters, about a quarter mile) issued since a date (default about six months back), newest first, each with distance in meters and compass direction from the point. It covers the last 24 months of city open data. counts.total is exact even when the list is capped (null if the count failed). It matches a loosely typed address the same way permits_at_address does. If more than one address matches, the answer has found set to false and lists the addresses in did_you_mean.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Street address with house number, e.g. '2443 W Warren Blvd'.",
                "type": "string"
              },
              "city": {
                "description": "City slug, e.g. chicago. Needed with address; optional with lat and lon.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude, used instead of city and address.",
                "type": "number"
              },
              "limit": {
                "description": "Most permits to list, default 50.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Longitude, used instead of city and address.",
                "type": "number"
              },
              "radius_m": {
                "description": "Radius in meters, default 400.",
                "maximum": 1600,
                "minimum": 50,
                "type": "integer"
              },
              "since": {
                "description": "Earliest date, YYYY-MM-DD, or 6m, 1y, 2y. Default 6m (the first of the month five months back).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7098b082cfdb394bc84471d7d4290e218d5e6a05a847530281564631a209e123"
        },
        {
          "name": "recent_permits",
          "title": "Newest permits in an area",
          "description": "Use when someone asks what is being built in their neighborhood or ZIP code. Returns the newest building permits in a supported city or county, optionally within one ZIP code.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "zip": {
                "description": "5-digit ZIP code",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e3f119f31f612bd24364579e216454618f739be0b57076fbb13cb6f2abd1f45a"
        },
        {
          "name": "zoning_requests_near",
          "title": "Zoning requests near an address or a point",
          "description": "Use when someone asks about variances, conditional uses, rezonings or zoning appeals near an address: what a neighbor asked the city for, or whether a hearing is coming up. Covers Boston, Washington DC, San Francisco and Seattle. Give a city and street address, or a latitude and longitude. Each case has the city's own status words, our plain status label (Filed, In review, Hearing scheduled, Approved, Approved with conditions, Denied, Withdrawn or Other), the hearing date when the city publishes one, and a link to the city's case record. We never infer an outcome the city's record doesn't state. Owner and applicant names are left out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Street address with house number, e.g. '78 Pearl St'.",
                "type": "string"
              },
              "city": {
                "description": "boston, washington-dc, san-francisco or seattle. Needed with address.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude, used instead of city and address.",
                "type": "number"
              },
              "limit": {
                "description": "Most cases to list, default 50.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Longitude, used instead of city and address.",
                "type": "number"
              },
              "radius_m": {
                "description": "Radius in meters, default 400.",
                "maximum": 1600,
                "minimum": 50,
                "type": "integer"
              },
              "since": {
                "description": "Earliest filing, hearing or decision date, YYYY-MM-DD, or 6m, 1y, 2y. Default 1y.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:175cf5b3c8868c1c3bb01e27bee39ec5288e5c3e9a5ed422e5666779d5eab0e8"
        }
      ],
      "digest": "sha256:06872b1555bd0ccea556fb46f43e28c0f3b5f9ab2f495fd340aa9d602b31d6ef"
    }
  }
