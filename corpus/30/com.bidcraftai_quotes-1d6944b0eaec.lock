      "tools": [
        {
          "name": "create_quote_request",
          "title": "Create quote request",
          "description": "Use after the person confirms the job description and asks to get quotes from local contractors. Saves a draft and returns a private link. The person opens the link and gives an email for receiving bids. BidCraft emails them an invite to track the bids; once they click it, BidCraft contacts local contractors on their behalf. Nothing is sent to any contractor by this tool. Leave out street addresses, names, emails, phone numbers and budgets.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City where the work is.",
                "type": "string"
              },
              "description": {
                "description": "Scope of work a contractor can price.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code.",
                "type": "string"
              },
              "title": {
                "description": "Short job title, such as 'Replace 12-unit building roof'.",
                "type": "string"
              },
              "zip": {
                "description": "Five-digit ZIP code, if known.",
                "type": "string"
              }
            },
            "required": ["city", "description", "state", "title"],
            "type": "object"
          },
