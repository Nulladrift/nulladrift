                "type": "array"
              },
              "file_id": {
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "pages_read": {
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
            "required": ["answer", "citations", "file_id", "found", "pages_read"],
            "type": "object"
          },
          "annotations": {
