      "instructions": "FynePDF: PDF tools that keep files on FynePDF between calls.\n1. Get the file in. In ChatGPT, pass the attached file in `file`. Elsewhere call upload_file (shows a drop zone, or gives a signed URL and a curl command), import_file_from_url, or use a file from the person's FynePDF Library (list_library_files, then library_file_id). A message like \"File uploaded (ID: file_…)\" came from upload_file's drop zone: use that file_id. If the person names a file they uploaded without its ID, find it by name with list_files.\n2. Every tool returns a file_id. Pass it to the next tool to keep working on the same file; don't download and re-upload between steps.\n3. Share results as the download_url (valid for 1 hour; get_file makes a fresh one). Files are deleted after 24 hours unless saved with save_to_library.\n4. A tool waits up to about 50 seconds. If it returns status running, call get_job with its job_id.\nSigned in with a FynePDF account, tools use that account's plan; with an API key they spend credits.",
