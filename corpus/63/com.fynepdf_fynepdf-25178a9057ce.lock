        {
          "name": "ask_pdf",
          "title": "Ask a PDF",
          "description": "Answer a question from the document only, citing pages. Every quote is checked against the page text (verified: false marks one that couldn't be found).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "file": {
                "description": "A file the person attached in ChatGPT (filled in by ChatGPT).",
                "properties": {
                  "download_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "file_id": {
                "description": "A FynePDF file_id from upload_file, import_file_from_url or an earlier tool.",
                "pattern": "^file_",
                "type": "string"
              },
              "file_url": {
                "description": "A public link to the file.",
                "format": "uri",
                "type": "string"
              },
              "library_file_id": {
                "description": "A file from the person's FynePDF Library (from list_library_files).",
                "type": "string"
              },
              "question": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "answer": {
                "type": "string"
              },
              "citations": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "page": {
                      "type": "number"
                    },
                    "quote": {
                      "type": "string"
