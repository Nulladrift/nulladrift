          "name": "lookup_license",
          "description": "Look up one Texas electrician license in the Texas Department of Licensing and Regulation (TDLR) file by license number, or by last name plus license type. Returns type, number, county, expiration date, the renewal state, and the fees for an expired license.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Answer language, en or es. Default en.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "last_name": {
                "description": "Last name, 2 letters or more. Use with type.",
                "type": "string"
              },
              "number": {
                "description": "License number, letters, digits and hyphen, 20 characters at most.",
                "type": "string"
              },
              "type": {
                "description": "License type name or page slug, for example journeyman-electrician.",
                "type": "string"
              }
            },
            "type": "object"
