          "description": "Start an email alert sign up for one license: 30 and 7 days before it expires, and at each fee step after. Writes a pending record and sends a confirm email. Ask the person first.",
          "inputSchema": {
            "properties": {
              "confirmed": {
                "description": "true only after the person agreed to the sign up.",
                "type": "boolean"
              },
              "email": {
                "type": "string"
              },
              "lang": {
                "description": "Answer language, en or es. Default en.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "number": {
                "type": "string"
              },
              "type": {
                "description": "Optional Worker license type, when the number belongs to more than one type.",
