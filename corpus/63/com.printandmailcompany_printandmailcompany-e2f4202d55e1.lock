        {
          "name": "send_letter",
          "title": "Send letter (charges credit)",
          "description": "Use this when the user has explicitly confirmed a specific draft letter (recipient, content and total price) and wants it printed and posted. Pays the letter from the user's prepaid credit and releases it to print; it can be cancelled with cancel_letter only until production starts. Only call this after that confirmation and after the user agreed to the Terms (https://printandmailcompany.com/en/legal/terms) and to printing starting immediately (which ends the consumer right of withdrawal once printed). If credit is too low, the result contains a payment link for the user; the assistant cannot pay. A US Letter PDF to a recipient outside the US, Canada and US territories needs paper_size (ask the user: shrink to A4, recommended, or keep US Letter; same price); without it the call fails with PAPER_CHOICE_REQUIRED and nothing is charged. While the account has no sender details (the user's REAL full name, no alias, and postal address) the call fails with SENDER_DETAILS_REQUIRED and nothing is charged: ask the user for them and call send_letter again with them as sender (saved to the account before paying; once the account has them, the saved details are used). Posts paper letters only: no email, fax or parcels. Needs the user's account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirm": {
                "const": true,
                "description": "Must be true: the user explicitly confirmed sending this letter (recipient, content and total price).",
                "type": "boolean"
              },
              "letter_id": {
                "description": "letter_id of the draft the user confirmed, from create_letter or compose_letter, e.g. ltr_8f3k2m9q4x7v1c6b0n5p. Sending charges its total to the user's prepaid credit.",
                "type": "string"
              },
              "paper_size": {
                "description": "The user's choice for a US Letter PDF to a recipient outside the US, Canada and US territories: \"a4\" = shrink to A4 (recommended), \"us_letter\" = keep US Letter. Same price. Saved on the draft before paying; ignored for other letters. No default: omit unless the user has chosen.",
                "enum": ["a4", "us_letter"],
                "type": "string"
              },
              "sender": {
                "description": "The user's own sender details: their REAL full name (first and last name, not an alias, nickname or pseudonym) and postal address, any country. Optional: needed only while the account has no sender details yet (SENDER_DETAILS_REQUIRED); they are then checked and saved to the account before paying. Once the account has them, the saved details are used and this is not saved (the user changes them in Settings → Your details). The user's saved sender details (name and postal address) are printed on the back of the envelope as the sender (their company name and business address instead, if the account has business details).",
                "properties": {
                  "city": {
                    "description": "City or town, e.g. Berlin.",
                    "maxLength": 50,
                    "minLength": 1,
                    "type": "string"
                  },
                  "company": {
                    "description": "The user's company or organisation, e.g. Example GmbH. Optional.",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "country": {
                    "description": "Country as an ISO 3166-1 alpha-2 code, e.g. DE, FR or US.",
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "line1": {
                    "description": "Street and house number, or PO box, e.g. Hauptstraße 5.",
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  "line2": {
                    "description": "Optional extra address line: c/o, apartment, floor or building, e.g. Apt 4B.",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "name": {
                    "description": "The user's full name: their REAL first and last name, not an alias, nickname or pseudonym, e.g. Anna Schmidt.",
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  "postal_code": {
                    "description": "Postcode / ZIP code, e.g. 10115 or 94105. Required in countries that use postcodes.",
                    "maxLength": 16,
                    "type": "string"
                  },
                  "region": {
                    "description": "State, province or region where the user's country has one in addresses, e.g. CA (California, US), ON (Ontario, CA) or Madrid (ES). Required for addresses in AE, AS, AU, BR, CA, CN, CO, CR, ES, FM, HK, HN, ID, IN, IQ, IT, JM, JP, KN, KR, KY, MH, MP, MX, NR, PF, PG, PW, RU, SO, SV, TW, US, VE, VI, VN when this block is saved as the user's sender details (an account without them yet: SENDER_DETAILS_REQUIRED, fields.region); otherwise optional.",
                    "maxLength": 50,
                    "type": "string"
                  }
                },
                "required": ["city", "country", "line1", "name"],
                "type": "object"
              },
              "user_accepted_terms": {
                "const": true,
                "description": "Must be true: the user agreed to the Terms and to the immediate start of printing.",
                "type": "boolean"
              }
            },
            "required": ["confirm", "letter_id", "user_accepted_terms"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send letter (charges credit)"
          },
