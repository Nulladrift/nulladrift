        {
          "name": "get_price_quote",
          "title": "Get price quote",
          "description": "Use this when the user asks what it costs to send a physical letter by post (snail mail), including a registered letter. Returns the exact total incl. VAT (for a signed-in EU business customer with a confirmed VAT number: excl. VAT under the reverse charge), the line items, the envelope, the postal size class and zone and the typical delivery time for a page count, destination country and print options. Letters are printed and posted in Europe, so the sender can be anywhere in the world. Note: registered mail is international registered mail with tracking and signature on delivery; \"certified\" letters, Einschreiben, lettre recommandée and carta certificada mean this here (not a US certified-mail product). Works without sign-in. Set currency to get the total in USD, GBP or CHF (ECB rate plus currency margin). Does not cover email, fax, parcels or postcards.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "color": {
                "default": "bw",
                "description": "\"bw\" = black and white, \"color\" = colour printing (costs more per page). Default \"bw\".",
                "enum": ["bw", "color"],
                "type": "string"
              },
              "country": {
                "description": "Destination country as an ISO 3166-1 alpha-2 code, e.g. DE, FR or US (list_destinations lists them all).",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "default": "EUR",
                "description": "Currency for the total: \"EUR\", \"USD\", \"GBP\" or \"CHF\". Prices are set in EUR; for USD, GBP or CHF the result adds the total converted at the ECB rate plus a currency margin. Default \"EUR\".",
                "enum": ["EUR", "USD", "GBP", "CHF"],
                "type": "string"
              },
              "duplex": {
                "default": false,
                "description": "true = print on both sides of the paper (fewer sheets, so a lighter letter); false = one side only. Default false.",
                "type": "boolean"
              },
              "envelope": {
                "description": "\"DL\" (220×110 mm, letter folded twice), \"C5\" (229×162 mm, folded once) or \"C4\" (324×229 mm, flat). Omit to use the smallest envelope that holds the sheets (recommended); one too small for the page count is refused.",
                "enum": ["DL", "C5", "C4"],
                "type": "string"
              },
              "pages": {
                "description": "Number of pages in the PDF, a whole number from 1 to 250, e.g. 2.",
                "maximum": 250,
                "minimum": 1,
                "type": "integer"
              },
              "postal_code": {
                "description": "Destination postcode, e.g. 07001. Optional: it only changes the price for the Spanish and Portuguese islands and enclaves (Balearic and Canary Islands, Ceuta, Melilla, Madeira, Azores).",
                "maxLength": 16,
                "type": "string"
              },
              "registered": {
                "default": false,
                "description": "true = registered mail: tracking number and signature on delivery, for an extra fee (also what \"certified\" letters, Einschreiben, lettre recommandée and carta certificada mean here; not a US certified-mail product). false = ordinary mail. Default false.",
                "type": "boolean"
              }
            },
            "required": ["country", "pages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get price quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
