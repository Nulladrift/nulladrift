      "instructions": "Print and Mail Company prints letters on paper and posts them by ordinary or registered mail to recipients in most countries (list_destinations). Letters are printed and posted in Germany, France, Belgium or Luxembourg and delivered by postal carriers. The sender can be anywhere in the world; no local address or postal account is needed.\nIt covers: sending a letter by post (snail mail), registered letters (\"certified\" letters here means international registered mail with tracking and signature on delivery, not a US certified-mail product; also Einschreiben, lettre recommandée, carta certificada), and cancelling a contract, subscription or membership by letter. It does not send email, fax, parcels or postcards.\nWithout sign-in: get_price_quote, list_destinations, check_pdf_margins. All other tools work on the user's account; the first call to one of them asks the user to sign in.\nTypical flow: (1) get_price_quote if the user asks about cost; (2) compose_letter to write a new letter from text, or upload_document / create_upload_link for an existing PDF; (3) create_letter (if not already created by compose_letter) to get a draft with the exact price; (4) show the user the recipient address, a summary of the letter content and the exact total, and ask for explicit confirmation; (5) only then call send_letter with confirm=true.\nRules: never send without explicit user confirmation; letters are paid from the user's prepaid credit and the assistant never pays: if credit is low, give the user the payment link; PDFs must be A4 or US Letter with 9 mm free margins (fix_document_margins can shrink pages or crop the margins); we print on the paper size uploaded: A4 PDFs on A4, US Letter PDFs on US Letter, and a PDF mixing both on A4 (its Letter pages centred); for a US Letter PDF to a recipient outside the US, Canada and US territories, ask the user \"shrink to A4 (recommended) or keep US Letter?\" and pass paper_size (\"a4\" or \"us_letter\") to create_letter or send_letter (same price; a draft says paper_choice_required until then); every envelope carries our company return address on the front and the sender on the back (the user's name and address from their sender details, or their company name and business address if the account has business details), and the user's own contact details belong in the letter; before the account's first letter we need the user's sender details: their REAL full name (first and last name, never an alias, nickname or pseudonym) and postal address (compose_letter saves its sender block as them, create_letter and send_letter take them as sender, saved only while the account has none: changes go through the user's Settings → Your details; without them tools answer SENDER_DETAILS_REQUIRED: ask the user, then call the same tool again with sender); prices include VAT, except for a signed-in business customer in another EU country whose VAT number is confirmed (reverse charge: net prices, marked \"excl. VAT — reverse charge\"); registered mail gives a tracking number.",
      "tools": [
        {
          "name": "cancel_letter",
          "title": "Cancel letter",
          "description": "Use this when the user wants to stop a letter they created here: cancels a draft, or a paid letter that has not gone into production yet, and returns the amount to the user's credit. Letters already printed or posted cannot be recalled. This cancels our letter, not a contract the user has with someone else (for that, compose_letter writes the cancellation letter). Ask the user before cancelling. Needs the user's account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "letter_id": {
                "description": "letter_id of the letter to cancel, from create_letter, compose_letter or list_letters, e.g. ltr_8f3k2m9q4x7v1c6b0n5p. Only drafts and paid letters not yet in production can be cancelled.",
                "type": "string"
              }
            },
            "required": ["letter_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel letter"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["openid", "profile", "email", "offline_access", "letters"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:395b3a65196d761cb460633ce6d01309bb07bc4da7c3b4c19b0736b6c551c32d"
        },
        {
          "name": "check_pdf_margins",
          "title": "Check PDF for printing",
          "description": "Use this when the user has a PDF they want printed and posted and it should be checked first: verifies the page size (A4 or US Letter) and the required free margin on every side, and lists the pages that need changes. We print on the paper size uploaded (printed_on): A4 on A4, US Letter on US Letter (for a recipient outside the US, Canada and US territories the user may choose A4 instead when sending); a PDF mixing A4 and US Letter pages is printed on A4, its Letter pages centred at 100 % or scaled down slightly when content comes close to the edge (us_letter_note, pages[].scale_percent). Decide by compliant: all_pages_a4 is false for a US Letter PDF, which is printable. Accepts a public https URL or base64. The file is not stored and nothing is sent. Works without sign-in. To fix a failing PDF, upload it with upload_document and use fix_document_margins.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "pdf_base64": {
                "description": "The PDF file as base64 (a data:application/pdf;base64, prefix is fine), for files up to about 3 MB. Pass pdf_url or pdf_base64. Larger files: pass pdf_url, or use create_upload_link.",
                "type": "string"
              },
              "pdf_url": {
                "description": "Public https URL of the PDF (A4 or US Letter pages), e.g. https://example.com/letter.pdf. Pass pdf_url or pdf_base64.",
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check PDF for printing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["openid", "profile", "email", "offline_access", "letters"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:819278fb5732ca1eb96c197848325f733e9fc932ca9f79c1cb57c6638c8c68ba"
        },
        {
          "name": "compose_letter",
          "title": "Compose a letter",
          "description": "Use this when the user wants to write a new paper letter from text and post it, for example to cancel a contract, subscription or membership by letter, file a complaint or objection, or send a formal notice, by ordinary or registered mail. Renders an A4 letter (DIN 5008 layout: sender block with the user's own name and address, recipient, place and date, subject, body, closing, signature) that passes the print check, and creates a draft with the exact price. Nothing is sent or charged: show the user the draft and the total, ask for confirmation, then call send_letter. The sender can live in any country. For the account's first letter the sender block must carry the user's REAL full name (first and last name, no alias, nickname or pseudonym) and postal address: it is then saved as the account's sender details; without valid ones the call fails with SENDER_DETAILS_REQUIRED. Once the account has sender details, the sender block is printed as given and the saved details stay as they are (sender_details: on_file when the block matches them, kept when it differs): the user changes them in Settings → Your details. Body supports paragraphs (blank line), '- ' bullets, '1. ' lists and **bold**. Needs the user's account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "body": {
                "description": "Letter text including the salutation (e.g. 'Dear Sir or Madam,'), without closing or signature. Blank line = new paragraph; '- ' bullets, '1. ' numbered lists and **bold** work. Up to 20,000 characters.",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "closing": {
                "description": "Closing phrase, e.g. 'Kind regards'. Default: the usual closing in the letter's language.",
                "maxLength": 200,
                "type": "string"
              },
              "color": {
                "default": "bw",
                "description": "\"bw\" = black and white, \"color\" = colour printing (costs more per page). Default \"bw\".",
                "enum": ["bw", "color"],
                "type": "string"
              },
              "date": {
                "description": "Date of the letter as an ISO date (YYYY-MM-DD), e.g. 2026-10-08. Default: today.",
                "type": "string"
              },
              "duplex": {
                "default": false,
                "description": "true = print on both sides of the paper (fewer sheets, so a lighter letter); false = one side only. Default false.",
                "type": "boolean"
              },
              "envelope": {
                "description": "\"DL\" (220×110 mm, letter folded twice), \"C5\" (229×162 mm, folded once) or \"C4\" (324×229 mm, flat). Omit to use the smallest envelope that holds the sheets (recommended); one too small for the page count is refused.",
                "enum": ["DL", "C5", "C4"],
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of the letter as an ISO 639-1 code, e.g. en, de, fr, es, pt, it or nl; sets the date format and the default closing. Default \"en\".",
                "maxLength": 5,
                "minLength": 2,
                "type": "string"
              },
              "place": {
                "description": "Place printed before the date, usually the user's city, e.g. Berlin. Optional.",
                "maxLength": 60,
                "type": "string"
              },
              "recipient": {
                "description": "Recipient's postal address, printed in the letter's address field and on the envelope. Ask the user for missing fields.",
                "properties": {
                  "city": {
                    "description": "City or town, e.g. Berlin.",
                    "maxLength": 50,
                    "minLength": 1,
                    "type": "string"
                  },
                  "company": {
                    "description": "Recipient's company or organisation, e.g. Example GmbH. Optional.",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "country": {
                    "description": "Country as an ISO 3166-1 alpha-2 code, e.g. DE, FR or US.",
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "line1": {
                    "description": "Street and house number, or PO box, e.g. Hauptstraße 5.",
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  "line2": {
                    "description": "Optional extra address line: c/o, apartment, floor or building, e.g. Apt 4B.",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "name": {
                    "description": "Recipient's name: a person, or a department such as Customer Service when writing to a company, e.g. Erika Mustermann.",
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  "postal_code": {
                    "description": "Postcode / ZIP code, e.g. 10115 or 94105. Required in countries that use postcodes.",
                    "maxLength": 16,
                    "type": "string"
                  },
                  "region": {
                    "description": "State, province or region. Required for recipients in AE, AS, AU, BR, CA, CN, CO, CR, ES, FM, HK, HN, ID, IN, IQ, IT, JM, JP, KN, KR, KY, MH, MP, MX, NR, PF, PG, PW, RU, SO, SV, TW, US, VE, VI, VN (without it the draft is refused: INVALID_ADDRESS, fields.region); omit where addresses have none, e.g. DE, FR or GB. The code in US, CA, AU and BR, e.g. CA (California) or ON (Ontario); elsewhere the name or its usual abbreviation, e.g. Madrid (ES) or RM (Rome, IT).",
                    "maxLength": 50,
                    "type": "string"
                  }
                },
                "required": ["city", "country", "line1", "name"],
                "type": "object"
              },
              "references": {
                "description": "Up to 5 reference lines printed above the subject, e.g. [\"Customer no. 12345\", \"Contract no. 987\"]. Optional.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "registered": {
                "default": false,
                "description": "true = registered mail: tracking number and signature on delivery, for an extra fee (also what \"certified\" letters, Einschreiben, lettre recommandée and carta certificada mean here; not a US certified-mail product). false = ordinary mail. Default false. Often wanted for cancellations and deadlines.",
                "type": "boolean"
              },
              "sender": {
                "description": "The user's own name and address (any country), printed in the letter's sender block. Use the user's REAL full name, not an alias, nickname or pseudonym: for an account without sender details yet, this block is checked and saved as them; once the account has them, they stay as they are. The envelope's front shows our return address. The user's saved sender details (name and postal address) are printed on the back of the envelope as the sender (their company name and business address instead, if the account has business details).",
                "properties": {
                  "city": {
                    "description": "City or town, e.g. Berlin.",
                    "maxLength": 50,
                    "minLength": 1,
                    "type": "string"
                  },
                  "company": {
                    "description": "The user's company or organisation, e.g. Example GmbH. Optional.",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "country": {
                    "description": "Country as an ISO 3166-1 alpha-2 code, e.g. DE, FR or US.",
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "email": {
                    "description": "The user's email address, printed in the sender block, e.g. max@example.com. Optional.",
                    "format": "email",
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "line1": {
                    "description": "Street and house number, or PO box, e.g. Hauptstraße 5.",
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  "line2": {
                    "description": "Optional extra address line: c/o, apartment, floor or building, e.g. Apt 4B.",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "name": {
                    "description": "The user's full name: their REAL first and last name, not an alias, nickname or pseudonym, e.g. Anna Schmidt.",
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  "phone": {
                    "description": "The user's phone number, printed in the sender block, e.g. +49 30 1234567. Optional.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "postal_code": {
                    "description": "Postcode / ZIP code, e.g. 10115 or 94105. Required in countries that use postcodes.",
                    "maxLength": 16,
                    "type": "string"
                  },
                  "region": {
                    "description": "State, province or region where the user's country has one in addresses, e.g. CA (California, US), ON (Ontario, CA) or Madrid (ES). Required for addresses in AE, AS, AU, BR, CA, CN, CO, CR, ES, FM, HK, HN, ID, IN, IQ, IT, JM, JP, KN, KR, KY, MH, MP, MX, NR, PF, PG, PW, RU, SO, SV, TW, US, VE, VI, VN when this block is saved as the user's sender details (an account without them yet: SENDER_DETAILS_REQUIRED, fields.region); otherwise optional.",
                    "maxLength": 50,
                    "type": "string"
                  }
                },
                "required": ["city", "country", "line1", "name"],
                "type": "object"
              },
              "signature": {
                "description": "Name printed under the closing, e.g. Max Mustermann. Default: the sender's name.",
                "maxLength": 80,
                "type": "string"
              },
              "subject": {
                "description": "Subject line printed above the body, e.g. Cancellation of my contract no. 12345 (up to 200 characters).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["body", "recipient", "sender", "subject"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Compose a letter"
          },
