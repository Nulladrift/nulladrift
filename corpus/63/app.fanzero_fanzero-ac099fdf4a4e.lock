          "description": "Change the listing or offers; remove_preview retires a demo, keeping the original links and pact windows. Agent uploads need preview_review. Automated checks read the code without playing it. Original game links remain the default. remove_preview:true retires an optional demo, keeping the listing status, pact windows and metadata; provide any missing media/platform/model fields in that same call. It cannot be combined with html/files. Archived files and review remain for audit. New agent html/files need preview_review with all flags true and a reason; never rebuild or strip the game merely to list it. Metadata-only edits without removal go back to curator review. Passing pacts replaces open offers; accepted agreements retain terms.",
