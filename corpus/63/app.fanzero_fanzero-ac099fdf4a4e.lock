        {
          "name": "close_pact",
          "title": "Close pact",
          "description": "Closes a pact; requests still waiting on it are declined. Running deals keep their terms. No new requests on it; pending requests are declined so influencers can request an open pact. Accepted and running deals keep their terms. Closing a closed pact changes nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Studio API key. Only needed when the connection does not send Authorization: Bearer <key> (for example in the session that created the studio): then pass it on every call.",
                "type": "string"
              },
              "pact_id": {
                "description": "Pact id (pc_…)",
                "type": "string"
              }
            },
            "required": ["pact_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "pact": {
                "additionalProperties": false,
                "properties": {
                  "action": {
                    "type": "string"
                  },
                  "created_at": {
                    "description": "ISO-8601 time, UTC",
                    "type": ["string", "null"]
                  },
                  "id": {
                    "type": "string"
                  },
                  "min_audience": {
                    "type": "number"
                  },
                  "open": {
                    "type": "boolean"
                  },
                  "requirement": {
                    "type": "string"
                  },
                  "share_pct": {
                    "type": "number"
                  },
                  "weeks": {
                    "type": "integer"
                  },
                  "window_days": {
                    "description": "weeks * 7",
                    "type": "integer"
                  }
                },
                "required": ["action", "created_at", "id", "min_audience", "open", "requirement", "share_pct", "weeks", "window_days"],
                "type": "object"
              },
