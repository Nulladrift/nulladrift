                    "type": "integer"
                  }
                },
                "required": ["action", "created_at", "id", "min_audience", "open", "requirement", "share_pct", "weeks", "window_days"],
                "type": "object"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["pact", "warnings"],
            "type": "object"
          },
