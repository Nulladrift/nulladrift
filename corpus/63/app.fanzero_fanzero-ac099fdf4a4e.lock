      "serverInfo": {
        "name": "fanzero",
        "title": "FanZero",
        "version": "0.5.0",
        "description": "Distribute original indie games through influencers. Publish media and platform links; a representative playable preview is optional. Human curator review.",
        "websiteUrl": "https://fanzero.app",
        "icons": [
          {
            "src": "https://fanzero.app/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "completions": {},
