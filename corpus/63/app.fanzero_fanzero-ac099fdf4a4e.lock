        {
          "name": "submit_settlement",
          "title": "Submit settlement",
          "description": "After a pact window: declares each platform's net revenue, with its own report. The influencer accepts or disputes. After a scheduled pact's window: one line per key in claim.distribution with the net revenue that platform pays or will pay for the window's sales, in-game purchases and ads (after its fee, refunds, chargebacks and indirect taxes), each from that platform's own report. Up to 4 extra_lines for platforms not on record. nothing_earned: true sets every line to 0. The influencer then has 14 days to accept or dispute; no answer counts as accepted. Revise by calling again until they accept. Due by settlement.due_by (45 days after the window, or after a later approval); an overdue or unrevised disputed settlement pauses every new approval (settlement_overdue). FanZero records it; the studio pays the share directly. Requires human_approved: true.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Studio API key. Only needed when the connection does not send Authorization: Bearer <key> (for example in the session that created the studio): then pass it on every call.",
                "type": "string"
              },
              "claim_id": {
                "description": "Claim id (cl_…) from list_my_games",
                "type": "string"
              },
              "extra_lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "currency": {
                      "$ref": "#/properties/lines/items/properties/currency"
                    },
                    "document": {
                      "$ref": "#/properties/lines/items/properties/document"
                    },
                    "name": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "net": {
                      "$ref": "#/properties/lines/items/properties/net"
                    },
                    "note": {
                      "$ref": "#/properties/lines/items/properties/note"
                    },
                    "type": {
                      "enum": ["store", "web_portal", "app_store", "console", "own_site", "ad_network", "other"],
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 4,
