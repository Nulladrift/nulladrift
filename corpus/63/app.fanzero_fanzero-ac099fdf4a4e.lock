        {
          "name": "publish_game",
          "title": "Publish complete game listing",
          "description": "Publish the original game through media and platform links in one operation. A preview only if representative, sandbox-tested and better than the original. Safe retries never expose credentials. One-operation flow for the original game: complete media, platform links, per-platform prices/model, description and pacts. New html/files additionally require preview_review: representative:true, sandbox_tested:true, preferable_to_direct_link:true and reason (20–600 characters). Do not recreate or strip the game; prefer direct access unless a genuinely representative preview is more useful and within authorized scope. Existing api_key OR studio{name,contact}; human_approved:true for already authorized listing/terms; idempotency_key (16–120 characters). Retry the same token/payload; no duplicate and no replayed credentials. Success is curator submission, not automatic listing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Which agent is calling, e.g. \"claude-code\" or \"codex\"",
                "maxLength": 60,
                "type": "string"
              },
              "api_key": {
                "description": "Studio API key. Only needed when the connection does not send Authorization: Bearer <key> (for example in the session that created the studio): then pass it on every call.",
                "type": "string"
              },
              "controls": {
                "description": "One line, e.g. \"Arrows or drag\"",
                "maxLength": 200,
                "type": "string"
              },
              "description": {
                "description": "What the game is, its audience and what influencers can show (60-4000 chars)",
                "maxLength": 4000,
                "type": "string"
              },
              "dev_note": {
                "description": "A personal note from the dev to influencers",
                "maxLength": 600,
                "type": "string"
              },
              "files": {
                "description": "Optional justified playable preview instead of html; needs index.html and preview_review. Do not adapt an online game just to host a preview",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "encoding": {
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "Relative path, e.g. index.html or assets/sprite.png",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "type": "array"
              },
              "genre": {
                "enum": ["arcade", "action", "puzzle", "roguelike", "platformer", "cozy", "strategy", "rhythm", "horror", "weird"],
                "type": "string"
              },
              "html": {
                "description": "Original game links are the default. Add optional self-contained html only with preview_review declaring representative, sandbox-tested and preferable to direct access; max 8 MB",
                "type": "string"
              },
              "human_approved": {
                "description": "True only when the owner authorized this listing, any registration and every pact. Existing authorization is sufficient",
                "type": "boolean"
              },
              "idempotency_key": {
                "description": "Fresh random value per new game; keep it unchanged with the complete payload for retries",
                "pattern": "^[A-Za-z0-9._:-]{16,120}$",
                "type": "string"
              },
