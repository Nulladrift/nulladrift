        {
          "name": "check_build",
          "title": "Check listing or build (dry run)",
          "description": "Validates a listing or optional preview. Agents sending html/files need preview_review; static checks do not certify its truth. Saves nothing. Original game links are the default. Optional dry run: send media, platforms/prices or monetization, description and pacts without html/files. A new agent preview needs preview_review with all three flags true and an explicit reason; checks read code and cannot certify representative gameplay or successful sandbox testing. Do not port or strip an online game to pass this gate. No key, writes, critic API call or URL fetch; publication validates internally.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Not needed here; accepted so you can pass it on every call.",
                "type": "string"
              },
              "controls": {
                "description": "One line, e.g. \"Arrows or drag\"",
                "maxLength": 200,
                "type": "string"
              },
              "description": {
                "description": "What the game is, its audience and what influencers can show (60-4000 chars)",
                "maxLength": 4000,
                "type": "string"
              },
              "dev_note": {
                "description": "A personal note from the dev to influencers",
                "maxLength": 600,
                "type": "string"
              },
              "files": {
                "description": "Optional justified playable preview instead of html; needs index.html and preview_review. Do not adapt an online game just to host a preview",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "encoding": {
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "Relative path, e.g. index.html or assets/sprite.png",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "type": "array"
              },
              "genre": {
                "enum": ["arcade", "action", "puzzle", "roguelike", "platformer", "cozy", "strategy", "rhythm", "horror", "weird"],
                "type": "string"
              },
              "html": {
                "description": "Original game links are the default. Add optional self-contained html only with preview_review declaring representative, sandbox-tested and preferable to direct access; max 8 MB",
                "type": "string"
              },
              "media": {
                "description": "Screenshots, gameplay and trailers. At least one when no optional playable version is supplied",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "alt": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "type": {
                      "enum": ["image", "video"],
                      "type": "string"
                    },
                    "url": {
                      "description": "Public HTTPS screenshot, gameplay or trailer URL; validated without fetching it",
                      "maxLength": 1000,
                      "type": "string"
                    }
                  },
                  "required": ["type", "url"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "monetization": {
                "description": "Explain how the game earns revenue across platforms; do not guess an unknown price",
                "maxLength": 600,
                "type": "string"
              },
              "pacts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "action": {
                      "description": "What the influencer (a streamer, YouTuber or TikToker) does: livestream, video, short, post or playtest",
                      "enum": ["livestream", "video", "short", "post", "playtest"],
                      "type": "string"
                    },
                    "min_audience": {
                      "description": "Optional follower floor. Followers are self-reported; pitches below it are flagged (below_min_audience), not blocked.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "requirement": {
                      "description": "Concrete requirement, e.g. \"60+ min live, game title in stream title\". Left out, a generic one for the action is used.",
                      "maxLength": 400,
                      "type": "string"
                    },
                    "share_pct": {
                      "description": "Percent of the game's net revenue from every store, for the pact's weeks from the earliest date in the influencer's approved action plan. In percent: 10 means 10%. Above 0, at most 50.",
                      "exclusiveMinimum": 0,
                      "maximum": 50,
                      "type": "number"
                    },
                    "weeks": {
                      "description": "How long the pact runs, in weeks: 2 to 8, 4 if left out. The window starts at the influencer's earliest approved action date.",
                      "maximum": 8,
                      "minimum": 2,
                      "type": "integer"
                    }
                  },
                  "required": ["action", "share_pct"],
                  "type": "object"
                },
                "type": "array"
              },
              "platforms": {
                "description": "Where to access/buy the actual game, each with its own price/model. At least one without a build",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "currency": {
                      "description": "Uppercase currency code, e.g. EUR or USD; required for a positive price",
                      "pattern": "^[A-Z]{3}$",
                      "type": "string"
                    },
                    "monetization": {
                      "enum": ["paid", "free", "free_to_play", "subscription", "other"],
                      "type": "string"
                    },
                    "name": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "note": {
                      "description": "Price conditions, subscription period or optional purchase details",
                      "maxLength": 400,
                      "type": "string"
                    },
                    "price": {
                      "description": "This platform's purchase price. Omit an unknown price; zero means explicitly zero, never an assumed free game",
                      "minimum": 0,
                      "type": "number"
                    },
                    "type": {
                      "description": "What kind of platform it is. Leave it out to have it read from the name and URL (unknown: other)",
                      "enum": ["store", "web_portal", "app_store", "console", "own_site", "ad_network", "other"],
                      "type": "string"
                    },
                    "url": {
                      "description": "Public HTTPS game/store URL",
                      "maxLength": 1000,
                      "type": "string"
                    }
                  },
                  "required": ["name", "url"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "preview_review": {
                "additionalProperties": false,
                "description": "Required for new html/files sent by an agent; all three flags must be true with an explicit reason. A declaration, not certification by static checks",
                "properties": {
                  "preferable_to_direct_link": {
                    "description": "Must be true only if influencers benefit more than by opening the original game link",
                    "type": "boolean"
                  },
                  "reason": {
                    "description": "Explain that choice in 20–600 characters. It must be within the owner's authorized scope",
                    "maxLength": 600,
                    "type": "string"
                  },
                  "representative": {
                    "description": "Must be true: this is representative of the actual game; it does not lose online/community, account, shop or ranking features",
                    "type": "boolean"
                  },
                  "sandbox_tested": {
                    "description": "Must be true only after playing this exact build successfully in the allow-scripts sandbox",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "stage": {
                "description": "Optional. Omitted means not specified on a metadata-only listing; legacy playable submissions default to prototype",
                "enum": ["napkin", "prototype", "vertical-slice", "alpha", "beta", "released"],
                "type": "string"
              },
              "store_url": {
                "anyOf": [
                  {
                    "maxLength": 300,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional https link to where the game already sells (Steam, itch.io, your site). Revenue from every store counts in a pact window. Pass \"\" or null to remove it."
              },
              "tagline": {
                "description": "One line that bites (8-120 chars)",
                "maxLength": 120,
                "type": "string"
              },
              "tags": {
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "title": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "blocking": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "level": {
                      "enum": ["block", "warn", "info"],
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "level", "message"],
                  "type": "object"
                },
                "type": "array"
              },
              "bytes": {
                "type": "integer"
              },
              "critic_preview": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "concerns": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "model": {
                        "type": "string"
                      },
                      "score": {
                        "type": "number"
                      },
                      "streamability": {
                        "enum": ["low", "medium", "high"],
                        "type": "string"
                      },
                      "strengths": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "verdict": {
                        "enum": ["pass", "changes"],
                        "type": "string"
                      },
                      "vibe": {
                        "type": "string"
                      }
                    },
                    "required": ["concerns", "model", "score", "streamability", "strengths", "verdict", "vibe"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "House heuristics only; the real critic may differ"
              },
              "has_playable": {
                "type": "boolean"
              },
              "max_bytes": {
                "type": "integer"
              },
              "next_step": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "$ref": "#/properties/blocking/items"
                },
                "type": "array"
              },
