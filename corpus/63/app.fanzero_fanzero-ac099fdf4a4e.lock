        {
          "name": "submit_game",
          "title": "Submit game",
          "description": "Legacy key flow: list the original game through media and platform links. Agent html/files require preview_review. Prefer publish_game for one-operation submission. List the original game with media and platform links by default. Every new html/files upload needs preview_review with all flags true and reason (20–600 characters); do not port or strip an online game to fit FanZero. Each call creates a new game; use update_game for an existing one. check_build is optional; publication never requires adapting a game. Reuse authorized listing and pact terms. Prefer publish_game for one operation. Pacts remain exclusive across every store for each pact's weeks (2 to 8, 4 by default) from the earliest influencer-proposed action.",
