      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "portaur",
        "title": "Portaur",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Portaur LLC builds AI and web software for businesses. The read tools answer from facts Portaur publishes on portaur.com, and ask_portaur answers one question in Portaur's own words. send_message and request_callback leave a request for a person at Portaur, only when the person you are helping asks for it: each sends one confirmation email to the address given, and nothing reaches a person's phone until it is confirmed. Portaur gives no prices through this connection.",
      "tools": [
        {
          "name": "about_portaur",
          "title": "About Portaur",
          "description": "Returns facts about Portaur LLC, the company behind portaur.com: who it is, its mission, its founder, how to reach it, and the public pages that say more. Read only. The facts are the ones Portaur publishes on its own site. It never returns prices, client names or anything private.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About Portaur"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:700d570d9f7007e30da00c857cd04bb3769bf2be2c7729f4918c6e1986ef6b38"
        },
        {
          "name": "ask_portaur",
          "title": "Ask Portaur a question",
          "description": "Asks Portaur's own assistant one question about Portaur and returns its answer, written from the same facts as the website. Read only: the question is answered once and not kept. Use it for a question the other read tools do not answer. It answers only about Portaur, never gives prices, and has a daily limit; once the limit is reached it says so.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "One question about Portaur.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ask Portaur a question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0bff2e046a05a03c5cf69046004c6ae61b6cb68bdc0c34d2dc39992598902ffc"
        },
        {
          "name": "contact_options",
          "title": "How to reach Portaur",
          "description": "Explains the ways to reach a person at Portaur and what each needs: a written message, a request for a phone call back, or an email. It also explains the confirmation email that follows a request. Read only. Call it before send_message or request_callback to learn what to ask the person for.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to reach Portaur"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93561ef89a4065e2544c574a1b24237ee8288fe147b3be598fe2d4e9e752eff9"
        },
        {
          "name": "list_services",
          "title": "List Portaur services",
          "description": "Lists the services Portaur offers, each with its name, a plain language summary and a fuller description, exactly as portaur.com states them. Read only. It never returns prices; pricing_approach explains how pricing works.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Portaur services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9c5f7f92f78a386ad7d68b683dc59a27a221827a52377bd84170c8ed1e49ecec"
        },
        {
          "name": "pricing_approach",
          "title": "How Portaur prices work",
          "description": "Explains how Portaur prices its work. Read only. It returns no figures: Portaur never quotes a price through an assistant, and every project is scoped with a person.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How Portaur prices work"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c3e54555abdc7af18a9f43a38b7d10082a8c3db62754f5cb608d36961e6f1e43"
        },
        {
          "name": "request_callback",
          "title": "Ask Portaur to call back",
          "description": "Asks a person at Portaur to telephone the person you are helping. Needs their name, email address, phone number and the reason for the call; a preferred time window is optional. Use it only when the person asked to be called. It stores the request in Portaur's inbox and sends one email to the address given, asking the person to confirm; Portaur's phone is alerted only after they do. A person makes the call by hand: nothing ever dials or texts the number. Returns a handle for request_status. It never sends anything to anyone else and never quotes a price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Their email address. Portaur sends one confirmation email here.",
                "maxLength": 255,
                "minLength": 3,
                "type": "string"
              },
              "name": {
                "description": "The name of the person who wants a call.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "The number to call: 7 to 15 digits, with spaces and + ( ) . allowed.",
                "maxLength": 40,
                "minLength": 7,
                "type": "string"
              },
              "reason": {
                "description": "What the call is about.",
                "maxLength": 10000,
                "minLength": 1,
                "type": "string"
              },
              "window": {
                "description": "When they would like the call, with their time zone. Optional.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["email", "name", "phone", "reason"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask Portaur to call back"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:491eae562ec0b76e5b2a5da761110f7979f3ca87a1a5b3459fbc29add76623b3"
        },
        {
          "name": "request_status",
          "title": "Check a request",
          "description": "Says how a request made with send_message or request_callback is doing, given the handle that tool returned: waiting for the person to confirm their email, confirmed and the owner has been told, or not found. Read only. It never returns the message or the address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "handle": {
                "description": "The handle send_message or request_callback returned.",
                "maxLength": 32,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:354726dbd23562fa6b53aaecc9fb597db82034b68ca8663d867a8844c22577ac"
        },
        {
          "name": "send_message",
          "title": "Leave a message for Portaur",
          "description": "Leaves a written message for a person at Portaur on behalf of the person you are helping. Needs their name, their email address and the message; a subject is optional. Use it only when the person asked you to contact Portaur. It stores the message in Portaur's inbox and sends one email to the address given, asking the person to confirm; nothing reaches a person's phone until they do. Returns a handle for request_status. It never sends anything to anyone else, never calls or texts anyone, and never quotes a price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "The message, in their words.",
                "maxLength": 10000,
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "description": "Their email address. Portaur sends one confirmation email here.",
                "maxLength": 255,
                "minLength": 3,
                "type": "string"
              },
              "name": {
                "description": "The name of the person you are writing for.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "subject": {
                "description": "A short subject line. Optional.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["body", "email", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Leave a message for Portaur"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:09a06614f34159a05b692fc5043f5458210276cb9a22eb295f46411e17b92f7b"
        }
      ],
      "digest": "sha256:08e10481ecd0d1aeb7c5876e69b4f8af6c21c1cbe7181935818c604dc6046615"
    }
  }
