      "serverInfo": {
        "name": "mako-metrics",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Mako Metrics sells competitor Meta ads reports (an analyzed PDF plus an export ZIP of saved creatives and raw ad data) and May, an agent that builds Meta ad creative and paused campaigns. Anyone can call list_plans and create_order to buy a report. Customers add an X-Mako-Key header from https://makometrics.com/portal and get the rest, which covers everything the web portal does: set up a client (create_client, draft_brand_from_website, get_brand_profile, set_brand_profile), commission work (run_may for eight ad concepts, order_report for competitor intelligence), read it back (get_status, list_creatives, list_deliverables, get_download_url), and build a real Meta campaign left PAUSED (list_meta_assets, build_paused_campaign). Nothing here can turn a campaign on or spend ad budget. Start with whoami, which reports the plan and says what to do next.",
      "tools": [
        {
          "name": "build_paused_campaign",
          "description": "Build a real Meta campaign from chosen concepts, in the client's own ad account, left PAUSED. It cannot deliver and cannot spend until a person turns it on in Ads Manager, which this tool cannot do and neither can any other. Takes a minute or two. Budget floors: $6/day for leads and sales, $1/day otherwise; the ceiling is $500/day. Needs the May plan, a connected Facebook ad account, and an X-Mako-Key header.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bid_amount": {
                "description": "Whole dollars. Required unless bid_strategy is LOWEST_COST_WITHOUT_CAP.",
                "type": "integer"
              },
              "bid_strategy": {
                "enum": ["LOWEST_COST_WITHOUT_CAP", "COST_CAP", "LOWEST_COST_WITH_BID_CAP"],
                "type": "string"
              },
              "campaign_name": {
                "type": "string"
              },
              "conversion_asset_id": {
                "description": "Which conversion to optimize toward, from list_meta_assets. Needed for leads and sales.",
                "type": "string"
              },
              "daily_budget": {
                "description": "Whole dollars per day.",
                "type": "integer"
              },
              "goal": {
                "enum": ["awareness", "traffic", "engagement", "leads", "calls", "sales"],
                "type": "string"
              },
              "run_id": {
                "description": "The May run the concepts came from.",
                "type": "string"
              },
              "variant_ids": {
                "description": "Which concepts to build ads from. From list_creatives.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["daily_budget", "goal", "run_id", "variant_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Build a Paused Campaign"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c0448d6cfa0c835a9365ca7a7c455cd29b38973741cf89cae2fd71fd1de2a55c"
        },
        {
          "name": "create_client",
          "description": "Add a client workspace to the account. Each workspace holds one brand's profile, runs, creatives and campaigns. Plans include a fixed number of active clients, so this fails when the roster is full. Needs the May plan and an X-Mako-Key header.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The client or brand name, as the customer would say it.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a Client Workspace"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d3316f101d83d209bebc6f2c1752259a388df7a76771b943caa3626fd819f957"
        },
        {
          "name": "create_order",
          "description": "Create a Mako Metrics order brief for a customer and return a Stripe checkout link for them to complete payment. After payment, we email the customer when the report is ready, typically within 24h. They download the PDF report and export ZIP (saved ad images/videos, browsable gallery, raw ad data) at makometrics.com/portal. No payment is taken by this tool. It only returns a pay link the human opens. Report plans only. For May, the Meta ads agent, send the customer to makometrics.com/meta-ads-agent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client_account_name": {
                "description": "Required for the agency plan: the client this batch is for.",
                "type": "string"
              },
              "company_name": {
                "type": "string"
              },
              "company_website": {
                "type": "string"
              },
              "competitors": {
                "description": "Brand or Meta Ad Library page names. Snapshot=1, Dominator=up to 5, Agency=up to 10.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "email": {
                "description": "Customer work email (receipt, portal invite, and report-ready notifications).",
                "type": "string"
              },
              "industry_vertical": {
                "enum": ["ecommerce", "software_saas", "services_local", "finance", "health_wellness", "education", "media_publishing", "other", "not_given"],
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "plan": {
                "enum": ["snapshot", "dominator", "agency"],
                "type": "string"
              },
              "revenue_band": {
                "enum": ["under_100k", "100k_1m", "1m_5m", "5m_10m", "10m_plus", "not_given"],
                "type": "string"
              }
            },
            "required": ["company_name", "competitors", "email", "industry_vertical", "plan", "revenue_band"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create an Order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2527b18c111ca35a6e09779505454b6fec009804f9688fb5da30f3b7bfd06855"
        },
        {
          "name": "draft_brand_from_website",
          "description": "Read a client's website and fill in most of their brand profile automatically. Takes up to a minute or two. The result is a DRAFT: review it with get_brand_profile, correct it with set_brand_profile, then confirm. This is the fastest way to get a new client ready for a May run. Needs the May plan and an X-Mako-Key header.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client_account_id": {
                "description": "From list_clients or create_client.",
                "type": "string"
              },
              "website_url": {
                "description": "The client's homepage.",
                "type": "string"
              }
            },
            "required": ["client_account_id", "website_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Draft a Brand Profile From a Website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b149a0bf962f14ed0c71cbeca7c17ad9f53df3ae5cc6baae546424e73d997be4"
        },
        {
          "name": "get_brand_profile",
          "description": "Read one client's brand profile: what they sell, who buys it, voice, colors, and the campaign defaults. Also reports whether it is confirmed and, if not, exactly which answers are still missing before May can run. Requires an X-Mako-Key header.",
