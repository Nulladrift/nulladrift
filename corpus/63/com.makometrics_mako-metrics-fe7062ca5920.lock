          "digest": "sha256:c585c1dff8613b12f397797df58bf3dd3a753e329de10d4a2c0f18311708b0a4"
        },
        {
          "name": "set_brand_profile",
          "description": "Write or update one client's brand profile. Every field is optional and only what you pass is changed, so this is safe to call repeatedly to correct a website draft. Pass confirm: true when the answers are right, which is what run_may needs. Confirming needs company_name, domain, flagship_product, offer_landing_page, target_customers and both colors. Needs the May plan and an X-Mako-Key header.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "avoid_claims": {
                "description": "Claims the creative must never make.",
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "client_account_id": {
                "description": "From list_clients.",
                "type": "string"
              },
              "color_navy": {
