        {
          "name": "order_report",
          "description": "Order a competitor Meta ads report for one competitor. On a Dominator, Agency or May plan this spends one report from the current period's allowance and queues the build. On Snapshot it returns a Stripe checkout link instead. The report is NOT generated on the spot: a person builds it and it is delivered to the portal, typically within 24 hours. Poll get_status, then list_deliverables. Requires an X-Mako-Key header.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client_account_id": {
                "description": "Which client workspace this is for. Get it from list_clients.",
                "type": "string"
              },
              "competitor": {
                "description": "The competitor's brand name or Meta Ad Library page name. One per order.",
                "type": "string"
              },
              "competitor_site": {
                "description": "The competitor's website.",
                "type": "string"
              },
              "facebook_page": {
                "description": "The competitor's public Facebook page URL.",
                "type": "string"
              },
              "goal": {
                "description": "What the customer wants to learn from the report.",
                "enum": ["launch", "lost_ground", "offers", "creative", "new_market"],
                "type": "string"
              },
              "market": {
                "enum": ["ALL", "US", "CA", "GB", "AU"],
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["competitor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
