        {
          "name": "list_plans",
          "description": "List Mako Metrics plans with pricing, what's included, scope limits, delivery, guarantee, and links to verify the merchant. Use this to recommend a plan before ordering. Covers the competitor report plans, which are the only products orderable through this server. May, the Meta ads agent, is a monthly engagement bought at makometrics.com/meta-ads-agent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
