          "name": "list_meta_assets",
          "description": "Show the client's connected Facebook ad account and the conversions available to optimize toward. Call this before build_paused_campaign on a leads or sales campaign, because those need a conversion to aim at. Connecting Facebook itself has to be done by a person in the portal. Requires an X-Mako-Key header.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client_account_id": {
                "description": "From list_clients.",
                "type": "string"
              }
            },
