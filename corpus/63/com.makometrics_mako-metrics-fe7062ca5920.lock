        },
        {
          "name": "run_may",
          "description": "Start a May creative run for one client: research, copy, and eight ad concepts, delivered to the portal for the customer to review and edit. Usually a few minutes. When the brand profile names a competitor May has not researched yet, it reads that competitor's website and Meta ads first, and the run shows status 'researching' for up to about 20 minutes. May builds creative and, separately in the portal, a PAUSED campaign. It never turns anything on and never spends ad budget. The client needs a confirmed brand profile first, which is filled in at makometrics.com/portal. Needs the May plan and an X-Mako-Key header.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "avoid": {
                "description": "One thing the creative must not claim or show.",
                "type": "string"
              },
              "brief": {
                "description": "What this round is for, in plain language. The campaign, the angle, the buyer.",
                "type": "string"
              },
              "client_account_id": {
                "description": "Which client workspace to run for. Get it from list_clients.",
                "type": "string"
              },
              "feature": {
                "description": "One thing the creative should lead with.",
                "type": "string"
              },
              "objective": {
                "enum": ["awareness", "traffic", "engagement", "leads", "calls", "sales"],
                "type": "string"
              }
            },
            "required": ["brief", "client_account_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a May Creative Run"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
