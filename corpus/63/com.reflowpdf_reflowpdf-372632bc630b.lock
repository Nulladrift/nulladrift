        {
          "name": "upload_image",
          "title": "Keep an image for a document",
          "description": "Keeps an image and returns its link, to use as <img src> or CSS url() in render_pdf, render_template, open_in_editor and update_document — so the document stays small when you read it back. Give one of: image — a picture the person attached in the chat, as your client passes attached files to tools; image_base64 — bytes you have yourself (one you made, a small file you can read: base64 is text you write, so tens of KB). PNG, JPEG, HEIC, GIF, WebP or AVIF; a photo over 10 MB or in HEIC is brought to print size (4096 px on the long side). A picture the person attached that you can see but have no file of: call ask_for_images, which gives them a link to upload it from their device. An image at a public https address needs no upload: use that address. An SVG goes into the HTML as it is. The image lasts 30 days after a document using it last changed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "image": {
                "additionalProperties": true,
                "description": "A picture the person attached in the chat.",
                "properties": {
                  "download_url": {
                    "description": "A temporary https address of the file.",
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "image_base64": {
                "description": "The image's bytes, base64 (a data: URI is taken too).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bytes": {
                "type": "integer"
              },
              "height": {
                "type": "integer"
              },
              "type": {
                "type": "string"
              },
              "url": {
                "description": "The image's link, for <img src>.",
                "type": "string"
              },
              "width": {
                "description": "Pixels (0: not read from this format).",
                "type": "integer"
              }
            },
            "required": ["bytes", "height", "type", "url", "width"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
