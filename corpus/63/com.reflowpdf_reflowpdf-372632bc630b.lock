      "instructions": "ReflowPDF prints HTML and CSS as paged PDF documents (page numbers, headers and footers, tables of contents, footnotes, multi-column text, drop caps, page decorations and watermarks, full-bleed covers with crop marks, charts, QR codes and barcodes, fillable forms; tagged PDF/UA). JavaScript does not run. Before writing your first document, call read_guide (topic \"html\"); for a common document (invoice, contract, report, CV, certificate …) try list_templates and render_template first. Answers carry a PDF link (24 hours) and the document's edit link; pass the links on unchanged. Where the ReflowPDF card is shown (ChatGPT and other MCP Apps clients; the tool result says so), the person already sees the pages and the Download and Edit buttons in it: reply in one or two sentences, do not add images, image search results or another card for the document, and do not repeat the links. For a later change the person asks for, call get_document with the document_id (they may have edited it), then update_document.",
      "tools": [
        {
          "name": "ask_for_images",
          "title": "Ask the person for their images",
          "description": "Gives a link where the person uploads pictures from their device for you — their logo, photos, a signature scan — when you cannot take the file from the chat yourself (you see an attached picture but have no file of it, or they have not sent it yet). Give them the link and say what to upload. When they say they are done, call ask_for_images again with upload_id: you get each image's link (with its size and file name) to put in the document — render_pdf, update_document. The link also accepts the file’s bytes by POST. The link works for 24 hours and takes up to 50 images — photos straight from a phone or a camera too (HEIC, up to 40 MB each; brought to print size, 4096 px on the long side).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "note": {
                "description": "What to upload, shown to the person on the page, e.g. \"Your company logo (PNG with a transparent background is best)\". Only for a new link.",
                "type": "string"
              },
              "upload_id": {
                "description": "The upload_id of a link you gave: what the person has uploaded to it so far.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "expiresAt": {
                "type": "string"
              },
              "images": {
                "items": {
                  "properties": {
                    "bytes": {
                      "type": "integer"
                    },
                    "height": {
                      "type": "integer"
                    },
                    "name": {
                      "description": "The file name on the person's device.",
                      "type": "string"
