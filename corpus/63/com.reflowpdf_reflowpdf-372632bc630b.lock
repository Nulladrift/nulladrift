        {
          "name": "import_pdf",
          "title": "Import a PDF into the editor",
          "description": "Returns a link (valid 24 hours) that opens an existing PDF in the ReflowPDF editor's import, which rebuilds it as an editable document. A PDF these tools printed, or one exported from the ReflowPDF editor with «Keep the PDF editable», opens from its own source at once; any other is rebuilt by AI, which needs a free account and uses its AI pages (the editor shows the cost first). A document you made with these tools needs no import: give the person its edit link. Give the PDF the person attached in the chat (pdf, as your client passes attached files), a public https URL of it, or its bytes in base64 (small files). A PDF you cannot pass on: the person opens the editor (https://app.reflowpdf.com) and imports it there.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The document's name. Default: the file's.",
                "type": "string"
              },
              "pdf": {
                "additionalProperties": true,
                "description": "A PDF the person attached in the chat, as your client passes attached files to tools.",
                "properties": {
                  "download_url": {
                    "description": "A temporary https address of the file.",
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "pdf_base64": {
                "description": "The PDF's bytes, base64 (up to 20 MB).",
                "type": "string"
              },
              "url": {
                "description": "A public https address of the PDF.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "documentId": {
                "type": "string"
              },
              "expiresAt": {
                "description": "When the link stops working (ISO 8601).",
                "type": "string"
              },
              "notes": {
                "description": "What to tell the person about this link.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "revision": {
                "type": "integer"
              },
              "url": {
                "description": "The link; it works until expiresAt.",
                "type": "string"
              }
            },
            "required": ["expiresAt", "notes", "url"],
            "type": "object"
          },
          "annotations": {
