        {
          "name": "render_pdf",
          "title": "Print HTML to PDF",
          "description": "Lays out a whole HTML document (with its CSS) as paged print and returns a download link to the PDF, valid 24 hours, and the document's edit link in the ReflowPDF editor. Use @page for paper and margins, margin boxes for headers, footers and page numbers; JavaScript does not run. Read read_guide topic \"html\" before the first document. To change the document later, use update_document with its document_id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "The PDF file name, e.g. \"invoice-1042.pdf\". Default: the document's <title>.",
                "type": "string"
              },
              "html": {
                "description": "The whole HTML document: <!doctype html>, <html lang>, a <title>, a <style> in <head> with @page. Self-contained; images and fonts by https URL, data: URI or an upload_image link.",
                "type": "string"
              },
              "preview": {
                "description": "Pictures (PNG) of pages come with the answer, so you can check the layout, fonts and images before giving the links. Default: true.",
                "type": "boolean"
              },
              "preview_pages": {
                "description": "Which pages to see, 1-based; -1 is the last page. Default: page 1 and the last page (a page that spilled over shows there). Up to 4, e.g. [1, 2, -1].",
                "items": {
                  "type": "integer"
                },
                "maxItems": 4,
                "type": "array"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bytes": {
                "type": "integer"
              },
              "documentId": {
                "description": "The document, for get_document and update_document.",
                "type": "string"
              },
              "editUrl": {
                "description": "The document in the ReflowPDF editor: the person edits it there (the link is the document; it lasts while it is used).",
                "type": "string"
              },
              "expiresAt": {
                "description": "When the link stops working (ISO 8601).",
                "type": "string"
              },
              "filename": {
                "type": "string"
              },
              "guest": {
                "description": "Printed without an account: the pages carry the ReflowPDF mark.",
                "type": "boolean"
              },
              "mark": {
                "description": "Whether the PDF carries the ReflowPDF mark, and why.",
                "enum": ["none", "guest", "free-allowance-used"],
                "type": "string"
              },
              "missingFonts": {
                "description": "Font families the document named that no face answered: their text took the next family of its list.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "missingVariables": {
                "description": "Template values the data did not have (printed empty).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notes": {
                "description": "Facts about this PDF: how long its link works, its mark, what was not fetched or filled.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pages": {
                "type": "integer"
              },
              "paper": {
                "description": "Its paper, e.g. \"A4\", \"Letter\", \"210 × 99 mm\"; empty when unknown.",
                "type": "string"
              },
              "pdfUrl": {
                "description": "The PDF (the same link as url).",
                "type": "string"
              },
              "preview": {
                "description": "Which pages came with this answer as pictures (PNG), or why none did.",
                "type": "string"
              },
              "previews": {
                "description": "Pages as pictures (PNG), kept with the PDF for its day.",
                "items": {
                  "properties": {
                    "height": {
                      "type": "integer"
                    },
                    "page": {
                      "type": "integer"
                    },
                    "url": {
                      "type": "string"
                    },
                    "width": {
                      "type": "integer"
                    }
                  },
                  "required": ["height", "page", "url", "width"],
                  "type": "object"
                },
                "type": "array"
              },
              "renderMs": {
                "description": "How long the print took on the server, in milliseconds (the engine and its adapter).",
                "type": "integer"
              },
              "revision": {
                "description": "Its revision: name it to update_document as base_revision.",
                "type": "integer"
