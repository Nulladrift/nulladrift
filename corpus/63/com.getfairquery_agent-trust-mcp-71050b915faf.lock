        {
          "name": "email_validate_deliverability",
          "title": "Validate email deliverability: MX, SPF, DMARC (paid)",
          "description": "WHAT: Runs the Fairquery Apify Actor email-validator-mx-disposable: syntax, domain existence, MX/null-MX, disposable, role, free provider, typo suggestion, SPF/DMARC policy, mail provider; final verdict valid | risky | invalid | unknown.\nWHEN: Only when MX/DNS matters (can the domain receive mail?), e.g. cleaning lists before a send or verifying a lead's domain; pre-filter with email_check_syntax to avoid paying for obviously bad rows.\nWHEN NOT: Offline format, typo, disposable or role checks (free email_check_syntax). Leads that also need sanctions screening: trust_screen_lead (one merged decision). It does not SMTP-probe mailboxes.\nCOST: Paid, billed to YOUR Apify account via your APIFY_TOKEN: $0.79 per 1,000 emails (+ $0.05 per 1,000 runs). 100 emails ~ $0.08.\nRETURNS: Paged \"email\" rows (verdict valid | risky | invalid | unknown with reasons[]) or \"error\" rows. Tool errors: APIFY_TOKEN_MISSING, APIFY_TOKEN_INVALID, APIFY_PAYMENT_REQUIRED, APIFY_ACTOR_RUN_FAILED, APIFY_TIMEOUT.\nBEHAVIOR: No email is sent; results change only with live DNS. Called from this Fairquery-hosted Worker, which forwards your input and Apify token to Apify and waits 20 s (APIFY_TIMEOUT if the run has not finished). This Worker's code is designed not to store them. The Actor in your account does the DNS/MX lookups.\nPARAMETERS: emails: elements may also hold comma/semicolon/newline-separated lists or \"Name <addr>\" forms; the Actor splits them, trims, and skips case-insensitive duplicates, so you pay once per unique address. The allow* flags only decide whether a condition downgrades the verdict to \"risky\": the matching reason code (ROLE_ACCOUNT, DISPOSABLE_DOMAIN, FREE_PROVIDER) is reported in reasons[] either way, and they can never turn an \"invalid\" address (bad syntax, no domain, null MX, no mail server) into \"valid\". POSSIBLE_TYPO and IMPLICIT_MX_ONLY always make it \"risky\" regardless of flags. Typical presets: B2B lead list = allowFreeProviders false + allowRoleAccounts false; consumer signups = defaults. checkSpfDmarc only adds has_spf / has_dmarc / dmarc_policy fields; it never changes the verdict or the price. limit/offset only page the returned rows: every call validates and bills the whole list again (also when only offset changes), so set limit (max 1000) to cover all rows instead of paging.\nEXAMPLE: {\"emails\":[\"john@stripe.com\"]} -> verdict \"valid\", has_mx true, mail_provider \"Google Workspace / Gmail\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "allowDisposable": {
                "default": false,
                "description": "Optional boolean, default false = disposable/temporary-inbox domains (mailinator.com, ...) get verdict \"risky\"; true stops penalising them",
                "type": "boolean"
              },
              "allowFreeProviders": {
                "default": true,
                "description": "Optional boolean, default true. false downgrades free webmail (gmail.com, outlook.com, yahoo.com, ...) to \"risky\"; recommended for B2B lead lists",
                "type": "boolean"
              },
              "allowRoleAccounts": {
                "default": true,
                "description": "Optional boolean, default true. false downgrades role mailboxes (info@, sales@, support@, ...) to verdict \"risky\"",
                "type": "boolean"
              },
              "checkSpfDmarc": {
                "default": true,
                "description": "Optional boolean, default true. true adds has_spf, has_dmarc and dmarc_policy (none|quarantine|reject) per domain; false skips those DNS lookups. Verdict and price are unaffected",
                "type": "boolean"
              },
              "emails": {
                "description": "Required. 1-10000 strings, 1-320 chars each, one address per element; bare \"jane@acme.com\", \"Jane <jane@acme.com>\" and \"mailto:jane@acme.com\" forms accepted. Example: [\"jane@acme.com\",\"bob@gmial.com\"]",
                "items": {
                  "maxLength": 320,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10000,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "default": 100,
                "description": "Optional page size: items to return, integer 1-1000 (default 100). Example: 50",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Optional zero-based number of items to skip, integer 0-1000000 (default 0); pass nextOffset from the previous response, e.g. 100",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["emails"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Number of items in this page",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "hasMore": {
                "description": "True if more items exist after this page",
                "type": "boolean"
