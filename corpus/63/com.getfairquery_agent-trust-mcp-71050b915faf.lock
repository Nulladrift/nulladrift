        {
          "name": "osv_query_packages",
          "title": "Check package versions for known vulnerabilities (free, OSV.dev)",
          "description": "WHAT: Query the public OSV.dev database (api.osv.dev querybatch) for exact package versions; returns which are vulnerable and the advisory IDs.\nWHEN: Quick \"is lodash 4.17.20 vulnerable?\" checks for up to 200 packages; then osv_get_vulnerability for details of specific IDs.\nWHEN NOT: Parsing manifests/lockfiles, severity filtering, fixed/recommended versions in one shot -> osv_audit_dependencies (paid).\nCOST: Free; no token. Package names and versions leave the client, are received by this Worker, and are forwarded to api.osv.dev. Nothing is sent to Apify. This Worker's code is designed not to store inputs or results.\nRETURNS: Paged \"package\" rows (vulnerable, vuln_ids) or per-entry INVALID_ECOSYSTEM \"error\" rows. Tool errors: OSV_FETCH_FAILED (retryable).\nBEHAVIOR: Runs on this Fairquery-hosted Worker (Cloudflare), not on the caller's machine; inputs leave the client. This Worker's code is designed not to store inputs, results, or an Apify token. One HTTPS request to api.osv.dev (Google-run public API) for all packages; typically <2 s, 20 s timeout. Results change only when OSV publishes advisories.\nPARAMETERS: packages: each entry is checked independently and returns exactly one row, in input order. An unknown ecosystem yields a per-entry INVALID_ECOSYSTEM error row while the other entries still run. A version range such as \"^4.17.0\" or \">=2\" is not resolved and normally returns no vulnerabilities (a false \"safe\"), so pin versions from your lockfile first. Duplicate entries are queried and returned twice. limit/offset page the rows (all packages are sent to OSV in a single request); meta.vulnerable_count counts all packages, not only the page.\nEXAMPLE: {\"packages\":[{\"ecosystem\":\"npm\",\"name\":\"lodash\",\"version\":\"4.17.20\"}]} -> vulnerable true, vuln_ids [\"GHSA-35jh-r3h4-6jhm\",...].",
