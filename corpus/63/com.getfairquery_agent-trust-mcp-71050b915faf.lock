        {
          "name": "osv_audit_dependencies",
          "title": "Audit dependencies/manifests with fix recommendations (paid)",
          "description": "WHAT: Runs the Fairquery Apify Actor osv-dependency-vulnerability-check: parses package.json, package-lock.json (v1-v3), requirements.txt or go.mod (or a package list), checks OSV, and returns per-package max severity/CVSS, fixed versions, a recommended upgrade version and one row per vulnerability (deduped aliases).\nWHEN: Only for manifests, severity filtering or fix recommendations: full project audits from a pasted manifest, CI-style reports; for a few exact versions use osv_query_packages (free).\nWHEN NOT: Quick checks of a few exact versions (osv_query_packages, free) or one advisory (osv_get_vulnerability, free).\nCOST: Paid, billed to YOUR Apify account via your APIFY_TOKEN: $0.50 per 1,000 packages + $1.50 per 1,000 vulnerabilities found (+ $0.05 per 1,000 runs). Use minSeverity=\"HIGH\" to cut vuln rows. lodash+django (2 pkgs, 41 vulns) ~ $0.06.\nRETURNS: Paged rows type=\"package\" (vulnerable, vuln_count, max_severity, fixed_versions, recommended_version), type=\"vulnerability\" (id, cve_ids, severity, cvss_score, fixed_versions, osv_url) or type=\"error\". Tool errors: INPUT_EMPTY, APIFY_TOKEN_MISSING, APIFY_TOKEN_INVALID, APIFY_PAYMENT_REQUIRED, APIFY_ACTOR_RUN_FAILED, APIFY_TIMEOUT.\nBEHAVIOR: Called from this Fairquery-hosted Worker, which forwards your input and Apify token to Apify and waits 20 s (APIFY_TIMEOUT if the run has not finished). This Worker's code is designed not to store them. The Actor in your account queries OSV.dev. Up to 1000 packages or a 2,000,000-char manifest.\nPARAMETERS: packages or manifestText = input (one required); manifestType = format, default auto-detect; minSeverity = only report at/above ALL|LOW|MEDIUM|HIGH|CRITICAL (default ALL); includeDevDependencies (default true); limit = page size (default 100, max 1000); offset = items to skip for paging (default 0).\nEXAMPLE: {\"manifestText\":\"django==3.2.0\\nrequests==2.19.0\",\"minSeverity\":\"HIGH\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "includeDevDependencies": {
                "default": true,
                "description": "Optional boolean, default true. false skips devDependencies (package.json) and dev packages (package-lock.json); no effect on requirements.txt / go.mod",
                "type": "boolean"
              },
              "limit": {
                "default": 100,
                "description": "Optional page size: items to return, integer 1-1000 (default 100). Example: 50",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "manifestText": {
                "description": "Optional if packages is given. Raw file content (<= 2,000,000 chars) of package.json, package-lock.json (v1-v3), requirements.txt (== pins) or go.mod; parsed packages are added to packages. Example: \"django==3.2.0\\nrequests==2.19.0\"",
                "maxLength": 2000000,
                "type": "string"
              },
              "manifestType": {
                "default": "auto",
                "description": "Optional, one of \"auto\" | \"package.json\" | \"package-lock.json\" | \"requirements.txt\" | \"go.mod\", default \"auto\" (detect from content). Set it when detection fails (MANIFEST_UNDETECTED)",
                "enum": ["auto", "package.json", "package-lock.json", "requirements.txt", "go.mod"],
                "type": "string"
              },
              "minSeverity": {
                "default": "ALL",
                "description": "Optional, one of \"ALL\" | \"LOW\" | \"MEDIUM\" | \"HIGH\" | \"CRITICAL\", default \"ALL\". Only emit (and bill) vulnerability rows at or above this severity; package rows are always emitted. Example: \"HIGH\"",
                "enum": ["ALL", "LOW", "MEDIUM", "HIGH", "CRITICAL"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Optional zero-based number of items to skip, integer 0-1000000 (default 0); pass nextOffset from the previous response, e.g. 100",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "packages": {
                "description": "Optional if manifestText is given (at least one is required). 0-1000 {ecosystem, name, version} objects with exact versions; billed per package. Example: [{\"ecosystem\":\"npm\",\"name\":\"lodash\",\"version\":\"4.17.20\"}]",
                "items": {
                  "properties": {
                    "ecosystem": {
                      "description": "Required, 1-40 chars, case-insensitive. One of npm, PyPI, Go, Maven, crates.io, RubyGems, NuGet, Packagist, Pub, Hex; aliases node, pip, python, golang, java, cargo, rust, gem, ruby, composer accepted. Example: \"npm\"",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "name": {
                      "description": "Required, 1-300 chars. Package name exactly as published: npm \"lodash\" or \"@scope/pkg\", PyPI \"django\", Go module path \"github.com/gin-gonic/gin\", Maven \"groupId:artifactId\" e.g. \"org.apache.logging.log4j:log4j-core\"",
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    },
                    "version": {
                      "description": "Required, 1-100 chars. One exact version without range operators or \"v\" prefix, e.g. \"4.17.20\" (not \"^4.17.0\"); Go uses \"v1.9.0\"",
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["ecosystem", "name", "version"],
                  "type": "object"
                },
                "maxItems": 1000,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
