              },
              "redactionStyle": {
                "default": "placeholder",
                "description": "Optional, one of \"placeholder\" | \"mask\" | \"hash\" | \"label\" | \"surrogate\", default \"placeholder\". \"placeholder\" = [EMAIL_k7q2m9xp4a] (reversible with meta.sealed_map); \"mask\" = j***@a***.com, **** **** **** 1111; \"hash\" = [EMAIL:3f2a9c0d1b7e] (salted sha256 prefix; with hashKey an HMAC that stays the same across calls); \"label\" = type only, [EMAIL]; \"surrogate\" = a synthetic value of the same shape, prefixed with ⟦SG⟧, stable for the same text and surrogateSeed, and not reversible (other types [TYPE_SURROGATE_id]). Example: \"mask\"",
