        {
          "name": "sanctions_screen_names",
          "title": "Screen names against OFAC/EU/UK/UN sanctions (paid)",
          "description": "WHAT: Runs the Fairquery Apify Actor sanctions-watchlist-screener: fuzzy-match people/organisations against OFAC SDN, OFAC Consolidated, EU, UK and UN lists from the official sources (re-downloaded when the cached copy in your Apify account is older than 6 h; every row reports each list's publication date); optional country/DOB filters.\nWHEN: KYC/KYB onboarding, vendor/counterparty checks, bulk re-screening. Put all names in ONE call (each call is one run with its own start fee; list loading takes ~2-5 s from the cache, or 10-40 s, up to ~60 s, when lists are re-downloaded). This Worker waits 20 s, so a re-download that runs longer returns APIFY_TIMEOUT.\nWHEN NOT: PEP/adverse media, certified compliance decisions. For coverage info use free sanctions_list_sources. Leads that also have an email to validate: trust_screen_lead (one merged decision).\nCOST: Paid, billed to YOUR Apify account via your APIFY_TOKEN: $3.00 per 1,000 names + $7.00 per 1,000 runs. 200 names in one call ~ $0.61.\nRETURNS: Paged \"screening\" rows (status potential_match | no_match, matches[] best first, lists_unavailable) or \"error\" rows. Tool errors: INPUT_EMPTY, APIFY_TOKEN_MISSING, APIFY_TOKEN_INVALID, APIFY_PAYMENT_REQUIRED, APIFY_ACTOR_RUN_FAILED, APIFY_TIMEOUT. Not a certified screening service. Automated fuzzy matching against public lists; false positives and misses are possible. Review every potential match manually and consult official sources/legal counsel before acting.\nBEHAVIOR: Results are stable for a given list snapshot. Called from this Fairquery-hosted Worker, which forwards your input and Apify token to Apify and waits 20 s (APIFY_TIMEOUT if the run has not finished). This Worker's code is designed not to store them. The Actor runs in your account. Up to 10,000 names. A list re-download can outlast the 20 s wait.\nPARAMETERS: names and/or queries: at least one non-empty (the schema marks both optional; neither -> INPUT_EMPTY, not billed). Both may be combined; every entry is billed once, so use names for bare strings and queries when you have country/dateOfBirth/entityType or want your own id echoed. In queries, dateOfBirth removes listed individuals born more than 1 year apart, while country never removes matches (it only sets country_match); entityType \"entity\" covers organisations, vessels and aircraft. lists: omit to screen all five; a list that cannot be downloaded is reported in lists_unavailable instead of failing the run. minScore: a match is returned only if its 0-100 similarity is >= minScore; 85 balances recall and noise, 90-95 for large batches, 75-80 for transliterated names; it does not change the price. maxMatchesPerName caps matches[] only; match_count still reports all matches. limit/offset only page the returned rows: every call screens and bills all names again (also when only offset changes), so set limit (max 1000) to cover all rows instead of paging.\nEXAMPLE: {\"queries\":[{\"name\":\"Banco Nacional de Cuba\",\"entityType\":\"entity\"}],\"minScore\":90} -> status potential_match (OFAC_SDN).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 100,
                "description": "Optional page size: items to return, integer 1-1000 (default 100). Example: 50",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "lists": {
                "description": "Optional, default all five. Any subset of \"OFAC_SDN\" | \"OFAC_CONS\" | \"EU\" | \"UK\" | \"UN\" (ids from sanctions_list_sources). Example: [\"OFAC_SDN\",\"EU\"]",
                "items": {
                  "enum": ["OFAC_SDN", "OFAC_CONS", "EU", "UK", "UN"],
                  "type": "string"
                },
                "type": "array"
              },
              "maxMatchesPerName": {
                "default": 10,
                "description": "Optional integer 1-100, default 10. Max entries in matches[] per name (best first); match_count still reports the total. Example: 3",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "minScore": {
                "default": 85,
                "description": "Optional integer 60-100, default 85. Minimum 0-100 fuzzy name-similarity score for a match; 90+ = fewer false positives, ~80 = more recall. Example: 90",
                "maximum": 100,
                "minimum": 60,
                "type": "integer"
              },
              "names": {
                "description": "Optional if queries is given (at least one is required). 0-10000 plain person/organisation names, 1-300 chars each. Example: [\"Acme Trading LLC\",\"Banco Nacional de Cuba\"]",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10000,
                "type": "array"
              },
              "offset": {
                "default": 0,
                "description": "Optional zero-based number of items to skip, integer 0-1000000 (default 0); pass nextOffset from the previous response, e.g. 100",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "queries": {
                "description": "Optional if names is given. 0-10000 {name, id?, country?, dateOfBirth?, entityType?} objects. Example: [{\"name\":\"Ali Khamenei\",\"id\":\"cust-42\",\"country\":\"IR\",\"dateOfBirth\":\"1939\",\"entityType\":\"individual\"}]",
                "items": {
                  "properties": {
                    "country": {
                      "description": "Optional, <= 60 chars. ISO 3166-1 alpha-2 code (\"IR\") or English country name (\"Iran\"); adds country_match true/false to each match, does not filter",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "dateOfBirth": {
                      "description": "Optional. Format YYYY or YYYY-MM-DD (pattern ^\\d{4}(-\\d{2}-\\d{2})?$), e.g. \"1939\" or \"1939-04-19\"; listed individuals whose birth year differs by more than 1 year are dropped",
                      "pattern": "^\\d{4}(-\\d{2}-\\d{2})?$",
                      "type": "string"
                    },
                    "entityType": {
                      "description": "Optional, one of \"individual\" | \"entity\" | \"any\", default \"any\". \"entity\" = organisations, vessels, aircraft",
                      "enum": ["individual", "entity", "any"],
                      "type": "string"
                    },
                    "id": {
                      "description": "Optional, <= 200 chars. Your own reference echoed back in the row, e.g. \"cust-42\"",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "name": {
                      "description": "Required. Person or organisation name, 1-300 chars, any order/case/diacritics, e.g. \"Banco Nacional de Cuba\"",
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 10000,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Number of items in this page",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "hasMore": {
                "description": "True if more items exist after this page",
                "type": "boolean"
              },
              "items": {
                "description": "Result rows for this page",
                "items": {
