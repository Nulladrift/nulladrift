                "description": "Optional, \"any\" | \"user\", default \"any\". \"user\" marks the sealed_map user-only: pii_restore_text returns originals only on requests with the X-FQ-PII-User-Present header (set by an MCP Apps / client UI action, not by the model); otherwise USER_ONLY_RESTORE, counts only.",
