        {
          "name": "trust_screen_lead",
          "title": "Screen leads: email deliverability + sanctions (paid)",
          "description": "WHAT: One call per batch of leads/counterparties: runs email_validate_deliverability on their emails and sanctions_screen_names on their person/company names IN PARALLEL, then merges results per lead with an overall decision: block (invalid email or sanctions potential_match), review (risky email), pass.\nWHEN: Onboarding customers/vendors, qualifying inbound leads, CRM hygiene where both email quality and sanctions exposure matter.\nWHEN NOT: Email only -> email_validate_deliverability; names only -> sanctions_screen_names (same per-item prices, no merge step). Free pre-filter first: email_check_syntax. Use this tool only when a lead needs both checks and one decision.\nCOST: Paid, billed to YOUR Apify account via your APIFY_TOKEN: $0.79 per 1,000 leads with email + $3.00 per 1,000 leads with name (= $3.79 per 1,000 full leads) + $7.00 per 1,000 calls for the sanctions run. 100 full leads ~ $0.39.\nRETURNS: Paged \"lead\" rows (decision pass | review | block with reasons[]; sanctions_matches holds the top 3); meta.summary counts by decision. Partial failure: the affected check shows \"unavailable\" and meta.errors lists codes. Tool errors: INPUT_EMPTY, APIFY_TOKEN_MISSING.\nBEHAVIOR: No email is sent. Called from this Fairquery-hosted Worker, which forwards your input and Apify token to Apify and waits 20 s (APIFY_TIMEOUT if the run has not finished). This Worker's code is designed not to store them. Runs the email and sanctions Apify Actors in parallel (2 runs per call) in your account. Sanctions lists come from a cache at most 6 h old, or are downloaded; a download can outlast the 20 s wait.\nPARAMETERS: leads: each record needs email and/or name (if no lead has either -> INPUT_EMPTY, nothing billed); a lead with only an email skips sanctions (sanctions_status \"not_checked\") and one with only a name skips email (email_verdict \"not_checked\"), so a lead is billed for each check it gets (prices under COST), plus the per-call sanctions run fee when any lead has a name. Identical emails across leads are validated and billed once. ref joins sanctions results back to the lead, so keep refs unique (default = the lead's 0-based index as a string). country and entityType apply to that lead's sanctions check only: entityType filters candidates, while country only annotates matches (never removes them). minScore: sanctions similarity threshold; default 88 here (stricter than the 85 of sanctions_screen_names) to keep block decisions low-noise; each name returns at most its top 3 matches. allowFreeProviders=false turns gmail.com-type addresses into email_verdict \"risky\", i.e. decision \"review\" (never \"block\"). Decision precedence: any sanctions potential_match or invalid email -> block; else risky email or an incomplete check -> review; else pass. limit/offset page the merged lead rows, but every call re-runs and re-bills both checks for all leads (also when only offset changes), so set limit (max 1000) to cover all leads; meta.summary counts all leads.\nEXAMPLE: {\"leads\":[{\"ref\":\"L1\",\"email\":\"cfo@acme.com\",\"name\":\"Acme Trading LLC\",\"country\":\"US\"}]} -> {decision:\"pass\",email_verdict:\"valid\",sanctions_status:\"no_match\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "allowFreeProviders": {
                "default": true,
                "description": "Optional boolean, default true. false makes free webmail (gmail.com, outlook.com, ...) email_verdict \"risky\" -> decision \"review\"; recommended for B2B",
                "type": "boolean"
              },
              "leads": {
                "description": "Required. 1-1000 lead objects {ref?, email?, name?, country?, entityType?}; each needs email and/or name. Example: [{\"ref\":\"L1\",\"email\":\"cfo@acme.com\",\"name\":\"Acme Trading LLC\",\"country\":\"US\",\"entityType\":\"entity\"}]",
                "items": {
                  "properties": {
                    "country": {
                      "description": "Optional, <= 60 chars. ISO 3166-1 alpha-2 code (\"US\") or English country name; sets country_match on sanctions matches, does not filter",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "email": {
                      "description": "Optional (email and/or name required), <= 320 chars. One email address, e.g. \"cfo@acme.com\"; \"Name <addr>\" accepted",
                      "maxLength": 320,
                      "type": "string"
                    },
                    "entityType": {
                      "description": "Optional, one of \"individual\" | \"entity\" | \"any\", default \"any\". Restricts sanctions candidates for this lead's name",
                      "enum": ["individual", "entity", "any"],
                      "type": "string"
                    },
                    "name": {
                      "description": "Optional (email and/or name required), <= 300 chars. Person or company name to sanctions-screen, e.g. \"Acme Trading LLC\"",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "ref": {
                      "description": "Optional, <= 200 chars, must be unique per call. Your ID echoed back as ref, e.g. \"crm-123\"; default = the lead's 0-based index as a string (\"0\", \"1\", ...)",
                      "maxLength": 200,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "default": 100,
                "description": "Optional page size: items to return, integer 1-1000 (default 100). Example: 50",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "minScore": {
                "default": 88,
                "description": "Optional integer 60-100, default 88. Minimum 0-100 fuzzy name-similarity for a sanctions potential_match (which blocks the lead). Example: 92",
                "maximum": 100,
                "minimum": 60,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Optional zero-based number of items to skip, integer 0-1000000 (default 0); pass nextOffset from the previous response, e.g. 100",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["leads"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
