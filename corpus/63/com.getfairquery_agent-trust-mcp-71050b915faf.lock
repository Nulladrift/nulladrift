          "name": "pii_guard_documents",
          "title": "Fortress Shield: deep PII/secret guard for documents and URLs (paid)",
          "description": "WHAT: Runs the Fairquery Apify Actor llm-data-guard-pii-secrets: everything pii_scan_text does PLUS person-name/location NER, street addresses, public document URLs (txt/md/json/csv/HTML/PDF text layer, <= 10 MB) and restore mode (put originals back into LLM output using a placeholder map).\nWHEN: Only when you need NER names/addresses, files at URLs/PDFs, or the hosted pipeline.\nWHEN NOT: Plain text scans (pii_scan_text / pii_redact_text, free), restoring placeholders in an LLM answer (pii_restore_text, free, same result as restore mode), images (no OCR), email deliverability.\nCOST: Paid, billed to YOUR Apify account via your APIFY_TOKEN: $1.50 per 1,000 documents + $0.20 per 1,000 findings. Example: 10 docs with 20 findings ~ $0.02.\nRETURNS: Paged \"document\" rows (findings masked; output_text in redact/restore modes; with returnPlaceholderMap the map comes back as an encrypted sealed_map string when this deployment has a seal key) or \"error\" rows. Tool errors: APIFY_TOKEN_MISSING, APIFY_TOKEN_INVALID, APIFY_PAYMENT_REQUIRED, APIFY_ACTOR_RUN_FAILED, APIFY_TIMEOUT, INPUT_EMPTY.\nBEHAVIOR: Called from this Fairquery-hosted Worker, which forwards your input and Apify token to Apify and waits 20 s (APIFY_TIMEOUT if the run has not finished). This Worker's code is designed not to store them. The Actor runs in your Apify account and may fetch documentUrls. Up to 1000 texts / 100 URLs (10 MB each).\nPARAMETERS: texts and/or documentUrls: at least one non-empty (the schema marks both optional; neither -> INPUT_EMPTY, not billed); both may be combined and each text or URL becomes one billed document row. mode=\"restore\" ignores all detector flags; with sealedMap it follows the same restore key rule as pii_restore_text (refusal -> RESTORE_KEY_REQUIRED, nothing billed); a clear-text placeholderMap alone is refused on deployments with a seal key (SEALED_MAP_REQUIRED, nothing billed); a placeholder missing from placeholderMap stays as is. Cost scales with documents and findings, so narrow entityTypes to cut finding charges. limit/offset only page the returned rows: every call processes and bills the whole input again (also when only offset changes), so pick a limit (max 1000) that covers all rows instead of paging.\nEXAMPLE: {\"documentUrls\":[\"https://example.com/report.pdf\"],\"mode\":\"redact\",\"detectNames\":true}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "allowList": {
                "description": "Optional, default []. 0-1000 exact values never flagged (whole value, case-insensitive). Example: [\"support@yourco.com\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "detectAddresses": {
                "default": false,
                "description": "Optional boolean, default false. true enables street-address patterns (STREET_ADDRESS) and place-name NER (LOCATION)",
                "type": "boolean"
              },
              "detectNames": {
                "default": false,
                "description": "Optional boolean, default false. true enables English person-name NER (type PERSON; lower precision, slower)",
                "type": "boolean"
              },
              "documentUrls": {
                "description": "Optional if texts is given. 0-100 public http(s) URLs (<= 2000 chars) of txt/md/json/csv/HTML/PDF files (<= 10 MB each, PDF text layer only), fetched by the Actor in Apify cloud. Example: [\"https://example.com/a.pdf\"]",
                "items": {
                  "format": "uri",
                  "maxLength": 2000,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "entityTypes": {
                "description": "Optional, default omitted = all enabled detectors. 0-40 type names from pii_list_detectors (case-insensitive), e.g. [\"EMAIL\",\"PERSON\"]; PERSON/LOCATION/STREET_ADDRESS also need detectNames/detectAddresses",
                "items": {
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              },
              "entropyScan": {
                "default": false,
                "description": "Optional boolean, default false. true also flags unlabeled random-looking tokens (20+ chars) as HIGH_ENTROPY_STRING",
                "type": "boolean"
              },
              "limit": {
                "default": 100,
                "description": "Optional page size: items to return, integer 1-1000 (default 100). Example: 50",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "default": "redact",
                "description": "Optional, one of \"detect\" | \"redact\" | \"restore\", default \"redact\". \"detect\" = findings only; \"redact\" = findings + output_text; \"restore\" = replace placeholders in texts with originals from placeholderMap. Example: \"detect\"",
                "enum": ["detect", "redact", "restore"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Optional zero-based number of items to skip, integer 0-1000000 (default 0); pass nextOffset from the previous response, e.g. 100",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "placeholderMap": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Optional; used only with mode=\"restore\". Object mapping placeholder -> original value, as returned by an earlier redact call. Example: {\"[EMAIL_1]\":\"jane@acme.com\"}",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "redactionStyle": {
                "default": "placeholder",
                "description": "Optional, one of \"placeholder\" | \"mask\" | \"hash\" | \"label\" | \"surrogate\", default \"placeholder\"; used in mode=\"redact\" only. Same five styles as pii_redact_text (t2048u #20). placeholder = [EMAIL_1] (reversible), mask = j***@a***.com, hash = [EMAIL:3f2a9c0d1b7e]",
                "enum": ["placeholder", "mask", "hash", "label", "surrogate"],
                "type": "string"
              },
              "returnPlaceholderMap": {
                "default": false,
                "description": "Optional boolean, default false. true adds the placeholder map to each row, as an encrypted sealed_map string when this deployment has a seal key (clear-text placeholder_map otherwise); only with mode=\"redact\" and redactionStyle=\"placeholder\"",
                "type": "boolean"
              },
              "sealedMap": {
                "description": "Optional; used only with mode=\"restore\". A sealed_map from this Worker (pii_redact_text or this tool); it is opened here and sent to the Actor as placeholderMap. Example: \"fqs1.…\"",
                "maxLength": 4000000,
                "minLength": 10,
                "type": "string"
              },
              "surrogateSeed": {
                "description": "Optional, 1-200 chars. WARNING: visible to the model. Prefer the X-FQ-PII-Surrogate-Seed header, which wins and is not echoed. Omit both for a per-call seed. There is no per-tenant isolation.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "texts": {
                "description": "Optional if documentUrls is given (at least one of the two is required). 0-1000 documents as plain strings, each <= 1,000,000 chars; one billed document row each. Example: [\"Mail jane@acme.com, key AKIAIOSFODNN7EXAMPLE\"]",
                "items": {
                  "maxLength": 1000000,
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Number of items in this page",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "hasMore": {
                "description": "True if more items exist after this page",
                "type": "boolean"
              },
              "items": {
                "description": "Result rows for this page",
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "additionalProperties": {},
                "description": "Tool-specific context (summary counts, cost notes, ...)",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "nextOffset": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Offset to pass for the next page, or null"
              },
              "offset": {
                "description": "Offset of the first item in this page",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "total": {
                "description": "Total items before paging",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["count", "hasMore", "items", "nextOffset", "offset", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Deep PII guard (paid)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b96bc902f349044b978f31bd5c5a59807a313501bee17836f1f972f402933385"
        },
        {
          "name": "pii_list_detectors",
          "title": "Fortress Shield: list PII/secret detectors and pricing (free)",
          "description": "WHAT: Fortress Shield (agent I/O PII protection). Catalog of every PII and secret entity type, which ones the free tools run on this Worker (pii_scan_text / pii_redact_text) vs only in the paid Actor (NER names/locations, and fetching remote PDF/document URLs; http(s) URLs in text are detected locally; STREET_ADDRESS patterns run locally with detectAddresses), redaction styles, sealed-map support, and the price of every paid tool in this server.\nWHEN: Before pii_scan_text / pii_redact_text to pick entityTypes, or to explain coverage and costs to a user.\nWHEN NOT: To actually scan text (pii_scan_text) or redact it (pii_redact_text).\nCOST: Free; no token.\nRETURNS: One catalog object; local:true marks the detectors the free tools run (see PARAMETERS). features.sealed_map.available says whether this deployment can seal placeholder maps.\nBEHAVIOR: Runs on this Fairquery-hosted Worker (Cloudflare), not on the caller's machine; inputs leave the client. This Worker's code is designed not to store inputs, results, or an Apify token. No further network call; the catalog is compiled into this Worker, instant (<10 ms). No rate limits.\nPARAMETERS: None: call with an empty object {}; the catalog is always complete and cannot be filtered. Its output feeds other tools' parameters: copy detector \"type\" values verbatim into entityTypes of pii_scan_text / pii_redact_text (only rows with local:true can match there) or pii_guard_documents (all rows, incl. PERSON / LOCATION / STREET_ADDRESS); redaction_styles keys are the allowed redactionStyle values.\nEXAMPLE: {} -> {\"detectors\":[{\"type\":\"AWS_ACCESS_KEY\",\"category\":\"secret\",\"local\":true},...]}",
