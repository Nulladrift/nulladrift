              "sealedMap": {
                "description": "Optional (this or placeholderMap required). meta.sealed_map from pii_redact_text, unchanged. Example: \"fqs2.…\"",
                "maxLength": 4000000,
                "minLength": 10,
                "type": "string"
              },
              "tenantId": {
                "description": "Optional. Tenant of a tenant-bound sealed_map (pii_redact_text tenantId); a different or missing tenant -> TENANT_MISMATCH, counts only. The X-FQ-PII-Tenant header wins.",
                "pattern": "^[A-Za-z0-9._:-]{1,128}$",
                "type": "string"
              },
              "texts": {
                "description": "Required. 1-50 documents (prompt, chat message, log, file content), each <= 200,000 chars, total <= 500,000 chars. Example: [\"Mail jane@acme.com, key AKIAIOSFODNN7EXAMPLE\"]",
                "items": {
                  "maxLength": 200000,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["texts"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Number of items in this page",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "hasMore": {
                "description": "True if more items exist after this page",
                "type": "boolean"
              },
              "items": {
                "description": "Result rows for this page",
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "additionalProperties": {},
                "description": "Tool-specific context (summary counts, cost notes, ...)",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "nextOffset": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Offset to pass for the next page, or null"
              },
              "offset": {
