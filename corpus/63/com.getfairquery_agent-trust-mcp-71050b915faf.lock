        {
          "name": "pii_restore_text",
          "title": "Fortress Shield: restore placeholders with original values (free, on this Worker)",
          "description": "WHAT: Fortress Shield (agent I/O PII protection). Put the original values back into texts (typically an LLM answer) that contain placeholders such as [EMAIL_k7q2m9xp4a], by opening meta.sealed_map from pii_redact_text on this Worker (or a legacy clear-text placeholder map). Numeric JSON sentinels are restored only in the redacted document they came from, matched by those bytes in any order. A different document is not rewritten. Slots for a document you did not pass are reported as JSON_NUMBER_DOC_MISMATCH. schema_range_preserved is false.\nWHEN: After an LLM or third party answered a prompt you sanitized with pii_redact_text (redactionStyle \"placeholder\"), right before showing the answer to the user.\nWHEN NOT: To redact (pii_redact_text) or find PII (pii_scan_text). Masked and hashed values cannot be restored; only placeholder style is reversible.\nCOST: Free; no token.\nRETURNS: One \"restored_document\" row per text with restored, output_text, replacements, fuzzy_restored, unknown_placeholders and near_miss_placeholders. meta.restore_gate is RESTORE_KEY_OK, or RESTORE_KEY_REQUIRED / RESTORE_KEY_MISMATCH / RESTORE_LIMIT_REACHED, in which case nothing is substituted: restored is false, replacements 0, output_text is the input unchanged and sealed_replacements_withheld only counts them. restored is true only when at least one placeholder was actually replaced. Every row carries map_source (\"sealed\" | \"plaintext\"), verified (true only for an authenticated sealed map) and exact (no fuzzy, unknown or near-miss placeholders); meta.verification and meta.audit (counts) summarise them. A clear-text placeholderMap alone is refused on deployments with a seal key (meta.restore_gate SEALED_MAP_REQUIRED, nothing substituted, plaintext_replacements_refused counts). Further gate codes (counts only): TENANT_MISMATCH (map bound to another tenantId), USER_ONLY_RESTORE (restoreAudience \"user\" without the X-FQ-PII-User-Present header), APPS_RESTORE_REQUIRED (operator requires a user-facing MCP Apps / UI restore). meta.seal_ttl {expires_at, remaining_seconds}; meta.sealed_map_extended with extendTtlHours; meta.receipt with returnReceipt. Errors: INPUT_TOO_LARGE, MAP_MISSING, SEALED_MAP_INVALID (altered or from another deployment), SEALED_MAP_EXPIRED, SEAL_KEY_NOT_CONFIGURED.\nBEHAVIOR: Original values come back only when the request carries the same restore key header (X-FQ-PII-Restore-Key, configured by the operator in the MCP client connection, never a tool argument) that was present when the map was sealed, and at most maxRestores times per map; otherwise counts only. Holding the sealed map alone is not enough. Runs on this Fairquery-hosted Worker (Cloudflare), not on the caller's machine; inputs leave the client. This Worker's code is designed not to store inputs, results, or an Apify token. No further network call; the map is not forwarded. Milliseconds. Max 50 texts, 200,000 chars each, 500,000 total; map up to 10,000 entries.\nPARAMETERS: sealedMap: pass meta.sealed_map unchanged (preferred). placeholderMap: legacy clear-text map, honoured only when this deployment has no seal key (or the operator restore policy is \"open\"), and then marked verified false; if both are given, sealedMap is used alone and placeholderMap is ignored (never merged; PLAINTEXT_MAP_IGNORED note). Every key is replaced wherever it occurs exactly (longest first, one pass, so a restored value is never replaced again). fuzzyRestore (default true): a placeholder the LLM rewrote but whose random id is intact (\"EMAIL_k7q2m9xp4a\" without brackets, lower case, a space instead of _) is restored too and listed in fuzzy_restored. unknown_placeholders lists exact [TYPE_N] shapes the map does not contain; near_miss_placeholders lists mangled shapes (\"EMAIL_3\", \"[Email_4]\") that matched no key; both stay as they are. When restored is true the output contains the ORIGINAL sensitive values: show it to the user, do not send it back to the LLM. limit/offset page whole documents (default 10 per page).\nEXAMPLE: {\"texts\":[\"I will email [EMAIL_t7c3pz2wqa] today.\"],\"sealedMap\":\"fqs2.…\"} with the restore key header -> output_text \"I will email jane@acme.com today.\", replacements 1; without it -> restored false, sealed_replacements_withheld 1.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "extendTtlHours": {
                "description": "Optional integer 1-720. After an allowed restore, also return meta.sealed_map_extended: the same map (same id, restore count, bindings) re-sealed to expire this many hours from now. Refused (EXTEND_TTL_REFUSED note) when the restore gate refused.",
                "maximum": 720,
                "minimum": 1,
                "type": "integer"
              },
              "fuzzyRestore": {
                "default": true,
                "description": "Optional boolean, default true. Also restore rewritten placeholders whose random id is intact; false = exact keys only.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Optional page size: items to return, integer 1-50 (default 10). Example: 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Optional zero-based number of items to skip, integer 0-1000000 (default 0); pass nextOffset from the previous response, e.g. 100",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "placeholderMap": {
                "additionalProperties": {
                  "maxLength": 10000,
                  "type": "string"
                },
                "description": "Optional, legacy (this or sealedMap required). Object placeholder -> original value, as returned in meta.placeholder_map (deprecated) or placeholder_map by pii_guard_documents; keys 1-200 chars, values <= 10,000 chars, <= 10,000 entries. Example: {\"[EMAIL_1]\":\"jane@acme.com\"}",
                "propertyNames": {
