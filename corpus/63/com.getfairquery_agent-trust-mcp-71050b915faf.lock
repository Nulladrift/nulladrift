        {
          "name": "osv_get_vulnerability",
          "title": "Get vulnerability advisory details (free, OSV.dev)",
          "description": "WHAT: Fetch full OSV records (summary, details, aliases, severity vectors, affected ranges, fixed versions, references) for advisory IDs from api.osv.dev.\nWHEN: You have IDs (from osv_query_packages or a report) and need details or the fixed version.\nWHEN NOT: To find which vulns affect a package version (osv_query_packages) or a whole manifest (osv_audit_dependencies, paid).\nCOST: Free; no token. Advisory IDs leave the client, are received by this Worker, and are forwarded to api.osv.dev. Nothing is sent to Apify. This Worker's code is designed not to store inputs or results.\nRETURNS: Paged \"vulnerability\" rows with the raw OSV record fields, or \"error\" rows (VULN_NOT_FOUND | OSV_FETCH_FAILED, see PARAMETERS).\nBEHAVIOR: Runs on this Fairquery-hosted Worker (Cloudflare), not on the caller's machine; inputs leave the client. This Worker's code is designed not to store inputs, results, or an Apify token. One HTTPS call per ID to api.osv.dev, in parallel; typically <2 s, 20 s timeout each.\nPARAMETERS: ids: each ID is fetched separately and yields exactly one row in input order, so one bad ID never fails the others: an unknown ID returns a VULN_NOT_FOUND row (not retryable), a network/5xx problem an OSV_FETCH_FAILED row (retryable - retry just that ID). Prefer the ecosystem/GHSA IDs returned by osv_query_packages (vuln_ids); a CVE-... ID only resolves when OSV indexes that CVE as its own record, otherwise look up the GHSA alias. IDs are matched as given (no trimming of URLs or prefixes), and duplicates are fetched twice. limit/offset only page the returned rows; every call re-fetches all given IDs, so for a next page resend the same ids with offset = nextOffset.\nEXAMPLE: {\"ids\":[\"GHSA-35jh-r3h4-6jhm\"]} -> lodash command injection, fixed in 4.17.21.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ids": {
                "description": "Required. 1-25 OSV advisory IDs, 3-100 chars each, pattern ^[A-Za-z0-9][A-Za-z0-9._:-]{2,99}$ (letters, digits, . _ : -). Formats: GHSA-xxxx-xxxx-xxxx, PYSEC-YYYY-N, GO-YYYY-NNNN, RUSTSEC-YYYY-NNNN, CVE-YYYY-NNNNN. Example: [\"GHSA-35jh-r3h4-6jhm\",\"PYSEC-2021-9\",\"GO-2022-0969\"]",
                "items": {
                  "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{2,99}$",
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "default": 25,
                "description": "Optional page size: items to return, integer 1-25 (default 25). Example: 25",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Optional zero-based number of items to skip, integer 0-1000000 (default 0); pass nextOffset from the previous response, e.g. 100",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Number of items in this page",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "hasMore": {
                "description": "True if more items exist after this page",
                "type": "boolean"
              },
              "items": {
                "description": "Result rows for this page",
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "additionalProperties": {},
                "description": "Tool-specific context (summary counts, cost notes, ...)",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "nextOffset": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
