      "instructions": "Fairquery Agent Trust: PII/secret redaction, email checks, sanctions screening, OSV vulnerability lookups and MCP server pre-checks. Tools are grouped by prefix (pii_, email_, sanctions_, osv_, trust_, mcp_). Rule for every group: start with the free tool; call the paid tool only for what it adds. Paid tools run a Fairquery Apify Actor with YOUR APIFY_TOKEN and are billed to your Apify account; this Worker waits 20 s. Free tools run on this Fairquery-hosted Worker (Cloudflare), not on the caller's machine; inputs leave the client. This Worker's code is designed not to store inputs, results, or the token. osv_query_packages and osv_get_vulnerability forward package names, versions, or advisory IDs to api.osv.dev. PII (Fortress Shield, agent I/O PII protection): pii_scan_text (find) -> pii_redact_text (sanitize; placeholders carry random ids and the originals come back only as an encrypted meta.sealed_map string) -> LLM -> pii_restore_text with that sealedMap (put originals back for the user; originals come back only on requests carrying the operator restore key header set in the MCP client connection, otherwise counts only). Pass the previous sealed_map as priorSealedMap to keep the same placeholders across turns. The redaction tools protect what flows on to the LLM, logs and other tools; text the model already received stays in its context. Free tools already detect http(s) URLs in text you pass in. Paid pii_guard_documents is for NER names/addresses and for fetching PDFs or remote documents, not because URL detection requires it. pii_list_detectors (free) lists entity types and every paid price. Email: email_check_syntax (format, typo, disposable, role; never says \"valid\") -> paid email_validate_deliverability only when you need DNS/MX/SPF/DMARC. Sanctions: sanctions_list_sources (coverage, free) -> paid sanctions_screen_names for the actual screening. OSV: osv_query_packages (exact versions) -> osv_get_vulnerability (details by ID), both free -> paid osv_audit_dependencies only for whole manifests/lockfiles with severity and recommended versions. trust_screen_lead = email_validate_deliverability + sanctions_screen_names in one call with a merged pass/review/block decision per lead; use it only when a lead needs both checks. MCP: mcp_server_precheck scans tool names and descriptions you pass (tools or toolsListJson) for injection, hidden instructions and cross-server references. It does not start a package. path and packageName return PATH_NOT_ALLOWED (no disk). auditDependencies=true sends a package name found in toolsListJson (MCPB manifest or package.json) to registry.npmjs.org, and a pasted package.json to the paid OSV Actor; meta.shared_externally reports what was sent. Jobs (jobs_*): live openings from the public Greenhouse, Lever and Ashby APIs, plus Personio's documented XML feed, Pinpoint's documented postings.json, and a named Gem job board when you already know the account. Free tools: jobs_get_board, jobs_get_job, jobs_find_board, jobs_check_open, jobs_list_seed_boards, jobs_search_by_location. jobs_search_companies is offline here (COMING_SOON, runs and bills nothing). Paid indexed Jobs search is live: 8,800+ Greenhouse, Ashby and Lever boards in one call, radius and salary filters, fresh daily index, as the Apify Actor https://apify.com/fairquery/jobs-index-search or https://mcp.getfairquery.com/jobs-index/mcp (your own Apify token). SmartRecruiters, LinkedIn, Workday, Workable, Recruitee and Rippling are not supported and are never contacted. This is Fairquery's hosted remote MCP (stateless Streamable HTTP). Free tools need no account and no token. Paid tools run the same public Apify Actors as the npm MCPs and bill YOUR Apify account: send your token on the request as Authorization: Bearer <token> or X-Apify-Token: <token>. There is no server-side token. A missing token returns APIFY_TOKEN_MISSING. The Worker has no disk. mcp_server_precheck scans tools or toolsListJson you pass in; path and packageName return PATH_NOT_ALLOWED. Paid Actor calls wait 20 seconds. Longer runs stay on the local npm servers @fairquery/agent-trust-mcp and @fairquery/company-jobs-feed-mcp.",
      "tools": [
        {
          "name": "email_check_syntax",
          "title": "Check email syntax, typos, disposable & role (free)",
          "description": "WHAT: Offline email checks: RFC-style syntax + normalization, common domain typo \"did you mean\" (gmial.com -> gmail.com), disposable/temporary domain (bundled CC0 list, ~thousands of domains), role account (info@, sales@), free webmail provider.\nWHEN: Fast pre-filtering of signups or lead lists, before paying for email_validate_deliverability.\nWHEN NOT: Does NOT check DNS/MX, so it cannot tell whether the domain receives mail; use email_validate_deliverability (paid) for MX/SPF/DMARC.\nCOST: Free; no token.\nRETURNS: Paged \"email_check\" rows; verdict is invalid | risky | unknown, never valid (dns_checked is always false).\nBEHAVIOR: Runs on this Fairquery-hosted Worker (Cloudflare), not on the caller's machine; inputs leave the client. This Worker's code is designed not to store inputs, results, or an Apify token. No further network call (no DNS/SMTP); addresses are not forwarded. Synchronous and CPU-bound, no rate limits: 10,000 addresses (the per-call maximum) return in well under a second.\nPARAMETERS: emails: each element is parsed on its own (one address per element; a comma-separated list in one element is INVALID_SYNTAX, not split). Before checking, \"Name <addr>\" is reduced to addr, a leading \"mailto:\" is dropped, the domain is lowercased (local part keeps its case), a trailing dot is removed and IDN domains are converted to punycode; the normalized value is returned as email, the original as input. Duplicates are not merged: every element yields one row, in input order. Role detection ignores +tags (sales+eu@ counts as sales@) and disposable matching also covers subdomains of listed domains. limit/offset page those rows; meta.summary always counts verdicts over ALL rows, not just the current page.\nEXAMPLE: {\"emails\":[\"someone@gmial.com\"]} -> verdict \"risky\", reasons [\"POSSIBLE_TYPO\",\"DNS_NOT_CHECKED\"], did_you_mean \"someone@gmail.com\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "emails": {
                "description": "Required. 1-10000 strings, 1-320 chars each, one address per element; bare \"jane@acme.com\", \"Jane <jane@acme.com>\" and \"mailto:jane@acme.com\" forms accepted. Example: [\"jane@acme.com\",\"bob@gmial.com\"]",
                "items": {
                  "maxLength": 320,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10000,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "default": 100,
                "description": "Optional page size: items to return, integer 1-1000 (default 100). Example: 50",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Optional zero-based number of items to skip, integer 0-1000000 (default 0); pass nextOffset from the previous response, e.g. 100",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["emails"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Number of items in this page",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "hasMore": {
                "description": "True if more items exist after this page",
                "type": "boolean"
              },
              "items": {
                "description": "Result rows for this page",
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "additionalProperties": {},
                "description": "Tool-specific context (summary counts, cost notes, ...)",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "nextOffset": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Offset to pass for the next page, or null"
              },
              "offset": {
                "description": "Offset of the first item in this page",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "total": {
                "description": "Total items before paging",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["count", "hasMore", "items", "nextOffset", "offset", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check email syntax (free, on this Worker)"
          },
          "behavior": {
            "destructive": false,
