                "description": "Optional, \"any\" | \"user\", default \"any\". \"user\" = this restore is for the user only: originals come back only with the X-FQ-PII-User-Present header (MCP Apps / client UI), else USER_ONLY_RESTORE, counts only.",
                "enum": ["any", "user"],
                "type": "string"
              },
              "returnReceipt": {
                "default": false,
                "description": "Optional, default false. true adds meta.receipt, an fqrc2 Ed25519 JWS {map id, restores used, documents, replacements} with an HMAC commitment of these input texts (not an unsalted sha256), detector version, and exp. The restored text is not hashed, because it contains the original values. Default expiry is 30 days (receiptTtlDays). No values; verify with pii_verify_receipt.",
                "type": "boolean"
