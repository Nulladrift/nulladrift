        {
          "name": "sanctions_list_sources",
          "title": "List covered sanctions lists (free)",
          "description": "WHAT: Static list of the official sanctions lists sanctions_screen_names checks (id, name, authority, download URL), the score scale and the legal disclaimer.\nWHEN: To choose the lists parameter, cite sources in a report, or explain coverage before paying.\nWHEN NOT: To screen a name (sanctions_screen_names, paid). It does not download lists or report freshness.\nCOST: Free; no token.\nRETURNS: One static object, including the disclaimer to show with screening results.\nBEHAVIOR: Runs on this Fairquery-hosted Worker (Cloudflare), not on the caller's machine; inputs leave the client. This Worker's code is designed not to store inputs, results, or an Apify token. No further network call; static catalog compiled into this Worker, instant. No rate limits.\nPARAMETERS: None: call with an empty object {}; the result is static and cannot be filtered. Its output feeds sanctions_screen_names: each sources[].id (OFAC_SDN, OFAC_CONS, EU, UK, UN) is a valid value for its lists parameter, and score_scale explains how its minScore threshold is applied.\nEXAMPLE: {} -> {\"sources\":[{\"id\":\"OFAC_SDN\",\"authority\":\"US Treasury OFAC\",...},...]}",
