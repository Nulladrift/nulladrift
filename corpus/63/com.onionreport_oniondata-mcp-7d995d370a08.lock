      "serverInfo": {
        "name": "oniondata-mcp",
        "version": "2026.11.16"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "洋葱财报OnionData-MCP 服务，提供 A 股财报数据与指标查询。除发现类方法外，所有工具调用都需要 API Token（Authorization: Bearer oda_...）。所有已开通用户每自然月获赠 1000 积分；会员另按 30 天周期获得积分包（VIP 2000、SVIP 8000），最近到期优先扣减。1 积分的基准是 1 家公司 × 1 个指标 × 1 个报告期 × 1 个口径下的一个取值，按数据类型价值权重计量（权重可能调整，以实际扣减为准）；非空结果单次最低 10 积分；空结果不计，单次上限免费档 100、会员 200。搜索、报告期、指标字典、维度字典与额度自查不计积分；company_records 计积分。数据支持多口径：quarter_h 单季度环比、quarter_t 单季度同比、ttm 逐季度 TTM、year 年度、new 最新报告期；增幅列随口径裁剪（ttm/quarter_h 只有环比、new/year/quarter_t 只有同比）。company_records 统一入口：scode 传 1 个为单公司多期（periods 1–10），传 2–10 个为多公司单期横切（不支持 periods，可传 report_date）；多公司也不需要 VIP。每张报表最多 250 行（wide 每张 10 行），最多 4 张报表；超出返回 result_too_large，不截断。金额单位为元，具体见返回体 units/field_units。",
      "tools": [
        {
          "name": "company_records",
          "title": "财务取数（单公司多期 / 多公司单期）",
          "description": "读取 A 股上市公司财报明细（China A-share financial statements）：唯一取数入口，覆盖利润表 income、资产负债表 balance、现金流量表 cashflow、业绩预告 predict。五种口径——new 最新报告期（latest）、quarter_t 单季度同比（single-quarter YoY）、quarter_h 单季度环比（single-quarter QoQ）、ttm 逐季度滚动四季合计（trailing twelve months）、year 年度（annual）。scode 传 1 个 → 单公司多期（periods 1–10，默认 1）；传 2–10 个 → 多公司单期横切（省略 report_date 时取所选公司该口径的最近报告期）。多公司不支持 periods，periods 与 report_date 互斥（dimension_conflict）。repotype=basic/operation 可按指标配置把该报表细分为基础指标 / 运营指标，省略返回该报表全部指标。format=long 一行一指标；format=wide 一行一（公司, 报告期, 报表）的指标对象；业绩预告（predict）仅支持 format=long。结果上界按报表计：long 每张 250 行 / wide 每张 10 行，reponame 最多 4 张（逗号分隔）；超出返回 result_too_large，不截断。notice_date_to 按当前公告日过滤（重述会移动公告日），notice_date_from 做增量（含重述）。数值为原始值（元），增幅以百分点表示（12.3 即 12.3%）。单公司与多公司横切均不要求 VIP；按实际返回与数据价值权重计积分，空结果不计。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "default": "long",
                "description": "long 一行一指标；wide 一行一（公司, 报告期）",
                "enum": ["long", "wide"],
                "type": "string"
              },
              "notice_date_from": {
                "description": "公告日下界（含）YYYY-MM-DD；响应 meta.notice_date_max 可作下次水位线",
                "type": "string"
              },
              "notice_date_to": {
                "description": "公告日上界（含）YYYY-MM-DD，用于时点快照",
                "type": "string"
              },
              "periods": {
                "description": "报告期数 1–10，默认 1（最近一期），仅单公司可用（多公司传会报 dimension_conflict）",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "repoitem_key": {
                "description": "指标 key 列表；省略=该报表全部指标",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reponame": {
                "description": "报表名：income 利润表（income statement）/ balance 资产负债表（balance sheet）/ cashflow 现金流量表（cash flow statement）/ predict 业绩预告；多张报表用逗号分隔（最多 4 个），如 income,balance",
                "type": "string"
              },
              "report_date": {
                "description": "报告期 YYYY-MM-DD；与 periods 互斥，多公司不传则取最近报告期",
                "type": "string"
              },
              "repoterm": {
                "description": "单一口径：new 最新报告期 latest / quarter_t 单季度同比 YoY / quarter_h 单季度环比 QoQ / ttm 逐季度 TTM / year 年度 annual",
                "enum": ["new", "quarter_h", "quarter_t", "ttm", "year"],
                "type": "string"
              },
              "repotype": {
                "description": "指标类别：basic 基础指标 / operation 运营指标；省略=该报表全部指标",
                "enum": ["basic", "operation"],
                "type": "string"
              },
              "scode": {
                "description": "A 股 6 位代码列表（1–10 个）：1 个=单公司多期，多个=多公司单期横切；只需传一次数组",
                "items": {
                  "pattern": "^\\d{6}$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["reponame", "repoterm", "scode"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "dataset": {
                "type": "string"
              },
              "format": {
                "type": "string"
              },
              "meta": {
                "additionalProperties": true,
                "type": "object"
              },
              "object": {
                "type": "string"
              },
              "page": {
                "properties": {
                  "companies": {
                    "type": "integer"
                  },
                  "has_more": {
                    "type": "boolean"
                  },
                  "next_cursor": {
                    "type": ["string", "null"]
                  },
                  "periods": {
                    "type": "integer"
                  },
                  "returned": {
                    "type": "integer"
                  },
                  "truncated": {
                    "type": "boolean"
                  }
                },
                "required": ["companies", "has_more", "periods", "returned", "truncated"],
                "type": "object"
              },
              "quota": {
                "additionalProperties": true,
                "type": "object"
              }
            },
            "required": ["data", "format", "meta", "object", "page", "quota"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9332bdb92a17ce7f22451d10535de1cf953380b0264c2a14b5db2fccc05553b3"
        },
        {
          "name": "get_dimensions",
          "title": "查询维度与指标字典",
          "description": "获取报表与指标目录（financial statement catalog）：可用报表 income 利润表、balance 资产负债表、cashflow 现金流量表、predict 业绩预告，以及各指标中文名、单位、是否比率与 repotype（basic 基础指标 / operation 运营指标）。是调用 company_records 前的机器可读字典。本工具不计积分。需要 API Token。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "reponame": {
                "description": "只返回指定报表下的指标",
                "enum": ["income", "balance", "cashflow", "predict"],
                "type": "string"
              },
              "repotype": {
                "description": "basic / operation",
                "enum": ["basic", "operation"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "metrics": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "reports": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "repoterms": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["metrics", "reports", "repoterms"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e45e0e6c619adbc14e311ca74a27f291093dcdcf1799291eedd4531eaf77a144"
        },
        {
          "name": "get_usage",
          "title": "查询额度",
          "description": "查询本账号额度（quota / usage）：当前档位 free / VIP / SVIP、日调用护栏与积分余额的上限、已用、剩余与重置时间，以及最近到期的积分包。本工具不计积分，积分耗尽后仍可用。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credit_packs": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "credits_free": {
                "type": "integer"
              },
              "credits_nearest_expiry_at": {
                "type": ["string", "null"]
              },
              "credits_paid": {
                "type": "integer"
              },
              "credits_total": {
                "type": "integer"
              },
              "daily_call_limit": {
                "type": "integer"
              },
              "daily_call_remaining": {
                "type": "integer"
              },
              "daily_call_reset_at": {
                "type": "integer"
              },
              "daily_call_used": {
                "type": "integer"
              },
              "date": {
                "type": "string"
              },
              "max_credits_per_call": {
                "type": "integer"
              },
              "subscribe_hint": {
                "type": "string"
              },
              "tier": {
                "type": "string"
              },
              "token_prefix": {
                "type": ["string", "null"]
              }
            },
            "required": ["credits_free", "credits_paid", "credits_total", "daily_call_limit", "daily_call_remaining", "daily_call_used", "date", "tier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:60bd03c853e0d52968bed912bfe8765dc58dbfd0a33f069054520f15294a591c"
        },
        {
          "name": "list_indicators",
          "title": "查询指标字典",
          "description": "获取财务指标字典（China A-share financial indicators dictionary）：指标 key 到中文名与单位的映射，全市场统一口径，与公司无关。取数前用它确认 repoitem_key 与金额单位（元）。本工具不计积分。需要 API Token。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "indicators": {
                "additionalProperties": {
                  "type": "string"
                },
                "type": "object"
              },
              "note": {
                "type": "string"
              },
              "units": {
                "additionalProperties": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["indicators", "units"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:874c19f87a6eb8e4572ef134715b0ee4614b9e289eeae57f42d14de55214137a"
        },
        {
          "name": "list_report_periods",
          "title": "查询报告期",
          "description": "查询 A 股股票可用报告期（A-share report periods）：先确认时间范围再取数。repoterm 决定口径——new 最新报告期（latest，默认）、quarter_t 单季度同比（single-quarter YoY）、quarter_h 单季度环比（single-quarter QoQ）、ttm 逐季度滚动四季合计（TTM）、year 年度（annual）。本工具不计积分。需要 API Token。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "repoterm": {
                "default": "new",
                "description": "报告期口径：new 最新报告期（latest，默认）、quarter_t 单季度同比（YoY）、quarter_h 单季度环比（QoQ）、ttm 逐季度 TTM、year 年度（annual）",
                "enum": ["new", "quarter_h", "quarter_t", "ttm", "year"],
                "type": "string"
              },
              "scode": {
                "description": "A 股 6 位证券代码",
                "pattern": "^\\d{6}$",
                "type": "string"
              }
            },
            "required": ["scode"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "periods": {
                "items": {
                  "properties": {
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["value"],
                  "type": "object"
                },
                "type": "array"
              },
              "repoterm": {
                "type": "string"
              },
              "scode": {
                "type": "string"
              }
            },
            "required": ["periods", "repoterm", "scode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f05492fb4f35c13428b5be5a448d84262787af18d78e6297ac00aeb2da6b6e8"
        },
        {
          "name": "search_companies",
          "title": "搜索公司",
          "description": "搜索 A 股上市公司（China A-share company search）：按 6 位证券代码（ticker）、公司简称或拼音首字母匹配，返回最多 10 条 {scode, sname}，供后续取数确定证券代码。truncated=true 表示结果已截断，请细化关键词。本工具不计积分。需要 API Token。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "证券代码、简称或拼音首字母",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "scode": {
                      "type": "string"
                    },
                    "sname": {
                      "type": "string"
                    }
                  },
                  "required": ["scode", "sname"],
                  "type": "object"
                },
                "type": "array"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["query", "results", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8605a06f6cdca74a3f73522948451b43c821490ee7e28b78eafb0a0ef70cd2fd"
        }
      ],
