      "instructions": "Access to Jan Linketscher's personal site (https://janlinketscher.com): profile, the essays and full-text search. You can also book a call with him: list_meeting_types, get_availability, then book_meeting. Clients with elicitation get a confirmation form for the user; others must get the user's explicit approval first and pass confirmed: true. Content is German. Cite with name and URL. Docs: https://janlinketscher.com/agent",
      "tools": [
        {
          "name": "book_meeting",
          "title": "Book a call",
          "description": "Book a call with Jan Linketscher on behalf of your user. The start must be a slot returned by get_availability. If your client supports elicitation (form mode, MCP 2026-07-28), the server itself asks the user to confirm time, name and email – name and email are then prefilled from your arguments and can be corrected by the user. Otherwise: show the user meeting type, date and time (with time zone), name and email, get their explicit approval, then pass name, email and confirmed: true. Use the user's real name and email; never invent them. Cal.com sends the confirmation with a calendar invite and links to reschedule or cancel to that email address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmed": {
                "description": "Only for clients without elicitation: true = the user has explicitly approved this booking.",
                "type": "boolean"
              },
              "email": {
                "description": "Email of the person attending; the confirmation goes there.",
                "format": "email",
                "type": "string"
              },
              "meeting_type": {
                "enum": ["kennenlernen", "sparring"],
                "type": "string"
              },
              "name": {
                "description": "Full name of the person attending.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "notes": {
                "description": "Optional: what the call is about, in one or two sentences.",
                "maxLength": 1000,
                "type": "string"
              },
              "start": {
                "description": "Slot start from get_availability (ISO 8601).",
                "format": "date-time",
                "type": "string"
              },
              "time_zone": {
                "description": "IANA time zone of the attendee, e.g. \"Europe/Berlin\" (default Europe/Berlin).",
                "type": "string"
              }
            },
            "required": ["meeting_type", "start"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attendee": {
                "properties": {
                  "email": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "end": {
                "format": "date-time",
                "type": "string"
              },
              "meetingType": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "start": {
                "format": "date-time",
                "type": "string"
              },
              "status": {
                "description": "pending: Jan confirms the request by email. not_booked: the user declined.",
                "enum": ["accepted", "pending", "not_booked"],
                "type": "string"
              }
            },
            "required": ["attendee", "end", "meetingType", "message", "start", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a call"
