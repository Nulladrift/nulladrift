        {
          "name": "get_availability",
          "title": "Availability",
          "description": "Free time slots for a call with Jan Linketscher. meeting_type: \"kennenlernen\" (Kennenlernen, 30 min), \"sparring\" (Sparring, 60 min). Optional date range (YYYY-MM-DD, default: the next 14 days, at most 90 days ahead). Times are ISO 8601 with offset; the text answer lists them in Europe/Berlin.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "First day (YYYY-MM-DD). Default: today.",
                "format": "date",
                "type": "string"
              },
              "meeting_type": {
                "description": "Kind of call.",
                "enum": ["kennenlernen", "sparring"],
                "type": "string"
              },
              "to": {
                "description": "Last day (YYYY-MM-DD), inclusive. Default: from + 13 days.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["meeting_type"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bookingUrl": {
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "meetingType": {
                "type": "string"
              },
              "minutes": {
                "type": "integer"
              },
              "slots": {
                "items": {
                  "properties": {
                    "end": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "start": {
                      "format": "date-time",
                      "type": "string"
                    }
                  },
                  "required": ["end", "start"],
                  "type": "object"
                },
                "type": "array"
              },
              "timeZone": {
                "type": "string"
              },
              "to": {
                "type": "string"
              }
            },
            "required": ["bookingUrl", "from", "meetingType", "minutes", "slots", "timeZone", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
