        {
          "name": "get_availability",
          "title": "Availability",
          "description": "Free time slots for a call with Jan Linketscher. meeting_type: \"kennenlernen\" (Kennenlernen, 30 min, free). Optional date range (YYYY-MM-DD, default: the next 14 days, at most 90 days ahead). Times are ISO 8601 with offset; the text answer lists them in Europe/Berlin.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "First day (YYYY-MM-DD). Default: today.",
                "format": "date",
                "type": "string"
              },
              "meeting_type": {
                "description": "Kind of call.",
                "enum": ["kennenlernen"],
                "type": "string"
              },
              "to": {
                "description": "Last day (YYYY-MM-DD), inclusive. Default: from + 13 days.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["meeting_type"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bookingUrl": {
                "type": "string"
              },
