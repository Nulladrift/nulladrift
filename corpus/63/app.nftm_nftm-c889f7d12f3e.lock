{
  "lockfileVersion": 2,
  "subjects": {
    "app.nftm/nftm": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.nftm.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "NFTm",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "NFTm quotes a collection launch, then returns a page the creator signs in Phantom. This server does not accept a private key. nftm_quote_launch does not upload. nftm_launch_collection requires confirm: true and returns a sign page. It does not sign and it does not create the store.",
      "tools": [
        {
          "name": "nftm_launch_collection",
          "title": "Launch an NFTm collection",
          "description": "Saves a one-time NFTm page where the creator approves two transactions in Phantom: the collection, then the mint setup. Requires confirm: true. A quote over 10 SOL also requires confirmHighValue: true. This tool does not upload, sign, or create a store, and it does not accept a private key or an art folder id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "collectionName": {
                "type": "string"
              },
              "confirm": {
                "type": "boolean"
              },
              "confirmHighValue": {
                "type": "boolean"
              },
              "images": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bytesBase64": {
                      "description": "Raw image bytes as base64. Optional when sizeBytes alone is enough for a quote.",
                      "type": "string"
                    },
                    "filename": {
                      "description": "Image filename ending in .png, .jpg, .jpeg, .gif, or .webp",
                      "type": "string"
                    },
                    "sizeBytes": {
                      "description": "Size in bytes. Required when bytesBase64 is omitted.",
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    },
                    "url": {
                      "description": "https URL of the image. Optional.",
                      "type": "string"
                    }
                  },
                  "required": ["filename"],
                  "type": "object"
                },
                "type": "array"
              },
              "mintPriceSol": {
                "type": "number"
              },
              "royaltyPercent": {
                "type": "number"
              },
              "supply": {
                "type": "number"
              },
              "traitsCsv": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Launch an NFTm collection"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:85c94a4023ff46be9b66f4dc9f2282dd9bdb99e1e3f12be7c7faaeb60c0891d3"
        },
        {
          "name": "nftm_quote_launch",
          "title": "Quote an NFTm launch",
          "description": "Quotes the SOL cost of an NFTm launch from pictures and an optional traits spreadsheet. Uses the same published figures as the NFTm launch cost calculator. This tool does not upload files and does not need a wallet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "collectionName": {
                "type": "string"
              },
              "images": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bytesBase64": {
                      "description": "Raw image bytes as base64. Optional when sizeBytes alone is enough for a quote.",
                      "type": "string"
                    },
                    "filename": {
                      "description": "Image filename ending in .png, .jpg, .jpeg, .gif, or .webp",
                      "type": "string"
                    },
                    "sizeBytes": {
                      "description": "Size in bytes. Required when bytesBase64 is omitted.",
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    },
                    "url": {
                      "description": "https URL of the image. Optional.",
                      "type": "string"
                    }
                  },
                  "required": ["filename"],
                  "type": "object"
                },
                "type": "array"
              },
              "mintPriceSol": {
                "type": "number"
              },
              "supply": {
                "type": "number"
              },
              "traitsCsv": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote an NFTm launch"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c89dbf03cc5b45004f156dee447fb78992c5c06f3ff7fb0d5101c0a57ae49ef8"
        }
      ],
      "digest": "sha256:4306bb31e4d5e68646b936788c29b43f1183393e73d3df0672aadaac4ee031dd"
    }
  }
}
