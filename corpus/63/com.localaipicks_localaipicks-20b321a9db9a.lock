{
  "lockfileVersion": 2,
  "subjects": {
    "com.localaipicks/localaipicks": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://localaipicks.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "localaipicks",
        "title": "Local AI Picks",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Local AI Picks lists current open-weight AI models by task with their weight files and memory needs. Start with list_tasks or find_models (pass memory_gb to filter by what fits), then get_model for details. If a model does not fit the user’s device, find_gpu_rentals gives the cheapest GPU that fits on each rental platform (affiliate/referral links; disclose that when sharing). Results include page links; cite them. Data is a dated snapshot (as_of).",
      "tools": [
        {
          "name": "compare_models",
          "title": "Compare models",
          "description": "The same facts as get_model for 2 to 4 models side by side.",
          "inputSchema": {
            "properties": {
              "slugs": {
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:009113922a4f72e38e77198c33a97cf5cd6203170a2555d85cc33f88b2608ac1"
        },
        {
          "name": "find_gpu_rentals",
          "title": "Find a GPU to rent",
          "description": "Hourly GPU rental for a model that does not fit on the user’s own device. Give slug (from find_models) or memory_gb (the memory the model needs) to get the cheapest single GPU on each platform with room for it, sorted by price; give neither to list all platforms with every GPU, VRAM and on-demand price. Links are affiliate or referral links (Local AI Picks earns a commission or platform credit); disclose that when you share one. Prices are dated; no speed estimates.",
          "inputSchema": {
            "properties": {
              "memory_gb": {
                "exclusiveMinimum": 0,
                "maximum": 4096,
                "type": "number"
              },
              "slug": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:46ab7a49ce706ccfcedc10bd4e0797461c12c1956468915446b891baa7c68212"
        },
        {
          "name": "find_models",
          "title": "Find local models for a task",
          "description": "Current open-weight models for one task, latest version of each family, in the same order as the site. Give memory_gb (and device) to keep only models whose smallest listed weight option fits; memory is estimated only for text LLMs and taken from vendor sources otherwise, and is \"unknown\" when neither exists. No ratings and no speed estimates.",
          "inputSchema": {
            "properties": {
              "device": {
                "description": "apple counts MLX weights; gpu and cpu do not.",
                "enum": ["apple", "gpu", "cpu"],
                "type": "string"
              },
              "limit": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "memory_gb": {
                "description": "GPU VRAM or unified memory in GB.",
                "exclusiveMinimum": 0,
                "maximum": 2048,
                "type": "number"
              },
              "task": {
                "description": "Task id from list_tasks, e.g. \"llm\", \"coding\", \"image\".",
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64e27e03e0c9cf9cc128993a604437404e50a270456fd52c28d10def75fa0f06"
        },
        {
          "name": "get_model",
          "title": "Get a model",
          "description": "One model: parameters, license, context length, every listed weight option with file size and memory need, third-party scores with their source and date, whether this site tested it, and links.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Model slug from find_models.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:819f94ecdb1a2502a256b782e7e1e99403d200387a04e7c5b772ffb24d8ed5c2"
        },
        {
          "name": "list_tasks",
          "title": "List model tasks",
          "description": "The tasks Local AI Picks lists open-weight models for (text LLM, coding, speech to text, text to speech, image, video, music, translation, OCR), with the number of current models and the page for each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c480c5afd12f32105a598a1779d14d25bfec2440fbd10f6baf09da3b8adb26ed"
        }
      ],
      "digest": "sha256:e9ec5e1a798f049161aca6975ef415910a78258694d29ccd906de3133b4578c1"
    }
  }
}
