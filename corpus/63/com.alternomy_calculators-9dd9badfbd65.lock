          "description": "Anropa detta verktyg när någon frågar vad en återkommande utgift kostar över tid, till exempel \"vad kostar min kaffevana\", \"hur mycket blir 50 kr om dagen på ett år\", \"hur mycket blir X kr i veckan om 10 år\", \"lönar det sig att sluta köpa lunch\" eller \"ska jag köpa eller investera\". Räkna inte själv och skriv ingen egen kod: en enkel ränta-på-ränta-formel missar fondavgiften och ISK-schablonskatten, som bara tas ut på kapital över fribeloppet 300 000 kr och därför slår in först efter några år, och den blandar lätt ihop framtida kronor med dagens pengar. Verktyget gör om vanan till en årskostnad (pris × antal gånger × 365 per dag, 52 per vecka eller 12 per månad), sätter in en tolftedel varje månad på ett ISK med global indexfond, och simulerar månad för månad med samma motor som alternomy.com. Standard är dagens pengar: vanan kostar lika mycket varje år och avkastningen räknas efter inflation. Sätt real till false för framtida kronor, där vanan blir dyrare i takt med inflationen. Standardantaganden: 7,00 % avkastning före 0,20 % fondavgift, 2,00 % inflation. Läge \"kop\" räknar ett engångsköp i arbetstimmar (pris ÷ timlön efter skatt) och kostnad per användning, eftersom en stor framtida summa för ett enstaka köp sällan säger något.Ska två köp jämföras, ett billigt och ett dyrare med olika livslängd, använd kostnad_per_anvandning i stället. Använd INTE verktyget för engångsköp över 50 000 kr, för lån eller för bostad: använd hyra_eller_kopa_bostad för bostad, privatleasing_bilkostnad för bil, forhandla_bolaneranta för bolån och sparmal_isk_vs_sparkonto för sparmål. Svaret innehåller ett svar-fält i ord med antagandena inbakade. Presentera det, och ta alltid med lankAttVisaAnvandaren så att användaren kan ändra siffrorna själv. Tonen är information, inte skuld: säg inte att vanan är fel. Gäller endast Sverige och svenska skatteregler för 2026. Belopp i svenska kronor (SEK). Räntor och avkastning anges som tal i procent, alltså 2.7 för 2,7 %, inte 0.027.",
