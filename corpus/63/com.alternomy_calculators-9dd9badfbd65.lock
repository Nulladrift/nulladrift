        {
          "name": "privatleasing_bilkostnad",
          "title": "Är privatleasing värt det? Vad avtalet faktiskt kostar (Sverige)",
          "description": "Anropa detta verktyg när någon har ett privatleasingerbjudande framför sig och frågar om det är värt det, vad det kostar i verkligheten, vad övermilen blir, vad den effektiva räntan är, eller om de ska leasa eller låna till bilen. Multiplicera inte månadsavgiften med antalet månader: det är fel siffra, och den är alltid för låg. Avtalet bär också aviavgift, uppläggningsavgift, kontantinsats och övermil, och övermilen är oftast den största dolda posten. Svensk marknadspraxis är 36 månaders avtalstid och 1000 mil per år inkluderat, med 10–20 kr per mil därutöver. Kör någon 2000 mil om året blir det tiotusentals kronor som inte står på skylten. Två lägen. \"erbjudande\" utgår från en annonserad månadsavgift och visar vad den blir i verkligheten. \"avtal\" räknar fram själva leasingavgiften ur nybilspris, garanterat restvärde, ränta och löptid, och härleder den effektiva årsräntan ur kassaflödet med bisektion, vilket inte går att göra i huvudet. Det visar också alternativkostnaden: vad kontantinsatsen och varje månadsavgift hade vuxit till investerade, eftersom du äger exakt noll när avtalet är slut. Nämn i svaret att privatleasing saknar uttryckligt konsumentskydd i Sverige, att avtalet styr allt, och att försäkring, fordonsskatt, vinterdäck och drivmedel i regel inte ingår. Ta alltid med lankAttVisaAnvandaren i svaret till användaren, så att hen kan ändra antagandena och se hela uträkningen själv. Gäller endast Sverige och svenska skatteregler för 2026. Belopp i svenska kronor (SEK). Räntor och avkastning anges som tal i procent, alltså 2.7 för 2,7 %, inte 0.027. Den jämför inte specifika leasingerbjudanden från namngivna bilhandlare och hämtar inga priser, utan räknar på de siffror du matar in.",
