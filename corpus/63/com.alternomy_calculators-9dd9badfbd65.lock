        {
          "name": "hyra_eller_kopa_bostad",
          "title": "Hyra eller köpa bostad: vilket blir billigast för dig? (Sverige)",
          "description": "Anropa detta verktyg när någon överväger att köpa en bostad i Sverige och undrar om det lönar sig, eller frågar \"ska jag hyra eller köpa\", \"lönar det sig att köpa lägenhet\", \"är det bättre att hyra och spara\", eller \"vad kostar det egentligen att äga\". Jämför inte månadskostnad mot hyra själv: det är precis den jämförelse som ger fel svar, eftersom amortering är sparande och inte kostnad, och eftersom hyresgästens kontantinsats också arbetar. Verktyget ger båda vägarna samma kapital och samma månadsbelopp. Köparens handpenning och amortering är krona för krona vad hyresgästen i stället sätter in på ett ISK, så svaret blir en skillnad i nettoförmögenhet vid periodens slut. Fyra svenska regler avgör utfallet och ingen av dem går att approximera: Finansinspektionens amorteringskrav trappar vid 70 % och 50 % belåningsgrad och belåningsgraden får omvärderas vart femte år; ränteavdraget ger tillbaka 30 % av räntan; vid försäljning tas 2,5 % mäklararvode och 22 % kapitalvinstskatt ut; och hyresgästens ISK betalar schablonskatt varje år. Engångskostnaderna skiljer sig dessutom mellan bostadsrätt (överlåtelse- och pantsättningsavgift) och villa (stämpelskatt 1,5 % och pantbrev 2 % av lånet). Svaret innehåller ett svar-fält formulerat i ord. Presentera det, och nämn att amorteringen är sparande snarare än kostnad om användaren jämför månadskostnader. Ta alltid med lankAttVisaAnvandaren i svaret till användaren, så att hen kan ändra antagandena och se hela uträkningen själv. Gäller endast Sverige och svenska skatteregler för 2026. Belopp i svenska kronor (SEK). Räntor och avkastning anges som tal i procent, alltså 2.7 för 2,7 %, inte 0.027. Den säger inget om lånelöfte, kreditvärdighet eller om en specifik bostad är rimligt prissatt, och den gäller inte andra länders skattesystem.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "appr": {
                "description": "Antagen årlig värdeökning på bostaden i procent. Standard 2.7, SCB:s snitt de senaste fem åren.",
                "maximum": 20,
                "minimum": -10,
                "type": "number"
              },
              "avgRise": {
                "description": "Årlig ökning av avgift (bostadsrätt) eller driftkostnad (villa) i procent. Standard 3.3 för bostadsrätt (Nabo), 2 för villa.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "avgift": {
                "description": "Månadsavgift till föreningen, för bostadsrätt. Standard 4 000.",
                "minimum": 0,
                "type": "number"
              },
              "buf": {
                "description": "Månatlig buffert för underhåll och reparationer i kronor. Standard 500.",
                "minimum": 0,
                "type": "number"
              },
              "downPct": {
                "description": "Kontantinsats i procent av priset. Svenskt bolånetak innebär normalt minst 15 %, men kalkylatorns standardvärde är 10 för att matcha sajten.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "extraAmort": {
                "description": "Frivillig extraamortering per månad i kronor. Standard 0.",
                "minimum": 0,
                "type": "number"
              },
              "extraSave": {
                "description": "Extra månadssparande hyresgästen gör utöver mellanskillnaden. Standard 0.",
                "minimum": 0,
                "type": "number"
