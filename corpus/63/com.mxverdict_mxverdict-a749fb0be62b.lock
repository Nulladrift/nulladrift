{
  "lockfileVersion": 2,
  "subjects": {
    "com.mxverdict/mxverdict": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mxverdict.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mxverdict",
        "title": "MX Verdict",
        "version": "1.0.0",
        "websiteUrl": "https://mxverdict.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MX Verdict (mxverdict.com) runs free, read-only email and DNS checks: SPF, DKIM, DMARC, MX, DNS records, blocklists, and a whole-domain email health check. The tools only read public DNS and public blocklists; they never send email. Every result ends with a link to the full report on mxverdict.com; give it to the user. Identical checks within 60 seconds return the same result. Checks are rate limited per client IP address, the same limits as the website; a rate-limited tool result says how long to wait.",
      "tools": [
        {
          "name": "check_blacklist",
          "title": "Blacklist check",
          "description": "Check whether an IP address or a domain is listed on public DNS blocklists (DNSBLs). A domain is checked on domain blocklists only; to check a mail server, give its IP address.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "target": {
                "description": "One IPv4 or IPv6 address, or one domain name.",
                "maxLength": 512,
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Blacklist check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:484b7a6b293c6f64a38949bd4a72547f2ec2eedc41fc2538247f8201e05f40df"
        },
        {
          "name": "check_dkim",
          "title": "DKIM check",
          "description": "Check a domain's DKIM public keys in DNS. With a selector (the s= tag of a DKIM-Signature header), checks that selector's key; without one, probes common selector names. Finding no key on common names does not prove DKIM is missing: selectors cannot be listed from DNS.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Domain name, for example example.com.",
                "maxLength": 512,
                "type": "string"
              },
              "selector": {
                "description": "DKIM selector, for example google or selector1. Leave out to probe common selectors.",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "DKIM check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9f373ee0b801162e2046b7f7836a4ac366920f98e31fa41715ef9af492d10ee2"
        },
        {
          "name": "check_dmarc",
          "title": "DMARC check",
          "description": "Check a domain's DMARC record: whether it exists and is valid, its policy (none, quarantine or reject), alignment, and where reports are sent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Domain name, for example example.com.",
                "maxLength": 512,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "DMARC check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a8a2b7e4fdd5a3a6b9c3ea9ecd01410bf6b601ddda54234df3aae96c5d8a47ec"
        },
        {
          "name": "check_email_domain",
          "title": "Email domain health check",
          "description": "Check everything about a domain's email setup in one call: SPF, DMARC, MX, DKIM on common selectors, domain blocklists, MTA-STS, TLS-RPT and BIMI. Use it for a general question such as \"is email set up correctly for example.com\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Domain name, for example example.com.",
                "maxLength": 512,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Email domain health check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:da9f6249006a725b9ae5a9b5e254ed46206e394033092a477150019f11009ac1"
        },
        {
          "name": "check_spf",
          "title": "SPF check",
          "description": "Check a domain's SPF record: whether it exists and is valid, how many of the 10 allowed DNS lookups it uses, and how its all mechanism treats mail from servers that are not listed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Domain name, for example example.com.",
                "maxLength": 512,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "SPF check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:eaf37142d502de90d8be3b3f84f704816b27bb2ad535bbeaae10d4c2f3fade26"
        },
        {
          "name": "dns_lookup",
          "title": "DNS lookup",
          "description": "Look up DNS records of a name. Type ALL (the default) queries A, AAAA, CNAME, MX, NS, TXT, SOA and CAA; any single type can be asked for. An IP address gives its reverse DNS (PTR) lookup.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "Domain name or IP address, for example example.com or _dmarc.example.com.",
                "maxLength": 512,
                "type": "string"
              },
              "type": {
                "description": "Record type; ALL when left out.",
                "enum": ["ALL", "A", "AAAA", "CNAME", "MX", "NS", "PTR", "SOA", "TXT", "CAA", "SRV", "DS", "DNSKEY", "TLSA", "HTTPS", "SVCB"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "DNS lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4ae4c4b13f8793d882ed194112ecebd5f57f79e58cb36ac0927ea093a22f127a"
        },
        {
          "name": "lookup_mx",
          "title": "MX lookup",
          "description": "Look up a domain's MX records (its incoming mail servers), their IP addresses and reverse DNS. DNS only: it does not connect to the mail servers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Domain name, for example example.com.",
                "maxLength": 512,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "MX lookup"
          },
          "behavior": {
