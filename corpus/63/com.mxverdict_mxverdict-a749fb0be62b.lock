          },
          "digest": "sha256:71f161a57e79481bb55551cfec72681cd5ff19929d916e1d94fe2748328f9f1c"
        }
      ],
      "digest": "sha256:51442aa79b360616ad3a3ff79c50e3d0d4cc6dffe62ec891ec37d269ce07a225"
    }
