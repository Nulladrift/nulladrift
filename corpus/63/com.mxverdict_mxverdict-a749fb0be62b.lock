{
  "lockfileVersion": 2,
  "subjects": {
    "com.mxverdict/mxverdict": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mxverdict.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mxverdict",
        "title": "MX Verdict",
        "version": "1.0.0",
        "websiteUrl": "https://mxverdict.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MX Verdict (mxverdict.com) runs free, read-only email and DNS checks: SPF, DKIM, DMARC, MX, DNS records, blocklists, and a whole-domain email health check. The tools only read public DNS and public blocklists; they never send email. Every result ends with a link to the full report on mxverdict.com; give it to the user. Identical checks within 60 seconds return the same result. Checks are rate limited per client IP address, the same limits as the website; a rate-limited tool result says how long to wait.",
      "tools": [
        {
          "name": "check_blacklist",
          "title": "Blacklist check",
          "description": "Check whether an IP address or a domain is listed on public DNS blocklists (DNSBLs). A domain is checked on domain blocklists only; to check a mail server, give its IP address.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "target": {
                "description": "One IPv4 or IPv6 address, or one domain name.",
                "maxLength": 512,
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Blacklist check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bb180d78fdad6c2e325e1576e626387d6f7b387fc0257a3fa3502947062d23bd"
        },
        {
          "name": "check_dkim",
          "title": "DKIM check",
          "description": "Check a domain's DKIM public keys in DNS. With a selector (the s= tag of a DKIM-Signature header), checks that selector's key; without one, probes common selector names. Finding no key on common names does not prove DKIM is missing: selectors cannot be listed from DNS.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Domain name, for example example.com.",
                "maxLength": 512,
                "type": "string"
              },
              "selector": {
                "description": "DKIM selector, for example google or selector1. Leave out to probe common selectors.",
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "DKIM check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:62fe46939ef34b8abf8d1e9ab6cb43f63d4fa2a9b98c25b00775eceb2a8d2e4a"
        },
        {
          "name": "check_dmarc",
          "title": "DMARC check",
          "description": "Check a domain's DMARC record: whether it exists and is valid, its policy (none, quarantine or reject), alignment, and where reports are sent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Domain name, for example example.com.",
                "maxLength": 512,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "DMARC check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:af2cee4d276711b1abe06d83feb1faad5f7866d1b60ee9e8ab04b239de426192"
        },
        {
          "name": "check_email_domain",
          "title": "Email domain health check",
          "description": "Check everything about a domain's email setup in one call: SPF, DMARC, MX, DKIM on common selectors, domain blocklists, MTA-STS, TLS-RPT and BIMI. Use it for a general question such as \"is email set up correctly for example.com\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Domain name, for example example.com.",
                "maxLength": 512,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Email domain health check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ced628f237974501c0cf58e25072f8e1353e351050a35b2884c29bc5dab8182a"
        },
        {
          "name": "check_spf",
          "title": "SPF check",
          "description": "Check a domain's SPF record: whether it exists and is valid, how many of the 10 allowed DNS lookups it uses, and how its all mechanism treats mail from servers that are not listed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Domain name, for example example.com.",
                "maxLength": 512,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "SPF check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8c87e08af9fad200686a96923565acbbd9aa805e0f699ffe2d48a111ba88bc50"
        },
        {
          "name": "dns_lookup",
          "title": "DNS lookup",
          "description": "Look up DNS records of a name. Type ALL (the default) queries A, AAAA, CNAME, MX, NS, TXT, SOA and CAA; any single type can be asked for. An IP address gives its reverse DNS (PTR) lookup.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "Domain name or IP address, for example example.com or _dmarc.example.com.",
                "maxLength": 512,
                "type": "string"
              },
              "type": {
                "description": "Record type; ALL when left out.",
                "enum": ["ALL", "A", "AAAA", "CNAME", "MX", "NS", "PTR", "SOA", "TXT", "CAA", "SRV", "DS", "DNSKEY", "TLSA", "HTTPS", "SVCB"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "DNS lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7ce35ad6d9cc4482d47c153d84e4c23fa778dae0231f2d103560445c81e8fad6"
        },
        {
          "name": "lookup_mx",
          "title": "MX lookup",
          "description": "Look up a domain's MX records (its incoming mail servers), their IP addresses and reverse DNS. DNS only: it does not connect to the mail servers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Domain name, for example example.com.",
                "maxLength": 512,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "MX lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:79f06822b8d7f8ba90d78ed5002c17b495f871871b61c80e7eb62517d7f6a4c8"
        }
      ],
      "digest": "sha256:f12b1f030d9b77d22af1215371e4c15736c76de08bd8f48d238f3fdcda32175c"
    }
  }
