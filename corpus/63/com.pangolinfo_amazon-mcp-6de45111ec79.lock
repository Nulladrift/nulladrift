        {
          "name": "get_amazon_alexa_questions",
          "description": "Alexa Listing API: extract both Alexa/Rufus preset-question regions from a logged-in Amazon PDP; if neither has questions, use the product panel's initial suggestions (regions.panel). Optionally answer in that ASIN context. Questions cost 5 points and each answered region adds 20 (0/5/25/45 total); panel answers count as one region. No-question and service failures cost 0; explicitly invalid ASINs cost 5.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asin": {
                "description": "10-character Amazon ASIN. Provide asin or url; if both are provided they must identify the same product.",
                "pattern": "^[A-Za-z0-9]{10}$",
                "type": "string"
              },
              "concurrency": {
                "default": 5,
