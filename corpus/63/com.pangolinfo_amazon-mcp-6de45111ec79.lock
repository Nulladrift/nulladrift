                "enum": ["region1", "region2", "all"],
                "type": "string"
              },
              "url": {
                "description": "Amazon.com product-detail URL. Provide either asin or url.",
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1d9f941e63f332a2de19764f8e9109d6ed9fda9dcd7586a6013b41b53ff4e690"
