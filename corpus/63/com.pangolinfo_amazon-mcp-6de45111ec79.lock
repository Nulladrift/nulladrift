        {
          "name": "ai_search",
          "description": "[AI Search via Google SERP] Scrape publicly-available Google search results (data source: Google; use must comply with Google Terms of Service) with top AI Overview, organic results, and related searches. Two modes: overview (standard SERP) / ai_mode (immersive multi-turn conversational search).\nUse when: user says \"Google for me\" / \"external demand\" / \"what do people say about X\" / \"Reddit/Quora pain points\" / \"will my content be cited in AI search\" / \"find user complaints for keyword X\"; \"consumer voice\" step in scouting SOPs; verifying whether a new product concept has off-Amazon demand; **see which Google Shopping ads competitors run / their ad landing pages** (the sponsered block).\nDon't use: for on-Amazon search (use search_amazon); when only the trend curve matters (use keyword_trends — cheaper and tighter).\nReturns: data.{ results_num, ai_overview, json.items[ { type:'ai_overview', items:[{content:[...], references:[{title,url,domain}]}] }, { type:'organic', items:[{title,url,text}] }, { type:'related_searches', items:[...] }, { type:'sponsered', items:[{type:'result', url, position:'top'|'bottom', title_of_page, title_above_url}] } ], screenshot, taskId }. ⚠️ The ad block's upstream type is literally spelled 'sponsered' (missing an o — not a typo on our side; match it verbatim, do NOT look for 'sponsored') — it carries Google ad (shopping + text) landing-page url, title (title_of_page), and displayed brand domain (title_above_url). **position** marks whether the ad appears at the top ('top') or bottom ('bottom') of the page — top ads carry higher exposure weight.\nPair with: ↑ query inferred from user; in 'ai_mode' pass followups[1..5] for multi-turn; ↓ ai_overview.references[].url for authoritative external sources, organic items for content-competition analysis, sponsered[].url + title_above_url for competitors' paid landing pages and brands, split by position into top/bottom ad slots.\nCost: ~2 points/call, ~30s (**slow** — Google AI render time).\nTips: prefer overview for single queries (cheaper); use ai_mode only when you need decomposed multi-turn investigation. Followups > 5 visibly slow down responses.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clientSource": {
                "description": "调用来源标记。仅由 Pangolinfo Skill 传 skill；普通 MCP 调用省略即可。",
                "enum": ["skill", "mcp"],
                "type": "string"
              },
              "followups": {
                "description": "Follow-up question list (only honored when mode='ai_mode'). Each item is a follow-up question on the previous answer. **More than 5 entries significantly degrades response time.**",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "mode": {
                "default": "overview",
                "description": "Search mode: 'overview' (default) = standard Google SERP with AI Overview at the top, best for one-shot queries; 'ai_mode' = Google AI Mode immersive search (udm=50), best for complex multi-step questions with follow-ups.",
                "enum": ["overview", "ai_mode"],
                "type": "string"
              },
              "query": {
                "description": "Search keyword or question. Examples: 'wireless earbuds reviews' (single keyword) / 'how does noise cancellation work' (question) / 'what do people complain about Stanley Quencher' (user pain point).",
                "minLength": 1,
                "type": "string"
              },
              "screenshot": {
                "default": false,
                "description": "Whether to return a screenshot URL of the rendered search page. Defaults to false.",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a6d399797dd1071da4dd4c2c5d84d1149585408c5dc493c83ee00c5ac3733e77"
        },
        {
          "name": "calculate_amazon_profit",
          "description": "Calculate Amazon US/JP FBA and merchant-fulfilled fees, profit and profit margin. Supply asin and country; optionally override prices, shipping, package dimensions/weight and fulfillment programs. Returns data.summary (FBA/MFN costs and profit), data.product and data.raw. The backend supplies omitted prices and package data. A successful call costs a fixed 5 points; the response has no pointCost field, and its absence does not mean free. Returns synchronously with a 180-second MCP wait budget. On timeout or connection loss, completion and billing are unknown: do not automatically retry. Code 8000 means product not found, unbilled; check ASIN and marketplace. Use for product economics and fulfillment comparisons; use get_amazon_product for listing details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asin": {
                "description": "Ten-character product ASIN, e.g. B07FZ8S74R.",
                "pattern": "^[A-Z0-9]{10}$",
                "type": "string"
              },
              "clientSource": {
                "description": "调用来源标记。仅由 Pangolinfo Skill 传 skill；普通 MCP 调用省略即可。",
                "enum": ["skill", "mcp"],
                "type": "string"
              },
              "country": {
                "description": "Amazon marketplace country: US or JP, case-insensitive.",
                "enum": ["US", "JP"],
                "type": "string"
              },
              "dimensionUnit": {
                "description": "Dimension unit; defaults to inches in US and centimeters in JP.",
                "enum": ["inches", "centimeters"],
                "type": "string"
              },
              "fbaPrice": {
                "description": "FBA selling price; defaults to the current product price.",
                "minimum": 0,
                "type": "number"
              },
              "mfnPrice": {
                "description": "Merchant-fulfilled selling price; defaults to the current product price.",
                "minimum": 0,
                "type": "number"
              },
              "mfnShippingPrice": {
                "description": "Buyer-paid shipping for merchant fulfillment; defaults to zero.",
                "minimum": 0,
                "type": "number"
              },
              "packageHeight": {
                "description": "Package height; defaults to product dimensions.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "packageLength": {
                "description": "Package length; defaults to product dimensions.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "packageWeight": {
                "description": "Package weight; defaults to product weight.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "packageWidth": {
                "description": "Package width; defaults to product dimensions.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "programs": {
                "description": "Fulfillment programs: FBA and/or MFN; defaults to calculating both.",
                "items": {
                  "enum": ["FBA", "MFN"],
                  "type": "string"
                },
                "maxItems": 2,
                "minItems": 1,
                "type": "array"
              },
              "weightUnit": {
                "description": "Weight unit; defaults to pounds in US and kilograms in JP.",
                "enum": ["pounds", "kilograms"],
                "type": "string"
              }
            },
            "required": ["asin", "country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:025dec83a805e5e9534fdc9cd1e444e2d9db2f165c8e15c081462245b44597ab"
        },
        {
          "name": "collect_ecommerce_data",
          "description": "Product (operation=product-detail) supports Walmart, Costco, Best Buy, Sam's Club, Target, Naver Shopping and TikTok Shop: data.product contains title, price, images, specifications and variants; data.productSummary retains aggregate ratings. The combined product costs 0.8 points. Reviews retain data.results and pagination, at 0.8 points per unique returned review. Confirmed invalid IDs/URLs or missing products cost 0.8 points; local validation errors, timeouts, service failures and valid empty reviews are free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "allowStale": {
                "description": "Reviews only: allow stale cached data.",
                "type": "boolean"
              },
              "country": {
                "description": "Required storefront country for Walmart/Costco/Best Buy. Omit for Sam's Club/Target/TikTok Shop (US) and Naver Shopping (KR).",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "includeNative": {
                "description": "Include native upstream data; defaults to false. Native blocks make responses roughly 3x larger, so pageSize must not exceed 20 when this is on.",
                "type": "boolean"
              },
              "merchantId": {
                "description": "Naver Shopping only: optional merchant mapping.",
                "type": "string"
              },
              "operation": {
                "default": "reviews",
                "description": "Product combines product details and aggregate ratings; Reviews returns buyer reviews.",
                "enum": ["reviews", "product-detail"],
                "type": "string"
              },
              "originProductId": {
                "description": "Naver Shopping only: optional origin-product mapping.",
                "type": "string"
              },
              "page": {
                "description": "Reviews page only; omit for TikTok Shop's fixed first batch.",
                "maximum": 300001,
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "description": "Reviews page size where supported; omit for Sam's Club and TikTok Shop.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "enum": ["walmart", "costco", "bestbuy", "samsclub", "target", "naver", "tiktok"],
                "type": "string"
              },
              "productId": {
                "description": "Product ID; supply this or productUrl.",
                "maxLength": 24,
                "minLength": 1,
                "type": "string"
              },
              "productUrl": {
                "description": "Full product URL; supply this or productId.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "refresh": {
                "description": "Request a refresh of cached data.",
                "type": "boolean"
              },
              "storeSlug": {
                "description": "Naver Shopping only: optional storefront mapping.",
                "type": "string"
              }
            },
            "required": ["platform"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6de7548ddf25610863290da24af48c6bc76dae4e4d37cff1c4c56c9d33c2c462"
        },
        {
          "name": "filter_categories",
          "description": "[Amazon category commercial-metrics filter] Filter categories by dozens of metrics (sales, GMS, search volume, conversion, return rate, price tier, competitor density, …) — or use as a \"category detail\" endpoint by passing a single categoryId.\nUse when: user says \"find categories worth entering\" / \"high-sales categories\" / \"low return-rate categories\" / \"high search-volume but low competition categories\" / \"show me all metrics for category X\"; category-level blue-ocean hunt; getting the 30+ metric snapshot of one category.\nDon't use: for niche-level (use filter_niches — finer granularity); for actual products in a category (use list_category_products); for just the readable name (use get_category_paths).\nReturns: data.items.data[{ id, categoryId, marketplaceId, timeRange, sampleScope, snapshotDate, unitSoldSum, glanceViewsSum, searchVolumeSum, netShippedGmsSum, buyBoxPriceAvg, buyBoxPriceTier, searchToPurchaseRatio, returnRatio, asinCount, offersPerAsin, newAsinCount, newBrandCount, avgAdSpendPerClick, unitSoldTrendDirection, unitSoldChangeRateBucket, ... trend + quantile-bucket fields }] + data.items.pagination.{ total, page, size, hasNext }. **Pagination**: use the 'page' param (default 1, 1-based, size capped at 10); 'pagination.hasNext=true' means more pages exist, 'hasNext=false' means last page.\nPair with: ↑ required timeRange ('l7d' common) + sampleScope ('all_asin') + marketplaceId (defaults US); categoryId from search_categories / get_category_children; ↓ feed high-potential categories into list_category_products / list_bestsellers for real listings.\nCost: 5 points/call, ~5s.\nTips: size capped at 10 (backend hard limit); only paginate when the user explicitly asks for more candidate categories — single-detail or quick-filter calls are fine on page 1; long-tail filter fields (unitSoldTrendDirections / metricChangeRateBuckets / dozens more) pass through via extraFilters.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyBoxPriceAvgMax": {
                "description": "Max average buy-box price.",
                "minimum": 0,
                "type": "number"
              },
              "buyBoxPriceAvgMin": {
                "description": "Min average buy-box price (marketplace currency).",
                "minimum": 0,
                "type": "number"
              },
              "buyBoxPriceTiers": {
                "description": "Price-tier filter. Allowed: budget, mainstream, premium, luxury.",
                "items": {
                  "enum": ["budget", "mainstream", "premium", "luxury"],
                  "type": "string"
                },
                "type": "array"
              },
              "categoryId": {
                "description": "When set, returns the full metric row for that single category (this endpoint doubles as the 'detail' endpoint). Omit to list multiple categories matching the filters. Example: '979832011'.",
                "type": "string"
              },
              "clientSource": {
                "description": "调用来源标记。仅由 Pangolinfo Skill 传 skill；普通 MCP 调用省略即可。",
                "enum": ["skill", "mcp"],
                "type": "string"
              },
              "extraFilters": {
                "additionalProperties": {},
                "description": "Pass-through for any other upstream filter (e.g. unitSoldTrendDirections, newAsinCountLevels, metricChangeRateBuckets). Keys must match the upstream doc verbatim.",
                "type": "object"
              },
              "marketplaceId": {
                "default": "US",
                "description": "Amazon marketplace id. ⚠️ Backend currently supports US only; other marketplaces will fail or fall back. Use US (the default).",
                "minLength": 1,
                "type": "string"
              },
              "netShippedGmsSumMax": {
                "description": "Max total GMS.",
                "minimum": 0,
                "type": "integer"
              },
              "netShippedGmsSumMin": {
                "description": "Min total GMS (gross merchandise sales).",
                "minimum": 0,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page number, 1-based.",
                "minimum": 1,
                "type": "integer"
              },
              "returnRatioLevels": {
                "description": "Return-rate quality buckets. Allowed: excellent, average, risk.",
                "items": {
                  "enum": ["excellent", "average", "risk"],
                  "type": "string"
                },
                "type": "array"
              },
              "sampleScope": {
                "description": "Sample scope (required). Examples: 'all_asin' (all ASINs — verified working).",
                "minLength": 1,
                "type": "string"
              },
              "searchToPurchaseRatioLevels": {
                "description": "Search-to-purchase conversion buckets. Allowed: to_improve, average, excellent.",
                "items": {
                  "enum": ["to_improve", "average", "excellent"],
                  "type": "string"
                },
                "type": "array"
              },
              "searchVolumeSumMax": {
                "description": "Max total search volume.",
                "minimum": 0,
                "type": "integer"
              },
              "searchVolumeSumMin": {
                "description": "Min total search volume.",
                "minimum": 0,
                "type": "integer"
              },
              "size": {
                "default": 10,
                "description": "Page size, max 10 (backend hard limit).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "sortField": {
                "description": "Sort field; any response field name is accepted (e.g. 'unitSoldSum', 'netShippedGmsSum').",
                "type": "string"
              },
              "sortOrder": {
                "description": "Sort order: 'asc' or 'desc'.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "timeRange": {
                "description": "Aggregation time range (required). Examples: 'l7d' (last 7 days — verified working). The exact enum is backend-defined; 'l7d' is the safest known value.",
                "minLength": 1,
                "type": "string"
              },
              "unitSoldSumMax": {
                "description": "Max total units sold.",
                "minimum": 0,
                "type": "integer"
              },
              "unitSoldSumMin": {
                "description": "Min total units sold.",
                "minimum": 0,
