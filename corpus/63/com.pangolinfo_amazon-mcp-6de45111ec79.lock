        {
          "name": "get_amazon_delivery_time",
          "description": "[Amazon Delivery Time] Return the full listing detail for one ASIN plus address-dependent delivery estimates.\nUse when: the user explicitly needs estimated arrival, free vs paid delivery timing, the fastest option, handling lead time, or the listing's high-return warning.\nDon't use: for ordinary product detail only; use get_amazon_product at the lower 1-point cost.\nReturns: data.json[0].data.results[0] inherits every get_amazon_product field and adds frequentlyReturnedItem, leadTime, and delivery{deliveryTime,fastestDelivery,deliveryTimeFree,deliveryTimePay,deliveryFastest}. Unavailable extra fields are empty strings.\nCost: 2 points/call, ~5s. Delivery results depend on the zipcode address.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asin": {
                "description": "Amazon ASIN, 10 letters/digits (case-insensitive; auto-uppercased).",
                "pattern": "^[A-Za-z0-9]{10}$",
                "type": "string"
              },
              "clientSource": {
                "description": "调用来源标记。仅由 Pangolinfo Skill 传 skill；普通 MCP 调用省略即可。",
                "enum": ["skill", "mcp"],
                "type": "string"
              },
              "site": {
                "default": "amz_us",
                "description": "Amazon marketplace. Defaults to amz_us.",
                "enum": ["amz_us", "amz_uk", "amz_de", "amz_jp", "amz_fr", "amz_it", "amz_es", "amz_ca", "amz_au", "amz_sa", "amz_ae", "amz_br", "amz_mx"],
                "type": "string"
              },
              "zipcode": {
                "description": "ZIP code matching the marketplace country. Delivery estimates vary by address; the backend selects a country-matched ZIP when omitted.",
                "type": "string"
              }
            },
            "required": ["asin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef309db19ad2809fbc91f371da3a7ade322fa0cc82332fb1615ddca6544eaace"
        },
        {
          "name": "get_amazon_product",
          "description": "[Amazon single-product detail] Scrape the full PDP for one ASIN.\nUse when: user supplies a specific ASIN (\"look at B0XXXXXXXX\" / \"check this product's price/rating/seller\" / \"analyse this competitor\"); or as a SOP step after candidate ASINs are picked.\nDon't use: for many products at once (use search_amazon or list_* series for lists); for reviews only (use get_amazon_reviews — cheaper and more focused).\nReturns (format='json', default): data.json[0].data.results[0] = { asin, title, itemName, itemHighlights, price, star, rating, brand, seller{name,id,link,hasLink}, parentAsin, videos[{type,section,mp4,m3u8,previewMp4,cover,title,duration,author}], shippingFee (buyer shipping fee as a number, e.g. \"750\"; \"0\" when free shipping or no info, varies by the zipcode address), delivery{deliveryTime,fastestDelivery}, ratingDistribution[], aiReviewsSummary, bestSellersRankItems, reviews[{date,star,content,helpful,...}], productOverview[], features[], productDescription[], images[], variantDetails[], attributes[], category_id, breadCrumbs, ... } — 30+ fields (variantDetails summary included). videos[].section: product=main media gallery, brand=brand module, related=related videos, customerReview=customer review videos. Use get_amazon_delivery_time when you need the high-return warning, free/paid/fastest delivery breakdown, or handling lead time.\nMissing ASIN: confirmed absence on the requested marketplace returns 9204 with the ASIN in message; normal format-specific billing applies. Do not auto-retry.\nTitle fields: title preserves the existing main title; itemName is the product name; itemHighlights is the stable subtitle/highlights field. Prefers the dedicated subtitle, then the main-title suffix, then an already parsed Item Highlight / Item Highlights attribute. Empty string when no recognized content is available; no character-limit truncation. Read data.json[0].data.results[0].itemHighlights in JSON; no Markdown conversion is needed.\nPair with: ↑ asin typically comes from search_amazon / list_bestsellers / filter_niches; ↓ feed the same asin into get_amazon_reviews for more reviews (the PDP carries only ~5-10).\nCost: ~1 point/call, ~5s.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asin": {
                "description": "Amazon ASIN, 10 letters/digits (case-insensitive — auto-uppercased). Example: 'B0B4NLGCH5'.",
                "pattern": "^[A-Za-z0-9]{10}$",
                "type": "string"
              },
              "clientSource": {
                "description": "调用来源标记。仅由 Pangolinfo Skill 传 skill；普通 MCP 调用省略即可。",
                "enum": ["skill", "mcp"],
                "type": "string"
              },
              "format": {
                "default": "json",
                "description": "Response format. Defaults to 'json' — a structured payload (title, price, rating, reviews, seller, etc.) ready for programmatic use. Use 'markdown' if you want the rendered PDP text instead.",
                "enum": ["json", "markdown"],
                "type": "string"
              },
              "site": {
                "default": "amz_us",
                "description": "Amazon marketplace. Defaults to 'amz_us' (US).",
                "enum": ["amz_us", "amz_uk", "amz_de", "amz_jp", "amz_fr", "amz_it", "amz_es", "amz_ca", "amz_au", "amz_sa", "amz_ae", "amz_br", "amz_mx"],
                "type": "string"
              },
              "zipcode": {
                "description": "ZIP code that must match the site country (amz_us → US zip, amz_jp → JP zip, ...). Optional; backend picks a random one from the per-country pool when omitted. Cross-country zips (e.g. amz_us + JP zip) are rejected by the backend. Examples: 10001 (NY) / 90001 (LA) / 100-0001 (Tokyo).",
                "type": "string"
              }
            },
            "required": ["asin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
