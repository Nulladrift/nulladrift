              }
            },
            "required": ["sampleScope", "timeRange"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a13668dc92b5f4c7ea6af70aeae494110b1c6cfe8c6bf3c26d12e5c654067623"
        },
        {
          "name": "filter_niches",
          "description": "[Amazon niche filter] Filter Amazon Niches (a finer-grained \"demand cluster\" than categories) by 50+ commercial metrics, or use as a \"niche detail\" endpoint for one niche.\nUse when: user says \"find blue ocean\" / \"high search volume + low competition niches\" / \"fast-growing small markets\" / \"niche scouting\" / \"give me the deep report on this niche\" / \"low return-rate niches\" / \"niches with return rate under 10%\"; the core filter step of GTM scouting SOPs; getting fee structure / brand age / new-launch trends for one niche.\nDon't use: for full categories (use filter_categories); for actual products in a niche (the niche record only carries 1 referenceAsin; combine with categoryId + list_category_products); for plain keyword search (use search_amazon).\nReturns: data.items.data[{ nicheId, nicheTitle, referenceAsinImageUrl, currency, searchVolumeT90, searchVolumeT360, searchVolumeGrowthT90, minimumPrice, maximumPrice, avgPrice, productCount, sponsoredProductsPercentage, primeProductsPercentage, top5ProductsClickShare, top20BrandsClickShare, brandCount, sellingPartnerCount, avgBrandAge, avgBestSellerRank, avgProductPrice, avgReviewCount, avgReviewRating, avgDetailPageQuality, newProductsLaunchedT180/T360, successfulLaunchesT90/T180/T360, returnRateT360, fee fields T365 … 100+ fields }] + data.items.pagination.{ total, page, size, hasNext }. **Pagination**: use the 'page' param (default 1, 1-based, size capped at 10 (default 3)); 'pagination.hasNext=true' means more pages exist, 'hasNext=false' means last page.\nPair with: ↑ marketplaceId required (defaults US); nicheTitle for keyword filter, nicheId for single-niche detail; ↓ feed referenceAsin into get_amazon_product to see the representative product; niche doesn't carry a categoryId directly — derive separately if needed.\nCost: 10 points/call, ~5s.\nTips: size capped at 10 (default 3); pass long-tail filters (50+ fields) via extraFilters; classic blue-ocean combo = high searchVolumeT90Min + low top5ProductsClickShareT360Max + moderate productCountMax + positive searchVolumeGrowthT90Min + returnRateT360Max ≤ 0.10 (low-return). For return-rate filtering use returnRateT360Max (upper bound, 0-1 decimal); the response includes returnRateT360 with the actual return rate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "avgReviewCountMax": {
                "description": "Max average review count — lower means less competition.",
                "minimum": 0,
                "type": "integer"
              },
              "avgReviewCountMin": {
                "description": "Min average review count.",
                "minimum": 0,
                "type": "integer"
              },
              "avgReviewRatingMin": {
                "description": "Min average review rating (0-5).",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "clientSource": {
                "description": "调用来源标记。仅由 Pangolinfo Skill 传 skill；普通 MCP 调用省略即可。",
                "enum": ["skill", "mcp"],
                "type": "string"
              },
              "extraFilters": {
                "additionalProperties": {},
                "description": "Pass-through for any other upstream filter (e.g. sponsoredProductsPercentageT360Min, successfulLaunchesT360Max, avgBestSellerRankMax). Keys must match the upstream doc verbatim.",
                "type": "object"
              },
              "marketplaceId": {
                "default": "US",
                "description": "Amazon marketplace id (required). ⚠️ Backend currently supports US only; other marketplaces will fail or fall back. Use US (the default).",
                "minLength": 1,
                "type": "string"
              },
              "maximumPriceMax": {
                "description": "Upper bound on the niche's maximum product price.",
                "minimum": 0,
                "type": "number"
              },
              "minimumPriceMin": {
                "description": "Lower bound on the niche's minimum product price.",
                "minimum": 0,
                "type": "number"
              },
              "nicheId": {
                "description": "When set, returns the full deep report for that single niche (this endpoint doubles as the niche-detail endpoint). Omit to list multiple niches matching the filters. Example: '8140a265-768d-4679-8bc2-994cb1c96f0b' (UUID).",
                "type": "string"
              },
              "nicheTitle": {
                "description": "Keyword match against niche titles. Examples: 'iphone 16 wallet case' / 'wireless earbuds for sports'.",
                "type": "string"
              },
              "page": {
                "default": 1,
