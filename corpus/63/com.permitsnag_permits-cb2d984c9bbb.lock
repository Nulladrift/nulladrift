        {
          "name": "search_campgrounds",
          "title": "Search campgrounds",
          "description": "Find campgrounds in the US, Canada, New Zealand and Australia by name, area, state or province, across Recreation.gov, state and provincial park and national park booking systems. Use this when someone wants a place to camp or asks about a specific campground. Returns up to 10 campgrounds with their PermitSnag page, their booking system, and whether PermitSnag can send an alert when a site opens. It does not check dates; use check_availability for that. An opening alert is set up with create_alert.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country: US, CA (Canada), NZ (New Zealand) or AU (Australia). Omit to search all four.",
                "enum": ["US", "CA", "NZ", "AU"],
                "type": "string"
              },
              "limit": {
                "description": "How many results, 1 to 10. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A campground name or area, like \"Upper Pines\" or \"Big Sur\".",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "region": {
                "description": "Optional province, state or territory outside the US, by name or abbreviation, like British Columbia, BC, Tasmania or NSW.",
                "maxLength": 60,
                "type": "string"
              },
              "state": {
                "description": "Optional two-letter US state code, like CA for California. It limits the search to the US.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "Campgrounds in the US, Canada, New Zealand and Australia that match the search.",
            "properties": {
              "country": {
                "description": "The country filter, or null for all four.",
                "enum": ["US", "CA", "NZ", "AU", null],
                "type": ["string", "null"]
              },
              "query": {
                "type": "string"
              },
              "region": {
                "description": "The province, state or territory filter outside the US, as a slug, or null.",
                "type": ["string", "null"]
              },
