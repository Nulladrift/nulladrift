        {
          "name": "cancel_alert",
          "title": "Turn off a PermitSnag alert",
          "description": "Turn off one alert in the person's own linked PermitSnag account, by the alert id list_my_alerts gives. PermitSnag stops checking it and sends no more openings for it; it can be turned back on from the website. It never cancels a booking, a permit application or a paid plan. Turning off an alert that is already off changes nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alertId": {
                "description": "The alert id from list_my_alerts.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["alertId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "properties": {
                  "status": {
                    "const": "refused"
                  }
                },
                "required": ["reason", "status"]
              },
              {
                "properties": {
                  "status": {
                    "enum": ["turned_off", "already_off"]
                  }
                },
                "required": ["alert", "status"]
              }
            ],
            "description": "Whether the alert was turned off, was already off, or the reason the request was refused.",
            "properties": {
              "alert": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["permit", "campground"]
                  }
                },
                "required": ["id", "kind"],
                "type": "object"
              },
              "pageUrl": {
                "type": "string"
              },
              "reason": {
                "description": "Why the request was refused, as a short code.",
                "type": "string"
              },
              "status": {
                "enum": ["turned_off", "already_off", "refused"]
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Turn off a PermitSnag alert"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d1b26a1b0d43bac3a9fb643d5629e65798cd9cc09070ab67167d6fe03f4798a3"
        },
        {
          "name": "check_availability",
          "title": "Check recorded openings for a permit or campground",
          "description": "Shows what PermitSnag has recorded for one backcountry permit or one campground (US, Canada, New Zealand or Australia) over a range of up to 62 days. Answers come from PermitSnag's own stored checks of the booking site, not a live look, and nothing is booked. Each date has one state: observed_opening (an opening seen recently, with when it was last seen), observed_no_match (a recent check that saw no opening, with its time), stale (the newest check is older than staleAfterHours, with its time), unknown (no usable check of that date), unreleased (not on sale yet, by the agency's release rule or the booking site), off_season (outside the agency's published season), closed (closed by the agency) or unsupported (PermitSnag does not check this place). Neither stale nor unknown means sold out. Permit dates are shown as they stood 15 minutes ago. For a permit split into zones or entry points, our checks may cover only some of them, so a date with no opening seen comes back as unknown, never as observed_no_match.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campground": {
                "description": "The campground id from search_campgrounds. Give this or permit, not both.",
                "maxLength": 200,
                "type": "string"
              },
              "endDate": {
                "description": "Last date, YYYY-MM-DD, inclusive. Defaults to startDate. The range covers at most 62 days, counting both ends.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "permit": {
                "description": "The permit id or slug from search_permits. Give this or campground, not both.",
                "maxLength": 200,
                "type": "string"
              },
              "startDate": {
                "description": "First date, YYYY-MM-DD, read as the place's own local calendar day (for a campground, the night you arrive).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["startDate"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["alert", "checkedAt", "dates", "days", "depth", "freshness", "source", "staleAfterHours", "subject"]
              },
              {
                "required": ["found"]
              },
              {
                "required": ["past"]
              }
            ],
            "description": "PermitSnag's recorded checks of one permit or campground on the asked dates; an observed or stale date carries the time and age of its check. Not a live look at the booking site. Or found: false, or past: true.",
            "properties": {
              "alert": {
                "additionalProperties": false,
                "properties": {
                  "available": {
                    "description": "True only when PermitSnag can send an alert for this place right now.",
                    "type": "boolean"
                  },
                  "pageUrl": {
                    "description": "The PermitSnag page where an alert is set up, or where to read what to do instead.",
                    "type": "string"
                  },
                  "reason": {
                    "description": "Why an alert is or is not on offer.",
                    "enum": ["eligible", "lottery_period", "out_of_season", "closed", "no_quota_now", "lottery_draw_only", "not_sold_online", "not_tracked"]
                  }
                },
                "required": ["available", "pageUrl", "reason"],
                "type": "object"
              },
              "checkedAt": {
                "type": "string"
              },
              "dates": {
                "additionalProperties": false,
                "properties": {
                  "calendar": {
                    "const": "local_day"
                  },
                  "end": {
                    "type": "string"
                  },
                  "start": {
                    "type": "string"
                  }
                },
                "required": ["calendar", "end", "start"],
                "type": "object"
              },
              "days": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ageMinutes": {
                      "description": "Minutes since that check.",
                      "type": "integer"
                    },
                    "date": {
                      "description": "YYYY-MM-DD, the place's own local calendar day.",
                      "type": "string"
                    },
                    "lastSeenState": {
                      "description": "For a stale date: what that old check saw.",
                      "enum": ["observed_opening", "observed_no_match"]
                    },
                    "observedAt": {
                      "description": "The time of the check behind an observed or stale state (for an opening, when it was last seen), ISO 8601. For a permit, never later than publicDelayMinutes ago.",
                      "type": "string"
                    },
                    "openSites": {
                      "description": "Campgrounds at site level only: sites seen open.",
                      "type": "integer"
                    },
                    "releaseKind": {
                      "enum": ["lottery", "reservations", null]
                    },
                    "releasesOn": {
                      "description": "For an unreleased date: the sourced day it goes on sale, when known.",
                      "type": ["string", "null"]
                    },
                    "state": {
                      "description": "What PermitSnag recorded for this date. Neither stale nor unknown means sold out.",
                      "enum": ["observed_opening", "observed_no_match", "stale", "unknown", "unreleased", "off_season", "closed", "unsupported"]
                    }
                  },
                  "required": ["date", "state"],
                  "type": "object"
                },
                "maxItems": 62,
                "type": "array"
              },
              "depth": {
                "enum": ["permit_level", "site_level", "campground_level"]
              },
              "found": {
                "const": false,
                "description": "Present, and false, only when nothing matched."
              },
              "freshness": {
                "additionalProperties": false,
                "properties": {
                  "band": {
                    "enum": ["none", "recent", "stale"]
                  },
                  "newestObservedAt": {
                    "type": ["string", "null"]
                  },
                  "oldestObservedAt": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["band", "newestObservedAt", "oldestObservedAt"],
                "type": "object"
              },
              "partialScope": {
                "description": "Permits only: true when our checks may cover only some zones or entry points, so no date is called \"no opening\".",
                "type": "boolean"
              },
              "past": {
                "const": true,
                "description": "Present only when every asked date has passed."
              },
              "publicDelayMinutes": {
                "description": "Permits only: dates are described as they stood this many minutes ago.",
                "type": "number"
              },
              "scanRoute": {
                "description": "How PermitSnag reaches this permit for cancellation openings: direct, through a zone or starting area, through its entry points, or none.",
                "enum": ["direct", "via_zone", "via_children", "none", null]
              },
              "source": {
                "const": "permitsnag_recorded_checks"
              },
              "staleAfterHours": {
                "description": "Hours. A check older than this is never reported as observed; it is reported as stale (or as unknown, when partialScope hides a check that saw no opening).",
                "type": "number"
              },
              "subject": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["permit", "campground"]
                  },
                  "name": {
                    "type": "string"
                  },
                  "pageUrl": {
                    "type": "string"
                  },
                  "slug": {
                    "description": "Permits only.",
                    "type": "string"
                  }
                },
                "required": ["id", "kind", "name", "pageUrl"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check recorded openings for a permit or campground"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab8ce97899d6c3d19250061da599b37759ccd85e92cd6b271caf019b30f2d908"
        },
        {
          "name": "create_alert",
          "title": "Set up a PermitSnag alert",
          "description": "Set up an opening alert in the person's own linked PermitSnag account, for ONE permit (give permit, startDate, endDate, partySize) or ONE campground (give campground, checkInStart, checkInEnd, nights, and optionally sitesNeeded). PermitSnag then sends the person an alert when a matching opening appears. Use the permit or campground id from search_permits or search_campgrounds. Starting areas, night-by-night plans and groups of trailheads are set up on the website instead. The same request sent twice sets up one alert. It never books, pays or enters a lottery. When the account needs a purchase for this alert, the answer may hold the alert and give payment links for the person to open and pay on a checkout page; the alert then turns on by itself once paid. Nothing is ever charged from this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campground": {
                "description": "The campground id. Give this or permit, not both.",
                "maxLength": 200,
                "type": "string"
              },
              "checkInEnd": {
                "description": "Campground alert: the last acceptable check-in day, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkInStart": {
                "description": "Campground alert: the first acceptable check-in day, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "endDate": {
                "description": "Permit alert: the last day the person could start, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "nights": {
                "description": "Campground alert: nights in a row.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "partySize": {
                "description": "Permit alert: number of people.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "permit": {
                "description": "The permit id or slug. Give this or campground, not both.",
                "maxLength": 200,
                "type": "string"
              },
              "sitesNeeded": {
                "description": "Campground alert: sites needed together. Default 1.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "startDate": {
                "description": "Permit alert: the first day the person could start, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "properties": {
                  "status": {
                    "const": "refused"
                  }
                },
                "required": ["reason", "status"]
              },
              {
                "properties": {
                  "status": {
                    "enum": ["created", "already_set_up"]
                  }
                },
                "required": ["alert", "status"]
              },
              {
                "properties": {
                  "status": {
                    "const": "awaiting_payment"
                  }
                },
                "required": ["holdId", "linksExpireAt", "paymentLinks", "reason", "status"]
              }
            ],
            "description": "The alert set up, the one already set up for the same request, or the reason it was refused.",
            "properties": {
              "alert": {
                "additionalProperties": false,
                "properties": {
                  "checkInEnd": {
                    "type": "string"
                  },
                  "checkInStart": {
                    "type": "string"
                  },
                  "endDate": {
                    "type": "string"
                  },
                  "id": {
                    "description": "The alert id. Null only for an alert already set up whose id the website did not return.",
                    "type": ["string", "null"]
                  },
                  "kind": {
                    "enum": ["permit", "campground"]
                  },
                  "nights": {
                    "type": "integer"
                  },
                  "partySize": {
                    "type": "integer"
                  },
                  "place": {
                    "type": "string"
                  },
                  "sitesNeeded": {
                    "type": "integer"
                  },
                  "startDate": {
                    "type": "string"
                  }
                },
                "required": ["id", "kind"],
                "type": "object"
              },
              "holdId": {
                "description": "awaiting_payment only: the held alert. It turns on by itself when one of paymentLinks is paid.",
                "type": "string"
              },
              "linksExpireAt": {
                "description": "awaiting_payment only: when the payment links stop working.",
                "type": "string"
              },
              "pageUrl": {
                "description": "The PermitSnag page for this place.",
                "type": "string"
              },
              "paymentLinks": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "billing": {
                      "enum": ["once", "year", "month"]
                    },
                    "label": {
                      "description": "What the link buys, in words.",
                      "type": "string"
                    },
                    "priceUsd": {
                      "description": "Price in US dollars. The checkout page may show the local currency.",
                      "type": "number"
                    },
                    "purchase": {
                      "description": "What the link buys: this permit or campground once, or PermitSnag Pro.",
                      "enum": ["alacarte", "alacarte_addon", "campground_single", "campground_addon", "pro_annual", "pro_monthly"]
                    },
                    "url": {
                      "description": "Opens the checkout page for this purchase. The person pays there; nothing is charged from here.",
                      "type": "string"
                    }
                  },
                  "required": ["billing", "label", "priceUsd", "purchase", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "reason": {
                "description": "Why the request was refused, as a short code.",
                "type": "string"
              },
              "status": {
                "enum": ["created", "already_set_up", "refused", "awaiting_payment"]
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set up a PermitSnag alert"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2630143d6bd9eeeac2921b86dd457bf6e787b1727c955275695f77235de7be13"
        },
        {
          "name": "get_booking_link",
          "title": "Booking link for a permit or campground",
          "description": "Returns the link to the official booking page for one backcountry permit or one campground in the US, Canada, New Zealand or Australia. For some permits the link also carries the first date and the number of people you give, but the booking site may not use them, so the person checks or picks the dates and group size on that page. For a campground, the person picks or checks the dates on the booking page. For some places it returns the agency's own page or the PermitSnag page instead of a booking page. It only returns a link and a sentence about it; it does not book, pay or enter a lottery.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campground": {
                "description": "The campground id. Give this or permit, not both.",
                "maxLength": 200,
                "type": "string"
              },
              "endDate": {
                "description": "Optional last date, YYYY-MM-DD. Sent in the link for a few booking sites; the site may ignore it.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "partySize": {
                "description": "Optional number of people. Sent in the link for some permit booking sites; the site may ignore it.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "permit": {
                "description": "The permit id or slug. Give this or campground, not both.",
                "maxLength": 200,
                "type": "string"
              },
              "startDate": {
                "description": "Optional first date, YYYY-MM-DD. Sent in the link for some booking sites; the site may ignore it.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["datePrefill", "destination", "executesNothing", "subject", "url"]
              },
              {
                "required": ["found"]
              }
            ],
            "description": "A link to the booking page, the agency's page or the PermitSnag page for a permit or campground, or found: false. Nothing is booked.",
            "properties": {
              "datePrefill": {
                "description": "Whether the asked date reaches the booking page.",
                "enum": ["applied", "ignored", "unknown"]
              },
              "destination": {
                "enum": ["booking_page", "official_page", "permitsnag_page"]
              },
              "executesNothing": {
                "const": true,
                "description": "This tool only returns a link."
              },
              "found": {
                "const": false,
                "description": "Present, and false, only when nothing matched."
              },
              "providerHomeUrl": {
                "description": "Permits only: the booking site's front page, when that is all we can name.",
                "type": ["string", "null"]
              },
              "subject": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["permit", "campground"]
                  },
                  "name": {
                    "type": "string"
                  },
                  "pageUrl": {
                    "type": "string"
                  },
                  "slug": {
                    "description": "Permits only.",
                    "type": "string"
                  }
                },
                "required": ["id", "kind", "name", "pageUrl"],
                "type": "object"
              },
              "url": {
                "description": "The page to open.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Booking link for a permit or campground"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:175578334a7e8da614b8083de18ef392a50687aeacf0ae1b19ce4943a264d122"
        },
        {
          "name": "get_campground_details",
          "title": "Campground details",
          "description": "Get the details of one campground in the US, Canada, New Zealand or Australia: its booking system, how far ahead sites go on sale, site count and types, stay limits, season and closures. Use it after search_campgrounds, or when the person names a specific campground. Says whether PermitSnag can send an alert when a site opens, and whether our checks count individual sites or only the campground as a whole. To set one up in the person's own PermitSnag account, use create_alert (it asks the person to sign in to PermitSnag).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campground": {
                "description": "The campground id from search_campgrounds.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["campground"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["alert", "amenities", "bookingSystem", "bookingUrl", "checkedAt", "depth", "description", "id", "maxStayNights", "name", "pageUrl", "priceRange", "provider", "releaseRule", "reservationWindowDays", "season", "siteTypes", "state", "totalSites"]
              },
              {
                "required": ["found"]
              }
            ],
            "description": "The details of one campground (US, Canada, New Zealand or Australia), or found: false.",
            "properties": {
              "alert": {
                "additionalProperties": false,
                "properties": {
                  "available": {
                    "description": "True only when PermitSnag can send an alert for this place right now.",
                    "type": "boolean"
                  },
                  "pageUrl": {
                    "description": "The PermitSnag page where an alert is set up, or where to read what to do instead.",
                    "type": "string"
                  },
                  "reason": {
                    "description": "Why an alert is or is not on offer.",
                    "enum": ["eligible", "lottery_period", "out_of_season", "closed", "no_quota_now", "lottery_draw_only", "not_sold_online", "not_tracked"]
                  }
                },
                "required": ["available", "pageUrl", "reason"],
                "type": "object"
              },
              "amenities": {
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "bookingSystem": {
                "type": "string"
              },
              "bookingUrl": {
                "type": ["string", "null"]
              },
              "checkedAt": {
                "type": "string"
              },
