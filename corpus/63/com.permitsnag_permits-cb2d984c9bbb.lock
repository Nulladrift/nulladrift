              },
              "id": {
                "type": "string"
              },
              "maxStayNights": {
                "type": ["integer", "null"]
              },
              "name": {
                "type": "string"
              },
              "pageUrl": {
                "type": "string"
              },
              "priceRange": {
                "additionalProperties": false,
                "properties": {
                  "max": {
                    "type": ["string", "null"]
                  },
                  "min": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["max", "min"],
                "type": ["object", "null"]
              },
              "provider": {
                "type": "string"
              },
              "region": {
                "description": "Outside the US, the province, state or territory as a slug.",
                "type": ["string", "null"]
              },
              "releaseRule": {
                "additionalProperties": false,
                "description": "When sites go on sale, from the listing itself.",
                "properties": {
                  "agencyQuote": {
                    "type": ["string", "null"]
                  },
                  "daysAhead": {
                    "type": ["number", "null"]
                  },
                  "kind": {
                    "type": "string"
                  },
