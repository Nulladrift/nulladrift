                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bookingSystem": {
                      "type": "string"
                    },
                    "country": {
                      "description": "The country: US, CA (Canada), NZ (New Zealand) or AU (Australia).",
                      "enum": ["US", "CA", "NZ", "AU"]
                    },
                    "depth": {
                      "description": "site_level: our checks count individual sites. campground_level: the booking system reports the campground as a whole.",
                      "enum": ["site_level", "campground_level"]
                    },
