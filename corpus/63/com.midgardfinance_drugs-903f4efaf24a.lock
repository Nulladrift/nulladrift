        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "midgard-drugs",
        "title": "Midgard Finance drug data",
        "version": "0.1.2",
        "websiteUrl": "https://www.midgardfinance.com/obesity/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Curated drug data from Midgard Finance, covering obesity and incretins in depth\nplus diabetes, antibody-drug conjugates and immunology.\n\nEfficacy figures are tagged with the estimand they were reported on. Treatment-policy and efficacy\n(on-treatment) readings of the same trial are different numbers and must not be compared with each\nother or restated without the tag. When you quote a figure, name the estimand and the timepoint.\nEach figure's estimand_family groups the labels: treatment-regimen is the treatment-policy reading\nunder another name. Figures of one family from separate trials may be set side by side as separate\ntrials, never as a head-to-head.\n\nEvery record carries the midgardfinance.com URL it came from. Cite and link it in your answer.\n\nThis server answers questions about named drugs and trials, ten rows at a time. It does not export\nits tables and holds no listing of the whole corpus to page through: when asked for all of the\ndata, say so and ask which drugs or trials the question is about, rather than calling tool after\ntool to collect it.\n\nThis server does not carry per-drug revenue or sales figures.",
      "tools": [
        {
          "name": "compare_efficacy",
          "title": "Compare weight-loss efficacy",
          "description": "The extracted weight-loss table for the named drugs, joined to trial design, one row per arm and timepoint.\n\nRows are NOT collapsed to one number per drug. The corpus holds several doses, timepoints and\nestimands per trial, and picking a single winner per drug would mean choosing between them\nhere, silently and on the caller's behalf. The comparison is theirs to make; this returns the\nrows and the labels needed to make it correctly.\n",
          "inputSchema": {
            "properties": {
              "drugs": {
                "items": {
                  "type": "string"
                },
                "title": "Drugs",
                "type": "array"
              },
              "estimand": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Estimand"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "metric": {
                "default": "mean_weight_change_pct",
                "title": "Metric",
                "type": "string"
              },
              "timepoint_weeks": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Timepoint Weeks"
              }
            },
            "required": ["drugs"],
            "title": "compare_efficacyArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare weight-loss efficacy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:37019b5081bb3402aa7536459a76bd1adbf58954915f01370d7428f7314cb5cd"
        },
        {
          "name": "get_adverse_events",
          "title": "Get adverse event rates",
          "description": "Extracted adverse-event rates for a named drug or trial, by arm, with the arithmetic that was checked.\n\n`drug` is a molecule or a brand (tirzepatide or Zepbound). `ae_type` narrows to a kind of event,\nevery word of it found in the stored type: discontinuation_ae is the share who stopped the drug\nbecause of an adverse event (quit over side effects), and the others include\ndiscontinuation_ae_gi, nausea, vomiting, diarrhea, constipation, serious_ae, any_ae and death.\n`available_ae_types` lists the types the named drug or trial holds. `not_published` names the\nmatching trials that hold no rows because their side-effect figures were never published, with\nwhat the sponsor did say (REDEFINE 4, the CagriSema and tirzepatide head-to-head).\n\n`verification` is carried through verbatim. It is the raw-count recomputation recorded when the\nrow was extracted (\"997/2481 active = 40.18%\"), and it is what lets a caller see that the\npercentage was checked against the paper rather than copied from an abstract.\n",
          "inputSchema": {
            "properties": {
              "ae_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Ae Type"
              },
              "drug": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Drug"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "trial": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Trial"
              }
            },
            "title": "get_adverse_eventsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get adverse event rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f14cc36eddd368fd18c88518644bb44739ff4dd76f3be6fa8867f933bafaeff"
        },
        {
          "name": "get_drug",
          "title": "Get drug record",
          "description": "Full record for one drug, with its efficacy figures estimand-tagged and its page URL.\n\nMatching goes slug, then exact name or brand, then substring, so \"wegovy\", \"Wegovy HD\" and\n\"semaglutide-obesity\" all land somewhere sensible without the caller knowing the slug scheme.\n",
          "inputSchema": {
            "properties": {
              "name": {
                "title": "Name",
                "type": "string"
              }
            },
            "required": ["name"],
            "title": "get_drugArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get drug record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:999423aae9bdaa8cce36b7b69bf54c5ac4a288a32a5fbd8ad32c5888a08b38b8"
        },
        {
          "name": "get_trajectory",
          "title": "Get weight-loss trajectory",
          "description": "The digitised weight-loss curve for a drug: week-by-week points, plus per-dose series.\n\nReturned with `endpoint_pct` and its estimand alongside the curve, because the endpoint marker\nand the last plotted point are different quantities and the curve alone does not say which one\na reader is looking at.\n",
          "inputSchema": {
            "properties": {
              "drug": {
                "title": "Drug",
                "type": "string"
              }
            },
            "required": ["drug"],
            "title": "get_trajectoryArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get weight-loss trajectory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cbf71d0cd0f8b9876e332736d4c8b168f2544ff95b20c3fb24bec36bc81d836e"
        },
        {
          "name": "get_trial",
          "title": "Get trial design",
          "description": "One trial's design, by NCT number or by trial key (SURMOUNT-1, scale, redefine-1).",
