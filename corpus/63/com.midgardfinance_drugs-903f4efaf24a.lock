        },
        {
          "name": "list_catalysts",
          "title": "List upcoming catalysts",
          "description": "Upcoming and recent readouts, approvals and trial starts across sponsors, oldest first.\n\nFor what comes next, pass from_date as today and pending_only=true, and kind=\"readout\" for trial results;\nan event whose outcome is set has already happened.\n\nfrom_date and to_date take YYYY-MM-DD, YYYY-MM, YYYY-Qn or YYYY. An event is dated as precisely as its sponsor\nguided it (a day, a month, a quarter or a year), and it is kept when that period overlaps the window, so an event\nguided to 2026-Q4 is still listed from 2026-11-10.\n\narea: \"obesity\" or \"diabetes\". kind: \"readout\" (trial results, including cardiovascular outcomes trials),\n\"regulatory\" (submissions, decisions, coverage and launches), \"trial_start\" or \"company\" (earnings, conferences,\ninvestor days). pending_only: only events with no outcome recorded yet.\n",
          "inputSchema": {
            "properties": {
              "area": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Area"
              },
              "from_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "From Date"
              },
              "kind": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Kind"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "pending_only": {
                "default": false,
                "title": "Pending Only",
                "type": "boolean"
              },
              "tier": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Tier"
              },
              "to_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "To Date"
              }
            },
            "title": "list_catalystsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List upcoming catalysts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4610c81527bbf964e1a81766bb04af79997ce70e5db8d82f4e592378ed2b6de4"
        },
        {
          "name": "list_news",
          "title": "List latest news",
          "description": "The latest news the site's hubs print, newest first, with date, headline, source and page.\n\nUse it for \"what is new\" and \"latest announcement\" questions. It holds the eight newest items\nof each hub: obesity, Novo Nordisk and Eli Lilly. `company` matches the hub (Novo Nordisk,\nEli Lilly) or the drug's sponsor, `drug` a drug or brand in the item or its headline, `query`\na word in the headline (MASH, approval). `kind` on a Novo hub item says what it is (clinical,\nregulatory, corporate, results, competitor: a rival's event that bears on Novo). An event older\nthan a hub's eight newest is not here: say so rather than guess. A headline's efficacy figure is\non the estimand the headline names, if any, and is not comparable with one on another.\n",
          "inputSchema": {
            "properties": {
              "company": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Company"
              },
              "drug": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Drug"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Query"
              }
            },
            "title": "list_newsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List latest news"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3bec059f3f789f7d06c7f26dffea7bd87842dd999ffd7d09367f42dc3d23d60a"
        },
        {
          "name": "search_drugs",
          "title": "Search drugs",
          "description": "Search the drug boards by free text and by field.\n\n`query` also matches the other indications a molecule is pursuing, from the indications matrix\n(MASH, CKD, sleep apnea, heart failure, CV outcomes, type 2 diabetes, and their trial names),\nso \"MASH\" finds every cardiometabolic drug with a MASH programme and its status. `sponsor`\nalso matches a partner the matrix names (survodutide is licensed from Zealand Pharma to\nBoehringer Ingelheim). Each result carries its `indications` row, or null for a drug the\nmatrix does not cover (cancer and immunology drugs, and MASH-only drugs, are not in it).\n",
          "inputSchema": {
            "properties": {
              "area": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Area"
              },
              "limit": {
                "default": 10,
