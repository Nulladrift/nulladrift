              }
            ]
          },
          "digest": "sha256:739c4832799caf28958dc4959a0d3814c81d9e8e5defa48b615d1fceaa4f853e"
        },
        {
          "name": "request_site_scan",
          "title": "Ask for a whole-site scan",
          "description": "A whole-site scan reads a representative sample of a site and needs a person with a Bot Appétit account, and an agent never creates one. This returns exactly what the person must do, in order: connect this agent to their account (a one-time approval in their browser), after which start_site_scan, site_scan_status, list_sites and the other account tools work. For a single page, use scan_page instead, which is free and needs no account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "The site the person wants scanned, if you know it. It is used only to word the steps.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ask for a whole-site scan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:9653dbcb15f86bffa41dfa609e8491803b23b1e6637f482a091143f7c66e75f6"
        },
        {
          "name": "scan_page",
          "title": "Scan a page",
          "description": "Check one web page for AEO, SEO and performance: can a machine consume it? Returns the findings by check and the report link. If the exact page was scanned in the last 24 hours the stored result is returned at no cost; set fresh to scan again. A page that blocks our scanner is returned as blocked with no score, because it cannot pass. Free, no account needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "fresh": {
                "description": "Set true to always run a new scan instead of returning a stored result under 24 hours old. A new scan uses the stricter new-scan rate limit.",
                "type": "boolean"
              },
              "url": {
                "description": "The page to check, such as https://example.com/pricing. A bare domain works.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Scan a page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:9b9c7fc4446e313035acc0e97c6ec6a518a04f32655e85a2ba383039a7138424"
        },
        {
          "name": "set_pins",
          "title": "Pin or unpin pages",
          "description": "Pin or unpin pages on one of the signed-in person's sites. Pinned pages are scanned in every site scan of that site and count toward its score; up to 25, on the site itself. Give pin and/or unpin lists. Returns each address's outcome and the pins now in place; they apply from the next scan.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "host": {
                "description": "The site, as list_sites gives it.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "pin": {
                "description": "Page addresses to pin. They must be on the site (or its www/apex twin).",
                "items": {
                  "maxLength": 2048,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 25,
                "type": "array"
              },
              "unpin": {
                "description": "Page addresses to stop pinning.",
                "items": {
                  "maxLength": 2048,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 25,
                "type": "array"
              }
            },
            "required": ["host"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Pin or unpin pages"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:201ce45d34adc8a975274fe16b284b899c4c9a46ace6a26f2d59eb1830013c3e"
        },
        {
          "name": "set_rescan_settings",
          "title": "Set monthly re-scans",
          "description": "Turn the signed-in person's monthly re-scans of their sites on or off, and the email of each result on or off. Leave a field out to keep it as it is; call with no fields to read the current settings. The settings belong to the account, not to one site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "email": {
                "description": "Email the person the result of each monthly re-scan. Leave out to keep the current setting.",
                "type": "boolean"
              },
              "rescan": {
                "description": "Re-scan this account's sites automatically each month. Leave out to keep the current setting.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set monthly re-scans"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:af91bab5500ba7dda5874d9f723fe9935e9c1d4daa598b1c7b2c95469a49af2c"
        },
        {
          "name": "share_site_scan",
          "title": "Share a site scan",
          "description": "Create or stop the unlisted share link for one of the signed-in person's site scans. Site scans are private by default; a link lets anyone who holds it read that one scan (not the person's other scans) and stays valid until stopped. Only create a link when the person has asked to share the scan, and tell them who can open it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "action": {
                "description": "\"create\" makes an unlisted link anyone holding it can open; \"stop\" turns it off so the link stops working.",
                "enum": ["create", "stop"],
                "type": "string"
              },
              "job_id": {
                "description": "The site scan to share or stop sharing.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["action", "job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Share a site scan"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:b0d21be0faeaff16eec0688eb27315d52bbcfce76f5f0bcbba4aef14cfe50cab"
        },
        {
          "name": "site_history",
          "title": "Read one site over time",
          "description": "Read one of the signed-in person's sites over time: every site scan of it newest first with the score and the change since the previous scored scan (a change across a scoring update or different pinned pages is marked, not passed off as the site's own), the pinned pages, and the monthly re-scan settings.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "host": {
                "description": "The site, as list_sites gives it: for example www.example.com. An address is accepted too.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["host"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one site over time"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:27662b45a83c799830787d04d0f712fecb7068b23eaae95104bf95b7685479d1"
        },
        {
          "name": "site_scan_status",
          "title": "Read a site scan",
          "description": "Read one of the signed-in person's site scans: whether it is still running, and once it has finished the score, the checks that failed, the category scores and the pages it covered, each page with a link to its own full report. Only the account that ran the scan can read it. A scan that is still running is normal, not an error. A full scan of a large site usually takes about 2 and a half minutes and nine in ten finish within about 5 and a half minutes; a site of ten pages or fewer usually finishes in under half a minute. Do not poll: the first answer asks for one check after 30 seconds, and if the scan is still running the next answer says how long to wait. Read check_again_after_seconds in the answer and wait that long before the next check.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "job_id": {
                "description": "The job_id start_site_scan returned, or one from list_sites or site_history.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a site scan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:33e854988e6d57475c72d15c42cdc5462ac5a83405bd36f4198e4efbdae6575b"
        },
        {
          "name": "start_site_scan",
          "title": "Start a whole-site scan",
          "description": "Start a whole-site scan for the signed-in person's account: Bot Appétit reads a representative sample of the site (not every page) and scores it. Needs the person to have authorised this connection. It returns a job_id straight away and the scan runs in the background, so read it with site_scan_status. A full scan of a large site usually takes about 2 and a half minutes and nine in ten finish within about 5 and a half minutes; a site of ten pages or fewer usually finishes in under half a minute. Do not poll: the first answer asks for one check after 30 seconds, and if the scan is still running the next answer says how long to wait. Read check_again_after_seconds in the answer and wait that long before the next check. The result is private to their account until they choose to share it. For one page, use scan_page, which needs no account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "site": {
                "description": "The site to scan: a domain such as example.com, a sitemap URL, or a list of pages on ONE site, one per line.",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a whole-site scan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:2ff169da3ea255e5b65d32db2572cb1b6e56dfadde6a3f94e9919901adc47557"
        }
      ],
      "digest": "sha256:03c59028bcb51e7e8ca0981bc1312bbe56e55262f94b648f78fa8fc0fd292d3a"
    }
  }
