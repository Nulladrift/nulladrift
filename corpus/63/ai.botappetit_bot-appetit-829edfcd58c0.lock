              }
            ]
          },
          "digest": "sha256:597a39434fd23479445b61facb15fa90bda06a6e7cfc3ccbcb82379ec989cdad"
        },
        {
          "name": "list_sites",
          "title": "List the person's sites",
          "description": "List the sites the signed-in person follows in Bot Appétit, newest activity first, each with its latest site-scan score, the change since the scan before, and the trend. Use a host from here with site_history, set_pins and the other site tools.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
