{
  "lockfileVersion": 2,
  "subjects": {
    "com.ski-france/agent-search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://en.ski-france.com/api/agent/v1/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ski-france.com Agent MCP",
        "version": "1.1.0",
        "description": "Search about 9,000 ski apartments with advanced filters, one- or two-week prices and availability, plus destinations and ski passes.",
        "websiteUrl": "https://en.ski-france.com/"
      },
      "capabilities": {
        "completions": {},
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use this MCP server for ski-france.com to search apartment-level ski accommodation with structured amenities and advanced filters, compare one- or two-week prices, specials, availability and bookability, discover destinations and ski pass prices, and route booking decisions to returned canonical website URLs.",
      "tools": [
        {
          "name": "get_accommodation_detail",
          "title": "Get accommodation detail",
          "description": "Return accommodation-level context, apartment list, images, detail information and weekly availability for one public accommodation. Use this after search results to inspect all apartments belonging to one accommodation and to explain location, descriptions and detail notes. For price and bookability comparison for a specific week, prefer search_apartments with weekId.",
          "inputSchema": {
            "properties": {
              "accommodationId": {
                "description": "Accommodation id from search results or list_accommodations.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["accommodationId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:56b2a552ff8b0f2df3c7c18a6e7afbbb56409ee08fcbca904eaa3dc08f11ac47"
        },
        {
          "name": "get_search_options",
          "title": "Get search options",
          "description": "Return the current structured search vocabulary before building a search: arrival weeks, one- or two-week durations, amenities, advanced apartment filters, price sorting, entity types and supported language subdomains. Use this first when you need valid parameter values.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f72d37ab338f8403b3040de954a1bd4f1cc9b59f91aa1f41a5b64503d3d9066b"
        },
        {
          "name": "get_ski_area_detail",
          "title": "Get ski area detail",
          "description": "Return public ski area information, facts, images, ski maps and related ski resorts. Use this for destination context and recommendations, not for apartment prices or availability; use search_apartments for live week-specific accommodation results.",
          "inputSchema": {
            "properties": {
              "skiAreaId": {
                "description": "Ski area id from list_ski_areas.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["skiAreaId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3604e8b28422615edaa698be9b37e0c781f5884237136bce8032423b844d0d25"
        },
        {
          "name": "get_ski_pass_prices",
          "title": "Get ski pass prices",
          "description": "Return ski pass weeks, durations and price tables with listPrice, discount and discountedPrice. Restrict by skiAreaId, skiResortId or accommodationId for destination-specific ski pass discovery. A global request without destination scope must provide weekId to avoid an overly broad price matrix. Omit durationDays to discover available durations with prices.",
          "inputSchema": {
            "properties": {
              "accommodationId": {
                "default": null,
                "description": "Optional accommodation id from search_apartments, list_accommodations or get_accommodation_detail. Uses the accommodation ski resort.",
                "minimum": 1,
                "type": "integer"
              },
              "durationDays": {
                "default": null,
                "description": "Optional ski pass duration in days. Omit it to return all available durations with prices. Default website duration is 6 days.",
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "description": "Results per page. Maximum is 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Result page, starting at 1.",
                "minimum": 1,
                "type": "integer"
              },
              "skiAreaId": {
                "default": null,
                "description": "Optional ski area id from list_ski_areas.",
                "minimum": 1,
                "type": "integer"
              },
              "skiResortId": {
                "default": null,
                "description": "Optional ski resort id from list_ski_resorts.",
                "minimum": 1,
                "type": "integer"
              },
              "weekId": {
                "default": null,
                "description": "Optional fixed weekly winter arrival date id. Required when no skiAreaId, skiResortId or accommodationId is provided. Omit it only for destination-scoped ski pass discovery.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:56128bf584aae15df72d67e9ec8a1a8c31ca69f09ce83653d45eba5c535cd92e"
        },
        {
          "name": "get_ski_resort_detail",
          "title": "Get ski resort detail",
          "description": "Return public ski resort information, location, facts, images and ski maps. Use this for explaining and comparing destinations, not for apartment prices or availability; use search_apartments for live week-specific accommodation results.",
          "inputSchema": {
            "properties": {
              "skiResortId": {
                "description": "Ski resort id from list_ski_resorts.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["skiResortId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3958436330f58fe3f3d3394d135c8af45899635aa89053709d0788857cd749b2"
        },
        {
          "name": "list_accommodations",
          "title": "List accommodations",
          "description": "List public accommodations for catalogue discovery, optionally filtered by ski area, ski resort or district ids from the destination tools. This list intentionally has no prices, availability or bookability. Use search_apartments with weekId for price and availability comparison, and get_accommodation_detail after a result for accommodation context.",
          "inputSchema": {
            "properties": {
              "districtId": {
                "default": null,
                "description": "Optional district id from accommodation or search-scope data.",
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 100,
                "description": "Results per page. Maximum is 200.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Result page, starting at 1.",
                "minimum": 1,
                "type": "integer"
              },
              "skiAreaId": {
                "default": null,
                "description": "Optional ski area id from list_ski_areas.",
                "minimum": 1,
                "type": "integer"
              },
              "skiResortId": {
                "default": null,
                "description": "Optional ski resort id from list_ski_resorts.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:89ac71f91d847aa93c0c7ae2944d6c5a09859c2529888be66b5d51c9d8edbbe5"
        },
        {
          "name": "list_ski_areas",
          "title": "List ski areas",
          "description": "List public ski areas in France for destination discovery and comparison. A ski area groups one or more ski resorts and can be used as a destination scope for apartment search. Parent regions only bundle ski areas and do not have a separate detail endpoint.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fe38bd44b37c0d887d627c3003b64ccf8eee2f9eae33377248d74aa051d68a0b"
        },
        {
          "name": "list_ski_resorts",
          "title": "List ski resorts",
          "description": "List public ski resorts in France for destination discovery, optionally filtered by ski area id. A ski resort is the local destination or village/resort used for accommodation search scopes and resort detail pages.",
          "inputSchema": {
            "properties": {
              "skiAreaId": {
                "default": null,
                "description": "Optional ski area id from list_ski_areas.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a27bacb89d43006c337f6ec18770b72642ca0123595684283c90f44ad3247388"
        },
        {
          "name": "resolve_search_keywords",
          "title": "Resolve search keywords",
          "description": "Resolve a user phrase into concrete search-scope candidates such as parent regions, ski areas, ski resorts, districts or accommodations. Use the returned entityType and entityId in search_apartments when you want to restrict a later apartment search to a precise destination or accommodation. Broad searches can skip this and use keywords directly. Parent-region scopes are only for restricting searches, not for destination detail lookup.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Search phrase to resolve into possible destination or accommodation scopes, for example \"Val Thorens\", \"3 Vallees\" or an accommodation name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb12e53e1e0a34dbc6c228761cd104b625f6deea4e68d97033dbfe0d82f92d2a"
        },
        {
          "name": "search_apartments",
          "title": "Search ski apartments",
          "description": "Main apartment-level search for winter ski accommodation in French ski areas and ski resorts. Results are apartments, not whole accommodations. Put destination, ski area, ski resort or accommodation names into keywords. Use structured parameters for amenities, rooms, living space, slope distance, ski area size, parent areas, accommodation category, chalet type, pets and price sorting. Put the traveller count into partySize, not keywords. Use weekId and durationWeeks for one- or two-week price, availability, bookability and special-discount data.",
          "inputSchema": {
            "properties": {
              "accommodationCategories": {
                "default": null,
                "description": "Premium and luxury accommodation categories from get_search_options.",
                "items": {
                  "enum": ["premium", "luxury"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "accommodationType": {
                "default": null,
                "description": "Optional accommodation type.",
                "enum": ["chalet"],
                "type": "string"
              },
              "amenities": {
                "default": null,
                "description": "Amenity values from get_search_options.",
                "items": {
                  "enum": ["sauna", "whirlpool", "steam-room", "pool", "chimney"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "areas": {
                "default": null,
                "description": "Parent-area values from get_search_options.",
                "items": {
                  "enum": ["northern-alps", "southern-alps", "pyrenees", "switzerland"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "durationWeeks": {
                "default": 1,
                "description": "Stay duration in weeks. Two weeks requires weekId.",
                "enum": [1, 2],
                "type": "integer"
              },
              "entityId": {
                "default": null,
                "description": "Optional precise search-scope entity id from resolve_search_keywords. Use together with entityType.",
                "minimum": 1,
                "type": "integer"
              },
              "entityType": {
                "default": null,
                "description": "Optional precise search-scope entity type from resolve_search_keywords. Use together with entityId to restrict results to a resolved parent region, ski area, ski resort, district or accommodation.",
                "enum": ["area", "region", "resort", "district", "accommodation"],
                "type": "string"
              },
              "keywords": {
                "default": null,
                "description": "Natural-language destination or accommodation keywords, for example a ski resort, ski area, accommodation name or free text. Use the structured filter parameters for amenities and property requirements.",
                "maxLength": 120,
                "type": "string"
              },
              "maxDistanceToSlopeMeters": {
                "default": null,
                "description": "Maximum distance to piste, lift or gondola in metres.",
                "enum": [100, 400],
                "type": "integer"
              },
              "minBathrooms": {
                "default": null,
                "description": "Minimum number of bathrooms. Value 8 means 8 or more.",
                "enum": [1, 2, 3, 4, 5, 6, 7, 8],
                "type": "integer"
              },
              "minBedrooms": {
                "default": null,
                "description": "Minimum number of bedrooms. Value 8 means 8 or more.",
                "enum": [1, 2, 3, 4, 5, 6, 7, 8],
                "type": "integer"
              },
              "minSquareMeters": {
                "default": null,
                "description": "Minimum living space in square metres.",
                "enum": [20, 30, 40, 60, 80, 100, 150, 200],
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Result page, starting at 1.",
                "minimum": 1,
                "type": "integer"
              },
              "partySize": {
                "default": null,
                "description": "Traveller count. Results are restricted to apartments whose capacity is at least this party size within the matching website occupancy bucket.",
                "minimum": 1,
                "type": "integer"
              },
              "pets": {
                "default": null,
                "description": "Pet policy.",
                "enum": ["pets-allowed", "pets-not-allowed"],
                "type": "string"
              },
              "priceSort": {
                "default": "default",
                "description": "Result sorting. Status remains the primary order, followed by price and party-size category.",
                "enum": ["default", "price-desc", "price-asc"],
                "type": "string"
              },
              "skiAreaSizes": {
                "default": null,
                "description": "Ski-area size categories from get_search_options.",
                "items": {
                  "enum": ["small", "medium", "large"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "weekId": {
                "default": null,
                "description": "Fixed weekly winter arrival date id from get_search_options. Required for week-specific price, availability, bookabilityStatus and special-discount comparison.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:47fd0e31368755be302d73f8ec6ea43755febd344581adc3b190380296014de3"
        }
      ],
