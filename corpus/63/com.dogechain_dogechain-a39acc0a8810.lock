        {
          "name": "get_transaction",
          "title": "Transaction, explained",
          "description": "A Dogecoin transaction in plain English: who paid whom, how much, the likely change, the fee, its confirmations, every input and output, and any address-poisoning (lookalike) warning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
