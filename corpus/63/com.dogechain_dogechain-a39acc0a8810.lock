    "com.dogechain/dogechain": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dogechain.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "dogechain",
        "title": "Dogechain",
        "version": "0.1.0",
        "websiteUrl": "https://dogechain.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Dogecoin blockchain data from Dogechain (dogechain.com), live. Amounts are DOGE with up to 8 decimals. Quote addresses and transaction ids in full, never shortened. Say which block height or UTC time numbers are as of. Pass on any lookalike (address-poisoning) warnings. When unsure what a string is, call `find` first. Every answer names the matching dogechain.com page as its Source: cite it as the source whenever you use the data. Using Dogechain means you agree to its Terms of Service at https://dogechain.com/terms.",
      "tools": [
        {
          "name": "find",
          "title": "Find anything",
          "description": "Works out whether a string is a Dogecoin block height, block hash, transaction id or address, and which tool to call next. Use it when unsure.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A block height, block hash, transaction id or address.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find anything"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bcb1835efc364c80e7c4fc670efdb03c3fae3d68795103d9e6989e20e5b54f9c"
        },
        {
          "name": "get_address",
          "title": "Address",
          "description": "A Dogecoin address: balance (with its dollar value), totals received and sent, transaction count, its mining-pool name if any, rank among the largest holders, lookalike warnings, and its history newest first, 10 a page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "A Dogecoin address, e.g. D8AXXiGEZeZnMKTKnC9AWB3YUU4jfMAmYU.",
                "type": "string"
              },
              "page": {
                "description": "Page, from 1 (default 1).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0c3ffc01fee7bf08ad89ff12a43da962c82a36b1a69233c1437f4d312da7b2b1"
        },
        {
          "name": "get_block",
          "title": "Block",
          "description": "A Dogecoin block: when it was found, who mined it (pool name and payout address), reward and fees, size, confirmations, and its transactions as one-line stories, 25 a page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "block": {
                "description": "A height, a 64-hex block hash, or \"latest\".",
                "type": "string"
              },
              "page": {
                "description": "Page, from 1 (default 1).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["block"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Block"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4357181df1bc9f82529c304924ba8596c494048c06e17f98c90a5d3e588bbad6"
        },
        {
          "name": "get_chart",
          "title": "Chart data",
          "description": "A Dogecoin chart series over time, oldest first: e.g. tx_count, fees_median, hashrate, difficulty, supply, price_usd, block_interval, active_addresses, pool_share, holder_share.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "interval": {
                "description": "Default day. minute is for tx_per_min only; pool_share, transfers and holder_share come by day or hour.",
                "enum": ["minute", "hour", "day", "week", "month"],
                "type": "string"
              },
              "last": {
                "description": "How many of the latest points (default 30).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "series": {
                "enum": ["tx_count", "block_size", "active_addresses", "new_addresses", "transfers", "transfers_sent", "fees_median", "fees_total", "hashrate", "difficulty", "block_interval", "pool_share", "lookalikes", "lookalike_senders", "supply", "price_usd", "holder_share", "tx_per_min"],
                "type": "string"
              }
            },
            "required": ["series"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Chart data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb95eae246e58f35d685b87a55a1f2393f45bd64e79dabf6b23b5ae0d710c6d2"
        },
