        {
          "name": "get_supply",
          "title": "Supply",
          "description": "How many DOGE exist, how many are added each day and year (10,000 per block, no maximum), and inflation now and ahead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
