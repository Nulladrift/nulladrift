{
  "lockfileVersion": 2,
  "subjects": {
    "com.invokera/book-search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://invokera.com/r/book-search"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "invokera-book-search",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Tools for Book Search (Open Library). Served by Invokera on behalf of openlibrary.org.",
      "tools": [
        {
          "name": "search_authors",
          "description": "Search authors by name. Returns author records (name, birth date, top work, work count) matching the query. Returns: Matching author records..",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "q": {
                "description": "Author name to search for, e.g. \"Ursula K. Le Guin\".",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:36d7c5480dac6e78a2dbfec852b0de96c344c82421894179b7f8e3f87e9d471c"
        },
        {
          "name": "search_books",
          "description": "Search books by keyword. Full-text search across titles, authors and subjects. Keep \"fields\" small to avoid huge responses. Returns: Matching book records..",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "default": "title,author_name,first_publish_year,key",
                "description": "Comma-separated list of fields to include in each result. A compact default keeps responses small.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return. Defaults to 10.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Search keywords, e.g. a title, author or subject.",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:866325f4fbf6d91a055232c7749973c6853fd08fa0825979f4419fa089849a05"
        }
      ],
      "digest": "sha256:040992054f8e7acc7966920a48cf82c715c40a641ce77dcde6017c44969ba3ed"
    }
  }
}
