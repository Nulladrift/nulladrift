      },
      "instructions": "Blixtworks provides 63 tools for AI agents, billed per call in USDC on Base ($0.005–$0.03). No account, no signup, no API key, and failed requests are never charged. Groups: vision (image categorization, captioning, OCR, CLIP embeddings), images (resize, crop, transform, palette, EXIF, QR), text (hashing, regex, diff, language detection, statistics), data formats (JSON/YAML/CSV/XML/Markdown, JWT, RSS, PDF), web (HTTP headers, TLS certificates, WHOIS, DNS, robots.txt, page metadata, email validation), convert/validate (units, currency, timezones, cron, IBAN, phone numbers, colours) and read-only blockchain lookups. Paid tools run when you pass paymentTx — a hash of a USDC payment you made from your own wallet. Call how_to_pay for the exact steps. list_tools and try_sample are free, and every non-vision tool also serves 5 free calls per caller per day over plain HTTP at the same URLs — see how_to_pay.",
