{
  "lockfileVersion": 2,
  "subjects": {
    "au.com.byronwebstudio.linepref/linepref": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://linepref.byronwebstudio.com.au/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "linepref",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Before phoning any business, call check_before_call (or check_many for a list). If advice is use_link, use the link instead of calling. If advice is do_not_call, do not call. After every call, call report_call_outcome. If the called party asks to stop calls, call record_opt_out.",
      "tools": [
        {
          "name": "check_before_call",
          "title": "Check a business number before calling",
          "description": "Call this BEFORE placing a phone call to a business. It often saves the call entirely: in testing, 41% of real businesses could be handled through an online booking link instead of a call. Returns whether the business can be booked or reached online instead (with the link), whether it has asked not to receive AI calls, whether this caller has been opted out, and pooled call data from other callers (answer rate, hold time, phone-menu path, best hours). advice is one of: use_link, do_not_call, call, unknown.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO country code, only needed for national-format numbers (US, CA, AU, NZ, GB, IE)",
                "type": "string"
              },
              "name": {
                "description": "Business name, if known",
                "type": "string"
              },
              "number": {
                "description": "Phone number, E.164 preferred (+15125550100)",
                "type": "string"
              },
              "website": {
                "description": "The business's website, if known. Enables the online-booking check.",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Check a business number before calling"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8146858da79df123ba6b49365373e1023010328bc77ff68c105b976d16682d8f"
        },
        {
          "name": "check_many",
          "title": "Check up to 100 business numbers at once",
          "description": "Batch version of check_before_call for ring-around tasks (for example, finding which of 40 restaurants has a table). Use it before dialling a list of businesses.",
          "inputSchema": {
            "properties": {
              "items": {
                "description": "The businesses to check, one entry per phone number (1 to 100 entries)",
                "items": {
                  "properties": {
                    "country": {
                      "description": "ISO country code, only needed when the number is in national format (US, CA, AU, NZ, GB, IE)",
                      "type": "string"
                    },
                    "name": {
                      "description": "Business name, if known",
                      "type": "string"
                    },
                    "number": {
                      "description": "Phone number of the business, E.164 preferred (+15125550100)",
                      "type": "string"
                    },
                    "website": {
                      "description": "The business's website, if known. Enables the online-booking check.",
                      "type": "string"
                    }
                  },
                  "required": ["number"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Check up to 100 business numbers at once"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:abe829434e726712fc86e01e27619b42074d89b0281e946c09cd16f256887238"
        },
        {
          "name": "record_opt_out",
          "title": "Record an opt-out request from the called party",
          "description": "Call this when the called party asks to stop receiving calls (by voice or key press). scope \"caller\" stops calls from this caller; scope \"all\" records that they asked to stop AI assistant calls from all participating callers. Honour it within ten business days.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO country code, only needed when the number is in national format (US, CA, AU, NZ, GB, IE)",
                "type": "string"
              },
              "number": {
                "description": "Phone number of the party who asked to stop calls, E.164 preferred (+15125550100)",
                "type": "string"
              },
              "scope": {
                "description": "\"caller\" = stop calls from this caller only; \"all\" = stop AI assistant calls from every participating caller",
                "enum": ["caller", "all"],
                "type": "string"
              }
            },
            "required": ["number", "scope"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Record an opt-out request from the called party"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:61e0d729784130728d45cd3f0d2e78f82702d6da2e5bb07adbde8e5e4dac33f1"
        },
        {
          "name": "report_call_outcome",
          "title": "Report how a call went",
          "description": "Call this AFTER a phone call to a business ends. Sends only the number and a fixed outcome code (never a transcript, recording or names). Reporting outcomes is what unlocks pooled call data on later checks.",
          "inputSchema": {
            "properties": {
              "ai_answered": {
                "description": "True if an AI or automated receptionist answered",
                "type": "boolean"
              },
              "code": {
                "description": "What happened on the call. Use the single code that fits best, e.g. booked, connected_human, voicemail, no_answer, refused_ai.",
                "enum": ["connected_human", "connected_ai", "voicemail", "no_answer", "busy", "wrong_number", "closed", "refused_ai", "booked", "info_obtained", "opted_out"],
                "type": "string"
              },
              "country": {
                "description": "ISO country code, only needed when the number is in national format (US, CA, AU, NZ, GB, IE)",
                "type": "string"
              },
              "hold_seconds": {
                "description": "Seconds spent waiting before a person or system answered the request",
                "maximum": 3600,
                "minimum": 0,
                "type": "integer"
              },
              "local_hour": {
                "description": "Hour of day at the business's location",
                "maximum": 23,
                "minimum": 0,
                "type": "integer"
              },
              "menu_path": {
                "description": "Keys pressed to reach a person, e.g. \"2,1\". Digits, * # w and commas only.",
                "type": "string"
              },
              "number": {
                "description": "Phone number that was called, E.164 preferred (+15125550100)",
                "type": "string"
              }
            },
            "required": ["code", "number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Report how a call went"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2f0eccfdabddc8ecc89a9179ac3e3b12d8c14a25aca6f08679c3ba9f2447d488"
        }
      ],
      "digest": "sha256:c8accf27ec545587513736e8a58026a7db7b2c021a50ba283a880031e325e286"
    }
  }
}
