{
  "lockfileVersion": 2,
  "subjects": {
    "com.injurymgmt/impairment-calculator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.injurymgmt.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "InjuryMgmt Impairment Calculator",
        "version": "0.1.0",
        "websiteUrl": "https://injurymgmt.com/california-dwc-impairment-calculator/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Calculate informational AMA Guides Fifth Edition medical whole-person impairment (WPI) from clinician-confirmed, de-identified structured inputs for one injury. Use only the listed methods. Ask for missing values, including an explicitly clinician-selected DRE category and WPI. Never infer ratings or ask for identity details, notes, or files. Present the status, result and references. Identify any partial subtotal as partial and leave unresolved findings for clinician review.",
      "tools": [
        {
          "name": "calculate_medical_wpi",
          "title": "Calculate medical whole-person impairment",
          "description": "Use clinician-confirmed AMA Guides Fifth Edition inputs for a single injury. Supports spine DRE and active mobile shoulder, elbow/forearm, and wrist range of motion. For spine DRE, enter the category and whole-number WPI already selected by the clinician. For joint motion, enter side and all listed angles in degrees. Use the clinician’s selected valid measurements. Return informational medical WPI, status and source references for clinician review. Accepts only de-identified structured findings. For other methods, use the InjuryMgmt web calculator.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clinicianConfirmed": {
                "const": true,
                "description": "Explicit confirmation that a clinician selected the DRE ratings and/or verified the active ROM findings for this injury. Ask before calling if confirmation is missing.",
                "type": "boolean"
              },
              "elbowRom": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "extensionLag": {
                      "description": "Degrees short of full extension. Use 0 for full extension.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    },
                    "flexion": {
                      "description": "Clinician-confirmed active motion in degrees.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    },
                    "pronation": {
                      "description": "Clinician-confirmed active motion in degrees.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    },
                    "side": {
                      "enum": ["left", "right"],
                      "type": "string"
                    },
                    "supination": {
                      "description": "Clinician-confirmed active motion in degrees.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["extensionLag", "flexion", "pronation", "side", "supination"],
                  "type": "object"
                },
                "maxItems": 2,
                "minItems": 1,
                "type": "array"
              },
              "shoulderRom": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "abduction": {
                      "description": "Clinician-confirmed active motion in degrees.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    },
                    "adduction": {
                      "description": "Clinician-confirmed active motion in degrees.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    },
                    "extension": {
                      "description": "Clinician-confirmed active motion in degrees.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    },
                    "externalRotation": {
                      "description": "Clinician-confirmed active motion in degrees.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    },
                    "flexion": {
                      "description": "Clinician-confirmed active motion in degrees.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    },
                    "internalRotation": {
                      "description": "Clinician-confirmed active motion in degrees.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    },
                    "side": {
                      "enum": ["left", "right"],
                      "type": "string"
                    }
                  },
                  "required": ["abduction", "adduction", "extension", "externalRotation", "flexion", "internalRotation", "side"],
                  "type": "object"
                },
                "maxItems": 2,
                "minItems": 1,
                "type": "array"
              },
              "spineDre": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "description": "DRE category selected by the clinician.",
                      "enum": ["I", "II", "III", "IV", "V"],
                      "type": "string"
                    },
                    "region": {
                      "enum": ["cervical", "thoracic", "lumbar"],
                      "type": "string"
                    },
                    "wpi": {
                      "description": "Whole-person impairment percent selected by the clinician within that category.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["category", "region", "wpi"],
                  "type": "object"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "wristRom": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "extension": {
                      "description": "Clinician-confirmed active motion in degrees.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    },
                    "flexion": {
                      "description": "Clinician-confirmed active motion in degrees.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    },
                    "radialDeviation": {
                      "description": "Clinician-confirmed active motion in degrees.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    },
                    "side": {
                      "enum": ["left", "right"],
                      "type": "string"
                    },
                    "ulnarDeviation": {
                      "description": "Clinician-confirmed active motion in degrees.",
                      "maximum": 180,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["extension", "flexion", "radialDeviation", "side", "ulnarDeviation"],
                  "type": "object"
                },
                "maxItems": 2,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["clinicianConfirmed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:96547ae643b00f008cccd6ee2857a0b35276f6dbf590ea5f2196d6702f68646b"
        }
      ],
      "digest": "sha256:836bb099b57297c4420906515625d9f68c6c7885957a7b2636fa58d200aa4faa"
    }
  }
}
