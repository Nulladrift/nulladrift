      },
      "instructions": "Screenrove: real UI screenshots from 191 products (Developer tools, Design & creative, Docs & knowledge, AI tools, Whiteboards & diagrams, Project & work management and more), 6,950 screens: onboarding flows, pricing pages, settings, dashboards and marketing sites, each with notes, design-problem tags and a measured design guide. Coverage differs by product: list_products and get_product say what was captured (172 signed in, 19 logged out only).\n\nUse it when the user says things like:\n- \"make it look like <product>\", \"trustworthy like <product>\": get_design for its measured fonts and colours, then search_screens with product=<id> and get_screen_image on the closest screen. Many brand fonts are licensed: use the free alternative in get_design's fonts (it has the <link> line) unless the user says they have the licence.\n- \"a pricing page like X\", \"settings like X\": search_screens (q or pattern, product), then get_screen_image.\n- \"compare X's and Y's pricing\", research rather than building: compare_pricing with 2 to 8 products gives a fact table with capture dates.\n- \"how do others do <screen>\": search_screens with tag filters (list_tags); find_related_screens for more like one.\n- naming or a logo: search_names, name_patterns, search_logos. Animation: search_motion, get_motion. \"Add polish (and sounds) to my UI\": suggest_polish with its parts, then get_motion; search_motion source=<id> fields=brief lists a whole library (interior, beautifului, cuelume…).\n\nLook before you build: search_screens attaches a small thumbnail of its top result to judge the layout (images=0 skips it); before writing any UI from a reference, call get_screen_image on your 1 to 3 picks for the 1x image, or build_recipe with 2 to 6 screen ids, which attaches them as 1x images with measurements. Notes alone are not enough.\n\nNo human present? (autonomous agents) search_screens, then build_recipe with 2 to 6 ids (each \"id: what to take from it\"), then build from the brief and its images, and in your notes cite each screen id with its captured date and url from the results. Skip pick_reference and wait_for_pick: they wait for a person.\n\nWith a person: pick_reference shows options in their browser and wait_for_pick returns their choice with a build prompt. build_handoff turns one product's flow or screen into a full prompt; check_my_ui and compare_screens compare UIs.\n\nOnly name products that list_products or search_screens return: the catalog doesn't have every product, so don't offer others as references. Lists are paged (limit, offset; search_screens also fields=brief). Everything is observed on its capture date. Write your own copy and branding; never copy a reference's words or logos.",
      "tools": [
        {
          "name": "build_handoff",
          "title": "Build an agent handoff prompt",
          "description": "Build one product's reference as a complete prompt: ordered screens with notes, observed\ntransitions, links to up to 10 agent-sized images (1x copies and section crops, each with its\npixel size), the measured design guide and an implementation checklist; the same prompt as\nthe site's \"Use in agent\" button. referenceId is `{product}-onboarding` (its flow),\n`{product}-collection` (everything) or one screen id. To combine screens from several\nproducts, use build_recipe.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "goal": {
                "description": "What you want to build. Goes at the top of the prompt.",
                "type": "string"
              },
              "includeDesign": {
                "default": true,
                "description": "Include the observed design guide. Set false to use your project's own design system.",
                "type": "boolean"
              },
              "referenceId": {
                "description": "e.g. linear-onboarding, stripe-collection or vercel-marketing-pricing.",
                "type": "string"
              },
              "screens": {
                "description": "Comma-separated screen ids to keep. Omit to include every screen in the reference.",
                "type": "string"
              },
              "stack": {
                "description": "Preferred stack, e.g. Next.js and Tailwind.",
                "type": "string"
              }
            },
            "required": ["referenceId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b736b0bb2e9943fa45531e40c88884b2b05f3cd1c110aea2063be988ba4781ae"
        },
        {
          "name": "build_recipe",
          "title": "Build a reference recipe",
          "description": "The best way to build from references, with or without a person: pass 2 to 6 screen ids from\nsearch_screens (each \"id: what to take from it\") and get one Markdown brief with the\nscreenshots attached at 1x (section crops for long pages), measured component sizes, the\npage structure and what to take from each. Up to 6 images are attached (one per reference, then\nextra section crops); the brief's first line lists them and names a get_screen_image call for\nany left out. Structure comes from the screens and every visual\ntoken from one style product, so conflicting looks are resolved instead of mixed. Interactive\nparts get matching motion entries to fetch with get_motion. E.g. Linear's issue composer,\nVercel's pricing layout and Notion's look in one screen.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "goal": {
                "description": "What you want to build. Goes at the top of the brief.",
                "type": "string"
              },
              "screens": {
                "description": "1 to 6 screen ids, each optionally followed by \": what to take from it\", e.g. [\"linear-product-new-issue: issue composer modal\", \"vercel-marketing-pricing: plan cards and FAQ\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "stack": {
                "description": "Preferred stack, e.g. Next.js and Tailwind.",
                "type": "string"
              },
              "style": {
                "description": "Product id whose measured visual language to use, e.g. linear or stripe. Omit to use the project's own design system.",
                "type": "string"
              },
              "styleContext": {
                "description": "Which of the style product's guides to use. Defaults to marketing when most screens are marketing pages, otherwise product.",
                "enum": ["marketing", "product"],
                "type": "string"
              },
              "styleNotes": {
                "description": "Extra visual direction in words, e.g. \"our brand green #1a7f37, rounded corners\". Used on its own when style is omitted.",
                "type": "string"
              }
            },
            "required": ["screens"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a917e1cc40e2ed561cf20a327bbb634f38a4c280c83844688c52ecf5c1b332ba"
        },
        {
          "name": "check_my_ui",
          "title": "Check the user's UI against real references",
          "description": "Compare the user's UI structure with the closest real products. Describe what they have\n(screen type, sections, flow steps, plan count; no personal names, prices or customer data)\nand get factual comparisons, not recommendations: plan counts, section order, blocks the\nreferences have that theirs lacks, flow length. image=true attaches the closest one's\nscreenshot.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "One or two sentences on what the screen is for and how it is laid out, e.g. \"Pricing page with three plan cards, a monthly/yearly toggle and a feature table\".",
                "type": "string"
              },
              "flowSteps": {
                "description": "For a multi-screen flow, each step's title in order, e.g. [\"Sign up\", \"Verify email\", \"Create workspace\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "flowType": {
                "description": "What the flow does, so step counts are only compared with flows of the same kind. Inferred from screenType when omitted.",
                "enum": ["signup-onboarding", "search", "checkout", "booking", "marketplace"],
                "type": "string"
              },
              "image": {
                "default": false,
                "description": "Attach the closest reference's 1x screenshot (MCP) or return its URL in image.",
                "type": "boolean"
              },
              "kind": {
                "description": "Only compare with this kind of capture.",
                "enum": ["flow", "marketing", "product"],
                "type": "string"
              },
              "limit": {
                "default": 4,
                "description": "How many references to return, 1 to 5.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "planCount": {
                "description": "For pricing screens, how many plans are shown.",
                "type": "integer"
              },
              "primaryAction": {
                "description": "The main button or action, e.g. \"Start free trial\".",
                "type": "string"
              },
              "product": {
                "description": "Only compare with this product id.",
                "type": "string"
              },
              "screenType": {
                "description": "What kind of screen it is.",
                "enum": ["landing", "pricing", "feature-page", "sign-up", "sign-in", "verification", "onboarding-step", "plan-picker", "empty-state", "dashboard", "list", "detail", "create-form", "search", "picker", "booking", "checkout", "marketplace", "settings", "docs", "menu", "lesson"],
                "type": "string"
              },
              "sections": {
                "description": "Page sections top to bottom, e.g. [\"Hero\", \"Plan cards\", \"FAQ\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e32249a8959aabd27c6be0d591710769493461a14e11d583c48edd3130567f50"
        },
        {
          "name": "compare_pricing",
          "title": "Compare pricing pages as a fact table",
          "description": "A fact table of 2 to 8 captured pricing pages, for research rather than building: per product,\nplan names and prices, cheapest paid plan with currency, monthly/yearly toggle and saving, free\nplan, trial, seat model, enterprise tier, notable limits, captured date and page url, plus a\nMarkdown table. Values are as captured; a field the capture doesn't state is null and listed\nin missing (trial and seat model are quoted from the notes).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "products": {
                "description": "Comma-separated product ids, each compared by its captured pricing page, e.g. notion,slack,asana.",
                "type": "string"
              },
              "screens": {
                "description": "Comma-separated pricing screen ids, e.g. notion-marketing-pricing (search_screens with pattern=pricing-page).",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "next": {
                "type": "string"
              },
              "notes": {
                "type": "array"
              },
              "rows": {
                "type": "array"
              },
              "skipped": {
                "type": "array"
              },
              "table": {
                "type": "string"
              },
              "total": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:904906a87e7c080a4ebd1bd424fe28a178a83b92577ae710a689c2695831b5e7"
        },
        {
          "name": "compare_screens",
          "title": "Compare two screens",
          "description": "Compare two screens side by side (screen types, page sections, observed actions, dimensions,\nplan counts), e.g. Linear's pricing page with Stripe's, or one screen against a description\nof what the user is building (targetDescription).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "focus": {
                "default": "all",
                "description": "What aspects to emphasize in the comparison.",
                "enum": ["layout", "sections", "actions", "dimensions", "typography", "all"],
                "type": "string"
              },
              "screenA": {
                "description": "First screen id to compare, e.g. linear-marketing-pricing.",
                "type": "string"
              },
              "screenB": {
                "description": "Second screen id to compare. If omitted, provide targetDescription instead.",
                "type": "string"
              },
              "targetDescription": {
                "description": "Instead of screenB, describe what you're building to see how screenA matches, e.g. \"Pricing page with 3 tiers and a feature comparison table\".",
                "type": "string"
              }
            },
            "required": ["screenA"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
