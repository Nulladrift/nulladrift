          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Only return this kind of screen.",
                "enum": ["flow", "marketing", "product"],
                "type": "string"
              },
              "limit": {
                "default": 6,
                "description": "Maximum results, 1 to 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
