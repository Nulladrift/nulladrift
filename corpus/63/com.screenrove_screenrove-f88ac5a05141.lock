              "sameProduct": {
                "default": false,
                "description": "Also include screens from the same product.",
                "type": "boolean"
              },
              "screenId": {
                "description": "Screen id from search_screens or get_product, e.g. linear-signup.",
                "type": "string"
              }
            },
            "required": ["screenId"],
            "type": "object"
