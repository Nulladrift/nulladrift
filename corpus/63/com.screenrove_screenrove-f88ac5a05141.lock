      "serverInfo": {
        "name": "screenrove",
        "title": "Screenrove",
        "version": "1.8.0",
        "websiteUrl": "https://screenrove.com"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "resources": {
          "listChanged": false
