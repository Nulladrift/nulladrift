          "name": "search_screens",
          "title": "Search screens",
          "description": "Find screens by design problem and keyword, e.g. \"pricing page like Stripe\", \"settings\",\n\"empty project list\". Every screen is tagged on four facets: task, pattern (screen archetype),\ncomponent and state. Commas mean OR within a facet, facets combine with AND, e.g.\npattern=list-view,table-view and state=empty; ids, labels or aliases work (\"kanban\", \"zero\nstate\"); list_tags has the vocabulary.\n\nq matches titles, tags, visual style (dark, serif, editorial, gradient, playful, pastel...), notes, sections and actions; a word that names a tag ranks screens with\nthat tag first. Screens matching more words rank higher; partial=true says none matched all,\nand a mistyped word is corrected (didYouMean). Each row has productName, captured date and the\npage url to cite. Results come 10 at a time (offset for more); fields=brief gives one line each.\nNear-duplicates (the same capture twice, a dark-theme copy) show once with the other ids in variants.\n\nOver MCP a small thumbnail of the top result is attached (720 px JPEG, fields=full); images=1 to 3\nattaches 1x screenshots instead, images=0 none. Then look before building: get_screen_image for\nthe 1x image of your picks, or build_recipe with 2 to 6 ids to get them as 1x images with\nmeasurements in one brief. The next field names the exact call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "component": {
                "description": "Building blocks on the screen, comma-separated for any of them, e.g. modal, date-picker, comparison-table.",
                "type": "string"
              },
              "fields": {
                "default": "full",
                "description": "brief gives one line per screen, without notes and tags.",
                "enum": ["full", "brief"],
                "type": "string"
              },
              "images": {
                "description": "How many of the top results' 1x screenshots to attach, 0 to 3. Unset, fields=full attaches one small thumbnail (720 px wide, about 18 KB) and fields=brief none; 0 attaches none.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "kind": {
                "description": "Only return this kind of screen.",
                "enum": ["flow", "marketing", "product"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Results per page, 1 to 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Results to skip; pass nextOffset from the previous page.",
                "minimum": 0,
                "type": "integer"
              },
              "pattern": {
                "description": "Screen archetype, comma-separated for any of them, e.g. pricing-page, list-view, board-view, settings.",
                "type": "string"
              },
              "product": {
                "description": "Only return screens from this product id, e.g. linear, stripe, airbnb.",
                "type": "string"
              },
              "q": {
                "description": "Keywords, e.g. \"pricing page\", \"empty state\", \"dark settings\", \"serif editorial landing\". Omit to list everything that matches the filters.",
                "type": "string"
              },
              "scope": {
                "description": "Only screens from collections with this capture scope.",
                "enum": ["marketing", "public-demo", "task-incomplete", "signed-in"],
                "type": "string"
              },
              "state": {
                "description": "Data or interaction state, comma-separated for any of them, e.g. empty, first-run, filtered, error.",
                "type": "string"
              },
              "task": {
                "description": "What the person is trying to do, comma-separated for any of them, e.g. create, choose-plan, invite.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "didYouMean": {
                "type": "string"
              },
              "filters": {
                "type": "object"
              },
              "images": {
                "type": "array"
              },
              "matchedAll": {
                "type": "integer"
              },
              "message": {
                "type": "string"
              },
              "next": {
                "type": "string"
              },
              "nextOffset": {
                "type": "integer"
              },
              "notes": {
                "type": "array"
              },
              "partial": {
                "type": "boolean"
              },
              "refine": {
                "type": "object"
              },
              "screens": {
                "type": "array"
              },
              "total": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
