        {
          "name": "get_screen",
          "title": "Get one screen",
          "description": "Get everything recorded about one screen: notes on what it does and how it's laid out, product,\ncaptured date, page url, source URL, dimensions, observed actions and where they lead, and page\nsections for long marketing pages. The notes are not the screen: call get_screen_image with the\nsame id to see it before building something similar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "screenId": {
                "description": "Screen id from search_screens or get_product, e.g. linear-signup.",
                "type": "string"
