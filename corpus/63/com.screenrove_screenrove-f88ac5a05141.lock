        {
          "name": "get_design",
          "title": "Get a product's design guide",
          "description": "Get a product's measured design guide: fonts, colour palette, type scale, layout and\ncomponent observations, measured separately for its marketing site and product UI. Use it\nfor \"make it look like <product>\" or \"trustworthy like <product>\": take the tokens from here\nand the structure from its screens (search_screens with product, then get_screen_image).\nfonts gives each context's families by role (display, body, mono) with licence, a CSS fallback\nstack and the closest free alternative plus its <link>; use the free one unless the user has\nthe licensed font.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Which surface to return. Omit for both.",
                "enum": ["marketing", "product"],
                "type": "string"
              },
              "productId": {
                "description": "Product id from list_products, e.g. linear, stripe or airbnb.",
                "type": "string"
              }
            },
            "required": ["productId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "contexts": {
                "type": "object"
