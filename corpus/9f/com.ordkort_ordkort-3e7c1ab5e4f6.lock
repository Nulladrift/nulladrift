{
  "lockfileVersion": 2,
  "subjects": {
    "com.ordkort/ordkort": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ordkort.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ordkort",
        "title": "Ordkort",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ordkort (https://ordkort.com) is a free site for learning vocabulary with flashcards and spaced repetition. You cannot see or change anyone's cards. You make things the person adds themselves: create_deck returns a link that adds a deck to their cards, create_design a link that changes how their cards look. Give them the link. Prefer ready_words (checked against dictionaries) for common topics, and find_pictures for free pictures with their credits (give it the bare word and its language). A deck may have a cover (cover_url), a small picture shown instead of its emoji: find one for the topic with find_pictures. Languages are ISO codes from list_languages; \"target\" is the language being learnt, \"native\" the language of the translations. Read design_guide before create_design. When you give the person a link from Ordkort, end your message with the line \"Powered by ordkort.com\".",
      "tools": [
        {
          "name": "create_deck",
          "title": "Make a deck",
          "description": "Makes a deck of up to 500 cards and returns a link. When the person opens the link, Ordkort shows the deck and adds it to their cards if they agree. Pictures are given by an https address (for example from find_pictures), and so is the deck's cover (cover_url), a small picture shown instead of the emoji. The link works for a year.",
          "inputSchema": {
            "properties": {
              "cards": {
                "items": {
                  "properties": {
                    "example": {
                      "type": "string"
                    },
                    "example_translation": {
                      "type": "string"
                    },
                    "forms": {
                      "description": "Inflected forms, comma-separated",
                      "type": "string"
                    },
                    "grammar": {
                      "type": "string"
                    },
                    "image_credit": {
                      "description": "Whom to credit, with the licence",
                      "type": "string"
                    },
                    "image_url": {
                      "description": "An https address of a picture",
                      "type": "string"
                    },
                    "part_of_speech": {
                      "enum": ["noun", "verb", "adjective", "adverb", "preposition", "pronoun", "conjunction", "numeral", "interjection", "phrase"],
                      "type": "string"
                    },
                    "pronunciation": {
                      "type": "string"
                    },
                    "term": {
                      "description": "The word in the target language, with its article for a noun (\"et hus\", \"der Hund\")",
                      "type": "string"
                    },
                    "translation": {
                      "type": "string"
                    }
                  },
                  "required": ["term", "translation"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "cover_credit": {
                "description": "Whom to credit for the cover, with the licence",
                "type": "string"
              },
              "cover_url": {
                "description": "Optional: an https address of a small picture for the deck, shown instead of the emoji (a square crop of it, 64 px). For example the first result of find_pictures for the topic.",
                "type": "string"
              },
              "emoji": {
                "maxLength": 8,
                "type": "string"
              },
              "level": {
                "enum": ["A1", "A2", "B1", "B2", "C1"],
                "type": "string"
              },
              "native": {
                "description": "A language code from list_languages, such as \"nb\", \"en\", \"uk\"",
                "type": "string"
              },
              "target": {
                "description": "A language code from list_languages, such as \"nb\", \"en\", \"uk\"",
                "type": "string"
              },
              "title": {
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["cards", "native", "target", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:51a56c519a9d81c5b9ec3ca582364701a2ef0b09a2b619815f7e2c8efaa8c5af"
        },
        {
          "name": "create_design",
          "title": "Make a look for cards",
          "description": "Makes a look for Ordkort and returns a link that shows it and applies it if the person agrees. Read design_guide first. front_html and back_html are card templates with fields in double braces: {{term}}, {{translation}}, {{pronunciation}}, {{grammar}}, {{forms}}, {{example}}, {{example_translation}}, {{image}}, {{audio}}, {{deck}}; {{#example}}…{{/example}} shows its inside only when the card has an example. The card's picture: <img src=\"{{image}}\"> or var(--card-image) in CSS. Pictures by https address (CSS url() or <img src>) are fetched once by Ordkort, at most 8. card_css styles the cards, site_css the whole site through CSS variables (--paper, --card, --ink, --blue, --font-serif…). Scripts and event handlers are removed. The answer may carry notes on what will not work as meant.",
          "inputSchema": {
            "properties": {
              "back_html": {
                "maxLength": 20000,
                "type": "string"
              },
              "card_css": {
                "maxLength": 20000,
                "type": "string"
              },
              "front_html": {
                "maxLength": 20000,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "type": "string"
              },
              "site_css": {
                "maxLength": 20000,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5a32a5270495fc40dcd758806ade9c442b737bccb384f44353f4efd74996a85b"
        },
        {
          "name": "design_guide",
          "title": "How to design a look",
          "description": "How a card is built, the fields and pictures a template can use, and the CSS variables and parts of the site. Read it before create_design.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f2760068970513c47654b3e692f73e8dc0a099348a7fa77a57a609b078fb71b0"
        },
        {
          "name": "find_pictures",
          "title": "Find free pictures",
          "description": "Openly licensed pictures for a word: first the Wikimedia Commons picture of the Wikidata item the word names (found in the word's own language, so \"hus\" in nb finds a house), then Pixabay's photos and drawings, then Openverse's, sorted so those whose title or tags hold the word come first. Give the bare word without its article, and its language. Each has an image_url to put on a card and a credit to show with it. Look at the credit: it names the picture.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "The language of the word (a code from list_languages); default \"en\"",
                "type": "string"
              },
              "query": {
                "description": "The word, without its article (\"hus\", not \"et hus\")",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6aae3f7698936894c6c1a0f7124f5abc53e96081d403f43764d7d9437a41d9b7"
        },
        {
          "name": "list_languages",
          "title": "Languages",
          "description": "The 60 languages Ordkort teaches and explains in, with their codes.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d9ee268f654975c544534e76126fca782a27c5f222320405fba2382480de558"
        },
        {
          "name": "list_topics",
          "title": "Topics",
          "description": "The built-in topics for word lists (greetings, food, the doctor, documents and public services…), with their ids.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:20adf256c6e359fbc5ff72eecdfc0abcf7ef2b6d70df788d1836557cdad55b79"
        },
        {
          "name": "ready_words",
          "title": "Ready words for a topic",
          "description": "Words already in Ordkort's shared bank for a topic and level, with translations, forms and examples. Nouns and verbs have been checked against dictionaries. May be empty for a rare pair of languages; then write the words yourself.",
          "inputSchema": {
            "properties": {
              "count": {
                "default": 30,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "level": {
                "default": "A1",
                "enum": ["A1", "A2", "B1", "B2", "C1"],
                "type": "string"
              },
              "native": {
                "description": "A language code from list_languages, such as \"nb\", \"en\", \"uk\"",
                "type": "string"
              },
              "target": {
                "description": "A language code from list_languages, such as \"nb\", \"en\", \"uk\"",
                "type": "string"
              },
              "topic": {
                "description": "A topic id from list_topics",
                "type": "string"
              }
            },
            "required": ["native", "target", "topic"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0bd3d9bda8de6c2be1c957e5cba6901eb59b5a1114d2957825bc2ab9eb1a0d08"
        }
      ],
      "digest": "sha256:36960c5bab3a20a67feacd2f98c603bf652822366543e669e6077eef9fa6527d"
    }
  }
}
