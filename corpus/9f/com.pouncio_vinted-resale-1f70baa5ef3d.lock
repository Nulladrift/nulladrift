      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Pouncio",
        "title": "Pouncio",
        "version": "1.0.0",
        "websiteUrl": "https://pouncio.com"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Pouncio reads Vinted listings all day and knows what second-hand items actually sell for there. Use its tools for resale prices, whether a Vinted listing is a good deal, and what to list an item at. Figures come from Vinted sales Pouncio read, a resale price database, or asking prices, and each answer says which; when Pouncio has too little to go on it says so, and you should not invent a number.",
      "tools": [
        {
          "name": "check_listing_deal",
          "title": "Check a Vinted listing",
          "description": "Use this when someone shares a Vinted listing link (vinted.fr/items/…, vinted.co.uk/items/…, any Vinted site) and asks whether it's a good deal, worth buying to resell, overpriced, or a scam. Compares the price with what the model resells for and, when Pouncio has read the seller, their record. Pouncio judges from its own data and does not open the page, so pass the asking price if the person mentions it. Do not use without a Vinted link (use check_resale_price).",
          "inputSchema": {
            "properties": {
              "asking_price": {
                "anyOf": [
                  {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The listing's price, if the person said it.",
                "title": "Asking Price"
              },
              "url": {
                "description": "The Vinted listing link, e.g. https://www.vinted.fr/items/123-ps5",
                "maxLength": 400,
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "check_listing_dealArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://pouncio/price-card-v1.html",
            "openai/toolInvocation/invoked": "Listing checked",
            "openai/toolInvocation/invoking": "Checking the listing…",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://pouncio/price-card-v1.html"
            }
          },
          "digest": "sha256:c2a88f5a98d31a2ec97c3cbd0f873b69ea945c6dc9e641460ea3bc9fd375e8eb"
        },
        {
          "name": "check_listing_text",
          "title": "Check a listing for red flags",
          "description": "Use this when someone quotes or pastes a Vinted seller's or buyer's message, or a Vinted listing's description, and asks if it's safe, legit, a scam, or what the red flags are (e.g. 'A Vinted seller wrote: \"pay me on WhatsApp and I'll ship today\". Is this a scam?', 'this listing says \"iCloud locked, sold as is\", should I buy?'). Returns each warning sign in the quoted words, found by the same text checks Pouncio's buying bots run before paying: paying or talking outside Vinted, refusing Vinted's item verification, an iCloud or Google lock, a named fault, or only the box for sale. Works in English, French, German, Italian, Spanish, Dutch and Portuguese. Do not use when nothing is quoted (general scam advice), for prices (use check_resale_price), or for a listing link without its text (use check_listing_deal).",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "The listing description or message, as pasted.",
                "maxLength": 4000,
                "title": "Text",
                "type": "string"
              }
            },
            "required": ["text"],
            "title": "check_listing_textArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://pouncio/price-card-v1.html",
            "openai/toolInvocation/invoked": "Text checked",
            "openai/toolInvocation/invoking": "Reading the text…",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://pouncio/price-card-v1.html"
            }
          },
          "digest": "sha256:4efb4f24e7f8375b2c6f03ed7da3512570e2ec338cfabbb01eb3ea4e5f250754"
        },
        {
          "name": "check_resale_price",
          "title": "Check a resale price",
          "description": "Use this when someone asks what a second-hand item sells or resells for on Vinted, what it's worth used, or the most to pay for one to resell at a profit (e.g. 'how much does a used PS5 Slim sell for on Vinted?'). Works best for electronics, consoles, phones, laptops and branded items named by model. Do not use for new retail prices, for judging one specific listing link (use check_listing_deal), or for what to list one's own item at (use suggest_listing_price).",
          "inputSchema": {
            "properties": {
              "product": {
                "description": "The item, as specific as the person said it: brand, model, storage or size, e.g. 'iPhone 13 128GB', 'PS5 Slim Digital', 'Nintendo Switch OLED'.",
                "maxLength": 160,
                "title": "Product",
                "type": "string"
              },
              "site": {
                "anyOf": [
                  {
                    "maxLength": 8,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The Vinted site the person uses, as its country code: fr, de, it, es, nl, be, pl, pt, at, lt, cz, sk, hu, ro, se, dk, fi, ie, uk, us. Sets the currency. Use the person's country when they don't say; leave empty when unknown.",
                "title": "Site"
              }
            },
            "required": ["product"],
            "title": "check_resale_priceArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://pouncio/price-card-v1.html",
            "openai/toolInvocation/invoked": "Prices read",
            "openai/toolInvocation/invoking": "Reading Vinted sales…",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://pouncio/price-card-v1.html"
            }
          },
          "digest": "sha256:179fa1f2d325aa3c7d9e1273e8b578e2f24e7b7e1bf73c7ba2359970ea4826bf"
        },
        {
          "name": "find_flips",
          "title": "Find models worth flipping",
          "description": "Use this when someone asks what to buy on Vinted to resell at a profit, what's worth flipping, or the best items to resell within a budget (e.g. 'what can I flip on Vinted with 200 euros?', 'which iPhones are worth reselling?'). Ranks models by the gap between what cheaper listings ask and what they sell for, after buyer protection and shipping, weighted by how many sold. Covers the electronics Pouncio reads most (phones, consoles, laptops). Do not use for the price of one named item (use check_resale_price) or for judging a listing link (use check_listing_deal).",
          "inputSchema": {
            "properties": {
              "budget": {
                "anyOf": [
                  {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The most the person wants to spend on one item, in their site's currency, if they said.",
                "title": "Budget"
              },
              "category": {
                "anyOf": [
                  {
                    "maxLength": 60,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A brand or product family to keep to, if the person named one, e.g. 'iPhone', 'PS5', 'Switch', 'MacBook'.",
                "title": "Category"
              },
              "site": {
                "anyOf": [
                  {
                    "maxLength": 8,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The Vinted site the person uses, as its country code: fr, de, it, es, nl, be, pl, pt, at, lt, cz, sk, hu, ro, se, dk, fi, ie, uk, us. Sets the currency. Use the person's country when they don't say; leave empty when unknown.",
                "title": "Site"
              }
            },
            "title": "find_flipsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://pouncio/price-card-v1.html",
            "openai/toolInvocation/invoked": "Flips found",
            "openai/toolInvocation/invoking": "Comparing Vinted prices…",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://pouncio/price-card-v1.html"
            }
          },
          "digest": "sha256:ee8c2cbe93b3faadeeea6e55630a47b9a5bbbd1bbb379b8e21d61326ac32e129"
        },
        {
          "name": "suggest_listing_price",
          "title": "Price an item to sell",
          "description": "Use this when someone wants to sell their own second-hand item on Vinted and asks what price to list it at, or how fast it will sell at a price. Gives what the model sells for, a quicker-sale price and what others ask now. Do not use for buying decisions (use check_resale_price) or for writing the listing's text.",
          "inputSchema": {
            "properties": {
              "condition": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Its condition in the person's words, e.g. 'like new', 'screen scratched'.",
                "title": "Condition"
              },
              "item": {
                "description": "The item: brand, model, storage or size, e.g. 'iPhone 12 64GB'.",
                "maxLength": 160,
                "title": "Item",
                "type": "string"
              },
              "site": {
                "anyOf": [
                  {
                    "maxLength": 8,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The Vinted site the person uses, as its country code: fr, de, it, es, nl, be, pl, pt, at, lt, cz, sk, hu, ro, se, dk, fi, ie, uk, us. Sets the currency. Use the person's country when they don't say; leave empty when unknown.",
                "title": "Site"
              }
            },
            "required": ["item"],
            "title": "suggest_listing_priceArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
