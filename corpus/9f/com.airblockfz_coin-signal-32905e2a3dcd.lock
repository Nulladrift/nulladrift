        {
          "name": "subscribe",
          "description": "Check your subscription status & terms (FREE), or activate the monthly plan: call with activate:true to receive the $50 x402 payment challenge, sign it, and retry — that buys 30 days of unlimited calls and returns your X-SUB-KEY token (pass it as a header to skip per-call payment). Until you subscribe, signal calls are $0.01 each for the first 6 days (trial), then the $50 monthly challenge. Optionally pass your ERC-8004 agentId to link it.",
