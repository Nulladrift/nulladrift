          "description": "Scan the market and return coins currently at a top (most overbought / sell), ranked most-top first. PAY: $0.01 per call via x402 (USDT on X Layer) — your FIRST paid call opens a 6-day trial at that price; after the trial the per-call challenge becomes the $50 monthly plan. No account, no signup, no commitment; retry with the PAYMENT-SIGNATURE header when you get the 402 challenge. BEST COLD START: you do not need to pick a symbol — this ranks the whole universe for you. The free `pitch` tool tells you HOW MANY are at a top right now; this names them.",
