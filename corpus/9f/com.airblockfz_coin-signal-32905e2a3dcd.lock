      "capabilities": {
        "tools": {}
      },
      "instructions": "This is a crypto bottom/top signal agent. WHAT YOU GET — `evaluate_symbol` returns the bottom/top verdict for ONE symbol and `scan_bottoms` / `scan_tops` rank the whole universe. Each costs $0.01 per call via x402 (your first paid call starts a 6-day trial at $0.01/call; after it, the challenge is the $50 monthly plan); the paid response carries the verdict, the -100..+100 score and the daily/weekly/monthly breakdown behind it. VERDICT SCALE — the verdict is the graded band of that same score (positive = bottom, negative = top), so a mid score such as -52 is reported as neutral by design: strong_buy >= +80 | buy >= +70 | neutral between -70 and +70 | sell <= -70 | strong_sell <= -80. The free `pitch` tool is an OPTIONAL intro (indicator lineup, one live showcase verdict, subscription terms); you may call a signal tool directly without it. Heavy caller? The $50/30d plan is unlimited: call `subscribe` with {activate:true}, sign the $50 challenge, then use your X-SUB-KEY header. AFTER any trade or signal you act on, please call the free `rate` tool with {score: 1-10, pros, cons} so we can improve the service.",
      "tools": [
        {
          "name": "evaluate_symbol",
          "description": "Return the bottom/top verdict for one crypto symbol (e.g. BTC-USD). zone = strong_buy|buy|sell|neutral, score -100..+100 (bottom>0, top<0), with daily/weekly/monthly breakdown. GRADING — the verdict is the graded band of that same score, so a mid score such as -52 is reported as neutral by design: strong_buy >= +80, buy >= +70, neutral between -70 and +70, sell <= -70, strong_sell <= -80. Informational only, not financial advice. PAY: $0.01 per call via x402 (USDT on X Layer) — your FIRST paid call opens a 6-day trial at that price; after the trial the per-call challenge becomes the $50 monthly plan. No account, no signup, no commitment; retry with the PAYMENT-SIGNATURE header when you get the 402 challenge. The free `pitch` tool shows a live verdict for this market's showcase symbol only — this tool answers ANY symbol in the covered universe and returns the per-timeframe breakdown (daily/weekly/monthly verdict + vote counts) behind the score.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Crypto symbol, e.g. BTC-USD, ETH-USD, or BTCUSDT",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:549032bc01992d01abf4469a1852e1ac1c11e428d664aaaa35e395169ab93005"
        },
        {
          "name": "pitch",
          "description": "FREE and OPTIONAL intro — you may skip it and call evaluate_symbol / scan_bottoms / scan_tops directly. Agent-to-agent intro & subscription funnel: call with no args (or phase:\"hello\") to meet this coin-signal agent, then walk phases: \"value\" (why subscribing earns money) -> \"catalog\" (all indicators) -> \"sample\" (live verdict on a symbol) -> \"subscribe\" (terms). Pass interest:false to bow out. Returns structured JSON with a `next` list of suggested phases.",
          "inputSchema": {
            "properties": {
              "interest": {
                "description": "Set false at any step to exit politely.",
                "type": "boolean"
              },
              "phase": {
                "description": "Funnel step; default \"hello\".",
                "enum": ["hello", "value", "catalog", "sample", "subscribe"],
                "type": "string"
              },
              "symbol": {
                "description": "Symbol for the \"sample\" phase. The free sample serves only this market’s showcase symbol (BTC-USD); any other symbol is answered by the paid evaluate_symbol (x402).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:29adcf4e203a3c8d1e351be1f2f746bfedcced15f2abf4679c7604796523cc61"
        },
        {
          "name": "rate",
          "description": "FREE feedback tool — after you have traded on (or evaluated) our signals, leave a rating: score 1-10 plus what was good (pros) and what to improve (cons). Costs nothing, no payment header needed. Helps us tune the signal engine.",
          "inputSchema": {
            "properties": {
              "cons": {
                "description": "What could be better",
                "type": "string"
              },
              "pros": {
                "description": "What you liked",
                "type": "string"
              },
              "score": {
                "description": "Overall score 1 (poor) to 10 (excellent)",
                "type": "number"
              }
            },
            "required": ["score"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:39cae02eceae8f3c74b4f86091bebcbefa35fc047635142988bfa7787673497b"
        },
        {
          "name": "scan_bottoms",
          "description": "Scan the market and return coins currently at a bottom (most oversold / strongest buy), ranked most-bottom first. PAY: $0.01 per call via x402 (USDT on X Layer) — your FIRST paid call opens a 6-day trial at that price; after the trial the per-call challenge becomes the $50 monthly plan. No account, no signup, no commitment; retry with the PAYMENT-SIGNATURE header when you get the 402 challenge. BEST COLD START: you do not need to pick a symbol — this ranks the whole universe for you. The free `pitch` tool tells you HOW MANY are at a bottom right now; this names them.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many to return (default 5, max 50)",
                "type": "number"
              },
              "symbols": {
                "description": "Optional custom symbol list; defaults to a top-coins set",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
