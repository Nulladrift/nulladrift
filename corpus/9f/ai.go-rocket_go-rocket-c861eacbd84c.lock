{
  "lockfileVersion": 2,
  "subjects": {
    "ai.go-rocket/go-rocket": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.go-rocket.ai/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "go-rocket",
        "title": "Go Rocket",
        "version": "2.1.0",
        "websiteUrl": "https://www.go-rocket.ai/",
        "icons": [
          {
            "src": "https://www.go-rocket.ai/videos-static/gorocket-favicon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Go Rocket makes 9:16 AI presenter video ads. For a video request, call create_video; signed out it asks the person to connect their existing account with sign_in. Retry in this chat after OAuth; existing paid or comp credits start the video. get_video_sample is a stored library style sample, with brand colours on its sample page when available. New users can get the sample, then get_plan_link to see the plan on go-rocket.ai. Nothing is charged inside this connector.",
      "tools": [
        {
          "name": "create_video",
          "title": "Create a video ad from a website",
          "description": "Start a finished 9:16 AI User Generated Content (UGC) video ad for a website: a photoreal presenter speaks about the product, captions included, in the site's brand colours. Spends credits from the signed-in Go Rocket account (15 seconds, or 30 with cinema; get_account lists the credit costs) including comp credits, and starts at once. Signed out, connect your existing account with sign_in, then retry in the same chat. When credits are insufficient the reply carries plan_url: see the plan on go-rocket.ai. It can be cancelled with a full refund for 60 seconds. Returns a video_id right away; the video takes about 15 minutes, so poll get_video. Pass an idempotency_key when retrying so a repeated call returns the same video instead of paying twice. For a spoken business name without a URL, find its official website first and confirm the URL in one line before calling. Put the requested tone and audience in brief. Read back the returned message, then use status_tool to fetch the share_url when ready.",
          "inputSchema": {
            "properties": {
              "brief": {
                "description": "Optional tone, audience and focus, e.g. 'relaxed, for tourists, beginner surf lessons'.",
                "maxLength": 300,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional but recommended for loops: any unique string per intended video.",
                "maxLength": 80,
                "type": "string"
              },
              "language": {
                "description": "Spoken language, ISO code (default en). One of the presenter languages listed by get_account.",
                "type": "string"
              },
              "length_seconds": {
                "description": "Video length (default 15; 30 needs quality 'cinema').",
                "enum": [15, 30],
                "type": "integer"
              },
              "presenter": {
                "description": "Presenter voice and face (default female).",
                "enum": ["female", "male"],
                "type": "string"
              },
              "quality": {
                "description": "Quality tier (default 'standard', 1 credit per 15 s; 'cinema' is our most lifelike motion, 2 credits, up to 30 s).",
                "enum": ["standard", "cinema"],
                "type": "string"
              },
              "url": {
                "description": "The product or landing page to advertise, e.g. https://example.com/product",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a video ad from a website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:72041720160875ee8c457b830c9fc2b57930f96ed8ac7c33780824395e0617b3"
        },
        {
          "name": "get_plan_link",
          "title": "See the Go Rocket plan",
          "description": "Returns plan_url, the Go Rocket plan page on go-rocket.ai, where prices and credits are explained. Existing account? Call sign_in, then create_video to use its credits first. For a new account, call this once the sample is ready and say: see the plan on go-rocket.ai. The sampled site stays attached as the first video. Nothing is charged by this tool. Afterwards, sign in through this connector to create videos in the same chat.",
          "inputSchema": {
            "description": "claim_token is required when signed out.",
            "properties": {
              "claim_token": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "See the Go Rocket plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6829e8697879fc43e56fa1af8e25abfa81797a755034de6b297a90fbf37b97b0"
        },
        {
          "name": "get_sample_status",
          "title": "Check whether a sample is ready",
          "description": "Poll a sample started by get_video_sample. Returns state 'reading', 'ready' (with the sample), 'failed' (the site could not be read; nothing to make) or 'purchased' (already paid for: call sign_in).",
          "inputSchema": {
            "properties": {
              "claim_token": {
                "type": "string"
              }
            },
            "required": ["claim_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check whether a sample is ready"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4347868991dca561626694379f3e3db0a0d1697f8cc98d893782a7745eb737fd"
        },
        {
          "name": "get_video_sample",
          "title": "Get a sample video ad for a website",
          "description": "A short look at the style of your ad: a stored, blurred library montage. Open sample_page_url to see it in your brand colours when the page supplies them; the direct clip is untinted. Your real video is made after you start it. Returns a claim token. The bounded page check takes up to two seconds; the tool waits up to wait_seconds and otherwise returns state 'reading': then call get_sample_status with the claim token every few seconds until it is 'ready'. Nothing is generated or charged by this call.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The product or company website, e.g. https://example.com",
                "type": "string"
              },
              "wait_seconds": {
                "description": "How long to wait for the sample (default 8).",
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Get a sample video ad for a website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0179439919e42c1de8d85a8e4da524a37196f814a60e4c84b66d7a8026842fd1"
        },
        {
          "name": "sign_in",
          "title": "Connect your Go Rocket account",
          "description": "Connect your existing Go Rocket account before making a video. Call this to open the connector's OAuth sign-in. Say: 'Connect your Go Rocket account: sign in when this connector asks. If no sign-in opens, reconnect Go Rocket in your connector settings.' In Claude Code, open /mcp, select go-rocket, then Authenticate. Return to the same chat and retry create_video; existing credits work here.",
