                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "reason_code": {
                      "enum": ["same_dates_other_category", "other_dates_same_category", "other_dates_other_category"],
                      "type": "string"
                    },
                    "total_price_eur": {
                      "type": "number"
                    },
                    "zone": {
                      "enum": ["beach", "city"],
                      "type": "string"
                    }
                  },
                  "required": ["booking_url", "check_in", "check_out", "id", "name", "nights", "reason", "reason_code", "total_price_eur", "zone"],
                  "type": "object"
                },
                "type": "array"
              },
              "check_in": {
                "type": "string"
              },
              "check_out": {
                "type": "string"
              },
              "currency": {
                "const": "EUR",
                "type": "string"
              },
              "guests": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "matches": {
