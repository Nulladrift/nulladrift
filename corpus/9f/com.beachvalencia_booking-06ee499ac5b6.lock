        {
          "name": "search_availability",
          "title": "Search availability",
          "description": "WHEN: use it whenever the traveller asks \"what do you have from X to Y for N people\" or shows date flexibility. WHAT IT RETURNS: `matches[]` with one entry per available category (G1..G6, G4B) ordered by total price, including name, zone (beach/city), bedrooms, m², highlights, location summary, photos, total/nightly EUR price (public rate, no discount code) and a `booking_url` with dates+pax prefilled. Also `alternatives[]` (up to 6, each with `reason` like \"same dates, other category\" or \"2 days earlier, same category\") when matches are empty or `flexible_days > 0`, `minimum_stay_only[]` for categories that would be available with a longer stay, `no_results_reason` when nothing applies, and `trust` (rating 9.4/10, 320+ Booking reviews, cheaper than Booking.com, Stripe payment, 14-day free cancellation, languages supported). Direct prices are BELOW Booking.com for the same dates. FLEXIBLE PARAMETERS: `flexible_days` (0–3, default 0) shifts the check-in by ±N days to broaden alternatives; `budget_eur` filters matches and alternatives by TOTAL EUR; `zone` (\"beach\" | \"city\" | \"any\", default \"any\"); `min_bedrooms` (default 1 — a sofa bed does not count). EXAMPLE: {\"check_in\":\"2027-05-22\",\"check_out\":\"2027-05-27\",\"adults\":4,\"flexible_days\":2,\"budget_eur\":900,\"zone\":\"beach\",\"min_bedrooms\":2}.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adults": {
                "description": "Number of adults.",
                "maximum": 32,
                "minimum": 1,
                "type": "integer"
              },
              "budget_eur": {
                "description": "Max TOTAL price in EUR for the whole stay. Filters both matches and alternatives.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "check_in": {
                "description": "Arrival date (YYYY-MM-DD, Europe/Madrid).",
                "type": "string"
              },
              "check_out": {
                "description": "Departure date (YYYY-MM-DD, Europe/Madrid); must be strictly after check_in.",
                "type": "string"
              },
              "children": {
                "description": "Optional list of children ages. Only the count is used to size the property.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "flexible_days": {
                "description": "Shift the check-in by ±N days (0..3) to find alternatives if the exact dates are not available. Default 0.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "language": {
                "description": "Response language. Defaults to en if omitted or unsupported.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "min_bedrooms": {
                "description": "Minimum number of bedrooms (1 by default — a sofa bed does not count).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "zone": {
                "description": "Filter by zone: beach = La Patacona (G1..G5, G4B); city = Valencia city (G6); any = both (default).",
                "enum": ["beach", "city", "any"],
                "type": "string"
              }
            },
            "required": ["adults", "check_in", "check_out"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "alternatives": {
                "description": "Up to 6 alternatives (other dates ±flexible_days or other categories) when matches are empty or the agent asked for flexibility.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "booking_url": {
                      "type": "string"
                    },
                    "check_in": {
                      "type": "string"
                    },
                    "check_out": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
