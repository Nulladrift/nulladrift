      },
      "instructions": "Read-only availability and pricing for Beach Valencia holiday apartments in La Patacona (Alboraya, Valencia) and Valencia city. Prices are the public rate charged at checkout for a non-member with no discount code. All booking_url links direct users to https://www.beachvalencia.com to complete the reservation. Do not disclose individual apartment numbers or exact addresses — only property types (G1..G6, G4B).",
      "tools": [
        {
          "name": "create_booking_request",
          "title": "Create booking request",
          "description": "WHEN: use it only after the traveller has (1) picked ONE category and dates, (2) given name, email and phone, and (3) EXPLICITLY accepted the cancellation policy — never set `accepted_terms: true` on your own. WHAT IT RETURNS: `booking_id`, `checkout_url` (a page on beachvalencia.com that shows the breakdown and asks the guest to tick the cancellation policy BEFORE jumping to Stripe), `expires_at` (ISO 8601, ~30 min in the future), `hold_minutes: 30`, total/nightly EUR, nights, guests, property, deposit, cancellation summary, `terms_url`, `idempotent` (true if a prior request with the same category+dates+pax+email was replayed), and a `message` ready to show to the guest. PAYMENT: always on Stripe, hosted at beachvalencia.com. The agent NEVER charges the guest itself. If the hold expires without payment, the unit is released automatically and a new request is needed. The price is the public rate (no member discount, no coupon codes — if the guest has a code, they apply it on the web). IDEMPOTENCY: a replay with the same category, dates, pax and email returns the same booking. EXAMPLE: {\"id\":\"G4\",\"check_in\":\"2027-05-22\",\"check_out\":\"2027-05-27\",\"adults\":4,\"guest_name\":\"Ada Lovelace\",\"guest_email\":\"ada@example.com\",\"guest_phone\":\"+34612345678\",\"language\":\"en\",\"accepted_terms\":true}.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accepted_terms": {
                "description": "Must be true. The agent confirms the traveller accepted the cancellation policy and the terms and conditions.",
                "type": "boolean"
              },
              "adults": {
                "description": "Number of adults.",
                "maximum": 32,
                "minimum": 1,
                "type": "integer"
              },
              "check_in": {
                "description": "Arrival date YYYY-MM-DD (Europe/Madrid).",
                "type": "string"
              },
              "check_out": {
                "description": "Departure date YYYY-MM-DD (Europe/Madrid); strictly after check_in.",
                "type": "string"
              },
              "children": {
                "description": "Optional list of children ages. Only the count is used to size the property.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "guest_email": {
                "description": "Guest's email — receives the payment link and confirmation.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "guest_name": {
                "description": "Guest's full name.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "guest_phone": {
                "description": "Guest's phone number, including country code.",
                "maxLength": 40,
                "minLength": 6,
                "type": "string"
              },
              "id": {
                "description": "Property/type ID (G1..G6 or G4B).",
                "type": "string"
              },
              "language": {
                "description": "Language for the confirmation email and error messages.",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "required": ["accepted_terms", "adults", "check_in", "check_out", "guest_email", "guest_name", "guest_phone", "id", "language"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "booking_id": {
                "type": "string"
              },
              "breakdown": {
                "items": {
                  "additionalProperties": false,
