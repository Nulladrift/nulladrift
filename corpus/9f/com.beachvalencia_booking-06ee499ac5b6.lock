        {
          "name": "get_property_details",
          "title": "Get property details",
          "description": "WHEN: use it after `search_availability` when the traveller wants to compare or see more detail about one specific category, or asks \"tell me more about G4\". WHAT IT RETURNS: description, max_guests, bedrooms (text + count), size_sqm, zone, generic location (\"La Patacona, Alboraya — 30 m from the sea\" / \"Valencia city, close to the centre\"), `location_summary` (how long to the old town, tram, airport…), `highlights` (terrace, sea views, pool, parking, m²), amenities (parking, pool_seasonal), up to 3 photos, `trust` (same block as search_availability), a `booking_url_base` to open the listing with no dates, and the Priority note. DO NOT ask here for the exact street address or access codes: they are only sent to the guest by email after a booking is confirmed. EXAMPLE: {\"id\":\"G4\",\"language\":\"en\"}.",
