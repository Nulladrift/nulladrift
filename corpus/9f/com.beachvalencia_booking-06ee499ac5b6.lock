                  "properties": {
                    "bedrooms": {
                      "type": "string"
                    },
                    "bedrooms_count": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "booking_url": {
                      "type": "string"
                    },
                    "discount_note": {
                      "type": "string"
                    },
                    "highlights": {
