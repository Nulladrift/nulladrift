                    "amount": {
                      "type": "number"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["amount", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "cancellation": {
                "type": "string"
              },
              "cancellation_details_url": {
                "type": "string"
              },
              "checkout_url": {
                "type": "string"
              },
              "currency": {
                "const": "EUR",
                "type": "string"
              },
              "deposit": {
                "type": "string"
              },
