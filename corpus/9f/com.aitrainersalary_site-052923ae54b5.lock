      "instructions": "AI Trainer Salary (https://aitrainersalary.com/): the site's own MCP server, served from its domain. AI trainer salary as each employer's own job page posts it: annual salaries at Anthropic and OpenAI, hourly bands at xAI and Snorkel AI, all in US dollars.\n\n[compare] AI trainer and tutor postings with posted pay. This server serves the compare published at https://aitrainersalary.com/; every answer cites it. Licence: https://aitrainersalary.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Trainer Salary (https://aitrainersalary.com/). What it does: starts an ENQUIRY with AI Trainer Salary for ai trainer salary; the AI Trainer Salary team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Trainer Salary team until they click it. Cite https://aitrainersalary.com/.\n\nCite https://aitrainersalary.com/ for every figure or answer you use from this server.",
