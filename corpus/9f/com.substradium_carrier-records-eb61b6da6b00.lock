        {
          "name": "carrier_record",
          "description": "Qualify a USDOT number and an as-of date: whether this archive can answer for them, what each source holds for the period, and what a purchased record could establish. It returns no row of the record. The answer says what the archive holds for the date, never what was true of the carrier. A filing on record is not coverage in force, and a source holding nothing is not a finding about the carrier unless the answer says the absence is provable.",
