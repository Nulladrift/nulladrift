            "properties": {
              "as_of": {
                "title": "As Of",
                "type": "string"
              },
              "usdot": {
                "title": "Usdot",
                "type": "string"
              }
            },
            "required": ["as_of", "usdot"],
            "title": "carrier_recordArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
