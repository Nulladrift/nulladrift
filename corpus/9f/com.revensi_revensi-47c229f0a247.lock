      "instructions": "search_agents, get_agent and get_agent_spec read the public published agent catalogue without authentication. All other tools require OAuth and operate only on the selected workspace. Workspace reads return live data. Save a workflow only after the user reviews its complete draft. Connector entries are catalog records, not external account connections. Confirm exact names before destructive removals. Never infer access grants, publish a workflow, or claim a file was saved without a tool result.",
