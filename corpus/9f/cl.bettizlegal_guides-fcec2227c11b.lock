      "instructions": "Acceso de SOLO LECTURA a las guías y servicios publicados por Bettiz Legal, estudio jurídico en Santiago de Chile (inmobiliario y arriendos, empresas y pymes, herencias). Es información general, no asesoría legal: no la presentes como opinión de la abogada sobre un caso. Este canal no recibe casos ni mensajes; no envíes datos personales. Para una consulta, indica que las citas se agendan solo por WhatsApp (+56 9 9489 7327) y que el diagnóstico inicial se paga antes de la cita (su valor se informa al agendar; no hay consultas gratuitas).",
