{
  "lockfileVersion": 2,
  "subjects": {
    "com.sellertoolbelt/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sellertoolbelt.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "sellertoolbelt",
        "title": "Toolbelt",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Toolbelt tools for e-commerce sellers: check and fix product images for Amazon, eBay and Etsy, calculate marketplace fees, look up barcodes and make QR codes. check_listing_image, calculate_marketplace_fees, lookup_barcode and generate_qr_code are free with full results. The image-editing tools return a free watermarked preview; a human unlocks the full-resolution file through unlock_url using site credits, after which get_result returns download_url. With an API key (Authorization: Bearer stb_…, created at /account) image tools return download_url directly and charge the key owner's credits on success. Pass images as a public https image_url.",
      "tools": [
        {
          "name": "add_watermark",
          "title": "Add a text watermark to an image",
          "description": "Stamps text (e.g. \"© Your Brand\") on an image in a corner, the centre, or tiled diagonally. Without an API key: returns a free watermarked preview (≤700px) plus unlock_url, which a human opens to download the full-resolution file for site credits (then call get_result). With an API key (Authorization: Bearer stb_…): returns download_url for the full-resolution file directly and charges the key owner's credits when the job starts, refunded automatically if processing fails. Retrying a call creates and charges a new job — use get_result to fetch an earlier one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "color": {
                "default": "white",
                "enum": ["white", "black"],
                "type": "string"
              },
              "image_base64": {
                "description": "The image as base64 (or a data: URL), max 2 MB. Use only when no public URL is available.",
                "type": "string"
              },
              "image_url": {
                "description": "Public https:// URL of the image. Preferred over image_base64.",
                "format": "uri",
                "type": "string"
              },
              "opacity": {
                "default": 50,
                "maximum": 100,
                "minimum": 5,
                "type": "integer"
              },
              "position": {
                "default": "bottom-right",
                "enum": ["tiled", "bottom-right", "bottom-left", "top-right", "top-left", "center"],
                "type": "string"
              },
              "size": {
                "default": "medium",
                "enum": ["small", "medium", "large"],
                "type": "string"
              },
              "text": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:05983a7f8e61c6f0e9c3c2c4f891a77f019ca31a6a94afe36817b5c445029526"
        },
        {
          "name": "calculate_marketplace_fees",
          "title": "Calculate marketplace fees and profit",
          "description": "Computes selling fees, net profit, margin and ROI for one sale on Amazon, eBay or Etsy from the sale price, shipping and costs. Category sets the default fee rate: amazon: default (15%), electronics (8%), computers (7%), clothing (17%), home (15%), toys (15%), books (15%); ebay: default (13.25%), electronics (9%), books (14.95%), clothing (13.25%); etsy: default (6.5%). Rates are 2026 estimates and vary by region; pass fee_rate_percent to override. Currency-agnostic. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "default": "default",
                "description": "Category id for the default fee rate (see description).",
                "type": "string"
              },
              "fba_fee": {
                "default": 0,
                "description": "Amazon FBA fulfilment fee, if any.",
                "minimum": 0,
                "type": "number"
              },
              "fee_rate_percent": {
                "description": "Override the main fee %.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "item_cost": {
                "default": 0,
                "description": "Your cost of goods.",
                "minimum": 0,
                "type": "number"
              },
              "marketplace": {
                "enum": ["amazon", "ebay", "etsy"],
                "type": "string"
              },
              "sale_price": {
                "minimum": 0,
                "type": "number"
              },
              "shipping_charged": {
                "default": 0,
                "description": "Shipping the buyer pays you.",
                "minimum": 0,
                "type": "number"
              },
              "shipping_cost": {
                "default": 0,
                "description": "Shipping/fulfilment you pay.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["marketplace", "sale_price"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4bbd43e46326cc4eef258fa633438d06972c3053b78781b2cd5c968c6ae0cf84"
        },
        {
          "name": "change_background_color",
          "title": "Put a product on a solid background colour",
          "description": "Removes the background and places the product on a solid colour: white, light_gray, gray, black, beige, studio_blue, soft_pink, or custom with hex. Without an API key: returns a free watermarked preview (≤700px) plus unlock_url, which a human opens to download the full-resolution file for site credits (then call get_result). With an API key (Authorization: Bearer stb_…): returns download_url for the full-resolution file directly and charges the key owner's credits when the job starts, refunded automatically if processing fails. Retrying a call creates and charges a new job — use get_result to fetch an earlier one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "color": {
                "default": "white",
                "enum": ["white", "light_gray", "gray", "black", "beige", "studio_blue", "soft_pink", "custom"],
                "type": "string"
              },
              "hex": {
                "description": "Required when color is \"custom\", e.g. #f5f1e8.",
                "pattern": "^#?[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "image_base64": {
                "description": "The image as base64 (or a data: URL), max 2 MB. Use only when no public URL is available.",
                "type": "string"
              },
              "image_url": {
                "description": "Public https:// URL of the image. Preferred over image_base64.",
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13d0f63ffe59c2cf3705bf8b1981772219217f0ab25a5281c7925833ab641da3"
        },
        {
          "name": "check_listing_image",
          "title": "Check a product image against marketplace rules",
          "description": "Deterministically checks whether a product photo meets the main-image requirements of Amazon, eBay or Etsy (pure white background, product fill, minimum resolution, file format, colour space, borders, aspect ratio, sharpness, stray text/watermarks). Measured from the actual pixels, not guessed by a vision model. Returns pass / warn / fail with a reason per rule. Use before uploading a listing image. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "image_base64": {
                "description": "The image as base64 (or a data: URL), max 2 MB. Use only when no public URL is available.",
                "type": "string"
              },
              "image_url": {
                "description": "Public https:// URL of the image. Preferred over image_base64.",
                "format": "uri",
                "type": "string"
              },
              "marketplace": {
                "default": "amazon",
                "enum": ["amazon", "ebay", "etsy"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:758f9e50577f7fa01c3b15940b205f75e4655f465620f0c746e63c9fd223ac35"
        },
        {
          "name": "convert_image",
          "title": "Convert or compress an image",
          "description": "Re-encodes an image as jpeg, png, webp, avif at a chosen quality, to change format or shrink file size. JPEG flattens transparency to white. Without an API key: returns a free watermarked preview (≤700px) plus unlock_url, which a human opens to download the full-resolution file for site credits (then call get_result). With an API key (Authorization: Bearer stb_…): returns download_url for the full-resolution file directly and charges the key owner's credits when the job starts, refunded automatically if processing fails. Retrying a call creates and charges a new job — use get_result to fetch an earlier one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "default": "jpeg",
                "enum": ["jpeg", "png", "webp", "avif"],
                "type": "string"
              },
              "image_base64": {
                "description": "The image as base64 (or a data: URL), max 2 MB. Use only when no public URL is available.",
                "type": "string"
              },
              "image_url": {
                "description": "Public https:// URL of the image. Preferred over image_base64.",
                "format": "uri",
                "type": "string"
              },
              "quality": {
                "default": 80,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9cd2480ee77cb18f679efe6ff3e85141e7a82282544aaafc0231119105731bd8"
        },
        {
          "name": "generate_qr_code",
          "title": "Generate a QR code",
          "description": "Generates a QR code image (PNG) or SVG markup for any text or URL, e.g. for packaging inserts, product labels or invoices. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "content": {
                "description": "Text or URL to encode.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "error_correction": {
                "default": "M",
                "enum": ["L", "M", "Q", "H"],
                "type": "string"
              },
              "format": {
                "default": "png",
                "enum": ["png", "svg"],
                "type": "string"
              },
              "size": {
                "default": 512,
                "description": "PNG width in pixels.",
                "maximum": 2048,
                "minimum": 128,
                "type": "integer"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4ad7df24e5bab28b3902be0547a1292ac5399fce6d688e716f853c08809f3db"
        },
        {
          "name": "get_result",
          "title": "Get the status or download link of an image job",
          "description": "Checks a job created by one of the image tools. Returns download_url once it is unlocked (API-key jobs are paid up front; anonymous ones by a human via unlock_url). Otherwise returns the status, preview_url and unlock_url. Never charges. Anonymous results expire 24h after creation unless claimed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "access_token": {
                "description": "The access_token returned with the job.",
                "minLength": 10,
                "type": "string"
              },
              "job_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["access_token", "job_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d09dabdd87b6a3315dfdd18033a20c99bf3d7f06595eeb931fb6d4ec04e41c6"
        },
        {
          "name": "lookup_barcode",
          "title": "Look up a product by barcode",
          "description": "Finds product details (title, brand, category, image, description) for a UPC, EAN or GTIN barcode, using open product catalogs (strong for UK/EU groceries, drinks and cosmetics). Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "pattern": "^\\d{8,14}$",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:09c7ee42735d715d5ffbadbb84dc261b826ed2a90475385bba002aca6507f779"
        },
        {
          "name": "make_compliant_main_image",
          "title": "Turn a product photo into a compliant marketplace main image",
          "description": "Removes the background, centres and scales the product on pure white, sizes and encodes it to the marketplace spec (Amazon, eBay or Etsy), then re-checks the result and returns the per-rule verdict as proof. Without an API key: returns a free watermarked preview (≤700px) plus unlock_url, which a human opens to download the full-resolution file for site credits (then call get_result). With an API key (Authorization: Bearer stb_…): returns download_url for the full-resolution file directly and charges the key owner's credits when the job starts, refunded automatically if processing fails. Retrying a call creates and charges a new job — use get_result to fetch an earlier one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "image_base64": {
                "description": "The image as base64 (or a data: URL), max 2 MB. Use only when no public URL is available.",
                "type": "string"
              },
              "image_url": {
                "description": "Public https:// URL of the image. Preferred over image_base64.",
                "format": "uri",
                "type": "string"
              },
              "marketplace": {
                "default": "amazon",
                "enum": ["amazon", "ebay", "etsy"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4cf388b8029aed0b453f5abd36411a9aaed917c9451f8836efdce52cdbd6094a"
        },
        {
          "name": "remove_background",
          "title": "Remove the background from a product photo",
          "description": "Cuts the product out of its background and returns a transparent PNG. Without an API key: returns a free watermarked preview (≤700px) plus unlock_url, which a human opens to download the full-resolution file for site credits (then call get_result). With an API key (Authorization: Bearer stb_…): returns download_url for the full-resolution file directly and charges the key owner's credits when the job starts, refunded automatically if processing fails. Retrying a call creates and charges a new job — use get_result to fetch an earlier one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "image_base64": {
                "description": "The image as base64 (or a data: URL), max 2 MB. Use only when no public URL is available.",
                "type": "string"
              },
              "image_url": {
                "description": "Public https:// URL of the image. Preferred over image_base64.",
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:79bf2f635043925fe57538d534ea9f0c960ea03e3f734db30cd4862e30b8cc85"
        },
        {
          "name": "resize_for_marketplace",
          "title": "Resize an image for a marketplace or social format",
          "description": "Fits the image onto an exact canvas, padding with white: amazon (2000×2000), ebay (1600×1600), etsy (2000×2000), square (1080×1080), instagram_portrait (1080×1350), story (1080×1920), or custom width/height. Without an API key: returns a free watermarked preview (≤700px) plus unlock_url, which a human opens to download the full-resolution file for site credits (then call get_result). With an API key (Authorization: Bearer stb_…): returns download_url for the full-resolution file directly and charges the key owner's credits when the job starts, refunded automatically if processing fails. Retrying a call creates and charges a new job — use get_result to fetch an earlier one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "height": {
                "maximum": 5000,
                "minimum": 50,
                "type": "integer"
              },
              "image_base64": {
                "description": "The image as base64 (or a data: URL), max 2 MB. Use only when no public URL is available.",
                "type": "string"
              },
              "image_url": {
                "description": "Public https:// URL of the image. Preferred over image_base64.",
                "format": "uri",
                "type": "string"
              },
              "preset": {
                "default": "amazon",
                "enum": ["amazon", "ebay", "etsy", "square", "instagram_portrait", "story", "custom"],
                "type": "string"
              },
              "width": {
                "maximum": 5000,
                "minimum": 50,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d1f7e60a7edaaf410b0c82990bc2260308401995c784ccba188375223ee6a9fb"
        }
      ],
      "digest": "sha256:788ef84c92087676848f2d5356f330e3eda1be49520078a3c924d0302fbc54db"
    }
  }
}
