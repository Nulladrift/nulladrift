{
  "lockfileVersion": 2,
  "subjects": {
    "com.dzbuild/dzship": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://freeship.dzbuild.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "dzship",
        "title": "dzship: shipping for Algeria",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "dzship ships cash-on-delivery parcels with Algerian couriers. list_couriers gives a courier key and the credential fields that courier needs. The \"sandbox\" courier needs no credentials and creates nothing: use it to try a call. When this connection carries an X-Courier-Credentials header, leave \"credentials\" out of the call and never ask the user to paste them. Ask the user before create_parcel or cancel_parcel on a real courier.",
      "tools": [
        {
          "name": "cancel_parcel",
          "description": "Cancel a parcel before the courier collects it. Few couriers offer it: list_couriers says which. Ask the user first.",
          "inputSchema": {
            "properties": {
              "courier": {
                "example": "sandbox",
                "type": "string"
              },
              "credentials": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "The caller's own credentials for that courier, 1-8 string fields. Never stored. Omit entirely for the sandbox courier.",
                "type": "object"
              },
              "options": {
                "properties": {
                  "baseUrl": {
                    "description": "Tenant URL, accepted only for the generic \"ecotrack\" courier and only under *.ecotrack.dz. Every other courier has its own key and takes no URL.",
                    "format": "uri",
                    "type": "string"
                  },
                  "fromWilaya": {
                    "maximum": 58,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "timeoutMs": {
                    "maximum": 30000,
                    "minimum": 1000,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "trackingNumber": {
                "example": "DZTEST-1A2B3C",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["courier", "trackingNumber"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:df44b2e01d499112f4e9c4284e810683e0d4a91d10d31a551d6d433a6d6eda63"
        },
        {
          "name": "create_parcel",
          "description": "Create a cash-on-delivery parcel on the merchant's courier account. The \"sandbox\" courier needs no credentials and creates nothing. Ask the user before creating a real parcel.",
          "inputSchema": {
            "properties": {
              "courier": {
                "example": "yalidine",
                "type": "string"
              },
              "credentials": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "The caller's own credentials for that courier, 1-8 string fields. Never stored. Omit entirely for the sandbox courier.",
                "type": "object"
              },
              "options": {
                "properties": {
                  "baseUrl": {
                    "description": "Tenant URL, accepted only for the generic \"ecotrack\" courier and only under *.ecotrack.dz. Every other courier has its own key and takes no URL.",
                    "format": "uri",
                    "type": "string"
                  },
                  "fromWilaya": {
                    "maximum": 58,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "timeoutMs": {
                    "maximum": 30000,
                    "minimum": 1000,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "order": {
                "properties": {
                  "codAmount": {
                    "description": "Integer DZD",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "declaredValue": {
                    "type": "integer"
                  },
                  "deliveryType": {
                    "enum": ["home", "stopdesk"],
                    "type": "string"
                  },
                  "freeShipping": {
                    "type": "boolean"
                  },
                  "hasOpenPackage": {
                    "type": "boolean"
                  },
                  "isExchange": {
                    "type": "boolean"
                  },
                  "notes": {
                    "maxLength": 255,
                    "type": "string"
                  },
                  "productList": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "recipient": {
                    "properties": {
                      "addressLine": {
                        "maxLength": 255,
                        "type": "string"
                      },
                      "communeName": {
                        "type": "string"
                      },
                      "fullName": {
                        "maxLength": 120,
                        "minLength": 2,
                        "type": "string"
                      },
                      "phone": {
                        "description": "Algerian mobile: 05/06/07",
                        "type": "string"
                      },
                      "phoneAlt": {
                        "type": "string"
                      },
                      "wilayaCode": {
                        "maximum": 58,
                        "minimum": 1,
                        "type": "integer"
                      }
                    },
                    "required": ["communeName", "fullName", "phone", "wilayaCode"],
                    "type": "object"
                  },
                  "reference": {
                    "maxLength": 64,
                    "type": "string"
                  },
                  "stopDeskId": {
                    "type": "string"
                  },
                  "weightKg": {
                    "type": "number"
                  }
                },
                "required": ["codAmount", "deliveryType", "productList", "recipient"],
                "type": "object"
              }
            },
            "required": ["courier", "order"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ab0c10e529592cf08a1595550613a8d80a780960b15bee468428287e53685e37"
        },
        {
          "name": "get_rates",
          "description": "Delivery and return fees for a route with one courier.",
          "inputSchema": {
            "properties": {
              "courier": {
                "type": "string"
              },
              "credentials": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "The caller's own credentials for that courier, 1-8 string fields. Never stored. Omit entirely for the sandbox courier.",
                "type": "object"
              },
              "options": {
                "properties": {
                  "baseUrl": {
                    "description": "Tenant URL, accepted only for the generic \"ecotrack\" courier and only under *.ecotrack.dz. Every other courier has its own key and takes no URL.",
                    "format": "uri",
                    "type": "string"
                  },
                  "fromWilaya": {
                    "maximum": 58,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "timeoutMs": {
                    "maximum": 30000,
                    "minimum": 1000,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "query": {
                "properties": {
                  "codAmount": {
                    "type": "integer"
                  },
                  "deliveryType": {
                    "enum": ["home", "stopdesk"],
                    "type": "string"
                  },
                  "fromWilaya": {
                    "maximum": 58,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "tier": {
                    "enum": ["express", "economic"],
                    "type": "string"
                  },
                  "toCommune": {
                    "type": "string"
                  },
                  "toWilaya": {
                    "maximum": 58,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["deliveryType", "toWilaya"],
                "type": "object"
              }
            },
            "required": ["courier", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7a52f03e7b51bfb629196708f3110e739af2ca661eecb0b11984f3d81c6c80a9"
        },
        {
          "name": "list_communes",
          "description": "Communes in the spelling couriers accept. Pass wilaya, q or both: the full list is too large to return.",
          "inputSchema": {
            "properties": {
              "q": {
                "type": "string"
              },
              "wilaya": {
                "maximum": 69,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:424508aaa41449483ed5c9e3a3fbe6254f320f84db5b01b4a1a27a43db83786e"
        },
        {
          "name": "list_couriers",
          "description": "Find a courier: its key, the credential fields it needs and what it supports (create, track, rates, stop desks, label, cancel). Pass q to search by name.",
          "inputSchema": {
            "properties": {
              "platform": {
                "example": "ecotrack",
                "type": "string"
              },
              "q": {
                "example": "rocket",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:86b8afbd58300c41972972dba3dabff232dd61bc316cc2a66aad0977191d0f8a"
        },
        {
          "name": "list_stop_desks",
          "description": "The stop desks a courier runs in one wilaya. Send a desk id as order.stopDeskId.",
          "inputSchema": {
            "properties": {
              "courier": {
                "example": "sandbox",
                "type": "string"
              },
              "credentials": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "The caller's own credentials for that courier, 1-8 string fields. Never stored. Omit entirely for the sandbox courier.",
                "type": "object"
              },
              "options": {
                "properties": {
                  "baseUrl": {
                    "description": "Tenant URL, accepted only for the generic \"ecotrack\" courier and only under *.ecotrack.dz. Every other courier has its own key and takes no URL.",
                    "format": "uri",
                    "type": "string"
                  },
                  "fromWilaya": {
                    "maximum": 58,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "timeoutMs": {
                    "maximum": 30000,
                    "minimum": 1000,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "wilayaCode": {
                "example": 31,
                "maximum": 58,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["courier", "wilayaCode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3d569f163d914b9f919a6c19c15e4fbe362d9fe7755ea8beca4ce6adac189271"
        },
        {
          "name": "list_wilayas",
          "description": "The 58 wilayas couriers deliver to, in French and Arabic. Pass all=true for the 69 of the 2026 division, each with the code to ship it under.",
          "inputSchema": {
            "properties": {
              "all": {
                "description": "Include the wilayas created in 2026 that couriers do not accept yet",
                "type": "boolean"
              },
              "code": {
                "maximum": 69,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a15724a8dcc147d1442f8b36bba9f30b70aa3610760a28819799e60a560542e9"
        },
        {
          "name": "track_parcel",
          "description": "Status and event history of one parcel, in the same status vocabulary for every courier.",
          "inputSchema": {
            "properties": {
              "courier": {
                "type": "string"
              },
              "credentials": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "The caller's own credentials for that courier, 1-8 string fields. Never stored. Omit entirely for the sandbox courier.",
                "type": "object"
              },
              "options": {
                "properties": {
                  "baseUrl": {
                    "description": "Tenant URL, accepted only for the generic \"ecotrack\" courier and only under *.ecotrack.dz. Every other courier has its own key and takes no URL.",
                    "format": "uri",
                    "type": "string"
                  },
                  "fromWilaya": {
                    "maximum": 58,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "timeoutMs": {
                    "maximum": 30000,
                    "minimum": 1000,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "trackingNumber": {
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["courier", "trackingNumber"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:42545f2de2d531f2a18cc104523fc087fdf9c31da690c7822c921ce4f6fc129d"
        }
      ],
      "digest": "sha256:7e3497436712bd118a0dbb14c8de4e50c90781e0d6a2d6a54b29200573fd4eb3"
    }
  }
}
