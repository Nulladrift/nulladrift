{
  "lockfileVersion": 2,
  "subjects": {
    "com.morfran/morfran": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.morfran.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "morfran",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "apply_effect",
          "description": "Apply an AI photo effect to a photo and return the result image URL. Waits up to about 60 seconds. Costs 11 credits (standard) or 29 credits (pro); failed jobs are refunded. The photo must show a real person who agreed to the edit.",
          "inputSchema": {
            "properties": {
              "image_url": {
                "description": "Public URL of the input photo (JPEG, PNG or WebP)",
                "type": "string"
              },
              "quality": {
                "default": "standard",
                "description": "standard or pro",
                "type": "string"
              },
              "slug": {
                "description": "Effect slug from list_effects, e.g. 80s-yearbook",
                "type": "string"
              }
            },
            "required": ["image_url", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:efe1960b3e276242159b7bf2a991b53289084f5b6b0f22dcb1c7d551c65db5ac"
        },
        {
          "name": "detect_faces",
          "description": "Detect faces in a photo with bounding boxes, age range and gender. Costs 1 credit.",
          "inputSchema": {
            "properties": {
              "image_url": {
                "description": "Public URL of the photo",
                "type": "string"
              }
            },
            "required": ["image_url"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4ff434c2da4082318a12b5fba3cc5d336b3abd2e4ebd537cb10aca49bb6df286"
        },
        {
          "name": "face_swap",
          "description": "Put the face from the source photo onto the largest face in the target photo and return the result image URL. Costs 5 credits; failed jobs are refunded. Only use photos of people who consented.",
          "inputSchema": {
            "properties": {
              "source_image_url": {
                "description": "Public URL of the photo with the face to use",
                "type": "string"
              },
              "target_image_url": {
                "description": "Public URL of the photo to put the face on",
                "type": "string"
              }
            },
            "required": ["source_image_url", "target_image_url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e6fa7f88052a12a566ddc37255424555650f0be38a66c09317beff00ce6c9f6a"
        },
        {
          "name": "get_credit_balance",
          "description": "Return the caller's current Morfran credit balance. Free.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:84eb7a98dffc98d4cf5032fae483834ce6c60e80df64c0f13678068d69bb8c0a"
        },
        {
          "name": "get_effect_task",
          "description": "Get the status and result URL of a photo effect task (for long-running or async jobs).",
          "inputSchema": {
            "properties": {
              "task_id": {
                "description": "task_id returned by apply_effect",
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3b3a90cbf0ad51baae02792de4a6c8e4d83822da16fb1ebf4a7f7a6016307dfd"
        },
        {
          "name": "get_face_swap_result",
          "description": "Get the status and result URL of a face swap task.",
          "inputSchema": {
            "properties": {
              "task_id": {
                "description": "TaskId returned by face_swap",
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0c61444511014173fe1626e6b32f14d8a24cb86e77aac30a8b0040d6378e3462"
        },
        {
          "name": "list_effects",
          "description": "List the available AI photo effects (slug, name, category, description, cover image, credit cost). Free.",
