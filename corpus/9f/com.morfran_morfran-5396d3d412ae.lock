        {
          "name": "apply_effect",
          "title": "Apply a photo effect",
          "description": "Apply an AI photo effect to a photo and return the result image URL. Waits up to about 60 seconds. Costs 11 credits (standard) or 29 credits (pro); failed jobs are refunded. The photo must show a real person who agreed to the edit.",
          "inputSchema": {
            "properties": {
              "image_url": {
                "description": "Public URL of the input photo (JPEG, PNG or WebP)",
                "type": "string"
              },
              "quality": {
                "default": "standard",
                "description": "standard or pro",
                "type": "string"
              },
              "slug": {
                "description": "Effect slug from list_effects, e.g. 80s-yearbook",
                "type": "string"
              }
            },
            "required": ["image_url", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Apply a photo effect"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3b1bc148c81627bba3cd9e861908e250ee6a876723f0278879398eaecb10f086"
        },
        {
          "name": "detect_faces",
          "title": "Detect faces",
          "description": "Detect faces in a photo with bounding boxes, age range and gender. Costs 1 credit.",
          "inputSchema": {
            "properties": {
              "image_url": {
                "description": "Public URL of the photo",
                "type": "string"
              }
            },
            "required": ["image_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
