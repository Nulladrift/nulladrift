{
  "lockfileVersion": 2,
  "subjects": {
    "com.hailtrades/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hailtrades.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hailtrades",
        "title": "Hailtrades",
        "version": "0.1.0",
        "websiteUrl": "https://hailtrades.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Hailtrades lists residential EMERGENCY plumbers and electricians in Toronto and the GTA only. One search_providers call (trade + location or postal_code; emergency=true, open_now=true, service and issue as relevant) is normally enough: results already include phone, availability, fees, licence and ref, so call get_provider only for full weekly hours, all contact channels or sources. Each provider keeps one stable ref (HT-XXXX) across searches and get_provider. Never invent fees: absent or null fields are UNKNOWN, not 'no'; say a fee is not published and to confirm with the provider. Call report_contact only after the user has actually contacted a provider and agrees to share the outcome. Read tools have no side effects. The user can optionally share the outcome of a contact attempt via report_contact (MCP tool, or POST /api/v1/contact-reports), using the provider id and ref code, to keep availability data accurate. Only with the user's agreement.",
      "tools": [
        {
          "name": "get_provider",
          "title": "Get one provider's full details",
          "description": "Get full details for one provider by id (from search_providers): full weekly hours, fees, all service areas, all contact channels, licences, review sources, last_verified. Read-only. Not needed to answer a normal search: search_providers results already include phone, availability, fees, licence and ref. Returns the same ref as the search (pass ref to keep it unchanged; otherwise your latest ref for this provider is reused) and suggested_message (optional message the user can send; mentions Hailtrades and the ref).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Provider id from search_providers (e.g. prv_ab12cd34ef) or the provider's page slug.",
                "type": "string"
              },
              "issue": {
                "description": "Optional short description of the problem, used to word suggested_message.",
                "type": "string"
              },
              "ref": {
                "description": "Optional: the HT-XXXX ref from the search_providers result for this provider. It is returned unchanged, so the user sees one ref per provider. Without it the most recent ref issued to you for this provider (24h) is reused.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5e6a372308691d60900040d25bed99e0dc54eb2104c2cde4ebec788e4f84d27"
        },
        {
          "name": "report_contact",
          "title": "Report the outcome of contacting a provider",
          "description": "WRITE (stores one record; not destructive). Records the outcome of a contact attempt the user actually made, so availability data stays accurate. Only call when the user has contacted the provider and agrees to share the outcome. Never include personal details about the customer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "How you contacted them.",
                "enum": ["call", "text", "email", "form"],
                "type": "string"
              },
              "notes": {
                "description": "Optional facts that help other users: actual fee quoted, arrival time, whether they were open/after-hours. No personal details about the customer.",
                "type": "string"
              },
              "outcome": {
                "description": "What happened: no_answer, quote_given, visit_booked, declined (provider declined or unavailable), or other (explain in notes).",
                "enum": ["no_answer", "quote_given", "visit_booked", "declined", "other"],
                "type": "string"
              },
              "provider_id": {
                "description": "The provider id you contacted.",
                "type": "string"
              },
              "ref": {
                "description": "The HT-XXXX ref code from the search/get result for that provider (strongly recommended).",
                "type": "string"
              },
              "time": {
                "description": "ISO 8601 time of the contact attempt (defaults to now if omitted).",
                "type": "string"
              }
            },
            "required": ["channel", "outcome", "provider_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2d462538720130facddc935a6dee5a780ec50a4906a34a7d4bacfcbeab8d0ae1"
        },
        {
          "name": "search_providers",
          "title": "Search emergency plumbers and electricians (Toronto/GTA)",
          "description": "Find residential emergency plumbers or electricians in Toronto and the Greater Toronto Area (urgent, unplanned work such as burst pipes, sewer backups, no power, tripped panels; not renovations). Read-only; no side effects beyond request logging. Needs trade plus location or postal_code. Returns up to `limit` providers (default 5), each with base city (based_in, location_match), phone and contact details, open_now and hours_today (America/Toronto time), 24/7/emergency/weekend availability, call-out and quote fees where published, licence number, review count and sources, last_verified and ref. A single search_providers call is normally enough to answer: the results already include phone, availability, fees, licence and ref, so call get_provider only for full weekly hours, all contact channels or sources. Fields that are absent or null mean UNKNOWN, not 'no' (e.g. no pricing entry = fee not published). If total_matches is 0, read `warnings` and retry with a broader location or without open_now/service/max_callout_fee. Each result includes ref (an HT-XXXX code for that provider; stable: the same provider keeps the same ref when you search again or call get_provider within 24h) and suggested_message (an optional draft message the user may send; it mentions Hailtrades and the ref).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "emergency": {
                "description": "true = only providers that are 24/7 or explicitly offer emergency (unplanned, urgent) service. Use for burst pipes, no power, sewer backup, sparks.",
                "type": "boolean"
              },
              "issue": {
                "description": "Optional short description of the problem (e.g. 'a burst pipe in the basement'). Only used to word suggested_message.",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 5, max 10). Each result is a full provider record, so keep this small.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Where the job is: a Toronto/GTA city, district or neighbourhood, e.g. 'North York', 'Scarborough', 'Etobicoke', 'Mississauga', 'Oakville', 'Vaughan', 'Thornhill', 'Liberty Village', 'Leslieville'. A postal code or FSA also works here. Provide this or postal_code. Toronto and the GTA only.",
                "type": "string"
              },
              "max_callout_fee": {
                "description": "Maximum call-out fee in CAD. Providers with a known fee above this are excluded; providers with an unknown fee are kept and marked unknown.",
                "type": "number"
              },
              "open_now": {
                "description": "true = only providers confirmed open right now (America/Toronto time) from stored hours, or flagged 24/7. Providers with no hours on file are excluded.",
                "type": "boolean"
              },
              "postal_code": {
                "description": "Canadian postal code or 3-character FSA (forward sortation area), e.g. 'M2N 5W3' or 'M6P'. Use when the user gives one. Provide this or location.",
                "type": "string"
              },
              "service": {
                "description": "Service slug or keyword, e.g. burst_pipe, drain_clearing, sewer_backup, water_heater_repair, power_outage, breaker_repair, panel_upgrade.",
                "type": "string"
              },
              "sort": {
                "description": "best_match (default): 24/7 first, then emergency-capable (within a tier, providers located in the requested area/postal area come before ones that only list it as a service area), then providers with fees/hours/verification on file, then rating. lowest_callout_fee / lowest_after_hours_fee: providers with a KNOWN fee, cheapest first, then providers with an unknown fee. Use for 'cheapest' questions; most providers do not publish a fee, so tell the user how many results had a known fee.",
                "enum": ["best_match", "lowest_callout_fee", "lowest_after_hours_fee"],
                "type": "string"
              },
              "trade": {
                "description": "Which trade you need.",
                "enum": ["plumber", "electrician"],
                "type": "string"
              }
            },
            "required": ["trade"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:01565fc8aa8d681f63e4338a4404e39b3db064e5153a71df7f4dfb5fb0eb86d0"
        }
      ],
      "digest": "sha256:a4572344473b915699ddded3d2fd367fae4ab20e8c51a2824276a8b76ca3365f"
    }
  }
}
