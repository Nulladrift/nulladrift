                    },
                    "longitude": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "runway_length_ft": {
                      "type": "integer"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "description": "Number of airports returned",
                "type": "integer"
              },
              "has_more": {
                "type": "boolean"
              },
              "next_offset": {
                "description": "Offset for the next page; absent when has_more is false",
                "type": "integer"
              },
              "offset": {
                "type": "integer"
              },
              "summary": {
                "type": "string"
              },
              "total_available": {
                "description": "Total bookable airports matching the filters",
