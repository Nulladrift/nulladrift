        },
        {
          "name": "lookup_airports",
          "description": "List or search the airports Villiers can book private jet charters from and to — for building an airport picker or validating an airport before get_jet_estimate / request_jet_confirmation. Excludes airports that cannot take private jets, so every result is a valid airport input for the other tools. Search by IATA / ICAO code, airport name or city, optionally filter by country, and page through the full list with limit/offset. Reference data only: no prices, no availability — a specific route's availability is confirmed at request_jet_confirmation.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional. Country name, e.g. France.",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 50, max 100)",
                "type": "integer"
              },
              "offset": {
                "description": "Pagination offset (default 0). Call again with offset=next_offset from the previous response — see has_more/next_offset in the output.",
                "type": "integer"
              },
              "query": {
                "description": "Optional. IATA / ICAO code, airport name or city, e.g. NCE, EGLL, Nice. Omit to page the whole list.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "airports": {
                "items": {
                  "properties": {
                    "city": {
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
                    },
                    "customs_available": {
                      "type": "boolean"
                    },
                    "iata_code": {
                      "type": "string"
                    },
                    "icao_code": {
                      "type": "string"
                    },
