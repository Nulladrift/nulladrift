        },
        {
          "name": "request_jet_confirmation",
          "description": "Submit a request for CONFIRMED live private jet pricing. Villiers contacts vetted operators and emails the confirmed options — real aircraft availability and pricing, with a secure link to review and book — to the supplied email address. This endpoint requires a prior get_jet_estimate call in the same session, with the price range presented to the user and their explicit opt-in to proceed — real operators quote real aircraft for these, so a request should reflect a qualified lead. Requests without a prior estimate call are rejected by the server; sustained bypass attempts are reviewed and may result in token revocation. Requires the user's email and a departure date. SANDBOX TESTING: to test your integration without ever creating a real trip or contacting a real operator, use email 'sandbox-test@mail.villiers.ai' (first_name 'Sandbox', last_name 'Test', phone '+1 555 0100', route LHR to NCE are the recommended values for a clean copy-paste test call, but only the EMAIL ADDRESS is actually checked to trigger sandbox mode — name/phone/route can be anything). Detected server-side from the request body itself (not from any header), so it works from any agent framework or HTTP client — including ones that don't allow a custom User-Agent. The response will say 'Test request accepted (sandbox mode detected)'. For further testing guidance, email affiliates@mail.villiers.ai.",
          "inputSchema": {
            "properties": {
              "aircraft_category": {
                "description": "Optional preference, e.g. Light Jet / Midsize Jet / Heavy Jet",
                "type": "string"
              },
              "client_reference": {
                "description": "Optional opaque reference from YOUR OWN system (e.g. your internal order/booking id) for this request. Stored against the trip and echoed back unchanged in the response. Pass it here, then use get_confirmation_status with the returned trip_id to check the outcome later — no webhook needed. Never shown to the client or operator. (optional)",
                "type": "string"
              },
              "departure_date": {
                "description": "Departure date, YYYY-MM-DD (REQUIRED)",
                "type": "string"
              },
              "destination": {
                "description": "Destination airport — city / airport name / IATA / ICAO, e.g. Nice or NCE (same as get_jet_estimate)",
                "type": "string"
              },
              "email": {
                "description": "Email address to send the confirmed options to (REQUIRED)",
                "type": "string"
              },
              "first_name": {
                "description": "Passenger first name (optional)",
                "type": "string"
              },
              "flexible_dates": {
                "description": "Are the dates flexible? (optional)",
                "type": "boolean"
              },
              "last_name": {
                "description": "Passenger last name (optional)",
                "type": "string"
              },
              "luggage": {
                "description": "Extra or outsized luggage? (optional)",
                "type": "boolean"
              },
              "origin": {
                "description": "Origin airport — city / airport name / IATA / ICAO, e.g. London or LHR or EGLL (same as get_jet_estimate)",
                "type": "string"
              },
              "passengers": {
                "description": "Number of passengers (default 4)",
                "type": "integer"
              },
              "pets": {
                "description": "Travelling with pets? (optional)",
                "type": "boolean"
              },
              "phone": {
                "description": "Contact phone number (optional)",
                "type": "string"
              },
              "return_date": {
                "description": "Return date YYYY-MM-DD (for round trips)",
                "type": "string"
              },
              "round_trip": {
                "description": "Round trip? Default false",
                "type": "boolean"
              },
              "special_requests": {
                "description": "Free-text special requests: catering, accessibility, timing, occasion, etc. (optional)",
                "type": "string"
              },
              "wheelchair": {
                "description": "Wheelchair access required? (optional)",
                "type": "boolean"
              }
            },
            "required": ["departure_date", "destination", "email", "origin"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "client_reference": {
                "description": "Echoed back unchanged if you supplied one",
                "type": "string"
              },
              "email": {
                "description": "Address the confirmed options are emailed to",
                "type": "string"
              },
              "message": {
                "description": "Human-readable confirmation to relay to the user",
                "type": "string"
              },
              "status": {
                "description": "e.g. 'received'",
                "type": "string"
              },
              "trip_id": {
                "description": "Pass this to get_confirmation_status later to poll the outcome",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request confirmed jet pricing"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e3ef1fbc7ced1b97b527317e7cfc05a2a0348e8a09379e884e9f0d827a9089f2"
        },
        {
          "name": "search_empty_legs",
          "description": "Search Villiers' available empty-leg flights — heavily discounted, one-off private jet repositioning flights that are significantly cheaper than a full charter. Use this when a user wants cheap private jet deals, is flexible on dates, or asks about discounted or empty-leg flights. Optionally filter by origin, destination or region. Each result links to the specific flight to view and enquire.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Departure date YYYY-MM-DD. Narrows the whole list (with or without a route) to flights departing that day; with date_to it is the first day of a range. A day with no flight returns no legs plus nearest_dates. Optional.",
                "type": "string"
              },
              "date_to": {
                "description": "Last departure date YYYY-MM-DD, inclusive, for a range with date (a weekend, a week). Optional. Defaults to date.",
                "type": "string"
              },
              "destination": {
                "description": "Destination city / airport name / IATA / ICAO, e.g. Nice or NCE. Optional.",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 20, max 50)",
                "type": "integer"
              },
              "offset": {
                "description": "Pagination offset (default 0). Call again with offset=next_offset from the previous response to page past the first `limit` results — see has_more/next_offset in the output.",
                "type": "integer"
              },
              "origin": {
                "description": "Origin city / airport name / IATA / ICAO, e.g. London or LHR or EGLL. Optional — mirrors destination, filters strictly on the departure side. Useful for a 'departing near me' search.",
                "type": "string"
              },
              "region": {
                "description": "Region filter: europe / americas / asia / all. Optional.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "description": "Number of empty legs returned",
                "type": "integer"
              },
              "date_filter": {
                "description": "The inclusive date range applied, when date or date_to was given",
                "properties": {
                  "from": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "empty_legs": {
                "items": {
                  "properties": {
                    "aircraft": {
                      "type": "string"
                    },
                    "currency": {
                      "type": "string"
                    },
                    "date": {
                      "type": "string"
                    },
                    "from": {
                      "type": "string"
                    },
                    "from_code": {
                      "type": "string"
                    },
                    "price": {
                      "type": "string"
                    },
                    "seats": {
                      "type": "integer"
                    },
                    "to": {
                      "type": "string"
                    },
                    "to_code": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "has_more": {
                "description": "True if more results exist beyond this page",
                "type": "boolean"
              },
              "nearest_dates": {
                "description": "On a date miss: the nearest dates that do have a listed flight",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "next_offset": {
                "description": "Offset to pass in the next call to continue paging; null when has_more is false",
                "type": "integer"
              },
              "next_step": {
                "properties": {
                  "action": {
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "label": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "offset": {
                "description": "The offset this response was generated at",
                "type": "integer"
              },
              "summary": {
                "type": "string"
              },
              "total_available": {
                "description": "Total matching empty legs available",
                "type": "integer"
              }
            },
            "type": "object"
          },
