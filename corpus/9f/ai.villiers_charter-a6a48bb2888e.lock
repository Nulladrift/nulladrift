        {
          "name": "list_attributed_enquiries",
          "description": "List the charter enquiries (trips) attributed to YOUR OWN affiliate token, newest first — so you can match enquiries that arrived via your website tracking link without going through the affiliate dashboard. Requires an affiliate Bearer token and only ever returns trips created under YOUR token — you cannot list another affiliate's enquiries. Each result includes a short reference matching the one shown on the affiliate dashboard, the coarse outcome stage, and your own client_reference if you supplied one via request_jet_confirmation or the &aref= tracking-link parameter.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (default 20, max 50)",
                "type": "integer"
              },
              "offset": {
                "description": "Pagination offset (default 0). Call again with offset=next_offset from the previous response to page past the first `limit` results — see has_more/next_offset in the output.",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "description": "Number of enquiries returned",
                "type": "integer"
              },
              "enquiries": {
                "items": {
                  "properties": {
                    "affiliate_client_reference": {
                      "type": "string"
                    },
                    "created_at": {
                      "type": "string"
                    },
                    "departure_date": {
                      "type": "string"
                    },
                    "destination": {
                      "type": "string"
                    },
                    "destination_name": {
                      "type": "string"
                    },
                    "origin": {
                      "type": "string"
                    },
                    "origin_name": {
                      "type": "string"
                    },
                    "return_date": {
                      "type": "string"
                    },
                    "short_reference": {
                      "description": "First 8 hex characters of trip_id, upper-cased — matches the affiliate dashboard",
                      "type": "string"
                    },
                    "stage": {
                      "description": "Coarse bucket: in_progress | options_sent | booked | closed_no_booking",
                      "type": "string"
                    },
                    "status": {
                      "description": "Villiers' internal status string, for reference",
                      "type": "string"
                    },
                    "trip_id": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "has_more": {
                "description": "True if more results exist beyond this page",
                "type": "boolean"
              },
              "next_offset": {
                "description": "Offset to pass in the next call to continue paging; null when has_more is false",
                "type": "integer"
              },
              "offset": {
                "description": "The offset this response was generated at",
                "type": "integer"
              },
              "summary": {
                "type": "string"
              },
              "total_available": {
                "description": "Total matching enquiries under your affiliate token",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
