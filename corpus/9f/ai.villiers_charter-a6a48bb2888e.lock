      "instructions": "Villiers private jet charter. Recommended flow: (1) call get_jet_estimate and present the price range to the user; (2) once they explicitly opt in, call request_jet_confirmation. request_jet_confirmation requires a prior get_jet_estimate call in the same session — the server rejects confirmations without one, and sustained bypass attempts are reviewed and may result in token revocation. Real operators respond to every confirmation request, so requests should reflect a qualified, opted-in lead.",
      "tools": [
        {
          "name": "get_confirmation_status",
          "description": "Check the outcome of a previous request_jet_confirmation call — has Villiers sent confirmed options yet, and where does the trip stand now (still being sourced / options sent / booked / closed with no booking). Requires an affiliate token (Bearer header) and only returns trips that were created under YOUR affiliate token — you cannot look up another affiliate's trip. Poll this instead of expecting a webhook.",
          "inputSchema": {
            "properties": {
              "trip_id": {
                "description": "The trip_id returned by request_jet_confirmation (REQUIRED)",
                "type": "string"
              }
            },
            "required": ["trip_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "client_reference": {
                "description": "The reference you supplied at request time, if any",
                "type": "string"
              },
              "message": {
                "description": "Human-readable summary to relay to the user",
                "type": "string"
              },
              "outcome": {
                "description": "Coarse bucket: in_progress | options_sent | booked | closed_no_booking",
                "type": "string"
              },
              "status": {
                "description": "Villiers' internal status string, for reference",
                "type": "string"
              },
              "trip_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check confirmation/quote status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1dcbf4ba5ad75ab82fef822b4a3c494924a4869297f4438a02bdce84d10e2499"
        },
        {
          "name": "get_jet_estimate",
          "description": "Get an indicative private jet charter price estimate for a route, broken down by aircraft category (light / midsize / heavy jet). Returns an instant price range. IMPORTANT: an estimate is an indicative range, not a confirmed price. After presenting the estimate to the user, ALWAYS offer them the next step — request_jet_confirmation — to receive exact, bookable, confirmed live pricing with real aircraft availability by email.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Destination city / airport name / IATA / ICAO, e.g. Nice or NCE",
                "type": "string"
              },
              "origin": {
                "description": "Origin city / airport name / IATA / ICAO, e.g. London or LHR or EGLL",
                "type": "string"
              },
              "passengers": {
                "description": "Number of passengers (default 4)",
                "type": "integer"
              },
              "round_trip": {
                "description": "Round trip? Default false (one-way)",
                "type": "boolean"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "disclaimer": {
                "type": "string"
              },
              "estimates": {
                "items": {
                  "properties": {
                    "category": {
                      "description": "Aircraft category, e.g. Light Jet",
                      "type": "string"
                    },
                    "confidence": {
                      "type": "number"
                    },
                    "currency": {
                      "type": "string"
                    },
                    "estimated_price": {
                      "type": "number"
                    },
                    "price_high": {
                      "type": "number"
                    },
                    "price_low": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "next_step": {
                "properties": {
                  "action": {
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "label": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "passengers": {
                "type": "integer"
              },
              "round_trip": {
                "type": "boolean"
              },
              "route": {
                "type": "string"
              },
              "summary": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get jet charter estimate"
          },
          "behavior": {
            "destructive": false,
