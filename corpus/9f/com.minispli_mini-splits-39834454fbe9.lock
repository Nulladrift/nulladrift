{
  "lockfileVersion": 2,
  "subjects": {
    "com.minispli/mini-splits": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://minispli.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "old-west-minisplits",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Old West Minisplits installs ductless mini split heat pumps in Austin and Central Texas. Flat-rate ductless mini splits posted up front: $2,000 one zone, $3,700 two, $5,400 three. Use get_pricing and estimate_job for prices, check_coverage for a ZIP or city, get_financing for monthly payments, and request_quote only when the user explicitly asks to be contacted and gives their own phone or email.",
      "tools": [
        {
          "name": "check_coverage",
          "title": "Check coverage",
          "description": "Whether a ZIP code or city is in the service area, with local housing facts when available.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 60,
                "type": "string"
              },
              "zip": {
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e2e0b82cd3fe072c1ec84314908382b170547dd70beac1faebf36083f42f9815"
        },
        {
          "name": "estimate_job",
          "title": "Estimate a mini split job",
          "description": "Installed price for a number of zones (indoor units), with the financing option.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "zones": {
                "description": "Number of rooms / indoor units",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["zones"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:03f238d138108cbc1cf94f8a5ace879970a9957bd3e3c09a4636a53bb5079e48"
        },
        {
          "name": "get_financing",
          "title": "Financing",
          "description": "Monthly payment for a system price: $2,000 down, 10% APR fixed, 40-50 months, on approved credit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "months": {
                "maximum": 50,
                "minimum": 40,
                "type": "integer"
              },
              "price_usd": {
                "maximum": 60000,
                "minimum": 2500,
                "type": "number"
              }
            },
            "required": ["price_usd"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:202b2d6c1080176f308af51974370796895dcc6217ba37900eb4b2937dd06006"
        },
        {
          "name": "get_pricing",
          "title": "Posted prices",
          "description": "Old West Minisplits's posted installed prices and what they include.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9cf6654c3ea383eb501834bf8deef4a86562076a393717c18e9a14d35e1b3829"
        },
        {
          "name": "request_quote",
          "title": "Request a quote",
          "description": "Send a mini split quote request to the crew. Only when the user explicitly asks to be contacted and gives their own phone or email.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "format": "email",
                "maxLength": 120,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "maxLength": 30,
                "type": "string"
              },
              "rooms": {
                "maxLength": 400,
                "type": "string"
              },
              "zip": {
                "maxLength": 10,
                "type": "string"
              },
              "zones": {
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24fbb571bbbd00c8ab0955e8aa083065cac087bf8118f3d495a29dd0e2402b4c"
        }
      ],
      "digest": "sha256:58eff39539dad68d62ddbfc0a31c16e802266437945cde8579aa45c4f860d362"
    }
  }
}
