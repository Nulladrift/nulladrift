                                "type": "string"
                              },
                              "transform": {
                                "additionalProperties": false,
                                "description": "Hóa Lộc, Hóa Quyền, Hóa Khoa or Hóa Kỵ when the year stem transforms this star",
                                "properties": {
                                  "vi": {
                                    "type": "string"
                                  },
