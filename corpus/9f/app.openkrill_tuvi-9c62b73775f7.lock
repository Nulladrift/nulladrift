                      "vi": {
                        "type": "string"
                      },
                      "zh": {
                        "type": "string"
                      }
                    },
                    "required": ["vi", "zh"],
                    "type": "object"
                  },
                  "bureau": {
                    "additionalProperties": false,
                    "description": "Cục, from the nạp âm of the Mệnh palace",
                    "properties": {
                      "number": {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "vi": {
                        "type": "string"
                      },
                      "zh": {
                        "type": "string"
                      }
                    },
                    "required": ["number", "vi", "zh"],
                    "type": "object"
                  },
                  "day_note": {
                    "description": "Present only when a 23:00 birth moved the chart to the next solar day",
                    "type": "string"
                  },
                  "forward": {
                    "description": "Yang man or yin woman: the 10-year periods run forward",
                    "type": "boolean"
                  },
                  "hour_branch": {
