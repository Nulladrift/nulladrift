        {
          "name": "tuvi_chart",
          "title": "Cast a Tu Vi birth chart",
          "description": "Use this when someone wants their Tu Vi (Zi Wei Dou Shu, 紫微斗数) birth chart or its reading. Pass `birth_date` (solar, YYYY-MM-DD, 1921 to 2100), `birth_time` (local HH:MM, 24-hour) and `gender`. Optional: `calendar` (vi, the default, or zh), `leap_month` (split, same or next), `late_zi` (next_day or same_day for a 23:00 birth), `topics`. Returns the lunar date, the 12 palaces with the 14 main stars, 14 minor stars, the four transformations and the 10-year periods, in Vietnamese and Chinese, plus readings for births from 1950 to 2026 from an open CC BY dataset, each with citations to the classic 紫微斗数全书. Keep the `attribution` with any reading you repeat. Readings are cultural, not predictions.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "A birth date, clock time and gender, plus optional calendar rules.",
            "examples": [
              {
                "birth_date": "1990-03-12",
                "birth_time": "14:30",
                "gender": "male",
                "topics": ["career"]
              }
            ],
            "properties": {
              "birth_date": {
                "description": "Birth date on the solar (Gregorian) calendar, YYYY-MM-DD, from 1921 to 2100",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "birth_time": {
                "description": "Local clock time of birth, HH:MM in 24-hour form. 23:00 to 00:59 is the Tý hour",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "calendar": {
                "default": "vi",
                "description": "Lunar calendar and tradition: vi is the Vietnamese calendar (UTC+7 from 1968, UTC+8 before) with Mệnh chủ by year branch; zh the Chinese one (UTC+8) with 命主 by Life-palace branch",
                "enum": ["vi", "zh"],
                "type": "string"
              },
              "gender": {
                "description": "Gender at birth; it sets the direction of the 10-year periods",
                "enum": ["male", "female"],
                "type": "string"
              },
              "late_zi": {
                "default": "next_day",
                "description": "A birth from 23:00 counts as the Tý hour of the next day (next_day, the common rule) or of the same day",
                "enum": ["next_day", "same_day"],
                "type": "string"
              },
              "leap_month": {
                "default": "split",
                "description": "A birth in a leap month counts as: split, the same month up to day 15 and the next month after it; same; or next",
                "enum": ["split", "same", "next"],
                "type": "string"
              },
              "topics": {
                "description": "Reading topics to return; all 13 when left out",
                "items": {
                  "enum": ["overview", "personality", "love", "career", "wealth", "health", "family", "children", "move", "friends", "home", "spirit", "parents"],
                  "type": "string"
                },
                "maxItems": 13,
                "type": "array"
              }
            },
            "required": ["birth_date", "birth_time", "gender"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "type": "string"
              },
              "chart": {
                "additionalProperties": false,
                "properties": {
                  "body_branch": {
                    "additionalProperties": false,
