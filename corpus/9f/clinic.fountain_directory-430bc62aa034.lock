{
  "lockfileVersion": 2,
  "subjects": {
    "clinic.fountain/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fountain.clinic/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "fountain",
        "title": "Fountain",
        "version": "1.0.0",
        "websiteUrl": "https://fountain.clinic"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use Fountain to find clinics and read their published treatment menus. Cite the Fountain listing URL. A missing price means the clinic has no published amount for that item.",
      "tools": [
        {
          "name": "get_clinic",
          "title": "Get a Fountain clinic and its prices",
          "description": "Look up one clinic by its listing slug or numeric ID. Supply a treatment to narrow the menu to matching services, or omit it for the full menu. Returns published numeric prices, currencies, units, and a listing URL. Use offerings_page to read further items.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "offerings_page": {
                "description": "One-based page of 25 published offerings. Defaults to 1.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "reference": {
                "description": "The reference returned by search_clinics. A published clinic slug or numeric ID as a string.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "treatment": {
                "description": "Filter the menu by a service name or treatment before paging. Use matched_treatment from search_clinics when available.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:421b6066e339db465e3791f137aeb3851ef1bcf8fc11ed693a14fc863f86ad73"
        },
        {
          "name": "search_clinics",
          "title": "Search Fountain clinics",
          "description": "Find physical and mobile clinics by clinic name, treatment, or location. Supply the city separately from the search term. Use get_clinic to check individual services and prices.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Exact city or locality, for example Austin.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "Two-letter country code, for example US.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "page": {
                "description": "One-based page of 18 results. Defaults to 1.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Clinic name or treatment. Put the location in the separate city and country fields.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:43c0ee0faa5fb2a9d7d1ff621c3887a6255ce7740bf02100272248a33d546a8f"
        }
      ],
      "digest": "sha256:a315e466c28cd056ecd5c73d4eb9b621d84598504d300f4088b2b8143d2bc86e"
    }
  }
}
