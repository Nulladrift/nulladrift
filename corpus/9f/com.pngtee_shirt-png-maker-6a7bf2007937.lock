        {
          "name": "generate",
          "title": "Make a design",
          "description": "Upload the shirt design you have, or describe one, and get a transparent PNG with no box behind the art, checked on a dark and a light shirt color. With a redeem code that has credits it spends one credit and returns the clean PNG's URL. Without a code it returns a free watermarked preview URL and an unlock object that says how your user can pay.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The redeem code your user got after paying on the site. Optional when the MCP connection already sends it as Authorization: Bearer.",
                "type": "string"
              },
              "image_url": {
                "description": "An https URL of an existing design (PNG, JPG or WebP, up to 24 MB). Its background is removed and its edge cleaned; nothing is redrawn.",
                "type": "string"
              },
              "preset": {
                "description": "The style. Defaults to the first.",
                "enum": ["retro", "cute", "lettering", "street", "mascot"],
                "type": "string"
              },
              "prompt": {
                "description": "What the image shows, 3 to 400 characters. One subject works best. No real people. Give this OR image_url.",
                "type": "string"
              }
            },
