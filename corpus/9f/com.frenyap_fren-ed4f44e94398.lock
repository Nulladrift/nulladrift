{
  "lockfileVersion": 2,
  "subjects": {
    "com.frenyap/fren": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.frenyap.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "FREN",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "find_place",
          "title": "Find a place",
          "description": "Finds up to 5 places matching a name in one country and returns their names and coordinates. Results come from OpenStreetMap data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter ISO 3166-1 country code, for example DE",
                "maxLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "lang": {
                "description": "Optional language code for the reply, for example en",
                "maxLength": 8,
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name to search for",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["country", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1a9e5a7261307403ff7036cf710341cb8678cb5b76f8814f25a082341bb26b3e"
        },
        {
          "name": "get_fren_coverage",
          "title": "Check coverage in a country",
          "description": "Reports whether camera alerts, offline maps and offline navigation are available in one country. Returns availability only and does not return any individual camera data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter ISO 3166-1 country code, for example DE",
                "maxLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "lang": {
                "description": "Optional language code for the reply, for example en",
                "maxLength": 8,
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check coverage in a country"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cdd6812c2f1bd64f34afbf35beda90cbb35280b95b3bbb030e247af891f4f0ab"
        },
        {
          "name": "list_fren_countries",
          "title": "List supported countries",
          "description": "Lists the countries where FREN offers camera alerts, offline maps or offline navigation, with the availability of each. Returns country codes and names only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Optional language code for the reply, for example en",
                "maxLength": 8,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List supported countries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:16cdf83cabdec8e3c31072853a1580bca999adfe7a4397668400a41852d4d506"
        },
        {
          "name": "plan_route",
          "title": "Plan a driving route",
          "description": "Plans a driving route between two points in one country and returns the distance, the travel time and the main steps. It does not return a map, and drivers must follow road signs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter ISO 3166-1 country code, for example DE",
                "maxLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "from": {
                "additionalProperties": false,
                "description": "Start point: latitude and longitude",
                "properties": {
                  "lat": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "lon": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["lat", "lon"],
                "type": "object"
              },
              "lang": {
                "description": "Optional language code for the reply, for example en",
                "maxLength": 8,
                "type": "string"
              },
              "to": {
                "additionalProperties": false,
                "description": "End point: latitude and longitude",
                "properties": {
                  "lat": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "lon": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["lat", "lon"],
                "type": "object"
              }
            },
            "required": ["country", "from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan a driving route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b308c24f628fa1f5d129d1b4f9599e4389b66d34881492ce7673028547e5dc33"
        }
      ],
      "digest": "sha256:154dbe4b33c94eedd1c85f78f0870c785a995f0bc15bf2bb30b265f4d0050561"
    }
  }
}
