      },
      "instructions": "Academic conference and journal data from Conference Partner (myhuiban.com). Use search_conferences / search_journals for keyword search; list_conferences / list_journals to browse curated lists (ranking parameter); get_conference / get_journal for full detail by id; get_statistics for site-level stats; get_researcher for a researcher's public profile by id (no search/enumeration of researchers). Every tool has a REST twin under /api/* returning identical payloads. Rank fields: ccf_rank (A/B/C), core_rank (A*/A/B/C), qualis_rank (A1..B5); an empty string means the venue is not on that list (not missing data). Rank filters take comma-separated values matched as OR (ccf_rank=A,B,C = any CCF rank). Every venue carries fields: the research-field slugs it is tagged with, the same values the field parameter accepts. Search tools, list_conferences (cfp / past_cfp / upcoming / past / cp_index) and list_journals (cfp / all) accept a research-field filter (field parameter); search tools also accept updated_since for incremental sync (day resolution; checkpoint on the updated_at field). Access: search_conferences, search_journals, list_conferences, list_journals and get_statistics need NO credentials — call them directly (rate-limited per client IP). The detail tools get_conference / get_journal / get_researcher require a free-account credential sent as an Authorization: Bearer <credential> request header — either an API key created at https://www.myhuiban.com/account/api-keys (starts with hb_, never expires, revocable individually; this is what to configure in clients that take a URL plus a fixed header) or a JWT from POST /api/login. Subject to a daily quota. See https://www.myhuiban.com/developers. Responses do not include each venue's external website — point users to the returned detail_page (the canonical Conference Partner page); paid detail calls additionally include the official website URL.",
      "tools": [
        {
          "name": "get_conference",
          "description": "Get full details of a conference by id: basics, CFP text, acceptance-rate history, edition history, structured ratings and comments, related conferences/journals. REQUIRES CREDENTIALS: Authorization: Bearer <credential> (free API key from https://www.myhuiban.com/account/api-keys, or a JWT from POST /api/login). responses link to the Conference Partner detail_page, not the venue's external website.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Conference id",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:843285726faa6255befea528582e15491136b6a2388a271b41de264de9b2c1b2"
        },
        {
