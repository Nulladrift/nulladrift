        {
          "name": "list_conferences",
          "description": "Browse conference lists and rankings (open CFPs, ranked venues with a call open now, popularity, most competitive, etc.), paginated. No keyword filtering — use search_conferences for that.",
          "inputSchema": {
            "properties": {
              "field": {
                "description": "Research field filter. Only for ranking=cfp, past_cfp, upcoming, past or cp_index (e.g. ranking=cfp with field=ai = AI conferences still accepting papers, soonest deadline first)",
                "enum": ["ai", "vision", "nlp", "data", "network", "security", "se", "systems", "theory", "hci", "graphics", "bio", "robotics", "web", "ee", "energy", "materials", "civil", "education", "management", "math"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number, 1-based",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 20,
                "description": "Items per page, max 100",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "ranking": {
                "description": "cfp=open calls for papers; past_cfp=expired calls; ccf/core/qualis=venues in that tier whose submission deadline has not passed (for the whole tier catalogue use search_conferences with ccf_rank / core_rank / qualis_rank); cp_index=every conference ordered by the Conference Partner Index, our own 0-100 score - the only list here that covers the whole catalogue instead of the fifth of it that CCF / ICORE / QUALIS rate; each row carries cp_index with its confidence, and https://www.myhuiban.com/ranking has the method; most_viewed/most_tracked/most_attended=popularity; most_competitive=lowest acceptance rate; upcoming/past=by conference date; trending=most viewed in the last 30 days",
                "enum": ["cfp", "past_cfp", "ccf", "core", "qualis", "most_viewed", "most_tracked", "most_attended", "most_competitive", "upcoming", "past", "trending", "cp_index"],
                "type": "string"
              }
            },
            "required": ["ranking"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9fd8a7caec36cefb646d1796513028506793eba4990e5d711a3e119c9894da40"
        },
