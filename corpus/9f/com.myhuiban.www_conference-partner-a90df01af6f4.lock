        },
        {
          "name": "search_conferences",
          "description": "Search academic conferences. Every parameter is optional — combine any of keyword, CCF/CORE/QUALIS rank, research field and submission/conference date ranges. Filter-only queries work fine (e.g. field=ai plus a submission-deadline window, no keyword). Returns a paginated list.",
          "inputSchema": {
            "properties": {
              "ccf_rank": {
                "description": "CCF rank: A, B or C. Comma-separate to match any of several (A,B,C = any CCF rank). Venues with no CCF rank have ccf_rank \"\" in the results",
                "type": "string"
              },
              "conference_date_end": {
                "description": "Conference date until (YYYY-MM-DD)",
                "type": "string"
              },
              "conference_date_start": {
                "description": "Conference date from (YYYY-MM-DD)",
                "type": "string"
              },
              "core_rank": {
                "description": "ICORE rank: A*, A, B or C. Comma-separate to match any of several (A*,A)",
                "type": "string"
              },
              "field": {
                "description": "Research field (e.g. ai, security, systems, ee, energy) - see the field enum for the full list",
                "enum": ["ai", "vision", "nlp", "data", "network", "security", "se", "systems", "theory", "hci", "graphics", "bio", "robotics", "web", "ee", "energy", "materials", "civil", "education", "management", "math"],
                "type": "string"
