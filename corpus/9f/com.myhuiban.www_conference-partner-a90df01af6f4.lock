                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "qualis_rank": {
                "description": "QUALIS rank: A1, A2, B1..B5. Comma-separate to match any of several (A1,A2)",
                "type": "string"
              },
              "query": {
                "description": "Keyword, matched against short/full name",
                "type": "string"
