        },
        {
          "name": "get_statistics",
          "description": "Site-level public statistics: conference/journal totals, how many conferences have an open call for papers, upcoming deadlines by month, open CFPs by CCF / ICORE / QUALIS tier, conference country and research-field distributions, journal impact-factor, CCF-tier, publisher and research-field distributions. Research-field keys are the same slugs the search tools accept in their field parameter.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
