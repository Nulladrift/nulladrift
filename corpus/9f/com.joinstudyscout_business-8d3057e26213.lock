        {
          "name": "launchStudy",
          "title": "Submit a draft for review, holding its full price from the balance",
          "description": "Submit a draft for review, holding its full price from the balance. This spends: it holds the study’s full price (price.totalCents) from the balance. The price comes from the card or your account’s own price, never from the request. A short balance answers 402 with how much is missing and the amount to top up. The study’s status is then in_review: a person at StudyScout reviews every study before any member sees it, and no key can approve one. It goes live, or rejected with a rejectionReason, and the owner’s address gets an email either way; getStudyStatus follows it. What isn’t used comes back when the study ends.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotencyKey": {
                "description": "Any unique text, sent again unchanged when you retry this call: a retry gets the first answer back and spends nothing twice. Left out, one is made for this call and the answer says which, so a retry can use it.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "studyId": {
                "description": "The study’s id, as createStudy or listStudies returns it.",
                "type": "string"
              }
            },
            "required": ["studyId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
