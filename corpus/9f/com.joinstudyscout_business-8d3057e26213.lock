        {
          "name": "countAudience",
          "title": "How many members a targeting matches",
          "description": "How many members a targeting matches. Ask before you launch. Reading it costs nothing. The count is the exact number of members: a study needs at least as many matches as the responses it wants.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "description": "The study’s format: a recording study’s count leaves out the states it excludes.",
                "enum": ["quick_poll", "survey", "recording", "external", "interview", "ad_ranking", "usability"],
                "type": "string"
              },
              "targeting": {
                "description": "The study’s targeting, as JSON in the query. Left out: every eligible adult.",
                "properties": {
                  "ageQuotas": {
                    "additionalProperties": {
                      "type": "integer"
                    },
                    "description": "Responses wanted from each age band the range covers.",
                    "type": ["object", "null"]
                  },
                  "ageRange": {
                    "description": "The ages that may answer, ends included. Left out or null: any adult age.",
                    "properties": {
                      "max": {
                        "description": "Oldest age to invite, in whole years; 99 or less, and no less than min.",
                        "maximum": 99,
                        "minimum": 18,
                        "type": "integer"
                      },
                      "min": {
                        "description": "Youngest age to invite, in whole years; 18 or more, and no more than max.",
                        "maximum": 99,
                        "minimum": 18,
                        "type": "integer"
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "genderQuotas": {
                    "additionalProperties": {
                      "type": "integer"
                    },
                    "description": "Responses wanted from each chosen gender.",
                    "type": ["object", "null"]
                  },
                  "genders": {
                    "description": "The genders that may answer. Left out or null: any, a gender not stated included. An empty list blocks launch.",
                    "items": {
                      "enum": ["Women", "Men", "Non-binary", "Prefer not to say"],
                      "type": "string"
                    },
                    "type": ["array", "null"]
                  },
                  "regionQuotas": {
                    "additionalProperties": {
                      "type": "integer"
                    },
                    "description": "Responses wanted from each region.",
                    "type": ["object", "null"]
                  },
                  "regions": {
                    "description": "The US Census regions that may answer. Left out or null: no limit. Not with states. An empty list blocks launch.",
                    "items": {
                      "enum": ["Northeast", "Midwest", "South", "West"],
                      "type": "string"
                    },
                    "type": ["array", "null"]
                  },
                  "states": {
                    "description": "The states (and DC), by postal code, that may answer. Left out or null: no limit. Not with regions. An empty list blocks launch.",
                    "items": {
                      "enum": ["AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "DC", "FL", "GA", "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME", "MD", "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", "NJ", "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY"],
                      "type": "string"
