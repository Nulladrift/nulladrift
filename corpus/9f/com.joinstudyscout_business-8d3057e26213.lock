        {
          "name": "createStudy",
          "title": "A new draft from its fields",
          "description": "A new draft from its fields. An unfinished draft is fine: issues in the answer says what still blocks launch, and price says what it will cost. Nothing is held or sent to anyone until you launch. The list prices (getAccount says this account’s own): Quick poll (quick-poll): $1 per response, at least 100; Survey (survey): $1.95 per complete, at least 100; Video ad test (video-reaction): $25 per video, at least 20; Recording session (recording-session): $10 per person for up to 10 minutes, $25 for up to 30 minutes and $45 for up to an hour, at least 20; AI interview (interview): $50 per interview, at least 10; AI video interview (video_interview): $75 per interview, at least 10; Ad ranking (ad-ranking): $20 per person, at least 10; Usability test (usability): $25 per person for up to 10 minutes, $40 for up to 20 minutes and $60 for up to 30 minutes, at least 5; Your own survey link (external): $2.75 per complete for up to 10 minutes, $4.25 for up to 15 minutes, $5.50 for up to 20 minutes, $7 for up to 25 minutes and $8.50 for up to 30 minutes, at least 100.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "format": "quick_poll",
                "questions": [
                  {
                    "options": ["Harbor", "Ledgerly", "Neither"],
                    "prompt": "Which of these names would you trust more for a bank?",
                    "type": "single_choice"
                  }
                ],
                "targetCount": 100,
                "title": "Which name wins"
              },
              {
                "format": "survey",
                "goal": "Learn how people pick a snack brand.",
                "questions": [
                  {
                    "options": ["Grocery store", "Convenience store", "Online"],
                    "prompt": "Where do you usually buy snacks?",
                    "type": "single_choice"
                  },
                  {
                    "prompt": "How much does price matter when you pick a snack?",
                    "scaleHighLabel": "A great deal",
                    "scaleLowLabel": "Not at all",
                    "type": "scale"
                  },
                  {
                    "prompt": "What would make you switch snack brands?",
                    "type": "short_text"
                  }
                ],
                "targetCount": 100,
                "targeting": {
                  "ageRange": {
                    "max": 44,
                    "min": 25
                  },
                  "genders": ["Women"],
                  "states": ["TX", "CA"]
                },
                "title": "Snack habits"
              },
              {
                "externalSurvey": {
                  "minutes": 10,
                  "returnLinksAdded": true,
                  "url": "https://survey.example.com/s/pricing?rid={RID}"
                },
                "format": "external",
                "targetCount": 100,
                "title": "Pricing survey"
              },
              {
                "aiUse": true,
                "format": "recording",
                "questions": [
                  {
                    "prompt": "Tell us about the last time you made a budget.",
                    "recording": {
                      "kind": "video",
                      "maxSeconds": 120,
                      "minSeconds": 30,
                      "mode": "answer"
                    },
                    "type": "recording"
                  },
                  {
                    "prompt": "What got in the way of sticking to it?",
                    "recording": {
                      "kind": "video",
                      "maxSeconds": 120,
                      "minSeconds": 30,
                      "mode": "answer"
                    },
                    "type": "recording"
                  }
                ],
                "recordingUse": {
                  "description": "We will use the recordings to train and evaluate a speech model, and for nothing else.",
                  "synthetic": false
                },
                "targetCount": 20,
                "title": "How people talk about budgeting"
              },
              {
                "format": "recording",
                "questions": [
                  {
                    "media": {
                      "kind": "video",
                      "url": "https://cdn.example.com/spring-ad.mp4"
                    },
                    "prompt": "What’s your first reaction to this ad?",
                    "recording": {
                      "kind": "video",
                      "mode": "answer"
                    },
                    "type": "recording"
                  }
                ],
                "recordingUse": {
                  "description": "We will watch the recordings to learn how people react to our new ad, and use them for nothing else.",
                  "synthetic": false
                },
                "targetCount": 20,
                "title": "Spring ad reactions"
              },
              {
                "adMoments": {
                  "askBuy": true
