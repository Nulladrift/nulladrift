                          "format": "uri",
                          "type": "string"
                        }
                      },
                      "required": ["url"],
                      "type": "object"
                    },
                    "maxItems": 5,
                    "minItems": 2,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "aiUse": {
                "description": "You’ll train, fine-tune or evaluate AI with the answers or recordings. Members are told before they start.",
                "type": "boolean"
              },
              "attentionCheck": {
                "description": "true: members get an attention check. Only quick polls, surveys and recording studies run one; on any other format it stays off whatever you send.",
                "type": "boolean"
              },
              "externalSurvey": {
                "description": "An external survey: your link, its length, and that you added the return links (the answer’s external.returnLinks, relative to this site) to its end pages.",
                "properties": {
                  "minutes": {
                    "description": "How long your survey takes, in whole minutes, 1 to 30: it sets the price. Launch refuses a length outside that.",
                    "type": "integer"
                  },
                  "returnLinksAdded": {
                    "description": "true once you have added the return links (the answer’s external.returnLinks) to your survey’s end pages. Launch needs true.",
                    "type": "boolean"
                  },
                  "url": {
                    "description": "Your survey’s https link, on a public domain. Put {RID} where its tool takes a respondent id; without it, ?rid=… is added to the link.",
                    "maxLength": 2000,
                    "type": "string"
                  },
                  "webcam": {
                    "description": "true: webcam on. +$1.75 per complete, members +$1; IL, TX, WA left out.",
                    "type": "boolean"
                  },
                  "webcamNotStored": {
                    "description": "Webcam images aren’t stored (only if true).",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "format": {
                "description": "Left out on a new draft: survey. GET /account lists the formats this account may use. Changing it moves the questions the new format can’t hold to setAsideQuestions; they come back when a format can hold them.",
                "enum": ["quick_poll", "survey", "recording", "external", "interview", "ad_ranking", "usability"],
                "type": "string"
              },
              "goal": {
                "description": "What you want to learn. An AI interview’s interviewer works from it.",
                "maxLength": 2000,
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Any unique text, sent again unchanged when you retry this call: a retry gets the first answer back and spends nothing twice. Left out, one is made for this call and the answer says which, so a retry can use it.",
                "maxLength": 255,
                "minLength": 1,
