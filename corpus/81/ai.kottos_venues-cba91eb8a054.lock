{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kottos/venues": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://data.kottos.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "kottos-ai",
        "title": "Kottos AI",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "List prices and live time to first token for LLMs at each venue Kottos AI routes to. Call list_models for the model names, then compare_venues for one of them.",
      "tools": [
        {
          "name": "compare_venues",
          "title": "Compare venues for a model",
          "description": "For one model, each venue and service tier that sells it: list prices in US dollars per million tokens and, where the probe measures it, time to first token over the last hour. The probe sends a short prompt once a minute from Ashburn, Virginia, through the Kottos AI gateway, so the time is mostly round trip and queue, not a long prompt's prefill. Measured offers come first, fastest first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "model": {
                "description": "A name from list_models, such as \"Claude Sonnet 5.5\" or \"GPT-6.1 Sol\"; an API id such as claude-sonnet-5-5 matches too.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "measured_at": {
                "description": "When the probe series was written, UTC",
                "type": ["string", "null"]
              },
              "model": {
                "type": "string"
              },
              "offers": {
                "items": {
                  "properties": {
                    "long_context": {
                      "properties": {
                        "above_tokens": {
                          "type": "integer"
                        },
                        "cache_read": {
                          "type": "number"
                        },
                        "cache_write": {
                          "type": "number"
                        },
                        "cache_write_1h": {
                          "type": "number"
                        },
                        "input": {
                          "type": "number"
                        },
                        "output": {
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "price_per_mtok": {
                      "properties": {
                        "cache_read": {
                          "type": "number"
                        },
                        "cache_write": {
                          "type": "number"
                        },
                        "cache_write_1h": {
                          "type": "number"
                        },
                        "input": {
                          "type": "number"
                        },
                        "output": {
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "tier": {
                      "description": "The tier, speed or region bought; null for the standard offer",
                      "type": ["string", "null"]
                    },
                    "ttft_ms": {
                      "properties": {
                        "failed": {
                          "type": "integer"
                        },
                        "p50": {
                          "type": ["integer", "null"]
                        },
                        "p90": {
                          "type": ["integer", "null"]
                        },
                        "samples": {
                          "type": "integer"
                        },
                        "typical_p50_24h": {
                          "type": ["integer", "null"]
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "venue": {
                      "type": "string"
                    }
                  },
                  "required": ["price_per_mtok", "tier", "ttft_ms", "venue"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["model", "offers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6af60104bc7c64cbe9a0b28de99f9ceb9826a35bf04bf2fe0a8238408534d5f"
        },
        {
          "name": "list_models",
          "title": "List models",
          "description": "Every model Kottos AI lists prices for, with how many venue and service tier offers sell it and how many of them the live probe measures. Its names are the ones compare_venues accepts.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "models": {
                "items": {
                  "properties": {
                    "measured": {
                      "type": "integer"
                    },
                    "model": {
                      "type": "string"
                    },
                    "offers": {
                      "type": "integer"
                    }
                  },
                  "required": ["measured", "model", "offers"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["models"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0a94513e48d54675fde490ca63c925e58341f4901b91a08ad0d359f4fc476be2"
        }
      ],
      "digest": "sha256:d7a6b96d540adde109ece65a2569641380fffcd3b12a714996dea83fcc1207c7"
    }
  }
