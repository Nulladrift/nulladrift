      "instructions": "Orbit (orbit.channel) is a media station where artists are paid directly and instantly for every purchase, with no pooling.\n\nOPEN TO EVERYONE\n- get_featured — today's featured track with its preview and the welcome gift offer; takes no input, a good first call.\n- search_music — find tracks by artist, title, genre or a natural request.\n- get_media_access — a 20-second preview URL for any track (the full track when signed in and owned).\n\nWITH THE USER'S ORBIT ACCOUNT\nThese tools act for the user's account. The first time one is called, the client asks the user to sign in on orbit.channel and allow access (standard OAuth); after that it works without asking again. Never ask the user for a code, password or wallet address in the conversation.\n- get_my_collection, get_recommendations, check_credits — read the user's account.\n- claim_welcome_gift — free credits for a limited number of first-comer accounts, once per account.\n- request_stream_access — 30 days of streaming for one track; spends the user's credits.\n- purchase_music — permanent access to one track; spends the user's credits. Confirm with the user first.\n\nPARTNER ACCOUNTS (artists, labels and channels)\nThe same sign-in lets the owner of a partner account manage it here. These tools say \"Partner accounts only\" and refuse other accounts with reason not_a_partner. Call get_partner_context first to see the role and the channel. Company, contract and payout data are never reachable.\n- Channel (operators): update_channel changes texts, colour and picks; news with list_channel_posts, save_channel_post, delete_channel_post; list_channel_releases lists what can be picked.\n- Artists (distributors): search_artists before create_artist, to avoid duplicates; get_artist, list_artists, update_artist.\n- Releases (distributors): create_release makes a draft; nothing here publishes, Orbit reviews and activates it. Then update_release, set_release_artists, a cover (create_image_upload with target release_cover), one create_track_upload per file, update_track and reorder_tracks, create_edition for what is sold, and create_release_preview_link to show the user the result.\n- Files are not passed through tools: create_image_upload and create_track_upload return a single-use link; send the file there with HTTP PUT.\n- Tools that overwrite or delete are marked destructive: confirm the change with the user before calling them.\n\nRESULTS\nEvery result is JSON, also available as structured content; a failed call has \"error\". \"displayCard\" is Markdown meant to be shown to the user. A \"playback\" object, when present, holds a terminal command that plays the audio in the console; use it when the user wants to listen.\n\nThe \"suggest_music\" prompt offers a ready-made flow for suggesting music while the user waits.",
