      "instructions": "Orbit (orbit.channel) is a media station where artists are paid directly and instantly for every purchase, with no pooling.\n\nWITHOUT AUTHORIZATION\n- search_music — find tracks by artist, title, genre or a natural request.\n- get_media_access — a 20-second preview URL for any track.\n\nWELCOME GIFT\n- claim_welcome_gift — a limited number of first-comer accounts get free credits, once per account. Callable in any session: without authorization it only reports the offer and how the user can claim it.\n\nWITH AUTHORIZATION\nA person authorizes this session by approving it on orbit.channel. Call start_pairing and give the user the link and the four-digit check number it returns; they open the link, sign in, compare the number and approve. Then call check_pairing or the tool you wanted. Do this only when the user wants to stream, buy, or see their own collection. Never ask the user to type a code or a wallet address into the conversation; if they offer a 6-digit Orbit code themselves, authorize_with_code accepts it.\n- get_my_collection, get_recommendations, check_credits — read the user's account.\n- request_stream_access — 30 days of streaming for one track; spends the user's credits.\n- purchase_music — permanent access to one track; spends the user's credits. Confirm with the user first.\n\nRESULTS\nEvery result is JSON, also available as structured content. \"displayCard\" is Markdown meant to be shown to the user. A \"playback\" object, when present, holds a terminal command that plays the audio in the console; use it when the user wants to listen. A result with \"authorization.required\" means the session must be authorized first.\n\nThe \"suggest_music\" prompt offers a ready-made flow for suggesting music while the user waits.",
