              "city": {
                "type": "string"
              },
              "id": {
                "description": "Slug ou UUID da construtora.",
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
