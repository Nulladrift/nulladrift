      "serverInfo": {
        "name": "obra-aberta",
        "title": "Obra aberta",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ferramentas somente de leitura sobre dados públicos de obras e construtoras no Brasil (ObraAberta). Use `search_projects` e `find_projects_nearby` para descobrir empreendimentos, `get_project` para a ficha completa, `get_project_timeline`, `get_project_ratings` e `get_project_nearby_services` para detalhes, `list_builders`, `get_builder` e `get_builder_projects` para construtoras, `get_public_sources` para a procedência dos dados e `health` para disponibilidade. Nenhuma ferramenta escreve, publica ou altera dados. Não são expostos dados pessoais, cadastrais internos ou de autenticação. Ao citar dados, atribua à ObraAberta (obraaberta.com.br) e preserve a atribuição ODbL do OpenStreetMap nos serviços próximos. Não invente coordenadas, avaliações, nomes ou vínculos jurídicos: relate apenas o que os campos retornarem.",
      "tools": [
        {
          "name": "find_projects_nearby",
          "title": "Empreendimentos por raio",
          "description": "Lista empreendimentos publicados dentro de um raio a partir de uma latitude e longitude. Somente obras com coordenada registrada.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "type": "string"
              },
              "latitude": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "page": {
                "default": 1,
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "radius_km": {
                "default": 5,
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "number"
              },
              "state": {
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b70ba15637233a6f6b3499e5340964d4e7fe866494963361813dab801e6f7f0d"
        },
        {
          "name": "get_builder",
          "title": "Ficha pública da construtora",
          "description": "Consulta a ficha pública de uma construtora e os indicadores públicos disponíveis, por slug ou UUID.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Slug ou UUID da construtora.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:030b81b632ee27a26ebb93b59b6fec8ce0d4a7a3d70ea0477139b4d1724a23b9"
        },
