          "title": "Ficha pública do empreendimento",
          "description": "Consulta a ficha pública de um empreendimento da ObraAberta por slug ou UUID, com linha do tempo resumida e avaliações moderadas.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
