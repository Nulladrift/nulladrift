            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d485d037d5366e9279e8f75ca6994fd390be30001464aeede89107ce24058e50"
        },
        {
