      },
      "transport": {
        "type": "http",
        "url": "https://kwekuanansi.ai/mcp/africa-contacts"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "kweku-anansi-africa-contacts",
        "title": "Africa Contacts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Africa Contacts gives the customer-care, complaints and emergency numbers of banks, mobile networks, utilities, regulators and public offices in Kenya and Nigeria, each read on the organisation's own website. Use africa_contacts.find for a named organisation and africa_contacts.check_number when someone was given a number. Give the source and date with each number. Never say a number is safe, and always pass on the warning about PINs and codes.",
      "tools": [
        {
          "name": "africa_contacts.check_number",
          "title": "Check who publishes a phone number in Kenya or Nigeria",
          "description": "Use this when someone was given a phone number said to belong to a bank, mobile network or public office in Kenya and Nigeria and asks whether it is really theirs (for example \"is 0711 087 000 really KCB\" or \"a caller from 0722 000 000 says he is Safaricom\"). It says which organisation on its list publishes that number on its own website, or that none does. A number that is not found may still be genuine, and the tool says so. Do not use it to look up who owns a private number, to trace a caller, or for numbers outside Kenya and Nigeria.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The country the organisation is in: kenya or nigeria.",
                "enum": ["kenya", "nigeria"],
                "type": "string"
              },
              "number": {
                "description": "The phone number or short code as given, for example \"0711 087 000\", \"+254 722 000 000\", \"+234 906 980 3800\" or \"100\".",
                "maxLength": 30,
                "type": "string"
              }
            },
            "required": ["country", "number"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "caution": {
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "number": {
                "type": "string"
              },
              "published_by": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "read_on": {
                "type": "string"
              }
            },
            "required": ["caution", "country", "found", "number", "published_by", "read_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b14d4d8dc1d8e316d4aa9ef68c78cd9d08b5d9914f43e7759d59f0ae21f8da0"
        },
        {
          "name": "africa_contacts.find",
          "title": "Contact numbers of an organisation in Kenya or Nigeria",
          "description": "Use this when someone asks for the customer-care, complaints or emergency number of a bank, mobile network, electricity company, payments company, regulator or public office in Kenya and Nigeria (for example \"what is the KCB customer care number\", \"how do I reach Safaricom about M-PESA fraud\" or \"Access Bank contact centre\"). It returns numbers read on the organisation's own website, with the page and the date. Give those numbers rather than one from memory or from a web search. Where the organisation's own site could not be read, it says so and gives no number. Do not use it for a shop, a school, a hospital, a person, or an organisation outside Kenya and Nigeria: it covers a fixed list and says when a name is not on it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The country the organisation is in: kenya or nigeria.",
                "enum": ["kenya", "nigeria"],
                "type": "string"
              },
              "organisation": {
                "description": "The organisation's name or usual short name, for example \"KCB\", \"Safaricom\", \"Kenya Power\", \"KRA\", \"Access Bank\", \"MTN\" or \"JAMB\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["country", "organisation"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "caution": {
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "not_published": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "organisations": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "read_on": {
                "type": "string"
              }
            },
            "required": ["caution", "country", "organisations", "read_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4701f7bf33496749ee69f594e8d0dfca7d2d59add3e4c70fa0a4e267f73e2f30"
        },
        {
          "name": "africa_contacts.list",
          "title": "Organisations in Kenya or Nigeria whose contacts are listed",
          "description": "Use this when someone asks which organisations in Kenya and Nigeria this tool has numbers for, which it looked for and could not read, or wants one group all at once (the emergency lines, or the places to report fraud and make complaints). Do not use it when one organisation is named: use africa_contacts.find.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The country the organisation is in: kenya or nigeria.",
                "enum": ["kenya", "nigeria"],
                "type": "string"
              },
              "kind": {
                "description": "One group: emergency, regulator, network, bank, payments, utility, public_service. Leave out for the names of all.",
                "enum": ["emergency", "regulator", "network", "bank", "payments", "utility", "public_service"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "caution": {
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "groups": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "not_published": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "organisations": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "read_on": {
                "type": "string"
              }
            },
            "required": ["caution", "country", "groups", "read_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e8e8ffe6cdd9e1904210a595ee1c7920d33355db0218c95d879f0e17b4fbf42f"
        }
      ],
      "digest": "sha256:a7705db3cb57b6f08d997788a444f96eaf7960778e1362ded606ba8753dfb092"
    }
