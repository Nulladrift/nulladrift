      "serverInfo": {
        "name": "AudioParcel",
        "title": "AudioParcel – Audio Trim & Export Guide",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use these tools to plan a trim and send the user to AudioParcel. Choose and export recordings in the browser editor. Never ask for a recording or file URL for this service.",
      "tools": [
        {
          "name": "get_audio_trimmer_info",
          "title": "Get AudioParcel audio format and file limits",
          "description": "Return supported input types, output formats, and limits for one audio recording.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
