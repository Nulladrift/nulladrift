          },
          "digest": "sha256:51ac60abd2e7dd29b10e141a8ea229b2fa92d1a92face275b28d1d662acdfc02"
        },
        {
          "name": "open_audio_trim_example",
          "title": "Open the playable AudioParcel trim example",
          "description": "Get a browser link that opens the built-in CC0 voice sample with its cut points selected.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7f1bddde5917224a6a65ed7b09c5dc4631ac4480b90677a0444b4ea0099ab823"
        },
        {
          "name": "plan_audio_trim",
          "title": "Plan an AudioParcel clip",
          "description": "Check a start and end time and return the settings for trimming one continuous clip in the browser editor.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "endSeconds": {
                "description": "End of the clip in seconds.",
                "exclusiveMinimum": 0,
                "maximum": 3600,
                "type": "number"
              },
              "exportFormat": {
                "default": "mp3",
                "description": "Output format. Defaults to MP3 for sharing.",
                "enum": ["mp3", "wav", "flac"],
                "type": "string"
              },
              "sourceDurationSeconds": {
                "description": "Full length of the source, if known. Specify it to plan a clip from a recording longer than 10 minutes.",
                "exclusiveMinimum": 0,
                "maximum": 3600,
                "type": "number"
              },
              "startSeconds": {
                "description": "Start of the clip in seconds.",
                "maximum": 3600,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["endSeconds", "startSeconds"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
