        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to the five beachfront holiday apartments of Apartments Perlamar in Valencia (Spain): details, availability, live prices and policies. You cannot book or pay here: give the user the book_url so they complete the booking on apartamentsperlamar.com. Prices are in EUR and already include the 10% direct-booking discount.",
      "tools": [
        {
          "name": "get_apartment_details",
          "title": "Apartment details",
          "description": "Full description of one apartment: texts, beds, amenities, check-in/out times, minimum nights, photos and public address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apartment": {
                "description": "Apartment number 1-5 (e.g. \"3\" or \"Apartment 3\").",
                "type": "string"
              },
              "language": {
                "description": "Language for texts and links (default en).",
                "enum": ["es", "en", "fr", "de", "it"],
                "type": "string"
              }
            },
            "required": ["apartment"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
