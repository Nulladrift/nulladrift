            "readOnly": true
          },
          "digest": "sha256:6c1abf3765cc67afa51837d627cc5bce11282fff4566099e45136daf7f1dc346"
        },
        {
          "name": "get_calendar",
          "title": "Availability calendar",
          "description": "Night-by-night availability of one apartment for up to 120 days, from a snapshot refreshed every hour. Use search_availability or get_quote to confirm live availability and price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apartment": {
                "description": "Apartment number 1-5 (e.g. \"3\" or \"Apartment 3\").",
                "type": "string"
              },
              "days": {
                "description": "Number of nights (default 60).",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "description": "First night, YYYY-MM-DD (default today).",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["apartment"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
