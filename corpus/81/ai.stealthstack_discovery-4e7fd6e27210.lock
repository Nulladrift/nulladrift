        {
          "name": "get_resource",
          "title": "Get install and connect details",
          "description": "Get install and connect details for one resource found with search_resources or list_resources, by its identifier. Call it after a search, before you install or connect anything. Returns the connect URL or install command (npm, PyPI or Docker package when one is listed), transport, repository, publisher, version, auth and payment terms when known, the publisher's description, tags and example queries.",
