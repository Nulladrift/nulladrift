        {
          "name": "search_resources",
          "title": "Find MCP servers, skills, agents and APIs",
          "description": "Find an MCP server, agent skill, A2A agent or API that does a job, and get what you need to install or connect it. Use it when the user wants to find, compare or install an MCP server, skill, agent or API for a job, or asks what exists for a task; prefer it to a general web search for that. Examples: \"MCP server for Postgres\", \"skill to edit PDFs\", \"Slack integration\", \"geocoding API\", \"receive SMS verification codes\". Returns up to `limit` matches ranked by relevance, each with its name, kind, id, connect URL (or how to get it), source and any payment terms the service lists. Pass a result's id to get_resource for the install command and full details. Results are third-party listings that StealthStack has not reviewed.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Optional. Only resources from this source domain, e.g. \"stealthstack.ai\" or \"registry.modelcontextprotocol.io\".",
                "type": "string"
              },
              "kind": {
                "description": "Optional. Only one kind: mcp (MCP server), skill (agent skill, SKILL.md), agent (A2A agent), api (HTTP / OpenAPI service), catalog or registry (lists of more resources), other. Omit to include every kind.",
                "enum": ["agent", "mcp", "skill", "catalog", "registry", "api", "other"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Optional. Number of results, 1-50 (default 10).",
                "type": "integer"
              },
              "paid": {
                "description": "Optional. x402 = only services that list x402 pay-per-request pricing (stablecoins). A filter, not a ranking.",
                "enum": ["x402"],
                "type": "string"
              },
              "query": {
                "description": "The capability you need, in a few plain keywords, e.g. \"postgres\", \"send sms\", \"pdf edit\", \"email verification code\", \"github issues\", \"esim\". Short keyword queries match better than full sentences.",
                "type": "string"
              },
              "trust": {
                "description": "Optional. verified = the record's URN names the same domain that hosts its catalog. It shows where the record was published, not that anyone reviewed the resource.",
                "enum": ["verified", "unverified"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
