            "properties": {
              "identifier": {
                "description": "The `id` of a search_resources or list_resources result, e.g. urn:air:stealthstack.ai:skill:parquet (urn:ai: and urn:air: prefixes are both accepted).",
                "type": "string"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
