        {
          "name": "list_resources",
          "title": "Browse the index by kind or source",
          "description": "Browse the StealthStack index without a search query: for example every agent skill (kind=skill), everything one domain publishes (domain=...), or services that accept x402 payments (paid=x402). Returns the total, a count per kind and one page of records with connect details. For a specific need (\"MCP server for Postgres\") use search_resources, which ranks by relevance.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Optional. Only resources from this source domain, e.g. \"stealthstack.ai\".",
                "type": "string"
              },
              "kind": {
                "description": "Optional. Only one kind: mcp (MCP server), skill (agent skill, SKILL.md), agent (A2A agent), api (HTTP / OpenAPI service), catalog or registry (lists of more resources), other. Omit to include every kind.",
                "enum": ["agent", "mcp", "skill", "catalog", "registry", "api", "other"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Optional. Number of results, 1-50 (default 25).",
                "type": "integer"
              },
              "paid": {
                "description": "Optional. x402 = only services that list x402 pay-per-request pricing (stablecoins). A filter, not a ranking.",
                "enum": ["x402"],
                "type": "string"
              },
              "trust": {
                "description": "Optional. verified = the record's URN names the same domain that hosts its catalog. It shows where the record was published, not that anyone reviewed the resource.",
                "enum": ["verified", "unverified"],
                "type": "string"
              }
            },
            "type": "object"
          },
