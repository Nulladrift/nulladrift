          "digest": "sha256:e7a4fe543fc06e0a835c9a0ca67cdbdde19f9c7a3e3bd1c3b0e96d33a41ea74a"
        },
        {
          "name": "my_risk_orders",
          "description": "查我的单子：这个手机号名下在盯的、碰线的、已结束的单，每张的警戒线、仓位、理由、建单以来涨跌、今天的过热档和概率。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "order_id": {
                "description": "只看这一张（看全部字段）",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "phone": {
                "description": "用户手机号；测试用 probe_xxx",
                "maxLength": 40,
                "minLength": 5,
                "type": "string"
              },
              "status": {
                "description": "open=在盯和碰线的（默认），closed=已结束，all=全部",
                "enum": ["open", "closed", "all"],
                "type": "string"
              }
            },
            "required": ["phone"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2886fbd97c44e917c84e661197f521c1d08577687156e7a794877fbdc5b2a6d6"
        },
        {
          "name": "qtg_risk_index",
          "description": "QTG 风险指数：31 个申万一级行业过热程度（每个行业 5 个信号亮了几个）合成的一个数，0～100。返回今天的全市场风险指数和比上一个交易日、历史上同一区间之后 60 个交易日沪深300 跌 15% 以上的概率、风险最高的几个行业和今天亮红灯的行业。给 industry 时只看这个行业。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "industry": {
                "description": "申万一级行业名，如「医药生物」；不填看全市场",
                "maxLength": 10,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:23c259638f1cf09fccc1997620f66fd997eb4f379ffb46b1f569dbf61ef36b03"
        },
        {
          "name": "reason_index",
          "description": "QuantToGo 理由指数：把买卖股票的理由做成指数（腰斩指数、放量新高指数、国家队增持指数……）。不给 q 时列出全部理由指数和今天各有多少只股票符合；给 q（短名、理由原话或其中几个字）时返回这一个指数的详情：今天符合的只数和它在过去一年里的位置、A 股和美股各自的点位、比上一个交易日涨跌、2015 年以来涨跌和同期大盘。提到某个指数时用它的短名，第一次提到时后面带理由原话。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "market": {
                "description": "只列 A 股或美股的，默认全部",
                "enum": ["A", "US", "all"],
                "type": "string"
              },
              "q": {
                "description": "理由指数的短名或理由原话，如「腰斩指数」「已经腰斩了，可以抄底」；不填列全部",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dc94b006d152511e30dcff0e02e5f16dd0d98b963fe7241bc0ccac72cf6aa8a8"
        },
        {
          "name": "reason_index_stocks",
          "description": "某个理由指数今天的成分股：今天符合这条理由的股票，按市值从大到小，每只带今天的读数和条件。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "market": {
                "description": "A 股或美股，默认 A 股",
                "enum": ["A", "US"],
                "type": "string"
              },
              "q": {
                "description": "理由指数的短名或理由原话",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "top": {
                "description": "列前几只，默认 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1ea75178dee08370197bd11c5d0c36a42200474eff5910c4675bbafd2b86e44f"
        },
        {
          "name": "risk_check",
          "description": "查一只 A 股标的的风险读数。给一个 A 股标的：个股名字或 6 位代码、申万一级行业名、ETF/基金名字或代码、宽基指数名。返回：三个月内跌 ≥15% 的概率、平时的概率、它自己历史的概率、在不在安全区、最坏情况、过热档和红灯、警戒线三档（1.0/1.5/2.0 倍波动带）、按哪个标的代算。用户看到的标的一律写「名字（代码）」。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "target": {
                "description": "标的：名字或代码，如「招商蛇口」「001979」「房地产」「沪深300」",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:791d8e0d217216760e7a6701bceb95c72e644f0d06792a9c3e72690674b70247"
        },
        {
          "name": "stock_reasons",
          "description": "一只股票今天在哪几个理由指数里（今天符合哪几条买卖理由）。A 股给名字或 6 位代码，美股给代码。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "stock": {
                "description": "股票名字或代码，如「贵州茅台」「600519」「NVDA」",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["stock"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ccc9095b694e503bb0e6b64d8177caf5d22c6ede746cfef57334b0c4e2b5d2be"
        },
        {
          "name": "verify_reasons",
          "description": "核对持有理由。把用户说的理由对到九类里（周期反转、趋势延续、估值见底、产业受益、龙头集中、高股息防守、超跌反弹、题材热度、避险），返回每条理由今天成立/不成立/已证伪，以及依据的数字。如果用户的理由属于「大家都在买 / 朋友推荐 / 别人说的 / 听说有消息 / 等回本 / 拿了很久 / 这是用途」这七类，这不算能每天检查的理由，返回对应的一句话，请把那句话转给用户并再问一次真正的理由。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "no_reason_kind": {
                "description": "用户说的其实不是理由时，填它属于哪一类",
                "enum": ["大家都在买", "朋友推荐", "别人说的", "听说有消息", "等回本", "拿了很久", "这是用途"],
                "type": "string"
              },
              "reasons": {
                "description": "理由标签，1～4 个",
                "items": {
                  "enum": ["周期反转", "趋势延续", "估值见底", "产业受益", "龙头集中", "高股息防守", "超跌反弹", "题材热度", "避险"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "target": {
                "description": "标的名字或代码",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reasons", "target"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:daac83d4b45f0215a9ef9db2b445980afac9dd3da027efcf805c55882a96cfcb"
        }
      ],
