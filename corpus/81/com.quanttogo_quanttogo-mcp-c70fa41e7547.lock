{
  "lockfileVersion": 2,
  "subjects": {
    "com.quanttogo/quanttogo-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.quanttogo.com/v2"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "quanttogo-reason-index",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "QuantToGo 理由指数：把买卖股票的理由做成指数——腰斩指数、放量新高指数、国家队增持指数……每条理由今天有多少只股票符合、比昨天多了还是少了、2015 年以来走了多少，A 股和美股分开算；另有 QTG 风险指数，把 31 个行业的过热程度合成一个数。问某个理由、某个指数用 reason_index，问成分股用 reason_index_stocks，问一只股票符合哪些理由用 stock_reasons，问风险用 qtg_risk_index；用户手上有持仓、想替她盯着，用 risk_check、verify_reasons、create_risk_order。提到理由指数用短名，第一次提到时后面带理由原话；标的写「名字（代码）」；数字一律带数据日期。网址 https://quanttogo.com",
      "tools": [
        {
          "name": "create_risk_order",
          "description": "建一张单子（替用户盯着这只股票和她的理由）。必须有理由：reasons 至少一个标签，没有理由不建——先用 verify_reasons 问清楚。建好后每天收盘后检查理由、过热档、警戒线，有变化才告诉她。警戒线三档 guard_k：1.0（紧，正常波动约四成会碰到）、1.5（默认）、2.0（松）。需要手机号：和网站是同一个账户，没有就按这个手机号新建。同一标的已有在盯的单不会重复建。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "持有金额，元（可不填）",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "guard_k": {
                "description": "警戒线档位，默认 1.5",
                "enum": ["1.0", "1.5", "2.0"],
                "type": "string"
              },
              "phone": {
                "description": "用户手机号（11 位）；测试用 probe_xxx",
                "maxLength": 40,
                "minLength": 5,
                "type": "string"
              },
              "position": {
                "description": "这只占总资产的仓位 %（可不填）",
                "maximum": 100,
                "minimum": 0.1,
                "type": "number"
              },
              "reason_text": {
                "description": "用户理由的原话，一句",
                "maxLength": 300,
                "type": "string"
              },
              "reasons": {
                "description": "理由标签，1～4 个（必填）",
                "items": {
                  "enum": ["周期反转", "趋势延续", "估值见底", "产业受益", "龙头集中", "高股息防守", "超跌反弹", "题材热度", "避险"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "target": {
                "description": "标的名字或代码",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "tolerance": {
                "description": "承受度：这一笔最多亏总资产的 %，默认 5",
                "enum": ["1", "2", "5", "10"],
                "type": "string"
              }
            },
            "required": ["phone", "reasons", "target"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a60a6103c75c80ce12f5a9ccd756a285ab9e9a9e46a14a441ef3c05087547a17"
        },
        {
          "name": "evidence_card",
          "description": "行业证据卡（可选）：某个申万一级行业今天的机会分、证据充分度和打分依据，只读。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "industry": {
                "description": "申万一级行业名，如「房地产」「银行」「半导体」",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["industry"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:28254481d1f55c754b2641e0967baa8f173010e342f8dfc16ed107d9e3aaf8a8"
        },
        {
          "name": "ledger_review",
          "description": "台账复盘：红灯亮了之后真的跌了吗。返回最近几次红灯（亮灯日、行业、到今天/三个月内的最大跌幅、有没有跌过 5%）、历史比例和样本数、今天亮起和熄灭的红灯。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:547266966e2f39d971dcb85f35f6efd358b41f98386e588a08a1b3adc0a88060"
        },
        {
          "name": "login",
          "description": "用手机号登录/注册。和网站 QuantToGo 是同一套账户：手机号查到就是她，查不到就按这个手机号新建（限时免费）。返回账户状态。只有建单、查我的单需要；查读数、市场、台账不需要。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "phone": {
                "description": "11 位手机号；测试用 probe_xxx",
                "maxLength": 40,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["phone"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f52ede2c31810282c814456f4e0d57a612c64cbde68d625c1ac6a2e68a9d9706"
        },
        {
          "name": "market_now",
          "description": "今天的市场环境：全市场过热档、大盘波动档、亮红灯的行业（过热档高且大盘波动不高）、新亮和熄灭的红灯、31 个申万一级行业按过热档排序和各自三个月内跌 ≥15% 的概率。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "top": {
                "description": "列前几个行业，默认 10",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8798a235d803d7a176d7090ba31c6e345d45eb31c1a5b38bff462574d864641c"
        },
        {
          "name": "my_risk_orders",
          "description": "查我的单子：这个手机号名下在盯的、碰线的、已结束的单，每张的警戒线、仓位、理由、建单以来涨跌、今天的过热档和概率。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "order_id": {
                "description": "只看这一张（看全部字段）",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "phone": {
                "description": "用户手机号；测试用 probe_xxx",
                "maxLength": 40,
                "minLength": 5,
                "type": "string"
              },
              "status": {
                "description": "open=在盯和碰线的（默认），closed=已结束，all=全部",
                "enum": ["open", "closed", "all"],
                "type": "string"
              }
            },
            "required": ["phone"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3417003fc6cacfa556ecdaeba424abdf356c2373c0740af95fe3b5bcad303eb0"
        },
        {
          "name": "qtg_risk_index",
          "description": "QTG 风险指数：31 个申万一级行业过热程度（每个行业 5 个信号亮了几个）合成的一个数，0～100。返回今天的全市场风险指数和比上一个交易日、历史上同一区间之后 60 个交易日沪深300 跌 15% 以上的概率、风险最高的几个行业和今天亮红灯的行业。给 industry 时只看这个行业。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "industry": {
                "description": "申万一级行业名，如「医药生物」；不填看全市场",
                "maxLength": 10,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:67c91f89278f4c6e27d2d8af0166d53c97bee322e89c980e03405e60a2ce2a5f"
        },
        {
          "name": "reason_index",
          "description": "QuantToGo 理由指数：把买卖股票的理由做成指数（腰斩指数、放量新高指数、国家队增持指数……）。不给 q 时列出全部理由指数和今天各有多少只股票符合；给 q（短名、理由原话或其中几个字）时返回这一个指数的详情：今天符合的只数和它在过去一年里的位置、A 股和美股各自的点位、比上一个交易日涨跌、2015 年以来涨跌和同期大盘。提到某个指数时用它的短名，第一次提到时后面带理由原话。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "market": {
                "description": "只列 A 股或美股的，默认全部",
                "enum": ["A", "US", "all"],
                "type": "string"
              },
              "q": {
                "description": "理由指数的短名或理由原话，如「腰斩指数」「已经腰斩了，可以抄底」；不填列全部",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e05128fa7cb2fc05e13e139e090d9c4aa4e5585d32bb2e64f16e9e4ed380ae51"
        },
        {
          "name": "reason_index_stocks",
          "description": "某个理由指数今天的成分股：今天符合这条理由的股票，按市值从大到小，每只带今天的读数和条件。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "market": {
                "description": "A 股或美股，默认 A 股",
                "enum": ["A", "US"],
                "type": "string"
              },
              "q": {
                "description": "理由指数的短名或理由原话",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "top": {
                "description": "列前几只，默认 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:635b823a13a050bf21b5a483180c2c973b0ec9b29b82c273de5a9879d89744e6"
        },
        {
          "name": "risk_check",
          "description": "查一只 A 股标的的风险读数。给一个 A 股标的：个股名字或 6 位代码、申万一级行业名、ETF/基金名字或代码、宽基指数名。返回：三个月内跌 ≥15% 的概率、平时的概率、它自己历史的概率、在不在安全区、最坏情况、过热档和红灯、警戒线三档（1.0/1.5/2.0 倍波动带）、按哪个标的代算。用户看到的标的一律写「名字（代码）」。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "target": {
                "description": "标的：名字或代码，如「招商蛇口」「001979」「房地产」「沪深300」",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:263e5e96fc0891e7200b4863abaca4e98b4b35caf46b187eff38c0c40a5a1144"
        },
        {
          "name": "stock_reasons",
          "description": "一只股票今天在哪几个理由指数里（今天符合哪几条买卖理由）。A 股给名字或 6 位代码，美股给代码。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "stock": {
                "description": "股票名字或代码，如「贵州茅台」「600519」「NVDA」",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["stock"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13ea5c52fad19021e5bd95aa3200170f2332ba6ddc467835d08895f98de848ad"
        },
        {
          "name": "verify_reasons",
          "description": "核对持有理由。把用户说的理由对到九类里（周期反转、趋势延续、估值见底、产业受益、龙头集中、高股息防守、超跌反弹、题材热度、避险），返回每条理由今天成立/不成立/已证伪，以及依据的数字。如果用户的理由属于「大家都在买 / 朋友推荐 / 别人说的 / 听说有消息 / 等回本 / 拿了很久 / 这是用途」这七类，这不算能每天检查的理由，返回对应的一句话，请把那句话转给用户并再问一次真正的理由。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "no_reason_kind": {
                "description": "用户说的其实不是理由时，填它属于哪一类",
                "enum": ["大家都在买", "朋友推荐", "别人说的", "听说有消息", "等回本", "拿了很久", "这是用途"],
                "type": "string"
              },
              "reasons": {
                "description": "理由标签，1～4 个",
                "items": {
                  "enum": ["周期反转", "趋势延续", "估值见底", "产业受益", "龙头集中", "高股息防守", "超跌反弹", "题材热度", "避险"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "target": {
                "description": "标的名字或代码",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reasons", "target"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3ee3e4eb116fc1d4e8858663c604893629a4bfcfbb72944f5c615b967d880675"
        }
      ],
      "digest": "sha256:e4c36092a571b647e28493a989516c8be6e83e6fe73cb32703ba15462798130f"
    }
  }
}
