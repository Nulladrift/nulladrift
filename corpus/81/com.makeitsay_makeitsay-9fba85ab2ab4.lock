{
  "lockfileVersion": 2,
  "subjects": {
    "com.makeitsay/makeitsay": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://makeitsay.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "makeitsay",
        "title": "MakeItSay",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MakeItSay changes the text inside an image (photos, screenshots, posters, signs) and keeps the font and background. Call replace_text with the image and the lines to change as { from, to }; \"from\" must match the text in the image, so call scan_text first when unsure. 1 credit per image. The result_url is a PNG valid for one hour.",
      "tools": [
        {
          "name": "get_credits",
          "title": "Credits left",
          "description": "Credits available on this MakeItSay account. One credit edits one image.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9e5b002930ed46ac18b7d948d5fe75b83855712e622ece23537943e99cc01cea"
        },
        {
          "name": "get_edit",
          "title": "Get an edit",
          "description": "Status of an edit. When ready, result_url downloads the edited PNG for one hour. Free.",
          "inputSchema": {
            "properties": {
              "edit_id": {
                "description": "The id returned by replace_text.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "wait_seconds": {
                "description": "How long to wait for the result before returning, 0 to 50 seconds.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["edit_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5cb519fb9cac9b49dab9bd3d1dc1c96eac046cc61e183594c1c8e4613e93ad4"
        },
        {
          "name": "replace_text",
          "title": "Change the text in an image",
          "description": "Change or remove text in a photo or screenshot and keep the same font, colour and background. Give each line to change as { from, to }: \"from\" is the text as it appears in the image, \"to\" the new text (empty to remove it). Up to 20 lines per image; 1 credit per image. The image is scanned first; if a \"from\" is not found, nothing is charged and the error lists the lines that were read. IDs, certificates, receipts, invoices and bank documents are refused. Waits up to 50 seconds; if still editing, call get_edit.",
          "inputSchema": {
            "properties": {
              "hint": {
                "description": "Optional: where the text is when it appears more than once, e.g. \"the line at the bottom\".",
                "maxLength": 200,
                "type": "string"
              },
              "image_base64": {
                "description": "The image as base64, with or without a data: prefix. Use when there is no URL.",
                "type": "string"
              },
              "image_url": {
                "description": "Public https URL of the image (PNG or JPG).",
                "format": "uri",
                "type": "string"
              },
              "locale": {
                "description": "Language of the person asking (for our statistics only). Default en.",
                "enum": ["en", "es", "ja", "zh-Hans", "zh-Hant", "ko", "ar", "fr"],
                "type": "string"
              },
              "replacements": {
                "items": {
                  "properties": {
                    "from": {
                      "description": "Text as it appears in the image.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "to": {
                      "description": "New text. Empty removes the line.",
                      "maxLength": 200,
                      "type": "string"
                    }
                  },
                  "required": ["from", "to"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "wait_seconds": {
                "description": "How long to wait for the result before returning, 0 to 50 seconds.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["replacements"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:44e612dbf2726dc6ab76fd5da4718e2f5c61f70780755cac3d777dbcea346903"
        },
        {
          "name": "scan_text",
          "title": "Read the text in an image",
          "description": "Read every line of text in an image with its position (0 to 1000 from the top left). Free, but counts toward the scan limit. Use it to find the exact \"from\" text for replace_text.",
          "inputSchema": {
            "properties": {
              "image_base64": {
                "description": "The image as base64, with or without a data: prefix. Use when there is no URL.",
                "type": "string"
              },
              "image_url": {
                "description": "Public https URL of the image (PNG or JPG).",
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e1d99133f121c52f8ddd9ca4e4c8ce25ec010f6b6524ed25d00d170f8e59b130"
        }
      ],
      "digest": "sha256:edbe2fcfe5f4ccfc440cfbce8c6b68f59be6d8db700a1bbb98c339f83115cf64"
    }
  }
}
