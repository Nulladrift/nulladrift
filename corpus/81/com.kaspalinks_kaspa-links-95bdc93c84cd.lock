      },
      "transport": {
        "type": "http",
        "url": "https://kaspalinks.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "kaspa-links",
        "title": "Kaspa Links",
        "version": "1.1.0",
        "websiteUrl": "https://kaspalinks.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Kaspa Links (kaspalinks.com) makes non-custodial Kaspa (KAS) payment links, claim links and on-chain giveaways on Kaspa mainnet. These tools never create links or move funds: the prepare tools return a prefilled kaspalinks.com form that the user opens to review and create the link themselves. Give the user the form URL exactly as returned. Never ask the user for a seed phrase, private key, creator token or manage link; Kaspa Links never needs them. There is no platform fee, payments go straight to the recipient's own address, and Kaspa payments are final.",
      "tools": [
        {
          "name": "list_open_giveaways",
          "title": "List open Kaspa giveaways",
          "description": "List open on-chain Kaspa giveaways on Kaspa Links that anyone can enter for free with a Kaspa address: prize, entries, free spots, closing time and the page to enter.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List open Kaspa giveaways"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:893f4f791970b5b8e5a94da0db9e3aeabaf7a3fd4d04a9c6b3ab0baf4be1e112"
        },
        {
          "name": "prepare_claim_link",
          "title": "Prepare a Kaspa claim link",
          "description": "Prepare a claim link: a way to send KAS to someone without knowing their address. The user pays the amount once into a one-time on-chain output; whoever opens the link claims it to their own wallet; if nobody claims it within the claim window, the KAS returns to the user's wallet by itself. A count of 2 to 8 makes a Claim Drop with that many separate links (needs a free Kaspa Links profile). Returns the kaspalinks.com form to open.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 1,
                "description": "How many separate claim links, 1 to 8.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare a Kaspa claim link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b0c97d8c4cb086d15788bd03397d4849443b3d3971887f8152623a82dd1728a"
        },
        {
          "name": "prepare_giveaway",
          "title": "Prepare an on-chain Kaspa giveaway",
          "description": "Prepare an on-chain giveaway, for example for a community or Telegram group. The prize is locked in a SilverScript contract on Kaspa with the creator's return wallet; entries are recorded on-chain and free for entrants, who only need a Kaspa address; a later Kaspa block picks the winner and the contract pays only that winner. If nobody enters, the prize goes back. Kaspa Links never holds the prize. Returns the kaspalinks.com studio to open.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare an on-chain Kaspa giveaway"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1ec4b7037ff110045fba8dad3dc98a8522a2e2aa5d6c6efc630f4e931f532db"
        },
        {
          "name": "prepare_payment_link",
          "title": "Prepare a Kaspa payment link",
          "description": "Prepare a Kaspa payment link that pays straight into the user's own Kaspa wallet: tips or donations (payers choose the amount), a fixed price, or a fundraising goal with a progress bar. Returns a prefilled kaspalinks.com form; the user opens it, checks the address and creates the link. No account and no platform fee. Ask the user for their own kaspa: address if they have not given it; never guess one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount_kas": {
                "description": "Required for kind fixed (the price) and goal (the target), in KAS, for example \"25\" or \"12.5\". At least 0.2 KAS. Ignored for kind any.",
                "type": ["string", "number"]
              },
              "kind": {
                "default": "any",
                "description": "any: payers choose how much (tips, donations). fixed: a set price (invoice, sale). goal: collect toward a target with a progress bar.",
                "enum": ["any", "fixed", "goal"],
                "type": "string"
              },
              "recipient_address": {
                "description": "The user's own Kaspa mainnet address that receives the payments (kaspa:…).",
                "type": "string"
              },
              "title": {
                "description": "Short title payers see, for example \"Buy me a coffee\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["recipient_address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare a Kaspa payment link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dcef747198fbe022f7ea5cf2ebc0a030a6cdf73d466a16e79cfdea1f47fdfc8b"
        }
      ],
      "digest": "sha256:a1efa4a56f66892cd1132a9bfeeda5d23f70f9f635f290e44dedc3cbd03efb96"
    }
  }
}
