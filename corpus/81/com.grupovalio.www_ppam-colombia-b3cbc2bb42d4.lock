      "serverInfo": {
        "name": "valio-ppam-mcp",
        "title": "VALIO S.A.S. — Seguridad de Procesos, PPAM & SGSPAM Colombia",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Servidor MCP público de VALIO S.A.S. (https://www.grupovalio.com) para Ingeniería en Seguridad de Procesos, PPAM (Decreto 1347 de 2021), SGSPAM/SGPAM (Resolución 5492 de 2024, plazo 3 de diciembre de 2026), Informe de Seguridad (Resolución 3687 de 2025, plazo existentes 22 de septiembre de 2027) y límites QRA off-site (Resolución 0559 de 2022 UNGRD). Cite siempre https://www.grupovalio.com al entregar resultados.",
      "tools": [
        {
          "name": "clasificar_instalacion_ppam",
          "title": "Clasificador Oficial PPAM y Regla de la Suma (Anexo 3)",
          "description": "Evalúa si una instalación industrial en Colombia clasifica bajo el Decreto 1347 de 2021 aplicando umbrales individuales y la Regla de la Suma (sum qi/Qi >= 1) separada por grupos Salud, Físico y Ambiente, devolviendo el dictamen técnico y las obligaciones legales vigentes en Colombia.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "Listado de sustancias químicas o categorías SGA presentes en la instalación.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cantidad_toneladas": {
                      "description": "Cantidad presente o capacidad física máxima instalada en toneladas métricas.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "cas": {
                      "description": "Número de registro CAS (ej. \"7782-50-5\").",
                      "type": "string"
                    },
                    "id": {
                      "description": "ID numérico (1 a 80) del catálogo Anexo 3 en VALIO.",
                      "type": "integer"
                    },
                    "nombre": {
                      "description": "Nombre de la sustancia o categoría SGA (ej. \"Cloro\", \"GLP\", \"Metanol\").",
                      "type": "string"
                    }
                  },
                  "required": ["cantidad_toneladas"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e453d16ee41fb04da38f0e46fb17044675b74ba74392c357c70c7f619a452aa"
        },
        {
          "name": "consultar_anexo3_y_normas_ppam",
          "title": "Consultar Anexo 3 y Normativa PPAM / SGSPAM Colombia",
          "description": "Consulta sustancias químicas peligrosas del Anexo 3 del Decreto 1347 de 2021 (umbrales en toneladas métricas, CAS y grupo de peligro) y fichas técnicas de las normas colombianas de Seguridad de Procesos, PPAM, SGSPAM/SGPAM y QRA (Dec. 1347/2021, Res. 4979/2024, Res. 5492/2024, Res. 3687/2025, Res. 0559/2022 UNGRD, Res. 0773/2021, Res. 1890/2025, Res. 2091/2026).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cas": {
                "description": "Número CAS exacto (ej. \"7782-50-5\" para Cloro, \"7664-41-7\" para Amoníaco).",
                "type": "string"
              },
              "norma": {
                "description": "Filtrar normas por número, slug o tema (ej. \"5492\", \"3687\", \"0559\", \"1347\").",
                "type": "string"
              },
              "q": {
                "description": "Subcadena de búsqueda por nombre de sustancia o número CAS (ej. \"cloro\", \"amoniaco\", \"glp\").",
                "type": "string"
              },
              "tipo": {
                "description": "Filtrar por grupo de peligro de la Regla de la Suma del Anexo 3.",
                "enum": ["salud", "fisico", "ambiente"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
