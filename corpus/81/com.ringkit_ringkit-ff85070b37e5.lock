        {
          "name": "ringkit_create_business",
          "title": "Create business",
          "description": "Step 1: Create the business. Create a RingKit business (pay-per-minute AI phone receptionist) and its first API key, returned once. No auth needed: this is how an agent starts. Identical requests are deduplicated for 24 hours; use a new idempotencyKey only to deliberately repeat the action.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "idempotencyKey": {
                "description": "Optional. Retries of the same call should reuse it (the stored result comes back); a new value deliberately repeats an identical call. The MCP POST's Idempotency-Key header takes precedence.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "notify": {
                "items": {
                  "oneOf": [
                    {
                      "properties": {
                        "to": {
                          "pattern": "^\\+[1-9]\\d{6,14}$",
                          "type": "string"
                        },
                        "type": {
                          "const": "sms",
                          "type": "string"
                        }
                      },
                      "required": ["to", "type"],
                      "type": "object"
                    },
                    {
                      "properties": {
                        "to": {
                          "format": "email",
                          "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                          "type": "string"
                        },
                        "type": {
                          "const": "email",
                          "type": "string"
                        }
                      },
                      "required": ["to", "type"],
                      "type": "object"
                    },
                    {
                      "properties": {
                        "secret": {
                          "minLength": 16,
                          "type": "string"
                        },
                        "type": {
                          "const": "webhook",
                          "type": "string"
                        },
                        "url": {
                          "format": "uri",
                          "type": "string"
                        }
                      },
                      "required": ["type", "url"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              },
              "ownerEmail": {
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "ownerPhone": {
                "pattern": "^\\+[1-9]\\d{6,14}$",
                "type": "string"
              },
              "timezone": {
                "minLength": 1,
                "type": "string"
              },
              "vertical": {
                "maxLength": 60,
                "type": "string"
              },
              "website": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name", "ownerEmail", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create business"
