{
  "lockfileVersion": 2,
  "subjects": {
    "app.dataclue/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dataclue.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dataclue",
        "title": "DataClue — AI training data marketplace",
        "version": "1.0.0",
        "websiteUrl": "https://dataclue.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DataClue licenses real-world AI training data, 1,370,000+ hours in all: egocentric (first-person) video of people doing real work (430,000+ hours fully annotated at list price), stereo and multi-camera capture, tactile glove data, robot teleoperation, UMI handheld-gripper demonstrations, and custom collection (new scenarios, robot teleoperation, non-invasive EEG / brain-computer interface data).\nUse search_datasets to find data for a need, get_dataset for specs, scenarios and samples, and get_pricing_and_terms for prices and licensing. Use request_quote only when the user asks to contact DataClue (for samples, a pilot, a quote or a custom collection) and has given their own work email; confirm the details with the user before calling it.",
      "tools": [
        {
          "name": "get_dataset",
          "title": "Get dataset details",
          "description": "Full details for one DataClue dataset: overview, scenarios with measured sample specs, delivered resolution, sensors, annotation, delivery format, licensing, FAQs, sample clip URLs and price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Dataset slug, e.g. \"manufacturing-operations\", \"household-activities\", \"warehouse-logistics\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get dataset details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:34f37405a99609f426c18a65218ff41cbcf5bf44645d2c18523bd414ca32c17e"
        },
        {
          "name": "get_pricing_and_terms",
          "title": "Get pricing and terms",
          "description": "DataClue's list prices, what is included, quote paths (free samples, paid pilot, volume quote, custom collection), licensing, payment and consent terms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get pricing and terms"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b42df7aae2785da060972610fb2ff0c2e32f56bf1b532fc7732cc72fe15697ab"
        },
        {
          "name": "request_quote",
          "title": "Request samples or a quote",
          "description": "Send a request to DataClue's sales team on the user's behalf: free evaluation samples, a paid pilot, a volume quote, or a custom collection. Side effect: emails the request (including the user's name, work email and company) to DataClue, who reply to that email. Only call this when the user has asked to contact DataClue and has provided their own work email, and show them the details to confirm before sending. Each call sends a new request, so do not retry a successful call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "The user's company (required except for samples).",
                "type": "string"
              },
              "datasets": {
                "description": "Dataset slugs (from search_datasets). Required for pilot and volume.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "details": {
                "description": "Requirements in the user's words. Required for custom (what should be collected).",
                "type": "string"
              },
              "email": {
                "description": "The user's work email. DataClue replies here.",
                "type": "string"
              },
              "hours": {
                "description": "Hours needed. Required for volume.",
                "type": "number"
              },
              "name": {
                "description": "The user's name (required except for samples).",
                "type": "string"
              },
              "plan": {
                "description": "sample = free evaluation clips; pilot = 10-hour paid pilot; volume = quote for a number of hours; custom = data collected to order.",
                "enum": ["sample", "pilot", "volume", "custom"],
                "type": "string"
              },
              "scenarios": {
                "description": "Optional scenario slugs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "timeline": {
                "description": "When the data is needed.",
                "type": "string"
              },
              "use_case": {
                "description": "Intended use. Required for volume.",
                "enum": ["Robot policy / VLA pretraining", "World model training", "Perception & action recognition", "Evaluation / benchmarking", "Research (non-commercial)", "Other"],
                "type": "string"
              }
            },
            "required": ["email", "plan"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request samples or a quote"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8ec8dcc760e6ecc5cc39fe23260bf87745b7e64aa86ce74f2287dbc2346fba21"
        },
        {
          "name": "search_datasets",
          "title": "Search datasets",
          "description": "Search DataClue's catalog of licensable AI training data (egocentric video of real work, UMI gripper demonstrations) with a plain-English need, e.g. \"50,000 hours of household manipulation video, 1080p, long sessions\". Returns matching datasets with hours in stock, price per hour, scenarios and which requirements they meet, plus custom-collection options when nothing in stock fits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "What data is needed: domain, task, volume, resolution, frame rate, session length, sensors.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search datasets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62583d9ecb3f01153843df67e9cc7c5a858798e949b3e3194645c55cce911904"
        }
      ],
      "digest": "sha256:57cae8a112a453767a9713aff4e4a89ac4e6d330d6b5e3abc8429f8c8ca9f2d4"
    }
  }
}
