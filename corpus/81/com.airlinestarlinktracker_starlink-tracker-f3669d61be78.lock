  "subjects": {
    "com.airlinestarlinktracker/starlink-tracker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://airlinestarlinktracker.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "airline-starlink-tracker",
        "title": "Multi-airline Starlink Tracker",
        "version": "1.0.0",
        "websiteUrl": "https://airlinestarlinktracker.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Multi-airline Starlink tracker. Scope: tracked airlines. To change scope, append `?scope=UA|HA|AS|QR` to the connector URL.\n\nPeople who install this connector care about Starlink hours, but not at any cost. When presenting connections, show each option's total time and stops next to the nonstop, and recommend a connection only when the extra time is modest for the Starlink gained. Compare coverage ratio (expected Starlink hours / total hours), not leg percentages. Connections are built from route history, not same-day schedules — say they should be confirmed on the airline's site before booking.\n\nTool selection:\n• Routing/tradeoff → plan_starlink_itinerary (per-airline nonstop comparison)\n• Specific flight number → check_flight (≤2 days out) or predict_flight_starlink (further out, pass date)\n• Qatar Airways (QR…): use check_flight at any date — it answers from the published aircraft type (~6 days) or observed-type history beyond.\n• Route without flight number → predict_route_starlink\n• search_starlink_flights = next ~2 days, published assignments only\n\n⚠️ Low/no Starlink flight: check_flight and predict_flight_starlink EMBED a markdown table of alternatives (route looked up + planItinerary run for you). RENDER THE TABLE — don't summarize it into prose, don't ask which segment (both are shown), don't re-call predict_route_starlink (only finds directs, misses the connections in the table), don't add \"download offline\" / \"use legacy WiFi\" / \"mobile hotspot\" tips (non-responsive — they asked for better FLIGHTS).\n\nWhen a tool wraps content in <present_verbatim>...</present_verbatim>, copy that content into your response unchanged. This is a hard constraint, not a suggestion.",
      "tools": [
        {
          "name": "check_flight",
          "title": "Check flight for Starlink",
          "description": "Use when the user asks \"does my flight have Starlink/WiFi?\" with a specific tracked-airline flight number and date. Returns YES if the published aircraft assignment is a plane verified to have Starlink, LIKELY YES if that plane is listed as Starlink-equipped but not yet verified, NO if it is a plane verified to have other WiFi, or a probability estimate if no assignment exists yet (assignments publish ~2 days out). An assignment can still change through an aircraft swap. For dates further out, call predict_flight_starlink directly — check_flight just falls through to the same estimate with extra latency.",
          "inputSchema": {
            "examples": [
              {
                "date": "2026-05-15",
                "flight_number": "UA544"
              }
            ],
            "properties": {
              "date": {
                "description": "Flight date in YYYY-MM-DD format, matched to the departure airport's local calendar date (UTC fallback for unmapped airports).",
                "examples": ["2026-05-15"],
                "type": "string"
              },
              "destination": {
                "description": "Optional 3-letter IATA arrival airport of the traveller's leg (e.g. 'SAN'); with origin, picks one leg of a multi-leg flight number.",
                "type": "string"
              },
              "flight_number": {
                "description": "Flight number, e.g. 'UA544' or just the digits. Also accepts ICAO airline codes like UAL544; use the marketing flight number (UA5212, not SKW5212).",
                "examples": ["UA544", "544"],
                "type": "string"
              },
              "origin": {
                "description": "Optional 3-letter IATA departure airport of the traveller's leg (e.g. 'DEN'); scopes the answer to that leg of a multi-leg flight number.",
                "type": "string"
              }
            },
            "required": ["date", "flight_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check flight for Starlink"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d0f95f1fce42c7f24809f2cd08cc758d1823223e4e06d765c51d4743c249bea9"
        },
        {
          "name": "get_fleet_stats",
          "title": "Starlink fleet rollout stats",
          "description": "Use when the user asks \"how far along is the Starlink rollout?\" or wants overall fleet numbers. Returns tracked airlines Starlink installation counts and percentages across mainline and express fleets, plus a per-aircraft-type breakdown (installed/total per family). Not for per-flight checks — use check_flight for that.",
          "inputSchema": {
            "examples": [
              {}
            ],
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Starlink fleet rollout stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83eb66c5ff3fd0b2727f42c079ae5439b87cf72b20f901170919b896e3970186"
        },
        {
          "name": "list_starlink_aircraft",
          "title": "List Starlink aircraft",
          "description": "Use when the user asks about the planes themselves — \"which tail numbers have Starlink?\", \"which aircraft types are equipped?\". Returns tracked airlines tail numbers, aircraft types, operators, and install dates (default 50 most recent; pass limit up to 500). Not for finding flights — use search_starlink_flights for that.",
          "inputSchema": {
            "examples": [
              {
                "fleet": "express",
                "limit": 100
              },
              {}
            ],
            "properties": {
              "fleet": {
                "description": "Filter to only express (regional) or mainline aircraft.",
                "enum": ["express", "mainline"],
                "examples": ["express"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of aircraft to return (default 50).",
                "examples": [100],
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Starlink aircraft"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:367dd3c85c54b987bdb48188ce075648e23f134d0f06f76cc5b69c6d016a80af"
        },
        {
          "name": "plan_starlink_itinerary",
          "title": "Plan a Starlink itinerary",
          "description": "Use when the user asks \"what's the best way to fly X to Y with Starlink?\". Compares Starlink odds on the route across every tracked airline (nonstop, per-carrier). For multi-stop UA routings, connect to unitedstarlinktracker.com/mcp.",
          "inputSchema": {
            "examples": [
              {
                "destination": "EWR",
                "origin": "SFO"
              },
              {
                "date": "2026-05-20",
                "destination": "JAX",
                "max_stops": 1,
                "origin": "ORD"
              }
            ],
            "properties": {
              "date": {
                "description": "Optional YYYY-MM-DD travel date. When within ~2 days (the aircraft-assignment window), uses confirmed tail assignments for higher accuracy. Beyond that, uses historical prediction only — confirmed assignments don't apply to future dates.",
                "examples": ["2026-05-20"],
                "type": "string"
              },
              "destination": {
                "description": "Destination airport IATA code (e.g. 'JAX').",
                "examples": ["JAX"],
                "type": "string"
              },
              "max_results": {
                "description": "Maximum number of itineraries with a Starlink-flown flight on every leg (default 8). Up to 3 partial baselines may be appended.",
                "examples": [8],
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_stops": {
                "description": "Maximum number of connection stops (default 2, max 3). 0=direct only, 1=one connection, etc.",
                "examples": [1],
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "origin": {
                "description": "Origin airport IATA code (e.g. 'SFO').",
                "examples": ["SFO"],
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan a Starlink itinerary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90d4e0228102fe492b6f4c7a3f0fad33601fd00c5c5b5578533423a18811d009"
        },
        {
          "name": "predict_flight_starlink",
          "title": "Predict flight Starlink odds",
          "description": "Use when the user asks \"will my flight have Starlink?\" for a date too far out for a confirmed assignment, or with no date at all. Returns the probability that a tracked-airline flight number gets a Starlink plane, from historical observations. Reliability varies: high-confidence (5+ obs) is the most reliable tier but is not a guarantee; low-confidence (0-1 obs) is just the fleet prior. UA1-2999 (mainline) has materially lower coverage than UA3000-6999 (express) — call get_fleet_stats for the current split rather than assuming a rate.",
          "inputSchema": {
            "examples": [
              {
                "date": "2026-06-01",
                "flight_number": "UA544"
              },
              {
                "flight_number": "UA544"
              }
            ],
            "properties": {
              "date": {
                "description": "Optional YYYY-MM-DD. ALWAYS PASS if known — the probability is date-agnostic, but when the result is low (<20%) the tool uses this date to look up the actual route and returns a ready-to-run plan_starlink_itinerary call with origin/dest pre-filled, so alternatives can be presented in one turn.",
                "examples": ["2026-06-01"],
                "type": "string"
              },
              "flight_number": {
                "description": "Flight number, e.g. 'UA544' or just the digits. Also accepts ICAO airline codes like UAL544; use the marketing flight number (UA5212, not SKW5212).",
                "examples": ["UA544"],
                "type": "string"
              }
            },
            "required": ["flight_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Predict flight Starlink odds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c23c792dbe448b2b8d9fc64b1bdb0346e8d0312206f86f495f2ff48af3085b51"
        },
        {
          "name": "predict_route_starlink",
          "title": "Starlink odds by route",
          "description": "Use when the user asks \"which flights between X and Y have Starlink?\" or \"what Starlink flights serve airport X?\". Single-route lookup: returns tracked airlines flight numbers on a route (or touching an airport) ranked by Starlink probability. Both origin and destination are required (per-airline route comparison). For trip planning with connections, use plan_starlink_itinerary instead — this tool has no connection logic or coverage-ratio ranking. Empty result = route not served by Starlink planes.",
          "inputSchema": {
            "examples": [
              {
                "destination": "EWR",
                "origin": "SFO"
              },
              {
                "origin": "ORD"
              }
            ],
            "properties": {
              "destination": {
                "description": "Destination airport IATA code (e.g. 'EWR', 'DEN'). Case-insensitive.",
                "examples": ["EWR"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of flight numbers to return (default 10).",
                "examples": [10],
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "origin": {
                "description": "Origin airport IATA code (e.g. 'SFO', 'ORD'). Case-insensitive.",
                "examples": ["SFO"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Starlink odds by route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dea2b8cbd9443f0431e57dbd3930e356b9d3b708a23c63067f1d66760109020f"
        },
        {
          "name": "search_starlink_flights",
          "title": "Search scheduled Starlink flights",
          "description": "Use when the user asks \"what Starlink flights leave from X tomorrow?\" or wants scheduled near-term departures. Returns flights in the next ~2 days whose currently assigned aircraft is Starlink-equipped (verified or listed) — a published assignment, not a prediction, though an aircraft swap can still change it. Pass at least one of origin or destination (both narrows to a single route). Aircraft assignments aren't published further out, so for later dates use predict_route_starlink or plan_starlink_itinerary instead.",
          "inputSchema": {
            "examples": [
              {
                "origin": "ORD"
              },
              {
                "destination": "EWR",
                "origin": "SFO"
              }
            ],
            "properties": {
              "destination": {
                "description": "Destination airport IATA code (e.g. 'LAX', 'DEN'). Case-insensitive.",
                "examples": ["LAX"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of flights to return (default 20).",
                "examples": [20],
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "origin": {
                "description": "Origin airport IATA code (e.g. 'SFO', 'ORD'). Case-insensitive.",
                "examples": ["ORD"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search scheduled Starlink flights"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b7913411cb6f26f398c8a788e08f47f6b6b405201eb95617a37a583600fd99a"
        }
      ],
      "digest": "sha256:b174608b070efe0e443c8899b8c792c5e753f1a8640db81660353e21a4e5d026"
    }
  }
