        {
          "name": "screen_assets",
          "title": "Screen coins",
          "description": "Screen every coin CryptoKeyhole covers by the latest readings of its charts, for example coins with MVRV below 1, funding below zero or price 60% under its high. A condition is field:measure op number, such as market.Mvrv:v<1 or market.PriceUsdClose:p30>10, combined with all(...) or any(...); measures: v the reading, p1 p7 p30 p90 p365 the change in %, d1 ... d365 the change in the chart's unit, z the four-year z-score, q the four-year percentile. get_screener_fields gives the field ids. Without an API key: the first 10 coins at the daily close.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assets": {
                "description": "Optional coin codes to screen; leave it out for every coin.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "columns": {
                "description": "Columns as field:measure, for example [\"market.PriceUsdClose:p30\", \"market.Mvrv:v\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "dir": {
                "default": "desc",
                "description": "Sort direction.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "interval": {
                "default": "24h",
                "description": "Resolution: 24h daily. get_metric_metadata gives the intervals a metric offers.",
                "enum": ["24h"],
                "type": "string"
              },
              "sort": {
                "description": "A column to sort by (field:measure), or asset.",
                "type": "string"
              },
              "where": {
                "description": "The condition, for example all(market.Mvrv:v<1,derivatives.FuturesFundingRatePerpetual:v<0). Leave it out for every coin.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
