      "serverInfo": {
        "name": "cryptokeyhole",
        "version": "1.5.0"
      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "CryptoKeyhole: read-only crypto market and on-chain data for Bitcoin, Ethereum and a growing list of coins, calculated from blockchain nodes we run and market data we collect. The question tools answer directly, each with the time of its reading and the page to open: get_liquidation_map, get_derivatives_snapshot (liquidations, funding, open interest, options expiry), get_price_history (a price on a date or between dates), get_eth_btc_ratio, get_support_levels, get_exchange_reserves and get_etf_flows. For any other chart, find its exact id with get_asset_metrics and a query, then read it with fetch_metric. For what is unusual right now, find_extremes; to screen coins by their charts, screen_assets (get_screener_fields lists its fields); to combine metrics, run_formula; to compare two, correlate_metrics. Exact decimal strings must not be rounded implicitly; bulk results are not an atomic snapshot. Free data is licensed CC BY 4.0: credit CryptoKeyhole with a link. Without an API key it serves what the Free plan includes; a Plus, Pro or API & Team API key, sent as Authorization: Bearer <key>, reads the charts and intervals of that plan.",
      "tools": [
        {
          "name": "correlate_metrics",
          "title": "Correlation of two metrics",
          "description": "How closely two metrics move together over a window: the Pearson correlation of their period-over-period changes (log changes when both stay above zero) and of their levels, and the rolling correlation of changes, from the two exact series. For example BTC's price against its exchange balance, or ETH's price against BTC's.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a": {
                "description": "A metric id as get_asset_metrics lists it, for example ckh.SpotPrice or eth.PriceUSD.",
                "minLength": 1,
                "type": "string"
              },
              "b": {
                "description": "A metric id as get_asset_metrics lists it, for example ckh.SpotPrice or eth.PriceUSD.",
                "minLength": 1,
                "type": "string"
              },
              "end": {
                "description": "Exclusive UNIX seconds UTC. Leave it out to read up to the latest observation.",
                "type": "integer"
              },
              "interval": {
                "default": "24h",
                "description": "Resolution: 24h daily, 1w weekly, 1M monthly. get_metric_metadata gives the intervals a metric offers.",
                "enum": ["24h", "1w", "1M"],
                "type": "string"
              },
              "start": {
                "description": "Inclusive UNIX seconds UTC. Without it fetch_metric reads the latest year of daily observations (ten years of weekly ones, every monthly and yearly one).",
                "type": "integer"
              },
              "window": {
                "default": 30,
                "description": "Periods in the rolling correlation.",
                "maximum": 365,
                "minimum": 5,
                "type": "integer"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Correlation of two metrics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:09364052f7aacd4b624b6eaa86d48b67a52ae7b7d9a9351c55525bba8ba5ecdc"
        },
