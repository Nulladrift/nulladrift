        {
          "name": "run_formula",
          "title": "Formula over metrics",
          "description": "Combine up to eight metrics in a formula and read the result as a series, as CryptoKeyhole's Formulae workbench does: + - * / ^ and functions such as sma, ema, zscore, pct_change, change, corr, rsi, drawdown, realized_vol, rebase, cumsum and ifthen. Name each input with a letter: inputs {\"a\": \"ckh.MVRVPriced\", \"b\": \"ckh.SpotPrice\"} and expression \"zscore(a, 365)\". Without an API key the inputs are metrics whose plan is free, at 24h, 1w or 1M.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "end": {
                "description": "Exclusive UNIX seconds UTC. Leave it out to read up to the latest observation.",
                "type": "integer"
              },
              "expression": {
                "description": "The formula over the inputs' letters, for example \"a / b\" or \"sma(a, 30)\".",
                "minLength": 1,
                "type": "string"
              },
              "inputs": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "One to eight inputs: a letter to a metric id, for example {\"a\": \"ckh.SpotPrice\"}.",
                "type": "object"
              },
              "interval": {
                "default": "24h",
                "description": "Resolution: 24h daily, 1w weekly, 1M monthly. get_metric_metadata gives the intervals a metric offers.",
                "enum": ["24h", "1w", "1M"],
                "type": "string"
              },
              "start": {
                "description": "Inclusive UNIX seconds UTC. Without it fetch_metric reads the latest year of daily observations (ten years of weekly ones, every monthly and yearly one).",
                "type": "integer"
              }
            },
            "required": ["expression", "inputs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Formula over metrics"
          },
