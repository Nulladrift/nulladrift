          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "holdings": {
                "description": "The portfolio: 1 to 30 holdings, each ticker once, with its weight.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ticker": {
                      "description": "Fund or company ticker symbol as listed on a US exchange, e.g. \"VTI\".",
                      "maxLength": 11,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9]{1,6}(?:[.\\-][A-Za-z0-9]{1,4})?$",
                      "type": "string"
                    },
                    "weight": {
                      "description": "Share of the portfolio. Percent (60 = 60%) or fraction (0.6); weights are normalized to total 100%.",
                      "exclusiveMinimum": 0,
                      "maximum": 100,
                      "type": "number"
                    }
                  },
                  "required": ["ticker", "weight"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["holdings"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "disclaimer": {
                "type": "string"
              },
              "fee_cost_10y_on_100k_usd": {
                "type": ["number", "null"]
              },
              "fee_cost_30y_on_100k_usd": {
                "type": ["number", "null"]
              },
              "formula": {
                "type": "string"
