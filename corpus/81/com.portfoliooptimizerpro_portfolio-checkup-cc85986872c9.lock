                    "fund_name": {
                      "type": ["string", "null"]
                    },
                    "kind": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": ["string", "null"]
                    },
                    "ticker": {
                      "type": "string"
                    },
                    "weight_pct": {
                      "type": "number"
                    }
