        {
          "name": "grade_portfolio",
          "title": "Grade a portfolio",
          "description": "Runs the free Portfolio Optimizer Pro checkup on a list of holdings and weights. Returns the A+ to F structural grade, the 0-100 score, any structural ceiling (cap) applied, each factor's sub-score with its measured fact, the top findings that held the grade down, the price-history dates used, a disclaimer and full_breakdown_url, a link that opens the same graded checkup on the website. Grades describe diversification, cost and past risk; they are educational, not advice or a forecast. Unknown tickers are listed in unknown_tickers, never guessed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "holdings": {
                "description": "The portfolio: 1 to 30 holdings, each ticker once, with its weight.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ticker": {
                      "description": "Fund or company ticker symbol as listed on a US exchange, e.g. \"VTI\".",
                      "maxLength": 11,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9]{1,6}(?:[.\\-][A-Za-z0-9]{1,4})?$",
                      "type": "string"
                    },
                    "weight": {
                      "description": "Share of the portfolio. Percent (60 = 60%) or fraction (0.6); weights are normalized to total 100%.",
                      "exclusiveMinimum": 0,
                      "maximum": 100,
                      "type": "number"
                    }
                  },
                  "required": ["ticker", "weight"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["holdings"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cap_applied": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "binding": {
                        "description": "True when the score would have been higher without this ceiling.",
                        "type": "boolean"
                      },
                      "ceiling_grade": {
                        "type": "string"
                      },
                      "ceiling_score": {
                        "type": "number"
                      },
                      "label": {
                        "type": "string"
                      },
                      "reason": {
                        "type": "string"
                      },
                      "score_before_ceiling": {
                        "type": ["number", "null"]
                      }
                    },
                    "required": ["binding", "ceiling_grade", "ceiling_score", "label", "reason", "score_before_ceiling"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Lowest structural ceiling that applies, or null."
              },
              "data": {
                "additionalProperties": false,
                "properties": {
                  "data_as_of": {
                    "type": ["string", "null"]
                  },
                  "history_end": {
                    "type": ["string", "null"]
                  },
                  "history_start": {
                    "type": ["string", "null"]
                  },
                  "months": {
                    "type": "number"
                  },
                  "source": {
                    "type": "string"
                  }
                },
                "required": ["data_as_of", "history_end", "history_start", "months", "source"],
                "type": "object"
              },
              "disclaimer": {
                "type": "string"
              },
              "factors": {
                "description": "Each graded factor, worst first.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "a_range_min": {
                      "type": "number"
                    },
                    "key": {
                      "type": "string"
                    },
                    "measured_fact": {
                      "type": "string"
                    },
                    "measures": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "not_measured_reason": {
                      "type": ["string", "null"]
                    },
                    "status": {
                      "enum": ["strong", "fair", "weak", "unmeasured"],
                      "type": "string"
                    },
                    "sub_score": {
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["a_range_min", "key", "measured_fact", "measures", "name", "not_measured_reason", "status", "sub_score"],
                  "type": "object"
                },
                "type": "array"
              },
              "full_breakdown_url": {
                "description": "Opens the free checkup already graded for these holdings, with the full explanation.",
                "type": "string"
              },
              "grade": {
                "description": "Letter grade A+ to F, or \"Not graded\".",
                "type": "string"
              },
              "holdings_graded": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ticker": {
                      "type": "string"
                    },
                    "weight_pct": {
                      "type": "number"
                    }
                  },
                  "required": ["ticker", "weight_pct"],
                  "type": "object"
                },
                "type": "array"
              },
              "methodology_url": {
                "type": "string"
              },
              "notices": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "risk_profile": {
                "type": "string"
              },
              "score": {
                "description": "0–100 structural score.",
                "type": ["number", "null"]
              },
              "top_findings": {
                "description": "Top 1–3 things that held the grade down.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "factor": {
                      "type": ["string", "null"]
                    },
                    "finding": {
                      "type": "string"
                    },
                    "higher_scoring_portfolios": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "points_lost": {
                      "type": "number"
                    }
                  },
                  "required": ["factor", "finding", "higher_scoring_portfolios", "label", "points_lost"],
                  "type": "object"
                },
                "type": "array"
              },
              "unknown_tickers": {
                "description": "Tickers with no usable price history; they were left out and the grade is capped as partial.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["cap_applied", "data", "disclaimer", "factors", "full_breakdown_url", "grade", "holdings_graded", "methodology_url", "notices", "risk_profile", "score", "top_findings", "unknown_tickers"],
            "type": "object"
          },
