      },
      "instructions": "Free, read-only portfolio checkup tools from Portfolio Optimizer Pro (portfoliooptimizerpro.com). Holdings are given as [{ticker, weight}] with weights in percent. grade_portfolio returns an A+ to F structural grade with its factor breakdown and a full_breakdown_url to the same checkup on the website; fund_fee_cost returns the weighted fee and 30-year fee cost; check_overlap returns category-based fund overlap; explain_grading returns the grading method. Results describe structure, cost and past risk; they are educational and hypothetical, not advice or a forecast, and each result includes a disclaimer. No account is needed and holdings are not stored.",
      "tools": [
        {
          "name": "check_overlap",
          "title": "Check fund overlap",
          "description": "Checks a list of holdings for known index overlap and related fund mandates, using issuer reference records (asset class, region, structure). Findings are worded exactly as the Portfolio Optimizer Pro grade states them. Overlap here is category-based (similar stated mandates); it is not a measured percentage of shared underlying holdings, and the result says so.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "holdings": {
                "description": "The portfolio: 1 to 30 holdings, each ticker once, with its weight.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ticker": {
                      "description": "Fund or company ticker symbol as listed on a US exchange, e.g. \"VTI\".",
                      "maxLength": 11,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9]{1,6}(?:[.\\-][A-Za-z0-9]{1,4})?$",
                      "type": "string"
                    },
                    "weight": {
                      "description": "Share of the portfolio. Percent (60 = 60%) or fraction (0.6); weights are normalized to total 100%.",
                      "exclusiveMinimum": 0,
                      "maximum": 100,
                      "type": "number"
                    }
                  },
                  "required": ["ticker", "weight"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["holdings"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "disclaimer": {
                "type": "string"
              },
              "known_index_overlap": {
                "description": "Fund-overlap findings exactly as the grade states them; any one caps the grade.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "mandates": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "as_of": {
                      "type": ["string", "null"]
                    },
                    "asset_class": {
                      "type": ["string", "null"]
                    },
                    "fund_name": {
                      "type": ["string", "null"]
                    },
                    "kind": {
                      "type": "string"
                    },
                    "region": {
                      "type": ["string", "null"]
                    },
                    "source_url": {
                      "type": ["string", "null"]
                    },
                    "structure": {
                      "type": ["string", "null"]
                    },
                    "ticker": {
                      "type": "string"
                    },
                    "weight_pct": {
                      "type": "number"
                    }
                  },
                  "required": ["as_of", "asset_class", "fund_name", "kind", "region", "source_url", "structure", "ticker", "weight_pct"],
                  "type": "object"
                },
                "type": "array"
              },
              "method_note": {
                "type": "string"
              },
              "notices": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "related_categories": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "funds": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["funds", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "unknown_tickers": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["disclaimer", "known_index_overlap", "mandates", "method_note", "notices", "related_categories", "unknown_tickers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check fund overlap"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ef2c6a7f2efd36ee2bbc25e2231f70c93d3515fec225055d13560447e8d4592"
        },
