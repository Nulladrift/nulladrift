      "transport": {
        "type": "http",
        "url": "https://renewalmatrix.vercel.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "renewalmatrix",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_renewal_compliance",
          "description": "Score a subscription business's signup/cancellation flow against current US click-to-cancel / automatic-renewal laws (federal FTC Section 5/ROSCA, plus CA/CO/VT/OR in the full paid report). Deterministic rules engine, no LLM guessing -- every finding cites its actual statute. This free tool returns only the federal result plus a locked count of state findings; the full 5-jurisdiction report with citations is a $49 one-time purchase at renewalmatrix.vercel.app. Informational only, not legal advice.",
          "inputSchema": {
            "properties": {
              "b2b_customers_colorado": {
                "description": "Does the business sell to B2B customers in Colorado?",
                "type": "boolean"
              },
              "confirmation_email_with_cancel_instructions": {
                "description": "Does the signup confirmation email restate cancel instructions?",
                "type": "boolean"
              },
              "long_term_or_discounted_trial": {
                "description": "Is this a 1+ year term or a discounted-trial-to-paid conversion?",
                "type": "boolean"
              },
              "online_cancel": {
                "description": "Can a customer cancel online, same medium as signup?",
                "type": "boolean"
              },
              "online_signup": {
                "description": "Can a customer sign up online? (default true)",
                "type": "boolean"
              },
              "phone_or_email_required": {
                "description": "Is phone or email required to cancel?",
                "type": "boolean"
              },
              "prechecked_consent": {
                "description": "Is the auto-renew consent box pre-checked/default-on?",
                "type": "boolean"
              },
              "renewal_notice_days": {
                "description": "Days of advance notice sent before a renewal charge, if any",
                "type": "integer"
              },
              "sells_states": {
                "description": "State codes the business sells subscriptions in, e.g. ['CA','CO'], or ['nationwide']",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["sells_states"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aaea1205f4170fd2ad2f8d4d7f06cb819d8d393cd183dc1ba254c5cab6abc3e4"
        }
      ],
      "digest": "sha256:bd96574bd7a69497cc85aaf6348cbbec16860a0bc60086ae70c3d5c7083e3cd5"
    }
  }
