          "title": "Check a website's technical setup",
          "description": "Starts a technical audit of up to five public pages of one website. The response is an acknowledgment with an audit reference and no final audit status. While the audit runs, it also has retry_after_seconds, the delay in seconds before the result is expected. promptscout_get_website_audit returns the result for that reference. References expire after seven days. A repeated request_key returns the same audit. Errors return status failed with a code and a summary. The audit checks technical setup: access, indexing and discovery, content and structure, and metadata. It does not measure AI citations or visibility. No account is needed.",
