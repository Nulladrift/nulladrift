        {
          "name": "promptscout_get_website_audit",
          "title": "Read a technical website audit",
          "description": "Reads a website audit by the reference that promptscout_start_website_audit returned. References expire after seven days. While the audit runs, the response has ready false, no final status and retry_after_seconds, the delay in seconds before the result is expected. A finished audit has status success when at least one page was analyzed, even with findings, and failed when no page was analyzed. A successful result has a summary, the evidence date, the number of pages analyzed and attempted, a checklist in priority order and notes. Each checklist fix states the problem, the affected URLs, where to change the HTML or server setting, the change and the reason. The notes name checks that could not be completed and the next step. The result contains no visibility score and does not measure AI citations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "reference": {
                "description": "The audit reference returned when the audit was started. It expires after seven days.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
