{
  "lockfileVersion": 2,
  "subjects": {
    "com.contextwindowsupply/store": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://contextwindowsupply.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "context-window-supply",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Browse merch for AI builders, get US shipping quotes, and create a Stripe checkout link that a person pays. Checkout is live. US shipping only. Never send card details. Product images are digital previews. request_refund files a refund request for a past order: a person reviews it and replies by email, and it never refunds anything by itself.",
      "tools": [
        {
          "name": "create_checkout_link",
          "description": "Checkout is live. Creates a Stripe checkout link for the order that a person opens and pays on Stripe. This tool charges nothing by itself. US shipping only. Never send card details to this server.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "enum": ["US"],
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "color": {
                      "description": "Required for tees and hoodies (see get_product colors).",
                      "type": "string"
                    },
                    "product_id": {
                      "type": "string"
                    },
                    "quantity": {
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "size": {
                      "description": "Required for tees and hoodies (see get_product sizes). 2XL may cost more (size_upcharges).",
                      "type": "string"
                    }
                  },
                  "required": ["product_id", "quantity"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4d4c2c87cc7f7bbb48213c1ff6cd3c175f2a8041142ddb9ede7f94b096a3b803"
        },
        {
          "name": "get_product",
          "description": "Get one product with sizes, colors and price. Read-only.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8417b057d7db4c2f3a521946509048603329aea806513c68be90d8c4e85c3b08"
        },
        {
          "name": "get_shipping_quote",
          "description": "Subtotal, shipping and total for US delivery. Read-only. Rates per item, first/each extra: tee $4.95/$2.25, hoodie $8.95/$2.5, sticker sheet $3.95/$1.95.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "enum": ["US"],
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "color": {
                      "description": "Required for tees and hoodies (see get_product colors).",
                      "type": "string"
                    },
                    "product_id": {
                      "type": "string"
                    },
                    "quantity": {
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "size": {
                      "description": "Required for tees and hoodies (see get_product sizes). 2XL may cost more (size_upcharges).",
                      "type": "string"
                    }
                  },
                  "required": ["product_id", "quantity"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:251910caba2edb9faa44752b0c3f2d370d62a0582a12db9c7dca7f3b492660aa"
        },
        {
          "name": "request_refund",
          "description": "Files a refund request for a past order. It only files a request: a person reviews it and replies by email. It never refunds anything by itself and never takes card details, so never send card numbers. Needs the order email, the Stripe receipt number or order number, and a reason.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Email address used for the order.",
                "maxLength": 254,
                "type": "string"
              },
              "items": {
                "description": "Optional: which items, with color and size.",
                "maxLength": 500,
                "type": "string"
              },
              "order_reference": {
                "description": "Stripe receipt number (like 1234-5678) or order number (like CWS-AB12CD34EF).",
                "maxLength": 64,
                "type": "string"
              },
              "reason": {
                "description": "What went wrong, for example damaged, misprinted, wrong item or lost in transit.",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["email", "order_reference", "reason"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:43a28f4908f9192e18a6d778e97ba38f091e88ba1ef9f8ad5ddc8585a2c4d6be"
        },
        {
          "name": "search_products",
          "description": "Search Context Window Supply merch (tees, hoodies, stickers for AI builders). Read-only.",
          "inputSchema": {
            "properties": {
              "query": {
                "maxLength": 200,
                "type": "string"
              },
              "type": {
                "enum": ["t-shirt", "hoodie", "sticker"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6245477199ede262aaa3750f614ccb043fa21535f05796b0dc3f09539abbbbbd"
        }
      ],
      "digest": "sha256:cd48bcb2d9e2205995dfa02396982ad56c243be17a0e0942119e7909314f92bd"
    }
  }
