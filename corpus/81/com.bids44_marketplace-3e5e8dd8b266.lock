        },
        {
          "name": "search_listings",
          "title": "Search Bids44 listings",
          "description": "Search live Bids44 marketplace listings. Input: query + optional category, city, maxPrice. Returns up to 10 listings with title, price, city, condition, and URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "maxPrice": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "query": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
