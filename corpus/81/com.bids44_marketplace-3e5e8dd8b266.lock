{
  "lockfileVersion": 2,
  "subjects": {
    "com.bids44/marketplace": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bids44-mcp-751110103074.asia-south1.run.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bids44-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_listing",
          "title": "Get Bids44 listing",
          "description": "Get public details of one Bids44 listing by its id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:06ced1c9f7ca620db0a4eaa1ffda7be486f67362a10cdbfe17f59ab0edaed8b5"
        },
        {
          "name": "get_resale_price",
          "title": "Get resale price",
          "description": "Get the India resale value range (₹) for a used product from Bids44's price data. Input: product name, optional condition.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "condition": {
                "enum": ["like_new", "good", "fair"],
                "type": "string"
              },
              "product": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a918a4c838acecab2369e28e3c5e02c2cc39fe753c8bd4427a2f43e04a970d03"
        },
        {
          "name": "search_listings",
          "title": "Search Bids44 listings",
          "description": "Search live Bids44 marketplace listings. Input: query + optional category, city, maxPrice. Returns up to 10 listings with title, price, city, condition, and URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "maxPrice": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "query": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4af6d4f9d6a0f729a4853a09c179926dd123324dfc5dba006e3a47de01f4b1cc"
        }
      ],
      "digest": "sha256:4a4d00e9d8c5836825505e9b054bc4b302ee0a3a26bc7217667c7d9cb153fe59"
    }
  }
}
