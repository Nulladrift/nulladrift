        {
          "name": "get_resale_price",
          "title": "Get resale price",
          "description": "Get the India resale value range (₹) for a used product from Bids44's price data. Input: product name, optional condition.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "condition": {
                "enum": ["like_new", "good", "fair"],
                "type": "string"
              },
              "product": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
