      "serverInfo": {
        "name": "apipj",
        "title": "apipj · API de CNPJ",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Dados cadastrais públicos de empresas brasileiras pelo CNPJ, da carga mensal de dados abertos da Receita Federal. validar_cnpj e status_base funcionam sem conta. consultar_cnpj e buscar_cnpjs usam uma conta apipj, e cada consulta conta no limite por minuto e na cota mensal do plano da conta (na busca, 1 por CNPJ devolvido).",
      "tools": [
        {
          "name": "buscar_cnpjs",
          "title": "Buscar CNPJs por atividade e município",
          "description": "Lista estabelecimentos ativos da base da Receita Federal pela atividade econômica principal (CNAE, 7 dígitos) e/ou pelo município (código da Receita com 4 dígitos ou do IBGE com 7); pelo menos um dos dois filtros. Devolve {dataset_month, total, resultados, proximo_cursor}: cada resultado tem os dados cadastrais da consulta individual, sem o quadro de sócios. A página tem no máximo o limite por minuto do plano (ou o argumento limite, até esse valor) e cada CNPJ devolvido consome 1 da cota mensal e 1 do limite por minuto; a próxima página vem com cursor = proximo_cursor (null no fim). Exige a conta apipj, como consultar_cnpj.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cnae": {
                "description": "CNAE da atividade principal, 7 dígitos, com ou sem pontuação (ex.: 4781400 ou 47.81-4-00)",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              },
              "cursor": {
                "description": "proximo_cursor da página anterior, com os mesmos filtros",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "formato": {
                "default": "completo",
                "description": "completo (padrão) ou simplificado, como em consultar_cnpj (sem sócios)",
                "enum": ["completo", "simplificado"],
                "type": "string"
              },
              "limite": {
                "description": "Tamanho máximo da página, de 1 até o limite por minuto do plano (padrão: esse limite)",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "municipio": {
                "description": "Código do município da Receita (4 dígitos, ex.: 7107 = São Paulo) ou do IBGE (7 dígitos, ex.: 3550308)",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar CNPJs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["cnpj"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:fa76f70b6c365c38776d45f6196a3707ba4a1bb201d523bfd6bc14e7add1ebe3"
        },
        {
          "name": "consultar_cnpj",
          "title": "Consultar CNPJ",
          "description": "Dados cadastrais públicos de um CNPJ na base da Receita Federal (lote mensal): razão social, nome fantasia, situação cadastral, endereço, telefones, e-mail, atividades CNAE, natureza jurídica, porte, capital social, Simples/MEI e sócios (CPF mascarado). Exige uma conta apipj: o cliente pede para conectar e entrar com o Google (OAuth) ou envia uma chave de API; cada consulta conta no limite por minuto e na cota mensal do plano da conta.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cnpj": {
                "description": "CNPJ com ou sem pontuação, numérico ou alfanumérico (ex.: 11.378.117/0001-20)",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "formato": {
                "default": "completo",
                "description": "completo (padrão: objetos aninhados, datas ISO e códigos da Receita) ou simplificado (plano, com datas DD/MM/AAAA e CNPJ, CEP e telefone formatados)",
                "enum": ["completo", "simplificado"],
                "type": "string"
              }
            },
            "required": ["cnpj"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
