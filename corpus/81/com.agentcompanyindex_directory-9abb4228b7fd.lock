        {
          "name": "search_offerings",
          "title": "Search offerings",
          "description": "Use when a user is looking for a B2B software product, service provider or agency (e.g. \"website maintenance for a small company\", \"time tracking with English support for a 20-person team\", \"PDF tool for a small team\") and wants options backed by sourced facts and stated limitations rather than marketing. Plain-language search over the Agent Company Index; returns matching offerings with the terms they matched. Order: offerings matching more of the query's words come first, then by name; offerings matching fewer than half as many words as the best match are left out. Country and language words (a country or language name) are shown as matched but do not count when the query also names the need. Payment, client status and ownership by ACI's operator are not inputs to the order. ACI publishes no scores and no paid positions. Follow up with get_offering for the full record.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
