          "digest": "sha256:ad525f8bd9d6c1024c4e7899f3e0e04f2a641630fd96210756a090174a3f239e"
        },
        {
          "name": "request_listing",
          "title": "Request company listing",
          "description": "List one offering of the company you act for in the Agent Company Index. Listing is free. Before calling, fill answers from the company's website and ask the user for the rest: what problem the offering solves (primary_problem), who it fits best (positive_fit) and who not (negative_fit), two to four use_cases, the countries it serves (market_country), support_languages and pricing_model. Leave out anything you cannot confirm; unanswered fields stay visible on the profile as open questions. Returns a reference and a private listing token: tell the user to keep both, the token is shown only once. work_email must be an address on the company's own domain that the user reads (info@example.com); a free-mail or other-domain address is refused at once, because the approval is recorded for a mailbox on the domain (a company without one writes to ACI). Domain control: ACI mails that address an 8-digit code that the user gives back to you (verify_listing_domain email_code); where no code can be sent, a DNS TXT record or a file. Show the user the returned option word for word. ACI then drafts the profile from the website in a few minutes (get_listing_status). Once a person who may act for the company approves one exact revision and accepts the Listing Terms (approve_listing), it is published automatically. Payment never changes fit or order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": false,
                "description": "Optional structured company answers for the draft. Each becomes a company statement on the profile, shown with its date. Unanswered fields stay open questions.",
                "properties": {
                  "certifications": {
                    "description": "Certifications held by the company itself, not by its hosting provider.",
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "company_name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "company_size_bands": {
                    "description": "Size of the company itself.",
                    "items": {
                      "enum": ["micro", "small", "medium", "large", "enterprise"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "data_export": {
                    "description": "How customers get their data out.",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "data_residency": {
                    "description": "Where customer data is stored.",
                    "enum": ["DE", "EU", "US", "mixed"],
                    "type": "string"
                  },
                  "deployment_model": {
                    "enum": ["cloud", "on_premises", "both", "not_applicable"],
                    "type": "string"
                  },
                  "description": {
                    "maxLength": 500,
                    "minLength": 20,
                    "type": "string"
                  },
                  "headquarters_country": {
                    "pattern": "^[A-Z]{2}$",
                    "type": "string"
                  },
                  "limitations": {
                    "items": {
                      "maxLength": 500,
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "market_country": {
                    "pattern": "^[A-Z]{2}$",
                    "type": "string"
                  },
                  "minimum_contract_term": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "negative_fit": {
                    "items": {
                      "maxLength": 500,
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "offering_name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "offering_status": {
                    "enum": ["active", "beta", "discontinued", "unknown"],
                    "type": "string"
                  },
                  "offering_type": {
                    "enum": ["software", "service", "physical_product", "platform", "other"],
                    "type": "string"
                  },
                  "organization_status": {
                    "enum": ["active", "inactive", "acquired", "closed", "unknown"],
                    "type": "string"
                  },
                  "positive_fit": {
                    "items": {
                      "maxLength": 500,
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "prerequisites": {
                    "description": "What a customer needs in place before using the offering.",
                    "items": {
                      "maxLength": 500,
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "pricing_model": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "pricing_visibility": {
                    "enum": ["public", "quote_required", "undisclosed", "unknown"],
