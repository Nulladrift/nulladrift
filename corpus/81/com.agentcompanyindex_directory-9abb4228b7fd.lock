{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentcompanyindex/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentcompanyindex.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "aci-public-directory",
        "title": "Agent Company Index",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Agent Company Index: a curated index of B2B software and service offerings with sourced facts, worldwide; every profile states the countries and languages it serves; coverage today is small and mostly Germany and the EU. Use search_offerings when a user looks for a provider, product or agency, then get_offering for the full record. Positive fit, negative fit and unknown states are all load-bearing: never drop a negative fit, a limitation or an information gap when summarizing. ACI publishes no scores and no paid positions. Order: search_offerings puts offerings matching more of the query's words first, then sorts by name; evaluate_situation gives each offering a group (fit, possible fit, insufficient information, excluded) and orders by more documented fit reasons, then fewer cautions, then fewer unknowns. Cite each claim with its source and checked date. A company can list itself for free with request_listing: its domain is confirmed by a code mailed to an address on that domain (or a DNS record), ACI drafts the profile from its website, and the revision the company approves — accepting the Listing Terms (https://agentcompanyindex.com/legal/listing-terms/lt-2) on its behalf, only after the user's explicit yes — is published automatically. Payment, client status and ownership by ACI's operator never change fit or order.",
      "tools": [
        {
          "name": "approve_listing",
          "title": "Approve listing draft",
          "description": "Approve publication of the exact draft revision on behalf of the company and accept the Listing Terms (LT-2, https://agentcompanyindex.com/legal/listing-terms/lt-2) for it. Requires a verified domain. Before calling: show the user the draft, then the listing_terms summary and link from get_listing_status, and ask whether they may act for the company, approve this exact revision and accept the Listing Terms on the company's behalf. Call only after an explicit yes from that person; never on your own. Pass the approver's full name, role and the company's legal name. When the domain was confirmed with a DNS record or a file, also pass approver_email (an address on the company domain the approver reads): ACI mails it a confirmation link and publication waits for it. The approved revision is then published automatically, usually within minutes; the approver gets an email record of the approval and the terms. When the domain was confirmed with the emailed code, ACI sends a free monthly report (which AI assistants and systems retrieved the profile) to that address; set monthly_report to false if the user does not want it. Every report has an unsubscribe link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accept_listing_terms": {
                "const": "LT-2",
                "description": "Set to \"LT-2\" only after the user explicitly accepted the Listing Terms (https://agentcompanyindex.com/legal/listing-terms/lt-2) on behalf of the company.",
                "type": "string"
              },
              "approver_email": {
                "description": "Required when the domain was confirmed with a DNS record or a file: an address on the company domain the approver reads. Ignored when the domain was confirmed with the emailed code (that address is recorded).",
                "maxLength": 320,
                "type": "string"
              },
              "approver_name": {
                "description": "Full name of the person approving for the company.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "approver_role": {
                "enum": ["owner", "managing_director", "authorized_representative", "other_authorized_role"],
                "type": "string"
              },
              "company_legal_name": {
                "description": "The company's legal name (e.g. from its imprint), the party accepting the Listing Terms.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "listing_token": {
                "maxLength": 200,
                "type": "string"
              },
              "monthly_report": {
                "default": true,
                "description": "Send the monthly report to the confirmed work address (default true).",
                "type": "boolean"
              },
              "reference": {
                "maxLength": 20,
                "type": "string"
              },
              "revision": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "schema_version": {
                "const": "1.0.0",
                "type": "string"
              },
              "user_confirmation": {
                "description": "Optional: the user's reply agreeing to approve and to the Listing Terms, quoted word for word.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["accept_listing_terms", "approver_name", "approver_role", "company_legal_name", "listing_token", "reference", "revision", "schema_version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Approve listing draft"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6b6dd752c58c406bb98e7daa46cc6b7890041d4b32d90fd69d754ed245c28fa1"
        },
        {
