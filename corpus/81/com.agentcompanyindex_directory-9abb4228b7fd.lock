          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse all offerings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a3fa0050dfd20e29e78fbd971ce734bed2bbc7cae10205ed66180419986114a"
        },
        {
          "name": "evaluate_situation",
          "title": "Evaluate buyer situation",
          "description": "Check a structured buyer situation (category, company size, country, requirements) against every published offering and get each offering's fit or exclusion with reasons, limitations and unknowns. Each result states its group: fit (fit_state strong_contextual_fit), possible fit (possible_fit), insufficient information (insufficient_information) or excluded (eligibility excluded, with the reason). The list is ordered by more documented fit reasons first, then fewer cautions, then fewer unknowns, then offering id; it is not sorted by group; each result carries its group fields. Payment, client status and ownership by ACI's operator are not inputs to the order. ACI publishes no scores and no paid positions. Use when the situation maps to the schema categories; for plain-language needs use search_offerings. free_text is accepted but not interpreted: only the structured fields decide fit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "schema_version": {
                "const": "1.0.0",
                "type": "string"
              },
              "situation": {
                "$id": "https://agentcompanyindex.com/schemas/match-request.schema.json",
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "additionalProperties": false,
                "description": "The buyer situation for evaluate_situation. All fields are optional; only the structured fields decide fit. It is echoed back as interpreted_situation, without free_text.",
                "properties": {
                  "budget_preference": {
                    "maxLength": 200,
                    "type": ["string", "null"]
                  },
                  "category": {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": ["string", "null"]
                  },
                  "compliance_requirements": {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "desired_next_action": {
                    "enum": ["website", "demo", "signup", "contact", "partner_intro", null],
                    "type": ["string", "null"]
                  },
                  "excluded_conditions": {
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "free_text": {
                    "description": "Accepted but not interpreted and not stored; only the structured fields decide fit.",
                    "maxLength": 2000,
                    "type": ["string", "null"]
                  },
                  "industry": {
                    "maxLength": 100,
                    "type": ["string", "null"]
                  },
                  "locale": {
                    "pattern": "^[a-z]{2,3}(-[A-Z]{2})?$",
                    "type": "string"
                  },
                  "markets": {
                    "items": {
                      "maxLength": 20,
                      "minLength": 2,
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "organization_size": {
                    "additionalProperties": false,
                    "properties": {
                      "employees": {
                        "minimum": 0,
                        "type": ["integer", "null"]
                      },
                      "size_band": {
                        "enum": ["micro", "small", "medium", "large", "enterprise", null],
                        "type": ["string", "null"]
                      }
                    },
                    "type": "object"
                  },
                  "required_capabilities": {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "required_deployment_model": {
                    "enum": ["cloud", "on_premises", "both", null],
                    "type": ["string", "null"]
                  },
                  "required_integrations": {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "required_languages": {
                    "items": {
                      "pattern": "^[a-z]{2,3}(-[A-Z]{2})?$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "unknown_policy": {
                    "default": "surface",
                    "enum": ["surface", "hide"],
                    "type": "string"
                  },
                  "workforce_context": {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "title": "Agent Company Index buyer situation",
                "type": "object"
              }
            },
            "required": ["schema_version", "situation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Evaluate buyer situation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1a8f3b9ddcb115e6183d18f37e50757a4aab8515739bdfe6239abb1e6c003fd6"
        },
        {
          "name": "get_listing_status",
          "title": "Get listing status",
          "description": "Read the state of a listing request and what to do next: the domain-proof options, the prepared draft with its revision digest (facts, which of them are company statements, what ACI checked itself, open questions), the Listing Terms the company accepts with its approval (listing_terms: version, url, sha256, summary), or the public URL once published (also while an update of it is being prepared). While ACI itself is working the answer carries poll_after_seconds: wait that long before asking again. Show the user the draft and the Listing Terms summary with its link before asking for approval.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "listing_token": {
                "maxLength": 200,
                "type": "string"
              },
              "reference": {
                "maxLength": 20,
                "type": "string"
              },
              "schema_version": {
                "const": "1.0.0",
                "type": "string"
              }
            },
            "required": ["listing_token", "reference", "schema_version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get listing status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3792b0aa094066ce00909656499e0150ced683421e0130020383e2a1c3c7a565"
        },
