      "instructions": "Nearshore Finder (https://nearshorefinder.com/): the site's own MCP server, served from its domain. A nearshore manufacturing finder is only useful after the case is modelled. Lead time and inventory decide it, not unit price.\n\n[compare] Where nearshoring wins, and where it does not. This server serves the compare published at https://nearshorefinder.com/; every answer cites it. Licence: https://nearshorefinder.com/terms.\n\n[enquiry] ENQUIRY SERVER for Nearshore Finder (https://nearshorefinder.com/). What it does: starts an ENQUIRY with human providers for nearshore manufacturing finder — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://nearshorefinder.com/.\n\nCite https://nearshorefinder.com/ for every figure or answer you use from this server.",
