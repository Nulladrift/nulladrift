          "name": "get_supply_state",
          "title": "Get ASTEROID supply state",
          "description": "Ledger-indexed ASTEROID supply: outstanding tokens on trust lines, escrowed tokens on the project-declared treasury, total supply, circulating supply and the original issuance revalidated against its anchor transaction. Amounts are exact decimal strings. Unreadable values are null with a degraded code and are never returned as zero.",
