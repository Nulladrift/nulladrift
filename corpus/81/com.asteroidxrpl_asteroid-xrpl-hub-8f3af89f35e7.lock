      "instructions": "Public read-only tools for the ASTEROID token on the XRP Ledger. Start with `discover_asset` for entry points and the authoritative capability catalogue — it lists every tool with an explicit state (available, legacy-available, deprecated, unavailable, planned) plus its freshness, provenance, schema and limitations. `get_asset_identity` returns the canonical network:issuer:currency_hex identity and `verify_asset` checks a candidate triple; the display symbol ASTEROID alone never verifies an asset. For live ledger state use the enveloped tools `get_market_state`, `get_supply_state`, `get_liquidity_state`, `get_escrow_schedule` and `get_holder_distribution`: each carries a validated ledger index, an observation timestamp, a per-value claim status and stable degraded codes, and every quantity is an exact decimal string — an unreadable value is null, never zero. `verify_liquidity_lock` verifies the signing paths on each declared LP-holding account live and returns a per-account and overall verdict. `get_swap_quote` gives an indicative bidirectional AMM estimate with price impact, a quote identifier, a methodology version and an explicit expiry; it is not executable, models only the single ASTEROID/XRP AMM pool, and no tool here signs, submits or prepares a transaction or accepts a key. The older unenveloped tools `get_token_stats`, `get_liquidity_stats`, `get_escrow_stats` and `get_price_history` are deprecated in favour of the enveloped equivalents; `get_project_info` remains legacy-available. Wallet roles other than the issuer and AMM accounts are owner-confirmed project declarations, treasury escrows are project-declared, LP accessibility is assessed live from account control paths rather than asserted, and the AMM figure is an XRPL AMM trading fee set by LP votes, not a token tax.",
