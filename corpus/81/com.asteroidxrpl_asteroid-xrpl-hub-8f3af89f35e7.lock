        {
          "name": "get_swap_quote",
          "title": "Get an indicative ASTEROID/XRP AMM estimate",
          "description": "Indicative bidirectional estimate against the live ASTEROID/XRP AMM pool, in either direction and for an exact input or an exact output. Returns the amount in and out, the pool fee taken, spot and effective price, price impact, pool utilisation and optional slippage bounds, all as exact decimal strings at a stated validated ledger index. INDICATIVE ONLY: it is not executable, it models only the single AMM pool (no order books, no path-finding, no network or transfer fees), and this service never signs, submits or prepares a transaction and never accepts a key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Positive exact decimal string, in units of the asset implied by `side`.",
                "minLength": 1,
                "type": "string"
              },
              "direction": {
                "description": "Which asset is paid in and which is received.",
                "enum": ["xrp-to-asteroid", "asteroid-to-xrp"],
                "type": "string"
              },
              "side": {
                "default": "exact-in",
                "description": "Whether `amount` is the exact input paid or the exact output required.",
                "enum": ["exact-in", "exact-out"],
                "type": "string"
              },
              "slippageTolerancePct": {
                "description": "Optional tolerance between 0 and 50, used only to derive a bound.",
                "type": "string"
              }
            },
            "required": ["amount", "direction"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0dde2d9a0748e3b5985aa637e1a9e4f8f777005be6ce7aeec4035df5b3e8aa70"
        },
