        {
          "name": "get_liquidity_stats",
          "title": "Get ASTEROID liquidity stats",
          "description": "Deprecated — use get_liquidity_state, which is enveloped and assesses LP accessibility live from account control paths. Current ASTEROID/XRP AMM pool data: pooled XRP and ASTEROID, LP token supply, the XRPL AMM trading fee as `tradingFeeUnits` (raw XRPL TradingFee, in units of 1/100,000 — 502 units = 0.502% = 50.2 basis points) with `tradingFeePct` giving the same fee as a percentage (the legacy `tradingFeeBps` field is misnamed and carries the same raw units, not basis points), and the split between LP tokens held by project-declared locked accounts and the rest of the community. The XRPL AMM trading fee is a protocol pool fee set by LP votes — it is not a token tax and can change at any time. This is not a quote and must not be used to price a swap.",
