        {
          "name": "verify_asset",
          "title": "Verify an ASTEROID asset identity",
          "description": "Compares a candidate network, issuer and currency code against the canonical ASTEROID identity and returns a field-by-field result. The display symbol ASTEROID alone is never sufficient verification.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "currencyCode": {
                "description": "Currency code to check — the exact 160-bit hex code. Required for a match.",
                "type": "string"
              },
              "issuer": {
                "description": "XRPL issuer address to check. Required for a match.",
                "type": "string"
              },
              "network": {
                "description": "Network identifier to check, e.g. \"xrpl-mainnet\". Required for a match.",
                "type": "string"
              }
            },
            "required": ["currencyCode", "issuer", "network"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
