      "serverInfo": {
        "name": "apify-mcp-server",
        "title": "Apify MCP Server",
        "version": "0.21.5",
        "description": "Extract data from any website with thousands of scrapers, crawlers, and automations on Apify Store ⚡",
        "websiteUrl": "https://mcp.apify.com"
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {}
