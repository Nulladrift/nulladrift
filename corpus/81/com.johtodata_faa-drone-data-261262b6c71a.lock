      "instructions": "\nApify is the world's largest marketplace of tools for web scraping, data extraction, and web automation.\nThese tools are called **Actors**. They enable you to extract structured data from social media, e-commerce, search engines, maps, travel sites, and many other sources.\n\n## Actor\n- An Actor is a serverless cloud application running on the Apify platform.\n- Use the Actor's **README** to understand its capabilities.\n- Before running an Actor, always check its **input schema** to understand the required parameters.\n\n## Actor discovery and selection\n- Choose the most appropriate Actor based on the conversation context.\n- Search the Apify Store first; a relevant Actor likely already exists.\n- When multiple options exist, prefer Actors with higher usage, ratings, or popularity.\n- Apify Store lists Actors published by Apify and by independent developers.\n\n## Actor execution workflow\n- Actors take input and produce output.\n- Every Actor run generates **dataset** and **key-value store** outputs (even if empty).\n- Actor execution may take time, and outputs can be large.\n- Large datasets can be paginated to retrieve results efficiently.\n\n## Storage types\n- **Dataset:** Structured, append-only storage ideal for tabular or list data (e.g., scraped items).\n- **Key-value store:** Flexible storage for unstructured data or auxiliary files.\n- Unnamed storages are deleted after the account's data-retention period; named storages are kept until deleted.\n\n## Apify API resources\n- Any Apify API GET endpoint can be read as an MCP resource. Pass the full `https://api.apify.com/v2/...` URL to `resources/read`; the server injects the session's Apify token and returns the response body. Reads require an Apify token — a session without one (e.g. payment-only x402/Skyfire) fails with a JSON-RPC error.\n- Actor and tool results return storage IDs, not resource URLs — build the URL from the ID (e.g. a `datasetId` becomes `https://api.apify.com/v2/datasets/{datasetId}/items`) and read it via `resources/read`.\n- Reads inline up to ~256 KB; a larger response is not downloaded — it returns a short notice with a download URL instead of the body, so page large datasets/lists with `limit` and `offset` to stay under the cap.\n- Examples: `https://api.apify.com/v2/datasets/{datasetId}/items?clean=true&format=json&limit=100`, `https://api.apify.com/v2/key-value-stores/{storeId}/records/{recordKey}`. `resources/templates/list` enumerates the common shapes with their paging parameters.\n",
      "resourceTemplates": [
        {
          "uriTemplate": "https://api.apify.com/v2/actor-runs/{runId}",
          "name": "actor-run",
          "description": "Metadata of an Actor run: status, storage IDs, usage.",
          "mimeType": "application/json",
          "digest": "sha256:535b403daa1c24dda816572a170db1708cde6aba8fb0781a7a1e7c2cb5560491"
        },
        {
          "uriTemplate": "https://api.apify.com/v2/logs/{runId}",
          "name": "actor-run-log",
          "description": "Log of an Actor run. Inlines up to 256 KB, larger returns a download URL.",
          "mimeType": "text/plain",
          "digest": "sha256:27c5e534847348192303c96b2d91b260a1266cac114b9772c54cd5f9ef3da150"
        },
        {
          "uriTemplate": "https://api.apify.com/v2/datasets/{datasetId}/items{?limit,offset,clean,fields,format}",
          "name": "dataset-items",
          "description": "Items of a dataset, read via resources/read (the server injects the Apify token). Page with limit/offset; format defaults to JSON — responses inline up to 256 KB, larger ones return a download URL.",
          "digest": "sha256:723a69712418480a13ca28a5269afc54b7b1ad761c335cce365980efc84df7c0"
        },
        {
          "uriTemplate": "https://api.apify.com/v2/key-value-stores/{storeId}/keys{?limit,exclusiveStartKey}",
          "name": "key-value-store-keys",
          "description": "Keys of a key-value store. Page with limit/exclusiveStartKey (not offset).",
          "mimeType": "application/json",
          "digest": "sha256:5ad8173f8f534e63926f94a952ae037cac55193f34ca9339b4130d9384784a3a"
        },
        {
          "uriTemplate": "https://api.apify.com/v2/key-value-stores/{storeId}/records/{recordKey}",
          "name": "key-value-store-record",
          "description": "A single record, returned whole in its stored Content-Type via resources/read. Not pageable — a record over 256 KB returns a download URL instead.",
          "digest": "sha256:61857756ab48f9ae77f22a702b75eb362e66b6fa19b958af13fdf6bb63690cbd"
        }
      ],
      "digest": "sha256:06d130c5ec70c9dac33814fa81130e9e74dd222f7c81f0543336a7346f25c3d6"
    }
  }
