      "instructions": "Fine Tuning Cost Calculator (https://finetuningcostcalculator.com/): the site's own MCP server, served from its domain. Fine tuning cost calculator: price a fine-tuning run from GPUs, hours and an hourly rate a GPU cloud publishes, with every default rate traced to a price page.\n\n[calculator] Fine-tuning run cost: an agent-callable calculator for fine tuning cost calculator; GPU hours billed, Estimated run cost, computed from your inputs with sources.. This server runs the Fine-tuning run cost calculator published at https://finetuningcostcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://finetuningcostcalculator.com/. Licence: https://finetuningcostcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Fine Tuning Cost Calculator (https://finetuningcostcalculator.com/). What it does: starts an ENQUIRY with Fine Tuning Cost Calculator for fine tuning cost calculator; the Fine Tuning Cost Calculator team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Fine Tuning Cost Calculator team until they click it. Cite https://finetuningcostcalculator.com/.\n\nCite https://finetuningcostcalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Fine-tuning run cost",
          "description": "Run the Fine-tuning run cost calculator: GPU hours billed; Estimated run cost. Missing inputs fall back to their documented defaults.",
