{
  "lockfileVersion": 2,
  "subjects": {
    "ai.wondel/ceneo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.wondel.ai/ceneo/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Ceneo",
        "title": "Ceneo MCP",
        "version": "1.0.0",
        "description": "Price comparison on Ceneo.pl: search products, list every shop's offer, fetch product details.",
        "websiteUrl": "https://mcps.wondel.ai/servers/ceneo/",
        "icons": [
          {
            "src": "https://mcps.wondel.ai/favicon.svg",
            "mimeType": "image/svg+xml"
          },
          {
            "src": "https://mcps.wondel.ai/logo-96-inverse.png",
            "mimeType": "image/png",
            "sizes": ["96x96"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from Ceneo.pl (https://www.ceneo.pl) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "ceneo_product",
          "title": "Get a Ceneo product",
          "description": "Product details from Ceneo: name, images, description, brand, price range, offer count and rating. Fetched live from Ceneo.pl (a few seconds via direct fetch; up to ~20s when routed through an unblocker backend).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "productId": {
                "description": "Ceneo product id (digits) or full product URL",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["productId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:08cc7c7db293b3d8e26c69f2607d0b98effbc3a22c37fd7c47f3596a923e64e2"
        },
        {
          "name": "ceneo_product_offers",
          "title": "Compare shop offers for a Ceneo product",
          "description": "Given a Ceneo product id, return EVERY shop's offer (shop, price, link) sorted cheapest-first — the price comparison. Get the id from ceneo_search. Fetched live from Ceneo.pl (a few seconds via direct fetch; up to ~20s when routed through an unblocker backend).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "productId": {
                "description": "Ceneo product id (digits) or full https://www.ceneo.pl/<id> URL",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["productId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:924c7c1346edb4951fd0ec2ba8880176e313013ce9fa7c350bab7f53d615cb37"
        },
        {
          "name": "ceneo_search",
          "title": "Search Ceneo products",
          "description": "Search Ceneo.pl (Poland's price-comparison engine) by phrase. Returns each product's lowest price and how many shops offer it, plus its Ceneo product id (use it with ceneo_product_offers). Fetched live from Ceneo.pl (a few seconds via direct fetch; up to ~20s when routed through an unblocker backend). Result shape: { source, fetchedAt, query, count, products: [...], note? } — the list key is `products`, and there are no per-shop offers here (call ceneo_product_offers with a product `id` for those). Each product: { id, name, url, lowestPrice, currency, shopCount, image }; `lowestPrice` is the formatted string Ceneo renders, not a number. A genuine no-match answers count: 0 with a `note` saying what to try instead — that is a successful result, not an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max products to return (default 24)",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "phrase": {
                "description": "Search text, e.g. 'iphone 15 128gb'",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["phrase"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "count": {
                "type": "number"
              },
              "fetchedAt": {
                "type": "string"
              },
              "note": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "products": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "currency": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "image": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "lowestPrice": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "name": {
                      "type": "string"
                    },
                    "shopCount": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["currency", "id", "name", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["count", "fetchedAt", "products", "query", "source"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9824b300bf6709cc60c20cac24e476dd5dbf13a89f59efc7216681a2018a1612"
        }
      ],
      "digest": "sha256:fcd4ca85d11d405cd48f0bb5cf2e1ddc53b58d2e87c0052f2c5dc2c4ff082366"
    }
  }
}
