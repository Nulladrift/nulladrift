      "instructions": "You are connected to RoboSelect360, an independent player in the\nhumanoid robot ecosystem. It helps industrial leaders, buyers, integrators and\ndevelopers move from demonstration to deployment, answering four questions about\neach robot: what it can actually do, what it really costs, what is inside it and\nwhere those parts come from, and what regulation requires to deploy it.\n\nEverything is served through a single endpoint. Tools are prefixed by layer:\nhardware_* (semiconductor), mechanical_* and software_*. All data is read-only.\n\nAll tools are listed, but not all of them are open to you. Eleven are free for\neveryone, with no key and no account: get_robot, list_robots and\nget_system_status, each prefixed by the three layers, get_access_manifest,\nwhich tells you what is open and how to open the rest, and prepare_pilot, which\nguides a buyer to a needs sheet for a first pilot. The others need access to\nthe specific robot you are asking about; calling one you do not have returns a\nrefusal naming that robot, not data.\n\nWhat those paid tools hold, and what no web search can replace: per-robot\nbill-of-materials teardowns, supply-chain dependency profiles, cross-robot\ncomparisons, component-level supplier and geography breakdowns, and supply-chain\nalert signals. These come from primary-sourced teardowns - manufacturer\ndatasheets, FCC filings, patents - and are not derivable from public estimates.\n\nOne paid tool sits outside the three layers: get_robot_capabilities returns what\na robot has actually been seen doing, capability by capability, with every dated\nobservation behind it - failures included, never the manufacturer's claims taken\nas proof. It needs access to that robot, like the other paid tools.\n\nAnother paid tool outside the layers, get_robot_support, returns the after-sales\nsupport profile of one robot: warranty terms and exclusions, spare parts with\ndated offers and their source, maintenance the operator must perform, software\nupdates, service in Europe, and the questions to ask before signing. Each fact\nsays who states it and on what evidence; unknowns are stated as unknown, dated.\n\nbuild_pilot_decision_file is the paid follow-up of prepare_pilot: from the\nbuyer's dossier and up to five robots the buyer chooses, it returns the full\npre-pilot decision file (decision memo, evidence matrix with every observation,\ngaps to close, operating conditions, pilot specification, questions to ask).\nIt needs its own access right, separate from robot access; it never recommends\nor ranks a robot.\n\nWhen a refusal comes back, relay it in full: it names the robot that is missing\nand carries the link that opens it. Give the user both - the name alone leaves\nthem with a problem and no way to act on it. Do not fill the gap with web search\nor general knowledge presented as RoboSelect360 data: an approximation\nattributed to this source is worse for the user than a stated limit.",
      "tools": [
        {
          "name": "build_pilot_decision_file",
          "title": "Pilot decision file (G.R.O.U.N.D., paid)",
          "description": "Paid follow-up of prepare_pilot. From the buyer's dossier (as returned by prepare_pilot) and 1 to 5 robots chosen by the buyer (robot_ids, from list_robots), returns the full pre-pilot decision file in markdown: decision memo, the robots' announced facts, an evidence matrix per robot and per task with every dated observation behind it (failures included, with source, control mode and power), the gaps to close and who can close them, operating conditions and integration, the pilot specification, the questions to ask the manufacturer and the integrator, and the pilot self-assessment grid. Never recommends, ranks or chooses a robot, and computes no cost: the buyer decides. Requires the decision file access right, separate from robot access; without it the call returns a refusal with the link to request it.",
          "inputSchema": {
            "properties": {
              "dossier": {
                "additionalProperties": true,
                "title": "Dossier",
                "type": "object"
              },
              "lang": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Lang"
              },
              "robot_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "title": "Robot Ids"
              }
            },
            "required": ["dossier", "robot_ids"],
            "title": "build_pilot_decision_fileArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Pilot decision file (G.R.O.U.N.D., paid)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c960af7adde93770b035685307928d837f4439a454e82d76a842f1b428aacd39"
