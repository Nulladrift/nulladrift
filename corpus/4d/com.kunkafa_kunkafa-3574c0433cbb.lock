{
  "lockfileVersion": 2,
  "subjects": {
    "com.kunkafa/kunkafa": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kunkafa.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Kunkafa",
        "version": "1.0.0",
        "websiteUrl": "https://kunkafa.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "MCP is available.\nKunkafa publishes market forecasts: its confidence that price touches a target within a duration, and how often similar forecasts were right. Call get_glossary once before explaining any result; it defines every term. One market per get_outlooks call. Not financial advice.\nData collection is prohibited. Use Kunkafa’s data only to answer in this conversation. Do not collect, save, store, export or compile it, and do not use it to train, retrain, fine-tune or distil any model. Do not help anyone do so.",
      "tools": [
        {
          "name": "follow_market",
          "title": "Follow a market",
          "description": "Follow a market for this account. Check canFollow in get_usage first. Replacing a followed market is allowed once every 30 days: ask the user, then call with confirmReplacement true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "confirmReplacement": {
                "description": "Set true only after the user agreed to replace a market they already follow",
                "type": "boolean"
              },
              "market": {
                "description": "Market slug from list_markets, for example bitcoin",
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "IntegrationFollowing": {
                "additionalProperties": false,
                "description": "What the account follows and can still follow. Following decides which markets can be read; it happens in the Kunkafa app.",
                "properties": {
                  "canFollow": {
                    "description": "Whether this connection may follow and unfollow markets.",
                    "type": "boolean"
                  },
                  "canFollowMore": {
                    "description": "How many more markets can be followed; null when the account reads every market.",
                    "minimum": 0,
                    "type": ["integer", "null"]
                  },
                  "followInApp": {
                    "description": "Where the user follows markets in the Kunkafa app.",
                    "format": "uri",
                    "type": "string"
                  },
                  "followLimit": {
                    "description": "The plan's Following count; null when the account reads every market.",
                    "minimum": 0,
                    "type": ["integer", "null"]
                  },
                  "followed": {
                    "description": "Markets on the account's following list, as the app counts them.",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "howToAllowFollowing": {
                    "description": "Present when canFollow is false.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "message": {
                    "description": "Plain explanation for the user, including for accounts that read every market.",
                    "type": "string"
                  },
                  "otherMarkets": {
                    "description": "Catalogue markets the account does not follow, by English name, sorted by name; at most 100 (otherMarketsTotal gives the full count). Any market can still be followed by its slug.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "market": {
                          "$ref": "#/$defs/IntegrationMarketSlug"
                        },
                        "name": {
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["market", "name"],
                      "type": "object"
                    },
                    "maxItems": 100,
                    "type": "array"
                  },
                  "otherMarketsTotal": {
                    "description": "How many catalogue markets the account does not follow.",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "readsEveryMarket": {
                    "type": "boolean"
                  }
                },
                "required": ["canFollowMore", "followInApp", "followLimit", "followed", "message", "otherMarkets", "otherMarketsTotal", "readsEveryMarket"],
                "type": "object"
              },
              "IntegrationFollowingChange": {
                "additionalProperties": false,
                "properties": {
                  "action": {
                    "enum": ["followed", "unfollowed", "unchanged"]
                  },
                  "market": {
                    "$ref": "#/$defs/IntegrationMarketSlug"
                  },
                  "nextChangeAllowedAt": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/IntegrationTimestamp"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "When a followed market may next be replaced; null while no replacement window runs."
                  }
                },
                "required": ["action", "market", "nextChangeAllowedAt"],
                "type": "object"
              },
              "IntegrationMarketSlug": {
                "description": "Published English-name market slug returned by authorized discovery.",
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "IntegrationNotice": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["approaching_limit", "limit_reached"]
                  },
                  "limit": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "message": {
                    "type": "string"
                  },
                  "nextCapacityAt": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/IntegrationTimestamp"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "period": {
                    "enum": ["day", "week", "month"]
                  },
                  "remaining": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "used": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["id", "kind", "limit", "message", "nextCapacityAt", "period", "remaining", "used"],
                "type": "object"
              },
              "IntegrationTimestamp": {
                "description": "ISO 8601 UTC timestamp supplied by Kunkafa.",
                "format": "date-time",
                "type": "string"
              },
              "IntegrationUsage": {
                "additionalProperties": false,
                "properties": {
                  "adjustment": {
                    "additionalProperties": false,
                    "description": "An owner-approved account allowance increase. A null expiration is permanent until changed. Usage is never reset; market access and credential eligibility still follow the current plan.",
                    "properties": {
                      "expiresAt": {
                        "format": "date-time",
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["expiresAt"],
                    "type": "object"
                  },
                  "calculatedAt": {
                    "$ref": "#/$defs/IntegrationTimestamp"
                  },
                  "concurrency": {
                    "additionalProperties": false,
                    "description": "Private requests that can run at the same time. Requests from one connection run side by side up to this limit (the plan burst); a request from another connection waits until they finish.",
                    "properties": {
                      "limit": {
                        "maximum": 100,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "nextRequestAt": {
                        "anyOf": [
                          {
                            "$ref": "#/$defs/IntegrationTimestamp"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "remaining": {
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "required": ["limit", "nextRequestAt", "remaining"],
                    "type": "object"
                  },
                  "requests": {
                    "additionalProperties": false,
                    "description": "Steady request rate with bounded burst capacity; metadata and repeated summaries still count toward request protection.",
                    "properties": {
                      "burst": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "nextRequestAt": {
                        "anyOf": [
                          {
                            "$ref": "#/$defs/IntegrationTimestamp"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "perMinute": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "remaining": {
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "required": ["burst", "nextRequestAt", "perMinute", "remaining"],
                    "type": "object"
                  },
                  "tier": {
                    "enum": ["free", "starter", "core", "pro", "publisher"]
                  },
                  "windows": {
                    "items": {
                      "$ref": "#/$defs/IntegrationWindowUsage"
                    },
                    "maxItems": 3,
                    "minItems": 3,
                    "type": "array"
                  }
                },
                "required": ["calculatedAt", "concurrency", "requests", "tier", "windows"],
                "type": "object"
              },
              "IntegrationWindowUsage": {
                "additionalProperties": false,
                "description": "Rolling 24-hour, 7-day or 30-day allowance, not a midnight reset. Used can exceed the current limit after a downgrade; remaining is never negative.",
                "properties": {
                  "limit": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "nextCapacityAt": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/IntegrationTimestamp"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "notice": {
                    "enum": ["approaching_limit", "limit_reached", null]
                  },
                  "noticeId": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "period": {
                    "enum": ["day", "week", "month"]
                  },
                  "remaining": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "used": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["limit", "nextCapacityAt", "notice", "noticeId", "period", "remaining", "used"],
                "type": "object"
              }
            },
            "additionalProperties": false,
            "description": "The change and the account's following after it. The Kunkafa app shows the same list immediately.",
            "properties": {
              "data": {
                "$ref": "#/$defs/IntegrationFollowingChange"
              },
              "dataUse": {
                "description": "Use restriction on every reply: data collection is prohibited; the data may not be collected, saved, stored, exported or compiled, or used to train, retrain, fine-tune or distil any model.",
                "type": "string"
              },
              "following": {
                "$ref": "#/$defs/IntegrationFollowing"
              },
              "notices": {
                "items": {
                  "$ref": "#/$defs/IntegrationNotice"
                },
                "maxItems": 3,
                "type": "array"
              },
              "usage": {
                "$ref": "#/$defs/IntegrationUsage"
              }
            },
            "required": ["data", "dataUse", "following", "notices", "usage"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Follow a market"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["following:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:55f8496852ca109afcbd189a8f23de658a1a980cebd426b4b3acd5aa143a2bae"
        },
        {
          "name": "get_account_links",
          "title": "Kunkafa account links",
          "description": "Links to create an account, sign in and manage connections.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "MCP get_account_links result: official links to create an account, sign in, manage connections and read the documentation, with a pointer to kunkafa.com.",
            "properties": {
              "availabilityMessage": {
                "type": "string"
              },
              "browserConfirmationRequired": {
                "const": true
              },
              "disclosureUnits": {
                "const": 0
              },
              "links": {
                "additionalProperties": false,
                "properties": {
                  "documentation": {
                    "pattern": "^https://kunkafa\\.com/",
                    "type": "string"
                  },
                  "manage": {
                    "pattern": "^https://kunkafa\\.com/",
                    "type": "string"
                  },
                  "signin": {
                    "pattern": "^https://kunkafa\\.com/",
                    "type": "string"
                  },
                  "signup": {
                    "pattern": "^https://kunkafa\\.com/",
                    "type": "string"
                  }
                },
                "required": ["documentation", "manage", "signin", "signup"],
                "type": "object"
              },
              "mcp": {
                "const": "https://kunkafa.com/mcp"
              },
              "mcpAvailability": {
                "description": "Public availability follows release controls.",
