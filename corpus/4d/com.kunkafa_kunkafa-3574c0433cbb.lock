          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:c149c41d131aceedd5a87d801cfe08411ebf4d850b3bf4a5650a5d66feac2cf8"
        },
        {
          "name": "get_glossary",
          "title": "Glossary",
          "description": "What every Kunkafa term and number means and how to read them. Call once before explaining results. No sign-in needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "What every term in Kunkafa replies means and how to read them. Public, static, English.",
            "properties": {
              "glossary": {
                "additionalProperties": false,
                "properties": {
                  "terms": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "fields": {
                          "description": "Reply fields the term explains.",
                          "type": "string"
                        },
                        "meaning": {
                          "type": "string"
                        },
                        "term": {
                          "type": "string"
                        }
                      },
                      "required": ["meaning", "term"],
                      "type": "object"
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": ["terms", "title"],
                "type": "object"
              }
            },
            "required": ["glossary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Glossary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:6ec561e6b7059bce461dd17b12335f34f530e867b986b33cae0506a912c9da40"
        },
        {
          "name": "get_outlooks",
          "title": "Current forecasts",
          "description": "Current forecasts for one market; one market per call by design, so data is not pulled in bulk. Choose durations (exact or a range) and optionally direction, confidence or target filters. At most 6 durations and 72 forecasts per call; calls can run in parallel.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "direction": {
                "description": "Default both",
                "enum": ["up", "down", "both"],
                "type": "string"
              },
              "durations": {
                "description": "Exact duration labels from list_markets, for example [\"1 hour\", \"6 hours\"]",
                "items": {
                  "maxLength": 24,
                  "minLength": 2,
                  "pattern": "^\\d{1,5}\\s*[A-Za-z]{1,8}$",
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "market": {
                "description": "Market slug from list_markets, for example bitcoin",
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "maxDuration": {
                "description": "Longest duration to include, for example \"1 day\"",
                "maxLength": 24,
                "minLength": 2,
                "pattern": "^\\d{1,5}\\s*[A-Za-z]{1,8}$",
                "type": "string"
              },
              "maxDurationExclusive": {
                "description": "true for \"less than maxDuration\"; default includes maxDuration",
                "type": "boolean"
              },
              "maxProbabilityPercent": {
                "description": "Only forecasts whose probability is at most this",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "maxTargetPercent": {
                "description": "Only targets at most this far from the reference price, in percent",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "minDuration": {
                "description": "Shortest duration to include, for example \"1 hour\"",
                "maxLength": 24,
                "minLength": 2,
                "pattern": "^\\d{1,5}\\s*[A-Za-z]{1,8}$",
                "type": "string"
              },
              "minProbabilityPercent": {
                "description": "Only forecasts whose probability (Kunkafa's confidence) is at least this",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "minTargetPercent": {
                "description": "Only targets at least this far from the reference price, in percent",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "IntegrationMarketSlug": {
                "description": "Published English-name market slug returned by authorized discovery.",
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "IntegrationNotice": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["approaching_limit", "limit_reached"]
                  },
                  "limit": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "message": {
                    "type": "string"
                  },
                  "nextCapacityAt": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/IntegrationTimestamp"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "period": {
                    "enum": ["day", "week", "month"]
                  },
                  "remaining": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "used": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["id", "kind", "limit", "message", "nextCapacityAt", "period", "remaining", "used"],
                "type": "object"
              },
              "IntegrationOutlookFieldGuide": {
                "additionalProperties": false,
                "properties": {
                  "counts": {
                    "type": "string"
                  },
                  "forecastAt": {
                    "type": "string"
                  },
                  "interpretation": {
                    "type": "string"
                  },
                  "label": {
                    "type": "string"
                  },
                  "more": {
                    "type": "string"
                  },
                  "movePercent": {
                    "type": "string"
                  },
                  "probabilityPercent": {
                    "type": "string"
                  },
                  "referencePrice": {
                    "type": "string"
                  },
                  "sourceAt": {
                    "type": "string"
                  },
                  "withoutForecasts": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["counts", "forecastAt", "interpretation", "label", "more", "movePercent", "probabilityPercent", "referencePrice", "sourceAt"],
                "type": "object"
              },
              "IntegrationOutlookSelection": {
                "additionalProperties": false,
                "description": "The requested selection of one market's current forecasts. Historical performance and selected past results are read with their own operations.",
                "properties": {
                  "availableDurations": {
                    "description": "Durations of this market that have forecasts now; a duration with none is left out.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 40,
                    "type": "array"
                  },
                  "counts": {
                    "additionalProperties": false,
                    "properties": {
                      "forecasts": {
                        "maximum": 72,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "withoutProbability": {
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "required": ["forecasts", "withoutProbability"],
                    "type": "object"
                  },
                  "forecasts": {
                    "items": {
                      "$ref": "#/$defs/IntegrationSelectedSource"
                    },
                    "type": "array"
                  },
                  "market": {
                    "$ref": "#/$defs/IntegrationMarketSlug"
                  },
                  "name": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "selection": {
                    "additionalProperties": false,
                    "properties": {
                      "direction": {
                        "enum": ["up", "down", "both"]
                      },
                      "durations": {
                        "items": {
                          "type": "string"
                        },
                        "maxItems": 6,
                        "minItems": 1,
                        "type": "array"
                      },
                      "maxProbabilityPercent": {
                        "type": "number"
                      },
                      "maxTargetPercent": {
                        "type": ["number", "null"]
                      },
                      "minProbabilityPercent": {
                        "type": "number"
                      },
                      "minTargetPercent": {
                        "type": "number"
                      }
                    },
                    "required": ["direction", "durations", "maxProbabilityPercent", "maxTargetPercent", "minProbabilityPercent", "minTargetPercent"],
                    "type": "object"
                  },
                  "sourceAt": {
                    "$ref": "#/$defs/IntegrationTimestamp"
                  },
                  "url": {
                    "format": "uri",
                    "pattern": "^https://kunkafa\\.com/markets/[a-z0-9-]+/$",
                    "type": "string"
                  },
                  "withoutForecasts": {
                    "description": "Asked-for durations with no forecasts: none_now (none at the moment) or no_match (none match the filters). Left out when every duration has forecasts.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "duration": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "reason": {
                          "enum": ["none_now", "no_match"]
                        }
                      },
                      "required": ["duration", "reason"],
                      "type": "object"
                    },
                    "maxItems": 40,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["availableDurations", "counts", "forecasts", "market", "name", "selection", "sourceAt", "url"],
                "type": "object"
              },
              "IntegrationSelectedOutput": {
                "additionalProperties": false,
                "description": "One target-touch forecast. probabilityPercent is Kunkafa's confidence; outputs without one are counted in counts.withoutProbability, not listed.",
                "properties": {
                  "direction": {
                    "enum": ["up", "down"]
                  },
                  "movePercent": {
                    "type": "number"
                  },
                  "probabilityPercent": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["direction", "movePercent", "probabilityPercent"],
                "type": "object"
              },
              "IntegrationSelectedSource": {
                "additionalProperties": false,
                "description": "A source group within the selection; several can share a duration. Only groups with forecasts are listed; forecastAt is left out when unknown.",
                "properties": {
                  "duration": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "forecastAt": {
                    "$ref": "#/$defs/IntegrationTimestamp"
                  },
                  "label": {
                    "description": "Names the source within its duration (A, B, C…): forecasts made together. Sources are read side by side, never merged.",
                    "pattern": "^[A-Z]$",
                    "type": "string"
                  },
                  "outputs": {
                    "items": {
                      "$ref": "#/$defs/IntegrationSelectedOutput"
                    },
                    "maxItems": 72,
                    "minItems": 1,
                    "type": "array"
                  },
                  "referencePrice": {
