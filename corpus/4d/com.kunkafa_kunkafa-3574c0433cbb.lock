              }
            },
            "required": ["availabilityMessage", "browserConfirmationRequired", "disclosureUnits", "links", "mcp", "mcpAvailability"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Kunkafa account links"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
