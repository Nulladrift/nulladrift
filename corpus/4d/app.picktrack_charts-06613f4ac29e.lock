      "serverInfo": {
        "name": "picktrack",
        "title": "PickTrack",
        "version": "1.0.0",
        "websiteUrl": "https://picktrack.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PickTrack (picktrack.app) publishes monthly music charts for DJs, ranked by organic listener engagement on SoundCloud (no label deals, no paid placement), with BPM and Camelot key for every track. 16 genres, mostly electronic (House, Tech House, Afro House, Amapiano, Melodic Techno, Drum & Bass, UK Garage…).\nUse these tools when the user asks what's popular or new in a dance-music genre, wants track ideas for a DJ set, asks a track's BPM/key, or wants tracks that mix harmonically with a given key and tempo.\nResults show the Top 3 of each chart with full details and the BPM/key of the next ranks; the complete chart is on picktrack.app. Include the chart link when you show results so the user can open the full list.",
      "tools": [
        {
          "name": "find_compatible_tracks",
          "title": "Find harmonically compatible tracks",
          "description": "Chart tracks that mix harmonically with a given Camelot key (same key, ±1 on the wheel, or relative major/minor) and a similar BPM — for building a DJ set.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bpm": {
                "description": "Tempo of the current track.",
                "maximum": 200,
                "minimum": 60,
                "type": "number"
              },
              "bpm_range": {
                "description": "Allowed BPM difference (default 3).",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "camelot": {
                "description": "Camelot key of the current track, e.g. 8A.",
                "pattern": "^(1[0-2]|[1-9])[ABab]$",
                "type": "string"
              },
              "genre": {
                "description": "Optional: only this genre. Chart genre slug. house = House; tech_house = Tech House; deep_house = Deep House; afro_house = Afro House; melodic_techno = Melodic Techno; techno = Melodic House / Rave / Techno; indie_dance = Indie Dance; amapiano = Amapiano; drum_and_bass = Drum & Bass; uk_garage = UK Garage / Speed Garage; dubstep = Dubstep; rnb = R&B; regional = Arabic Afro House; kpop = K-Pop; psy_trance = Psy-Trance; lo_fi = Lo-Fi / Chill Hop; top50 = Top 50 (all genres)",
                "enum": ["house", "tech_house", "deep_house", "afro_house", "melodic_techno", "techno", "indie_dance", "amapiano", "drum_and_bass", "uk_garage", "dubstep", "rnb", "regional", "kpop", "psy_trance", "lo_fi", "top50"],
                "type": "string"
              }
            },
            "required": ["bpm", "camelot"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find harmonically compatible tracks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1929b734bbe2ecc9d022d8865cc49e7c105023397df0291a999ae72c070f0bf"
        },
        {
          "name": "find_track",
          "title": "Find a track in the charts",
          "description": "Look up a track or artist in this month's PickTrack charts: which genre chart it is in, its rank, BPM and Camelot key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Track title and/or artist name.",
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a track in the charts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b8a675a468fd52a4797c2fe69174b23ed374c32da7f1e5a26a4466f23efc5e3"
        },
        {
          "name": "get_chart",
          "title": "Get a genre chart",
          "description": "Current monthly PickTrack chart for one genre: the Top 3 tracks with artist, BPM, Camelot key, release date and SoundCloud link, plus the BPM/key of the next locked ranks and a link to the full chart.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "genre": {
                "description": "Chart genre slug. house = House; tech_house = Tech House; deep_house = Deep House; afro_house = Afro House; melodic_techno = Melodic Techno; techno = Melodic House / Rave / Techno; indie_dance = Indie Dance; amapiano = Amapiano; drum_and_bass = Drum & Bass; uk_garage = UK Garage / Speed Garage; dubstep = Dubstep; rnb = R&B; regional = Arabic Afro House; kpop = K-Pop; psy_trance = Psy-Trance; lo_fi = Lo-Fi / Chill Hop; top50 = Top 50 (all genres)",
                "enum": ["house", "tech_house", "deep_house", "afro_house", "melodic_techno", "techno", "indie_dance", "amapiano", "drum_and_bass", "uk_garage", "dubstep", "rnb", "regional", "kpop", "psy_trance", "lo_fi", "top50"],
                "type": "string"
              },
              "list": {
                "description": "top100 = most engaged tracks this month (default). hot100 = the next 100, fast risers.",
                "enum": ["top100", "hot100"],
                "type": "string"
              }
            },
            "required": ["genre"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
