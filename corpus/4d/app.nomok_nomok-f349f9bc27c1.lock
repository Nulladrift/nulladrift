{
  "lockfileVersion": 2,
  "subjects": {
    "app.nomok/nomok": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nomok.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nomok",
        "title": "Nomok – name availability checker",
        "version": "d8b9d21",
        "websiteUrl": "https://nomok.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use check_name to check one name on 70+ platforms (domains, social networks, marketplaces…), check_domains to compare several name ideas on domain extensions, suggest_names for available variants. Report \"manual\" and \"unknown\" results as unverified, never as available. Results are live checks, cached 10 minutes.",
      "tools": [
        {
          "name": "check_domains",
          "title": "Check domain names",
          "description": "Checks domain name availability for up to 10 names on chosen extensions (DNS + RDAP registry lookup). Default extensions: .com, .net, .org, .io, .app, .dev, .co, .fr. Supported: .com, .fr, .net, .org, .info, .biz, .co, .de, .uk, .it, .es, .be, .ch, .nl, .eu, .ca, .us, .io, .ai, .me, .gg, .tv, .app, .dev, .tech, .studio, .design, .art, .shop, .store, .online, .xyz. Ideal to compare several name ideas quickly. Available domains come with a registration link and indicative price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "names": {
                "items": {
                  "description": "Domain label without extension, e.g. \"acme\"",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "tlds": {
                "description": "Extensions to check, without dot (default: main ones)",
                "items": {
                  "enum": ["com", "fr", "net", "org", "info", "biz", "co", "de", "uk", "it", "es", "be", "ch", "nl", "eu", "ca", "us", "io", "ai", "me", "gg", "tv", "app", "dev", "tech", "studio", "design", "art", "shop", "store", "online", "xyz"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fa3c4bc4f9e4e617729b82602687df0bf32652fc01e0aba7d739638463850ddf"
        },
        {
          "name": "check_name",
          "title": "Check a name everywhere",
          "description": "Checks whether a name/handle is available on 70+ platforms at once: domain names (.com, .fr, .io, .app…), social networks (Instagram, TikTok, X, YouTube…), creative and dev platforms (GitHub, Behance…), e-commerce, freelance, gaming and company registries. Takes 5-15 s on first call (results cached 10 min). Statuses: available, likely_available, taken, manual (cannot be checked automatically), unknown (check failed). Never present manual/unknown results as available. Available domains come with a registration link. Each call is a full live search: to compare many name ideas, first use check_domains (up to 10 names per call), then check_name only on the shortlist.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "categories": {
                "description": "Optional: only return these categories (all by default)",
                "items": {
                  "enum": ["social", "creative", "domain", "ecommerce", "local", "freelance", "gaming", "business", "other"],
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "Name or handle to check (2-50 chars: letters, digits, . - _)",
                "maxLength": 50,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aa2884bdff3f5efa1c1bdf2661e8291b675e43998ab72b448d5ad76fd24ef997"
        },
        {
          "name": "suggest_names",
          "title": "Suggest available name variants",
          "description": "Generates common variants of a name (get-, try-, -hq, -app, -studio…) and checks which ones are available as a domain (.com by default). Use when the exact name is taken.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Base name, letters/digits/hyphens",
                "type": "string"
              },
              "tld": {
                "description": "Extension to check, default com",
                "enum": ["com", "fr", "net", "org", "info", "biz", "co", "de", "uk", "it", "es", "be", "ch", "nl", "eu", "ca", "us", "io", "ai", "me", "gg", "tv", "app", "dev", "tech", "studio", "design", "art", "shop", "store", "online", "xyz"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7b51878c7ffe9df93523438d014a881009b50b94b478681a1e19db4851252b35"
        }
      ],
      "digest": "sha256:f4cf8a3e3c429777c585eb18e7b5e0efa8cfe552cd685e35d0b61a3d16c9352e"
    }
  }
}
