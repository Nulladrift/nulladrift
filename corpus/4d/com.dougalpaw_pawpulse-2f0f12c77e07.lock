        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Paw Pulse monitors self-hosted LLM boxes (and any box with LLM_KIND=none) with outbound heartbeats. Typical flow: create_monitor -> setup_instructions -> run the commands on the box -> get_status. Store manage_token safely; it cannot be recovered.",
      "tools": [
        {
          "name": "create_monitor",
          "title": "Create monitor",
          "description": "Create a new anonymous Paw Pulse monitor. Returns ingest_token and manage_token exactly once — store them, they cannot be recovered.",
          "inputSchema": {
            "properties": {
              "expected_model": {
                "description": "Optional Ollama model that should be loaded (e.g. llama3.1:70b). Alerts 'slow' when a different model is loaded instead.",
                "type": "string"
              },
              "grace_seconds": {
                "description": "60-86400, default 300.",
                "type": "number"
              },
              "min_gpu_pct": {
                "description": "Optional GPU offload floor (0-100]. Alerts 'slow' when Ollama runs a model mostly on CPU.",
                "type": "number"
              },
              "name": {
                "description": "Display name, not treated as identifying.",
                "type": "string"
              },
              "public": {
                "description": "Whether /v1/monitors/:id/status and /s/:id are public.",
                "type": "boolean"
              },
              "slow_tps_threshold": {
                "description": "Optional tokens/sec floor.",
                "type": "number"
              },
              "webhook_url": {
                "description": "Optional https:// webhook for alerts.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4165761b6a19b61bdad5a8e4a9add24b6602dc90355fe1bf6d8d728ed502130e"
        },
        {
          "name": "delete_monitor",
          "title": "Delete monitor",
          "description": "Permanently delete a monitor and all its heartbeats. Cannot be undone.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Monitor id, as returned by create_monitor.",
                "type": "string"
              },
              "manage_token": {
                "description": "The monitor's manage_token (returned once by create_monitor).",
                "type": "string"
              }
            },
            "required": ["id", "manage_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:685b753d9b1e3f2862028222be1f12c0ccbe1848e1fd7de8fa71fa5ababf1c57"
        },
        {
          "name": "get_status",
          "title": "Get monitor status",
          "description": "Get the current status of a monitor. Private monitors require manage_token.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Monitor id, as returned by create_monitor.",
                "type": "string"
              },
              "manage_token": {
                "description": "The monitor's manage_token (returned once by create_monitor).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2ee101ae09b6c8a4b4aebcf8aa33da7dce378d1fdddf3cc3f3399717bbf6cf57"
        },
        {
          "name": "list_heartbeats",
          "title": "List recent heartbeats",
          "description": "List recent heartbeats for a monitor (newest first). Private monitors require manage_token.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Monitor id, as returned by create_monitor.",
                "type": "string"
              },
              "limit": {
                "description": "1-500, default 50.",
                "type": "number"
              },
              "manage_token": {
                "description": "The monitor's manage_token (returned once by create_monitor).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b45eb130a26b0c4223534f2cbd38fe1d7d9a64d791225767c8db78f7ac32872"
        },
        {
          "name": "setup_instructions",
          "title": "Get setup instructions",
          "description": "Shell commands to install the heartbeat script on the box being monitored and run it from cron. Pass the id and ingest_token from create_monitor.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Monitor id, as returned by create_monitor.",
                "type": "string"
              },
              "ingest_token": {
                "description": "The monitor's ingest_token (returned once by create_monitor).",
                "type": "string"
              },
              "llm_kind": {
                "description": "none = plain heartbeat, no LLM probe. Default ollama.",
                "enum": ["ollama", "openai", "none"],
                "type": "string"
              }
            },
            "required": ["id", "ingest_token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:809479900cff0663d6dede702b602cd98f0f1875a69bf075420dd930fe3f0556"
        },
        {
          "name": "update_monitor",
          "title": "Update monitor settings",
          "description": "Change a monitor's name, grace period, slow threshold, webhook or visibility. Only the fields you pass change.",
          "inputSchema": {
            "properties": {
              "expected_model": {
                "description": "Model that should be loaded, or null to clear.",
                "type": ["string", "null"]
              },
              "grace_seconds": {
                "description": "60-86400.",
                "type": "number"
              },
              "id": {
                "description": "Monitor id, as returned by create_monitor.",
                "type": "string"
              },
              "manage_token": {
                "description": "The monitor's manage_token (returned once by create_monitor).",
                "type": "string"
              },
              "min_gpu_pct": {
                "description": "GPU offload floor (0-100], or null to clear.",
                "type": ["number", "null"]
              },
              "name": {
                "description": "New display name.",
                "type": "string"
              },
              "public": {
                "type": "boolean"
              },
              "slow_tps_threshold": {
                "description": "Tokens/sec floor, or null to clear.",
                "type": ["number", "null"]
              },
              "webhook_url": {
                "description": "https:// webhook, or null to clear.",
                "type": ["string", "null"]
              }
            },
            "required": ["id", "manage_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
