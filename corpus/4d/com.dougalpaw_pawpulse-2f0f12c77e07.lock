        "name": "pawpulse",
        "title": "Paw Pulse",
        "version": "0.3.0",
        "websiteUrl": "https://pulse.dougalpaw.com",
        "icons": [
          {
            "src": "https://pulse.dougalpaw.com/icon.svg",
            "mimeType": "image/svg+xml",
