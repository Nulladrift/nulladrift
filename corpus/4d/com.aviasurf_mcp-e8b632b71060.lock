        {
          "name": "route_facts",
          "title": "Inspect cached route facts",
          "description": "Summarize a cached fare sample in an interactive route profile: price statistics, airlines observed, travel duration, route distance, and city airports. Prices are per adult. Always link the returned search_url from a short label in the answer language, for example \"Check live prices on Aviasurf\"; never paste the raw URL as text. direct_seen means only that a nonstop option appeared in the sample; never infer that direct flights do not exist.",
          "inputSchema": {
            "additionalProperties": false,
            "not": {
              "required": ["depart_date", "depart_month"]
            },
            "properties": {
              "currency": {
                "description": "Three-letter output currency. Set it only when the user explicitly requests a currency; otherwise the service derives it from the departure country.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "depart_date": {
                "description": "Optional exact departure date. Omit both date fields for the cheapest observations across the cached horizon; do not combine with depart_month.",
                "format": "date",
                "type": "string"
              },
              "depart_month": {
                "description": "Optional departure month. Omit both date fields for the cheapest observations across the cached horizon; do not combine with depart_date.",
                "pattern": "^[0-9]{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "destination": {
                "description": "Destination city or airport IATA code.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Language locale for airport and airline names.",
                "pattern": "^[A-Za-z]{2}(?:-[A-Za-z]{2})?$",
                "type": "string"
              },
              "market": {
                "description": "Two-letter country market. Set it only when the user explicitly requests a country market or local Aviasurf site; otherwise the service derives it from the departure country.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "origin": {
                "description": "Origin city or airport IATA code.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "return_date": {
                "description": "Optional return date for a round trip.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "type": "string"
              },
              "destination_airports": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "airport_code": {
                      "type": "string"
                    },
                    "city_code": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["airport_code", "city_code"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "fallback_reason": {
                "type": ["null", "string"]
              },
              "fallback_used": {
                "type": "boolean"
              },
              "freshness": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "origin_airports": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "airport_code": {
                      "type": "string"
                    },
                    "city_code": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["airport_code", "city_code"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "price_kind": {
                "type": "string"
              },
              "query": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "type": "string"
                  },
                  "depart_date": {
                    "type": "string"
                  },
                  "depart_month": {
                    "type": "string"
                  },
                  "destination": {
                    "type": "string"
                  },
                  "locale": {
                    "type": "string"
                  },
                  "market": {
                    "type": "string"
                  },
                  "one_way": {
                    "type": "boolean"
                  },
                  "origin": {
                    "type": "string"
                  },
                  "return_date": {
                    "type": "string"
                  }
                },
                "required": ["currency", "destination", "locale", "market", "one_way", "origin"],
                "type": "object"
              },
              "query_coverage": {
                "additionalProperties": false,
                "properties": {
                  "applied_locally": {
                    "items": {
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  },
                  "applied_upstream": {
                    "items": {
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  },
                  "complete": {
                    "type": "boolean"
                  },
                  "relaxed": {
                    "items": {
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  },
                  "source": {
                    "type": "string"
                  },
                  "unsupported": {
                    "items": {
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  }
                },
                "required": ["applied_locally", "applied_upstream", "complete", "relaxed", "source", "unsupported"],
                "type": "object"
              },
              "request_id": {
                "type": "string"
              },
              "schema_version": {
                "type": "string"
              },
              "search_id": {
                "type": "string"
              },
              "search_url": {
                "type": "string"
              },
              "stats": {
                "additionalProperties": false,
                "properties": {
                  "airlines_seen": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "code": {
                          "type": "string"
                        },
                        "direct_seen": {
                          "type": "boolean"
                        },
                        "logo_url": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        }
                      },
                      "required": ["code", "direct_seen"],
                      "type": "object"
                    },
                    "type": ["null", "array"]
                  },
                  "avg_price": {
                    "type": ["null", "number"]
                  },
                  "direct_seen": {
                    "type": ["null", "boolean"]
                  },
                  "direct_share": {
                    "type": ["null", "number"]
                  },
                  "duration_min_minutes": {
                    "type": ["null", "integer"]
                  },
                  "median_price": {
                    "type": ["null", "number"]
                  },
                  "min_price": {
                    "type": ["null", "number"]
                  },
                  "sample_period": {
                    "additionalProperties": false,
                    "properties": {
                      "from": {
                        "type": "string"
                      },
                      "to": {
                        "type": "string"
                      }
                    },
                    "required": ["from", "to"],
                    "type": ["null", "object"]
                  },
                  "sample_size": {
                    "type": "integer"
                  },
                  "stats_suppressed": {
                    "type": "string"
                  }
                },
                "required": ["airlines_seen", "min_price", "sample_size"],
                "type": "object"
              },
              "updated_at": {
                "type": "string"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["currency", "destination_airports", "fallback_reason", "fallback_used", "freshness", "note", "origin_airports", "price_kind", "query", "query_coverage", "request_id", "schema_version", "search_id", "search_url", "stats", "updated_at"],
            "type": "object"
          },
