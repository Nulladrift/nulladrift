      },
      "serverInfo": {
        "name": "aviasurf-mcp",
        "title": "Aviasurf MCP",
        "version": "1.1.0",
        "description": "Indicative flight prices, flexible planning across dates and airports, destination insights, and handoff to live Aviasurf search.",
        "websiteUrl": "https://aviasurf.com"
      },
      "capabilities": {
        "resources": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Aviasurf provides indicative prices from cached historical fare data, not live availability. State freshness and found date, and direct users to Aviasurf live search. Never claim availability, booking, schedules, baggage allowance, fare rules, visa requirements, or that direct flights do not exist. Preserve every user constraint and use query_coverage to distinguish upstream filters, local sample filters, and unsupported conditions. Resolve ambiguous place names before requesting prices.",
      "tools": [
        {
          "name": "cheapest_destinations",
          "title": "Discover indicative destination prices",
          "description": "Find cached indicative fares and filter destinations locally by geography, climate, coast, island, elevation or terrain relief, beach or hiking traits, culture, parks, population, connectivity, and route trip-duration suitability. Use population_level=low for quieter small-city options, but note that it is a global population band, not a measure of crowds or tourism: a small city may still be busy with visitors. Other low/medium/high values are also global bands, not ranks within a country; museum_level=low means no notable museum signal, not no museums. National-park distance is to the park centre. Monthly air and water filters require month. Prices are per adult. Always link the returned search_url from a short label; never paste the raw URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "air_temp_min": {
                "description": "Minimum monthly air temperature in degrees Celsius. Requires month and excludes destinations without air-temperature data.",
                "maximum": 60,
                "minimum": -80,
                "type": "number"
              },
              "airlines_min": {
                "description": "Minimum direct-route airline count.",
                "minimum": 1,
                "type": "integer"
              },
              "beach_destination": {
                "default": false,
                "description": "Measured beach-destination signal.",
                "type": "boolean"
              },
              "budget_max": {
                "description": "Maximum indicative price, applied locally.",
                "minimum": 1,
                "type": "integer"
              },
              "continent": {
                "description": "Seven-continent destination code, applied locally.",
                "enum": ["AF", "AN", "AS", "EU", "NA", "OC", "SA"],
                "type": "string"
              },
              "country": {
                "description": "Two-letter destination country filter, applied locally.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "currency": {
                "description": "Three-letter output currency. Set it only when the user explicitly requests a currency; otherwise the service derives it from the departure country.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "direct": {
                "default": false,
                "description": "Request nonstop observations only.",
                "type": "boolean"
              },
              "direct_destinations_min": {
                "description": "Minimum direct destination count.",
                "minimum": 1,
                "type": "integer"
              },
              "elevation_min_m": {
                "description": "Minimum destination elevation above sea level in metres, applied locally. Use for mountain or high-altitude requests such as 'I want to go to the mountains' or 'хочу в горы'.",
                "maximum": 9000,
                "minimum": -500,
                "type": "number"
              },
              "group": {
                "description": "Curated destination group, applied locally. asia: cities in selected Asian countries. schengen: cities in the Schengen area. russia: domestic Russian destinations. Use the separate measured coast, monthly temperature, island, and elevation filters for those traits; do not infer unsupported themes.",
                "enum": ["asia", "schengen", "russia"],
                "type": "string"
              },
              "hiking_destination": {
                "default": false,
                "description": "Derived hiking-destination signal.",
                "type": "boolean"
              },
              "historical_places_level_min": {
                "description": "Minimum global historical-places band.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "island": {
                "default": false,
                "description": "When true, return tourist island destinations rather than dense urban island districts or continent-sized landmasses. Use for requests such as 'take me to an island' or 'куда на острова'.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of destinations to return, applied locally.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language locale for reference names and response text.",
                "pattern": "^[A-Za-z]{2}(?:-[A-Za-z]{2})?$",
                "type": "string"
              },
              "market": {
                "description": "Two-letter country market. Set it only when the user explicitly requests a country market or local Aviasurf site; otherwise the service derives it from the departure country.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "max_coast_distance_km": {
                "description": "Maximum destination-city distance to the coast in kilometres, applied locally from the Aviasurf destination knowledge base.",
                "minimum": 0,
                "type": "number"
              },
              "max_elevation_m": {
                "description": "Maximum city elevation in metres.",
                "maximum": 9000,
                "minimum": -500,
                "type": "number"
              },
              "max_national_park_distance_km": {
                "description": "Maximum distance to a national park centre in kilometres.",
                "minimum": 0,
                "type": "number"
              },
              "month": {
                "description": "Optional departure month.",
                "pattern": "^[0-9]{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "museum_level_min": {
                "description": "Minimum global museum band; low means no notable museum signal, not no museums.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "national_parks_min": {
                "description": "Minimum nearby national-park count.",
                "minimum": 1,
                "type": "integer"
              },
              "origin": {
                "description": "Origin city or airport IATA code.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "population_level": {
                "description": "Exact global population band; use low for quieter small-city options, not as a crowd or tourism measure.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "relaxing_beach_destination": {
                "default": false,
                "description": "Derived quiet beach-holiday signal.",
                "type": "boolean"
              },
              "sort": {
                "default": "price",
                "description": "Sort by indicative price or preserve upstream popularity order.",
                "enum": ["price", "popularity"],
                "type": "string"
              },
              "subregion": {
                "description": "UN M49 destination subregion in lowercase snake_case, applied locally.",
                "enum": ["antarctica", "australia_and_new_zealand", "caribbean", "central_america", "central_asia", "eastern_africa", "eastern_asia", "eastern_europe", "melanesia", "micronesia", "middle_africa", "northern_africa", "northern_america", "northern_europe", "polynesia", "south_america", "south_eastern_asia", "southern_africa", "southern_asia", "southern_europe", "western_africa", "western_asia", "western_europe"],
                "type": "string"
              },
              "terrain_relief_min_m": {
                "description": "Minimum surrounding terrain relief in metres.",
                "minimum": 0,
                "type": "number"
              },
              "trip_duration_band": {
                "description": "Route-suitability band from the destination knowledge base. Use weekend for requests such as 'weekend getaway' or 'куда на выходные'; use the other bands for an explicitly requested trip length.",
                "enum": ["day_trip", "weekend", "short_trip", "week", "extended_stay"],
                "type": "string"
              },
              "warm_water_months_min": {
                "description": "Minimum warm-water months per year.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "water_temp_min": {
                "description": "Minimum monthly water temperature in degrees Celsius. Use with month for requests such as 'where can I swim?' or 'где можно купаться'; destinations without water data are excluded.",
                "maximum": 40,
                "minimum": -5,
                "type": "number"
              },
              "world_heritage_sites_min": {
                "description": "Minimum World Heritage site count.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["origin"],
            "type": "object"
          },
