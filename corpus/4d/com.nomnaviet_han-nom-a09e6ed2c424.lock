              },
              "historicalEntries": {
                "description": "Canonical entries from historical dictionaries that print this glyph. Summaries only — call lookup_dictionary_entry with an entryId for the full entry and its subentries.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "citationCount": {
                      "description": "How many attested citations sit under those senses.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "definition": {
                      "description": "May be empty — 545 entries carry their sense only in subentries.",
                      "type": ["string", "null"]
                    },
                    "entryId": {
                      "description": "Unique WITHIN this work only, e.g. \"B-0123\". Always pass it together with workKey.",
                      "type": "string"
                    },
                    "han": {
                      "description": "The headword's Hán/Nôm form, or null when there is none. One codepoint in character dictionaries; in word-level works (ntqatd) it can be a whole word such as 別咍, so do not treat it as a single character.",
                      "type": ["string", "null"]
                    },
                    "hanStatus": {
                      "description": "\"unicode\" | \"pua\" | \"image_only\" | \"none\" (the work prints no glyph for this headword).",
                      "type": "string"
