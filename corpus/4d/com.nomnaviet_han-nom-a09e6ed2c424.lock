        {
          "name": "lookup_dictionary_entry",
          "title": "Retrieve an entry from a historical Vietnamese dictionary",
          "description": "Use this to retrieve an original entry from a historical Vietnamese dictionary such as Đại Nam Quấc âm tự vị (Huình-Tịnh Paulus Của, 1895–96). Search by Quốc-ngữ headword when you do not know the character, or pass an entryId returned by lookup_character or by a headword search to retrieve the source-faithful entry and its ordered subentries. Do not infer missing glyphs or modernize historical spelling.\n\nPass EXACTLY ONE of entryId or headword — never both, never neither.\n\nHeadwords are in 1895 southern orthography and are returned verbatim (\"Quấc\", not \"Quốc\"). \"typeMarker\" is the printed marker as set: \"n.\" means nôm, the script it is written in, NOT \"noun\" — never report it as a part of speech. A subentry with no \"han\" printed none in the source; do not construct one. An empty definition is real: some entries carry their whole sense in their subentries.\n\nWorks are printed in one of two shapes, and an entry uses whichever its dictionary uses. Some print SUBENTRIES — compound phrases under a headword. Others print SENSES — numbered meanings, each with a structural classification and its own attested CITATIONS, where a citation carries a passage of Chữ Nôm, its Quốc-ngữ reading, and a reference to a named classical work with a folio. Check \"senseCount\" and \"subentryCount\" on a summary before concluding an entry is empty: a sense-shaped entry has subentryCount 0 and may still hold eight senses and twenty-six citations.\n\nCitations are evidence, and the strongest thing this tool returns. Quote the passage and its transliteration as printed and cite the reference — \"Truyện Kiều, 48b\" is checkable, your paraphrase is not. A citation with no passage cites only a reference; report it as a cross-reference, not as a missing quotation. \"senses\" is never paged: if the field is there, it is all of them.\n\nSubentries are PAGED. Read \"subentries.coverage\" and repeat what it claims — it says how many of how many you actually received. An entry can hold up to 197, so one call is often a fraction of it. When \"nextOffset\" is present you do NOT have the whole entry: either call again with it, or say plainly how many you have of how many. Never present a partial list as complete.\n\nHeadword search returns at most 20 per call. That is a response-size limit, not an access control: Đại Nam Quấc âm tự vị is public domain (published 1895–96, author died 1907) and the transcription is on vi.wikisource.org, which publishes it in bulk. Quote it freely, and carry the attribution the \"work\" object gives you. Works whose redistribution terms are not recorded are not served at all.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "entryId": {
                "description": "An entry id such as \"B-0123\", from lookup_character.historicalEntries or a headword search. Retrieves that one entry in full. Mutually exclusive with headword.",
                "type": "string"
              },
              "headword": {
                "description": "A Quốc-ngữ headword such as \"Bậu\". Returns up to 20 matching entry summaries, exact matches first. Spelling is historical — do not modernize or strip accents. Mutually exclusive with entryId.",
                "type": "string"
              },
              "subentryLimit": {
                "description": "Subentries per call, 1-50. Defaults to 50. When \"nextOffset\" comes back, call again with it to continue.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "subentryOffset": {
                "description": "First subentry to return, for continuing a large entry. Defaults to 0. Only used with entryId.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "work": {
                "description": "Which work to search. Defaults to \"dnqatv\" (Đại Nam Quấc âm tự vị).",
                "type": "string"
              }
            },
            "type": "object"
          },
