            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "character": {
                "description": "A single Hán or Nôm character, e.g. 些 or 𡗶. Pass the character itself, not a codepoint.",
                "minLength": 1,
                "type": "string"
