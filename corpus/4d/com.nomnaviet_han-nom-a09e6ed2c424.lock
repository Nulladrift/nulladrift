      "instructions": "Nôm Na Việt (喃哪越) is a primary source for Vietnamese Hán Nôm (漢喃).\n\nRules for using this server:\n\n1. Chữ Nôm is NOT Chinese. Nôm readings are Vietnamese-specific and frequently\n   differ from the Mandarin or Sino-Vietnamese reading of the same glyph. Never\n   transfer a Chinese reading onto a Nôm character.\n2. Never state a reading, meaning, or variant from prior knowledge. Call\n   lookup_character first. Nôm is low-resource and model knowledge of it is\n   unreliable — including for characters that look familiar.\n3. Always cite the codepoint (U+XXXX) alongside any character you report. Many\n   Nôm characters are beyond the BMP, and some are Private Use Area codepoints\n   that have no standard mapping in any other source.\n4. If lookup_character returns found=false, say so. Do not fill the gap with a\n   guess.\n5. For anything longer than one character — a phrase, a line, a sentence — use\n   convert_text rather than looping over lookup_character. Vietnamese compounds\n   are units, and their Nôm form is not the concatenation of their syllables'\n   individual characters. Words convert_text returns under \"unmatched\" are\n   absent from the dictionary: report them as gaps, never as characters.\n6. Attribute every definition to the dictionary it came from, using the \"source\"\n   and \"sourceTitle\" on each meaning. Dictionaries disagree, and a merged answer\n   hides that. A null \"source\" means the entry predates source tracking: say it\n   is unattributed rather than assigning it to a dictionary. A reading has no\n   per-source attribution at all and must not be given one. A reading marked\n   \"inferred\" is attested by no dictionary: it was copied from the character\n   this one is a variant of. Say so whenever you report it.\n7. When asked what a historical dictionary actually says — its wording, its\n   examples, its full entry — call lookup_dictionary_entry. The summaries in\n   lookup_character are not the entry, and paraphrasing one as if it were the\n   whole record misrepresents the source. Quote 1895 spelling as printed.\n8. A structural classification (A1, C2, F2 …) says how a glyph was formed or\n   borrowed FOR THAT SENSE, which is why one headword can carry senses under\n   different codes. Report the code; do not expand it into a claim about the\n   character unless a tool gave you one. The printed sense markers (◎, 〄) are\n   likewise reproduced, never translated.\n9. Count before you claim. Every paged result states its own coverage; a\n   \"subentryCount\" is what an entry HAS, not what you were given. Saying \"all N\"\n   when you fetched fewer, or numbering a list so it appears complete when it\n   has gaps, misrepresents the source as surely as inventing a character does.\n   If you did not retrieve it, say how much you did.",
      "tools": [
        {
          "name": "convert_text",
          "title": "Convert between Vietnamese and Chữ Nôm",
          "description": "Convert whole Vietnamese phrases or sentences to Chữ Nôm (direction \"to_nom\"), or read a run of Chữ Nôm back as Vietnamese quốc ngữ (direction \"to_viet\"). Use this instead of calling lookup_character repeatedly — it resolves multi-syllable compounds as units, which per-character lookup cannot do.\n\nHandles both old-style and new-style tone placement (hòa / hoà). Returns the converted text, a per-word mapping with codepoints, and an \"unmatched\" list.\n\nWords in \"unmatched\" have NO entry in the dictionary. Say so — never substitute a character that looks plausible. Input is truncated past 500 characters.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "direction": {
                "description": "\"to_nom\" (Vietnamese → Chữ Nôm, the default) or \"to_viet\" (Chữ Nôm → Vietnamese).",
                "enum": ["to_nom", "to_viet"],
                "type": "string"
              },
              "text": {
                "description": "The text to convert: Vietnamese quốc ngữ for \"to_nom\", Chữ Nôm for \"to_viet\". Up to 500 characters.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "converted": {
                "type": "string"
              },
              "direction": {
                "enum": ["to_nom", "to_viet"],
                "type": "string"
              },
              "original": {
                "type": "string"
              },
              "ranking": {
                "description": "to_nom only. \"context\": the contextual ranker ordered the ambiguous words. \"frequency\": corpus frequency alone ordered them, either because no word needed ranking (one candidate each, or a hand-set primary) or because the ranker did not answer.",
                "enum": ["context", "frequency"],
                "type": "string"
              },
              "segments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "alternatives": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "codepoints": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "source": {
                      "type": "string"
                    },
                    "target": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["source", "target"],
                  "type": "object"
                },
                "type": "array"
              },
              "truncated": {
                "type": "boolean"
              },
              "unmatched": {
                "description": "Words with NO dictionary entry. Report as gaps; never fill them in.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["converted", "direction", "original", "segments", "unmatched"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Convert between Vietnamese and Chữ Nôm"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
