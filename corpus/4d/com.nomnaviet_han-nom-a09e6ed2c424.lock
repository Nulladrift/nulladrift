                    "orderInWork": {
                      "description": "Position in the WHOLE work, 0-based across every section — not a position within the section. B-0123 is 196 because 74 entries precede letter B. It equals globalId minus one: the same count, not a different basis. Use it for ordering only; cite entryId to identify an entry.",
                      "maximum": 9007199254740991,
