          "name": "search_corpus",
          "title": "Search characters by Vietnamese reading or meaning",
          "description": "Find Hán Nôm characters by their Vietnamese reading (quốc ngữ, e.g. \"trăng\") or by Vietnamese meaning. Use when you need to discover which characters correspond to a Vietnamese word, then call lookup_character on the result for full detail.\n\nEach result reports what actually matched — \"matchedOn\" is \"reading\" or \"meaning\", and \"match\" carries the exact reading or the definition containing your query, with its source. Do not treat that definition as the character's only sense; call lookup_character for the rest.\n\nReturns at most 20 characters per call, with no pagination. This dictionary's readings and meanings come from sources under CC BY-SA 4.0, so bulk redistribution carries ShareAlike obligations — the cap keeps ordinary use well inside that. Cite the source on each result rather than presenting the corpus as your own.",
