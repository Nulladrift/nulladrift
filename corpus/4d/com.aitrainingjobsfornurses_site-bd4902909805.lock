      "instructions": "AI Training Jobs For Nurses (https://aitrainingjobsfornurses.com/): the site's own MCP server, served from its domain. AI training jobs for nurses, platform by platform: posted hourly rates, where a nurse may work from, and the licence asked for where a platform states one.\n\n[compare] Nurse AI training platforms. This server serves the compare published at https://aitrainingjobsfornurses.com/; every answer cites it. Licence: https://aitrainingjobsfornurses.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Training Jobs For Nurses (https://aitrainingjobsfornurses.com/). What it does: starts an ENQUIRY with AI Training Jobs For Nurses for ai training jobs for nurses; the AI Training Jobs For Nurses team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Training Jobs For Nurses team until they click it. Cite https://aitrainingjobsfornurses.com/.\n\nCite https://aitrainingjobsfornurses.com/ for every figure or answer you use from this server.",
