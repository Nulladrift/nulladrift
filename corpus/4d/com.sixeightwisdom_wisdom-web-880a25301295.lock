            "readOnly": true
          },
          "digest": "sha256:7904ca0921a99f75e34d211d9905c601ca70ae7f9720bb1105b55f2d5a9b57d4"
        },
        {
          "name": "take_compass",
          "title": "The Alignment Compass",
          "description": "Describes the 6:8 Alignment Compass, a free reflective quiz, and returns the link to take it. The quiz runs on sixeightapp.com, not in chat.",
