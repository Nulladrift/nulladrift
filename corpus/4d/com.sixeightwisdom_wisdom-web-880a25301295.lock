      "serverInfo": {
        "name": "wisdom-web",
        "title": "Wisdom Web by Six Eight",
        "version": "1.0.0",
        "websiteUrl": "https://sixeightwisdom.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Wisdom Web by Six Eight shares public-domain wisdom checked against its sources. daily_wisdom gives today’s line; search_quotes finds quotes by theme or author; get_verse looks up scripture in public-domain translations; one_action helps someone step out of a loop into one small action; take_compass links to the Alignment Compass quiz. Quote text exactly as returned, and keep the short credit and link that come with each result.",
      "tools": [
        {
          "name": "daily_wisdom",
          "title": "Today’s wisdom",
          "description": "Today’s quote from Wisdom Web by Six Eight: one public-domain line, checked word for word against its Project Gutenberg source, with author, book and source link. Everyone gets the same line on the same day (UTC).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:67cc960dcdf7e873a5e0334d3f54d3da6f0302c3c971d8b30f8f99a3a4504bef"
        },
        {
          "name": "get_verse",
          "title": "Get a scripture verse",
          "description": "Looks up a verse by reference (\"John 3:16\", \"Psalm 23\", \"Quran 2:255\", \"Tao Te Ching 8\") or finds one on a topic (\"forgiveness\", \"fear\"). Public-domain English translations only, and every result names its translation and licence. The Bible, Tanakh and Quran use standard verse numbers; the Gita, Dhammapada, Tao Te Ching, Analects and Zhuangzi are numbered by passage in these translations, so ask for a chapter. Traditions: Christianity, Judaism, Stoicism, Islam, Hinduism, Buddhism, Taoism, Confucianism. Give a reference or a topic.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "reference": {
                "description": "A reference such as \"John 3:16\", \"Proverbs 3:5-6\", \"Quran 2:255\" or \"Tao Te Ching 8\". Up to 12 verses.",
                "type": "string"
              },
              "topic": {
                "description": "A theme to find a verse about, such as \"patience\" or \"grief\". Used when there is no reference.",
                "type": "string"
              },
              "tradition": {
                "description": "Optional: Christianity, Judaism, Stoicism, Islam, Hinduism, Buddhism, Taoism, Confucianism.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f1c2e627a3168b004d75f7ecc897c57a2e5ce3eb9aa1ee43979f61b2697de9c"
        },
        {
          "name": "one_action",
          "title": "Out of the loop, into one action",
          "description": "For when someone is stuck in a loop (scrolling, texting an ex, procrastinating, spiralling, craving). Returns Six Eight’s method as short guidance for you to follow in conversation, one relevant verified quote, and a matching practice from the 6:8 app when one fits. Nothing they write is stored. If the situation mentions self-harm or harming others, it returns crisis resources only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "situation": {
                "description": "What is going on, in the person’s words. 3 to 1,000 characters.",
                "type": "string"
              }
            },
            "required": ["situation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d695fcca35611592e44259bb25d58e711e1a01cb24afe43a8014451289a4530"
        },
        {
          "name": "search_quotes",
          "title": "Search verified quotes",
          "description": "Searches Wisdom Web’s library of public-domain quotes, each checked against its source text (Seneca, Lao Tzu, Emerson, Shakespeare, Proverbs and others). Returns up to 5 lines with author, book and source. Use plain words: \"patience\", \"grief\", \"starting over\", or an author’s name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many quotes, 1 to 5. Default 3.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to search for, or an author. 2 to 200 characters.",
                "type": "string"
              },
              "topic": {
                "description": "Optional Wisdom Web topic to stay within, such as \"letting_go\", \"discipline\" or \"Stoicism\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
