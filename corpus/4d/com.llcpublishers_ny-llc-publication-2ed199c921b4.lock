        {
          "name": "llc_publication_answer_question",
          "title": "Answer NY LLC Publication Questions",
          "description": "Answers a specific question about New York LLC publication from LLC Publishers' FAQs and guides when no other tool fits: solicitation letters that look official, online newspapers, why the county clerk designates the newspapers, foreign LLCs and PLLCs, address or name changes, the Certificate of Good Standing, the theatrical exemption, real estate holding LLCs, inactive LLCs, and similar questions. Returns the matching FAQ answers and article links, or a pointer to the guides when nothing matches. Do NOT use for prices (use llc_publication_get_county_pricing), county newspapers or clerk contacts (use llc_publication_get_county_info), the step-by-step process (use llc_publication_get_process_guide), or what the requirement is and what happens without it (use llc_publication_check_requirements).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "question": {
                "description": "The specific question about NY LLC publication",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Answer NY LLC Publication Questions"
          },
          "behavior": {
