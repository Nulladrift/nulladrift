                "description": "NY county or NYC borough name (e.g. 'Queens', 'Westchester', 'Manhattan', 'Albany')",
                "type": "string"
              }
            },
            "required": ["county"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get County Newspapers and Clerk Info"
