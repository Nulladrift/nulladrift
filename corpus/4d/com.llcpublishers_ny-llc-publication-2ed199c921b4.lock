          "digest": "sha256:ae9d3dc0e990df2a1d4d746fe303455733f0e8e8dec95630bd406a08e3d70ed7"
        },
        {
          "name": "llc_publication_check_requirements",
          "title": "Check New York LLC Publication Requirements",
          "description": "Explains New York's LLC publication requirement: Section 206 of the LLC Law for domestic LLCs, Section 802(b) for foreign LLCs, Section 1203 for PLLCs and Section 1306 for foreign PLLCs. Covers what the statute requires (a notice in two newspapers designated by the county clerk, one daily and one weekly, for six consecutive weeks, and proof of publication filed with the Department of State within 120 days), who it applies to, what Section 206(a) says happens when proof is not filed in time (the LLC's authority to do business is suspended; Section 206 imposes no fine), that New York State continues to accept publication filings after the 120-day window, the capacity-to-sue case law, and common misconceptions (single-member and inactive LLCs, name or address changes, the theatrical exemption). General information, not legal advice. Optionally takes a county for county details. Do NOT use for prices (use llc_publication_get_county_pricing), newspaper or clerk lookups (use llc_publication_get_county_info), or the step-by-step process (use llc_publication_get_process_guide).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "county": {
                "description": "Optional NY county name to add county-specific context (e.g. 'New York', 'Kings', 'Albany')",
                "type": "string"
              },
              "llc_type": {
                "description": "Optional LLC type for tailored requirements info",
                "enum": ["domestic", "foreign", "pllc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check New York LLC Publication Requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:579afc74ec1b3e431846c542a6922e5e2900a57da2d00769c987ad009ab4e297"
        },
        {
          "name": "llc_publication_generate_ad_text",
          "title": "Generate NY LLC Publication Notice Text",
          "description": "Drafts the text of a New York LLC publication notice from the details given, as a template with bracketed placeholders for anything not provided. Requires the LLC's name and county. Lists the items the statute says the notice includes (Section 206(a) for a domestic LLC, Section 802(b) for a foreign LLC, Section 1203 for a PLLC), such as the filing date, the county of the LLC's office, the Secretary of State as agent for service of process and the address it mails process to, and the purpose. For people preparing their own newspaper submission, or anyone who wants to see what gets published. General information, not legal advice. Do NOT use to check an existing notice (use llc_publication_verify_ad_compliance), for prices (use llc_publication_get_county_pricing), or for process guidance (use llc_publication_get_process_guide).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "county": {
                "description": "NY county where the LLC's office is located (e.g. 'New York', 'Kings', 'Albany')",
                "type": "string"
              },
              "formation_date": {
                "description": "The date the Articles of Organization (for a foreign LLC, the Application for Authority) were filed, from the Filing Receipt",
                "type": "string"
              },
              "llc_name": {
                "description": "Full legal name of the LLC exactly as it appears on the Articles of Organization",
                "type": "string"
              },
              "llc_type": {
                "description": "Type of LLC (default: domestic)",
                "enum": ["domestic", "foreign", "pllc"],
                "type": "string"
              },
              "sop_address": {
                "description": "The address the Filing Receipt gives for service of process (where the Secretary of State mails process)",
                "type": "string"
              },
              "sop_name": {
                "description": "The name the Filing Receipt gives for service of process (where the Secretary of State mails process)",
                "type": "string"
              }
            },
            "required": ["county", "llc_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Generate NY LLC Publication Notice Text"
