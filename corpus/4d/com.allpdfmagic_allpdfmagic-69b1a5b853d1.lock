                "type": "string"
              }
            },
            "required": ["filename"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7af354d190a6f30b680416b59bcbfb04f3560c819368420c5be642eada59c4cc"
        },
        {
          "name": "pdf_to_excel",
          "description": "Convert a PDF (tables, statements, reports) to an Excel file. Returns a download URL. Requires Premium tier or above.",
          "inputSchema": {
            "properties": {
              "file_base64": {
                "description": "Base64-encoded file content (alternative to file_url; max 15MB decoded)",
