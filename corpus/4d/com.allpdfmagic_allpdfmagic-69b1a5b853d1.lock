{
  "lockfileVersion": 2,
  "subjects": {
    "com.allpdfmagic/allpdfmagic": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.allpdfmagic.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "allpdfmagic",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "AllPDFMagic document-intelligence tools. validate_gstin needs no key; all other tools require 'Authorization: Bearer apm_live_...' (free key: https://www.allpdfmagic.com/dashboard/api). Files are accepted as HTTPS URLs or base64. Results with download_url fields link to generated files.",
      "tools": [
        {
          "name": "compress_pdf",
          "description": "Compress a PDF file to reduce its size. Returns a download URL for the compressed file. Free tier: 500 calls/month.",
          "inputSchema": {
            "properties": {
              "file_base64": {
                "description": "Base64-encoded file content (alternative to file_url; max 15MB decoded)",
                "type": "string"
              },
              "file_url": {
                "description": "HTTPS URL of the file to process (the server downloads it)",
                "type": "string"
              },
              "filename": {
                "description": "Filename with extension, e.g. invoice.pdf",
                "type": "string"
              }
            },
            "required": ["filename"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ebcc7f36e640e97736f28667bd58c43e59caa54a0104588079c29db98b312635"
        },
        {
          "name": "detect_document_fraud",
          "description": "Screen a batch of 2+ invoices/documents for fraud signals: fabricated GSTINs (check-digit), duplicate invoice numbers across documents, duplicate/near-duplicate files, and amount anomalies. Requires Developer tier or above.",
          "inputSchema": {
            "properties": {
              "files": {
                "description": "2-10 documents. Each item: {file_url OR file_base64, filename}",
                "items": {
                  "properties": {
                    "file_base64": {
                      "description": "Base64-encoded file content (alternative to file_url; max 15MB decoded)",
                      "type": "string"
                    },
                    "file_url": {
                      "description": "HTTPS URL of the file to process (the server downloads it)",
                      "type": "string"
                    },
                    "filename": {
                      "description": "Filename with extension, e.g. invoice.pdf",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22527954c13bd7c444f5ccdc4ba941023d47d98ca595c48a3da232a95fa87790"
        },
        {
          "name": "extract_invoice_data",
          "description": "Extract structured data from an invoice PDF: vendor, invoice number, date, line items, taxes (GST-aware), totals — as JSON. Requires Team tier or above.",
          "inputSchema": {
            "properties": {
              "file_base64": {
                "description": "Base64-encoded file content (alternative to file_url; max 15MB decoded)",
                "type": "string"
              },
              "file_url": {
                "description": "HTTPS URL of the file to process (the server downloads it)",
                "type": "string"
              },
              "filename": {
                "description": "Filename with extension, e.g. invoice.pdf",
                "type": "string"
              }
            },
            "required": ["filename"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e56cb3b051029f9d6f69f9592eb1b155c42774567026c2a408b3f12baeb96187"
        },
        {
          "name": "parse_bank_statement",
          "description": "Parse a bank statement PDF (any Indian bank + international formats) into categorized transactions with dates, amounts, balances, payment modes (UPI/NEFT/ATM/...), and an income/expense summary. Requires Developer tier or above.",
          "inputSchema": {
            "properties": {
              "file_base64": {
                "description": "Base64-encoded file content (alternative to file_url; max 15MB decoded)",
                "type": "string"
              },
              "file_url": {
                "description": "HTTPS URL of the file to process (the server downloads it)",
                "type": "string"
              },
              "filename": {
