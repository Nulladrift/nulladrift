            "readOnly": false
          },
          "digest": "sha256:72747b609230dbfce9174293d64d14731e673e2c3a47e3bb7b782ac206b90cf4"
        },
        {
          "name": "reconcile_documents",
          "description": "Reconcile two or more documents (e.g. purchase register vs GSTR-2B, bank statement vs ledger). Matches line items by GSTIN + invoice number + amount; reports matches, mismatches with exact fields, and unmatched items. Requires Developer tier or above.",
          "inputSchema": {
            "properties": {
              "files": {
                "description": "2-10 documents. Each item: {file_url OR file_base64, filename}",
                "items": {
                  "properties": {
                    "file_base64": {
                      "description": "Base64-encoded file content (alternative to file_url; max 15MB decoded)",
                      "type": "string"
                    },
                    "file_url": {
                      "description": "HTTPS URL of the file to process (the server downloads it)",
                      "type": "string"
                    },
                    "filename": {
                      "description": "Filename with extension, e.g. invoice.pdf",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:16b6ea4ebd0475bbc4084ff9f43d9216dd968a3c3467d89358ce59b7ab7e1d5c"
        },
        {
          "name": "validate_gstin",
          "description": "Validate an Indian GSTIN: format and check-digit (base-36 checksum). Catches typos and fabricated numbers instantly. Runs locally — no API key required. Note: does NOT confirm active registration on the GST portal.",
          "inputSchema": {
            "properties": {
              "gstin": {
                "description": "15-character GSTIN, e.g. 27AAPFU0939F1ZV",
                "type": "string"
              }
            },
            "required": ["gstin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
