        {
          "name": "get_fragrance",
          "title": "Look Up a Fragrance",
          "description": "Look up one perfume or fragrance in ScentVerdict's catalogue: its notes, ScentVerdict's own verdict, concentration, launch year, and the lowest current price for a full-size bottle for the user's country, in the shop's own currency. Use this whenever the user names a fragrance and asks what it is, what it smells like, what is in it, what it costs, or whether it is any good. Use search_fragrances first if the name is partial or could mean several variants. Use get_scent_profile instead when the question is about how it develops over the wear.",
          "inputSchema": {
            "properties": {
              "country": {
                "default": null,
                "description": "The user's country as an ISO 3166-1 alpha-2 code, for example US, DE or GB. Prices are for this country, in the shop's own currency. Pass it whenever you know where the user is. When omitted, the client's location hint is used if it sent one, otherwise GB.",
                "type": ["string", "null"]
              },
              "slug": {
                "description": "The fragrance slug, for example bleu-de-chanel. Use search_fragrances if you do not have one.",
                "type": "string"
              }
            },
            "required": ["slug"],
