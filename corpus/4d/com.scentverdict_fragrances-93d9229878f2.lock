      "instructions": "ScentVerdict's catalogue holds 31,000+ perfumes and fragrances, each with ScentVerdict's own verdict, its notes, computed similarity scores against specific other fragrances, per-note drydown estimates, and current prices for full-size bottles.\n\nResolve names with search_fragrances first when a name is partial or ambiguous - many fragrances share a name across concentrations and launch years, and picking the wrong variant silently gives the wrong answer. Then pass the returned slug to the other tools.\n\nPrices are for the user's country, in the shop's own currency. Pass the user's country as an ISO code (for example US or DE) in the country argument of any tool that returns a price. Each such result carries a market object naming the country the prices are for and how it was chosen; when its source is default, the prices are for GB, so say so and ask the user where they are if it matters. A price marked fromAbroad is from a shop in another country that delivers to the user, and import charges may apply. An estimate is a conversion into the user's currency at a published reference rate, for orientation only.\n\nPrices are for full-size bottles and exclude samples and decants. A notFound result means the fragrance is not in this catalogue; it says nothing about whether the fragrance exists.",
      "tools": [
        {
          "name": "compare_fragrances",
          "title": "Compare Two Fragrances",
          "description": "Compare exactly two fragrances side by side using ScentVerdict's own note data: which notes they share, which differ, both verdicts, and both prices for the user's country. Use this whenever the user is choosing between two named fragrances, or asks which of two is better, or how two differ. Use find_similar_fragrances instead when they want alternatives to one fragrance rather than a head to head.",
          "inputSchema": {
            "properties": {
              "country": {
                "default": null,
                "description": "The user's country as an ISO 3166-1 alpha-2 code, for example US, DE or GB. Prices are for this country, in the shop's own currency. Pass it whenever you know where the user is. When omitted, the client's location hint is used if it sent one, otherwise GB.",
                "type": ["string", "null"]
              },
              "slugA": {
                "description": "Slug of the first fragrance.",
                "type": "string"
              },
              "slugB": {
                "description": "Slug of the second fragrance.",
                "type": "string"
              }
            },
            "required": ["slugA", "slugB"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "a": {
                "description": "The first fragrance.",
                "properties": {
                  "brand": {
                    "description": "Brand name.",
                    "type": "string"
                  },
                  "brandSlug": {
                    "description": "Brand slug.",
                    "type": "string"
                  },
                  "concentration": {
                    "description": "Concentration, for example Edt, Edp or Parfum. Null when unknown.",
                    "type": ["string", "null"]
                  },
                  "imageUrl": {
                    "description": "Bottle image URL. Null when we hold no image.",
                    "type": ["string", "null"]
                  },
                  "keyNotes": {
                    "description": "The most characteristic notes. May be empty.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "name": {
                    "description": "Fragrance name without the brand.",
                    "type": "string"
                  },
                  "price": {
                    "description": "Cheapest full-size bottle for the user's country, in the shop's own currency. Excludes samples and decants. Null when we hold no bottle price a shop will sell to that country.",
                    "properties": {
                      "amount": {
                        "description": "The bottle price, in Currency. This is the shop's own price, never a conversion.",
                        "type": "number"
                      },
                      "currency": {
                        "description": "ISO 4217 currency code of Amount, for example GBP, USD or EUR. The shop's own currency.",
                        "type": "string"
                      },
                      "estimate": {
                        "description": "Rough value of Amount in the user's currency, at a published reference rate. Present only when Currency differs from the user's currency and a recent rate exists. For orientation only: never use it to rank, compare or filter prices.",
                        "properties": {
                          "amount": {
                            "description": "The price converted to Currency, in whole units. Approximate.",
                            "type": "number"
                          },
                          "currency": {
                            "description": "ISO 4217 code of the user's currency.",
                            "type": "string"
                          },
                          "rateDate": {
                            "description": "Date of the reference rate used, as YYYY-MM-DD. The European Central Bank's rate, or Frankfurter's for a currency the ECB does not publish.",
                            "type": "string"
                          }
                        },
                        "required": ["amount", "currency", "rateDate"],
                        "type": ["object", "null"]
                      },
                      "excludesTax": {
                        "description": "True when the shop quotes this price before sales tax, as US shops do. Say so when you quote it.",
                        "type": "boolean"
                      },
                      "fromAbroad": {
                        "description": "True when no shop in the user's own customs area sells a bottle, so this is the cheapest bottle from a shop in another country that delivers to them.",
                        "type": "boolean"
                      },
                      "importChargesMayApply": {
                        "description": "True when the user may have to pay import charges on top of Amount. Say 'import charges may apply' when you quote it.",
                        "type": "boolean"
                      },
                      "pricePerMl": {
                        "description": "Amount divided by SizeMl, in Currency. USE THIS to compare value between fragrances priced in the same currency, never the bottle price - a small bottle can look cheap while costing far more per millilitre. Null when the size is unknown.",
                        "type": ["number", "null"]
                      },
                      "shipsFrom": {
                        "description": "ISO 3166-1 alpha-2 country the shop sells from, for example GB or US.",
                        "type": "string"
                      },
                      "sizeMl": {
                        "description": "Bottle size in millilitres that Amount applies to. 0 means the shop did not state a size.",
                        "type": "number"
                      }
                    },
                    "required": ["amount", "currency", "estimate", "excludesTax", "fromAbroad", "importChargesMayApply", "pricePerMl", "shipsFrom", "sizeMl"],
                    "type": ["object", "null"]
                  },
                  "scentArtUrl": {
                    "description": "ScentArt visual URL, generated from this fragrance's own composition. Null when not yet rendered.",
                    "type": ["string", "null"]
                  },
                  "slug": {
                    "description": "Stable identifier. Pass this to other tools.",
                    "type": "string"
                  },
                  "url": {
                    "description": "Canonical page URL, carrying the interactive scent wheel, drydown timeline and full descriptor profile.",
