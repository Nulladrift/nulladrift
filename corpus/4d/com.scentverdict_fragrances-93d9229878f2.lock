        {
          "name": "find_similar_fragrances",
          "title": "Find Similar Fragrances",
          "description": "Find fragrances similar to one the user already knows, optionally steered in a direction such as cheaper, fresher, longer lasting or less sweet. Use this whenever the user names a fragrance and wants something like it: a cheaper alternative, a budget version, something that smells similar, or a gift for someone whose current fragrance they know ('he wears X, what else would suit him'). Each match carries a similarity score computed by ScentVerdict for that specific pair. The cheaper direction lists pairings ScentVerdict has curated first, then similar fragrances priced below the anchor where we hold its price. Each match carries its bottle price for the user's country, in the shop's own currency. Use recommend_fragrances instead when the user names no fragrance to anchor on.",
          "inputSchema": {
            "properties": {
              "anchorSlug": {
                "description": "Slug of the fragrance to anchor on. Use search_fragrances first if you do not have one.",
