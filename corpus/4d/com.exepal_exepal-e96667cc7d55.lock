      "instructions": "Exepal keeps AI agents safe when they read things they did not write. safe_read ($0.005): web page or PDF to clean markdown with text hidden from humans removed and a prompt-injection verdict; use it by default for any page you did not write. guard ($0.001): one check for prompt injection, leaked secrets and personal data in a tool result, email or document, with an allow/review/block decision and a safe copy; cheap enough for every step. scan_injection ($0.002): hidden instructions and prompt-injection in a page, document or tool result. scan_secrets ($0.002): leaked API keys, tokens and private keys in text. scan_pii ($0.002): emails, phones, cards, bank and government IDs in text, with a redacted copy. scan_mcp ($0.005): audit a remote MCP server for tool poisoning and unsafe tools before connecting. scan_rules ($0.002): check CLAUDE.md, AGENTS.md, .cursorrules and agent config files for hidden text, data-leak commands and safety bypasses. skill_check ($0.005): before installing an OpenClaw / ClawHub, Claude Code or Codex skill, scan it for malware set-up steps, credential theft and hidden instructions. agent_ready ($0.005): can AI assistants find, read and cite a website. seo_report ($0.50), seo_keywords ($0.05), seo_rank ($0.10, Google or Bing) and seo_gap ($0.10): Google traffic, keywords, rankings and competitors for a website. rivals ($0.50): a website next to up to 3 competitors with concrete changes and copy-paste fix prompts for AI builders. name_check ($0.02): is a business or startup name free as domains, handles and trademarks. Also: read ($0.005, page or PDF to markdown without the safety pass), domain ($0.005: DNS, email security, registrar, tech) and South Asia utilities ($0.001: Bikram Sambat dates, Nepali numbers and words, NP/IN phone checks, GSTIN/PAN/Aadhaar/IFSC checks, Nepal Rastra Bank exchange rates). Free public feed of real prompt injections found in MCP servers: https://exepal.com/injection-feed. Each tool call has a fixed USD price. The cheap tools ($0.005 and under) include 20 free calls per day; a free personal key from https://exepal.com/key (add ?key=<key> to the server URL) gives each person their own 20. After that, calls are paid from prepaid card credit on the same key ($5, $20 or $50 at https://exepal.com/key?from=mcp-instructions#buy). Failed calls are not charged. Docs: https://exepal.com/docs",
