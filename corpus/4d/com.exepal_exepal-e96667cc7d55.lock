        {
          "name": "agent_ready",
          "title": "Agent-readiness check",
          "description": "Agent-readiness check for a website: robots.txt access for 19 AI crawlers (search, assistant and training bots from OpenAI, Anthropic, Google, Perplexity, Apple, Meta and others), sitemap, llms.txt, server-rendered text, structured data, meta robots and agent endpoints (MCP server card, A2A agent card, x402, OpenAPI), with a 0-100 score, grade and fixes. Use when someone asks whether AI assistants (ChatGPT, Claude, Perplexity, Gemini) can find, read and cite their site, why they do not show up in AI answers, whether they block AI crawlers, or before an agent crawls a site to see which bots it allows. Pass domain (a URL or email is reduced to its host). Returns score 0-100, grade A-F, checks[] {id, label, pass, points, max, detail}, robots {bots[] {bot, company, purpose (search, user-fetch, training), access (allowed, partial, blocked)}, summary, sitemaps, contentSignals}, sitemap, llmsTxt, homepage {wordCount, needsJs, structuredData, metaRobots}, agentEndpoints, liveFetch (home page loaded as Chrome and as ChatGPT-User, OAI-SearchBot, Claude-User, PerplexityBot, Perplexity-User; blockedBots lists bots a firewall turns away) and plain-language recommendations[]. Fetches the site directly; not charged when the site does not answer. For DNS and email security use domain; for whether AI assistants actually recommend the brand use ai_visibility_quick. Price: $0.005 per call from Exepal credit; not charged if the call fails. Includes free daily calls.",
