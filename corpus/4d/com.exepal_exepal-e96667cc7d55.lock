              "text": {
                "description": "The content to check: a tool result, email, document, message or upload (up to 500,000 characters)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "decision": {
                "description": "allow, review or block",
                "type": "string"
              },
              "injection": {
                "properties": {
                  "findings": {
                    "description": "Most severe first, up to 10",
                    "items": {
                      "properties": {
                        "evidence": {
                          "description": "Up to 240 characters of the offending text",
                          "type": "string"
