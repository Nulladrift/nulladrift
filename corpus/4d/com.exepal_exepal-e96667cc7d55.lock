                "description": "Personal data types to check (default all: email, phone, credit-card, iban, aadhaar, india-pan, us-ssn, uk-nino, nepal-citizenship, passport, date-of-birth, ip-address, crypto-address). Pass [] to skip the personal data check",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "redact": {
                "description": "Return safeText with hidden text, secrets and personal data removed (default true)",
