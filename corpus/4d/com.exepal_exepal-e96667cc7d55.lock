        "title": "Exepal",
        "version": "1.1.0",
        "description": "Safety tools for AI agents: read web pages and PDFs with hidden instructions removed, scan text, MCP servers and rules files for prompt injection, secrets and personal data. Plus domain intel and South Asia utilities. 20 free calls a day.",
        "websiteUrl": "https://exepal.com/integrate",
