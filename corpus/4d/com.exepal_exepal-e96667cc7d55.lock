        {
          "name": "scan_rules",
          "title": "Agent rules-file scanner",
          "description": "Rules-file scanner: checks CLAUDE.md, AGENTS.md, .cursorrules, .cursor/rules, copilot-instructions.md, GEMINI.md, .windsurfrules, .clinerules, .mcp.json and .claude/settings.json for hidden Unicode instructions (the rules-file backdoor), hidden comments, remote-code and data-leak commands, safety bypasses, planted scripts, risky URLs and leaked secrets; up to 20 files per call. Use before trusting or committing an agent instruction or config file you did not write: a cloned repo's CLAUDE.md or AGENTS.md, a .cursorrules from a template site, a shared .mcp.json or .claude/settings.json, or a pull request that edits one. Pass text (+ path) for one file, files[] {path, text} for up to 20, or url for a raw file. Ordinary rules-file content is expected and not flagged; only hidden text, data leaks, curl|sh, skip-permission flags, credential access, planted <script> tags, silent changes, risky URLs (webhook collectors, tunnels, paste sites, shorteners, raw IPs) and secrets are. Returns verdict (clean, review, dangerous), score 0-100 (higher is riskier), files[] {path, fileType, verdict, score, findings[] {rule, severity, message, evidence, line, location}, hidden, urls[], secrets, clean (the text with invisible characters removed)} and summary. Nothing is stored. Price: $0.002 per call from Exepal credit; not charged if the call fails. Includes free daily calls.",
          "inputSchema": {
            "properties": {
              "files": {
                "description": "Instead of text: up to 20 files {path, text}, e.g. every agent file in a repo (2,000,000 characters in total)",
                "items": {
                  "properties": {
                    "path": {
                      "description": "File name or path",
                      "pattern": "^[^\\u0000-\\u001f]{1,300}$",
                      "type": "string"
                    },
                    "text": {
                      "description": "File content",
                      "type": "string"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "path": {
                "description": "Its file name or path, e.g. CLAUDE.md, AGENTS.md, .cursorrules, .cursor/rules/style.mdc, .github/copilot-instructions.md, .mcp.json or .claude/settings.json; picks the file type",
                "pattern": "^[^\\u0000-\\u001f]{1,300}$",
                "type": "string"
              },
              "text": {
                "description": "Content of one rules or agent-config file (up to 500,000 characters)",
                "type": "string"
              },
              "url": {
                "description": "Instead of text: a public raw file URL, e.g. https://raw.githubusercontent.com/owner/repo/main/CLAUDE.md",
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "files": {
                "description": "One entry per file, in input order",
                "items": {
                  "properties": {
                    "clean": {
                      "description": "The content with invisible Unicode removed; only when it differs from the input",
                      "type": "string"
                    },
                    "fileType": {
                      "description": "claude-md, agents-md, cursor-rules, copilot-instructions, windsurf-rules, gemini-md, cline-rules, mcp-config, claude-settings or unknown",
                      "type": "string"
                    },
                    "findings": {
                      "description": "Most severe first, up to 100",
                      "items": {
                        "properties": {
                          "evidence": {
                            "description": "Up to 200 characters; hidden text decoded, secrets masked",
                            "type": "string"
                          },
                          "line": {
                            "description": "1-based",
                            "type": "number"
                          },
                          "location": {
                            "description": "visible, or where the hidden text sat: unicode-tags, zero-width, bidi-override, html-comment, css-hidden...",
                            "type": "string"
                          },
                          "message": {
                            "type": "string"
                          },
                          "rule": {
                            "description": "e.g. hidden-unicode-tags, remote-code, disable-safety, credential-access, planted-script, silent-change, exfiltrate, url-webhook-collector, secret",
                            "type": "string"
                          },
                          "severity": {
                            "description": "low, medium or high",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "hidden": {
                      "properties": {
                        "chars": {
                          "type": "number"
                        },
                        "kinds": {
                          "description": "Count per hidden kind",
                          "type": "object"
                        },
                        "segments": {
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "path": {
                      "type": "string"
                    },
                    "score": {
                      "description": "0-100, higher is riskier",
                      "type": "number"
                    },
                    "secrets": {
                      "properties": {
                        "count": {
                          "type": "number"
                        },
                        "types": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "type": "object"
                    },
                    "stats": {
                      "properties": {
                        "chars": {
                          "type": "number"
                        },
                        "lines": {
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "urls": {
                      "description": "Up to 100",
                      "items": {
                        "properties": {
                          "flag": {
                            "description": "raw-ip, shortener, paste-site, tunnel, webhook-collector, chat-webhook or plain-http; absent when nothing stands out",
                            "type": "string"
                          },
                          "host": {
                            "type": "string"
                          },
                          "line": {
                            "type": "number"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "verdict": {
                      "description": "clean, review or dangerous",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "finalUrl": {
                "type": "string"
              },
              "score": {
                "description": "Highest file score, 0-100, higher is riskier",
                "type": "number"
              },
              "summary": {
                "type": "string"
              },
              "url": {
                "description": "Present when a url was fetched",
                "type": "string"
              },
              "verdict": {
                "description": "Worst verdict across files: clean, review or dangerous",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Agent rules-file scanner"
          },
          "behavior": {
