{
  "lockfileVersion": 2,
  "subjects": {
    "com.sarmkadan/aihub": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aihub.sarmkadan.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "aihub",
        "title": "AI Startup Hub",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {}
      },
      "tools": [
        {
          "name": "get_product",
          "description": "Get one product by slug.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Product slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8cbf15adc9659ef5448324cdd94cdbb27c481d59ef4887cd4498ccef039ec162"
        },
        {
          "name": "list_products",
          "description": "Browse the catalog, newest first or by popularity, optionally filtered by category.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": null,
                "description": "Optional category filter",
                "type": ["string", "null"]
              },
              "page": {
                "default": 1,
                "description": "1-based page",
                "type": "integer"
              },
              "pageSize": {
                "default": 20,
                "description": "Items per page, 1-50",
                "type": "integer"
              },
              "sortBy": {
                "default": "newest",
                "description": "newest or popular",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dfc8f88dac11d4375c4cc8f308127db3ea95f465b871a312c289caa594c72e57"
        },
        {
          "name": "search_products",
          "description": "Full-text search over product names, descriptions and tags. Ordered by upvotes.",
          "inputSchema": {
            "properties": {
              "page": {
                "default": 1,
                "description": "1-based page",
                "type": "integer"
              },
              "pageSize": {
                "default": 20,
                "description": "Items per page, 1-50",
                "type": "integer"
              },
              "query": {
                "description": "Search text",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2d080345a5bedf6c5540c593132341721dea653b2c650e19aa3ca86c3cf5e4cd"
        },
        {
          "name": "submit_product",
          "description": "List a product, tool or website in the AI Startup Hub directory. Returns the slug and the URL of a server-rendered, indexable page that carries a dofollow backlink to the submitted url. The url must be publicly reachable. No API key needed; limit 10 submissions per hour per IP, 3 products per host.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": null,
                "description": "One lowercase category, e.g. ai, developer-tools, saas, open-source, api, automation",
                "type": ["string", "null"]
              },
              "description": {
                "default": null,
                "description": "One or two sentences on what the product does, max 5000 chars",
                "type": ["string", "null"]
              },
              "name": {
                "description": "Product name, max 200 chars",
                "type": "string"
              },
              "tags": {
                "default": null,
                "description": "Up to 10 lowercase tags",
                "items": {
                  "type": ["string", "null"]
                },
                "type": ["array", "null"]
              },
              "url": {
                "description": "Public http(s) URL of the product homepage",
                "type": "string"
              }
            },
            "required": ["name", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:295940670dceb67b40ba4569e71e8a7d3992b198cd2cf452140aaa1bd395fd98"
        },
        {
          "name": "upvote_product",
          "description": "Upvote a product. One vote per IP per product.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Product slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d0cb4c64c20afd2392f82a808723bd72495afee604e49439e640f9f90c6a06ce"
        }
      ],
      "digest": "sha256:b50ae65b51838297708bf486d32e4102c367484fcb49ea728a0f47ea3988a89e"
    }
  }
}
