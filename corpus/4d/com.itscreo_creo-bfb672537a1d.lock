{
  "lockfileVersion": 2,
  "subjects": {
    "com.itscreo/creo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://itscreo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "creo-factor-exposure",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Creo scores portfolios for named factor exposures. Call score_demo_portfolio for a first result, or score_portfolio with your own daily closes. list_factors shows how much history each factor needs. Only successful scoring costs a credit. Customers bring prices; Creo does not publish vendor market data.",
      "tools": [
        {
          "name": "list_factors",
          "description": "List factor ids, the daily closes each needs, the demo tickers and the methodology version. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:63f0a759513e9f184bd681c6b856a4aad0011aa2b70c884e736913856ca9b305"
        },
        {
          "name": "mint_api_key",
          "description": "Create a free API key (100 scoring calls a day, 5 positions). Free; limited to 5 keys per IP per day. The key is shown once. Put it in your MCP client config as the x-api-key header, or pass it as the api_key argument of the scoring tools for the rest of this session.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:94ac51fbfd3405b08a303bf130da05ece3d04a22441b0eaa4f94b9435284a8ee"
        },
        {
          "name": "score_demo_portfolio",
          "description": "Score the five labeled SYNTH.* demo tickers. Synthetic series, not market data. Works without a key. Costs 1 credit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Optional. Your creo_ key, for clients that can't set the x-api-key header after connecting (for example right after mint_api_key). Prefer the header.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1af8654e6dd5c4f851a82ca55b90a281efebd1d453e81c8a76f1fd9693d7db9f"
        },
        {
          "name": "score_portfolio",
          "description": "Compute named factor exposures and risk contribution for positions. You must supply daily close history (volume for liquidity, market_cap for size, benchmark for beta). Creo never fetches prices. Missing exposures stay null with a reason. Needs a key unless every position is a SYNTH.* ticker without history. Costs 1 credit when it succeeds; errors are free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Optional. Your creo_ key, for clients that can't set the x-api-key header after connecting (for example right after mint_api_key). Prefer the header.",
                "type": "string"
              },
              "benchmark": {
                "additionalProperties": false,
                "description": "Market series for beta, e.g. SPY closes. Without it beta is null with MISSING_BENCHMARK.",
                "properties": {
                  "history": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "close": {
                          "description": "Close price in USD.",
                          "type": ["string", "number"]
                        },
                        "date": {
                          "description": "YYYY-MM-DD",
                          "format": "date",
                          "type": "string"
                        },
                        "volume": {
                          "description": "Units traded; needed for liquidity.",
                          "type": ["string", "number"]
                        }
                      },
                      "required": ["close", "date"],
                      "type": "object"
                    },
                    "minItems": 2,
                    "type": "array"
                  },
                  "ticker": {
                    "type": "string"
                  }
                },
                "required": ["history"],
                "type": "object"
              },
              "cash": {
                "description": "Cash in USD, part of NAV.",
                "type": ["string", "number"]
              },
              "factors": {
                "description": "Default: all factors for the asset classes present.",
                "items": {
                  "enum": ["equity.market_beta.ewma.252", "equity.size.log_mcap", "equity.momentum.total_return.12_1", "equity.low_volatility.ewma.63", "equity.liquidity.amihud.63", "crypto.market_beta.ewma.180", "crypto.momentum.total_return.180_30", "crypto.low_volatility.ewma.30", "crypto.liquidity.amihud.30", "equity.value.book_to_price.sec", "equity.investment.asset_growth.sec", "equity.quality.gross_profitability.sec", "equity.quality.return_on_assets.sec"],
                  "type": "string"
                },
                "type": "array"
              },
              "positions": {
                "description": "quantity > 0 is long, < 0 is short.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "asset_class": {
                      "enum": ["equity", "crypto"],
                      "type": "string"
                    },
                    "close": {
                      "description": "Valuation close in USD.",
                      "type": ["string", "number"]
                    },
                    "history": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "close": {
                            "description": "Close price in USD.",
                            "type": ["string", "number"]
                          },
                          "date": {
                            "description": "YYYY-MM-DD",
                            "format": "date",
                            "type": "string"
                          },
                          "volume": {
                            "description": "Units traded; needed for liquidity.",
                            "type": ["string", "number"]
                          }
                        },
                        "required": ["close", "date"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "market_cap": {
                      "description": "USD; needed for size.",
                      "type": ["string", "number"]
                    },
                    "quantity": {
                      "description": "Signed units, non-zero.",
                      "type": ["string", "number"]
                    },
                    "ticker": {
                      "type": "string"
                    }
                  },
                  "required": ["quantity", "ticker"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "universe": {
                "enum": ["client_supplied", "demo_synthetic"],
                "type": "string"
              },
              "valid_at": {
                "description": "UTC cutoff ending in Z; later bars are ignored.",
                "format": "date-time",
                "type": "string"
              }
            },
            "required": ["positions"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de9514076406f37059b16147b616e102cf191f18742aa8b5d7b52e796caedc48"
        }
      ],
      "digest": "sha256:feba6e66742088232eab3d2b8420788a0db4833456082a90d091d0ae638ac462"
    }
  }
}
