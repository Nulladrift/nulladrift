{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kwekuanansi/ghana-numbers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kwekuanansi.ai/mcp/ghana-numbers"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "kweku-anansi-ghana-numbers",
        "title": "Ghana in Numbers",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ghana in Numbers answers how many people live in Ghana, its 16 regions and its districts, by age band, sex and schooling, and what share of people in a place use mobile money. Every figure is from Ghana's 2021 Population and Housing Census; say so, and say 2021. It has no income, spending, opinion or forecast data, and nothing outside Ghana: say that plainly rather than estimating. When a place name is unclear, call ghana.list_places first.",
      "tools": [
        {
          "name": "ghana.count_people",
          "title": "Count people in Ghana",
          "description": "Use this when someone wants to know how many people live in Ghana, one of its regions or one of its districts, optionally narrowed by age band, sex or schooling: for example to size a market, an audience or a programme. Counts come from Ghana's 2021 Population and Housing Census. Do not use it for other countries, for years other than 2021, for income or spending, or for forecasts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age_band": {
                "description": "Age band in years. Leave out for all ages.",
                "enum": ["0-14", "15-24", "25-44", "45-64", "65+"],
                "type": "string"
              },
              "district": {
                "description": "A district, for example \"Kumasi Metropolitan\" or \"Ho Municipal\". A city name such as \"Tamale\" is matched to its district.",
                "maxLength": 80,
                "type": "string"
              },
              "region": {
                "description": "One of Ghana's 16 regions, for example \"Ashanti\" or \"Greater Accra\". Leave out for all of Ghana.",
                "maxLength": 60,
                "type": "string"
              },
              "schooling": {
                "description": "never_attended = never attended school; some_school = attended school at any level. Leave out for both.",
                "enum": ["never_attended", "some_school"],
                "type": "string"
              },
              "sex": {
                "description": "Leave out for both.",
                "enum": ["female", "male"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "by_age_band": {
                "type": "object"
              },
              "by_schooling": {
                "type": "object"
              },
              "by_sex": {
                "type": "object"
              },
              "coverage_note": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "group": {
                "type": "string"
              },
              "people": {
                "type": "integer"
              },
              "source": {
                "type": "string"
              },
              "year": {
                "type": "integer"
              }
            },
            "required": ["group", "people", "source", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:22b636a719821537a9dd5731386b868bec2505b732e61a5980891cd23fed6898"
        },
        {
          "name": "ghana.list_places",
          "title": "List Ghana regions and districts",
          "description": "Use this when you need the exact name of a Ghana region or district before counting people there, or when someone asks which districts are in a region. Do not use it for towns, villages or addresses: the list holds regions and districts only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "region": {
                "description": "A region, to list its districts. Leave out to list the 16 regions.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "districts": {
                "type": "array"
              },
              "region": {
                "type": "string"
              },
              "regions": {
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6cf80e2e742c11139223c0597e8dad9842324812ce78e9b39ca7bb34d1b900a4"
        },
        {
          "name": "ghana.mobile_money_reach",
          "title": "Mobile money reach in Ghana",
          "description": "Use this when someone asks what share of people in Ghana, one of its regions or one of its districts use mobile money, or wants to compare mobile-money use between two regions. The figure is the share of people aged 6 and over who used a mobile phone for financial transactions in the 2021 census. Do not use it for a breakdown by age or sex (the census table has none), for transaction values, for a named provider's customer numbers, for years other than 2021, or for other countries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compare_region": {
                "description": "A second region to compare with, for example \"Northern\".",
                "maxLength": 60,
                "type": "string"
              },
              "district": {
                "description": "A district, for example \"Kumasi Metropolitan\" or \"Ho Municipal\". A city name such as \"Tamale\" is matched to its district.",
                "maxLength": 80,
                "type": "string"
              },
              "region": {
                "description": "One of Ghana's 16 regions, for example \"Ashanti\" or \"Greater Accra\". Leave out for all of Ghana.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "compared_with": {
                "type": "object"
              },
              "definition": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "people_all_ages": {
                "type": "integer"
              },
              "place": {
                "type": "string"
              },
              "share_using_mobile_money": {
                "type": "number"
              },
              "source": {
                "type": "string"
              },
              "year": {
                "type": "integer"
              }
            },
            "required": ["definition", "people_all_ages", "place", "share_using_mobile_money", "source", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e112e7d95c23a584ce4c11e275ca8656fc8e0e5d244e9cf361628426bf832287"
        }
      ],
      "digest": "sha256:4d4f10ce83a658af4ed7e9357d788ccb770654aa90cd6023477a38c2c0fda3ee"
    }
  }
