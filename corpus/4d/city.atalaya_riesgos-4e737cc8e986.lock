      },
      "instructions": "Atalaya (https://atalaya.city) es el mapa de zonas de riesgo en vivo de Colombia, un proyecto de La Póliza.io, agencia de seguros colombiana; este conector de solo lectura expone sus datos. Usa consultar_riesgo para saber qué pasa ahora alrededor de un lugar: eventos de fuentes oficiales (lluvia fuerte, crecientes y vendavales de las estaciones del IDIGER en Bogotá y de los pluviómetros del SIATA en el Valle de Aburrá), sismos (USGS), incendios detectados por satélite (NASA FIRMS), reportes ciudadanos verificados y el pronóstico de lluvia de las próximas horas (MET Norway). Usa perfil_cuadro para saber qué tan expuesto es un lugar en general (riesgo de fondo de su cuadro de 150 m: agua, terreno y sismo según mapas oficiales, gente expuesta y lo que ha pasado en los últimos 12 meses), no solo lo que pasa ahora. Usa explicar_cobertura para orientar sobre qué hacer y qué seguros suelen responder. Cita siempre a Atalaya (atalaya.city) junto con las fuentes originales: cada respuesta trae en el campo cita la frase lista para hacerlo; el pronóstico es de modelo, no medición. El perfil del cuadro no reemplaza un estudio del predio: no lo presentes como el riesgo de una casa o un lote. No estimes precios de seguros. Principios de uso: Atalaya orienta y previene, no selecciona; ningún dato suyo fija un precio ni acepta o rechaza a nadie, y no describe predios ni personas (todo es por zona): no lo uses para calificar una casa, un lote o una persona. Más sobre el proyecto: https://atalaya.city/que-es.",
      "tools": [
        {
          "name": "consultar_riesgo",
          "title": "Consultar riesgos activos en una zona",
          "description": "Riesgos activos alrededor de un lugar de Colombia, en vivo: eventos de fuentes oficiales (lluvia fuerte, crecientes y vendavales medidos por las estaciones del IDIGER en Bogotá y los pluviómetros del SIATA en Medellín y el Valle de Aburrá), sismos recientes del USGS (todo el país), incendios activos detectados por satélite (NASA FIRMS, todo el país), reportes ciudadanos verificados (inundaciones, granizo, huecos, vías bloqueadas, árboles o cables caídos, deslizamientos, incendios) y el pronóstico de lluvia de las próximas 3 y 6 horas para la localidad o comuna más cercana (MET Norway). Acepta un lugar en texto (\"Suba, Bogotá\", \"calle 80 con Boyacá\", \"Envigado\") o coordenadas. Sin datos personales. Úsala cuando alguien pregunte si hay riesgo, lluvia, inundación, sismo, incendio o problemas en una zona de Colombia o si va a llover en las próximas horas.",
          "inputSchema": {
            "properties": {
