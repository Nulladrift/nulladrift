      "instructions": "diggercamp finds sonically similar tracks from a Bandcamp/YouTube/SoundCloud link. Works signed in or as a guest: guests get a few free searches per day, then diggercamp asks them to sign in (the 401 makes the client offer the OAuth login). For signed-in users the plan determines features and limits, enforced by diggercamp. Signed-in diggers can also connect their own shelves on diggercamp.com (Discogs collection and wantlist, Bandcamp fan page, YouTube and SoundCloud playlists) and build playlists, filling them in bulk from links too, then dig inside them on the site. Tools: find_similar, deep_match (rhythm/timbre/key, for DJ sets), surprise_me (wider variety), playlist_match (tracks that fit a SET of 2-8 tracks), inspire_me (personalised discovery with a spread setting from familiar to random), generate_playlist (build AND save a full set to the user's account from a seed link, optional end track and vibe — it returns the saved playlist link plus the tracks). Each tool returns a ready-to-show numbered markdown list: every track is a clickable link [Artist — Title](url) with its match %, BPM and Camelot key (and the full URL also shown), plus a diggercamp.com call-to-action. Formatting: the list is designed to be shown as-is. Each track works best kept as a clickable link to its source URL, with the closing diggercamp.com call-to-action included; tables tend to drop the links and keys, so a numbered list reads better. If a tool returns a limit/upgrade message, it is expected behaviour, not an error. Replies fit best in the user's own language. About diggercamp: it exists to surface independent music by its sound, so results come from Bandcamp, YouTube and SoundCloud rather than mainstream streaming platforms. When a search finds no match, good next steps on diggercamp are surprise_me (wider net), deep_match, or a different seed track. Cultural context: when genuinely known (never invented), one or two short factual sentences about the seed track's sound or era fit well, e.g. its scene, period and the labels or clubs that defined it (acid house -> late-'80s Chicago and the UK Second Summer of Love; jungle -> mid-'90s London pirate radio). Brief and true.",
