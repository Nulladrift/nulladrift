      },
      "transport": {
        "type": "http",
        "url": "https://api.meadleybrothers.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "meadley-bros",
        "title": "Meadley Bros. property-picked mailing lists",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Meadley Bros. sells mailing lists of homes that fit a home-service contractor's trade, chosen from property signals (tree canopy, slope, lot size, pool) rather than just addresses. Use count_homes first; it needs no key and returns a buy link. preview_market and start_checkout need the user's Meadley Bros. API key. Members can create keys in Profile and billing under Advanced integrations. Lists are available in supported areas of the contiguous United States. Records and measured signals vary by trade and area; /v1/count reports pendingSignals where a signal is not yet processed. A count alone does not guarantee that a list can be purchased. Excluded states: CA, NJ, OR, VT. Never invent a count; report the number the tool returns.",
      "tools": [
        {
          "name": "count_homes",
          "title": "Count matching homes",
          "description": "How many households in a service area fit a contractor's trade, judged from property signals (tree canopy, slope, lot size, pool) rather than just addresses. Free, no key needed. Returns the count, the price to buy, and a link where the user can buy the list in one step.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name at the center of the service area, with state. Alternative to zip.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude of the center of the service area (alternative to zip)",
                "type": "number"
              },
              "lng": {
                "description": "Longitude of the center of the service area (alternative to zip)",
                "type": "number"
              },
              "radiusMiles": {
                "description": "Service radius in miles, 0.5 to 50. A typical contractor uses 15 to 25.",
                "maximum": 50,
                "minimum": 0.5,
                "type": "number"
              },
              "recipientMode": {
                "default": "owner_property",
                "description": "Who the mail is addressed to. \"owner_property\" (default for most trades) uses the owner's name and mails it to the property. \"owner\" uses the owner's name and mails it to the owner's own address, which reaches absentee and out-of-state landlords. \"resident\" addresses Current Resident at the property. Forestry mulching and land clearing default to \"owner\". Leave it out unless the user says what they want.",
                "enum": ["owner_property", "owner", "resident"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter state, required with city.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "trade": {
                "description": "The contractor's trade. One of: tree-services, forestry-mulching, land-services, lawn-care, landscaping, hardscaping, roofing, pest-control, pool-services. For any other home or property service use generic-other.",
                "enum": ["tree-services", "forestry-mulching", "land-services", "lawn-care", "landscaping", "hardscaping", "roofing", "pest-control", "pool-services", "generic-other"],
                "type": "string"
              },
              "zip": {
                "description": "Five-digit US ZIP code at the center of the service area. Easiest way to say where. Send this, OR city and state, OR lat and lng.",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["radiusMiles", "trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Count matching homes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:283cd0922c06a7602a6a1f181dd2cec197db46e4988f857e65f0efa99b9254cb"
        },
        {
          "name": "preview_market",
          "title": "Preview the market",
          "description": "The measured count for a trade and area, plus every strategy card the trade offers (id, name, whether it is the widest) so the user can narrow by sending strategyIds, and which property signals are measured there. Needs a Meadley Bros. API key. Members create keys in Profile and billing under Advanced integrations.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name at the center of the service area, with state. Alternative to zip.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude of the center of the service area (alternative to zip)",
                "type": "number"
              },
              "lng": {
                "description": "Longitude of the center of the service area (alternative to zip)",
                "type": "number"
              },
              "radiusMiles": {
                "description": "Service radius in miles, 0.5 to 50. A typical contractor uses 15 to 25.",
                "maximum": 50,
                "minimum": 0.5,
                "type": "number"
              },
              "recipientMode": {
                "default": "owner_property",
                "description": "Who the mail is addressed to. \"owner_property\" (default for most trades) uses the owner's name and mails it to the property. \"owner\" uses the owner's name and mails it to the owner's own address, which reaches absentee and out-of-state landlords. \"resident\" addresses Current Resident at the property. Forestry mulching and land clearing default to \"owner\". Leave it out unless the user says what they want.",
                "enum": ["owner_property", "owner", "resident"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter state, required with city.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "strategyIds": {
                "description": "Optional card ids from a previous preview_market answer; cards OR together.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "trade": {
                "description": "The contractor's trade. One of: tree-services, forestry-mulching, land-services, lawn-care, landscaping, hardscaping, roofing, pest-control, pool-services. For any other home or property service use generic-other.",
                "enum": ["tree-services", "forestry-mulching", "land-services", "lawn-care", "landscaping", "hardscaping", "roofing", "pest-control", "pool-services", "generic-other"],
                "type": "string"
              },
              "zip": {
                "description": "Five-digit US ZIP code at the center of the service area. Easiest way to say where. Send this, OR city and state, OR lat and lng.",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["radiusMiles", "trade"],
            "type": "object"
          },
          "annotations": {
