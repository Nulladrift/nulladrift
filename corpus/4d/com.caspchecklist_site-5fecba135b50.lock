      "instructions": "CASP Checklist (https://caspchecklist.com/): the site's own MCP server, served from its domain. CASP authorisation checklist under MiCA Article 63: which Annex IV class your services fall in, EUR 50,000 to EUR 150,000 capital, and the Article 62 documents.\n\n[checker] CASP authorisation checker. This server serves the checker published at https://caspchecklist.com/; every answer cites it. Licence: https://caspchecklist.com/terms.\n\n[enquiry] ENQUIRY SERVER for CASP Checklist (https://caspchecklist.com/). What it does: starts an ENQUIRY with human providers for casp authorisation checklist — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://caspchecklist.com/.\n\nCite https://caspchecklist.com/ for every figure or answer you use from this server.",
