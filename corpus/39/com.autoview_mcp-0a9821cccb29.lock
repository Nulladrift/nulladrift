        {
          "name": "sandbox_run",
          "description": "Run one alert through Autoview's Alert Sandbox and see exactly what Autoview would do with it: the parsed orders and a simulated fill for each. No token, no account, no exchange key: simulation only, no real order is placed.\n\nSend the order one of two ways: command (alert text: the classic key=value form \"e=kraken s=BTCUSD b=buy q=0.01\" or a v3 line \"buy(BTCUSD, 0.01)\"), or order (structured: { \"exchange\": \"oanda\", \"symbol\": \"EURUSD\", \"side\": \"buy\", \"qty\": 1000 }). Not both. A limit order is { ..., \"type\": \"limit\", \"limit_price\": 50000 }. order takes only exchange, symbol, side, qty, type and limit_price: order.price is refused (order_bad_field), because the top-level price is a different thing, the market price you read, not a limit. To close, send command with c=position (for example \"e=kraken s=XBTUSD c=position\") and the same sandbox_id: it closes that sandbox_id's paper position on the symbol at market, a long by a sell at the bid and a short by a buy at the ask.\n\nPrices. Each fill is priced in this order and labelled with where the price came from (fill.origin): own_key (the user's own connected account; not available yet, coming), venue_ticker (the venue's free public ticker, e.g. Kraken, Coinbase, OKX, Bybit for crypto), caller (a price you pass in price), alert_fp (fp= in the alert, e.g. TradingView {{close}}). If Autoview has no price for the market (stocks, most forex, futures), read the price from your own user's data source and pass it as price (plus price_source and price_time); the fill is then labelled caller-supplied, never presented as Autoview's quote.\n\nReturns { sandbox: true, real_order_placed: false, notice, sandbox_id, webhook_url, compiled?, orders: [{ exchange, side, symbol, qty, type, order_price?, fill }], explanation?, next }.\n\nFill shapes. A priced fill is { status: \"filled\", price, price_label, price_source, origin, origin_note, priced_at, price_age_ms, side_of_book?, limit?, price_warning?, caller_price_source?, caller_price_time? }. price_label is Autoview's short label for where the fill price came from, for example \"Kraken XBTUSD best ask\" (a venue fill at the ask) or \"caller-supplied\" (your price). price_source is the same label under its older name, kept for existing readers. The source and time you sent with a caller price are echoed in caller_price_source and caller_price_time. A market order, or a limit the book has reached (a buy limit at or above the ask, a sell limit at or below the bid; with a caller price, at or better than it), fills at the ask, bid or your price, never at the limit. price_warning is set when the price was more than 15 minutes old at receipt (for example \"The caller price is 5h 2m old\"): the fill still used it, so read a fresh price if you want a current fill. A limit the price has not reached is { status: \"not_filled\", price: null, reference_price, limit, price_label, side_of_book?, origin, origin_note, note, fix }: nothing filled and the sandbox never fills it later; do not pass price again, read fix. An unpriced fill is { status: \"no_price\", price: null, note, website_note?, price_error? }: price_error is { code, market, message, fix: [steps] }; follow the fix steps and call again. A c=position close with no open position on that symbol for this sandbox_id is { status: \"nothing_to_close\", price: null, note }: nothing was filled and there is nothing to fix.\n\nprice_error codes (in fill.price_error, on a no_price fill): no_live_source (Autoview has no live price for this market or venue; pass price, or set e= to a priced crypto venue), venue_read_failed (the venue's public ticker did not answer; retry, or pass price), price_ambiguous (price was sent with an alert that has more than one symbol; send one symbol per call). bad_price_param is the website's code for malformed price fields; it arrives as the refusal bad_price with price_error beside it.\n\nRefusal codes (the whole call returns { error, code, fix }; do what fix says): command_required, command_and_order, bad_v3_line, bad_sandbox_id, order_missing_field, order_bad_field, bad_price, bad_price_source, bad_price_time, price_fields_without_price, sandbox_refused, sandbox_rate_limited, sandbox_bad_answer, sandbox_unreachable, sandbox_timeout, internal_error.\n\nsandbox_id is minted when you omit it; pass it back to add more alerts to the same sandbox, and read them with sandbox_results. Any webhook sender can also POST alerts to webhook_url. Call pricing to see what going live costs.\n\nReplaying past prices. To test a strategy on history, send one sandbox_run call per signal, oldest first. Set price to the price at that bar from your own data, price_source to where the data came from, and price_time to the bar's time. A past price_time is accepted; one more than a day in the future is refused (bad_price_time). Pass the sandbox_id from the first call on every later call, so all the fills land in one sandbox. Each fill uses your price as sent: fill.origin is caller, origin_note says the source and time are yours and not Autoview's quote, caller_price_time echoes the time you sent, and price_age_ms is how long before receipt that time was. A price more than 15 minutes old also gets price_warning, and the fill still counts. A limit your price has not reached comes back not_filled, and a later call does not fill it. Then call sandbox_results with the same sandbox_id: its book works out the position and realized P&L from the fills in the order they arrived, not by price_time. Every call counts toward the sandbox alert limits; on sandbox_rate_limited, do what fix says.\n\nFill model (every fill carries it as fill_model): each order fills at one snapshot price taken when the alert arrives, either the venue's public ticker (its best ask for a buy and best bid for a sell when the venue gives them, otherwise its last trade) or a price you supply (price, or fp= in the alert). A market order fills at that price. A marketable limit (a buy limit at or above it, a sell limit at or below it) fills at that price, never at the limit; any other limit stays open as not_filled and never fills later. The sandbox does not model order-book depth, slippage, latency or partial fills, and a caller price or last trade carries no spread, so live results will differ. fill.book_size is the size the venue's public ticker showed at that best ask or bid when the price was read, passed on as stored; it is not depth, it does not change the fill, and it is null when the price came with no size (a caller price, fp=, or a venue whose ticker gives none). For live-like execution, use the venue's own testnet or demo account through Autoview (pricing lists them with demo: true, at $0).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "command": {
                "description": "alert text, e.g. \"e=kraken s=BTCUSD b=buy q=0.01\" (classic key=value) or \"buy(BTCUSD, 0.01)\" (v3 line). Send this or order, not both",
                "type": "string"
              },
              "exchange": {
                "description": "venue id (any spelling) for a v3 line or alert text with no e=, e.g. \"kraken\"",
                "type": "string"
              },
              "order": {
                "additionalProperties": {},
                "description": "structured order (only these six fields; order.price is refused, use limit_price), rendered to the alert line \"e=<exchange> s=<symbol> b=<side> q=<qty> t=<type>\" (plus fp=<limit_price> for a limit); returned as compiled. Send this or command, not both",
                "properties": {
                  "exchange": {
                    "description": "venue id, any spelling, e.g. \"kraken\", \"oanda\", \"alpaca\", \"coinbase_advanced\" (pricing with no exchanges lists every id)",
                    "type": "string"
                  },
                  "limit_price": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "string"
                      }
                    ],
                    "description": "required when type is \"limit\": the limit price, e.g. 81000. Not the market price you read: that goes in the top-level price"
                  },
                  "qty": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "string"
                      }
                    ],
                    "description": "positive quantity in the venue's units, e.g. 0.01 (BTC), 1000 (EUR/USD units), 1 (shares)"
                  },
                  "side": {
                    "description": "\"buy\" or \"sell\"",
                    "type": "string"
                  },
                  "symbol": {
                    "description": "one ticker with no spaces, as the venue writes it, e.g. \"BTCUSD\", \"EURUSD\", \"AAPL\"",
                    "type": "string"
                  },
                  "type": {
                    "description": "\"market\" (default) or \"limit\"",
                    "type": "string"
                  }
                },
                "required": ["exchange", "qty", "side", "symbol"],
                "type": "object"
              },
              "price": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "optional current market price you read from your own user's data source for this symbol, e.g. 1.11419 or \"1.11419\" (positive number or decimal string). Used when Autoview has no price for the market; the fill is labelled caller-supplied. Not a limit price: for a limit use order.limit_price (or fp= in command). A price over 15 minutes old still fills, with fill.price_warning"
              },
              "price_source": {
                "description": "optional, with price: where the price came from, up to 120 characters, e.g. \"my OANDA practice account\"",
                "maxLength": 120,
                "type": "string"
              },
              "price_time": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "optional, with price: when it was read, ISO-8601 (\"2026-10-28T17:00:00Z\") or epoch milliseconds (1793206684433); not in the future"
              },
              "sandbox_id": {
                "description": "an existing sandbox id (32 lowercase hex, e.g. \"6d43316194e3727e2411ef118974be1f\") to reuse; omit to get a new one",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Run an alert in the sandbox"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a9f3029db3e449cc09713e8097300712f237aec53102b5e452fb9aa60d44e276"
        },
        {
          "name": "send_feedback",
          "description": "Send your user's feedback to the Autoview team: a feature request, a bug report, a question, or anything else. Works with no account and no token (as a guest), or with your user's token. Each message is saved for a person to review before it goes to the team; there is no set response time. With a token, the account is attached on our side from the token, so do not add it. Never put passwords, API keys or other secrets in message. If your user wants an answer, put a way to reach them in contact (for example an email address), or with a token set contact to true to use the address on the account. Show your user the message and get their go-ahead before sending. message is up to 4000 characters. Limit: 2 per hour for each account, or for each guest. Returns { received, id, status, guest, remaining_this_hour, note }; pass note to your user. A refusal returns { error, code, fix }: bad_kind, message_empty, message_too_long, contact_too_long, invalid_token, feedback_rate_limited (with retry_at), feedback_unavailable, feedback_store_failed. Do what fix says.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "contact": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "boolean"
                  }
                ],
                "description": "optional: how to reach your user if they want a reply (for example an email address, up to 254 characters), or true to use the address on the account (token only). Omit for no reply."
              },
              "kind": {
                "description": "feature_request, bug, question, or other",
                "enum": ["feature_request", "bug", "question", "other"],
                "type": "string"
              },
              "message": {
                "description": "your user's feedback in their own words, up to 4000 characters. For a bug, say what was sent, what happened and what was expected; a trace or canonical_id from events helps.",
                "type": "string"
              },
              "token": {
                "description": "your Autoview account token — an av_mcp_ personal access token, generate one at /account/tokens/ on the Autoview site. Omit this if your MCP client already sends it as an `Authorization: Bearer` header (Claude Code, Cursor, and most non-browser clients do this automatically once configured). Optional here: leave it out to send as a guest.",
                "type": "string"
              }
            },
            "required": ["kind", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send feedback to the Autoview team"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
