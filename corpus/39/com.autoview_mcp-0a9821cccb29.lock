              "price": {
                "description": "absolute limit price; required for limit, post_only, ioc, fok, and stop_limit. Also accepted (optional) on a market order as a stand-in for priceRef.",
                "type": "number"
              },
              "priceRef": {
                "description": "reference price for percent sizing and brackets (price=); percent quantity divides balance by it. Optional on exchanges with a live quote feed (the zone fetches one); REQUIRED on TRADOVATESIM (no live market-data feed — Tradovate charges separately for it, and a Simulation account never has it) whenever quantity is a percent, unit is \"currency\", OR any of stopLoss/takeProfit/trailStop is set. Omitting it there fails late with a live exchange error instead of a clear one — pass an approximate current price.",
