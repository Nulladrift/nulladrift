        {
          "name": "sandbox_results",
          "description": "Read the simulated fills stored for a sandbox_id (from sandbox_run, or any Alert Sandbox webhook id), newest first. No token, no account, no key: simulation only, no real order was placed. Returns { sandbox: true, real_order_placed: false, notice, sandbox_id, alerts: [{ received_at, seq?, orders?: [same shape as sandbox_run orders, including fill.status (filled, not_filled, no_price or nothing_to_close), fill.origin, fill.price_label, fill.price_warning and fill.price_error], error? }], more, book, next_step } where alerts lists the newest 10 and more is true when older alerts exist beyond them. book = { positions: [{ exchange, symbol, net_qty, avg_entry, realized_pnl, last_fill_price, fills }], unvalued: [{ exchange, symbol, count }], unvalued_count, complete, method, note } is worked out on this call from up to 1000 stored alerts (an id with no account holds fewer, so it covers the whole store): average-cost, each market starting flat at its oldest fill read, no cash and no fees; net_qty is negative for a short and avg_entry is null when flat. Fills with no price or a percent qty are counted in unvalued and never valued; complete is false when older fills exist beyond the read. next_step = { market, practice_venue, practice_venue_name, same_venue, free, connect_url, text } names the free testnet or demo venue for the newest order's market and the page where your user connects it; practice_venue is null when Autoview has no match, and free is false when the only demo is not free to open. Pass text to your user as the next step. A refusal returns { error, code, fix }: bad_sandbox_id (malformed id), sandbox_refused (e.g. the id belongs to an account), sandbox_rate_limited, sandbox_bad_answer, sandbox_unreachable, sandbox_timeout, internal_error. Do what fix says.\n\nFill model (every fill carries it as fill_model): each order fills at one snapshot price taken when the alert arrives, either the venue's public ticker (its best ask for a buy and best bid for a sell when the venue gives them, otherwise its last trade) or a price you supply (price, or fp= in the alert). A market order fills at that price. A marketable limit (a buy limit at or above it, a sell limit at or below it) fills at that price, never at the limit; any other limit stays open as not_filled and never fills later. The sandbox does not model order-book depth, slippage, latency or partial fills, and a caller price or last trade carries no spread, so live results will differ. fill.book_size is the size the venue's public ticker showed at that best ask or bid when the price was read, passed on as stored; it is not depth, it does not change the fill, and it is null when the price came with no size (a caller price, fp=, or a venue whose ticker gives none). For live-like execution, use the venue's own testnet or demo account through Autoview (pricing lists them with demo: true, at $0).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "sandbox_id": {
                "description": "the sandbox id sandbox_run returned: 32 lowercase hex, e.g. \"6d43316194e3727e2411ef118974be1f\"",
                "type": "string"
