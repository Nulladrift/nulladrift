        {
          "name": "connect",
          "description": "Connect any exchange configured on Autoview (see catalog) to your account: creates a webhook and links it to your already-saved credentials for that exchange, the same steps 2-4 the website's setup wizard runs. Safe to call more than once -- if a webhook is already linked, it reports connected:true and creates nothing new. If you have no credentials saved for this exchange yet, returns connect_url instead: open it in a browser to add them, then call connect again with the same exchange (for a paper/testnet exchange you can instead call link with its keys; real-money keys are browser-only). Connecting a real-money (non-paper) exchange requires a live-scoped token; any token can connect a paper/testnet exchange. Requires your Autoview account token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "exchange": {
                "description": "the exchange to connect",
                "enum": ["ALPACA", "ALPACAPAPER", "BINANCE", "BINANCEDELIVERY", "BINANCEDELIVERYTESTNET", "BINANCEFUTURES", "BINANCEFUTURESTESTNET", "BINANCETEST", "BINANCEUS", "BITMEX", "BITMEXTESTNET", "BITFINEX", "BITGET", "BITGETDEMO", "BITGETMIX", "BITGETMIXCOPY", "BITGETMIXDEMO", "BYBIT", "BYBITCOPY", "BYBITCOPYTESTNET", "BYBITSPOT", "BYBITSPOTTESTNET", "BYBITTESTNET", "CAPITAL", "CAPITALDEMO", "CHARLESSCHWAB", "COINBASE", "CRYPTO", "CRYPTODEMO", "DERIBIT", "DERIBITTESTNET", "GATE", "GATEFUTURES", "GATEFUTURESTESTNET", "GEMINI", "GEMINISANDBOX", "HUOBI", "HUOBIFUTURES", "HUOBILINEAR", "HUOBISWAP", "HYPERLIQUID", "HYPERLIQUIDTESTNET", "KRAKEN", "KRAKENFUTURES", "KUCOIN", "KUCOINFUTURES", "KUCOINFUTURESCOPY", "OANDA", "OANDAPRACTICE", "OKX", "OKXDEMO", "OKXEEA", "OKXEEADEMO", "OKXUS", "OKXUSDEMO", "TRADESTATION", "TRADESTATIONSIM", "TRADOVATE", "TRADOVATESIM"],
