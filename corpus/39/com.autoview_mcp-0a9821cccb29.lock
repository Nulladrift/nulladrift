                "description": "attached bracket stop-loss distance from the fill: points (10) or a percent string such as 3%; a sign, if given, must point the right way); pair with takeProfit for a fixed OCO, or with a trailing leg. Market entry only; refused up front where the connector's sl/tp handling is unverified or its config lists them unsupported; on some exchanges sl/tp reshape the order instead of attaching (explain_command names the caveat). On TRADOVATESIM also pass priceRef (or price) — see priceRef."
