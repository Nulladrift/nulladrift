              "order_id": {
                "description": "paper only, with action cancel: the order_id of an open paper limit order (entry returned it when the limit rested; paper_ledger lists it). Cancels that one order on your own paper ledger",
                "type": "string"
              },
              "paper_id": {
                "description": "paper fill only: the paper_id your first no-token paper fill on this exchange returned, to record this fill on the same paper ledger; leave it out to open a new one. With a token (and no hook_id) it moves that guest ledger onto the account, first claim wins",
                "type": "string"
