                "description": "exchange id (any spelling) to explain against when a line carries no e=",
                "type": "string"
              },
              "token": {
                "description": "not needed: explain_command reads no account data and ignores any token sent",
                "type": "string"
              }
            },
            "required": ["command"],
            "type": "object"
          },
