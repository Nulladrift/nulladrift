      "instructions": "Autoview places and inspects orders on your own exchange accounts.\n\nSignals reach Autoview as an HTTP POST to one of your webhook URLs (see hooks), from any sender that can make one: a TradingView alert, the user's own script or cron job, an automation platform such as n8n or Zapier, another charting or alerting service, or the user's own server. TradingView is one sender, not a requirement. The POST body is the command text (build it with command), sent as plain text, as a JSON string, or as a JSON object with a string \"alert\" field; form posts are refused. Autoview does not originate signals or run schedules itself; the sender decides when an order fires.\n\nCall setup first: it returns which exchanges you can trade, your hooks and their linked exchanges, and per-exchange facts (paper/free, credentials, unsupported parameters). If setup shows no hook linked to the exchange you want, call connect: it creates a webhook and links it to your already-saved credentials in one step (or, if you have not saved credentials for that exchange yet, returns a connect_url to do so in a browser). Call connect again after visiting that URL to finish. For a paper/testnet exchange only (ALPACAPAPER, BINANCEDELIVERYTESTNET, BINANCEFUTURESTESTNET, BINANCETEST, BITGETDEMO, BITGETMIXDEMO, BITMEXTESTNET, BYBITCOPYTESTNET, BYBITSPOTTESTNET, BYBITTESTNET, CAPITALDEMO, CRYPTODEMO, DERIBITTESTNET, GATEFUTURESTESTNET, GEMINISANDBOX, HYPERLIQUIDTESTNET, OANDAPRACTICE, OKXDEMO, OKXEEADEMO, OKXUSDEMO, TRADOVATESIM), link can instead take the practice account's API keys right here and link them to a hook in one step; real-money exchange keys never enter this chat. Looking for an exchange setup doesn't list? Call catalog: it lists every exchange configured on Autoview, and every one works with entry, command, alert and connect.\n\nTwo ways to trade, both using credentials already linked to a hook (see hooks / setup / connect / link) -- no secret is passed at order time:\n  - entry: fires ONE order right now.\n  - command + hooks: builds the alert message and the webhook URL it is POSTed to, for any sender (a script, a cron job, an automation platform, a TradingView alert), so orders keep firing after this chat ends. alert does the same in one call for TradingView and adds the expiration and resolution TradingView's create_alert needs. Prefer these over entry for anything that should outlive the conversation.\n\nevents reads back what an order did — pass the trace entry returned, or omit it to list your account's recent events (optionally narrowed by hook_id/canonical_id), which is the only way to see an order any sender (TradingView, a script, another platform) fired directly at a webhook.\n\nIf you also have TradingView's official MCP server connected (mcp.tradingview.com — quotes, screener, watchlists, alert history), use it to decide WHAT to trade, then use alert or entry here to actually place it: e.g. screen or analyze on TradingView, then call setup + alert to build a TradingView alert that trades through Autoview, or call entry directly for an immediate order.\n\nNo account yet? Four tools need no token at all: sandbox_run (simulate an alert and see the fill; if Autoview has no price for a market, pass price from your own data source), sandbox_results (read those fills back), explain_command (what the engine will do with a command, in plain English) and pricing (what going live costs per venue). Their errors carry a code and fix steps; follow them. With no token, entry fills on paper on BINANCE, BINANCEFUTURES, BINANCEUS, BITFINEX, BITGET, BITGETMIX, BITGETMIXCOPY, BYBIT, BYBITCOPY, BYBITSPOT, GEMINI, KUCOINFUTURES, KUCOINFUTURESCOPY: leave out token and hook_id, pass exchange and one order, and it fills at the current quote (a buy at the ask, a sell at the bid). Nothing is sent to the exchange. The first fill returns a paper_id: pass it on later no-token fills on that exchange to keep one paper ledger, and call paper_ledger with that paper_id to read its positions and fills back, or paper_reset with that paper_id and a balance to start the ledger over with that much cash. send_feedback also works without a token, so a guest can send feedback to the Autoview team.\n\nEvery other tool requires your Autoview account token: an av_mcp_ personal access token (generate one at https://autoview.com/account/tokens/?src=mcp&tool=instructions), sent either as the token argument or as an Authorization: Bearer header. Dry-run is the default everywhere a live switch exists; live:true requires a live-scoped token. A live entry order must also fit the token's live limits (max order size and daily limit in USD) and, once the user sets them, the account's (they cover all agent tokens together), which only the user sets on the website; call live_limits to read them and tell your user. The user can also pause all agent trading on the account; while paused, every new live entry order is refused agent_trading_paused, and cancel/close/flat still work. The user can also pause one token; while it is paused, its new live entry orders are refused agent_token_paused, and cancel/close/flat still work. No tool can turn the pause on or off. Supported exchanges: every exchange configured on Autoview (see catalog). ALPACAPAPER, BINANCEDELIVERYTESTNET, BINANCEFUTURESTESTNET, BINANCETEST, BITMEXTESTNET, BITGETDEMO, BITGETMIXDEMO, BYBITCOPYTESTNET, BYBITSPOTTESTNET, BYBITTESTNET, CAPITALDEMO, CRYPTO, CRYPTODEMO, DERIBITTESTNET, GATEFUTURESTESTNET, GEMINISANDBOX, HYPERLIQUIDTESTNET, OANDAPRACTICE, OKXDEMO, OKXEEADEMO, OKXUSDEMO, TRADESTATIONSIM, TRADOVATESIM are free; ALPACA, BINANCE, BINANCEDELIVERY, BINANCEFUTURES, BINANCEUS, BITMEX, BITFINEX, BITGET, BITGETMIX, BITGETMIXCOPY, BYBIT, BYBITCOPY, BYBITSPOT, CAPITAL, CHARLESSCHWAB, COINBASE, DERIBIT, GATE, GATEFUTURES, GEMINI, HUOBI, HUOBIFUTURES, HUOBILINEAR, HUOBISWAP, HYPERLIQUID, KRAKEN, KRAKENFUTURES, KUCOIN, KUCOINFUTURES, KUCOINFUTURESCOPY, OANDA, OKX, OKXEEA, OKXUS, TRADESTATION, TRADOVATE are callable by any account, but orders are forced to dry-run without an active Autoview subscription (see setup's dry_run_forced/upgrade_url per exchange).",
      "tools": [
        {
          "name": "alert",
          "description": "Build everything TradingView's create_alert(webhook, message, expiration, resolution) needs, in one call: fuses `command` (the message) and `hooks` (the webhook URL for hook_id), and fills in the expiration (default 1 year out -- TradingView itself defaults to only 30 days, which silently stops the alert) and resolution (default \"1\") TradingView also needs. The order is validated against the exchange(s) hook_id is actually linked to and rejected if it could never fire there. Returns warnings you should read, including never putting the hook's key in the message field and a fan-out warning when the hook links more than one exchange. Pass the alert field instead of the structured fields to use raw webhook command text with any key a webhook accepts. Dry-run by default like `command`; set live:true to build a command that trades for real once the alert fires. For any other sender, `command` + `hooks` give the same message and webhook URL; expiration and resolution are TradingView settings only. Requires your Autoview account token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "action": {
                "description": "manage EXISTING orders/positions on symbol instead of placing a new one: cancel = cancel open orders, close = close open positions, flat = cancel every order AND close every position (Tradovate only). When set, side (if given) is an optional buy/sell filter (not applicable to flat), and quantity/type/price/trigger/brackets/unit are ignored.",
                "enum": ["cancel", "close", "flat"],
                "type": "string"
              },
              "alert": {
                "description": "the raw command text a webhook body carries, e.g. s=BTCUSD b=buy q=0.01 fp=60000 ef=any tif=gtc; any key a webhook accepts works here, it is checked by the engine's parser and becomes the message as-is (with d=1 leading each line unless live is true). Do not combine with the structured order fields.",
                "type": "string"
              },
              "exchange": {
                "description": "optional — any exchange id known to Autoview (see `catalog`); a bracket is refused if that exchange lists its params as unsupported. Must be one of the exchanges hook_id is linked to (otherwise the alert is rejected); omit to validate against every exchange the hook is linked to",
                "enum": ["ALPACA", "ALPACAPAPER", "BINANCE", "BINANCEDELIVERY", "BINANCEDELIVERYTESTNET", "BINANCEFUTURES", "BINANCEFUTURESTESTNET", "BINANCETEST", "BINANCEUS", "BITMEX", "BITMEXTESTNET", "BITFINEX", "BITGET", "BITGETDEMO", "BITGETMIX", "BITGETMIXCOPY", "BITGETMIXDEMO", "BYBIT", "BYBITCOPY", "BYBITCOPYTESTNET", "BYBITSPOT", "BYBITSPOTTESTNET", "BYBITTESTNET", "CAPITAL", "CAPITALDEMO", "CHARLESSCHWAB", "COINBASE", "CRYPTO", "CRYPTODEMO", "DERIBIT", "DERIBITTESTNET", "GATE", "GATEFUTURES", "GATEFUTURESTESTNET", "GEMINI", "GEMINISANDBOX", "HUOBI", "HUOBIFUTURES", "HUOBILINEAR", "HUOBISWAP", "HYPERLIQUID", "HYPERLIQUIDTESTNET", "KRAKEN", "KRAKENFUTURES", "KUCOIN", "KUCOINFUTURES", "KUCOINFUTURESCOPY", "OANDA", "OANDAPRACTICE", "OKX", "OKXDEMO", "OKXEEA", "OKXEEADEMO", "OKXUS", "OKXUSDEMO", "TRADESTATION", "TRADESTATIONSIM", "TRADOVATE", "TRADOVATESIM"],
                "type": "string"
              },
              "expiration": {
                "description": "ISO 8601 timestamp for TradingView's alert expiration; defaults to 1 year from now",
                "type": "string"
              },
              "hook_id": {
                "description": "the hook whose URL becomes the alert's webhook (see the `hooks` tool)",
                "type": "string"
              },
              "live": {
                "description": "false (default) = build a dry-run preview command (appends d=1); true = build a command that places a real order when the alert fires",
                "type": "boolean"
              },
              "price": {
                "description": "absolute limit price; required for an explicit limit, post_only, ioc, fok, and stop_limit (omit type and price for a limit at the ticker)",
                "type": "number"
              },
              "priceRef": {
                "description": "reference price for percent sizing and brackets",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "quantity": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "pattern": "^(100|[1-9][0-9]?)%$",
                    "type": "string"
                  }
                ],
                "description": "order size: a positive number (contracts/units), or a percent-of-balance string like \"50%\" (1-100%). Required unless action is set."
              },
              "resolution": {
                "description": "chart timeframe TradingView's create_alert needs; defaults to \"1\" (1 minute)",
                "type": "string"
              },
              "side": {
                "description": "order direction; required unless action is set, where it is an optional buy/sell filter for cancel/close (omit for flat)",
                "enum": ["buy", "sell"],
                "type": "string"
              },
              "sizeAgainstEquity": {
                "description": "for a percent quantity, size against equity instead of available balance (y=equity)",
                "type": "boolean"
              },
              "stopLoss": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "attached bracket stop-loss distance from the fill: points (10) or a percent string such as 3%; a sign, if given, must point the right way); pairs with takeProfit or a trail leg"
              },
              "symbol": {
                "description": "the instrument symbol, e.g. EUR_USD, XBTUSD, BTC_USD. Required unless alert is set",
                "type": "string"
              },
              "takeProfit": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "attached bracket take-profit distance from the fill: points (20) or a percent string such as 5%; pairs with stopLoss or a trail leg"
              },
              "token": {
                "description": "your Autoview account token — an av_mcp_ personal access token, generate one at /account/tokens/ on the Autoview site. Omit this if your MCP client already sends it as an `Authorization: Bearer` header (Claude Code, Cursor, and most non-browser clients do this automatically once configured).",
                "type": "string"
              },
              "trailActivate": {
                "description": "points of profit before the trail starts; required whenever trailStop is set",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "trailFrequency": {
                "description": "how often the trailing stop re-checks price; defaults to 1 if omitted",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "trailStop": {
                "description": "auto-trail stop distance in points; requires trailActivate",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "trigger": {
                "description": "absolute trigger (stop) price; required for stop and stop_limit",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "type": {
                "description": "order type; defaults to limit at the ticker (t=limit with no price, same as a plain alert). An attached bracket needs type market explicitly.",
                "enum": ["market", "limit", "post_only", "ioc", "fok", "stop", "stop_limit"],
                "type": "string"
              },
              "unit": {
                "description": "\"currency\" treats quantity as a CURRENCY amount to convert to units at the resolved price (u=currency) — e.g. quantity:10 with unit:\"currency\" on BTC/USD buys $10 of BTC instead of 10 BTC. Only meaningful with a fixed (non-percent) quantity.",
                "enum": ["units", "currency"],
                "type": "string"
              }
            },
            "required": ["hook_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build a TradingView alert"
          },
          "behavior": {
            "destructive": false,
