        {
          "name": "monte_carlo_retirement",
          "title": "Monte Carlo Retirement",
          "description": "Stress-test the retirement plan across thousands of randomized market paths. Returns success rate WITH a 95% confidence interval, ending-balance percentiles, worst drawdown, and CVaR (average ending balance of the worst 5% of paths). Use when the user asks 'what are the odds', 'what's my success rate', 'what if markets crash', or wants a probability-based retirement analysis. For crash / bad-timing / sequence-of-returns questions set returnModel='block_bootstrap' (resamples real market history — fat tails + bad-streak clustering — more realistic than the default normal model). Quote the success rate with its CI, and cite CVaR for 'how bad could it get'.",
          "inputSchema": {
            "properties": {
              "annualSavings": {
                "default": 0,
                "type": "number"
              },
              "currentAge": {
                "type": "number"
              },
              "currentBalance": {
                "type": "number"
              },
              "endAge": {
                "default": 95,
                "type": "number"
              },
              "inflationPct": {
                "default": 2.5,
                "type": "number"
              },
              "iterations": {
                "default": 1000,
                "description": "100-5000.",
                "type": "number"
              },
              "meanReturnPct": {
                "default": 7,
                "type": "number"
              },
              "returnModel": {
                "description": "Return model. Default 'normal'. Use 'block_bootstrap' for crash/sequence-of-returns questions; 'student_t' for parametric fat tails.",
                "enum": ["normal", "student_t", "block_bootstrap"],
                "type": "string"
              },
              "ssMonthlyAt67": {
                "default": 0,
                "type": "number"
              },
              "ssStartAge": {
                "default": 67,
                "type": "number"
              },
              "stdDevPct": {
                "default": 15,
                "type": "number"
              },
              "targetAnnualSpend": {
                "type": "number"
              },
              "targetRetireAge": {
                "type": "number"
              }
            },
            "required": ["currentAge", "currentBalance", "targetAnnualSpend", "targetRetireAge"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
