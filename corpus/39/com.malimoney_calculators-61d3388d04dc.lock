        {
          "name": "life_insurance_need",
          "title": "Life Insurance Need",
          "description": "Estimate how much life insurance a person/family needs using the capital-needs (DIME) method. Use when the user asks 'how much life insurance do I need', 'are we covered if something happens to me', 'do we have enough life insurance'. Recommended coverage = income replacement (present value of annualIncome × replacement% for incomeReplacementYears at a real return) + mortgage + other debts + final expenses + education fund, less existing earmarked savings and any existing coverage. Pass annualIncome (required) plus whatever else is known. Returns the gross-need breakdown, recommended total face amount, additional coverage needed beyond an existing policy, and an adequacy verdict. Educational — survivor benefits and individual circumstances vary.",
          "inputSchema": {
