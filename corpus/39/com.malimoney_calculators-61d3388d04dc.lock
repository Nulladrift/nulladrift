        {
          "name": "college_savings",
          "title": "College Savings",
          "description": "Project a 529 / college-savings plan and tell the user if they're on track + how much to save. Use when the user asks 'are we saving enough for college', 'how much should I put in a 529', 'will my 529 cover college'. Projects the plan to college start, then draws it down against the inflated TOTAL cost of attendance. Pass childAge, currentBalance, monthlyContribution, and schoolType (in_state_public/out_of_state_public/private benchmarks ~$30k/$49k/$63k) or customAnnualCost. Returns projected value, total cost, coverage %, gap, and required monthly to fully fund. Educational — costs/returns vary.",
          "inputSchema": {
            "properties": {
              "childAge": {
                "description": "Child's current age.",
                "type": "number"
              },
              "collegeStartAge": {
                "default": 18,
                "type": "number"
              },
              "currentBalance": {
                "description": "Current 529 / college-savings balance.",
                "type": "number"
              },
              "customAnnualCost": {
                "description": "Today's total annual cost of attendance (when schoolType=custom).",
                "type": "number"
              },
              "expectedReturnPct": {
                "default": 6,
                "description": "Annual investment return assumption.",
                "type": "number"
              },
              "monthlyContribution": {
                "description": "Current monthly contribution.",
                "type": "number"
              },
              "schoolType": {
                "description": "Benchmark total cost of attendance; use 'custom' with customAnnualCost for a specific school.",
                "enum": ["in_state_public", "out_of_state_public", "private", "custom"],
                "type": "string"
              },
              "tuitionInflationPct": {
                "default": 5,
                "description": "Annual college-cost inflation assumption.",
                "type": "number"
              },
              "yearsOfCollege": {
                "default": 4,
                "type": "number"
              }
            },
            "required": ["childAge", "currentBalance", "monthlyContribution"],
            "type": "object"
          },
