        {
          "name": "backdoor_roth",
          "title": "Backdoor Roth",
          "description": "Apply the IRS pro-rata rule to a backdoor Roth (traditional→Roth conversion). Use when the user asks 'is my backdoor Roth tax-free', 'what's the pro-rata rule on my conversion', or has pre-tax IRA money alongside nondeductible contributions. The rule aggregates ALL traditional/SEP/SIMPLE IRAs: tax-free share = basis ÷ (basis + pre-tax). Pass conversionAmount, afterTaxBasis (nondeductible contributions), and pretaxBalance (total pre-tax IRA balance); optionally marginalRatePct.",
          "inputSchema": {
            "properties": {
              "afterTaxBasis": {
                "description": "Total nondeductible (after-tax) contributions across all IRAs — your basis.",
                "type": "number"
              },
              "conversionAmount": {
                "description": "Amount being converted to Roth this year.",
                "type": "number"
              },
              "marginalRatePct": {
                "description": "Marginal federal rate % for the tax-cost estimate.",
                "type": "number"
              },
              "pretaxBalance": {
                "description": "Total pre-tax balance across all traditional/SEP/SIMPLE IRAs.",
                "type": "number"
              }
            },
            "required": ["afterTaxBasis", "conversionAmount", "pretaxBalance"],
            "type": "object"
          },
