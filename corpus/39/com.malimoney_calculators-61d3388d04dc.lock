                "description": "Liquid assets earmarked to support survivors.",
                "type": "number"
              },
              "finalExpenses": {
                "default": 15000,
                "description": "Funeral / estate-settlement costs.",
                "type": "number"
              },
              "incomeReplacementPct": {
                "default": 70,
                "description": "Percent of income to replace (default 70).",
                "type": "number"
              },
              "incomeReplacementYears": {
                "default": 10,
