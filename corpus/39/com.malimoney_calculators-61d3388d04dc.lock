        {
          "name": "charitable_giving",
          "title": "Charitable Giving",
          "description": "Compare charitable-giving tax strategies — give annually vs bunch several years into one (donor-advised fund) vs a Qualified Charitable Distribution (QCD) from an IRA — and recommend the best after-tax option. Use when the user asks 'what's the best way to give to charity', 'should I bunch my donations', 'is a QCD or donor-advised fund better', 'how much do I save in taxes by donating'. Pass annualDonation and marginalRatePct (required); filingStatus and otherItemizedDeductions sharpen the standard-vs-itemized comparison, and age enables the QCD option (70½+). Returns each strategy's annual tax benefit and the recommendation. Federal-only educational estimate.",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Age — enables the QCD strategy when 70½+.",
                "type": "number"
              },
              "annualDonation": {
                "description": "Typical annual charitable giving.",
                "type": "number"
              },
              "bunchYears": {
                "default": 3,
                "description": "How many years of giving to bunch into one for the bunching strategy.",
                "type": "number"
              },
              "filingStatus": {
                "description": "Filing status (drives the standard deduction). Default married.",
                "enum": ["single", "married", "hoh"],
                "type": "string"
              },
              "marginalRatePct": {
                "description": "Marginal income-tax rate, e.g. 24.",
                "type": "number"
              },
              "otherItemizedDeductions": {
                "description": "Non-charitable itemized deductions (SALT, mortgage interest, etc.). Default 0.",
                "type": "number"
              },
              "standardDeduction": {
                "description": "Override the benchmark standard deduction.",
                "type": "number"
              }
            },
            "required": ["annualDonation", "marginalRatePct"],
            "type": "object"
          },
