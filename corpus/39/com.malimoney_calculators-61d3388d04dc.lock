        {
          "name": "divorce_impact",
          "title": "Divorce Impact",
          "description": "Model the financial impact of a divorce or separation: how assets and debts would split, each spouse's post-divorce monthly budget and immediate net worth, a simple multi-year net-worth trajectory for each, and a ballpark one-time legal-cost estimate by route (DIY, mediation, litigation). Use only when the user is going through, seriously considering, or explicitly asks to model a divorce or separation ('what would divorce look like financially', 'could I afford my own place if we split up', 'how would we split things') — never bring this up unprompted. Manual-inputs only: pass each spouse's monthly take-home income, combined shared monthly expenses, and combined marital assets/debts (required), plus the assumed split (default 50/50). Alimony is a simple manual override (a monthly amount + who pays) — this tool does NOT apply state guideline formulas. Present results in a measured, calm, supportive tone — this is emotionally difficult territory, never funny, roasting, or glib, and never take a side or imply blame. Always pair the numbers with the returned disclaimer: an educational estimate, not legal or financial advice — recommend a family-law attorney, mediator, or CPA for real decisions.",
          "inputSchema": {
            "properties": {
              "alimonyMonthly": {
                "default": 0,
                "description": "User-estimated monthly spousal support amount.",
                "type": "number"
              },
              "alimonyPayer": {
                "default": "none",
                "description": "Who pays the alimony amount.",
                "enum": ["A", "B", "none"],
                "type": "string"
              },
              "assetSplitPctToA": {
                "default": 50,
                "description": "Percent of marital assets (after legal costs) going to spouse A.",
                "type": "number"
              },
              "combinedMonthlyExpenses": {
                "description": "Combined shared monthly household expenses today.",
                "type": "number"
              },
              "debtSplitPctToA": {
                "description": "Percent of marital debts going to spouse A. Defaults to assetSplitPctToA.",
                "type": "number"
              },
              "expenseSplitPctToA": {
                "default": 50,
                "description": "Percent of ongoing shared expenses (groceries, kids, insurance) spouse A carries post-split.",
                "type": "number"
              },
              "legalCostOverride": {
                "description": "User-supplied total legal cost, overriding the ballpark table.",
                "type": "number"
              },
              "legalRoute": {
                "default": "mediation",
                "description": "Divorce process route, drives the legal-cost ballpark.",
                "enum": ["diy", "mediation", "litigation"],
                "type": "string"
              },
              "maritalAssets": {
                "description": "Combined marital assets subject to division.",
                "type": "number"
              },
              "maritalDebts": {
                "description": "Combined marital debts subject to division. Default 0.",
                "type": "number"
              },
              "movingSpouse": {
                "default": "A",
                "description": "Which spouse(s) take on a new monthly housing cost.",
                "enum": ["A", "B", "both", "neither"],
                "type": "string"
              },
              "netWorthGrowthPct": {
                "default": 4,
                "description": "Blended annual growth/shrink rate applied to each spouse's post-split net worth.",
                "type": "number"
              },
              "newMonthlyHousingCost": {
                "default": 0,
                "description": "New monthly housing payment for the moving spouse(s).",
                "type": "number"
              },
              "projectionYears": {
                "default": 5,
                "description": "Years to project each spouse's post-split net worth.",
                "type": "number"
              },
              "spouseALabel": {
                "description": "Display name for spouse A, e.g. 'You'. Default 'Spouse A'.",
                "type": "string"
              },
              "spouseAMonthlyIncome": {
                "description": "Spouse A's monthly take-home income.",
                "type": "number"
              },
              "spouseBLabel": {
                "description": "Display name for spouse B. Default 'Spouse B'.",
                "type": "string"
              },
              "spouseBMonthlyIncome": {
                "description": "Spouse B's monthly take-home income.",
                "type": "number"
              }
            },
            "required": ["combinedMonthlyExpenses", "maritalAssets", "spouseAMonthlyIncome", "spouseBMonthlyIncome"],
            "type": "object"
          },
