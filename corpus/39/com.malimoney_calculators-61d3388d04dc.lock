        {
          "name": "home_affordability",
          "title": "Home Affordability",
          "description": "Estimates an affordable home price using income, existing debts, down payment, and housing costs. Use when assessing a home purchase budget under the calculator's affordability assumptions.",
          "inputSchema": {
            "properties": {
              "annualIncome": {
                "description": "Gross annual income in dollars; defaults to 0.",
                "type": "number"
              },
              "downPayment": {
                "description": "Available down payment in dollars; defaults to 0.",
                "type": "number"
              },
              "hoaMonthly": {
                "description": "Monthly homeowners association dues in dollars; defaults to 0.",
                "type": "number"
              },
              "homeInsuranceAnnual": {
                "description": "Annual homeowners insurance cost in dollars; defaults to 1500.",
                "type": "number"
              },
              "loanTermYears": {
                "description": "Mortgage term in years, with a minimum of 1; defaults to 30, and a zero value is treated as 30.",
                "type": "number"
              },
              "monthlyDebts": {
                "description": "Existing monthly debt payments in dollars; defaults to 0.",
                "type": "number"
              },
              "mortgageRatePct": {
                "description": "Annual mortgage interest percentage, expressed as 6.5 for 6.5%, not 0.065; defaults to 6.5.",
                "type": "number"
              },
              "propertyTaxPct": {
                "description": "Annual property tax as a percentage of home value, expressed as 1.1 for 1.1%, not 0.011; defaults to 1.1.",
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
