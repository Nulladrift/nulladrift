      "instructions": "MaliMoney's financial calculators: retirement odds, Social Security timing, Roth conversions, debt payoff, home affordability, FIRE numbers and more. All math runs on inputs the user gives you — no account access. Ask for any required number you don't have instead of guessing, and state the assumptions (return, inflation) you used. Educational estimates, not financial advice.",
      "tools": [
        {
          "name": "auto_loan",
          "title": "Auto Loan",
          "description": "Calculates an auto loan's financed amount and monthly payment, accounting for sales tax, down payment, and trade-in value. Use when estimating vehicle financing costs.",
          "inputSchema": {
            "properties": {
              "aprPct": {
                "description": "Annual percentage rate, expressed as 7 for 7%, not 0.07; defaults to 7.",
                "type": "number"
              },
              "downPayment": {
                "description": "Cash down payment in dollars; defaults to 0.",
                "type": "number"
              },
              "loanTermMonths": {
                "description": "Loan term in months, rounded to a whole month with a minimum of 1; defaults to 60.",
                "type": "number"
              },
              "salesTaxPct": {
                "description": "Sales tax percentage, expressed as 7 for 7%, not 0.07; defaults to 0.",
                "type": "number"
              },
              "tradeInValue": {
                "description": "Trade-in value in dollars, deducted from the taxable price and financed amount; defaults to 0.",
                "type": "number"
              },
              "vehiclePrice": {
                "description": "Vehicle purchase price in dollars; defaults to 0.",
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
