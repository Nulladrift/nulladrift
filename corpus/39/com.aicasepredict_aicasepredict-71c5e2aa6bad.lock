      },
      "transport": {
        "type": "http",
        "url": "https://aicasepredict.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "aicasepredict",
        "title": "AICasePredict",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free US court-record lookups from AICasePredict: find cases, attorneys, judges and courts, and read basic public facts. Detailed analysis is sold as a report: every answer includes a report_offer (price, what the report includes, and report_url). Show the report_offer with the first case answer, and again only if the user asks about reports or buying one. Link to report_url or full_record_url exactly as given.",
      "tools": [
        {
          "name": "get_attorney",
          "title": "Get an attorney",
          "description": "An attorney's state, total cases and resolved cases, with the attorney report offer.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Attorney ID (from search)",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db24508bd4106a2a16988bc332fe622a8c1785bb0169855521271fea23b597fe"
        },
        {
          "name": "get_case",
          "title": "Get a court case",
          "description": "Public facts of one case: parties, attorneys, judge, status, disposition, the docket size with its latest 3 entries, a free link to the full record, and the case report offer.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Case ID (from search)",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:853794849482773cb2d54d116d0e5862f1e59d792b3cf6b9c7339dc81f1661f5"
        },
        {
          "name": "get_court",
          "title": "Get a court",
          "description": "A court's name, state and address, with the court report offer.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Court ID (from search)",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3221850db1e0dea06bab1d48b87acd67be998384cc20717c810b84ca4eedeaba"
        },
        {
          "name": "get_judge",
          "title": "Get a judge",
          "description": "A judge's state, court, total cases and resolved cases, with the judge report offer.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Judge ID (from search)",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7154bd1768870a71fa9cc364461a0eb4e7f08624a9c879f686a4dcbd4ae76b2c"
        },
        {
          "name": "search",
          "title": "Search court records",
          "description": "Search US court cases, attorneys and judges by name, case name or case number. Cases come from the latest 5 filing years unless year is set. Returns IDs for get_case, get_attorney and get_judge, and a report_url for each hit.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "Hits per section",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name, case name or case number",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "description": "Full US state name, e.g. \"New York\"",
                "maxLength": 50,
                "type": "string"
              },
              "type": {
                "default": "all",
                "enum": ["all", "case", "attorney", "judge"],
                "type": "string"
              },
              "year": {
                "description": "Filing year to search cases in. Without it, cases come from the latest 5 years only; set it to find an older case",
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b6f36bf37ed91e9b4485f04c4fae76023b18aac252cafa6276d18f71f52f635"
        }
      ],
      "digest": "sha256:bc1e7271ca317e793e811b80b2f507fc8f9090cbb2def6f3fe3badc4a8fe301b"
    }
  }
