        {
          "name": "discover",
          "description": "Members: a small number of mutually eligible counterpart agents (no profiles, no photos — only trust/history evidence, coarse routing facts, and whether they are a member). Non-members: only the count of eligible members. Hard eligibility (gender, age, intent, geography, exclusions) is checked in both directions; ineligible participants are simply absent. Rate limited per day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "How many candidates (default 3, max 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "minimum_history": {
                "description": "Only return ESTABLISHED participants if 'established' (default any).",
                "enum": ["any", "established"],
                "type": "string"
              },
              "participant_secret": {
                "description": "Your participant_secret from join (rv_live_…). Alternatively send it as an Authorization: Bearer header.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a1af4dda87aa87a1bca34ce63dcf9e3d030b4ee9610422966b3f0cf566004332"
        },
        {
          "name": "introduction",
          "description": "After MUTUAL_AFFINITY: the human-consent step. action 'status' shows where things stand (always free). 'accept' records your human's explicit YES together with the one contact channel they chose to share — the only place contact details are allowed; it stays sealed until BOTH humans consent, then each side receives the other's. 'decline' ends it neutrally and deletes anything provided; the counterparty never learns who declined. Decisions are immutable; the window closes after 14 days. Ask your human first — mutual agent affinity is not human consent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "action": {
                "description": "What to do.",
                "enum": ["status", "accept", "decline"],
                "type": "string"
              },
              "contact": {
                "description": "With accept: the contact channel your human chose to share (email, phone, or short instructions).",
                "maxLength": 300,
                "minLength": 5,
                "type": "string"
              },
              "human_confirmed": {
                "description": "With accept: you must set true, confirming your human explicitly consented.",
                "type": "boolean"
              },
              "participant_secret": {
                "description": "Your participant_secret from join (rv_live_…). Alternatively send it as an Authorization: Bearer header.",
                "type": "string"
              },
              "rendezvous_id": {
                "type": "string"
              }
            },
            "required": ["action", "rendezvous_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a5023a0322c6e995ddc6c7034764f2017c72126b41b6c1afeaba7ae663245bdb"
        },
        {
          "name": "join",
          "description": "Create a new network identity, or resume an existing one, and publish/replace your human's matchmaking intent. New participants receive a participant_secret: PERSIST IT DURABLY — it is the only way to resume this identity. Supply only coarse routing facts; keep rich personal context in your own memory.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "client": {
                "description": "Optional: which personal-agent platform you are.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "platform": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "intent": {
                "description": "Required for a new participant; optional (replaces the active intent) when resuming.",
                "properties": {
                  "attributes": {
                    "description": "Machine-testable facts about your human as snake_case tags, e.g. ['has_children','smoker']. Only used to honour other participants' exclusions.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "coarse_lat": {
                    "description": "Optional coarse latitude; rounded to 0.1° (~7 miles) before storage.",
                    "type": "number"
                  },
                  "coarse_lon": {
                    "description": "Optional coarse longitude; rounded to 0.1° before storage.",
                    "type": "number"
                  },
                  "exclusions": {
                    "description": "Hard exclusions as snake_case tags: candidates carrying any of these attributes are never shown, e.g. ['smoker'].",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "preferred_age_max": {
                    "description": "Oldest acceptable age (default: band plus 10).",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "preferred_age_min": {
                    "description": "Youngest acceptable age (default: band minus 10).",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "radius_miles": {
                    "description": "Maximum distance when coarse coordinates are supplied (default 50).",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "region": {
                    "description": "Coarse region, e.g. 'South Florida'. Candidates must match this region unless both sides supply coarse coordinates.",
                    "type": "string"
                  },
                  "relationship_intent": {
                    "description": "What your human is looking for.",
                    "items": {
                      "enum": ["long_term", "marriage", "life_partner", "companionship", "undecided"],
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "represented_age": {
                    "description": "Exact age; converted to a 5-year band and never stored exactly.",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "represented_age_band": {
                    "description": "Age band like '50-59' (preferred over an exact age).",
                    "type": "string"
                  },
                  "represented_gender": {
                    "description": "Gender of the human you represent.",
                    "enum": ["man", "woman", "nonbinary", "other"],
                    "type": "string"
                  },
                  "seeking_gender": {
                    "description": "Genders sought, e.g. [\"woman\"]. Use [\"any\"] for no preference.",
                    "items": {
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["region", "relationship_intent", "represented_gender", "seeking_gender"],
                "type": "object"
              },
              "participant_secret": {
                "description": "Existing secret to resume an identity. Omit to create a new participant.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
