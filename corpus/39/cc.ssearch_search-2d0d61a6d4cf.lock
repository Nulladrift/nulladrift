{
  "lockfileVersion": 2,
  "subjects": {
    "cc.ssearch/search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.ssearch.cc/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Open Agent Search",
        "version": "0.2.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Agent-oriented search over the SSearch ingested corpus. Use search_web to discover sources. Search results are compact catalog entries and may include metadata.document_id. When a result looks useful, prefer get_context(document_id, query) to retrieve only the stored passages relevant to what you need. Use get_document only when you need broader stored source text. Use fetch_page for a live URL fetch when stored text is unavailable or freshness requires it. Search is internal-first. On a true coverage miss, callers may opt into document-store and external coverage recovery; discovered URLs are queued for SSearch ingestion.",
      "tools": [
        {
          "name": "fetch_page",
          "description": "Fetch and extract readable page text; optionally fall back to Common Crawl.",
          "inputSchema": {
            "properties": {
              "archive_fallback": {
                "default": true,
                "title": "Archive Fallback",
                "type": "boolean"
              },
              "max_chars": {
                "default": 30000,
                "title": "Max Chars",
                "type": "integer"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "fetch_pageArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c7bc3764fb467a10d6f4848295e5ea879d57d8df4a569127705409f57ae5b04b"
        },
        {
          "name": "forward_canary",
          "description": "Dev-only transport proof. Forward a fake canary transiently and return only delivery status. Never use a real credential.",
          "inputSchema": {
            "properties": {
              "canary": {
                "title": "Canary",
                "type": "string"
              }
            },
            "required": ["canary"],
            "title": "forward_canaryArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:41f7fbade0bbecbb67594be0dabfdfcd9f5541048a99cd56ba8ef574727daa63"
        },
        {
          "name": "get_context",
          "description": "Retrieve only the stored passages in a search result that are relevant to the information you need.",
          "inputSchema": {
            "properties": {
              "document_id": {
                "title": "Document Id",
                "type": "string"
              },
              "max_chars": {
                "default": 5000,
                "title": "Max Chars",
                "type": "integer"
              },
              "max_passages": {
                "default": 5,
                "title": "Max Passages",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["document_id", "query"],
            "title": "get_contextArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:36ea252bdedb1bf60f8be9396ed29ad046186a5c97315b08fd9e22267569e121"
        },
        {
          "name": "get_document",
          "description": "Retrieve the broader stored text for a known SSearch document ID.",
          "inputSchema": {
            "properties": {
              "document_id": {
                "title": "Document Id",
                "type": "string"
              },
              "max_chars": {
                "default": 30000,
                "title": "Max Chars",
                "type": "integer"
              }
            },
            "required": ["document_id"],
            "title": "get_documentArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:58731fefce45995229aba5ad5ff792117a524094a085d8f210868391dd9c7be4"
        },
        {
          "name": "search_documents",
          "description": "Search SSearch-owned stored full-text documents. Successful misses can be promoted into the live index.",
          "inputSchema": {
            "properties": {
              "max_results": {
                "default": 10,
                "title": "Max Results",
                "type": "integer"
              },
              "promote": {
                "default": true,
                "title": "Promote",
                "type": "boolean"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_documentsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e709441ea09d12cc1ce00f61cc56e4be3e7e68577795327992f7cb9e5ec6931"
        },
        {
          "name": "search_plan",
          "description": "Show the normalized local search plan for a query.",
          "inputSchema": {
            "properties": {
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_planArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5562c316698ea01535a260c670083ce2b04ea69b563c5203a5a34d9c6b712f02"
        },
        {
          "name": "search_sources",
          "description": "Describe the local SSearch corpus and search backends.",
          "inputSchema": {
            "properties": {},
            "title": "search_sourcesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22e22836e99dc2189b0f0512c4785fe81a189d6aed480067199c75a388856297"
        },
        {
          "name": "search_web",
          "description": "Search SSearch. Set wait_for_coverage to search owned documents and, only if needed, external discovery on a miss.",
          "inputSchema": {
            "properties": {
              "fresh": {
                "default": false,
                "title": "Fresh",
                "type": "boolean"
              },
              "max_results": {
                "default": 10,
                "title": "Max Results",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "wait_for_coverage": {
                "default": false,
                "title": "Wait For Coverage",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "title": "search_webArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3408799c89e7e539f9b47f03448adb7323421b72c9a3ada5247f4856acf18335"
        }
      ],
      "digest": "sha256:068378408db149fa73bbb072bd94ea72faef3080b4e0c9c918e895e1f60587f4"
    }
  }
}
