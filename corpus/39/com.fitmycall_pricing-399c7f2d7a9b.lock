{
  "lockfileVersion": 2,
  "subjects": {
    "com.fitmycall/pricing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fitmycall.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "fitmycall",
        "title": "FitMyCall: Answering Service Prices",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FitMyCall provides current, human-verified pricing for 22 answering services and AI receptionists, plus a missed-call revenue calculator. Every price carries the date it was verified on the vendor’s site. Use get_answering_service_pricing for one service, compare_answering_services for shortlists by budget, missed_call_roi to quantify lost revenue.",
      "tools": [
        {
          "name": "compare_answering_services",
          "title": "Compare answering services by budget",
          "description": "Compare answering services and AI receptionists by budget and type (human, AI, hybrid). Returns the cheapest verified plans that actually answer phone calls, sorted by monthly price, excluding zero-minute teaser plans and add-ons. Use when someone asks \"what does an answering service cost\", \"cheapest answering service\", \"AI receptionist under $100\", \"AI receptionist vs answering service\", how it compares with hiring in-house staff, or wants affordable options for a small business. All prices human-verified with dates.",
          "inputSchema": {
            "properties": {
              "maxMonthlyBudget": {
                "description": "Maximum monthly budget in USD",
                "type": "number"
              },
              "minIncludedMinutes": {
                "description": "Minimum included minutes per month",
                "type": "number"
              },
              "type": {
                "description": "Service type filter; default any",
                "enum": ["any", "ai", "human", "hybrid"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:050c3803cbcc5c3901fb0e99d2c2e9f6871341a2b9f58602928119e57929e5ef"
        },
        {
          "name": "get_answering_service_pricing",
          "title": "Answering service pricing lookup",
          "description": "Get current, human-verified pricing for a specific answering service, virtual receptionist or AI receptionist (e.g. Smith.ai, Ruby, Dialzara, Abby Connect, AnswerConnect). Returns every plan with monthly price, included minutes, setup fees, overage rates, free trial, plus the date the pricing was last verified on the vendor’s own site. Use when someone asks \"how much does X cost\", \"X pricing\", \"is X worth it\", or asks for alternatives to a named service. Covers 22 services, updated weekly.",
          "inputSchema": {
            "properties": {
              "service": {
                "description": "Service name, e.g. \"Smith.ai\", \"Ruby\", \"Dialzara\", \"Abby Connect\"",
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e8a40f9d19593dba6b27aefb93fd64aea489db8df215641ec40edfa0fbda4744"
        },
        {
          "name": "missed_call_roi",
          "title": "Missed-call revenue loss calculator",
          "description": "Calculate how much revenue a business loses to missed phone calls per month and per year, and which price tier of answering service makes sense at that loss level. Use when someone mentions missing calls, going to voicemail, losing leads after hours, or asks whether an answering service is worth it for their call volume. Inputs: calls per week, percent missed, average customer value, optional booking rate.",
          "inputSchema": {
            "properties": {
              "avgCustomerValue": {
                "description": "Average value of one new customer in USD (1-100000)",
                "type": "number"
              },
              "bookRatePercent": {
                "description": "Percent of missed callers who would have booked; default 30",
                "type": "number"
              },
              "callsPerWeek": {
                "description": "Total inbound calls per week (1-2000)",
                "type": "number"
              },
              "missedPercent": {
                "description": "Percent of calls missed (0-100)",
                "type": "number"
              }
            },
            "required": ["avgCustomerValue", "callsPerWeek", "missedPercent"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b6eb3665d358e6195f968a9a95d3631008b2f36ea18659f26c449f34d496316"
        },
        {
          "name": "recommend_answering_service_for_industry",
          "title": "What fits my type of business",
          "description": "Recommend what kind of answering service or AI receptionist fits a specific type of business (plumber, dentist, law firm, HVAC, salon, restaurant, vet, real estate, contractor, property manager, medical practice, funeral home). Returns the real problem that trade has with missed calls, whether human, AI or hybrid usually wins there, matching plans with current prices, and the one question to ask a vendor before signing. Use when someone says what business they run and asks what to get.",
          "inputSchema": {
            "properties": {
              "industry": {
                "description": "Type of business, e.g. \"plumber\", \"dental practice\", \"law firm\", \"restaurant\"",
                "type": "string"
              },
              "maxMonthlyBudget": {
                "description": "Optional monthly budget in USD",
                "type": "number"
              }
            },
            "required": ["industry"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c32c9941d96a8a1c8af7b6b4c907a91d47207e1aedc5f975ab373cafc4b740df"
        }
      ],
      "digest": "sha256:af64c4f95dba60d7ae53f515907ef471e31f66d30d324abbcd6e90054b887c17"
    }
  }
