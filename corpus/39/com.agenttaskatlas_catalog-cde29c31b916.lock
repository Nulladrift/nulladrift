{
  "lockfileVersion": 2,
  "subjects": {
    "com.agenttaskatlas/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agenttaskatlas.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agenttask-atlas",
        "title": "AgentTask Atlas catalog",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only catalog of 81 MCP servers and Agent Skills, organized by dev task, each with a one-line practical verdict. Data summarizes official sources; nothing is hands-on tested or security-audited. Always confirm at source_url before installing.",
      "tools": [
        {
          "name": "get_entry",
          "title": "Get one entry",
          "description": "Full card for one catalog entry by slug (e.g. 'github-mcp-server'): verdict, install command, credentials, permissions, license, source and maintenance status.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8cae642830b2d6bf90da9f8b93dbebb9f99d0de8dd880848073dc1c099e324da"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "All dev-task categories and entry types with entry counts and page URLs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6dd91d765f13db2c6a4f9893c8cec8e6b387821334bd882bfc3f44725df42c84"
        },
        {
          "name": "search_catalog",
          "title": "Search the catalog",
          "description": "Find MCP servers and Agent Skills for a dev task. Free-text query (every term must match name, vendor, verdict, install or category; common words like postgres, e2e, scraping are expanded) and optional category slug from list_categories (a dev task such as 'database' or a type such as 'agent-skill'). Empty query lists the category.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category slug from list_categories",
                "enum": ["browser-testing", "database", "repo-git", "code-review", "ci-cd", "infra-deploy", "observability-debug", "docs-research", "web-scraping", "frontend-ui", "payments", "files-local", "docs-writing", "knowledge-memory", "build-mcp", "build-ai-apps", "planning", "prototype", "utilities", "mcp-server", "agent-skill"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "default": "",
                "description": "e.g. 'postgres', 'browser testing', 'sentry'",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02930fac93e5984f29ef12a876ddb09770bc4443c8ed5cbc1fff93ca52ebfe2f"
        }
      ],
      "digest": "sha256:b04400663582e1c3f513c29aa3f097b158ad44a9759cd3b41539994cbdf39460"
    }
  }
}
