        {
          "name": "nausika_sea_route",
          "title": "Sea Route & Distance",
          "description": "Maritime routing via pgRouting Dijkstra on the MARNET sea-lane graph (detailed coastal routing in the curated areas — Mediterranean, European Atlantic + Canaries, Caribbean, South-East Asia; main ocean lanes elsewhere; errors when an endpoint is far from any lane), 6 kn sailing-yacht default, snaps land coordinates to the nearest marina/anchorage/port.\n\nReturns distance, ETA, waypoint count, GeoJSON.\n\nExamples:\n  - Genova → Bastia: origin_lat=44.4, origin_lon=8.93, dest_lat=42.7, dest_lon=9.45\n  - Distance-only: same coords with include_waypoints=false\n\nTip: chain nausika_geocode → here → nausika_calculator.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dest_lat": {
                "description": "Destination latitude",
                "examples": [38.7, 43.55, 41.39],
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "dest_lon": {
                "description": "Destination longitude",
                "examples": [9.14, 10.32, 2.17],
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "include_waypoints": {
                "default": true,
                "description": "Set to false for distance-only mode (no waypoints or GeoJSON)",
                "examples": [true, false],
                "type": "boolean"
              },
              "optimization": {
                "default": "fast",
                "description": "Waypoint smoothing level. 'fast' (default): light smoothing, milliseconds. 'precise': highest-quality smoothing, slower (up to a few seconds). 'off': raw waypoints, unsmoothed.",
                "enum": ["off", "fast", "precise"],
                "type": "string"
              },
              "origin_lat": {
                "description": "Origin latitude",
                "examples": [38.7, 43.55, 41.39],
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "origin_lon": {
                "description": "Origin longitude",
                "examples": [9.14, 10.32, 2.17],
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "snap_to_water": {
                "default": true,
                "description": "If origin or destination falls on land (e.g. a city centroid from nausika_geocode like Lisbon → 38.71, -9.14), automatically snap to the nearest known marine place (marina, anchorage, port) within a nearby distance. Set to false to disable and force a hard error on land coordinates. Default true.",
                "examples": [true],
                "type": "boolean"
              },
              "speed_knots": {
                "description": "Vessel speed in knots for ETA calculation. Omit to use the caller's saved boat profile speed if one exists, else 6 kn (typical sailing yacht). An explicit value always wins over the boat profile.",
                "examples": [6, 7, 8],
                "maximum": 50,
                "minimum": 0.5,
                "type": "number"
              },
              "units": {
                "default": "nauticalmiles",
                "description": "Distance units (default: nauticalmiles)",
                "enum": ["nauticalmiles", "kilometers", "miles"],
                "type": "string"
              }
            },
            "required": ["dest_lat", "dest_lon", "origin_lat", "origin_lon"],
            "type": "object"
          },
