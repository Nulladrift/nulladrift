        {
          "name": "nausika_seasonal_forecast",
          "title": "Seasonal Forecast",
          "description": "Fetch 1-7 month ECMWF SEAS5 seasonal forecast for one point, anywhere in the world. Returns ensemble-mean DAILY + MONTHLY aggregates of wind, SST, temperature, precipitation, cloud cover (extend via variables[]). NO waves — chain nausika_marine_forecast for short-term wind + waves.\n\nInputs: latitude, longitude, start_date, end_date, variables.\nExample: latitude=40.12, longitude=9.01, start_date=\"2026-08-01\", end_date=\"2026-08-31\". SEAS5 forecasts forward only: a start_date in the past is clamped to today and an end_date beyond today+210d is clamped to the horizon, both reported in the response. A window that ends in the past is rejected.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "end_date": {
                "description": "Window end date (UTC, ISO YYYY-MM-DD). Must be ≥ start_date. Dates beyond the SEAS5 horizon (today + 210 days) are clamped — the response reports the adjustment.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include_members": {
                "default": false,
                "description": "When true, expose all 50 ECMWF SEAS5 ensemble members (`<var>_memberNN`) in the response. Default (false) collapses them into `_p10/_p50/_p90` percentile series alongside the ensemble mean — ~20× smaller payload, same statistical signal.",
                "type": "boolean"
              },
              "latitude": {
                "description": "Latitude in decimal degrees (WGS84, -90 to 90)",
                "examples": [38.7, 43.55, 41.39],
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude in decimal degrees (WGS84, -180 to 180)",
                "examples": [9.14, 10.32, 2.17],
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "start_date": {
                "description": "Window start date (UTC, ISO YYYY-MM-DD). Dates before today are clamped to today (SEAS5 forecasts forward only) — the response reports the adjustment.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "variables": {
                "description": "Additional variables, additive to the core set (wind_speed_10m, wind_direction_10m, sea_surface_temperature, temperature_2m, precipitation, cloud_cover). Each is expanded server-side into the appropriate daily and monthly aggregates. Defaults to core variables only.",
                "examples": [
                  ["sunshine_duration", "pressure_msl"],
                  ["apparent_temperature", "relative_humidity_2m"]
                ],
                "items": {
                  "enum": ["wind_speed_10m", "wind_direction_10m", "sea_surface_temperature", "temperature_2m", "precipitation", "cloud_cover", "pressure_msl", "surface_pressure", "sunshine_duration", "shortwave_radiation", "apparent_temperature", "dew_point_2m", "relative_humidity_2m", "weather_code", "sunrise_sunset", "snowfall", "snow_depth"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["end_date", "latitude", "longitude", "start_date"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "_attribution": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "license": {
                      "type": "string"
                    },
                    "license_url": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "license", "source_url", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "_disclaimer": {
                "type": "string"
              },
              "coordinates_requested": {
                "additionalProperties": false,
                "properties": {
                  "latitude": {
                    "type": "number"
                  },
                  "longitude": {
                    "type": "number"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "coordinates_resolved": {
                "additionalProperties": false,
                "properties": {
                  "distance_km": {
                    "type": "number"
                  },
                  "latitude": {
                    "type": "number"
                  },
                  "longitude": {
                    "type": "number"
                  }
                },
                "required": ["distance_km", "latitude", "longitude"],
                "type": "object"
              },
              "daily": {
                "additionalProperties": {
                  "items": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "type": "array"
                },
                "properties": {
                  "time": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["time"],
                "type": "object"
              },
              "model": {
                "enum": ["seas5"],
                "type": "string"
              },
              "monthly": {
                "additionalProperties": {
                  "items": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "type": "array"
                },
                "properties": {
                  "time": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["time"],
                "type": "object"
              },
              "monthly_derived": {
                "type": "boolean"
              },
              "range": {
                "additionalProperties": false,
                "properties": {
                  "end_date": {
                    "type": "string"
                  },
                  "start_date": {
                    "type": "string"
                  }
                },
                "required": ["end_date", "start_date"],
                "type": "object"
              },
              "timezone": {
                "enum": ["UTC"],
                "type": "string"
              },
              "units": {
                "additionalProperties": {
                  "type": "string"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "window_adjusted": {
                "type": "string"
              }
            },
            "required": ["coordinates_requested", "coordinates_resolved", "daily", "model", "monthly", "range", "timezone", "units"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0834c31a12fbbf5fa5097b477741c6b799c6a7c21eda5ab1f45b369a347d05a7"
        },
        {
          "name": "nausika_tides",
          "title": "Tides",
          "description": "Tide predictions or station discovery at a coordinate (latitude, longitude). Default: predictions from the nearest NOAA station; outside US waters falls back to a global modeled-tide source (forecast horizon ~15 days — longer windows are truncated, not rejected). Set stations_only=true to discover stations (capped by limit). Tune the window with begin_date (YYYYMMDD) + range_hours, the reference with datum, and output units (metric/english).\n\nThe modeled path reports range_m (peak-to-trough). Across most of the Mediterranean this is under 0.3 m, i.e. negligible for recreational navigation — the response says so explicitly, and you should not present such values as an actionable tide window. Tides matter on the Atlantic coasts, in the Gulf of Gabès, the northern Adriatic, and in the tidal streams of the Messina and Gibraltar straits.\n\nExample: latitude=37.77, longitude=-122.42. Chain nausika_geocode for place→coordinates; pair with nausika_marine_forecast.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "begin_date": {
                "description": "Start date in YYYYMMDD format (defaults to today UTC).",
                "examples": ["20260615", "20260701"],
                "pattern": "^\\d{8}$",
                "type": "string"
              },
              "datum": {
                "default": "MLLW",
                "description": "Tidal datum reference (default MLLW)",
                "enum": ["MLLW", "MLW", "MSL", "MHW", "MHHW", "NAVD", "STND"],
                "type": "string"
              },
              "interval": {
                "default": "hilo",
                "description": "Interval: 'hilo' for high/low only (default), 'h' for hourly predictions",
                "enum": ["h", "hilo"],
                "type": "string"
              },
              "latitude": {
                "description": "Latitude in decimal degrees (WGS84, -90 to 90)",
                "examples": [38.7, 43.55, 41.39],
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 5,
                "description": "Max stations to return in stations_only mode (default 5, max 10).",
                "examples": [5, 10],
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "description": "Longitude in decimal degrees (WGS84, -180 to 180)",
                "examples": [9.14, 10.32, 2.17],
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "range_hours": {
                "default": 48,
                "description": "Duration in hours (default 48, max 744 = ~31 days).",
                "examples": [24, 48],
                "maximum": 744,
                "minimum": 1,
                "type": "integer"
              },
              "stations_only": {
                "default": false,
                "description": "If true, return nearby stations without fetching predictions (station discovery mode). Defaults to false.",
                "examples": [true, false],
                "type": "boolean"
              },
              "units": {
                "default": "metric",
                "description": "Units: metric (meters) or english (feet)",
                "enum": ["metric", "english"],
                "type": "string"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "_attribution": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "license": {
                      "type": "string"
                    },
                    "license_url": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "license", "source_url", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "_disclaimer": {
                "type": "string"
              },
              "center": {
                "additionalProperties": false,
                "properties": {
                  "latitude": {
                    "type": "number"
                  },
                  "longitude": {
                    "type": "number"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "count": {
                "type": "number"
              },
              "data_source": {
                "enum": ["stations", "model"],
                "type": "string"
              },
              "datum": {
                "enum": ["MLLW", "MLW", "MSL", "MHW", "MHHW", "NAVD", "STND"],
                "type": "string"
              },
              "interval": {
                "enum": ["h", "hilo"],
                "type": "string"
              },
              "location": {
                "additionalProperties": false,
                "properties": {
                  "latitude": {
                    "type": "number"
                  },
                  "longitude": {
                    "type": "number"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "mode": {
                "enum": ["stations", "predictions"],
                "type": "string"
              },
              "model": {
                "additionalProperties": false,
                "properties": {
                  "disclaimer": {
                    "type": "string"
                  },
                  "resolution_km": {
                    "type": "number"
                  }
                },
                "required": ["disclaimer", "resolution_km"],
                "type": "object"
              },
              "note": {
                "type": "string"
              },
              "predictions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "level_m": {
                      "type": "number"
                    },
                    "time": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["high", "low"],
                      "type": "string"
                    }
                  },
                  "required": ["level_m", "time"],
                  "type": "object"
                },
                "type": "array"
              },
