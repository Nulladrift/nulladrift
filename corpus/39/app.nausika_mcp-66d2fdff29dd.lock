                    },
                    "dest_lat": {
                      "description": "Destination latitude",
                      "examples": [38.7, 43.55, 41.39],
                      "maximum": 90,
                      "minimum": -90,
                      "type": "number"
                    },
                    "dest_lon": {
                      "description": "Destination longitude",
                      "examples": [9.14, 10.32, 2.17],
                      "maximum": 180,
                      "minimum": -180,
                      "type": "number"
                    },
                    "dest_name": {
                      "description": "Destination name",
                      "minLength": 1,
                      "type": "string"
                    },
                    "distance_nm": {
                      "description": "Distance in nautical miles",
                      "type": "number"
                    },
                    "duration_hours": {
                      "description": "Estimated duration in hours",
                      "type": "number"
                    },
                    "geojson": {
                      "additionalProperties": {},
                      "description": "GeoJSON route geometry",
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "leg_order": {
                      "description": "Order in the itinerary",
                      "maximum": 100,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "notes": {
                      "description": "Leg notes",
                      "type": "string"
                    },
                    "origin_lat": {
                      "description": "Origin latitude",
                      "examples": [38.7, 43.55, 41.39],
                      "maximum": 90,
                      "minimum": -90,
                      "type": "number"
                    },
                    "origin_lon": {
                      "description": "Origin longitude",
                      "examples": [9.14, 10.32, 2.17],
                      "maximum": 180,
                      "minimum": -180,
                      "type": "number"
                    },
                    "origin_name": {
                      "description": "Origin name",
                      "minLength": 1,
