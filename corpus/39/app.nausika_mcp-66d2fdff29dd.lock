                    "distance_nm": {
                      "type": "number"
                    },
                    "id": {
                      "type": "string"
                    },
                    "latitude": {
                      "type": "number"
                    },
                    "longitude": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "state": {
                      "type": "string"
                    }
                  },
                  "required": ["distance_nm", "id", "latitude", "longitude", "name", "state"],
                  "type": "object"
                },
                "type": "array"
              },
              "units": {
                "enum": ["meters", "feet"],
                "type": "string"
              }
            },
            "required": ["_attribution", "count", "mode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
