        {
          "name": "nausika_geocode",
          "title": "Geocode Place Names",
          "description": "Resolve a place 'query' to coordinates (forward) or find nearest places to 'latitude'+'longitude' (reverse). Curated DB of the covered sea areas (Mediterranean, European Atlantic + Canaries, Caribbean, South-East Asia); forward falls back to OSM/Nominatim globally. Each result carries a 'source' discriminator ('local' for the curated marine DB, 'osm' for the global fallback). Returns name, type, coords, source, plus similarity (forward) or distance_m (reverse).\n\nExample forward: query=\"Portofino\". Example reverse: latitude=44.3, longitude=9.21, radius_m=50000.\n\nWhen the same name exists in several seas (e.g. \"Salerno port\": Italy and Florida), results carry a 'region' and the best of each sea is included — pick by the user's context, or pass near_latitude/near_longitude (boat position, departure port) to put that sea first.\n\nChain into nausika_marine_forecast, nausika_tides, nausika_search_places, or nausika_sea_route using the returned coords.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "latitude": {
                "description": "Latitude for reverse geocoding",
                "examples": [38.7, 44.3],
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 3,
                "description": "Max results, default 3, max 10",
                "examples": [1, 3, 5],
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "description": "Longitude for reverse geocoding",
                "examples": [15.2, 9.21],
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "near_latitude": {
                "description": "Optional, forward only: latitude of where the user is (boat position, port of departure). When the same name exists in several seas, results from that sea come first.",
                "examples": [40.67],
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "near_longitude": {
                "description": "Optional, forward only: longitude paired with near_latitude.",
                "examples": [14.75],
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "query": {
                "description": "Place name to search, forward geocoding",
                "examples": ["Porto Cervo", "Bonifacio", "Calanque de Sormiou"],
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "radius_m": {
                "default": 50000,
                "description": "Search radius for reverse geocoding in meters, default 50000",
                "examples": [10000, 50000, 100000],
                "maximum": 200000,
                "minimum": 1000,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "_attribution": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "license": {
