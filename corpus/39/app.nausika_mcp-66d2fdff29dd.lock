        {
          "name": "nausika_search_places",
          "title": "Search Places",
          "description": "Nautical place search by proximity in the curated areas (Mediterranean, European Atlantic + Canaries, Caribbean, South-East Asia). latitude+longitude are ALWAYS required — this is not a standalone text search. 'query' is only a name filter applied within that radius; to find a place by name without known coordinates, call nausika_geocode first. Returns name, coords, distance_km, ratings, i18n names, wiki/OSM links. Each result is prefixed with an 8-char [xxxxxxxx] short-id usable as place_id in nausika_get_place / nausika_manage_favorite / nausika_manage_rating / nausika_manage_route legs[].pois[].\n\nInputs: latitude, longitude, radius_km, query, type, types, category, shelter_from, bottom_type, names_lang, min_coverage_score, max_coverage_score, limit, offset.\n\nExample: latitude=44.3, longitude=9.21, radius_km=50, query=\"marina genova\", category=\"poi\". Chain nausika_geocode → nausika_search_places → nausika_get_place(short-id).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bottom_type": {
                "description": "Bottom type filter (e.g. 'sand')",
                "enum": ["sand", "mud", "rock", "gravel", "clay", "coral", "weed", "shells"],
                "type": "string"
              },
              "category": {
                "description": "Filter by category",
                "enum": ["poi", "location"],
                "examples": ["poi", "location"],
                "type": "string"
              },
              "latitude": {
                "description": "Center latitude for proximity search",
                "examples": [38.7, 44.4],
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 30,
                "description": "Max results, default 30, max 100",
                "examples": [10, 20, 50],
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "description": "Center longitude for proximity search",
                "examples": [9.14, 15.6],
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "max_coverage_score": {
                "description": "Maximum coverage score 0-100 — filter to low-coverage places that need enrichment",
                "examples": [30, 50],
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "min_coverage_score": {
                "description": "Minimum coverage score 0-100 — filter places by data completeness",
                "examples": [60, 80],
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "names_lang": {
                "description": "ISO 639-1 lang code. When set, response `name` is replaced with attributes.i18n.names[lang] if present; canonical OSM name kept as `name_canonical`.",
                "examples": ["it", "fr", "en"],
                "pattern": "^[a-z]{2,3}(-[A-Z]{2})?$",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Offset for pagination",
                "examples": [0, 30, 60],
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Fuzzy text filter on place name, applied WITHIN the proximity search — requires latitude/longitude too, it is not a standalone text search. For 'find this place by name anywhere', use nausika_geocode instead.",
                "examples": ["marina genova", "porto antico", "Bonifacio"],
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "radius_km": {
                "default": 50,
                "description": "Search radius in km (default 50, max 200)",
                "examples": [25, 50, 100],
                "maximum": 200,
                "minimum": 0.5,
                "type": "number"
              },
              "shelter_from": {
                "description": "Compass direction to filter shelter (e.g. 'NW')",
                "enum": ["N", "NE", "E", "SE", "S", "SW", "W", "NW"],
                "type": "string"
              },
              "type": {
                "description": "Filter by place type (ignored if 'types' is provided). Anchorages are type 'bay'.",
                "enum": ["marina", "port", "bay", "fuel_station", "yacht_club", "city", "island", "cape", "gulf", "lighthouse", "beach", "town", "village", "peninsula", "strait", "restaurant", "bar", "cafe", "supermarket", "convenience", "bakery", "pharmacy", "atm", "laundry", "post_office", "clinic", "water_point", "chandlery"],
                "type": "string"
              },
              "types": {
                "description": "Filter by multiple place types (takes precedence over 'type'). Anchorages are type 'bay'.",
                "examples": [
                  ["marina", "bay"],
