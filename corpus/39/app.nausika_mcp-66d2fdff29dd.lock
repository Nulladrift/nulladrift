      "serverInfo": {
        "name": "nausika-mcp-server",
        "title": "Nausika",
        "version": "1.0.0",
        "description": "Recreational marine navigation for the Mediterranean: forecasts, tides, sea routes, anchorages and POIs. Sources: ECMWF + OpenStreetMap + contributor data.",
        "websiteUrl": "https://nausika.app"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Nausika — Recreational Marine Navigation MCP Server\n\nSCOPE: curated areas (POIs, ratings, detailed coastal routes, contributor data) are the Mediterranean (most complete) and, newly opened with data still growing, the European Atlantic + Canaries, the Caribbean and South-East Asia. Forecast, tide, coastline, and geocode tools accept any coordinate worldwide. Outside the curated areas sea routes follow the main ocean lanes and place search will typically be empty.\n\nDOMAIN: Distances in nautical miles (nm). Speed in knots (kt). Depths/heights in meters. Coordinates as decimal degrees (lat, lon). Defaults: 3-day forecast, 50 km search radius, 6 kt cruising speed.\n\nTOOL CHAINING:\n- Location lookup: nausika_geocode -> nausika_marine_forecast / nausika_search_places / nausika_tides\n- Trip planning: nausika_geocode -> nausika_marine_forecast -> nausika_sea_route -> nausika_search_places (near destination) -> nausika_calculator (fuel/time)\n- Quick distance: nausika_geocode -> nausika_sea_route (use include_waypoints: false for distance-only)\n- Conditions check: nausika_geocode -> nausika_marine_forecast + nausika_tides\n- Seasonal outlook: nausika_geocode -> nausika_seasonal_forecast (1–7 month ECMWF SEAS5 ensemble outlook; complement to marine_forecast for short-term)\n\nAUTH SCOPE: marine forecast, seasonal forecast, tides, sea route, place search and detail, geocode, calculator, is_water, coordinate conversion and schema introspection work WITHOUT sign-in. Boat profiles, favorites, ratings and saved routes need OAuth 2.1 sign-in (or an M2M API key).",
      "tools": [
        {
          "name": "nausika_calculator",
          "title": "Calculator",
          "description": "Evaluate a math expression and return the numeric result. Useful for fuel, range/autonomy, unit conversions, and ad-hoc arithmetic.\n\nSupported (exhaustive): +, -, *, /, ^, %, parentheses, sqrt(), abs(), ceil(), floor(), round(), sin(), cos(), tan(), log(), exp(), min(), max(), PI, E. Anything else (atan2, pow, log10, hypot, if, factorial, comparisons) is rejected.\n\nExamples: \"(120 / 6) * 8.5\" (fuel for 120 nm at 8.5 L/h, 6 kn); \"45 * 1.852\" (nm to km).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "expression": {
                "description": "Math expression to evaluate",
                "examples": ["(450 / 8.5) * 1.1", "sqrt(3^2 + 4^2)", "45 * 1.852"],
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "precision": {
                "default": 4,
                "description": "Decimal places in the result (default 4)",
                "examples": [2, 4, 6],
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["expression"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "expression": {
                "type": "string"
              },
              "precision": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "result": {
                "type": "number"
              }
            },
            "required": ["expression", "precision", "result"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48c25d31530374c97068ec0a0f5303ee38c0b464e02f06c837755afcd7dc0505"
        },
        {
          "name": "nausika_convert_coordinates",
          "title": "Convert Coordinates",
          "description": "Convert nautical coordinates between decimal degrees, DMS, and DM.\n\nInputs: latitude, longitude — each accepts decimal (44.4), DMS (\"44°24'00\\\"N\"), or DM (\"44°24.0'N\"). Returns all three formats plus input_format (detected per-axis).\n\nExamples: latitude=\"44°24'N\", longitude=\"9°02'E\" → 44.4, 9.03; latitude=\"41°01'44.04\\\"N\", longitude=\"009°32'42.00\\\"E\" → 41.0289, 9.545.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "latitude": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Latitude as decimal degrees or DMS/DM string",
                "examples": [41.0289, "41°01′44.04″N", "41°01.7'N"]
              },
              "longitude": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Longitude as decimal degrees or DMS/DM string",
                "examples": [9.545, "009°32′42.00″E", "9°32.7'E"]
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "decimal": {
                "additionalProperties": false,
                "properties": {
                  "latitude": {
                    "type": "number"
                  },
                  "longitude": {
                    "type": "number"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "dm": {
                "additionalProperties": false,
                "properties": {
                  "latitude": {
                    "type": "string"
                  },
                  "longitude": {
                    "type": "string"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "dms": {
                "additionalProperties": false,
                "properties": {
                  "latitude": {
                    "type": "string"
                  },
                  "longitude": {
                    "type": "string"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "input_format": {
                "additionalProperties": false,
                "properties": {
                  "latitude": {
                    "type": "string"
                  },
                  "longitude": {
                    "type": "string"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              }
            },
            "required": ["decimal", "dm", "dms", "input_format"],
            "type": "object"
          },
