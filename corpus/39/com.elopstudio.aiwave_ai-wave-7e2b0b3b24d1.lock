{
  "lockfileVersion": 2,
  "subjects": {
    "com.elopstudio.aiwave/ai-wave": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aiwave.elopstudio.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "ai-wave",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "AI model changes, benchmark scores and cost estimates. Works without a key up to 100 tool calls/day per IP. For more, create a free key at https://aiwave.elopstudio.com/member and send it as Authorization: Bearer <key>. See https://aiwave.elopstudio.com/llms.txt for when to use which tool.",
      "tools": [
        {
          "name": "compare_models",
          "description": "Put two or more models side by side: price, context, benchmark scores per subject, and what each costs per month at a given volume. Use this instead of calling get_model repeatedly: it aligns the fields and marks which subjects a model has not been tested on, so a missing score is not read as a low one.",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "2-6 OpenRouter ids, e.g. ['anthropic/claude-opus-5','openai/gpt-5.2']",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "monthlyMillionTokens": {
                "description": "Volume for the cost estimate. Default 10 (10M tokens a month).",
                "type": "number"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0db58af7f30b0d4ad9f01f9df4216ecc893a283b3481ce5ca144f409887919e9"
        },
        {
          "name": "estimate_cost",
          "description": "What one model costs per month at a given token volume, in USD and KRW. Token prices are per million and hard to reason about directly; this turns them into a monthly bill. Input and output are mixed 75/25 unless you pass your own split.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "OpenRouter id or Hugging Face repo id",
                "type": "string"
              },
              "inputShare": {
                "description": "0-1, share of tokens that are input. Default 0.75",
                "type": "number"
              },
              "monthlyMillionTokens": {
                "description": "Default 10",
                "type": "number"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db815a9f55a108fb304819e75a4d29bd6708622aa315c0ec527c52c11003a839"
        },
        {
          "name": "find_replacement",
          "description": "What to switch to when a model is gone or you need a fallback. Ranked by closeness in measured performance, not by vendor or price: what you usually need to preserve first is the quality of the output. Candidates whose context window is less than half the original are excluded. Returns the score, price and context deltas so you can judge; we do not pick for you.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "OpenRouter id or Hugging Face repo id",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0063462095f83748a929f5c6a8b45715fad7c167af0906ed18205fce69aa64ad"
        },
        {
          "name": "get_model",
          "description": "Pricing, context length and catalog status for one model. Accepts an OpenRouter id (anthropic/claude-opus-5) or a Hugging Face repo id.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7dfd822d309ebb15056055c83e33cc31dd077c496a7749607180191693de9d1d"
        },
        {
          "name": "get_price_history",
          "description": "Price history for one model: when the price changed and to what. The public catalog only exposes the current price, so this answers 'was this cheaper last month?'. Each entry holds until the next one. History starts when AI Wave began recording, not when the model launched.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "OpenRouter id or Hugging Face repo id",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d40a28b8579abf9926937dd87d58d901639da64aa8e20d5ea20462d11bfa83c4"
        },
        {
          "name": "get_today",
          "description": "Today in one call: the top 5 models, which ones climbed, whose pricing changed in the last 24h, and what was newly listed in the last 7 days. Use this instead of paging list_model_changes and re-deriving the summary: price changes are already collapsed to one per model, with the raw count kept.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:92dcb5c819e22d0c9de82adcaa97ce3e7904848619eec6e21cba846409973573"
        },
        {
          "name": "list_model_changes",
          "description": "Changes across AI models: new releases, price changes, API changes and deprecations. Normalized from vendor release notes, Hugging Face, the OpenRouter catalog, GitHub and the LiteLLM price map, deduplicated per model, each marked official or pending review. Poll with `since` (unix seconds) and feed the returned `latest` back next time.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "1-100, default 20",
                "type": "number"
              },
              "model": {
                "description": "Vendor slug, e.g. claude",
                "type": "string"
              },
              "since": {
                "description": "Unix seconds. Only changes detected after this, oldest first.",
                "type": "number"
              },
              "type": {
                "enum": ["new_model", "price_change", "api_change", "open_source_surge", "deprecation"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0f552115443ae6b82bd367debdfb803760d5a42fc435490c3d965933fab48ad9"
        },
        {
          "name": "search_models",
          "description": "Shortlist models by budget, context and capability, ranked by measured performance. Use this to answer 'which model should I use for X': it returns benchmark scores alongside price so the trade-off is visible in one call. Sort by a subject (math, coding, science, reading) to find a model good at one thing.",
          "inputSchema": {
            "properties": {
              "accepts": {
                "description": "What the model must be able to take in, e.g. image for vision tasks.",
                "enum": ["text", "image", "audio", "video", "file"],
                "type": "string"
              },
              "limit": {
                "description": "1-50, default 10",
                "type": "number"
              },
              "maxInputPrice": {
                "description": "USD per 1M input tokens",
                "type": "number"
              },
              "minContext": {
                "type": "number"
              },
              "minIntelligence": {
                "description": "Lowest acceptable overall index. Leaders sit near 53; the median is 16.",
                "type": "number"
              },
              "mode": {
                "description": "What the model does. Non-chat modes are priced in other units: check price.unit.",
                "enum": ["chat", "embedding", "rerank", "audio_transcription", "audio_speech", "video_generation"],
                "type": "string"
              },
              "outputs": {
                "description": "What the model produces. A model that accepts video but writes text is 'text', not 'video': filter on what you need made, not what it can read.",
                "enum": ["text", "image", "audio", "video"],
                "type": "string"
              },
              "sortBy": {
                "description": "Ranking basis. Default 'intelligence' (overall). 'buzz' is popularity, not skill.",
                "enum": ["intelligence", "korean", "buzz", "science", "math", "coding", "reading", "knowledge", "instruction", "hardReasoning"],
                "type": "string"
              },
              "vendor": {
                "description": "OpenRouter namespace, e.g. anthropic",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90a3d56a99e4559cf9c0bd6fcd7de8580590fcc985c88c23b1ffe7b271341b69"
        }
      ],
      "digest": "sha256:ade66aef4a328c0bb6081106103df75add99388756e696bb673a1659c470253e"
    }
  }
}
