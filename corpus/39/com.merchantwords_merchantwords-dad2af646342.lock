{
  "lockfileVersion": 2,
  "subjects": {
    "com.merchantwords/merchantwords": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.merchantwords.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "merchantwords",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "bulk_keywords",
          "description": "Look up volume and depth for up to 1000 keywords in one call.",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "us",
                "description": "Marketplace code",
                "type": "string"
              },
              "keywords": {
                "description": "Array of keyword strings",
                "items": {
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              }
            },
            "required": ["keywords"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:686a2fbd1236a7e23cb0ed80826eeb47702e958a5b553c68204499f24abf3122"
        },
        {
          "name": "get_account",
          "description": "Show the caller's MerchantWords API plan, live rate-limit and bulk-quota usage, and the full list of plans with their prices, rate limits, and quotas. Call this to check remaining quota before a large job, or to tell the user which upgrade unlocks more throughput/volume.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5bb7b9ec60eeab0a9e0c48857079d113d62fd0421ae0c624a03631161c8be142"
        },
        {
          "name": "get_markets",
          "description": "List all supported Amazon marketplaces and their data coverage.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a7884e80a0b62de73262ced57d0d813b09e903a5490e5dfff4e684db28e0cf67"
        },
        {
          "name": "get_serp",
          "description": "Get all products on page 1 of Amazon search results for a keyword, with prices, stars, and reviews.",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "us",
                "description": "Marketplace code",
                "type": "string"
              },
              "keyword": {
                "description": "Search keyword",
                "type": "string"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0f836b1a4c7e46b96b730c118f06e5ba3f282867b7afe61fa757e127bd585689"
        },
        {
          "name": "related_keywords",
          "description": "Find keywords related to a seed keyword via ASIN co-occurrence (Keyword Multiplier).",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "us",
                "description": "Marketplace code",
                "type": "string"
              },
              "keyword": {
                "description": "Seed keyword",
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number",
                "type": "number"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f71e6fc0cf4c9e323e3d89164ab62ad58712faa94be50ce530c174ace0abad1b"
        },
        {
          "name": "search_asin",
          "description": "Reverse ASIN lookup — get product details and the top keywords it ranks for.",
          "inputSchema": {
            "properties": {
              "asin": {
                "description": "Amazon ASIN (e.g. B0DJ19VGDD)",
                "pattern": "^B0[A-Z0-9]{8}$",
                "type": "string"
              },
              "country": {
                "default": "us",
                "description": "Marketplace code",
                "type": "string"
              }
            },
            "required": ["asin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2db0caa941ce43b4a05374d63333a658be947cd0e91957cfa3d1504f7f3f3224"
        },
        {
          "name": "search_keywords",
          "description": "Look up Amazon search volume, depth, trend, and 12-month history for a keyword.",
          "inputSchema": {
            "properties": {
              "country": {
                "default": "us",
                "description": "Two-letter marketplace code (us, uk, de, etc.)",
                "type": "string"
              },
              "keyword": {
                "description": "The keyword phrase to look up",
                "type": "string"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b395ac005cb0e851154c3036bee26fb6d37b87d486a5f80245cc169d64d2470e"
        }
      ],
      "digest": "sha256:404df67ca3f6c76454f4fa64054892c8aaccf00bffcaf7cf5d6ccfc5d9f24405"
    }
  }
