{
  "lockfileVersion": 2,
  "subjects": {
    "com.dropwatchhq/govcon-feed": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://govcon.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "govcon-feed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "competitor_watch",
          "description": "Given a contractor name, return their recent federal awards (last 180d live) plus any win/lose/modify events the feed has accrued over time.",
          "inputSchema": {
            "properties": {
              "contractor": {
                "type": "string"
              }
            },
            "required": ["contractor"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:121c48ae9b1f44449e9a74128a5c5ba9e83d7d4b2db6aaccc1292ef4e45c2d4e"
        },
        {
          "name": "delta_digest",
          "description": "Weekly delta digest for a filter: new awards, modifications, and contracts EXPIRING in the next N days (recompete opportunities). Best signal for BD teams.",
          "inputSchema": {
            "properties": {
              "agency": {
                "type": "string"
              },
              "days": {
                "description": "Lookback days for new/modified (default 7).",
                "type": "number"
              },
              "expiringDays": {
                "description": "Expiry horizon, 90 or 180 (default 90).",
                "type": "number"
              },
              "keyword": {
                "type": "string"
              },
              "maxAmount": {
                "type": "number"
              },
              "minAmount": {
                "type": "number"
              },
              "naics": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recipient": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a655d766822d6bdb7e3db773ab30b5f236322be49c68de10f4bc9333d206602f"
        },
        {
          "name": "search_awards",
          "description": "Direct live search of US federal awards (USAspending.gov) by NAICS, agency, recipient, keyword, date range, and $ range. Use for ad-hoc lookups.",
          "inputSchema": {
            "properties": {
              "agency": {
                "type": "string"
              },
              "end": {
                "type": "string"
              },
              "keyword": {
                "type": "string"
              },
              "limit": {
                "description": "Default 50, max 200.",
                "type": "number"
              },
              "maxAmount": {
                "type": "number"
              },
              "minAmount": {
                "type": "number"
              },
              "naics": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recipient": {
                "type": "string"
              },
              "start": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b9cf277d5e727391a71ea3f985e2a6b4ede2867032d152fb8004cae551102a86"
        },
        {
          "name": "whats_changed_since",
          "description": "Return federal contract awards that are NEW or MODIFIED since a cursor token. Pass the cursor from a prior call to get only changes since then (cursor = your bookmark). Filter by NAICS, awarding agency, recipient/contractor, keyword, and $ range. This is the GovCon delta feed's core lock-in primitive.",
          "inputSchema": {
            "properties": {
              "agency": {
                "description": "Awarding agency name substring, e.g. 'Defense'.",
                "type": "string"
              },
              "cursor": {
                "description": "Opaque cursor from a previous response; omit for first call.",
                "type": "string"
              },
              "keyword": {
                "type": "string"
              },
              "limit": {
                "description": "Max changes to return (default 100).",
                "type": "number"
              },
              "maxAmount": {
                "type": "number"
              },
              "minAmount": {
                "type": "number"
              },
              "naics": {
                "description": "NAICS code prefixes, e.g. ['5415'].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recipient": {
                "description": "Contractor name substring.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:626fdfc4cecc73dd10e6596207744ce826d046cafa855d2813e5c8410d16c19d"
        }
      ],
      "digest": "sha256:005f053dded9abeca41cb183e51e3f42c00d88a8ddc990adfb67030389a39d0e"
    }
  }
}
