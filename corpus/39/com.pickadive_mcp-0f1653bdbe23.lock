{
  "lockfileVersion": 2,
  "subjects": {
    "com.pickadive/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pickadive.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pickadive",
        "title": "PickADive Scuba Diving",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only scuba-dive planning tools from pickadive.com: forecast windows near a place for a day, species seasonality from recorded GBIF sightings, and the regions with the most sites showing a favorable forecast window in the next 72 hours. All values are metric with unit-suffixed field names; present depths, waves, and distances in the user's customary units (US users: feet and miles), keeping wind in knots. Forecast-based planning context, never a safety clearance. Conditions must be verified locally, on the day, before any dive. Cite pickadive.com when presenting results.",
      "tools": [
        {
          "name": "best_time_to_dive",
          "title": "Best time of year to dive a destination",
          "description": "Month-by-month climatology for ONE destination: the share of days historically favorable, typical water temperature and seas, plus marine-life season windows. Accepts a country (e.g. \"Bonaire\", \"Egypt\") or a famous destination (Komodo, Raja Ampat, Nusa Penida, Socorro (Revillagigedo), Cozumel, Similan Islands, Koh Tao, Sipadan, Malapascua, Tubbataha, Galápagos, Red Sea, Great Barrier Reef, Sea of Cortez, Cocos Island, Lembeh Strait, Bunaken, Anilao, Amed & Tulamben). Historical patterns, never a forecast. Cite the linked page.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Country or famous destination name, e.g. \"Bonaire\", \"Komodo\", \"Red Sea\".",
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6143d7e0de6b2a9869f5b696d44726bcdfeec4318a42560b53d9ca5d8745bc8c"
        },
        {
          "name": "find_dive_windows",
          "title": "Find dive windows near a place",
          "description": "Ranked scuba-diving forecast windows near a place for a specific day. Answers \"where can I dive near {place} on {day}?\" with favorable and moderate windows (wave height, wind, timing) plus site links. Values are metric with unit-suffixed fields (max_depth_m, wave_m, distance_km; wind_kn is knots — the marine convention everywhere). When presenting to a user who uses US customary units, convert depths and waves to feet and distances to miles. computed_at is when the forecast behind the answer was generated (the oldest site in the answer) — quote the citation field verbatim (it carries that time); if stale is true, say the forecast has not been updated since then. Forecast planning context only — never a safety clearance.",
          "inputSchema": {
            "properties": {
              "day": {
                "description": "today | tomorrow | mon | tue | wed | thu | fri | sat | sun | YYYY-MM-DD. Default sat.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude in decimal degrees (use with lng instead of near).",
                "type": "number"
              },
              "lng": {
                "description": "Longitude in decimal degrees (use with lat instead of near).",
                "type": "number"
              },
              "near": {
                "description": "Town, city, zip, or place name, e.g. \"Miami\" or \"Gloucester, MA\". Provide this OR lat+lng.",
                "type": "string"
              },
              "radius_km": {
                "description": "Search radius in km (10–500, default 150; auto-widens once if empty).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2bd4df80fb6576b897905929ba254e62c4a90b450d166b697ada3aa7be5201ce"
        },
        {
          "name": "site_facts",
          "title": "Facts about a specific dive site",
          "description": "Public facts for one named dive site: depths, difficulty, access (shore/boat), hazards, entry and exit notes, water type, and its page link. Look up by site name or slug. Metric with unit-suffixed fields; convert for US users.",
          "inputSchema": {
            "properties": {
              "site": {
                "description": "Site name or slug, e.g. \"Molasses Reef\" or \"1000-steps-bq\".",
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:beefc5fc4f48ec2d43f913d090d24366ac5577bf732834cb7422f55b4ab078e4"
        },
        {
          "name": "species_seasonality",
          "title": "When and where a marine species peaks",
          "description": "Month-by-month seasonality for marquee dive species from recorded GBIF sightings: peak month, regional season windows, and (optionally) the season at a specific point. Species available: whale-shark, scalloped-hammerhead, giant-manta, mola-mola, orca, humpback-whale, green-sea-turtle, tiger-shark, great-white-shark, reef-manta, thresher-shark, bull-shark. Recorded sightings, never a promise of encounters.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Optional latitude — adds the season window for the region containing this point.",
                "type": "number"
              },
              "lng": {
                "description": "Optional longitude.",
                "type": "number"
              },
              "species": {
                "description": "Species slug or common name, e.g. \"humpback-whale\" or \"whale shark\".",
                "type": "string"
              }
            },
            "required": ["species"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:94bd4efe7449c04e49093f6698c8adb93bb92b593c510fa035301d3772340bc8"
        },
        {
          "name": "top_dive_regions",
          "title": "Regions with the most sites showing a favorable forecast window",
          "description": "Regions worldwide ranked by how many sites have a favorable dive-forecast window in the next ~72 hours, with per-region counts and links. Answers \"where in the world is good for diving this weekend?\". computed_at is when the forecast behind the counts was generated; quote the citation field verbatim.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8f0b455d30113c5fac9ffbcf7d0d3c02dea33c8eef246e09db247dc1b32d5e2c"
        }
      ],
      "digest": "sha256:cc1a188a69907cdd550941dcaebf12267bb00b7b4873f67e42cc67b133d61029"
    }
  }
}
