        {
          "name": "perps",
          "title": "Perpetual futures",
          "description": "Perp markets on Rocky, Ekiden and Canborsa: price, basis to the outside spot price, funding,\n    spread, open interest and 24h volume where the venue publishes them. base filters by asset, e.g. BTC, ETH or CC.",
          "inputSchema": {
