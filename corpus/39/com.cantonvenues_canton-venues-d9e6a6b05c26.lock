        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cantonvenues.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "canton-venues",
        "title": "Canton Venues",
        "version": "1.0.1",
        "description": "Live market data for Canton Network DEXes (Temple, Cantex, Tradecraft, Rocky, OneSwap, Pool Party, Ekiden): prices, premium to global markets, best execution, spreads, perps, alerts.",
        "websiteUrl": "https://cantonvenues.com",
        "icons": [
          {
            "src": "https://cantonvenues.com/icon.png",
            "mimeType": "image/png",
            "sizes": ["640x640"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Market data for Canton Network DEXes, refreshed every five minutes. Prices are in USD. Tokens are named by symbol (CC is Canton Coin). Use quote() for any trade size: every venue is priced on its own markets (pools from live reserves, the Temple and Rocky order books), in one swap or two, as the site's best execution compares them; each venue's output comes before and after its per-trade network fee (network_fees). exit_cost() says what selling a token for dollars nets at any size and how much sells within 1%, 2% or 5%; check_trade() prices a trade you already made against every venue at that time. Nothing here executes a trade.",
      "tools": [
        {
          "name": "alerts",
          "title": "Recent alerts",
          "description": "Alerts fired on Canton DEXes: stablecoin peg breaks, premiums over 1%, hourly moves over 5%,\n    and spreads that clear their costs. Newest last.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "description": "How many of the latest alerts to return, 1 to 300",
                "title": "Limit",
                "type": "integer"
              }
            },
            "title": "alertsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cc6a777bf9eb534ef2d737ceb9f66ce00442d023013fd36460e9153fd02805c5"
        },
        {
          "name": "check_trade",
          "title": "Check a trade against every Canton venue at that time",
          "description": "Was a trade well executed? Give the token sold and bought, the amount sold, the amount received,\n    the time (ISO such as 2026-10-27T18:05:00Z, or unix seconds) and optionally the venue. The trade\n    is priced again on every venue from the pool reserves and order books read at the five-minute\n    ticks either side of it (archive since 27 Oct 2026), by the same code as quote(), after network\n    fees. Returns the venue that returned the most, how far the trade fell short of it in basis points\n    (at the reading least favourable to that), and with venue given, how much of the gap was the\n    choice of venue and how much the fill itself. Nothing is executed or stored.",
          "inputSchema": {
            "properties": {
              "amount_in": {
                "description": "How much of the sold token went in, in its own units",
                "title": "Amount In",
                "type": "number"
              },
              "amount_out": {
                "description": "How much of the bought token came back, in its own units",
                "title": "Amount Out",
                "type": "number"
              },
              "buy": {
                "description": "Symbol of the token bought, e.g. USDCx",
                "title": "Buy",
                "type": "string"
              },
              "sell": {
                "description": "Symbol of the token sold, e.g. CC",
                "title": "Sell",
                "type": "string"
              },
              "time": {
                "description": "When the trade ran: ISO 8601 such as 2026-10-27T18:05:00Z, or unix seconds; the archive starts 27 Oct 2026 21:01 UTC",
                "title": "Time",
                "type": "string"
              },
              "venue": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional: the venue it ran on, e.g. cantex, tradecraft, oneswap, temple, rocky or poolparty",
                "title": "Venue"
              }
            },
            "required": ["amount_in", "amount_out", "buy", "sell", "time"],
            "title": "check_tradeArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c32e9ec0b428cfdaa841abfed43d2570f66636ed25b939d84a45cff0f89ca47a"
        },
        {
          "name": "exit_cost",
          "title": "Exit cost: what selling a token for dollars nets",
          "description": "What selling a token for dollars (USDCx) nets on Canton, as a share of its value at our price:\n    a ladder from $1K to $1M per venue and at the best one (with across_venues when selling the token\n    for CC on one venue and that CC for dollars on another keeps more), the largest sale each venue (and all of\n    them together) takes within 1%, 2% and 5%, what limited each (the cost, or the end of a venue's\n    visible order book), and the worst share at $10K and $50K since the record began. For lending,\n    vault and risk tools: what collateral sells for on Canton, not only what it is quoted at. With\n    amount_usd, also that exact sale priced now on every venue (as quote() would).",
          "inputSchema": {
            "properties": {
              "amount_usd": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional: one sale of this size in US dollars, priced now on every venue",
                "title": "Amount Usd"
              },
              "symbol": {
                "description": "Token symbol as Canton DEXes name it, e.g. CC (Canton Coin), CBTC, USDCx; list_tokens() gives every symbol",
                "title": "Symbol",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "title": "exit_costArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df18d3ea6ecc4f5332a7d4d7f769c3a23de9b78fda8841fa90abc521d9bcbb31"
        },
        {
          "name": "list_tokens",
          "title": "List Canton DEX tokens",
          "description": "Every token on Canton DEXes with price, 24h/7d change, liquidity and volume.\n    sort_by: liquidity, volume, change_24h, change_7d or premium.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 30,
                "description": "How many tokens to return, 1 to 100",
                "title": "Limit",
                "type": "integer"
              },
              "sort_by": {
                "default": "liquidity",
                "description": "Order of the list, largest first: liquidity (USD), volume (24h USD), change_24h, change_7d, or premium (largest gap to the outside price, either sign)",
                "enum": ["liquidity", "volume", "change_24h", "change_7d", "premium"],
                "title": "Sort By",
                "type": "string"
              }
            },
            "title": "list_tokensArguments",
            "type": "object"
          },
