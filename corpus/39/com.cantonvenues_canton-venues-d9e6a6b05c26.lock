          "digest": "sha256:3bc8a762b281897b7796d07d97055c99cfa25820abf0b7b6a5f44f93cdca790f"
        },
        {
          "name": "spreads",
          "title": "Cross-venue spreads",
          "description": "Buy-on-one-venue, sell-on-the-other round trips at their best size, after each venue's network\n    fee: `cost_cc` per route, `swap_cost_cc` per venue (Cantex and OneSwap their own quotes, checked\n    against our trades; Tradecraft and Temple none per trade; Rocky and Pool Party assumed at 1.5 CC). A trip through an order book in dollars (via=usd) also\n    pays the CC/USDCx leg of each pool side. `clears` is true when one nets at least $0.50.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many routes to return, best first, 1 to 50",
                "title": "Limit",
                "type": "integer"
