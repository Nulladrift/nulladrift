          "digest": "sha256:1af5c0c9269a79182da75ce76c84d640bccb944bd9240323dc88f5aea0e5d7ce"
        },
        {
          "name": "premiums",
          "title": "Canton premium to global prices",
          "description": "How far Canton DEX prices sit from outside markets: CBTC vs BTC, cETH vs ETH, eXAU and eXAG vs\n    gold and silver spot (while the spot market trades), CC vs global CC, and every stablecoin vs $1.\n    kind: all, reference or peg.",
          "inputSchema": {
            "properties": {
              "kind": {
                "default": "all",
                "description": "reference: tokens priced against an outside market (CBTC vs BTC, cETH vs ETH, eXAU, eXAG, CC); peg: stablecoins against $1; all: both",
                "enum": ["all", "reference", "peg"],
                "title": "Kind",
                "type": "string"
              }
            },
