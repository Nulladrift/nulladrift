        },
        {
          "name": "quote",
          "title": "Quote a trade on Canton DEXes",
          "description": "Best execution for selling `amount` of token `sell` (or `amount_usd` worth) for token `buy`, on\n    every venue that can make the trade on its own markets in one or two swaps: an AMM pool (Cantex,\n    Tradecraft, OneSwap, Pool Party), an order book (Temple, Rocky), or two of them in a row on the same\n    venue (Temple: CC to USDCx, then USDCx to CBTC; Pool Party: CC to USDC.B, then USDC.B to CBTC). The\n    same comparison as the site's best execution, at any size. Pool fees, book fees and price impact are\n    included; `after_network_fee` also takes off the venue's per-trade network fee on each swap (the fee\n    table, with which fees are measured, documented or assumed, is in `network_fees`). A pool whose\n    reserves have stood still while its price left the market is no market here (`not_trading`). A\n    venue whose route takes an order book that shows more of a token than exists (a side larger than its\n    registry's total supply) carries `book_shows_more_than_exists`: its price, not a size it can fill.",
          "inputSchema": {
            "properties": {
              "amount": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "How much of the sold token, in its own units. Give this or amount_usd, not both",
                "title": "Amount"
              },
              "amount_usd": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Size of the sale in US dollars at our price of the sold token. Give this or amount, not both",
                "title": "Amount Usd"
              },
              "buy": {
                "description": "Symbol of the token bought, e.g. USDCx",
                "title": "Buy",
                "type": "string"
              },
              "sell": {
                "description": "Symbol of the token sold, e.g. CC",
                "title": "Sell",
                "type": "string"
              }
            },
            "required": ["buy", "sell"],
            "title": "quoteArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
