          "name": "pools",
          "title": "Liquidity pools",
          "description": "CC pools on every AMM (Cantex, Tradecraft, OneSwap, Pool Party) with liquidity, 24h volume where\n    the venue publishes it, fee and LP fee APR from the last 24 hours of volume; a pool whose reserves\n    have stood still while its price left the market carries `not_trading_since`. sort_by: tvl, volume\n    or apr.",
          "inputSchema": {
            "properties": {
