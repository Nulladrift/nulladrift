{
  "lockfileVersion": 2,
  "subjects": {
    "app.lovable.answer-engine-ready/llmready": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://answer-engine-ready.lovable.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "llmready",
        "title": "LLMready",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LLMready audits how well websites can be read by AI search engines (ChatGPT Search, Perplexity, Gemini, Claude) and generates llms.txt files. Start with quick_check: it works without signing in and returns a site's 0–100 score, grade, category scores, AI crawler access and top 3 fixes without saving anything. It's limited to 10 checks a minute and 100 a day per IP address (per account when signed in). Every other tool needs the user to sign in with an LLMready Pro account; calling one without signing in returns a sign-in challenge (HTTP 401) that MCP clients use to start sign-in. With Pro: audit a site for every failing check, prioritized fixes and a shareable report link; generate or validate llms.txt files; list past audits and check remaining credits. Crawling tools cost 1 credit each from the monthly allowance; reads and validation are free. A score measures crawler access and readability — it never guarantees that an AI engine will cite the site, so don't promise that to users.",
      "tools": [
        {
          "name": "audit_url",
          "title": "Audit a website for AI search readiness",
          "description": "Crawl a public website live and score how well AI search engines (ChatGPT Search, Perplexity, Gemini, Claude) can access and read it: 0–100 score, grade, category scores, prioritized fixes and a shareable report link. Costs 1 credit. Requires signing in with LLMready Pro.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Website URL or bare domain, e.g. https://example.com or example.com",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f9d464bb48f2c87e70982233516c6fe0d2ef8a3601a4ccac3e46eee00c675b13"
        },
        {
          "name": "generate_llms_txt",
          "title": "Generate llms.txt and llms-full.txt",
          "description": "Crawl a website's key pages and generate a spec-compliant /llms.txt plus an /llms-full.txt with page content as Markdown, ready to upload to the site root. Costs 1 credit. Requires signing in with LLMready Pro.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Website URL or bare domain",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ee7e8ce3c45ff8bd45c3b4e1995c0b0a35fcb9e9700c8481e83198a7252410f6"
        },
        {
          "name": "get_audit",
          "title": "Get a saved audit",
          "description": "Fetch a saved audit from your LLMready account by id, including score, failing checks, AI crawler access and fixes. No credit cost. Requires signing in with LLMready Pro.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Audit id returned by audit_url or list_audits",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ff93ab864301aafb48b111596966808303ae34fb1e2fb555420f90112876ce6"
        },
        {
          "name": "get_usage",
          "title": "Check API credits",
          "description": "Show how many LLMready credits are used and left this month. No credit cost. Requires signing in with LLMready Pro.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:532f061a559c2fdbf80b6f3962a68f34ef775d2b9938f435722f098ffed49b97"
        },
        {
          "name": "list_audits",
          "title": "List your audits",
          "description": "List audits saved on your LLMready account, newest first, optionally for one domain. No credit cost. Requires signing in with LLMready Pro.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Only audits for this domain, e.g. example.com",
                "maxLength": 253,
                "type": "string"
              },
              "limit": {
                "description": "How many to return (default 20)",
