            "readOnly": true
          },
          "digest": "sha256:d696360e800ff796b5620c7ada08bb2f30faa00dab5eadecdb6f34723d4d6073"
        },
        {
          "name": "quick_check",
          "title": "Quick AI search readiness check (free)",
          "description": "Free, no sign-in, Pro or credits needed: 10 checks a minute and 100 a day per IP address (per account when signed in). Checks a public website live and returns its 0–100 AI search readiness score, grade, category scores, which AI crawlers robots.txt allows or blocks, whether llms.txt exists, and the top 3 fixes. Saves no report — audit_url (Pro) lists every failing check with a shareable report and badge.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Website URL or bare domain, e.g. https://example.com or example.com",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
