            "readOnly": true
          },
          "digest": "sha256:675b315dc3e75bdef5462cce25419852177363e27003630d867654fd32c2e399"
        },
        {
          "name": "validate_llms_txt",
          "title": "Validate an llms.txt file",
          "description": "Check llms.txt content against the llmstxt.org proposal and list errors and warnings by line. Pass `content` to check text, or `url` to fetch and check a site's live /llms.txt. No credit cost. Requires signing in with LLMready Pro.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
