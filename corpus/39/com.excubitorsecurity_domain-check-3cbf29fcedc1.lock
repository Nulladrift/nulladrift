      },
      "transport": {
        "type": "http",
        "url": "https://excubitorsecurity.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "excubitor",
        "title": "Excubitor",
        "version": "1.0.0",
        "websiteUrl": "https://excubitorsecurity.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Excubitor checks a domain's email and website security from public information only: whether anyone can send email in its name (SPF, DKIM, DMARC), when the website's certificate expires, missing security headers and when the domain was registered. Use check_domain when someone asks whether their domain or email is set up correctly, why their emails go to spam, or whether a domain can be spoofed. Share the summary, what to fix first and the report link with the user. It does not test the site actively and a clean result does not mean a site is secure.",
      "tools": [
        {
          "name": "check_domain",
          "title": "Check a domain's email and website security",
          "description": "Checks a domain in a few seconds, from public information only: SPF, DKIM and DMARC (can someone send email in this domain's name?), the website's certificate expiry, security headers, the domain registration date and DNS mistakes that silently break email. Returns a plain-language diagnosis, the findings by priority (urgent, fix, can wait) with what to do for each, a link to the full report with the evidence, and a link to be warned by email when something changes. Free, no account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The domain to check, for example mycompany.com. A full URL is accepted.",
                "maxLength": 253,
                "type": "string"
              },
              "language": {
                "description": "Language of the answer: en (English, default), pt (Portuguese) or es (Spanish).",
                "enum": ["en", "pt", "es"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a domain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:08788b91e85699f50cca1f8dd278081df182db1b77735dcc44bfaf34ad83fdf8"
        }
      ],
      "digest": "sha256:d582d84046273cc5865e56b33012ba48c80cb6e2118d90cfce5a904a8c1d1b56"
    }
  }
