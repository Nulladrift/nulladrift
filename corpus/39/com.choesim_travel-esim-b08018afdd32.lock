      "serverInfo": {
        "name": "choesim",
        "title": "ChoEsim travel eSIM",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ChoEsim sells prepaid, data-only travel eSIM plans (prices in USD). Use search_plans to find plans for a destination, get_plan for details, get_policies for refund, delivery and device rules. Give the buyer the cartUrl of the chosen plan: it opens choesim.com with that plan in the cart, where the buyer reviews and pays. Prices change: quote the price from a fresh tool result, not from memory.",
      "tools": [
        {
          "name": "get_plan",
          "title": "Get one eSIM plan",
          "description": "Details of one plan by id (from search_plans): price, data, validity, coverage, network speed, when validity starts, fair-use note, plan page and cart URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Plan id",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one eSIM plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:18f39153115e946f0fb03f545c9eb7efd68ff8333bd6dec2477525155d148c7c"
        },
        {
          "name": "get_policies",
          "title": "ChoEsim policies",
          "description": "Facts that apply to every ChoEsim plan: device requirements, data-only, delivery, refund rule, support contact, payment methods, with links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "ChoEsim policies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f400cdd4419b3d923a58c8937503d40a8d8941d7e61dbdb27cfe46c43afab5f4"
        },
        {
          "name": "search_plans",
          "title": "Search travel eSIM plans",
          "description": "Find purchasable eSIM data plans for a destination, cheapest first. Returns price in USD, data, validity, coverage, plan page URL and a cart URL that opens choesim.com with the plan in the cart.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Country name in English (e.g. \"Japan\") or a common local name (e.g. \"Nhật Bản\", \"Japón\", \"日本\"), or ISO 3166-1 alpha-2 code (e.g. \"JP\"). A region word such as \"Europe\", \"Asia\" or \"Global\" matches regional plans by name.",
                "type": "string"
              },
              "include_regional": {
                "description": "Also list multi-country plans that cover the destination (default true).",
                "type": "boolean"
              },
              "max_results": {
                "description": "Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_days": {
                "description": "Trip length in days: the plan must last at least this long. Pay-per-day plans are listed for trips of up to 30 days.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "min_gb": {
                "description": "Smallest total data in GB (for pay-per-day plans: data per day times min_days).",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search travel eSIM plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:463db38d63ac5e3260fcdcf449434050fbe0b5ef1058598e527aa5c64ae80741"
        }
      ],
