{
  "lockfileVersion": 2,
  "subjects": {
    "com.choesim/travel-esim": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://choesim.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "choesim",
        "title": "ChoEsim travel eSIM",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ChoEsim sells prepaid, data-only travel eSIM plans (prices in USD). Use search_plans to find plans for a destination, get_plan for details, get_policies for refund, delivery and device rules, list_destinations or list_regions when the buyer has not chosen a destination yet. Give the buyer the cartUrl of the chosen plan: it opens choesim.com with that plan in the cart, where the buyer reviews and pays. Prices change: quote the price from a fresh tool result, not from memory.",
      "tools": [
        {
          "name": "get_plan",
          "title": "Get one eSIM plan",
          "description": "Details of one plan by id (from search_plans): price, data, validity, coverage, network speed, when validity starts, fair-use note, plan page and cart URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Plan id",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one eSIM plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:18f39153115e946f0fb03f545c9eb7efd68ff8333bd6dec2477525155d148c7c"
        },
        {
          "name": "get_policies",
          "title": "ChoEsim policies",
          "description": "Facts that apply to every ChoEsim plan: device requirements, data-only, delivery, refund rule, support contact, payment methods, with links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "ChoEsim policies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f400cdd4419b3d923a58c8937503d40a8d8941d7e61dbdb27cfe46c43afab5f4"
        },
        {
          "name": "list_destinations",
          "title": "List eSIM destinations",
          "description": "Use when the buyer has not chosen a country yet or asks which countries are available: every country that has a purchasable single-country plan, with the number of plans, the lowest one-time plan price (\"from\", USD) and the destination page URL. Then call search_plans for that country.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List eSIM destinations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2ed085d49900d7db8769e3859912152ad1f0a03c34323f48789ab3691c049fc6"
        },
        {
          "name": "list_regions",
          "title": "List multi-country eSIM plans",
          "description": "Use when the trip crosses several countries: the purchasable multi-country plan groups, each with its name as the catalogue gives it, the exact list of covered countries (ISO codes), the number of plans and the lowest one-time plan price (\"from\", USD). Then call search_plans with one of the countries or the group name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List multi-country eSIM plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad42df84859d95c8a6868a8c5b5c03499eee171c10d34448b0c82bebb5612582"
        },
        {
          "name": "search_plans",
          "title": "Search travel eSIM plans",
          "description": "Find purchasable eSIM data plans for a destination, cheapest first. Returns price in USD, data, validity, coverage, plan page URL and a cart URL that opens choesim.com with the plan in the cart.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Country name in English (e.g. \"Japan\") or a common local name (e.g. \"Nhật Bản\", \"Japón\", \"日本\"), or ISO 3166-1 alpha-2 code (e.g. \"JP\"). A region word such as \"Europe\", \"Asia\" or \"Global\" matches regional plans by name.",
                "type": "string"
              },
              "include_regional": {
                "description": "Also list multi-country plans that cover the destination (default true).",
                "type": "boolean"
              },
              "max_price_usd": {
                "description": "Highest price in USD the buyer wants to pay (for pay-per-day plans: the price for min_days, or 7 days if min_days is not given).",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "max_results": {
                "description": "Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_days": {
                "description": "Trip length in days: the plan must last at least this long. Pay-per-day plans are listed for trips of up to 30 days.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "min_gb": {
                "description": "Smallest total data in GB (for pay-per-day plans: data per day times min_days).",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search travel eSIM plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f7974cad0a8f28a87f629de4615757e4df229eacf702e92ef1908b5fda86782c"
        }
      ],
      "digest": "sha256:bbf8759c82f1cbd93a05b708ec81444e8ea4bf144fc36e7a065a6afe4ec7f373"
    }
  }
}
