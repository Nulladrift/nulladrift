      "serverInfo": {
        "name": "pride-pilot",
        "title": "Pride Pilot",
        "version": "1.0.0",
        "websiteUrl": "https://pridepilot.app"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Pride Pilot answers travel questions for gay, lesbian, bisexual, trans, nonbinary, queer and other LGBTQ+ travelers, and for families and friends traveling with them, with dated, sourced information. It covers questions such as whether a destination is safe or legal for LGBTQ+ people, whether a same-sex couple can hold hands or share a room, what trans travelers should know about ID, passports and bathrooms, Pride and other LGBTQ+ events on trip dates, gay and lesbian bars, clubs and neighborhoods, and LGBTQ+ welcoming hotels and tours. check_destination_safety breaks a destination into separate dimensions (legal protections, public acceptance and affection norms, trans and nonbinary ID and entry, official advisories and recent changes, help on the ground, entry and health). Never reduce these to a single safe or unsafe verdict: a place can be fine in one dimension and risky in another, and for one kind of traveler but not another. Give each item's as_of date and sources, pass on its confirm_with advice, and say when an item is marked stale or when official advice changed after Pride Pilot's review. find_lgbtq_places, find_welcoming_stays and find_lgbtq_tours separate two kinds of result. Anything under 'vetted' was checked by Pride Pilot, and its vetting basis says how (LGBTQ+ owned, IGLTA member, reviewer check, press). Anything under 'general' is an ordinary booking search or listing that Pride Pilot has not checked: never call those results vetted, verified, LGBTQ+ owned or LGBTQ+ friendly. find_lgbtq_events lists only dates confirmed by an organizer, tourism board or ticket listing. Booking links are affiliate links: when sharing one, say it is an affiliate link.",
      "tools": [
        {
          "name": "check_destination_safety",
          "title": "Check a destination for LGBTQ+ travelers",
          "description": "Is it safe to travel there as a gay, lesbian, bi, trans or queer person? Dated, sourced LGBTQ+ travel conditions for 227 countries and territories and 18 LGBTQ+ hub cities, broken into separate dimensions: legal protections (whether same-sex relationships are legal, marriage recognition, anti-discrimination laws), public acceptance and showing affection in public (holding hands, kissing), trans and nonbinary ID, passports, entry and bathrooms, official UK and US travel advisories and recent changes, help on the ground (LGBTQ+ helplines, emergency numbers), and entry and health. Add trip dates to get Pride and events during the trip and what to confirm before going, or since to get what changed. Call it without a destination to list covered places.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Country or city, e.g. 'Lisbon' or 'Thailand'",
                "type": "string"
              },
              "dimension": {
                "description": "Optional: return just one dimension",
                "enum": ["legal_protections", "public_acceptance", "trans_nonbinary", "recent_advisories", "help_on_the_ground", "entry_and_health"],
                "type": "string"
              },
              "end_date": {
                "description": "Optional trip end, YYYY-MM-DD",
                "type": "string"
              },
              "since": {
                "description": "Optional: show changes since this date, YYYY-MM-DD",
                "type": "string"
              },
              "start_date": {
                "description": "Optional trip start, YYYY-MM-DD",
                "type": "string"
              },
              "traveler_type": {
                "description": "Optional: who is traveling (same_sex_couple, trans_nonbinary, family_with_kids, solo or event_traveler). Only pass it when the user has said it.",
                "enum": ["same_sex_couple", "trans_nonbinary", "family_with_kids", "solo", "event_traveler"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a destination for LGBTQ+ travelers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d4bc1d51bac129f67582c21fd2021f7dff3f53a76f33df4008a84c877ab2c646"
        },
        {
          "name": "find_lgbtq_events",
          "title": "Find LGBTQ+ events",
          "description": "Use for Pride calendars and LGBTQ+ event questions. Find Pride parades and festivals, gay and lesbian parties, circuit and dance events, bear weeks, drag and queer arts and culture festivals, LGBTQ+ sports weeks, gay and lesbian cruises, and community events in a destination between two dates (defaults to the next 120 days). Only dates confirmed by an organizer, tourism board or ticket listing are included. Leave out destination to get the calendar across every covered destination.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Optional destination; leave out for all destinations",
                "type": "string"
              },
              "event_type": {
                "description": "Optional: pride, festival, party, cruise, film, music or sports",
                "enum": ["pride", "festival", "party", "cruise", "film", "music", "sports"],
                "type": "string"
              },
              "from": {
                "description": "Optional start, YYYY-MM-DD",
                "type": "string"
              },
              "to": {
                "description": "Optional end, YYYY-MM-DD",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find LGBTQ+ events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:133666ef3dd95eeb8a47ae46f416f9c6510d8febce4d4abb01a14b8b330c6b39"
        },
        {
          "name": "find_lgbtq_places",
          "title": "Find verified LGBTQ+ places",
          "description": "Find gay bars, lesbian bars, queer clubs and dance parties, drag venues, cafes, restaurants, gay beaches, gay saunas, gay neighborhoods (gayborhoods), LGBTQ+ community centers, sexual health clinics and shops that Pride Pilot has verified as LGBTQ+ owned, LGBTQ+ focused or verified welcoming, each with how it was vetted. Bars and clubs are separate kinds. Only verified places are ever returned. Places can carry tags such as women_only, women_focused, men_only and seasonal.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Destination",
                "type": "string"
              },
              "kind": {
                "description": "Optional type of place: bar for bars, club for dance clubs and parties, sauna for gay saunas",
                "enum": ["hotel", "guesthouse", "bar", "club", "nightlife", "restaurant", "cafe", "beach", "neighborhood", "community_center", "health_clinic", "tour", "shop", "cruising_area", "sauna"],
                "type": "string"
              },
              "tag": {
                "description": "Optional: women_only, women_focused, men_only or seasonal",
                "enum": ["women_only", "women_focused", "men_only", "seasonal"],
                "type": "string"
              },
              "tier": {
                "description": "Optional: lgbtq_owned, lgbtq_focused or verified_welcoming",
                "enum": ["lgbtq_owned", "lgbtq_focused", "verified_welcoming"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find verified LGBTQ+ places"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8196a88a1f96a4d7ba0ec9267732de0ab6d1f5924a1a10961710440d9bb5aa06"
        },
        {
          "name": "find_lgbtq_tours",
          "title": "Find LGBTQ+ tours and experiences",
          "description": "Find tours, activities and things to do anywhere, e.g. a queer history walk in Berlin, a drag brunch, a gay nightlife tour in Madrid or a snorkel trip in Puerto Vallarta. 'vetted' holds queer-led or LGBTQ+ focused tours Pride Pilot has checked. 'general' holds bookable Viator tours that Pride Pilot has not reviewed for inclusivity. Where a destination has a safety warning for the traveler, the Viator search leans to private tours.",
          "inputSchema": {
            "properties": {
              "activity": {
                "description": "What they want to do",
                "type": "string"
              },
              "count": {
                "default": 5,
                "description": "How many Viator tours, 1 to 10",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "destination": {
                "description": "Destination anywhere",
                "type": "string"
              },
              "traveler_type": {
                "description": "Optional: who is traveling (same_sex_couple, trans_nonbinary, family_with_kids, solo or event_traveler). Only pass it when the user has said it.",
                "enum": ["same_sex_couple", "trans_nonbinary", "family_with_kids", "solo", "event_traveler"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find LGBTQ+ tours and experiences"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0de243c5d307be7a40970b10fa97105bd3d86b9b5471742d11dfae6326fb6971"
        },
        {
          "name": "find_welcoming_stays",
          "title": "Find LGBTQ+ welcoming stays",
          "description": "Find gay-friendly and LGBTQ+ welcoming hotels and places to stay anywhere for the traveler's dates. 'vetted' holds stays Pride Pilot has checked (LGBTQ+ owned, LGBTQ+ focused or verified welcoming, with how each was vetted). 'general' holds hotel searches on Expedia, Hotels.com and Orbitz with the booking site's own LGBTQ+ welcoming filter on: those hotels are not checked by Pride Pilot. Pass traveler_country for Canadian or UK travelers.",
          "inputSchema": {
            "properties": {
              "adults": {
                "default": 2,
                "description": "Number of adults",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "check_in": {
                "description": "Optional check-in, YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "Optional check-out, YYYY-MM-DD",
                "type": "string"
              },
              "destination": {
                "description": "Destination anywhere, e.g. 'Lisbon' or 'Puerto Vallarta'",
                "type": "string"
              },
              "traveler_country": {
                "description": "Optional: where the traveler lives, e.g. 'Canada' or 'UK'",
                "type": "string"
              },
              "traveler_type": {
                "description": "Optional: who is traveling (same_sex_couple, trans_nonbinary, family_with_kids, solo or event_traveler). Only pass it when the user has said it.",
                "enum": ["same_sex_couple", "trans_nonbinary", "family_with_kids", "solo", "event_traveler"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find LGBTQ+ welcoming stays"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:65e20113ee9ed73db9474ccb003509b040593f70f46a04b60df1f0042a55e573"
        }
