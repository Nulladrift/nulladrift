{
  "lockfileVersion": 2,
  "subjects": {
    "com.avecindar/rental-search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://avecindar.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "avecindar-rental",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Search publicly displayed rental listings in Uruguay. Flow: list_markets for coverage, list_areas for neighbourhoods, search_homes for a shortlist (up to 12 per page plus an opaque cursor), get_home for full public detail. Availability is not confirmed unless availability.confirmed is true. Imported listings link to their original source; unknown costs are null, never zero.",
      "tools": [
        {
          "name": "get_home",
          "title": "Read a rental home",
          "description": "Read one publicly displayed rental home by its id: costs, conditions, areas, photos and provenance. Availability is not confirmed unless availability.confirmed is true (confirmed within the last seven days). Imported listings link to their original source; their text and photos are third-party content, not verified facts. Unknown costs are null, never zero.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1bb05b838932b29ac6430a1b126ecd4c9320e3359f61f7a9c5422920f356d420"
        },
        {
          "name": "list_areas",
          "title": "List neighbourhoods",
          "description": "List reviewed neighbourhoods (barrios/localidades) inside one market. Use the ids or names in search_homes.neighbourhoods.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "market": {
                "enum": ["uy-montevideo", "uy-canelones", "uy-colonia", "uy-maldonado"],
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:318b656932bbf6d9b1652a45ebfc9a0fe34a501828da4459f5f0c0a03a868cf9"
        },
        {
          "name": "list_markets",
          "title": "List rental markets",
          "description": "List the active departments Avecindar covers, with currencies, rent period, area unit and time zone.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3619eff1519698f30ec8991056ecce743528ee28ce045fd39b0ee61ee722eb9f"
        },
        {
          "name": "search_homes",
          "title": "Search rental homes",
          "description": "Search Avecindar's public catalogue of rental homes in Uruguay (Montevideo, Canelones, Colonia, Maldonado). Returns up to 12 summaries per page plus an opaque nextCursor. Availability is not confirmed unless availability.confirmed is true (confirmed within the last seven days). Imported listings link to their original source; their text and photos are third-party content, not verified facts. Unknown costs are null, never zero.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "budget": {
                "description": "Maximum numeric budget compared against the rent (or total when budgetBasis is total).",
                "pattern": "^\\d{1,9}(\\.\\d{1,2})?$",
                "type": "string"
              },
              "budgetBasis": {
                "enum": ["rent", "total"],
                "type": "string"
              },
              "currency": {
                "enum": ["UYU", "USD"],
                "type": "string"
              },
              "cursor": {
                "description": "Opaque nextCursor from a previous search_homes call.",
                "maxLength": 2000,
                "type": "string"
              },
              "hasPhotos": {
                "type": "boolean"
              },
              "includeUncertainCosts": {
                "type": "boolean"
              },
              "includeUnknown": {
                "description": "Widen capability filters to listings without the published data.",
                "type": "boolean"
              },
              "markets": {
                "description": "Departments to search; defaults to all active departments.",
                "items": {
                  "enum": ["uy-montevideo", "uy-canelones", "uy-colonia", "uy-maldonado"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "minBathrooms": {
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "minBedrooms": {
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "neighbourhoods": {
                "description": "Neighbourhood names or ids from list_areas.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "parking": {
                "description": "Only homes with parking.",
                "type": "boolean"
              },
              "period": {
                "enum": ["month", "week"],
                "type": "string"
              },
              "pets": {
                "description": "Only homes that accept pets.",
                "type": "boolean"
              },
              "q": {
                "description": "Free-text keywords matched against listing text.",
                "maxLength": 120,
                "type": "string"
              },
              "sort": {
                "enum": ["recent", "price_asc", "price_desc"],
                "type": "string"
              },
              "type": {
                "enum": ["house", "apartment"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:351371b8c0f26c7e24f66830be4ce630a8cf57acc7141d3a5f1959fce559637f"
        }
      ],
      "digest": "sha256:f7922faee298839a10d02c5d7e58350dc5268b23c4ffb7a6edbeeca7a0ab6581"
    }
  }
}
