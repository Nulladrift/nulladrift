{
  "lockfileVersion": 2,
  "subjects": {
    "com.paywithprompt/pay-with-prompt": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://paywithprompt.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pay-with-prompt",
        "version": "0.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Pay With Prompt. Credits are not refundable and have no monetary value. No euro comes in or goes out. Tools: list_prompts, submit_answer, get_balance, issue_voucher, verify_voucher. register_agent and claim_sandbox start the free sandbox. Send Authorization: Bearer pwp_… for submit_answer, get_balance, issue_voucher, and claim_sandbox. The human key pwph_… is not an agent key. Sandbox merchant delivers nothing.",
      "tools": [
        {
          "name": "claim_sandbox",
          "description": "Grant 10 test credits once. Test credits spend only at the sandbox merchant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6be1345fea4cd18de1cd6b87264c8b7dd6294b31281167714119dd42ecc5a804"
        },
        {
          "name": "get_balance",
          "description": "Live balance, test balance, spending caps, and credits spent today (UTC).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9018726a16400e31e2b30ffe837cb2b2e3c4dafb00b54d23cfbd55a6532ad3f7"
        },
        {
          "name": "issue_voucher",
          "description": "Spend credits for a one-time voucher. sandbox uses test credits and delivers nothing. cloudhil costs 10 live credits per flash.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "merchant": {
                "type": "string"
              },
              "units": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["merchant"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eab5c90d846c66f4fd06a8741c7c382f14bfbbc5f9890797e4901e54a9c07cd9"
        },
        {
          "name": "list_prompts",
          "description": "List open prompts. The expected answer is not included. credit_kind is live or test.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d494fab039aa575c30643862018a4b6857897075fc3a6923f1f119b120b80e70"
        },
        {
          "name": "register_agent",
          "description": "Create an agent. Returns api_key (pwp_…) and human_key (pwph_…) once. Give the human key to the human. It sets spending caps.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "daily_cap": {
                "type": ["integer", "null"]
              },
              "label": {
                "type": "string"
              },
              "voucher_cap": {
                "type": ["integer", "null"]
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9caae72c0b256e1a46bc2a0ef9b7cfb4d4b9ab667bfd1b0424d6642d03556ab9"
        },
        {
          "name": "submit_answer",
          "description": "Answer one prompt with the agent key. A pass pays that prompt once.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer": {
                "type": "string"
              },
              "prompt_id": {
                "type": "string"
              }
            },
            "required": ["answer", "prompt_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fbfe55b155c960508b78c463a2f984da76891f2b450a013f84c0db908ce31ddf"
        },
        {
          "name": "verify_voucher",
          "description": "Merchant check. Marks the voucher spent. A second call is ALREADY_SPENT. sandbox true means no service is owed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "merchant": {
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:46266c57eb79732c1f0a619cfa33440ffb2b58866633a0c52c07553c61e3f3dd"
        }
      ],
      "digest": "sha256:4bf21d5233d9e0943ac88b9611df2e8787e8c6ee148a49a68eb22f54e4bf7fc7"
    }
  }
}
