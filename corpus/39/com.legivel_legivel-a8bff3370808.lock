      "serverInfo": {
        "name": "legivel",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "legivel turns Markdown documents and saved templates into PDFs, keeps the account's templates (made from Markdown, HTML or an editor document), and reports how many of the account's documents for the period are used. The tools act on a legivel account: the client signs in to it, or sends a legivel API key as a bearer token. The guide is at https://legivel.com/docs/mcp.",
      "tools": [
        {
          "name": "create_template",
          "title": "Create template",
          "description": "Save a new template. Send exactly one of body (an editor document), markdown, html or starter. In Markdown and HTML, write {{path}} where a value from the data goes; headings, paragraphs, lists, quotes, code and tables become editable blocks, and images and scripts are left out (left lists them). A starter answers its sample data too, for preview_template. Answers the id, the revision and the fields.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "An editor document, as get_template returns it. Images are PNG or JPEG data URLs or asset ids. get_template_format describes every key.",
                "type": "object"
              },
              "html": {
                "description": "HTML to import; {{path}} becomes a field.",
                "type": "string"
              },
              "markdown": {
                "description": "Markdown to import; {{path}} becomes a field.",
                "type": "string"
              },
              "name": {
                "description": "A name of 1 to 120 characters, unique in the account.",
                "type": "string"
              },
              "starter": {
                "description": "A starter template to begin from. get_template_format describes each one.",
                "enum": ["blank", "invoice", "letter", "label", "certificate"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Create template"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7bca211e8afde5b2d6d6341e3abaf901b791e7ae6ed538524e7b063c321f70c4"
        },
        {
          "name": "delete_template",
          "title": "Delete template",
          "description": "Delete a template with its images. Renders that name it answer not_found at once. This cannot be undone.",
