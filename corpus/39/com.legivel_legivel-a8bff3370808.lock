        {
          "name": "preview_template",
          "title": "Preview template",
          "description": "Pictures of a saved template's pages filled with data, to check how it looks before render_template. It does not count as a document and nothing is stored. It uses your plan's hourly preview budget, which the editor's previews share. Answers JPEG pictures of up to 4 pages and a text block with the page count and the problems: data that does not fill the template, text that does not fit its box, an item that covers text and an item past the page edge, each with its path and page. A missing field shows as ‹path› in the picture; a graphic that does not draw shows as an empty frame. Ask for later pages with first_page. Look at each picture, change the body with update_template, and preview again until it is right.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "csv": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "CSV text for each table source, keyed by the source name. The first row names the columns.",
                "type": "object"
              },
              "data": {
                "description": "Sample field values. Each data path of the template reads one value from here.",
                "type": "object"
              },
              "dpi": {
                "default": 96,
                "description": "The picture resolution. 96 shows text down to 8 pt; 144 shows smaller print. The longer side stays at most 1,568 pixels.",
                "maximum": 144,
                "minimum": 72,
                "type": "integer"
              },
              "first_page": {
                "default": 1,
                "description": "The first page to picture. 1 is the first page.",
                "minimum": 1,
                "type": "integer"
              },
              "page_count": {
                "default": 4,
                "description": "How many pages to picture from first_page.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "template": {
                "description": "The template's id or its name, as list_templates gives them.",
                "type": "string"
              }
            },
            "required": ["template"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "Preview template"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fd97c2b71bdbe807d9f5be82cd307b133452217a248f4335ffdc74b4cb72b253"
        },
        {
          "name": "render_pdf",
          "title": "Render Markdown to PDF",
          "description": "Turn a Markdown document into a PDF and return the PDF. Each successful render counts as one document. Re-sending the same document with the same idempotency key returns the same PDF and is not counted again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "features": {
                "additionalProperties": false,
                "description": "Optional switches for Markdown features: Mermaid diagrams, diagram pages, syntax highlighting, images, smart typography, task lists, emoji, math, barcodes, SVG, HTML blocks, bare links, indented code, the source attachment, hyphenation, the theme and the PDF standards: archive, accessible, mathml and standards. Every switch is on unless you set it to false, except diagram pages, the source attachment and archive, which are off unless you set them to true, and mathml, which without a value is on for an accessible document with formulas; the theme is light unless you set it to dark; standards is best_effort unless you set it to strict.",
                "properties": {
                  "accessible": {
                    "default": true,
                    "description": "Tag the PDF for screen readers and write its title and language into it. On unless set to false here or, when this is not sent, as accessible: false in the front matter. Without a language, the PDF gets the main language of the text, or en when the text does not show it clearly. The PDF claims PDF/UA-2 when the document meets it. With formulas, it also adds a MathML file for each formula. The free, watermarked delivery is a picture of each page and has no tags.",
                    "type": "boolean"
                  },
                  "archive": {
                    "default": false,
                    "description": "Write the PDF to the archive rules. The PDF claims PDF/A-4, or PDF/A-4f when it carries attached files. Off unless set to true. The free, watermarked delivery claims no standard.",
                    "type": "boolean"
                  },
                  "barcode": {
                    "default": true,
                    "description": "Draw barcode and QR code blocks.",
                    "type": "boolean"
                  },
                  "bare_autolinks": {
                    "default": true,
                    "description": "Turn bare URLs and email addresses into links. Off leaves them as plain text.",
                    "type": "boolean"
                  },
                  "embed_source": {
                    "default": false,
                    "description": "Attach the Markdown source to the PDF as an embedded file named document.md. Off unless set to true. The free, watermarked delivery leaves it out.",
                    "type": "boolean"
                  },
                  "emoji": {
                    "default": true,
                    "description": "Replace :shortcode: names with emoji.",
                    "type": "boolean"
                  },
                  "highlight": {
                    "default": true,
                    "description": "Color code blocks by language.",
                    "type": "boolean"
                  },
                  "html_blocks": {
                    "default": true,
                    "description": "Render HTML blocks and inline HTML with their styles.",
                    "type": "boolean"
                  },
                  "hyphenation": {
                    "description": "Hyphenate justified text. It needs a document language, sent or in the front matter: without one the text is not hyphenated. A detected language does not count. Setting it to true is refused for a language with no hyphenation dictionary.",
                    "type": "boolean"
                  },
                  "images": {
                    "default": true,
                    "description": "Draw the images and other files the document links to. Off leaves them out.",
                    "type": "boolean"
                  },
                  "indented_code": {
                    "default": true,
                    "description": "Render blocks indented by four spaces as code.",
                    "type": "boolean"
                  },
                  "math": {
                    "default": true,
                    "description": "Typeset mathematics written in LaTeX notation.",
                    "type": "boolean"
                  },
                  "mathml": {
                    "description": "Attach a MathML file to each formula. Without a value, an accessible PDF gets the files when the document has formulas. true turns tagging on even when accessible is false. false leaves them out, and then an accessible PDF with formulas does not claim PDF/UA-2.",
                    "type": "boolean"
                  },
                  "mermaid": {
                    "default": true,
                    "description": "Draw Mermaid blocks as diagrams.",
                    "type": "boolean"
                  },
                  "mermaid_appendix": {
                    "default": false,
                    "description": "Put each diagram on a page of its own after the document, with a link where the diagram was written. Off unless set to true: diagrams stay where they are written.",
                    "type": "boolean"
                  },
                  "smart_typography": {
                    "default": true,
                    "description": "Set straight quotes, dashes and ellipses as their typographic forms.",
                    "type": "boolean"
                  },
                  "standards": {
                    "default": "best_effort",
                    "description": "best_effort: the render does not fail for a standard, and the warnings tell what was left out. strict: a render that leaves out a requested standard is refused with 422 and the warning code, and the document is not counted. PDF/UA-2 counts as requested unless accessible is false.",
                    "enum": ["best_effort", "strict"],
                    "type": "string"
                  },
                  "svg": {
                    "default": true,
                    "description": "Draw SVG images as vectors. Off leaves them out.",
                    "type": "boolean"
                  },
                  "tasks": {
                    "default": true,
                    "description": "Draw task list items as checkboxes.",
                    "type": "boolean"
                  },
                  "theme": {
                    "default": "light",
                    "description": "The page and text colors: light or dark. A `theme: light` or `theme: dark` key in the document's front matter wins over this.",
                    "enum": ["light", "dark"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "filename": {
                "description": "A file name for the PDF, such as report.pdf. The result returns it, cleaned of characters a file name cannot hold, to save the PDF under. A document without a front matter title takes it, without .pdf, as its PDF title.",
                "type": "string"
              },
              "footer": {
                "description": "Older spelling of page.footer, which wins over it.",
                "oneOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "boolean"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "center": {
                        "type": "string"
                      },
                      "left": {
                        "type": "string"
                      },
                      "right": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                ]
              },
              "format": {
                "description": "Older spelling of page.size, which wins over it. A paper name such as A4 or A5 landscape. It wins over width and height.",
                "type": "string"
              },
              "header": {
                "description": "Older spelling of page.header, which wins over it.",
                "oneOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "boolean"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "center": {
                        "type": "string"
                      },
                      "left": {
                        "type": "string"
                      },
                      "right": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                ]
              },
              "height": {
                "description": "Older spelling of page.size, with width. The page height, written as width is.",
                "type": ["string", "number"]
              },
              "idempotency_key": {
                "description": "A per-document idempotency key. Reuse it only for the same document and options.",
                "type": "string"
              },
              "language": {
                "description": "The document's language as a tag such as en-GB. It sets the hyphenation rules, and the PDF records it as its document language. Omit it to use the language set in the document's front matter, if there is one. Without either, an accessible PDF gets the main language of the text, which the converter detects without sending the text anywhere, or en when the text does not show it clearly. That language goes into the PDF's tags only and turns no hyphenation on. The result names the PDF's language and where it came from: document, detected or default.",
                "type": "string"
              },
              "margin": {
                "description": "Older spelling of page.margin, which wins over it. A number alone is in points.",
                "type": ["string", "number"]
              },
              "markdown": {
                "description": "The Markdown text of the document.",
                "type": "string"
              },
              "output": {
                "default": "resource",
                "description": "How the PDF comes back. resource: in the result. upload: sent to upload_url, and the result is a receipt with the page count, size and hash.",
                "enum": ["resource", "upload"],
                "type": "string"
              },
              "page": {
                "additionalProperties": false,
                "description": "The page settings, as the front matter page: key takes them. Each key wins over the older flat key of the same setting and over the front matter. Placeholders in header, footer and numbering texts: {page}, {pages} (the number of the last page), {title}, {author}.",
                "properties": {
                  "first": {
                    "description": "false leaves the header, the footer and the page number off the first page, as on a title page.",
                    "type": "boolean"
                  },
                  "footer": {
                    "description": "Text at the bottom of every page, written as header is; true is the default footer. A footer text at the page number's position, or false, replaces the number.",
                    "oneOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "boolean"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "center": {
                            "type": "string"
                          },
                          "left": {
                            "type": "string"
                          },
                          "right": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      }
                    ]
                  },
                  "header": {
                    "description": "Text at the top of every page: a string for the center, true for the default (no text), false for none, or left, center and right strings. Inline Markdown, at most five lines of 100 characters per position.",
                    "oneOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "boolean"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "center": {
                            "type": "string"
                          },
                          "left": {
                            "type": "string"
                          },
                          "right": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      }
                    ]
                  },
                  "margin": {
                    "description": "The page margins in CSS order, one to four lengths: all sides; top and bottom, left and right; top, left and right, bottom; or top, right, bottom, left. Such as 20mm or 10mm 15mm, in mm, cm, in or pt.",
                    "type": "string"
                  },
                  "numbering": {
                    "description": "The page number: a style 1, a, A, i or I (1 may be the number 1), or a text such as Page {page} of {pages}; true for the default; false for none; or an object with style, text, position and start. The default is {page} / {pages} in the footer center.",
                    "oneOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "boolean"
                      },
                      {
                        "const": 1,
                        "type": "integer"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "position": {
                            "description": "header or footer, and left, center or right, such as footer right. The default is footer center.",
                            "type": "string"
                          },
                          "start": {
                            "description": "The number of the first page. The default is 1.",
                            "maximum": 9999,
                            "minimum": 1,
                            "type": "integer"
                          },
                          "style": {
                            "description": "The number style: 1, a, A, i or I. The style 1 may be the number 1.",
                            "oneOf": [
                              {
                                "enum": ["1", "a", "A", "i", "I"],
                                "type": "string"
                              },
                              {
                                "const": 1,
                                "type": "integer"
                              }
                            ]
                          },
                          "text": {
                            "description": "The number text, such as Page {page} of {pages}.",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      }
                    ]
                  },
                  "size": {
                    "description": "A paper name such as A4, A5, Letter or Legal, optionally followed by landscape or portrait; or the width and height as two lengths, such as 210mm 99mm. Each side must be between 10 mm and 2 m. Omit it to use the front matter, else A4.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "page_numbering": {
                "description": "Older spelling of page.numbering, which wins over it: a text, a style 1, a, A, i or I, true for the default, or false.",
                "oneOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "boolean"
                  },
                  {
                    "const": 1,
                    "type": "integer"
                  }
                ]
              },
              "papersize": {
                "description": "Older spelling of page.size, as in Quarto. format wins when both are set.",
                "type": "string"
              },
              "resources": {
                "description": "What to do when an image or other linked file cannot be fetched. strict: the render fails. lenient: the PDF shows a placeholder box in its place.",
                "enum": ["strict", "lenient"],
                "type": "string"
