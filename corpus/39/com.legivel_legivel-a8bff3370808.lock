        {
          "name": "render_template",
          "title": "Render template to PDF",
          "description": "Fill a saved template with data and return the PDF. Each successful render counts as one document. Re-sending the same data with the same idempotency key returns the same PDF and is not counted again. Text that does not fit its box, an item that covers text and an item past the page edge come back as warnings; the PDF is made all the same.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "csv": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "CSV text for each table source, keyed by the source name. The first row names the columns.",
                "type": "object"
              },
              "data": {
                "description": "The field values. Each data path of the template reads one value from here.",
                "type": "object"
              },
              "idempotency_key": {
                "maxLength": 256,
                "type": "string"
              },
              "template": {
                "description": "The template's id or its name, as list_templates gives them.",
                "type": "string"
              }
            },
            "required": ["template"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Render template to PDF"
          },
