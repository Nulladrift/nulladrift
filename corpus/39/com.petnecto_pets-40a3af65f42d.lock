        {
          "name": "find_pets",
          "title": "Find pets to adopt",
          "description": "Search pets to adopt in the places we list (Taiwan, King County WA, Montgomery County MD, Zaragoza, Fukushima Prefecture, and Vienna, found pets only: marked found:true, not adoptable yet; found=exclude leaves them out). Nowhere else yet. Search near a place (nearest first), by species, age, size, sex, breed and color, or by words in any of 10 languages (q). No place and no country = everything we list. Returns names, short facts, distance, the rescue and a link to each listing, plus what q was understood as; an empty answer says what we do list.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "age": {
                "description": "Taiwan says only Young or Adult",
                "enum": ["Baby", "Young", "Adult", "Senior"],
                "type": "string"
              },
              "breed": {
                "description": "Breed name in any language, or Wikidata id",
                "maxLength": 80,
                "type": "string"
              },
              "color": {
                "enum": ["black", "white", "brown", "yellow", "grey", "orange", "cream", "tabby", "calico", "spotted"],
                "type": "string"
              },
              "country": {
                "description": "TW (Taiwan), US (King County WA, Montgomery County MD only), ES (Zaragoza), AT (Vienna, found pets only) or JP (Fukushima Prefecture). Not needed with near",
                "enum": ["TW", "US", "ES", "AT", "JP"],
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous answer",
                "maxLength": 80,
                "type": "string"
              },
              "detail": {
                "description": "find_pets default brief; full = every field of pet.v1",
                "enum": ["brief", "full"],
                "type": "string"
              },
              "facets": {
                "description": "Add counts by species, size, age, sex, region",
                "type": "boolean"
              },
              "found": {
                "description": "Found pets (Vienna's, announced for their owners first) are included by default, marked found:true, NOT adoptable. exclude = adoptable only. Never call one adoptable",
                "enum": ["include", "exclude", "only"],
                "type": "string"
              },
              "good_with": {
                "description": "Only pets whose listing says so; rarely stated. kids is not offered; if it is passed anyway, the answer lists pets whose listing does not say (good_with_soft, each not_stated). For such wishes prefer search_by_description",
                "items": {
                  "enum": ["dogs", "cats"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "km": {
                "description": "Radius, kilometres",
                "maximum": 800,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "description": "The person's language: en, es, zh-Hant, zh-Hans, ko, ja, vi, fr, ar, tl (default en)",
                "maxLength": 20,
                "type": "string"
              },
              "limit": {
                "description": "Pets per answer (find_pets default 10, show_pets 24)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "miles": {
                "description": "Radius, miles (default 50)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "min_photo_px": {
                "description": "Best photo's longest side, at least, in pixels",
                "maximum": 4000,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "a Taiwan county or township in any language, a US ZIP, Zaragoza, Wien or Fukushima (福島県) (98101, 信義區, 臺北市), or lat,lon; never a street address. Nearest first; an uncovered place gets the nearest pets we hold, marked not nearby",
                "maxLength": 60,
                "type": "string"
              },
              "page": {
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "photo": {
                "description": "good: only pets whose best photo passed our checks; unanalysed pets are left out (only Taiwan's are analysed)",
                "enum": ["good"],
                "type": "string"
              },
              "place": {
                "additionalProperties": false,
                "description": "near as structured fields; never a street address",
                "properties": {
                  "area": {
                    "description": "a Taiwan county or township in any language, a US ZIP, Zaragoza, Wien or Fukushima (福島県)",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "latitude": {
                    "description": "Only with longitude, if the person shared it",
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "postal_code": {
                    "description": "A US ZIP",
                    "maxLength": 12,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "q": {
                "description": "Words in the person's language: breeds, colors, ages, sizes, sex and places become filters, the rest is full-text (\"黑色柴犬\")",
                "maxLength": 200,
                "type": "string"
              },
              "region": {
                "description": "Taiwan county or city, e.g. Taipei City",
                "maxLength": 30,
                "type": "string"
              },
              "sex": {
                "enum": ["Male", "Female"],
                "type": "string"
              },
              "size": {
                "description": "Not stated in King County or Vienna",
                "enum": ["Small", "Medium", "Large", "X-Large"],
                "type": "string"
              },
              "sort": {
                "description": "photo = best photo first",
                "enum": ["relevance", "newest", "listed", "distance", "photo"],
                "type": "string"
              },
              "species": {
                "enum": ["Dog", "Cat", "Rabbit", "Bird", "Small pet", "Reptile", "Pig", "Barnyard"],
                "type": "string"
              }
            },
            "type": "object"
          },
