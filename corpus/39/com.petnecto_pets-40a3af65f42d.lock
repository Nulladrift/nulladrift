        {
          "name": "search_by_description",
          "title": "Search by description",
          "description": "Find pets from wishes in the person's own words, in any language (“a calm small dog good with kids near Seattle”). Use it for wishes listings rarely state, like calm or good with kids: each pet's match says, per wish, stated, inferred (read from its text, with a %) or not_stated, and pets that do not say are left out and counted in not_stated unless include_unknown=true. The answer's understood.chips say what was searched; drop a wrong one with off=[chip id]; a chip noted approx or hint is not a fact about any pet. Found pets (found:true) are not adoptable. Prefer find_pets for structured values.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "TW (Taiwan), US (King County WA, Montgomery County MD only), ES (Zaragoza), AT (Vienna, found pets only) or JP (Fukushima Prefecture)",
                "enum": ["TW", "US", "ES", "AT", "JP"],
                "type": "string"
              },
              "include_unknown": {
                "description": "Also include pets whose listing does not say whether they are good with dogs/cats/kids (they are marked not_stated)",
                "type": "boolean"
              },
              "lang": {
                "description": "The person's language: en, es, zh-Hant, zh-Hans, ko, ja, vi, fr, ar, tl (default en)",
                "maxLength": 20,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "Where, if it is not in the query: a Taiwan county or township in any language, a US ZIP, Zaragoza, Wien or Fukushima (福島県), or lat,lon",
                "maxLength": 60,
                "type": "string"
              },
              "off": {
                "description": "Chip ids from a previous answer's understood.chips to leave out, e.g. [\"good_with:kids\"]",
                "items": {
                  "maxLength": 48,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "page": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the person wants, in their own words and language, e.g. “a senior dog in Zaragoza”, “a friendly cat near 98101”, “小型犬 台北”",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
