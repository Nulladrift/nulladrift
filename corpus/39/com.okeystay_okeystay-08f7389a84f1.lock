{
  "lockfileVersion": 2,
  "subjects": {
    "com.okeystay/okeystay": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://okeystay.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "okeystay",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_availability",
          "title": "Daily availability and prices",
          "description": "Day-by-day availability, nightly price and minimum stay of one stay, for up to 93 days.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "from": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "slug": {
                "maxLength": 120,
                "type": "string"
              },
              "to": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["from", "slug", "to"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c0acad11d361cae9554bd90a3850e9a30ad83c82d4dec3111148c77fd72f7fad"
        },
        {
          "name": "get_stay",
          "title": "Get a holiday rental",
          "description": "Full listing of one stay: description, highlights, FAQ, capacity, check-in and check-out times, tourist registration number, measured distances and, with dates, the total price and availability.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "checkIn": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Language of the texts: es or en",
                "enum": ["es", "en"],
                "type": "string"
              },
              "slug": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8f4a83db5c19c152c384673ca7b1eafdd9c5cff48143173334ee1b82bb52152e"
        },
        {
          "name": "prepare_booking",
          "title": "Prepare a booking link",
          "description": "Check that a stay is free for the given dates and guests, and return the total price (cleaning included), the cancellation policy and a direct booking link with dates and guests already filled in. Give the link to the traveller: they confirm and pay securely on OkeyStay. Never ask the traveller for card details in the chat.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "checkIn": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guests": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language of the texts: es or en",
                "enum": ["es", "en"],
                "type": "string"
              },
              "slug": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["checkIn", "checkOut", "guests", "slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:23ca570d9c6d0757481af142f93c5098d303a3c22719d6f1e13c6221ebdc1496"
        },
        {
          "name": "search_stays",
          "title": "Search holiday rentals",
          "description": "Search holiday rentals. Every listing shows its registration number where the law requires one, its real town worked out from the map coordinates, and measured distances to the beach and the airport. Filter by town, dates and guests. With checkIn and checkOut, each result includes the total price of the stay (cleaning included); without dates, the lowest nightly price of the next 60 days. Call it without a place to see which destinations exist.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "checkIn": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guests": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language of the texts: es or en",
                "enum": ["es", "en"],
                "type": "string"
              },
              "place": {
                "description": "Municipality, e.g. Málaga, Torremolinos, Benalmádena, Marbella, Fuengirola",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9780f548738a28300d38bdae3a1252184064d1e69f4426d87039144b1b5cef5f"
        }
      ],
      "digest": "sha256:295b08f59dca13b4d6bd8a493f653cf11dc9c3935998ee6e42ae34e7a25110c0"
    }
  }
}
