        {
          "name": "post_forecast_solar_return",
          "title": "Solar return chart - Annual birthday forecast chart for a single subject",
          "description": "Cast the solar return chart for one subject and year: the chart erected for the exact moment the transiting Sun returns to its natal ecliptic longitude, the foundational technique for annual astrological forecasting. Returns the full tropical chart with planetary positions, house cusps, aspects, Ascendant, and Midheaven. Location-sensitive: pass the birthplace to anchor the chart to natal geography, or the current city for a relocated solar return where the houses and Ascendant shift to where you are on your birthday. Built for year-ahead forecast tools, birthday charts, and annual horoscope features.",
          "inputSchema": {
            "examples": [
              {
                "date": "1990-07-15",
                "latitude": 40.7128,
                "longitude": -74.006,
                "time": "14:30:00",
                "timezone": "America/New_York",
                "year": 2026
              }
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "date": {
                "description": "Birth date in YYYY-MM-DD format. Anchors the natal Sun longitude the transiting Sun returns to each year.",
                "example": "1990-07-15",
                "format": "date",
                "type": "string"
              },
              "houseSystem": {
                "default": "placidus",
                "description": "House system for the return chart. placidus is the Western default. whole-sign, equal, and koch are also supported.",
                "enum": ["placidus", "whole-sign", "equal", "koch"],
                "example": "placidus",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
                "enum": ["en", "tr", "de", "es", "hi", "pt", "fr", "ru", "zh-Hans", "zh-Hant"],
                "example": "en",
                "type": "string"
              },
              "latitude": {
                "description": "Latitude of the solar return location in decimal degrees. The solar return is location-sensitive: use the birthplace to anchor the chart to natal geography, or the current city for a relocated solar return.",
                "example": 40.7128,
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude of the solar return location in decimal degrees. Sets the local sidereal time, so it drives the Ascendant, Midheaven, and house cusps of the return chart.",
                "example": -74.006,
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "time": {
                "description": "Birth time in 24-hour HH:MM:SS format. Pins the exact natal Sun position that defines the solar return moment.",
                "example": "14:30:00",
                "format": "time",
                "type": "string"
              },
              "timezone": {
                "anyOf": [
                  {
                    "maximum": 14,
                    "minimum": -14,
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "IANA name (e.g. \"America/New_York\", \"Europe/London\", \"UTC\"), decimal hours (e.g. -5 for EST, 1 for CET), or a fixed UTC offset (e.g. \"-05:00\", \"+01:00\"). Prefer the IANA name: it is resolved to the offset in force at the birth date and time, historical daylight-saving rules included, while a fixed offset or decimal is taken literally and will be wrong if it does not match the daylight-saving state at that moment. On a transition day a time in the repeated hour is read as its first occurrence and a time in the skipped hour is moved forward past the gap. Invalid timezones return 400 with a validation error.",
                "example": "America/New_York"
              },
              "year": {
                "description": "Year to cast the solar return for. The chart is erected for the moment in this year when the transiting Sun returns to the natal Sun longitude, on or within a day of the birthday.",
                "example": 2026,
                "maximum": 2649,
                "minimum": 1551,
                "type": "integer"
              }
            },
            "required": ["date", "latitude", "longitude", "time", "timezone", "year"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "birthDate": {
                "type": "string"
              },
              "chart": {
                "properties": {
                  "aspects": {
                    "items": {
                      "properties": {
                        "angle": {
                          "type": "number"
                        },
                        "interpretation": {
                          "enum": ["harmonious", "challenging", "neutral"],
                          "type": "string"
                        },
                        "isApplying": {
                          "type": "boolean"
                        },
                        "orb": {
                          "type": "number"
