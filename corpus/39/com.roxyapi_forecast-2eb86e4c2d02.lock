        {
          "name": "post_forecast_timeline",
          "title": "Cross-domain forecast timeline - Transits, ingresses, stations, dasha changes, critical days",
          "description": "Build one time-ordered forecast for a single birth subject by merging upcoming events across three domains: western transit-to-natal aspects, sign ingresses, retrograde stations, eclipses, and new and full moons; biorhythm critical days; and vedic Vimshottari mahadasha, antardasha, and pratyantardasha boundaries. The window is clamped to 90 days and events are capped and scored by significance. Built for what-is-coming dashboards, daily and weekly forecast feeds, and timing tools.",
          "inputSchema": {
            "examples": [
              {
                "birthData": {
                  "date": "1990-07-15",
                  "time": "13:30:00",
                  "timezone": "America/New_York"
                }
              }
            ],
            "properties": {
              "birthData": {
                "description": "The single birth subject this forecast is built for. One object only, never an array.",
                "properties": {
                  "date": {
                    "description": "Birth date in YYYY-MM-DD format. Anchors the natal chart and the Vimshottari dasha sequence.",
                    "example": "1990-07-15",
                    "format": "date",
                    "type": "string"
                  },
                  "latitude": {
                    "default": 0,
                    "description": "Birth latitude in decimal degrees. Optional and does not affect the timeline. Defaults to 0.",
                    "example": 0,
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "default": 0,
                    "description": "Birth longitude in decimal degrees. Optional and does not affect the timeline. Defaults to 0.",
                    "example": 0,
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "time": {
                    "description": "Birth time in 24-hour HH:MM:SS format. Precision matters for the natal positions the transit aspects are measured against.",
                    "example": "13:30:00",
                    "format": "time",
                    "type": "string"
                  },
                  "timezone": {
                    "anyOf": [
                      {
                        "maximum": 14,
                        "minimum": -14,
                        "type": "number"
                      },
                      {
                        "type": "string"
                      }
                    ],
                    "description": "IANA name (e.g. \"America/New_York\", \"Europe/London\", \"UTC\"), decimal hours (e.g. -5 for EST, 1 for CET), or a fixed UTC offset (e.g. \"-05:00\", \"+01:00\"). Prefer the IANA name: it is resolved to the offset in force at the birth date and time, historical daylight-saving rules included, while a fixed offset or decimal is taken literally and will be wrong if it does not match the daylight-saving state at that moment. On a transition day a time in the repeated hour is read as its first occurrence and a time in the skipped hour is moved forward past the gap. Invalid timezones return 400 with a validation error.",
                    "example": "America/New_York"
                  }
                },
                "required": ["date", "time", "timezone"],
                "type": "object"
              },
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "domainWeights": {
                "description": "Per-domain significance multipliers applied before the significance floor and event cap. Bias which domains survive filtering and the cap. Omitted domains default to a weight of 1. Valid keys are western, vedic, and biorhythm.",
                "example": {
                  "biorhythm": 0.5,
                  "vedic": 1.5
                },
                "properties": {
                  "biorhythm": {
                    "description": "Multiplier for this domain significance. 1 leaves it unchanged, above 1 promotes the domain, below 1 demotes it.",
                    "example": 1.5,
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "vedic": {
                    "description": "Multiplier for this domain significance. 1 leaves it unchanged, above 1 promotes the domain, below 1 demotes it.",
                    "example": 1.5,
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "western": {
                    "description": "Multiplier for this domain significance. 1 leaves it unchanged, above 1 promotes the domain, below 1 demotes it.",
                    "example": 1.5,
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "domains": {
                "description": "Which forecast domains to include. Defaults to all three. Pass a subset to scope the timeline to one or two engines.",
                "example": ["western", "vedic", "biorhythm"],
                "items": {
                  "description": "Forecast domain. western covers transit aspects, sign ingresses, retrograde stations, eclipses, and new and full moons. vedic covers Vimshottari mahadasha, antardasha, and pratyantardasha boundaries. biorhythm covers critical days.",
                  "enum": ["western", "vedic", "biorhythm"],
                  "example": "western",
                  "type": "string"
                },
                "type": "array"
              },
              "endDate": {
                "description": "Last day of the forecast window in YYYY-MM-DD format. Defaults to startDate plus 30 days. The window is clamped to a maximum of 90 days from startDate.",
                "example": "2026-08-30",
                "format": "date",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
                "enum": ["en", "tr", "de", "es", "hi", "pt", "fr", "ru", "zh-Hans", "zh-Hant"],
                "example": "en",
                "type": "string"
              },
              "minSignificance": {
                "description": "Drop events scoring below this significance threshold from 0 to 100. Defaults to 0, keeping all events.",
                "example": 0,
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "startDate": {
                "description": "First day of the forecast window in YYYY-MM-DD format. Defaults to today in UTC.",
                "example": "2026-06-01",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["birthData"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "birthData": {
                "properties": {
                  "date": {
                    "format": "date",
                    "type": "string"
                  },
                  "latitude": {
                    "default": 0,
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "default": 0,
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "time": {
                    "format": "time",
                    "type": "string"
                  },
                  "timezone": {
                    "type": "number"
                  }
                },
                "required": ["date", "time", "timezone"],
                "type": "object"
              },
              "count": {
                "type": "number"
              },
              "endDate": {
                "type": "string"
              },
              "events": {
                "items": {
                  "properties": {
                    "aspect": {
                      "type": "string"
                    },
                    "body": {
                      "type": "string"
                    },
                    "date": {
                      "type": "string"
                    },
                    "datetime": {
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "domain": {
                      "enum": ["western", "vedic", "biorhythm"],
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["penumbral", "partial", "annular", "total"],
                      "type": "string"
                    },
                    "obscuration": {
                      "type": "number"
                    },
                    "orb": {
                      "type": "number"
                    },
                    "phase": {
                      "enum": ["new-moon", "full-moon"],
                      "type": "string"
                    },
                    "significance": {
                      "type": "number"
                    },
                    "station": {
                      "enum": ["retrograde", "direct"],
                      "type": "string"
                    },
                    "target": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["transit-aspect", "sign-ingress", "retrograde-station", "eclipse", "lunar-phase", "dasha-change", "critical-day"],
                      "type": "string"
                    }
                  },
                  "required": ["body", "date", "datetime", "description", "domain", "significance", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "startDate": {
                "type": "string"
              }
            },
            "required": ["birthData", "count", "endDate", "events", "startDate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
