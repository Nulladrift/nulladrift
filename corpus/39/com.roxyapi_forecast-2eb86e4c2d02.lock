                  },
                  "timezone": {
                    "type": "number"
                  }
                },
                "required": ["date", "time", "timezone"],
                "type": "object"
              },
              "endDate": {
                "type": "string"
              },
              "startDate": {
                "type": "string"
              },
              "windows": {
                "items": {
                  "properties": {
                    "byDomain": {
                      "properties": {
                        "biorhythm": {
                          "type": "number"
                        },
                        "vedic": {
                          "type": "number"
