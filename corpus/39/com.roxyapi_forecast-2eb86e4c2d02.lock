                          "type": "number"
                        },
                        "retrograde-station": {
                          "type": "number"
                        },
                        "sign-ingress": {
                          "type": "number"
                        },
                        "transit-aspect": {
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "count": {
                      "type": "number"
                    },
                    "days": {
                      "type": "number"
                    },
                    "from": {
                      "type": "string"
                    },
                    "to": {
                      "type": "string"
                    },
                    "top": {
                      "items": {
                        "properties": {
                          "aspect": {
                            "type": "string"
                          },
                          "body": {
                            "type": "string"
                          },
                          "date": {
                            "type": "string"
                          },
                          "datetime": {
                            "type": "string"
                          },
                          "description": {
                            "type": "string"
                          },
                          "domain": {
                            "enum": ["western", "vedic", "biorhythm"],
                            "type": "string"
                          },
                          "kind": {
                            "enum": ["penumbral", "partial", "annular", "total"],
                            "type": "string"
                          },
                          "obscuration": {
                            "type": "number"
                          },
                          "orb": {
                            "type": "number"
                          },
                          "phase": {
                            "enum": ["new-moon", "full-moon"],
                            "type": "string"
                          },
                          "significance": {
                            "type": "number"
                          },
                          "station": {
                            "enum": ["retrograde", "direct"],
                            "type": "string"
                          },
                          "target": {
                            "type": "string"
                          },
                          "type": {
                            "enum": ["transit-aspect", "sign-ingress", "retrograde-station", "eclipse", "lunar-phase", "dasha-change", "critical-day"],
                            "type": "string"
                          }
                        },
                        "required": ["body", "date", "datetime", "description", "domain", "significance", "type"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["byDomain", "byType", "count", "days", "from", "to", "top"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["birthData", "endDate", "startDate", "windows"],
            "type": "object"
