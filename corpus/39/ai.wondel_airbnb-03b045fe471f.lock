                "description": "The listing: its `id` from airbnb_search (e.g. '49891381') or its link from any Airbnb domain (https://www.airbnb.pl/rooms/49891381, https://www.airbnb.com/rooms/49891381).",
                "minLength": 1,
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh fetch and bypass this server's result cache (5 min). Default false.",
                "type": "boolean"
