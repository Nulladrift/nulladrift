                "description": "Arrival date, YYYY-MM-DD (from today to about two years ahead). Pass together with checkout; omit both for Airbnb's own suggested dates.",
                "type": "string"
              },
              "checkout": {
                "description": "Departure date, YYYY-MM-DD, after checkin (at most 365 nights; 28+ nights are quoted per month).",
                "type": "string"
              },
              "children": {
                "description": "Children aged 2–12. adults + children ≤ 16. Default 0.",
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              },
              "currency": {
                "description": "3-letter ISO currency for prices, e.g. 'PLN' (default), 'EUR', 'USD', 'GBP'.",
                "type": "string"
              },
