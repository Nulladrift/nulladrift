            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cinema_id": {
                "description": "Venue ID returned by list_cinemas for the same provider. Do not mix IDs across providers. If the venue includes code_status, use cinema_id only when it is verified; directory-* IDs cannot be queried.",
                "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "provider": {
                "description": "Cinema provider; get its capabilities and limitations with list_providers.",
                "enum": ["cinepic", "cinesunidos", "cinex", "supercines", "grancine"],
                "type": "string"
              },
              "query": {
                "description": "Filters by name, ignoring accents and case.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "refresh": {
                "description": "true: queries the provider without the local cache and requests HTTP revalidation. Does not guarantee that the provider has updated its content.",
                "type": "boolean"
              }
            },
            "required": ["cinema_id", "provider"],
            "type": "object"
          },
