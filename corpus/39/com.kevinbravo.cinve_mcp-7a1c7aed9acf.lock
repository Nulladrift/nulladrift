        {
          "name": "get_seats",
          "title": "Get seats and ASCII map",
          "description": "Actual seat map without booking: Cinex and Cines Unidos require cinema_id, session_id and a connected account; Cinepic also requires movie_id, without login. Use IDs from get_showtimes. Returns counters and the full ASCII map, where each seat appears with its label and state (O = status available); include_seats=true adds the per-seat detail, which is much longer. No local cache. For seat availability at Cinex, Cines Unidos and Cinepic, use get_seats with verified venue and showtime IDs; Cinepic also requires movie_id. Show the ascii map in a monospaced text block with its legend and the time of the lookup. Use only each seat's status=available to say it is free; keep occupied, unavailable and unknown separate. The result's status=available means a map was obtained, not that all its seats are free or that the interpretation is complete. Check availability_complete and the counters: available=0 with unknown>0 does NOT mean sold out. If the map is partial, show the confirmed states and the ? marks, explain that Cinve could not interpret part of the map, and do not blame the cinema for that failure or claim that the MCP does not support seats. Do not invent seat positions or turn unknown or restricted seats into free ones. Do not repeat the login because of unknown states: only on auth_required. Lookups do not select or reserve seats; availability may change before purchase.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cinema_id": {
                "description": "Venue ID returned by list_cinemas for the same provider. Do not mix IDs across providers. If the venue includes code_status, use cinema_id only when it is verified; directory-* IDs cannot be queried.",
                "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                "type": "string"
              },
              "include_seats": {
                "description": "true: adds seats with each seat's id, row, coordinates and provider state. Omit it to answer about availability: the ascii map is enough and is a fraction of the size.",
                "type": "boolean"
              },
              "movie_id": {
                "description": "Movie ID returned by list_movies for the same provider; optional for Cinex when querying a whole venue.",
                "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                "type": "string"
              },
              "provider": {
                "description": "Cinema provider; get its capabilities and limitations with list_providers.",
                "enum": ["cinepic", "cinesunidos", "cinex", "supercines", "grancine"],
                "type": "string"
              },
              "session_id": {
                "description": "Showtime ID returned by get_showtimes for the same provider.",
                "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                "type": "string"
              }
            },
            "required": ["cinema_id", "provider", "session_id"],
            "type": "object"
          },
