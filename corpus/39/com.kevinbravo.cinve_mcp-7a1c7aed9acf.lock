                "type": "integer"
              },
              "provider": {
                "enum": ["cinepic", "cinesunidos", "cinex", "supercines", "grancine"],
                "type": "string"
              },
              "queried_at": {
                "type": "string"
              },
              "seats": {
                "description": "Per-seat detail; only with include_seats=true. The ascii map already shows each label with its state.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "accessible": {
                      "description": "true: a wheelchair space according to the cinema's website. Its status does not change (restricted unless it is occupied).",
                      "type": "boolean"
                    },
                    "area": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "category": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "column_index": {
                      "maximum": 199,
