                        "required": ["amount", "basis", "currency"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "stock": {
                      "type": "number"
                    },
                    "url": {
                      "maxLength": 4096,
                      "type": "string"
                    }
