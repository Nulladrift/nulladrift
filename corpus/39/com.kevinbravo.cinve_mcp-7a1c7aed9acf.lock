                    },
                    "label": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "provider_status": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "row": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "row_index": {
                      "maximum": 199,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "status": {
                      "enum": ["available", "occupied", "unavailable", "unknown"],
                      "type": "string"
                    }
                  },
                  "required": ["area", "column_index", "id", "label", "provider_status", "row", "row_index", "status"],
                  "type": "object"
                },
                "maxItems": 10000,
                "type": "array"
              },
              "session_id": {
                "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                "type": "string"
              },
              "showing": {
                "additionalProperties": false,
                "description": "The showtime as the same map response gives it (provider text), to label the image; absent fields could not be read.",
                "properties": {
                  "cinema_name": {
                    "maxLength": 120,
                    "type": "string"
                  },
