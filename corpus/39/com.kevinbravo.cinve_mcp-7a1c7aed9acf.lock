                "description": "True only when a nonempty map has no unknown seat states. Does not promise purchase eligibility or a reservation.",
                "type": "boolean"
              },
              "available": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "cinema_id": {
                "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                "type": "string"
              },
              "occupied": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "provider": {
                "enum": ["cinepic", "cinesunidos", "cinex", "supercines", "grancine"],
                "type": "string"
              },
              "queried_at": {
                "type": "string"
              },
              "seats": {
                "description": "Per-seat detail; only with include_seats=true. The ascii map already shows each label with its state.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "area": {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "category": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "column_index": {
                      "maximum": 199,
