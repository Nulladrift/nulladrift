        {
          "name": "get_seats",
          "title": "Get seats and ASCII map",
          "description": "Actual seat map without booking: Cinex and Cines Unidos require cinema_id, session_id and a connected account; Cinepic also requires movie_id, without login; Supercines requires cinema_id, session_id, movie_id, date if the showtime is not today, and a connected account (its website shows the map only inside a purchase, so Cinve opens one with a single ticket, picks no seat and cancels it in the same call). Use IDs from get_showtimes. Returns counters, a PNG image of the map oriented like the cinema's website (image=svg returns it as SVG) and the full ASCII map, where each seat appears with its label and state (O = status available); include_seats=true adds the per-seat detail, which is much longer. No local cache. For seat availability at Cinex, Cines Unidos, Cinepic and Supercines, use get_seats with verified venue and showtime IDs; Cinepic and Supercines also require movie_id, and Supercines the date when it is not today. Show the user the map image get_seats returns (PNG, oriented like the cinema's website, with a legend and the time of the lookup) so they can see or share it; if your client does not show images, show the ascii map in a monospaced text block with its legend and the time of the lookup. Do not describe a screen side the map marks as unverified. Use only each seat's status=available to say it is free; keep occupied, unavailable and unknown separate. The result's status=available means a map was obtained, not that all its seats are free or that the interpretation is complete. Check availability_complete and the counters: available=0 with unknown>0 does NOT mean sold out. If the map is partial, show the confirmed states and the ? marks, explain that Cinve could not interpret part of the map, and do not blame the cinema for that failure or claim that the MCP does not support seats. Do not invent seat positions or turn unknown or restricted seats into free ones. Do not repeat the login because of unknown states: only on auth_required. Lookups do not select or reserve seats; where a cinema shows the map only inside an order (Supercines, some Cinex rooms), Cinve opens a one-ticket order only to read the map and cancels it at once, as its warnings say. Availability may change before purchase.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cinema_id": {
                "description": "Venue ID returned by list_cinemas for the same provider. Do not mix IDs across providers. If the venue includes code_status, use cinema_id only when it is verified; directory-* IDs cannot be queried.",
                "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                "type": "string"
              },
              "date": {
                "description": "Supercines only: showtime date (YYYY-MM-DD), the same one used in get_showtimes; defaults to today in America/Caracas.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "image": {
                "description": "png (default): an image of the map to show and share. svg: the same map as an embedded SVG file, longer. none: data only.",
                "enum": ["png", "svg", "none"],
                "type": "string"
              },
              "include_seats": {
                "description": "true: adds seats with each seat's id, row, coordinates and provider state. Omit it to answer about availability: the ascii map is enough and is a fraction of the size.",
                "type": "boolean"
              },
              "movie_id": {
                "description": "Movie ID returned by list_movies for the same provider; optional for Cinex when querying a whole venue.",
                "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                "type": "string"
              },
              "provider": {
                "description": "Cinema provider; get its capabilities and limitations with list_providers.",
                "enum": ["cinepic", "cinesunidos", "cinex", "supercines", "grancine"],
                "type": "string"
              },
              "session_id": {
                "description": "Showtime ID returned by get_showtimes for the same provider.",
                "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                "type": "string"
              }
            },
            "required": ["cinema_id", "provider", "session_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "ascii": {
                "type": "string"
              },
              "availability_complete": {
                "description": "True only when a nonempty map has no unknown seat states. Does not promise purchase eligibility or a reservation.",
                "type": "boolean"
              },
              "available": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "cinema_id": {
                "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                "type": "string"
              },
              "layout": {
                "additionalProperties": false,
                "properties": {
                  "column_order": {
                    "description": "descending: the provider's website draws column_index from right to left; the ascii map and the image follow it.",
                    "enum": ["ascending", "descending"],
                    "type": "string"
                  },
                  "row_shift": {
                    "additionalProperties": {
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "description": "Rows the provider's website centres because they are shorter: how many seats (possibly half a seat) each one is shifted from column_index 0. The ascii map and the image already apply it.",
                    "propertyNames": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "screen": {
                    "description": "Side of the screen in the ascii map and the image, as the provider's website draws it; unverified when it could not be confirmed.",
                    "enum": ["top", "bottom", "unverified"],
                    "type": "string"
                  }
                },
                "required": ["column_order", "screen"],
                "type": "object"
              },
              "occupied": {
