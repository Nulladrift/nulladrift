        {
          "name": "get_showtimes",
          "title": "Get showtimes",
          "description": "Gets showtimes for a date (today in Caracas by default). Cinepic requires cinema_id (123300 Candelaria or 123301 VVIP Lido); Cines Unidos requires city; Cinex accepts city for all its verified venues in the city in one call, cinema_id for one venue (with optional movie_id to filter), or only movie_id to read the movie's page across all venues; Supercines accepts cinema_id, city or movie_id; Gran Cine (arthouse cinema, includes the Paseo Las Mercedes theaters) accepts cinema_id, city or neither for all its theaters, without provider showtime IDs; use query to filter by title. The venue call resolves titles against the catalog and marks partial when it cannot confirm a movie_id. Returns the IDs needed for prices, screen/format when available and the website URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cinema_id": {
