                      "type": "string"
                    },
                    "final_total_verified": {
                      "type": "boolean"
                    },
                    "id": {
                      "description": "Concession product identifier.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "image_url": {
                      "maxLength": 4096,
