        {
          "name": "get_showtimes",
          "title": "Get showtimes",
          "description": "Gets showtimes for a date (today in Caracas by default). Cinepic requires cinema_id (123300 Candelaria or 123301 VVIP Lido); Cines Unidos requires city; Cinex accepts city for all its verified venues in the city in one call, cinema_id for one venue (with optional movie_id to filter), or only movie_id to read the movie's page across all venues; Supercines accepts cinema_id, city or movie_id; Gran Cine (arthouse cinema, includes the Paseo Las Mercedes theaters) accepts cinema_id, city or neither for all its theaters, without provider showtime IDs; use query to filter by title. The venue call resolves titles against the catalog and marks partial when it cannot confirm a movie_id. Returns the IDs needed for prices, screen/format when available and the website URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cinema_id": {
                "description": "Venue ID returned by list_cinemas for the same provider. Do not mix IDs across providers. If the venue includes code_status, use cinema_id only when it is verified; directory-* IDs cannot be queried.",
                "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                "type": "string"
              },
              "city": {
                "description": "City name as returned by list_cities for the same provider (e.g. Caracas); accents and case are ignored for Cines Unidos.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD; defaults to today in America/Caracas for Cinepic/Cines Unidos movies and showtimes and for Cinex, Supercines and Gran Cine showtimes.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "movie_id": {
                "description": "Movie ID returned by list_movies for the same provider; optional for Cinex when querying a whole venue.",
                "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "provider": {
                "description": "Cinema provider; get its capabilities and limitations with list_providers.",
                "enum": ["cinepic", "cinesunidos", "cinex", "supercines", "grancine"],
                "type": "string"
              },
              "query": {
                "description": "Filters by name, ignoring accents and case.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "refresh": {
                "description": "true: queries the provider without the local cache and requests HTTP revalidation. Does not guarantee that the provider has updated its content.",
                "type": "boolean"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cinema_id": {
                      "description": "Venue ID returned by list_cinemas.",
                      "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                      "type": "string"
                    },
                    "cinema_name": {
                      "description": "Venue name when the source publishes it with the showtime.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "date": {
                      "description": "Business date of the showtime in America/Caracas (YYYY-MM-DD).",
                      "type": "string"
                    },
                    "format": {
                      "type": "string"
                    },
                    "id": {
                      "description": "Showtime identifier; use it as session_id when looking up prices.",
                      "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                      "type": "string"
                    },
                    "kind": {
                      "const": "showtime",
                      "type": "string"
                    },
                    "language": {
                      "type": "string"
                    },
                    "movie_id": {
                      "description": "Movie ID confirmed by list_movies or by the Cinex catalog when querying a whole venue.",
                      "pattern": "^[a-zA-Z0-9._-]{1,100}$",
                      "type": "string"
                    },
                    "name": {
                      "maxLength": 512,
                      "minLength": 1,
                      "type": "string"
                    },
                    "screen": {
                      "type": "string"
                    },
                    "starts_at": {
                      "description": "Timestamp with time zone; may be missing for late-night showtimes.",
                      "type": "string"
                    },
