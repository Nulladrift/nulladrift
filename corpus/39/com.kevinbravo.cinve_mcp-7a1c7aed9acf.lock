        {
          "name": "get_concessions",
          "title": "Get concessions",
          "description": "Gets concessions by venue. Cinepic and Cines Unidos require only cinema_id, via a public API; Cinepic may return an empty catalog. Cinex requires cinema_id and a connected account. Supercines requires only cinema_id. Stock only when verified; does not use zero for missing prices.",
