{
  "lockfileVersion": 2,
  "subjects": {
    "com.realevr.estates/estates": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://estates.realevr.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "realevr-estates",
        "title": "RealEVR Estates",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RealEVR Estates is a live property platform for Africa with a 360° virtual tour on every listing. Search with search_properties, then give the person the `url` of the homes you mention so they can tour and contact the owner. Prices are in each listing's own currency. Do not invent listings: only describe what the tools return.",
      "tools": [
        {
          "name": "get_property",
          "description": "Full public details of one RealEVR Estates listing by id (from search_properties).",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a9374f69152ccc85c1ac4b954e340d6c0a8e3b446744ae943731d7f097150ed"
        },
        {
          "name": "list_places",
          "description": "The countries and cities where RealEVR Estates has homes listed, with counts. Use to see where it can help before searching.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:54498c36b3e09e16788733036aa7c56fcfaf0d869be44dcf5e4619ff15043957"
        },
        {
          "name": "real_estate_knowledge",
          "description": "Recent real estate news and plain-language facts about buying, renting and property rules in African countries, gathered from published reports. Use for market or \"how does X work in <country>\" questions. Always cite the source it names.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country name or ISO code, optional.",
                "type": "string"
              },
              "question": {
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d656b6c0669ced5e328fef047aa42442b720af13bd0494246d70bc901280fea6"
        },
        {
          "name": "search_properties",
          "description": "Search real, currently available homes on RealEVR Estates (Africa: rentals, furnished BnB stays, homes for sale and bank sales, each with a 360° virtual tour). Use for any \"find me a flat / house / plot in <place>\" question. Every result has a `url`: give it to the person so they can walk through the home and contact the owner.",
          "inputSchema": {
            "properties": {
              "bedrooms": {
                "description": "Minimum bedrooms.",
                "minimum": 1,
                "type": "integer"
              },
              "category": {
                "description": "rental_units, for_sale, furnished_houses (BnB) or bank_sales.",
                "enum": ["rental_units", "for_sale", "furnished_houses", "bank_sales"],
                "type": "string"
              },
              "currency": {
                "description": "ISO code the prices are in (default UGX).",
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Neighbourhood, city or country, e.g. \"Kololo\", \"Nairobi\".",
                "type": "string"
              },
              "max_price": {
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "minimum": 0,
                "type": "number"
              },
              "q": {
                "description": "Free text, e.g. \"furnished flat near the university\".",
                "type": "string"
              },
              "type": {
                "enum": ["apartment", "house", "land", "commercial", "hostel"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:15759b0169aaabdd49b051b7e48f2a20bceb2bccf2cbf6132e0b365bdd64cb5f"
        }
      ],
      "digest": "sha256:e9b16440b254273e54eac55a0e7c36415ce37636d5a118c9688f338be80eecd2"
    }
  }
}
