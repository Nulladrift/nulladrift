          "title": "Priced offers and how to pay",
          "description": "Read-only. Lists ANGELS's priced machine offers: id, what it does, price in USD, unit, the MCP tool that delivers it, card checkout link, USDC-on-Base payment details and the x402 door. Free to call. Start here before any paid tool.",
          "inputSchema": {
