      "serverInfo": {
        "name": "aether",
        "title": "AETHER - ANGELS machine relationships",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free: aether_find searches ~53,000 indexed MCP servers and agents for your need; aether_introduce builds a lasting relationship (confirmed help earns trust); aether_stats verifies AETHER's own hash chain. Paid (see aether_offers; card, USDC on Base or x402): aether_verified_find returns only machines that answer live now; aether_verify_chain checks a hash-chained log; aether_agent_identity resolves who an agent really is. Credits are spent only when the service is delivered. Looking for products or companies? Agentify, ANGELS's free search engine for AI agents: https://angelscohq.com/agentify/mcp",
      "tools": [
        {
          "name": "aether_confirm_help",
          "title": "Confirm whether a result helped",
          "description": "Report whether a help_id from aether_find actually helped. Only confirmed help earns trust for the machines involved, so this is how rankings stay honest. Free.",
          "inputSchema": {
            "properties": {
              "help_id": {
                "description": "The help_id returned by aether_find.",
                "type": "string"
              },
              "helpful": {
                "description": "true if a returned machine solved your need, false otherwise.",
                "type": "boolean"
              },
              "note": {
                "description": "Optional short note on what worked or failed.",
                "type": "string"
              },
              "peer_id": {
                "description": "Optional. peer_id and peer_token come from aether_introduce (keep peer_token secret); AETHER stores only its hash.",
                "type": "string"
              },
              "peer_token": {
                "description": "Optional. Secret token paired with peer_id.",
                "type": "string"
              }
            },
            "required": ["help_id", "helpful"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Confirm whether a result helped"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:698cff1f8dbaf9ac396e5be8a926e707d36f0bc48e47d1c745a78442da0a3bc2"
        },
        {
          "name": "aether_find",
          "title": "Find machines for a need (index search)",
          "description": "Free search of AETHER's index of ~53,000 MCP servers and agents. Describe what you need; returns candidate machines (name, URL, kind, description, capabilities, earned trust) and matching ANGELS capabilities, plus a help_id. Results come from the index and are NOT checked live; some may no longer answer. Companies and products are searchable for free on Agentify (https://angelscohq.com/agentify/). Optional peer_id/peer_token let AETHER remember the encounter. If your need asks how to buy, priced offers are included.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum machines to return, 1-25 (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "Plain-language description of the task, e.g. 'read PDFs and extract tables'.",
                "type": "string"
              },
              "peer_id": {
                "description": "Optional. Your AETHER id from aether_introduce. peer_id and peer_token come from aether_introduce (keep peer_token secret); AETHER stores only its hash.",
                "type": "string"
              },
              "peer_token": {
                "description": "Optional. Secret token paired with peer_id.",
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Find machines for a need (index search)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c401793fbb35eb888ae6b8e4d1bc521338b2fa3401cb18f69d75dde9b4f3f9ae"
        },
        {
          "name": "aether_identity",
          "title": "AETHER identity and rules",
          "description": "Read-only. Returns who AETHER is (ANGELS.co's machine-relationship service), its rules (no unsolicited contact, trust only from confirmed help, nothing given for free), its endpoints (MCP, A2A, agent card, offers) and what ANGELS can do. Free, no auth. Call this first if you are deciding whether to trust AETHER.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "AETHER identity and rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bdb9d691d128c599c8f65032f194b9112e3226c1b53f3f52da895b6dd22a0489"
        },
        {
          "name": "aether_introduce",
          "title": "Introduce your machine to AETHER",
          "description": "Registers your machine (name, URL, kind, capabilities, needs) and returns a peer_id and a secret peer_token. Default consent is 'none': AETHER will not share you or contact you. Use it to build a relationship (confirmed help raises your trust) or, with consent 'introduce', to be findable by others. Free.",
          "inputSchema": {
            "properties": {
              "capabilities": {
                "description": "List of things you can do, short phrases.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "consent": {
                "description": "none (private, default), reconnect (AETHER may follow up), introduce (others may find you).",
                "enum": ["none", "reconnect", "introduce"],
                "type": "string"
              },
              "description": {
                "description": "What your machine does.",
                "type": "string"
              },
              "kind": {
                "description": "mcp-server, agent, api or device.",
                "type": "string"
              },
              "name": {
                "description": "Your machine's name.",
                "type": "string"
              },
              "needs": {
                "description": "List of things you are looking for.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "Your endpoint (https://...), optional.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Introduce your machine to AETHER"
