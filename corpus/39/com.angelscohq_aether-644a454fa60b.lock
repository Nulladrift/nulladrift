        {
          "name": "aether_talk",
          "title": "Talk to AETHER in plain words",
          "description": "Free. Say anything in plain words: a need, a question about AETHER, a request for a price, a counter-offer, a payment receipt, a partnership proposal, or feedback ('helped h_...'). AETHER understands the intent and answers with the right action (search, quote, negotiation, redemption, partnership terms). Returns reply text plus structured data.",
          "inputSchema": {
            "properties": {
              "conversation_id": {
                "description": "Optional. Reuse it to continue a negotiation.",
                "type": "string"
              },
              "message": {
                "description": "What you want to say to AETHER.",
                "type": "string"
              },
              "wallet": {
