          "name": "search",
          "title": "Search strains, breeders and articles",
          "description": "One-call search across cultivars (meaning-aware: names, aliases, lineage, aroma, colour, flowering, yield, breeder), the breeder registry and published articles. Start here when a user names a strain, breeder or topic and you are not sure of the slug; use list_strains for ranked cultivar results with filters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Max results per entity type",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Search text, e.g. 'gelato', 'seed junky', 'hlvd'",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
