        {
          "name": "list_strains",
          "title": "List / filter cultivars",
          "description": "Meaning-aware search over the 340-cultivar encyclopedia, ranked by relevance. Free-text 'q' understands phrases like \"short flowering\", \"high yield\", \"purple strains\", \"gas\", \"OG lineage\", \"Zkittlez terp profile\", \"Prime Cuts exclusives\", or a breeder name; the same meanings are available as explicit filters. Every result carries 'matched_on' (the factual fields it matched) and the response carries 'interpreted' (how q was read). Nothing is inferred beyond the documented record. Each result includes a 'menu' block with a live-availability URL when Prime Cuts sells the cultivar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "breeder": {
                "description": "Breeder slug from list_breeders, e.g. 'seed-junky-genetics'",
                "type": "string"
              },
              "color": {
                "description": "Reported flower colour, e.g. 'purple'",
                "type": "string"
              },
              "exclusive": {
                "description": "true = only cultivars bred or pheno-hunted in-house by Prime Cuts Nursery",
                "type": "boolean"
              },
              "flavor": {
                "description": "Aroma/flavour/terpene keyword with synonyms, e.g. 'gas' (fuel, diesel), 'candy', 'citrus'",
                "type": "string"
              },
              "flowering_max_weeks": {
                "description": "Documented flowering time at most this many weeks (e.g. 8 for fast finishers)",
                "maximum": 16,
                "minimum": 5,
                "type": "integer"
              },
              "flowering_min_weeks": {
                "maximum": 16,
                "minimum": 5,
                "type": "integer"
              },
              "limit": {
                "default": 25,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "lineage": {
                "description": "Name that must appear in the lineage or ancestry, e.g. 'OG', 'Zkittlez', 'Gelato'",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "on_menu": {
                "description": "true = only cultivars Prime Cuts sells as clones",
                "type": "boolean"
              },
              "q": {
                "description": "Free text: strain/alias/lineage/breeder names or descriptive phrases (aroma, colour, flowering speed, yield, exclusives)",
                "type": "string"
              },
              "terp_profile_of": {
                "description": "Strain name/slug: return cultivars that share its dominant terpene or descend from it",
                "type": "string"
              },
              "terpene": {
                "description": "Dominant terpene, e.g. 'limonene'",
                "type": "string"
              },
              "type": {
                "enum": ["Indica", "Sativa", "Hybrid"],
                "type": "string"
              },
              "yield": {
                "description": "Minimum documented yield rating",
                "enum": ["low", "moderate", "high", "very-high"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List / filter cultivars"
