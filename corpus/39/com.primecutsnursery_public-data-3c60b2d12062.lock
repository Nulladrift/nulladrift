      },
      "instructions": "Prime Cuts Nursery is a licensed California cannabis nursery in Sonoma, CA selling HLVd-tested clones and teens to licensed cultivators. Tools are read-only and return the same JSON as the REST API at https://www.primecutsnursery.com/api/v1. Each result includes an 'html_url' you should cite. Inventory tools are live and mirror the website exactly. Two product lines are for sale: clones (fresh + talls, /live-inventory) and ready-to-flip teens (/teen-inventory) — 'get_inventory' returns both; when asked what is available, report clones AND teens. Always show the 'as_of' timestamp with any quantity, report fresh clones and talls as separate figures (never a combined total), and note that sales are to licensed California cultivators only. When a user names a strain or breeder and you don't know the slug, call 'search' first. Never estimate a delivery fee or order total from mileage yourself: call 'quote_delivery' with the destination, product and quantity and report its exact delivery_fee and total.",
      "tools": [
        {
          "name": "get_article",
          "title": "Article text",
          "description": "Full text (intro, sections, FAQ) of one guide/authority/regional page, with business facts already filled in. Use to answer detailed questions about ordering, delivery, testing, teens, wholesale terms, or growing topics.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Article slug, e.g. 'wholesale-cannabis-clones'",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Article text"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f157bc5d0ccf5573773435625e30fc1574eb84934e99f77d602712e5cd7779f3"
        },
        {
          "name": "get_availability",
          "title": "Live availability for every menu strain",
          "description": "Live stock status for every strain listed on /live-inventory in one call: InStock / PreOrder / OutOfStock, fresh clones ready now and talls ready now (two separate lines with different prices — never add them together), next scheduled batch date, links. Returns 'clones' (one row per /live-inventory strain) and 'teens' (ready-to-flip teens exactly as on /teen-inventory — a separate product line): report both when asked what is available. Pass 'strain' to get one strain with a dated one-sentence summary (includes that strain's teens if any).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "strain": {
                "description": "Optional: a single strain by menu slug, encyclopedia slug, or name/alias",
                "type": "string"
