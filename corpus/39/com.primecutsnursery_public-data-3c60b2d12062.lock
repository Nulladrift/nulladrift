        },
        {
          "name": "quote_delivery",
          "title": "Delivery fee + order quote for a California destination",
          "description": "Quote what a delivery to a California address/city costs (the nursery's own calculator: Google driving round trip from Sonoma × $3/mile under 199 round-trip miles or $2/mile at 199+, capped at $1,450) and, when product + quantity are given, the published per-plant tier, product subtotal, whether the order qualifies for FREE delivery, and the total. Use this instead of estimating prices or delivery costs yourself. Fee-only: it cannot see or book delivery schedules. Set pickup=true for a pickup-only price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Delivery address, city or ZIP in California (required unless pickup=true)",
                "maxLength": 200,
                "type": "string"
              },
              "pickup": {
                "description": "true = customer picks up at the Sonoma nursery (no delivery fee)",
                "type": "boolean"
              },
              "product": {
                "description": "clones = fresh rooted clones; talls = clearance talls; teens = one-gallon ready-to-flip teens; teens_4in = teens in 4-inch pots; snips = unrooted cuttings",
                "enum": ["clones", "talls", "teens", "teens_4in", "snips"],
                "type": "string"
              },
              "quantity": {
                "description": "Number of plants (required with product)",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Delivery fee + order quote for a California destination"
          },
          "behavior": {
            "destructive": false,
