        {
          "name": "restaurantdoctor_check_website",
          "title": "Check a restaurant's website",
          "description": "Checks a restaurant's own website as the online check on restaurantdoctorai.com does: secure (https) and on its own address, made for phones, a menu written as text that phones and Google can read, online orders on its own terms or only through delivery apps, the address, hours and phone written on the page, tap to call, a way to get in touch, email sign-up and gift cards, what Google reads (a headline, title and description, not hidden from search, restaurant structured data), the preview a shared link shows, the page's text, story, questions, reviews, photo descriptions and social links, and Google's phone speed test with its measures one by one and real visitors' speed when Google has it (15 to 40 seconds; phoneSpeed: false skips it). Returns the score and grade, each area's score, the three checks to fix first with what to do about each, what a basic AI reader can tell about each question in a word, and a link to the full online check, which adds the Google listing, every check with what to fix, the reasons and places nearby on the website. A check it couldn't make (a page drawn by scripts, a security screen instead of the page) is left out of the score, never failed; every check, its points and where its facts come from are listed at https://restaurantdoctorai.com/online-check/checks. Takes only the website address. The website isn't stored; only an anonymous daily count of checks is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "phoneSpeed": {
                "default": true,
                "description": "Whether to run Google's phone speed test too (the default). It takes 15 to 40 seconds; false skips it.",
                "type": "boolean"
              },
              "website": {
                "description": "The restaurant's own website address, such as joesdiner.com or https://www.joesdiner.com. Not a DoorDash, Uber Eats or Google Maps page.",
                "maxLength": 300,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["website"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "aiAnswers": {
                "description": "What a basic AI reader can tell from the home page and at most one menu page: whether AI can get in, what the restaurant sells, its prices, hours, phone and address, and how guests can order or book. Not part of the score. Assistants differ, and some run scripts. No score, and no promise of being recommended.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "question": {
                      "type": "string"
                    },
                    "state": {
                      "description": "found (written on the page, which doesn't mean every assistant gets it), missing (not found) or unknown (can't tell). For whether AI can get in, found means no block in the site's robots.txt or tags (a firewall we can't see could still turn crawlers away) and missing means the site's own rules block or limit it.",
                      "enum": ["found", "missing", "unknown"],
                      "type": "string"
                    },
                    "word": {
                      "description": "The state in words, as the owner reads it: Found, Not found, Can't tell, Not blocked by your rules, Linked.",
                      "type": "string"
                    }
                  },
                  "required": ["question", "state", "word"],
                  "type": "object"
                },
                "type": "array"
              },
              "areas": {
                "description": "The score for the website and for its speed on a phone.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "score": {
                      "anyOf": [
                        {
                          "description": "0 to 100.",
                          "type": "number"
                        },
                        {
                          "description": "Nothing could be checked here, or the phone speed test was skipped.",
                          "type": "null"
                        }
                      ]
                    },
                    "title": {
                      "type": "string"
                    },
                    "toFix": {
                      "description": "How many checks in this area need work.",
                      "type": "number"
                    }
                  },
                  "required": ["score", "title", "toFix"],
                  "type": "object"
                },
                "type": "array"
              },
              "checked": {
                "description": "How many checks could be made. One that couldn't (a page drawn by scripts, a security screen) is left out of the score, never failed.",
                "type": "number"
              },
              "fixFirst": {
                "description": "Up to three checks to fix first, most important first.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fix": {
                      "description": "What to do.",
                      "type": "string"
                    },
                    "found": {
                      "description": "What the check found.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["fix", "found", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "fullCheckUrl": {
                "description": "The full online check on restaurantdoctorai.com: adds the Google listing, every check with what to fix, the reasons behind each answer and the places nearby.",
                "type": "string"
              },
              "grade": {
                "enum": ["A", "B", "C", "D", "F"],
                "type": "string"
              },
              "meaning": {
                "description": "What the grade means, in a line for the owner.",
                "type": "string"
              },
              "needWork": {
                "description": "How many of the checks need work. The full online check names each one.",
                "type": "number"
              },
              "phoneSpeedSkipped": {
                "description": "Google's phone speed test wasn't run, because phoneSpeed was false. It isn't in the score.",
                "type": "boolean"
              },
              "score": {
                "description": "0 to 100, from the website and phone-speed checks only (the full check adds the Google listing).",
                "type": "number"
              },
              "website": {
                "description": "Where the site answered after redirects: its scheme and host only, such as https://www.joesdiner.com.",
                "type": "string"
              }
            },
            "required": ["aiAnswers", "areas", "checked", "fixFirst", "fullCheckUrl", "grade", "meaning", "needWork", "phoneSpeedSkipped", "score", "website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a restaurant's website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:695c1e9451026e1e88be5f3c998b59a330bb1ffd9d8aa22552fd509ed5c9f5bd"
        },
        {
          "name": "restaurantdoctor_cost_recipe",
          "title": "Cost a recipe (draft)",
          "description": "Reads a recipe's ingredient lines as written, weighs each one with USDA FoodData Central and USDA yields, and prices it with the owner's own prices when given, else dated US public prices (BLS and USDA ERS store averages, USDA wholesale prices, and USDA weekly store-ad sale prices, which run low). Returns a draft in US dollars: each line's grams, cost and price source, what each line still needs, the cost per plate as a range, and a link that opens the draft on restaurantdoctorai.com, where the owner checks each line and adds prices for one plate cost and a menu price. The draft never gives one plate cost or a menu price, and says nothing about allergens or nutrition. The recipe isn't stored; only an anonymous daily count of drafts is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "prices": {
                "description": "The owner's own prices, when they give them. Lines without one use US public prices: store averages (BLS, USDA ERS), wholesale prices (USDA) and, for items those don't cover, USDA weekly store-ad sale prices, which run low. None is the owner's cost. Tap water is costed at 0.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "countOf": {
                      "description": "With packUnit each: what one item is, when it isn't a whole one, such as clove or bunch.",
                      "enum": ["each", "clove", "slice", "stick", "bunch", "sprig", "leaf", "can", "package"],
                      "type": "string"
                    },
                    "ingredient": {
                      "description": "The ingredient as the recipe names it, such as \"ground beef\".",
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "packSize": {
                      "description": "How much one pack holds: 10 for a 10 lb case.",
                      "exclusiveMinimum": 0,
                      "maximum": 1000000,
                      "type": "number"
                    },
                    "packUnit": {
                      "description": "The pack's unit: g, kg, oz, lb, ml, l, floz (US fluid ounces), gal (US gallons) or each.",
                      "enum": ["g", "kg", "oz", "lb", "ml", "l", "floz", "gal", "each"],
                      "type": "string"
                    },
                    "paid": {
                      "description": "What the owner pays for one pack, in US dollars.",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["ingredient", "packSize", "packUnit", "paid"],
                  "type": "object"
                },
                "maxItems": 60,
                "type": "array"
              },
              "recipe": {
                "description": "The recipe as written: its name, its servings line (\"Serves 6\") and its ingredient lines, one a line, each amount and unit exactly as the recipe or the photo gives it. Method steps may follow under a heading such as \"Instructions\"; only ingredient lines are costed. The lines are read as sent, not converted, rounded or corrected: the owner checks them on the website. At most 8000 characters and 60 ingredient lines.",
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
              },
              "servings": {
                "description": "How many plates the recipe makes, when its text doesn't say.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "source": {
                "default": "text",
                "description": "Where the recipe came from: text the owner typed or pasted (text), a photo or scan of a printed or typed page (typed-photo), a handwritten card (handwriting), or a PDF (pdf). It sets how many lines the owner confirms on the website: handwriting, every line.",
                "enum": ["text", "typed-photo", "handwriting", "pdf"],
                "type": "string"
              }
            },
            "required": ["recipe"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "checks": {
                "description": "Amounts that look like slips, such as a lot of salt for the plates.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cost": {
                "additionalProperties": false,
                "properties": {
                  "batch": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "The whole recipe's cost, low to high. Null while incomplete.",
                        "properties": {
                          "high": {
                            "type": "number"
                          },
                          "low": {
                            "type": "number"
                          }
                        },
                        "required": ["high", "low"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "ownerShare": {
                    "description": "The share of the priced cost that's on the owner's own prices.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "plate": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "A plate's cost, low to high. Null until the cost and the plates are known.",
                        "properties": {
                          "high": {
                            "type": "number"
                          },
                          "low": {
                            "type": "number"
                          }
                        },
                        "required": ["high", "low"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "state": {
                    "description": "range: every line is priced. incomplete: some lines need an amount, an ingredient or a price first, so there's no total.",
                    "enum": ["range", "incomplete"],
                    "type": "string"
                  },
                  "text": {
                    "type": "string"
                  }
                },
                "required": ["batch", "ownerShare", "plate", "state", "text"],
                "type": "object"
              },
              "currency": {
                "const": "USD",
                "type": "string"
              },
              "disclaimer": {
                "type": "string"
              },
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "As read: \"2 lb\", \"1 can (14.5 oz)\", \"To taste\", \"No amount\".",
                      "type": "string"
                    },
                    "check": {
                      "description": "What the owner should look at on this line.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "cost": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "description": "The line's cost for the whole recipe, low to high.",
                          "properties": {
                            "high": {
                              "type": "number"
                            },
                            "low": {
                              "type": "number"
                            }
                          },
                          "required": ["high", "low"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "grams": {
                      "anyOf": [
                        {
                          "description": "The weight used, after trimming.",
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "ingredient": {
                      "anyOf": [
                        {
                          "description": "The USDA FoodData Central food it was matched to.",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "line": {
                      "description": "As written.",
                      "type": "string"
                    },
                    "match": {
                      "description": "How sure the match is.",
                      "enum": ["exact", "close", "guess", "none"],
                      "type": "string"
                    },
                    "needs": {
                      "anyOf": [
                        {
                          "description": "What the line needs before it can be costed.",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "notes": {
                      "description": "What was assumed to weigh and price it.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "price": {
                      "anyOf": [
                        {
                          "description": "Where its price comes from: \"Your price\", \"Store average, Aug 2026 (BLS)\", \"Store average, 2023 (USDA ERS)\", \"Wholesale, Oct 2026 (USDA)\", \"Store ad price, week of Sep 28, 2026 (USDA AMS); sale prices run low\" or \"Tap water, costed at 0\".",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "size": {
                      "anyOf": [
                        {
                          "description": "For a can, jar or package line whose recipe gives no size: that its cost waits for the size, which the owner picks on the website. Null otherwise.",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "status": {
                      "enum": ["costed", "left-out", "needs"],
                      "type": "string"
                    }
                  },
                  "required": ["amount", "check", "cost", "grams", "ingredient", "line", "match", "needs", "notes", "price", "size", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "link": {
                "description": "Opens this draft on the website, where the owner checks each line.",
                "type": "string"
              },
              "nextStep": {
                "type": "string"
              },
              "notes": {
                "description": "What the draft assumed about the whole recipe.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "priceFirst": {
                "description": "The dearest lines not on the owner's prices yet: their prices move the cost the most.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recipe": {
                "type": "string"
              },
              "servings": {
                "anyOf": [
                  {
                    "description": "Plates the recipe makes: null when neither the recipe nor the call says.",
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "sources": {
                "description": "The public prices used.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "unusedPrices": {
                "description": "Prices sent that matched no line.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["checks", "cost", "currency", "disclaimer", "lines", "link", "nextStep", "notes", "priceFirst", "recipe", "servings", "sources", "unusedPrices"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cost a recipe (draft)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
