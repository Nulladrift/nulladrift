        {
          "name": "restaurantdoctor_list_knowledge",
          "title": "List RestaurantDoctorAI's library",
          "description": "Lists the entries of RestaurantDoctorAI's sourced library, all or one kind (guide, post, play, targets, fact or knowledge), up to 50 at a time: each with its id, kind, title, link and source, and for guides and blog posts the day it was published and last updated. It shows what the library has, such as every blog post and its date. Pages with offset and limit; nextOffset gives the next page. Nothing about the request is stored; only an anonymous daily count of searches (a list counts as one) is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "default": "all",
                "description": "Which kind of entry to list: guide (the website's guides), post (blog posts), play (RestaurantDoctorAI's step-by-step fixes), targets (RestaurantDoctorAI's targets by type of restaurant), fact (sourced industry facts) or knowledge (sourced how-tos, rules and checklists); or all (the default).",
                "enum": ["guide", "post", "play", "targets", "fact", "knowledge", "all"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many entries to return, 1 to 50 (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "How many entries to skip (default 0). The next page starts at the nextOffset the previous list returned.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "entries": {
                "description": "In the library's order: guides, blog posts, playbook fixes, targets, facts, then knowledge entries.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "The entry's id, which reading the entry in full takes.",
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["guide", "post", "play", "targets", "fact", "knowledge"],
                      "type": "string"
                    },
                    "published": {
                      "anyOf": [
                        {
                          "description": "Guides and blog posts: the day it was first published, YYYY-MM-DD. Null for other kinds.",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "source": {
                      "description": "Who says so, with the date it was checked or updated where there is one.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "updated": {
                      "anyOf": [
                        {
                          "description": "Guides and blog posts: the day it was last updated, YYYY-MM-DD. Null for other kinds.",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "url": {
                      "description": "Where a reader can check it: the page on restaurantdoctorai.com, or the fact's own source.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "kind", "published", "source", "title", "updated", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "kind": {
                "enum": ["guide", "post", "play", "targets", "fact", "knowledge", "all"],
                "type": "string"
              },
              "nextOffset": {
                "anyOf": [
                  {
                    "description": "Where the next page starts: the offset of the next list.",
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "note": {
                "type": "string"
              },
              "offset": {
                "type": "number"
              },
              "total": {
                "description": "How many entries of this kind there are.",
                "type": "number"
              }
            },
            "required": ["entries", "kind", "nextOffset", "note", "offset", "total"],
            "type": "object"
          },
