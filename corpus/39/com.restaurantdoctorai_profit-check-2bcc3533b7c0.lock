                "type": "number"
              },
              "freeCheck": {
                "type": "string"
              },
              "guide": {
                "description": "Who has to post calories, and what such a menu shows.",
                "type": "string"
              },
              "ingredients": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "type": "number"
                    },
                    "food": {
                      "type": "string"
                    },
                    "grams": {
                      "type": "number"
                    },
                    "kcal": {
                      "type": "number"
                    },
                    "kcalPer100g": {
                      "description": "As counted for this country.",
                      "type": "number"
                    },
                    "source": {
                      "description": "USDA's description and FDC ID, or the pack label.",
                      "type": "string"
                    },
                    "unit": {
                      "enum": ["g", "kg", "oz", "lb", "ml", "l", "floz", "cup", "tbsp", "tsp", "each"],
                      "type": "string"
