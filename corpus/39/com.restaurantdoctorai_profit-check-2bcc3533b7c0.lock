        },
        {
          "name": "restaurantdoctor_deadlines",
          "title": "List a restaurant's deadlines",
          "description": "Lists a US restaurant's coming tax, payroll, license and permit deadlines, as the deadline calendar on restaurantdoctorai.com does: federal dates (payroll forms, tip reports, W-2s, 1099s, returns, estimated tax) and the state's (sales tax, unemployment reports, yearly reports, franchise taxes, minimum wage changes, liquor and health permit dates where one date applies to everyone), each moved for weekends and holidays by the agency's rule, with the rule, what a miss costs and the official source. A state date is given only where the state's own page confirms it; the rest come as what to check with the agency. Also the rules for each hire, and a link that opens the same calendar on the website, where the owner adds their own license and permit dates and gets free email reminders. Takes the state and yes/no answers, no names or emails; scope (federal or state) and withinDays (the next so many days) cut the list. Reminders, not legal or tax advice. The answers aren't stored; only an anonymous daily count of calendars is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "alcohol": {
                "description": "Sells alcohol.",
                "type": "boolean"
              },
              "bigTipped": {
                "description": "Tipped, and staff worked more than 80 hours in total on a typical day last year, all locations together (Form 8027).",
                "type": "boolean"
              },
              "business": {
                "description": "How the business is set up: sole (sole owner, no LLC), llc_single, llc_multi, partnership (no LLC), s_corp or c_corp. Decides the tax return and the state's yearly report. Left out, both return dates come with an \"If\".",
                "enum": ["sole", "llc_single", "llc_multi", "partnership", "s_corp", "c_corp"],
                "type": "string"
              },
              "caterer": {
                "description": "Mainly catering or a food truck, not a restaurant or bar (OSHA's injury log).",
                "type": "boolean"
              },
              "city": {
                "description": "A city with its own minimum wage, as an id like los-angeles or chicago; left out, the state's rate applies.",
                "pattern": "^[a-z0-9-]{1,40}$",
                "type": "string"
              },
              "contractors": {
                "description": "Pays a contractor, or rent to a landlord that isn't a corporation, $2,000 or more a year (1099 forms).",
                "type": "boolean"
              },
              "deposits": {
                "description": "Who pays the payroll taxes to the IRS: provider (a payroll company), monthly (the owner, by the 15th), semiweekly (the owner, after each payday).",
                "enum": ["provider", "monthly", "semiweekly"],
                "type": "string"
              },
              "estimated": {
                "description": "The owner pays quarterly estimated tax on the business's profit.",
                "type": "boolean"
              },
              "formed": {
                "description": "The month the LLC or corporation was formed with the state, YYYY-MM. Some states set the yearly report by it.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "fullTime50": {
                "description": "50 or more full-time staff on average, counting part-timers' hours, related businesses together (ACA forms).",
                "type": "boolean"
              },
              "months": {
                "default": 3,
                "description": "How many months ahead to list, 1 to 15 (default 3). The calendar runs to the end of 2027. withinDays, when sent, sets the window instead.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "salesTax": {
                "description": "How often the state has the restaurant file sales tax (on its permit letter or state account).",
                "enum": ["monthly", "quarterly", "yearly"],
                "type": "string"
              },
              "scope": {
                "description": "Optional, to cut the list: federal (the IRS's and other federal dates only), state (the state's and the city's only) or all (the default). The rules for each hire are listed either way.",
                "enum": ["all", "federal", "state"],
                "type": "string"
              },
              "staff": {
                "description": "Has anyone on payroll.",
                "type": "boolean"
              },
              "state": {
                "description": "The restaurant's US state, two letters (DC for Washington DC).",
                "enum": ["AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "DC", "FL", "GA", "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME", "MD", "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", "NJ", "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY"],
                "type": "string"
              },
              "tips": {
                "default": false,
                "description": "Customers usually tip the staff.",
                "type": "boolean"
              },
              "withinDays": {
                "description": "Optional: only the dates in the next so many days, 1 to 460, from today in the state (7 for the coming week). Sent, it replaces months.",
                "maximum": 460,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["alcohol", "staff", "state"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "calendarUrl": {
                "description": "The same calendar on restaurantdoctorai.com, where the owner can add the dates printed on their own licenses and permits and get email reminders or a calendar link, free.",
                "type": "string"
              },
              "checkWith": {
                "description": "What we can't date for this owner: their own schedule or papers, or a state page not yet confirmed. No date here is guessed.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "detail": {
                      "type": "string"
                    },
                    "link": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["detail", "link", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "deadlines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "appliesIf": {
                      "anyOf": [
