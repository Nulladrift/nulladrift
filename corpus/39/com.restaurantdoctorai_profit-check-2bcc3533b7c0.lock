      "serverInfo": {
        "name": "restaurantdoctorai-profit-check",
        "title": "RestaurantDoctorAI profit check and calculators",
        "version": "1.14.0",
        "description": "A free restaurant profit check (12 multiple-choice questions, scored against RestaurantDoctorAI's targets), a recipe costing draft, the website's free prime cost, labor cost, break-even, restaurant budget, plate cost, delivery app prices, menu calories, FICA tip credit, card fees and booking fees calculators, its free nightly cash-out, tip-out and par levels sheets, a free check of a restaurant's website, a US restaurant's tax, payroll, license and permit deadlines, a search, list and read of RestaurantDoctorAI's sourced guides, blog posts and restaurant knowledge, and a guided prime cost consult.",
        "websiteUrl": "https://restaurantdoctorai.com/ai-assistants"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RestaurantDoctorAI's free restaurant profit check, recipe costing, calculators, website check, deadline calendar, sourced library and guided prime cost consult. restaurantdoctor_get_questions lists the 12 questions and the values they accept, worded for the restaurant's country and currency; restaurantdoctor_run_free_check scores a full set of answers and returns the free result with a link to the same result on the website. The check takes no names, emails or figures. The answers aren't stored; only an anonymous daily count of checks is kept. restaurantdoctor_prime_cost_consult runs the guided consult \"Fix my prime cost\" one step at a time from the answers so far, with set questions and the calculators and no AI in between, and ends in the biggest problem at those figures, a fix from RestaurantDoctorAI's playbook and its sources; it keeps nothing between calls, and each step counts as a calculator run. restaurantdoctor_cost_recipe costs a recipe's ingredient lines as a draft, with a link where the owner checks them on the website. The recipe isn't stored; only an anonymous daily count of drafts is kept. restaurantdoctor_prime_cost, restaurantdoctor_labor_cost, restaurantdoctor_break_even, restaurantdoctor_restaurant_budget, restaurantdoctor_plate_cost, restaurantdoctor_delivery_price, restaurantdoctor_menu_calories, restaurantdoctor_fica_tip_credit, restaurantdoctor_card_fees and restaurantdoctor_booking_fees work out the website's free calculators from the owner's own figures, in any currency (the FICA tip credit, card fees and booking fee checks: a US restaurant's, in US dollars), each with a link that opens the same calculator with the figures filled in. restaurantdoctor_restaurant_budget splits a month's expected sales by RestaurantDoctorAI's targets for the type of restaurant, with what's left after every bill and break-even. restaurantdoctor_fica_tip_credit estimates a US restaurant's FICA tip credit (Form 8846) from a year's tips, with the reasons the real answer may be zero first; it files nothing and isn't tax advice. restaurantdoctor_card_fees compares a month's card fees with a dated fair range for the type of restaurant. restaurantdoctor_booking_fees works out what a reservation app costs a month, a year and per guest booked, and lists other apps' prices as information, not a recommendation. restaurantdoctor_cash_out works out a night's cash close for one drawer, with no normal of its own for over or short. restaurantdoctor_tip_out works out a server's tip-out or a tip pool; it doesn't say whether a split is allowed. restaurantdoctor_par_levels works out par levels and what to order for up to 50 items from their use, the days an order covers and what's on hand. These three link to the website's free printable sheets, not to a calculator. The figures aren't stored; only an anonymous daily count of calculator runs is kept. restaurantdoctor_check_website scores a restaurant's own website (and Google's phone speed test), says the three things to fix first, and links to the full online check on the website. The website isn't stored; only an anonymous daily count of checks is kept. restaurantdoctor_deadlines lists a US restaurant's coming tax, payroll, license and permit deadlines from its state and yes/no answers, each with its rule and official source, and links to the same calendar on the website for reminders. The answers aren't stored; only an anonymous daily count of calendars is kept. restaurantdoctor_search_knowledge searches RestaurantDoctorAI's sourced library (its guides, blog posts, playbook fixes, targets, sourced facts and expert knowledge) and returns passages with their links and sources, restaurantdoctor_list_knowledge lists its entries by kind with the guides' and posts' dates, and restaurantdoctor_read_knowledge reads one entry in full, in parts for a long one; each figure comes with its source, and RestaurantDoctorAI's targets are its own, not industry benchmarks. The query isn't stored; only an anonymous daily count of searches and reads is kept. A list counts as a search.",
      "tools": [
        {
          "name": "restaurantdoctor_booking_fees",
          "title": "Booking fee check",
          "description": "Works out what a US restaurant's reservation app costs it, as the free booking fee check on restaurantdoctorai.com does: a month, a year, per guest who booked through it and as a share of the average spend, from the plan's published price (dated, sourced) or the owner's invoice, plus fees per guest and the percentage on deposits. Of the apps checked, only OpenTable charges per guest: for guests from its own app and website, possibly from Google and partners, and on Basic from the restaurant's own website. Returns a one-sentence headline first, the month line by line, what isn't counted, what the owner can do (book direct, mark no-shows, the contract's notice date), other apps' published prices as information, not a recommendation, the caveats and sources. It answers what OpenTable, Resy, Tock, Yelp, Toast Tables, SpotOn or SevenRooms costs a restaurant per reservation or per guest. It needs the app and plan (on the invoice) and, for OpenTable, last month's guests from its covers report by where they booked; the rest is optional. A figure that isn't sent is never counted as 0. Not affiliated with any app; it reads no account. The figures aren't stored; only an anonymous daily count of calculator runs is kept.",
