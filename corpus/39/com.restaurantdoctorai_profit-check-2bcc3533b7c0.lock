        {
          "name": "restaurantdoctor_delivery_price",
          "title": "Delivery app price calculator",
          "description": "Works out a dish's break-even price on a delivery app, the app price that leaves the owner the same money as selling it in their dining room, as the free delivery app price calculator on restaurantdoctorai.com does: the in-house price ÷ (1 − the app's real commission rate), the markup on the in-house price that takes (rounded up to a whole percent), and what the app keeps. Takes the dish's in-house price, in any currency, and one app's real commission rate from its payout statements; a figure that isn't sent is never counted as 0. Returns the calculator's result, how it was worked out, and a link that opens the calculator with the same figures filled in. The figures aren't stored; only an anonymous daily count of calculator runs is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "price": {
                "anyOf": [
                  {
                    "description": "The dish's price on the owner's own menu, as a dining room guest pays it, in the owner's own currency (14 or 18.5). Needed for a result, and more than 0; if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "rate": {
                "anyOf": [
                  {
                    "description": "One delivery app's real commission rate, as a percent: 30 for 30%, not 0.30. From a month of that app's payout statements: (menu sales before tax and tips − the app's payout without tax and tips) ÷ those menu sales × 100, so marketing fees, promotions the owner funds and refunds are in it; the rate in the app's plan leaves them out. Each app is worked out on its own. Needed for a result: 0, or from 1 to 89; if missing, the reply asks for it.",
                    "maximum": 89,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "appKeeps": {
                "description": "What the app keeps at the break-even app price, to the cent as the page shows it.",
                "type": "number"
              },
              "appPrice": {
                "description": "The break-even app price, price ÷ (1 − rate), to the cent as the page shows it: the app price that leaves the owner the in-house price.",
                "type": "number"
              },
              "freeCheck": {
                "type": "string"
              },
              "link": {
                "description": "Opens the calculator on the website with these figures filled in.",
                "type": "string"
              },
              "markupPercent": {
                "description": "The markup on the in-house price that takes, %, rounded up to a whole number so it's never short.",
                "type": "number"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "price": {
                "description": "The in-house price it was worked out from, in the currency it was sent in.",
                "type": "number"
              },
              "rate": {
                "description": "The real commission rate, %.",
                "type": "number"
              },
              "result": {
                "description": "The result in the page's words, in its order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "workedOut": {
                "description": "How it was worked out, with the figures in each step.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "value"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["appKeeps", "appPrice", "freeCheck", "link", "markupPercent", "notes", "price", "rate", "result", "workedOut"],
            "type": "object"
          },
