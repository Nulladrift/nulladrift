                    "type": "number"
                  }
                },
                "required": ["fixedBills", "foodAndDrink", "hourlyPay", "otherVariable", "ownerPay", "sales"],
                "type": "object"
              },
              "freeCheck": {
                "type": "string"
              },
              "hourly": {
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "leftOver": {
                "description": "Left over after every bill and ownerPay at these sales, before income tax: below 0 when short. Not profit.",
                "type": "number"
              },
              "link": {
                "description": "Opens the calculator with these figures.",
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
