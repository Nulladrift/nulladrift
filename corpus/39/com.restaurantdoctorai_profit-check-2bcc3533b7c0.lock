        {
          "name": "restaurantdoctor_par_levels",
          "title": "Prep list and par sheet",
          "description": "Works out par levels and what to order for up to 50 kitchen or bar items, as the free prep and par sheet on restaurantdoctorai.com does. Par = use per day × days covered + safety stock (days covered: from the day of the count and the order until the next delivery after this one arrives); order = par minus what's on hand, never below 0, rounded up to whole packs when a pack size is sent. Takes each item's use per day (or per week and the days open a week), days covered, optional safety stock and pack size, and what's on hand, in the owner's own units; a figure that isn't sent is never counted as 0, and an item missing one is returned as incomplete. Returns each item's par and order, the items that need an order, and a link to the free prep and par sheet. The figures aren't stored; only an anonymous daily count of calculator runs is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "daysCovered": {
                "anyOf": [
                  {
                    "description": "Days each order covers, for items without their own: from the day of the count and the order to the day the next delivery after this one arrives.",
                    "exclusiveMinimum": 0,
                    "maximum": 60,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "daysOpenPerWeek": {
                "anyOf": [
                  {
                    "description": "Days open a week, 1 to 7. Needed only for items sent with usePerWeek.",
                    "maximum": 7,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "items": {
                "anyOf": [
                  {
                    "description": "Needed: the items, up to 50.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "daysCovered": {
                          "anyOf": [
                            {
                              "description": "This item's days covered. Left out, the list's daysCovered.",
                              "exclusiveMinimum": 0,
                              "maximum": 60,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "name": {
                          "anyOf": [
                            {
                              "description": "Optional: the item.",
                              "maxLength": 60,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "onHand": {
                          "anyOf": [
                            {
                              "description": "Units on hand when the order is placed. Needed.",
                              "maximum": 1000000000,
                              "minimum": 0,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "packSize": {
                          "anyOf": [
                            {
                              "description": "Optional: units in one pack, to 3 decimals. With it, the order is whole packs.",
                              "exclusiveMinimum": 0,
                              "maximum": 1000000000,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "safety": {
                          "anyOf": [
                            {
                              "description": "Optional: units kept on top for a busy day or a late truck. Left out, 0.",
                              "maximum": 1000000000,
                              "minimum": 0,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "unit": {
                          "anyOf": [
                            {
                              "description": "Optional: the unit, such as lb or each.",
                              "maxLength": 60,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "usePerDay": {
                          "anyOf": [
                            {
                              "description": "Units used in a day open. Needed, or usePerWeek.",
                              "maximum": 1000000000,
                              "minimum": 0,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "usePerWeek": {
                          "anyOf": [
                            {
                              "description": "Units used in a week: divided by daysOpenPerWeek. Not used when usePerDay is sent.",
                              "maximum": 1000000000,
                              "minimum": 0,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        }
                      },
                      "type": "object"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "freeCheck": {
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "daysCovered": {
                      "anyOf": [
                        {
                          "description": "Null while incomplete.",
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "missing": {
                      "description": "What an incomplete item lacks.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "onHand": {
                      "anyOf": [
                        {
                          "description": "Null while incomplete.",
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "order": {
                      "anyOf": [
                        {
                          "description": "Units to order: the shortfall, or the packs times the pack size.",
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "packs": {
                      "anyOf": [
                        {
                          "description": "Whole packs, with a pack size and something short.",
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "par": {
                      "anyOf": [
                        {
                          "description": "The use per day × days covered + safety, rounded up to 0.01.",
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "short": {
                      "anyOf": [
                        {
                          "description": "Par minus on hand, never below 0.",
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "status": {
                      "enum": ["order", "enough", "incomplete"],
                      "type": "string"
                    },
                    "unit": {
                      "type": "string"
                    },
                    "usePerDay": {
                      "anyOf": [
                        {
                          "description": "Null while incomplete.",
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "working": {
                      "description": "The item worked out with its numbers.",
                      "type": "string"
                    }
                  },
                  "required": ["daysCovered", "missing", "name", "onHand", "order", "packs", "par", "short", "status", "unit", "usePerDay", "working"],
                  "type": "object"
                },
                "type": "array"
              },
              "link": {
                "description": "The free prep and par sheet, to print or download.",
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "result": {
                "description": "The result in the sheet's words.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "toOrder": {
                "description": "The items that need an order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "order": {
                      "type": "number"
                    },
                    "packs": {
                      "anyOf": [
                        {
                          "description": "Null without a pack size.",
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "unit": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "order", "packs", "unit"],
                  "type": "object"
                },
                "type": "array"
              },
              "totals": {
                "additionalProperties": false,
                "properties": {
                  "enough": {
                    "type": "number"
                  },
                  "incomplete": {
                    "type": "number"
                  },
                  "items": {
                    "type": "number"
                  },
                  "needOrder": {
                    "type": "number"
                  }
                },
                "required": ["enough", "incomplete", "items", "needOrder"],
                "type": "object"
              }
            },
            "required": ["freeCheck", "items", "link", "notes", "result", "toOrder", "totals"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
