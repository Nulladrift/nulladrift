        {
          "name": "restaurantdoctor_fica_tip_credit",
          "title": "FICA tip credit check",
          "description": "Estimates a US restaurant's FICA tip credit (IRS Form 8846, the 45B credit) for a year like the one in its payroll figures, as the free FICA tip credit check on restaurantdoctorai.com does: the employer's 7.65% Social Security and Medicare tax on reported tips, less the tips needed to bring tipped staff's cash wage up to the 5.15 dollars an hour the law fixes for restaurants. Returns the reasons the real answer may be zero first (already claimed, no federal income tax owed, service charges aren't tips, only the business can claim it), then the credit as a range, its worth after the deduction it replaces, the years that may still be open, and sources. It answers questions about taxes on tips, Form 8846, the 45B credit or money the business may be missing on tips. It needs the state, a year's tips reported through payroll (never service charges) and, where the cash wage is under 5.15 dollars, tipped staff's hours that year; whether the return already includes Form 8846 comes first, if known. A figure that isn't sent is never counted as 0. It files nothing, isn't tax advice and takes no payment: the result is an estimate to take to the accountant, with a link that opens the same check with the figures filled in. The figures aren't stored; only an anonymous daily count of calculator runs is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "alreadyClaimed": {
                "anyOf": [
                  {
                    "description": "Optional, asked first: whether the business's return already includes Form 8846 (Form 3800, Part III, line 4f, or the credit on a K-1 from the business): yes, no or unsure (left out: unsure). Yes means there may be nothing left to find.",
                    "enum": ["yes", "no", "unsure"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "businessType": {
                "anyOf": [
                  {
                    "description": "Optional: how the business files its taxes, which sets what the credit is worth after tax: c_corp = C corporation; s_corp = S corporation (or an LLC taxed as one); partnership = Partnership (or an LLC taxed as one); sole_owner = Sole owner (or a one-owner LLC); unsure = Not sure (left out: unsure).",
                    "enum": ["c_corp", "s_corp", "partnership", "sole_owner", "unsure"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "cashWage": {
                "anyOf": [
                  {
                    "description": "Optional: the hourly cash wage tipped staff were paid before tips that year, in US dollars (2.13), if it wasn't the state's tipped wage; the lowest if it changed. Used instead of the state's.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "owesIncomeTax": {
                "anyOf": [
                  {
                    "description": "Optional: whether the business (for a pass-through, its owners) usually owes federal income tax: yes, no or unsure (left out: unsure).",
                    "enum": ["yes", "no", "unsure"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "reportedTips": {
                "anyOf": [
                  {
                    "description": "A year's tips reported through payroll for one business, in US dollars: line 5b of the year's four Forms 941 added up, W-2 box 7 totals, or the year's total from the payroll tips report (Toast, Gusto). Service charges, automatic gratuities and delivery fees don't count: they're wages. Needed for a result; if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "state": {
                "anyOf": [
                  {
                    "description": "The US state the restaurant is in: a two-letter code (TX) or its name. It sets tipped staff's cash wage from the US Department of Labor's table. Needed for a result unless cashWage is sent; if missing, the reply asks for it.",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "tippedHours": {
                "anyOf": [
                  {
                    "description": "The hours tipped staff worked that year, all together, from the payroll hours report. Needed for a result only when the cash wage is under $5.15 an hour (Texas: $2.13); then, if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "afterTax": {
                "additionalProperties": false,
                "description": "After the deduction it replaces, before state tax: federal rates assumed, share of each credit dollar kept.",
                "properties": {
                  "high": {
                    "type": "number"
                  },
                  "keep": {
                    "additionalProperties": false,
                    "properties": {
                      "high": {
                        "type": "number"
                      },
                      "low": {
                        "type": "number"
                      }
                    },
                    "required": ["high", "low"],
                    "type": "object"
                  },
                  "low": {
                    "type": "number"
                  },
                  "rates": {
                    "additionalProperties": false,
                    "properties": {
                      "high": {
                        "type": "number"
                      },
                      "low": {
                        "type": "number"
                      }
                    },
                    "required": ["high", "low"],
                    "type": "object"
                  }
                },
                "required": ["high", "keep", "low", "rates"],
                "type": "object"
              },
              "allTipsCredit": {
                "description": "7.65% of every tip: the most it can be.",
                "type": "number"
              },
              "alreadyClaimed": {
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "assumedUnsure": {
                "description": "Left out, read as unsure.",
                "items": {
                  "enum": ["alreadyClaimed", "businessType", "owesIncomeTax"],
                  "type": "string"
                },
                "type": "array"
              },
              "base": {
                "description": "$5.15: tips needed to bring the cash wage up to this don't count.",
                "type": "number"
              },
              "businessType": {
                "enum": ["c_corp", "s_corp", "partnership", "sole_owner", "unsure"],
