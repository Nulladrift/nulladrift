                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "credit": {
                "additionalProperties": false,
                "description": "The gross FICA tip credit for a year like this; exact when the cash wage is $5.15 or more.",
                "properties": {
                  "exact": {
                    "type": "boolean"
                  },
                  "high": {
                    "type": "number"
                  },
                  "low": {
                    "type": "number"
                  }
                },
                "required": ["exact", "high", "low"],
                "type": "object"
              },
              "creditableTips": {
                "additionalProperties": false,
                "properties": {
                  "high": {
                    "type": "number"
                  },
                  "low": {
                    "type": "number"
                  }
                },
                "required": ["high", "low"],
                "type": "object"
              },
              "freeCheck": {
                "type": "string"
              },
              "gapPerHour": {
                "type": "number"
              },
              "headline": {
                "type": "string"
              },
              "headlineKind": {
                "enum": ["alreadyClaimed", "noTips", "tipsBelowGap", "estimate"],
                "type": "string"
              },
              "hoursUsed": {
                "description": "Only when the cash wage is under $5.15.",
                "type": "boolean"
              },
              "irsWebPage": {
                "additionalProperties": false,
                "description": "At the IRS web page's $7.25: the most cautious reading.",
                "properties": {
                  "base": {
                    "type": "number"
                  },
                  "credit": {
                    "anyOf": [
                      {
                        "description": "Null without the hours.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "creditableTips": {
                    "anyOf": [
                      {
                        "description": "Null without the hours.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["base", "credit", "creditableTips"],
                "type": "object"
              },
              "link": {
                "description": "Opens the check on the website with these figures filled in.",
                "type": "string"
              },
              "openYears": {
                "additionalProperties": false,
                "description": "Years a missed credit may still be claimed for.",
                "properties": {
                  "asOf": {
                    "type": "string"
                  },
                  "firstCloses": {
                    "type": "string"
                  },
                  "years": {
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  }
                },
                "required": ["asOf", "firstCloses", "years"],
                "type": "object"
              },
              "owesIncomeTax": {
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "reportedTips": {
                "description": "US dollars, like every amount here.",
                "type": "number"
              },
              "result": {
                "description": "The page's words, in its order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "setAside": {
                "description": "Hours × the gap.",
                "type": "number"
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "state": {
                "anyOf": [
                  {
                    "additionalProperties": false,
