        {
          "name": "restaurantdoctor_menu_calories",
          "title": "Menu calorie counter",
          "description": "Works out a dish's calories from its recipe, as the free menu calorie counter on restaurantdoctorai.com does: each ingredient's calories from USDA FoodData Central (a list of 118 common foods) or its pack label, added up, shared by the plates it makes or by portion weight, and rounded once the way US, Ontario or UK and EU menus show calories. Ingredients are matched to that list, never guessed: words that fit several foods come back with the foods to pick from, and words that fit none with the nearest foods, or as not on the list. A pack label's kcal per 100 g comes from the owner's own label, never an estimate: without one, that ingredient can't be counted yet. Returns the menu figure, the exact one, how it was worked out with each food's FDC ID, what to check before printing, and a link that opens the counter with the same recipe filled in. It's an estimate, not a lab test. The figures aren't stored; only an anonymous daily count of calculator runs is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cookedWeight": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "description": "With weight: the whole batch, weighed after cooking. Needed then; if missing, the reply asks for it.",
                    "properties": {
                      "amount": {
                        "maximum": 1000000000,
                        "minimum": 0.001,
                        "type": "number"
                      },
                      "unit": {
                        "enum": ["g", "kg", "oz", "lb"],
                        "type": "string"
                      }
                    },
                    "required": ["amount", "unit"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "country": {
                "description": "Where the menu is: sets the energy figure and its rounding. us = US; ontario = Canada (Ontario); ukeu = UK, Ireland or EU (kcal, with the EU's energy factors).",
                "enum": ["us", "ontario", "ukeu"],
                "type": "string"
              },
              "dish": {
                "anyOf": [
                  {
                    "description": "Optional: the dish's name, for the record.",
                    "maxLength": 100,
                    "minLength": 0,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "ingredients": {
                "anyOf": [
                  {
                    "description": "What goes into the dish or batch, one entry each. Needed for a result; if missing, the reply asks for it.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "amount": {
                          "anyOf": [
                            {
                              "description": "How much goes in, after trimming, in unit. Weighed if possible. Needed for a result; if missing, the reply asks for it.",
                              "maximum": 1000000000,
                              "minimum": 0,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "food": {
                          "anyOf": [
                            {
                              "description": "The food: its name on the counter's list of USDA foods, as an earlier answer gave it, or the owner's words for it, matched to that list. Words that fit several foods, or none, come back as a tool error naming the foods to pick from, or saying it isn't on the list. With kcalPer100g, just its name.",
                              "maxLength": 100,
                              "minLength": 1,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "kcalPer100g": {
                          "anyOf": [
                            {
                              "description": "For a food not on the list: kcal per 100 g from the nutrition panel on the owner's own pack, as the owner reads it (a US label gives a serving: its calories ÷ its grams × 100). It's the label's figure, not an estimate by the assistant: without the owner's label, the ingredient can't be counted yet. Weighed only.",
                              "maximum": 900,
                              "minimum": 0,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "unit": {
                          "description": "g, kg, oz or lb for any food. ml, l, floz, cup, tbsp or tsp (US measures) for liquids and fats only; each for foods counted by the piece.",
                          "enum": ["g", "kg", "oz", "lb", "ml", "l", "floz", "cup", "tbsp", "tsp", "each"],
                          "type": "string"
                        }
                      },
                      "required": ["unit"],
                      "type": "object"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "plates": {
                "anyOf": [
                  {
                    "description": "With plates: how many plates it makes, 1 for a single plate. Needed then; if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0.001,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "portionWeight": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "description": "With weight: one portion. Needed then; if missing, the reply asks for it.",
                    "properties": {
                      "amount": {
                        "maximum": 1000000000,
                        "minimum": 0.001,
                        "type": "number"
                      },
                      "unit": {
                        "enum": ["g", "kg", "oz", "lb"],
                        "type": "string"
                      }
                    },
                    "required": ["amount", "unit"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "portioning": {
                "description": "plates: one plate, or a batch shared into plates (12 pancakes). weight: portions weighed from a cooked batch (a ladle of soup).",
                "enum": ["plates", "weight"],
                "type": "string"
