        {
          "name": "restaurantdoctor_break_even",
          "title": "Break-even calculator",
          "description": "Works out a restaurant's break-even sales from the owner's figures for one typical month, as the free break-even calculator on restaurantdoctorai.com does: the sales a month needs to pay every bill, also a week, a day open and guests a day; how far the month was above or short of it; what was left over after every bill; what a point of cost moves it by; with and without the owner's own pay; and if prices were 10% lower or higher (an illustration). Hourly pay can rise with sales or stay fixed, or both ways as a range. Takes the month's figures in any currency; a figure not sent is never counted as 0. Returns the result, the working and a link that opens the calculator with the figures in. The figures aren't stored; only an anonymous daily count of calculator runs is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "averageSpend": {
                "anyOf": [
                  {
                    "description": "Optional: average spend per guest, the POS average check or net sales ÷ guests. Turns sales into guests.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "closingStock": {
                "anyOf": [
                  {
                    "description": "Optional: stock at cost at the end of the month. Used only with openingStock.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "daysPerWeek": {
                "anyOf": [
                  {
                    "description": "Optional: days open a week, a whole number from 1 to 7. Turns the month into a day open (and guests a day, with averageSpend).",
                    "maximum": 7,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "fixedBills": {
                "anyOf": [
                  {
                    "description": "A month of the bills that stay the same: rent and utilities, salaries with their payroll taxes and benefits, insurance, software, marketing, loan and lease payments in full. No depreciation. Yearly bills ÷ 12. Not the owner's pay. Needed; if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "goal": {
                "anyOf": [
                  {
                    "description": "Optional: what the owner would like left over a month after every bill, before income tax. Adds the sales for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "hourly": {
                "anyOf": [
                  {
                    "description": "Whether hourly staff time goes up and down with sales: yes, shifts are added and cut as it gets busy or quiet; no, about the same team every shift (a bill that stays the same); unsure (the default): both ways, as a range.",
                    "enum": ["yes", "no", "unsure"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": "unsure"
              },
              "hourlyPay": {
                "anyOf": [
                  {
                    "description": "That month's hourly wages from payroll, plus the employer's payroll taxes and benefits; no tips. Paid every two weeks: one pay run × 26 ÷ 12. Needed (0 with no hourly staff); if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "openingStock": {
                "anyOf": [
                  {
                    "description": "Optional: stock at cost at the start of the month. Used only with closingStock: food and drink is then opening + purchases - closing. Skip both if stock stayed steady.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "otherVariable": {
                "anyOf": [
                  {
                    "description": "That month's other costs that rise with every sale: card fees, app commissions (app sales minus payouts, without tax and tips), packaging, percentage rent, royalties, ad fund fees; nothing in the food and drink invoices. Needed (0 if none); if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "ownerPay": {
                "anyOf": [
                  {
                    "description": "Optional: the owner's own pay a month, if not on payroll. Counted as a bill; break-even is also given without it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "purchases": {
                "anyOf": [
                  {
                    "description": "That month's food and drink supplier invoices, by delivery date. Needed; if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "sales": {
                "anyOf": [
                  {
                    "description": "Net sales for one typical month, in the owner's own currency: the POS sales summary, before tax and tips, app orders at menu price. Not a holiday rush: every figure is for that month. Needed, more than 0; if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "checks": {
                "description": "Figures that look like a slip.",
