        {
          "name": "restaurantdoctor_tip_out",
          "title": "Tip-out sheet",
          "description": "Works out how a restaurant shares tips, two ways, as the free tip-out sheet on restaurantdoctorai.com does. method percent: a server's tip-out to support roles, each a percentage of the server's net sales or tips, with the total tip-out, what the server keeps from their tips, and an error-level check when the tip-out is more than the tips. method pool: a tip pool shared by hours, with optional points for each role, rounded to the cent with the rounding remainder placed on the largest share. Takes the figures in any currency; a figure that isn't sent is never counted as 0. Returns the split, how it was worked out, the Department of Labor's published points on tips with their sources, and a link to the free tip-out sheet. It only works out a split from the numbers sent; it doesn't say whether a tip-out or a tip pool is allowed. The figures aren't stored; only an anonymous daily count of calculator runs is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "base": {
                "anyOf": [
                  {
                    "description": "With percent, needed: the server's net sales for the shift (before tax and tips), or their tips, as baseKind says. In the owner's own currency.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "baseKind": {
                "anyOf": [
                  {
                    "description": "With percent, needed: netSales or tips, what the roles' percentages are taken of.",
                    "enum": ["netSales", "tips"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "members": {
                "anyOf": [
                  {
                    "description": "With pool, needed: the people or roles sharing the pool.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "hours": {
                          "anyOf": [
                            {
                              "description": "Hours worked in the pool's period. Needed for each person.",
                              "maximum": 1000000000,
                              "minimum": 0,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "name": {
                          "anyOf": [
                            {
                              "description": "Optional: the person or role.",
                              "maxLength": 60,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "points": {
                          "anyOf": [
                            {
                              "description": "Optional: the role's weight, such as 1.5, to one decimal. Left out, 1.",
                              "exclusiveMinimum": 0,
                              "maximum": 1000000000,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        }
                      },
                      "type": "object"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "method": {
                "description": "percent: one server's tip-out to support roles, each a % of the base. pool: a tip pool shared by hours, with optional points.",
                "enum": ["percent", "pool"],
                "type": "string"
              },
              "pool": {
                "anyOf": [
                  {
                    "description": "With pool, needed: the tips in the pool for the period.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "roles": {
                "anyOf": [
                  {
                    "description": "With percent, needed: the support roles tipped out.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "name": {
                          "anyOf": [
                            {
                              "description": "Optional: the role, such as Bartender or Busser.",
                              "maxLength": 60,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "percent": {
                          "anyOf": [
                            {
                              "description": "The role's % of the base, 0 to 100. Needed for each role.",
                              "maximum": 100,
                              "minimum": 0,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        }
                      },
                      "type": "object"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "tips": {
                "anyOf": [
                  {
                    "description": "With percent: the server's tips for the shift, to work out what they keep. Not used when baseKind is tips.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["method"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "checks": {
                "description": "An error when the tip-out is more than the tips.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "level": {
                      "enum": ["error", "warning"],
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["level", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "freeCheck": {
                "type": "string"
              },
              "law": {
                "description": "The Department of Labor's published points on tips and its state minimum wage page, each with its source.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "source": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["source", "text", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "link": {
                "description": "The free tip-out sheet, to print or download.",
                "type": "string"
              },
              "method": {
                "enum": ["percent", "pool"],
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "percent": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "description": "With method percent.",
                    "properties": {
                      "base": {
                        "type": "number"
                      },
                      "baseKind": {
                        "enum": ["netSales", "tips"],
                        "type": "string"
                      },
                      "keeps": {
                        "anyOf": [
                          {
                            "description": "Tips minus total tip-out. Null without tips; below 0 when the tip-out is more than the tips.",
                            "type": "number"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "lines": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "amount": {
                              "description": "Base × percent, to the cent.",
                              "type": "number"
                            },
                            "name": {
                              "type": "string"
                            },
                            "percent": {
                              "type": "number"
                            }
                          },
                          "required": ["amount", "name", "percent"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "tips": {
                        "anyOf": [
                          {
                            "description": "Null: not sent.",
                            "type": "number"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "totalPercent": {
                        "type": "number"
                      },
                      "totalTipOut": {
                        "type": "number"
                      }
                    },
                    "required": ["base", "baseKind", "keeps", "lines", "tips", "totalPercent", "totalTipOut"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "pool": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "description": "With method pool.",
                    "properties": {
                      "pool": {
                        "type": "number"
                      },
                      "remainderCents": {
                        "anyOf": [
                          {
                            "description": "What rounding to the cent left (+) or took too much (-), placed on the largest share. Null: none.",
                            "type": "number"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "shares": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "amount": {
                              "description": "Pool × hours × points ÷ everyone's, to the cent.",
                              "type": "number"
                            },
                            "hours": {
                              "type": "number"
                            },
                            "name": {
                              "type": "string"
                            },
                            "perHour": {
                              "anyOf": [
                                {
                                  "description": "Null with 0 hours.",
                                  "type": "number"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "points": {
                              "description": "1 where none were sent.",
                              "type": "number"
                            },
                            "sharePct": {
                              "description": "Hours × points as a % of everyone's.",
                              "type": "number"
                            }
                          },
                          "required": ["amount", "hours", "name", "perHour", "points", "sharePct"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "totalHours": {
                        "type": "number"
                      }
                    },
                    "required": ["pool", "remainderCents", "shares", "totalHours"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "result": {
                "description": "The result in the sheet's words.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "workedOut": {
                "description": "How it was worked out.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "value"],
