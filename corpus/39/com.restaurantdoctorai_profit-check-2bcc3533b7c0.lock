        {
          "name": "restaurantdoctor_read_knowledge",
          "title": "Read a library entry",
          "description": "Reads one entry of RestaurantDoctorAI's library in full (a guide, a blog post, a playbook fix, the targets, a fact or a knowledge entry), by its id (such as 'guide:restaurant-prime-cost'), with its title, link and source. A long entry comes 8,000 characters at a time, with its total length: the next part starts at the nextOffset it returns. The query isn't stored; only an anonymous daily count of searches and reads is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "An entry id, as the library's search and list give it, e.g. 'guide:restaurant-prime-cost' or 'post:restaurant-break-even-point'.",
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Where to start, in characters (default 0, the start). A long entry comes 8,000 characters at a time: the next part starts at the nextOffset the previous read returned.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The entry's id, which reading the entry in full takes.",
                "type": "string"
              },
              "kind": {
                "enum": ["guide", "post", "play", "targets", "fact", "knowledge"],
                "type": "string"
              },
              "nextOffset": {
                "anyOf": [
                  {
                    "description": "Where the next part starts, in characters: the offset of the next read.",
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "note": {
                "type": "string"
              },
              "offset": {
                "description": "Where this part starts, in characters.",
                "type": "number"
              },
              "source": {
                "description": "Who says so, with the date it was checked or updated where there is one.",
                "type": "string"
              },
              "text": {
                "description": "The entry's text from offset, up to 8,000 characters.",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "totalLength": {
                "description": "The whole entry's length, in characters.",
                "type": "number"
              },
              "truncated": {
                "description": "More of the entry follows this part (nextOffset says where).",
                "type": "boolean"
              },
              "url": {
                "description": "Where a reader can check it: the page on restaurantdoctorai.com, or the fact's own source.",
                "type": "string"
              }
            },
            "required": ["id", "kind", "nextOffset", "note", "offset", "source", "text", "title", "totalLength", "truncated", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a library entry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49f0e97d9e3ec44c19713006b72f9146b4a3bf38e1a801e93295507f8a0d731a"
        },
        {
          "name": "restaurantdoctor_restaurant_budget",
          "title": "Restaurant budget calculator",
          "description": "Works out a restaurant's monthly budget from the owner's expected sales and type of restaurant, as the free restaurant budget calculator on restaurantdoctorai.com does: food and drink, labor, prime cost and rent with utilities as money ranges by RestaurantDoctorAI's targets for that type, other operating costs at the owner's share or a 20% working assumption, what's left after every bill, and break-even sales with labor counted both ways. Takes expected net sales and the type, plus optional rent, the owner's own pay and the other costs share, in any currency; a figure that isn't sent is never counted as 0. Returns the calculator's result, how it was worked out, and a link that opens the calculator with the same figures filled in. The figures aren't stored; only an anonymous daily count of calculator runs is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "format": {
                "description": "The type of restaurant, which sets RestaurantDoctorAI's targets the budget is split by: quick_service = Quick service (Counter or kiosk, fast turnover); fast_casual = Fast casual (Order at the counter, served at the table); full_service = Full service / casual dining (Servers, moderate check); fine_dining = Fine dining (Chef-driven, higher check); bar_lounge = Bar, taproom or lounge (Drinks are about half of sales or more); cafe = Café or coffee shop (Drinks lead, with pastries and light food).",
                "enum": ["quick_service", "fast_casual", "full_service", "fine_dining", "bar_lounge", "cafe"],
                "type": "string"
              },
              "otherPct": {
                "anyOf": [
                  {
                    "description": "Optional: other operating costs as a % of sales (card fees, packaging, cleaning, repairs, marketing, insurance, software, accounting, loan payments). Left out, 20% is used: a working assumption, not a target or a published figure.",
                    "maximum": 60,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "ownerPay": {
                "anyOf": [
                  {
                    "description": "Optional: the owner's own pay for a month, when it isn't on payroll. Comes off what's left, and counts as a bill that stays the same.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "rent": {
                "anyOf": [
                  {
                    "description": "Optional: the owner's own rent, property charges and utilities for a month, together, as the occupancy targets count them. Replaces the occupancy range.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "sales": {
                "anyOf": [
                  {
                    "description": "Expected net sales for one month, in the owner's own currency like every figure here: before tax and tips. Needed for a result, and more than 0; if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["format"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "breakEven": {
                "additionalProperties": false,
                "description": "With the budget at the top of the targets, rounded up to the unit.",
                "properties": {
                  "laborFixed": {
                    "anyOf": [
                      {
                        "description": "The same, with labor as a bill that stays the same.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "laborRises": {
                    "anyOf": [
                      {
                        "description": "Sales a month to break even with labor rising with sales.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "standing": {
                    "description": "The expected sales against it.",
                    "enum": ["above", "at", "short"],
                    "type": "string"
                  }
                },
                "required": ["laborFixed", "laborRises", "standing"],
                "type": "object"
              },
              "checks": {
                "description": "Figures that look like a slip.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "format": {
                "enum": ["quick_service", "fast_casual", "full_service", "fine_dining", "bar_lounge", "cafe"],
                "type": "string"
              },
              "freeCheck": {
                "type": "string"
              },
              "left": {
                "additionalProperties": false,
                "description": "Left over after every bill, before income tax, not profit; low is the budget at the top of the targets.",
                "properties": {
                  "high": {
                    "type": "number"
                  },
                  "highPct": {
                    "type": "number"
                  },
                  "low": {
                    "type": "number"
                  },
                  "lowPct": {
                    "type": "number"
                  }
                },
                "required": ["high", "highPct", "low", "lowPct"],
                "type": "object"
              },
              "lines": {
                "description": "A month, low to high, money to the unit. primeCost is food and drink plus labor, a subtotal.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "basis": {
                      "description": "target: RestaurantDoctorAI's targets; yours: the owner's figure; assumption: the working assumption.",
                      "enum": ["target", "yours", "assumption"],
                      "type": "string"
                    },
                    "high": {
                      "type": "number"
                    },
                    "highPct": {
                      "type": "number"
                    },
                    "key": {
                      "enum": ["foodAndDrink", "labor", "primeCost", "occupancy", "otherCosts", "ownerPay"],
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "low": {
                      "type": "number"
                    },
                    "lowPct": {
                      "type": "number"
                    }
                  },
                  "required": ["basis", "high", "highPct", "key", "label", "low", "lowPct"],
                  "type": "object"
                },
                "type": "array"
              },
              "link": {
                "description": "Opens the calculator with these figures.",
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "otherCostsAssumed": {
                "description": "True when the other operating costs share is the working assumption.",
                "type": "boolean"
              },
              "rent": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "description": "The owner's rent against the occupancy ceiling, the top of the range: within it or over it.",
                    "properties": {
                      "band": {
                        "enum": ["within", "over"],
                        "type": "string"
                      },
                      "pct": {
                        "type": "number"
                      }
                    },
                    "required": ["band", "pct"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "result": {
                "description": "The result in the page's words, in its order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sales": {
                "type": "number"
              },
              "workedOut": {
                "description": "How it was worked out.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "value"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["breakEven", "checks", "format", "freeCheck", "left", "lines", "link", "notes", "otherCostsAssumed", "rent", "result", "sales", "workedOut"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Restaurant budget calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f89c01eae3fd248234f524f97697b30063b364f6f7f942e559ef5fc15c83cc91"
        },
        {
          "name": "restaurantdoctor_run_free_check",
          "title": "Run the free profit check",
          "description": "Scores a restaurant's 12 answers against RestaurantDoctorAI's targets for its type of restaurant and returns the free result the website shows: an overall grade, grades by area, the estimated money lost to avoidable costs, all of them together, a month and a year, the costliest issue or biggest opportunity with its estimated money a month, what one point of prime cost is worth, and the first fix. Includes a link that opens the same result on restaurantdoctorai.com. Takes only the 12 answers and the country, each answer one of the values its question accepts. The answers aren't stored; only an anonymous daily count of checks is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "beverageMonitoring": {
                "description": "How do you control drink pours? no_alcohol = We don't serve alcohol; measured_pour_keg_audits = Measured pours, plus weekly pour-cost checks; occasional_spot_checks = Spot checks when bottles run out early; free_pour_no_audit = Free pours, no pour-cost checks.",
                "enum": ["no_alcohol", "measured_pour_keg_audits", "occasional_spot_checks", "free_pour_no_audit"],
                "type": "string"
              },
              "contactCapture": {
                "description": "How do you bring guests back? automated_pos_loyalty_50plus = Loyalty or email list with automatic campaigns (50+ new contacts a week); occasional_checkout_emails = We collect some emails but rarely use them; no_database_social_only = Social media and walk-ins only; paid_ads_no_list = Paid ads, but no guest list of our own.",
                "enum": ["automated_pos_loyalty_50plus", "occasional_checkout_emails", "no_database_social_only", "paid_ads_no_list"],
                "type": "string"
              },
              "country": {
                "default": "US",
                "description": "Where the restaurant is: a two-letter ISO 3166-1 code such as US, CA, AU or DE (GB for the United Kingdom). Sets the currency and local wording. Defaults to US.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "deliveryDependency": {
                "description": "How much of your sales come through DoorDash, Uber Eats or similar apps? zero_direct_only = None (Dine-in and our own ordering only); under_15_with_markup = Under 15% (With higher app prices to cover fees); 15_to_35_standard_cut = 15% – 35% (At regular menu prices); over_35_heavy_drag = More than 35%.",
                "enum": ["zero_direct_only", "under_15_with_markup", "15_to_35_standard_cut", "over_35_heavy_drag"],
                "type": "string"
              },
              "laborFlexing": {
                "description": "When a shift gets slow, what happens to staffing? realtime_cuts_splh = We cut staff based on sales per labor hour; fixed_shifts_regardless = Everyone works their scheduled shift anyway; overtime_above_8_percent = Overtime is common (More than 8% of hours); chronic_understaffing_owner_covers = We're short-staffed (The owner or GM works the line).",
                "enum": ["realtime_cuts_splh", "fixed_shifts_regardless", "overtime_above_8_percent", "chronic_understaffing_owner_covers"],
                "type": "string"
              },
              "monthlyRevenue": {
                "description": "About how much do you sell in a typical month? Amounts are in US dollars, or in the local currency where that's the euro, pound sterling, Swiss franc, or Canadian, Australian or New Zealand dollar. under_25k = Under $25,000 (Under $300K a year); 25k_60k = $25,000 – $60,000 ($300K – $720K a year); 60k_120k = $60,000 – $120,000 ($720K – $1.44M a year); 120k_200k = $120,000 – $200,000 ($1.44M – $2.4M a year); over_200k = Over $200,000 (Over $2.4M a year).",
                "enum": ["under_25k", "25k_60k", "60k_120k", "120k_200k", "over_200k"],
                "type": "string"
              },
              "occupancyCostRatio": {
                "description": "What share of sales goes to rent, property costs and utilities? under_8_percent = Under 8%; 8_to_12_percent = 8% – 12%; over_12_percent = More than 12%; unsure_ratio = I'm not sure.",
                "enum": ["under_8_percent", "8_to_12_percent", "over_12_percent", "unsure_ratio"],
                "type": "string"
              },
              "plateCostingFrequency": {
                "description": "How often do you update recipe costs with current supplier prices? live_monthly_software = Monthly or live, with software (Synced to supplier invoices); 6_to_12m_manual = Once or twice a year (In a spreadsheet); new_menu_only = Only when the menu changes; rarely_gut_feeling = Rarely (Prices are set by feel or by competitors).",
                "enum": ["live_monthly_software", "6_to_12m_manual", "new_menu_only", "rarely_gut_feeling"],
                "type": "string"
              },
              "primeCostAwareness": {
                "description": "What's your prime cost: food, drink and labor costs as a share of sales? under_58 = Under 58%; 58_to_64 = 58% – 64%; over_65 = 65% or more; not_tracked_weekly = I don't track it regularly.",
                "enum": ["under_58", "58_to_64", "over_65", "not_tracked_weekly"],
                "type": "string"
              },
              "reputationHealth": {
                "description": "What's your average rating on Google and Yelp? 4_5_to_5_0 = 4.5 – 5.0 stars; 4_0_to_4_4 = 4.0 – 4.4 stars; 3_5_to_3_9 = 3.5 – 3.9 stars; under_3_5 = Below 3.5 stars.",
                "enum": ["4_5_to_5_0", "4_0_to_4_4", "3_5_to_3_9", "under_3_5"],
                "type": "string"
              },
              "seatingDynamics": {
