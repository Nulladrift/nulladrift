        },
        {
          "name": "restaurantdoctor_cash_out",
          "title": "Nightly cash-out",
          "description": "Works out a restaurant's nightly cash close for one drawer and one day or shift, as the free cash-out sheet on restaurantdoctorai.com does: expected cash (starting bank + cash sales - cash tips paid out - paid outs), over or short against the cash counted, the deposit (counted minus the starting bank), the card difference (processor batch minus POS card sales) when both are sent, and comps, voids and discounts as a share of net sales. Takes the starting bank, cash sales and cash counted, plus optional paid outs, card figures and sales totals, in any currency; a figure that isn't sent is never counted as 0. It sets no normal for over or short. Returns the result, how it was worked out, and a link to the free cash-out sheet. The figures aren't stored; only an anonymous daily count of calculator runs is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cardBatch": {
                "anyOf": [
                  {
                    "description": "Optional: what the card processor settled for the same day. With cardSales.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "cardSales": {
                "anyOf": [
                  {
                    "description": "Optional: that day's card sales from the POS. With cardBatch, gives the card difference.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "cashCounted": {
                "anyOf": [
                  {
                    "description": "The cash counted at close, bank included. Needed; if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "cashSales": {
                "anyOf": [
                  {
                    "description": "That day's cash payments, from the POS end-of-day (Z) report. Needed; if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "cashTipsPaidOut": {
                "anyOf": [
                  {
                    "description": "Optional: card tips paid to staff in cash from this drawer. Taken off expected cash.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "comps": {
                "anyOf": [
                  {
                    "description": "Optional: the day's comps total from the POS. Needs netSales for its share.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "discounts": {
                "anyOf": [
                  {
                    "description": "Optional: the day's discounts total from the POS. Needs netSales for its share.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "netSales": {
                "anyOf": [
                  {
                    "description": "Optional: that day's net sales from the POS, before tax and tips. Turns comps, voids and discounts into shares.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "paidOuts": {
                "anyOf": [
                  {
                    "description": "Optional: cash taken out of the drawer for supplies and the like. Taken off expected cash.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "startingBank": {
                "anyOf": [
                  {
                    "description": "The cash in the drawer at open: one drawer, one day or shift, in the owner's own currency like every figure here. Needed; if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "voids": {
                "anyOf": [
                  {
                    "description": "Optional: the day's voids total from the POS. Needs netSales for its share.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "card": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "description": "Sent both card figures.",
                    "properties": {
                      "difference": {
                        "description": "Processor batch minus POS card sales.",
                        "type": "number"
                      },
                      "status": {
                        "enum": ["batch_higher", "batch_lower", "match"],
                        "type": "string"
                      }
                    },
                    "required": ["difference", "status"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "cashCounted": {
                "type": "number"
              },
              "checks": {
                "description": "Figures that look like a slip.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "deposit": {
                "description": "Cash counted minus the starting bank, which stays in the drawer. Below 0 when the drawer holds less than its bank.",
                "type": "number"
              },
              "expectedCash": {
                "description": "Starting bank + cash sales - cash tips paid out - paid outs.",
                "type": "number"
              },
              "freeCheck": {
                "type": "string"
              },
              "link": {
                "description": "The free cash-out sheet, to print or download.",
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "overShort": {
                "additionalProperties": false,
                "properties": {
                  "amount": {
                    "description": "Cash counted minus expected cash: above 0 is over, below 0 is short.",
                    "type": "number"
                  },
                  "status": {
                    "enum": ["over", "short", "even"],
                    "type": "string"
                  }
                },
                "required": ["amount", "status"],
                "type": "object"
              },
              "result": {
                "description": "The result in the sheet's words.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "shares": {
