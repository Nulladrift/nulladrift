                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "taxRate": {
                "anyOf": [
                  {
                    "description": "With taxIncluded, needed: the tax rate in this dish's price, %. Food and drinks can have different rates.",
                    "maximum": 50,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["format", "mode"],
            "type": "object"
          },
