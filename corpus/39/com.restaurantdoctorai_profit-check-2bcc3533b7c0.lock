        {
          "name": "restaurantdoctor_search_knowledge",
          "title": "Search RestaurantDoctorAI's library",
          "description": "Searches RestaurantDoctorAI's sourced library: the website's guides and blog posts, RestaurantDoctorAI's step-by-step fixes, RestaurantDoctorAI's targets by type of restaurant, sourced industry facts, and an expert knowledge base of sourced how-tos, rules and checklists (costs, labor, money, growth, compliance, operations). Keyword search: \"break-even\", \"breakeven\" and \"break even\" are one term, and plurals match. Returns the best passages, each with its id, kind, title, link and source; kind narrows the search to one kind of entry. RestaurantDoctorAI's targets are its own, not industry benchmarks. The query isn't stored; only an anonymous daily count of searches and reads is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Only this kind of entry: guide (the website's guides), post (blog posts), play (RestaurantDoctorAI's step-by-step fixes), targets (RestaurantDoctorAI's targets by type of restaurant), fact (sourced industry facts) or knowledge (sourced how-tos, rules and checklists). Left out, every kind.",
                "enum": ["guide", "post", "play", "targets", "fact", "knowledge"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "The most passages to return, 1 to 8 (default 5). Up to 5, a passage far weaker than the best match is left out.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look up, in plain words, e.g. 'how to lower food cost', 'tip pool rules' or 'delivery app commission'.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "hits": {
                "description": "Best match first. Empty when nothing matches.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "The entry's id, which reading the entry in full takes.",
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["guide", "post", "play", "targets", "fact", "knowledge"],
                      "type": "string"
                    },
                    "passage": {
                      "description": "The part of the entry that matched best.",
                      "type": "string"
                    },
                    "source": {
                      "description": "Who says so, with the date it was checked or updated where there is one.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Where a reader can check it: the page on restaurantdoctorai.com, or the fact's own source.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "kind", "passage", "source", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              }
            },
            "required": ["hits", "note"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search RestaurantDoctorAI's library"
