        {
          "name": "restaurantdoctor_plate_cost",
          "title": "Plate cost and menu price calculator",
          "description": "Works out what one plate of a dish costs and what to charge for it, as the free plate cost calculator on restaurantdoctorai.com does: from each ingredient's pack price and the amount used (with a usable % for trim), or from a plate cost the owner already knows; then the food cost at the menu price, what's left per plate, the price for their target food cost and the prices inside the range for their type of restaurant, with the tax taken out of a tax-inclusive menu. It works from the owner's own prices and amounts, in any currency; a figure that isn't sent is never counted as 0. Returns the calculator's result, how it was worked out, and a link that opens the calculator with the same figures filled in. The figures aren't stored; only an anonymous daily count of calculator runs is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "extras": {
                "anyOf": [
                  {
                    "description": "Optional, mode ingredients: small extras without a line of their own (salt, oil, garnish), % of the ingredients; often 5 to 10.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "format": {
                "description": "The type of restaurant, which sets the food cost range and the starting target: quick_service = Quick service (Counter or kiosk, fast turnover); fast_casual = Fast casual (Order at the counter, served at the table); full_service = Full service / casual dining (Servers, moderate check); fine_dining = Fine dining (Chef-driven, higher check); bar_lounge = Bar, taproom or lounge (Drinks are about half of sales or more); cafe = Café or coffee shop (Drinks lead, with pastries and light food).",
                "enum": ["quick_service", "fast_casual", "full_service", "fine_dining", "bar_lounge", "cafe"],
                "type": "string"
              },
              "ingredients": {
                "anyOf": [
                  {
                    "description": "With mode ingredients: each ingredient. A sauce or side already costed is one: its cost for a pack of 1 each, 1 each used.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "name": {
                          "anyOf": [
                            {
                              "description": "Optional: what it is, as the owner calls it.",
                              "maxLength": 100,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "packSize": {
                          "anyOf": [
                            {
                              "description": "How much one pack holds, in packUnit: 5 for a 5 lb bag. A case of 6 cans is 6 each; a 4 × 5 lb case is 20 lb.",
                              "exclusiveMinimum": 0,
                              "maximum": 1000000000,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "packUnit": {
                          "description": "The pack's unit: floz and gal are US fluid ounces and gallons.",
                          "enum": ["g", "kg", "oz", "lb", "ml", "l", "floz", "gal", "each"],
                          "type": "string"
                        },
                        "paid": {
                          "anyOf": [
                            {
                              "description": "What the owner paid for one pack, from their latest invoice, before any VAT or GST they claim back.",
                              "maximum": 1000000000,
                              "minimum": 0,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "usable": {
                          "anyOf": [
                            {
                              "description": "Optional: of what's bought, the % left after trimming or cooking: 85 for 1 kg that trims to 850 g. Left out, 100.",
                              "maximum": 100,
                              "minimum": 1,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "used": {
                          "anyOf": [
                            {
                              "description": "The amount that goes in the pot or on the plate, after trimming, for the plates in portions. Spoons or cups: weighed once.",
                              "maximum": 1000000000,
                              "minimum": 0,
                              "type": "number"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "usedUnit": {
                          "description": "The amount's unit, of the pack's kind: weight, volume and count don't convert into each other.",
                          "enum": ["g", "kg", "oz", "lb", "ml", "l", "floz", "gal", "each"],
                          "type": "string"
                        }
                      },
                      "required": ["packUnit", "usedUnit"],
                      "type": "object"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "menuPrice": {
                "anyOf": [
                  {
                    "description": "Optional: the dish's price on the menu. Left out, the result gives the prices to charge, as for a new dish.",
                    "exclusiveMinimum": 0,
                    "maximum": 1000000000,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "mode": {
                "description": "ingredients: from each ingredient's pack price and the amount used. known: from a plate cost the owner already has.",
                "enum": ["ingredients", "known"],
                "type": "string"
              },
              "plateCost": {
                "anyOf": [
                  {
                    "description": "With mode known, needed: what the ingredients on one plate cost, from a recipe card or costing sheet, in the owner's own currency like every money figure here.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "portions": {
                "anyOf": [
                  {
                    "description": "With mode ingredients, needed: how many plates the amounts make, 1 for a single plate.",
                    "exclusiveMinimum": 0,
                    "maximum": 1000000000,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "sold": {
                "anyOf": [
                  {
                    "description": "Optional: how many of this dish sold last month (POS item sales), for the figures a month.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "target": {
                "anyOf": [
                  {
                    "description": "Optional: the owner's target food cost, %. Left out, the middle of the format's range (32 for full service); none for a bar.",
