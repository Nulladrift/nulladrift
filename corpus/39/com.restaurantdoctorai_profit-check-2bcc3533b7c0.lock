        {
          "name": "restaurantdoctor_card_fees",
          "title": "Card fees check",
          "description": "Checks a US restaurant's card processing fees for one month, as the free card fees check on restaurantdoctorai.com does: the cost per 100 dollars of card sales (the effective rate), against a dated fair range for that type of restaurant (an estimate of a competitive interchange-plus account from Visa's published restaurant interchange, network fees and a fair markup); how far above it the fees are, a month and a year; how they compare with Square's, Toast's, Clover's or Stripe's published rate; what's realistic for that processor, words to read out to it, the fees to question on the statement by name, and the caveats. It answers whether card fees are too high, what the effective rate is, and what to ask the processor. It needs the month's total card sales and total card fees from the processor's statement (every fee, monthly and annual ones included), who processes the cards and what kind of restaurant it is; the number of card sales or the average sale narrows it. A figure that isn't sent is never counted as 0. It doesn't read statements, contact a processor or take payment. Returns the result, how it was worked out, and a link that opens the same check with the figures filled in. The figures aren't stored; only an anonymous daily count of calculator runs is kept.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "averageTicket": {
                "anyOf": [
                  {
                    "description": "Optional: the average card sale in US dollars, when cardCount isn't known. It narrows the fair range too.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "cardCount": {
                "anyOf": [
                  {
                    "description": "Optional: the month's number of card sales (transactions), from the same statement. It narrows the fair range to the owner's own sale size.",
                    "maximum": 1000000000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "cardSales": {
                "anyOf": [
                  {
                    "description": "A month's card sales in US dollars, from the processor's statement or the POS card report: everything charged to cards, tips included, before fees, without delivery app orders. Needed for a result; if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "format": {
                "description": "The type of restaurant, which sets the likely mix of debit and credit cards: quick_service = Quick service (Counter or kiosk, fast turnover); fast_casual = Fast casual (Order at the counter, served at the table); full_service = Full service / casual dining (Servers, moderate check); fine_dining = Fine dining (Chef-driven, higher check); bar_lounge = Bar, taproom or lounge (Drinks are about half of sales or more); cafe = Café or coffee shop (Drinks lead, with pastries and light food).",
                "enum": ["quick_service", "fast_casual", "full_service", "fine_dining", "bar_lounge", "cafe"],
                "type": "string"
              },
              "pricingModel": {
                "anyOf": [
                  {
                    "description": "Optional, if the owner knows it: flat = Flat rate: one rate for every card; interchange_plus = Interchange-plus: interchange at cost plus a stated markup; tiered = Tiered: qualified, mid-qualified and non-qualified rates; not_sure = Not sure. It changes the advice, not the fair range.",
                    "enum": ["flat", "interchange_plus", "tiered", "not_sure"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "processor": {
                "description": "Who processes the cards (the name at the top of the statement): bank = a bank or independent processor; other = another processor, or not sure.",
                "enum": ["square", "toast", "clover", "stripe", "bank", "other"],
                "type": "string"
              },
              "totalFees": {
                "anyOf": [
                  {
                    "description": "The same month's total card fees in US dollars, from the same statement: every fee the processor took (percentage, per-sale, monthly, annual, PCI and statement fees), not one line. Needed for a result; if missing, the reply asks for it.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["format", "processor"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "aboveMiddle": {
                "additionalProperties": false,
                "description": "The same above its middle.",
                "properties": {
                  "perMonth": {
                    "type": "number"
                  },
                  "perYear": {
                    "type": "number"
                  }
                },
                "required": ["perMonth", "perYear"],
                "type": "object"
              },
              "aboveTop": {
                "additionalProperties": false,
                "description": "Fees above the range's top, whole dollars; 0 unless above it.",
                "properties": {
                  "perMonth": {
                    "type": "number"
                  },
                  "perYear": {
                    "type": "number"
                  }
                },
                "required": ["perMonth", "perYear"],
                "type": "object"
              },
              "ask": {
                "description": "Words the owner can read out to the processor.",
                "type": "string"
              },
              "averageSale": {
                "anyOf": [
                  {
                    "description": "Card sales ÷ card count, or as sent.",
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "cardCount": {
                "anyOf": [
                  {
                    "description": "As sent, or from the average sale.",
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "cardSales": {
                "description": "US dollars, like every amount here.",
                "type": "number"
              },
              "caveats": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "checks": {
                "description": "Figures that look like a slip. They don't block the result.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "costPer100": {
                "description": "Total fees ÷ card sales × 100: the cost per $100 of card sales, also the effective rate in %.",
                "type": "number"
              },
              "fair": {
                "additionalProperties": false,
                "description": "What a competitive interchange-plus account would cost, per $100: an estimate, not a published price.",
                "properties": {
                  "asOf": {
                    "description": "The date of Visa's interchange table.",
                    "type": "string"
                  },
                  "high": {
                    "type": "number"
                  },
                  "low": {
                    "type": "number"
                  },
                  "middle": {
                    "type": "number"
                  },
                  "sale": {
                    "additionalProperties": false,
                    "description": "The average card sale it's for.",
                    "properties": {
                      "assumed": {
                        "type": "boolean"
                      },
                      "high": {
                        "type": "number"
                      },
                      "low": {
                        "type": "number"
                      }
                    },
                    "required": ["assumed", "high", "low"],
                    "type": "object"
                  }
                },
                "required": ["asOf", "high", "low", "middle", "sale"],
                "type": "object"
              },
              "feesToQuestion": {
                "description": "By the names statements print.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "what": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "what"],
                  "type": "object"
                },
                "type": "array"
              },
              "format": {
                "enum": ["quick_service", "fast_casual", "full_service", "fine_dining", "bar_lounge", "cafe"],
                "type": "string"
              },
              "freeCheck": {
                "type": "string"
              },
              "link": {
                "description": "Opens the check on the website with these figures filled in.",
                "type": "string"
              },
              "overTopPer100": {
                "description": "Dollars per $100 above the range's top; 0 unless above it.",
                "type": "number"
              },
              "plan": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "description": "The published in-person rate at this sale size, per $100; Toast's come from reviews, not confirmed.",
                    "properties": {
                      "confirmed": {
                        "type": "boolean"
                      },
                      "high": {
                        "type": "number"
                      },
                      "low": {
                        "type": "number"
                      },
                      "processor": {
                        "enum": ["square", "toast", "clover", "stripe"],
                        "type": "string"
                      },
                      "standing": {
                        "enum": ["below", "at", "above"],
                        "type": "string"
                      }
                    },
                    "required": ["confirmed", "high", "low", "processor", "standing"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "pricingModel": {
                "anyOf": [
                  {
                    "description": "As sent.",
                    "enum": ["flat", "interchange_plus", "tiered", "not_sure"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "processor": {
                "enum": ["square", "toast", "clover", "stripe", "bank", "other"],
                "type": "string"
              },
              "realistic": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "result": {
                "description": "The page's words, in its order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "saleFrom": {
                "anyOf": [
                  {
                    "description": "Where the sale size came from.",
                    "enum": ["cardCount", "averageTicket"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "totalFees": {
                "type": "number"
              },
              "verdict": {
                "enum": ["low", "fair", "a_little_high", "high", "very_high"],
                "type": "string"
              },
              "workedOut": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "yearlyCardSales": {
                "type": "number"
              }
            },
            "required": ["aboveMiddle", "aboveTop", "ask", "averageSale", "cardCount", "cardSales", "caveats", "checks", "costPer100", "fair", "feesToQuestion", "format", "freeCheck", "link", "overTopPer100", "plan", "pricingModel", "processor", "realistic", "result", "saleFrom", "sources", "totalFees", "verdict", "workedOut", "yearlyCardSales"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Card fees check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
