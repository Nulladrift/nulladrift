  "subjects": {
    "com.brokerchooser/broker-safety": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.brokerchooser.com/servers/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "BrokerChooser.com MCP Server",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BrokerChooser is an independent broker comparison service. Its analysts have tested online brokers since 2016\nby opening real accounts and trading with their own money, and only brokers regulated by a top-tier financial\nauthority are reviewed.",
      "tools": [
        {
          "name": "is-broker-available-in-country-tool",
          "title": "Is Broker Available In Country Tool",
          "description": "Tells whether a broker accepts clients from a given country, for brokers reviewed by BrokerChooser. Brokers\nare licensed per jurisdiction, so a broker that is safe and well regulated can still be unusable to someone\nwho cannot open an account with it. The country is a required input; this tool has no way of detecting where\nthe user is located.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "The country the user lives in, as its ISO 3166-1 alpha-2 code (e.g., 'de' for Germany, 'gb' for the United Kingdom). The English country name ('Germany') is also accepted. Regions such as 'Europe' are not accepted, only countries.",
                "type": "string"
              },
              "query": {
                "description": "A string containing either the broker's company name OR the broker's website domain as provided by the user. If providing a website, use only the domain name with TLD (e.g., 'example.com' not 'https://www.example.com' or 'https://example.com/page'). For company names, provide the full or commonly known name of the broker (e.g., 'XYZ Trading' or 'ABC Brokers').",
                "type": "string"
              }
            },
            "required": ["country", "query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ab4fd86b31a54af3fbfebbfd4274e28ace5e7b6370313ae81537b0c1019989f7"
        },
        {
          "name": "is-broker-scam-tool",
          "title": "Is Broker Scam Tool",
          "description": "Retrieves information to determine whether a broker is legitimate or a scam. This tool can look up brokers\nusing either their company name or website URL. It returns verification data, scam reports, regulatory status,\nand trustworthiness indicators to help assess the broker's credibility. Use this tool when users ask about\nbroker reliability, safety, legitimacy, or want to verify if a specific broker is trustworthy before investing\nor trading.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "A string containing either the broker's company name OR the broker's website domain as provided by the user. If providing a website, use only the domain name with TLD (e.g., 'example.com' not 'https://www.example.com' or 'https://example.com/page'). For company names, provide the full or commonly known name of the broker (e.g., 'XYZ Trading' or 'ABC Brokers').",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1cb14e7e5c2380e3417aa08d29ef5aa2bdeedf69948f5f20b17cb493a78c2a1d"
        }
      ],
      "digest": "sha256:c8be046709373d5714873ca8886c258c9dc152d614a59b5c1c21c4d9e9b98530"
    }
  }
