      "instructions": "Use this server when users ask about broker legitimacy, safety, or scam reports. The server has one tool that\naccepts a single query parameter.\n\nWhen calling the tool:\n- If the user mentions a broker's website, extract ONLY the domain name with TLD (e.g., \"broker.com\" not\n\"https://www.broker.com\" or \"www.broker.com/about\")\n- If the user mentions a broker's name, pass the company name as provided\n- Strip any URL protocols (http://, https://), subdomains (www), or path segments before sending website queries\n- Use the tool proactively when users express concerns about broker trustworthiness or ask \"is [broker] a scam?\"\n\nThe tool returns verification data including scam reports, regulatory information, and credibility indicators.\nPresent this information clearly to help users make informed decisions about broker safety.",
      "tools": [
        {
          "name": "is-broker-scam-tool",
          "title": "Is Broker Scam Tool",
          "description": "Retrieves information to determine whether a broker is legitimate or a scam. This tool can look up brokers\nusing either their company name or website URL. It returns verification data, scam reports, regulatory status,\nand trustworthiness indicators to help assess the broker's credibility. Use this tool when users ask about\nbroker reliability, safety, legitimacy, or want to verify if a specific broker is trustworthy before investing\nor trading.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "A string containing either the broker's company name OR the broker's website domain as provided by the user. If providing a website, use only the domain name with TLD (e.g., 'example.com' not 'https://www.example.com' or 'https://example.com/page'). For company names, provide the full or commonly known name of the broker (e.g., 'XYZ Trading' or 'ABC Brokers').",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
