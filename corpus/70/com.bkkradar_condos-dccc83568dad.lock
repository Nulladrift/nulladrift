        {
          "name": "nearby_condos",
          "title": "Condos near a place",
          "description": "Condos around a point in Bangkok, such as an office, a school, a residence or a station, given as lat/lng or as a place name or address. Same filters as search_condos plus radius_km, sorted by distance or by walk to a station. Returns bkkradar.com links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bedrooms": {
                "description": "Exact number of bedrooms; 0 = studio.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "furnished": {
                "description": "full, partial or none: as the post says it. Posts that do not say are left out.",
                "enum": ["full", "partial", "none"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the titles and links: en, fr, th, ja (Japanese), zh (simplified Chinese) or ru (Russian). Use the user's language.",
                "enum": ["en", "fr", "th", "ja", "zh", "ru"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude of the point (Bangkok area).",
                "maximum": 14.2,
                "minimum": 13.4,
                "type": "number"
              },
              "limit": {
                "default": 20,
                "description": "Listings to return, 20 by default, 50 at most.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude of the point (Bangkok area).",
                "maximum": 101,
                "minimum": 100.2,
                "type": "number"
              },
              "max_lease_months": {
                "description": "Rentals that accept a lease this short, at most, in months (1 to 6): 6 for a DTV stay of 180 days. Prices are then that lease's monthly rent when the post gives it, often higher.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in THB (per month for rent).",
                "maximum": 2000000000,
                "minimum": 0,
                "type": "integer"
              },
              "max_walk_minutes": {
                "description": "Walk to the listing's nearest BTS/MRT station, at most, in minutes (straight line at 80 m a minute). With a station or line and no value: 12 (1 km).",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "min_bedrooms": {
                "description": "At least this many bedrooms.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "min_price": {
                "description": "Minimum price in THB.",
                "maximum": 2000000000,
                "minimum": 0,
                "type": "integer"
              },
              "min_size_sqm": {
                "description": "Living area, at least, in m².",
                "maximum": 10000,
                "minimum": 1,
                "type": "number"
              },
              "owner_only": {
                "description": "true: only the listings posted by their owner, not by an agent.",
                "type": "boolean"
              },
              "pets_allowed": {
                "description": "true: only the listings whose post says pets are allowed. Most posts do not say, and those are left out.",
                "type": "boolean"
              },
              "place": {
                "description": "Address or place in Bangkok instead of lat/lng: an office, a school, a station, a residence.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "property_kind": {
                "default": "condo",
                "description": "Kind of property; any for all.",
                "enum": ["condo", "apartment", "house", "townhouse", "room", "any"],
                "type": "string"
              },
              "radius_km": {
                "default": 2,
                "description": "Distance from the point, at most, in km (straight line).",
                "maximum": 10,
                "minimum": 0.2,
                "type": "number"
              },
              "sort": {
                "default": "distance",
                "description": "distance (closest to the point first) or station_walk (closest to a station first).",
                "enum": ["distance", "station_walk"],
                "type": "string"
              },
              "type": {
                "default": "rent",
                "description": "rent (monthly price) or sale (total price).",
                "enum": ["rent", "sale"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Condos near a place"
