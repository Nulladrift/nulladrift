        {
          "name": "rent_trend",
          "title": "Rent trend by month",
          "description": "BKK Radar's monthly rent index for condos: median rent, rent per m², listings and change on the month before, for Bangkok, one district or one line. Started in October 2026; the current month is provisional. Returns the index page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "district": {
                "description": "District (khet) of Bangkok, e.g. \"Watthana\", \"Khlong Toei\", \"Sathon\". Without district or line: the whole city.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "lang": {
