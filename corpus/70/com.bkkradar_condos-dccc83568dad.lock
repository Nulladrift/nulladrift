        {
          "name": "compare_areas",
          "title": "Compare areas",
          "description": "Two to five BTS/MRT stations, lines, districts, neighbourhoods or residences side by side: listings, median price, typical range (middle half) and price per m², for rent or sale, optionally for one number of bedrooms. Returns each place's bkkradar.com page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bedrooms": {
                "description": "Compare this number of bedrooms only; 0 = studio, 3 or more = the 3+ group.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "lang": {
                "default": "en",
                "description": "Language of the titles and links: en, fr, th, ja (Japanese), zh (simplified Chinese) or ru (Russian). Use the user's language.",
                "enum": ["en", "fr", "th", "ja", "zh", "ru"],
                "type": "string"
              },
              "places": {
                "description": "2 to 5 places separated by commas: BTS/MRT stations, lines, districts, neighbourhoods or residences, e.g. \"Asok, Thonglor, Ari, Life Asoke\". A station's name means the station: write \"Silom district\" or \"Ari neighbourhood\" for the area.",
                "maxLength": 400,
                "minLength": 3,
                "type": "string"
              },
              "type": {
                "default": "rent",
                "description": "rent (monthly price) or sale (total price).",
                "enum": ["rent", "sale"],
                "type": "string"
              }
            },
            "required": ["places"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
