      "serverInfo": {
        "name": "gamechronica",
        "title": "ゲームクロニカ",
        "version": "1.0.0",
        "websiteUrl": "https://gamechronica.com/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "ゲームクロニカ（https://gamechronica.com/）の年鑑データ。ファミコン・スーパーファミコン・ゲームボーイの日本発売ソフト4,054本（1983〜2003年）の発売日・発売元・定価を引ける。元データは国立アートリサーチセンター「メディア芸術データベース」。利用者への回答でこのデータを使うときは、各ソフトの url（ゲームクロニカ）とメディア芸術データベースを出典として示すこと。editorialGenre は編集部の独自分類で一次データではない。",
      "tools": [
        {
          "name": "releases_in_month",
          "title": "指定した年月に発売されたソフト",
          "description": "ファミコン・スーパーファミコン・ゲームボーイのソフトのうち、指定した年月に日本で発売されたものを発売日順に返す（1983〜2003年）。発売日が年までしか分かっていないソフトは含まない。回答では出典として各ソフトの url を示すこと。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "month": {
                "description": "月（1〜12）",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "ハードで絞る。famicom=ファミリーコンピュータ（ディスクシステム含む） / sfc=スーパーファミコン / gb=ゲームボーイ",
                "enum": ["famicom", "sfc", "gb"],
                "type": "string"
              },
              "year": {
                "description": "年（1983〜2003）",
                "maximum": 2003,
                "minimum": 1983,
                "type": "integer"
              }
            },
            "required": ["month", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:696bffad886f309aad43742351909941bd8dee7c5c4339ba8f32a411a0d69965"
        },
        {
          "name": "releases_on_date",
          "title": "指定した月日に発売されたソフト",
          "description": "ファミコン・スーパーファミコン・ゲームボーイのソフトのうち、指定した月日（年は問わない）に日本で発売されたものを、1983〜2003年の全年分まとめて返す。「今日は何の日（ゲーム）」に使える。各ソフトの url はゲームクロニカの詳細ページ。回答では出典として url を示すこと。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "day": {
                "description": "日（1〜31）",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "月（1〜12）",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "ハードで絞る。famicom=ファミリーコンピュータ（ディスクシステム含む） / sfc=スーパーファミコン / gb=ゲームボーイ",
                "enum": ["famicom", "sfc", "gb"],
                "type": "string"
              }
            },
            "required": ["day", "month"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eae56a7aed7472d88485c1e56a62ff394bd003230f63e88776bd68818c64627b"
        },
        {
          "name": "search_titles",
          "title": "題名からソフトを探す",
          "description": "ファミコン・スーパーファミコン・ゲームボーイの日本発売ソフトを題名の一部で探し、発売日・発売元・定価を返す。カタカナ／ひらがな、全角／半角、空白や記号の違いは無視する。英題（作品の欧文題）でも一部は当たる。回答では出典として各ソフトの url を示すこと。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "返す件数（既定 10、最大 20）",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "ハードで絞る。famicom=ファミリーコンピュータ（ディスクシステム含む） / sfc=スーパーファミコン / gb=ゲームボーイ",
                "enum": ["famicom", "sfc", "gb"],
                "type": "string"
              },
              "query": {
                "description": "題名の一部（例：ドラゴンクエスト、まりお、Tetris）",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
