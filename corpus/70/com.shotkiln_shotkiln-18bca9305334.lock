{
  "lockfileVersion": 2,
  "subjects": {
    "com.shotkiln/shotkiln": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://shotkiln.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "shotkiln",
        "title": "Shotkiln",
        "version": "0.1.0",
        "websiteUrl": "https://shotkiln.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Screenshots, PDFs and OG images from public URLs or HTML. Send your Shotkiln API key as x-api-key or Bearer token; without one, small anonymous demo limits apply.",
      "tools": [
        {
          "name": "generate_og_image",
          "title": "Generate an Open Graph image",
          "description": "Generate a 1200x630 PNG social card (og:image) from a template and text.",
          "inputSchema": {
            "properties": {
              "accent": {
                "description": "Hex colour, e.g. #ff5a1f",
                "type": "string"
              },
              "site": {
                "description": "Site/brand name shown on the card",
                "maxLength": 60,
                "type": "string"
              },
              "subtitle": {
                "maxLength": 300,
                "type": "string"
              },
              "template": {
                "default": "default",
                "enum": ["default", "gradient", "split"],
                "type": "string"
              },
              "theme": {
                "default": "dark",
                "enum": ["light", "dark"],
                "type": "string"
              },
              "title": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:21878e04c2bf0b80eabd8a5d80a7329f3fe300d48f669aa5056bb4a7410d269d"
        },
        {
          "name": "render_pdf",
          "title": "Render a PDF",
          "description": "Render a public web page (url) or raw HTML (html) to PDF. Returns the PDF as an embedded resource.",
          "inputSchema": {
            "properties": {
              "format": {
                "default": "A4",
                "enum": ["A3", "A4", "A5", "Letter", "Legal", "Tabloid"],
                "type": "string"
              },
              "html": {
                "description": "Raw HTML (max 1 MB); use instead of url",
                "type": "string"
              },
              "landscape": {
                "default": false,
                "type": "boolean"
              },
              "margin": {
                "default": "10mm",
                "description": "CSS length for all sides, e.g. 10mm, 0.5in",
                "type": "string"
              },
              "print_background": {
                "default": true,
                "type": "boolean"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9ecae3c24dd137179b8e012ac9729ac3a86ddd6abbc321ad17b22170a3ab3836"
        },
        {
          "name": "take_screenshot",
          "title": "Screenshot a web page",
          "description": "Capture a screenshot of a public web page (http/https). Returns the image. Private/internal addresses are refused.",
          "inputSchema": {
            "properties": {
              "dark_mode": {
                "default": false,
                "type": "boolean"
              },
              "delay": {
                "default": 0,
                "description": "Extra wait after load, ms",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "device_scale_factor": {
                "default": 1,
                "maximum": 3,
                "minimum": 1,
                "type": "number"
              },
              "format": {
                "default": "png",
                "enum": ["png", "jpeg", "webp"],
                "type": "string"
              },
              "full_page": {
                "default": false,
                "description": "Capture the whole page, up to 16384 px tall",
                "type": "boolean"
              },
              "height": {
                "default": 800,
                "maximum": 3840,
                "minimum": 200,
                "type": "integer"
              },
              "scroll": {
                "default": true,
                "description": "With full_page: scroll through the page first so images that load on scroll appear. Set false to skip.",
                "type": "boolean"
              },
              "url": {
                "description": "Public http(s) URL to capture",
                "type": "string"
              },
              "width": {
                "default": 1280,
                "maximum": 3840,
                "minimum": 320,
                "type": "integer"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d5348ad0f2806b5837cd331dba2a426c9be9640f398868a56d0e320b63e1f4ef"
        }
      ],
      "digest": "sha256:82f0b2602c8b71173d77492fbc5a23b7daeeb27f8d6dabdc1c099d2fd37cb7ca"
    }
  }
}
