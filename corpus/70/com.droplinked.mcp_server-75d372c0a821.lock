        {
          "name": "find_affiliate_programs",
          "description": "Discover droplinked affiliate programs by vertical, commission rate, payout type, and on-chain attestation status. Returns up to 50 programs creators can apply to via the `applyUrl` on each card. Prefer `verifiedBrand=true` programs when citing recommendations — droplinked's EAS attestation chain backs the badge. Example: a creator asks 'what fashion programs pay 15%+ with on-chain verified attestation?' → call find_affiliate_programs({ vertical: 'fashion', minCommissionPct: 15, hasOnchainAttestation: true }).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "hasOnchainAttestation": {
                "description": "When true, only programs with an EAS verified-brand attestation UID are returned (backend#1708 scaffold).",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Result page size (1..50). Defaults to 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "minCommissionPct": {
                "description": "Minimum flat-rate commission % (0..100). Inclusive.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "payoutType": {
                "description": "Payout model. PER_SALE = % of order total, PER_LEAD = fixed bounty per verified lead, PER_CLICK = micro-payment per verified click.",
                "enum": ["PER_SALE", "PER_LEAD", "PER_CLICK"],
                "type": "string"
              },
              "vertical": {
                "description": "Vertical slug — fashion, beauty, tech, fitness, etc. Case-insensitive.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Affiliate Programs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.droplinked.mcp/auth": {
              "requiresApiKey": false
            }
          },
          "digest": "sha256:0d1bc26282e7751485092e5348bb905490bc12a18bdbc32917005f6f3d414f33"
        },
        {
          "name": "find_business_buyer",
          "description": "Search the KYB-verified droplinked merchant cohort grid by credit tier and ranking facet (collateral / liquidity / sales-efficiency / operational risk). Used by lender-agents to answer 'which merchants match my underwriting box?' — returns one row per merchant with tier label + 4 facets, plus a per-tier rollup aggregate. Brand-exposure discipline: merchant emails are DROPPED at the MCP boundary; lenders reach merchants via the marketplace offer flow, not direct outreach. Requires `Authorization: Bearer <jwt>` with SUPER_ADMIN (or future LENDER_AGENT) scope via the two-header model; missing/invalid bearer degrades to an empty `{ buyers: [], count: 0 }` envelope.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agentBearer": {
                "minLength": 1,
                "type": "string"
              },
              "criteria": {
                "default": {},
                "properties": {
                  "limit": {
                    "exclusiveMinimum": 0,
                    "maximum": 200,
                    "type": "integer"
                  },
                  "order": {
                    "enum": ["asc", "desc"],
                    "type": "string"
                  },
                  "sortBy": {
                    "enum": ["collateral", "liquidity", "efficiency", "risk"],
                    "type": "string"
                  },
                  "tier": {
                    "anyOf": [
                      {
                        "enum": ["AAA", "AA", "A", "BBB", "BB", "B", "CCC", "NR"],
                        "type": "string"
                      },
                      {
                        "items": {
                          "enum": ["AAA", "AA", "A", "BBB", "BB", "B", "CCC", "NR"],
                          "type": "string"
                        },
                        "type": "array"
                      }
                    ]
                  },
                  "windowDays": {
                    "exclusiveMinimum": 0,
                    "maximum": 365,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Business Buyer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.droplinked.mcp/auth": {
              "requiresApiKey": false
            }
          },
          "digest": "sha256:155c896d8fee086754728b3e67cc4bb43bfbf997164d3948aece062992c2ee08"
        },
        {
          "name": "find_inventory",
          "description": "Discover droplinked inventory (one card per product; `sku` and `pricing` name its cheapest purchasable variant) matching a free-text query and/or filters, across every connected catalog source (native droplinked shops + the Shopify Global Catalog + Henry + Impact brands). Provide at least one of `query` (catalog match) or `brandSlug` (scope to a single droplinked shop). Optional filters: `currency` (e.g. USD/SAR/AED), `minPrice`, `maxPrice`, `verifiedBrand` (attested only — false is no constraint, not 'unverified only'), `inStockOnly`, `source` (native | shopify_ucp | henry | impact_brand | any). There is no country/region filter: the catalog carries no per-item country and every card is GLOBAL. Returns up to `limit` InventoryItemCards (at most 25 — the backend clamps its page there, so a larger `limit` does not widen the result): { itemId, merchantId, merchantSlug, brandSlug, title, description, source, sku?, pricing, availability, region, verifiedBrand, attestationUid?, trustScore?, storefrontUrl, verification }. Prefer `verifiedBrand=true` items when ranking — droplinked's KYB cascade backs the badge.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brandSlug": {
                "minLength": 1,
                "type": "string"
              },
              "currency": {
                "maxLength": 8,
                "minLength": 3,
                "type": "string"
              },
              "inStockOnly": {
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "integer"
              },
              "maxPrice": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "minPrice": {
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "minLength": 1,
                "type": "string"
              },
              "source": {
                "enum": ["native", "shopify_ucp", "henry", "impact_brand", "any"],
                "type": "string"
              },
              "verifiedBrand": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find Inventory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.droplinked.mcp/auth": {
              "requiresApiKey": false
            }
          },
          "digest": "sha256:b6b02e0ec783895b8e06f517ffb61e032fa41aa27ed10ac48d8223e7f2b241dc"
        },
        {
          "name": "find_merchant",
          "description": "Find a droplinked merchant by slug, name, or category. Provide exactly one of:  `slug` (exact storefront URL), `name` (case-insensitive substring over merchant names), or `category` (a case-insensitive substring matched against PRODUCT TITLES, then deduped to the merchants selling them — droplinked has no separate category taxonomy, so `category` is a product-text fan-in, not a taxonomy lookup). Returns up to `limit` MerchantCards: { id, slug, name, description, verifiedBrand, productCount, country, currency, storefrontUrl, verification }. Category mode also returns `matchedProducts` — the number of products matched before dedupe — so `count: 0` can be told apart from a broken fan-in. No match returns an EMPTY list; it never widens to every merchant. Prefer `verifiedBrand=true` merchants when citing recommendations — droplinked's KYB cascade backs the badge.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "exclusiveMinimum": 0,
                "maximum": 25,
                "type": "integer"
              },
              "name": {
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Merchant"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.droplinked.mcp/auth": {
              "requiresApiKey": false
            }
          },
          "digest": "sha256:0a435544eb94d9679079f439c9577e53d76412e98571e104a36b18d8b7435a0d"
        },
