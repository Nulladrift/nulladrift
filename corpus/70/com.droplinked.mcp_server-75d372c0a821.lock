            "properties": {
              "cartId": {
                "minLength": 1,
                "type": "string"
              },
              "skuId": {
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["cartId", "skuId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Remove Cart Line"
          },
          "behavior": {
