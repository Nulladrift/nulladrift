        {
          "name": "cart.addLine",
          "description": "Add a product variant (skuId) and quantity to an existing droplinked cart. Use this to build a multi-item cart incrementally before checking out. Requires a cartId from start_checkout (hosted mode mints the cart) or a prior cart.addLine call. Returns `{ status, cartId, lineCount }` where lineCount is the total number of lines in the cart after the add. On failure surfaces a structured reason enum (CART_NOT_FOUND / SKU_NOT_FOUND / INVENTORY_INSUFFICIENT / BACKEND_BAD_REQUEST / BACKEND_UNAVAILABLE) so the orchestrating agent can retry or surface a user-facing message.\n\nAUTH: not on the public read tier — calling this without a valid X-MCP-API-Key returns JSON-RPC error -32001 with data.code=MCP_API_KEY_REQUIRED and never reaches the tool. Request a key from ops@droplinked.com. Discovery, catalogue and trust-fabric reads need no credential.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cartId": {
                "minLength": 1,
                "type": "string"
              },
              "quantity": {
                "exclusiveMinimum": 0,
                "maximum": 9999,
                "type": "integer"
              },
              "referrer": {
                "minLength": 1,
                "type": "string"
              },
              "skuId": {
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["cartId", "quantity", "skuId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add to Cart"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "com.droplinked.mcp/auth": {
              "code": "MCP_API_KEY_REQUIRED",
              "header": "X-MCP-API-Key",
              "howToObtain": "Request an X-MCP-API-Key from ops@droplinked.com",
              "requiresApiKey": true
            }
          },
          "digest": "sha256:2208ecd7774dbd86223543bde4497bdfd7b25895b8fcd0f5c439400bebf09747"
        },
        {
          "name": "cart.applyDiscount",
          "description": "Apply a discount or coupon code to a droplinked cart. Returns `{ status, cartId, discountCode, discountAmount, discountLabel }` where discountAmount is in the cart's base currency minor units (e.g. cents). Call this after cart.addLine and before start_checkout / process_payment. Surfaces structured error reasons (CART_NOT_FOUND / INVALID_DISCOUNT_CODE / DISCOUNT_EXPIRED / DISCOUNT_NOT_APPLICABLE / BACKEND_BAD_REQUEST / BACKEND_UNAVAILABLE) so the orchestrating agent can retry with a different code or proceed without a discount.\n\nAUTH: not on the public read tier — calling this without a valid X-MCP-API-Key returns JSON-RPC error -32001 with data.code=MCP_API_KEY_REQUIRED and never reaches the tool. Request a key from ops@droplinked.com. Discovery, catalogue and trust-fabric reads need no credential.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cartId": {
                "minLength": 1,
                "type": "string"
              },
              "discountCode": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["cartId", "discountCode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Apply Cart Discount"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "com.droplinked.mcp/auth": {
              "code": "MCP_API_KEY_REQUIRED",
              "header": "X-MCP-API-Key",
              "howToObtain": "Request an X-MCP-API-Key from ops@droplinked.com",
              "requiresApiKey": true
            }
          },
          "digest": "sha256:db49d4d38d5e7076f22850adfba1a8ca42fdb87b6adcc9a267225c9ad644be12"
        },
        {
          "name": "cart.removeLine",
          "description": "Remove a product line from a droplinked cart by skuId. The line identified by skuId is deleted from the cart. Returns `{ status, cartId, skuId, remainingLineCount }`. To change quantity (not remove entirely) use cart.updateLineQuantity instead. Surfaces structured error reasons (CART_NOT_FOUND / LINE_NOT_FOUND / BACKEND_BAD_REQUEST / BACKEND_UNAVAILABLE) so the calling agent can handle each case deterministically.\n\nAUTH: not on the public read tier — calling this without a valid X-MCP-API-Key returns JSON-RPC error -32001 with data.code=MCP_API_KEY_REQUIRED and never reaches the tool. Request a key from ops@droplinked.com. Discovery, catalogue and trust-fabric reads need no credential.",
          "inputSchema": {
