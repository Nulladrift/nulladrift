{
  "lockfileVersion": 2,
  "subjects": {
    "com.littlesweekly/littles-weekly": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://littlesweekly.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "littles-weekly",
        "title": "Littles Weekly",
        "version": "1.1.0",
        "websiteUrl": "https://littlesweekly.com/mcp-docs/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Littles Weekly publishes checked lists of things to do with kids ages 0–6, city by city across the US: this week’s outings, a city guide with prices, visiting plans, free things, indoor play, library storytimes, ice skating, seasonal pages (Santa, Christmas lights, Thanksgiving, Noon Year’s Eve) and weekend getaways. Start with list_cities, then get_events for dated outings or get_page for a whole page. Every result carries the littlesweekly.com page URL and the official link we checked; cite and link the page. Current events also carry eventUrl, the event’s own shareable page with a link preview: give that link when someone wants to save or send one event. Empty results mean we have not checked anything that matches, never that nothing exists. Organizers, and assistants acting for them, can send a new event with submit_event; it is free, we check every submission against its official page before listing it, and not every one is listed. Check on one later with get_submission_status.",
      "tools": [
        {
          "name": "get_events",
          "title": "Find dated outings",
          "description": "Dated outings for kids 0–6 in one city: this week’s list plus dated listings from the seasonal and free pages (Santa visits, light displays, Thanksgiving, Noon Year’s Eve, free museum days). Each has dates, time, venue, address, price, free flag, soldOut flag (sold-out events stay listed, after the available ones), ages, description, the official link we checked, the date we checked it, the littlesweekly.com page URL and eventUrl (the event’s own shareable page; hand this link out when someone wants to send or save it). Defaults to everything from today on.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "age": {
                "description": "Child’s age in years; keeps outings whose age range includes it",
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "city": {
                "description": "City slug from list_cities (e.g. \"omaha\", \"kansas-city\", \"twin-cities\"). A plain city name like \"Kansas City\" also works.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "end_date": {
                "description": "Last day, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "free_only": {
                "description": "Only outings a family can do without paying",
                "type": "boolean"
              },
              "indoor_only": {
                "description": "Only outings marked indoor (weekly list only)",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results (default 40)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Limit to one page, e.g. \"santa\" or \"this-week\"",
                "maxLength": 80,
                "type": "string"
              },
              "start_date": {
                "description": "First day, YYYY-MM-DD (defaults to today in the city)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6a751a43674d423a613680343d623d8c86c50205ae72a424062c68e3a3b765c"
        },
        {
          "name": "get_page",
          "title": "Get a page",
          "description": "Everything on one Littles Weekly page, in reading order: each section (Top 5 picks, Saturday and Sunday plans, every outing, Around town favorites, free days with who gets in free, always-free places, storytimes, indoor play with ages, prices, toddler times and sock rules, weekly library storytimes by day and branch, ice rinks with season dates, prices, skate rental and skate aids, Santa and lights listings, Christmas parades and tree lightings, Christmas train rides, what’s open on Dec 24, Dec 25 and Jan 1, getaway trips, tips), every card’s official link and \"Checked\" date, and the page FAQ. page is a key from list_pages, like \"this-week\", \"guide\", \"visiting\", \"free\", \"indoor-play\", \"storytime\", \"ice-skating\", \"santa\", \"christmas-lights\", \"thanksgiving\", \"christmas-parades\", \"christmas-trains\", \"nutcracker\", \"christmas-markets\", \"christmas-break\", \"noon-years-eve\" or \"weekend-getaways\". Long pages come back in parts: pass section to get one heading. format \"markdown\" returns the page’s Markdown version instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "anyOf": [
                  {
                    "description": "City slug from list_cities (e.g. \"omaha\", \"kansas-city\", \"twin-cities\"). A plain city name like \"Kansas City\" also works.",
                    "maxLength": 60,
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "const": "site",
                    "type": "string"
                  }
                ]
              },
              "format": {
                "description": "structured (default) or markdown",
                "enum": ["structured", "markdown"],
                "type": "string"
              },
              "page": {
                "default": "this-week",
                "description": "Page key from list_pages. Defaults to \"this-week\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "section": {
                "description": "Only the section whose heading contains this text, e.g. \"Top 5\", \"Sunday\", \"always free\", \"FAQ\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48accf0d143083a26bcc66fcd00e26363832345f79e082f0e0239c95a0cdff7f"
        },
        {
          "name": "get_submission_status",
          "title": "Check a submitted event",
          "description": "Review status of an event sent with submit_event (or the website form): pending_review, approved (with the listing URL once it is live) or rejected. Takes the id submit_event returned. No contact details are returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Submission id, like \"ev-20261028-abcdefghjk\"",
                "maxLength": 40,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:accb666fb87eb65414c4317588813113bd53030e657206b853eaba49054c21b0"
        },
        {
          "name": "list_cities",
          "title": "List cities",
          "description": "Every city Littles Weekly covers, with its slug, current week, last-checked date and the pages it has (this-week, guide, visiting, free, free-museum-days, indoor-play, storytime, ice-skating, sledding, santa, christmas-lights, thanksgiving, christmas-parades, christmas-trains, nutcracker, christmas-markets, christmas-break, noon-years-eve, playgrounds, splash-pads, birthday-parties, summer-camps, sports-leagues, easter-egg-hunts, weekend-getaways). Call this first if you are not sure of a slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:45cac0cd7b4dbd84d2c2037b739b9d45d193955b8d5960ef5eec7bdd85e2416b"
        },
        {
          "name": "list_pages",
          "title": "List a city’s pages",
          "description": "The pages for one city (or city \"site\" for site-wide pages like regional weekend getaways), with each page’s URL, last-checked date, section headings and how many FAQs and cards it has.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "anyOf": [
                  {
                    "description": "City slug from list_cities (e.g. \"omaha\", \"kansas-city\", \"twin-cities\"). A plain city name like \"Kansas City\" also works.",
                    "maxLength": 60,
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "const": "site",
                    "type": "string"
                  }
                ]
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:33568654e3c1ab402488acc6d86f8f55ad2c21d6705e2fb4c9983713e8e3395f"
        },
        {
          "name": "search",
          "title": "Search listings",
          "description": "Keyword search across every card, outing and FAQ on Littles Weekly, in one city or all of them. Good for \"Santa breakfast\", \"toddler time\", \"free museum day\", \"splash pad\" or a venue name. Results carry the page URL (the event’s own shareable page for dated events, also as eventUrl; otherwise the card’s anchor), the official link and the checked date.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "Limit to one city",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 15)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3929ce30def9af268f546ac807bf763d1ecf17af3d3081331fdf3cc6c007b5f9"
        },
        {
          "name": "submit_event",
          "title": "Submit an event for review",
          "description": "Send Littles Weekly a family event for kids ages 0–6 in one of our cities, for example on behalf of the organizer you are helping. Free. It goes into a review queue and is never published automatically: a person checks every detail against event_url (the official event page) before listing it, and not every submission is listed. Only submit events the user organizes or is authorized to share, set authorized to true only when they have confirmed that, and use their real contact details. Returns a submission id, status \"pending_review\", a confirmation line and a status_url page the user can open to follow it; the organizer email also gets a short confirmation with that link. Pass the id to get_submission_status later. One call per event; do not resubmit the same event.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "Street address, if there is one",
                "maxLength": 200,
                "type": "string"
              },
              "age_range": {
                "description": "Ages it suits, e.g. \"0–5\", \"toddlers 18 mo–3\", \"all ages\"",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "agent": {
                "description": "Optional: which assistant is sending this, e.g. \"Claude for the organizer\"",
                "maxLength": 120,
                "type": "string"
              },
              "authorized": {
                "const": true,
                "description": "Must be true: the user confirmed they are the organizer or authorized to share this event",
                "type": "boolean"
              },
              "city": {
                "description": "City slug from list_cities or https://littlesweekly.com/cities.json (e.g. \"indianapolis\", \"twin-cities\"). A plain name like \"Kansas City\" also works. Must be a city we cover.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "cost": {
                "description": "Price details, required when free is false (e.g. \"$8 per child, adults free\")",
                "maxLength": 120,
                "type": "string"
              },
              "description": {
                "description": "A few plain sentences about what families will do there",
                "maxLength": 1500,
                "minLength": 20,
                "type": "string"
              },
              "end_date": {
                "description": "Last date for multi-day or recurring runs, YYYY-MM-DD. Omit for one day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "event_name": {
                "description": "Event name as the organizer lists it",
                "maxLength": 140,
                "minLength": 3,
                "type": "string"
              },
              "event_url": {
                "description": "Official event page (https://...). Required: we verify everything against it.",
                "maxLength": 500,
                "minLength": 8,
                "type": "string"
              },
              "free": {
                "description": "true if a family can attend without paying",
                "type": "boolean"
              },
              "organizer_email": {
                "description": "Contact email for questions about this event (not published, not added to any list)",
                "maxLength": 254,
                "minLength": 6,
                "type": "string"
              },
              "organizer_name": {
                "description": "Organizer or contact person",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "organizer_phone": {
                "description": "Contact phone (optional, not published)",
                "maxLength": 40,
                "type": "string"
              },
              "registration": {
                "description": "Whether families must sign up ahead",
                "enum": ["required", "recommended", "not_needed"],
                "type": "string"
              },
              "start_date": {
                "description": "First (or only) date, YYYY-MM-DD, today or later",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "test": {
                "description": "Leave this out. Only Littles Weekly sets it, to test the tool.",
                "type": "boolean"
              },
              "time": {
                "description": "Times, e.g. \"10–11:30 AM\" or \"Saturdays 9 AM–noon\"",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "venue": {
                "description": "Venue or place name",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["age_range", "authorized", "city", "description", "event_name", "event_url", "free", "organizer_email", "organizer_name", "registration", "start_date", "time", "venue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:34d073d7de8be62908569798661333cb83ec09f2a20264c33c2a6c408d84e456"
        }
      ],
      "digest": "sha256:587b0ea4ac5c22c11816330ad2fe04141a24d1505ae3930c797508dc1bd77233"
    }
  }
}
