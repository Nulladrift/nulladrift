{
  "lockfileVersion": 2,
  "subjects": {
    "app.vercel.planlimits-rpatel021/planlimits": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://planlimits.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "planlimits",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "can_afford_task",
          "title": "Can I afford this task on my plans right now?",
          "description": "For agents deciding whether to start a task: given the plans you own, how much of each is used, optionally the plan you are on now, and the task size, returns verdict go | wait | switch, which plan to use, reasons and reset windows. Reuses the route_task logic. Task size is a labeled heuristic (vendors don't publish per-task usage). size: small = One file or a quick question; medium = A feature across a few files (tens of minutes); large = A long refactor or multi-hour agent run. Plan ids: claude-pro, claude-max, claude-ultra, codex-free, codex-go, codex-plus, codex-pro, cursor-free, cursor-plus, cursor-premium, cursor-super, cursor-ultra, copilot-free, copilot-pro, copilot-pro-plus, copilot-max, antigravity-individual-free, antigravity-google-ai-pro, antigravity-google-ai-ultra, windsurf-free, windsurf-pro, windsurf-max.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "current": {
                "description": "plan id you are using now",
                "maxLength": 40,
                "type": "string"
              },
              "plans": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "plan": {
                      "type": "string"
                    },
                    "state": {
                      "description": "fine | low | session_hit | exhausted (weekly_hit / monthly_hit = exhausted)",
                      "maxLength": 40,
                      "type": "string"
                    }
                  },
                  "required": ["plan"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "size": {
                "description": "small | medium (default) | large",
                "maxLength": 20,
                "type": "string"
              },
              "task": {
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["plans"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97991cd289d321f43fc49bccb92478424e2f58c3f31e447fbc73f0d666bd83af"
        },
        {
          "name": "get_recent_changes",
          "title": "Recent plan/limit changes",
          "description": "Dated change log of AI coding plan and usage-limit changes, newest first, each with a vendor source.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "since": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63a7848ef0afa51a7de728d3909ba9788775a364a35d9c1aade94be7e658612a"
        },
        {
          "name": "get_service_status",
          "title": "Live vendor status (outages/incidents)",
          "description": "Live operational status and open incidents from official vendor status pages (Claude/Anthropic, OpenAI/Codex, Cursor, GitHub Copilot, Google Cloud Gemini/Vertex AI, Windsurf). Outages only: it does not detect throttling or per-account limits. provider one of: anthropic, openai, cursor, github, google, windsurf (or a tool id); omit for all.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "provider": {
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:600f7e2faaf0f3f844b8109a1801c1e1a9ee1b3920cf912f2184f7f6d753e940"
        },
        {
          "name": "get_tool_plans",
          "title": "Plans for one tool",
          "description": "Plans and limits for one tool. tool_id one of: claude-code, openai-codex, cursor, github-copilot, gemini-cli, antigravity, windsurf.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "tool_id": {
                "type": "string"
              }
            },
            "required": ["tool_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:08f16d118a5e7b45778b5c58a575bb92523f67c9a04d222480b20e8cc351ff7f"
        },
        {
          "name": "list_plans",
          "title": "List all AI coding plans",
          "description": "All tracked AI coding tools (Claude Code, Codex, Cursor, Copilot, Gemini Code Assist, Antigravity, Windsurf) with every plan: price, stated usage limits, window, models, source URL and checked date. Undisclosed values say \"not disclosed\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ed6f9c75080b7a98e0b9c8c70d5e51c3dc2a915c35631a980f87d2357f48b33"
        },
        {
          "name": "pick_plan",
          "title": "Pick the cheapest AI coding plan that fits",
          "description": "Answers 4 questions and returns the cheapest fitting plan with reasons, up to 3 alternatives and source links (same logic as https://planlimits.app/picker/). interface: terminal | ide | any; budget_usd: monthly USD; usage: light | daily | heavy (usage rule is a labeled rule of thumb); who: individual | team.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "budget_usd": {
                "minimum": 0,
                "type": "number"
              },
              "interface": {
                "maxLength": 20,
                "type": "string"
              },
              "usage": {
                "maxLength": 20,
                "type": "string"
              },
              "who": {
                "maxLength": 20,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88368aa79eb30e49ff102d41c4cb35e05e20b5e83553454c33bfa5623a8b52e8"
        },
        {
          "name": "recommend_plan",
          "title": "Plans within a monthly budget",
          "description": "Plans priced at or under a monthly USD budget, highest price first (same logic as the PlanLimits budget picker).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "budget_usd": {
                "minimum": 0,
                "type": "number"
              },
              "use": {
                "enum": ["individual", "team", "any"],
                "type": "string"
              }
            },
            "required": ["budget_usd"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a67de978a6d210d9bec6c790753af81fcc9a7577deb30231ea5c3627a0870220"
        },
        {
          "name": "route_task",
          "title": "Which AI coding plan to use right now",
          "description": "Given the plans you own, how much of each is used, and the task type, returns which plan to use now, a fallback, when each limit resets (from vendor-stated windows), a rationale, a suggested weekly rotation, and source links. Same logic as https://planlimits.app/router/. Unknowns are labeled estimate / not published. Plan ids: claude-pro, claude-max, claude-ultra, codex-free, codex-go, codex-plus, codex-pro, cursor-free, cursor-plus, cursor-premium, cursor-super, cursor-ultra, copilot-free, copilot-pro, copilot-pro-plus, copilot-max, antigravity-individual-free, antigravity-google-ai-pro, antigravity-google-ai-ultra, windsurf-free, windsurf-pro, windsurf-max.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "plans": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "plan": {
                      "description": "plan id, e.g. claude-pro",
                      "type": "string"
                    },
                    "state": {
                      "description": "fine = Fine / plenty left; low = Running low (~80% of the main limit used); session_hit = Hit the short (session/daily) limit; exhausted = Hit the main (weekly/monthly) limit; weekly_hit / monthly_hit = aliases of exhausted. Unknown values are rejected.",
                      "maxLength": 40,
                      "type": "string"
                    }
                  },
                  "required": ["plan"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "task": {
                "description": "refactor = Big refactor / long agent run; everyday = Everyday edits; quick = Quick questions",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["plans"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b369c60af7395d0845f62980de3d1135dea4e57a9c4e6e347191959038153f4"
        }
      ],
      "digest": "sha256:f6085bf9751d9c98fcdb8a3dcfbd4a45b79f4fa767acd6c2926ad12cc68acf6b"
    }
  }
}
