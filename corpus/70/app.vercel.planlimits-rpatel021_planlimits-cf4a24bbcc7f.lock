        },
        {
          "name": "list_plans",
          "title": "List all AI coding plans",
          "description": "All tracked AI coding tools (Claude Code, Codex, Cursor, Copilot, Gemini Code Assist, Antigravity, Windsurf) with every plan: price, stated usage limits, window, models, source URL and checked date. Undisclosed values say \"not disclosed\".",
