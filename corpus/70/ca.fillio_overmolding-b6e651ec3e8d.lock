        {
          "name": "recommend_3d_printing_resin",
          "title": "Recommended 3D printing resin",
          "description": "Returns the SLA 3D printing resin best suited to a part's use, behaviour, service temperature and requirements, with its properties, the reasons for the choice, what remains to confirm and another option. Same choices and same answer as the selector on www.fillio.ca.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "behavior": {
                "default": "rigid_and_precise",
                "enum": ["rigid_and_precise", "withstand_impacts", "bend_without_breaking", "flexible_80a", "very_soft_40a_to_50a"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the answer: “fr” or “en”.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "max_service_temp": {
                "default": "room_temperature",
                "enum": ["room_temperature", "up_to_60c", "up_to_100c", "above_100c"],
                "type": "string"
              },
              "requirements": {
                "items": {
                  "enum": ["maximum_stiffness", "flame_retardant_ul94_v0", "static_dissipative_esd"],
                  "type": "string"
                },
                "type": "array"
              },
              "use": {
                "default": "functional_prototype",
                "enum": ["functional_prototype", "shop_jig_or_fixture", "mold_or_hot_tooling", "end_use_part_small_batch", "seal_bumper_or_grip"],
