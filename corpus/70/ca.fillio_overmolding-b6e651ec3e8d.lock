      "serverInfo": {
        "name": "fillio-portail",
        "title": "Fillio · electronics overmolding",
        "version": "0.34.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Fillio (Québec City, Canada) overmolds electronics at low pressure: boards, connectors, cable junctions. get_design_guide returns the design reference, useful when designing or reviewing a part to be overmolded; get_capabilities returns the same values as data; get_upload_link returns the address of the portal where the user uploads a 3D file and gets the feasibility analysis. estimate_in_house_potting_cost, recommend_overmolding_resin and recommend_3d_printing_resin return the same answer as the calculator and resin selectors on www.fillio.ca. Read-only: no user file or information passes through this server. One exception: send_harness_quote_template receives an email address and sends Fillio's wire harness quote template there, filled in and checked; the portal keeps nothing of it.",
      "tools": [
        {
          "name": "estimate_in_house_potting_cost",
          "title": "Real cost of in-house potting",
          "description": "Returns the real cost per working part of one year of in-house potting (epoxy or resin encapsulation), comparable with a quote: labour, engineering, rejects, returns, resin, curing space, equipment, health and safety, and delays. Same calculation as the calculator on www.fillio.ca; a missing argument takes the calculator's default value. Nothing is stored or sent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assembly_value": {
                "default": 60,
                "description": "Full value of one assembly ($)",
                "minimum": 0,
                "type": "number"
              },
              "cost_per_return": {
                "default": 250,
                "description": "Cost of one return ($)",
                "minimum": 0,
                "type": "number"
              },
              "cure_time_hours": {
                "default": 24,
                "description": "Cure time (h)",
                "minimum": 0,
                "type": "number"
              },
              "customer_returns_per_year": {
                "default": 5,
                "description": "Customer returns per year (returns)",
                "minimum": 0,
                "type": "number"
              },
              "delay_value_per_week": {
                "default": 2000,
                "description": "Value of a one-week delay ($)",
                "minimum": 0,
                "type": "number"
              },
              "engineering_hours_per_month": {
                "default": 4,
                "description": "Engineering hours on potting (h/month)",
                "minimum": 0,
                "type": "number"
              },
              "engineering_rate_per_hour": {
                "default": 95,
                "description": "Loaded hourly rate, engineering ($/h)",
                "minimum": 0,
                "type": "number"
              },
              "equipment_per_year": {
                "default": 1500,
                "description": "Amortized equipment and upkeep ($/yr)",
                "minimum": 0,
                "type": "number"
              },
              "floor_space_per_curing_part_ft2": {
                "default": 0.5,
                "description": "Floor space per curing part (ft²)",
                "minimum": 0,
                "type": "number"
              },
              "health_safety_per_year": {
                "default": 800,
                "description": "Health and safety, waste, training ($/yr)",
                "minimum": 0,
                "type": "number"
              },
              "lang": {
                "description": "Language of the answer: “fr” or “en”.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "operator_rate_per_hour": {
                "default": 45,
                "description": "Loaded hourly rate, operator ($/h)",
                "minimum": 0,
                "type": "number"
              },
              "parts_per_year": {
                "default": 500,
                "description": "Parts produced per year (parts)",
                "minimum": 0,
                "type": "number"
              },
              "parts_potted_per_day": {
                "default": 20,
                "description": "Parts potted per day (parts)",
                "minimum": 0,
                "type": "number"
              },
              "potting_minutes_per_part": {
                "default": 12,
                "description": "Potting time per part (min)",
                "minimum": 0,
                "type": "number"
              },
              "rejected_parts_pct": {
                "default": 8,
                "description": "Rejected parts (%)",
                "minimum": 0,
                "type": "number"
              },
              "resin_cost_per_part": {
                "default": 2.5,
                "description": "Resin per part ($)",
                "minimum": 0,
                "type": "number"
              },
              "resin_wasted_pct": {
                "default": 25,
                "description": "Wasted or expired resin (%)",
                "minimum": 0,
                "type": "number"
              },
              "space_cost_per_ft2_year": {
                "default": 15,
                "description": "Annual cost of space ($/ft²)",
                "minimum": 0,
                "type": "number"
              },
              "weeks_added": {
                "default": 0,
                "description": "Weeks added to the project (wk)",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
