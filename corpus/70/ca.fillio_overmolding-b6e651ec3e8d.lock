        },
        {
          "name": "recommend_3d_printing_resin",
          "title": "Recommended 3D printing resin",
          "description": "Returns the SLA 3D printing resin best suited to a part's use, behaviour, service temperature and requirements, with its properties, the reasons for the choice, what remains to confirm and another option. Same choices and same answer as the selector on www.fillio.ca.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "behavior": {
                "default": "rigid_and_precise",
                "enum": ["rigid_and_precise", "withstand_impacts", "bend_without_breaking", "flexible_80a", "very_soft_40a_to_50a"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the answer: “fr” or “en”.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "max_service_temp": {
                "default": "room_temperature",
                "enum": ["room_temperature", "up_to_60c", "up_to_100c", "above_100c"],
                "type": "string"
              },
              "requirements": {
                "items": {
                  "enum": ["maximum_stiffness", "flame_retardant_ul94_v0", "static_dissipative_esd"],
                  "type": "string"
                },
                "type": "array"
              },
              "use": {
                "default": "functional_prototype",
                "enum": ["functional_prototype", "shop_jig_or_fixture", "mold_or_hot_tooling", "end_use_part_small_batch", "seal_bumper_or_grip"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:34913d414c082088c86f95d10ad73a0d1088397fe704cef7f41b254a3f76b56b"
        },
        {
          "name": "recommend_overmolding_resin",
          "title": "Recommended overmolding resin",
          "description": "Returns the low-pressure overmolding polyamide family best suited to a part's service temperatures, exposures, hardness and needs, with its service range, hardness, colours, what remains to confirm with Fillio and another compatible family. Same choices and same answer as the selector on www.fillio.ca.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "exposures": {
                "items": {
                  "enum": ["normal", "uv", "solvents", "oils", "humidity", "abrasion"],
                  "type": "string"
                },
                "type": "array"
              },
              "hardness": {
                "default": "any",
                "enum": ["any", "soft", "firm", "rigid"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the answer: “fr” or “en”.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "max_service_temp_c": {
                "default": 125,
                "enum": [80, 105, 125, 175, 200],
                "type": "integer"
              },
              "min_service_temp_c": {
                "default": -40,
                "enum": [-40, -25, 10],
                "type": "integer"
              },
              "needs": {
                "items": {
                  "enum": ["led_window", "cable_strain_relief", "difficult_substrate"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
