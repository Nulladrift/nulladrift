            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the answer: “fr” or “en”.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "project": {
                "description": "Project number returned by the upload (DEM-…).",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["project"],
            "type": "object"
          },
          "annotations": {
