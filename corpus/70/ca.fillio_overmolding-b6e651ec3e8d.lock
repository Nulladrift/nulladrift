      "serverInfo": {
        "name": "fillio-portail",
        "title": "Fillio · electronics overmolding",
        "version": "0.40.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Fillio (Québec City, Canada) overmolds electronics at low pressure: boards, connectors, cable junctions. get_design_guide returns the design reference, useful when designing or reviewing a part to be overmolded; get_capabilities returns the same values as data; get_upload_link returns the address of the portal where the user uploads a 3D file. With the user's Fillio account connected, start_part_check returns an upload address for the 3D file of a part and get_part_check returns its feasibility analysis, in a draft project; get_submission_summary returns the summary of sending that project to Fillio and a confirmation, and submit_part_check, with that confirmation, sends the project. Nothing is sent to Fillio without that confirmed submission, or without the user submitting the project in the portal. estimate_in_house_potting_cost, recommend_overmolding_resin and recommend_3d_printing_resin return the same answer as the calculator and resin selectors on www.fillio.ca. One exception: send_harness_quote_template receives an email address and writes to it; Fillio's wire harness quote template, filled in and checked, is sent there once its recipient confirms through the link in the email. The portal keeps nothing of it after sending, and Fillio's team receives a notice for follow-up.",
      "tools": [
        {
