            "readOnly": true
          },
          "digest": "sha256:3dae6b113af7d445104bbb3be9025d601131cf761645e4393d0731f531c1fd30"
        },
        {
          "name": "send_harness_quote_template",
          "title": "Filled-in wire harness quote template",
          "description": "Returns a check of a wire harness connection list (unknown references, contacts beyond the number of positions, duplicate contacts or wires, connectors with no wire or no length) and what the project still needs for a quote, and emails Fillio's Excel quote request template, filled in with the project, connectors, connections (from-to) and lengths, to the given address. The file goes to that address only; Fillio is notified (address, company, part). Useful when preparing a wire harness assembly quote request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "connections": {
                "description": "Connections (from-to): one row per wire, from one reference and contact to another, with the gauge, colour and wire type.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "color": {
                      "description": "Color",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "from_contact": {
                      "description": "From: contact",
                      "maxLength": 200,
                      "minimum": 0,
                      "type": ["string", "number"]
                    },
                    "from_ref": {
                      "description": "From: ref.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "gauge_awg": {
                      "description": "Gauge (AWG)",
                      "maxLength": 200,
                      "minimum": 0,
                      "type": ["string", "number"]
                    },
                    "notes": {
                      "description": "Notes (shield, twisted pair...)",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "signal": {
                      "description": "Signal or function",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "to_contact": {
                      "description": "To: contact",
                      "maxLength": 200,
                      "minimum": 0,
                      "type": ["string", "number"]
                    },
                    "to_ref": {
                      "description": "To: ref.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "wire": {
                      "description": "Wire no.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "wire_type": {
                      "description": "Wire type",
                      "maxLength": 200,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 500,
                "type": "array"
              },
              "connectors": {
                "description": "Connectors: one row per end of the harness (ref. J1, J2…), with the manufacturer, housing and contact part numbers and number of positions.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "accessories": {
                      "description": "Accessories (seal, plug, lock)",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "contacts": {
                      "description": "Contact P/N",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "equivalent_accepted": {
                      "description": "Equivalent accepted?",
                      "type": "boolean"
                    },
                    "housing": {
                      "description": "Housing P/N",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "manufacturer": {
                      "description": "Manufacturer",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "notes": {
                      "description": "Notes",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "positions": {
                      "description": "No. of positions",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "ref": {
                      "description": "Ref.",
                      "maxLength": 200,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "email": {
                "description": "Email address that receives the filled-in file (that of the person requesting the quote).",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "lang": {
                "description": "Language of the answer: “fr” or “en”.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "lengths": {
                "description": "Lengths: one row per branch, between its two ends (reference or junction), with the length and tolerance in millimetres.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "branch": {
                      "description": "Branch",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "from": {
                      "description": "From",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "label": {
                      "description": "Label to print",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "length_mm": {
                      "description": "Length (mm)",
                      "minimum": 0,
                      "type": "number"
                    },
                    "notes": {
                      "description": "Notes",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "sleeving": {
                      "description": "Sleeving or protection",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "to": {
                      "description": "To",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "tolerance_mm": {
                      "description": "Tolerance (± mm)",
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "project": {
