        {
          "name": "hemelion_map_clarity_decision",
          "title": "Map a decision with Clarity",
          "description": "Use this for one non-regulated personal or business decision with two or three options. Ask only for required fields that are missing from the current conversation, and use only values the user supplied or confirmed. Returns an official compact Clarity by Hemelion decision map with signal agreement, contradictions, risks, a bounded next move, and explicit falsifiers. Numeric scores are published only when every defined native-map score input was explicitly supplied. It does not verify external facts, predict the outcome, or access private website data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agency": {
                "description": "How much direct control the user has over the outcome: 0 little, 100 high.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "avoidance": {
                "description": "How much the user suspects delay is replacing decision progress: 0 none, 100 high.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "constraints": {
                "description": "Material constraints the user explicitly identified.",
                "items": {
                  "enum": ["time", "money", "health", "location", "obligations", "timing", "skills", "information", "none"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "current_preference_index": {
                "anyOf": [
                  {
                    "maximum": 2,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Which option the user currently prefers, if any. Use a zero-based index that is less than options.length: only 0 or 1 with two options, and 0, 1, or 2 with three. Use null or omit when no option leads."
              },
              "deadline": {
                "description": "When the user needs to decide.",
                "enum": ["now", "weeks", "months", "later"],
                "type": "string"
              },
              "decision": {
                "description": "One concrete decision stated in the user’s own words. Do not infer private facts.",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              },
              "decision_confidence": {
                "description": "How confident the user feels making this decision now: 0 not at all, 100 fully.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "emotional_state": {
                "description": "How settled the user feels right now: 0 highly stressed, 100 calm. Needed for the rule that flags a strong leaning formed under stress.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "evidence_leader_index": {
                "$ref": "#/properties/current_preference_index",
                "description": "Which option currently has the strongest comparable real-world evidence, if any. Use a zero-based index that is less than options.length: only 0 or 1 with two options, and 0, 1, or 2 with three. Use null or omit when no option leads."
              },
              "evidence_reliability": {
                "description": "How representative and comparable the current evidence is: 0 weak, 100 strong.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "exit_plan": {
                "description": "How prepared the user’s exit is if the choice turns out wrong: 0 none, 100 ready.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "identity_alignment": {
                "description": "How well the preferred option fits who the user wants to become: 0 poorly, 100 closely.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "immediate_leaning": {
                "description": "The user’s immediate, unconsidered leaning toward their preferred option: 0 none, 100 strong. Ask for a first reaction, not a reasoned one.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "options": {
                "description": "Two or three real options supplied or confirmed by the user.",
                "items": {
                  "maxLength": 180,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              },
              "past_similar_outcome": {
                "description": "Whether the user has faced a similar decision before and how it turned out.",
                "enum": ["never", "yes_good", "yes_bad", "yes_mixed"],
                "type": "string"
              },
              "priorities": {
                "description": "One to three priorities confirmed by the user.",
                "items": {
                  "enum": ["growth", "stability", "autonomy", "income", "impact", "relationships", "wellbeing", "status"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "priority_leader_index": {
                "$ref": "#/properties/current_preference_index",
                "description": "Which option best fits the user’s stated priorities, if any. Use a zero-based index that is less than options.length: only 0 or 1 with two options, and 0, 1, or 2 with three. Use null or omit when no option leads."
              },
              "regret": {
                "description": "The timing mistake the user is more concerned about.",
                "enum": ["committed_too_soon", "waited_too_long", "both_equal", "unclear"],
                "type": "string"
              },
              "reversibility": {
                "description": "How easy the first commitment is to reverse: 0 means very hard, 100 means very easy.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "risk_tolerance": {
                "description": "Current emotional tolerance for downside: 0 low, 100 high.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "safety_net": {
                "description": "How much financial or practical buffer absorbs a bad outcome: 0 none, 100 substantial.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "scope_category": {
                "description": "Required safety classification. Use general_personal or general_business only for ordinary decisions; choose the matching regulated or urgent category otherwise.",
                "enum": ["general_personal", "general_business", "emergency_safety", "health_or_mental_health", "legal", "regulated_finance", "high_impact_third_party"],
                "type": "string"
              },
              "social_pressure": {
                "description": "How strongly other people’s expectations affect the choice: 0 none, 100 high.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "subject_attestation": {
                "const": true,
                "description": "Assert only if the person has confirmed they are 18 or older, this is their own non-emergency situation, and the result will not be used for diagnosis, regulated advice, or a high-impact decision about another person. Ask them if you have not. Do not assert this on assumption.",
                "type": "boolean"
              },
              "testability": {
                "description": "How easily the options can be compared in a bounded real-world test: 0 hard, 100 easy.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "values_clarity": {
                "description": "How clear the user is about what they actually want: 0 unclear, 100 clear.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["decision", "options", "priorities", "reversibility", "scope_category", "subject_attestation"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "type": "string"
              },
              "canonicalUrl": {
                "format": "uri",
                "type": "string"
              },
              "contradictions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "costBoundary": {
                "type": "string"
              },
              "dataQuality": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "coverage0to1": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "interpretation": {
                        "type": "string"
                      },
                      "measuredInputs": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "missingInputs": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "modelReach": {
                        "additionalProperties": false,
                        "properties": {
                          "agencyWeightSupplied": {
                            "maximum": 1,
                            "minimum": 0,
                            "type": "number"
                          },
                          "clarityPositiveTermsSupplied": {
                            "type": "boolean"
                          },
                          "contradictionRulesReachable": {
                            "minimum": 0,
                            "type": "integer"
                          },
                          "contradictionRulesTotal": {
                            "minimum": 0,
                            "type": "integer"
                          },
                          "riskWeightSupplied": {
                            "maximum": 1,
                            "minimum": 0,
                            "type": "number"
                          }
                        },
                        "required": ["agencyWeightSupplied", "clarityPositiveTermsSupplied", "contradictionRulesReachable", "contradictionRulesTotal", "riskWeightSupplied"],
                        "type": "object"
                      }
                    },
                    "required": ["coverage0to1", "interpretation", "measuredInputs", "missingInputs"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "evidenceBoundary": {
                "type": "string"
              },
              "executionBoundary": {
                "type": "string"
              },
              "methodVersion": {
                "type": "string"
              },
              "nextSteps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "product": {
                "type": "string"
              },
              "provider": {
                "const": "Hemelion",
                "type": "string"
              },
              "scopeBoundary": {
                "type": "string"
              },
              "scores": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "agencyFriction": {
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "clarity": {
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "conflict": {
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "risk": {
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
