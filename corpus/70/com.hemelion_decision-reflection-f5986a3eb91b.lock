      "serverInfo": {
        "name": "com.hemelion/decision-reflection",
        "title": "Hemelion Decision and Pattern Reflection",
        "version": "1.11.0",
        "description": "Official native Clarity decision mapping, MindScan episode reflection, and supporting evidence tools.",
        "websiteUrl": "https://www.hemelion.com/integrations/mcp"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use these no-charge Hemelion tools only for non-regulated decision support or non-clinical reflection. Start with hemelion_choose_reflection_mode when intent is unclear. Use hemelion_map_clarity_decision for a compact official Clarity map of one decision and ask only for required fields missing from the current conversation. Use hemelion_map_mindscan_episode for a compact official MindScan map of one concrete episode; preserve unknown effects rather than inventing them. Supply recurrence history, counterexample status, and comparison target together for the current 4.1.0 MindScan method; five-field requests remain available only as an explicitly versioned legacy 4.0.0 contract. Both maps are deterministic and use only supplied inputs. Use hemelion_assess_decision_readiness for the smaller four-rating planning rule. After a product is chosen, hemelion_create_scan_handoff may provide a short-lived user-confirmed website route without transferring conversation text. Use hemelion_get_method_and_evidence for method, evidence, or limitation claims. Retain provider, product, method version, canonical URL, and attribution. Never infer a diagnosis, trait, hidden motive, external fact, or guaranteed outcome; never request private report access or expose private scan data.",
      "tools": [
        {
          "name": "hemelion_assess_decision_readiness",
          "title": "Assess decision readiness",
          "description": "Use this when a person has a non-regulated decision and wants to know whether to protect the downside, run a bounded test, or close the evidence window. Uses four 1–5 ratings and returns a transparent rule. Do not use for emergencies or professional legal, medical, or financial advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "delayCost": {
                "description": "Cost of waiting: 1 low, 5 high.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "impact": {
                "description": "Consequence if the choice is wrong: 1 contained, 5 major.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "reversibility": {
                "description": "Ease of reversing course: 1 hard, 5 easy.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "uncertainty": {
                "description": "Important unknowns: 1 few, 5 many.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["delayCost", "impact", "reversibility", "uncertainty"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "type": "string"
              },
              "canonicalUrl": {
                "format": "uri",
                "type": "string"
              },
              "classification": {
                "enum": ["protect-the-downside", "run-a-bounded-test", "close-the-evidence-window"],
                "type": "string"
              },
              "evidenceThreshold": {
                "type": "string"
              },
              "executionBoundary": {
                "type": "string"
              },
              "explanation": {
                "type": "string"
              },
              "limitation": {
                "type": "string"
              },
              "methodVersion": {
                "type": "string"
              },
              "nextMove": {
                "type": "string"
              },
              "product": {
                "type": "string"
              },
              "provider": {
                "const": "Hemelion",
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["attribution", "canonicalUrl", "classification", "evidenceThreshold", "executionBoundary", "explanation", "limitation", "methodVersion", "nextMove", "product", "provider", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
