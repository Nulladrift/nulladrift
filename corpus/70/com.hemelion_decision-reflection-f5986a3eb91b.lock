        {
          "name": "hemelion_map_mindscan_episode",
          "title": "Map one episode with MindScan",
          "description": "Use this for non-clinical reflection on one concrete, low-risk episode. Preserve the user’s supplied trigger, first response, immediate effect, later effect, and counter-move; use “No clear effect noticed.” rather than inventing a missing effect. For the current 4.1.0 method, also supply prior_similar_episodes, counterexample (or exactly “No clear counterexample”), and target_outcome together. Omitting all three returns an explicitly versioned legacy 4.0.0 map. Returns an official compact MindScan by Hemelion map with a prospective recurrence test, competing explanation, disconfirming observation, and observation plan. Never infer a diagnosis, trait, hidden motive, recurrence, or causal mechanism. It cannot access private website data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "counter_move": {
                "description": "One safe, reversible alternative response designed by the user.",
                "maxLength": 900,
                "minLength": 2,
                "type": "string"
              },
              "counterexample": {
                "description": "Optional current-method boundary evidence. Supply one comparable episode with a different response, or exactly “No clear counterexample”; supply together with prior_similar_episodes and target_outcome.",
                "maxLength": 400,
                "minLength": 2,
                "type": "string"
              },
              "first_response": {
                "description": "The first observable response the user reports.",
                "maxLength": 900,
                "minLength": 2,
                "type": "string"
              },
              "immediate_effect": {
                "description": "What the user noticed immediately afterward. Use “No clear effect noticed.” when unknown.",
                "maxLength": 900,
                "minLength": 2,
                "type": "string"
              },
              "later_effect": {
                "description": "What the user noticed later. Use “No clear effect noticed.” when unknown.",
                "maxLength": 900,
                "minLength": 2,
                "type": "string"
              },
              "prior_similar_episodes": {
                "description": "Optional current-method recurrence history. Supply this together with counterexample and target_outcome. It is self-report, not proof of recurrence.",
                "enum": ["none", "once", "several", "unsure"],
                "type": "string"
              },
              "subject_attestation": {
                "const": true,
                "description": "Assert only if the person has confirmed they are 18 or older, this is their own non-emergency situation, and the result will not be used for diagnosis, regulated advice, or a high-impact decision about another person. Ask them if you have not. Do not assert this on assumption.",
                "type": "boolean"
              },
              "target_outcome": {
                "description": "Optional current-method comparison target for the counter-move. Supply together with prior_similar_episodes and counterexample.",
                "maxLength": 400,
                "minLength": 2,
                "type": "string"
              },
              "trigger": {
                "description": "One concrete situation supplied by the user, without an inferred diagnosis or hidden motive.",
                "maxLength": 900,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["counter_move", "first_response", "immediate_effect", "later_effect", "subject_attestation", "trigger"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "alternativeExplanation": {
                "type": ["string", "null"]
              },
              "attribution": {
                "type": "string"
              },
              "canonicalUrl": {
                "format": "uri",
                "type": "string"
              },
              "costBoundary": {
                "type": "string"
              },
              "disconfirmingObservation": {
                "type": ["string", "null"]
              },
              "evidenceBoundary": {
                "type": "string"
              },
              "executionBoundary": {
                "type": "string"
              },
              "highLeverageShift": {
                "type": ["string", "null"]
              },
              "methodVersion": {
                "type": "string"
              },
              "observationPlan": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "action": {
                      "type": "string"
                    },
                    "day": {
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    },
                    "focus": {
                      "type": "string"
                    }
                  },
                  "required": ["action", "day", "focus"],
                  "type": "object"
                },
                "type": "array"
              },
              "patternLoop": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "counterMove": {
                        "type": "string"
                      },
                      "firstResponse": {
                        "type": "string"
                      },
                      "immediateEffect": {
                        "type": "string"
                      },
                      "laterEffect": {
                        "type": "string"
                      },
                      "trigger": {
                        "type": "string"
                      }
                    },
                    "required": ["counterMove", "firstResponse", "immediateEffect", "laterEffect", "trigger"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "product": {
                "type": "string"
              },
              "provider": {
                "const": "Hemelion",
                "type": "string"
              },
              "recurrenceAudit": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "counterexample": {
                        "type": "string"
                      },
                      "counterexampleAvailable": {
                        "type": "boolean"
                      },
                      "priorSimilarEpisodes": {
                        "enum": ["none", "once", "several", "unsure"],
                        "type": "string"
                      },
                      "priorSimilarEpisodesLabel": {
                        "type": "string"
                      },
                      "targetOutcome": {
                        "type": "string"
                      }
                    },
                    "required": ["counterexample", "counterexampleAvailable", "priorSimilarEpisodes", "priorSimilarEpisodesLabel", "targetOutcome"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "scopeBoundary": {
                "type": "string"
              },
              "status": {
                "enum": ["completed", "outside_scope"],
                "type": "string"
              },
              "workingHypothesis": {
                "type": ["string", "null"]
              }
            },
            "required": ["alternativeExplanation", "attribution", "canonicalUrl", "costBoundary", "disconfirmingObservation", "evidenceBoundary", "executionBoundary", "highLeverageShift", "methodVersion", "observationPlan", "patternLoop", "product", "provider", "recurrenceAudit", "scopeBoundary", "status", "workingHypothesis"],
