          "description": "Enable site search & collections (kv → do-sqlite), one-way. Unlocks search_content, collection indexes, visitor /__paige/search, and moves any R2 form-submission ledger into SiteDb. 409 blocked: `reason` names the gate — unsupported source backend (never overridable); strictDrafts (default true; false skips it) on unpublished drafts or unrecovered KV rows; or an incomplete-looking KV snapshot (e.g. a page deleted minutes ago), the only gate force:true overrides. `audit` (+ `audit.warnings`) = aggregate counts, no row keys: judge the gap before forcing. Anything outside the frozen snapshot is unreachable afterwards.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Why you're calling this (activity log).",
                "minLength": 1,
                "type": "string"
              },
              "force": {
                "description": "Proceed past the incomplete-KV-snapshot 409 only — not the unsupported-backend or strictDrafts blocks, which force does nothing for. Read the blocked response's `reason` + `audit` first; the flip is one-way, so rows outside the snapshot are unreachable afterwards. Default false.",
                "type": "boolean"
              },
              "site": {
                "description": "Site slug, e.g. acme-studio",
                "type": "string"
              },
              "strictDrafts": {
                "description": "Block on unpublished drafts or unrecovered KV content rows (default true — publish/discard first, or pass false to proceed anyway).",
                "type": "boolean"
              }
