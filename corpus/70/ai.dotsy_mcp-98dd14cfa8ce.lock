        {
          "name": "batch_patch_content",
          "description": "patch_content on multiple keys; all-or-nothing validation. Preferred edit path for pages over 60KB. replace-string value/replace ≤60KB; whole call ≤80KB.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Why you're calling this (activity log).",
                "minLength": 1,
                "type": "string"
              },
              "guestToken": {
                "description": "Guest token from start_site (pgg_…). Omit when signed in with OAuth.",
                "minLength": 20,
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "ops": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "anchored": {
                            "type": "boolean"
                          },
                          "attrs": {
                            "additionalProperties": {
                              "type": "string"
                            },
                            "type": "object"
                          },
                          "expect": {
                            "minimum": 0,
                            "type": "integer"
                          },
                          "find": {
                            "minLength": 1,
                            "type": "string"
                          },
                          "name": {
                            "minLength": 1,
                            "type": "string"
