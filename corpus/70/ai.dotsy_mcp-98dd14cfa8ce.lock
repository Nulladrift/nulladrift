                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "description": "{trackerId or host:x.com: statistics|marketing|run}; run = don't hold; null removes.",
                    "type": ["object", "null"]
                  },
                  "look": {
                    "description": "{accent, accentText, text, bg, link (#hex or rgb()), font, radius e.g. 8px}.",
                    "type": ["object", "null"]
                  },
                  "mode": {
                    "description": "smart asks in the EEA, UK, CH, Québec, unknown country and GPC, elsewhere a notice that sets the cookie and offers Opt out; always asks everyone; off = your own cookie tool.",
                    "enum": ["always", "smart", "off"],
                    "type": "string"
                  },
                  "privacyUrl": {
                    "description": "/path or https:// link.",
                    "maxLength": 300,
                    "type": ["string", "null"]
                  },
                  "template": {
                    "description": "reset = restart from design; default = drop custom template.",
                    "enum": ["reset", "default"],
                    "type": "string"
                  },
                  "text": {
                    "description": "{headline ≤60, body ≤240 (must name dotsy, the host that sets the cookie), accept, reject, optOut ≤24}.",
                    "type": ["object", "null"]
                  },
                  "words": {
                    "additionalProperties": {
