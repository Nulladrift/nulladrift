                "description": "The site's main language, a code like \"en\" (invalid → 400 invalid_language). null removes every language setting. Takes effect at the next publish."
              },
              "editingMode": {
                "description": "How the editor's Save behaves. 'live' (default) publishes each save; 'staged' keeps drafts until publish_site. Prefer 'staged' when handing the editor to a person (start_edit_session → draftEditorUrl). API writes always stage.",
                "enum": ["live", "staged"],
                "type": "string"
              },
              "hreflang": {
                "description": "\"auto\" (default) tells search engines which pages are translations of each other; \"off\" stops that. Takes effect at the next publish.",
                "enum": ["auto", "off"],
                "type": "string"
              },
              "keyConvention": {
                "enum": ["flat", "directory"],
                "type": "string"
              },
              "languages": {
                "description": "The OTHER languages (not the main one); replaces the list. Needs a main language. Takes effect at the next publish.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "description": "Language code, for example \"es\" or \"pt-BR\".",
                      "maxLength": 35,
                      "minLength": 1,
                      "type": "string"
                    },
                    "image": {
                      "description": "Asset key of a flag or icon the switcher can show.",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "label": {
                      "description": "Name shown in the switcher (default: the language's own name).",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "prefix": {
                      "anyOf": [
                        {
                          "maxLength": 60,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Folder for this language, like \"/es\" (default \"/\" + code). null = no folder."
                    },
                    "publish": {
                      "description": "false hides this language from translation links, search alternates and the switcher; pages still serve. Default true.",
                      "type": "boolean"
                    }
                  },
                  "required": ["code"],
                  "type": "object"
                },
                "maxItems": 19,
                "type": "array"
              },
              "ownSeoFiles": {
                "description": "Use the site's own robots.txt and sitemap.xml even when they can hurt search: a robots.txt that blocks the whole site (Disallow: /), and a static sitemap.xml, which replaces the generated one (collection pages included). Off by default; a robots.txt without Disallow: / is always used. Takes effect at the next publish.",
                "type": "boolean"
              },
              "signature": {
                "additionalProperties": false,
                "description": "\"Made with dotsy\" signature badge. Takes effect on the live site immediately, no publish needed.",
                "properties": {
                  "enabled": {
                    "description": "Show the badge in a bottom corner of every published page.",
                    "type": "boolean"
                  },
                  "mark": {
                    "description": "Resting look: 'dot' (senna dot, default) or 'logo' (dotsy logo).",
                    "enum": ["logo", "dot"],
                    "type": "string"
                  },
                  "reveal": {
                    "description": "On hover: 'seal' (rotating stamp, default) or 'pill' (\"Made with dotsy\").",
                    "enum": ["pill", "seal"],
                    "type": "string"
                  },
                  "side": {
                    "description": "Preferred bottom corner: 'right' (default) or 'left'. If a chat bubble or bar covers it, the badge moves to the other corner, the bottom centre, or above the bar.",
                    "enum": ["right", "left"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "site": {
                "description": "Site slug, e.g. acme-studio",
                "type": "string"
              },
              "title": {
                "maxLength": 200,
                "type": "string"
              },
              "trailingSlash": {
                "description": "Page URL form. 'ignore' (default): /blog and /blog/ both serve the page. 'never': /blog/ 301s to /blog. 'always': /blog 301s to /blog/. The canonical tag and sitemap use the same form. Live immediately, no publish needed.",
                "enum": ["ignore", "never", "always"],
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
