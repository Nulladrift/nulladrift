      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Guest: start_site → guestToken on draft tools → claim_site (OAuth). Signed-in: OAuth Bearer on protected tools. One site slug per call; optional context (activity log). Writes stay draft until publish_site (handoff required; feedback optional). publicUrl is valid when liveReady; draft preview URL is start_edit_session.draftPreviewUrl (not draftUrl). Uploaded files show in the editor and draft preview at once and on the live site after the next publish. Bulk edits: apply_changeset with writes[].route or dotsy push — not loops of put_content/put_route. Page body >60KB: get_skill('large-content'). Page re-key: rename_content then publish_site. Page URL: rename_page (301). Site hostname: rename_site. After writes: get_site_tasks, then verify_page, before publish_site. Import/clone: get_skill('intake') and get_skill('clone'); preview before structure_*. Publish: get_draft_status (publish_confirm) + get_skill('verify'); rules on get_site.guidance / get_skill('guidance'). Block repeated on several pages: share_section; fragment syntax: get_skill('fragments'). Changes since your last session: get_activity; revert_change undoes one.",
      "tools": [
        {
          "name": "adapt_site_analyze",
          "description": "Propose nav wiring + blog collectionization for an imported mirror (draft, opt-in). Read-only; returns per-adapter reports + proposalEtag. Nav decline may include nextStep (e.g. mega-menu → edit fragments/header.html). Wait for mirror-vs-editable answer if requiredDecision pending.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adapters": {
                "description": "Which adapters to analyze (default: both).",
                "items": {
                  "enum": ["nav", "collection"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "context": {
                "description": "Why you're calling this (activity log).",
                "minLength": 1,
                "type": "string"
              },
              "full": {
                "description": "Return the full per-member harvest report (default: compacted for the token budget).",
                "type": "boolean"
              },
              "options": {
                "additionalProperties": false,
                "properties": {
                  "basePath": {
                    "description": "Index route path override, e.g. \"/blog\" (default: the index route).",
                    "minLength": 1,
                    "type": "string"
                  },
                  "fragment": {
                    "description": "Chrome fragment name the nav adapter reads (default \"header\").",
                    "pattern": "^[\\w-]+$",
                    "type": "string"
                  },
                  "index": {
                    "description": "Blog index content key (default: probe blog.html, posts.html, …).",
                    "minLength": 1,
                    "type": "string"
                  },
                  "menu": {
                    "description": "Menu name the nav adapter wires (default \"primary\").",
                    "minLength": 1,
                    "type": "string"
                  },
                  "pageSize": {
                    "description": "Explicit page size (default: visible card count).",
                    "maximum": 500,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "prefix": {
                    "description": "Member key prefix override, e.g. \"post/\" (default: detected from index card links).",
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "refreshProposal": {
                "description": "Replace an existing UNCONSUMED proposal (otherwise re-analyze 409s proposal_exists).",
                "type": "boolean"
              },
              "site": {
                "description": "Site slug, e.g. acme-studio",
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze nav and blog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:2d5723e93a3bd2f1d37cc4d6bff6da9160888706b60bf1039f6a9fca1d9b9d43"
        },
        {
          "name": "adapt_site_apply",
          "description": "Apply the adapt proposal (draft): wire nav into the menu store and/or rewrite the blog index to a live <dotsy-collection>. One undo covers the whole apply; a second apply is refused until adapt_site_revert (or force). Queued applies are polled to completion.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adapters": {
                "description": "Which analyzed adapters to apply.",
                "items": {
                  "enum": ["nav", "collection"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "context": {
                "description": "Why you're calling this (activity log).",
                "minLength": 1,
                "type": "string"
              },
              "dryRun": {
                "description": "Full computation, would-write set + previews, ZERO writes, no undo.",
                "type": "boolean"
              },
              "force": {
                "const": "discard-undo",
                "description": "An undo record from a prior apply exists (409 adapt_undo_exists): defer-discard it — the prior record is dropped only when this apply SUCCEEDS; a partial-failure rollback reinstates it. Prefer adapt revert first.",
                "type": "string"
              },
              "ifMatch": {
                "description": "The proposal etag from analyze (or GET …/adapt/proposal / status).",
                "minLength": 1,
                "type": "string"
              },
              "site": {
                "description": "Site slug, e.g. acme-studio",
                "type": "string"
              }
            },
            "required": ["adapters", "ifMatch", "site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Apply nav and blog changes"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
