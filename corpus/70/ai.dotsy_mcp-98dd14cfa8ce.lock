                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bodyBase64": {
                      "type": "string"
                    },
                    "bodySha256": {
                      "description": "Optional SHA-256 of the submitted upload bytes (decoded bodyBase64 or raw PUT body). Mismatch returns body_sha256_mismatch before any write. Response/get_asset sha256 is the stored blob (WebP after IMAGES optimization for rasters; unchanged for JS/CSS/SVG).",
                      "pattern": "^[a-f0-9]{64}$",
                      "type": "string"
                    },
                    "bodyText": {
                      "type": "string"
                    },
                    "contentType": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "importFromUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "intent": {
                      "enum": ["hero", "column", "inline", "logo"],
                      "type": "string"
                    },
                    "key": {
                      "description": "Path after /assets/ on the site — e.g. photos/hero.webp or style.css. Do not prefix with assets/ or /. Uploaded files are live in the editor and draft preview at once; the published site picks them up at the next publish.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "optimize": {
                      "description": "Default true: a JPEG, PNG or static GIF is re-encoded to WebP (key photo.jpg is stored as photo.webp, and /assets/photo.jpg still serves it). false stores the bytes exactly as sent, at the key given. Animated GIFs are always kept as sent.",
                      "type": "boolean"
                    },
                    "sitePath": {
                      "description": "Store at this exact site path instead of /assets/{key} — e.g. /.well-known/security.txt, /ads.txt, /favicon.ico. Send key OR sitePath.",
