        {
          "name": "bulk_put_assets",
          "description": "Upload 1–200 CMS assets; key = path after /assets/, or sitePath for an exact URL path (e.g. /ads.txt). Each item: exactly one of bodyBase64, bodyText (plain text for .css/.js/.mjs/.json/.svg/.txt/.xml only, not .html), or importFromUrl. Up to 5 MB per asset (10 MB paid); the 60KB page limit doesn't apply. Big files: importFromUrl or dotsy push. Optional bodySha256 checks sent bytes; response sha256 = stored bytes. JPEG/PNG/static GIF become WebP (key photo.webp; /assets/photo.jpg still serves it): use the response key in CSS/JS; optimize:false keeps your bytes; animated GIFs kept. Live in editor/preview at once; live site after next publish.",
          "inputSchema": {
