      "instructions": "Guest: start_site → guestToken on draft tools → claim_site. Signed-in: OAuth Bearer. One site slug per call; optional context (activity log). Writes stay draft until publish_site (handoff required; feedback optional). publicUrl works when liveReady; draft preview: start_edit_session.draftPreviewUrl (not draftUrl). Uploads are live after publish. Bulk edits: apply_changeset or dotsy push, not loops of put_content/put_route. Page body >60KB: get_skill('large-content'). Page re-key: rename_content then publish_site. Page URL: rename_page. Site hostname: rename_site. After writes: get_site_tasks, then verify_page, before publish_site. Import/clone: get_skill('intake'), get_skill('clone'); preview before structure_*. Publish: get_draft_status (publish_confirm) + get_skill('verify'); rules on get_site.guidance / get_skill('guidance'). Repeated block: share_section; fragment syntax: get_skill('fragments'). Popups, bars, newsletter boxes: get_skill('popups'), then put_popup. Cookie banner: update_site cookieBanner. Changes since last session: get_activity; revert_change undoes one. siteState: site state + next step. needs = values to ask the person; fill = values you fill from the result.",
      "tools": [
        {
          "name": "adapt_site_analyze",
          "description": "Propose nav wiring + blog collectionization for an imported mirror (draft, opt-in). Read-only; returns per-adapter reports + proposalEtag. Nav decline may include nextStep (e.g. mega-menu → edit fragments/header.html). Wait for mirror-vs-editable answer if requiredDecision pending.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adapters": {
                "description": "Which adapters to analyze (default: both).",
                "items": {
                  "enum": ["nav", "collection"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "context": {
                "description": "Why this call.",
                "minLength": 1,
                "type": "string"
              },
              "full": {
                "description": "Return the full per-member harvest report (default: compacted for the token budget).",
                "type": "boolean"
              },
              "options": {
                "additionalProperties": false,
                "properties": {
                  "basePath": {
                    "description": "Index route path override, e.g. \"/blog\" (default: the index route).",
                    "minLength": 1,
                    "type": "string"
                  },
                  "fragment": {
                    "description": "Chrome fragment name the nav adapter reads (default \"header\").",
                    "pattern": "^[\\w-]+$",
                    "type": "string"
                  },
                  "index": {
                    "description": "Blog index content key (default: probe blog.html, posts.html, …).",
                    "minLength": 1,
                    "type": "string"
                  },
                  "menu": {
                    "description": "Menu name the nav adapter wires (default \"primary\").",
                    "minLength": 1,
                    "type": "string"
                  },
                  "pageSize": {
                    "description": "Explicit page size (default: visible card count).",
                    "maximum": 500,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "prefix": {
                    "description": "Member key prefix override, e.g. \"post/\" (default: detected from index card links).",
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "refreshProposal": {
                "description": "Replace an existing UNCONSUMED proposal (otherwise re-analyze 409s proposal_exists).",
                "type": "boolean"
              },
              "site": {
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze nav and blog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:4ed2df0ee0911cca0ee15c4c3652dcac192746ebbb284240d92eb4aa4f34357f"
        },
        {
          "name": "adapt_site_apply",
          "description": "Apply the adapt proposal (draft): wire nav into the menu store and/or rewrite the blog index to a live <dotsy-collection>. One undo covers the whole apply; a second apply is refused until adapt_site_revert (or force). Queued applies are polled to completion.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adapters": {
                "description": "Which analyzed adapters to apply.",
                "items": {
                  "enum": ["nav", "collection"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "context": {
                "description": "Why this call.",
                "minLength": 1,
                "type": "string"
              },
              "dryRun": {
                "description": "Full computation, would-write set + previews, ZERO writes, no undo.",
                "type": "boolean"
              },
              "force": {
                "const": "discard-undo",
                "description": "An undo record from a prior apply exists (409 adapt_undo_exists): defer-discard it — the prior record is dropped only when this apply SUCCEEDS; a partial-failure rollback reinstates it. Prefer adapt revert first.",
                "type": "string"
              },
              "ifMatch": {
                "description": "The proposal etag from analyze (or GET …/adapt/proposal / status).",
                "minLength": 1,
                "type": "string"
              },
              "site": {
                "type": "string"
              }
            },
            "required": ["adapters", "ifMatch", "site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Apply nav and blog changes"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
