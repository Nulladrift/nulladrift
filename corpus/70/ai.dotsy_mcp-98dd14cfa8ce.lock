        {
          "name": "share_section",
          "description": "Share a repeated block, or move/hide a shared section. No arguments: lists blocks on 3+ pages (likeSection: matches a shared one). sourceKey + selector (selectors: a sibling run): dry run lists pages; dryRun:false shares it. name + suggestionId: put it on a suggestion's pages (after = through while remaining > 0). name + scope/hide/show: move to/from every page, or hide/show per page. too_many_pages: share with keys, again by the same name from a page with a copy; then name + scope every_page + keys (max-1 a call). Draft only (publish_site; undo: revert_change).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after": {
                "description": "Previous `through`.",
                "minLength": 1,
                "type": "string"
              },
              "context": {
                "description": "Why this call.",
                "minLength": 1,
                "type": "string"
              },
              "dryRun": {
                "default": true,
                "description": "Default true: report what would change and write nothing. false: stage the change as a draft (publish_site makes it live).",
                "type": "boolean"
              },
              "guestToken": {
                "description": "pgg_ guest token; omit when signed in.",
                "minLength": 20,
                "type": "string"
              },
              "hide": {
                "description": "every_page: pages to keep it off (they keep their copy). Send with the first move, never later.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "ifMatch": {
                "description": "The page's content hash (analyze's sourceEtag). If the page changed since, nothing is written.",
                "minLength": 1,
                "type": "string"
              },
              "keepLayout": {
                "description": "With selectors: wrapper gets style=\"display:contents\" so a flex/grid parent lays the run out as before. Default true.",
                "type": "boolean"
              },
              "keys": {
                "description": "Pages with an exact copy to share it on (analyze's matches.keys). Omit for every exact copy. The source page is always included.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "name": {
                "description": "New name (default: proposed), or the existing section to re-place or use.",
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              },
              "scope": {
                "description": "where_found: each page that has it gets a reference. every_page: one slot in the layout, at the top or bottom of the page content; pages listed in `hide` don't show it.",
                "enum": ["where_found", "every_page"],
                "type": "string"
              },
              "selector": {
                "description": "CSS selector of the element in the page's stored HTML (the editor's selector, or one checked with get_content?selector=). It must match exactly one element.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "selectors": {
                "description": "Instead of selector: a run of adjacent siblings in page order (each matches one element); one section, one wrapper.",
                "items": {
                  "maxLength": 2000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "show": {
                "description": "Pages that should show it again (removes their marker).",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "similar": {
                "description": "Pages with a similar copy (analyze's similar.keys) that take the shared version, losing their own wording. Default none.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "site": {
                "type": "string"
              },
              "sourceKey": {
                "description": "Content key of the page the element is on, e.g. 'about.html'.",
                "minLength": 1,
                "type": "string"
              },
              "suggestionId": {
                "description": "With name = likeSection: use that section on its pages.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "wrapTag": {
                "description": "With selectors: the wrapper. Default footer when the run ends the page content, else section.",
                "enum": ["div", "section", "footer", "header", "article", "aside"],
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Share a section"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:bcd7a6f4c93d07ff3b949e8dd92c4a026537729a90724dc38ec6265612580b5e"
