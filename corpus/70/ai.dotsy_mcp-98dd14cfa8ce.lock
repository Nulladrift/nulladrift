        {
          "name": "share_section",
          "description": "Make a block that repeats on several pages one shared section, or change where one shows. No arguments: lists blocks repeated on 3+ pages. sourceKey + selector (or selectors: a sibling run, one wrapper): a dry run finds every page with it; dryRun:false shares it. name + scope/hide/show: move an existing section to/from every page, or hide/show it per page. Over the per-call cap (too_many_pages, nothing written): share with keys, then again under the same name from a page that still has a copy; then move with name + scope every_page + keys (max-1 pages a call; all hide on the first) until all are moved. Always a draft (publish_site to go live; undo: revert_change).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Why you're calling this (activity log).",
                "minLength": 1,
                "type": "string"
              },
              "dryRun": {
                "default": true,
                "description": "Default true: report what would change and write nothing. false: stage the change as a draft (publish_site makes it live).",
                "type": "boolean"
              },
              "guestToken": {
                "description": "Guest token from start_site (pgg_…). Omit when signed in with OAuth.",
                "minLength": 20,
                "type": "string"
              },
              "hide": {
                "description": "every_page: pages that should not show it (they keep their own copy). Send them with the first move, never later.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "ifMatch": {
                "description": "The page's content hash (analyze's sourceEtag). If the page changed since, nothing is written.",
                "minLength": 1,
                "type": "string"
              },
              "keepLayout": {
                "description": "With selectors: wrapper gets style=\"display:contents\" so a flex/grid parent lays the run out as before. Default true.",
                "type": "boolean"
              },
              "keys": {
                "description": "Pages with an exact copy to share it on (analyze's matches.keys). Omit for every exact copy. The source page is always included.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "name": {
                "description": "With sourceKey + selector: the new section's name (default: proposed). Alone: the existing section to re-place.",
                "pattern": "^[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              },
              "scope": {
                "description": "where_found: each page that has it gets a reference. every_page: one slot in the layout, at the top or bottom of the page content; pages listed in `hide` don't show it.",
                "enum": ["where_found", "every_page"],
                "type": "string"
              },
              "selector": {
                "description": "CSS selector of the element in the page's stored HTML (the editor's selector, or one checked with get_content?selector=). It must match exactly one element.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "selectors": {
                "description": "Instead of selector: a run of elements next to each other in one parent, in page order (each matches one element). Shared as one section inside a wrapper, on the pages with the same run.",
                "items": {
                  "maxLength": 2000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "show": {
                "description": "Pages that should show it again (removes their marker).",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "similar": {
                "description": "Pages with a similar copy (analyze's similar.keys) that take the shared version, losing their own wording. Default none.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "site": {
                "description": "Site slug, e.g. acme-studio",
                "type": "string"
              },
              "sourceKey": {
                "description": "Content key of the page the element is on, e.g. 'about.html'.",
                "minLength": 1,
                "type": "string"
              },
              "wrapTag": {
                "description": "With selectors: the wrapper. Default footer when the run ends the page content, else section.",
                "enum": ["div", "section", "footer", "header", "article", "aside"],
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Share a section"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:695a38be988229ba27fbf4fe3e76d1deb6df8628ae56b61f49ebefea9e3e10d1"
        },
