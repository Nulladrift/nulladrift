        {
          "name": "batch_patch_content",
          "description": "patch_content on multiple keys; all-or-nothing validation. Preferred edit path for pages over 60KB. replace-string value/replace ≤60KB; whole call ≤80KB.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Why this call.",
                "minLength": 1,
                "type": "string"
              },
              "guestToken": {
                "description": "pgg_ guest token; omit when signed in.",
                "minLength": 20,
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "ops": {
                      "items": {
                        "additionalProperties": false,
