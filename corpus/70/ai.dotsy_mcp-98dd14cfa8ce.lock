        {
          "name": "bulk_put_assets",
          "description": "Upload 1–200 CMS assets; key = path after /assets/, or sitePath for an exact URL path (e.g. /.well-known/security.txt, /ads.txt). Each item: exactly one of bodyBase64, bodyText (plain text for .css/.js/.mjs/.json/.svg/.txt/.xml only — not .html pages), or importFromUrl. Optional bodySha256 checks the sent bytes; response sha256 = stored bytes (WebP may differ). JPEG/PNG/static GIF are re-encoded to WebP (response key photo.webp; /assets/photo.jpg keeps serving it) — use the response key in CSS/JS; optimize:false stores the bytes as sent at your key; animated GIFs are always kept. Live in the editor and draft preview at once; on the published site after the next publish.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Why you're calling this (activity log).",
