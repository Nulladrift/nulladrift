        {
          "name": "apply_changeset",
          "description": "Stage writes[] + deletes[] in one call; attach routes via writes[].route. writes[].ifMatch (hash from get_site_manifest; \"\" = must not exist) guards each key (a delete takes { key, ifMatch } too); atomic:true makes one stale key write nothing (409 changeset_conflict). At most 10 writes; each body ≤60KB and the call ≤80KB. Larger new pages: stage_content_chunk then writes[].bodyStaging, or dotsy push / PUT content-raw.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "atomic": {
                "description": "All or nothing: every writes[].ifMatch and deletes[].ifMatch is checked before anything is written. One stale key writes nothing and the call fails with 409 changeset_conflict listing `conflicts`. Default: a stale write is skipped and listed, the rest apply.",
                "type": "boolean"
              },
              "context": {
                "description": "Why you're calling this (activity log).",
                "minLength": 1,
                "type": "string"
              },
              "deletes": {
                "default": [],
                "description": "Keys to delete: a key, or { key, ifMatch } (the hash you read) so a page changed since is not deleted (listed in conflicts).",
                "items": {
                  "anyOf": [
                    {
                      "minLength": 1,
                      "type": "string"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "ifMatch": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "key": {
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["ifMatch", "key"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 50,
                "type": "array"
              },
              "guestToken": {
                "description": "Guest token from start_site (pgg_…). Omit when signed in with OAuth.",
                "minLength": 20,
                "type": "string"
              },
              "message": {
                "maxLength": 2000,
                "type": "string"
              },
              "site": {
                "description": "Site slug, e.g. acme-studio",
                "type": "string"
              },
              "writes": {
                "default": [],
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "body": {
                      "type": "string"
                    },
                    "bodyStaging": {
                      "pattern": "^stg_[a-zA-Z0-9_-]+$",
                      "type": "string"
                    },
                    "contentType": {
                      "type": "string"
                    },
                    "ifMatch": {
                      "type": "string"
                    },
                    "key": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "menuItems": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "attrs": {
                            "additionalProperties": {
                              "type": "string"
                            },
                            "type": "object"
                          },
                          "childShell": {
                            "type": ["string", "null"]
                          },
                          "childTemplate": {
                            "type": "string"
                          },
                          "data": {
                            "additionalProperties": {
                              "type": "string"
                            },
                            "type": "object"
                          },
                          "html": {
                            "type": "string"
                          },
                          "id": {
                            "minLength": 1,
                            "type": "string"
                          },
                          "kind": {
                            "enum": ["page", "url", "anchor", "mailto", "group"],
                            "type": "string"
                          },
                          "label": {
                            "minLength": 1,
                            "type": "string"
                          },
                          "menu": {
                            "minLength": 1,
                            "type": "string"
                          },
                          "newTab": {
                            "default": false,
                            "type": "boolean"
                          },
                          "parent": {
                            "type": ["string", "null"]
                          },
                          "ref": {
                            "type": "string"
                          },
                          "sort": {
                            "type": "integer"
                          }
                        },
                        "required": ["kind", "label", "menu", "parent", "ref", "sort"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "route": {
                      "additionalProperties": false,
                      "properties": {
                        "input": {
                          "additionalProperties": false,
                          "properties": {
                            "contentKey": {
                              "anyOf": [
                                {
                                  "minLength": 1,
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "Explicit content key (default: path-derived). null restores the default (undoes a prior set on PATCH)."
                            },
                            "experiment": {
                              "anyOf": [
                                {
                                  "additionalProperties": false,
                                  "properties": {
                                    "changeNote": {
                                      "description": "One line on what the variant changes (0.56e M2); kept so route PATCH round-trips don't strip it.",
                                      "maxLength": 120,
                                      "type": "string"
                                    },
                                    "endedAt": {
                                      "type": "string"
                                    },
                                    "goalId": {
                                      "description": "Optional dotsy conversion goal; omit when tracking in external analytics.",
                                      "minLength": 1,
                                      "type": "string"
                                    },
                                    "handsOff": {
                                      "description": "Hands-off mode (0.56e M4): the daily sweep may auto-promote a ≥95% winner or auto-end keep-A after 30 days. Prefer start_test; kept so route PATCH round-trips don't strip it.",
                                      "type": "boolean"
                                    },
                                    "hypothesis": {
                                      "maxLength": 200,
                                      "type": "string"
                                    },
                                    "id": {
                                      "description": "Stable experiment slug — cookie namespace; unique per site forever.",
                                      "pattern": "^[a-z0-9-]+$",
                                      "type": "string"
                                    },
                                    "name": {
                                      "maxLength": 80,
                                      "minLength": 1,
                                      "type": "string"
                                    },
                                    "startedAt": {
                                      "type": "string"
                                    },
                                    "status": {
                                      "enum": ["draft", "running", "ended"],
                                      "type": "string"
                                    },
                                    "variants": {
                                      "items": {
                                        "additionalProperties": false,
                                        "properties": {
                                          "contentKey": {
                                            "description": "Published body key (may be routeless).",
                                            "minLength": 1,
                                            "type": "string"
                                          },
                                          "id": {
                                            "description": "Variant arm id — default \"a\" / \"b\" on create.",
                                            "pattern": "^[a-z0-9-]+$",
                                            "type": "string"
                                          },
                                          "label": {
                                            "maxLength": 80,
                                            "type": "string"
                                          },
                                          "weight": {
                                            "maximum": 100,
                                            "minimum": 0,
                                            "type": "integer"
                                          }
                                        },
                                        "required": ["contentKey", "id", "weight"],
                                        "type": "object"
                                      },
                                      "maxItems": 3,
                                      "minItems": 2,
                                      "type": "array"
                                    }
                                  },
                                  "required": ["id", "name", "status", "variants"],
                                  "type": "object"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "lang": {
                              "description": "Page language, e.g. \"es\", \"pt-BR\". null clears (folder or main language applies).",
                              "type": ["string", "null"]
                            },
                            "layout": {
                              "description": "Layout NAME, bare (\"default\" for layouts/default.html), not the file key. Must already exist (400 layout_not_found). null removes it.",
                              "type": ["string", "null"]
                            },
                            "noindex": {
                              "description": "Exclude from sitemap/RSS; inject noindex meta (0.69).",
                              "type": ["boolean", "null"]
                            },
                            "preserveQuery": {
                              "description": "Append the visitor's query string to the redirect target (default true on a redirect). null clears the override.",
                              "type": ["boolean", "null"]
                            },
                            "purpose": {
                              "type": ["string", "null"]
                            },
                            "redirectStatus": {
                              "anyOf": [
                                {
                                  "enum": [301, 302, 308],
                                  "type": "number"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "301 permanent / 302 or 308 temporary (default 301 on a redirect). null clears an explicit override."
                            },
                            "redirectTo": {
                              "anyOf": [
                                {
                                  "minLength": 1,
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "Root-relative redirect target (/…). Required when purpose is \"redirect\"; null clears it once purpose is no longer \"redirect\"."
                            },
                            "title": {
                              "type": ["string", "null"]
                            },
                            "translationKey": {
                              "anyOf": [
                                {
                                  "maxLength": 100,
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "Pages sharing a key are translations of each other. null clears."
                            },
                            "vars": {
                              "anyOf": [
                                {
                                  "additionalProperties": {
                                    "type": "string"
                                  },
                                  "type": "object"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            }
                          },
                          "type": "object"
                        },
                        "path": {
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["input", "path"],
                      "type": "object"
                    }
                  },
                  "required": ["key"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Apply changeset"
          },
