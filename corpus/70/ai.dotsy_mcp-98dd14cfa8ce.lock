                "minLength": 1,
                "type": "string"
              },
              "cookieBanner": {
                "additionalProperties": false,
                "description": "Send only what changes; null resets a field. Relay `issues` as written; Reject stays a full same-size button.",
                "properties": {
                  "alsoAskIn": {
                    "description": "Extra places [\"BR\",\"US-CA\"]; replaces the list.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  },
                  "css": {
                    "description": "Banner CSS (the template's style block); null clears.",
                    "type": ["string", "null"]
