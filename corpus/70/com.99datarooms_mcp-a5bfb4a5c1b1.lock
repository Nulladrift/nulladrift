      },
      "instructions": "This is the PUBLIC 99 Data Rooms server. It answers questions about the product (pricing, glossary, published pages) and has NO access to any account, data room or document. If you were connected here expecting to reach someone's rooms or files, the wrong URL was used: the authenticated server is https://mcp.99datarooms.com/authed-mcp and it will ask them to sign in. Say so rather than reporting that their rooms are empty.",
      "tools": [
