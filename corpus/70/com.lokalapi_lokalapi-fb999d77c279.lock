{
  "lockfileVersion": 2,
  "subjects": {
    "com.lokalapi/lokalapi": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.lokalapi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lokalapi",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "kbli_convert",
          "description": "Convert a KBLI 2020 business code to its KBLI 2025 equivalent(s) using the official BPS conversion table (2026). Flags one-to-many splits. Needed to update OSS/NIB licences after the June 2026 switch. Costs $0.02 per call (x402, USDC on Base; see lokalapi_info).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "5-digit KBLI 2020 code, e.g. '63122'",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b27a1d7b37336696ff483f6b02a597c08655cb2095d9b7fd3eff691356fa1eae"
        },
        {
          "name": "kbli_convert_batch",
          "description": "Convert up to 50 KBLI 2020 business codes to KBLI 2025 in one call (official BPS conversion table, 2026), e.g. all codes of a company's OSS/NIB licence. Per code: status one_to_one, split, merged, not_found or invalid, the KBLI 2025 candidates, and needs_review with the reason; plus a summary. format=csv returns a spreadsheet. Charged only if at least one code converts. Costs $0.50 per call (x402, USDC on Base; see lokalapi_info).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "codes": {
                "description": "KBLI 2020 codes (5 digits), at most 50 unique, e.g. ['62019', '46900']",
                "items": {
                  "maxLength": 32,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "format": {
                "description": "csv: one line per old -> new code pair (default json)",
                "enum": ["json", "csv"],
                "type": "string"
              }
            },
            "required": ["codes"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d90759eab8809fb7df5dbcc443500e8fb7bb49d2d461e4d3e276b56b7f8ab93e"
        },
        {
          "name": "kbli_search",
          "description": "Find the right KBLI 2025 business classification code (5-digit, mandatory in Indonesia's OSS business licensing since 15 June 2026) from a free-text business activity in Indonesian or English. Returns official BPS titles, descriptions and hierarchy. Costs $0.02 per call (x402, USDC on Base; see lokalapi_info).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "level": {
                "description": "Classification level (default kelompok = 5-digit code)",
                "enum": ["kelompok", "subgolongan", "golongan", "golongan_pokok", "kategori"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (1-25, default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Business activity, e.g. 'kafe', 'software development', 'nickel mining', or a KBLI code",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:84138506c904a8045a41b00f033223c92302350a612ee7ffa78c245180b6f6f4"
        },
        {
          "name": "lokalapi_info",
          "description": "Free. Explains the paid tools, prices and how an agent pays per call via x402 (USDC on Base). Call this first.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:aa162367ba62276da30f39c8d8499646c8bb86a9907e2020090f14b0868c50af"
        },
        {
          "name": "wilayah_get",
          "description": "Resolve an official Indonesian region code (Kemendagri 2025, e.g. '34.71' or '34.04.12.2001') to its name, type and full administrative hierarchy. Costs $0.002 per call (x402, USDC on Base; see lokalapi_info).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "kode": {
                "description": "Region code, e.g. '34.71'",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["kode"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:171793e707707b8fabf4d9dc8641c5b115daa6f24944104273dceca1be47ec12"
        },
        {
          "name": "wilayah_search",
          "description": "Search official Indonesian administrative regions (province, regency/city, district, village) by name and get the official Kemendagri 2025 code plus full hierarchy. Handles 'Kab.', 'Kota', 'Kec.' prefixes. Costs $0.005 per call (x402, USDC on Base; see lokalapi_info).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "level": {
                "enum": ["provinsi", "kabupaten_kota", "kecamatan", "desa_kelurahan"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (1-25, default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "parent": {
                "description": "Restrict to children of this code, e.g. '34.04'",
                "type": "string"
              },
              "q": {
                "description": "Region name, e.g. 'Sleman', 'Kota Yogyakarta', 'Sinduharjo'",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:51abfe88c20deea4d94d6b2da149684ba68df07ebde370817ef50c32213a9e75"
        }
      ],
      "digest": "sha256:cbc90ddbe559fa6c41a563c19cd28456cec901d6b935492af1940e16842dec4f"
    }
  }
}
