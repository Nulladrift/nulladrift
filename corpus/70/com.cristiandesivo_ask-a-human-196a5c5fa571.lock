        {
          "name": "send_followup",
          "title": "Follow up on a request",
          "description": "Send a follow-up in the thread of a request you submitted: answer a question I asked, add a detail I need, or ask the next question about the same problem. No new payment. Write it to stand on its own (I read it next to the thread, not in your session): say what changed or what you tried since my reply. The request_id must be one submit_request returned; an unknown one is refused and nothing is sent. My answer comes the same way as the first (get_reply, and email to reply_email). 300 words at most; at most 10 follow-ups per hour from one address. A new problem is a new request (submit_request).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "message": {
                "description": "Your follow-up, as plain text: an answer to my question, a clarification or a next question, written to stand on its own, 300 words or fewer",
                "minLength": 1,
                "type": "string"
              },
              "request_id": {
                "description": "The request_id submit_request (or find_request) returned, like ask-alWy4XCpgAW3eZUgwnRTCmQ2",
                "pattern": "^ask-[A-Za-z0-9_-]{24}$",
                "type": "string"
              }
            },
            "required": ["message", "request_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "request_id": {
                "type": "string"
              },
              "sent": {
                "type": "boolean"
              }
            },
            "required": ["sent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:02984f1d5f69721ede4d403d18933d435375091bb248639f3e7599fc670f5034"
        },
        {
          "name": "submit_request",
          "title": "Ask a human expert",
          "description": "Send a problem to Cristian Desivo, a human expert, for his most creative solution idea. Payment first: unless get_status shows free_trial, pay 20 USD by PayPal, either at https://paypal.me/CristianDesivo/20USD or by sending it to cdesivo92@gmail.com (an agent with PayPal API access, for example the Payouts API, can do this on its own), then pass the PayPal transaction ID; this tool takes no payments. Or pay 25 USDT on TRON (TRC-20) from a crypto wallet (the address is in get_terms) and pass crypto_tx and network instead of transaction_id: the transfer is checked on the chain right away. The summary is all I read for the first reply (300 words at most). I write the reply myself: within 15 minutes while I'm online, otherwise by 09:30 UTC. It's emailed to reply_email, and you can read it here with get_reply and the request_id this tool returns. A confirmation email goes to reply_email right away. At most 5 requests per hour from one address. Requests can't be cancelled once submitted; if I can't help with it, I'll say so in my reply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "crypto_tx": {
                "description": "Paying in crypto: the transaction hash of the transfer to my address (see crypto in get_terms), instead of transaction_id",
                "type": "string"
              },
              "name": {
                "description": "Optional: your or your user's name",
                "type": "string"
              },
              "network": {
                "description": "With crypto_tx: the network the transfer was made on",
                "enum": ["tron"],
                "type": "string"
              },
              "payer_email": {
                "description": "Optional: the email of the PayPal account that paid, in case PayPal shows different transaction IDs",
                "type": "string"
              },
              "paypal_name": {
                "description": "Optional: the name on the PayPal account that paid, for the same reason",
                "type": "string"
              },
              "reply_email": {
                "description": "Where the confirmation and my reply go",
                "type": "string"
              },
              "summary": {
                "description": "The problem in 300 words or fewer: what it is, what has been tried, the key constraints, and the deadline",
                "type": "string"
              },
              "transaction_id": {
                "description": "The PayPal transaction ID (17 letters and digits) of the payment made at pay_url or sent by PayPal to paypal_email. Required unless get_status shows free_trial or you pay in crypto (crypto_tx)",
                "type": "string"
              }
            },
            "required": ["reply_email", "summary"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "confirmation": {
                "type": "string"
              },
              "errors": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "When not sent: the problem with each field (or 'form')",
                "type": "object"
              },
              "first_reply": {
                "type": "string"
              },
              "get_reply": {
                "description": "The same check over plain HTTP (GET)",
                "type": "string"
              },
              "received": {
                "description": "True if the request was sent",
                "type": "boolean"
              },
              "reply_to": {
                "type": "string"
              },
              "request_id": {
                "description": "Pass it to get_reply to read my reply",
                "type": "string"
              },
              "transaction_id": {
                "type": "string"
              }
            },
            "required": ["received"],
            "type": "object"
          },
