        "type": "http",
        "url": "https://cristiandesivo.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "ask-a-human",
        "title": "Ask a human expert: Cristian Desivo",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Ask a human expert: Cristian Desivo (mathematics and computer science, 10 years of experience) reads the summary of a problem you or your user are stuck on and replies himself, by email, with his most creative solution idea. 20 USD per request, paid by PayPal before you submit (unless get_status shows free_trial): at the link in get_terms, or sent to cdesivo92@gmail.com, which an agent with PayPal API access (for example the Payouts API) can do on its own. Or pay 25 USDT on TRON (TRC-20) from a crypto wallet (the address is in get_terms) and pass crypto_tx and network instead of transaction_id: the transfer is checked on the chain right away. Steps: get_status, get_terms, then submit_request with the payment's transaction ID, a reply email and a summary of up to 300 words. submit_request returns a request_id: call get_reply with it to read my reply here once I've written it (it's also emailed to the reply email), and send_followup to continue in the same thread at no extra cost; if you lose the request_id, find_request gives it back from the payment's transaction ID and the reply email. Requests can't be cancelled once submitted; if I can't help with it, I'll say so in my reply. Reviews from past clients: https://www.freelancer.com/u/cdesivo92 (more in credentials, in get_terms). The offer as a page: https://cristiandesivo.com/ask/",
      "tools": [
        {
          "name": "find_request",
          "title": "Recover a request_id",
          "description": "Lost the request_id of a request you submitted? Give the payment's transaction ID (PayPal ID or crypto hash) and the reply_email you used, and get the request_id back for get_reply and send_followup. Both must match the same request: if either doesn't, the answer is found: false, without saying which one was wrong. Case and spacing in the transaction ID don't matter. It's also in the confirmation email. At most 20 lookups per hour from one address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "reply_email": {
                "description": "The reply_email you submitted the request with",
                "type": "string"
              },
              "transaction_id": {
                "description": "The payment's transaction ID: the PayPal ID, or the crypto hash you passed as crypto_tx",
                "type": "string"
              }
            },
            "required": ["reply_email", "transaction_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "get_reply": {
                "type": "string"
              },
              "request_id": {
                "type": "string"
              }
            },
            "required": ["found"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:caf97d75f4db5549348bc9193709f75e124a51c4a8ac7e87f124721d63753b7c"
        },
        {
          "name": "get_reply",
          "title": "Read my reply",
          "description": "My reply to a request you submitted, by the request_id submit_request returned (ask- followed by 24 letters, digits, - or _). status is 'waiting' until I've replied, with a note saying when to expect it, then 'replied' with the text, oldest first; later replies in the same thread are included. Check every few minutes, not in a tight loop: at most 120 checks per hour from one address. A malformed request_id is an error; a well-formed one I haven't answered yet is just 'waiting'. If you lost the request_id, use find_request; to reply to my answer, use send_followup. The same reply is also emailed to reply_email.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request_id": {
                "description": "The request_id submit_request (or find_request) returned, like ask-alWy4XCpgAW3eZUgwnRTCmQ2",
                "pattern": "^ask-[A-Za-z0-9_-]{24}$",
                "type": "string"
              }
            },
            "required": ["request_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "replies": {
                "items": {
                  "properties": {
                    "sent_at_utc": {
                      "type": ["string", "null"]
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "request_id": {
                "type": "string"
              },
              "status": {
                "enum": ["waiting", "replied"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d18699ca0000cb13bee9ecef5c2df13ed788a12b23d5f3499b17839ee93b68f"
        },
        {
          "name": "get_status",
          "title": "Online status",
          "description": "Whether I'm online right now (first reply within 15 minutes) or when I'm back (next_online_utc), whether requests are paused, and whether you've been awarded a free trial right now (then no payment or transaction_id is needed). Changes over time: call it right before paying and submitting, so you don't pay while requests are paused, and to know when to expect the reply. For the price, how to pay and what you get, use get_terms; to check on a request already sent, use get_reply.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checked_at_utc": {
                "type": "string"
              },
              "first_reply": {
                "description": "When the first reply comes if you submit now",
                "type": "string"
              },
              "free_trial": {
                "description": "You've been awarded a free trial: no payment, no transaction_id",
                "type": "boolean"
              },
              "next_online_utc": {
                "description": "When offline: when I'm back",
                "type": ["string", "null"]
              },
              "note": {
                "type": "string"
              },
              "online": {
                "description": "Online now: first reply within 15 minutes",
                "type": "boolean"
              },
              "paused": {
                "description": "Not taking requests right now",
                "type": "boolean"
              }
            },
            "required": ["checked_at_utc", "first_reply", "free_trial", "next_online_utc", "note", "online", "paused"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:22fa23ace49e8325f3cb61e9c110ceda8b0e8f53efd879c9f94e5beca27a5366"
        },
        {
          "name": "get_terms",
          "title": "Offer terms",
          "description": "The offer's full terms, in English: who answers, what you get, the price, hours, when first replies come, the PayPal pay_url, the crypto option (25 USD in stablecoins, with my wallet addresses), how to submit a request, and my track record (where to read reviews from past clients, and case studies with summaries), and an example request with the kind of reply you get. Use it once, before your first submit_request: to decide whether this fits your problem and to learn how to pay. The terms rarely change, so there's no need to call it again in the same session. Not for live availability: whether I'm online now, paused or offering a free trial comes from get_status. Not needed for follow-ups or replies (send_followup, get_reply).",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "background": {
                "type": "string"
              },
              "cancellation": {
                "type": "string"
              },
              "credentials": {
                "description": "Track record: where to read reviews from past clients, and past work with one-line summaries",
                "type": "object"
