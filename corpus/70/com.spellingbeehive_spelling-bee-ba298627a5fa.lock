      "capabilities": {
        "logging": {},
        "prompts": {},
        "tools": {}
      },
      "instructions": "Spelling Bee Hive (spellingbeehive.com) is a free spelling bee practice site. Use look_up_word to check how a word is spelled, pronounced and used; practice_words to quiz a speller on words from difficulty level 1 (early elementary) to 9 (national-final difficulty); and winning_words, words_of_the_year and trending_words for well-known word lists. When quizzing, say the word and use it in a sentence, but do not show its spelling until the speller has answered. Share the word page and audio links so learners can hear each word.",
      "tools": [
        {
          "name": "look_up_word",
          "title": "Look up a word",
          "description": "Look up an English word in Spelling Bee Hive's catalogue of more than a hundred thousand words: its correct spelling, a pronunciation guide, part of speech, language of origin, definitions and an example sentence, its Spelling Bee Hive difficulty level and practice set, and any spelling bee it was a winning word in. Includes links to the word's page and a recording of it. Use it to check a spelling, or for the clues a speller may ask for in a bee.",
          "inputSchema": {
            "properties": {
              "word": {
                "description": "The word to look up, for example \"accommodate\" or \"bromocriptine\".",
                "type": "string"
              }
            },
            "required": ["word"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "audio": {
                "type": ["string", "null"]
              },
              "definitions": {
                "items": {
                  "type": "string"
                },
