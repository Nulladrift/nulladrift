        "name": "spelling-bee-hive",
        "title": "Spelling Bee Hive",
        "version": "1.0.0",
        "description": "Spellings, pronunciations, definitions and spelling bee practice words from spellingbeehive.com.",
        "websiteUrl": "https://www.spellingbeehive.com/spelling-bee-mcp"
