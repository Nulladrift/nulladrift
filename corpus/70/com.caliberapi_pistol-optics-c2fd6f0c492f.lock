      "transport": {
        "type": "http",
        "url": "https://mcp.caliberapi.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "caliberapi",
        "title": "CaliberAPI",
        "version": "1.0.0",
        "websiteUrl": "https://caliberapi.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_fit",
          "title": "Check pistol and optic fit",
          "description": "Answer whether a specific red dot optic fits a specific pistol, from source-cited data. Returns fit \"direct\" (mounts on the slide cut, with the footprint), \"adapter\" (only through the adapter plate chain in via, with plate maker, model, mount and presented footprints, and plate sources), or \"unknown\" (no cited fit in the dataset, which is not evidence it does not fit). Returns \"needs_clarification\" with candidates when a name is ambiguous; call again with a candidate slug. Report the answer exactly as returned: never call an adapter fit a direct fit, and never turn \"unknown\" into \"does not fit\". Cite with the returned citation line and link html_url.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "optic": {
                "description": "Optic slug (e.g. \"trijicon/rmr-type-2\") or name (e.g. \"Trijicon RMR Type 2\").",
                "minLength": 1,
                "type": "string"
              },
              "pistol": {
                "description": "Pistol slug (e.g. \"taurus/g3-toro\") or name (e.g. \"Taurus G3 TORO\").",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["optic", "pistol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check pistol and optic fit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72ae5218b0d861309c350a097b69eac4a50dca0c27cda6569ddf5d29fbe1e19a"
        },
        {
          "name": "get_footprint",
          "title": "Get an optic footprint",
          "description": "Describe one optic mounting footprint or plate system (for example RMR, RMSc, ACRO, DPP, Glock MOS): screw and recoil lug counts, the optics that use it, the pistols cut for it directly, and the adapter plates that mount or present it, with sources.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name_or_slug": {
                "description": "Footprint slug (e.g. \"rmsc\") or name (e.g. \"RMSc\", \"Glock MOS\").",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name_or_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an optic footprint"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd7ffafc5e9bb5c4996859b4273804355996eaf7269d68bbe3a0886cd44d9c2e"
        },
        {
          "name": "list_optics_for_pistol",
          "title": "List optics for a pistol",
          "description": "List every optic with a cited fit on one pistol, each marked direct (with footprint) or adapter (with the plate chain in via). Use it for questions like \"what red dots fit my pistol\". Optics not listed have no cited fit, which is not evidence they do not fit. Report the answer exactly as returned: never call an adapter fit a direct fit, and never turn \"unknown\" into \"does not fit\". Cite with the returned citation line and link html_url.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "fit": {
                "default": "any",
                "description": "Only direct fits, only adapter-plate fits, or both (default).",
                "enum": ["direct", "adapter", "any"],
                "type": "string"
              },
              "pistol": {
                "description": "Pistol slug (e.g. \"taurus/g3-toro\") or name (e.g. \"Taurus G3 TORO\").",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["pistol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List optics for a pistol"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b30d41c67a36ada88fb443b8410945ec7085ae14d1560bb1459366304bbd5d9"
        },
        {
          "name": "list_pistols_for_optic",
          "title": "List pistols for an optic",
          "description": "List every pistol with a cited fit for one optic, each marked direct (with footprint) or adapter (with the plate chain in via). Use it for questions like \"what pistols take this red dot\". Report the answer exactly as returned: never call an adapter fit a direct fit, and never turn \"unknown\" into \"does not fit\". Cite with the returned citation line and link html_url.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "optic": {
                "description": "Optic slug (e.g. \"trijicon/rmr-type-2\") or name (e.g. \"Trijicon RMR Type 2\").",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["optic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List pistols for an optic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5eb93fa36e7bf19416a6b0e12d7344e93d3a36c8eb8535ab3b0a327c8235ec31"
        },
        {
          "name": "search",
          "title": "Search the dataset",
          "description": "Find pistols, optics and footprints by name. Returns slugs, names and page URLs to pass to the other tools. Use it when you are unsure of an exact model name.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Words to match, e.g. \"glock 19\", \"holosun 507\", \"rmr\".",
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Limit results to one kind of record.",
                "enum": ["pistols", "optics", "footprints"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the dataset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9cbeeee08c6c46e2720a339d00138f63e37fcd792010ac176624c6f8fb335918"
        }
      ],
