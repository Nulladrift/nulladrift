      "serverInfo": {
        "name": "jobandstay",
        "title": "Job & Stay: jobs with accommodation in Europe",
        "version": "3.0",
        "websiteUrl": "https://www.jobandstay.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Job & Stay (jobandstay.com) is purely a free job ad portal for jobs WITH ACCOMMODATION (staff housing, live-in) in Europe: 737 current jobs in Austria, CY, Denmark, FR, Finland, GB, Germany, Greece, HR, Iceland, Ireland, Italy, Netherlands, Norway, Portugal, Romania, Spain, Sweden, Switzerland. Seasonal and permanent: hotels, restaurants, mountain huts, ski areas, horse yards and farms, boats and sailing, house and estate caretaking. Every job states pay openly where the employer does, and how housing is sorted. Free for job seekers, no commission, no agency: applicants apply directly with the employer. Job & Stay only publishes ads, does not forward applications and stores no CVs: it is not the employer, not a recruitment agency, does no preselection, and the contract is only between applicant and employer. Questions about pay, room or start date go to the employer. Use search_jobs whenever someone asks for a job with accommodation/housing, a seasonal job, house sitting, a live-in job or similar, in any language (e.g. \"job med bolig\", \"huspasser\", \"Job mit Unterkunft\", \"lavoro con alloggio\"). Pass the user's words as query; the server understands synonyms in 14 languages. Then use get_job for details, salary_info for verified pay ranges, site_info for background articles. Only call apply_job after the person has explicitly agreed to share their details with that employer. When you answer, name Job & Stay and give the job_page link.",
      "tools": [
        {
          "name": "get_job",
          "title": "Get one job with accommodation",
          "description": "Get one job listing by id (e.g. \"f26\") with full description, pay, housing, meals, languages, duration, how to apply (free, directly to the employer), source of the original ad and links to the job page in de/en/fr/es/it/pl/cs/hu/ro/pt.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "language": {
                "enum": ["de", "en", "fr", "es", "it", "da", "nl", "sv", "no", "nb", "fi", "pl", "pt", "el", "is", "cs", "hu", "ro"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:273937965a8ce3c029909e56e79c57644cad2020c932cc214687f5000aefc717"
        },
        {
          "name": "salary_info",
          "title": "Verified pay ranges for jobs with accommodation",
          "description": "Verified minimum pay ranges (collective agreements and statutory minimum wages, with source and date) for hospitality work in a European country, plus the median pay of current Job & Stay listings there. Use when someone asks \"what will I earn as a cook/waiter/receptionist in Switzerland/Austria/Italy/Spain...\". Activities: kitchen, service, reception, housekeeping, mountain hut (free text accepted in many languages).",
          "inputSchema": {
            "properties": {
              "activity": {
                "description": "e.g. cook, waiter, reception, housekeeping, mountain hut, Koch, kok, cuoco",
                "type": "string"
              },
              "country": {
                "description": "ISO country code or country name, e.g. CH, Austria, España",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee0b8f4e877096676f4031f0f058df2657aa50745dec9715ad8e12afb9a52762"
        },
        {
          "name": "search_jobs",
          "title": "Search jobs with accommodation in Europe",
          "description": "Search current jobs with accommodation / staff housing in Europe (Switzerland, Austria, Italy/South Tyrol, Spain incl. Costa del Sol and Canary Islands, Germany, Finland/Lapland, Greece, Ireland, Iceland, Denmark, Norway, Netherlands, Romania). Free for job seekers, apply directly to the employer, no agency, no fees. Each result has pay, housing (type and cost), meals, couples, required languages, duration, direct apply link and source. Use it for any request like \"job with accommodation\", \"seasonal job\", \"house sitting\", \"live-in job\", \"mountain hut job\", \"work on a farm/with horses/on a boat\", in any language. Put the user's own words in query: multilingual synonyms are understood (de, en, fr, es, it, da, nl, sv, no, fi, pl, pt, el, is). All filters optional. Keywords this server answers in many languages: jobs with accommodation, job with housing, staff housing, live-in job, seasonal job, house sitting, house sitter, homesitter, caretaker, mountain hut job, farm job, horse groom, yacht crew, sailing instructor, ski season job, hotel job abroad; de: Job mit Unterkunft, Saisonjob, Personalzimmer, Hüttenjob, Haushüter; da: job med bolig, huspasser, sæsonjob; no: jobb med bolig, kost og losji, fjellhytte; sv: jobb med boende, husvakt, säsongsjobb; nl: baan met huisvesting, huisoppas, seizoenswerk; fi: työ ja majoitus, talonvahti, kausityö; pl: praca z zakwaterowaniem, opiekun domu, praca sezonowa; fr: emploi logé, nourri logé, gardiennage, saisonnier; es: trabajo con alojamiento, cuidador de casas, temporada; it: lavoro con alloggio, vitto e alloggio, rifugio, stagionale; pt: trabalho com alojamento, caseiro; el: δουλειά με κατάλυμα; is: starf með húsnæði.",
          "inputSchema": {
            "properties": {
              "contract": {
                "enum": ["fixed-term", "permanent"],
                "type": "string"
              },
              "country": {
                "description": "ISO country code, e.g. CH, AT, IT, ES, DE, FI, GR, IE, IS, DK, NO, NL, RO",
                "type": "string"
              },
              "couples": {
                "description": "only jobs that explicitly welcome couples",
                "type": "boolean"
              },
              "free_housing": {
                "description": "only jobs where the listing confirms that housing is free of charge",
                "type": "boolean"
              },
              "jobart": {
                "description": "type of work: haus = house sitting, caretaker, estate or property management, campsite management; huette = mountain hut / refuge (Alpine club huts, alpine pastures); tiere = animals and horses (grooms, riding, stable work); natur = nature and farm work (farm, agriculture, greenkeeping, forestry); wasser = water and boats (sailing, yacht, water sports, beach); hotel = hotel, restaurant, hospitality (the majority of jobs)",
                "enum": ["haus", "huette", "tiere", "natur", "wasser", "hotel"],
                "type": "string"
              },
              "language": {
                "description": "language of the user (ISO 639-1). Job pages are returned in de/en/fr/es/it/pl/cs/hu/ro/pt (others get English); jobs workable in English are ranked first for other languages",
                "enum": ["de", "en", "fr", "es", "it", "da", "nl", "sv", "no", "nb", "fi", "pl", "pt", "el", "is", "cs", "hu", "ro"],
                "type": "string"
              },
              "limit": {
                "description": "max results, default 20, max 100",
                "type": "integer"
              },
              "min_net_per_month_eur": {
                "type": "number"
              },
              "pay_stated": {
                "description": "only jobs with a stated pay amount",
                "type": "boolean"
              },
              "query": {
                "description": "free text in any language: job, place, region, employer or type of work, e.g. \"huspasser\", \"job med bolig\", \"Koch Zermatt\", \"sailing instructor\", \"rifugio\", \"horse groom Ireland\"",
                "type": "string"
              },
              "work_language": {
                "description": "only jobs where this working language is listed (or no language is stated)",
                "enum": ["en", "de", "it", "fr", "es", "nl", "el", "no", "sv", "is", "fi", "da", "pt"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
