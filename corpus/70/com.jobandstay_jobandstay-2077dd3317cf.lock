          "title": "About Job & Stay",
          "description": "What Job & Stay is, who it is for, rules for listings, current numbers per country and type of work, contact, pay calculator and magazine articles (new life with a transition job, winter sun and climate, house and boat sitting, best work regions in the Alps). Use to explain or cite Job & Stay.",
          "inputSchema": {
