{
  "lockfileVersion": 2,
  "subjects": {
    "com.scrapelads/scrapelads": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scrapelads.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "scrapelads",
        "title": "ScrapeLads",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ScrapeLads exposes three data tools backed by Apify actors. Requests must carry an Apify token: Authorization: Bearer <token>. Usage is billed to that Apify account. Keep maxResults small while exploring.",
      "tools": [
        {
          "name": "find_tiktok_creators",
          "description": "Find TikTok creators by keyword and return one row per creator: handle, bio, follower and like counts, plus any contact email, Instagram, YouTube or WhatsApp link the creator publishes. Billed to your Apify account at about $1 per 1,000 profiles.",
          "inputSchema": {
            "properties": {
              "keywords": {
                "description": "Search terms, e.g. [\"skincare routine\", \"home workouts\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "maxFollowers": {
                "description": "Maximum follower count",
                "type": "integer"
              },
              "maxResults": {
                "description": "Maximum profiles to return. Keep this small while testing (default 20).",
                "type": "integer"
              },
              "minFollowers": {
                "description": "Minimum follower count",
                "type": "integer"
              },
              "onlyWithEmail": {
                "description": "Return only creators that publish a contact email",
                "type": "boolean"
              }
            },
            "required": ["keywords"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c8e34693313edc316747d4c8e9a7b6d4d3a4bf98f5ea3d6c83d18ca270d6ad42"
        },
        {
          "name": "find_youtube_channel_emails",
          "description": "Resolve the contact email behind YouTube channels, alongside their videos and Shorts with views, likes, tags and exact publish dates. One free contact row is returned per channel. Billed to your Apify account at about $1.50 per 1,000 videos.",
          "inputSchema": {
            "properties": {
              "channels": {
                "description": "Channel handles or URLs, e.g. [\"@handle\", \"https://youtube.com/@handle\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "includeChannelContacts": {
                "description": "Add one free contact row per channel with its About data and emails (default true)",
                "type": "boolean"
              },
              "maxResults": {
                "description": "Maximum video rows in total (default 20)",
                "type": "integer"
              },
              "newerThanDays": {
                "description": "Only include videos newer than N days",
                "type": "integer"
              },
              "searchQueries": {
                "description": "Keyword searches instead of explicit channels",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2913c7fdd82747add7116c8f1419e066e681d102316b48f2af3aefabc5fdbcc5"
        },
        {
          "name": "get_video_transcripts",
          "description": "Get transcripts for TikTok videos, Instagram Reels, YouTube videos and Shorts, and X videos. Uses the platform's own subtitles when they exist and speech-to-text when they do not. Billed to your Apify account at about $2 per 1,000 subtitle transcripts ($5 per 1,000 speech-to-text ones).",
          "inputSchema": {
            "properties": {
              "includeSegments": {
                "description": "Include timestamped segments instead of one text block (default true)",
                "type": "boolean"
              },
              "language": {
                "description": "Preferred subtitle language, e.g. \"en\"",
                "type": "string"
              },
              "maxVideosPerProfile": {
                "description": "How many of the newest videos to transcribe per profile (default 3)",
                "type": "integer"
              },
              "profiles": {
                "description": "Creator profile URLs to transcribe the latest videos from",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "urls": {
                "description": "Video URLs across TikTok, Instagram, YouTube or X",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b7a5ebb7bd6ce2db8ecacded70c81a0e3e0b567bd0277731b86414d707c227b"
        }
      ],
      "digest": "sha256:36903c44a851b8b1b25395641583c1ee943f304117e4da6fa3c1537b82b2db3d"
    }
  }
}
