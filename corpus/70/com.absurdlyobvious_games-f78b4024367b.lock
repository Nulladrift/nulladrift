      "serverInfo": {
        "name": "absurdly-obvious",
        "title": "Absurdly Obvious",
        "version": "1.1.0",
        "websiteUrl": "https://absurdlyobvious.com"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Absurdly Obvious makes small daily puzzle games. Each game has a new board every day.\n- Call list_games to see the games, their rules and how to write a player's progress.\n- To play, call play_game. The board appears as an interactive widget and the user plays there. Keep your reply to a line or two: never print the board, grid or rules under it, and don't solve it for them.\n- Hints: call game_hint with the user's progress so far. Give one hint at a time, never the whole answer unless the user asks for it outright. Hints count on their score.\n- Text play, only if the user can't see the board or asks for it: call game_move (progress \"\" to start) and show the board it returns.\n- When the game is finished, call game_result for the verified score, the share text and a challenge link a friend can open on absurdlyobvious.com.\n- Pass the user's local date if you know it, so \"today\" matches their day.",
      "tools": [
        {
          "name": "game_hint",
          "title": "Get a hint",
          "description": "One hint for the player's current position on a board: the single next step, never the whole answer. Each hint counts on the player's score.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "Which game, by id from list_games (for example \"thunk\").",
                "maxLength": 40,
                "type": "string"
              },
              "number": {
                "description": "Board number (No. 1 was the game's first day).",
                "minimum": 1,
                "type": "integer"
              },
              "progress": {
                "description": "Everything the player has done on this board from the start, in the game's own format (list_games describes each). Empty for nothing yet.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["game", "number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a hint"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:128faf6606a5ee97cb8c024f6e58fa51c02c00e05927be62a26d9ed8a4a2d764"
        },
        {
          "name": "game_move",
          "title": "Play moves",
          "description": "Replays the player's progress on a board and returns where things stand: the board as text, the score so far, what the last move did (including mistakes and why), and whether the game is finished. Used for text play and by the board widget.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "Which game, by id from list_games (for example \"thunk\").",
                "maxLength": 40,
                "type": "string"
              },
              "number": {
                "description": "Board number (No. 1 was the game's first day).",
                "minimum": 1,
                "type": "integer"
              },
              "progress": {
                "description": "Everything the player has done on this board from the start, in the game's own format (list_games describes each). Empty for nothing yet.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["game", "number", "progress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Play moves"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:660c07940dfbcac4b2b539e85aabfa7b8b5b93401ba641c52fed532215ac0191"
        },
        {
          "name": "game_result",
          "title": "Check the result",
          "description": "Checks a finished game and returns the verified score, share text with emoji, and a challenge link a friend can open to play the same board. Records an anonymous play count for the site's stats; nothing about the user.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "Which game, by id from list_games (for example \"thunk\").",
                "maxLength": 40,
                "type": "string"
              },
              "hints": {
                "description": "How many hints the player took.",
                "maximum": 99,
                "minimum": 0,
                "type": "integer"
              },
              "number": {
                "description": "Board number (No. 1 was the game's first day).",
                "minimum": 1,
                "type": "integer"
              },
              "progress": {
                "description": "Everything the player has done on this board from the start, in the game's own format (list_games describes each). Empty for nothing yet.",
                "maxLength": 2000,
                "type": "string"
              },
              "seconds": {
                "description": "Time spent in seconds, if known.",
                "maximum": 86400,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["game", "number", "progress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check the result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
