        {
          "name": "play_game",
          "title": "Play a puzzle",
          "description": "Open a daily puzzle: today's board for a game, or an older one by number. Shows an interactive board the user plays in the chat, plus a text version of the board and the rules.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The user's local date (YYYY-MM-DD), so \"today\" matches their day. Optional.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "game": {
                "description": "Which game, by id from list_games (for example \"thunk\").",
                "maxLength": 40,
                "type": "string"
              },
              "number": {
                "description": "Board number (No. 1 was the game's first day). Leave out for today's board.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["game"],
            "type": "object"
          },
