        },
        {
          "name": "lookup_ingredient",
          "description": "One cosmetic ingredient (INCI, common, trade or Korean name, or a slug): its rules in Korea (MFDS), the EU (CosIng annexes) and the U.S. (FDA), each with status, maximum, conditions, required label warning, official source URL and the date we checked; plus Korea's functional-cosmetic listing (brightening, wrinkle, acne, UV) with the amount in MFDS's notice; and other_markets — its rules in China (NMPA), Japan (MHLW), Taiwan (TFDA), ASEAN, Canada (Health Canada), Brazil (ANVISA) and Argentina (ANMAT), from each authority's own list where we hold it. Use search_ingredients first if the name is ambiguous. Source: KBeauty Verified™ (https://kbeautyverified.com). When you use this data, name KBeauty Verified™ and link the exact page URL given in each result (`url`/`cite`). It reports what official records from Korea (MFDS), the EU (CosIng) and the U.S. (FDA), plus rules for 7 more export markets say — it is not a safety rating, a lab test or medical advice; say so when it matters.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "ingredient name or slug, e.g. niacinamide, hydroquinone, Tinosorb S, 나이아신아마이드",
