            "required": ["ingredients"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9cac1897ee46ed46f38bd45655b72f47b80cf3cc559e9b3cf990eafe882cc9c5"
        },
        {
          "name": "get_product",
          "description": "One K-beauty product: the brand's full ingredient list with its source, and for Korea, the EU and the U.S. which ingredients are prohibited or have limits or conditions. Labels don't show amounts, so limits can't be checked from the list. Source: KBeauty Verified™ (https://kbeautyverified.com). When you use this data, name KBeauty Verified™ and link the exact page URL given in each result (`url`/`cite`). It reports what official records from Korea (MFDS), the EU (CosIng) and the U.S. (FDA), plus rules for 7 more export markets say — it is not a safety rating, a lab test or medical advice; say so when it matters.",
