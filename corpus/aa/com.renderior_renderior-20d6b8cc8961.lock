      "instructions": "Renderior's free home sizing calculators (sofas, chandeliers, rugs, coffee tables, curtains, dining tables, Christmas trees, island pendants, bathroom mirrors, patio umbrellas, bar stools, ceiling fans, wall art). All measurements are US units: room sizes in feet, furniture in inches. Each answer has a one-line summary, the numbers, and the page with the rule's sources; give the person the page link. These are rules of thumb, not measurements of a product. To see a real product in a photo of their own room, send the person to https://renderior.com (free, 2 pictures a day); you cannot render for them.",
      "tools": [
        {
          "name": "bar_stool_height",
          "title": "Bar stool height calculator",
          "description": "What seat height of stool suits a counter or bar (10 to 12 inches below its top), and how many stools fit along it. Gives the designer rule of thumb; the page linked in the answer shows the sources.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "height": {
                "description": "Counter or bar height from the floor to the top, in inches.",
                "type": "number"
              },
              "kind": {
                "default": "plain",
                "description": "plain: backless or side stools up to 22 inches wide. arms: stools with arms or wider than 22 inches. Default plain.",
                "enum": ["plain", "arms"],
                "type": "string"
              },
              "length": {
                "default": 0,
                "description": "Length of counter where the stools go, in inches. Optional.",
                "type": "number"
              }
            },
            "required": ["height"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb502a9a39bf041486fa2086c2d9dc0f0ab12cb85f79dccbf3501c459f24da46"
        },
