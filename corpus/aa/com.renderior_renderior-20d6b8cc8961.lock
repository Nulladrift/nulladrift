              "floor": {
                "description": "Distance from the top of the window frame to the floor, in inches.",
                "type": "number"
              },
              "style": {
                "default": "kiss",
                "description": "float (half an inch off the floor), kiss, break (1 to 2 inches extra) or puddle (3 to 6 inches extra). Default kiss.",
                "enum": ["float", "kiss", "break", "puddle"],
                "type": "string"
              },
              "width": {
                "description": "Window width across the outside of the frame, in inches.",
                "type": "number"
