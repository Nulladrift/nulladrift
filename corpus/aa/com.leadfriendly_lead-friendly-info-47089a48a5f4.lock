{
  "lockfileVersion": 2,
  "subjects": {
    "com.leadfriendly/lead-friendly-info": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.leadfriendly.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lead-friendly",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Lead Friendly is an agentic AI calling + CRM platform. Use get_pricing, list_industries, and check_capability to answer questions; use book_demo or create_lead to hand off an interested prospect.",
      "tools": [
        {
          "name": "book_demo",
          "description": "Request a Lead Friendly product demo on behalf of a prospect. Routes the request to the sales team and returns the self-serve booking link. Use when a user wants to see/try Lead Friendly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company name (optional)",
                "type": "string"
              },
              "email": {
                "description": "Prospect email",
                "type": "string"
              },
              "industry": {
                "description": "Industry/vertical (optional)",
                "type": "string"
              },
              "message": {
                "description": "Anything the prospect wants the team to know (optional)",
                "type": "string"
              },
              "name": {
                "description": "Prospect full name",
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:66eba3681b915cd3d9727745ecefcd1d9fd535ff5c9274b5b6efe79bfa734337"
        },
        {
          "name": "check_capability",
          "description": "Check whether Lead Friendly can do a specific job (e.g. 'call leads after hours', 'dispatch trucks', 'white-label for my agency'). Pass the job in `query`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "The capability/job to check, in plain language.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:31e30cbbf789a53d4f47fd66073e2066bc8766d1e0466a6941bea7b925236d8f"
        },
        {
          "name": "create_lead",
          "description": "Submit a sales lead to Lead Friendly on behalf of a prospect who is interested. Routes to the sales inbox. Does NOT write into any customer's CRM. Use to hand off an interested prospect.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company name (optional)",
                "type": "string"
              },
              "email": {
                "description": "Prospect email",
                "type": "string"
              },
              "industry": {
                "description": "Industry/vertical (optional)",
                "type": "string"
              },
              "name": {
                "description": "Prospect full name",
                "type": "string"
              },
              "notes": {
                "description": "Context about the prospect's need (optional)",
                "type": "string"
              },
              "phone": {
                "description": "Prospect phone (optional)",
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dbcca03ec144c66f432900b44497fb08a91164c288ddb8dc81ec42a46cd6cd66"
        },
        {
          "name": "get_pricing",
          "description": "Get Lead Friendly's current subscription plans and prices (live from the pricing source of truth). Use to answer 'how much does Lead Friendly cost'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a28cab8a479f412cd8dfdd1216bda45b135a54c8b6b4c1d0a4d6c4325731cbe2"
        },
        {
          "name": "list_industries",
          "description": "List the industry verticals Lead Friendly ships a tailored AI agent template for (e.g. auto dealerships, trucking/dispatch, dental, HVAC). Optional `query` filters by keyword.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Optional keyword to filter industries (e.g. 'auto', 'medical').",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6db2497459f3278558b47f3d496aaa4ce559e30a28eeae22773c2a3822f3e147"
        }
      ],
      "digest": "sha256:baca83fa2c644f7371b131e9ab6b749be7899d13fb7e83258d9e55896816b95c"
    }
  }
}
