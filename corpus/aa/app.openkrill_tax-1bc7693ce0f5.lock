        {
          "name": "get_tax_parameters",
          "title": "Look up US federal tax figures",
          "description": "Use this when the user asks for a published US federal tax figure, for example \"what are the 2026 tax brackets for married filing jointly\", \"standard deduction for head of household in 2025\", \"long-term capital gains thresholds\", \"Social Security wage base\", \"401(k) contribution limit\". Pass the tax year (2025 and 2026), the topic (brackets, standard_deduction, mileage, retirement_limits, capital_gains, self_employment or all) and optionally the filing status (single, mfj, mfs, hoh). Returns rows with the figure and the IRS document and section it was read from, the year's status (current, or amended when a later law or notice changed a figure, with amended_by), and when the table was last verified. It does not give advice and does not cover state taxes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filing_status": {
                "description": "single, mfj (married filing jointly), mfs (married filing separately) or hoh (head of household). Leave out for every status.",
                "enum": ["single", "mfj", "mfs", "hoh"],
                "type": "string"
              },
              "topic": {
                "description": "Which table: brackets, standard_deduction, mileage, retirement_limits, capital_gains, self_employment, or all.",
                "enum": ["brackets", "standard_deduction", "mileage", "retirement_limits", "capital_gains", "self_employment", "all"],
                "type": "string"
              },
              "year": {
                "description": "The tax year (the year the income was earned), for example 2026. Available: 2025, 2026.",
                "type": "integer"
              }
            },
            "required": ["topic", "year"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amended_by": {
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "document": {
                      "type": "string"
                    },
                    "section": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "filing_status": {
                "type": ["string", "null"]
              },
