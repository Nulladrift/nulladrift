                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "rows": {
                "items": {
                  "properties": {
                    "amount": {
                      "type": "number"
                    },
                    "filing_status": {
                      "type": "string"
                    },
                    "from": {
                      "type": "number"
                    },
                    "label": {
                      "type": "string"
                    },
                    "rate_percent": {
                      "type": "number"
                    },
                    "source": {
                      "properties": {
                        "date": {
                          "type": "string"
                        },
                        "document": {
                          "type": "string"
                        },
                        "section": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "to": {
                      "type": ["number", "null"]
                    },
                    "topic": {
                      "type": "string"
                    },
                    "unit": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "properties": {
                  "date": {
                    "type": "string"
                  },
                  "document": {
                    "type": "string"
                  },
                  "section": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "status": {
                "description": "current, amended (a later document changed a figure; see amended_by), or unsupported_year.",
                "type": "string"
              },
              "topic": {
                "type": "string"
              },
