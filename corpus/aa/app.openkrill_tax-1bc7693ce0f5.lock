        {
          "name": "tax_duty",
          "title": "Check VAT or sales tax registration duty",
          "description": "Use this when a seller asks whether they must register for VAT or sales tax in a place, for example \"I sell e-books from Germany and made 14,000 EUR to buyers in France, do I need to register?\" or \"my US company sells SaaS with 150,000 USD of sales to Texas, do I owe sales tax?\". Pass seller_country, buyer_place, product_kind and yearly_sales in the money of the buyer place (leave it out when unknown); add yearly_transactions for US states that also count sales. Returns must_register (yes, no or unclear), the limit, the standard rate, the filing rhythm, where to register, the reasons, official source links with the day each was checked, and a not-tax-advice note. Covers the 27 EU states (One Stop Shop limit of 10,000 EUR), the United Kingdom and 14 US states; other places return not_covered with the covered list. It does not advise or cover sales to businesses, reduced rates, local taxes or a seller's own-country limit inside the EU, and it does not file or register anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_place": {
                "description": "Where the buyers are: an EU country code (FR, DE, EL for Greece), GB, or a US state written US-TX or by name (Texas). A bare two-letter code is a country, so CA is Canada and California is US-CA.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "description": "Optional. The currency of yearly_sales. If it differs from the buyer place, the answer asks you to convert; it never guesses a rate.",
                "enum": ["EUR", "GBP", "USD"],
                "type": "string"
              },
              "product_kind": {
                "description": "physical_goods, digital_products (downloads such as e-books, music or apps) or saas (software used online).",
                "enum": ["physical_goods", "digital_products", "saas"],
                "type": "string"
              },
              "seller_country": {
                "description": "Where the seller is established: a two-letter country code such as DE, GB, US or VN, or the country name.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "yearly_sales": {
