        {
          "name": "get_mileage_rate",
          "title": "Look up the IRS mileage rate",
          "description": "Use this when the user asks for the IRS standard mileage rate on a day, for example \"what was the business mileage rate on 15 March 2026\", \"how much per mile can I deduct for charity driving\", \"medical mileage rate in 2025\". Pass the date (YYYY-MM-DD); the rate in force that day is returned in cents per mile for business, medical and charity use, with the period it covers, the IRS notice that announced it and when it was last verified. Rates are available from 1 January 2022. It does not add up trips or compute a deduction.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "The day the driving happened, YYYY-MM-DD. The rate that applies is the one in force on that day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "business": {
                "type": "number"
              },
              "charity": {
                "type": "number"
              },
              "date": {
                "type": "string"
              },
              "last_verified": {
                "type": "string"
              },
              "medical": {
                "type": "number"
              },
              "message": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "notice": {
                "description": "The IRS news release that announced the rates.",
                "type": "string"
              },
              "period": {
                "properties": {
                  "from": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "source": {
                "properties": {
                  "date": {
                    "type": "string"
                  },
                  "document": {
                    "type": "string"
                  },
                  "section": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
