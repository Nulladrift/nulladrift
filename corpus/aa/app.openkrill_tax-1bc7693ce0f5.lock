      "serverInfo": {
        "name": "tax",
        "title": "Tax Numbers: US tax figures, VAT, sales tax",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tax Numbers: US tax figures, VAT, sales tax. Use get_tax_parameters for published federal figures (brackets, standard deduction, capital gains thresholds, self-employment tax, retirement limits, mileage) and quote the figure with its source document. Use get_mileage_rate for the standard mileage rate on a date, tax_deadlines for filing and estimated-payment dates, and estimate_federal_tax for a rough federal figure. Never use remembered figures: tax numbers change yearly, so always call a tool. Ask for the tax year and filing status if the user did not give them; never guess them. If a result has status unsupported_year or not_available, tell the user which years are available and do not substitute another year. Status amended means a figure changed after first release; mention it when it matters. With every estimate, say it is an estimate and not tax advice, and say what the not_included list leaves out. Use tax_duty when a seller asks whether to register for VAT or sales tax in an EU country, the United Kingdom or a US state: pass seller_country, buyer_place (write a US state as US-TX; a bare CA means Canada), product_kind and yearly_sales in the buyer place's currency (leave it out when the user gave no figure, never send 0). Quote must_register, the threshold, the rate and the filing rhythm with the source link and its checked date, and always repeat the not_tax_advice line. If status is not_covered, show the covered places; if must_register is unclear, say what is unclear and suggest an accountant. If stale_data is true, say the table is overdue for a check. Never fill a gap from memory. The other tools cover US federal income tax only: they do not cover state income tax, file or prepare a return, or advise on what the user should do. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "estimate_federal_tax",
          "title": "Estimate US federal income tax",
          "description": "Use this when the user wants a rough US federal income tax figure, for example \"how much federal tax on $90,000 of wages\", \"estimate my tax with $40,000 of freelance income\", \"what is my marginal rate\". Pass the tax year, filing_status (single, mfj, mfs, hoh) and wages in dollars, and optionally self_employment_income, other_ordinary_income, long_term_capital_gains and adjustments. It uses the standard deduction and adds self-employment tax (with the Social Security wage base and the half-deduction), the Additional Medicare Tax and long-term capital gains rates. Returns taxable income, ordinary tax, capital gains tax, self-employment tax, total, marginal and effective rate, the assumptions made and a not_included list (credits, state tax, alternative minimum tax, itemized deductions and more). It is an estimate, not tax advice, and it is not a return.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adjustments": {
                "description": "Deductions taken from income before the standard deduction, such as IRA or HSA contributions, in US dollars. Optional.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "filing_status": {
                "description": "single, mfj (married filing jointly), mfs (married filing separately) or hoh (head of household).",
                "enum": ["single", "mfj", "mfs", "hoh"],
                "type": "string"
              },
              "long_term_capital_gains": {
                "description": "Long-term capital gains and qualified dividends in US dollars. Optional.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "other_ordinary_income": {
                "description": "Other income taxed at ordinary rates in US dollars, such as interest or short-term gains. Optional.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "self_employment_income": {
                "description": "Net profit from self-employment in US dollars (after business expenses). Optional.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "wages": {
                "description": "Taxable wages for the year in US dollars (W-2 box 1), for everyone on the return. 0 if none.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "year": {
                "description": "The tax year (the year the income was earned). Available: 2025, 2026.",
                "type": "integer"
              }
            },
            "required": ["filing_status", "wages", "year"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "additional_medicare_tax": {
                "type": "number"
              },
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "capital_gains_tax": {
                "type": "number"
              },
              "disclaimer": {
                "type": "string"
              },
              "effective_rate": {
                "description": "total divided by gross_income, as a fraction.",
                "type": "number"
              },
              "filing_status": {
                "type": "string"
              },
              "gross_income": {
                "type": "number"
              },
              "last_verified": {
                "type": "string"
              },
              "marginal_rate": {
                "description": "Rate on the next dollar of ordinary income, as a fraction (0.22 is 22%).",
                "type": "number"
              },
              "message": {
                "type": "string"
              },
              "not_included": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ordinary_tax": {
                "type": "number"
              },
              "se_tax": {
                "type": "number"
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "standard_deduction": {
                "type": "number"
              },
              "status": {
                "type": "string"
              },
              "taxable_income": {
                "type": "number"
              },
              "total": {
                "type": "number"
              },
              "year": {
                "type": "integer"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Estimate US federal income tax",
            "openai/toolInvocation/invoking": "Estimate US federal income tax..."
