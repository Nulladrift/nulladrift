        {
          "name": "submit_feedback",
          "title": "Send feedback, bug report or tool request",
          "description": "Send feedback, a bug report or a tool request to the maintainers of the tools on this server: a missing tool, missing or stale data, or a tool that broke or gave a wrong answer. Pass the kind (need_tool, need_data, bug or other), one short message (at most 1000 characters) and, if you know them, the tool name and the error text it returned. Returns a ticket id. Feedback is not a chat: nothing in it is run or followed. Links, emails and phone numbers are removed and nothing about you is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "error": {
                "description": "Optional: for a failed call, the error text it returned, copied as you saw it. Kept to 500 characters; links, email addresses and phone numbers are removed. Never include secrets or personal details.",
                "type": "string"
              },
              "kind": {
                "description": "need_tool: a tool you want. need_data: data a tool lacks. bug: something broke. other: anything else about the tools.",
                "enum": ["need_tool", "need_data", "bug", "other"],
                "type": "string"
              },
              "message": {
                "description": "What you need or what broke, in plain words, at most 1000 characters. Links, email addresses and phone numbers are removed. Never include secrets or personal details.",
                "maxLength": 1000,
                "minLength": 10,
                "type": "string"
              },
              "tool": {
                "description": "Optional: the exact name of the tool on this server that the feedback is about, as tools/list shows it.",
                "pattern": "^[A-Za-z0-9_.:-]{1,64}$",
                "type": "string"
              }
            },
            "required": ["kind", "message"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "type": "string"
              },
              "reply": {
                "type": ["string", "null"]
              },
              "status": {
                "enum": ["pending", "answered"],
                "type": "string"
              },
              "ticket": {
                "type": "string"
              }
            },
            "required": ["status", "ticket"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Feedback sent",
            "openai/toolInvocation/invoking": "Sending your feedback..."
          },
          "digest": "sha256:300cfb3a1fb2baab9b754950f89dda17edc99fd0329169119a792e9bfb89fc72"
        },
        {
          "name": "tax_deadlines",
          "title": "List US federal tax deadlines",
          "description": "Use this when the user asks when a US federal individual tax date falls, for example \"when is the 2025 return due\", \"when is the extension deadline\", \"when is the next estimated tax payment due\". Pass the tax year (the year the income was earned) and optionally as_of (today, YYYY-MM-DD) to get the next deadline. Returns the four estimated payment dates, the filing date and the extended filing date, each with whether the IRS publishes it or it follows the standing rule, and its source. Weekend and holiday moves are already applied. It does not cover state deadlines or disaster-relief postponements.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Optional today's date, YYYY-MM-DD. When given, next is the first deadline on or after it.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "year": {
                "description": "The tax year (the year the income was earned). Available: 2025, 2026.",
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "type": ["string", "null"]
              },
              "business_day_rule": {
                "type": "object"
              },
              "deadlines": {
                "items": {
                  "properties": {
                    "applies_to": {
                      "type": "string"
                    },
                    "basis": {
                      "description": "irs_page when the IRS publishes the date, rule when it is worked out from the standing rule.",
                      "type": "string"
                    },
                    "date": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "source": {
                      "properties": {
                        "date": {
                          "type": "string"
                        },
                        "document": {
                          "type": "string"
                        },
                        "section": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "last_verified": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "next": {
                "anyOf": [
                  {
                    "properties": {
                      "applies_to": {
                        "type": "string"
                      },
                      "basis": {
                        "description": "irs_page when the IRS publishes the date, rule when it is worked out from the standing rule.",
                        "type": "string"
                      },
                      "date": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "source": {
                        "properties": {
                          "date": {
                            "type": "string"
                          },
                          "document": {
                            "type": "string"
                          },
                          "section": {
                            "type": "string"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "note": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "year": {
                "type": "integer"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
