        {
          "name": "find_alpha",
          "description": "Scan the ENS marketplace for alpha — names listed below their valuation. Returns ranked opportunities with a discount %, fair-value range, confidence rating, and comparable data. Candidates are selected by DESIRABILITY (real curated collections, short, accessibly priced above a floor that excludes 0.001-ETH floor-dumps), then each is precision-priced by the full Name Whisper valuation engine — the SAME engine behind get_valuation and the Value page — which is the sole judge of undervaluation. The returned fair-value range (estimatedValueEth), confidence and discountPct are the engine's own numbers, via the same cache-first path as get_valuation (with display-only signals disabled for speed), so they are authoritative and consistent with get_valuation. They are computed conservatively (the seller-wallet boost is off), so if anything they slightly UNDERSTATE fair value — report them as-is; do NOT inflate the fair value or upgrade the confidence. Use estimatedValueEth.mid as the fair-value anchor.\n\nOnly opportunities the engine confirms are surfaced: a believable discount band (20%+, capped where valuations stop being reliable), MEDIUM+ confidence, and a REAL comparable-sale match (type/collection/word/entity/semantic — never a coarse same-length average). This means genuinely good, believable deals (typically 25–65% off) — not 99%-off junk. It will still surface a large discount when the engine confirms it with real comps; it just won't fabricate one.\n\n**Use this instead of search_ens_names + repeated get_valuation when the user asks for \"best value\", \"best buy\", \"cheapest good name\", \"undervalued\", \"bargains\", or any ranked-by-value query across multiple listings.** find_alpha does the search + engine valuation + ranking in a single call — you do NOT need to call get_valuation again on its results. If it returns fewer names than asked, the rest weren't genuine discounts vs the engine — say so rather than padding the list. Supports filters (minLength, maxLength, maxPriceEth, charType) so narrow queries like \"4-letter names under 1 ETH, best value\" are one call, not six.\n\nIt has NO collection/category/club param. Do NOT use it for \"floor price of the 999 club\", \"cheapest 10k-club names\", or \"floor of <collection>\" — those name a specific collection, so use search_ens_names (which returns that collection's real listings sorted by price), or sweep if the user wants to buy the cheapest N. find_alpha is for value-ranked discovery across the market, not a named collection's floor.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "charType": {
                "description": "Filter by character type",
                "enum": ["letters", "numbers", "emoji"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Max results to return. Default 25, max 100.",
                "type": "number"
              },
              "maxLength": {
                "description": "Maximum label length (e.g. 5 for up to 5-letter names). Omit for no cap — never pass a huge sentinel number.",
                "maximum": 255,
                "minimum": 1,
                "type": "integer"
              },
              "maxPriceEth": {
                "description": "Maximum listing price in ETH (e.g. 1.0). Omit for no cap — never pass a huge sentinel number.",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "minConfidence": {
                "default": "MEDIUM",
                "description": "Minimum engine confidence. Floored at MEDIUM — find_alpha never returns LOW-confidence (thin-comp) picks. HIGH = 20+ comps, MEDIUM = 10+.",
                "enum": ["HIGH", "MEDIUM", "LOW"],
                "type": "string"
              },
              "minDiscountPct": {
                "default": 20,
                "description": "Minimum discount vs the engine fair value. Default 20%. Range: 1-99.",
                "maximum": 99,
                "minimum": 1,
                "type": "number"
              },
              "minLength": {
                "description": "Minimum label length (e.g. 3 for 3-letter names and up)",
                "maximum": 255,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
