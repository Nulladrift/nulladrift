        {
          "name": "mint_subnames",
          "description": "Bulk-create subnames under a parent ENS name. Designed for agent fleet deployment — create identities like agent001.company.eth, agent002.company.eth, etc. Each subname can have its own owner and records (addresses, text records).\n\nEach subname mints in its own NameWrapper.setSubnodeRecord transaction (the mainnet NameWrapper has no multicall), so N subnames need N signatures. Records bundle into ONE Resolver.multicall transaction, but only for subnames minted to the calling wallet: the resolver lets only a subname's owner write its records, so subnames minted to other wallets are listed in recordsSkipped and their owners set records themselves. If the parent is unwrapped, the recipe prepends a one-time wrap setup (approve + wrapETH2LD) that keeps the parent's current resolver.\n\nReturns a flat steps[] array — each step is one wallet signature, in order. Subnames are free to create; only gas costs apply.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "allowOverwrite": {
                "description": "Default false. If false, throws when any subname already exists. Set true to overwrite existing subnames (destructive — replaces current owner).",
                "type": "boolean"
              },
              "parentName": {
                "description": "Parent ENS name (e.g. \"company.eth\")",
                "type": "string"
              },
              "subnames": {
                "description": "Array of subnames to create (max 50 per batch)",
                "items": {
                  "properties": {
                    "label": {
                      "description": "Subname label (e.g. \"agent001\" for agent001.company.eth)",
                      "type": "string"
                    },
                    "owner": {
                      "description": "Owner wallet address (defaults to parent owner)",
                      "type": "string"
                    },
                    "records": {
                      "description": "Optional records to set on the subname",
                      "properties": {
                        "addresses": {
                          "additionalProperties": {
                            "type": "string"
                          },
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        },
                        "texts": {
                          "additionalProperties": {
                            "type": "string"
                          },
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        }
                      },
                      "type": "object"
                    }
                  },
                  "required": ["label"],
                  "type": "object"
                },
                "type": "array"
              },
              "walletAddress": {
                "description": "Wallet address that owns the parent name",
                "type": "string"
              }
            },
            "required": ["parentName", "subnames", "walletAddress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
