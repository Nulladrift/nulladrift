        },
        {
          "name": "get_market_activity",
          "description": "Get recent ENS marketplace activity. Covers exactly three event types — SALE, PREMIUM_REGISTRATION and SWAP — and nothing else: it does NOT report listings, standing offers, mints, transfers, renewals or burns, so never conclude from an empty result that none of those occurred. Returns event details including name, price (in ETH), buyer/seller addresses, and timestamp. Sorted by most recent first. Pass `collection` (a slug such as \"10k-club\" or \"999-club\") to scope to one club — an unscoped call is the entire market, so never present unscoped results as a collection's sales. Not every row is a sale: check `type` before describing one as such. PREMIUM_REGISTRATION is a Dutch-auction registration from the ENS premium decay, NOT a secondary-market sale, so never quote it as evidence of what a name sold for; SWAP is a name-for-name trade and has no price. SALE includes accepted offers. This is raw activity only — it makes NO wash-trading / authenticity judgment; for \"is this wash trading / fake volume?\" use wash_check.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "collection": {
                "description": "Restrict to names in one collection, by slug — e.g. \"10k-club\", \"999-club\", \"3-letter-dictionary\". Use it whenever the user names a club or collection; without it the results are the WHOLE market and must never be described as a collection's sales.",
                "type": "string"
              },
              "eventTypes": {
                "description": "Filter by event type. Defaults to all three; see the tool description for what each means.",
                "items": {
                  "enum": ["SALE", "PREMIUM_REGISTRATION", "SWAP"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "default": 25,
                "description": "Max results (default 25, max 100)",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Pagination offset",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
