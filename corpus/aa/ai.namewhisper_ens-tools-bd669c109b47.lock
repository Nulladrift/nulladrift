        {
          "name": "get_expiring_names",
          "description": "List ENS names by lifecycle window across the WHOLE market — THE tool for \"which names are in premium / on Dutch auction\", \"names in grace period\", \"what's expiring soon / about to drop\". NOT for the user's own names: it has no wallet filter, so \"my names close to premium / in grace / expiring\" must go to get_wallet_portfolio with its status parameter (live 2026-09-06 this tool answered \"my names that are close to expiring\" with 100 strangers' names and the user replied \"wtf those arent my names\"). Statuses:\n- premium: 90-111 days past expiry, registerable NOW at a decaying premium. Each result includes premiumUsd (decay-curve estimate) and, when the on-chain read landed, premiumEth + firstYearEth (live rentPrice).\n- grace: 0-90 days past expiry. NOT registerable — only renewable.\n- active: registered, expiring within `days` (they will drop into grace, then premium).\nGrace/premium results are validated against on-chain state, so renewed or already-released names are filtered out — statuses here are reliable, unlike the coarse EXPIRED flag in search results. Supports length/charType/category/dictionary filters. Use search_ens_names for pattern/price/theme queries instead.\nSCOPE: every row here has an EXISTING registration moving through a lifecycle window. This tool cannot answer \"what is available / unregistered / free to register\" in general — those names have no lease to expire, so they are not in this dataset at all. Route \"which X are available to register\" to search_ens_names, even when X is a digit pattern. Only send a query here when it names a lifecycle window (premium / Dutch auction / grace / expiring soon); \"registerable NOW\" in the premium line describes that one window, not availability at large. The length/charType filters and sortBy do NOT make this the tool for a plain pattern list: \"3-letter numbers sorted by name\", \"4-letter words\", \"5-digit names\" name no lifecycle window and belong to search_ens_names — sending them here returns a grace/premium dump the user did not ask for.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Collection slug filter (e.g. \"crypto-terms\", \"999-club\")",
                "type": "string"
              },
              "charType": {
                "description": "Character composition filter. When this tool is the right one AND the request is for digits — \"N-digit\", \"numeric\", or a digit club (999 Club = 3-digit, 10K Club = 4-digit, 100K Club = 5-digit) — set this to \"numbers\", otherwise letter names of the same length pollute the results. This governs how to FILL this parameter, not whether to call this tool: digit phrasing on its own is not a reason to choose get_expiring_names over search_ens_names.",
                "enum": ["letters", "numbers", "emoji", "mixed"],
                "type": "string"
              },
              "days": {
                "description": "For status \"active\"/\"all\": look-ahead window in days (default 30).",
                "type": "number"
              },
              "dictionaryOnly": {
                "description": "Only dictionary words",
                "type": "boolean"
              },
              "limit": {
                "default": 25,
                "description": "Max results (default 25, max 100)",
                "type": "number"
              },
              "maxLength": {
                "description": "Maximum label length in CHARACTERS (see minLength note re digits).",
                "type": "number"
              },
              "minGrade": {
                "description": "Only names graded at least this well (A best). Combine with sortBy:\"grade\" for the shortlist.",
                "enum": ["A", "B", "C", "D", "E"],
                "type": "string"
              },
              "minLength": {
                "description": "Minimum label length in CHARACTERS. Length alone does NOT imply digits — a \"4-digit\" query needs charType:\"numbers\" too, or 4-letter names leak in.",
                "type": "number"
              },
              "sortBy": {
                "description": "Sort order (default expires ascending — closest to dropping first). \"grade\" = best expected auction outcome first; use it for \"which premium names are worth the most / best opportunities\".",
                "enum": ["expires", "length", "social", "grade"],
                "type": "string"
              },
              "status": {
                "default": "premium",
                "description": "Lifecycle window: \"premium\" = in the 21-day post-grace Dutch auction (registerable at a decaying premium), \"grace\" = 0-90d past expiry (NOT registerable, holder can renew), \"active\" = registered names expiring within `days`, \"all\" = any of these.",
                "enum": ["premium", "grace", "active", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
