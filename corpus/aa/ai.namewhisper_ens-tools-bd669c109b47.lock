        {
          "name": "manage_fuses",
          "description": "Manage fuses on a wrapped ENS name. Fuses are permission bits that can be permanently burned to restrict what can be done with a name.\n\nThree modes:\n1. **read** — Check which fuses are currently burned on a name\n2. **burn_owner_fuses** — Burn fuses on a name you own (CANNOT_UNWRAP must be burned first)\n3. **burn_child_fuses** — As a parent, burn fuses on a subname (e.g. burn PARENT_CANNOT_CONTROL on sub.parent.eth)\n\nOwner-controlled fuses:\n- CANNOT_UNWRAP — prevents unwrapping (MUST be burned first before any other fuse)\n- CANNOT_BURN_FUSES — prevents burning additional fuses\n- CANNOT_TRANSFER — prevents transfers\n- CANNOT_SET_RESOLVER — prevents resolver changes\n- CANNOT_SET_TTL — prevents TTL changes\n- CANNOT_CREATE_SUBDOMAIN — prevents creating new subnames\n- CANNOT_APPROVE — prevents approving operators\n\nParent-controlled fuses (for subnames):\n- PARENT_CANNOT_CONTROL — parent permanently gives up control over the subname\n- CAN_EXTEND_EXPIRY — allows the subname owner to extend their own expiry\n\nWARNING: All fuse burning is IRREVERSIBLE. Fuses expire when the name expires.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "action": {
                "default": "read",
                "description": "Action: \"burn_owner_fuses\" burns fuses on a name you own, \"burn_child_fuses\" burns fuses on a subname you are parent of, \"read\" reads current fuses",
                "enum": ["burn_owner_fuses", "burn_child_fuses", "read"],
                "type": "string"
              },
              "expiry": {
                "description": "For burn_child_fuses only: Unix timestamp for subname expiry (cannot exceed parent expiry)",
                "type": "number"
              },
              "fuses": {
                "default": [],
                "description": "Fuses to burn. Required for burn actions, optional for read. Owner fuses: CANNOT_UNWRAP, CANNOT_BURN_FUSES, CANNOT_TRANSFER, CANNOT_SET_RESOLVER, CANNOT_SET_TTL, CANNOT_CREATE_SUBDOMAIN, CANNOT_APPROVE. Parent-controlled fuses (for subnames): PARENT_CANNOT_CONTROL, CAN_EXTEND_EXPIRY.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "ENS name to manage fuses on (e.g. \"coffee.eth\" for owner fuses, or \"sub.coffee.eth\" for child fuses)",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
