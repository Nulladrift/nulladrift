        {
          "name": "wash_check",
          "description": "Assess whether an ENS name's sale(s) are WASH TRADING / fake / self-dealt / manipulated volume. THE tool for any \"is this wash trading?\", \"is the sale history of X suspicious/fake/real?\", \"are these trades legit?\", \"is someone wash-trading this name?\" question — route straight here, do NOT use get_name_details or get_market_activity for that (those return sale rows but make NO wash-trading judgment; only this tool scores it).\n\nJust pass `label` — the bare ENS name (e.g. \"437\", \"coffee\") is enough; the tool pulls that name's recent sale and analyzes it on demand. `tx_hash`, `buyer`, `seller`, `price_eth` are OPTIONAL enrichment for a specific sale — never block on them or ask the user for them. Returns a wash confidence score (0-1), a label (clean/suspicious/likely_wash), the detected signals (shared-funder, mint-flip, round-trip, fresh-wallet, cluster overlap…), seller profile, and a plain-English summary.\n\nA verdict is always ABOUT A SPECIFIC SALE — `sale_analyzed` names it, and `buyer`/`seller` are the parties scored. If the response has `assessable: false` there is NO score and NO verdict: the name has no analyzable sale on record, or the lookup failed. Report that the name could not be assessed and say why. Do NOT describe it as clean, low-risk, or free of red flags, and do NOT describe unrun checks (funding, cluster, round-trip) as having come back negative.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "buyer": {
                "description": "Buyer wallet address for live analysis",
                "type": "string"
              },
              "label": {
                "description": "ENS label (e.g. \"defirm\") for live analysis, or to pick one name out of a multi-name (bulk sweep) tx_hash lookup",
                "type": "string"
              },
              "price_eth": {
                "description": "Sale price in ETH for live analysis",
