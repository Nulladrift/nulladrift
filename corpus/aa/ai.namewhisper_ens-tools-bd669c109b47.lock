        {
          "name": "make_offer",
          "description": "Place an offer (bid) on a registered ENS name on NameWhisper via Seaport 1.6.\n\nReturns an unsigned Seaport OrderComponents payload (plus EIP-712 domain/types) that the caller's wallet signs. The buyer offers WETH and receives the name on acceptance. After signing, POST { orderComponents, signature, label, orderType: 'offer', variant: 'nw' } to https://namewhisper.ai/api/orderbook/submit (authenticated) to store the offer in NameWhisper's orderbook — the owner sees it and can accept, counter, or decline.\n\nOffers settle in WETH: the maker needs wrapped ETH and an approval for Seaport to spend it (the NameWhisper UI handles this approval automatically at signing time).\n\nFee structure: 1% marketplace fee baked into the order as a Seaport consideration item.\n\nNW-native only — offers are not cross-posted to other marketplaces.\n\nTip: Use get_valuation first to understand fair market value before making an offer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amountEth": {
                "description": "Offer amount in ETH (placed on-chain as WETH)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "currency": {
                "default": "WETH",
                "description": "Offer currency. Seaport offers settle in WETH; ETH is treated as WETH.",
                "enum": ["WETH", "ETH"],
                "type": "string"
              },
              "expiryHours": {
                "default": 72,
                "description": "Offer expiry in hours (default: 72, at most 8760: one year)",
                "exclusiveMinimum": 0,
                "maximum": 8760,
                "type": "integer"
              },
              "name": {
                "description": "ENS name to make an offer on (e.g. \"coffee.eth\")",
                "minLength": 1,
                "type": "string"
              },
              "walletAddress": {
                "description": "Your wallet address (the offer maker / buyer)",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              }
            },
            "required": ["amountEth", "name", "walletAddress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
