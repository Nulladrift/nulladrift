        {
          "name": "sweep",
          "description": "Floor-sweep: buy the CHEAPEST N listed ENS names in a category/collection (or matching a filter) in ONE Seaport transaction.\n\nUse this when the user wants \"the cheapest N\", \"sweep the floor\", or \"buy up to X ETH of\" a cohort — rather than naming specific names (that's batch_purchase).\n\nPick the cohort with 'category' (a collection slug like \"999-club\") and/or 'q'/'charType'/'minLength'/'maxLength'. Bound the sweep with 'count' (how many) and/or 'maxBudgetEth' (total spend), plus an optional 'maxPriceEth' per-name cap. It selects cheapest-first across NameWhisper, OpenSea, and Grails, then packs them into one fulfillAvailableAdvancedOrders call (capped at 20 names — run again to continue). NFTs are delivered directly to the buyer; Seaport skips any order that sold since discovery and refunds the excess. The response reports what was swept (with marketplace + price), the total, and how many matched but fell outside the bound.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Collection slug to sweep, as used by the marketplace (e.g. \"999-club\", \"10k-club\", \"three-letter\"). Comma-separate for multiple. Optional if q/charType/length is given.",
                "type": "string"
              },
              "charType": {
                "description": "Restrict to a character class. \"mixed\" covers any label combining letters and digits; \"hex\" narrows to just the all-hex-digit ones (abc666, 1a2b).",
                "enum": ["letters", "numbers", "emoji", "mixed", "hex"],
                "type": "string"
              },
              "count": {
                "description": "How many names to sweep, cheapest-first (max 20 per tx). Defaults to 10 if no budget is given.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "maxBudgetEth": {
                "description": "Total ETH budget — keeps buying up the floor until adding the next cheapest would exceed this.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "maxLength": {
                "description": "Maximum label length.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "maxPriceEth": {
                "description": "Per-name price cap — skip any listing above this so a pricey outlier just off the floor is not swept up.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "minLength": {
                "description": "Minimum label length.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "q": {
                "description": "Label text filter (substring), e.g. \"punk\" to sweep names containing punk.",
                "type": "string"
              },
              "walletAddress": {
                "description": "Buyer wallet address — receives all swept names.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              }
            },
            "required": ["walletAddress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
