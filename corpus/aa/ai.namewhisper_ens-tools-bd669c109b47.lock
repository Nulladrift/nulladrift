          "digest": "sha256:93958df7764821d286cc8329863d0fd2156b4309bed1d607cebf281169a34260"
        },
        {
          "name": "check_availability",
          "description": "Check availability of one or more ENS names the user named, or labels returned by enumerate_entities. Do NOT feed it names you invented/typed yourself (especially real-world people, teams, brands, or films — models misspell those); get verified labels from enumerate_entities first. Returns status (AVAILABLE, PREMIUM_AUCTION, REGISTERED, GRACE_PERIOD, INVALID, or UNKNOWN), owner address, and expiry date for each name. GRACE_PERIOD names are NOT registerable — only the original holder can renew them. PREMIUM_AUCTION names ARE registerable (available: true) but carry a temporary, continuously-decaying premium ON TOP OF the base fee — the result includes premiumUsd / firstYearCostUsd; quote those, never say \"no premium\". AVAILABLE (without PREMIUM_AUCTION) means base price only, no premium. Validates ENS character rules. Accepts names with or without .eth suffix.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "names": {
