        {
          "name": "get_agent_reputation",
          "description": "Check if an ENS name or wallet is a registered AI agent. Returns ENSIP-25 agent-registration verification (text record bindings between ENS names and on-chain agent registries), AI metadata from text records, ERC-8004 identity + reputation data, and ERC-8217 binding status (whether the agent identity is bound to — and transfers with — the ENS name's token).\n\nENSIP-25 verification is live and two-way: reads agent-registration text records from the name's resolver (the name's side), then resolves each agentId against the canonical ERC-8004 Identity Registry and checks the agent's side — an ERC-8217 binding to this name's token, or the agent held by the name's owner. A record the agent does not confirm is reported as claimed, not verified, and the agent's reputation is not attached to the name.\n\nReputation uses the live v1 feedback model: per-client feedback aggregated on-chain via getSummary. Note the unfiltered client set is Sybil-able — treat scores as a signal, not ground truth.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "nameOrWallet": {
                "description": "ENS name (e.g. \"agent.eth\") or wallet address (0x...) to look up",
