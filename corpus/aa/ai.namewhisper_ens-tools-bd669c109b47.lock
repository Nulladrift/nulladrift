        {
          "name": "set_ens_records",
          "description": "Set ENS resolver records for a name you own. Returns encoded transaction calldata ready to sign and broadcast.\n\nSupports: address records — ETH as a plain 0x address, non-ETH coins (BTC, SOL, LTC, DOGE, …) as the raw wallet-format address (bc1…, base58, …) which is ENSIP-9-encoded automatically; text records (avatar, description, url, social handles, AI agent metadata); contenthash as an ipfs:///ipns:// URI or bare CID (auto-encoded) or a pre-encoded 0x value; ENSIP-25 agent-registration records; and ENSIP-26 agent context and endpoint discovery. Always pass addresses and CIDs EXACTLY as the user gave them — never reconstruct or abbreviate them.\n\nMultiple records are batched into a single multicall transaction to save gas.\n\nCommon text record keys: avatar, description, url, email, com.twitter, com.github, com.discord, ai.agent, ai.purpose, ai.capabilities, ai.category.\n\nENSIP-25 support: Pass agentRegistration with registryAddress and agentId to automatically set the standardized agent-registration text record. This creates a verifiable on-chain binding between your ENS name and your agent identity in an ERC-8004 registry.\n\nENSIP-26 support: Pass agentContext to set the agent-context text record (free-form agent description). Pass agentEndpoints with protocol URLs (mcp, a2a, oasf, web) to set agent-endpoint[protocol] discovery records.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "ENS name to set records for (e.g. \"myagent.eth\")",
                "type": "string"
              },
              "records": {
                "description": "Records to set on the name",
                "properties": {
                  "addresses": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "description": "Address records by coin type. ETH takes a standard 0x address (copy it EXACTLY from the user or a tool result). Non-ETH coins (BTC, SOL, LTC, DOGE, …) take the raw wallet-format address exactly as the user gives it (e.g. \"bc1…\" bech32, base58 SOL) — it is encoded to ENSIP-9 bytes automatically. Pre-encoded 0x hex bytes are also accepted and passed through.",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "agentContext": {
                    "description": "ENSIP-26 agent-context text record — free-form text describing the agent (markdown, JSON, YAML, etc.). The entry point for agent discovery.",
                    "type": "string"
                  },
                  "agentEndpoints": {
                    "description": "ENSIP-26 agent endpoint URLs by protocol. Sets agent-endpoint[<protocol>] text records.",
                    "properties": {
                      "a2a": {
                        "description": "Agent-to-Agent Protocol endpoint URL",
                        "type": "string"
                      },
                      "mcp": {
                        "description": "Model Context Protocol endpoint URL",
                        "type": "string"
                      },
                      "oasf": {
                        "description": "OpenAPI Service Format endpoint URL",
                        "type": "string"
                      },
                      "web": {
                        "description": "Web interface URL",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "agentRegistration": {
                    "description": "ENSIP-25 shorthand: set an agent-registration text record linking this name to an on-chain agent identity. Automatically builds the correct ERC-7930 encoded key.",
                    "properties": {
                      "agentId": {
                        "description": "Agent ID in the registry",
                        "type": "string"
                      },
                      "chainId": {
                        "default": 1,
                        "description": "Chain ID (default: 1 for mainnet)",
                        "type": "number"
                      },
                      "registryAddress": {
                        "description": "ERC-8004 IdentityRegistry contract address (0x...)",
                        "type": "string"
                      }
                    },
                    "required": ["agentId", "registryAddress"],
                    "type": "object"
                  },
                  "contentHash": {
                    "description": "Content hash for a decentralized website. Accepts an ipfs:// or ipns:// URI, a bare IPFS CID (Qm…, bafy…), or an already-encoded 0x hex contenthash (0xe301…) — raw CIDs/URIs are encoded to the multicodec form automatically. Copy the CID exactly as the user gives it.",
                    "type": "string"
                  },
                  "texts": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "description": "Text records (e.g. {\"avatar\": \"https://...\", \"description\": \"An AI trading agent\", \"ai.agent\": \"true\", \"ai.capabilities\": \"trading,defi\"})",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "walletAddress": {
                "description": "Wallet address that owns the name (must sign the transaction)",
                "type": "string"
              }
            },
            "required": ["name", "records", "walletAddress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
