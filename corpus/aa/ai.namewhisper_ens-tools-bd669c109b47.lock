        {
          "name": "get_wallet_portfolio",
          "description": "Get all ENS names owned by a wallet address. Returns each name with label, tags, expiry, lifecycle status, registration date, and active listing/offer prices. Useful for portfolio analysis and wallet profiling.\nTHE tool for any question about the connected wallet's OWN names by lifecycle window (\"my names close to premium\" → status:\"GRACE_PERIOD\"; \"my names about to expire\" → \"EXPIRING_SOON\"; \"which of mine are in premium\" → \"PREMIUM_AUCTION\"). get_expiring_names is market-wide and cannot answer those.\n`summary` counts the WHOLE portfolio; `names` is one page of `totalMatching` — page with offset when returned < totalMatching.\n\nIf you are authenticated via ERC-8128 and omit the wallet parameter, your own wallet is used automatically.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 100,
                "description": "Max results (default 100, max 200)",
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "Pagination offset. Page until `totalMatching` names have been seen — the summary counts the whole portfolio, the rows are one page.",
                "type": "number"
              },
              "status": {
                "default": "all",
                "description": "Lifecycle filter, applied BEFORE paging. \"GRACE_PERIOD\" = expired ≤90 days, the window right before premium — use it for \"my names close to / about to hit premium\". \"EXPIRING_SOON\" = active, ≤90 days left — \"about to expire / about to go to grace\". \"PREMIUM_AUCTION\" = past grace, in the 21-day Dutch auction (registerable by anyone, incl. this wallet; on-chain-confirmed). \"ACTIVE\" = >90 days left. Default \"all\".",
                "enum": ["ACTIVE", "EXPIRING_SOON", "GRACE_PERIOD", "PREMIUM_AUCTION", "all"],
                "type": "string"
              },
              "wallet": {
                "description": "Ethereum wallet address (0x...) or ENS name",
                "type": "string"
              }
            },
            "required": ["wallet"],
            "type": "object"
          },
