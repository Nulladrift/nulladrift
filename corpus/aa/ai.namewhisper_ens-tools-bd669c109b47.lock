        {
          "name": "enumerate_entities",
          "description": "Enumerate ENS-friendly labels for a finite real-world entity category and report which are available vs registered.\n\nUSE THIS for ANY finite set of real-world people, companies, teams, or works — including queries that name a ROLE or PROFESSION rather than a league, e.g. \"which tech founders have an available .eth?\", \"available CEOs / politicians / authors / footballers\", \"famous musicians I can register\", \"NBA hall of famers\", \"available Pixar films\", \"F1 drivers\", \"Beatles songs that are open\". If the user is asking to find/register the names of actual real-world entities (not a vibe or an ENS club), this is the tool — even when the category sounds soft (\"tech founders\", \"crypto founders\", \"famous CEOs\") it is still a finite real-world list, so come straight here; do NOT fall back to search_ens_names for it. The tool generates verified, correctly-spelled ENS labels — do NOT enumerate entity names from your own context and pass them to check_availability, because models routinely misspell long-tail names (scottiepippin instead of scottiepippen) or invent people who don't exist (e.g. \"johncarlton\" as an NBA HOFer). This tool exists precisely to avoid that.\n\nDO NOT use this for:\n- Vibes / themes (\"luxury watch names\", \"edgy crypto names\") — use search_ens_names with concept_search instead.\n- ENS-native categories (\"10k club\", \"3-letter words\") — use search_ens_names with collection_search.\n- Single-name lookups — use check_availability.\n\nReturns a list of entries grouped by status. Each entry has the proper name (e.g. \"Scottie Pippen\") alongside the ENS label (scottiepippen.eth), so you can show users the human-readable name in your reply.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Real-world entity category ONLY — e.g. \"NBA hall of fame players\", \"Pixar feature films\", \"F1 world champions\", \"US presidents\", \"Italian cities\", \"Beatles songs\". Be specific (\"NBA hall of famers\" good; \"basketball players\" too broad), but pass a CLEAN category with NO extra qualifiers: strip availability/quality/price words such as \"available\", \"cheap\", \"star\", \"famous\", \"best\", \"top\" — those are not part of the category and pollute the lookup. For availability, set the \"filter\" param instead; never put it in the category text.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "filter": {
                "default": "all",
                "description": "Which slice to return. \"available\" = registerable names only (most common for \"what can I buy\" queries). \"registered\" = names already owned. \"all\" = both, with status. Default: all.",
                "enum": ["all", "available", "registered"],
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
