        {
          "name": "get_name_details",
          "description": "Get full details for a specific ENS name including owner, expiry, creation date, tags, active listings (with prices in ETH and USD), active offers, ENSIP-25 agent identity bindings, and ENSIP-26 agent context records. creationDate is always populated — for Vickrey-era names (isVickreyEra=true) it reflects the true first-creation date from the 2017-2019 legacy auction contract; for all other names it reflects the on-chain registration date. Always mention creationDate when answering questions about when a name was created or registered. Also returns the name's resolver address and isPublicResolver flag — use these to answer resolver questions instead of guessing; bulk_set_records works for any name where isPublicResolver is true. Returns wrapped (true/false), and when wrapped also wrappedOwner, fuses, and cannotUnwrap — use these to answer wrap/unwrap/fuse questions from data; never guess wrapped status. Note: this makes NO wash-trading / authenticity judgment on a name's sales — for \"is this name's sale history wash trading / fake?\" use wash_check.",
