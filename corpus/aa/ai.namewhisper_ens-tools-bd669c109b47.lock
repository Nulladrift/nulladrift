        {
          "name": "search_knowledge",
          "description": "Search the ENS knowledge base — governance proposals, protocol documentation, developer insights, blog posts, forum discussions, and Farcaster casts from key ENS figures (Vitalik, Nick Johnson, etc.). Powered by semantic search over curated ENS sources.\n\nUSE THIS (don't answer from memory) for any \"how does X work\" / \"what is X\" / \"why does ENS …\" PROTOCOL-MECHANICS question — renewal, the grace period, the premium/temporary-premium auction, registration & commit-reveal, resolvers, subnames, the NameWrapper & fuses, reverse resolution, ENSv2 — plus ENS history, DAO/governance proposals, community sentiment, and \"what did <person> say about <topic>\". Mechanics questions feel answerable from general knowledge, but a sourced, citable answer is the bar here — search first, then cite what you find.\n\nDo NOT use this for name valuations, market data, availability, or a specific name's live status — use the other tools for those.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
