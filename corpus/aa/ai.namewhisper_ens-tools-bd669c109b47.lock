        },
        {
          "name": "provision_agent_identity",
          "description": "Provision a complete ENS identity for an AI agent in one call. Describe your agent's purpose and budget — get back recommended available names, a multi-step registration recipe (commit → register → set agent records), and ready-to-sign transaction data.\n\nThe registration recipe includes agent identity records (ENSIP-25: ai.agent, ai.purpose, ai.capabilities + ENSIP-26: agent-context) as a mandatory step — these records make the agent discoverable in the ENS Agents directory. ENSIP-25 agent-registration binding is included ONLY when an agentRegistry is provided; it is OPTIONAL — do not ask for or wait on a registry address / agent ID, and never block the launch on it. The recipe then OPTIONALLY mints the on-chain ERC-8004 agent identity via the register_agent tool (default route binds the agent to the name per ERC-8217, so it transfers with the name), and finishes with launch_hosted_agent — the gas-free step that prepares the agent's brain on a card; the user saves it on the card, ticking \"go live\" to put it live at namewhisper.ai/agent/<name>.\n\nIMPORTANT: The calling AI MUST execute all steps in the recipe, including the final set_ens_records step. Agent identity is not complete until the text records are on-chain.\n\nExample: \"DeFi trading bot, 0.05 ETH budget\" → names like swiftswap.eth with full registration + identity setup instructions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agentRegistry": {
                "description": "ENSIP-25 agent registry binding. If provided, the provisioning flow will include the agent-registration text record that links this ENS name to your on-chain agent identity.",
                "properties": {
                  "agentId": {
                    "description": "Agent ID in the registry (e.g. \"42\")",
                    "type": "string"
                  },
                  "chainId": {
                    "default": 1,
                    "description": "Chain ID where the registry is deployed (default: 1 for Ethereum mainnet)",
                    "type": "number"
                  },
                  "registryAddress": {
                    "description": "ERC-8004 IdentityRegistry contract address (checksummed 0x...)",
                    "type": "string"
                  }
                },
                "required": ["agentId", "registryAddress"],
                "type": "object"
              },
              "budgetEth": {
                "default": 0.1,
                "description": "Maximum budget in ETH for name acquisition (default: 0.1)",
                "type": "number"
              },
              "preferences": {
                "description": "Optional naming preferences",
                "properties": {
                  "maxLength": {
                    "default": 15,
                    "description": "Maximum name length (default: 15)",
                    "type": "number"
                  },
                  "mustInclude": {
                    "description": "Word or pattern the name must include (e.g. \"trade\", \"data\")",
                    "type": "string"
                  },
                  "style": {
                    "default": "professional",
                    "description": "Naming style — shapes generated names: professional (prime/apex + labs/systems), creative (spark/muse + forge/studio), technical (proto/async + node/daemon), minimal (neo/zen + ai/io). Pass the style the user asks for.",
                    "enum": ["professional", "creative", "technical", "minimal"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "purpose": {
                "description": "What the agent does (e.g. \"DeFi trading bot\", \"data analytics agent\", \"social media manager\", \"infrastructure monitor\")",
                "type": "string"
              },
              "walletAddress": {
                "description": "Agent wallet address (will own the name and sign transactions)",
                "type": "string"
              }
            },
            "required": ["purpose", "walletAddress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5aef79fa78fbef568233e858ae0cf9d6eaee632fca9200349e64f79896a53d7c"
        },
        {
          "name": "purchase_name",
          "description": "Purchase an ENS name — either buy a listed name from a marketplace or register an available name directly on-chain.\n\nFor AVAILABLE names: Returns a complete registration recipe with contract address, ABI, step-by-step instructions, and a pre-generated secret. Your wallet signs and submits the transactions (commit → wait 60s → register).\n\nFor LISTED names: Searches all marketplaces (OpenSea, Grails) for the best price. If there are MULTIPLE active listings, returns CHOOSE_LISTING status with all options — present these to the user and ask which one they want. When the user chooses, call this tool again with the chosen orderHash to get the buy transaction.\n\nThe tool auto-detects whether the name is available or listed. You can override with the 'action' parameter.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "action": {
                "default": "auto",
                "description": "Action: buy_listing (purchase listed name), register (register available name), auto (detect automatically)",
                "enum": ["buy_listing", "register", "auto"],
                "type": "string"
              },
              "duration": {
                "default": 365,
                "description": "Registration duration in days. ENS protocol minimum is 28 days; maximum is 3650 (10 years); default is 365 (1 year). Sub-year is allowed.",
                "maximum": 3650,
                "minimum": 28,
                "type": "integer"
              },
              "durationYears": {
                "description": "DEPRECATED — use duration (days) instead. Number of years (converted to days internally).",
                "type": "number"
              },
              "fromAddress": {
                "description": "ENS v2 only: the wallet that signs and pays in USDC/DAI, when it is not walletAddress (registering to another wallet). Defaults to walletAddress.",
                "type": "string"
              },
              "maxPriceEth": {
                "description": "Maximum price willing to pay in ETH: a listing's price, or for a registration the registration fee plus any premium and the Name Whisper fee",
                "type": "number"
              },
              "maxPriceUsd": {
                "description": "ENS v2 registrations only: the most to pay in USD (v2 is priced in USDC/DAI, so maxPriceEth does not apply to it).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "name": {
                "description": "ENS name to purchase (e.g. \"coffee.eth\")",
                "type": "string"
              },
              "orderHash": {
                "description": "Specific Seaport order hash to fulfill. Use this when the user has chosen a specific listing from multiple options.",
                "type": "string"
              },
              "paymentToken": {
                "description": "ENS v2 registrations only: the stablecoin symbol or address explicitly chosen by the user. Otherwise omit: defaults to the first USDC-family token accepted by the active router (MOCKUSDC on Sepolia; Circle USDC is not accepted there), then DAI, then other accepted tokens. Do not choose based on wallet balances.",
                "type": "string"
              },
              "walletAddress": {
                "description": "Buyer wallet address (will own the name)",
                "type": "string"
              }
            },
            "required": ["name", "walletAddress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
