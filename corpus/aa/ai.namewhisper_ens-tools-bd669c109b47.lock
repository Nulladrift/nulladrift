          "digest": "sha256:dcf32f13021007f7b419cf1aaf7272a95b25e1df654c660b480304e5ae9328ee"
        },
        {
          "name": "transfer_ens_name",
          "description": "Transfer ownership of an ENS name to another wallet. Call this tool IMMEDIATELY — as your first and only action — whenever the user asks to transfer/send/move/give a name to someone: \"transfer coffee.eth to vitalik.eth\", \"send myname.eth to 0xabc...\". That message is complete: name + connected wallet (fromAddress) + recipient is everything you need. Do not ask for confirmation first, do not call any other tool first.\n\nCalling this tool does NOT move the name. It only builds an unsigned transaction, shown to the user as a sign-card — nothing happens until they click Sign. The sign-card IS the confirmation and the preview, so a \"should I go ahead?\" reply in chat is always wrong; the right response to a transfer request is this tool call.\n\nRecipient rule (critical): pass toAddress exactly as the user wrote it — a 0x address OR an ENS name like \"vitalik.eth\". The tool resolves an ENS-name recipient to its on-chain address record itself. NEVER pre-resolve the recipient with get_name_details or any other lookup — get_name_details returns the NFT holder, which is often NOT where the name points, and using it as the destination sends the name to the wrong wallet. Never refuse just because the recipient is a name. If the recipient name has no address record, this tool returns a clear error — relay it and ask for a 0x address.\n\nHandles wrapped (NameWrapper/ERC-1155) and unwrapped (BaseRegistrar/ERC-721) names automatically. Requires: fromAddress currently owns the name; the name is not expired. Transfer moves name ownership; existing resolver records stay on the name. On ENS v2, registry roles move with the name but resolver roles stay with their current holders, so the recipient should use their own resolver.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fromAddress": {
                "description": "Current owner wallet address (must sign the transaction)",
                "type": "string"
              },
              "name": {
                "description": "ENS name to transfer (e.g. \"coffee.eth\")",
                "type": "string"
              },
              "toAddress": {
                "description": "Recipient — either a 0x wallet address OR an ENS name (e.g. \"vitalik.eth\"). ENS names are resolved to their on-chain address record automatically.",
                "type": "string"
              }
            },
            "required": ["fromAddress", "name", "toAddress"],
            "type": "object"
          },
