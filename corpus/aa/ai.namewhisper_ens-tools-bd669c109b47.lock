        {
          "name": "wrap_name",
          "description": "Wrap an unwrapped .eth name into the ENS NameWrapper contract.\n\nWrapping converts the name from an ERC-721 token (BaseRegistrar) to an ERC-1155 token (NameWrapper). This enables:\n- Fuse permissions (restrict what can be done with the name)\n- Protected subnames (subnames with guaranteed permissions)\n- ERC-1155 compatibility for marketplaces and protocols\n\nReturns a two-step transaction recipe: approve + wrap.\n\nAvailable fuses (all IRREVERSIBLE once burned):\n- CANNOT_UNWRAP — prevents unwrapping back to BaseRegistrar\n- CANNOT_BURN_FUSES — prevents burning additional fuses\n- CANNOT_TRANSFER — prevents transfers\n- CANNOT_SET_RESOLVER — prevents resolver changes\n- CANNOT_SET_TTL — prevents TTL changes\n- CANNOT_CREATE_SUBDOMAIN — prevents new subnames\n- CANNOT_APPROVE — prevents approving operators\n\nCANNOT_UNWRAP must be burned before any other fuses can be burned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fuses": {
                "description": "Optional fuses to burn on wrap (e.g. [\"CANNOT_UNWRAP\"]). WARNING: irreversible.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "ENS name to wrap (e.g. \"coffee.eth\")",
                "type": "string"
              },
              "owner": {
                "description": "Address of the current name owner (must own the BaseRegistrar token)",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              }
            },
            "required": ["name", "owner"],
            "type": "object"
          },
