          },
          "digest": "sha256:254944ec02eda559b2dd0dff2d193576a15b2c89391c1d8a391ebef051785b4e"
        },
        {
          "name": "batch_create_listings",
          "description": "Bulk-list up to 500 ENS names for sale on NameWhisper in one signing flow.\n\nReturns an array of unsigned Seaport OrderComponents payloads. The caller's wallet signs them all in one EIP-712 bulk signature (SIP-6), then POSTs the signed orders back to https://namewhisper.ai/api/orderbook/submit-bulk (up to 500 per request) to store.\n\nNW-native only — listings stay on NameWhisper. Cheaper UX than calling create_listing in a loop (one wallet popup vs N).\n\nPer-name errors (invalid label, zero price) are collected in the 'errors' field instead of aborting the whole batch — partial success is normal.\n\nRequires operator approval on the ENS token contract (NameWrapper or BaseRegistrar) — do this once per wallet via approve_operator.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "durationSeconds": {
                "default": 2592000,
                "description": "Listing duration in seconds (applied to every name, default: 30 days, at most 31536000: one year)",
                "exclusiveMinimum": 0,
                "maximum": 31536000,
                "type": "integer"
              },
              "listings": {
                "description": "Array of { name, priceEth }. Per-item validation (empty name, non-positive price) is collected in the errors array rather than rejecting the whole batch.",
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "priceEth": {
                      "type": "number"
                    }
                  },
                  "required": ["name", "priceEth"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "walletAddress": {
                "description": "Wallet address of the seller. Must own all the names.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              }
            },
            "required": ["listings", "walletAddress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f8991c313e60c6b676b4a40a64e1c0856fa25e402aee9591633cd9442519db6f"
        },
        {
          "name": "batch_purchase",
          "description": "Buy up to 20 SPECIFIC listed ENS names in a SINGLE Seaport transaction, across NameWhisper, OpenSea, AND Grails listings.\n\nUse this when the user names the exact names to buy. To buy the cheapest N names in a category/collection (a floor sweep), use the 'sweep' tool instead.\n\nIt's one signature and amortizes gas, far cheaper than calling purchase_name once per name. For each name it picks the cheapest listing (NameWhisper, OpenSea, or Grails), loads its Seaport order, and packs them into one fulfillAvailableAdvancedOrders call. NFTs are delivered directly to the buyer's wallet. Seaport skips any order that sold/cancelled since discovery and refunds the excess — partial fills are safe. The response lists which names made the batch (with marketplace + price) and which were dropped.\n\nAny listing that can't be batched (e.g. a rare restricted-zone Seaport order) is returned in 'failed' — buy those individually with purchase_name. For a single name, purchase_name is also fine.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "names": {
                "description": "Array of ENS names to buy (e.g. [\"coffee.eth\", \"tea.eth\"]). Max 20 per batch.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "walletAddress": {
                "description": "Buyer wallet address — receives all purchased names.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              }
            },
            "required": ["names", "walletAddress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:971a0c5cdffc53e76cbe753a3751623f38d6b973505c221efa13e4d257862ae3"
        },
        {
          "name": "bulk_register",
          "description": "Register multiple ENS names in bulk — total 2 transactions (multiCommit + multiRegister) via NWBulkRegistrar.\n\nMuch cheaper and faster than registering names one at a time. Supports up to 20 names per batch.\n\nFlow: multiCommit (1 tx, all N commitments) → wait 60 seconds → multiRegister (1 tx with total ETH for all N names). Excess ETH is refunded.\n\nOn v1 the batch shares one secret across all names (every name is revealed in the same multiRegister transaction, so no reveal exposes another name's commitment). All names must be available for registration.\n\nAfter registration, use bulk_set_records to configure all names at once with addresses, text records, and content hashes.\n\nOnce ENS has moved to v2 the result has type \"ens_v2_registration\" instead: paid in USDC or DAI (never ETH), steps commit (one tx for all names) → approve (if needed) → wait 60s → register. Through Name Whisper's ENS v2 router (feeMode \"atomic\") one register tx covers every name and carries the Name Whisper fee (1%, same token) in that same transaction; otherwise there is one register per name, each name has its own secret (so one register reveals nothing about the others), and the fee is a separate last transaction, sent only after the registrations go through. Follow the result's message: quote the total once in the token, as the result shows it (e.g. 8.09 USDC), with the Name Whisper fee as included in it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "duration": {
                "default": 365,
                "description": "Registration duration in days, applied to every name in the batch. ENS protocol minimum is 28 days; maximum is 3650 (10 years); default is 365 (1 year).",
                "maximum": 3650,
                "minimum": 28,
                "type": "integer"
              },
              "durationYears": {
                "description": "DEPRECATED — use duration (days) instead. Number of years (converted to days internally).",
                "type": "number"
              },
              "fromAddress": {
                "description": "ENS v2 only: the wallet that signs and pays in USDC/DAI, when it is not walletAddress (registering to another wallet). Defaults to walletAddress.",
                "type": "string"
              },
              "names": {
                "description": "Array of ENS names to register (e.g. [\"coffee.eth\", \"tea.eth\"]). Max 20 per batch.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "paymentToken": {
                "description": "ENS v2 only: the stablecoin symbol or address explicitly chosen by the user. Otherwise omit: defaults to the first USDC-family token accepted by the active router (MOCKUSDC on Sepolia; Circle USDC is not accepted there), then DAI, then other accepted tokens. Do not choose based on wallet balances. Ignored while ENS v1 registration is open, which is paid in ETH.",
                "type": "string"
              },
              "walletAddress": {
                "description": "Wallet address that will own all registered names",
                "type": "string"
              }
            },
            "required": ["names", "walletAddress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c01c435fa985468506ce84690951fec06eda78eb6359f1a19335492549e78356"
        },
        {
          "name": "bulk_set_records",
          "description": "Set ENS resolver records for multiple names in a single transaction — bulk record editing.\n\nAll record updates across all names are batched into one resolver.multicall() call. Much cheaper than setting records one name at a time.\n\nSupports the same record types as set_ens_records: address records (ETH, BTC, SOL, etc.), text records (avatar, description, social handles, AI agent metadata), content hash (IPFS/IPNS), and ENSIP-25 agent-registration records.\n\nYou can set different records for each name (e.g., unique avatars) or the same records across all names (e.g., same ETH address).\n\nMax 50 names per batch. The wallet signing the transaction must be the owner/manager of all included names.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "nameRecords": {
                "description": "Array of name + records pairs. Max 50 names per batch.",
                "items": {
                  "properties": {
                    "name": {
                      "description": "ENS name (e.g. \"myagent.eth\")",
                      "type": "string"
                    },
                    "records": {
                      "description": "Records to set on this name",
                      "properties": {
                        "addresses": {
                          "additionalProperties": {
                            "type": "string"
                          },
                          "description": "Address records by coin type (e.g. {\"ETH\": \"0x...\", \"BTC\": \"bc1...\"})",
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        },
                        "agentRegistration": {
                          "description": "ENSIP-25 shorthand: link this name to an on-chain agent identity",
                          "properties": {
                            "agentId": {
                              "description": "Agent ID in the registry",
                              "type": "string"
                            },
                            "chainId": {
                              "default": 1,
                              "description": "Chain ID (default: 1)",
                              "type": "number"
                            },
                            "registryAddress": {
                              "description": "ERC-8004 IdentityRegistry contract address",
                              "type": "string"
                            }
                          },
                          "required": ["agentId", "registryAddress"],
                          "type": "object"
                        },
                        "contentHash": {
                          "description": "Content hash for decentralized website (IPFS CID or IPNS key)",
                          "type": "string"
                        },
                        "texts": {
                          "additionalProperties": {
                            "type": "string"
                          },
                          "description": "Text records (e.g. {\"avatar\": \"https://...\", \"description\": \"My name\"})",
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        }
                      },
                      "type": "object"
                    }
                  },
                  "required": ["name", "records"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "walletAddress": {
                "description": "Wallet address that owns these names (must sign the transaction)",
                "type": "string"
              }
            },
            "required": ["nameRecords", "walletAddress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d9d1e4baf7a1e63892ef9340d73ea810b4c9feb6ee4a27ef3fc68864bf6a0d31"
        },
        {
          "name": "bulk_transfer_ens_names",
          "description": "Transfer multiple ENS names in one batch — bulk send.\n\nWrapped names going to the same recipient move in one transaction; each unwrapped name and unwrapped subname takes its own. Supports up to 20 names per batch.\n\nAutomatically detects whether each name is wrapped (NameWrapper/ERC-1155) or unwrapped (BaseRegistrar/ERC-721) and builds the correct transfer call for each.\n\nAll names can go to the same recipient or to different recipients — specify a toAddress per name. Each toAddress may be a 0x address OR an ENS name (resolved to its address record automatically); pass what the user gave you and never use get_name_details to resolve a recipient.\n\nConversational flow for \"send all my names\" / \"transfer my names\": first call get_wallet_portfolio to find the names, present the FULL list that will be transferred, confirm the recipient, and get explicit confirmation (this is IRREVERSIBLE). Only THEN call this tool. NEVER auto-transfer without explicit confirmation.\n\nRequirements: fromAddress must currently own ALL names in the batch, and every name must be registered (not expired).\n\nWARNING: This transfers ownership of every name, and it cannot be undone. It moves the names only: each unwrapped name keeps its current manager, so each recipient should sync the manager to themselves (a signer that checks each hand-over on-chain first, such as the Name Whisper terminal, also gets a hand-over transaction per name the sender manages). Resolver records (avatar, addresses, etc.) are unaffected and stay on each name; after transfer, consider bulk_set_records to update ETH address records.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fromAddress": {
                "description": "Current owner wallet address (must sign the transaction). All names must be owned by this address.",
                "type": "string"
              },
              "transfers": {
                "description": "Array of name + recipient pairs. Max 20 per batch. All names must be owned by fromAddress.",
                "items": {
                  "properties": {
                    "name": {
                      "description": "ENS name to transfer (e.g. \"coffee.eth\")",
                      "type": "string"
                    },
                    "toAddress": {
                      "description": "Recipient — a 0x wallet address OR an ENS name (e.g. \"vitalik.eth\"), resolved to its address record automatically",
                      "type": "string"
                    }
                  },
                  "required": ["name", "toAddress"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["fromAddress", "transfers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a32a16270b7bca0293dbba0db1bd23df7e14a3731129e3725e87462c70623c02"
        },
        {
          "name": "cancel_listing",
          "description": "Cancel an active ENS name listing by submitting Seaport's cancel() on-chain.\n\nReturns the unsigned Seaport cancel() transaction calldata. Your wallet signs and submits; once mined, Seaport marks the order invalid and no marketplace (NW, Grails, OpenSea) can fulfill it anymore.\n\nOnly the original seller (the order's offerer) can cancel. If you cross-posted to OpenSea, you signed a second 'opensea' variant of the listing — pass BOTH order hashes as alsoCancel so a single tx kills both variants atomically. alsoCancel takes at most 8 other hashes (do not repeat orderHash), all listings for the same name; the result lists every order the transaction cancels.\n\nFor cancelling offers you've made as a buyer, use cancel_offer instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "alsoCancel": {
                "description": "Up to 8 more of your listings FOR THE SAME NAME to cancel atomically in the same tx (e.g. the OpenSea-variant counterpart of an NW listing). Seaport.cancel() accepts an array — cancelling N orders costs barely more than cancelling one.",
                "items": {
                  "pattern": "^0x[a-f0-9]{64}$",
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "orderHash": {
                "description": "Seaport order hash of the listing to cancel (from get_name_details or the orderbook)",
                "pattern": "^0x[a-f0-9]{64}$",
                "type": "string"
              },
              "walletAddress": {
                "description": "Wallet address of the seller. Must match the original offerer on the order.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              }
            },
            "required": ["orderHash", "walletAddress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:885b28e25c09eb946570c0ed80d71cc29ed5b5c73a861e4f7ca391d520b0fc57"
        },
        {
          "name": "cancel_offer",
          "description": "Cancel an active offer you made on an ENS name. Returns unsigned Seaport cancel() calldata.\n\nOnly the bidder (the order's offerer) can cancel. If the offer was cross-posted to OpenSea, you signed a second 'opensea' variant — pass BOTH order hashes as alsoCancel so one tx kills both. alsoCancel takes at most 8 other hashes (do not repeat orderHash), all offers on the same name; the result lists every order the transaction cancels.\n\nCancelling releases the WETH you'd committed to the offer — the buyer's wallet keeps its WETH balance free to bid elsewhere once the Seaport order is invalidated.\n\nFor cancelling your own listings, use cancel_listing. Collection offers are cancelled from your offers on namewhisper.ai.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "alsoCancel": {
                "description": "Up to 8 more of your offers ON THE SAME NAME to cancel in the same tx (e.g. the OpenSea-variant of an NW offer). Cancelling N orders costs barely more than cancelling one.",
                "items": {
                  "pattern": "^0x[a-f0-9]{64}$",
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "orderHash": {
                "description": "Seaport order hash of the offer to cancel (from get_name_details or the orderbook)",
                "pattern": "^0x[a-f0-9]{64}$",
                "type": "string"
              },
              "walletAddress": {
                "description": "Wallet address of the bidder. Must match the original offerer on the order.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              }
            },
            "required": ["orderHash", "walletAddress"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "readOnlyHint": false
