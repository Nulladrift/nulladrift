        {
          "name": "renew_ens_name",
          "description": "Renew an ENS name or batch of names. Returns the transaction data needed to extend registration.\n\nUnlike registration, renewal is simple — just one transaction with payment. No commit/reveal needed.\n\nAccepts any duration from 1 day up — days, weeks, months, years. ENS protocol has no minimum renewal period; this tool floors at 1 day for safety.\nExamples: 1 day, 7 days (1 week), 28 days (1 month), 365 days (1 year).\n\nAnyone can renew any name (you don't need to be the owner). This is useful for:\n- Extending your own names before expiry\n- Gifting renewal to a friend's name\n- Protecting valuable names from expiring\n\nWhile ENS v1 is open (paid in ETH): returns exact on-chain pricing from the ETHRegistrarController with a 5% buffer (excess is refunded) — do NOT estimate renewal prices yourself. For batch renewals (multiple names), all names are bundled into a SINGLE Multicall3 transaction.\n\nOnce ENS has moved to v2 the result has type \"ens_v2_renewal\" instead: paid in USDC or DAI (never ETH) from walletAddress, with NO buffer and nothing refunded — the wallet pays exactly the total shown. Steps: approve (if needed), then one renew transaction per ENS contract (names already on v2 and names not yet upgraded renew through different contracts, so a mixed batch is two renew transactions). Through Name Whisper's ENS v2 router (feeMode \"atomic\") the Name Whisper fee (1%, same token) is taken in the same transaction as each renewal; otherwise it is a separate last transaction. Follow the result's message: quote the total once in the token, as the result shows it (e.g. 8.09 USDC), with the Name Whisper fee as included in it.\n\nCalling this tool never spends money — it only builds an unsigned transaction rendered as a sign-card; nothing happens until the user clicks Sign. So the sign-card IS the confirmation step.\n\nConversational flow:\n- User names the specific name(s) (\"renew coffee.eth\", \"renew coffee.eth for 3 months\"): call this tool IMMEDIATELY. If no duration was given, use the 1-year default and say so (\"built it for 1 year — tell me if you want longer/shorter\") — do NOT stop to ask the duration first; they can just say a different one and you rebuild.\n- User names a BUDGET (\"renew coffee.eth for $45\", \"put 0.02 ETH into it\", \"I only have ETH for $45\"): pass budgetUsd / budgetEth and NO duration. The tool solves the duration from live on-chain pricing — do not work it out yourself (a 4-character name costs ~$160/yr, a 3-character ~$640/yr; the model got the tier wrong live and quoted 26 days for a 4-char name that $45 actually renews for ~100 days). A budget is a HARD CAP: never rebuild above it to \"save the name\" or reach Active. If the capped renewal leaves the name in grace, the result's budget.summary says so — relay that ONE sentence and hand over the card. Never call this tool more than once for the same budget. Any dollar cost you state comes from budget.summary or price.approxUsd — never from your own ETH/USD conversion.\n- Every result carries whatThisBuys — the new expiry DATE and days from now. That sentence is what you quote before and AFTER the transaction, never the duration (\"locked in for 90 days\" was said live about a renewal that bought 2 days: it extends from the ORIGINAL expiry).\n- Open-ended \"renew my names\" / \"bulk renew\" with no list: first call get_wallet_portfolio to find the names, IGNORE every EXPIRED and PREMIUM_AUCTION name (renewing those reverts the whole batch), present a numbered list grouped by urgency, and ask which names + what duration. Only THEN call this tool.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "budgetEth": {
                "description": "Spend cap in ETH (\"renew X with 0.02 ETH\", \"I only have 0.05 ETH\") — ONLY when the user states an ETH amount. A dollar figure is budgetUsd even when it says ETH (\"$1 of eth\", \"$20 worth of ETH\"): never convert dollars to ETH yourself. Same behaviour as budgetUsd. Mutually exclusive with budgetUsd. Not accepted on ENS v2, which is paid in USDC/DAI.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "budgetUsd": {
                "description": "Spend cap in USD (\"renew X for $45\", \"put $20 into it\"). The tool prices the name(s) on-chain and picks the LONGEST whole number of days whose transaction value fits under this cap — never compute the duration yourself from a budget. Mutually exclusive with budgetEth.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "duration": {
                "description": "Duration in days to extend registration (e.g. 7 for 1 week, 28 for a month, 365 for a year). Default: 365. Minimum: 1 day. Maximum: 36500 (100 years). When a budget is also given, the budget wins: the duration is capped to what the budget covers.",
                "maximum": 36500,
                "minimum": 1,
                "type": "integer"
              },
              "names": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                ],
                "description": "ENS name or array of names to renew (e.g. \"coffee.eth\" or [\"coffee.eth\", \"wallet.eth\"])"
              },
              "paymentToken": {
                "description": "ENS v2 only: the stablecoin symbol or address explicitly chosen by the user. Otherwise omit: defaults to the first USDC-family token accepted by the active router (MOCKUSDC on Sepolia; Circle USDC is not accepted there), then DAI, then other accepted tokens. Do not choose based on wallet balances.",
                "type": "string"
              },
              "walletAddress": {
                "description": "The wallet that will sign and pay. Required on ENS v2, where the renewal pulls USDC/DAI from this wallet; ignored on v1.",
                "type": "string"
              },
              "years": {
                "description": "DEPRECATED — use duration instead. Number of years (converted to days internally). At most 100, the same ceiling as duration.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "readOnlyHint": false
