        {
          "name": "start_case",
          "title": "Send a case to Gabija Citizenship",
          "description": "Sends the person's details to Gabija Citizenship for a free eligibility review, exactly like the form on https://gabijacitizenship.com/check. We read the family line and reply by email; a confirmation email arrives shortly. Only call this after the person has clearly asked to send their details to Gabija Citizenship, and set confirmed_by_person to true. Never guess an email address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ancestor": {
                "description": "Closest ancestor who was a citizen of independent Lithuania (1918-1940): parent, grandparent, great_grandparent, further (great-great-grandparent or beyond), or not_sure.",
                "enum": ["parent", "grandparent", "great_grandparent", "further", "not_sure"],
                "type": "string"
              },
              "confirmed_by_person": {
                "description": "True only when the person explicitly asked to send these details to Gabija Citizenship.",
                "type": "boolean"
              },
              "departure_time": {
                "description": "When that ancestor or the family left Lithuania: before_1918, 1918_to_1990, after_1990, or not_sure.",
                "enum": ["before_1918", "1918_to_1990", "after_1990", "not_sure"],
                "type": "string"
              },
              "email": {
                "description": "The email address where we should send the review.",
                "maxLength": 254,
                "type": "string"
              },
              "email_confirmed": {
                "description": "Set to true only if we flagged the email as possibly mistyped and the person confirmed it is correct.",
                "type": "boolean"
              },
              "family_story": {
                "description": "What they know about their Lithuanian ancestor and the family line: names, places, dates, when the family left, documents they have.",
