      },
      "instructions": "Gabija Citizenship runs Lithuanian citizenship by descent cases for people of Lithuanian descent in the US, Canada, the UK, Australia and Israel, from the free eligibility check to the passport. We have our own specialists in Lithuania and run the whole case. get_overview returns our published facts (who qualifies, dual citizenship, timeline, cost, process) and get_faq returns our published answers to common questions. check_eligibility applies the same logic as the eligibility check on https://gabijacitizenship.com/check and lists the facts still missing and the first documents to gather. Its result is preliminary; our team confirms every case. get_document_checklist, estimate_cost_timeline and find_records return our published guidance on documents, on cost and timeline, and on where the ancestor's records are kept. start_case sends the person's details to us for a free review by email. It requires the person's explicit go-ahead, recorded as confirmed_by_person.",
      "tools": [
        {
          "name": "check_eligibility",
          "title": "Check Lithuanian citizenship eligibility",
          "description": "Quick read of whether a family line qualifies for Lithuanian citizenship reinstatement: which generation the Lithuanian ancestor is, and when the family left Lithuania. Gives the same preliminary read as the eligibility check on https://gabijacitizenship.com/check, plus the facts still missing, anything that closes the route, and the first documents to gather. Ask the person for each answer; use \"not_sure\" when they don't know. The result is preliminary: our team confirms every case.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ancestor": {
                "description": "Closest ancestor who was a citizen of independent Lithuania (1918-1940): parent, grandparent, great_grandparent, further (great-great-grandparent or beyond), or not_sure.",
                "enum": ["parent", "grandparent", "great_grandparent", "further", "not_sure"],
                "type": "string"
              },
              "departure_time": {
                "description": "When that ancestor or the family left Lithuania: before_1918, 1918_to_1990, after_1990, or not_sure.",
                "enum": ["before_1918", "1918_to_1990", "after_1990", "not_sure"],
                "type": "string"
              }
            },
            "required": ["ancestor", "departure_time"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "blockers": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "eligibility_check_url": {
                "type": "string"
              },
