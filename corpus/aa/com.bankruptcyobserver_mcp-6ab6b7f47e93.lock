      "instructions": "Bankruptcy Observer covers US business bankruptcy cases compiled from federal court records since 2005: case identity, docket text, debtor's counsel, a subscriber's monitoring list, and court filing PDFs. It is for a company bankruptcy, a case number, an EIN, a docket, or new business filings by industry, NAICS code, state, or date. Individual consumer debtors and adversary proceedings are omitted unless the request asks for them. A short case number can match more than one court; a court name or state distinguishes them. An exact or prefix name search, and a 7-digit case-number lookup, do not require a subscription. Other case data requires the signed-in subscriber. Downloading a court PDF can cost money, and the cost is shown before any charge. Records can lag the court. This is not legal advice.",
      "tools": [
        {
          "name": "add_monitored_case_tool",
          "title": "Add case to my monitoring list",
          "description": "Add a bankruptcy case to your BankruptcyObserver.com monitoring list so BKO checks the court hourly and updates the docket every business day. Pass simple_name or a 7-digit case_number (with court when the number is reused). Subscribers only; respects your plan monitoring limit.",
          "inputSchema": {
            "properties": {
              "case_number": {
                "description": "7-digit short case number alternative to simple_name.",
                "type": "string"
              },
              "court": {
                "description": "Court name as returned in the court field, for example \"Delaware\" or \"Texas Southern\".",
                "type": "string"
              },
              "court_state": {
                "description": "2-letter state. Matches every district in that state.",
                "type": "string"
              },
              "simple_name": {
                "description": "Case simpleName (e.g. SILVER-AIRWAYS).",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
