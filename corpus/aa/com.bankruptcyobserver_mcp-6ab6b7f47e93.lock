        {
          "name": "get_cases_by_date_range_tool",
          "title": "List cases filed in a date range",
          "description": "US business bankruptcy cases filed in a date range (dateFiled). Individual debtors and adversary proceedings (lawsuits) are omitted unless include_individuals or include_adversary is true. Omitting both dates defaults to yesterday. start_date and end_date are inclusive calendar days (YYYY-MM-DD), including filings later that day. Case numbers are shortCaseNumber. total is the full match count, not the page size. limit is one page (max 500, default 100); pass skip or offset for the next page. has_more is true when more rows remain. Paid.",
          "inputSchema": {
            "properties": {
              "end_date": {
                "description": "YYYY-MM-DD. Inclusive through the end of that calendar day.",
                "type": "string"
              },
              "include_adversary": {
                "description": "Include adversary proceedings (lawsuits). Default false.",
                "type": "boolean"
              },
              "include_individuals": {
                "description": "Include individual debtors. Default false (business filings only).",
                "type": "boolean"
              },
              "limit": {
                "description": "Max rows in this page (1-500). Default 100. total is the full match count.",
                "type": "integer"
              },
              "offset": {
                "description": "Alias for skip.",
                "type": "integer"
              },
              "skip": {
                "description": "Rows to skip. Alias: offset. skip wins when both are set.",
                "type": "integer"
              },
              "start_date": {
                "description": "YYYY-MM-DD. Inclusive of that whole calendar day.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List cases filed in a date range"
