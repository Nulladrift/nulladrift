        {
          "name": "get_docket_entries_tool",
          "title": "Read docket entries",
          "description": "Docket entries for a case. Numbered entries come first (itemNumber ascending); entries with no court docket number (itemNumber null) follow. missing_item_numbers lists numbers with no stored row. Each entry includes the full PACER itemText (never sliced). The case is identified by simpleName. A cost preview does not download the PDF. Downloading a PDF can charge the account. Pass simple_name or short_case_number / case_number (e.g. 26-42901; use court or court_state to disambiguate). Optional item_number or item_from/item_to to fetch specific entries. Single Case plan: monitored cases only. limit max 50 (default 25); pass skip (or offset, or 1-based page) to walk past the first block. A page may contain fewer than limit entries so every caption stays complete for MCP clients. Response includes total, skip, limit, returned, and has_more. This lookup reads the stored docket and does not contact the court.",
          "inputSchema": {
            "properties": {
              "case_number": {
                "description": "Short or full case number (e.g. 26-42901 or 1-26-42901). Pass court to pick one court when the number is reused.",
                "type": "string"
              },
              "court": {
                "description": "Court name as returned in the court field, for example \"Delaware\" or \"Texas Southern\".",
                "type": "string"
              },
              "court_state": {
                "description": "2-letter state. Matches every district in that state.",
                "type": "string"
              },
              "docket_id": {
                "description": "Return only this docket entry (40-character hex hash). Full itemText.",
                "type": "string"
              },
              "item_from": {
                "description": "Filter to items with itemNumber >= this value.",
                "type": "integer"
              },
              "item_number": {
                "description": "Return only this docket item number. Full itemText.",
                "type": "integer"
              },
              "item_to": {
                "description": "Filter to items with itemNumber <= this value.",
                "type": "integer"
              },
              "limit": {
                "description": "Max entries to return (default 25, max 50). Combine with skip to walk the full docket. itemText is never cut; a page may return fewer than this when captions are long.",
                "type": "integer"
              },
              "offset": {
                "description": "Alias for skip.",
                "type": "integer"
              },
              "page": {
                "description": "1-based page number; equivalent to skip=(page-1)*limit. Ignored if skip or offset is set.",
                "type": "integer"
              },
              "short_case_number": {
                "description": "Alias for case_number.",
                "type": "string"
              },
              "simple_name": {
                "description": "Case simpleName (e.g. 1251-pacific-st-llc).",
                "type": "string"
              },
              "skip": {
                "description": "Number of entries to skip before returning results (default 0). Example: limit=50, skip=50 returns items 51–100.",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read docket entries"
          },
          "behavior": {
