        {
          "name": "get_recent_developments_tool",
          "title": "Get recent case developments",
          "description": "What happened recently? Docket entries since a date (default: last 7 days) for one monitored case (simple_name) or ALL your monitored cases when simple_name is omitted. Newest first, with item numbers, dates, full itemText (never sliced), and counts. A page may contain fewer than limit entries so every caption stays complete. Subscribers only.",
