        "name": "wake-site-readiness",
        "title": "Wake site readiness",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Three tools, no key needed. wake_check_site(host) scores how an AI agent experiences a public site and lists what to fix. wake_signup(site, email, terms_accepted) starts the free 7-day trial for a site you own and returns the desk URL, an API key and the next steps, so you can install the tracker and read the desk over MCP in the same session. wake_about explains Wake. Results keep structural signals only.",
      "tools": [
        {
          "name": "wake_about",
          "title": "What Wake is",
          "description": "One paragraph on Wake (agent experience optimization and agent engine optimization for a website), with links to docs, API, MCP and signup.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b20a35d76cab3e0dbb0d22dfd9f58652cbcfbfe9b9073e0cba674768d044525"
        },
        {
          "name": "wake_check_site",
          "title": "Check a site's agent readiness",
          "description": "Probe a public hostname the way an AI agent sees it (homepage, robots.txt, llms.txt, sitemap, agent card) and return scores out of 100 with concrete recommendations and publish-ready llms.txt / robots files. Input is a hostname only; the probe keeps structural signals, never page bodies. No account needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "host": {
                "description": "Public hostname, e.g. docs.example.com",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:814ba0d16fe2f3551b2a4f1ef4f217573bedf394eac1d2a28bd8d0bd2b547a5a"
        },
        {
          "name": "wake_signup",
          "title": "Start the free Wake trial for a website you own",
          "description": "Opens the Wake desk for a website you own and returns everything needed to finish setup in one call: the desk URL, an API key, the MCP endpoint and the next steps (wake_provision for the tracker file, wake_verify to prove the site, wake_fix_plan for what to change). 7-day trial, no card, no browser; watching the agents and the loss count stay free for good after it. Use it when the site's owner asked you to set up Wake, or after wake_check_site showed problems worth fixing on a site you work for. Needs site, email and terms_accepted: true (terms: /wake/docs/terms.md, privacy: /wake/docs/privacy.md). One desk per host; the owner can invite you to an existing one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The owner's email; the desk sign-in link and the weekly brief go there.",
                "type": "string"
              },
              "site": {
                "description": "The website, e.g. https://docs.example.com",
                "type": "string"
              },
              "source": {
                "description": "Optional: where you found Wake (mcp, docs, score).",
                "type": "string"
              },
              "terms_accepted": {
                "description": "true once the Terms and Privacy policy are accepted on the owner's behalf.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
