  "subjects": {
    "ai.wakeagents/site-readiness": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://wakeagents.ai/api/wake/v1/public/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "wake-site-readiness",
        "title": "Wake site readiness",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call wake_check_site with a public hostname to see how an AI agent experiences that site and what to fix. wake_about explains Wake. wake_signup opens a desk for a site you own and returns an API key for the desk server. No key needed here; results keep structural signals only.",
      "tools": [
        {
          "name": "wake_about",
          "title": "What Wake is",
          "description": "One paragraph on Wake (agent experience optimization and agent engine optimization for a website), with links to docs, API, MCP and signup.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b9b25d5e50a165f7f38dc9dbaa336476455c9076dd4fae3d6c8f65d33dd34a9"
        },
        {
          "name": "wake_check_site",
          "title": "Check a site's agent readiness",
          "description": "Probe a public hostname the way an AI agent sees it (homepage, robots.txt, llms.txt, sitemap, agent card) and return scores out of 100 with concrete recommendations and publish-ready llms.txt / robots files. Input is a hostname only; the probe keeps structural signals, never page bodies. No account needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "host": {
                "description": "Public hostname, e.g. docs.example.com",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:866e1c7f8b3de6e149ce704cd59d575a336d81d72b003803e97a321284977c73"
        },
        {
          "name": "wake_signup",
          "title": "Open a Wake desk for a website",
          "description": "Create the account and the desk for a website you own and get an API key back, so you can install the tracker and read the desk over MCP. Needs site, email and terms_accepted: true (terms: /wake/docs/terms.md, privacy: /wake/docs/privacy.md). One desk per host; rate-limited.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The owner's email; the desk sign-in and the weekly brief go there.",
                "type": "string"
              },
              "site": {
                "description": "The website, e.g. https://docs.example.com",
                "type": "string"
              },
              "terms_accepted": {
                "description": "true once the Terms and Privacy policy are accepted.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90643abc49bf229544ea57b61934ab0f6ee5cb5c2c3822b26d940eeb6560dd52"
        }
      ],
      "digest": "sha256:448ef356abf25cb9afc7707265f026f609d98185932ac5675a9e07d8b5e968a6"
    }
  }
