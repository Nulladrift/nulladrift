        {
          "name": "get_covenant",
          "title": "Read the Covenant",
          "description": "Return the full Polderchain Covenant: Axiom Zero, the seven Directives (each with the balance clause that keeps it from being absolute) and the rule for parking a deadlock with a human elder.\nUse it to read or quote the Covenant. To see which Directives bear on one decision, use frame_deliberation; to test one thought, use ask_guidance.\nBehavior: no key; writes nothing. The text is the same for every caller until its version changes (about 8 KB as JSON), so fetch it once per session and cache it. Limit: 120 calls per minute per address, 600 with a key, shared across all MCP calls; past it, an error with retry_after.\nas_markdown: false gives one object per Directive, with the ids (directive-1 to directive-7) that frame_deliberation, check_deliberation and attest_deliberation take; true gives one Markdown document to quote or show a person.",
