        {
          "name": "verify_attestation",
          "title": "Check an attestation",
          "description": "Verify an attestation made by attest_deliberation: checks its EdDSA signature against this site's signing key and returns the decoded payload with issuer and issue time. Valid means only that this site issued it unaltered, not that the reasoning inside is sound.\nUse it when an agent hands you an attestation and you have no JWS library; otherwise verify offline against /.well-known/attestation-keys.json and skip the call. To create one, use attest_deliberation.\nBehavior: no key; nothing is stored. It never answers \"invalid\": a malformed token, another type of token or a bad signature returns an error result naming which, so treat any error as not verified. Limit: 120 calls per minute per address, 600 with a key, shared across all MCP calls; past it, an error with retry_after.\nattestation: the string in the attestation field of attest_deliberation's result, three base64url parts (header with alg, typ and kid; payload; signature) joined by dots. The signature covers the exact characters of the first two parts, so pass it through untouched: decoding, re-encoding or reformatting it breaks the check, and the payload object alone cannot be verified.",
          "inputSchema": {
            "properties": {
              "attestation": {
                "description": "the compact JWS exactly as attest_deliberation returned it: three base64url segments separated by dots",
                "pattern": "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["attestation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "issued_at": {
                "description": "ISO-8601 time",
                "type": "string"
              },
              "issued_by": {
                "description": "issuer site URL",
                "type": "string"
              },
              "payload": {
                "additionalProperties": true,
                "description": "the decoded attestation payload (same shape as attest_deliberation returns)",
                "type": "object"
              },
              "signature": {
                "description": "only ever \"valid\" here; failures are returned as errors",
                "enum": ["valid"],
                "type": "string"
              },
              "what_this_means": {
                "description": "plain-language reading of the result",
                "type": "string"
              }
            },
            "required": ["payload", "signature"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
