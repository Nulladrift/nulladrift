        {
          "name": "attest_deliberation",
          "title": "Get signed proof you deliberated",
          "description": "Sign a record that you deliberated: a compact JWS (EdDSA; header typ spk-attestation+jwt with a kid) whose payload holds your question, answers and resolution (or their SHA-256 hashes), the issue time and the result of the same shape check as check_deliberation. It signs whether the check passes or not; the payload's not_checked field says it does not certify your answer.\nUse it after frame_deliberation when someone else needs proof: it returns check_deliberation's findings sealed in a token you hand on. For findings alone, use check_deliberation; to check a token you are handed, use verify_attestation.\nBehavior: writes nothing; the signing key stays on the server and no copy is kept, so a record cannot be revoked, updated or reissued, and it never expires. Anyone can verify it offline with the public key at /.well-known/attestation-keys.json (match the kid). No key needed. Limit: 120 calls per minute per address, 600 with a key, shared across all MCP calls; past it, an error with retry_after. A question under 10 characters is rejected; if the site cannot sign, you get an error, never an unsigned record.\nInputs: question decides which Directives are detected and is signed as sent (trimmed); every text value in answers is signed under working, not only the must_answer ids; directives must match what check_deliberation got so the signed findings agree; resolution is signed verbatim. redact=true swaps the question, each answer and the resolution for sha256:<hex> of the trimmed text, so the text stays with you and whoever holds it can prove a match.",
          "inputSchema": {
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "your answers keyed by the must_answer ids from frame_deliberation (tension, cost, falsifier, human_knowledge, directive-N); these are what gets signed, or hashed when redact=true",
                "properties": {
                  "cost": {
                    "description": "what your resolution costs, and who bears it",
                    "type": "string"
                  },
                  "falsifier": {
                    "description": "what would show your resolution was wrong",
                    "type": "string"
                  },
                  "human_knowledge": {
                    "description": "what the human side knows here that you do not",
                    "type": "string"
                  },
                  "needs_human": {
                    "description": "optional: \"yes\" to hand the decision to a person, \"no\" to say plainly that none is needed",
                    "type": "string"
                  },
                  "tension": {
                    "description": "which Directives are in tension and why",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "directives": {
                "description": "optional: the same directives you passed to check_deliberation, if any, so the signed check covers the same Directives",
                "items": {
                  "enum": ["directive-1", "directive-2", "directive-3", "directive-4", "directive-5", "directive-6", "directive-7"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "question": {
                "description": "the question you deliberated, same text as before",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "redact": {
                "default": false,
                "description": "false (default): the record carries your question, answers and resolution in clear; true: it carries SHA-256 hashes of them instead, so the text stays with you and a reader can only confirm a match",
                "type": "boolean"
              },
              "resolution": {
                "description": "what you decided, one or two sentences; signed verbatim",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question", "resolution"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "attestation": {
                "description": "the record as a compact JWS: three base64url segments separated by dots; this is what you keep and hand on",
                "type": "string"
              },
              "note": {
                "description": "keep it: the site stored nothing",
                "type": "string"
              },
              "payload": {
                "additionalProperties": true,
                "properties": {
                  "claim": {
                    "description": "what the site attests",
                    "type": "string"
                  },
                  "directives_in_tension": {
                    "description": "",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "how_to_read": {
                    "description": "how to check and read the record",
                    "type": "string"
                  },
                  "iat": {
                    "description": "issued at, Unix seconds",
                    "type": "integer"
                  },
                  "iss": {
                    "description": "issuer site URL",
                    "type": "string"
                  },
                  "jti": {
                    "description": "record id",
                    "type": "string"
                  },
                  "kind": {
                    "description": "polderchain-deliberation",
                    "type": "string"
                  },
                  "nbf": {
                    "description": "not before, Unix seconds; equal to iat",
                    "type": "integer"
                  },
                  "not_checked": {
                    "description": "what the site does not vouch for",
                    "type": "string"
                  },
                  "observed": {
                    "additionalProperties": true,
                    "properties": {
                      "addressed": {
                        "description": "Directive ids addressed",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "missing": {
                        "description": "gaps the shape check found, {what, id}",
                        "items": {
                          "additionalProperties": true,
                          "properties": {
                            "id": {
                              "description": "",
                              "type": "string"
                            },
                            "what": {
                              "description": "",
                              "type": "string"
                            }
                          },
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "needs_human": {
                        "type": "boolean"
                      },
