        {
          "name": "check_deliberation",
          "title": "Check the shape of your reasoning",
          "description": "Audit the shape of a finished deliberation. Takes the question plus your written answers and resolution; returns the Directives you did not address, the must_answer questions left blank, too short or empty of content, and a state: open (gaps remain), parked (complete, but a person should decide) or resolved. It checks shape, never whether you are right.\nUse it after frame_deliberation and before you act. It returns findings only; attest_deliberation returns the same findings signed into a token you can hand on. For one planned action with no conflict, use ask_guidance.\nBehavior: fixed rules, not a model, and no side effects. It parks when your answers say a person is needed, or when no Directive was detected and your tension answer does not call the decision ordinary; parking notifies no one, so to reach a person open the question with deliberate_open (rung human), listed once you send a key. No key needed. Limit: 120 calls per minute per address, 600 with a key, shared across all MCP calls; past it, an error with retry_after.\nInputs: question and directives must match what frame_deliberation got, or a different set of Directives is checked. answers is keyed by must_answer id (tension, cost, falsifier, human_knowledge, plus directive-N for each Directive in tension): each needs at least 15 characters of real content, human_knowledge may honestly be \"nothing relevant\", \"does not apply, because...\" addresses a Directive, and needs_human \"yes\" parks it on purpose. resolution is your decision in a sentence; writing \"I need a person to decide\" there also parks it.",
          "inputSchema": {
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "your answers keyed by the must_answer ids from frame_deliberation: tension, cost, falsifier, human_knowledge, plus directive-1..directive-7 for each Directive in tension; a missing or empty key counts as skipped",
                "properties": {
                  "cost": {
                    "description": "what your resolution costs, and who bears it",
                    "type": "string"
                  },
                  "falsifier": {
                    "description": "what would show your resolution was wrong",
                    "type": "string"
                  },
                  "human_knowledge": {
                    "description": "what the human side knows here that you do not",
                    "type": "string"
                  },
                  "needs_human": {
                    "description": "optional: \"yes\" to hand the decision to a person, \"no\" to say plainly that none is needed",
                    "type": "string"
                  },
                  "tension": {
                    "description": "which Directives are in tension and why",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "directives": {
                "description": "optional: the same directives you passed to frame_deliberation, if any, so the same Directives are checked",
                "items": {
                  "enum": ["directive-1", "directive-2", "directive-3", "directive-4", "directive-5", "directive-6", "directive-7"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "question": {
                "description": "the same question text you gave frame_deliberation, so the same Directives are detected",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "resolution": {
                "description": "what you decided, one or two sentences",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question", "resolution"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "addressed": {
                "description": "Directive ids your answers covered",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "checked": {
                "description": "always \"shape\"",
                "type": "string"
              },
              "complete": {
                "description": "true when nothing required was skipped",
                "type": "boolean"
              },
              "directives_considered": {
                "description": "Directive ids detected for the question",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "disclaimer": {
                "description": "what a shape check does not tell you",
                "type": "string"
              },
