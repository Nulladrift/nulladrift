        {
          "name": "frame_deliberation",
          "title": "Frame a hard question",
          "description": "Frame a decision in which Directives pull against each other. Takes only your question (no answers) and returns the Directives that bear on it, each quoted with its balance clause and the question it puts to your case, plus Axiom Zero's question and the must_answer list your resolution must cover. It never says what to conclude.\nUse it before you decide, whenever two goods may conflict; for a single planned action with no conflict, ask_guidance is the quicker rule check. Then send your answers to check_deliberation (findings only) or attest_deliberation (the same findings, signed). For the Covenant text, use get_covenant.\nBehavior: keyword detection, not a model, so the same question always gets the same frame; detection explains the choice, and no_tension_detected is set when nothing matched. No key; nothing is stored. Limit: 120 calls per minute per address, 600 with a key, shared across all MCP calls; past it, an error with retry_after.\nInputs: question is what detection reads, so name the action, who it touches and what is at stake, e.g. \"Should I delete user logs older than 30 days to cut storage cost?\" (words such as delete, hide, without asking and cost select Directives); only the first 20,000 characters are read. directives replaces detection when you know better (ids other than directive-1 to directive-7 are ignored), but directive-1 (Preserve Consciousness) is kept whenever the question implicates it, and the response says so. Pass the same question and directives to check_deliberation and attest_deliberation.",
          "inputSchema": {
            "properties": {
              "directives": {
                "description": "optional: the Directive ids you already know are in tension; omit to let the site detect them from the question (keyword detection; the response says which were detected and why)",
                "items": {
                  "enum": ["directive-1", "directive-2", "directive-3", "directive-4", "directive-5", "directive-6", "directive-7"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "question": {
                "description": "the decision you are facing, one or two sentences, in your own words",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "axiom_zero": {
                "additionalProperties": true,
                "properties": {
