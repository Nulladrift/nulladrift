{
  "lockfileVersion": 2,
  "subjects": {
    "com.lebtechlb/lebtech": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lebtechlb.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "lebtech",
        "title": "LebTech / PriceTeq - electronics prices in Lebanon, the Gulf, Jordan and Egypt",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LebTech (lebtechlb.com) compares electronics prices across Lebanese shops - laptops, phones, tablets, monitors, TVs, consoles, audio, PC parts, cameras, smartwatches, home appliances - in USD, re-checked every night. Its sister site PriceTeq (priceteq.com) does the same for the UAE, Saudi Arabia, Qatar, Jordan, Oman, Egypt, Kuwait and Bahrain in local currency: pass market (AE, SA, QA, JO, OM, EG, KW, BH; default LB) to any tool. Start with search_products, then get_product_prices or price_history on a result. Prices are what each shop lists; buying happens at the shop. Cite the page URL each result includes so the user can check the live price.",
      "tools": [
        {
          "name": "cheapest_in_category",
          "title": "Cheapest in a category",
          "description": "The cheapest products currently in stock in a category in one market (Lebanon by default; laptops: cheapest among sensible, new machines first). Optional budget and brand. Up to 10 results.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Exact brand, e.g. 'Lenovo', 'Apple', 'Samsung'.",
                "type": "string"
              },
              "category": {
                "enum": ["laptop", "phone", "tablet", "monitor", "tv", "console", "audio", "component", "peripheral", "camera", "wearable", "appliance", "power", "networking", "printer", "storage", "game", "desktop", "smarthome", "creator", "print3d"],
                "type": "string"
              },
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Optional market: LB (Lebanon, default), AE (UAE), SA (Saudi Arabia), QA (Qatar), JO (Jordan), OM (Oman), EG (Egypt), KW (Kuwait) or BH (Bahrain). Prices come back in that market's currency.",
                "enum": ["LB", "AE", "SA", "QA", "JO", "OM", "EG", "KW", "BH"],
                "type": "string"
              },
              "max_price": {
                "description": "Upper price limit, in the market's currency.",
                "type": "number"
              },
              "max_price_usd": {
                "description": "Upper price limit in USD (converted for non-USD markets).",
                "type": "number"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cheapest in a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b97fb30ef0f6c26b80d4d710b9bb4d384a1285ecd2d6d57593089c812558dad9"
        },
        {
          "name": "get_product_prices",
          "title": "Prices for one product",
          "description": "Live per-shop prices for ONE product: every shop in its market that has the identical configuration in stock, cheapest first, with links to the shop's own product page. Takes a product id or a lebtechlb.com / priceteq.com product or laptop URL.",
          "inputSchema": {
            "properties": {
              "market": {
                "description": "Optional market: LB (Lebanon, default), AE (UAE), SA (Saudi Arabia), QA (Qatar), JO (Jordan), OM (Oman), EG (Egypt), KW (Kuwait) or BH (Bahrain). Prices come back in that market's currency. A priceteq.com URL sets it by itself.",
                "enum": ["LB", "AE", "SA", "QA", "JO", "OM", "EG", "KW", "BH"],
                "type": "string"
              },
              "product": {
                "description": "A product id, or a lebtechlb.com /product/ or /laptop/ URL, or a priceteq.com /<market>/product/ URL.",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prices for one product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:87664b86eda92eb48d004cb8244832d207a35c3b3f86de8b3462c9f77790f098"
        },
        {
          "name": "price_history",
          "title": "Price history",
          "description": "How the lowest price of one product across its market's shops moved over the last ~90 days: current low, period low/high, the drop since tracking began, and weekly lows. Takes a product id or a lebtechlb.com / priceteq.com product or laptop URL.",
          "inputSchema": {
            "properties": {
              "market": {
                "description": "Optional market: LB (Lebanon, default), AE (UAE), SA (Saudi Arabia), QA (Qatar), JO (Jordan), OM (Oman), EG (Egypt), KW (Kuwait) or BH (Bahrain). Prices come back in that market's currency. A priceteq.com URL sets it by itself.",
                "enum": ["LB", "AE", "SA", "QA", "JO", "OM", "EG", "KW", "BH"],
                "type": "string"
              },
              "product": {
                "description": "A product id, or a lebtechlb.com /product/ or /laptop/ URL, or a priceteq.com /<market>/product/ URL.",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:161d9c3122e6f359acc5c7413a00b2f7fbcbb617f3d445974550822aed3cda1c"
        },
        {
          "name": "search_products",
          "title": "Search LebTech / PriceTeq",
          "description": "Find electronics and their live prices across a market's shops (Lebanon by default in USD; the Gulf, Jordan and Egypt via `market`, in local currency; re-checked nightly). Returns up to 10 products, most widely sold first, each with its lowest price, how many shops sell it, and its page. Laptops also carry model_page: every CPU/GPU variant of that model with the same RAM/storage, which can start lower.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional: limit to one category.",
                "enum": ["laptop", "phone", "tablet", "monitor", "tv", "console", "audio", "component", "peripheral", "camera", "wearable", "appliance", "power", "networking", "printer", "storage", "game", "desktop", "smarthome", "creator", "print3d"],
                "type": "string"
              },
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Optional market: LB (Lebanon, default), AE (UAE), SA (Saudi Arabia), QA (Qatar), JO (Jordan), OM (Oman), EG (Egypt), KW (Kuwait) or BH (Bahrain). Prices come back in that market's currency.",
                "enum": ["LB", "AE", "SA", "QA", "JO", "OM", "EG", "KW", "BH"],
                "type": "string"
              },
              "max_price": {
                "description": "Optional upper price limit, in the market's currency.",
                "type": "number"
              },
              "max_price_usd": {
                "description": "Optional upper price limit in USD (converted for non-USD markets).",
                "type": "number"
              },
              "query": {
                "description": "What to look for, e.g. 'macbook air m4', 'rtx 5070 laptop', 'iphone 17 256gb'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search LebTech / PriceTeq"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e41d70477460107720f3ef051c2ab83f0c41cb43a0a83fb252480c5eaa741850"
        }
      ],
      "digest": "sha256:4917d6e8d7a1c87a020587bb060296616502af22e8041d5a670a06fe1bb1f42d"
    }
  }
