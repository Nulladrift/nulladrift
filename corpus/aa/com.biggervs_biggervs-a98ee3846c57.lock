      },
      "transport": {
        "type": "http",
        "url": "https://biggervs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "biggervs",
        "title": "biggervs",
        "version": "1.0.0",
        "websiteUrl": "https://biggervs.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Return the measurement scope, policy and source link with quoted figures. Natural objects use selected examples. Country area scopes and planetary mean diameters are recorded explicitly.",
      "tools": [
        {
          "name": "compare_objects",
          "title": "Compare two documented sizes",
          "description": "Compare linear dimensions or two map areas. Includes original records and a linear scale ratio.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "first": {
                "maxLength": 80,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["en", "de", "fr", "ru", "es", "pt", "ja", "zh", "zh-tw"],
                "type": "string"
              },
              "second": {
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["first", "second"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:80b109dc40fce92ec1699dff964d41dc9ff6bf588b57edda8a124b66299d5b1e"
        },
        {
          "name": "get_object",
          "title": "Read a measurement and sources",
          "description": "Get a documented dimension, measurement scope, selection policy and original sources.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "maxLength": 80,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["en", "de", "fr", "ru", "es", "pt", "ja", "zh", "zh-tw"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:507c4e8ae1afe952cdd75d79cc74ef96a450447e9ad86df9a3a392f5f0679fc9"
        },
        {
          "name": "search_objects",
          "title": "Find measured objects",
          "description": "Search 153 objects by ID or any supported language name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["animals", "dinosaurs", "space", "places", "objects", "sports", "vehicles", "landmarks"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["en", "de", "fr", "ru", "es", "pt", "ja", "zh", "zh-tw"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8969dad298b17d547bb741e5f8048961307fd5da0e388af1cbd55e7bdbc6dc55"
        }
      ],
      "resources": [
        {
          "uri": "biggervs://catalog",
          "name": "catalog",
          "title": "Bigger vs object directory",
          "description": "Object IDs and English names for measurement lookups.",
          "mimeType": "application/json",
          "digest": "sha256:7e3a55fa3438a05e77ba06acd34e32a5fa3e3bafa4b400129467aa392dbb9fdd"
        }
      ],
      "digest": "sha256:300bcc54c3a713efbf59cb5463de8b7dff83f2e8c2f5999264850aa412528da7"
    }
  }
}
