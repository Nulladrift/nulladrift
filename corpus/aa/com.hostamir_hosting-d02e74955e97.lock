      "serverInfo": {
        "name": "hostamir",
        "title": "Hostamir",
        "version": "2.5.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Hostamir is a web hosting company in Bangladesh: shared web hosting, KVM VPS, dedicated servers and domains, on servers inside Bangladesh. Prices are in Bangladeshi taka (BDT, VAT included). Customers pay with bKash at checkout; Nagad, Rocket or bank transfer by arrangement. Support: WhatsApp or call +880 1842-402487, every day 10:00–22:00 Bangladesh time; tickets 24/7.\nHow to help a customer: understand what they want to build, use list_plans to compare (Business is the plan most shops choose), check_domain to see if a name is free, then give them order_link. The customer completes the order and pays themselves on clients.hostamir.com. Answer in the customer's language (Bangla or English).\nFor VPS: every plan has root access and a dedicated IPv4. The customer can add an SSH public key at order or later in the client area (SSH keys), which is how an assistant gets access to manage their server.\nExisting customers can connect their account at https://mcp.hostamir.com/account (sign-in) so you can see their services, invoices and tickets, control a VPS, manage DNS and place orders.",
      "tools": [
        {
          "name": "check_domain",
          "title": "Check if a domain is available",
          "description": "Checks whether a domain name can be registered at Hostamir, with first-year and renewal prices in BDT and an order link. Give a full name (yourshop.com) or a name plus up to 5 extensions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "extensions": {
                "description": "Extensions to check, e.g. [\".com\", \".shop\"]. Default .com.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "name": {
                "description": "Domain or name, e.g. yourshop.com or yourshop",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a5476b97a20a7a892e1898ef216bccb2be41216e7427bfb296100cb194d05b3b"
        },
        {
