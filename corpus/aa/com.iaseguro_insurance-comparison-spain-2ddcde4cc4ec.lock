    "com.iaseguro/insurance-comparison-spain": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.iaseguro.com/mcp/agentes"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "iaseguro",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "IAseguro es un comparador independiente de seguros para España. Este servidor es de solo lectura y de invitado (sin cuenta ni autenticación). Flujo: 1) si no sabes qué línea encaja o qué datos pide, llama a consultar_disponibilidad; 2) pide al usuario, en una sola pregunta, SOLO los datos obligatorios que falten de esa línea (ver inputSchema); nunca pidas nombre, DNI, teléfono, email ni datos médicos (en vida basta saber si fuma); 3) llama una vez a cotizar_<línea> (en salud, cotizar_salud si dan fecha de nacimiento y código postal; si no, recomendar_salud;  consultar_coberturas si preguntan qué cubre); 4) presenta las mejores ofertas con aseguradora, producto, precio y unidad, su tipo de precio y el teléfono o el enlace (urlCotizador) de la aseguradora tal como vienen. tipoPrecio: \"firme\" = precio de la aseguradora para esos datos; \"estimado\" = orientativo del motor de IAseguro, no vinculante; \"sin_precio\" = sin importe, remite al teléfono o al enlace. Nunca inventes precios, coberturas ni URLs: si un dato no está en la respuesta, no lo des. IAseguro no contrata: el usuario contrata con la aseguradora (urlCotizador o teléfono) o revisa la comparativa en iaseguro.com (enlaceComparativa). Los resultados van en structuredContent con formato iaseguro.cotizacion.v1. Hay una API REST equivalente: https://mcp.iaseguro.com/openapi.json.",
      "tools": [
        {
          "name": "consultar_coberturas",
          "title": "Consultar qué cubre un seguro",
          "description": "Explica qué cubren los seguros de una línea en España, producto a producto, con un precio \"desde\" orientativo. Úsala cuando pregunten qué cubre o qué incluye un seguro, o para comparar las coberturas de dos compañías (una llamada por compañía). Para un precio con los datos del usuario, usa cotizar_<línea>; para elegir seguro de salud, recomendar_salud o cotizar_salud. insurer busca por parte del nombre, sin distinguir mayúsculas ni tildes. Si insurer o product no casan con nada, no da error: productos llega vacío y mensaje lista las aseguradoras disponibles. Devuelve como mucho 6 productos y no avisa si hay más, así que acota con insurer. No pide datos del usuario.",
          "inputSchema": {
            "properties": {
              "insurer": {
                "description": "Aseguradora, ej. \"MAPFRE\", \"Línea Directa\", \"Sanitas\". Sin ella, productos de varias.",
                "type": "string"
              },
              "line": {
                "description": "Línea de seguro. mascota = perros y gatos; patinete = eléctrico; rc = responsabilidad civil particular.",
                "enum": ["vida", "salud", "coche", "hogar", "decesos", "viaje", "mascota", "moto", "patinete", "rc"],
                "type": "string"
              },
              "product": {
                "description": "Producto concreto, ej. \"Plena\". Solo se usa con line \"salud\"; en las demás se ignora.",
                "type": "string"
              }
            },
            "required": ["line"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Coberturas de los productos de una línea (formato iaseguro.cotizacion.v1, tipo \"coberturas\").",
            "properties": {
              "aviso": {
                "description": "Aviso legal corto; muéstralo o resúmelo al usuario.",
                "type": "string"
              },
              "enlaceComparativa": {
                "description": "Comparativa en iaseguro.com con los UTM del canal. En cotizaciones y salud es el enlace directo /comparar/{linea}?<datos enviados, con los nombres de campo de la tool> que abre la comparativa ya calculada (la fecha de nacimiento no viaja en la URL: va como edad=<años cumplidos>, que da el mismo precio); en coberturas, la guía del ramo; en disponibilidad, /comparar.",
                "properties": {
                  "etiqueta": {
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["etiqueta", "url"],
                "type": "object"
              },
              "etiquetaLinea": {
                "type": "string"
              },
              "filtro": {
                "properties": {
                  "aseguradora": {
                    "type": ["string", "null"]
                  },
                  "producto": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["aseguradora", "producto"],
                "type": "object"
              },
              "formato": {
                "const": "iaseguro.cotizacion.v1",
                "type": "string"
              },
              "generadoEn": {
                "description": "Fecha y hora ISO 8601 de la respuesta.",
                "type": "string"
              },
              "linea": {
                "type": "string"
              },
              "mensaje": {
                "description": "Explicación cuando no hay productos que casen con el filtro.",
                "type": ["string", "null"]
              },
              "moneda": {
                "const": "EUR",
                "type": "string"
              },
              "productos": {
                "items": {
                  "properties": {
                    "aseguradora": {
                      "type": "string"
                    },
                    "coberturas": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "datosClave": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "precioDesde": {
                      "description": "Precio \"desde\" orientativo en \"unidad\".",
                      "type": ["number", "null"]
                    },
                    "producto": {
                      "type": "string"
                    },
                    "resumen": {
                      "type": "string"
                    },
                    "tipoPrecio": {
                      "description": "firme = precio de la aseguradora para los datos enviados; estimado = orientativo del motor de IAseguro, no vinculante; sin_precio = sin importe, remite al teléfono o al enlace.",
                      "enum": ["firme", "estimado", "sin_precio"],
                      "type": "string"
                    },
                    "unidad": {
                      "description": "Unidad de \"precio\": por mes, por año o total por el viaje (seguro de viaje puntual).",
                      "enum": ["mes", "año", "viaje"],
                      "type": "string"
                    }
                  },
                  "required": ["aseguradora", "coberturas", "datosClave", "precioDesde", "producto", "resumen", "tipoPrecio", "unidad"],
                  "type": "object"
                },
                "type": "array"
              },
