                      "enum": ["firme", "estimado", "sin_precio"],
                      "type": "string"
                    },
                    "unidad": {
                      "description": "Unidad de \"precio\": por mes, por año o total por el viaje (seguro de viaje puntual).",
                      "enum": ["mes", "año", "viaje"],
                      "type": "string"
                    },
                    "urlCotizador": {
                      "description": "Cotizador o web de la aseguradora (con UTM de IAseguro).",
                      "type": ["string", "null"]
                    },
                    "validoHasta": {
                      "description": "Fecha ISO hasta la que se mantiene el precio.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["aseguradora", "aseguradoraId", "aviso", "coberturas", "esPrecioDesde", "notas", "posicion", "precio", "primaAnual", "primaMensual", "producto", "telefono", "tipoPrecio", "unidad", "urlCotizador", "validoHasta"],
