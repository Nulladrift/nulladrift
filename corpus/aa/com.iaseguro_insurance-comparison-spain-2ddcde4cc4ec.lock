            "properties": {
              "birthDate": {
                "description": "Fecha de nacimiento del conductor en formato YYYY-MM-DD (ej. 1990-05-15).",
                "type": "string"
              },
              "cc": {
                "description": "Cilindrada en cc como texto (ej. \"125\", \"500\").",
                "type": "string"
              },
              "coverageType": {
                "description": "Modalidad: terceros (mínimo legal), terceros-ampliado (+ robo e incendio), todo-riesgo-franquicia o todo-riesgo.",
