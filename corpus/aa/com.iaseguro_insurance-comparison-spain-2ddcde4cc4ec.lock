                "type": "string"
              },
              "licenseYears": {
                "description": "Años con el carnet de moto, como texto (ej. \"5\").",
                "type": "string"
              },
              "postalCode": {
                "description": "Código postal español de 5 dígitos donde duerme la moto (ej. 28015).",
                "type": "string"
              }
