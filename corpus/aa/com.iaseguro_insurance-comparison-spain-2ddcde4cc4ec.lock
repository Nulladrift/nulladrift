        {
          "name": "recomendar_salud",
          "title": "Recomendar seguros de salud",
          "description": "Recomienda hasta 4 seguros de salud privados en España según las preferencias del usuario, con un precio \"desde\". Úsala cuando quieran elegir un seguro de salud y no den la edad; para el precio con su edad, cotizar_salud. Si preguntan qué cubre un producto ya elegido, usa consultar_coberturas (line \"salud\"). Necesita modality o al menos un \"si\"; los \"no\" no cuentan. Sin ninguna, no da error: devuelve en mensaje qué preguntar. Si ningún producto cumple todo, devuelve los más cercanos y lo indica en advertencias. El \"desde\" es una estimación por persona y mes para el perfil más joven: a más edad, más precio. No pide edad ni datos médicos y no contrata.",
          "inputSchema": {
            "properties": {
              "dental": {
                "description": "\"si\" si quiere cobertura dental.",
                "enum": ["si", "no"],
                "type": "string"
              },
              "maternity": {
                "description": "\"si\" si necesita cobertura de maternidad/parto.",
                "enum": ["si", "no"],
                "type": "string"
              },
              "modality": {
                "description": "Preferencia: cuadro-medico (red concertada), reembolso (libre elección de médico) o mixta.",
                "enum": ["cuadro-medico", "reembolso", "mixta"],
                "type": "string"
              },
              "noCopay": {
                "description": "\"si\" si prefiere póliza sin copago por acto médico.",
                "enum": ["si", "no"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Seguros de salud recomendados por preferencias (formato iaseguro.cotizacion.v1, tipo \"recomendacion_salud\").",
