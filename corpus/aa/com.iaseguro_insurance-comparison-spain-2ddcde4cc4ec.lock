        {
          "name": "cotizar_coche",
          "title": "Comparar precios de seguros de coche",
          "description": "Compara el precio del seguro de coche en España entre varias aseguradoras con los datos del usuario. Úsala cuando pregunten cuánto cuesta asegurar un coche. Si solo preguntan qué cubre, usa consultar_coberturas (line \"coche\"); para motos, cotizar_moto. Usa los datos del conductor habitual; con menos de 18 años no hay precios. power afina el precio en todas las modalidades; value, solo en las de todo riesgo. Si no los saben, omítelos. Si dudan de modalidad, llama una vez por cada una. Las compañías que no aseguran ese caso no aparecen, las que no dan precio online salen como sin_precio (con teléfono o enlace) y las que fallan van en aseguradorasSinRespuesta. Un precio estimado no vincula: lo confirma la compañía. Si falta un dato o no es válido, devuelve isError e indica cuál. No contrata ni pide nombre, DNI, teléfono ni email.",
          "inputSchema": {
            "properties": {
              "birthDate": {
                "description": "Fecha de nacimiento del conductor en formato YYYY-MM-DD (ej. 1990-05-15).",
                "type": "string"
              },
              "coverageType": {
                "description": "Modalidad: terceros (mínimo legal), terceros-ampliado (+ lunas, robo e incendio), todo-riesgo-franquicia, todo-riesgo (sin franquicia).",
                "enum": ["terceros", "terceros-ampliado", "todo-riesgo-franquicia", "todo-riesgo"],
                "type": "string"
              },
              "licenseYears": {
                "description": "Años con el carnet de conducir, como texto (ej. \"8\"; \"0\" si es novel; de 0 a 80).",
                "type": "string"
              },
              "make": {
                "description": "Marca del coche (ej. \"Seat\", \"Volkswagen\").",
                "type": "string"
              },
              "model": {
                "description": "Modelo del coche (opcional, ej. \"León\").",
                "type": "string"
              },
              "postalCode": {
                "description": "Código postal español de 5 dígitos donde se guarda el coche (ej. 28015).",
                "type": "string"
              },
              "power": {
                "description": "Potencia en CV (opcional), ej. \"110\".",
                "type": "string"
              },
              "value": {
                "description": "Valor de mercado del coche en euros (opcional; útil en todo riesgo), ej. \"15000\".",
                "type": "string"
              },
              "year": {
                "description": "Año de matriculación como texto (ej. \"2018\").",
                "type": "string"
              }
            },
            "required": ["birthDate", "coverageType", "licenseYears", "make", "postalCode", "year"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Comparativa de precios de una línea (formato iaseguro.cotizacion.v1, tipo \"cotizacion\").",
            "properties": {
              "aseguradorasSinRespuesta": {
                "items": {
                  "properties": {
                    "aseguradoraId": {
                      "type": "string"
                    },
                    "motivo": {
                      "type": "string"
                    }
                  },
                  "required": ["aseguradoraId", "motivo"],
                  "type": "object"
                },
                "type": "array"
              },
              "aviso": {
                "description": "Aviso legal corto; muéstralo o resúmelo al usuario.",
                "type": "string"
              },
              "enlaceComparativa": {
                "description": "Comparativa en iaseguro.com con los UTM del canal. En cotizaciones y salud es el enlace directo /comparar/{linea}?<datos enviados, con los nombres de campo de la tool> que abre la comparativa ya calculada (la fecha de nacimiento no viaja en la URL: va como edad=<años cumplidos>, que da el mismo precio); en coberturas, la guía del ramo; en disponibilidad, /comparar.",
                "properties": {
                  "etiqueta": {
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["etiqueta", "url"],
                "type": "object"
              },
              "etiquetaLinea": {
                "type": "string"
              },
              "formato": {
                "const": "iaseguro.cotizacion.v1",
                "type": "string"
              },
              "generadoEn": {
                "description": "Fecha y hora ISO 8601 de la respuesta.",
                "type": "string"
              },
              "idPeticion": {
                "type": "string"
              },
              "linea": {
                "description": "Id de la línea (vida, coche, hogar…).",
                "type": "string"
              },
              "moneda": {
