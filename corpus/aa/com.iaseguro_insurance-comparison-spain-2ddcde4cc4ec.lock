        {
          "name": "cotizar_decesos",
          "title": "Comparar precios de seguros de decesos",
          "description": "Compara el precio del seguro de decesos (gastos de entierro y trámites) en España entre varias aseguradoras con los datos del usuario. Úsala cuando pregunten cuánto cuesta un seguro de decesos. Si solo preguntan qué cubre, usa consultar_coberturas (line \"decesos\"); para dejar dinero a la familia, cotizar_vida. premiumType cambia mucho el precio: ante la duda, llama con las dos y compara. Deja capital vacío salvo que sepan el coste del entierro: 5000 sirve de referencia. Las compañías que no aseguran ese caso no aparecen, las que no dan precio online salen como sin_precio (con teléfono o enlace) y las que fallan van en aseguradorasSinRespuesta. Un precio estimado no vincula: lo confirma la compañía. Si falta un dato o no es válido, devuelve isError e indica cuál. No contrata ni pide nombre, DNI, teléfono ni email.",
