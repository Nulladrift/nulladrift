      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Veedio's public planning tools for short vertical video (TikTok, Instagram Reels, YouTube Shorts). No account or key needed. find_video_tool suggests the Veedio tool page that fits an idea; short_video_outline returns a hook, timed beats, caption tips and a CTA. Neither tool makes a video: each answer links to the Veedio page where it can be made. Share those links with the person as they are.",
      "tools": [
        {
          "name": "find_video_tool",
          "title": "Find a Veedio video tool",
          "description": "Find the Veedio tool page that best fits a short-video idea (TikTok, Reels, YouTube Shorts). Returns one to three pages, each with a title, a one-line promise and a link. Use it when someone asks which tool or format to use for a video idea.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idea": {
                "description": "What the video is about, in the person's own words — e.g. 'why octopuses are so smart'.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["idea"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a Veedio video tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0094067dcf483057e3defed28c6c37dce779652c54838a692d8ad62aca30edc7"
        },
        {
          "name": "short_video_outline",
          "title": "Outline a short video",
          "description": "Plan a short vertical video from an idea: a hook line, a 4–6 beat structure with time ranges, caption tips and a call to action, plus a link to the Veedio tool page that can make it. Deterministic and instant. Use it when someone wants to plan, outline or script a TikTok, Reel or Short.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idea": {
                "description": "What the video is about, in the person's own words — e.g. 'why octopuses are so smart'.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "seconds": {
                "description": "Length of the video in seconds: 30, 60 (the default) or 90.",
                "enum": [30, 60, 90],
                "type": "integer"
              }
            },
            "required": ["idea"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Outline a short video"
          },
