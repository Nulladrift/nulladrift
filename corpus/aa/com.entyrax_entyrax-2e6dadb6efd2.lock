{
  "lockfileVersion": 2,
  "subjects": {
    "com.entyrax/entyrax": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.entyrax.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "entyrax",
        "title": "Entyrax",
        "version": "0.11.0",
        "description": "PC hardware decision engine for Brazil (pt-BR): compatibility, GPU recommendations, build analysis.",
        "websiteUrl": "https://www.entyrax.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Motor de decisão de hardware PC (BR). tools/call: check_compatibility, recommend_gpu_by_context, analyze_build.",
      "tools": [
        {
          "name": "analyze_build",
          "title": "Analisar build completo",
          "description": "Analisa um build CPU+Mobo+GPU. Retorna overall_quality, reasoning (why_this_mobo/why_this_gpu/budget_note), PSU recomendada e preços.",
          "inputSchema": {
            "properties": {
              "cpu_slug": {
                "description": "Slug da CPU (ex: ryzen-7-7800x3d)",
                "type": "string"
              },
              "gpu_slug": {
                "description": "Slug da GPU (ex: geforce-rtx-5070-ti)",
                "type": "string"
              },
              "mobo_slug": {
                "description": "Slug da placa-mãe (ex: gigabyte-b650-aorus-pro-ax)",
                "type": "string"
              }
            },
            "required": ["cpu_slug", "gpu_slug", "mobo_slug"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Análise do build com veredicto e PSU recomendada.",
            "properties": {
              "overall_quality": {
                "description": "Qualidade geral do build (ex: excellent, unbalanced)",
                "type": "string"
              },
              "psu": {
                "description": "PSU recomendada para o conjunto",
                "type": "object"
              },
              "reasoning": {
                "description": "why_this_mobo, why_this_gpu, budget_note",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analisar build completo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b42ac359f12949f3d75d0696b98d73a9814927a752d9ff6bc0c3923413c00352"
        },
        {
          "name": "check_compatibility",
          "title": "Verificar compatibilidade",
          "description": "Verifica compatibilidade e qualidade de pairing entre dois componentes (CPU+Mobo, CPU+GPU, GPU+Monitor). Retorna compatibility_status, pairing_quality, confidence e reasoning.",
          "inputSchema": {
            "properties": {
              "entity_a": {
                "description": "Slug do primeiro componente (ex: ryzen-7-7800x3d)",
                "type": "string"
              },
              "entity_b": {
                "description": "Slug do segundo componente (ex: gigabyte-b650-aorus-pro-ax)",
                "type": "string"
              },
              "pair_type": {
                "description": "Tipo do par. Opcional; se omitido, tenta os três.",
                "enum": ["cpu_mobo", "cpu_gpu", "gpu_monitor"],
                "type": "string"
              }
            },
            "required": ["entity_a", "entity_b"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Veredicto de compatibilidade com reasoning.",
            "properties": {
              "compatibility_status": {
                "description": "Ex: native_supported, needs_bios_update",
                "type": "string"
              },
              "compatible": {
                "description": "Se o par funciona junto",
                "type": "boolean"
              },
              "confidence": {
                "description": "0.0–1.0",
                "type": "number"
              },
              "pair_type": {
                "description": "cpu_mobo | cpu_gpu | gpu_monitor",
                "type": "string"
              },
              "pairing_quality": {
                "description": "Ex: excellent, balanced, bottleneck_risk",
                "type": "string"
              },
              "reason": {
                "description": "Justificativa em pt-BR",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verificar compatibilidade"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8942a4326f54fbf5a11d3c8d7969ef897851dfb6509d86c01911833d692e6cf4"
        },
        {
          "name": "recommend_gpu_by_context",
          "title": "Recomendar GPU por contexto",
          "description": "Recomenda top GPUs dado contexto: resolução (1080p/1440p/4k), uso (gaming-aaa/gaming-competitive/produtividade) e orçamento em BRL.",
          "inputSchema": {
            "properties": {
              "budget_brl": {
                "description": "Orçamento máximo em BRL (ex: 3500)",
                "type": "number"
              },
              "resolution": {
                "description": "Resolução alvo do monitor",
                "enum": ["1080p", "1440p", "4k"],
                "type": "string"
              },
              "use_case": {
                "description": "Uso principal da máquina",
                "enum": ["gaming-aaa", "gaming-competitive", "produtividade"],
                "type": "string"
              }
            },
            "required": ["budget_brl", "resolution", "use_case"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Ranking de GPUs para o contexto, com reasoning.",
            "properties": {
              "picks": {
                "description": "GPUs recomendadas em ordem de adequação",
                "items": {
                  "properties": {
                    "avg_fps": {
                      "description": "FPS médio estimado no contexto",
                      "type": "number"
                    },
                    "avg_price_brl": {
                      "description": "Preço médio em BRL",
                      "type": "number"
                    },
                    "name": {
                      "description": "Nome da GPU",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "reasoning": {
                "description": "Resumo do porquê do ranking",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recomendar GPU por contexto"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a93995b55d8e6d62dbc69260e1f6fd8e3b92e10758e1a9bfdb00d7c3bd66b702"
        }
      ],
      "digest": "sha256:09dad0ef05562f1e6449f87f5346a8b97c460c2124d67790343d7ab03538efc3"
    }
  }
