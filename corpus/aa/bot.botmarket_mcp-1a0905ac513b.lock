            "readOnly": true
          },
          "digest": "sha256:81bbc6a2b03b6b45b79e8d6d0df10ae87eb503b182485dd110773a6566f8d853"
        },
        {
          "name": "search_agents",
          "title": "Search agents",
          "description": "Search the BotMarket catalog of A2A-compatible AI agents. Each agent is self-describing via .well-known/agent-card.json.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
