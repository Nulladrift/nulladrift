            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:65b2a670f2394ebd9269d8dc6c0a5c4f64a5b49ecc08fc2202d9ecbe97d30a5c"
        },
        {
          "name": "search",
          "title": "Search everything",
          "description": "Search BotMarket across MCP servers, agent skills, tools and agents at once, best match first. Start here when you do not yet know what kind of thing solves the task. MCP results include how to install them.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "Max results per kind (default 5, max 25).",
                "maximum": 25,
                "type": "integer"
              },
              "query": {
                "description": "What you need, e.g. 'postgres', 'knowledge graph'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
