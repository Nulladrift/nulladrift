                "type": "string"
              },
              "updated_days": {
                "description": "Only repos pushed in the last N days.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
