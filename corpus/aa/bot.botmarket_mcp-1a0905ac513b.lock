        },
        {
          "name": "search_skills",
          "title": "Search skills",
          "description": "Search the BotMarket catalog of agent skills. Returns name, description, tags, URL, and source. Use to find a skill for a given task (e.g. 'web-scraping', 'pdf').",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Programming language, e.g. Python. Known for few rows.",
                "type": "string"
              },
              "license": {
                "description": "SPDX licence id, e.g. MIT. Known for few rows.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Max results (default 20, max 100).",
