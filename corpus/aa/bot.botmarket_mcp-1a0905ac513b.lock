        },
        {
          "name": "search_mcps",
          "title": "Search MCP servers",
          "description": "Search the BotMarket catalog of MCP servers, best match first. Returns name, description, category, repository, stars, and `install` (command, config, required values). Use to find a server for a capability (e.g. 'github', 'postgres', 'browser').",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter.",
                "type": "string"
              },
              "include_hidden": {
                "default": false,
                "description": "Also return duplicates and listings with no link to the project (left out by default).",
                "type": "boolean"
              },
              "language": {
                "description": "Programming language, e.g. Python. Known for few rows.",
                "type": "string"
              },
              "license": {
                "description": "SPDX licence id, e.g. MIT. Known for few rows.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Max results (default 20, max 100).",
                "maximum": 100,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Rows to skip.",
                "minimum": 0,
                "type": "integer"
              },
              "open": {
                "description": "true = only repos that declare a licence; false = only those that do not.",
                "type": "boolean"
              },
              "query": {
                "description": "Free-text query.",
                "type": "string"
              },
              "sort": {
                "default": "stars",
                "enum": ["popular", "stars", "recent", "name"],
                "type": "string"
              },
              "updated_days": {
                "description": "Only repos pushed in the last N days.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a64d4a4efeaf987377e607ed794d0499ac8756d3afbd5d53bd15cb8a79c8b9cd"
        },
        {
          "name": "search_protocols",
          "title": "Search protocols",
          "description": "List protocols tracked by BotMarket: MCP, A2A, x402, MTP (Machine Tree Protocol), MRP, L402, AP2, ACP, ANP, AGNTCY, etc. Filter by kind: payments | agents | context | discovery | identity.",
          "inputSchema": {
            "properties": {
              "kind": {
                "enum": ["payments", "agents", "context", "discovery", "identity"],
