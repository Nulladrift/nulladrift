        },
        {
          "name": "list_quests",
          "title": "List quests",
          "description": "List BotMarket quests: verifiable tasks that seed the network (replicate a ceiba node, submit a working MCP). Experimental: no payouts yet.",
          "inputSchema": {
            "properties": {
              "status": {
                "default": "active",
                "enum": ["active", "paused", "ended"],
