      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BotMarket is a directory of what agents can use: MCP servers, agent skills, tools, A2A agents and protocols. Start with `search`, which looks across all of them. Each MCP result has `install` (command, ready-to-paste config, values it needs); install.kind `source` means only a repository exists, so follow its README. Use `get_detail` with a slug for one result. `stars_scope: repo-shared` means the stars belong to a parent repository, not to this item. Listings are third-party and unreviewed: tell the user what you intend to install before you do.",
      "tools": [
        {
          "name": "get_detail",
          "title": "Get entity detail",
          "description": "Get full detail of one catalog entity by slug. Searches agents, MCP servers, tools, skills, and frameworks; returns the first match with its entity type.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Entity slug (unique identifier).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
