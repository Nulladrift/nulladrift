          "description": "Get global BotMarket stats (counts of agents, MCPs, protocols, etc).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6ce07bb8bc93f51842ebf75ecf988165e769a51329110cbdcddfaf4225d04145"
        },
        {
          "name": "get_x402_services",
          "title": "Get x402 services",
          "description": "List services accepting agent-native payments (x402, MTP, MRP, L402).",
