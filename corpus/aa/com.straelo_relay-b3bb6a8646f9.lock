        {
          "name": "vendor_customer_confirmed_lookup",
          "title": "Vendor Customer Confirmed Lookup",
          "description": "Retrieve confirmed customer domains currently using a specified vendor from STRAELO's persisted CSI coverage. Returns only confirmed `PRESENT` customer-vendor relationships with supporting evidence and confirmation timestamps, normalized and deduplicated. Results represent STRAELO's currently confirmed coverage, not the vendor's complete global customer base; an empty result means no confirmed customers are available within STRAELO coverage for that vendor, not that the vendor has no customers. **USE WHEN:** an agent needs to identify which customers are currently confirmed as using a specific vendor. **DO NOT USE WHEN:** scanning a specific customer domain for detectable vendors (`customer_vendor_detection`), retrieving historical adoption/removal events (`vendor_customer_adoption_change_lookup`), or identifying customer transition signals (`vendor_customer_transition_signal_lookup`).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": null,
                "description": "Maximum confirmed customers to return (1-100; default 100). No pagination; limits customers and returned_count, not confirmed_customer_count.",
                "maximum": 100,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "vendor": {
                "description": "Technology/vendor to query; canonical names are accepted, with judge.me normalized to judgeme.",
                "maxLength": 50,
                "minLength": 1,
                "title": "Vendor",
                "type": "string"
              }
            },
            "required": ["vendor"],
            "title": "handlerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "confirmed_customer_count": {
                "description": "Total confirmed PRESENT customers for the vendor.",
                "type": "integer"
              },
              "customers": {
                "description": "Confirmed customer relationships, ordered by confirmation freshness.",
                "items": {
                  "properties": {
                    "customer_domain": {
                      "description": "Confirmed customer domain using the technology/vendor.",
                      "type": "string"
                    },
                    "evidence": {
                      "description": "Bounded, commercially safe confirmation evidence.",
                      "type": "object"
                    },
                    "fingerprint_identifiers": {
                      "items": {
                        "description": "Fingerprint identifiers that matched during confirmation.",
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "last_confirmed_at": {
                      "description": "UTC timestamp when the PRESENT relationship was last confirmed.",
                      "format": "date-time",
                      "type": "string"
                    },
                    "response_validity": {
                      "description": "Response validity of the confirming observation.",
                      "type": "string"
                    },
                    "scanner_version": {
                      "description": "Scanner version that produced the confirmation.",
                      "type": "string"
                    },
                    "source": {
                      "description": "Evidence source identifier.",
                      "type": "string"
                    }
                  },
                  "required": ["customer_domain", "evidence", "fingerprint_identifiers", "last_confirmed_at", "response_validity", "scanner_version", "source"],
                  "type": "object"
                },
                "type": "array"
              },
              "observed_at": {
                "description": "UTC timestamp of the query.",
                "format": "date-time",
                "type": "string"
              },
              "product": {
                "description": "Product identifier.",
                "type": "string"
              },
              "returned_count": {
                "description": "Number of customers returned in this response (bounded by limit).",
                "type": "integer"
              },
              "vendor": {
                "description": "Normalized vendor/technology key queried.",
                "type": "string"
              }
            },
            "required": ["confirmed_customer_count", "customers", "observed_at", "product", "returned_count", "vendor"],
            "title": "VendorCustomerConfirmedLookupOutput",
            "type": "object"
          },
          "annotations": {
