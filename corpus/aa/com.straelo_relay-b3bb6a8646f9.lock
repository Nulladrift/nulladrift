        {
          "name": "token_security_decision",
          "title": "Token Security Decision",
          "description": "Evaluate a crypto token for agent interaction using security evidence from GoPlus (primary) and Honeypot.is (complementary, EVM chains only) and return a STRAELO decision that is deterministic for the same observed provider evidence; provider evidence can change between calls and external provider calls may affect latency and availability. There is no tool-specific rate limit. USE WHEN: an agent needs a machine-readable security decision before interacting with a token on Base, Ethereum, BSC, or Solana. DO NOT USE WHEN: the agent needs a guarantee that a token is safe, legitimate, scam-free, or risk-free; provider evidence may be unavailable or incomplete. Returns ALLOW, REVIEW, AVOID, or INCOMPLETE with supporting evidence. Missing or insufficient provider evidence fails closed and never produces ALLOW.",
          "inputSchema": {
            "properties": {
              "chain": {
                "description": "Blockchain containing the token. Accepts base, ethereum, bsc, or solana. Input is normalized to lowercase.",
                "enum": ["base", "ethereum", "bsc", "solana"],
                "examples": ["base"],
                "title": "Chain",
                "type": "string"
              },
              "token_address": {
                "description": "Token identifier to evaluate. For base, ethereum, or bsc, provide an EVM contract address (0x followed by 40 hexadecimal characters). For solana, provide the token mint address as a base58 public key.",
                "examples": ["0xA0b86991c6218b36c1d19D4A2e9Eb0cE3606eB48"],
                "title": "Token Address",
                "type": "string"
              }
            },
            "required": ["chain", "token_address"],
            "title": "handlerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "chain": {
                "description": "Blockchain network queried.",
                "examples": ["base"],
                "type": "string"
              },
              "confidence": {
                "description": "Confidence in the decision.",
                "enum": ["low", "medium", "high"],
                "examples": ["high"],
                "type": "string"
              },
              "decision": {
                "description": "Token security decision: ALLOW, REVIEW, AVOID or INCOMPLETE.",
                "enum": ["ALLOW", "REVIEW", "AVOID", "INCOMPLETE"],
                "examples": ["AVOID"],
                "type": "string"
              },
              "evidence": {
                "description": "Provider evidence that supported the decision.",
                "type": "object"
              },
              "observed_at": {
                "description": "UTC timestamp of the decision.",
                "examples": ["2026-10-30T12:00:00Z"],
                "format": "date-time",
                "type": "string"
              },
              "product": {
                "description": "Product identifier.",
                "examples": ["token-security-decision"],
                "type": "string"
              },
              "reasons": {
                "description": "Short, objective, machine-readable reasons supporting the decision.",
