        {
          "name": "x402_payment_preflight_decision",
          "title": "x402 Payment Preflight Decision",
          "description": "Check an x402 payment request before signing or paying and return a deterministic PAY, REVIEW or DO_NOT_PAY decision.\nUSE WHEN: agent needs deterministic verification of a payment requirement before deciding whether to pay.\nDO NOT USE WHEN: agent expects this tool to execute the payment.\nOffline/read-only preflight: no network calls, signing, settlement, or payment execution. Decision derives from comparing declared intent against the supplied x402 v2 PAYMENT-REQUIRED; mismatches yield DO_NOT_PAY, material snapshot changes yield REVIEW, consistency yields PAY.",
          "inputSchema": {
            "properties": {
              "intent": {
                "description": "Buyer-declared payment policy: expected seller label, service, resource URL, and optional payment constraints (asset, network, destination, amount, tolerance) used to evaluate consistency against the observed x402 challenge.",
                "properties": {
                  "amount_tolerance": {
                    "description": "Optional permitted USDC decimal increase.",
                    "type": "string"
                  },
                  "expected_amount": {
                    "description": "Optional expected USDC decimal amount, not atomic units.",
                    "type": "string"
                  },
                  "expected_asset": {
                    "description": "Optional expected EVM asset address.",
                    "type": "string"
                  },
                  "expected_network": {
                    "description": "Optional expected CAIP-2 network.",
                    "type": "string"
                  },
                  "expected_pay_to": {
                    "description": "Optional expected EVM payment destination.",
                    "type": "string"
                  },
                  "resource": {
                    "description": "Expected exact absolute HTTP(S) resource URL.",
                    "format": "uri",
                    "type": "string"
                  },
                  "seller": {
                    "description": "Caller-supplied seller label included in the fingerprint; identity is not externally verified.",
                    "type": "string"
                  },
                  "service": {
                    "description": "Expected resource.serviceName.",
                    "type": "string"
                  }
                },
                "required": ["resource", "seller", "service"],
                "title": "Intent",
                "type": "object"
              },
              "payment_required": {
                "description": "Observed x402 v2 PAYMENT-REQUIRED challenge decoded as JSON.",
                "title": "Payment Required",
                "type": "object"
              },
              "previous_snapshot": {
                "default": null,
                "description": "Optional prior snapshot for stateless material-change detection against a prior result.",
                "title": "Previous Snapshot",
                "type": "object"
              }
            },
            "required": ["intent", "payment_required"],
            "title": "handlerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assessment": {
                "description": "Consistency decision only; never a safety rating.",
                "enum": ["CONSISTENT", "INCONSISTENT", "REVIEW_REQUIRED"],
                "type": "string"
              },
              "changes": {
                "description": "Material changes between current result and previous_snapshot; any change drives REVIEW when no mismatch exists.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "checks_performed": {
                "description": "Consistency checks actually executed for this request.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "checks_skipped": {
                "description": "Checks skipped because the corresponding expected field was not declared in intent.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "coverage": {
                "description": "Scope of the offline comparison: what is and is not evaluated by this preflight.",
                "type": "object"
              },
              "decision": {
                "description": "Deterministic preflight payment decision: PAY when intent matches the observed requirement and no material change; REVIEW when consistent but materially changed from previous_snapshot; DO_NOT_PAY when any intent field mismatches the observed requirement.",
                "enum": ["PAY", "REVIEW", "DO_NOT_PAY"],
                "type": "string"
              },
              "evidence": {
                "description": "Derived solely from the supplied intent and payment_required; contains the parsed payment requirement, seller label, and resource domain.",
                "type": "object"
              },
              "external_calls": {
                "description": "Always empty in this offline MVP.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "matched": {
                "description": "Intent fields that matched the observed x402 payment requirement.",
                "type": "object"
              },
              "mismatched": {
                "description": "Intent fields that mismatched the observed x402 payment requirement; any mismatch drives DO_NOT_PAY.",
                "type": "object"
              },
              "payment_fingerprint": {
                "description": "SHA-256 of canonical material payment fields.",
                "type": "string"
              },
              "reason_codes": {
                "description": "Machine-readable codes explaining the decision; mismatch codes when DO_NOT_PAY, change codes when REVIEW.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "snapshot": {
                "description": "Reusable stateless comparison state for detecting material changes on a subsequent call.",
                "type": "object"
              }
            },
            "required": ["assessment", "changes", "checks_performed", "checks_skipped", "coverage", "decision", "evidence", "external_calls", "matched", "mismatched", "payment_fingerprint", "reason_codes", "snapshot"],
            "title": "X402PaymentPreflightDecisionOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "x402 Payment Preflight Decision"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:350df312af98e244720f498f5c2994726ad56438d3eed34ee6e970a33de4306c"
        }
      ],
