                  ["Token cannot be sold"]
                ],
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "risk_score": {
                "description": "Risk score from 0 to 100.",
                "examples": [91],
                "type": "integer"
              },
              "token_address": {
                "description": "Token address/mint inspected.",
                "examples": ["0xA0b86991c6218b36c1d19D4A2e9Eb0cE3606eB48"],
                "type": "string"
              }
            },
            "required": ["chain", "confidence", "decision", "evidence", "observed_at", "product", "reasons", "risk_score", "token_address"],
            "title": "TokenSecurityDecisionOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Token Security Decision"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
