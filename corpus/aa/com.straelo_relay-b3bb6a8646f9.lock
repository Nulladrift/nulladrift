        },
        {
          "name": "vendor_customer_adoption_change_lookup",
          "title": "Vendor Customer Adoption Change Lookup",
          "description": "Retrieve confirmed customer adoption changes for a specified vendor within a UTC time window, returning customer domains with `ADDED` or `REMOVED` events, supporting evidence, and timestamps. `ADDED` represents a confirmed `ABSENT -> PRESENT` transition and `REMOVED` represents a confirmed `PRESENT -> ABSENT` transition in STRAELO CSI observations; `REMOVED` does not by itself prove a vendor switch or contract cancellation. USE WHEN: an agent needs historical evidence of customers adopting or removing a specific vendor during a period. DO NOT USE WHEN: the agent needs customers currently confirmed as using a vendor (`vendor_customer_confirmed_lookup`), vendors currently detected on a specific customer domain (`customer_vendor_detection`), or potential vendor replacement signals (`vendor_customer_transition_signal_lookup`). Results reflect persisted CSI history and may change as new transitions are recorded; the tool does not perform live scans or modify state.",
          "inputSchema": {
            "properties": {
              "end": {
                "description": "Exclusive UTC end boundary (ISO-8601, timezone-aware); must be later than start.",
                "format": "date-time",
                "title": "End",
                "type": "string"
              },
              "limit": {
                "default": null,
                "description": "Maximum confirmed changes to return (1-100; default 100). No pagination; change_count reflects the number returned after this limit.",
                "maximum": 100,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "start": {
                "description": "Inclusive UTC start boundary (ISO-8601, timezone-aware).",
                "format": "date-time",
                "title": "Start",
                "type": "string"
              },
              "vendor": {
                "description": "Technology/vendor to query; canonical names are accepted, with judge.me normalized to judgeme.",
                "maxLength": 50,
                "minLength": 1,
                "title": "Vendor",
                "type": "string"
              }
            },
            "required": ["end", "start", "vendor"],
            "title": "handlerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "change_count": {
                "description": "Number of confirmed changes returned after applying the limit.",
                "type": "integer"
              },
              "changes": {
                "description": "Confirmed ADDED/REMOVED changes ordered by changed_at DESC, domain ASC.",
                "items": {
                  "properties": {
                    "change": {
                      "description": "Change type: ADDED (ABSENT->PRESENT) or REMOVED (PRESENT->ABSENT).",
                      "type": "string"
                    },
                    "changed_at": {
                      "description": "UTC timestamp when the durable transition was observed.",
                      "format": "date-time",
                      "type": "string"
                    },
                    "domain": {
                      "description": "Customer domain that experienced a confirmed technology change.",
                      "type": "string"
                    },
                    "fingerprints": {
                      "description": "Bounded matched fingerprint evidence (ids and types only).",
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "from_state": {
                      "description": "State before the transition (ABSENT or PRESENT).",
