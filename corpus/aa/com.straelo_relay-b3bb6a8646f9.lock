        {
          "name": "email_suitability_decision",
          "title": "Email Suitability Decision",
          "description": "Evaluate whether an email address is suitable for a specified use case using syntax, MX, SPF, DMARC, disposable-domain, and role-account signals. Decision for observed evidence; external DNS evidence may change between calls. Returns an ALLOW, REVIEW, or REJECT decision with deliverability score, risk level, confidence, checks, and reasons. Does not send email, probe the mailbox via SMTP, verify that the mailbox exists or is owned by a specific person, or guarantee delivery. Read-only DNS lookups may affect latency or availability; no tool-specific rate limit. **USE WHEN:** an agent needs to decide whether an email address is suitable for outbound sales, account signup, transactional email, CRM import, lead qualification, or another supported use case. **DO NOT USE WHEN:** the agent needs domain-level risk and trust assessment or proof that a mailbox exists. **USE `domain_risk_trust_decision` FOR:** domain-level risk and trust assessment.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Email address for suitability decision.",
                "format": "email",
                "title": "Email",
                "type": "string"
              },
              "use_case": {
                "default": null,
                "description": "Intended sending context; when provided, the decision accounts for context-specific risk. Omitted for a baseline decision without contextual adjustments.",
                "enum": ["outbound_sales", "account_signup", "transactional_email", "crm_import", "lead_qualification"],
                "title": "Use Case",
                "type": "string"
              }
            },
            "required": ["email"],
            "title": "handlerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checks": {
                "description": "Per-signal check results keyed by check name: syntax, domain, mx, spf, dmarc, disposable, role_account. Each value is a machine-readable result string (e.g. 'syntax:valid', 'mx:found', 'spf:pass', 'disposable:no'). Partial when a DNS lookup is unavailable.",
                "properties": {
                  "disposable": {
                    "type": "string"
                  },
                  "dmarc": {
                    "type": "string"
                  },
                  "domain": {
                    "type": "string"
                  },
                  "mx": {
                    "type": "string"
                  },
                  "role_account": {
                    "type": "string"
                  },
                  "spf": {
                    "type": "string"
                  },
                  "syntax": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "confidence": {
                "description": "Confidence in the decision from 0 to 100.",
                "type": "integer"
              },
              "decision": {
                "description": "Context-aware suitability decision for the given use case.",
                "enum": ["ALLOW", "REVIEW", "REJECT"],
                "type": "string"
              },
              "deliverability_score": {
                "description": "Deliverability score from 0 to 100.",
                "type": "integer"
              },
              "domain": {
                "description": "Lowercased domain part.",
                "type": ["string", "null"]
              },
              "email": {
                "description": "Validated email address (domain-lowercased).",
                "type": "string"
              },
              "mx_found": {
                "description": "Backward-compatible MX result; null means lookup unavailable.",
                "type": ["boolean", "null"]
              },
              "reasons": {
                "description": "Machine-readable reason codes explaining the decision and corresponding to observed checks.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "risk_level": {
                "description": "Risk level derived from observed signals.",
                "enum": ["LOW", "MEDIUM", "HIGH"],
                "type": "string"
              },
              "use_case": {
                "description": "The validated use case echoed from the input; null when omitted. Affects contextual decision adjustments such as role-account tolerance and SPF/DMARC weighting.",
