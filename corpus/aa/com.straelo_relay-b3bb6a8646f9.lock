        {
          "name": "evm_transaction_execution_decision",
          "title": "EVM Transaction Execution Decision",
          "description": "Evaluate an intended EVM transaction before submission using deterministic RPC simulation signals and return a machine-readable STRAELO execution decision. The decision engine is deterministic for the same observed RPC evidence; live chain state may change between calls. USE WHEN: an agent needs to evaluate an EVM transaction before deciding whether to submit it. DO NOT USE WHEN: the transaction has already been submitted and the agent needs to look it up by transaction hash; use evm_transaction_hash_lookup instead. This product does not broadcast transactions and does not guarantee that an allowed transaction will execute successfully when later submitted. `from_address` is the sender whose execution context is simulated; `to_address`/`data`/`value` together form the intended transaction form. INCOMPLETE means simulation/provider evidence was insufficient for a conclusive execution decision and must not be treated as ALLOW. Returns ALLOW, WARN, BLOCK, or INCOMPLETE with the simulation evidence and execution signals produced by the current decision engine.",
          "inputSchema": {
            "properties": {
              "chain": {
                "description": "EVM network where the transaction would be executed.",
                "enum": ["ethereum", "base"],
                "title": "Chain",
                "type": "string"
              },
              "data": {
                "default": null,
                "description": "EVM calldata hex for contract interaction. Must start with 0x. Empty calldata is represented as \"0x\".",
                "pattern": "^0x(?:[a-fA-F0-9]{2})*$",
                "title": "Data",
                "type": "string"
              },
              "from_address": {
                "description": "Actual EVM sender address whose execution context should be simulated. Required because contract behavior may depend on msg.sender, balances, permissions, ownership, or allowlists.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "title": "From Address",
                "type": "string"
              },
              "to_address": {
                "default": null,
                "description": "Intended recipient address or contract target for the transaction.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "title": "To Address",
                "type": "string"
              },
              "value": {
                "default": null,
                "description": "Native value in hex wei (atomic units, 10^18 wei = 1 ETH). Zero means no native value transfer.",
                "pattern": "^0x[0-9a-fA-F]*$",
                "title": "Value",
                "type": "string"
              }
            },
            "required": ["chain", "from_address"],
            "title": "handlerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "chain": {
                "description": "Selected EVM network.",
                "type": "string"
              },
              "counterparty": {
                "description": "Recipient / counterparty address.",
                "type": ["string", "null"]
              },
              "decision": {
                "description": "Pre-execution decision: ALLOW means simulation succeeded with no blocking signals; WARN means simulation succeeded with cautionary findings (e.g., approvals); BLOCK means deterministic simulation indicates execution would revert; INCOMPLETE means a technical/provider error prevented a conclusive decision.",
                "enum": ["ALLOW", "WARN", "BLOCK", "INCOMPLETE"],
                "type": "string"
              },
              "decoded_action": {
                "description": "Decoded ERC20/ERC1155 action when recognized.",
                "type": ["object", "null"]
              },
              "estimated_gas": {
                "description": "Estimated gas from eth_estimateGas.",
                "type": ["string", "null"]
              },
              "findings": {
                "description": "Deterministic factual findings.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "interaction_type": {
                "description": "Recognized interaction type.",
                "type": "string"
              },
              "latency_ms": {
                "description": "Observed RPC latency in milliseconds.",
                "type": "integer"
              },
              "method_selector": {
                "description": "First 4 bytes of calldata.",
                "type": ["string", "null"]
              },
              "native_value": {
                "description": "Native value in decimal wei.",
                "type": ["string", "null"]
              },
              "provider": {
                "description": "RPC provider identifier.",
                "type": "string"
              },
              "reasons": {
                "description": "Human-readable reasons for the decision.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "simulation_status": {
                "description": "RPC simulation outcome.",
                "type": "string"
              }
            },
            "required": ["chain", "counterparty", "decision", "findings", "interaction_type", "latency_ms", "method_selector", "native_value", "provider", "reasons", "simulation_status"],
            "title": "EvmTransactionExecutionDecisionOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "EVM Transaction Execution Decision"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:92b726403b791c8c6c77dd01162021179d03bc5b3e738cbd8629eb7a0360cbc9"
        },
        {
          "name": "evm_transaction_hash_lookup",
          "title": "EVM Transaction Hash Lookup",
          "description": "Look up an EVM transaction by transaction hash and return normalized transaction facts, including status, block number, sender, recipient, value, gas usage, and contract method selector. This is a factual post-transaction lookup on Ethereum or Base; live chain state may change between calls and does not simulate, send, sign, or evaluate whether the transaction was safe or appropriate to execute. USE WHEN: an agent already has an EVM transaction hash and needs to inspect the corresponding on-chain transaction. DO NOT USE WHEN: the agent needs a pre-execution transaction decision, a gas-price lookup, a wallet-balance lookup, or the latest block. A syntactically valid hash that is not found on the selected network returns NOT_FOUND as a factual result rather than a validation error.",
          "inputSchema": {
            "properties": {
              "chain": {
                "description": "EVM network to query.",
                "enum": ["ethereum", "base"],
                "title": "Chain",
                "type": "string"
              },
              "tx_hash": {
                "description": "Transaction hash (0x + exactly 64 hex chars).",
                "pattern": "^0x[a-fA-F0-9]{64}$",
                "title": "Tx Hash",
                "type": "string"
              }
            },
            "required": ["chain", "tx_hash"],
            "title": "handlerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "block_number": {
                "description": "Block number where the transaction was included.",
                "type": ["string", "null"]
              },
              "chain": {
                "description": "EVM network queried.",
                "type": "string"
              },
              "contract": {
                "description": "Contract interaction details detected from calldata.",
                "properties": {
                  "method_selector": {
                    "description": "First 4 bytes of calldata for contract calls.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["method_selector"],
                "type": "object"
              },
              "from_address": {
                "description": "Transaction sender address.",
                "type": ["string", "null"]
              },
              "gas": {
                "description": "Gas usage and fee details of the transaction.",
                "properties": {
                  "effective_gas_price_wei": {
                    "description": "Effective gas price paid per unit of gas.",
                    "type": ["string", "null"]
                  },
                  "fee_paid_wei": {
                    "description": "Total fee paid (gas_used * effective_gas_price).",
                    "type": ["string", "null"]
                  },
                  "gas_limit": {
                    "description": "Gas limit set by sender.",
                    "type": ["string", "null"]
                  },
                  "gas_used": {
                    "description": "Gas actually used by transaction.",
                    "type": ["string", "null"]
                  }
                },
                "required": ["effective_gas_price_wei", "fee_paid_wei", "gas_limit", "gas_used"],
                "type": "object"
              },
              "observed_at": {
                "description": "UTC observation timestamp in ISO-8601 format with Z suffix.",
                "format": "date-time",
                "type": "string"
              },
              "status": {
                "description": "Transaction execution status.",
                "enum": ["SUCCESS", "FAILED", "PENDING", "NOT_FOUND"],
                "type": "string"
              },
              "to_address": {
                "description": "Transaction recipient address (null for contract creation).",
                "type": ["string", "null"]
              },
              "transaction_type": {
                "description": "Type of transaction.",
                "enum": ["NATIVE_TRANSFER", "CONTRACT_CALL", "CONTRACT_CREATION", "NOT_FOUND"],
                "type": "string"
              },
              "tx_hash": {
                "description": "Transaction hash that was queried.",
                "type": "string"
              },
              "value_native": {
                "description": "Transaction value in native units (ETH).",
                "type": ["string", "null"]
              },
              "value_wei": {
                "description": "Transaction value in wei.",
                "type": ["string", "null"]
              }
            },
            "required": ["block_number", "chain", "contract", "from_address", "gas", "observed_at", "status", "to_address", "transaction_type", "tx_hash", "value_native", "value_wei"],
            "title": "EvmTransactionHashLookupOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "EVM Transaction Hash Lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:73bc2b9282a8801a9f1d7d01cca5727028057663b2783f3c58a443957a828717"
        },
        {
          "name": "evm_wallet_balance_lookup",
          "title": "EVM Wallet Balance Lookup",
          "description": "Retrieve the current native ETH balance of a wallet on Ethereum or Base and, optionally, balances for up to 20 specified ERC-20 token contracts. Results are point-in-time observations of live chain state and may change between calls. Does not evaluate wallet ownership, solvency, transaction safety, or whether a transaction should be executed. USE WHEN: an agent needs the current ETH balance or balances of specific ERC-20 tokens for an EVM address. DO NOT USE WHEN: the agent needs transaction details (evm_transaction_hash_lookup), current gas price (evm_gas_price_lookup), historical balances, or a transaction execution decision.",
