                    },
                    "symbol": {
                      "description": "Token symbol, or null when unavailable.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["balance", "balance_raw", "contract_address", "decimals", "symbol"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["address", "chain", "native_balance", "observed_at", "token_balances"],
            "title": "EvmWalletBalanceLookupOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
