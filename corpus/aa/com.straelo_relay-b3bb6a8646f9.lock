        {
          "name": "vendor_customer_transition_signal_lookup",
          "title": "Vendor Customer Transition Signal Lookup",
          "description": "Find customer domains with observed technology transition signals involving a specified vendor and return prioritized signals with supporting evidence. USE WHEN: an agent needs to identify customer-level technology transition signals related to a vendor for prospecting or change analysis. DO NOT USE WHEN: the agent needs confirmed proof that a customer switched from one vendor to another (`vendor_customer_confirmed_lookup`), historical ADDED/REMOVED adoption events (`vendor_customer_adoption_change_lookup`), or vendors currently detected on a specific customer domain (`customer_vendor_detection`); POSSIBLE_REPLACEMENT is a correlated signal, not a confirmed switch. Side effect: unsupported-vendor requests may persist aggregated demand telemetry. Results reflect CSI snapshots and may change between calls.",
          "inputSchema": {
            "properties": {
              "vendor": {
                "description": "Vendor whose customer technology transition signals should be evaluated. Supported values: yotpo, judge.me.",
                "enum": ["yotpo", "judge.me"],
                "title": "Vendor",
                "type": "string"
              }
            },
            "required": ["vendor"],
            "title": "handlerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "actionable": {
                "description": "Whether the transition signal is actionable for commercial delivery.",
                "type": "boolean"
              },
              "charged": {
                "description": "Whether payment was settled for this chargeable CSI delivery; false for unsupported or non-chargeable outcomes.",
                "type": "boolean"
              },
              "demand": {
                "description": "Demand telemetry for unsupported vendors.",
                "type": ["object", "null"]
              },
              "error": {
                "description": "Error type name on pipeline/discovery error, otherwise null.",
                "type": ["string", "null"]
              },
              "leads": {
                "description": "Prioritized transition signals when available.",
                "type": "array"
              },
              "reason": {
                "description": "Human-readable reason for the status, when applicable.",
                "type": ["string", "null"]
              },
              "stale": {
                "description": "Whether the CSI snapshot is stale and no longer actionable.",
                "type": "boolean"
              },
              "status": {
                "description": "Machine-readable outcome status for the request.",
                "enum": ["OK", "UNSUPPORTED_VENDOR", "NO_TARGETS_FOUND", "PIPELINE_ERROR", "INVALID_INPUT", "UNKNOWN_PAYMENT_STATE", "REFRESH_REQUIRED", "DISCOVERY_REQUIRED", "DISCOVERY_COOLDOWN"],
                "type": "string"
              },
              "supported": {
                "description": "Whether the queried vendor is supported by this capability.",
                "type": "boolean"
              },
              "targets": {
                "description": "Validated target domains scanned.",
                "type": "array"
              },
              "vendor": {
                "description": "Normalized vendor/technology key queried.",
                "type": "string"
              }
            },
            "required": ["actionable", "charged", "leads", "stale", "status", "supported", "targets", "vendor"],
            "title": "VendorCustomerTransitionSignalLookupOutput",
