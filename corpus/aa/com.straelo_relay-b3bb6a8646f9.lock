      "tools": [
        {
          "name": "customer_vendor_detection",
          "title": "Customer Vendor Detection",
          "description": "Scan a customer domain to detect vendors and technologies currently present using deterministic fingerprints; returns detected technologies with supporting evidence and observation details. Results are point-in-time observations; eligible CSI observations may be persisted best-effort. An empty detection means no supported fingerprint was observed in that scan — it does not prove the domain uses no technology. Side effect: eligible CSI observations may be persisted best-effort to maintain customer-vendor evidence. **USE WHEN:** an agent needs to determine which supported vendors or technologies are currently detected on a specific customer domain. **DO NOT USE WHEN:** the agent needs confirmed customer base of a vendor (use vendor-customer-confirmed-lookup), historical adoption/removal events (use vendor-customer-adoption-change-lookup), or customer transition signals (use vendor-customer-transition-signal-lookup). Parameter semantics: domain is the customer domain to inspect, not a vendor domain.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Bare public hostname (e.g., example.com). No protocol, path, query, or fragment. Localhost and IP literals rejected.",
                "maxLength": 253,
                "title": "Domain",
                "type": "string"
              }
            },
            "required": ["domain"],
            "title": "handlerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "domain": {
                "description": "Normalized public domain scanned.",
                "type": "string"
              },
              "observed_at": {
                "description": "UTC timestamp of the scan.",
                "format": "date-time",
                "type": "string"
              },
              "product": {
                "description": "Product identifier.",
                "type": "string"
              },
              "response_validity": {
                "description": "Scanner response validity classification.",
                "type": "string"
              },
              "technologies": {
                "description": "Deterministically detected technologies ordered by canonical key ascending.",
                "items": {
                  "properties": {
                    "categories": {
                      "description": "Technology categories from registry metadata when available.",
                      "items": {
                        "type": "string"
                      },
                      "type": ["array", "null"]
                    },
                    "evidence": {
                      "description": "Bounded detection evidence.",
                      "properties": {
                        "fingerprints": {
                          "items": {
                            "properties": {
                              "id": {
                                "type": "string"
                              },
                              "type": {
                                "type": "string"
                              }
                            },
                            "required": ["id", "type"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "state": {
                          "description": "Detection state: PRESENT.",
                          "type": "string"
                        }
                      },
                      "required": ["fingerprints", "state"],
                      "type": "object"
                    },
                    "name": {
                      "description": "Human-readable technology/vendor name when available from registry metadata.",
                      "type": ["string", "null"]
                    },
                    "technology": {
                      "description": "Canonical technology registry key (e.g., yotpo, judgeme, klaviyo).",
                      "type": "string"
                    }
                  },
                  "required": ["evidence", "technology"],
                  "type": "object"
                },
                "type": "array"
              },
              "technology_count": {
                "description": "Number of technologies detected as PRESENT.",
                "type": "integer"
              }
            },
            "required": ["domain", "observed_at", "product", "response_validity", "technologies", "technology_count"],
            "title": "CustomerVendorDetectionOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Customer Vendor Detection"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a8d7dd3426c94e41ff3922b03f50fffd0d89cd404a796f59155d51089296ad93"
        },
        {
          "name": "defi_route_decision",
          "title": "DeFi Route Decision",
          "description": "Compare read-only Base swap quotes obtained from 1inch and KyberSwap, evaluating output, minimum output, fees/gas, price impact, consensus, and divergence to return a deterministic economic route decision (EXECUTE_BEST, WAIT, or INSUFFICIENT_DATA). The product consults external providers during the request; quotes reflect the market state observed at that moment and identical calls can produce different results. Provider unavailability or failure can yield a partial result or insufficient data. The product does not execute, submit, sign, or authorize a swap or transaction.\nUSE WHEN: an agent needs to compare available swap routes on Base and determine whether to execute the best route, wait, or treat the available market data as insufficient.\nDO NOT USE WHEN: the agent needs to execute or submit a swap, sign a transaction, or perform a transaction-safety authorization.",
          "inputSchema": {
            "properties": {
              "amount_in": {
                "description": "Positive decimal input amount, converted exactly to raw token units.",
                "title": "Amount In",
                "type": "string"
              },
              "baseline_provider": {
                "default": null,
                "description": "Optional provider used only for a direct economic comparison.",
                "enum": ["oneinch", "kyberswap"],
                "title": "Baseline Provider",
                "type": "string"
              },
              "chain": {
                "description": "Base Mainnet only in this quote-only MVP.",
                "enum": ["base"],
                "title": "Chain",
                "type": "string"
              },
              "slippage_bps": {
                "description": "Slippage tolerance in basis points; it is not treated as a cost.",
                "maximum": 10000,
                "minimum": 0,
                "title": "Slippage Bps",
                "type": "integer"
              },
              "token_in": {
                "description": "Input Base asset symbol.",
                "enum": ["USDC", "USDT", "ETH", "WETH"],
                "title": "Token In",
                "type": "string"
              },
              "token_out": {
                "description": "Output Base asset symbol; must differ from token_in.",
                "enum": ["USDC", "USDT", "ETH", "WETH"],
                "title": "Token Out",
                "type": "string"
              }
            },
            "required": ["amount_in", "chain", "slippage_bps", "token_in", "token_out"],
            "title": "handlerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "best_provider": {
                "description": "Best comparable provider only when at least two valid quotes are available.",
                "type": ["string", "null"]
              },
              "confidence": {
                "description": "Deterministic quote-comparison confidence; two providers never produce HIGH in this MVP.",
                "enum": ["LOW", "MEDIUM"],
                "type": "string"
              },
              "consensus": {
                "description": "Comparable-output median and comparison basis when two provider quotes are valid.",
                "type": ["object", "null"]
              },
              "decision": {
                "description": "Deterministic economic decision: which swap quote the agent should choose right now. Not a safety authorization and does not execute a swap.",
                "enum": ["EXECUTE_BEST", "WAIT", "INSUFFICIENT_DATA"],
                "type": "string"
              },
              "decision_reason": {
                "description": "Human-readable deterministic reason for the decision.",
                "type": "string"
              },
              "decision_signals": {
                "description": "Objective signals used for the decision.",
                "type": "object"
              },
              "economic_advantage": {
                "description": "Best quote versus declared baseline or next available quote; never ROI.",
                "type": ["object", "null"]
              },
              "economics": {
                "description": "Known or unknown estimated provider COGS; unknown is never represented as zero.",
                "type": "object"
              },
              "evidence_quality": {
                "description": "Per-provider reported, calculated, estimated, or unavailable field quality.",
                "type": "object"
              },
              "observed_at": {
                "description": "UTC timestamp when the latest provider quote was observed during this request.",
                "format": "date-time",
                "type": "string"
              },
              "partial": {
                "description": "True when one or more providers did not yield a valid quote.",
                "type": "boolean"
              },
              "provider_failures": {
                "description": "Providers that failed to return a valid quote, with provider name and failure category.",
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "provider": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "provider"],
                  "type": "object"
                },
                "type": "array"
              },
              "quotes": {
                "description": "Normalized provider quote evidence in raw token units.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "Outcome of the quote comparison: COMPARISON_AVAILABLE when at least two valid quotes exist, PARTIAL when some but not all providers succeeded, UPSTREAM_UNAVAILABLE when no provider returned a valid quote.",
                "enum": ["COMPARISON_AVAILABLE", "PARTIAL", "UPSTREAM_UNAVAILABLE"],
                "type": "string"
              },
              "usage": {
                "description": "Per-provider call success, latency, and configured cost-estimate availability.",
                "type": "object"
              }
            },
            "required": ["best_provider", "confidence", "consensus", "decision", "decision_reason", "decision_signals", "economic_advantage", "economics", "evidence_quality", "observed_at", "partial", "provider_failures", "quotes", "status", "usage"],
            "title": "DefiRouteDecisionOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "DeFi Route Decision"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:40f41ef92cbabb09eb2fa700790b06734f34c68f76cc7a7bdc1782bd4716ecb5"
        },
        {
          "name": "domain_agent_discovery_check",
          "title": "Domain & Agent Discovery Check",
          "description": "Inspect a public domain across DNS, HTTP/HTTPS/TLS, email posture and AI-agent discovery surfaces, including robots.txt, llms.txt, OpenAPI, MCP, x402 and Agent Card availability.\nUSE WHEN: an agent needs a single-call observational check of a domain's surfaces or wants to compare with a previous state.\nDO NOT USE WHEN: protocol validation, Agent Card/A2A validation, MCP compliance validation, security certification, or a consumption guarantee. **USE `domain_risk_trust_decision` FOR:** merchant/domain trust.\nOperational behavior: no tool-specific auth or rate limit; remote surfaces may throttle requests.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Bare public domain for consolidated domain health, DNS, TLS, and email-posture inspection; no protocol or path; localhost and IP literals are rejected.",
                "title": "Domain",
                "type": "string"
              },
              "previous_state": {
                "default": null,
                "description": "Optional prior `new_state` returned by this product. Supplied statelessly by the caller; when provided, it is compared against the current observation to populate `changes`. Omit it for a baseline inspection with no change detection.",
                "title": "Previous State",
                "type": "object"
              }
            },
            "required": ["domain"],
            "title": "handlerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "actions": {
                "description": "Recommended remediation actions derived from detected issues. Each item includes a code and a human-readable action. The tool does not execute these actions; they are recommendations only.",
                "type": "array"
              },
              "agent_readiness": {
                "description": "Observed agent discovery signals.",
                "type": "object"
              },
              "changes": {
                "description": "Material field-level differences between `previous_state` and the current observation. Each item names a changed field with its previous and current values. Empty when `previous_state` is omitted or no field differs. Requires `previous_state` to produce non-empty results.",
                "type": "array"
              },
              "cname": {
                "description": "DNS CNAME records observed for the domain.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "current_state": {
                "description": "Structured snapshot of the current observation: domain, DNS, health, email posture, and agent readiness. Identical to `new_state`. Compared against `previous_state` to produce `changes` when supplied. Not persisted server-side.",
                "type": "object"
              },
              "data_quality": {
                "description": "Observation quality summary: checks requested, completed, and failed, plus coverage (complete or partial). Reflects partial failures and missing surfaces. Not a score or verdict.",
                "type": "object"
              },
              "dns": {
                "description": "Observed DNS records and diagnostics.",
                "type": "object"
              },
              "domain": {
                "description": "Validated public domain.",
                "type": "string"
              },
              "email_posture": {
                "description": "Observed email posture including MX, SPF, and DMARC.",
                "type": "object"
              },
              "evidence": {
                "description": "Observed evidence from DNS, HTTP/HTTPS, and agent-discovery checks. Each item names a source, the observation timestamp, the observed value, and freshness. Contains live remote observations; does not guarantee proof or validation.",
                "type": "array"
              },
              "freshness": {
                "description": "Freshness state of the observation: 'live' when no previous client-supplied state participates in comparison, 'current_with_client_supplied_previous_state' when prior state was supplied and compared.",
                "type": "string"
              },
              "health": {
                "description": "Observed domain health: DNS, HTTP, HTTPS, redirects, TLS, and latency.",
                "type": "object"
              },
              "issues": {
                "description": "Detected issues from the inspection: unresolved DNS, unavailable HTTPS, missing SPF/DMARC, TLS expiring soon, or unavailable agent-discovery signals. Each item includes a code, severity, message, and evidence references. Empty when no issues are found. Not a safety or security verdict.",
                "type": "array"
              },
              "material_changes": {
                "description": "Material field-level changes detected between prior state and current observation.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "missing": {
                "description": "Product surfaces or data elements identified as missing during the observation.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "new_state": {
                "description": "Current observation state, structured identically to `current_state`. Can be supplied as `previous_state` in a subsequent call to enable change detection. Not persisted server-side; the caller stores and passes it back.",
                "type": "object"
              },
              "next_check_after": {
                "description": "Suggested interval before the next observation or reinspection.",
                "type": ["string", "null"]
              },
              "observed_at": {
                "description": "UTC timestamp when the inspection observation was generated, in ISO 8601 format with Z suffix. Reflects the local observation time, not a provider timestamp.",
                "format": "date-time",
                "type": "string"
              },
              "security_posture": {
                "description": "Observed HTTPS/TLS security posture; not a safety verdict.",
                "type": "object"
              }
            },
            "required": ["actions", "agent_readiness", "changes", "cname", "current_state", "data_quality", "dns", "domain", "email_posture", "evidence", "freshness", "health", "issues", "material_changes", "missing", "new_state", "next_check_after", "observed_at", "security_posture"],
            "title": "DomainAgentDiscoveryCheckOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Domain & Agent Discovery Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f7fb621c56ea1eaef8ee810796e9e6ceb497d9292d57696e635437a16bef7a5a"
        },
        {
          "name": "domain_risk_trust_decision",
          "title": "Domain Risk & Trust Decision",
          "description": "Deterministic domain risk and trust evaluation returning ALLOW / REVIEW / BLOCK. Decision for observed evidence; external evidence may change between calls. Uses DNS, RDAP, TLS, HTTP/redirect, URLhaus threat reputation, local indicators. Read-only: external read queries only, no action on domain, no persistence, limited cache. USE WHEN: decide whether domain is safe enough for interaction, onboarding, outreach, or payment. DO NOT USE WHEN: consolidated domain health/operational inspection (use domain_agent_discovery_check) or email validation (use email_suitability_decision). Example: domain='example.com'.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Bare public hostname (e.g., example.com). No protocol, path, query, or fragment. Localhost and IP literals rejected.",
                "maxLength": 253,
                "title": "Domain",
                "type": "string"
              }
            },
            "required": ["domain"],
            "title": "handlerArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "a": {
                "description": "Observed DNS A (IPv4) records.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "aaaa": {
                "description": "Observed DNS AAAA (IPv6) records.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "caa": {
                "description": "DNS CAA record evidence.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cname": {
                "description": "DNS CNAME record evidence.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "confidence": {
                "description": "Confidence in the decision from 0 to 100.",
                "type": "integer"
              },
              "decision": {
                "description": "Trust decision for the domain.",
                "enum": ["ALLOW", "REVIEW", "BLOCK"],
                "type": "string"
              },
              "diagnostics": {
                "description": "Deterministic missing-record diagnostics.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "dmarc": {
                "description": "DMARC records derived from observed DNS TXT records (v=dmarc1).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "dns_record_states": {
                "description": "Structured DNS-record observation and state information used by the decision.",
                "type": "object"
              },
              "dnssec_available": {
                "description": "Whether DNSSEC evidence is available for the evaluated domain.",
                "type": "boolean"
              },
              "domain": {
                "description": "Validated public domain.",
                "type": "string"
              },
              "evidence_complete": {
                "description": "Whether all evidence sources were available.",
                "type": "boolean"
              },
              "indicators": {
                "description": "Observed risk indicators.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "mx": {
                "description": "Observed DNS MX records.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ns": {
                "description": "Observed DNS NS records.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recommended_action": {
                "description": "Suggested action for the agent.",
                "type": "string"
              },
              "risk_level": {
                "description": "Risk level derived from observed signals.",
                "enum": ["LOW", "MEDIUM", "HIGH", "CRITICAL"],
                "type": "string"
              },
              "risk_score": {
                "description": "Risk score from 0 to 100.",
                "type": "integer"
              },
              "signals": {
                "description": "Evidence source states (DNS, RDAP, TLS, HTTP, threat intel).",
                "type": "array"
              },
              "soa": {
                "description": "DNS SOA record evidence.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "spf": {
                "description": "SPF records derived from observed DNS TXT records (v=spf1).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "structured_reasons": {
                "description": "Human-readable explanation for the decision.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "threat_evidence": {
                "description": "Structured threat-intelligence evidence contributing to the risk/trust assessment.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "txt": {
                "description": "Observed DNS TXT records.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["a", "aaaa", "caa", "cname", "confidence", "decision", "diagnostics", "dmarc", "dns_record_states", "dnssec_available", "domain", "evidence_complete", "indicators", "mx", "ns", "recommended_action", "risk_level", "risk_score", "signals", "soa", "spf", "structured_reasons", "threat_evidence", "txt"],
            "title": "DomainRiskTrustDecisionOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Domain Risk & Trust Decision"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
