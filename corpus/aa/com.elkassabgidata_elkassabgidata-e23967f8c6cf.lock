        },
        {
          "name": "compare_countries",
          "description": "Cross-country comparison of one indicator, honestly aligned.",
          "arguments": [
            {
              "name": "indicator",
              "description": "e.g. 'inflation, consumer prices'",
              "required": true
            },
            {
              "name": "countries",
              "description": "comma-separated, e.g. 'DEU,FRA,ITA'",
              "required": true
