        },
        {
          "name": "hf_event_study",
          "description": "Event-study scaffold on HF 1-minute equity data (code-executing agents).",
          "arguments": [
            {
              "name": "ticker",
              "required": true
            },
            {
              "name": "event_date",
              "description": "YYYY-MM-DD",
              "required": true
            }
          ],
          "digest": "sha256:bf0623017acf048c6c18b2334333f0e382ef94e7f2e6644cb2334e95486d62a1"
        }
      ],
