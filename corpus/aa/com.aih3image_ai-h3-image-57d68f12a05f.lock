{
  "lockfileVersion": 2,
  "subjects": {
    "com.aih3image/ai-h3-image": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aih3image.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ai-h3-image",
        "title": "AI H3 Image",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Turn a photo already uploaded to AI H3 Image into a video. Connect using an account token from https://aih3image.com/api/mcp/token. Find the photo, quote the cost, and confirm the credits and visibility with the user before submitting. Reuse the same request_id and inputs when retrying a submission. Check the task for its result.",
      "tools": [
        {
          "name": "generate_video",
          "description": "Animate one uploaded photo. This spends credits. Get a quote first and confirm cost and visibility with the user. Retry with the same request_id and inputs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "expected_credits": {
                "minimum": 0,
                "type": "number"
              },
              "is_public": {
                "description": "Use true for public output. Private output requires paid access.",
                "type": "boolean"
              },
              "prompt": {
                "maxLength": 10000,
                "minLength": 1,
                "type": "string"
              },
              "request_id": {
                "pattern": "^[a-zA-Z0-9_-]{8,96}$",
                "type": "string"
              }
            },
            "required": ["asset_id", "expected_credits", "is_public", "prompt", "request_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8eee997a7ee1fdbb06b969d3492d19c9d14d50afdfec14ba1cfaa78629e7d97b"
        },
        {
          "name": "get_generation",
          "description": "Check a task belonging to the connected account and get its video link when ready.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "task_id": {
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:808d399615ce5fb87500ae1d0bafb2081a94feb0baad05698bda3186b055a541"
        },
        {
          "name": "list_image_assets",
          "description": "List photos already uploaded to the connected account. Use an ID from this list to generate a video.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "page": {
                "default": 1,
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f2d6f5ae1a41e196f4487fc054a21ffa6f5da260b44830adab5579caf18e5acf"
        },
        {
          "name": "quote_generation",
          "description": "Check the credit cost and settings for turning an uploaded photo into a video. Does not start generation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "is_public": {
                "description": "Use true for public output. Private output requires paid access.",
                "type": "boolean"
              },
              "prompt": {
                "maxLength": 10000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["asset_id", "is_public", "prompt"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0cabf7c79587a045034128ea09c597e8b8a5577178813ef71d22640ba339c560"
        }
      ],
      "digest": "sha256:28129f40c61cf591bef0a3b8dce74bfec85cd097b53b85128ca3ae2f69d4a5ed"
    }
  }
}
