{
  "lockfileVersion": 2,
  "subjects": {
    "ai.greyridgesignals/sports-scores-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sports-scores-mcp.sigrunner.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "grey-ridge-live-sports-scores",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live and same-day sports scores across 20+ sports from TheSportsDB, normalized to one cross-sport schema with a derived lifecycle status (scheduled / in_progress / final / postponed) and a freshness field (data_age_seconds = how stale the reading was when served). Keyless and free. Call get_live_scores for in-progress games, get_scores_by_date for a calendar day (UTC), list_sports to discover filters.",
      "tools": [
        {
          "name": "get_live_scores",
          "description": "Return currently in-progress games across all sports (or one sport). Each row carries home/away teams and scores, league, a derived status, the live clock/period marker, and data_age_seconds (source freshness at serve time). Keyless, free.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max rows to return (default 50, max 200).",
                "type": "integer"
              },
              "sport": {
                "description": "Optional sport filter (e.g. \"soccer\", \"basketball\", \"nfl\", \"nhl\", \"mlb\"). Omit or \"all\" for every sport.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:41af5bb8c688f076ccb60030345fa41606925a84aecd83317aad8e59c37d0171"
        },
        {
          "name": "get_scores_by_date",
          "description": "Return all events on a calendar date (UTC, \"YYYY-MM-DD\"), optionally filtered to one sport. Same unified schema and freshness field as get_live_scores. Use for finals, fixtures, and a full day board. Keyless, free.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Calendar date in UTC, \"YYYY-MM-DD\". Defaults to today (UTC) if omitted.",
                "type": "string"
              },
              "limit": {
                "description": "Max rows to return (default 50, max 200).",
                "type": "integer"
              },
              "sport": {
                "description": "Optional sport filter. Omit for every sport.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:39436cf5b0e2bc6834e962c412c4aa4090ac7d5bfbb5ef70be92ad5a12233b37"
        },
        {
          "name": "list_sports",
          "description": "List the sport filters this server understands (canonical labels + common aliases like nba/nfl/nhl/mlb). Keyless, free.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c680e816c5e2519689daa414d3f31f637d3d4e4c8cdaf36aca7e9275526a31fd"
        }
      ],
      "digest": "sha256:a6570bcefe3110585e33e96ca4dcfa928cedacb773a98a96b6f136002f56dc82"
    }
  }
}
