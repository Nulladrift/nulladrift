{
  "lockfileVersion": 2,
  "subjects": {
    "ai.greyridgesignals/sports-scores-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sports-scores-mcp.sigrunner.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "grey-ridge-live-sports-scores",
        "version": "0.4.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live and same-day sports scores across 20+ sports from TheSportsDB, plus betting ODDS (point spread, over/under, moneyline from DraftKings via ESPN) for the major US + soccer leagues — all normalized to one cross-sport schema with a derived lifecycle status (scheduled / in_progress / final / postponed) and a freshness field (data_age_seconds = how stale the reading was when served). Keyless and free. Call get_live_scores for in-progress games, get_scores_by_date for a calendar day (UTC), get_odds for betting lines on a league, get_matchup for a one-call betting-research card on a single game (recent form + streak, head-to-head season series, against-the-spread record, and ESPN win-probability), list_odds_leagues for the odds-covered leagues, list_sports to discover score filters. Bulk / scheduled / multi-league pipelines with dataset storage are in see_also (hosted rail).",
      "tools": [
        {
          "name": "get_injuries",
          "description": "Return the current injury report for a league: player, team, position, status (Out, Day-To-Day, ...) and the latest short report note with its update time. Optionally filter to one team by name. Use before reading a betting line from get_odds. Keyless, free.",
          "inputSchema": {
            "properties": {
              "league": {
                "description": "League token: nfl, nba, nhl, mlb, ncaaf, epl, ... or a raw ESPN path. Call list_odds_leagues for all.",
                "type": "string"
              },
              "limit": {
                "description": "Max rows (default 50, max 200).",
                "type": "integer"
              },
              "team": {
                "description": "Optional team-name substring, e.g. \"lakers\".",
                "type": "string"
              }
            },
            "required": ["league"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ac4a4f13e8ae54e30c3a8de29d2052a8aa91ced215ce4512502930f6dfd3321a"
        },
        {
          "name": "get_live_scores",
          "description": "Return currently in-progress games across all sports (or one sport). Each row carries home/away teams and scores, league, a derived status, the live clock/period marker, and data_age_seconds (source freshness at serve time). Keyless, free.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max rows to return (default 50, max 200).",
                "type": "integer"
              },
              "sport": {
                "description": "Optional sport filter (e.g. \"soccer\", \"basketball\", \"nfl\", \"nhl\", \"mlb\"). Omit or \"all\" for every sport.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:41af5bb8c688f076ccb60030345fa41606925a84aecd83317aad8e59c37d0171"
        },
        {
          "name": "get_matchup",
          "description": "One-call betting-research card for a SINGLE game: each team's recent form (last-5 result string, W-L record, and current streak), the head-to-head season series (series score + completed meetings), the against-the-spread record (US sports, once enough games exist), and ESPN's win-probability (US sports; soccer omits it). This is the depth an odds-watching agent would otherwise make four extra calls for. Pass the league token and the event_id returned by get_odds. Keyless, free. Bulk/scheduled research feeds are in see_also (hosted rail).",
          "inputSchema": {
            "properties": {
              "event_id": {
                "description": "The event_id from a get_odds row, e.g. \"espn:401909976\" (the \"espn:\" prefix is optional).",
                "type": "string"
              },
              "league": {
                "description": "League token (nfl, nba, nhl, mlb, epl, \"la liga\", ncaaf, ucl, ...) or a raw ESPN path. Same tokens as get_odds; call list_odds_leagues for all.",
                "type": "string"
              }
            },
            "required": ["event_id", "league"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:322a03b0aaf3ce76ad7297e803031cf8e43ac183450acbd577a93bc4f3f7fe1b"
        },
        {
          "name": "get_news",
          "description": "Return the latest headlines for a league (headline, one-line summary, publish time, link). Use for breaking context such as suspensions or trades. Not an injury list: call get_injuries for that. Keyless, free.",
          "inputSchema": {
            "properties": {
              "league": {
                "description": "League token: nfl, nba, nhl, mlb, ncaaf, epl, ... or a raw ESPN path.",
                "type": "string"
              },
              "limit": {
                "description": "Max headlines (default 10, max 50).",
                "type": "integer"
              }
            },
            "required": ["league"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e67b2633c8543532df03294869d98ccbecb1fcd095593c6d586fcb56fc48d2d5"
        },
        {
          "name": "get_odds",
          "description": "Return betting lines for a league's current scoreboard: point spread, over/under total, and home/away moneyline (single-book, DraftKings via ESPN), plus each team's win/loss record and the game status. Call with a league token (nfl, nba, nhl, mlb, epl, \"la liga\", ncaaf, ucl, ...). Lines appear once a game is posted by the book and are null before then. Keyless, free. Bulk/scheduled odds feeds are in see_also.",
          "inputSchema": {
            "properties": {
              "league": {
                "description": "League token: nfl, nba, wnba, nhl, mlb, ncaaf, ncaam, ufc, epl, \"la liga\", bundesliga, \"serie a\", ligue1, ucl, uel, mls — or a raw ESPN path like \"soccer/esp.1\". Call list_odds_leagues for all.",
                "type": "string"
              },
              "limit": {
                "description": "Max games to return (default 50, max 200).",
                "type": "integer"
              }
            },
            "required": ["league"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:93a003bbb2ab95464234f33b68ed90f824d8c9154983b66d7b1a5b85bf8d73d5"
        },
        {
          "name": "get_scores_by_date",
          "description": "Return all events on a calendar date (UTC, \"YYYY-MM-DD\"), optionally filtered to one sport. Same unified schema and freshness field as get_live_scores. Use for finals, fixtures, and a full day board. Keyless, free.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Calendar date in UTC, \"YYYY-MM-DD\". Defaults to today (UTC) if omitted.",
                "type": "string"
              },
              "limit": {
                "description": "Max rows to return (default 50, max 200).",
                "type": "integer"
              },
              "sport": {
                "description": "Optional sport filter. Omit for every sport.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:39436cf5b0e2bc6834e962c412c4aa4090ac7d5bfbb5ef70be92ad5a12233b37"
        },
        {
          "name": "list_odds_leagues",
          "description": "List the league tokens get_odds understands (US majors + top soccer leagues) with their sport and ESPN path. Keyless, free.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:efd1680ddab6a9b4fd569fa3098a44bc279d5c96465f9ed262fbd9b72378e8ca"
        },
        {
          "name": "list_sports",
          "description": "List the sport filters the score tools understand (canonical labels + common aliases like nba/nfl/nhl/mlb). Keyless, free.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dfc53b5ef9d4c19a4bcd1de86941221cd43ad68a2080ab48faf50571a9362ff0"
        }
      ],
      "digest": "sha256:72ac5cef96ae9bde8c45738167038a16121a54636526cea593c205b8ce4b96d2"
    }
  }
}
