{
  "lockfileVersion": 2,
  "subjects": {
    "ai.28in28/agent-service-desk": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://28in28.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "28in28-email-check",
        "title": "28/28 Agent Service Desk: Fix & Verify",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only check of a domain's public email-authentication DNS (MX, SPF, DKIM, DMARC, MTA-STS, TLS-RPT) with the exact records to change, a non-binding machine-readable quote for the Fix & Verify service (quoteFixVerify) and a re-check against the quoted criteria (verifyFixVerify). Paid orders are not open: no tool creates an order, contract or payment. It never changes DNS and needs no access. Only for domains you are allowed to check. Privacy: https://28in28.ai/privacy (section 8). Rate-limited.",
      "tools": [
        {
          "name": "checkDomain",
          "title": "Check email authentication of a domain",
          "description": "Reads the public DNS of one domain and reports SPF, DKIM, DMARC, MX, MTA-STS and TLS-RPT findings, risks, unknowns and the exact DNS changes to fix them. Read-only; nothing is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name, e.g. example.com",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:38b8731528c4df5c7c638c3fe45e28c8587fd4b1b3c39f487643facc71ea8634"
        },
        {
          "name": "quoteFixVerify",
          "title": "Scope and quote Fix & Verify for a domain",
          "description": "Runs the email-authentication check of one domain and returns a machine-readable, NON-BINDING quote for Fix & Verify: price (EUR 99 net per domain), scope (exact DNS changes), acceptance criteria and the baseline to verify against later. Orders are not open: it creates no order, contract or payment and stores nothing. Keep the returned criteria and baseline to call verifyFixVerify after the records are published.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name, e.g. example.com",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:200df780d715e6db9ffe25172542d8bd5d84e7788fc9a17480bf7d7b99774291"
        },
        {
          "name": "verifyFixVerify",
          "title": "Verify a Fix & Verify scope after the DNS change",
          "description": "Re-runs the check of the domain and compares it with the acceptance criteria and baseline of an earlier quoteFixVerify result: PASS when every criterion is resolved and no new critical or high finding appeared. Read-only; nothing is stored; a pass is not an invoice while orders are closed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "baseline": {
                "description": "baseline.risk_codes from the quote",
                "items": {
                  "pattern": "^[a-z0-9_]{1,48}$",
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              },
              "criteria": {
                "description": "acceptance.criteria from the quote",
                "items": {
                  "pattern": "^[a-z0-9_]{1,48}$",
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              },
              "domain": {
                "description": "The quoted domain",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              },
              "token": {
                "description": "next.verify.arguments.token from the quote",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "required": ["baseline", "criteria", "domain", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:21292a814694bc33fd94e7e50f50da0fffda06ebcba3432a76ade53f7b5858da"
        }
      ],
      "digest": "sha256:5f2144ed6d71d4cdea22e5215dc058e64e424bf624568b5eeaa4588bce8ba516"
    }
  }
}
