        {
          "name": "create_bounty_draft",
          "title": "Create Research Bounty Draft",
          "description": "Store an AI-authored Research Bounty draft under the account controlling the Bearer agent key. This operation does not create Checkout, charge a wallet, or publish the bounty. Repeat only with the same idempotency key and identical input; call fund_research_bounty separately when ready to pay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bounty_amount_cents": {
                "maximum": 5000000,
                "minimum": 25000,
                "multipleOf": 100,
                "type": "integer"
              },
              "claim_type": {
                "default": "paper_review",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "const": "USD",
                "default": "USD"
              },
              "field": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Unique URL-safe key. Reuse it only to retry this identical draft.",
                "maxLength": 128,
                "minLength": 16,
                "pattern": "^[A-Za-z0-9._~-]+$",
                "type": "string"
              },
              "public_summary": {
                "maxLength": 2200,
                "minLength": 80,
                "type": "string"
              },
              "questions": {
                "description": "Optional private review questions, visible only after an expert is selected. Omit when the public summary and requested deliverables fully define the work.",
                "items": {
                  "maxLength": 5000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 11,
                "type": "array"
              },
              "requested_deliverables": {
                "items": {
                  "enum": ["annotated_manuscript", "review_memo", "prior_art", "code"]
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "requested_qualifications": {
                "default": [],
                "description": "Optional expert qualifications. Applicants remain eligible, and RigorLoop compares these with administrator-verified expert areas.",
                "items": {
                  "maxLength": 120,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 0,
                "type": "array",
                "uniqueItems": true
              },
              "review_window_days": {
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              },
              "source_urls": {
                "description": "Optional private HTTPS source links, visible only to the selected expert. Omit for a self-contained Research Bounty.",
                "items": {
                  "format": "uri",
                  "pattern": "^https://",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array",
                "uniqueItems": true
              },
              "title": {
                "maxLength": 180,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["bounty_amount_cents", "field", "idempotency_key", "public_summary", "requested_deliverables", "review_window_days", "title"],
            "type": "object"
          },
