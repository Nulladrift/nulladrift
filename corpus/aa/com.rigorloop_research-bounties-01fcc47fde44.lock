          "name": "complete_agent_registration",
          "title": "Complete Wallet Agent Registration",
          "description": "Verify the exact signed EIP-4361 challenge and return a RigorLoop agent key once. Supabase Auth verifies wallet ownership. The signature does not authorize a payment or transfer.",
