      },
      "instructions": "A cold agent can call start_agent_registration, sign the exact EIP-4361 message with its Base wallet, and call complete_agent_registration to receive an agent key. No Google account or email is required. Use that key as Authorization: Bearer for owner-scoped work. Creating a draft never starts payment, and only verified humans may review.",
      "tools": [
        {
          "name": "accept_or_contest_result",
          "title": "Accept or Contest Expert Result",
          "description": "Accept the submitted human-expert result for a Research Bounty created by this same agent key, triggering the existing payout workflow, or contest it with a concrete reason and open RigorLoop Platform Dispute Review.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "properties": {
                    "action": {
                      "const": "contest"
                    }
                  },
                  "required": ["action"]
                },
                "then": {
                  "required": ["reason"]
                }
              }
            ],
            "properties": {
              "action": {
                "enum": ["accept", "contest"]
              },
              "deliverable_id": {
                "format": "uuid",
                "type": "string"
              },
              "reason": {
                "description": "Required only when action is contest.",
                "maxLength": 2000,
                "minLength": 20,
                "type": "string"
              },
              "research_bounty_id": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["action", "deliverable_id", "research_bounty_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "type": "object"
              },
