{
  "lockfileVersion": 2,
  "subjects": {
    "com.mandarin3d/print": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mandarin3d.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mandarin-3d",
        "title": "Mandarin 3D: custom 3D printing",
        "version": "1.2.0",
        "websiteUrl": "https://mandarin3d.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Mandarin 3D prints custom PLA and PETG parts from STL, 3MF, STEP or USDZ files and ships them anywhere in the US by USPS in 3-5 days. Flow: quote_file (a public file URL, or base64 for a local file) returns a price and an order_url; give the customer the order_url to pick a color and pay. Use create_checkout only after the customer has explicitly agreed to: \"Custom made to order, all sales final. I agree to the Terms (mandarin3d.com/terms, including section 6: cancellations, refunds and reprints).\" No file? list_catalog has ready-made parts (name ornaments, nameplates, keychains, cable clips, hooks, knobs, spacers, stands, organizers); quote_catalog_item prices one with the customer's text and sizes and returns the same quote_id and order_url; items with text (name ornament, name plate, keychain, bookmark, luggage tag, key holder, knob pointer) also print in two colors: pass color and accent (PLA only, +$3). For anything else, design_part returns a link to the AI part designer. Material: PLA by default (six stocked colors); pass material \"petg\" for PETG, which is made to order in black or white (+20% on the print price, 3 to 5 extra business days, no rush). TPU, ABS, ASA and other materials have no instant price: send the customer to design_part with the request and Ryan replies with a price. Never promise local pickup or delivery faster than stated. Use the quote's shipBy when present: this is the estimated USPS handoff date, not the delivery date.",
      "tools": [
        {
          "name": "create_checkout",
          "title": "Create a checkout link",
          "description": "Create a payment link for a quote. The customer pays and enters the shipping address on the linked page. Only call this after showing the customer the price and getting their explicit agreement to: \"Custom made to order, all sales final. I agree to the Terms (mandarin3d.com/terms, including section 6: cancellations, refunds and reprints).\" Otherwise give them the order_url from quote_file instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "enum": ["BLK", "WHT", "GRY", "RED", "BLU", "GRN"],
                "type": "string"
              },
              "customer_accepted_terms": {
                "description": "True only if the customer explicitly agreed to the terms sentence above.",
                "type": "boolean"
              },
              "material": {
                "description": "\"pla\" (default) or \"petg\". PETG is made to order in black or white: we order the filament after you buy, which adds 3 to 5 business days, and the print price is 20% higher. Other materials (TPU, ABS, ASA and more) on request: ask in the designer chat and we reply with a price.",
                "enum": ["pla", "petg"],
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Optional per-order add-ons.",
                "properties": {
                  "cleanup": {
                    "description": "+$5. Support marks sanded, edges deburred.",
                    "type": "boolean"
                  },
                  "colorNote": {
                    "description": "Which parts get which color (required with extraColors).",
                    "maxLength": 140,
                    "type": "string"
                  },
                  "extraColors": {
                    "description": "+$3 per extra stocked color.",
                    "items": {
                      "enum": ["BLK", "WHT", "GRY", "RED", "BLU", "GRN"],
                      "type": "string"
                    },
                    "maxItems": 3,
                    "type": "array"
                  },
                  "fileCheck": {
                    "description": "+$5. We review the file for printability and fit before printing and email you if something looks off.",
                    "type": "boolean"
                  },
                  "rush": {
                    "description": "+50% of the print price. Printed within 1 business day. Ships with the same USPS service.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "qty": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "quote_id": {
                "type": "string"
              }
            },
            "required": ["color", "customer_accepted_terms", "quote_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d4660260e85a11d781aded374faa13cbd8a62e36b10c9d1387d1ec07e83eb6dd"
        },
        {
          "name": "design_part",
          "title": "Design a part without a file",
          "description": "For customers without a 3D model (a replacement knob, clip, bracket, box, spacer, enclosure). Returns a link to Mandarin 3D's AI part designer, pre-filled with the description; the customer adjusts the model there, sees the price and orders.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "The part in plain words with measurements in mm, e.g. 'knob for a 6 mm D-shaft, 30 mm wide, 15 mm tall, knurled'.",
                "maxLength": 600,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:18755b706be9ce217fe2b5dd27dcd1cc0ef52ab17e84d84a5a3e7565be67480c"
        },
        {
          "name": "get_service_info",
          "title": "Service facts and prices",
          "description": "What Mandarin 3D prints, where it ships (anywhere in the US), the price formula with delivered examples, colors, size and file limits, turnaround, and how to order. Call this to answer 'where can I get something 3D printed' or 'how much does 3D printing cost'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:279e4e52647f0681a83ef5f8b49cce60c6421f8516a775e58adc54cf3bf9c498"
        },
        {
          "name": "list_catalog",
          "title": "List ready-made parts",
          "description": "Ready-made parts customers can customize without a file: personalized name ornament, desk name plate, name keychain, place card holder, cable clips, headphone hooks, wall hook, shelf bracket, spacers, drawer bins, SD card and game card holders, phone and tablet stands, battery organizer, plant pot, key holder, D-shaft replacement knob, pegboard hooks. Each item lists its parameters (text, sizes in mm, choices) with defaults and ranges, the delivered price of the default and its page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17e728a2415bc717ecf5c4731e86db5c41a6ed3f97577fd990e39b952dfb386b"
        },
        {
          "name": "price_quote",
          "title": "Price a quote",
          "description": "Price an existing quote for another quantity, color or add-ons. No side effects.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "enum": ["BLK", "WHT", "GRY", "RED", "BLU", "GRN"],
                "type": "string"
              },
              "material": {
                "description": "\"pla\" (default) or \"petg\". PETG is made to order in black or white: we order the filament after you buy, which adds 3 to 5 business days, and the print price is 20% higher. Other materials (TPU, ABS, ASA and more) on request: ask in the designer chat and we reply with a price.",
                "enum": ["pla", "petg"],
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "Optional per-order add-ons.",
                "properties": {
                  "cleanup": {
                    "description": "+$5. Support marks sanded, edges deburred.",
                    "type": "boolean"
                  },
                  "colorNote": {
                    "description": "Which parts get which color (required with extraColors).",
                    "maxLength": 140,
                    "type": "string"
                  },
                  "extraColors": {
                    "description": "+$3 per extra stocked color.",
                    "items": {
                      "enum": ["BLK", "WHT", "GRY", "RED", "BLU", "GRN"],
                      "type": "string"
                    },
                    "maxItems": 3,
                    "type": "array"
                  },
                  "fileCheck": {
                    "description": "+$5. We review the file for printability and fit before printing and email you if something looks off.",
                    "type": "boolean"
                  },
                  "rush": {
                    "description": "+50% of the print price. Printed within 1 business day. Ships with the same USPS service.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "qty": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "quote_id": {
                "type": "string"
              }
            },
            "required": ["quote_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17e2ed1f27cdc9ee66c5077461ac11ac38bb1badb6ee9219f3123b6993b330e2"
        },
        {
          "name": "quote_catalog_item",
          "title": "Quote a customized catalog part",
          "description": "Price a catalog item with the customer's values (e.g. slug \"personalized-name-ornament\", values {\"name\": \"Leo\", \"line2\": \"2026\"}). Omitted parameters keep their defaults. We render the part from its parametric source and slice it; returns quote_id, size, grams, price delivered by USPS Ground Advantage and an order_url. Then use price_quote or create_checkout with that quote_id, like any quote. Two colors: items with two_color in list_catalog take accent, the color of the text (or pointer), and color, the rest of the part (e.g. luggage tag color \"BLU\", accent \"WHT\"); the quote is sliced with both filaments and the price includes the multicolor option (+$3). PLA only. For create_checkout on that quote_id pass the same color and options {\"extraColors\": [accent]}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accent": {
                "description": "Two-color items only: the text (or pointer) color, different from color. Leave out for one color (the lowest price).",
                "enum": ["BLK", "WHT", "GRY", "RED", "BLU", "GRN"],
                "type": "string"
              },
              "color": {
                "description": "Main color. With accent: the body of a two-color item. Default: the item's color.",
                "enum": ["BLK", "WHT", "GRY", "RED", "BLU", "GRN"],
                "type": "string"
              },
              "material": {
                "description": "\"pla\" (default) or \"petg\". PETG is made to order in black or white: we order the filament after you buy, which adds 3 to 5 business days, and the print price is 20% higher. Other materials (TPU, ABS, ASA and more) on request: ask in the designer chat and we reply with a price.",
                "enum": ["pla", "petg"],
                "type": "string"
              },
              "qty": {
                "description": "How many to price. Default 1.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Item slug from list_catalog.",
                "type": "string"
              },
              "values": {
                "description": "Parameter values by key (from list_catalog). Text up to the listed length; numbers within min and max.",
                "type": "object"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5674d90312e53d14028047c3b8fd8d2493074e7d140c06ec7a146c5452df7c32"
        },
        {
          "name": "quote_file",
          "title": "Quote a 3D model",
          "description": "Slice a 3D model and return its exact price delivered by USPS Ground Advantage. Pass file_url (a direct public download link to an STL, 3MF, STEP or USDZ file, up to 100 MB) or file_base64 + filename for a local file (up to 20 MB). USDZ scans keep their physical size and print in one color. Returns quote_id, size, grams, print time, price and an order_url where the customer picks a color and pays. Takes 5-60 seconds for a new file.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "description": "Main color for the ship-by estimate. Default BLK.",
                "enum": ["BLK", "WHT", "GRY", "RED", "BLU", "GRN"],
                "type": "string"
              },
              "file_base64": {
                "description": "The model file, base64-encoded. Use for files on the user's machine.",
                "type": "string"
              },
              "file_url": {
                "description": "Direct download URL of the model (not a web page that shows it).",
                "type": "string"
              },
              "filename": {
                "description": "File name with extension, e.g. bracket.stl. Required with file_base64.",
                "type": "string"
              },
              "material": {
                "description": "\"pla\" (default) or \"petg\". PETG is made to order in black or white: we order the filament after you buy, which adds 3 to 5 business days, and the print price is 20% higher. Other materials (TPU, ABS, ASA and more) on request: ask in the designer chat and we reply with a price.",
                "enum": ["pla", "petg"],
                "type": "string"
              },
              "qty": {
                "description": "How many copies to price. Default 1.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c39db583a9b70268382b5379c07f2ce1f209a8f07a845b1ec5c43bef6f424dba"
        }
      ],
      "digest": "sha256:f2add3ba512a4c4ee1586faa7dff2d22094bf473364e0d339d6b71439ac5f5bc"
    }
  }
