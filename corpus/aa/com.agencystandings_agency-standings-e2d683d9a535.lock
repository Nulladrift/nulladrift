          },
          "digest": "sha256:5380361cbf9b0d2d697b6cb5521bb02b629ed45591f9b29a3821137521a30f57"
        },
        {
          "name": "get_methodology",
          "title": "Get methodology",
          "description": "Explain how Agency Standings publishes ranks. Real rankings, earned through evidence: client results, testimonials and published work. Agencies never pay for rankings, briefs or hires, and cannot sponsor or buy a newsletter spot. Rankings depend on evidence. Agencies can never sponsor or advertise on Agency Standings or the Big Moves newsletter. Sponsors are products, software tools, AI companies and other non-agency brands. Rank numbers are included. A numeric score is not.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "user_request": {
                "description": "A short paraphrase of what the user is looking for, in their words (no personal or sensitive info).",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
