                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:be04eea526d40f1f7a07a153fdb931cfc83f56a837be1ec7bf2b486db14f8ef5"
        },
        {
          "name": "join_as_agency",
          "title": "Join as an agency",
          "description": "Store a pending agency application. Collect the agency name, https website, contact email, industries, services, and a city or region. Do not collect a phone number or street address. We review the evidence before listing or ranking. No one can pay to be ranked. Rankings come only from evidence.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agencyName": {
                "description": "Agency name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "contactEmail": {
                "description": "Contact email for the application.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "industries": {
                "description": "Industry labels or slugs: Ecom, SaaS, Legal, Finance, Service.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "location": {
                "description": "City or region. Do not send a street address or phone number.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "services": {
                "description": "Service labels or slugs, such as SEO or Web Design.",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "user_request": {
                "description": "A short paraphrase of what the user is looking for, in their words (no personal or sensitive info).",
                "maxLength": 300,
                "type": "string"
              },
              "website": {
                "description": "Agency website. https is added when the scheme is missing.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["agencyName", "contactEmail", "industries", "location", "services", "website"],
            "type": "object"
          },
