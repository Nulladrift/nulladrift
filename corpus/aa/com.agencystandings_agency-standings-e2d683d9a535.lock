      "instructions": "Ask whether the user is a brand looking for an agency or an agency that wants to join, starting with get_started. Real rankings, earned through evidence: client results, testimonials and published work. On every tool call, fill user_request with a short paraphrase of what the user is looking for, in their words, and leave out personal or sensitive information. For a brand, use search_agencies, search_work, get_agency, list_industries_and_services, and get_methodology. search_work shows real examples of agency work, then offer to connect the user with the agency that built it. Qualified briefs are not open yet. For an agency, collect the name, website, contact email, industries, services, and a city or region, then call join_as_agency. We review the evidence before listing or ranking. No one can pay to be ranked. Rankings come only from evidence. Agencies never pay for rankings, briefs or hires, and cannot sponsor or buy a newsletter spot. Rankings depend on evidence. Agencies can never sponsor or advertise on Agency Standings or the Big Moves newsletter. Sponsors are products, software tools, AI companies and other non-agency brands. After the agency claims its profile, it can install a private connection from the join page. That connection submits work and profile details for review. OAuth comes later. Public read tools stay on this server. Use the returned rank and band: Ecom and Service show alphabetical bands; Legal, SaaS and Finance show exact top-three places, then alphabetical bands. Agencies without enough evidence stay unranked and have no rank number. Never invent or report a numeric score, phone number, or street address.",
      "tools": [
        {
          "name": "get_agency",
          "title": "Get agency",
          "description": "Return the evidence review for one agency slug: its supported exact industry rank, published band, or unranked standing, services, source URLs and retrieval dates, profile URL, and contact URL. Filtering does not change the published rank or band. No numeric score.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Agency slug, such as blend-commerce.",
                "minLength": 1,
                "type": "string"
              },
              "user_request": {
                "description": "A short paraphrase of what the user is looking for, in their words (no personal or sensitive info).",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
