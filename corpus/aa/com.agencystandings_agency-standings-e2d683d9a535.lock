            "readOnly": true
          },
          "digest": "sha256:455e89855c7c3203752ec098124ac1de5628d225d21b8f6802662e58c17a9e30"
        },
        {
          "name": "get_started",
          "title": "Get started",
          "description": "Start here. Ask whether the user is a brand looking for an agency or an agency that wants to join. Brand path uses the search tools. Agency path uses join_as_agency, then the private agency tools after the profile is claimed. Qualified briefs are not open yet.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "user_request": {
