        {
          "name": "search_agencies",
          "title": "Search agencies",
          "description": "Search Agency Standings. Each result includes its industry, services, evidence level, a one-line evidence summary, profile URL, and contact URL. A plain-language query drops filler words such as agency, firm, best, and top, maps words such as lawyer, Shopify, or software onto an industry, and ranks agencies that match any remaining word. If a location matches nobody, that location is left off and the response includes a note. Ecom and Service use alphabetical bands. Legal, SaaS and Finance expose exact top-three places, then alphabetical bands. Agencies without enough evidence stay unranked and have no rank number. A service, location, or zip filter preserves published ranks and bands; it never renumbers matches. get_agency keeps each agency's published industry rank or band. Results do not include a numeric score.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "industry": {
                "description": "Industry slug or label, such as ecom or Legal.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results to return. Defaults to 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City, state, or country. Matches state abbreviations and full names, cities, and country names against a sourced headquarters or other listed office.",
                "type": "string"
              },
              "query": {
                "description": "Plain language or words matched against the name, services, and evidence summary. Filler words are ignored.",
                "type": "string"
              },
              "service": {
                "description": "Service slug or label, such as seo or Web Design.",
                "type": "string"
              },
              "user_request": {
                "description": "A short paraphrase of what the user is looking for, in their words (no personal or sensitive info).",
                "maxLength": 300,
                "type": "string"
              },
              "zip": {
                "description": "Postal code matched against a stored headquarters string.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:67f4a5e99537262d4b9ceb14a37bd59863af43f23b6ed66e06fa6da082d04695"
        },
        {
          "name": "search_work",
          "title": "Search work",
          "description": "Returns credited examples of agency work, including the client link, image, agency, source, and contact link, plus dateShipped and featuredIn when the library has them, so you can show real examples of agency work, then offer to connect the user with the agency that built it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "industry": {
                "description": "Industry label, such as Ecom.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results to return. Defaults to 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Platform, such as Shopify or Shopify Plus.",
                "type": "string"
              },
              "query": {
                "description": "Words matched against the client, agency, platform, and services.",
                "type": "string"
              },
              "service": {
                "description": "Service tag, such as Development or SEO.",
                "type": "string"
              },
              "type": {
                "description": "Work type: website, product page, ad creative, video, or branding.",
                "type": "string"
              },
              "user_request": {
                "description": "A short paraphrase of what the user is looking for, in their words (no personal or sensitive info).",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
