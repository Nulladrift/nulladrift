        {
          "name": "make_offer",
          "title": "Send a booking offer to a member",
          "description": "Send a booking offer to another GigXchange member — the recipient gets a pending booking, a notification and an offer card in Messages, exactly as if the member had sent it in the app. Supported pairs: venue/promoter/organiser to artist, artist to venue/promoter, promoter to venue. Offers involving an agent are app-only. Max 5 offers a day, one per recipient a day, and no duplicate live offer for the same date. Requires the member's \"Allow my assistant to act\" switch.",
          "inputSchema": {
            "properties": {
              "end_time": {
                "description": "Optional end time, HH:MM.",
                "type": "string"
              },
              "event_date": {
                "description": "Event date, YYYY-MM-DD. Must be today or later.",
                "type": "string"
              },
              "event_title": {
                "description": "What the booking is for, e.g. \"Friday headline slot\" (max 120 chars).",
                "type": "string"
              },
              "fee": {
                "description": "The fee offered in GBP (1-100000).",
                "type": "number"
              },
              "notes": {
                "description": "Optional note to the recipient (max 500 chars).",
                "type": "string"
              },
              "recipient": {
                "description": "The member being offered the booking, by profile SLUG from a search result (e.g. \"jason-and-the-donovans\"). A profile id is also accepted.",
                "type": "string"
              },
              "start_time": {
                "description": "Optional start time, HH:MM.",
                "type": "string"
              }
            },
            "required": ["event_date", "event_title", "fee", "recipient"],
