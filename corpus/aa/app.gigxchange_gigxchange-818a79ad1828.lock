      "serverInfo": {
        "name": "gigxchange",
        "title": "GigXchange",
        "version": "0.1.0",
        "description": "UK live music and gig booking platform, for live music booking and discovery. Grassroots live music for musicians and bands, music venues and pubs, promoters, booking agents, event organisers (weddings, parties, corporate), fans and journalists: what's on, gigs open to apply for, open mic nights and music venues by town, city or name, acts open to a booking on a date, what UK gigs pay (GX Index data), musician profiles and press kits, and a member's own GigXchange bookings.",
        "websiteUrl": "https://gigxchange.app",
        "icons": [
          {
            "src": "https://mcp.gigxchange.app/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "GigXchange (UK live music): public search of gigs, open mics, venues, profiles and market rates, plus bookings, availability and allowed actions for a connected member. How GigXchange works is answered from search_help text, cited by url; a topic it does not return is not in the help centre (support@gigxchange.app), and rules on other marketplaces differ. Work to apply for is search_open_gigs only; an empty result there means no open gigs right now, and search_gigs concerts are shows to attend, not work. Availability is free-by-default: a result means a date is not blocked, not a confirmed yes. search_available_venues means requests to play, not room hire. GX Index questions start at get_index_summary; fees come from get_rates. A venue or open mic can be looked up by name with search_venues / search_open_mics `name`; a town goes in `city`, and search_gigs / search_venues / search_open_mics match a town filed under a bigger city to it. make_offer and counter_booking fees are amounts the member has agreed in the conversation; expected_fee / expected_current_fee is the current fee on the booking, from my_bookings. Cite results with their url and link back to gigxchange.app.",
      "tools": [
        {
          "name": "apply_to_gig",
          "title": "Apply to an open gig",
          "description": "Apply the member to an open gig from search_open_gigs (GigXchange member-posted gigs only). The offered fee comes from the gig's listed budget — there is no fee parameter. One live application per gig, 5 per day. Requires the member's \"Allow my assistant to act\" switch.",
          "inputSchema": {
            "properties": {
              "gig_id": {
                "description": "The gig id.",
                "type": "string"
              },
              "note": {
                "description": "Optional short application message (max 500 chars).",
                "type": "string"
              }
            },
            "required": ["gig_id"],
            "type": "object"
          },
          "annotations": {
