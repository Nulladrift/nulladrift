        {
          "name": "get_rates",
          "title": "Typical live-music fees (GX Index)",
          "description": "What UK acts typically get paid, from the GigXchange Index: median and range (25th-90th percentile) by city, gig type and act size, with sample size and an honest label when a figure is regional, UK-wide or modelled. Use for \"what should my band charge\", \"what does a wedding band cost in Leeds\", \"cheapest city for pub gigs\" (pass several cities to compare). Typical published artist take-home fees, not a quote. No genre dimension. Regions are not accepted - pass a city.",
          "inputSchema": {
            "properties": {
              "band_size": {
                "description": "Act size. trio_quartet = \"3-4 piece\", five_plus = \"5-piece or bigger\". \"any\" (default) = all sizes.",
                "enum": ["any", "solo", "duo", "trio_quartet", "five_plus"],
                "type": "string"
              },
              "cities": {
                "description": "UK cities to look up (1-13), e.g. [\"Leeds\"] or several to compare. Omit for the UK-wide figure. get_index_summary lists the cities with their own data; other towns fall back to the nearest Index city (labelled).",
                "items": {
                  "type": "string"
                },
                "maxItems": 13,
                "minItems": 0,
                "type": "array"
              },
              "use_case": {
                "description": "Gig type. \"any\" (default) = all gig types. pubs_and_bars = pub/bar gigs. theatre exists for solo acts only.",
                "enum": ["any", "wedding", "corporate", "private_party", "pubs_and_bars", "club", "festival", "theatre"],
                "type": "string"
              }
            },
            "type": "object"
