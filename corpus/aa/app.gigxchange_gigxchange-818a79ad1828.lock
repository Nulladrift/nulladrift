                "description": "The fee currently on the booking (GBP).",
                "type": "number"
              },
              "new_fee": {
                "description": "The proposed fee (GBP), within 50-200% of the current fee.",
                "type": "number"
              },
              "note": {
                "description": "Optional short message to accompany the counter.",
                "type": "string"
              }
