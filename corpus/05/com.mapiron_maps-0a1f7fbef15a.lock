      },
      "instructions": "MapIron: geocoding, reverse geocoding and static map images from OpenStreetMap data, plus a privacy area map that shows roughly where a place is without revealing the exact point, US property parcel lookups (parcel_lookup; Growth plans and up), US business and place search (place_search; Overture Maps data, which comes with its own attribution in the results), and US routing: directions, isochrones (areas reachable within a time or distance) and travel-time matrices (directions, isochrone, distance_matrix; free-flow travel times, no live traffic). US street addresses also come from public-record address points (USDOT National Address Database) where they exist. Each geocode call counts 1 address lookup (a route 1, an isochrone 2 per contour, a matrix 1 per origin-destination pair) and each map image 1 static image against the account's monthly cap; caps are hard and nothing is billed for overage. Results may be stored (30 days on the Free plan, indefinitely on paid plans). Always show the attribution \"© OpenStreetMap contributors\" with results and maps.",
      "tools": [
        {
          "name": "directions",
          "title": "Get a driving, truck, cycling or walking route in the US",
          "description": "Route between 2 to 25 points in the United States, in the order given, by car, truck, bike or foot (OpenStreetMap roads, Valhalla engine). Returns distance in metres, duration in seconds and the route line as an encoded polyline (precision 6); steps=true adds turn-by-turn instructions. Travel times are free-flow estimates with no live traffic: never present them as a live ETA. Geocode addresses first (geocode tool). Counts 1 address lookup against the monthly cap.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alternatives": {
                "default": 0,
                "description": "Extra alternative routes (2 points only)",
                "maximum": 2,
                "minimum": 0,
                "type": "integer"
              },
              "avoid": {
                "description": "Kinds of road to avoid where possible",
                "items": {
                  "enum": ["tolls", "highways", "ferries"],
                  "type": "string"
                },
                "type": "array"
              },
              "points": {
                "description": "Stops in travel order, each [lat, lon]",
                "items": {
                  "items": {
                    "type": "number"
                  },
                  "maxItems": 2,
                  "minItems": 2,
                  "type": "array"
                },
                "maxItems": 25,
                "minItems": 2,
                "type": "array"
              },
              "profile": {
                "default": "car",
                "description": "How to travel: car, truck (keeps to roads trucks may use), bike or foot",
                "enum": ["car", "truck", "bike", "foot"],
                "type": "string"
              },
              "steps": {
                "default": false,
                "description": "Include turn-by-turn instructions",
                "type": "boolean"
              }
            },
            "required": ["points"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a driving, truck, cycling or walking route in the US"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e047b3e189794c869b021d4e6add5b07610e1174a70b7e309823db87d49ea44"
        },
        {
          "name": "distance_matrix",
          "title": "Travel times and distances between many US points",
          "description": "Travel time (seconds) and road distance (metres) from each source to each target in the United States: up to 50 sources and 50 targets, 2,500 pairs at most. Omit targets for every source to every other. Use it to pick the nearest store or driver, or to feed a route optimiser. null means no route. Free-flow times, no live traffic. Counts 1 address lookup per pair.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "avoid": {
                "description": "Kinds of road to avoid where possible",
                "items": {
                  "enum": ["tolls", "highways", "ferries"],
                  "type": "string"
                },
                "type": "array"
              },
              "profile": {
                "default": "car",
                "description": "How to travel: car, truck (keeps to roads trucks may use), bike or foot",
                "enum": ["car", "truck", "bike", "foot"],
                "type": "string"
              },
              "sources": {
                "description": "Origins, each [lat, lon]",
                "items": {
                  "items": {
                    "type": "number"
                  },
                  "maxItems": 2,
                  "minItems": 2,
                  "type": "array"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "targets": {
                "description": "Destinations, each [lat, lon] (default: the sources)",
                "items": {
                  "items": {
                    "type": "number"
                  },
                  "maxItems": 2,
                  "minItems": 2,
                  "type": "array"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["sources"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Travel times and distances between many US points"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba929d7c4efce83438fc5c276458eeba2cc90dee3336e578e2eaebea94fbf062"
        },
        {
          "name": "district_lookup",
          "title": "Find Texas and Colorado special taxing districts (MUD, WCID, PID, metro district) at a point",
          "description": "List the Texas special taxing districts that contain a latitude/longitude: municipal utility districts (MUD), water control and improvement districts (WCID), fresh water supply, levee and management districts statewide (TCEQ), and public improvement districts (PID) where cities publish them (coverage in the answer). For each: name, type, status, counties, the district's self-reported tax rate per $100 of taxable value with its report year, outstanding debt (Texas Comptroller), website, and the statute for the purchaser's notice (Texas Water Code §49.452 or Property Code §5.014). Colorado: every special district the Department of Local Affairs maps (metropolitan, fire, water and sanitation, library, park and others) with its certified mill levy (total, general, bond) for the tax year, county, website and the disclosure statute (C.R.S. §38-35.7-101; §38-35.7-110 for metropolitan districts); Colorado tax figures are in tax.total_mills (mills, $1 per $1,000 of assessed value), not tax.total_rate. Geocode an address first (geocode tool) or use a point inside the parcel (parcel_lookup). result is districts_found, none_found or outside_coverage. none_found is NOT proof that no district applies; near_boundary and nearby mean the lot may straddle a boundary. Report null figures as unknown, never infer a tax rate, and never say whether a notice is required: cite the statute and the district's own notice form. Growth plans and up; counts 1 address lookup.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "geometry": {
                "default": "none",
                "description": "Include each district's boundary",
                "enum": ["none", "simplified", "full"],
                "type": "string"
              },
              "include_inactive": {
                "default": false,
                "description": "Also list inactive or dissolved districts",
                "type": "boolean"
              },
              "lat": {
                "description": "Latitude of the property (a point inside the parcel is best)",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude of the property",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Texas and Colorado special taxing districts (MUD, WCID, PID, metro district) at a point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb4c3e8e94e7498dfdc421613604c3f9dcf9db11eb8177e460624da2a1e97191"
        },
        {
          "name": "geocode",
          "title": "Geocode an address or place",
          "description": "Look up an address, place name or point of interest and get coordinates (lat, lon), a readable label and address parts, from OpenStreetMap data. Use it before static_map or privacy_area_map when you only have an address. Counts 1 address lookup against the account's monthly cap. Results may be stored: up to 30 days on the Free plan, indefinitely on paid plans. Show \"© OpenStreetMap contributors\" with results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bbox": {
                "description": "[min_lon, min_lat, max_lon, max_lat]",
                "items": {
                  "type": "number"
                },
                "maxItems": 4,
                "minItems": 4,
                "type": "array"
              },
              "lang": {
                "description": "Preferred language for names, e.g. en, de, fr",
                "maxLength": 8,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Maximum number of matches",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "additionalProperties": false,
                "description": "Prefer matches near this point",
                "properties": {
                  "lat": {
                    "description": "Latitude in decimal degrees (WGS84)",
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "lon": {
                    "description": "Longitude in decimal degrees (WGS84)",
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["lat", "lon"],
                "type": "object"
              },
              "query": {
                "description": "Address, place or point of interest, e.g. \"233 S Wacker Dr, Chicago\" or \"Oswego, Illinois\"",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Geocode an address or place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f223d2897122aa5bddea1a4d21eefceb0451d786b338495a9a3ea411c7b838ef"
        },
        {
          "name": "isochrone",
          "title": "Map the area reachable within a travel time or distance",
          "description": "Polygons of the area reachable from a US point within given travel times (minutes, up to 60) or distances (km, up to 100), by car, truck, bike or foot: service areas, delivery zones, commute sheds, catchments. Up to 4 contours; returned as GeoJSON. Free-flow travel times, no live traffic. Counts 2 address lookups per contour.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "avoid": {
                "description": "Kinds of road to avoid where possible",
                "items": {
                  "enum": ["tolls", "highways", "ferries"],
                  "type": "string"
                },
                "type": "array"
              },
              "km": {
                "description": "Travel-distance contours instead of times",
                "items": {
                  "exclusiveMinimum": 0,
                  "maximum": 100,
                  "type": "number"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "lat": {
                "description": "Latitude of the starting point",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude of the starting point",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "minutes": {
                "description": "Travel-time contours, e.g. [10, 20, 30]",
                "items": {
                  "exclusiveMinimum": 0,
                  "maximum": 60,
                  "type": "number"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "profile": {
                "default": "car",
                "description": "How to travel: car, truck (keeps to roads trucks may use), bike or foot",
                "enum": ["car", "truck", "bike", "foot"],
                "type": "string"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Map the area reachable within a travel time or distance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c73626fd8465511e381424608169cb845d209b55bf0747385a10438b20d4e596"
        },
        {
          "name": "map_setup",
          "title": "Get code to show an interactive map",
          "description": "Get ready-to-paste HTML/JavaScript for an interactive, zoomable MapIron map in a web page (MapLibre GL JS vector map, Leaflet or OpenLayers raster map), or the raster tile URL template for any other library. Replace YOUR_KEY with a key restricted to the website. Needs no key and uses no quota; the map itself counts map tiles when viewed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "library": {
                "description": "maplibre = vector map (sharpest); leaflet or openlayers = raster tiles; tile_url = just the XYZ URL template",
                "enum": ["maplibre", "leaflet", "openlayers", "tile_url"],
                "type": "string"
              },
              "style": {
                "default": "light",
                "description": "Map style: light (default), dark, white or grayscale",
                "enum": ["light", "dark", "white", "grayscale"],
                "type": "string"
              }
            },
            "required": ["library"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get code to show an interactive map"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74de6eec761ff444a3b0ff2c9132a6cd71202f3a94cc82caacc6381812789a15"
        },
        {
          "name": "parcel_lookup",
          "title": "Find the property parcel at a point",
          "description": "Get the property parcel (lot) at a latitude/longitude, or by parcel_id: its boundary, the county parcel number (APN), area in m² and acres, and the public source and date. US coverage from open government data only (see mapiron.com/docs/parcels for the counties covered); owner names and values are never included. Lines are approximate and not a survey. Growth plans and up; counts 1 address lookup. Results from open-licensed sources may be stored indefinitely on paid plans.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "geometry": {
                "default": "simplified",
                "description": "Boundary detail: simplified (about 1 m, smaller), full, or none",
                "enum": ["simplified", "full", "none"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude of a point inside the parcel (use with lon)",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude of a point inside the parcel (use with lat)",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "parcel_id": {
                "description": "A parcel_id from an earlier lookup, e.g. us-37183-0794123456 (instead of lat/lon)",
                "maxLength": 48,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the property parcel at a point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d6f4b04c3017ffa3999cc8055d05c13e4d1b33cebf0e75de0d2f1484f07ec43"
        },
        {
          "name": "place_search",
          "title": "Find US businesses and places by name, kind or location",
          "description": "Search US businesses and points of interest (restaurants, shops, banks, clinics, parks and more) from Overture Maps Places data: by name or kind of place (query), near a point (lat and lon, with radius_m), or both. Each result has name, category, address, phone and website where known, coordinates, a confidence score from 0 to 1, a stable GERS id (gers_id) that can be stored and looked up again, and its data sources with their licences. These results are not OpenStreetMap data: show the attribution returned with them. Listings can be out of date: never present a result as verified. Counts 1 address lookup against the account's monthly cap.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "An Overture basic category, e.g. restaurant, cafe, gas_station, bank_or_credit_union, park",
                "maxLength": 60,
                "type": "string"
              },
              "lat": {
                "description": "Latitude to search near (use with lon)",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of places to return",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Longitude to search near (use with lat)",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "query": {
                "description": "Name or kind of place, optionally with a town, state or ZIP code, e.g. coffee austin tx",
                "maxLength": 200,
                "type": "string"
              },
              "radius_m": {
                "default": 25000,
                "description": "Only places within this many metres of lat/lon",
                "maximum": 50000,
                "minimum": 50,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find US businesses and places by name, kind or location"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac96f7fd67f17336356c86d18b6b8bbc1f38fe3b8ec98f19f9d22db9d23a70bf"
        },
        {
          "name": "privacy_area_map",
          "title": "Map an approximate area without revealing the exact point",
          "description": "Show roughly where a place is without revealing the exact point. The point is snapped to a grid and drawn as a shaded circle that always contains the true point, with no pin; every address in the same grid cell gets the identical image, so the exact location cannot be recovered or averaged out across listings. Use it for real-estate, rental and marketplace listings, people's homes, or any location that should stay private. The image is returned inline, with a reusable URL that contains only the snapped point. Counts 1 static image against the account's monthly cap.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "description": "Circle colour as hex, e.g. 0f766e",
                "pattern": "^#?[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "format": {
                "default": "png",
                "description": "Image format. jpg and webp are smaller than png",
                "enum": ["png", "jpg", "webp"],
                "type": "string"
              },
              "height": {
                "default": 400,
                "description": "Image height in CSS pixels",
                "maximum": 1280,
                "minimum": 16,
                "type": "integer"
              },
              "lat": {
                "description": "Latitude of the exact place to hide. It is snapped to the grid before use and never returned",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude of the exact place to hide. It is snapped to the grid before use and never returned",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius_m": {
                "default": 1000,
                "description": "Minimum circle radius in metres; it is raised if needed so the circle always contains the true point",
                "maximum": 25000,
                "minimum": 100,
                "type": "number"
              },
              "scale": {
                "default": 1,
                "description": "Pixel density: 2 renders a sharper image for high-density screens at double the pixel size",
                "enum": [1, 2],
                "type": "integer"
              },
              "snap_deg": {
                "default": 0.01,
                "description": "Grid size in degrees (0.01 is about 1 km). 0 turns snapping off and is not recommended",
                "maximum": 0.1,
                "minimum": 0,
                "type": "number"
              },
              "style": {
                "default": "light",
                "description": "Map style: light (default), dark, white or grayscale",
                "enum": ["light", "dark", "white", "grayscale"],
                "type": "string"
              },
              "width": {
                "default": 600,
                "description": "Image width in CSS pixels",
                "maximum": 1280,
                "minimum": 16,
                "type": "integer"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Map an approximate area without revealing the exact point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1a554a0ad205a0717eeceb780bf919d3ef9bb135af86c1155d230f66a623e1e0"
        },
