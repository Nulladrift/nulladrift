        {
          "name": "static_map",
          "title": "Render a static map image",
          "description": "Render a map as an image (returned inline) with optional pins (markers) and a line (path, e.g. a route). Give center and zoom, or just markers and/or path and the view is fitted automatically. Also returns a reusable image URL for web pages (add your key). Counts 1 static image against the account's monthly cap. Do not use this to show a private address such as someone's home; use privacy_area_map instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "center": {
                "additionalProperties": false,
                "description": "Map centre; use with zoom",
                "properties": {
