{
  "lockfileVersion": 2,
  "subjects": {
    "com.pastcharts/charts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pastcharts.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pastcharts",
        "title": "PastCharts",
        "version": "1.0.1",
        "websiteUrl": "https://pastcharts.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free history of App Store and Google Play top charts and Google trending searches. It is a daily snapshot, so use the Apify Actors named in each result for live data.",
      "tools": [
        {
          "name": "get_app_rank_history",
          "title": "App rank history",
          "description": "Every saved chart an app has been on, with its daily ranks. Get the id from search_apps.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The app id from search_apps or get_chart: a number for the App Store, a package name such as com.whatsapp for Google Play.",
                "type": "string"
              },
              "store": {
                "description": "Which store: app-store (Apple) or google-play.",
                "enum": ["app-store", "google-play"],
                "type": "string"
              }
            },
            "required": ["id", "store"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:efe0ce08bccc1df0ef0a4bf7a278f9947dc9c11bc4f8cdee4f9ca25cc0058e50"
        },
        {
          "name": "get_chart",
          "title": "Top chart for a day",
          "description": "A saved App Store or Google Play top chart for a country and day, from 2026-11-06.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug as in pastcharts.com chart URLs. Default all, the overall chart.",
                "type": "string"
              },
              "chart": {
                "description": "Top free, top paid or top grossing.",
                "enum": ["free", "paid", "grossing"],
                "type": "string"
              },
              "country": {
                "description": "Two-letter country code in lower case, such as us or gb.",
                "type": "string"
              },
              "date": {
                "description": "Day in YYYY-MM-DD. Leave out for the latest saved day.",
                "type": "string"
              },
              "limit": {
                "description": "How many rows to return, 1 to 200. Default 25.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "store": {
                "description": "Which store: app-store (Apple) or google-play.",
                "enum": ["app-store", "google-play"],
                "type": "string"
              }
            },
            "required": ["chart", "country", "store"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ddfd5ba788fd2ee7558a9d639516a75cd6b2730333bdd6e0e2022155d05ab4fc"
        },
        {
          "name": "get_top_trends",
          "title": "Top trends for a month or year",
          "description": "Biggest Google trending searches in a country for a month or a year.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Two-letter country code, such as US or GB.",
                "type": "string"
              },
              "period": {
                "description": "A month as YYYY-MM, such as 2025-06, or a year as YYYY, such as 2025.",
                "pattern": "^\\d{4}(-\\d{2})?$",
                "type": "string"
              }
            },
            "required": ["country", "period"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8dab1c52e05747ca891d818715139857b731b58b88b74788df61771a568aaf1c"
        },
        {
          "name": "get_trending_searches",
          "title": "Trending searches for a day",
          "description": "Top Google trending searches in a country on a past day, from 2024-11-28. Some days are missing.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Two-letter country code, such as US or GB.",
                "type": "string"
              },
              "date": {
                "description": "Day in YYYY-MM-DD. Leave out for the latest saved day.",
                "type": "string"
              },
              "limit": {
                "description": "How many rows to return, 1 to 200. Default 25.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3138ebb0e01e23d96aa236ef70a7461538a419af53ad19a3c050779455f1fe98"
        },
        {
          "name": "get_world_trends",
          "title": "Worldwide trends",
          "description": "Searches that trended in the most countries on a day or in a year.",
          "inputSchema": {
            "properties": {
              "period": {
                "description": "A day as YYYY-MM-DD or a year as YYYY.",
                "pattern": "^\\d{4}(-\\d{2}-\\d{2})?$",
                "type": "string"
              }
            },
            "required": ["period"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0d80389623723b5f433cd819b07352f859ac0ecdfa438f3bb65679c8c2d1c041"
        },
        {
          "name": "list_scrapers",
          "title": "Live-data scrapers",
          "description": "All Wulfcare scrapers on Apify for live data: Google Trends, YouTube, app stores, jobs, hotels, flights and AI search. Takes no arguments.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:385631c88d139d30d3ed1a96b1ca3c1e9a629ff54d74189478e9c4a544ab1ee9"
        },
        {
          "name": "search_apps",
          "title": "Search apps",
          "description": "Find apps in the archive by name or developer. Returns store, id and best saved rank. Use the id with get_app_rank_history.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "App name or developer, or the start of one, such as tiktok or Meta Platforms.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f293f065c15d155c6aaf34dd982781fc00c03293985e15b28d162e346ff1be33"
        }
      ],
      "digest": "sha256:9ede0b7de5d4088fb614bd275716fcbb54fe01a42e859995173a1394a08f9daa"
    }
  }
}
