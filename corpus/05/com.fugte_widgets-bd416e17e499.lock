  "subjects": {
    "com.fugte/widgets": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fugte.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fugte",
        "title": "Fugte",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fugte hosts widgets for sites built with no-code builders (Canva, Wix, Squarespace, Shopify, Notion, Google Sites, Carrd, WordPress) and keeps them editable afterwards. When you have written a widget the user wants on their site, call save_widget with the complete code and give the user the link it returns.",
      "tools": [
        {
          "name": "save_widget",
          "title": "Save to Fugte",
          "description": "Save a widget (HTML, CSS and JavaScript) to Fugte and get a link for the user. Use it when the user wants the widget on a site built with a no-code builder such as Canva, Wix, Squarespace, Shopify, Notion, Google Sites, Carrd or WordPress, or wants to keep changing it later. The link opens the widget in the Fugte editor. The user signs in (free) and publishes it, which gives them the embed link for their site. Publishing is free. Send one complete, working, self-contained widget: no build step, and no import, export or require. Libraries, images and fonts can load from https links. The link works for 7 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "css": {
                "description": "CSS that is not already in a <style> tag in the HTML. Leave it out otherwise.",
                "type": "string"
              },
              "html": {
                "description": "The widget's HTML: a full page or a fragment. It may already hold its <style> and <script> tags.",
                "type": "string"
              },
              "js": {
                "description": "Plain browser JavaScript that is not already in a <script> tag in the HTML. No modules.",
                "type": "string"
              },
              "title": {
                "description": "A short name for the widget, such as \"Music player\" or \"RSVP form\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "expiresAt": {
                "description": "When the link stops working (ISO 8601).",
                "type": "string"
              },
              "url": {
                "description": "The link to give the user.",
                "type": "string"
              }
            },
            "required": ["expiresAt", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save to Fugte"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3719b05785eaf670f27703fa9c43c7433bf520df7b351742728a191fbb9d8b44"
        }
      ],
      "digest": "sha256:931e77eaa307553d60333957b024c677d4be2d76377f9b2afc03e7470b61fd75"
    }
  }
