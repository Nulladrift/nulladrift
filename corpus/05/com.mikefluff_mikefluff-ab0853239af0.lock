        {
          "name": "buy_course",
          "title": "Start buying a course",
          "description": "SIDE EFFECT: opens a checkout for one of Mike Fluff's paid courses and records the user as a lead. Returns a payment link (billing's hosted page; works without signing in) and the price in the currency for the locale. Nothing is charged until the user pays on that page; after payment the course access link is emailed to the given address. Courses: parasites (parasites-course), freeMini (vibe-coding-course), contentFactory (content-factory-course). Only call when the user has asked to buy and given the email the course should go to — or leave the email out to use the account of the person signed in with INITE ID (OAuth scope \"mikefluff:purchase\"; with that scope the course is also attached to their account). Give the user the payment link; do not try to pay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "course": {
                "description": "Course key or slug.",
                "enum": ["parasites", "freeMini", "contentFactory", "parasites-course", "vibe-coding-course", "content-factory-course"],
                "type": "string"
              },
              "email": {
                "description": "The user's email; the access link is sent there after payment. Omit to use the signed-in account's.",
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "locale": {
                "description": "Language and currency of the checkout.",
                "enum": ["en", "ru", "pt", "es"],
                "type": "string"
              },
              "name": {
                "description": "Optional: the user's name.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["course", "locale"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start buying a course"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://mikefluff/order-v1.html",
            "openai/toolInvocation/invoked": "Ready to pay",
            "openai/toolInvocation/invoking": "Opening the checkout",
            "ui": {
              "resourceUri": "ui://mikefluff/order-v1.html"
            }
          },
          "digest": "sha256:75a0d372429fe84f0f3e0bf23ea2035ba62de27bfd72c7b6ce4db25ba85e39ea"
        },
        {
          "name": "check_text",
          "title": "Check a text for AI-sounding phrases",
          "description": "Run the writer linter behind mikefluff.com/ai-text-checker on a text: it flags the stock phrases and rhythms readers recognise as machine-written (\"in today's fast-paced world\", \"it's important to note\", em-dash habits in Russian) and returns a density verdict (clean / borderline / neuroslop suspected), a pass/fail gate for hard bans, and each hit with line, column, category and the matched words. English and Russian only. Up to 20000 characters. It judges the text, not who wrote it. Read-only: the text is not stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the text: en or ru.",
                "enum": ["en", "ru"],
                "type": "string"
              },
              "text": {
                "description": "The text to check (plain text or Markdown).",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["lang", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a text for AI-sounding phrases"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90c973746112183e98a147c223034d3cde9d360e64e4f1188f7359a196075807"
        },
        {
          "name": "get_answer",
          "title": "Get one answer in full",
          "description": "Fetch one published answer by its id (from search_answers): the full direct answer, the explanatory sections, the FAQ, the chapters and experiments it cites and related answers, all with canonical URLs. Use after search_answers when the lead answer is not enough. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Answer id, e.g. \"ftx-collapse\".",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "locale": {
                "description": "Language of the result: en, ru, pt or es.",
                "enum": ["en", "ru", "pt", "es"],
                "type": "string"
              }
            },
            "required": ["id", "locale"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one answer in full"
          },
          "behavior": {
