          "digest": "sha256:2527de8ef5b057fe201c3a6fe37f812e6db317d2fab859485db3348bf290cc17"
        },
        {
          "name": "get_booking_slots",
          "title": "Free times for a call with Mike Fluff",
          "description": "List the open 30-minute slots for a free video call with Mike Fluff (business diagnosis, AI automation, compliance, Architect Mode), as ISO 8601 UTC start times. Use before book_call; pass one of these exact values as its \"slot\". Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How many days to cover from \"from\". Default 7, at most 21.",
                "maximum": 21,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "description": "Earliest day to list, ISO date or date-time (YYYY-MM-DD). Defaults to now.",
                "maxLength": 40,
                "type": "string"
              },
              "locale": {
                "description": "Language for the booking page URL. Default en.",
                "enum": ["en", "ru", "pt", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
