      "serverInfo": {
        "name": "mikefluff",
        "title": "Mike Fluff",
        "version": "1.1.0",
        "websiteUrl": "https://www.mikefluff.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for www.mikefluff.com, the site of Mike Fluff (business doctor: diagnosis, AI automation, privacy/compliance architecture) and of Mike Fluff Press (books on the real history of crypto and on software after AI). Start with search_answers for factual questions; cite the returned URLs. run_diagnostic and check_text are free instruments. book_call, buy_course, buy_book and buy_chapter act in the real world: only use them when the user explicitly asks, with details the user gave for that purpose. buy_book and buy_chapter act for the person signed in with INITE ID (OAuth; book_call and buy_course can too): it returns a payment link the person confirms themselves. Paying without a payment page: if the person has allowed this shop to charge their INITE wallet (USDC on Base, under their passkey, within a limit they set), buy_book pays at once. If they have not, buy_book returns one link where they pay this time and can allow it from then on; give them that link. An agent with its own INITE identity and wallet buys under its own account and pays buy_book's x402Url with the pay tool at https://billing.inite.ai/mcp/wallet; a wallet is topped up at https://billing.inite.ai/fund/<address>. Guide: https://billing.inite.ai/docs/wallet",
      "tools": [
        {
          "name": "book_call",
          "title": "Book a call with Mike Fluff",
          "description": "SIDE EFFECT: books a real 30-minute video call in Mike Fluff's calendar, emails a confirmation with a calendar invite to the given address, alerts Mike, and records the booking as a lead. Only call this when the user has explicitly asked to book and chosen the time. \"slot\" must be one of the exact values returned by get_booking_slots. Name and email: either the ones the user gave for this purpose, or leave them out and the call is booked in the name of the person signed in with INITE ID (OAuth scope \"mikefluff:booking\"; without a token such a call is answered with HTTP 401 and the client is sent to sign in). Topics: diagnostic (general business consultation), automation (AI automation), compliance (privacy/GDPR/LGPD around AI systems), architect-mode (the one-day intensive). The confirmation email has a link to move or cancel. Limited to 3 bookings per hour per caller and 2 upcoming calls per email.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The user's email; the confirmation goes there. Omit to use the signed-in account's email.",
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "locale": {
                "description": "Language of the confirmation email.",
                "enum": ["en", "ru", "pt", "es"],
                "type": "string"
              },
              "message": {
                "description": "Optional: what the user wants to discuss, in their words.",
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "description": "The user's name, as they gave it. Omit to use the signed-in account's name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "slot": {
                "description": "Exact ISO 8601 start time from get_booking_slots, e.g. 2026-10-20T13:00:00.000Z.",
                "maxLength": 40,
                "type": "string"
              },
              "timeZone": {
                "description": "Optional IANA time zone of the user (e.g. America/Sao_Paulo) for the email's times.",
                "maxLength": 60,
                "type": "string"
              },
              "topic": {
                "description": "What the call is about.",
                "enum": ["diagnostic", "automation", "compliance", "architect-mode"],
                "type": "string"
              }
            },
            "required": ["locale", "slot", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a call with Mike Fluff"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dfdb6b53b684ea6b195928482f2797b47a98e81bf21810209d33d5fae24a00af"
        },
        {
          "name": "buy_book",
          "title": "Buy a book",
          "description": "SIDE EFFECT, MAY SPEND MONEY: buys a Mike Fluff Press book for the person signed in with INITE ID. Books are bought into an INITE account (the reader unlocks paid chapters for the account that paid), so this needs the person: OAuth scope \"mikefluff:purchase\"; without a token it is answered with HTTP 401 and the client signs the person in. If the person has allowed this shop to charge their INITE wallet, the book is paid at once within the limit they set. If not, the result is one link for the person: there they pay this time and, if they like, allow such payments from now on. Failing both, a payment link (card, PIX). An agent signed in as itself (client_credentials, its own did:web) buys under its own account and pays the returned x402Url from its INITE wallet (pay tool at billing.inite.ai/mcp/wallet). If they already own the book it says so instead. Only call when the user has asked to buy this book.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "book": {
                "description": "Book slug from list_books.",
                "enum": ["nobody-writes-code", "nobody-owns-money"],
                "type": "string"
              },
              "email": {
                "description": "Optional: the user's email, for the receipt when the account has none.",
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "locale": {
                "description": "Language of the book page and currency of the price.",
                "enum": ["en", "ru", "pt", "es"],
                "type": "string"
              }
            },
            "required": ["book", "locale"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Buy a book"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://mikefluff/order-v1.html",
            "openai/toolInvocation/invoked": "Ready to pay",
            "openai/toolInvocation/invoking": "Opening the checkout",
            "ui": {
              "resourceUri": "ui://mikefluff/order-v1.html"
            }
          },
          "digest": "sha256:b8ae22f92235532aa3b736518a77c111ac8fa30f58bd5360c958eeb7f21d45b6"
        },
        {
          "name": "buy_chapter",
          "title": "Buy one chapter",
          "description": "SIDE EFFECT, MAY SPEND MONEY: buys one paid chapter of a Mike Fluff Press book, on its own, for whoever the token speaks for (OAuth scope \"mikefluff:purchase\"; without a token, HTTP 401 and the client signs the person in). The chapter is then theirs to read on the site and whole through get_chapter_preview. Paid the same ways as buy_book: from the person's INITE wallet where they allowed this shop, else one link for them (wallet or card/PIX); an agent signed in as itself pays the returned x402Url from its own INITE wallet (pay tool at billing.inite.ai/mcp/wallet). Owning the book already includes every chapter. Get chapter ids from list_books. Only call when the user has asked to buy this chapter.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "book": {
                "description": "Book slug from list_books.",
                "enum": ["nobody-writes-code", "nobody-owns-money"],
                "type": "string"
              },
              "chapter": {
                "description": "Chapter id from list_books, e.g. \"ch07\".",
                "maxLength": 40,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "email": {
                "description": "Optional: the user's email, for the receipt when the account has none.",
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "locale": {
                "description": "Language of the chapter and currency of the price.",
                "enum": ["en", "ru", "pt", "es"],
                "type": "string"
              }
            },
            "required": ["book", "chapter", "locale"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Buy one chapter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://mikefluff/order-v1.html",
            "openai/toolInvocation/invoked": "Ready to pay",
            "openai/toolInvocation/invoking": "Opening the checkout",
            "ui": {
              "resourceUri": "ui://mikefluff/order-v1.html"
