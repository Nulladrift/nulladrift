      "serverInfo": {
        "name": "lingostories",
        "title": "LingoStories",
        "version": "1.0.0",
        "websiteUrl": "https://www.lingostories.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LingoStories (https://www.lingostories.app) is a free site for learning English, German, Norwegian, Swedish, Danish, Dutch, Finnish, French, Italian, Spanish, Portuguese, Polish by reading short graded stories (CEFR A1 to B1) with native audio and click-to-translate on every word and sentence, plus grammar lessons. Use find_story for a story in a language, level and topic; grammar_lesson for a grammar topic. Answers are short; send the user to the link to read and listen.",
      "tools": [
        {
          "name": "find_story",
          "title": "Find a short graded story to learn a language",
          "description": "Find a free short story on LingoStories for learning English, German, Norwegian, Swedish, Danish, Dutch, Finnish, French, Italian, Spanish, Portuguese, Polish at CEFR level A1, A2 or B1, on a topic (travel, food, work, family, fairy tales, mystery and more). Returns stories with an English summary, the first sentences in the language with English translation, and a link to read with native audio and click-to-translate on every word, plus comprehension questions. No account needed.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language to learn, e.g. \"Spanish\", \"de\", \"Norwegian\"",
                "type": "string"
              },
              "level": {
                "description": "CEFR level",
                "enum": ["A1", "A2", "B1"],
                "type": "string"
              },
              "limit": {
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "Optional topic, e.g. \"travel\", \"restaurant\", \"fairy tale\"",
                "type": "string"
              }
            },
            "required": ["language"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a short graded story to learn a language"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f97bd9423e17e3963c529550b036cc03f37f1fcacdeeed294f8a81251eab1efc"
        },
        {
          "name": "grammar_lesson",
          "title": "Find a grammar lesson for a language",
          "description": "Find a free grammar lesson on LingoStories for English, German, Norwegian, Swedish, Danish, Dutch, Finnish, French, Italian, Spanish, Portuguese, Polish (A1 to B1): explanation with examples, tables and exercises, linked to sentences from real stories. Give the language and a topic (e.g. \"past tense\", \"articles\", \"word order\"), or no topic for the list of lessons.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Language, e.g. \"French\", \"pl\"",
                "type": "string"
              },
              "topic": {
                "description": "Grammar topic, e.g. \"past tense\", \"articles\"",
                "type": "string"
              }
            },
            "required": ["language"],
            "type": "object"
          },
