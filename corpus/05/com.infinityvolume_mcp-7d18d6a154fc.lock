      "serverInfo": {
        "name": "InfinityVolume",
        "title": "InfinityVolume",
        "version": "1.3.1",
        "description": "Where the money traded: dollar volume across 13 stock markets and US sectors, against each one's own normal. Updated after every session; US figures are final the next morning. Market data by Tiingo.com (https://www.tiingo.com).",
        "websiteUrl": "https://www.infinityvolume.com/mcp",
        "icons": [
          {
            "src": "https://www.infinityvolume.com/brand/infinityvolume-mcp.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://www.infinityvolume.com/brand/infinityvolume-mcp-512.png",
