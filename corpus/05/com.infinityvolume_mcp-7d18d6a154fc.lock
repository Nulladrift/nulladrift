        {
          "name": "infinity_cumulative_dollar_volume",
          "title": "Cumulative dollar volume",
          "description": "How much traded in total: one US sector's, or the whole US market's, dollar volume (trading volume in US dollars) summed over a range of sessions, by default the last 20, with the average per session and the latest session's figure. Totals only: no prices or price changes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "from": {
                "description": "First session date, YYYY-MM-DD (optional).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "market": {
                "description": "Market key. Default \"US\". Available: US.",
                "maxLength": 20,
                "type": "string"
              },
              "sector": {
                "description": "Sector name or key, e.g. \"AI & Compute Silicon\" or AI_SILICON. Leave out for the whole market. infinity_sector_volume lists the names.",
                "maxLength": 60,
                "type": "string"
              },
              "sessions": {
                "description": "Number of sessions ending at the latest (or at \"to\"). Default 20, at most 30.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Last session date, YYYY-MM-DD (optional).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
