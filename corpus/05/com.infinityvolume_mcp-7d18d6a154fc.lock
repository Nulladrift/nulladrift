        {
          "name": "infinity_find_research",
          "title": "Find research",
          "description": "Find up to 5 public articles of research published on InfinityVolume about a topic, a company or ticker, or a sector: each one's title, author, date, the companies and sectors it covers, a one-sentence summary and a link to read it. Never the article itself, and no prices.",
