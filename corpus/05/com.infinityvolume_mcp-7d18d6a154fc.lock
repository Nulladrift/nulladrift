            "mimeType": "image/png",
            "sizes": ["1024x1024"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "InfinityVolume (infinityvolume.com) measures where the money traded: dollar volume (trading volume in US dollars). Use infinity_market_totals for the 13 stock markets' totals, their share of global dollar volume and the latest session versus normal; infinity_sector_volume and infinity_cumulative_dollar_volume for US sectors and the whole US market; infinity_most_traded for the most traded US companies by rank; infinity_search_companies to find a US ticker; infinity_find_research for articles. For one company in any of the 13 markets: infinity_company_activity (is anything unusual: dollar volume versus normal, σ and percentile against its own year), infinity_company_vs_sector (its share of its sector's dollar volume against its usual share, the median of its last comparable sessions) and infinity_compare_activity (two companies); for a market: infinity_unusual_volume (up to 10 names far above their normal), infinity_market_breadth and infinity_sector_rotation (sectors gaining or losing share of the market's dollar volume). Figures come inside sentences, never as tables or daily lists. Read only. Every answer states its window and as-of date and links to the matching page. No prices or price changes. An answer from US data ends with Tiingo's attribution: Market data by Tiingo.com (https://www.tiingo.com). Market activity data, not investment advice. Source: infinityvolume.com",
      "tools": [
        {
          "name": "infinity_company_activity",
          "title": "Company trading activity",
          "description": "Answers \"is anything unusual\" for one company: how much traded (its trading volume in US dollars) in the latest session or the last 5 or 20, versus normal (× its prior 20 sessions), σ and percentile against its own year, sessions at 1.5× or more, turnover as low, normal or high, and its sector versus normal: unusual activity in sentences. Any of the 13 markets. No prices or price changes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "market": {
                "description": "Market key or name, e.g. US or Japan. Leave out to find the company in any of the 13 markets.",
                "maxLength": 30,
                "type": "string"
              },
              "ticker": {
                "description": "A ticker or company name, e.g. NVDA, Lumentum or 7203.T. A market may lead it, as Japan:7203.T.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "window": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "maxLength": 4,
                    "type": "string"
                  }
                ],
                "description": "Sessions: 1, 5 or 20. Default 1 (the latest session)."
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Company trading activity"
          },
          "behavior": {
            "destructive": false,
