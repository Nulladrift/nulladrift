            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "from": {
                "description": "Published on or after, YYYY-MM-DD (optional).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "query": {
                "description": "A topic, a company name or ticker (e.g. NVDA), or a sector name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "to": {
                "description": "Published on or before, YYYY-MM-DD (optional).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
