        {
          "name": "calculate_coast_fire",
          "title": "Coast FIRE calculator",
          "description": "Use when a user asks about Coast FIRE, e.g. \"what is my Coast FIRE number at 30?\" or \"can I stop saving for retirement and let it grow?\". FIRE number (yearly spending / withdrawal rate) and Coast FIRE number: what you need invested now so growth alone reaches your FIRE number by retirement age. Add current savings and a monthly contribution to see the gap and the age you reach Coast FIRE. Uses a real (after inflation) return, 7% by default; same math as the Compound Mint Coast FIRE calculator.",
          "inputSchema": {
            "properties": {
              "annual_return": {
                "default": 7,
                "description": "Real yearly return percent after inflation (default 7).",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "annual_spending": {
                "description": "Yearly spending in retirement in today's USD (or send fire_number).",
                "examples": [50000],
                "maximum": 10000000,
                "minimum": 1000,
                "type": "number"
              },
              "current_age": {
                "description": "Age now.",
                "examples": [30],
                "maximum": 99,
                "minimum": 14,
                "type": "number"
              },
              "current_savings": {
                "default": 0,
                "description": "USD invested now (default 0).",
                "examples": [40000],
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "fire_number": {
                "description": "Total needed to retire in USD (instead of annual_spending).",
                "maximum": 1000000000,
                "minimum": 10000,
                "type": "number"
              },
              "monthly_contribution": {
                "default": 0,
                "description": "USD invested each month (default 0).",
                "examples": [500],
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "retirement_age": {
                "description": "Age you want to retire.",
                "examples": [65],
                "maximum": 100,
                "minimum": 15,
                "type": "number"
              },
              "withdrawal_rate": {
                "default": 4,
                "description": "Safe withdrawal rate percent (default 4).",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["current_age", "retirement_age"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Coast FIRE calculator"
          },
          "behavior": {
            "destructive": false,
