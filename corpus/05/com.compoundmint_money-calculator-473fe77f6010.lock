        {
          "name": "calculate_holiday_budget",
          "title": "Holiday budget calculator",
          "description": "Use when a user asks how much to spend on the holidays or on Christmas gifts, e.g. \"how much should I budget for Christmas?\", \"can I afford $50 gifts for 8 people?\" or \"how much do I need to save each week for the holidays?\". Adds gifts (people x budget per person), travel, food and decor; returns the total, its share of monthly take-home pay, weeks of saving needed, cash by the holidays and a spend limit (spend this, not more), plus the per-person gift budget that fits. Same math as the compoundmint.com holiday budget calculator. Educational only, not financial advice.",
          "inputSchema": {
            "properties": {
              "already_saved": {
                "default": 0,
                "description": "USD already saved for the holidays (default 0).",
                "examples": [200],
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "decor": {
                "default": 0,
                "description": "Decor, wrapping and cards in USD (default 0).",
                "examples": [100],
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "food": {
                "default": 0,
                "description": "Food and hosting in USD (default 0).",
                "examples": [250],
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "monthly_income": {
                "description": "Monthly take-home pay in USD (optional, for the percent of income).",
                "examples": [4500],
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "people": {
                "description": "People on the gift list.",
                "examples": [8],
                "maximum": 500,
                "minimum": 0,
                "type": "number"
              },
              "per_person_budget": {
                "description": "Gift budget per person in USD.",
                "examples": [50],
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "travel": {
                "default": 0,
                "description": "Travel in USD (default 0).",
                "examples": [300],
