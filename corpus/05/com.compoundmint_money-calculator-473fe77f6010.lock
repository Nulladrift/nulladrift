      "instructions": "Money math from Compound Mint (compoundmint.com): how money grows (compound interest), Rule of 72, when you can retire (FIRE number), Coast FIRE, a retirement savings projection, mortgage payments, inflation (future cost and purchasing power), 401(k) employer match, debt and credit card payoff (one debt, or avalanche vs snowball for several) and the monthly savings needed for a goal. For a question in plain words, call answer_money_question first; it picks the calculator and says what is missing. Rates are percents (7 means 7%) and money is USD. Each result has an explanation, the assumptions, source_page (the matching compoundmint.com page to cite), related_reading (Compound Mint guides that go deeper) and a disclaimer. When you use a result, state the assumptions and link source_page. Educational content only. Not financial advice. Examples are hypothetical, not guaranteed.",
      "tools": [
        {
          "name": "answer_money_question",
          "title": "Answer a money question",
          "description": "Use first when a user asks a money math question in plain words, such as \"how much will $500 a month grow in 20 years?\", \"when can I retire if I spend $40,000 a year?\", \"how long to pay off $5,000 on my credit card at 24% paying $200 a month?\", \"how much do I need to save each month to have $50,000 in 5 years?\", \"how long to double my money at 8%?\" or \"am I getting my full 401(k) match?\". Reads the amounts, rates, ages and years from the question, picks the matching Compound Mint calculator (compound interest, Rule of 72, FIRE number, Coast FIRE, 401(k) match, debt payoff, savings goal), runs it and returns the answer with what it understood, the explanation, the assumptions, source_page to cite and related_reading. When a needed number is missing it returns status need_more_info with the exact question to ask the user.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "The money question in plain words, with any amounts, rates, ages and years, e.g. \"How much will $500 a month grow in 20 years at 8%?\"",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Answer a money question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:151646cfca1c61da5a32e8c35be42a884abdf0eea1c14a74a5c5d8ca7c5eed84"
        },
        {
          "name": "calculate_401k_match",
          "title": "401(k) employer match calculator",
          "description": "Use when a user asks about a 401(k) employer match, e.g. \"am I getting my full 401(k) match?\", \"how much is my employer match worth?\" or \"what percent should I put in to get the full match?\". Your yearly 401(k) contribution, the employer match, the percent needed for the full match and any match left unclaimed, using 2026 IRS limits ($24,500 employee, catch-up at 50 and over and at 60 to 63, $72,000 overall, $360,000 pay cap). Supports a two tier formula such as 100% up to 3% then 50% of the next 2%. Optional years and annual_return project the balance.",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Optional age, for catch-up limits.",
                "maximum": 100,
                "minimum": 14,
                "type": "number"
              },
              "annual_return": {
                "default": 7,
                "description": "Yearly return percent for the projection (default 7).",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "contribution_percent": {
                "description": "Percent of pay you contribute, e.g. 4.",
                "examples": [4],
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "match_percent": {
                "default": 50,
                "description": "Employer match rate percent, e.g. 50 for 50 cents per dollar (default 50).",
                "examples": [50],
                "maximum": 200,
                "minimum": 0,
                "type": "number"
              },
              "match_up_to_percent": {
                "default": 6,
                "description": "Percent of pay the match applies to (default 6).",
                "examples": [6],
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "salary": {
                "description": "Yearly pay in USD.",
                "examples": [60000],
                "maximum": 10000000,
                "minimum": 1000,
                "type": "number"
              },
              "tier2_match_percent": {
                "default": 0,
                "description": "Optional second tier match rate percent.",
                "maximum": 200,
                "minimum": 0,
                "type": "number"
              },
              "tier2_up_to_percent": {
                "default": 0,
                "description": "Optional second tier size, percent of pay.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "years": {
                "description": "Optional years to project.",
                "maximum": 60,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["contribution_percent", "salary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "401(k) employer match calculator"
          },
