        {
          "name": "calculate_gift_budget",
          "title": "Christmas gift budget calculator",
          "description": "Use when a user asks how to split a Christmas or holiday gift budget between people, how much to spend on each person, or what it costs to put gifts on a credit card, e.g. \"split $800 for gifts between 5 people\", \"I have $600: Mom 30%, Dad 30%, my sister 40%\", \"is $150 for mom and $100 for dad within my $300 budget?\" or \"how much interest if I put $800 of gifts on a 22% card for 6 months?\". Budget comes from total_budget, or monthly_income x percent_of_income, or already_saved + monthly_savings x months_until_shopping. Splits it evenly, by percent or by a set amount per person; returns each person's amount, the total, what is left or over budget and, with card_apr, the monthly payment and interest. Same math as the compoundmint.com Christmas gift budget calculator. For a whole holiday plan with travel, food and decor use calculate_holiday_budget. Educational only, not financial advice.",
          "inputSchema": {
            "properties": {
              "already_saved": {
                "default": 0,
                "description": "USD already saved for gifts (savings route, default 0).",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "amount_on_card": {
                "description": "Optional: USD put on the card (default: all planned gifts).",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "card_apr": {
                "description": "Optional: credit card APR in percent, e.g. 22, to see the interest if the gifts go on a card.",
                "examples": [22],
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "monthly_income": {
                "description": "Monthly take-home pay in USD, used with percent_of_income when there is no total_budget.",
                "maximum": 100000000,
                "minimum": 1,
                "type": "number"
              },
              "monthly_savings": {
                "description": "USD you can save each month before you shop (savings route).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "months_until_shopping": {
                "description": "Months you can save before you shop (needed with monthly_savings).",
                "maximum": 24,
                "minimum": 0,
                "type": "number"
              },
              "number_of_people": {
                "description": "Instead of people: how many people, for an even split.",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "payoff_months": {
                "description": "Optional: months to pay the card off, e.g. 6. Without it you get 3, 6 and 12 months.",
                "examples": [6],
                "maximum": 120,
                "minimum": 1,
                "type": "number"
              },
              "people": {
                "description": "People on the gift list, up to 100. Each item: a name, plus percent (for a percent split) or amount in USD (for an amount split). Names alone give an even split. Text also works: \"Mom:30%, Dad:30%, Sister:40%\" (percents) or \"Mom:150, Dad:100\" (USD).",
                "examples": [
                  [
                    {
                      "name": "Mom",
                      "percent": 30
                    },
                    {
                      "name": "Dad",
                      "percent": 30
                    },
                    {
                      "name": "Sister",
                      "percent": 40
                    }
                  ]
                ],
                "items": {
                  "properties": {
                    "amount": {
                      "description": "Gift budget for this person in USD, e.g. 150.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "name": {
                      "description": "Who the gift is for, e.g. Mom.",
                      "type": "string"
                    },
                    "percent": {
                      "description": "Share of the budget in percent, e.g. 30.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "per_person_budget": {
                "description": "Instead of total_budget: USD to spend on each person, e.g. 50. The budget is this times the number of people.",
                "minimum": 0,
                "type": "number"
              },
              "percent_of_income": {
                "description": "Percent of one month of take-home pay for gifts, e.g. 10 for 10%.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "split": {
                "description": "How to split the budget. Default: percent if people carry percents, amount if they carry amounts, else equal.",
                "enum": ["equal", "percent", "amount"],
                "type": "string"
              },
              "total_budget": {
                "description": "Total gift budget in USD, e.g. 800. Or send per_person_budget with people or number_of_people, or monthly_income + percent_of_income, or monthly_savings + months_until_shopping.",
                "examples": [800],
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["people"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Christmas gift budget calculator"
          },
          "behavior": {
