        {
          "name": "calculate_compound_interest",
          "title": "Compound interest calculator",
          "description": "Use when a user asks how much money will grow, e.g. \"how much will $500 a month grow in 20 years?\", \"what will $10,000 be worth in 10 years at 7%?\" or \"how much interest will I earn?\". Future value of a starting amount plus optional monthly contributions at a yearly rate, with total contributed and total interest. Compounding is monthly by default (annually, quarterly, semiannually or daily on request). Returns a plain-English explanation, the assumptions and the matching Compound Mint calculator page. Example: $10,000 at 7% for 10 years compounded annually = $19,671.51.",
          "inputSchema": {
            "properties": {
              "annual_rate": {
                "default": 8,
                "description": "Yearly rate in percent, e.g. 7 (default 8).",
                "examples": [7],
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "compounding": {
                "default": "monthly",
                "description": "How often interest compounds (default monthly).",
                "enum": ["monthly", "annually", "quarterly", "semiannually", "daily"],
                "type": "string"
              },
              "contribution_timing": {
                "default": "end",
                "description": "Deposits at the end (default) or beginning of each month.",
                "enum": ["end", "beginning"],
                "type": "string"
              },
              "monthly_contribution": {
                "default": 0,
                "description": "USD added every month (default 0).",
                "examples": [500],
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "principal": {
                "default": 0,
                "description": "Starting amount in USD (default 0).",
                "examples": [10000],
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "show_yearly": {
                "default": false,
                "description": "Include a year by year table.",
                "type": "boolean"
              },
              "years": {
                "description": "Years, up to 100.",
                "examples": [20],
                "maximum": 100,
                "minimum": 0.0833,
                "type": "number"
              }
            },
            "required": ["years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compound interest calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7937427895904a2dee74ae52c8e81456ed748e02ae8c19223351df473a31c73"
        },
        {
          "name": "calculate_debt_payoff",
          "title": "Debt payoff calculator",
          "description": "Use when a user asks how long it takes to pay off a credit card or loan, what payment clears it by a date, or avalanche vs snowball, e.g. \"how long to pay off $5,000 at 24% paying $200 a month?\" or \"what payment pays off my credit card in 2 years?\". One debt: months to pay off and total interest at a monthly payment, or the payment needed to be debt free in target_months. Several debts: send debts (each with name, balance, apr, min_payment) and extra_payment to compare the avalanche and snowball methods.",
          "inputSchema": {
            "properties": {
              "apr": {
                "description": "Yearly interest rate percent (one debt).",
                "examples": [18],
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "balance": {
                "description": "What you owe in USD (one debt).",
                "examples": [10000],
                "maximum": 100000000,
                "minimum": 1,
                "type": "number"
              },
              "debts": {
                "description": "Several debts, up to 20.",
                "examples": [
                  [
                    {
                      "apr": 24,
                      "balance": 5000,
                      "min_payment": 150,
                      "name": "Visa"
                    },
                    {
                      "apr": 7,
                      "balance": 12000,
                      "min_payment": 300,
                      "name": "Car loan"
                    }
                  ]
                ],
                "items": {
                  "properties": {
                    "apr": {
                      "description": "APR in percent, e.g. 24.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "balance": {
                      "description": "What you owe in USD, e.g. 5000.",
                      "minimum": 1,
                      "type": "number"
                    },
                    "min_payment": {
                      "description": "Minimum monthly payment in USD, e.g. 150.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "name": {
                      "description": "Label, e.g. Visa.",
                      "type": "string"
                    }
                  },
                  "required": ["apr", "balance", "min_payment"],
                  "type": "object"
                },
                "type": "array"
              },
              "extra_payment": {
                "default": 0,
                "description": "USD a month on top of all minimums (several debts).",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "monthly_payment": {
                "description": "USD paid each month (or send target_months).",
                "maximum": 100000000,
                "minimum": 0.01,
                "type": "number"
              },
              "strategy": {
                "default": "compare",
                "description": "Several debts: which method (default compare).",
                "enum": ["avalanche", "snowball", "compare"],
                "type": "string"
              },
              "target_months": {
                "description": "Months to be debt free (or send monthly_payment).",
                "examples": [36],
                "maximum": 600,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Debt payoff calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64e5b0dc098d02b869820647bf55f2d1f1749ffe80ae1900d534f7177ca825e5"
        },
        {
          "name": "calculate_fire_number",
          "title": "FIRE number and when you can retire",
          "description": "Use when a user asks when they can retire or how much they need to retire, e.g. \"when can I retire if I invest $1,500 a month?\", \"what is my FIRE number if I spend $40,000 a year?\" or \"how many years until I can stop working?\". Returns the FIRE number (yearly spending / withdrawal rate, 25 times spending at 4%) and, from current savings and a monthly contribution, the months and years to reach it and the age if current_age is given. Uses a real (after inflation) return, 7% by default; same math as the Compound Mint FIRE number calculator.",
          "inputSchema": {
            "properties": {
              "annual_return": {
                "default": 7,
