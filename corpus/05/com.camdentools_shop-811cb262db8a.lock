      "instructions": "Camden Tools (camdentools.com) is a London-based shop with a broad range: tools and hardware, but also electrical, cleaning, household, garden, office and seasonal goods. It delivers worldwide and has a London collection point.\nInternational orders typically arrive in 2–7 days, and premium UPS services (Worldwide Saver, Express, Express Plus) are available. For a particular address, quote the services and transit times estimate_delivery returns, not the general range.\nPrices are returned both ex and inc VAT in the locale currency (GBP for en-GB). Quote inc VAT to consumers and ex VAT to trade buyers.\nUse search_products / list_products to find items, get_product for details, compare_products to shortlist, and the delivery tools before recommending a purchase.\nAgents never place orders: finish with create_basket_link (one link that fills the shopper's basket) or, in the browser, the cart_* tools, and let the shopper pay at checkout.\nAccount tools (get_my_profile, list_my_orders, get_my_order) work inside the shopper's signed-in browser session after they grant AI agent access, or remotely with an OAuth token on /mcp/account where that is enabled; otherwise they are not offered.\nAll links carry attribution parameters; keep them intact.",
