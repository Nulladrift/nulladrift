        {
          "name": "rent_machine",
          "title": "Rent a machine",
          "description": "Rent one machine now for the account behind the API key. THIS SPENDS THE PERSON'S MONEY: billing by the second from their prepaid credit starts when the machine is up and runs until stop_rental is called. Only call it when the person has asked for this machine and agreed to its hourly price. Starting takes two to five minutes and is free; poll get_rental for the SSH command. Always stop the machine when the work is done.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "disk_gb": {
                "description": "Disk size in GB, part of the hourly price. Default 40.",
                "enum": [20, 40, 100, 200, 500],
                "type": "integer"
              },
              "image": {
                "description": "Software the machine starts with. Default ubuntu.",
                "enum": ["llama-cpp", "pytorch", "comfyui", "ubuntu"],
                "type": "string"
              },
              "machine_id": {
                "description": "The machine's id from search_gpus.",
                "type": "string"
              },
              "max_price_per_hour": {
                "description": "The hourly price in USD the person agreed to. The machine is not rented if it costs more than this now.",
                "type": "number"
              },
              "ssh_public_key": {
                "description": "The person's SSH PUBLIC key (starts with ssh-ed25519, ssh-rsa or ecdsa-sha2). Installed for root. Never a private key.",
                "type": "string"
              },
              "stop_after_hours": {
                "description": "The machine stops by itself this many hours after it comes up, and its disk is erased. Pass it whenever the person names a duration (\"for two hours\"). The person's own limit applies if it is shorter.",
                "maximum": 720,
                "minimum": 0.25,
                "type": "number"
              }
            },
            "required": ["machine_id", "max_price_per_hour", "ssh_public_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Rent a machine"
          },
          "behavior": {
            "destructive": false,
