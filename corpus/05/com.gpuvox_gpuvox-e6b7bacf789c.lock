      },
      "instructions": "gpuvox rents whole GPU machines by the hour (RTX 4090, RTX 5090, RTX A6000, RTX 6000 Ada, RTX PRO 6000, Strix Halo) with root over SSH, billed by the second from prepaid credit.\n\nQuote prices from search_gpus or get_gpu_prices, never from memory: they change with supply. To choose a GPU for a model, call get_gpu_guide.\n\nRenting costs the person money. Before rent_machine, tell them the machine and its hourly price and get a clear yes; pass that price as max_price_per_hour. When they name a duration, pass it as stop_after_hours so the machine stops by itself. The person may have set limits for assistants (get_account shows them); you cannot change them, so when one stops you, say which. Never ask for or send a private SSH key. When the work is done, call stop_rental: a forgotten machine keeps billing.\n\nWithout the person's account only the read tools work. They sign in by connecting https://gpuvox.com/mcp/account, or add an API key from https://console.gpuvox.com/api-keys.",
      "tools": [
        {
          "name": "get_account",
          "title": "Account and credit",
          "description": "The person's account: email, prepaid credit left in USD, how many machines are running and what they cost per hour together, and the limits the person set for assistants (highest hourly price, machines at once, spend per day and what is left of it, automatic stop). Call it before renting to check there is credit for at least one hour and that the machine fits the limits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Account and credit"
          },
