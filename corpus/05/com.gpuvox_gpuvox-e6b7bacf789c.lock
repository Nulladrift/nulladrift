            "readOnly": false
          },
          "digest": "sha256:11f3c7153452f122666dd1928143f01e157e9e758ab6e62851967ab1c73902f4"
        },
        {
          "name": "search_gpus",
          "title": "Search GPU machines",
          "description": "List GPU machines that are free to rent right now on gpuvox, cheapest first, with live prices in USD per hour for the whole machine. Use it to answer what a GPU costs to rent, or to pick a machine before renting. Prices include 40 GB of disk; billing is by the second and starting is free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter country code, for example US, DE, PL.",
                "type": "string"
              },
              "gpu": {
                "description": "Part of the GPU name, case-insensitive: 4090, 5090, a6000, ada, pro 6000, halo.",
                "type": "string"
              },
              "gpu_count": {
                "description": "Exact number of GPUs in the machine.",
                "enum": [1, 2, 4],
                "type": "integer"
              },
              "limit": {
                "description": "How many machines to return. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_per_hour": {
                "description": "Highest price in USD per hour.",
                "type": "number"
              },
              "min_gpu_memory_gb": {
                "description": "Least GPU memory of the whole machine, in GB. A model needs its file size plus a few GB.",
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search GPU machines"
