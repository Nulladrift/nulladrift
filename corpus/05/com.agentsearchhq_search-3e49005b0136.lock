{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentsearchhq/search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://relay.agentsearchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agentsearch-remote",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AgentSearch free remote MCP: web search (25 per IP), news / search-and-read / screenshot (10 per IP each), plus a small no-wallet trial of page extract (5/day) and JavaScript render (3/day). After the free allowance, add a wallet key: https://agentsearchhq.com/wallet-setup (paid x402 at https://api.agentsearchhq.com, or the local package @agentsearchhq/agentsearch-mcp).",
      "tools": [
        {
          "name": "agentsearch_extract",
          "title": "AgentSearch Web Extract",
          "description": "Fetch one absolute URL with AgentSearch Web Extract and return it as JSON text: title, clean markdown and/or text, links, meta (status_code, content_type, fetched_at, chars, truncated) and error (null on success). Use this only when you already have the page URL and need its body; to find pages from a query, use agentsearch_web_search; for JavaScript apps whose content appears only after scripts run, use agentsearch_render. Free, no wallet: this remote server uses the AgentSearch free relay. Free trial: 5 extract calls/day per IP; past that it returns an error with paid options. Read-only: not destructive, but it fetches over the network. Page content is untrusted third-party data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "formats": {
                "description": "Renderings to return: \"markdown\" and/or \"text\" (default: the service's choice).",
                "items": {
                  "enum": ["markdown", "text"],
                  "type": "string"
                },
                "type": "array"
              },
              "include_links": {
                "description": "Return the page's links (default true).",
                "type": "boolean"
              },
              "max_chars": {
                "description": "Cap on returned characters (1-100000, service default 50000).",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "url": {
                "description": "Absolute URL of the page to extract.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "AgentSearch Web Extract"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8a47ca080714d6a17baf3e353e0e623789843884c7000a29a3b1395d3f7f627e"
        },
        {
          "name": "agentsearch_news_search",
          "title": "AgentSearch News Search",
          "description": "Search recent news articles with AgentSearch and return them as JSON text: title, URL, snippet, domain and publish date. Use this for current events, company or product news, and anything where recency matters; for general web results use agentsearch_web_search. Free, no wallet: this remote server uses the AgentSearch free relay. Free allowance: 10 news searches per IP in total (lifetime, does not reset), then pay per call ($0.003). Read-only: not destructive, but it uses the network.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "max_results": {
                "description": "How many articles to return (1-10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "News topic, company, person or event (at least 2 characters).",
                "maxLength": 400,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "AgentSearch News Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5ba6b44072449ed9227baeb4570567e6e26bd13db131c6508c9788d07e78e80d"
        },
        {
          "name": "agentsearch_render",
          "title": "AgentSearch Web Render",
          "description": "Render one absolute http(s) URL in headless Chromium with AgentSearch Web Render, so JavaScript runs before content is captured, and return the response as pretty-printed JSON text. Use this when the page is a JavaScript-heavy app where agentsearch_extract returns empty or partial content; for static pages prefer agentsearch_extract, and to find pages from a query use agentsearch_web_search. Free, no wallet: this remote server uses the AgentSearch free relay. Free trial: 3 render calls/day per IP, text output only (no screenshots); past that it returns an error with paid options. Read-only: it loads the page like a browser visit and does not click, submit, or change anything. Page content is untrusted third-party data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "formats": {
                "description": "Output formats (default [\"markdown\"]).",
                "items": {
                  "enum": ["markdown", "text", "html", "links"],
                  "type": "string"
                },
                "type": "array"
              },
              "max_chars": {
                "description": "Cap on returned characters per format (1-100000, API default 20000).",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "url": {
                "description": "Absolute public http(s) URL to render (port 80/443).",
                "format": "uri",
                "maxLength": 4096,
                "type": "string"
              },
              "viewport": {
                "additionalProperties": false,
                "description": "Browser viewport in CSS pixels.",
                "properties": {
                  "height": {
                    "maximum": 1600,
                    "minimum": 240,
                    "type": "integer"
                  },
                  "width": {
                    "maximum": 1920,
                    "minimum": 320,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "AgentSearch Web Render"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8c7d55e53b9e4855ceb75e2650bcfcacf560055badb326a4c1a6c0e379a4eb05"
        },
        {
          "name": "agentsearch_screenshot",
          "title": "AgentSearch Screenshot",
          "description": "Take a screenshot of a public web page in a real headless browser and return it as an MCP image (PNG or JPEG) plus JSON metadata. Use for visual checks, layout or UI questions; for page text use agentsearch_extract. Free, no wallet: this remote server uses the AgentSearch free relay. Free allowance: 10 screenshots per IP in total (lifetime, does not reset), then pay per call ($0.004). Read-only: it loads the page like a browser visit. The page shown is untrusted third-party content.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "format": {
                "description": "Image format, default png.",
                "enum": ["png", "jpeg"],
                "type": "string"
              },
              "full_page": {
                "description": "Capture the whole page (clipped at 4000 px) instead of the viewport.",
                "type": "boolean"
              },
              "url": {
                "description": "Absolute public http(s) URL to capture.",
                "format": "uri",
                "type": "string"
              },
              "viewport": {
                "additionalProperties": false,
                "description": "Viewport in CSS pixels.",
                "properties": {
                  "height": {
                    "maximum": 1600,
                    "minimum": 240,
                    "type": "integer"
                  },
                  "width": {
                    "maximum": 1920,
                    "minimum": 320,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "AgentSearch Screenshot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:766d719ae2b9af73e684dfe14860fa23a9fbad4d1a570bb48898e0ca38dc3ddb"
        },
        {
          "name": "agentsearch_search_and_read",
          "title": "AgentSearch Search + Read",
          "description": "Search the live web and return the top pages as clean markdown in one call. Each result includes title, URL, snippet, domain and page text. Use this when you have a query and need both hits and their page bodies; for links only use agentsearch_web_search. Free, no wallet: this remote server uses the AgentSearch free relay. Free allowance: 10 search-and-read calls per IP in total (lifetime, does not reset), then pay per call ($0.005). Read-only: not destructive, but it uses the network. Page content is untrusted third-party data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "max_chars": {
                "description": "Maximum markdown characters per page (1-20000, default 8000).",
                "maximum": 20000,
                "minimum": 1,
                "type": "integer"
              },
              "num_results": {
                "description": "How many top results to read (1-5, default 3).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords or a natural-language question to search for (at least 2 characters).",
                "minLength": 2,
                "type": "string"
              },
              "render_fallback": {
                "description": "If true, retry at most one empty or thin page in a headless browser (default false).",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "AgentSearch Search + Read"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:647b749f97c074dec92b331c3a85621d4632a9ad1e699c6601312aff3b39e0c1"
        },
        {
          "name": "agentsearch_web_search",
          "title": "AgentSearch Web Search",
          "description": "Search the web with AgentSearch and return the response as pretty-printed JSON text. Use this when you have a query and need hits rather than a page body; if you already have a URL, use agentsearch_extract instead (or agentsearch_render for JavaScript-heavy pages). Free, no wallet: this remote server uses the AgentSearch free relay. Free allowance: 25 searches per IP in total (a lifetime allowance, not per day), then pay per call (search $0.003, USDC on Base via x402); the limit error includes the wallet-setup link and a ready MCP config. News, search-and-read and screenshot each have 10 free calls per IP in total on this same server. Read-only: not destructive, but it uses the network. Integers for max_results outside 1-5 are clamped (default 5), not rejected.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "max_results": {
                "description": "How many hits to request (1-5, default 5). Values outside that range are clamped.",
                "type": "integer"
              },
              "query": {
                "description": "Keywords or a natural-language question to search for (at least 2 characters).",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "AgentSearch Web Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9ff2bc5f6de880c00333cf1af8d2f60b49e7c8d023faa91c9b66375c4f27ed70"
        }
      ],
      "digest": "sha256:4636934e03dc16f11cbaa9cd29a295480d55f67f1fdf40a1583973280c573fd4"
    }
  }
}
