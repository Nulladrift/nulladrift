        {
          "name": "quantagentshop_qr",
          "title": "QR",
          "description": "QR code. Send text or a URL (up to 1,000 characters); returns a QR code as PNG or SVG, base64 in JSON, with its size, version and error-correction level, at the scale and quiet zone you choose. Use to put a link or payment request on a page, label or PDF. Plain codes only, no logos or colours. Typical response under 200 ms. Failed calls are not charged. Costs $0.0099 (USDC, x402).",
