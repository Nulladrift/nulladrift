        {
          "name": "quantagentshop_sanctions_screen",
          "title": "Sanctions screen",
          "description": "Sanctions screening against the US Treasury OFAC SDN and Consolidated lists. Send a person, company or vessel name (fuzzy match on names and aliases, with scores) or a crypto wallet address (exact match against addresses OFAC lists). Returns match or no_match, entries with program, list and score, and provenance: each list file's URL, refresh time and SHA-256. Use before a payment or onboarding. A screening aid, not a compliance determination. Failed calls are not charged. Costs $0.0099 (USDC, x402).",
