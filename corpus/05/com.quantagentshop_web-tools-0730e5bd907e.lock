          },
          "digest": "sha256:fbf4db8a63e9f8b21c680dd85d278a05396b4e14aeeab912a48a71dc98a83c3c"
        },
        {
          "name": "quantagentshop_lead_list",
          "title": "Lead list",
          "description": "Local business lead list. Send what and where, such as dentists in Austin TX; returns up to 20 Google Maps businesses with name, address, phone, website, rating, a domain check (DNS) and the best contact email on the business's own site, email-checked. For lead generation and local business contacts. Emails are role addresses (info@, sales@) the site publishes at its own domain: no personal or guessed ones, no mailbox test. Typical response 5 to 20 s. Failed calls are not charged. Costs $0.2 (USDC, x402).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional two-letter country code, lower case, such as us or gb; also puts local phone numbers in E.164.",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "language": {
                "description": "Optional language code, lower case, such as en or pt-br.",
                "pattern": "^[a-z]{2}(-[a-z]{2})?$",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Most leads to return, 1 to 20; the price is the same.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Result page, 1 for the first.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What kind of business and where, in one string, such as dentists in Austin TX.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d15b9e2fee405ddb5d3116f92a025ea470aa5cdb7b01331fba8654b8c716c9cc"
        },
        {
          "name": "quantagentshop_news_search",
          "title": "News search",
          "description": "News search. Send a query; returns up to 10 Google News articles with title, URL, publisher, date and snippet, optionally limited to the last hour, day, week, month or year and to a country and language. Use to find recent coverage of a topic, company or event. Not for full article text (use /v1/fetch-page). Typical response about 1 s. Failed calls are not charged. Costs $0.0099 (USDC, x402).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional two-letter country code, lower case, such as us or gb.",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "language": {
                "description": "Optional language code, lower case, such as en or pt-br.",
                "pattern": "^[a-z]{2}(-[a-z]{2})?$",
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Result page, 1 for the first.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Topic, company or event to find news about.",
                "maxLength": 400,
                "minLength": 2,
                "type": "string"
              },
              "time_window": {
                "description": "Only articles from the last hour, day, week, month or year.",
                "enum": ["hour", "day", "week", "month", "year"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
