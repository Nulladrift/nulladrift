      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Quant Agent Shop",
        "version": "1.1.0",
        "websiteUrl": "https://quantagentshop.com",
        "icons": [
          {
            "src": "https://quantagentshop.com/favicon.png",
            "mimeType": "image/png",
            "sizes": ["256x256"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Paid web tools: web and paper search, page reading, cited answers, summaries and JSON extraction, PDFs and PDF text, OCR, SEC filings, sanctions screening, counterparty, company, domain, email, phone and SEO checks, URL status and page-change checks, QR codes, weather and IP lookup. Each call costs $0.0099 to $0.2 in USDC over x402 (each tool's description gives its price): call a tool, get the payment terms, pay, call again. Calls that fail are not charged. quantagentshop_quote is free: it gives any tool's terms and checks its arguments first. Put a random _meta idempotency-key beside the payment to get the result again after a lost reply, by resending the same payment, key and arguments within 10 minutes. Invited pilot integrators put their pilot key in _meta pilot-key instead of a payment.",
      "tools": [
        {
          "name": "quantagentshop_company_lookup",
          "title": "Company lookup",
          "description": "Company legal-entity lookup from the global LEI system (GLEIF). Send a company name or a 20-character LEI; returns legal name, LEI, status, jurisdiction, legal form, registration number, addresses, the first record's direct and ultimate parents, found or unknown, and provenance (source URLs, retrieval times, SHA-256). Use for know-your-business checks and group-structure questions. Companies only. Typical response 1 to 2 s. Failed calls are not charged. Costs $0.0099 (USDC, x402).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lei": {
                "description": "20-character Legal Entity Identifier. Send name or lei.",
                "pattern": "^[A-Z0-9]{18}[0-9]{2}$",
                "type": "string"
              },
              "max_results": {
                "default": 3,
                "description": "Most records to return.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Company legal name.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4cf378478f57c976dbed396ad3137f01c081cafe9246d7cfb51af5e173ae58c3"
        },
        {
          "name": "quantagentshop_counterparty_check",
          "title": "Counterparty check",
          "description": "Counterparty check in one call. Send a company or person name, a domain, an EVM wallet address, or any mix; returns one report with a status per check: OFAC sanctions (name and wallet), SEC EDGAR and GLEIF company records (name), domain registration, DNS and TLS, and email authentication (domain); each check that returns data cites sources and retrieval times. Use before paying or onboarding a party. A screening aid, not a compliance determination. Failed calls are not charged. Costs $0.03 (USDC, x402).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "EVM wallet address: exact sanctions match. Send at least one field.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "domain": {
                "description": "Domain name: registration, DNS, TLS and email authentication checks.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Company or person name: sanctions screen, SEC and GLEIF lookups.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0890c5431383e3f7634745f188f70bfc8e244be3470eb7671673e4c3bf4df644"
        },
        {
          "name": "quantagentshop_domain_lookup",
          "title": "Domain lookup",
          "description": "Domain lookup in one call: DNS records (A, AAAA, MX, TXT, NS, CNAME, SOA, CAA with TTLs), registry RDAP registration data (registrar, created, updated and expiry dates, status, nameservers, DNSSEC) and the TLS certificate (issuer, names, validity, days left, chain verified). Use to check a domain before linking to, buying or trusting it. No registrant contact data. Typical response 1 to 2 s. Failed calls are not charged. Costs $0.0099 (USDC, x402).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dns_types": {
                "default": ["A", "AAAA", "MX", "TXT", "NS", "CNAME"],
                "description": "DNS record types to read.",
                "items": {
                  "enum": ["A", "AAAA", "MX", "TXT", "NS", "CNAME", "SOA", "CAA"],
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "domain": {
                "description": "Domain name, such as example.com.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "parts": {
                "default": ["dns", "registration", "tls"],
                "description": "Which checks to run.",
                "items": {
                  "enum": ["dns", "registration", "tls"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:69b886c644650f6c04d9efd3d57b101d53f77efdd132c71cd3d3936757727515"
        },
        {
          "name": "quantagentshop_email_auth_check",
          "title": "Email auth check",
          "description": "Email authentication check for a domain. Returns the SPF record with its DNS lookup count and all qualifier, the DMARC policy and report addresses, MX hosts, MTA-STS and BIMI records, DKIM keys found on common selectors, a grade from A to F and a list of issues. Use to diagnose deliverability or spoofing risk. DKIM is checked on common selectors only. Typical response under 1 s. Failed calls are not charged. Costs $0.0099 (USDC, x402).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name, such as example.com.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:164af6e33c245f2735455370a76ad4675554eff07aea3a727e753149cd89c37e"
        },
        {
          "name": "quantagentshop_email_check",
          "title": "Email check",
          "description": "Email address check without sending mail. Returns syntax validity, the normalised address, whether the domain accepts mail (MX, null MX or address fallback), and flags for disposable, role (info@, support@) and free webmail addresses, with a verdict. Use to validate an address someone gave you. Does not confirm the mailbox exists. Typical response under 1 s. Failed calls are not charged. Costs $0.0099 (USDC, x402).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "One email address.",
                "maxLength": 254,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4faed1fdbf2450548169dd03dd8e5aabe98e3153a2d66e8c25cf3285c5855a68"
        },
        {
          "name": "quantagentshop_fetch_page",
          "title": "Fetch page",
          "description": "Page fetch. Send a public URL; returns the page title and its main content as clean Markdown or plain text, with navigation, scripts and ads removed. Use to read an article, docs page or listing. Not for pages behind logins, PDFs or images; no JavaScript rendering. Reads the first 1 MB of a page. Social networks (Facebook, Instagram, LinkedIn, X, Reddit, YouTube, TikTok and similar) are refused. Typical response under 2 s. Failed calls are not charged. Costs $0.0099 (USDC, x402).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "default": "markdown",
                "description": "markdown keeps headings, links and lists; text is plain.",
                "enum": ["markdown", "text"],
                "type": "string"
              },
              "max_chars": {
                "default": 20000,
                "description": "Cut the returned content at this many characters.",
                "maximum": 100000,
                "minimum": 500,
                "type": "integer"
              },
              "url": {
                "description": "Public http or https page to read.",
                "format": "uri",
                "maxLength": 2083,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:765329e0f884e0fb69c7f3ca420d3082a1822c20f5b4f0e159e0cf8bfc766fd6"
        },
        {
          "name": "quantagentshop_ip_geo",
          "title": "IP geo",
          "description": "IP address lookup for one public IPv4 or IPv6 address: country, region and city (a city-level estimate with coordinates), continent, and network (ASN number and organisation). Use for fraud checks, analytics or routing. Not for finding a street address or a person. Local database, no third-party call per lookup. Typical response under 100 ms. Failed calls are not charged. Costs $0.0099 (USDC, x402).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ip": {
                "description": "One public IPv4 or IPv6 address.",
                "maxLength": 45,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
