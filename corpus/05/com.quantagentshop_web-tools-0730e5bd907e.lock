        {
          "name": "quantagentshop_sec_filings",
          "title": "SEC filings",
          "description": "SEC EDGAR filings lookup. Send a US ticker, CIK or company name, optionally with form types such as 10-K, 10-Q, 8-K or 4; returns the company, its CIK and SIC code, and its latest matching filings (about the last 1,000) with form, filing date, period and direct links to the document and index, the window searched, and provenance (source URLs, retrieval times, SHA-256). Filing metadata and links only; read a filing with /v1/fetch-page. Typical response under 1 s. Failed calls are not charged. Costs $0.0099 (USDC, x402).",
