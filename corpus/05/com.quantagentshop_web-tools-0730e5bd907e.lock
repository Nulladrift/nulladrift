                "maximum": 1,
                "minimum": 0.8,
                "type": "number"
              },
              "name": {
                "description": "Person, company or vessel name to screen (fuzzy match).",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "description": "Only entries of this type (name screening).",
