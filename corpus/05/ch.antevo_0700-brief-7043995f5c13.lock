      "instructions": "The 07:00 Brief, by Antevo. Your agent knows the markets by 07:00, every day: we read them so you don't have to.\n\nA new brief every morning around 07:00 Zurich time: the headline, the market regime, what matters and why, the take, the signal to watch, upcoming catalysts and the main risks. With it: the Market Map, Big Picture, the Three Minute Brief, the Risk Radar, and notes on markets and commodities, AI and technology, energy, the energy transition and geopolitics.\n\nUse it when someone asks what is happening in markets today, what to watch this week, or what risks are building. Earlier briefs are available by date.\n\nAntevo's editorial commentary, not investment advice. Public, no account, no personal data.",
      "tools": [
        {
          "name": "get_morning_brief",
          "title": "Get morning brief",
          "description": "The 07:00 Brief for one day: title, subtitle, hero line, market regime, what matters and why, the take, the signal being watched, upcoming catalysts, risks and what to watch, with that morning's Market Map, Big Picture and Three Minute Brief notes when they were published. Without a date it is the latest brief; with date (YYYY-MM-DD) it is the brief published that day.",
          "inputSchema": {
            "properties": {
              "date": {
                "default": null,
                "title": "Date",
                "type": "string"
              }
            },
            "title": "get_morning_briefArguments",
            "type": "object"
          },
          "outputSchema": {
            "title": "get_morning_briefDictOutput",
            "type": "object"
          },
          "annotations": {
