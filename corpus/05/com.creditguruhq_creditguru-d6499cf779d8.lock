        },
        {
          "name": "search_articles",
          "title": "Search Credit Guru articles",
          "description": "Search Credit Guru guides and news about credit cards, points and miles, bank bonuses and credit scores. Returns titles, summaries and links.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
