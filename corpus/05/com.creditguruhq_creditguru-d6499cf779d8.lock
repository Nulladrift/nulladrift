      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.creditguruhq/creditguru",
        "title": "Credit Guru",
        "version": "1.3.0",
        "websiteUrl": "https://creditguruhq.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Credit Guru (https://creditguruhq.com) publishes credit card, bank bonus and credit score guides with card facts from issuer pages. Use find_cards or get_best_cards to compare cards, get_card for one card, list_current_offers for current bonuses, list_hotel_programs for card hotel perks, find_hotels for hotels in those programs, and search_articles for guides. Share the returned links so readers can check details. Educational, not financial advice. Card and offer facts come from issuer pages on the checked date and can change; confirm on the issuer site before applying. Approval is never guaranteed.",
      "tools": [
        {
          "name": "find_cards",
          "title": "Find credit cards",
          "description": "Filter the Credit Guru card catalog by type, annual fee, credit level and foreign fee. Returns issuer facts, our rating and review links, best rated first.",
          "inputSchema": {
            "properties": {
              "audience": {
                "description": "Personal (default) or small business cards.",
                "enum": ["personal", "business"],
                "type": "string"
              },
              "credit_level": {
                "description": "Only cards aimed at this credit level or below.",
                "enum": ["building", "fair", "good", "excellent"],
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_annual_fee": {
                "minimum": 0,
                "type": "number"
              },
              "no_foreign_fee": {
                "type": "boolean"
              },
              "query": {
                "description": "Part of a card or issuer name, e.g. \"sapphire\".",
                "type": "string"
              },
              "type": {
                "enum": ["cash-back", "flat-rate", "travel", "starter", "student", "intro-apr", "airline", "hotel"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find credit cards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e3ad28a591577588409f8369ad3f4f82fe42d45b51956c3bb75672ee6fadb26"
        },
        {
          "name": "find_hotels",
          "title": "Find hotels by city, brand or program",
          "description": "Hotels Credit Guru checked on their own sites, with the card hotel programs whose official pages list them. Filter by city, country, brand or program; returns address, check-in times, programs and links.",
          "inputSchema": {
            "properties": {
              "brand": {
                "type": "string"
              },
              "city": {
                "description": "Exact city, e.g. \"New York\".",
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "program": {
                "enum": ["amex-fine-hotels-resorts", "amex-the-hotel-collection", "capital-one-premier-collection", "capital-one-lifestyle-collection", "chase-the-edit", "virtuoso", "hyatt-prive"],
                "type": "string"
              },
              "query": {
                "description": "Part of a hotel or city name, e.g. \"peninsula\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find hotels by city, brand or program"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ba2d0163b67d8054cdb804a600efbdf615c89ea87b4f272fddeba15806efc2d"
        },
        {
          "name": "get_best_cards",
          "title": "Get a best-of card list",
          "description": "A ranked Credit Guru best-of list: by reward type (cash back, travel, premium, airline, hotel), by spending (gas, groceries, dining, streaming), by need (0% intro APR, balance transfer, no annual fee, no foreign transaction fee, student, business) or by credit level.",
          "inputSchema": {
            "properties": {
              "list": {
                "enum": ["cash-back", "travel", "no-annual-fee", "balance-transfer", "student", "flat-rate", "gas-groceries", "airline", "hotel", "business", "premium", "gas", "groceries", "dining", "streaming", "0-percent-apr", "no-foreign-transaction-fee", "credit-building", "credit-fair", "credit-good", "credit-excellent"],
                "type": "string"
              }
            },
            "required": ["list"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a best-of card list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ab3ca8b0793f7d8f89ff0537692d8de5df5817424672da200c174d5cfdd2bf0"
        },
        {
          "name": "get_card",
          "title": "Get card details",
          "description": "Full facts for one card by slug: fees, rewards, APRs, welcome offer, our rating breakdown, pros and cons, and the issuer source.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Card slug from find_cards, e.g. \"citi-double-cash\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
