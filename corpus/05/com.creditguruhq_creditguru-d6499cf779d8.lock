        {
          "name": "list_hotel_programs",
          "title": "List card hotel programs",
          "description": "Hotel booking programs that come with cards (Amex Fine Hotels + Resorts and The Hotel Collection, Capital One Premier and Lifestyle Collection, The Edit by Chase): perks, which cards unlock them, how to book, FAQ and issuer sources.",
          "inputSchema": {
            "properties": {
