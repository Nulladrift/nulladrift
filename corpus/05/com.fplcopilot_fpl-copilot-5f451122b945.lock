                "title": "Names"
              },
              "players": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Same as names",
                "title": "Players"
