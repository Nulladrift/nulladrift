        {
          "name": "find_players",
          "title": "Find players by expected points",
          "description": "Use this to find the best Fantasy Premier League (fantasy football) players to pick or buy, by fplcopilot expected points (xPts, also called predicted or projected points), filtered by position, price, club or ownership, and sorted by points, value per £m, or as low-owned differentials. Classic FPL, not FPL Draft.",
          "inputSchema": {
            "properties": {
              "exclude": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 15,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Players to leave out, e.g. ones they own",
                "title": "Exclude"
              },
              "exclude_flagged": {
                "default": true,
                "description": "Leave out flagged and fringe players (default true)",
                "title": "Exclude Flagged",
                "type": "boolean"
              },
              "gw_from": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "maxLength": 12,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "First gameweek (default: the next)",
                "title": "Gw From"
              },
              "gw_to": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "maxLength": 12,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Last gameweek (default: from horizon)",
                "title": "Gw To"
              },
              "horizon": {
                "default": 5,
                "description": "How many gameweeks ahead to count (1-8).",
                "title": "Horizon",
                "type": "integer"
              },
              "limit": {
                "default": 10,
                "description": "How many players (1-15; 40 with per_club)",
                "title": "Limit",
                "type": "integer"
              },
              "max_ownership": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Max ownership %, e.g. 10 for differentials",
                "title": "Max Ownership"
              },
              "max_price": {
                "anyOf": [
