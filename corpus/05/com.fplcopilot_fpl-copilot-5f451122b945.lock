        {
          "name": "find_players",
          "title": "Find players by expected points",
          "description": "Use this to find the best Fantasy Premier League (fantasy football) players to pick or buy, by fplcopilot expected points (xPts, also called predicted or projected points), filtered by position, price, club or ownership, and sorted by points, value per £m, or as low-owned differentials. Classic FPL, not FPL Draft.",
          "inputSchema": {
            "properties": {
              "horizon": {
                "default": 5,
                "description": "How many gameweeks ahead to count (1-8).",
                "title": "Horizon",
                "type": "integer"
              },
              "limit": {
                "default": 10,
                "description": "How many players (1-15)",
                "title": "Limit",
                "type": "integer"
              },
              "max_ownership": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Max ownership %, e.g. 10 for differentials",
                "title": "Max Ownership"
              },
              "max_price": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Max price in £m, e.g. 8.0",
                "title": "Max Price"
              },
              "min_price": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Min price in £m",
                "title": "Min Price"
              },
              "position": {
                "anyOf": [
                  {
                    "maxLength": 24,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Position: GK, DEF, MID or FWD",
                "title": "Position"
              },
              "sort": {
                "default": "xpts",
                "description": "xpts (default), value (xPts per £m) or differential (low-owned)",
                "maxLength": 24,
                "title": "Sort",
                "type": "string"
              },
              "team": {
                "anyOf": [
                  {
                    "maxLength": 30,
                    "minLength": 1,
                    "type": "string"
