                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Min price in £m",
                "title": "Min Price"
              },
              "per_club": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The best 1-3 at EACH club asked, in one table",
                "title": "Per Club"
              },
              "position": {
                "anyOf": [
                  {
