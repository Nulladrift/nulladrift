        {
          "name": "topup_credits",
          "title": "Add credits (card checkout link or USDC quote)",
          "description": "Add credits. Card (one call): {\"method\": \"stripe\", \"amount\": N} where N is $20 or $99 — returns a Stripe checkout_url already bound to your api_key, and credits post automatically once Stripe confirms payment at $1 = 1 credit. No human step and no wallet needed. USDC on Base, two modes. micro_decimal, no wallet signature: {\"method\": \"usdc\", \"mode\": \"micro_decimal\", \"amount\": N} with N whole USDC from 1 to 999,999 returns a unique amount with a 6-decimal suffix and an expires_at; a finalized Base transfer of EXACTLY that amount, from any sender including an exchange, before expires_at credits your account (1 USDC = 1 credit); a different amount does not credit your account. verified_wallet (the default when mode is omitted): verify your sender first via POST /v1/credits/crypto/challenge and /verify with X-API-Key, sign the returned challenge with your own EOA, then pass the verified from_address; only a transfer FROM that wallet is credited. In every USDC mode send only after a successful quote; credit requires finalized Base evidence. Instructions: https://kairossignal.com/docs/crypto.html",
          "inputSchema": {
            "allOf": [
              {
                "if": {
                  "properties": {
                    "method": {
                      "const": "stripe"
                    }
                  },
                  "required": ["method"]
                },
                "then": {
                  "properties": {
                    "amount": {
                      "enum": [20, 99]
                    }
                  }
                }
              },
              {
                "if": {
                  "properties": {
                    "method": {
                      "const": "usdc"
                    },
                    "mode": {
                      "const": "micro_decimal"
                    }
                  },
                  "required": ["method", "mode"]
                },
                "then": {
                  "properties": {
                    "amount": {
                      "maximum": 999999,
                      "minimum": 1,
                      "type": "integer"
                    }
                  }
                }
              },
              {
                "if": {
                  "not": {
                    "properties": {
                      "mode": {
                        "const": "micro_decimal"
                      }
                    },
                    "required": ["mode"]
                  },
                  "properties": {
                    "method": {
                      "const": "usdc"
                    }
                  },
                  "required": ["method"]
                },
                "then": {
                  "required": ["from_address"]
                }
              }
            ],
            "properties": {
              "amount": {
                "description": "stripe: Amount in USD to add. Fixed packs only: 20 or 99. Any other value returns the available packs instead of a link. USDC micro_decimal: whole USDC, 1 to 999999. USDC verified_wallet: the USDC amount to quote (GET /v1/credits/crypto states the accepted range).",
                "type": "number"
              },
              "api_key": {
                "description": "Your API key",
                "type": "string"
              },
              "from_address": {
                "description": "Required for USDC verified_wallet mode (the default): your EOA address already verified to this API account through the wallet challenge flow. Not used by micro_decimal.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "method": {
                "description": "Payment method",
                "enum": ["usdc", "stripe"],
                "type": "string"
              },
              "mode": {
                "description": "USDC only. micro_decimal: no wallet signature; the quote is a unique amount to send exactly, from any sender. verified_wallet (default when omitted): requires from_address verified through the wallet challenge flow. Ignored for stripe.",
                "enum": ["verified_wallet", "micro_decimal"],
                "type": "string"
              },
              "tx_hash": {
                "description": "Legacy optional field; a transaction hash does not replace from_address or verify payment.",
                "type": "string"
              }
            },
            "required": ["amount", "api_key", "method"],
            "type": "object"
