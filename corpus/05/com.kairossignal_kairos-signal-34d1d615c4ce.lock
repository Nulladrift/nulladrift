      "instructions": "Kairos Signal serves measured supply-side telemetry for DePIN (decentralized physical infrastructure) networks: 314 live networks + 129 Bittensor subnets (443 symbols), 18,659 verify-stamped live series. Every value carries source, as_of and a verify_url on the network's own API. Answer questions with the read-only tools, no key needed: find_networks (name or ticker -> symbol), get_network (latest values, each with its verify_url), get_metric_history (daily points), verify_value (re-reads the upstream now and says where our number appears). Coverage counts: get_stats. Freshness and history depth per feed: get_data_dictionary. Hashes of the archived upstream payloads and collector code behind a network: get_derivation_ledger. Paid depth (full tables, longer history, cross-network views) is optional: list_products and purchase_data with an API key from register_agent ($5 free credits, no card (first 3 keys per IP per 30 days)), or an X-API-Key header on this connection. USDC on Base, two modes: micro_decimal needs no wallet signature (topup_credits mode micro_decimal returns a unique 6-decimal amount; send exactly that amount from any sender), or verified_wallet (sign a wallet challenge first): https://kairossignal.com/docs/crypto.html. Five paid analytics tools (get_rmt_regime_state, get_hodge_regime_sieve, get_shap_node_attribution, get_listing_dilution_score, get_depin_slashing_audit) charge credits per answered call, stated in each description; an unavailable answer costs nothing. Calls with a registered key to those tools and to list_products, purchase_data, topup_credits and check_balance do not use the free 15-call daily per-IP quota; they have a separate per-key cap of 5,000 calls/day. NOT INVESTMENT ADVICE: Kairos Signal is not a broker-dealer, investment advisor, or financial services provider, and nothing served here is a recommendation to buy or sell any asset. All outputs are measurements and research, for informational purposes only, without warranty. Terms: https://kairossignal.com/terms — Disclaimer: https://kairossignal.com/disclaimer",
