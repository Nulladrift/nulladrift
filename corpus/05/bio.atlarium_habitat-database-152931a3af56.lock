                "required": ["insulation"],
                "type": "object"
              },
              "lighting": {
                "additionalProperties": false,
                "description": "Lighting estimate input.",
                "properties": {
                  "lumens": {
                    "description": "Lighting output in lumens.",
                    "maximum": 10000000,
                    "minimum": 0,
                    "type": "number"
