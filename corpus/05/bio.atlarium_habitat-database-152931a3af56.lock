              "measurements": {
                "description": "Optional current measurements for nutrient-gap calculations.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "kind": {
                      "description": "Measured nutrient or water parameter name.",
                      "maxLength": 30,
                      "minLength": 1,
                      "type": "string"
                    },
                    "measured_at": {
                      "anyOf": [
                        {
                          "format": "date-time",
                          "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Optional ISO datetime for when the measurement was taken."
                    },
                    "value": {
                      "anyOf": [
                        {
                          "description": "Finite numeric value for advisory calculations.",
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Measured numeric value; omit or use null when unknown."
                    }
                  },
                  "required": ["kind"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "regime": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional fertilization regime name or strategy."
              },
              "targets": {
                "additionalProperties": false,
                "description": "Optional target nutrient concentrations.",
                "properties": {
                  "boron_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target boron concentration in mg/L."
                  },
                  "calcium_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target calcium concentration in mg/L."
                  },
                  "copper_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target copper concentration in mg/L."
                  },
                  "iron_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target iron concentration in mg/L."
                  },
                  "magnesium_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target magnesium concentration in mg/L."
                  },
                  "manganese_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target manganese concentration in mg/L."
                  },
                  "molybdenum_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target molybdenum concentration in mg/L."
                  },
                  "nitrogen_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
