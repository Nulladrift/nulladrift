        {
          "name": "calculate_nutrient_gaps",
          "title": "Calculate nutrient gaps",
          "description": "Compare nutrient targets with supplied measurements without saving user data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "items": {
                "description": "Optional supplied fertilization plan items to analyze.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand_name": {
                      "anyOf": [
                        {
                          "maxLength": 120,
                          "minLength": 1,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Optional fertilizer brand name for this dosing item."
                    },
                    "days_of_week": {
                      "description": "Scheduled dosing days as numbers from 1 to 7.",
                      "items": {
                        "description": "Day of week number from 1 to 7.",
                        "maximum": 7,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "maxItems": 7,
                      "minItems": 1,
                      "type": "array"
                    },
                    "dose_unit": {
                      "default": "ml",
                      "description": "Dose unit, defaulting to ml.",
                      "maxLength": 20,
                      "minLength": 1,
                      "type": "string"
                    },
                    "dose_value": {
                      "description": "Dose amount per scheduled application.",
                      "maximum": 1000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "method": {
                      "description": "Dosing method for the fertilizer item.",
                      "enum": ["LIQUID", "ROOT_TAB", "POWDER", "CAPSULE"],
                      "type": "string"
                    },
                    "notes": {
                      "anyOf": [
                        {
                          "maxLength": 500,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Optional non-persistent notes for this dosing item."
                    },
                    "product_name": {
                      "description": "Fertilizer product name for this dosing item.",
                      "maxLength": 160,
                      "minLength": 1,
                      "type": "string"
                    },
                    "sort_order": {
                      "default": 0,
                      "description": "Optional sort order for displaying plan items.",
                      "maximum": 1000,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["days_of_week", "dose_value", "method", "product_name"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "language": {
                "description": "Optional preferred response language: it, en or es.",
                "enum": ["it", "en", "es"],
                "type": "string"
              },
              "measurements": {
                "description": "Optional current measurements for nutrient-gap calculations.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "kind": {
                      "description": "Measured nutrient or water parameter name.",
                      "maxLength": 30,
                      "minLength": 1,
                      "type": "string"
                    },
                    "measured_at": {
                      "anyOf": [
                        {
                          "format": "date-time",
                          "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Optional ISO datetime for when the measurement was taken."
                    },
                    "value": {
                      "anyOf": [
                        {
                          "description": "Finite numeric value for advisory calculations.",
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Measured numeric value; omit or use null when unknown."
                    }
                  },
                  "required": ["kind"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "regime": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional fertilization regime name or strategy."
              },
              "targets": {
                "additionalProperties": false,
                "description": "Optional target nutrient concentrations.",
                "properties": {
                  "boron_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target boron concentration in mg/L."
                  },
                  "calcium_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target calcium concentration in mg/L."
                  },
                  "copper_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target copper concentration in mg/L."
                  },
                  "iron_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target iron concentration in mg/L."
                  },
                  "magnesium_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target magnesium concentration in mg/L."
                  },
                  "manganese_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target manganese concentration in mg/L."
                  },
                  "molybdenum_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target molybdenum concentration in mg/L."
                  },
                  "nitrogen_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target nitrogen concentration in mg/L."
                  },
                  "phosphorus_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target phosphorus concentration in mg/L."
                  },
                  "potassium_mg_l": {
                    "anyOf": [
                      {
                        "description": "Finite numeric value for advisory calculations.",
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Target potassium concentration in mg/L."
                  },
