        {
          "name": "calculate_equipment_requirements",
          "title": "Calculate equipment requirements",
          "description": "Calculate advisory heater, lighting and electricity requirements.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "electricity": {
                "additionalProperties": false,
                "description": "Electricity cost and usage calculation input.",
                "properties": {
                  "cost_per_kwh": {
                    "description": "Electricity cost per kWh.",
                    "maximum": 1000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "duty_cycle_percent": {
                    "description": "Estimated duty cycle percentage.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "hours_per_day": {
                    "description": "Daily runtime in hours.",
                    "maximum": 24,
                    "minimum": 0,
                    "type": "number"
                  },
                  "wattage": {
                    "description": "Equipment wattage.",
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "heater": {
                "additionalProperties": false,
                "description": "Heater sizing input.",
                "properties": {
                  "ambient_c": {
                    "description": "Ambient room temperature in Celsius.",
                    "maximum": 80,
                    "minimum": -50,
                    "type": "number"
                  },
                  "insulation": {
                    "description": "Tank insulation quality.",
                    "enum": ["good", "normal", "poor"],
                    "type": "string"
                  },
                  "target_c": {
                    "description": "Target water temperature in Celsius.",
                    "maximum": 80,
                    "minimum": -50,
                    "type": "number"
                  },
                  "volume_liters": {
                    "description": "Tank volume in liters for heater sizing.",
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["insulation"],
                "type": "object"
              },
              "lighting": {
                "additionalProperties": false,
                "description": "Lighting estimate input.",
                "properties": {
                  "lumens": {
                    "description": "Lighting output in lumens.",
                    "maximum": 10000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "volume_liters": {
                    "description": "Tank volume in liters for lighting estimates.",
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "watts": {
                    "description": "Lighting wattage.",
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "number"
                  }
