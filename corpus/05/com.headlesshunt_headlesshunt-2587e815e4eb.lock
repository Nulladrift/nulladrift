            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "handle": {
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d03a298b9d00c3d7b62821318b066d2f62d68b1b6c2cb4dc8841cad419cfb55f"
