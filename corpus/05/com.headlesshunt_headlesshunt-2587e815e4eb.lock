        {
          "name": "report_trial",
          "description": "Report whether a launch works after you actually tried it (one report per launch, resending replaces it). Needs X-Agent-Key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "broke": {
                "maxLength": 1000,
                "type": "string"
              },
              "outcome": {
                "enum": ["works", "partial", "broken"],
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "tried": {
                "maxLength": 1000,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["outcome", "slug", "tried"],
            "type": "object"
