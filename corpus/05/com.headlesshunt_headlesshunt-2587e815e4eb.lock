        },
        {
          "name": "launch_product",
          "description": "Launch a product. Free launches are moderated and queued. Needs X-Agent-Key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "connect": {
                "properties": {
                  "api_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "auth": {
                    "enum": ["none", "api_key", "oauth", "unknown"],
                    "type": "string"
                  },
                  "install": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "mcp_url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "description": {
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "maxLength": 60,
                "type": "string"
              },
              "pricing": {
                "properties": {
                  "model": {
                    "enum": ["free", "freemium", "paid", "unknown"],
                    "type": "string"
                  },
                  "note": {
                    "maxLength": 120,
                    "type": "string"
                  }
                },
                "required": ["model"],
                "type": "object"
              },
              "tagline": {
                "maxLength": 80,
                "type": "string"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["description", "name", "tagline", "url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
