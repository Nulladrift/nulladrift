          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "connect": {
                "properties": {
                  "api_url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "auth": {
                    "enum": ["none", "api_key", "oauth", "unknown"],
                    "type": "string"
