        {
          "name": "place_service_request",
          "title": "Place a service request",
          "description": "One call for any trade job (repair, quote, booking). Pass service_sku (or a plain description and it matches one), intake_answers keyed by the field ids from get_service_requirements, customer (name, phone, address with line1+zip), preferred_time, and slot_start only when the service flow asks for one. For an unchanged retry after receiving a receipt, include retry_ref and its customer_token with the original details. For quote-first requests without a slot, optionally generate and securely save intent_capability before the first submission; explicitly repeat the same business/details/capability to recover a lost first receipt. Do not silently resubmit. Without either capability this creates a separate request, even if the phone matches. A quote_required request is sent to the business without a price; a priced booking draft waits for the customer's approval. Follow the returned next_step, and never call a request booked until the business confirms.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "customer": {
                "description": "Who the job/order is for. Use what the customer already gave you; ask only for what a tool says is missing.",
                "properties": {
                  "address": {
                    "properties": {
                      "city": {
                        "type": "string"
                      },
                      "line1": {
                        "type": "string"
                      },
                      "line2": {
                        "type": "string"
                      },
                      "state": {
                        "type": "string"
                      },
                      "zip": {
                        "type": "string"
                      }
                    },
                    "required": ["line1", "zip"],
                    "type": "object"
                  },
                  "email": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "notes": {
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "customer_token": {
                "description": "Customer token returned with retry_ref; only for an unchanged retry of that request.",
                "type": "string"
              },
              "description": {
                "description": "The problem in the customer's words; used to match a service if service_sku is omitted",
                "type": "string"
              },
              "intake_answers": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "intent_capability": {
                "description": "Optional secret 32-byte random client capability, encoded as lowercase hex. Save before sending a quote-first request without a slot; explicitly repeat unchanged details with the same capability to recover a lost first receipt. Never combine with retry_ref/customer_token; never silently resubmit.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "photos": {
                "description": "URLs (use upload_photo to turn an image into a URL)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "preferred_time": {
                "description": "e.g. 'Tomorrow morning' or an ISO datetime",
                "type": "string"
              },
              "referred_by": {
                "description": "Slug of the business whose error response listed this one under referrals[] (its trusted partner). Lets both businesses see the referral.",
                "type": "string"
              },
              "retry_ref": {
                "description": "Existing request reference for an unchanged retry; requires customer_token. A phone number never authorizes a retry.",
                "type": "string"
              },
              "service_sku": {
                "type": "string"
              },
              "slot_start": {
                "description": "ISO start from get_availability",
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "urgency": {
                "enum": ["emergency", "today", "this_week", "flexible"],
                "type": "string"
              }
            },
            "required": ["customer", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
