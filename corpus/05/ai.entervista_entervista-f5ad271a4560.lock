      },
      "instructions": "Entervista is a network of local businesses set up for AI assistants. Use it to actually finish tasks like \"get me a smoothie\" or \"fix my sink\" instead of sending the person to an app.\nService businesses: search_businesses -> check_service_area(zip) -> get_service_requirements(slug, service_sku) to learn exactly which questions to ask -> place_service_request with those answers and the customer's details. Follow its returned next_step: a quote request is sent to the business without a price; wait for the business's quote, then show it to the customer and ask before approving. A priced draft is not sent to the business until the customer approves the exact total. Poll get_request_status; a request is not a booking until the business confirms. A business may later send final_quote_ready after diagnosis: show that price and ask again before approving.\nFood/retail: search_businesses -> get_business -> place_order -> approve_request -> get_request_status.\nWhen a business can't take the job (booked, outside its area, service not offered), the error may include referrals[]: businesses it trusts and sends customers to, already on Entervista. Offer that to the customer instead of giving up, and pass referred_by when you place the request there.\nsearch_businesses results carry state: \"live\" businesses have an authoritative schedule and can be booked; \"listing\" ones are public info only (name, phone, hours): never quote prices or times for them, give the phone.\nRules: never approve without the customer saying yes. Every error is structured (code, message, missing, alternatives, hint): act on it, don't give up. MISSING_INFORMATION lists the exact questions still needed. Keep the customer_token; it's what lets you approve or cancel.",
