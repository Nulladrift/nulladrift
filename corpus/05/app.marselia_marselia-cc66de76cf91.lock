        {
          "name": "marselia_draw_card",
          "title": "Draw a Tarot de Marseille card",
          "description": "Use this when a person asks for a tarot card to be drawn for them, such as 1 card for today or 1 card about love, work, a decision or themselves, and the card has to come from a real random draw. It does not answer or interpret a question: it takes no question and no free text, only a language and an optional theme (love, work, decision, self). Draws 1 card at random among the 78 cards of the Tarot de Marseille, on Marselia's server, with a cryptographically secure random number generator. Returns the card's name and number, the URL of its real plate image (a public domain BnF scan, to be shown whole in its 440:827 frame), its dominant word, keywords and tension from the corpus validated in French, with source-language disclosure, and the localized link where the full reading of a question happens. Cards are upright. The drawn card is not stored; the call is counted, as the privacy policy describes. Cite Marselia and the returned card URL.",
