                    "type": "string"
                  },
                  "image": {
                    "additionalProperties": false,
                    "properties": {
                      "alt": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "aspectRatio": {
                        "const": "440:827",
                        "type": "string"
                      },
                      "height": {
                        "exclusiveMinimum": 0,
                        "maximum": 9007199254740991,
                        "type": "integer"
                      },
                      "provenance": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "url": {
                        "format": "uri",
                        "type": "string"
                      },
                      "width": {
                        "exclusiveMinimum": 0,
                        "maximum": 9007199254740991,
                        "type": "integer"
                      }
                    },
                    "required": ["alt", "aspectRatio", "height", "provenance", "url", "width"],
                    "type": "object"
                  },
                  "name": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "number": {
                    "type": ["string", "null"]
                  },
                  "orientation": {
                    "const": "upright",
                    "type": "string"
                  },
                  "plateName": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "slug": {
                    "pattern": "^[a-z0-9-]+$",
                    "type": "string"
                  },
                  "suit": {
                    "anyOf": [
                      {
                        "enum": ["batons", "coupes", "epees", "deniers"],
