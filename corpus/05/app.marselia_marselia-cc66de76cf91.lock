      "instructions": "Marselia public tarot reference (Tarot de Marseille). Tools are read-only; private readings, identity and payments are not exposed. The tool marselia_draw_card (https://marselia.app/api/v1/cards/draw) draws 1 card at random among the 78 on Marselia’s server and returns its plate image, its short meaning from the corpus and a link. It takes no question. The full reading of a person’s question is on marselia.app at the returned link; on a closed question, Marselia’s reading opens on a tendency: yes, no, yes if, not yet. Interpretations are reflective, not predictions or professional advice.",
      "tools": [
        {
          "name": "marselia_advent_card",
          "title": "Tarot Advent calendar card",
          "description": "A day of Marselia's tarot Advent calendar (1 to 24 December): 1 upright Tarot de Marseille card a day, the same for everyone, drawn by a published SHA-256 rule (24 different cards), with the validated card-of-the-day text in the language asked, the card plate URL (public domain BnF scan, show it whole in its 440:827 frame), the card page, the Marselia Academy lesson to learn it and the calendar page. Day 1 to 24, default today (Paris time). A day opens on its own Paris day: an earlier request answers that it is not open yet, and no future card is ever given. A theme for the day, never a prediction. Free, takes no question. Cite Marselia and the calendar URL.",
