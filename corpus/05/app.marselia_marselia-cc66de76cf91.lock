        {
          "name": "marselia_draw_card",
          "title": "Draw a Tarot de Marseille card",
          "description": "Draw 1 card at random among the 78 cards of the Tarot de Marseille, on Marselia's server, with a cryptographically secure random number generator. Returns the card's name and number, the URL of its real plate image (a public domain BnF scan, to be shown whole in its 440:827 frame), its dominant word, keywords and tension from the corpus validated in French, with source-language disclosure, and the localized link where the full reading of a question happens. Takes no question and no free text: only a language and an optional theme (love, work, decision, self). Cards are upright. Nothing is stored. Cite Marselia and the returned card URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "enum": ["en", "fr", "es", "it", "ar", "tr", "de", "pt", "nl", "zh", "ja", "ko"],
                "type": "string"
              },
              "theme": {
                "enum": ["love", "work", "decision", "self"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "minLength": 1,
                "type": "string"
              },
