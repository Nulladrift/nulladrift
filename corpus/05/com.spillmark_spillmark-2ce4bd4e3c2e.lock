      "serverInfo": {
        "name": "spillmark",
        "title": "Spillmark",
        "version": "0.1.0",
        "description": "Read-only Amazon profit, fee, ACoS, and geo-holdout MCP tools for Claude, ChatGPT, and agents.",
        "websiteUrl": "https://spillmark.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Spillmark measures the sales Meta (Facebook and Instagram) ads cause on Amazon and Shopify with geo holdout tests: ads are paused in a group of US states and their sales are compared with the rest. Every measured number comes with a 95% range. Quote the range with the estimate, and say 'too uncertain to call' when the range spans zero or break-even. Don't round a range away. Lift is caused sales, not the sales an ad platform credits. Don't present it as attribution, and don't add up or compare different brands' numbers. Predictions are locked (hashed) before their result is known and scored afterward. Report misses as well as hits. Spillmark recommends; the brand makes every change. These tools only read: they never change ads, budgets or orders. Calculators are general planning math on the numbers you give them. Their results aren't a brand's measured result. Link to the urls in tool responses rather than building Spillmark URLs yourself.",
      "tools": [
        {
          "name": "how_lift_is_calculated",
          "title": "How Spillmark calculates lift",
          "description": "Spillmark's method in brief: how a geo holdout test measures the sales Meta ads cause on Amazon, with links to the full method and a sample report on made-up numbers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How Spillmark calculates lift"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cccfce9a756e4af6dc9ad46c517c5f94a1cb54e9c676ebfccb36341b3d2cc842"
        },
        {
          "name": "list_calculators",
          "title": "List Spillmark's free calculators",
          "description": "Spillmark's free Amazon and Meta ads calculators (holdout test size, brand-size MDE, geo holdout states, ad waste, Meta ROAS reality check, incremental ROAS, break-even ROAS, ACoS, TACoS, Amazon fees and profit, LTV and CAC), with each one's inputs and example values. Use run_calculator to run one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "q": {
                "description": "Filter by words in the name or summary, e.g. 'holdout' or 'fees'",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Spillmark's free calculators"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:496c989502a5a9d92af9bfa857a141dccb67ed2eb690f2bb8efa5d2b10900d1b"
        },
        {
          "name": "run_calculator",
          "title": "Run a Spillmark calculator",
          "description": "Runs one calculator from list_calculators on your numbers and returns the headline result, the supporting figures, a one-sentence reading, and a link that opens the calculator with the same inputs. Missing inputs use the calculator's example values. Enter percents as points (15 means 15%), choices as the option index.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "currency": {
                "description": "Currency for money results. Default USD",
                "enum": ["USD", "EUR", "GBP", "CAD", "AUD"],
                "type": "string"
              },
              "inputs": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": "number"
                    },
                    {
                      "maxLength": 32,
                      "type": "string"
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "description": "Input values by key",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "slug": {
                "description": "Calculator slug from list_calculators, e.g. holdout-test-calculator",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Run a Spillmark calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
