{
  "lockfileVersion": 2,
  "subjects": {
    "app.mathapex/worksheets": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.mathapex.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mathapex-worksheets",
        "title": "MathApex Worksheets",
        "version": "1.0.1",
        "websiteUrl": "https://www.mathapex.app/en/worksheets/generator/",
        "icons": [
          {
            "src": "https://www.mathapex.app/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          },
          {
            "src": "https://www.mathapex.app/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "MathApex Worksheets creates printable primary-school math worksheets (grades 1–4) with a full answer key, in German, English, French and Spanish. The numbers and answers come from the MathApex worksheet generator, not from a language model. The topic list shows what each grade offers and which grade each choice is printed for; the printed grade follows the content (range 20 is grade 1, 100 grade 2, 1000 grade 3). Every sheet comes with a print link that opens the same sheet on mathapex.app as two A4 pages (tasks, then answers), ready to print or save as PDF.",
      "tools": [
        {
          "name": "create_worksheet",
          "title": "Create a math worksheet",
          "description": "Creates one printable math worksheet: five tasks, a brain teaser and a wide task, with the full answer key and a link that opens the same sheet as two A4 pages for printing. addition, subtraction and plus-minus take range 20, 100 or 1000; place-value takes range 100, 1000 or 1000000; times and division take table 2–10 or 'mixed'; written, quantities, word-problems and geometry take one of the foci listed in the focus parameter. With a grade and no range, table or focus, the sheet of that grade is chosen; a note in the result says when a sheet is printed for another grade. The same seed always gives the same sheet; without a seed the numbers are new.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "focus": {
                "description": "Focus for written, quantities, word-problems and geometry.",
                "enum": ["addition", "subtraction", "addition-million", "subtraction-million", "multiplication", "division", "money", "length", "mass", "capacity", "time", "shopping", "proportion", "data", "riddles", "combinations", "area", "perimeter", "symmetry", "solids", "angles"],
                "type": "string"
              },
              "grade": {
                "description": "School grade 1–4 the user asked for. Chooses the matching range when none is given; the printed grade still follows the content.",
                "enum": [1, 2, 3, 4],
                "type": "number"
              },
              "language": {
                "description": "Language of the sheet: de (German school notation), en (US school notation), fr or es.",
                "enum": ["de", "en", "fr", "es"],
                "type": "string"
              },
              "range": {
                "description": "Number range for addition, subtraction, plus-minus (20, 100, 1000) and place-value (100, 1000, 1000000).",
                "enum": [20, 100, 1000, 1000000],
                "type": "number"
              },
              "seed": {
                "description": "Optional number 1–999999 that reproduces a sheet; without it the sheet gets new numbers.",
                "maximum": 999999,
                "minimum": 1,
                "type": "integer"
              },
              "table": {
                "description": "Times table 2–10 or 'mixed', for times and division.",
                "enum": [2, 3, 4, 5, 6, 7, 8, 9, 10, "mixed"],
                "type": ["integer", "string"]
              },
              "topic": {
                "description": "Worksheet topic.",
                "enum": ["addition", "subtraction", "plus-minus", "times", "division", "place-value", "written", "quantities", "word-problems", "geometry"],
                "type": "string"
              }
            },
            "required": ["language", "topic"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "gradeNote": {
                "type": "string"
              },
              "language": {
                "enum": ["de", "en", "fr", "es"],
                "type": "string"
              },
              "printUrl": {
                "type": "string"
              },
              "printedGrade": {
                "type": "string"
              },
              "request": {
                "additionalProperties": false,
                "properties": {
                  "focus": {
                    "enum": ["addition", "subtraction", "addition-million", "subtraction-million", "multiplication", "division", "money", "length", "mass", "capacity", "time", "shopping", "proportion", "data", "riddles", "combinations", "area", "perimeter", "symmetry", "solids", "angles"],
                    "type": "string"
                  },
                  "range": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "seed": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "table": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "const": "mixed",
                        "type": "string"
                      }
                    ]
                  },
                  "topic": {
                    "enum": ["addition", "subtraction", "plus-minus", "times", "division", "place-value", "written", "quantities", "word-problems", "geometry"],
                    "type": "string"
                  }
                },
                "required": ["seed", "topic"],
                "type": "object"
              },
              "sheet": {
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["language", "printUrl", "printedGrade", "request", "sheet", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create a math worksheet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c0ca3c58657d00e6de8c19dbf8d4441b22f786ca0f5b1347314461c1b003039f"
        },
        {
          "name": "list_worksheet_topics",
          "title": "List worksheet topics",
          "description": "Lists the worksheet topics and their choices (number range, times table or focus), optionally only those offered for one school grade (1–4). Labels come in the requested language.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "grade": {
                "description": "School grade 1–4; only the topics and choices offered for this grade are listed.",
                "enum": [1, 2, 3, 4],
                "type": "number"
              },
              "language": {
                "description": "Language of the sheet: de (German school notation), en (US school notation), fr or es.",
                "enum": ["de", "en", "fr", "es"],
                "type": "string"
              }
            },
            "required": ["language"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "grades": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "grade": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "label": {
                      "type": "string"
                    },
                    "topics": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "choices": {
                            "items": {
                              "additionalProperties": false,
                              "properties": {
                                "label": {
                                  "type": "string"
                                },
                                "printedGrade": {
                                  "type": "string"
                                },
                                "value": {
                                  "type": ["number", "string"]
                                }
                              },
                              "required": ["label", "printedGrade", "value"],
                              "type": "object"
                            },
                            "type": "array"
                          },
                          "label": {
                            "type": "string"
                          },
                          "parameter": {
                            "enum": ["range", "table", "focus"],
                            "type": "string"
                          },
                          "topic": {
                            "enum": ["addition", "subtraction", "plus-minus", "times", "division", "place-value", "written", "quantities", "word-problems", "geometry"],
                            "type": "string"
                          }
                        },
                        "required": ["choices", "label", "parameter", "topic"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["grade", "label", "topics"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["grades"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List worksheet topics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:efa8438ade8c9be319219f2c8ba867c02e688da37be44fb23b81c6f10aaf8c84"
        }
      ],
      "digest": "sha256:964069ae1635b5e8ebfd0b8a4baf0ca7ed4d077af6743109f156a871437cfe02"
    }
  }
}
