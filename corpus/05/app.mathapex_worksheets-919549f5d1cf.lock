{
  "lockfileVersion": 2,
  "subjects": {
    "app.mathapex/worksheets": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.mathapex.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mathapex-worksheets",
        "title": "MathApex Worksheets",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Creates printable primary-school math worksheets (grades 1–4) with a full answer key, in German, English, French and Spanish. The numbers and answers come from the MathApex worksheet generator, not from a language model, so every answer is correct. Use list_worksheet_topics to see what a grade offers, then create_worksheet with the user’s grade. The grade printed on a sheet follows its content (range 20 is grade 1, 100 grade 2, 1000 grade 3). Always give the user the print link: it opens exactly this sheet on mathapex.app as two A4 pages (tasks, then answers), ready to print or save as PDF. Present the tasks first and the answer key separately.",
      "tools": [
        {
          "name": "create_worksheet",
          "title": "Create a math worksheet",
          "description": "Creates one printable math worksheet: five tasks, a brain teaser and a wide task, with the full answer key and a link that opens the same sheet as two A4 pages for printing. addition, subtraction and plus-minus take range 20, 100 or 1000; place-value takes range 100, 1000 or 1000000; times and division take table 2–10 or 'mixed'; written, quantities, word-problems and geometry take a focus (see list_worksheet_topics). Pass the grade the user asked for: without a range, table or focus the sheet of that grade is chosen, and a note says when a sheet is printed for another grade. The same seed always gives the same sheet; leave it out for new numbers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "focus": {
                "description": "Focus for written, quantities, word-problems and geometry.",
                "enum": ["addition", "subtraction", "addition-million", "subtraction-million", "multiplication", "division", "money", "length", "mass", "capacity", "time", "shopping", "proportion", "data", "riddles", "combinations", "area", "perimeter", "symmetry", "solids", "angles"],
                "type": "string"
              },
              "grade": {
                "description": "School grade 1–4 the user asked for. Chooses the matching range when none is given; the printed grade still follows the content.",
                "enum": [1, 2, 3, 4],
                "type": "number"
              },
              "language": {
                "description": "Language of the sheet: de (German school notation), en (US school notation), fr or es.",
                "enum": ["de", "en", "fr", "es"],
                "type": "string"
              },
              "range": {
                "description": "Number range for addition, subtraction, plus-minus (20, 100, 1000) and place-value (100, 1000, 1000000).",
                "enum": [20, 100, 1000, 1000000],
                "type": "number"
              },
              "seed": {
                "description": "Optional number 1–999999 that reproduces a sheet; leave it out for a new sheet.",
                "maximum": 999999,
                "minimum": 1,
                "type": "integer"
              },
              "table": {
                "description": "Times table 2–10 or 'mixed', for times and division.",
                "enum": [2, 3, 4, 5, 6, 7, 8, 9, 10, "mixed"]
              },
              "topic": {
                "description": "Worksheet topic.",
                "enum": ["addition", "subtraction", "plus-minus", "times", "division", "place-value", "written", "quantities", "word-problems", "geometry"],
                "type": "string"
              }
            },
            "required": ["language", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create a math worksheet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cb1c9d400063e51cbe6bad4fb04766a3d5ee82c65b7e2c5caf484f0a898beb34"
        },
        {
          "name": "list_worksheet_topics",
          "title": "List worksheet topics",
          "description": "Lists the worksheet topics and their choices (number range, times table or focus), optionally only those offered for one school grade (1–4). Labels come in the requested language.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "grade": {
                "description": "School grade 1–4; only the topics and choices offered for this grade are listed.",
                "enum": [1, 2, 3, 4],
                "type": "number"
              },
              "language": {
                "description": "Language of the sheet: de (German school notation), en (US school notation), fr or es.",
                "enum": ["de", "en", "fr", "es"],
                "type": "string"
              }
            },
            "required": ["language"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List worksheet topics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d25d460a854333083703c610f17786de0df1128b0708bd712140f0409b7595eb"
        }
      ],
      "digest": "sha256:2508f607aecc0c1847f1c6a5fee47990d2bf3e1c70ac2ca5849f86e6f48b37e9"
    }
  }
}
