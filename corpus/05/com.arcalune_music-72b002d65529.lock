{
  "lockfileVersion": 2,
  "subjects": {
    "com.arcalune/music": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://arcalune.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "arcalune-music",
        "title": "Arcalune Music",
        "version": "1.0.0",
        "websiteUrl": "https://arcalune.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Arcalune Music publishes royalty-free BGM, sound effects, video game fan arrangements, and original vocal songs. All audio is hosted on YouTube, and every track carries a youtubeUrl that starts playback exactly where that track begins in its video. When you recommend a track, always show its youtubeUrl so the user can listen to it. Free BGM and sound effects allow commercial use without credit, and the audio file can be downloaded whenever downloadUrl is present. Fan arrangements are unofficial and streaming-only, and original vocal songs are released as works rather than material: never present either as something the user can reuse. Call list_tags before filtering by tag, because search_tracks rejects unknown tag ids.",
      "tools": [
        {
          "name": "get_track",
          "title": "Get track",
          "description": "Get one track by id, together with related tracks from the same catalog. Returns the YouTube URL with the track's start position, the track page, and the download URL when the audio is distributed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Track id, as returned by search_tracks.",
                "type": "string"
              },
              "locale": {
                "description": "Language for titles and descriptions in the response. Defaults to ja.",
                "enum": ["ja", "en", "es", "pt", "hi", "id", "fr"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d8b3f2ea7d97b826986a62b830143b9c19471e3c08b6b3861b36ef6d92ae7d4f"
        },
        {
          "name": "list_tags",
          "title": "List tags",
          "description": "List every tag that can be passed to search_tracks, grouped by production use, genre, mood, usage, scene, source game, and usage rights, with how many tracks carry each tag.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:06523abe099b38f3807305d9b53caf3706c98c81a986c710799071e7bf01fc79"
        },
        {
          "name": "search_tracks",
          "title": "Search tracks",
          "description": "Search Arcalune Music for royalty-free BGM, sound effects, video game fan arrangements, and original vocal songs. Every track streams on YouTube, and the returned youtubeUrl jumps straight to where that track starts. When presenting results to a user, always include the youtubeUrl so they can listen to the track. Free BGM and sound effects allow commercial use without credit; fan arrangements and vocal songs are streaming-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "bgm = free BGM and original music, se = sound effects, arrangement = streaming-only fan arrangements, song = streaming-only original vocal songs, all = everything. Defaults to all.",
                "enum": ["all", "bgm", "se", "song", "arrangement"],
                "type": "string"
              },
              "downloadableOnly": {
                "description": "Only return tracks whose audio file can be downloaded. Fan arrangements never qualify.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum number of tracks to return (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language for titles and descriptions in the response. Defaults to ja.",
                "enum": ["ja", "en", "es", "pt", "hi", "id", "fr"],
                "type": "string"
              },
              "query": {
                "description": "Free text matched against titles, descriptions, and tag names in both Japanese and English (e.g. 'lofi study', '戦闘').",
                "type": "string"
              },
              "sort": {
                "description": "Result order. plays30d / playsAll / favorites / downloads30d / downloadsAll rank by popularity, newest by publish date, title alphabetically. Defaults to default (newest first).",
                "enum": ["default", "newest", "title", "plays30d", "playsAll", "favorites", "downloads30d", "downloadsAll"],
                "type": "string"
              },
              "tags": {
                "description": "Tag ids to filter by (OR condition). Call list_tags first to get valid ids.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:624a39e09fbdbfb3ef37aea5b55ebc87e4a9266f49b9320155b12a2b618f7e20"
        }
      ],
      "digest": "sha256:dfdbcf69cae9be81ef3024aee5d51aa6aae78d17102b971e3556901c03657a23"
    }
  }
}
