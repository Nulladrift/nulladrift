{
  "lockfileVersion": 2,
  "subjects": {
    "com.lordevo/agent-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lordevo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lordevo-agent-directory",
        "title": "Lordevo Agent Directory",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use search_services to find a service (verified=true and sort=price|latency narrow it to checked x402 quotes), list_verified for checked x402 endpoints cheapest first, get_service for details, then call the provider's endpoint directly. x402 listings are paid per call in USDC on Base (HTTP 402 flow); Lordevo never proxies payments. Listings labelled \"Lordevo service\" are operated by Lordevo, which runs this directory, and get no ranking boost in keyword search. compare_services puts 2-4 listings side by side with measured values only.",
      "tools": [
        {
          "name": "compare_services",
          "title": "Compare listings",
          "description": "Compare 2-4 listings side by side: listed price, last verified 402 quote, speed and uptime from our own checks (anything we have not measured says \"not measured\" with the reason), auth, transport and verified seller. Read-only.",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "Listing ids from search_services, in the order to show them",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:18104b3467237d0cc3aeb89d9b59c97ae897da7d80bb3a4e3ceee83981a4eecb"
        },
        {
          "name": "get_service",
          "title": "Get one listing",
          "description": "Full details of one listing by id (from search_services).",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:334c5835efd538c832aaa4c4ca71108fb399fbea73fe46b6d23336e595a1ebf9"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Categories in the directory with listing counts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f749eeff4c57d149f7499f13d5ee2b2a5499eb854caef9fe832014ec22056450"
        },
        {
          "name": "list_verified",
          "title": "List verified x402 services",
          "description": "x402 pay-per-call endpoints whose live unpaid HTTP 402 quote equals the listed price, with latency and last check time. Cheapest first by default. Read-only; Lordevo checks without paying.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "type": "number"
              },
              "q": {
                "description": "Optional keywords",
                "type": "string"
              },
              "sort": {
                "enum": ["relevance", "price", "latency"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de61ea5449f4636cbba1a0b3cee66279fcb3ac1d4fd2c7f7e51db741d52e6b7b"
        },
        {
          "name": "search_services",
          "title": "Search the Lordevo Agent Directory",
          "description": "Find APIs, x402 pay-per-call endpoints (USDC on Base) and MCP servers by keyword. Returns endpoint, price, payment method, auth and docs for each result. Read-only.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "kind": {
                "enum": ["http", "mcp", "api"],
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Max USD per call",
                "type": "number"
              },
              "payment": {
                "enum": ["x402", "apikey", "free"],
                "type": "string"
              },
              "q": {
                "description": "What you need, in plain words",
                "type": "string"
              },
              "sort": {
                "description": "relevance (default), price = cheapest first, latency = fastest first",
                "enum": ["relevance", "price", "latency"],
                "type": "string"
              },
              "verified": {
                "description": "Only x402 listings whose live 402 quote equals the listed price",
                "type": "boolean"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da3b4bf6ee701eb1d8f2284630f3f9e4b511940c84b3348d9829fca23d2b1a8e"
        }
      ],
      "digest": "sha256:3531eedffc418dd9a3cc524760f4e5c61d5d756e1fb73a80a6c22e9161097463"
    }
  }
}
