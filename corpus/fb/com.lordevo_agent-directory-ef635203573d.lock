{
  "lockfileVersion": 2,
  "subjects": {
    "com.lordevo/agent-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lordevo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lordevo-agent-directory",
        "title": "Lordevo Agent Directory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use search_services to find a service, get_service for details, then call the provider's endpoint directly. x402 listings are paid per call in USDC on Base (HTTP 402 flow). Listings labelled \"Lordevo service\" are operated by Lordevo, which runs this directory.",
      "tools": [
        {
          "name": "get_service",
          "title": "Get one listing",
          "description": "Full details of one listing by id (from search_services).",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:334c5835efd538c832aaa4c4ca71108fb399fbea73fe46b6d23336e595a1ebf9"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Categories in the directory with listing counts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f749eeff4c57d149f7499f13d5ee2b2a5499eb854caef9fe832014ec22056450"
        },
        {
          "name": "search_services",
          "title": "Search the Lordevo Agent Directory",
          "description": "Find APIs, x402 pay-per-call endpoints (USDC on Base) and MCP servers by keyword. Returns endpoint, price, payment method, auth and docs for each result. Read-only.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "kind": {
                "enum": ["http", "mcp", "api"],
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Max USD per call",
                "type": "number"
              },
              "payment": {
                "enum": ["x402", "apikey", "free"],
                "type": "string"
              },
              "q": {
                "description": "What you need, in plain words",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7296358f951b3f9b0d0bbc5e87be653fbe1ec565a8dc4e2184d5777f75b4bd87"
        }
      ],
      "digest": "sha256:ffd08f0123653ed40b7529070bbe5a2695fa03d5e7521b1ab8203218f395e545"
    }
  }
