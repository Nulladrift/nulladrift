          },
          "digest": "sha256:dd2a9f084373915e41daed60460d9776f59638cf506bc53fbe36c59d31e4bbca"
        },
        {
          "name": "get_tour",
          "title": "Tour details and price",
          "description": "Details for one tour: what it includes, ages, fitness, what to bring, how long the outing takes from hotels in Montego Bay, Ocho Rios and Negril (fromHotelAndBack; duration is the time at the activity, or Full day / Half day), the exact total for a party size, and the earliest bookable date. Read-only.",
          "inputSchema": {
            "properties": {
              "guests": {
                "description": "Party size to price, default 2",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "pickup_hotel": {
                "description": "Where the traveller is staying (hotel or area). Some tours are priced by pickup area",
                "type": "string"
              },
              "tour": {
                "description": "Tour title or slug from list_tours",
                "type": "string"
              }
            },
            "required": ["tour"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Tour details and price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfcc2744900349917cff5e98c5417ba1fcede9e7bbe69e9ed6cf4baf79740eeb"
        },
        {
          "name": "get_transfer_quote",
          "title": "Price an airport ride",
          "description": "Exact all-in price in USD for a private airport transfer between Sangster International Airport (MBJ) and a hotel or villa, per vehicle for up to 4 passengers (5 to 7 priced per person; 8 or more are quoted by email at contact@mapltours.com). Round trip or one way, either direction. Also says how long before the flight home the hotel pickup should be. Use before start_transfer_booking. Read-only.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Hotel or villa name, or an id from find_transfer_destination",
                "type": "string"
              },
              "direction": {
                "description": "One-way only. Default airport_to_hotel",
                "enum": ["airport_to_hotel", "hotel_to_airport"],
                "type": "string"
              },
              "passengers": {
                "description": "Number of passengers, 1 to 7. Default 2",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "trip_type": {
                "description": "Default round_trip (airport to hotel and back)",
                "enum": ["round_trip", "one_way"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price an airport ride"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4722c8e643e5327af088c67dfd90f39080de2e9f0aeb56f2bada9a11ad2e497a"
        },
        {
          "name": "list_tours",
          "title": "List tours",
          "description": "List the 20 private tours and day packages MAPL Tours Jamaica runs in Jamaica (Dunn's River, Blue Hole, bamboo rafting, Rick's Cafe, zipline, ATV, horseback and more). fromPriceUsd is the price for the smallest party; priceUnit says whether it covers a party of up to N people or one person. Use get_tour with guests for the exact total. Hotel pickup included. Optional keyword or area filter; returns up to 12 rows. Read-only. duration is time at the activity; get_tour adds hotel-and-back times.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "Town or area, e.g. \"Ocho Rios\", \"Negril\", \"Montego Bay\"",
                "type": "string"
              },
              "query": {
                "description": "Keyword, e.g. \"waterfall\", \"rafting\", \"sunset\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List tours"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e5bbcefeb05853506419305c5ff900121727f715c68db6632eec5bf5159ed20"
        },
        {
          "name": "start_tour_booking",
          "title": "Get a booking link for a tour",
          "description": "Make a mapltours.com booking link for a tour or day package on a date for a party size. The traveller opens it and lands on checkout with the tour, date and guests filled in; they add contact details, accept the activity waiver and pay there. Books and charges nothing by itself. Needs 12 hours' notice; get_tour gives the earliest date and the exact price. Confirm tour, date, guests and price with the traveller first.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Tour date \"YYYY-MM-DD\" (Jamaica); needs 12 hours' notice, get_tour gives the earliest date",
                "type": "string"
              },
              "guests": {
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "pickup_hotel": {
                "description": "Where the traveller is staying, for the hotel pickup",
                "type": "string"
              },
              "tour": {
                "description": "Tour title or slug from list_tours",
                "type": "string"
              }
            },
            "required": ["date", "guests", "tour"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a booking link for a tour"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c817124a47f323f97f1c096bd6bf15dd6bd7eda483a9d8000385176f6be55936"
        },
        {
          "name": "start_transfer_booking",
          "title": "Get a booking link for a ride",
          "description": "Make a mapltours.com booking link for an airport transfer. The traveller opens it and lands on checkout with the hotel, trip type, passengers, flights and times filled in; they add name, email and phone and pay there (card, Apple Pay, Google Pay or Link). Books and charges nothing by itself. A one-way needs direction: airport_to_hotel takes arrival_at and arrival_flight; hotel_to_airport takes departure_at (or departure_flight_at) and departure_flight. Confirm the details and the price from get_transfer_quote with the traveller first.",
          "inputSchema": {
            "properties": {
              "arrival_at": {
                "description": "Flight arrival at MBJ, \"YYYY-MM-DDTHH:MM\" Jamaica time",
                "type": "string"
              },
              "arrival_flight": {
                "description": "Arrival flight number, e.g. AA1234",
                "type": "string"
              },
              "departure_at": {
                "description": "Hotel pickup for the flight home, \"YYYY-MM-DDTHH:MM\" Jamaica time. If you only know the flight time, pass departure_flight_at instead",
                "type": "string"
              },
              "departure_flight": {
                "description": "Departure flight number",
                "type": "string"
              },
              "departure_flight_at": {
                "description": "Flight home departs MBJ, \"YYYY-MM-DDTHH:MM\" Jamaica time; pickup is set 3 hours 30 minutes earlier",
                "type": "string"
              },
              "destination": {
                "description": "Hotel or villa name, or id from find_transfer_destination",
                "type": "string"
              },
              "direction": {
                "description": "Required for a one-way",
                "enum": ["airport_to_hotel", "hotel_to_airport"],
                "type": "string"
              },
              "passengers": {
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "trip_type": {
                "enum": ["round_trip", "one_way"],
                "type": "string"
              }
            },
            "required": ["destination", "passengers", "trip_type"],
            "type": "object"
          },
          "annotations": {
