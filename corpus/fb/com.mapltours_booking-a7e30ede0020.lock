      },
      "serverInfo": {
        "name": "mapltours-jamaica",
        "title": "MAPL Tours Jamaica",
        "version": "1.0.0",
        "websiteUrl": "https://mapltours.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MAPL Tours Jamaica runs private airport transfers between Sangster International Airport (MBJ), Montego Bay, and hotels and villas across Montego Bay, Negril, Ocho Rios, Falmouth and Lucea, plus private tours with hotel pickup. Every price comes from the live rate card, all-in, in US dollars; never quote one these tools did not return. A ride: find_transfer_destination, get_transfer_quote (its bookingUrl opens checkout with that ride filled in), check_transfer_timing, then start_transfer_booking for a checkout link with flights and times too. A tour: list_tours, get_tour, then start_tour_booking. Times are Jamaica local time (UTC-5, no daylight saving) written \"YYYY-MM-DDTHH:MM\". Tell the traveller the price and the cancellation terms (get_booking_terms) and get their yes before booking.",
      "tools": [
        {
          "name": "book_and_pay_transfer",
          "title": "Book and pay for a ride",
          "description": "Book an airport transfer and pay for it now with a Stripe shared payment token (spt_...) the traveller approved, for example from their Link wallet. CHARGES the traveller. Before calling: get the exact price with get_transfer_quote, tell the traveller the price and the cancellation terms (get_booking_terms), and get their explicit yes; pass that price as approved_total_usd. Needs every flight number and time the ride has, and the traveller's name, email and phone. An identical ride that is already paid is reported, never charged twice. Returns the booking reference; the confirmation email follows.",
          "inputSchema": {
            "properties": {
              "approved_total_usd": {
                "description": "The total in USD the traveller approved; must equal the price from get_transfer_quote",
                "type": "number"
              },
              "arrival_at": {
                "description": "Flight arrival at MBJ, \"YYYY-MM-DDTHH:MM\" Jamaica time",
                "type": "string"
              },
              "arrival_flight": {
                "description": "Arrival flight number, e.g. AA1234",
                "type": "string"
              },
              "departure_at": {
                "description": "Hotel pickup for the flight home, \"YYYY-MM-DDTHH:MM\" Jamaica time. If you only know the flight time, pass departure_flight_at instead",
                "type": "string"
              },
              "departure_flight": {
                "description": "Departure flight number",
                "type": "string"
              },
              "departure_flight_at": {
                "description": "Flight home departs MBJ, \"YYYY-MM-DDTHH:MM\" Jamaica time; pickup is set 3 hours 30 minutes earlier",
                "type": "string"
              },
              "destination": {
                "description": "Hotel or villa name, or id from find_transfer_destination",
                "type": "string"
              },
              "direction": {
                "description": "Required for a one-way",
                "enum": ["airport_to_hotel", "hotel_to_airport"],
                "type": "string"
              },
              "guest": {
                "description": "The traveller the booking is for",
                "properties": {
                  "email": {
                    "description": "Where the confirmation and driver details are sent",
                    "type": "string"
                  },
                  "first_name": {
                    "type": "string"
                  },
                  "last_name": {
                    "type": "string"
                  },
                  "phone": {
                    "description": "Mobile number with country code, e.g. +1 305 555 0142",
                    "type": "string"
                  }
                },
                "required": ["email", "first_name", "last_name", "phone"],
                "type": "object"
              },
              "passengers": {
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "shared_payment_token": {
                "description": "Stripe shared payment token (spt_...) granted to MAPL Tours Jamaica for at least this amount in USD",
                "type": "string"
              },
              "special_requests": {
                "description": "Optional note for the driver, e.g. a car seat",
                "type": "string"
              },
              "trip_type": {
                "enum": ["round_trip", "one_way"],
                "type": "string"
              }
            },
            "required": ["approved_total_usd", "destination", "guest", "passengers", "shared_payment_token", "trip_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book and pay for a ride"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a04c1a47baa0d824efa73fd7fd235b46d19e2aadc4d0617f6d27a3acaee69844"
        },
        {
          "name": "check_transfer_timing",
          "title": "Check pickup timing",
          "description": "Check whether a pickup can be booked online. Bookings need 12 hours' notice in Jamaica time. Give arrival_at (flight lands at MBJ) and, for the flight home, departure_at (hotel pickup) or departure_flight_at (flight departs; the pickup is worked out from it), each as \"YYYY-MM-DDTHH:MM\" Jamaica local time with no timezone suffix. Returns whether each leg is bookable and the earliest bookable time. Read-only.",
          "inputSchema": {
            "properties": {
              "arrival_at": {
                "description": "Flight arrival at MBJ, \"YYYY-MM-DDTHH:MM\" Jamaica time",
                "type": "string"
              },
              "departure_at": {
                "description": "Hotel pickup for the flight home, \"YYYY-MM-DDTHH:MM\" Jamaica time",
                "type": "string"
              },
              "departure_flight_at": {
                "description": "Flight home departs MBJ, \"YYYY-MM-DDTHH:MM\" Jamaica time; the hotel pickup is 3 hours 30 minutes earlier",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check pickup timing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0cbc43be2c97bf13aa2072a47ff6b00aee1a817ab00e47a54e601ebecca999cb"
        },
        {
          "name": "find_transfer_destination",
          "title": "Find a hotel or villa",
          "description": "Find hotels and villas MAPL Tours Jamaica drives to from Sangster International Airport (MBJ), Montego Bay, Jamaica. Returns up to 8 matches with the id to use in get_transfer_quote, or the \"Other hotel or villa\" id for each area when nothing matches. Covers 199 properties from Montego Bay to Negril, Ocho Rios, Falmouth and Lucea. Kingston, Port Antonio and Mandeville are quoted by email instead.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Hotel, villa, resort or town name, e.g. \"Sandals Negril\" or \"Ocho Rios\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a hotel or villa"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b78f8098973651dc6927dbd75236545effac37c420dce066b65affcaaff0217"
        },
        {
          "name": "get_booking_terms",
          "title": "Booking terms",
          "description": "What a MAPL Tours Jamaica booking includes and the rules that apply: all-in pricing, notice needed, flight tracking, cancellation and refunds, payment methods and contact. Tell the traveller the cancellation terms before they book. Read-only.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Booking terms"
          },
          "behavior": {
