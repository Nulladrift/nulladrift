  "subjects": {
    "com.mapltours/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mapltours.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
