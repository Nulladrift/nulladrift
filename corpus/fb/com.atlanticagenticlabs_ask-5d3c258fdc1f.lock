        {
          "name": "search_docs",
          "title": "Search the LightHouse documentation",
          "description": "Search Atlantic's public LightHouse™ documentation, including the API reference (OpenAPI) and the MCP tool reference. Use it for any question about what LightHouse does and how: connectors, agents, approvals, spend limits, evidence, security, deployment, the API, the MCP server and the CLI. Returns up to `limit` passages, best first, each quoted exactly with a deep link (`url`), the docs version and build date; `covered` is false when the documentation does not answer the query. Quote the passages and cite their links; for the whole page call read_page with the link. Read only: no answer is generated and nothing is changed.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many passages to return (1 to 8).",
                "maximum": 8,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in plain words or the exact terms the documentation would use. One topic per call. Examples: \"how are approvals enforced\", \"connect Amazon S3\", \"POST /api/v1/keys\", \"hosted MCP OAuth scopes\".",
                "maxLength": 300,
                "minLength": 1,
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_docsArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Evidence": {
                "properties": {
                  "produced": {
                    "description": "How the result was produced: `quoted` (passages quoted exactly, no model) or `none`.",
                    "title": "Produced",
                    "type": "string"
                  },
                  "question": {
                    "description": "The query as recorded, after redaction.",
                    "title": "Question",
                    "type": "string"
                  },
                  "sources": {
                    "items": {
                      "$ref": "#/$defs/Source"
                    },
                    "title": "Sources",
                    "type": "array"
                  }
                },
                "required": ["produced", "question", "sources"],
                "title": "Evidence",
                "type": "object"
              },
              "Source": {
                "description": "One passage, quoted exactly as published, with where it came from.",
                "properties": {
                  "collection": {
                    "description": "`docs` (the public documentation) or `knowledge` (a published item).",
                    "title": "Collection",
                    "type": "string"
                  },
                  "date": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Docs build date, or the item's publication date (YYYY-MM-DD).",
                    "title": "Date"
                  },
                  "n": {
                    "description": "The passage's number in this result, from 1.",
                    "title": "N",
                    "type": "integer"
                  },
                  "quote": {
                    "description": "The passage, exactly as published.",
                    "title": "Quote",
                    "type": "string"
                  },
                  "section": {
                    "description": "The heading the passage sits under; empty for the page's opening.",
                    "title": "Section",
                    "type": "string"
                  },
                  "sha256": {
                    "description": "SHA-256 of `quote`, hex.",
                    "title": "Sha256",
                    "type": "string"
                  },
                  "title": {
                    "description": "The page or item's title.",
                    "title": "Title",
                    "type": "string"
                  },
                  "url": {
                    "description": "Deep link to the passage's page and section. Cite this.",
                    "title": "Url",
                    "type": "string"
                  },
                  "version": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Docs release, or the item's published revision (r<n>).",
                    "title": "Version"
                  }
                },
                "required": ["collection", "date", "n", "quote", "section", "sha256", "title", "url", "version"],
                "title": "Source",
                "type": "object"
              }
            },
            "properties": {
              "covered": {
                "description": "Whether the published material answers the query. False: say it is not covered.",
                "title": "Covered",
                "type": "boolean"
              },
              "evidence": {
                "$ref": "#/$defs/Evidence"
              },
              "note": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A fixed note, where one applies.",
                "title": "Note"
              },
              "query": {
                "description": "The query as searched, after redaction.",
                "title": "Query",
                "type": "string"
              },
              "receipt": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "An Ed25519 receipt over the passages, verifiable against https://ask.atlanticagenticlabs.com/.well-known/octy-keys.json; null if unsigned.",
                "title": "Receipt"
              },
              "results": {
                "description": "The best passages, best first; empty when not covered.",
                "items": {
                  "$ref": "#/$defs/Source"
                },
                "title": "Results",
                "type": "array"
              },
              "source": {
                "description": "What was searched.",
                "title": "Source",
                "type": "string"
              }
            },
            "required": ["covered", "evidence", "query", "results", "source"],
            "title": "SearchResult",
            "type": "object"
          },
