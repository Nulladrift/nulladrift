      "serverInfo": {
        "name": "com.atlanticagenticlabs/ask",
        "title": "Atlantic Agentic Labs",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Atlantic Agentic Labs' public, read-only research server. Atlantic Agentic Labs builds and runs AI agents for enterprises; LightHouse™ is its product for operating them (usage and cost, approvals, evidence, knowledge and the Octy™ assistant). Use these tools to answer questions about Atlantic and LightHouse from what Atlantic has published.\n\nHow to use it: call search_docs for anything about LightHouse, its API, its MCP server, its CLI, connectors, security or deployment; call search_published_knowledge for how Atlantic works (engagements, partners, positioning). Each returns passages quoted exactly, each with a deep link, a version and a date: quote them and cite the link. When a passage is not enough, call read_page with its URL for the whole page. Call list_pages to see every public page by section.\n\nWhat it will not do: it generates no answers, gives no prices or commercial terms, makes no commitments on Atlantic's behalf, contacts no one and hands nothing off, reads no customer's data and changes nothing. Results marked covered=false mean the public material does not answer the query: say so rather than guess. Requests are limited per caller and overall; on HTTP 429 wait for the Retry-After seconds before trying again.",
      "tools": [
        {
          "name": "list_pages",
          "title": "List the public documentation pages",
          "description": "The public documentation's table of contents: for each page its section, title, path, URL and a one-line description, in the order the site shows them, with the list of sections. Use it to find the right page before read_page, or to see what the documentation covers. Optional `section` (one of the returned `sections`, matched without regard to case) narrows the list.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 500,
                "description": "At most this many pages.",
                "maximum": 2000,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "section": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A section name from `sections`; omit for every page.",
                "title": "Section"
              }
            },
            "title": "list_pagesArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "PageEntry": {
                "properties": {
                  "description": {
                    "description": "One line on what the page covers.",
                    "title": "Description",
                    "type": "string"
                  },
                  "path": {
                    "description": "The page's path; pass it to read_page.",
                    "title": "Path",
                    "type": "string"
                  },
                  "section": {
                    "description": "The documentation section, as the sidebar names it.",
                    "title": "Section",
                    "type": "string"
                  },
                  "title": {
                    "title": "Title",
                    "type": "string"
                  },
                  "url": {
                    "title": "Url",
                    "type": "string"
                  }
                },
                "required": ["description", "path", "section", "title", "url"],
                "title": "PageEntry",
                "type": "object"
              }
            },
            "properties": {
              "built_at": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Built At"
              },
              "docs_version": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Docs Version"
              },
              "pages": {
                "items": {
                  "$ref": "#/$defs/PageEntry"
                },
                "title": "Pages",
                "type": "array"
              },
              "sections": {
                "items": {
                  "type": "string"
                },
                "title": "Sections",
                "type": "array"
              },
              "site": {
                "title": "Site",
                "type": "string"
              },
              "total": {
                "description": "How many pages matched, before the limit.",
                "title": "Total",
                "type": "integer"
              }
            },
            "required": ["built_at", "docs_version", "pages", "sections", "site", "total"],
            "title": "PageList",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:515eb076432a42279de7309c0bdc6d955d4950997013c08f25d8575aa52b258f"
        },
        {
          "name": "read_page",
          "title": "Read one documentation page",
          "description": "One public documentation page as Markdown, exactly as published, with its title, canonical URL, section and the date it last changed. Pass a path or URL that list_pages or a search result gave, such as \"/mcp/public/\" or \"https://docs.atlanticagenticlabs.com/mcp/public/\". Only pages of the public documentation site are served: any other address, and any page not in the published index, is refused. A very long page is truncated, with a note and the URL of the full page.",
          "inputSchema": {
            "properties": {
              "path": {
                "description": "The page's path or full URL on docs.atlanticagenticlabs.com.",
                "maxLength": 512,
                "minLength": 1,
                "title": "Path",
                "type": "string"
              }
            },
            "required": ["path"],
            "title": "read_pageArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "characters": {
                "description": "The page's full length in characters.",
                "title": "Characters",
                "type": "integer"
              },
              "docs_version": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Docs Version"
              },
              "last_updated": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "When the page last changed (YYYY-MM-DD).",
                "title": "Last Updated"
              },
              "markdown": {
                "description": "The page as Markdown, exactly as published (truncated when very long).",
                "title": "Markdown",
                "type": "string"
              },
              "note": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Note"
              },
              "path": {
                "title": "Path",
                "type": "string"
              },
              "section": {
                "title": "Section",
                "type": "string"
              },
              "title": {
                "title": "Title",
                "type": "string"
              },
              "truncated": {
                "title": "Truncated",
                "type": "boolean"
              },
              "url": {
                "description": "The page's canonical URL. Cite this.",
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["characters", "docs_version", "last_updated", "markdown", "path", "section", "title", "truncated", "url"],
            "title": "Page",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
