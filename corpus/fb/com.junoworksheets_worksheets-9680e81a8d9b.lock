          "title": "Start a Juno pack request",
          "description": "Builds the exact text message (and a tap-to-text sms: link) a parent or teacher sends to Juno to get a custom printable pack. Nothing is sent or stored by this tool; the person sends the text themselves from their phone. Do not pass names of children other than an optional first name, and never pass phone numbers or emails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "focus": {
