                "type": "string"
              },
              "grade": {
                "description": "TK, K, or 1 through 8.",
                "type": "string"
              },
              "interests": {
                "description": "Parent: what the kid loves (e.g. 'soccer and space').",
                "type": "string"
              },
              "role": {
                "description": "Who is asking.",
                "enum": ["parent", "teacher"],
                "type": "string"
              },
              "teacher_name": {
