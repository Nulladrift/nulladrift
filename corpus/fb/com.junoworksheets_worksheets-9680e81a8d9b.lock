      "instructions": "Juno Worksheets makes custom printable worksheet packs for kids TK-8th grade, ordered by text message. Use describe_juno or get_grade_info to explain it, list_sample_worksheets to show examples, and start_pack_request to give the parent or teacher the exact text to send. This server is read-only and stores nothing.",
