{
  "lockfileVersion": 2,
  "subjects": {
    "ai.greyridgesignals/business-verification-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://business-verification-mcp.sigrunner.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "greyridge-business-verification-mcp",
        "version": "0.6.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "US business verification (KYB) against official, keyless state business-registry sources plus an OFAC SDN sanctions screen. This free server returns a verification TASTE per match — matched + official entity_name + normalized status + match_confidence + risk flags (has_active_liens, OFAC verdict, injection screen) — enough to confirm a business is real and active. The identity-grade diligence fields (entity_id, registered_agent, principal_address, formation_date, full UCC-lien detail, OFAC hit detail, citable source_url) are delivered by the hosted batch rail linked in every result (see_also). Tool map: list_states for live coverage; verify_business when you have a NAME; lookup_entity when you hold the registry entity_id; search_entities to browse businesses under a name stem; screen_sanctions for an OFAC-only watchlist verdict. Keyless, no API key.",
      "tools": [
        {
          "name": "list_states",
          "description": "List the US states currently verifiable through this server (keyless, public-domain official registries) and how each is addressed. No network call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:da7b6a2be6e9d7f686ee3495097c2c816cf626e4c00c85bc8eb55976529b775e"
        },
        {
          "name": "lookup_entity",
          "description": "Authoritative lookup of ONE business by its registry entity_id within a state. Unlike verify_business this does NO fuzzy name matching — the entity_id is the registry primary key, so a hit is the single canonical row (match_confidence 1.0, match_tier \"exact_id\"). Returns the same FREE TASTE as a verified match (entity_name, normalized status, risk flags); the full diligence record (registered_agent, principal_address, formation_date, UCC-lien detail, OFAC hit detail, provenance source_url) is delivered by the hosted rail in see_also. WHEN TO USE: you already have an entity_id (e.g. from a prior verify_business or search_entities result) and want to re-resolve it exactly or refresh its status. If you only have a name, use verify_business or search_entities. matched=false (never fabricated) when the id is unknown or the state is unsupported.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entityId": {
                "description": "The registry entity_id to resolve (as returned in a prior result).",
                "type": "string"
              },
              "includeSanctions": {
                "default": true,
                "description": "Run the OFAC SDN screen on the resolved entity. Default true.",
                "type": "boolean"
              },
              "includeUcc": {
                "default": true,
                "description": "Attach the CO UCC-lien profile on a Colorado entity. Default true.",
                "type": "boolean"
              },
              "state": {
                "description": "Required 2-letter state the entity_id belongs to (NY, CO, CT).",
                "type": "string"
              }
            },
            "required": ["entityId", "state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:53bab621687ca26a43df91923738355718ff644bf419d19ba9d348ebfa2885c8"
        },
        {
          "name": "screen_sanctions",
          "description": "OFAC SDN sanctions screening / watchlist screen per name. Screen one or more names directly against the live OFAC SDN (Specially Designated Nationals) sanctions list — no state lookup. Returns per-name verdict (clear | potential_match | match), matched program(s), the alias or primary name that matched, a confidence score, and the exact OFAC source URL. The list is downloaded live per call (delisted entities correctly return clear). Matching uses distinctiveness learned from the list itself (IDF-weighted contiguous-phrase containment), not a naive substring, to suppress false positives. WHEN TO USE: a pure OFAC watchlist check on names, with NO state registry lookup. If you want to verify a business in a registry (which already includes this OFAC screen on each match), use verify_business instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "minConfidence": {
                "default": 0.85,
                "description": "Minimum confidence (0-1) for a reported hit. Default 0.85.",
                "type": "number"
              },
              "names": {
                "description": "Names to screen. At least one required.",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5a221a6aaa5eab9f6e5ada6b2a8e52120ed4354a56ff14c75c6a2ad587d6b023"
        },
        {
          "name": "search_entities",
          "description": "Browse / enumerate businesses within ONE state whose official name begins with (then contains) a fragment — the \"list the companies in this state\" surface. Unlike verify_business (which collapses to the single best match) this returns a bounded, name-ordered LIST of candidate entities as a FREE TASTE — each row carries entity_name, normalized status and jurisdiction, enough to disambiguate which \"ACME *\" is which. The per-row diligence detail (entity_id, registered_agent, source_url, formation_date) is delivered by the hosted rail in see_also. WHEN TO USE: you want to discover or disambiguate the entities under a name stem (e.g. all \"ACME *\" filings in Colorado). For a single known business use verify_business; for a known id use lookup_entity. Keyless, public-domain official registries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 25,
                "description": "Max entities to return. Default 25, max 50.",
                "type": "integer"
              },
              "name": {
                "description": "Name fragment to match from the start of the entity name (min 2 chars).",
                "type": "string"
              },
              "state": {
                "description": "Required 2-letter state to enumerate within (NY, CO, CT).",
                "type": "string"
              }
            },
            "required": ["name", "state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:419231016f483e87a0481089836da213a250ad3f64f0e3abcb4dcf9901f991b9"
        },
        {
          "name": "verify_business",
          "description": "KYB / know-your-business verification (FREE TASTE). Verify one or more US businesses against official, keyless state business-registry sources (currently NY, CO, CT). Each business may be a bare name string (\"Palantir Technologies\") or an object {name, state}. Returns one record per input with the scored match_confidence, the official entity_name, the normalized status (active/inactive), jurisdiction, a recently_formed flag, and risk flags — CO has_active_liens, the OFAC SDN verdict, and a field_safety injection screen (OWASP LLM01) over registry free-text. This is enough to confirm a business is real and in good standing. The full diligence record — registry entity_id, verbatim official status, entity_type, formation_date, registered_agent, principal_address, the itemized UCC-lien profile (secured parties, amounts, dates), the OFAC hit detail, and the exact source_url + retrieved_at provenance — is delivered by the hosted batch rail named in see_also ($0.01 per verified match, metered, billed only on a match). No-matches return a defensible audit (no_match_reason + candidate_count), never a bare false. WHEN TO USE: you have a business NAME. If you already hold the entity_id use lookup_entity; to list many businesses by a name prefix use search_entities; for an OFAC-only check use screen_sanctions. Keyless, public-domain sources, no API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "businesses": {
                "description": "Business names (strings) or {name, state} objects. At least one required.",
                "items": {
                  "type": ["string", "object"]
                },
                "minItems": 1,
                "type": "array"
              },
              "includeSanctions": {
                "default": true,
                "description": "Screen each match against the OFAC SDN sanctions list. Default true.",
                "type": "boolean"
              },
              "includeUcc": {
                "default": true,
                "description": "Attach the CO UCC-lien profile on Colorado matches. Default true.",
                "type": "boolean"
              },
              "maxItems": {
                "default": 25,
                "description": "Cap businesses verified in one call. Default 25, max 100.",
                "type": "integer"
              },
              "minConfidence": {
                "default": 0.85,
                "description": "Minimum match_confidence (0-1) for matched=true. Default 0.85.",
                "type": "number"
              },
              "state": {
                "description": "Optional default 2-letter state to scope all lookups (NY, CO, CT). Omit to try all live states.",
                "type": "string"
              }
            },
            "required": ["businesses"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:108d20dc4e6349b4182fb1ed94449008f6ae64b8d39dd1a96e356998da202e3a"
        }
      ],
      "digest": "sha256:53665039ac1658fb99230eafe69875b6bb5f56cabfa4d280b2fcd1961430c17d"
    }
  }
}
