{
  "lockfileVersion": 2,
  "subjects": {
    "com.chinawithme/b2b-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.chinawithme.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "chinawithme-b2b-mcp",
        "version": "2.1.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "book_consultation_or_quote",
          "description": "Submit a direct project inquiry or RFQ to JING (Stephanie) at China With Me (reply via Email or WhatsApp). Triggers an instant notification to the team in Shenzhen & Singapore.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Client email",
                "type": "string"
              },
              "message": {
                "description": "Project details, timeline, product specs, or questions",
                "type": "string"
              },
              "name": {
                "description": "Client name",
                "type": "string"
              },
              "phone": {
                "description": "Client phone or WhatsApp number",
                "type": "string"
              },
              "service": {
                "description": "Primary B2B service needed",
                "enum": ["rd-prototyping", "exhibition-coverage", "sourcing-inspection", "business-interpreter", "other"],
                "type": "string"
              }
            },
            "required": ["email", "message", "name", "service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send Project Inquiry or Request Quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3004d48cef243cfe37c1b4688818c6b9d85426b1b4e87a5e852e0b7d717251ce"
        },
        {
          "name": "estimate_aql_inspection",
          "description": "Calculate ISO 2859-1 (AQL 2.5 Major / 4.0 Minor, General Inspection Level II) sample size and accept/reject limits for a production batch in China, and connect with China With Me's accredited 3rd-party QC inspection partner network.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Factory city in China (e.g. Shenzhen, Dongguan, Ningbo, Suzhou)",
                "type": "string"
              },
              "lot_size": {
                "description": "Total production quantity (units) to be inspected",
                "type": "number"
              }
            },
            "required": ["lot_size"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate AQL 2.5 Inspection Plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:29ea89425d7b4702ace8fbc52e403ff39b302724dc1b9772c5d10567c84bcaa9"
        },
        {
          "name": "get_services_and_pricing",
          "description": "Retrieve China With Me's complete B2B service catalog, transparent USD pricing, and consultant profile (JING / Stephanie in Shenzhen & Singapore).",
          "inputSchema": {
            "properties": {
              "pillar": {
                "description": "Optional filter: 'prototyping', 'exhibition', 'sourcing', 'interpreter', or 'all'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get B2B Services & Pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7ce70ac2dcdbed52b03c3a43f043637aa50454600b045bfc7f190c707dcc512"
        },
        {
          "name": "request_remote_exhibition_viewer",
          "description": "Book or request an on-the-ground Remote Exhibition Viewer from China With Me ($299/day) to attend a Chinese trade show or exhibition on the client's behalf, film booth demos, interview engineers in Mandarin, and collect factory pricing/catalogs.",
          "inputSchema": {
            "properties": {
              "days_needed": {
                "description": "Number of days of booth coverage requested (default 1)",
                "type": "number"
              },
              "email": {
                "description": "Client email address",
                "type": "string"
              },
              "exhibition_name": {
                "description": "Name of the Chinese trade show or exhibition (and dates/city if known)",
                "type": "string"
              },
              "name": {
                "description": "Client full name",
                "type": "string"
              },
              "objectives": {
                "description": "Target product categories, booth list, technical questions to ask, or samples to collect",
                "type": "string"
              },
              "phone": {
                "description": "Client phone or WhatsApp number (optional)",
                "type": "string"
              }
            },
            "required": ["email", "exhibition_name", "name", "objectives"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request Remote Exhibition Viewer ($299/day)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5a193b0ea7168dd26b1f854b597e6baeae47b546d024703c61379b735d499c4d"
        },
        {
          "name": "scope_hardware_prototyping_china",
          "description": "Evaluate and scope a hardware R&D or prototyping project in Shenzhen/Dongguan (CNC machining, anodizing, injection molding, PCBA/embedded systems, sensors, robotics chassis, small-batch 10-100 unit EVT/DVT runs) and get a recommended phase structure and cost estimate.",
          "inputSchema": {
            "properties": {
              "need_china_visit": {
                "description": "Whether the client plans to visit Shenzhen/Dongguan factories in person",
                "type": "boolean"
              },
              "product_description": {
                "description": "Description of the hardware product, enclosure materials, electronics/sensors, or assembly requirements",
                "type": "string"
              },
              "target_batch_size": {
                "description": "Initial prototype or pilot batch quantity (e.g., 10, 15, 50, 100 units)",
                "type": "number"
              }
            },
            "required": ["product_description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Scope China Hardware R&D & Prototyping"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52b919614697eaf90370f8dc8ba49f13f69d42cb06140c94b4f3d303b9c1080d"
        },
        {
          "name": "search_china_exhibitions",
          "description": "Search upcoming Chinese trade shows and industrial exhibitions (Canton Fair, CHTF High-Tech Fair, DMP CNC/Mold Industrial Expo, bauma CHINA, Automechanika Shanghai, SEMICON China, electronica China, CIOE Optoelectronics, IOTE IoT, CMEF Medical, etc.) by keyword, category, or city. Expired past shows are automatically excluded.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter: 'Manufacturing & CNC', 'Electronics & Hardware', 'Chemicals & Materials', 'Food, Retail & Lifestyle', 'Semiconductors & IC', 'New Energy & Storage', 'Robotics & Automation', 'Medical & Healthcare', 'Optics & Sensors', 'Logistics & E-Commerce', 'Packaging & Printing', 'Automotive & EV'",
                "type": "string"
              },
              "city": {
                "description": "Optional city filter, e.g. 'Shenzhen', 'Shanghai', 'Guangzhou', 'Suzhou', 'Beijing'",
                "type": "string"
              },
              "query": {
                "description": "Keyword such as 'CNC', 'sensors', 'robotics', 'semiconductor', 'PCBA', 'medical', 'optics', 'Canton Fair', 'IoT'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Upcoming China Exhibitions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2005178701716371520cff11f25ff1d1327bdf02ec61c495538e25c358d1879d"
        }
      ],
      "digest": "sha256:b1c7b8665fcf31751d96665e402901a59bef84c71077a94cbef35b1219d731f8"
    }
  }
