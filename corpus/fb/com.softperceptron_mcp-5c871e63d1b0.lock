{
  "lockfileVersion": 2,
  "subjects": {
    "com.softperceptron/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://softperceptron.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "softperceptron",
        "version": "1.0.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SoftPerceptron's directory of AI models, agents and token products, plus a GPU VRAM and decode-speed calculator. Use search_ai_models / get_ai_model / compare_ai_models for the directory, and can_i_run_model for GPU fit checks.",
      "tools": [
        {
          "name": "can_i_run_model",
          "title": "Can my GPU run this model?",
          "description": "Check whether a specific open-weight model fits on a specific GPU: VRAM required, whether it fits, how much headroom, which quantization to use, and an estimated decode speed in tokens/sec. Use for questions like 'can an RTX 4090 run Llama 70B'.",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "Context length in tokens (default 8192).",
                "maximum": 200000,
                "minimum": 512,
                "type": "integer"
              },
              "gpu": {
                "description": "GPU id or name, e.g. 'rtx4090'. Call list_gpus to see options.",
                "type": "string"
              },
              "model": {
                "description": "Local model id or name, e.g. 'llama33-70b'. Call list_local_models to see options.",
                "type": "string"
              },
              "quant": {
                "description": "Quantization id (default 'q4'), e.g. q4, q5, q8, fp16.",
                "type": "string"
              }
            },
            "required": ["gpu", "model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fbefabcf4f664548e97a5980bee8c25207fd8b550d29e70809d28ab78da8330"
        },
        {
          "name": "compare_ai_models",
          "title": "Compare two AI models",
          "description": "Compare two directory entries side by side — pricing, context window, modality and what each is best for. Both must be the same kind (model vs model, agent vs agent).",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "First listing id or alias.",
                "type": "string"
              },
              "b": {
                "description": "Second listing id or alias.",
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1006b854d4bbb22eaea36a05b64cc377c02d43c2a2e73a0ff679df49cf8d708"
        },
        {
          "name": "get_ai_model",
          "title": "Get an AI model",
          "description": "Get full details for one directory entry by id or common alias (e.g. 'claude', 'gpt', 'gemini'). Returns pricing, specs, provider and links.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Listing id or alias, e.g. 'anthropic-claude' or 'claude'.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:87b92a7622372f86023e94f89f42b454efb268d5020d246118219cbfed686443"
        },
        {
          "name": "list_gpus",
          "title": "List GPUs",
          "description": "List the GPUs supported by the VRAM calculator, with VRAM, memory bandwidth and power draw.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:896c2d49689e230ff18a6f38bb015e5ede7ffc4a0f241017daccc9e588487032"
        },
        {
          "name": "list_local_models",
          "title": "List open-weight models",
          "description": "List the open-weight models supported by the VRAM/can-i-run calculator, with parameter counts and what each is good for.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a514d4fa46f6790b6c26c5e473e28d7f25f9dfcdfe587fe3982d68646a6f3631"
        },
        {
          "name": "search_ai_models",
          "title": "Search AI models",
          "description": "Search the SoftPerceptron directory of AI models, autonomous agents and token/credit products. Returns pricing, specs and provider for each match. Use this to answer questions like 'what AI models are available', 'cheapest model with a big context window', or 'which coding agents exist'.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "Restrict to one product kind.",
                "enum": ["model", "agent", "token"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text match against name, tagline, provider and tags. Omit to list everything.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:23dfbf1b58a232170ba0f424012f352c7aec88b9d67a91cd62736bc565255694"
        }
      ],
      "digest": "sha256:866b6bb93c25dea3e85e4315ba37a9060991d23d86e9b3ae8c52fc26b5856e28"
    }
  }
}
