{
  "lockfileVersion": 2,
  "subjects": {
    "com.preesy/preesy": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://preesy.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
