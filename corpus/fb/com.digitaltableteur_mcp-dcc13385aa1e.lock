            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "problem": {
                "description": "The visitor's problem statement, e.g. \"our design system has drifted from the product\"",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["problem"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
