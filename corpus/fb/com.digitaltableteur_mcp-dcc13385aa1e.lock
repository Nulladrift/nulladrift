        },
        {
          "name": "search",
          "title": "Search design-system docs",
          "description": "Search the @dt design-system docs registry by name, keyword or UI intent. Returns budgeted briefs (import line, key props, related components) with a hint for the follow-up get call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results, default 8",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Component name, keyword or UI intent (e.g. \"toggle\")",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "hint": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "group": {
                      "type": ["string", "null"]
                    },
                    "hint": {
                      "type": "string"
                    },
                    "import": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "score": {
                      "type": "number"
                    },
                    "status": {
                      "type": "string"
                    }
                  },
                  "required": ["description", "group", "hint", "import", "name", "score", "status"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["query", "results"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:96d950374f31aa08a62faf43ba7b09db6617217b5bfad5d5d7a17a2cc07b20f4"
        },
        {
          "name": "validate_component_usage",
          "title": "Validate component usage",
          "description": "Check proposed @dt JSX against the component contracts: prop relationships, forbidden prop combinations, deprecated props and raw-UI replacements. Pass a TSX snippet or a component name with props.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "component": {
                "description": "Component whose contract rules to check against props",
                "maxLength": 2000,
                "type": "string"
              },
              "props": {
                "additionalProperties": {},
                "description": "Props as a JSON object, checked when component is set",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "snippet": {
                "description": "TSX source to check, at most 20000 characters",
                "maxLength": 20000,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "component": {
                "type": ["string", "null"]
              },
              "contractFindings": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "component": {
                      "type": "string"
                    },
                    "line": {
                      "type": ["number", "null"]
                    },
                    "message": {
                      "type": "string"
                    },
                    "props": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "rule": {
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["error", "warning"],
                      "type": "string"
                    }
                  },
                  "required": ["component", "line", "message", "props", "rule", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "file": {
                "type": "string"
              },
              "findings": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "file": {
                      "type": "string"
                    },
                    "line": {
                      "type": "number"
                    },
                    "message": {
                      "type": "string"
                    },
                    "rule": {
                      "type": "string"
                    },
                    "snippet": {
                      "type": "string"
                    },
                    "suggest": {
                      "type": "string"
                    }
                  },
                  "required": ["file", "line", "message", "rule", "snippet", "suggest"],
                  "type": "object"
                },
                "type": "array"
              },
              "fleetLint": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "violationCount": {
                "type": "number"
              },
              "warningCount": {
                "type": "number"
              }
            },
            "required": ["component", "contractFindings", "file", "findings", "fleetLint", "note", "ok", "violationCount", "warningCount"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3d41e16fa7ec1e798838b219131a6d3269f9985a966ca0ccf1d6fea01eee147"
        }
