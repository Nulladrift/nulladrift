      },
      "transport": {
        "type": "http",
        "url": "https://www.digitaltableteur.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "digitaltableteur-consulting",
        "version": "2.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only Digitaltableteur discovery: consulting (case studies, pricing, services) and design system (@dt components, tokens, intent search, usage validation). Regenerate agent artifacts with npm run build:tokens.",
      "tools": [
        {
          "name": "get",
          "title": "Get component docs",
          "description": "Get the full docs-registry entry for one component: usage guidance, props, example story source and theming tokens.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "description": "Component name, e.g. \"Button\"",
                "maxLength": 2000,
                "type": "string"
              },
              "section": {
                "description": "Narrow the payload; default \"all\"",
                "enum": ["all", "usage", "props", "examples", "theming"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "dense": {
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "examples": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "type": ["string", "null"]
                    },
                    "source": {
                      "type": "string"
                    },
                    "story": {
                      "type": "string"
                    }
                  },
                  "required": ["description", "source", "story"],
                  "type": "object"
                },
                "type": "array"
              },
              "forbiddenUse": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "group": {
                "type": ["string", "null"]
              },
              "import": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "props": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "status": {
                "type": "string"
              },
              "tokens": {},
              "usage": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["description", "group", "import", "name", "status"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bb340dc48dee7a9f4385219caeabc3b741b374a937a8d6e80388982798215ee1"
        },
        {
          "name": "get_case_study",
          "description": "Get one case study by URL slug (e.g. dsharp-design-system, helsinki-design-system).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Case study URL slug from list_case_studies, e.g. \"dsharp-design-system\"",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0c029caeb44cc55b38665613ab4e98e95ceae2df0fba423e95ce2f1ed5ebe684"
        },
        {
          "name": "get_consulting_fit",
          "description": "Map a visitor problem statement to the best-matching consulting service.",
