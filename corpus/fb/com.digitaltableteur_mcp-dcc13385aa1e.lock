          "digest": "sha256:02cd39a8caaf0ebb91679f142637860fbcac8e4a081ea318f0c250dd0e5a2249"
        },
        {
          "name": "list_case_studies",
          "description": "List Digitaltableteur portfolio case studies with slug, title, category, tags and URLs.",
          "inputSchema": {
