      "tools": [
        {
          "name": "book_demo",
          "description": "Book a free Aivonic discovery call at a specific slot for a real person.\n    `start_iso` must be an ISO-8601 start time returned by check_availability.\n    Provide the prospect's real name and email; a calendar invite is sent to\n    them. Returns booking confirmation or an error.",
          "inputSchema": {
            "properties": {
              "email": {
                "title": "Email",
                "type": "string"
              },
              "name": {
                "title": "Name",
                "type": "string"
              },
              "notes": {
                "default": "",
                "title": "Notes",
                "type": "string"
              },
              "start_iso": {
                "title": "Start Iso",
                "type": "string"
              },
              "timezone_name": {
                "default": "UTC",
                "title": "Timezone Name",
                "type": "string"
              }
            },
            "required": ["email", "name", "start_iso"],
            "title": "book_demoArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:29b0e352e30a8ae88327aabd8d16eac36fedef60c4ed9c42fe0ffc86a785861c"
        },
        {
          "name": "check_availability",
          "description": "Check real open time slots for a free Aivonic discovery call over the next\n    `days_ahead` days (1 to 30). Returns available slots as ISO-8601 start times\n    to pass to book_demo. Use this before booking.",
          "inputSchema": {
            "properties": {
              "days_ahead": {
                "default": 14,
                "title": "Days Ahead",
                "type": "integer"
              }
            },
            "title": "check_availabilityArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:682f449225c51438b0a0a2ed71ad6b44140f9c97de0bcffe282802768652efe8"
        },
        {
          "name": "get_pricing",
          "description": "Get Aivonic's current pricing: the Aivonic Workspace SaaS plans (monthly),\n    and the done-for-you AI Agent, Multi-Agent, and Voice AI packages (one-time\n    setup fee + monthly support). All figures in USD.",
          "inputSchema": {
            "properties": {},
            "title": "get_pricingArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bdffdb6a9d7497f1aaf2bc803174d07177810d6a5fa1d91847d2b6d339a05d65"
        },
        {
          "name": "get_products",
          "description": "Get Aivonic's company details and its product/service line (AI Agents,\n    Voice AI, AI Automation, AI Consulting, AI Audit, and the Aivonic Workspace\n    SaaS), each with a short description and link.",
          "inputSchema": {
            "properties": {},
            "title": "get_productsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:261b81a859ec1b2d47404e630ac4f187ab9580f923296af7c41df4dd5e85d52b"
        },
        {
          "name": "request_quote",
          "description": "Submit a quote/enquiry to Aivonic on behalf of a real prospect. Include\n    what they want (product, use case, scale) in `message`. Aivonic's team is\n    emailed and will follow up by email. Use for anything beyond the standard\n    published pricing, or when the prospect wants a human to reach out.",
          "inputSchema": {
            "properties": {
              "company": {
                "default": "",
                "title": "Company",
                "type": "string"
              },
              "email": {
                "title": "Email",
                "type": "string"
              },
              "message": {
                "title": "Message",
                "type": "string"
              },
              "name": {
                "title": "Name",
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "title": "request_quoteArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8cd814b5eeecd5e9a32a42f1d428af3ff25ac567f0f9e07e039bbeb88e9d2add"
        }
      ],
      "digest": "sha256:eb2194bb4faf6ceac59fc1d17d1c128eff8bc6c083dc4c8e53b30ffb16607f2c"
    }
