      "tools": [
        {
          "name": "valet_find_nearest_operators",
          "title": "Find Nearest Operators",
          "description": "List nearest valet operators within a 100-mile cap of a coordinate, optionally narrowed by service. Use this when a user is in a city with no listed operators and you need the closest available fallback ranked nearest-first. Empty array if nothing within 100 miles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lat": {
                "description": "Latitude in decimal degrees (WGS84). Range: -90 to 90.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "description": "Max results to return; default 10, capped at 50",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude in decimal degrees (WGS84). Range: -180 to 180.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "service": {
                "description": "Optional service narrowing. One of the 9 canonical valet service slugs. Omit to list every nearby operator regardless of services offered.",
                "enum": ["wedding-valet", "corporate-event-valet", "private-event-valet", "funeral-valet", "hotel-resort-valet", "restaurant-valet", "hospital-medical-valet", "major-venue-valet", "general-valet"],
                "type": "string"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": false,
                "description": "TOOL-11 ToS and attribution block",
                "properties": {
                  "attribution": {
                    "type": "string"
                  },
                  "terms": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["attribution", "terms"],
                "type": "object"
              },
              "data_freshness": {
                "additionalProperties": false,
                "description": "TOOL-10 freshness stamp",
                "properties": {
                  "indexed_at": {
                    "description": "ISO timestamp of the freshest row in the batch",
                    "type": "string"
                  },
                  "source": {
                    "description": "Origin tag: typesense:operators or typesense:operators:empty",
                    "type": "string"
                  }
                },
                "required": ["indexed_at", "source"],
                "type": "object"
              },
              "operators": {
                "description": "Operators within 100 miles of the input coordinate, sorted nearest-first. Empty array means nothing within 100 miles.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description_text": {
                      "description": "Plain-text summary; null if not on file",
                      "type": ["string", "null"]
                    },
                    "distance_miles": {
                      "description": "Distance from the input coordinate to operator HQ, rounded to 1 decimal",
                      "type": "number"
                    },
                    "name": {
                      "description": "Operator business name",
                      "type": "string"
                    },
                    "phone": {
                      "description": "Operator phone number, null if not on file",
                      "type": ["string", "null"]
                    },
                    "primary_city_name": {
                      "description": "Display name of operator HQ city",
                      "type": "string"
                    },
                    "primary_city_slug": {
                      "description": "Canonical kebab-case HQ city slug",
                      "type": "string"
                    },
                    "primary_state_name": {
                      "description": "Display name of operator HQ state",
                      "type": "string"
                    },
                    "primary_state_slug": {
                      "description": "Canonical kebab-case HQ state slug",
                      "type": "string"
                    },
                    "services": {
                      "description": "Canonical service slugs this operator offers",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "slug": {
                      "description": "Canonical kebab-case operator slug; pass to valet_get_operator for details",
                      "type": "string"
                    },
                    "tier": {
                      "description": "Operator tier: 'free', 'paid', or 'custom'",
                      "type": "string"
                    }
                  },
                  "required": ["description_text", "distance_miles", "name", "phone", "primary_city_name", "primary_city_slug", "primary_state_name", "primary_state_slug", "services", "slug", "tier"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["_meta", "data_freshness", "operators"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
