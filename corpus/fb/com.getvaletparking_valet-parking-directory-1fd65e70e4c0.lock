                "description": "TOOL-10 freshness stamp",
                "properties": {
                  "indexed_at": {
                    "description": "Date the cities collection was last fully reindexed",
                    "type": "string"
                  },
                  "source": {
                    "description": "Origin of the data; for this tool: typesense:cities",
                    "type": "string"
