        {
          "name": "valet_request_quote",
          "title": "Request Valet Quote",
          "description": "Submit a valet parking quote request to the operators serving a US city. Use this when a person has asked you to arrange valet and has given their name, email, phone, city, service type and event date. The request is only sent after they confirm by email.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city_other": {
                "description": "Free-text city name when no directory slug is known. Omit if using city_slug.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "city_slug": {
                "description": "Canonical kebab-case city slug from valet_search_cities, e.g. 'austin'. Omit if using city_other.",
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "contact_email": {
                "description": "Email address to send the one-tap confirmation link to",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "contact_name": {
                "description": "The requester's full name",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "contact_phone": {
                "description": "Phone number the operator can call",
                "maxLength": 40,
                "minLength": 7,
                "type": "string"
              },
              "event_date": {
                "description": "Event date in YYYY-MM-DD format",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guest_count": {
                "description": "Approximate guest count, if known",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "notes": {
                "description": "Free-text notes for the operator, e.g. venue name or timing details",
                "maxLength": 2000,
                "type": "string"
              },
              "operator_slug": {
                "description": "Send to this one operator only instead of the full fan-out for the city. Omit to notify every matched operator in the city.",
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "service": {
                "description": "One of the 9 canonical valet service slugs",
                "enum": ["wedding-valet", "corporate-event-valet", "private-event-valet", "funeral-valet", "hotel-resort-valet", "restaurant-valet", "hospital-medical-valet", "major-venue-valet", "general-valet"],
                "type": "string"
              },
              "vehicle_count": {
                "description": "Approximate vehicle count, if known",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["contact_email", "contact_name", "contact_phone", "event_date", "service"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": false,
                "description": "TOOL-11 ToS and attribution block",
                "properties": {
                  "attribution": {
                    "type": "string"
                  },
                  "terms": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["attribution", "terms"],
                "type": "object"
              },
              "next": {
                "description": "What the agent should tell the person to do next",
                "type": "string"
              },
              "reference": {
                "description": "Short human-readable reference for this quote request",
                "type": "string"
              },
              "status": {
                "const": "pending-confirmation",
                "description": "Always pending-confirmation on success",
                "type": "string"
              }
            },
            "required": ["_meta", "next", "reference", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
