        {
          "name": "valet_search_cities",
          "title": "Search Cities",
          "description": "Search the cities directory by name prefix with population-ranked results. Use this when an agent needs to resolve a partial city name into a canonical city slug plus state slug plus lat/lng before composing valet_find_operators_in_city or valet_find_operators_near. Empty array if no matches.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "description": "Max results to return; default 8, capped at 25",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Partial or full city name (>=2 chars). Matched against name and lowercase name fields with prefix semantics.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "_meta": {
                "additionalProperties": false,
                "description": "TOOL-11 ToS and attribution block",
                "properties": {
                  "attribution": {
                    "type": "string"
                  },
                  "terms": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["attribution", "terms"],
                "type": "object"
              },
              "cities": {
                "description": "Cities matching the query, ranked by text match then population desc",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "lat": {
                      "description": "City centroid latitude; null if unset in the index",
                      "type": ["number", "null"]
                    },
                    "lng": {
                      "description": "City centroid longitude; null if unset in the index",
                      "type": ["number", "null"]
                    },
                    "population": {
                      "description": "Census population estimate; used as the sort tiebreaker",
                      "type": "number"
                    },
                    "slug": {
                      "description": "Canonical kebab-case city slug (URL-safe)",
