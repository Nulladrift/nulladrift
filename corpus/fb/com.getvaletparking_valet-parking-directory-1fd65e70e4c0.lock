                    "state_slug": {
                      "description": "Canonical kebab-case state slug (e.g. texas, new-york)",
                      "type": "string"
                    }
                  },
                  "required": ["lat", "lng", "population", "slug", "state_slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "data_freshness": {
