        {
          "name": "kapruka_render_options_card",
          "description": "Render 1-4 products as ONE shareable JPEG \"menu\" card and return its URL.\n\n    The card shows each product's photo with a big numbered badge (the ref you\n    assign), and its name + price printed under the photo. Built for chat\n    commerce (WhatsApp): send the image, tell the customer \"reply 1, 2 or 3\",\n    and they pick without opening links. No AI is involved — the image is\n    server-composited from the live catalog data, so prices match what the\n    product tools return.\n\n    Ref numbering contract: refs are yours to assign — use sequential numbers\n    per conversation and NEVER reuse one (if the first card was 1-3, the next\n    card starts at 4). A number must keep meaning the same product for the whole\n    conversation.\n\n    Args:\n        params (RenderOptionsCardInput):\n            - items (list[CardProduct]): 1-4 of {product_id, ref}\n            - currency (str): LKR (default), USD, GBP, AUD, EUR\n            - courtesy ({currency, per_usd}, optional): home-currency figure printed\n              under each USD price (\"≈ JPY 2,544\"); the caller's rate, echoed back\n            - footer_note (str, optional): appended to the footer reply hint\n\n    Returns:\n        str: JSON:\n        {\n          \"card_url\": str,              # public JPEG URL — send this as the image\n          \"items\": [{\"ref\": int, \"product_id\": str, \"name\": str,\n                      \"price\": {\"amount\": float, \"currency\": str},\n                      \"price_note\": str | null, \"url\": str}],\n          \"courtesy\": {\"currency\": str, \"per_usd\": float} | null,  # what was printed, or null\n          \"unavailable\": [str]          # product_ids that failed to load (omitted from card)\n        }\n\n        Error: \"Error: <message>\" when no product could be loaded.\n    ",
          "inputSchema": {
            "$defs": {
              "CardProduct": {
                "additionalProperties": false,
                "properties": {
                  "product_id": {
                    "description": "Kapruka product ID (from a search result).",
                    "maxLength": 80,
                    "minLength": 3,
                    "title": "Product Id",
                    "type": "string"
                  },
                  "ref": {
                    "description": "The reference number to print on this product's badge (customer replies with it). Assign sequentially per conversation and NEVER reuse a number.",
                    "maximum": 99,
                    "minimum": 1,
                    "title": "Ref",
                    "type": "integer"
                  }
                },
                "required": ["product_id", "ref"],
                "title": "CardProduct",
                "type": "object"
              },
              "Courtesy": {
                "additionalProperties": false,
                "description": "A home-currency approximation to print under each USD price.\n\nThe CALLER supplies the rate it used for its own chat text, so the card and\nthe text agree to the unit; the card never converts on its own. Only\napplied when the card is priced in USD — the courtesy figure describes\nwhat a USD charge will look like on the customer's statement.",
                "properties": {
                  "currency": {
                    "description": "ISO-4217 code of the customer's home currency, e.g. JPY.",
                    "maxLength": 3,
                    "minLength": 3,
                    "pattern": "^[A-Za-z]{3}$",
                    "title": "Currency",
                    "type": "string"
                  },
                  "per_usd": {
                    "description": "Units of that currency per 1 USD, as used for the chat text.",
                    "exclusiveMaximum": 1000000,
                    "exclusiveMinimum": 0,
                    "title": "Per Usd",
                    "type": "number"
                  }
                },
                "required": ["currency", "per_usd"],
                "title": "Courtesy",
                "type": "object"
              },
              "RenderOptionsCardInput": {
                "additionalProperties": false,
                "properties": {
                  "courtesy": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/Courtesy"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional: print '≈ <home currency>' under each USD price (see Courtesy). Ignored unless currency is USD."
                  },
                  "currency": {
                    "default": "LKR",
                    "description": "Price currency: LKR, USD, GBP, AUD, EUR.",
                    "title": "Currency",
                    "type": "string"
                  },
                  "footer_note": {
                    "anyOf": [
                      {
                        "maxLength": 60,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional short note appended to the footer's reply hint, e.g. 'Checkout charges USD'.",
                    "title": "Footer Note"
                  },
                  "items": {
                    "description": "1-4 products to show side by side.",
                    "items": {
                      "$ref": "#/$defs/CardProduct"
                    },
                    "maxItems": 4,
                    "minItems": 1,
                    "title": "Items",
                    "type": "array"
                  }
                },
                "required": ["items"],
                "title": "RenderOptionsCardInput",
                "type": "object"
              }
            },
            "properties": {
              "params": {
                "$ref": "#/$defs/RenderOptionsCardInput"
              }
            },
            "required": ["params"],
            "title": "kapruka_render_options_cardArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "kapruka_render_options_cardOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Render Product Options Card (Image)"
          },
          "behavior": {
            "destructive": false,
