                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "kapruka_gift_countriesOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Kapruka International Gifts — Countries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
