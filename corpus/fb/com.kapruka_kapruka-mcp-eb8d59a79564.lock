                "additionalProperties": false,
                "properties": {
                  "limit": {
                    "default": 25,
                    "description": "Max cities to return (1–50).",
                    "maximum": 50,
                    "minimum": 1,
                    "title": "Limit",
                    "type": "integer"
                  },
                  "query": {
                    "anyOf": [
                      {
                        "maxLength": 50,
                        "type": "string"
                      },
                      {
                        "type": "null"
