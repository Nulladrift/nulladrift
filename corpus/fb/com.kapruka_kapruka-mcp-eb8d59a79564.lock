        },
        {
          "name": "kapruka_list_categories",
          "description": "List top-level Kapruka product categories by name with browse URLs.\n\n    Returns the site's NAVIGATION categories plus the public Kapruka.com URL for each\n    category landing page — useful for sending a customer to a category to browse.\n\n    These names are NOT search filters. kapruka_search_products filters on search\n    facets, a different vocabulary (e.g. navigation 'Electronic' vs facet 'Electronics',\n    'Cakes' vs 'Kapruka Cakes'); every search response lists its valid facet names\n    under facets.categories. Use those for `category`, never these. Internal IDs and\n    product counts are not exposed. Results are cached for 30 minutes server-side.\n\n    Args:\n        params (ListCategoriesInput):\n            - depth (int): Sub-category levels to include, 1 or 2 (default 1)\n            - response_format (str): 'markdown' (default) or 'json'\n\n    Returns:\n        str: Category tree in the requested format.\n\n        JSON schema:\n        {\n          \"categories\": [\n            {\n              \"name\": str,\n              \"url\": str,                  # kapruka.com category landing page\n              \"children\": [{\"name\": str, \"url\": str, \"children\": [...]}]\n            }\n          ]\n        }\n\n        Error: \"Error: <message>\" on failure.\n    ",
          "inputSchema": {
            "$defs": {
              "ListCategoriesInput": {
                "additionalProperties": false,
                "properties": {
                  "depth": {
                    "default": 1,
                    "description": "How many levels of sub-categories to include (1 or 2). Default 1.",
                    "maximum": 2,
                    "minimum": 1,
                    "title": "Depth",
                    "type": "integer"
                  },
                  "response_format": {
                    "default": "markdown",
                    "description": "'markdown' for human-readable output, 'json' for raw structured data.",
                    "title": "Response Format",
