        {
          "name": "kapruka_get_product",
          "description": "Fetch full details for a single Kapruka product by its product ID.\n\n    Returns name, description, price (with optional currency conversion), stock status,\n    images, variants, shipping info, delivery scope, and a direct product URL.\n\n    `economy_delivery` (\"optional\" | \"only\" | \"only_5to7\" | null) says whether the\n    item can go by the cheaper economy courier; kapruka_check_delivery with the\n    cart says whether an order is offered it.\n\n    International gift store products carry `international_gift` {\"country\", \"orderable\",\n    \"store_url\"}: they are delivered IN that country by Kapruka's partner (see\n    kapruka_gift_countries), not in Sri Lanka.\n\n    Discounts: `price` is what checkout charges, with any website discount already\n    applied; `compare_at_price` is the pre-discount price when one applies (null\n    otherwise). Each variant carries its own pair. Quote `price`.\n\n    Delivery scope: most gifts ship island-wide, but restaurant food, hotel cakes\n    and liquor only reach a limited city set (typically the Colombo area). The\n    `delivery` object is the authority — search results do NOT carry it. When\n    `delivery.island_wide` is false, tell the customer up front that the item is\n    delivered only to selected cities, and confirm their city with\n    kapruka_check_delivery(city, product_id) before promising anything. If\n    `deliverable_city_count` exceeds the returned list, the list is truncated —\n    say \"and more\", don't treat it as complete.\n\n    Note: Some IDs starting with 'CATSYM' are category landing pages, not purchasable\n    products — this tool will flag those clearly.\n\n    Args:\n        params (GetProductInput):\n            - product_id (str): Kapruka product ID (e.g. 'cakeXX000000')\n            - currency (str): Price currency — LKR (default), USD, GBP, AUD, EUR\n            - type (Optional[str]): Optional type hint (e.g. 'specialgifts')\n            - response_format (str): 'markdown' (default) or 'json'\n\n    Returns:\n        str: Product details in the requested format.\n\n        JSON schema:\n        {\n          \"id\": str,\n          \"name\": str,\n          \"description\": str,\n          \"summary\": str,\n          \"price\": {\"amount\": float, \"currency\": str},\n          \"compare_at_price\": {\"amount\": float, \"currency\": str} | null,\n          \"in_stock\": bool,\n          \"stock_level\": str,           # \"low\" | \"medium\" | \"high\"\n          \"category\": {\"id\": str, \"name\": str, \"slug\": str, \"path\": str},\n          \"variants\": [{\"id\": str, \"name\": str, \"sku\": str, \"price\": {...},\n                        \"in_stock\": bool, \"stock_level\": str, \"attributes\": {...}}],\n          \"images\": [str],              # list of full-resolution image URLs\n          \"attributes\": {\"type\": str, \"subtype\": str, \"weight\": str, \"vendor\": str},\n          \"shipping\": {\"ships_from\": str, \"ships_internationally\": bool, \"restricted_countries\": [str]},\n          \"delivery\": {\n            \"island_wide\": bool,\n            \"deliverable_city_count\": int,   # only when island_wide=false; TRUE total\n            \"deliverable_cities\": [str]      # only when island_wide=false; capped at 60\n          },\n          \"rating\": null,\n          \"url\": str\n        }\n\n        Error: \"Error: <message>\" on failure.\n    ",
          "inputSchema": {
            "$defs": {
              "GetProductInput": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "default": "LKR",
                    "description": "Price currency. Supported: LKR, USD, GBP, AUD, EUR",
                    "title": "Currency",
                    "type": "string"
                  },
                  "product_id": {
                    "description": "Kapruka product ID (e.g. 'cakeXX000000', 'EF_PC_CHOC0V2774P00065')",
                    "maxLength": 80,
                    "minLength": 3,
                    "title": "Product Id",
                    "type": "string"
                  },
                  "response_format": {
                    "default": "markdown",
                    "description": "'markdown' for human-readable output, 'json' for raw structured data.",
                    "title": "Response Format",
                    "type": "string"
                  },
                  "type": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional product type hint passed to the API (e.g. 'specialgifts'). Rarely needed.",
                    "title": "Type"
                  }
                },
                "required": ["product_id"],
                "title": "GetProductInput",
                "type": "object"
              }
            },
            "properties": {
              "params": {
                "$ref": "#/$defs/GetProductInput"
              }
            },
            "required": ["params"],
            "title": "kapruka_get_productArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "kapruka_get_productOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Kapruka Product Details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:56045c22981aae6528bcc7c7eb6d860ef8903dee1b91768b57485a782d00393a"
        },
        {
          "name": "kapruka_gift_countries",
          "description": "List the countries Kapruka delivers gifts IN (international gift stores).\n\n    Use when the RECIPIENT is outside Sri Lanka — e.g. \"send flowers to my sister in\n    Dubai\", \"a cake for my son in Melbourne\". These gifts are delivered by Kapruka's\n    partner in that country, not shipped from Sri Lanka. They are NOT in\n    kapruka_search_products; list a store with kapruka_gift_country_products.\n\n    For each country: how many gifts are in stock now (0 = nothing can be ordered\n    there right now — say so), the delivery fee (one fee per order, whatever the\n    number of items), and for Australia and the UAE the zones they deliver to —\n    delivery is ONLY to those zones, each with its own fee. The earliest delivery\n    date is 3 days from today (Sri Lanka date).\n\n    Args:\n        params: currency ('LKR' default or 'USD'), response_format.\n\n    Returns:\n        str. JSON: {\"currency\", \"earliest_date\", \"countries\": [{\"country\", \"products_in_stock\",\n        \"delivery_fee\": {\"amount\",\"currency\"}, \"zone_required\": bool,\n        \"zones\": [{\"name\",\"delivery_fee\"}], \"earliest_date\", \"store_url\"}]}\n    ",
          "inputSchema": {
            "$defs": {
              "GiftCountriesInput": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "default": "LKR",
                    "description": "LKR (default) or USD. GBP/AUD/EUR are shown in USD.",
                    "title": "Currency",
                    "type": "string"
                  },
                  "response_format": {
                    "default": "markdown",
                    "description": "'markdown' (default) or 'json'",
                    "title": "Response Format",
                    "type": "string"
                  }
                },
                "title": "GiftCountriesInput",
                "type": "object"
