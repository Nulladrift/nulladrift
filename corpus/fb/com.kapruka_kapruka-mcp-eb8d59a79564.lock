                      {
                        "maxLength": 60,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "International gifts only: the recipient's zone in Australia or the UAE, from kapruka_gift_countries (e.g. 'Dubai', 'Dandenong').",
                    "title": "Zone"
                  }
                },
                "title": "CheckDeliveryInput",
                "type": "object"
              },
              "DeliveryCartLine": {
                "description": "A catalogue cart line, the same shape kapruka_create_order takes.\n\nCustom cake lines cannot be priced here; pass the quote's total as\n`other_items_total` instead.",
                "properties": {
