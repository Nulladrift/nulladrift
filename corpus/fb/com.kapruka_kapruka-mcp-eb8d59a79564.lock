      "instructions": "You are connected to the Kapruka MCP server for Kapruka.com — Sri Lanka's largest e-commerce platform. Use the tools to search products, browse categories, look up product details, quote delivery, create guest-checkout orders (pay link) and track orders. This is a free public tier; treat results as cached for up to 30 minutes.\n\nDELIVERY-CITY LIMITS — follow these rules:\n1. Most gifts ship island-wide, but restaurant food, hotel cakes and liquor are delivered only to selected cities (typically the Colombo area). Never promise delivery of a product to a city without checking: call kapruka_check_delivery with BOTH city and product_id (or read delivery.island_wide from kapruka_get_product). Say yes only if available is true.\n2. Surface the limit proactively: when a product's delivery.island_wide is false, tell the customer it is delivered only to selected cities before they pick a city. If deliverable_city_count is larger than the list you were given, say 'and more' — the list is truncated.\n3. On item_deliverable=false / available=false, offer the returned deliverable_cities (nearest first) or an island-wide alternative. Do not retry kapruka_create_order with the same city.\n4. An order ships as ONE shipment, so the whole cart must be deliverable to the city (intersection of every item's cities). If kapruka_create_order returns city_not_deliverable_for_item, nothing was created: tell the customer which item blocks it and offer to change the city or remove/replace that item. Never pretend a partial order was placed.\n5. Search results carry no delivery info — resolve it per item via kapruka_get_product or kapruka_check_delivery.\n6. Send canonical city spellings from kapruka_list_delivery_cities / deliverable_cities.\n\nINTERNATIONAL GIFTS — when the RECIPIENT is outside Sri Lanka (USA, UK, Canada, Australia, UAE, ...): call kapruka_gift_countries, then kapruka_gift_country_products(country) and choose from the whole store (these products are not in kapruka_search_products). They are delivered in that country by Kapruka's partner: one delivery fee per order, Australia/UAE only to listed zones, earliest date 3 days ahead. Order with kapruka_create_order delivery.type 'international_gift' (+ country, zone, zip); one country per order, never mixed with Sri Lanka items.",
      "tools": [
        {
          "name": "kapruka_check_delivery",
          "description": "Check whether Kapruka can deliver to a given city on a given date, and the delivery fee.\n\n    Returns whether the requested date is available (if not, the next available\n    date plus reason) and the delivery fee the checkout will charge.\n\n    THE FEE DEPENDS ON THE CART AND THE CURRENCY — the city's base rate is not\n    what checkout charges. Sri Lankan customers (LKR) pay the city rate capped\n    by the cart value (25% of the item value, at least LKR 300; some remote\n    cities 50%), so a small cart to a far city pays far less than the rate.\n    Overseas customers (USD) pay a fixed USD fee per city, whatever the cart.\n    Pass `currency` and the `cart` you are about to order and the answer gives\n    the EXACT fee kapruka_create_order will charge (\"Delivery fee for this\n    cart\"). Without a cart, an LKR answer gives only the MOST the fee can be\n    (\"up to\"). One shipment per order: the fee covers the whole cart.\n\n    Pass `product_id` whenever the customer has named a product: the answer then\n    also checks that ITEM's delivery scope (restaurant food, hotel cakes and\n    liquor only reach selected cities, typically the Colombo area). With a\n    product_id, `available` is true only if the date is open AND the item is\n    deliverable to that city. When `item_deliverable` is false, offer the\n    customer one of the returned `deliverable_cities` or an island-wide\n    alternative — do not attempt kapruka_create_order with the same city, it\n    will be rejected. An unknown product_id is silently ignored (no item fields\n    in the result), so check `item_deliverable` is present before relying on it.\n\n    product_id also selects the SAME-DAY rule the checkout applies to that item:\n    vendor-delivered items (restaurant food) can go today until late afternoon;\n    ordinary items move to the next date; ordinary same-day is only possible early\n    in the morning near Colombo. So a check without product_id can differ from one\n    with it — always pass it once an item is chosen. When `available` is false,\n    offer `next_available_date`. Do not interpret the `reason` text (it is the\n    website's wording and may say slots are full when the real cause is the cutoff).\n\n    ECONOMY DELIVERY (cheaper courier, a few days instead of a chosen date) is\n    worked out from the `cart` (and `gift_message`, which you should pass when\n    there is one). When the answer shows an economy option, offer it to the\n    customer as the cheaper choice, quoting its fee, promise wording and\n    \"expected by\" date as given; if they take it, call kapruka_create_order with\n    `delivery.type: \"economy\"` (the order is dated for you). When the answer says\n    the order goes by economy delivery, that is the ONLY option for these items:\n    tell the customer and order with `delivery.type: \"economy\"`. When economy is\n    not shown, do not mention it.\n\n    Perishable codes (CAKE*, FLOWER*, COMBO*) additionally get a freshness\n    warning when the chosen delivery date is more than 1 day out.\n\n    INTERNATIONAL GIFTS (store products from kapruka_gift_country_products): pass\n    product_id or cart (no city needed) and, for Australia / the UAE, `zone`. The\n    answer is that country's delivery: available or not, the fee for the whole order,\n    and the earliest date (3 days ahead; used when delivery_date is omitted).\n\n    Args:\n        params (CheckDeliveryInput):\n            - city (str): Canonical city name (e.g. 'Colombo 03', 'Galle'); not needed for\n              international gift store products\n            - zone (Optional[str]): international gifts in Australia / the UAE\n            - delivery_date (Optional[str]): YYYY-MM-DD; defaults to today (LK time)\n            - product_id (Optional[str]): Check the city against this item's delivery scope\n            - currency (Optional[str]): LKR (default) or USD/GBP/AUD/EUR (charged in USD)\n            - cart (Optional[list]): [{product_id, quantity, icing_text?}] for the exact fee\n            - other_items_total (Optional[float]): LKR value of items not in `cart` (custom cake quote)\n            - gift_message (Optional[str]): the order's gift message, for the economy rule\n            - response_format (str): 'markdown' (default) or 'json'\n\n    Returns:\n        str: Delivery feasibility + fee in the requested format.\n\n        JSON schema:\n        {\n          \"city\": str,\n          \"now\": str,                       # ISO timestamp, Sri Lanka time\n          \"checked_date\": str,              # YYYY-MM-DD\n          \"available\": bool,                # date open AND (if product_id) item deliverable\n          \"delivery_fee\": number,           # what checkout charges (see fee_basis)\n          \"fee_currency\": \"LKR\" | \"USD\",\n          \"fee_basis\": \"cart\" | \"max\" | \"fixed\",  # exact for the cart | LKR without a cart: the most it can be | USD: same for any cart\n          \"fee_items_value\": number,        # LKR item value the fee was computed from (fee_basis=cart)\n          \"fee_cart_error\": str,            # the cart could not be priced (fee falls back to max)\n          \"rate\": number,                   # the city's BASE rate (LKR) — not the checkout fee\n          \"currency\": \"LKR\",\n          \"reason\": str | null,             # date-block message, else \"This item is not delivered to <City>.\"\n          \"next_available_date\": str|null,  # only for date blocks\n          \"item_deliverable\": bool,         # only when product_id resolved to a real product\n          \"deliverable_cities\": [str],      # only when item_deliverable=false (capped at 60)\n          \"perishable_warning\": str | null, # populated when product_id is perishable\n          \"economy\": {                      # only with `cart`\n            \"available\": bool,              # false: say nothing about economy\n            \"forced\": bool,                 # true: economy is the ONLY option\n            \"fee\": number, \"currency\": \"LKR\",\n            \"promise\": str,                 # quote as given\n            \"delivery_date\": str,           # \"expected by\" date; create_order uses it\n            \"saving\": number | null         # vs the standard fee\n          }\n        }\n    ",
          "inputSchema": {
            "$defs": {
              "CheckDeliveryInput": {
