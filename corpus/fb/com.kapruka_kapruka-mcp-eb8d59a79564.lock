        {
          "name": "kapruka_gift_country_products",
          "description": "List EVERY gift in stock in one country's store (international gifts), grouped by type.\n\n    The stores are small (tens of products), so this returns the whole store: read it\n    and choose for the customer — there is no keyword search for these products.\n    Prices are exactly what checkout charges for the item (no website discounts apply\n    to these stores); delivery is extra — one fee per order (zone fee in Australia /\n    the UAE), shown at the top. Use the `id` with kapruka_get_product for full detail\n    and with kapruka_create_order (delivery.type \"international_gift\").\n\n    Args:\n        params: country, type (optional filter), currency ('LKR' default or 'USD'),\n            response_format.\n\n    Returns:\n        str. JSON: {\"country\", \"currency\", \"count\", \"delivery\": {country row from\n        kapruka_gift_countries}, \"products\": [{\"id\", \"name\", \"type\", \"summary\",\n        \"price\": {\"amount\",\"currency\"}, \"image_url\", \"url\"}]}\n    ",
          "inputSchema": {
            "$defs": {
              "GiftCountryProductsInput": {
                "additionalProperties": false,
                "properties": {
                  "country": {
                    "description": "The recipient's country, e.g. 'UAE', 'Australia', 'USA', 'UK', 'Canada' (common names like 'Dubai', 'United States', 'England' also work).",
                    "maxLength": 60,
                    "minLength": 2,
                    "title": "Country",
                    "type": "string"
                  },
                  "currency": {
                    "default": "LKR",
                    "description": "LKR (default) or USD. GBP/AUD/EUR are shown in USD.",
                    "title": "Currency",
                    "type": "string"
                  },
                  "response_format": {
                    "default": "markdown",
                    "description": "'markdown' (default) or 'json'",
                    "title": "Response Format",
                    "type": "string"
                  },
                  "type": {
                    "anyOf": [
                      {
                        "maxLength": 40,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional: only this type, e.g. 'Cakes', 'Flowers', 'Hampers', 'Chocolates'.",
                    "title": "Type"
                  }
                },
                "required": ["country"],
                "title": "GiftCountryProductsInput",
                "type": "object"
              }
            },
            "properties": {
              "params": {
                "$ref": "#/$defs/GiftCountryProductsInput"
              }
            },
            "required": ["params"],
            "title": "kapruka_gift_country_productsArguments",
            "type": "object"
          },
