      "instructions": "Supersurf forecasts the surf at 2,435 spots in 46 countries from open models (ECMWF's waves, the marine model's swells, the weather models' wind) and works tides out from tide stations' constants. search_surf_spots finds a spot by its words, list_surf_spots_near and find_best_surf work around a place, get_surf_forecast and get_tide_times answer one spot, list_surf_schools the schools, rentals and shops near it. Every number is a forecast or a prediction and each answer names its source and when it was made: say so, and never call it more accurate than other forecasts. Wind words are the plain ones: from the land (offshore, good), along the shore, from the sea (onshore).",
      "tools": [
        {
          "name": "find_best_surf",
          "title": "Find the best surf",
          "description": "Use this when the person asks where or when to surf around a place. when is in the person's words (tomorrow morning, Saturday, this weekend); default the next 24 hours. Not for one spot's full hours: use get_surf_forecast. Answers surf spots near the place, ranked for the time asked (today, tomorrow, tomorrow morning, this weekend, a date): each spot's best window in that time with its wave height, period, wind and why it ranks there, and the spots with nothing good in that time last; within radius_km (default 30, at most 100).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "near": {
                "description": "a town, a coast or a spot: Lisbon, Hossegor, Supertubos",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "radius_km": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "when": {
                "description": "in people's words: today, tomorrow morning, this weekend, Saturday, 2026-11-28",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "from": {
                "type": "string"
              },
              "near": {
                "type": "string"
              },
              "spots": {
                "items": {
