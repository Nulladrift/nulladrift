{
  "lockfileVersion": 2,
  "subjects": {
    "com.hypeibiza/offers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hypeibiza.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hypeibiza",
        "version": "1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "convert_size",
          "title": "Convert a size",
          "description": "Converts one shoe size of a brand between the EU, US and UK systems using the brand's own size chart.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "The brand, for example 'nike', 'adidas' or 'new balance'.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "from_system": {
                "enum": ["eu", "us", "uk"],
                "type": "string"
              },
              "to_system": {
                "enum": ["eu", "us", "uk"],
                "type": "string"
              },
              "value": {
                "description": "The size in from_system, for example '42', '42.5' or '9'.",
                "maxLength": 8,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["brand", "from_system", "to_system", "value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert a size"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f429b53d2e0da477cfa9153fb15dbef565b9a270f38c42767350688e803c9f34"
        },
        {
          "name": "get_deals",
          "title": "Get deals",
          "description": "Lists today's price drops at the shops HYPEIBIZA compares, optionally for one brand or model.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "A brand name, for example 'adidas'.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "description": "Words of a model name, for example 'samba' or 'dunk low'.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get deals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0ded71929d32aa9edc93d018d4334098037394916ea0b2e030082a9cf78645a"
        },
        {
          "name": "get_offers",
          "title": "Get offers",
          "description": "Lists the shops that sell one product, with each shop's price, strike price, stock and the HYPEIBIZA link to the shop, optionally for one size.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "size": {
                "description": "Adds each shop's status for this size: in, low or out.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "The product's slug from search_sneakers or get_deals (the last part of its page URL).",
                "pattern": "^[a-z0-9-]{1,200}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get offers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7116f950cd196a70d805bdfe9257ac429b54a23e06d39fb8488816b892a16673"
        },
        {
          "name": "search_sneakers",
          "title": "Search sneakers",
          "description": "Searches the HYPEIBIZA catalogue for sneakers and streetwear by name, model or style code and returns up to 10 products with the lowest shop price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A product name, model, brand or style code, for example 'jordan 1 low' or 'DD1391-100'.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "size": {
                "description": "Only products a shop has in stock in this size; the price is then the lowest price in that size.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search sneakers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f07047661f2b289fcd492af63a5d83656d391d7a438568b47e3c716e1c9f6887"
        }
      ],
      "digest": "sha256:f5992ab08497d8516b3ee6ccc53f96ded505f200514c0bfc2612f7479c2a3270"
    }
  }
}
