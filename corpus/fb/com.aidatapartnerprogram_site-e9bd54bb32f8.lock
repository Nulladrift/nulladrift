      "instructions": "AI Data Partner Program (https://aidatapartnerprogram.com/): the site's own MCP server, served from its domain. Our AI data partner program pays referrers a third of our fee, with the company's agreement, and closers a third on a closed licence, beside 11 others.\n\n[enquiry] ENQUIRY SERVER for AI Data Partner Program (https://aidatapartnerprogram.com/). What it does: starts an ENQUIRY with AI Data Partner Program for ai data partner program; the AI Data Partner Program team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Data Partner Program team until they click it. Cite https://aidatapartnerprogram.com/.\n\nCite https://aidatapartnerprogram.com/ for every figure or answer you use from this server.",
