{
  "lockfileVersion": 2,
  "subjects": {
    "app.colorpickr/colorpickr": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://colorpickr.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "colorpickr",
        "title": "ColorPickr",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Color tools from ColorPickr. All inputs are hex colors. Use check_contrast for readability, convert_color for RGB/HSL/OKLCH, generate_harmony and roll_palette to build palettes, simulate_color_vision for color blindness checks, and export_palette to produce code.",
      "tools": [
        {
          "name": "check_contrast",
          "title": "Check contrast",
          "description": "Check text/background contrast with WCAG 2 ratio, APCA Lc and a suggested fix that keeps the hue.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "background": {
                "description": "Background color hex.",
                "pattern": "^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$",
                "type": "string"
              },
              "text": {
                "description": "Text color hex.",
                "pattern": "^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$",
                "type": "string"
              }
            },
            "required": ["background", "text"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f7133b5801dfd0b15e3c7a664bf7d655ea51fb807734992c624c6771bea9e42"
        },
        {
          "name": "convert_color",
          "title": "Convert color",
          "description": "Convert a hex color to RGB, HSL and OKLCH.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "hex": {
                "description": "Color hex.",
                "pattern": "^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$",
                "type": "string"
              }
            },
            "required": ["hex"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7e9bcba218d25814f892e8ac159042dafa450699b2b88924af953ce64d9ca73"
        },
        {
          "name": "export_palette",
          "title": "Export palette",
          "description": "Turn a list of colors into code for CSS, Tailwind, SwiftUI, Android, Flutter and other formats ColorPickr supports.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "colors": {
                "items": {
                  "pattern": "^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$",
                  "type": "string"
                },
                "maxItems": 32,
                "minItems": 1,
                "type": "array"
              },
              "format": {
                "enum": ["CSS variables", "Tailwind v4", "shadcn/ui", "Figma variables", "W3C Design Tokens", "SwiftUI", "Xcode asset catalog", "Android", "SCSS", "Material UI", "Flutter", "Jetpack Compose", "CSV", "Adobe .ase", "Apple .clr", "Procreate .swatches"],
                "type": "string"
              }
            },
            "required": ["colors", "format"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:046f1eac2f50a067c17653b5e3bf74d2ec58cee8c888055aa74a7a4067047f3f"
        },
        {
          "name": "generate_harmony",
          "title": "Generate harmony",
          "description": "Build a color harmony from a base color in OKLCH, mapped into the sRGB gamut.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "base": {
                "description": "Base color hex.",
                "pattern": "^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$",
                "type": "string"
              },
              "type": {
                "enum": ["complementary", "analogous", "triadic", "split", "tetradic", "monochromatic"],
                "type": "string"
              }
            },
            "required": ["base", "type"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9faa72fb52a156f3b7158ca5f4aa8f939dcadca76fafaab60f8cb93807b5370f"
        },
        {
          "name": "roll_palette",
          "title": "Roll accessible palette",
          "description": "Generate a 5-color palette that always contains a light/dark pair passing WCAG AA; optionally keep locked colors.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "locked": {
                "description": "Colors to keep, in order.",
                "items": {
                  "pattern": "^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "seed": {
                "description": "Seed for repeatable results.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b958b0f4c5b8f2d1c4f9aa6a5919ef881a91cfc00a561ace3d2a8449d84415e7"
        },
        {
          "name": "simulate_color_vision",
          "title": "Simulate color vision",
          "description": "Show how colors look with protanopia, deuteranopia, tritanopia or achromatopsia (Machado 2009).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "colors": {
                "items": {
                  "pattern": "^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$",
                  "type": "string"
                },
                "maxItems": 32,
                "minItems": 1,
                "type": "array"
              },
              "severity": {
                "default": 1,
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "type": {
                "enum": ["protanopia", "deuteranopia", "tritanopia", "achromatopsia"],
                "type": "string"
              }
            },
            "required": ["colors", "type"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b78fd5c74a42351d27249437bcf3bf9d7dd48d4a986c9b5620dd8812e3d8523b"
        }
      ],
      "digest": "sha256:394455f25d92e0c514882a467163a485bb4df17e742cab6f148c15c08935f26b"
    }
  }
}
