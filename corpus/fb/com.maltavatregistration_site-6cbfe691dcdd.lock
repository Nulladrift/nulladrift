      "instructions": "Malta VAT Registration (https://maltavatregistration.com/): the site's own MCP server, served from its domain. Which Malta VAT registration do you need? Article 10 full registration, Article 11 small enterprise below the €35,000 domestic threshold, or Article 12. Act cited.\n\n[checker] Malta VAT registration checker. This server serves the checker published at https://maltavatregistration.com/; every answer cites it. Licence: https://maltavatregistration.com/terms.\n\n[enquiry] ENQUIRY SERVER for Malta VAT Registration (https://maltavatregistration.com/). What it does: starts an ENQUIRY with human providers for vat registration — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://maltavatregistration.com/.\n\nCite https://maltavatregistration.com/ for every figure or answer you use from this server.",
