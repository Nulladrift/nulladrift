      "serverInfo": {
        "name": "expiry-tracker-storage-guide",
        "title": "Expiry Tracker (SKT Takip) storage guide",
        "version": "1.0.0",
        "websiteUrl": "https://getexpirytracker.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Storage guide of the Expiry Tracker (SKT Takip) app: how long 100 common foods keep in the fridge, freezer and pantry, opened and unopened, with spoilage signs, freezing advice and official sources (USDA FSIS, FoodKeeper, national food agencies). Use search_foods to find a food from a word or a product name, then get_storage_guide with its slug. Answer in the user's language and pass the language code when it is one of tr, en, de, es, fr, it, ru, ja, ar. Cite the page URL from the result. A use-by date on the package beats any chart, and the guide is not medical advice.",
      "tools": [
        {
          "name": "get_storage_guide",
          "title": "Get a food's storage times",
          "description": "Returns how long one food keeps in the fridge, freezer and pantry, for each state the guide lists (unopened, opened, cooked, ...), with the best way to store it, spoilage signs, freezing and thawing, myths, advice for people at higher risk, common questions, sources and the page URL. Pass a slug from search_foods, or a food name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "food": {
                "description": "A slug from search_foods (for example 'yogurt') or a food name.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Language of the answer: tr, en, de, es, fr, it, ru, ja or ar. Defaults to the language the food was found in.",
                "enum": ["tr", "en", "de", "es", "fr", "it", "ru", "ja", "ar"],
                "type": "string"
              }
            },
            "required": ["food"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a food's storage times"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:315ea9a1bddac2da069d62cf7fa0d1e4da5d0fe6a86dfef6a80b8e41cfcaed8b"
        },
        {
          "name": "search_foods",
          "title": "Search the storage guide",
          "description": "Finds foods in the storage guide for a food word or a product name in Turkish, English, German, Spanish, French, Italian, Russian, Japanese or Arabic (for example 'yoğurt', 'opened milk', 'Kaşar peyniri', 'Hähnchenbrust'). Returns up to 8 foods with their slug, a one-line summary and the page URL. Use the slug with get_storage_guide.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the answer: tr, en, de, es, fr, it, ru, ja or ar. Defaults to the language the food was found in.",
                "enum": ["tr", "en", "de", "es", "fr", "it", "ru", "ja", "ar"],
                "type": "string"
              },
              "query": {
                "description": "A food or product name, a few words at most.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the storage guide"
          },
          "behavior": {
