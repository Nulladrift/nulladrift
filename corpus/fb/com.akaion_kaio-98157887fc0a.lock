      "instructions": "Kaio — find and book local businesses in Italy (beauty salons, hairdressers, trades, studios) that take bookings with Kaio. search_kaio_businesses finds them by what and where; get_kaio_business gives services with prices and ids; kaio_free_slots the real free times; book_kaio_appointment books; when it returns a pay_url, give it to the person to pay online right away. Before booking, repeat business, service, day and time and the person's name and phone/email, and book only after they say yes. Times are Europe/Rome. Services marked on_request have no free times: the person leaves a request with request_kaio_appointment (what they need, when they prefer) and the owner calls back to fix day and time — recap it and get their yes first.",
      "tools": [
        {
          "name": "book_kaio_appointment",
          "title": "Book appointment",
          "description": "Book an appointment at a Kaio business. `start_time` is one of the slots from kaio_free_slots\n    (ISO 8601 with offset). A phone or an email is required: the business uses it to confirm and remind.\n    Only call this after the person has confirmed business, service, day, time and contact details.",
          "inputSchema": {
            "properties": {
              "email": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
