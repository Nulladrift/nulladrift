          "title": "Request appointment",
          "description": "Leave a request at a Kaio business for a service marked on_request (get_kaio_business): no slot is\n    picked, the owner calls back to fix day and time. `description`: what is needed (job, address or area,\n    sizes…); `preferred_time`: free text (\"mattina\", \"dopo le 17\", \"settimana prossima\"). A phone or an email\n    is required. First recap business, service, description, preferred time and contact details to the\n    person, and call this only after they say yes.",
