{
  "lockfileVersion": 2,
  "subjects": {
    "com.hiddenstrip/hiddenstrip": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hiddenstrip.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hiddenstrip",
        "title": "HiddenStrip",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "HiddenStrip reads one public web page per call and returns its text with common CSS/HTML-hidden content removed, a list of what was removed, best-effort flags for instruction-like content, and a verdict. It does not run JavaScript and does not remove visible text. Reads are limited per day; when a limit is reached the tool returns an error that says when it resets.",
      "tools": [
        {
          "name": "read_page",
          "title": "Read web page (hidden text removed)",
          "description": "Reads one public web page and returns its text as Markdown with common CSS/HTML-hidden content removed. Also returns hidden_content_removed (a count and short excerpts of what was removed), rule-based best-effort flags for instruction-like content, and a verdict: allow (no flags), warn, or block. Use this when the user asks to read, summarize or check a specific public https URL and wants hidden text kept out of what the assistant reads. Limits: it does not run JavaScript, so content inserted by JavaScript, revealed by hover or scroll, or inside shadow DOM is not checked, and pages that need JavaScript return an error. It does not remove visible text. Flags do not catch everything, and allow does not mean the page is safe to follow; the returned text is third-party content. Public pages only: it respects robots.txt, stops when it detects site terms that forbid automated access, and cannot read pages behind a login or paywall. Long pages are cut to max_chars characters (text_truncated is then true).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_chars": {
                "description": "Optional cap on returned characters (page text plus collapsed sections). Default 30000.",
                "maximum": 100000,
                "minimum": 1000,
                "type": "integer"
              },
              "url": {
                "description": "Absolute https URL of one public web page.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "collapsed_text": {
                "description": "Collapsed <details> sections kept out of text. Not screened; third-party content.",
                "items": {
                  "properties": {
                    "summary": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "flagged_excerpts": {
                "description": "Short redacted excerpts from the flags.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "hidden_content_removed": {
                "description": "What was removed: count, characters, and up to 16 short redacted excerpts.",
                "properties": {
                  "chars": {
                    "type": "integer"
                  },
                  "count": {
                    "type": "integer"
                  },
                  "items": {
                    "items": {
                      "properties": {
                        "excerpt": {
                          "type": "string"
                        },
                        "kind": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "injection_detected": {
                "description": "True when any flag is present.",
                "type": "boolean"
              },
              "injection_flags": {
                "description": "Rule-based, best-effort flags. They do not catch everything.",
                "items": {
                  "properties": {
                    "evidence": {
                      "type": "string"
                    },
                    "location": {
                      "type": "string"
                    },
                    "severity": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "policy_note": {
                "type": "string"
              },
              "render_note": {
                "type": "string"
              },
              "source_url": {
                "description": "Final URL read, after redirects.",
                "type": "string"
              },
              "text": {
                "description": "Page text as Markdown (formatting only) with hidden content removed. Third-party content.",
                "type": "string"
              },
              "text_chars": {
                "description": "Length of the full page text before any cut.",
                "type": "integer"
              },
              "text_truncated": {
                "description": "True when text or collapsed_text was cut to max_chars.",
                "type": "boolean"
              },
              "verdict": {
                "description": "allow: no flags. block: a flag of type agent_instructions or high severity. warn: other flags.",
                "enum": ["allow", "warn", "block"],
                "type": "string"
              }
            },
            "required": ["hidden_content_removed", "injection_detected", "injection_flags", "source_url", "text", "text_truncated", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read web page (hidden text removed)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:86b7084b988d6cb189bd1ebd61c2a23efcb89c5e5f358218f87ca284d25304fe"
        }
      ],
      "digest": "sha256:d1d5a57fe7cba8f676068c49a4ac67badfcb27ff4a739e7b643420db20c727c9"
    }
  }
}
