        {
          "name": "assay_pbo",
          "title": "Measure probability of backtest overfitting",
          "description": "Use this when you have the T x N returns of a grid search and want\nthe probability of backtest overfitting (PBO, CSCV) -- did the sweep\nfind an edge or manufacture one? A demote-only audit, not buy/sell advice.\nDid your parameter sweep FIND an edge -- or manufacture one? PBO over\nthe whole trial matrix.\n\nSubmit the full T x N payoff matrix of every configuration you tried\n(rows = time-ordered per-period returns, columns = the candidates from\nyour grid search / parameter sweep / optimisation run) and get the\nProbability of Backtest Overfitting via combinatorial symmetric\ncross-validation (CSCV, Bailey/Borwein/Lopez de Prado/Zhu 2017) with\npurge and embargo against overlapping-label leakage: the fraction of\ntrain/test splits in which your in-sample winner ranks at or below the\nout-of-sample median. The dossier adds the performance-degradation slope\n(does out-of-sample decay as in-sample shines?), the probability of\nout-of-sample loss, and first-order stochastic dominance of your\nselected picks versus the whole pool. Complements the trial ledger: the\nledger counts how many tries your family burned, PBO grades whether the\nSELECTION PROCESS itself is overfit -- PBO >= 0.5 earns the named demote\nPBO_HIGH. Exhaustive enumeration with nothing to seed,\nfail-closed on undersized, oversized or non-numeric input. Demote-only:\nit can kill a selection, never bless one. NOT a buy/sell signal.\nPrice: per check; see https://api.alphaassay.com/v1/meta/pricing\n(api_key required -- account setup at\nhttps://api.alphaassay.com/account).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "default": "",
                "description": "API key for a paid MCP check. Hosted Streamable HTTP clients should send it in the Authorization: Bearer transport header so the model never sees the secret; local stdio callers may supply the raw key in this tool argument without a Bearer prefix. Create an account at https://api.alphaassay.com/account; the current free allowance and prices are published at https://api.alphaassay.com/v1/meta/pricing. Paid MCP calls use API-key credits; x402 buys only the separate REST POST /x402/v1/gauntlet and is not MCP billing.",
                "maxLength": 512,
                "type": "string"
              },
              "embargo": {
                "default": 0,
                "description": "Extra embargo bars after each test block.",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer",
                "x-strictJsonInteger": true
              },
              "n_groups": {
                "default": 8,
                "description": "Number of CSCV partitions (even; combinatorial in/out-of-sample splits).",
                "maximum": 16,
                "minimum": 2,
                "multipleOf": 2,
                "type": "integer",
                "x-strictJsonInteger": true
              },
              "periods_per_year": {
                "anyOf": [
                  {
                    "type": "integer",
                    "x-strictJsonInteger": true
                  },
                  {
                    "type": "number"
                  }
                ],
                "default": 365,
                "description": "Annualisation factor for the reported Sharpes.",
                "gt": 0,
                "le": 1000000
              },
