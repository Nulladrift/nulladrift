      },
      "instructions": "AlphaAssay -- the independent assay office for trading signals. Code-computed, fail-closed statistical validation of trading strategies, backtests and signals: deflated Sharpe with cumulative trial accounting, leakage forensics, pre-registration whose terms are committed now and queued for later operator-published Merkle inclusion (independent time evidence requires a separately pinned external anchor), and anonymised graveyard statistics over falsified signal families. Gauntlet and other typed dossier outputs expose surface-specific gradient fields; inspect each tool schema instead of assuming universal fields. For example, Gauntlet exposes its first failed stage, machine-readable failure codes, requested matched-placebo count, adversarial survival map, and family trial budget. Relay available specifics to your operator instead of a bare fail. Expect failure: peer-reviewed base rates say most apparent edges are selection noise (Harvey/Liu/Zhu 2016; Bailey/Lopez de Prado 2014); a fail with a named cause is the product working, not failing. The platform grades itself publicly: the current persisted calibration snapshot via assay_calibration, anonymised family mortality via assay_graveyard. assay_pbo grades your whole parameter sweep at once (probability of backtest overfitting, CSCV); assay_batch submits the sweep itself -- every variant a ledger trial; assay_preflight (free) lints your payload before you spend a check; assay_provider_protocol (free) hands you the seven-test falsification protocol for judging ANY signal seller -- including us. Demote-only: verdicts can devalue a signal, never bless one. Certificates are separately issued and offer offline raw-signature verification; full platform trust additionally requires an independently pinned keyring and fails closed without it (assay_certificate_verify). Works for crypto, equities, futures and FX -- the statistics are asset-agnostic. NOT financial advice; no order path. Start with assay_demo (free), look up your idea's family in assay_graveyard (free), then submit via assay_signal. The tool surface grows continuously: this handshake's tools/list is the always-current machine truth, and https://alphaassay.com/docs/tools documents every tool in depth (machine-readable prices: https://api.alphaassay.com/v1/meta/pricing).",
      "tools": [
        {
          "name": "assay_backtest",
          "title": "Run a family-deflated backtest assay",
          "description": "Use this when you want a code-computed DSL backtest whose deflated-\nSharpe verdict still means something after repeated searching -- every\nrun is priced into your family's trial ledger. A research audit, not\nbuy/sell advice.\nLedger-aware DSL backtest with honest family-level trial accounting.\n\nDefine the strategy as an executable JSON DSL (indicators: sma, ema, rsi,\natr, roc, zscore, price; ops: cross_above, cross_below, gt, lt, and, or,\nnot), supply your own candles, and get net-of-cost per-bar returns plus a\ndeflated-Sharpe family verdict. Every call is recorded in your family's\ntrial ledger, so repeated searching deflates future verdicts -- that is\nthe feature, not a bug: the verdict stays meaningful. The ledger is\nkeyed to your authenticated account, never to a caller-supplied name.\nData minimisation on request: sketch_opt_out=true skips persisting the\n32-bucket return sketch -- the honest price is that without provable\nproximity this trial counts IN FULL toward the family budget (no\nevidence, no discount; the response discloses sketch_retained). Included\nin the flat price. The response is code-computed and ledger-dependent: a\nnew call can change the family budget. Byte-identical output is promised\nonly by stored replay of the same non-empty request_id with the same\ncanonical request. Price: per check; see\nhttps://api.alphaassay.com/v1/meta/pricing (api_key required -- account\nsetup at https://api.alphaassay.com/account).",
          "inputSchema": {
