        {
          "name": "create_listing",
          "title": "Create listing",
          "description": "Create a new draft listing. Returns the full created listing exactly as stored, including its hashid and status. Pass an idempotency_key (any client-generated string, e.g. a UUID) to make the call safe to retry — re-sending the same key returns the original listing instead of creating a duplicate.",
          "inputSchema": {
            "properties": {
              "apn": {
                "description": "The county assessor parcel number (APN / parcel ID), if known. Used with the county to find the building if another listing already has it.",
                "type": ["string", "null"]
              },
              "city": {
                "description": "City.",
                "type": "string"
              },
              "county": {
                "description": "County.",
                "type": "string"
              },
              "formatted_address": {
                "description": "Full formatted address string from geocoder.",
                "type": ["string", "null"]
              },
              "idempotency_key": {
                "description": "Optional client-generated key (e.g. a UUID) making this create safe to retry: re-sending the same key within 24 hours returns the originally created listing instead of a duplicate.",
                "type": ["string", "null"]
              },
              "latitude": {
                "description": "Latitude coordinate.",
                "type": "number"
              },
              "listing_type": {
                "description": "Listing type: sale or lease.",
                "enum": ["sale", "lease"],
                "type": "string"
              },
              "longitude": {
                "description": "Longitude coordinate.",
                "type": "number"
              },
              "place_id": {
                "description": "Place ID from geocoder.",
                "type": ["string", "null"]
              },
              "postal_code": {
                "description": "ZIP/postal code.",
                "type": "string"
              },
              "property_type": {
                "description": "Property type. Allowed values are listed under the property_type attribute returned by get_registry (e.g. industrial, office, retail, land).",
                "type": "string"
              },
              "state": {
                "description": "State (2-letter abbreviation).",
                "type": "string"
              },
              "street_address": {
                "description": "Street address of the property.",
                "type": "string"
              },
              "unit": {
                "description": "Unit or suite number, if applicable.",
                "type": ["string", "null"]
              }
            },
            "required": ["city", "county", "latitude", "listing_type", "longitude", "postal_code", "property_type", "state", "street_address"],
            "type": "object"
