        },
        {
          "name": "sign_attachment_upload",
          "title": "Sign attachment upload",
          "description": "Begin an out-of-band file upload. Returns a presigned R2 PUT URL and the headers to use; the file bytes are uploaded directly to storage, never through this channel. After PUTting the file, call confirm_attachment_upload with the returned attachment_id. Supports listings (photos, documents), users (avatar), and pages (cover, photos). Avatars pass an automated content check before they appear publicly.",
          "inputSchema": {
            "properties": {
              "attachable_id": {
                "description": "Identifier of the attachable resource. For \"listing\" pass the listing hashid (e.g. \"d5yqqgoa\") — the same id every read tool returns. For \"user\" pass \"me\" to attach to yourself. For \"page\" pass its numeric id.",
                "type": "string"
              },
              "attachable_type": {
                "description": "Morph alias of the resource to attach to: \"listing\", \"user\", or \"page\".",
                "type": "string"
              },
              "collection": {
                "description": "Optional explicit collection: \"photos\", \"documents\", \"avatar\", or \"cover\". Omit to auto-route by MIME (images→photos, PDFs→documents; documents are PDF only). Singleton slots (avatar/cover) must be set explicitly.",
                "type": ["string", "null"]
              },
              "content_type": {
                "description": "MIME type of the file, e.g. \"image/jpeg\" or \"application/pdf\". Must match the collection whitelist.",
                "type": "string"
              },
              "filename": {
                "description": "Original filename including extension, e.g. \"front-elevation.jpg\". Used to derive the storage key and extension.",
                "type": "string"
              },
              "size": {
                "description": "Exact byte size of the file. Verified against the uploaded object at confirm time, so it must be accurate.",
                "type": "integer"
              }
            },
            "required": ["attachable_id", "attachable_type", "content_type", "filename", "size"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Sign attachment upload"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
