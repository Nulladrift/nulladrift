        {
          "name": "get_faq",
          "title": "Get FAQ",
          "description": "Answers to the questions people ask about SPACEXPLORATION itself: what it costs, listing a property, where leads go, finding property, AI assistants (including the built-in one), where the building data comes from, and accounts. Call this before answering any question about how SPACEXPLORATION works or what it costs, answer from what it returns, and link the entry's `url` (or its `see` page when it has no url). Pass `topic` to read one group; leave it out for all of them.",
