        {
          "name": "publish_listing",
          "title": "Publish listing",
          "description": "Kick off the publish pipeline for a draft listing. Enriches with AI, gathers market data, then transitions the listing to Active. Returns the pipeline ID to track progress, plus `suggestions` — non-blocking fixes (a flyer as the cover photo, a placeholder address, an unusual cap rate) to pass on to the user. Fails with the unmet readiness checklist if the listing is not ready. When photos hold it back, `photos_to_review` lists each one with its reason, and `owner_can_keep` marks a photo held only for an MLS or listings-site watermark: ask the user whether they own or have the rights to it, and if so send them to `editor_url` to confirm it there, since only they can.",
