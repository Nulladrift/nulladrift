        {
          "name": "get_listing",
          "title": "Get listing",
          "description": "Retrieve the full details of a single listing by its hashid. Returns the complete ListingResource projection including parcel data, all attribute details, and attachments: photos, plus the public documents the broker attached (brochures, offering memoranda, site plans) with their filename and a direct download URL. Broker contact is included only when the requesting user is authorised to manage the listing; such a user also gets every lease suite with its id and status, the rows update_listing takes back. parcel.lot_size is always in square feet; lot_size_unit only names the unit the lister typed it in (58370 with \"acres\" is 58,370 square feet, about 1.34 acres).",
          "inputSchema": {
            "properties": {
              "hashid": {
                "description": "The short hashid of the listing (e.g. \"a1b2c3d4\"). Found in listing URLs and search hits.",
                "type": "string"
              }
