        {
          "name": "search_listings",
          "title": "Search listings",
          "description": "Search commercial real estate listings. Returns paginated hits with facet counts; every hit carries the public `url` to cite and its `listed_at` / `updated_at` stamps. For AI-driven search, call interpret_search first to convert a natural-language query into structured filters, then pass those filters — and its bounds, when present — here.",
          "inputSchema": {
            "properties": {
              "bounds": {
                "description": "Geographic bounding box (degrees) limiting hits to an area. Forward the bounds returned by interpret_search verbatim to honour \"near <place>\" intent; omit for a nationwide search.",
                "properties": {
                  "ne_lat": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "ne_lng": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "sw_lat": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "sw_lng": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "type": ["object", "null"]
              },
              "filters": {
                "description": "Structured filter map keyed by Typesense field name. Ranges as {min?, max?}, multi-select as string[], booleans as true/false. Call get_registry to see valid field names and allowed values.",
                "type": ["object", "null"]
              },
              "page": {
                "description": "Page number (1-based). Defaults to 1.",
                "type": ["integer", "null"]
              },
              "query": {
                "description": "Free-text search query (street address, city, or keyword). Omit or pass null for no text filter.",
                "type": ["string", "null"]
              },
              "sort": {
                "description": "Sort key. Valid values from get_registry sort_options (e.g. \"listed_at:desc\", \"price:asc\").",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
