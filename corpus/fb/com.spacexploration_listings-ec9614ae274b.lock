        {
          "name": "set_listing_attributes",
          "title": "Set listing attributes",
          "description": "Set broker-authored attributes on a listing you own. Pass `attributes` as a map of registry field name to value (the field names get_registry returns, e.g. {\"attr_parking_spaces\": 40, \"attr_office_class\": \"Class A\"}). Only fields get_registry marks \"writable\":true can be set; publish-time computed fields and hot columns (use update_listing for those) are rejected with guidance. Enum fields take the allowed value (or an array for multiselect); send null to clear a field (a live listing refuses to clear one publishing requires). Returns the full updated listing.",
          "inputSchema": {
            "properties": {
              "attributes": {
                "description": "Map of registry field name to value, e.g. {\"attr_parking_spaces\": 40, \"attr_office_class\": \"Class A\", \"attr_industrial_rail_access\": true}. Only fields get_registry marks \"writable\":true are accepted. Multiselect enum fields take an array of allowed values. Send null to clear a field.",
                "type": "object"
              },
              "hashid": {
                "description": "Hashid of the listing to update.",
                "type": "string"
              }
            },
            "required": ["attributes", "hashid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Set listing attributes"
          },
          "behavior": {
