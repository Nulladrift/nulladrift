      "instructions": "External MCP server for SPACEXPLORATION commercial real estate listings. Read tools (search_listings, get_listing, get_parcel, interpret_search, get_registry, get_faq) work anonymously — no token needed. For any question about SPACEXPLORATION itself (what it costs, listing a property, accounts, the built-in assistant), call `get_faq`, answer from it, and link the url each entry carries. Account-bound tools (building lookups by address, saved searches, geocoding, listing authoring) require OAuth 2.0 Authorization Code + PKCE (Passport-issued bearer token, scope: mcp:use; a client is its own HTTPS Client ID Metadata Document URL, or self-registers via Dynamic Client Registration — fetch /auth.md for the walkthrough). Listing authoring additionally requires a verified email address, and listing mutations are gated on the caller owning the underlying listing. When the user wants to report a bug, request a feature, or ask the SPACEXPLORATION team a question, file it with `send_feedback` (works anonymously).",
      "tools": [
        {
          "name": "attach_listing_photo",
          "title": "Attach listing photo",
          "description": "Attach a photo to a listing you own directly from its public URL — one call, no separate sign/upload/confirm. The server fetches the image and ingests it with auto-generated thumbnail/hero/full variants. Only https image URLs whose host is publicly routable are accepted. The photo is content-moderated (must be real-estate related and safe) before it can appear publicly — the returned snapshot includes the moderation_status (approved / rejected / escalated) and moderation_reason. A rejected or escalated photo will not be publicly visible and will block publishing until removed or replaced.",
          "inputSchema": {
            "properties": {
              "hashid": {
                "description": "Hashid of the listing to attach the photo to.",
                "type": "string"
              },
              "source_url": {
                "description": "Public https URL of the image to fetch and attach. Must point directly at an image (jpeg, png, webp, gif, avif, heic/heif) on a publicly-routable host.",
                "type": "string"
              }
            },
            "required": ["hashid", "source_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Attach listing photo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
