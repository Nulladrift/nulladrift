      "tools": [
        {
          "name": "get_earnings_summary",
          "title": "Get earnings summary",
          "description": "Revenue, net income, and basic/diluted EPS by fiscal period for a US public company, normalized from SEC XBRL data. Handles the parts that are easy to get wrong: revenue tags changed over time, restated figures are reconciled to the latest value, and each period keeps the fiscal year/quarter from its ORIGINAL filing (prior-year comparatives inside later filings do not corrupt the labels). Every period carries its source accession number and filing date. Use it for trend analysis, growth rates, or a specific quarter's results. Price: $0.02 per call (x402 USDC on Base, or a Stripe API key). Check coverage first with probe_coverage (free).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "period": {
                "description": "Filter: \"annual\" | \"quarterly\" | \"interim\" | fiscal year (2025/FY2025) | frame (CY2026Q1)",
                "type": "string"
              },
              "ticker": {
                "description": "Ticker symbol, e.g. AAPL",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2c029b2cad7a73bfeb64ab5e77c0b7b34b5d546659fa3681a916def257aa8ca8"
        },
        {
          "name": "get_insider_transactions",
          "title": "Get insider transactions",
          "description": "Form 4 insider transactions for a US public company: who traded, their role (director/officer/10% owner), transaction code, share count, price, and shares held afterwards. Parsed from the raw ownership XML, including derivative transactions, so you get structured rows instead of one XML document per trade. Use it to detect insider buying/selling activity or check a specific executive. Price: $0.01 per call (x402 USDC on Base, or a Stripe API key). Check coverage first with probe_coverage (free).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "since": {
                "description": "Only transactions on/after this date (YYYY-MM-DD)",
                "type": "string"
              },
              "ticker": {
                "description": "Ticker symbol, e.g. AAPL",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:39120c9cee49a7d470a4bbe47bd030c23ecc3a88e8ade04c19444406ba75e2e2"
        },
        {
          "name": "get_latest_filings",
          "title": "Get latest filings",
          "description": "Latest SEC filings for a US public company, as structured JSON: form type, filing date, period, accession number, and a direct link to the document. Pre-indexed, so this is one fast call instead of crawling EDGAR and parsing its index pages. Use it to answer 'what has this company filed recently?' or to locate a specific 10-K/10-Q/8-K before reading it. Price: $0.01 per call (x402 USDC on Base, or a Stripe API key). Check coverage first with probe_coverage (free).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "form": {
                "description": "Form type filter, e.g. 10-K, 10-Q, 8-K, 4",
                "type": "string"
              },
              "limit": {
                "description": "Max filings (default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "ticker": {
                "description": "Ticker symbol, e.g. AAPL",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8c97763489929d9451dc9ec62da8cf82f8822a486198483ac45f844c5779dcc1"
        },
        {
          "name": "probe_coverage",
          "title": "Check coverage and pricing (free)",
          "description": "FREE — no payment required. Call this FIRST to check whether a ticker is covered and what it will cost before spending anything. Returns whether the company is in the corpus, how much data exists (filings / earnings periods / insider transactions), how fresh it is, and the exact price of every paid tool. If a ticker is not covered, the paid tools return no data — so check here instead of paying to find out.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "Ticker to check, e.g. AAPL. Omit for service-wide coverage.",
                "type": "string"
              }
            },
            "type": "object"
          },
