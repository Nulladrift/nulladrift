        },
        {
          "name": "purchase_vpn",
          "description": "Buy VPN access using the agent wallet balance. Deducts the plan price and returns the username, password and expiry instantly. plan is one of 7d, 15d, 30d, 90d, 180d, 365d - call list_vpn_plans first for the current prices and server countries. One payment, no auto-renewal, no account. Configs are fetched afterwards with get_vpn_config, or from the order page. Pass request_id for safe retries. This spends real balance - only call it once the user has confirmed. Not an eSIM: it carries no phone number and no mobile data.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "The ak_live_ key returned by create_wallet. Pass it here, or as an Authorization: Bearer header.",
                "type": "string"
              },
              "plan": {
                "description": "Plan key from list_vpn_plans.",
                "enum": ["7d", "15d", "30d", "90d", "180d", "365d"],
                "type": "string"
              },
              "request_id": {
                "description": "Optional idempotency key - reuse on a retry to avoid a double charge.",
                "type": "string"
              }
            },
            "required": ["plan"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9336723a42f5efaf3023eb44bd44ad088dd0014807f5b4e9662f88e2f9998c6b"
        },
        {
          "name": "search_esim_plans",
          "description": "Search BuyUKeSIM travel/data eSIM plans for a country. Returns plan name, data amount, validity days, USD price, package code and a buy link that opens checkout on that exact plan. Structured output adds, per plan: covered countries, local carriers, 5G, top-up support, hotspot (allowed on every plan) and the country traffic exits in. A feature the supplier does not state is null (unknown), never false. Pass a 2-letter ISO country code (e.g. GB, US, TR, JP). Omit country to get popular/featured plans. Data only: no phone number, no SMS (for that see get_uk_number_info).",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "2-letter ISO country code, e.g. GB, US, TR, JP. Optional.",
                "type": "string"
              },
              "limit": {
                "description": "Max plans to return (1-50). Default 20.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
