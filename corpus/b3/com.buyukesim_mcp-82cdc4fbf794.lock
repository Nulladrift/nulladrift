        {
          "name": "purchase_esim",
          "description": "Buy a travel/data eSIM using the agent wallet balance (pass the ak_live_ api key from create_wallet). Deducts the plan price from the balance and returns the eSIM QR code instantly. Get a package_code from search_esim_plans first. Pass a stable request_id to make retries safe (no double charge). This provisions a real eSIM - only call it when the user has confirmed the purchase.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "The ak_live_ key returned by create_wallet. Pass it here, or as an Authorization: Bearer header.",
                "type": "string"
              },
              "package_code": {
                "description": "The plan code from search_esim_plans, e.g. CKH253.",
                "type": "string"
              },
              "request_id": {
                "description": "Optional idempotency key - reuse the same value on a retry to avoid a double charge.",
                "type": "string"
              }
            },
            "required": ["package_code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a0a917e9a5b8c31b83d84ff2f078b57d4a849e101013d3d768100e241f3e1853"
        },
        {
          "name": "purchase_esim_topup",
          "description": "Add more data to a travel eSIM this wallet already bought, paid from the balance. The data lands on the profile the user already installed: same QR, same ICCID, nothing to install again, so there is no new eSIM and nothing to scan. Use this when someone runs out of data mid-trip or needs longer than one plan - buying a second eSIM instead means a second profile to install. Get package_code from list_esim_topups. An eSIM takes 8 top-ups in total. Pass request_id for safe retries. This spends real balance - only call it once the user has confirmed.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "The ak_live_ key returned by create_wallet. Pass it here, or as an Authorization: Bearer header.",
                "type": "string"
              },
              "order_id": {
                "description": "The order_id of the travel eSIM to reload, from purchase_esim.",
                "type": "integer"
              },
              "package_code": {
                "description": "A top-up package code from list_esim_topups for THIS eSIM. Codes from search_esim_plans do not work here.",
                "type": "string"
              },
              "request_id": {
                "description": "Optional idempotency key - reuse on a retry to avoid a double charge.",
                "type": "string"
              }
            },
            "required": ["order_id", "package_code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
