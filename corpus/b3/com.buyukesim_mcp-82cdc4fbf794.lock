      "serverInfo": {
        "name": "buyukesim",
        "title": "BuyUKeSIM",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BuyUKeSIM (UK +44 number eSIM, travel data eSIM and VPN access, no-KYC, crypto payment). Public catalog tools: search_esim_plans, list_covered_countries, get_uk_number_info, list_vpn_plans (VPN access plans, server ids and countries), check_order_status, get_vpn_config (fetch a WireGuard, OpenVPN or VLESS config for a VPN order using its order_id and magic code - no wallet key needed). Agent-wallet tools (prepaid no-KYC crypto balance): create_wallet -> pass the returned api_key as the api_key argument on every other wallet tool -> create_deposit (min $100, fund with crypto), check_balance, list_transactions, purchase_esim (buy a travel/data eSIM from the balance, returns the QR), list_esim_topups + purchase_esim_topup (add more data to an eSIM already bought - same profile, same QR, nothing to reinstall; use this instead of selling a second eSIM when someone runs out mid-trip), purchase_uk_number (buy a UK +44 number eSIM from stock, ~$25), purchase_vpn (buy VPN access for 7 to 365 days from the balance, returns the username, password and expiry; then get_vpn_config for the config files). VPN access is not an eSIM: no phone number, no mobile data. One-Time Codes are paused and cannot be bought; the UK Number receives verification SMS for any app. eSIM purchases return the QR instantly, together with the SM-DP+ address and activation code for installing without scanning anything; all purchases are idempotent via request_id.",
