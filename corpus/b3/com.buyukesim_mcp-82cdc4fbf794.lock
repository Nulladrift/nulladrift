        },
        {
          "name": "check_uk_coverage",
          "description": "Check whether the UK +44 number has been reported working in a country, from buyers who told us after using it there. Pass a 2-letter ISO country code. Returns how many reports exist and how many said it worked, and says plainly when there are none - an absent country means no evidence either way, not a failure. This is evidence, not a promise: roaming depends on the local network. Read-only.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "2-letter ISO country code, e.g. NG, DE, RU.",
                "type": "string"
              }
