        {
          "name": "list_vpn_plans",
          "description": "List the BuyUKeSIM VPN access plans (7/15/30/90/180/365 days, USD price) and the server countries currently available, with protocols (WireGuard, OpenVPN, VLESS). VPN access, no account, paid in crypto. Read-only; buy a plan with purchase_vpn.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
