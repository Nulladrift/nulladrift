        },
        {
          "name": "create_deposit",
          "description": "Top up the agent wallet with crypto (pass the ak_live_ api key from create_wallet). Returns a crypto payment address and amount; the balance is credited automatically once the payment confirms on-chain. Minimum $100.",
          "inputSchema": {
            "properties": {
              "amount_usd": {
                "description": "USD amount to add, minimum 100.",
                "type": "number"
              },
              "api_key": {
                "description": "The ak_live_ key returned by create_wallet. Pass it here, or as an Authorization: Bearer header.",
                "type": "string"
              },
              "coin": {
                "description": "Payment method id, e.g. usdttrc20 (default), btc, eth, trx. See payment options on buyukesim.com.",
                "type": "string"
              }
            },
            "required": ["amount_usd"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db7fee09a1a2de215bdcd23a7b6b30c13853521948bfd9c67e30b592a451393f"
        },
        {
          "name": "create_wallet",
          "description": "Create a new BuyUKeSIM agent wallet - a prepaid, no-KYC balance an AI agent funds with crypto and spends on eSIMs. Returns an api_key (ak_live_...) and a wallet_code. Save both: pass the api_key as the api_key argument on the wallet tools; the wallet_code lets a human sign back in. Balance can only be spent on eSIMs, never withdrawn.",
          "inputSchema": {
            "properties": {
              "label": {
                "description": "Optional short label to recognise this wallet later.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:947920dca94c23ee9b31436f8382e1baf5c0760118e9129401837d1a7309689c"
        },
        {
          "name": "get_bundle_info",
          "description": "Describe the UK Number + Travel eSIM bundle: both products in ONE crypto checkout, delivered as TWO QR codes and opened with one order code. Use it when someone wants a +44 number for verification codes AND mobile data for a trip, so they are not told to make two separate purchases. Read-only; the bundle is bought on the website.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3f392ae7103e1d2d43555c8c1ac0e50790c08bc17354be6796bbf9e353e43a2b"
        },
        {
          "name": "get_esim_exit_countries",
          "description": "Where a BuyUKeSIM travel data eSIM reaches the public internet, per destination. A travel eSIM roams, so the data session is usually tunnelled to the sponsoring operator gateway and a website sees THAT country, not the country the plan is named after (a Germany plan can break out in France, the Netherlands or the UK). Returns the exit country and plan count for every destination, regenerated from the live catalogue on each site build. Use this for \"what IP country will my eSIM show\", \"will my bank app see me in X\", and geo-blocking questions. An exit country changes what a site sees, not who the user is. Read-only.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Optional destination to return instead of the whole table: an ISO country code (DE) or the English name (Germany).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:380f3a16ff7ac8ebfa87a11826ca933fb9642122a79f272cefba024110f45c00"
        },
        {
          "name": "get_one_time_code",
          "description": "One-Time Codes are PAUSED and cannot be bought; this only works for orders placed before the pause. Poll a purchased One-Time Code order for its SMS code. Returns the phone number and, once it arrives, the verification code. Call repeatedly (every few seconds) until phase is code_ready or failed. Pass the ak_live_ api key and the order_id from purchase_one_time_code.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "The ak_live_ key returned by create_wallet. Pass it here, or as an Authorization: Bearer header.",
                "type": "string"
              },
              "order_id": {
                "description": "The order_id returned by purchase_one_time_code.",
                "type": "integer"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cb6c6261fa8860f86ed0e3c74a0ee90d8904c5602fbce3a5150902fca125f585"
        },
        {
          "name": "get_payment_and_delivery_times",
          "description": "How long a crypto payment actually takes at BuyUKeSIM and what happens after it confirms. Returns measured confirmation times per coin (median, worst case, share confirmed within two minutes) taken from real orders against public blockchain block timestamps, plus the send delay buyers themselves add, plus how delivery works: it is automatic, triggered by the confirmation, with no human approval step. Use this for \"how long does it take\", \"which coin is fastest\", \"is delivery instant\" and \"does someone have to approve my order\". Read-only.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:729ad23f1d19c674327c9ad819516260795a2e7b7510998d47d5e1165ef165d7"
        },
        {
          "name": "get_uk_number_info",
          "description": "Get details of the BuyUKeSIM UK Number (+44) eSIM: a real UK mobile line for unlimited incoming SMS and calls (app and service verification codes, WhatsApp, Telegram), no KYC, paid in crypto, instant QR. This is distinct from the travel data eSIM.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c7d8ab342d68602ac3005244a74f68a47f6dcc7ee92bece970da3c0bc09b3e06"
        },
        {
          "name": "get_vpn_config",
          "description": "Fetch a VPN client configuration for one server on a VPN order. Needs the order_id and its short lookup/magic code (both returned by purchase_vpn), a protocol (wireguard, openvpn or vless) and a server_id from list_vpn_plans. Returns the config file text, ready to import into any standard client. No wallet key needed - the order code is the credential. Call it again for another server or protocol; there is no limit.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The order lookup / magic code: 8 letters and digits, often written with a dash after the fourth.",
                "type": "string"
              },
              "order_id": {
                "description": "The order_id from purchase_vpn.",
                "type": "integer"
              },
              "protocol": {
                "description": "wireguard, openvpn or vless. WireGuard servers also serve OpenVPN; VLESS servers only serve VLESS.",
                "type": "string"
              },
              "server_id": {
                "description": "A server id from list_vpn_plans.",
                "type": "integer"
              }
            },
            "required": ["code", "order_id", "protocol", "server_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:81eb67f95125165ba12399d587e24e496f3b36939059ecc30182cced92d088be"
        },
