{
  "lockfileVersion": 2,
  "subjects": {
    "com.asiavirtualsolutions/indexer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://index.asiavirtualsolutions.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "avs-indexer",
        "title": "AVS Indexer",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AVS Indexer sends URLs (for example new backlinks) to search engines for indexing. Submitting spends the user's credits: 1 credit per URL for normal indexing, 10 for instant. Before submit_urls, always call estimate_cost, tell the user the number of URLs and the credit cost, and get a clear yes. Use normal indexing unless the user asks for instant. Don't promise that every URL will be indexed: search engines decide, and it can take days or weeks. Use get_batch to check progress and to see URLs the URL check skipped (they are refunded). check_index tells whether Google has indexed URLs (3 credits per URL): confirm the cost with the user first, then read results with get_index_check.",
      "tools": [
        {
          "name": "check_index",
          "title": "Check if URLs are indexed in Google (spends credits)",
          "description": "Check whether Google has indexed each URL. THIS SPENDS CREDITS: 3 credits per URL. Before you call this tool, tell the user how many URLs will be checked and the credit cost, and wait for a clear yes. Send urls, or batch_id to check the URLs of an earlier submission. Only an exact match of the URL counts as indexed. Results arrive in 5 to 30 minutes: use get_index_check with the check_id. URLs not found get one free recheck after 3 days. A \"not_found\" result means Google did not show the page yet; it may still be indexed later.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "batch_id": {
                "description": "Check the sent URLs of this submission instead of a URL list.",
                "minimum": 1,
                "type": "integer"
              },
              "urls": {
                "description": "The URLs to index, each starting with http:// or https://. Up to 5,000. Duplicates and invalid lines are removed and not charged.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5000,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check if URLs are indexed in Google (spends credits)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eed1e9b335050df7b3d498aa07d79d8ed7b346a5856849520579aaab4c395a45"
        },
        {
          "name": "estimate_cost",
          "title": "Estimate the credit cost",
          "description": "Work out how many credits a submission will cost and whether the balance covers it. Nothing is submitted and no credits are spent. Send the URLs (best: invalid and duplicate URLs are counted exactly) or just url_count. Call this before submit_urls and show the result to the user.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "type": {
                "default": "normal",
                "description": "\"normal\" costs 1 credit per URL. \"instant\" costs 10 credits per URL and is for important pages. Instant needs at least one credit purchase.",
                "enum": ["normal", "instant"],
                "type": "string"
              },
              "url_count": {
                "description": "Number of URLs, if you don't want to send the list.",
                "minimum": 1,
                "type": "integer"
              },
              "urls": {
                "description": "The URLs you plan to submit. Use this or url_count.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5000,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate the credit cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e09500675da7d145c72d325dd85de0d22d6ab6d1708043c0308fc4758f886933"
        },
        {
          "name": "get_balance",
          "title": "Get the credit balance",
          "description": "Show the AVS Indexer credit balance, the price per URL, and whether the account can use instant indexing. No credits are spent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the credit balance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93062cca080e1ff753051a855ca10babb74cc3f4a887d9c5145ece79ed1ac635"
        },
        {
          "name": "get_batch",
          "title": "Get one submission",
          "description": "Show one submission by its batch_id: state, URL counts, credits used and refunded, drip-feed progress, and the URLs the URL check skipped with the reason for each. No credits are spent. States: queued, processing, dripping (waiting for the next daily share), submitted, skipped (every URL was skipped by the URL check; credits refunded), failed (credits refunded).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "batch_id": {
                "description": "The submission ID (batch_id from submit_urls or list_batches).",
                "minimum": 1,
                "type": "integer"
              },
              "include_urls": {
                "default": false,
                "description": "Also list every URL in the submission (up to 500).",
                "type": "boolean"
              }
            },
            "required": ["batch_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one submission"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25216e7b0e31f83f16b094868d2d195157ff9c633b6411a4c89f5a2e7a8f2d4c"
        },
        {
          "name": "get_index_check",
          "title": "Get index check results",
          "description": "Show the results of an index check by its check_id: how many URLs are indexed, not found yet, or still being checked, and (optionally) the result for each URL. No credits are spent. Results per URL: indexed, not_found (Google does not show it yet; a free recheck may be pending), checking, rechecking, error (could not be checked; credits refunded).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_id": {
                "description": "The check_id from check_index.",
                "minimum": 1,
                "type": "integer"
              },
              "include_urls": {
                "default": true,
                "description": "List the result for each URL (up to 500).",
                "type": "boolean"
              }
            },
            "required": ["check_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get index check results"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:22ac62f1b607947787a1f0c67739df0b0ee433ecd5b318b331fc1675ea420021"
        },
        {
          "name": "list_batches",
          "title": "List recent submissions",
          "description": "List recent submissions (newest first) with their state, URL counts, credits, refunds and drip-feed progress. Optional project filter. No credits are spent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many submissions to show (1-100, default 10).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "project": {
                "description": "Only show submissions in this project (exact name).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List recent submissions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:39ec78de69127699e71f8afb7189c82fd25e8f31b785e0e40abb0f4640bcb7f3"
        },
        {
          "name": "stop_drip",
          "title": "Stop a drip-feed",
          "description": "Stop a drip-feed submission. URLs already sent stay sent. URLs not sent yet are cancelled and their credits go back to the balance. This can't be undone. Ask the user before you call it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "batch_id": {
                "description": "The drip-feed submission ID.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["batch_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Stop a drip-feed"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:73ea3e5f9ef8dbcb20991761d50c368c288d88685a349e6bae0ac61e88a377b6"
        },
        {
          "name": "submit_urls",
          "title": "Submit URLs for indexing (spends credits)",
          "description": "Send URLs to AVS Indexer for indexing. THIS SPENDS CREDITS: 1 credit per URL for normal, 10 credits per URL for instant. Before you call this tool, call estimate_cost, tell the user how many URLs will be sent and how many credits it will cost, and wait for the user to say yes. Credits are taken when the URLs are submitted. Dead links (404, noindex and similar) found by the URL check are skipped and refunded automatically. Indexing is not guaranteed: search engines decide which pages they index, and it can take days or weeks. Returns a batch_id. Use get_batch with it to follow progress.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check": {
                "default": true,
                "description": "Check each URL before sending and skip (and refund) dead links. Default true. Only set false if the user asks for it.",
                "type": "boolean"
              },
              "drip_days": {
                "default": 0,
                "description": "0 = send all URLs at once. 2 to 30 = spread the URLs evenly over that many days (drip-feed). 1 is not allowed.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "project": {
                "description": "Optional project name to group submissions in the dashboard (max 60 characters).",
                "maxLength": 60,
                "type": "string"
              },
              "type": {
                "default": "normal",
                "description": "\"normal\" costs 1 credit per URL. \"instant\" costs 10 credits per URL and is for important pages. Instant needs at least one credit purchase.",
                "enum": ["normal", "instant"],
                "type": "string"
              },
              "urls": {
                "description": "The URLs to index, each starting with http:// or https://. Up to 5,000. Duplicates and invalid lines are removed and not charged.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit URLs for indexing (spends credits)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a6a4bd828935e4092ac79179ff93a81cbc1398547dee72a461493ebac7f88dd5"
        }
      ],
      "digest": "sha256:2874a1fe823a6d23cfbedb6d516739b5f83481881ad189a5a926fd0e4fa92b1f"
    }
  }
}
