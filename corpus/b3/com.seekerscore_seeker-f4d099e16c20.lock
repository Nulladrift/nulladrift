{
  "lockfileVersion": 2,
  "subjects": {
    "com.seekerscore/seeker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.seekerscore.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "seeker",
        "title": "Seeker",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Seeker matches a résumé against live job postings (match_resume) and compares a résumé with one job description (check_resume_against_job). Fit labels and skill overlap describe how well a résumé matches a posting; they are not interview or hiring odds. Seeker does not apply to jobs.",
      "tools": [
        {
          "name": "check_resume_against_job",
          "title": "Check résumé against a job posting",
          "description": "Use when the user shares their résumé text AND one job description and asks how well they fit that job or what is missing. Sends both texts to Seeker (seekerscore.com), which compares the skills in each and returns the skill overlap percentage, the matched skills, the required and preferred skills the résumé does not show, and whether the experience level looks under, at or over the posting. It is a skills comparison, not a prediction of interviews or hiring.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_description": {
                "description": "The full text of the job posting, 200 to 20000 characters.",
                "maxLength": 20000,
                "minLength": 200,
                "type": "string"
              },
              "resume_text": {
                "description": "The full plain text of the user's résumé, 200 to 50000 characters. Phone number and home address can be left out.",
                "maxLength": 50000,
                "minLength": 200,
                "type": "string"
              }
            },
            "required": ["job_description", "resume_text"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checker_url": {
                "type": "string"
              },
              "level_fit": {
                "type": "string"
              },
              "matched_skills": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "missing_preferred": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "missing_required": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "overlap_pct": {
                "type": "number"
              },
              "resume_years": {
                "type": ["number", "null"]
              },
              "years_required": {
                "type": ["number", "null"]
              }
            },
            "required": ["checker_url", "level_fit", "matched_skills", "missing_preferred", "missing_required", "overlap_pct"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check résumé against a job posting"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Compared on Seeker",
            "openai/toolInvocation/invoking": "Comparing your résumé with the job on Seeker"
          },
          "digest": "sha256:bfb52ff6d7483c7603aa8a654a78ebfd9715543e8cd497e867911ccc0c120d82"
        },
        {
          "name": "match_resume",
          "title": "Match résumé to live jobs",
          "description": "Use when the user shares their résumé (or CV) text and wants to see real, currently open jobs that fit it. Sends the résumé text to Seeker (seekerscore.com), which compares it with its live job postings and returns the top 5 matches with title, company, location, a fit label, a short reason and the posting link, plus a link to see all matches on Seeker. Fit labels describe how well the résumé matches each posting; they are not predictions of interviews or hiring. Matching can take up to a minute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "resume_text": {
                "description": "The full plain text of the user's résumé, 200 to 50000 characters. Phone number and home address can be left out.",
                "maxLength": 50000,
                "minLength": 200,
                "type": "string"
              }
            },
            "required": ["resume_text"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "matches": {
                "items": {
                  "properties": {
                    "apply_url": {
                      "type": "string"
                    },
                    "company": {
                      "type": "string"
                    },
                    "fit": {
                      "type": "string"
                    },
                    "location": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["apply_url", "company", "fit", "location", "reason", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "see_all_url": {
                "type": "string"
              }
            },
            "required": ["matches", "see_all_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Match résumé to live jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Found your matches on Seeker",
            "openai/toolInvocation/invoking": "Checking live jobs on Seeker"
          },
          "digest": "sha256:cddd7b4dc266c75896796ce6ba21856fd322249caba13a4135688975c86c202e"
        }
      ],
      "digest": "sha256:15372323de56ec556177d1cfed169038af249750ea0290738aeb1cec33e345fe"
    }
  }
}
