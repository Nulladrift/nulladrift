        {
          "name": "predict",
          "description": "Cassandra unified predictor. From leading signals in public data, returns what is about to happen to an entity — weeks early — across four verticals. domain selects the vertical: 'recall' (consumer product / vehicle / drug / device recall risk from complaint velocity), 'bio' (biotech NIH→trial→SEC catalyst chain), 'recompete' (federal contract recompete-winner shift), 'ma' (government contractor acquisition target). entity is the name to look up (e.g. 'Tesla Model Y', 'Moderna', a contractor or agency name). Returns a leading-signal prediction with lead time — NOT a guarantee, and NOT a claim of any official action.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Prediction vertical to route to.",
                "enum": ["recall", "bio", "recompete", "ma"],
                "type": "string"
              },
              "entity": {
                "description": "Entity name / ticker / id to predict on.",
                "type": "string"
              }
            },
            "required": ["domain", "entity"],
            "type": "object"
          },
