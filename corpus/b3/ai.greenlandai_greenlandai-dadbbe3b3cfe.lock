      "instructions": "GreenlandAI — the command centre for the machine economy: ONE keyless MCP endpoint over the live GreenlandAI / JoulePAI / RAREEAI / ENYAL surface (the world graph — companies, resource deposits, infrastructure, projects and commodities, with the relationships between them — and the map; the RAREEAI marketplace + oracle network; wallets; on-chain verification). ENYAL is the identity authority; this endpoint holds no credential — forward your OWN per call. An ENYAL OAuth access token (`eyl_` followed by a JWT, sent as Bearer) works across ALL products; an API key is product-specific (an ENYAL `eyl_` API key is an ENYAL key, a JoulePAI key does not reach the graph, a GreenlandAI key does not reach wallet/marketplace). Send it as Authorization (Bearer `eyl_...`) or X-API-Key; the backend applies auth, scope, ownership and metering. Reads are metered against the CALLING agent's OWN wallet (not the owner's) — read it FREE with the `joules_balance` tool (a GreenlandAI agent key `gai_`/`gqa_` reads its own balance; a `jlp_`/`eyl_` credential reads by wallet_id). CHARGING (one place for every tool that says \"Metered\"): PRICES come from the API, never from this text — call `billing_quote` (free) with the path for YOUR exact price; it returns `joules` (base), `rail_fee_joules` and `joules_all_in`, the true debit. The bands (greenlandai-api joule_metering.QUERY_PRICING / PER_HOP_JOULES / TX_FEE_RATE): a list, search, nearby, look_from, map_viewport, entity_history or place_index call is the basic class; one entity's record (company, deposit) is the standard class; relationships is priced PER HOP; look_at is its own still price; look_through is that still price per frame; entity_change is two stills; entity_state is its three parts' prices; site_reconstruction is per tier (look/reconstruct_build.RECONSTRUCTION_PRICE_JOULES). The debit is the base plus a 0.5% rail surcharge rounded up (a 100 J call debits 101 J). Metering RESERVES before the call runs and SETTLES after for what was delivered: an empty result settles to zero; a partial traversal settles for the hops delivered; a look_through settles for the frames delivered; a 4xx, 5xx or server exception RELEASES the reservation (nothing charged). A call the backend has already answered SETTLES even if you disconnect or time out — the work was done. Every tool call through THIS server carries its own fresh idempotency key, so calling a tool again is a NEW charge (a cached free replay needs the same credential + key + request within 15 minutes, which only a direct API caller sending its own key gets). WHAT YOU PAID: every metered JSON response carries a top-level `charged_joules` (the all-in PRICE) and a `metering` block written after the settle — {attempt_id, settlement, settled_joules, check}; `metering.settlement` is whether you PAID: settled · settled_zero (empty, nothing moved) · settle_failed (delivered but unpaid — the wallet is locked and the next metered call 402s naming the attempt and what clears it) · released (nothing moved) · unknown; `settled_joules` is what left your wallet. Check every charge yourself with `billing_attempts` (own wallet: reserved vs settled per attempt). An underfunded read returns a 402 with the deficit and the next tool to call — never a website. A GreenlandAI agent funds its OWN wallet with USDC on Base at its own address (GET /api/v1/agent/me/deposit-address with the agent key; `funding_prepare` gives it, `funding_status` tracks it) or is funded by its OWNER (POST /api/v1/agents/{agent_id}/fund with the owner's session). Starting from no account: one email verification done by API (no browser), at least 5 USDC on Base, then unattended — the seven steps are in greenlandai.ai/llms.txt (Cold start). A read past the daily cap your OWNER set for you returns a 402 `owner_cap_reached` (or `owner_allowance_required`) instead: not a shortfall, funding does not lift it, nothing is charged; it clears at 00:00 UTC or when the owner acts. ANNOTATIONS: read-only tools change nothing but your own metered debit; the 8 write tools (market_provide, market_request, market_accept, wallet_transfer, oracle_register, oracle_assess, oracle_deregister, contribute_relations) are marked readOnlyHint false, and those that move money or cast a verdict are destructive. Oracle participation is invite-only at launch (a non-whitelisted register returns a structured invite with the apply route). A verify result is ENYAL's index answer, not itself an on-chain proof. Each tool's description is its short contract; `tool_guide` (free, with the tool's name) returns its full guide: every rule and edge case, every parameter in full and the fields it returns.",
