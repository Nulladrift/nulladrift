                    "description": "your own opaque key: the same key and body is one request, never two"
                  },
                  "max_price_per_unit": {
                    "description": "the most you pay per unit, in joules, a whole number > 0",
                    "exclusiveMinimum": 0,
                    "type": "integer"
                  },
                  "physical_claim": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/PhysicalClaimBody"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "REQUIRED for resource_type scene_stack, change_report, site_reconstruction or satellite_imagery (refused …"
                  },
                  "priority": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "matching priority, per the RAREEAI docs"
                  },
                  "privacy_mode": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "the request's privacy mode, per the RAREEAI docs"
                  },
                  "provider_id": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "the listing to buy from: a provider id from market_listings (kind providers)."
                  },
                  "rematch": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/RematchBody"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "MACHINE speed only: allow automatic re-matching if a match on this request ends without delivery, within …"
                  },
                  "requirements": {
                    "anyOf": [
                      {
                        "additionalProperties": true,
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
