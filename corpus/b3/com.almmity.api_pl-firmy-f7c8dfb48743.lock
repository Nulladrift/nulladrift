        {
          "name": "calculate_late_interest",
          "title": "Late-payment interest",
          "description": "Calculate Polish late-payment interest with the same rates and day count as ksef.almmity.com: commercial (NBP reference + 10 pp), medical public debtor (+ 8 pp) or statutory (reference + 5.5 pp), plus the 40/70/100 EUR compensation converted at the NBP euro rate. Returns the segments. It creates a temporary PDF file on api.almmity.com, reachable by an unguessable link for one hour, then deleted. Does not file anything. Callable without an API key. The NBP rate lookup reads a public API and does not change it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asOf": {
                "description": "Calculation date, default today Europe/Warsaw.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "compensation": {
                "description": "40/70/100 EUR recovery compensation. Default on, except for ustawowe.",
                "type": "boolean"
              },
              "creditor": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "nip": {
                    "maxLength": 20,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "debtor": {
                "$ref": "#/properties/creditor"
              },
              "documentNumber": {
                "maxLength": 40,
                "type": "string"
              },
              "iban": {
                "maxLength": 40,
                "type": "string"
              },
              "invoices": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "dueDate": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "number": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "paidDate": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "dueDate"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "kind": {
                "description": "Default handlowe (commercial transactions).",
                "enum": ["handlowe", "leczniczy", "ustawowe"],
                "type": "string"
              },
              "payWithinDays": {
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "place": {
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["invoices"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {},
            "type": "object"
          },
