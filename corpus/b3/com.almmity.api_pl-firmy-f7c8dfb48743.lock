        {
          "name": "check_vat_whitelist",
          "title": "Polish VAT white list (Biała lista)",
          "description": "Query the Ministry of Finance VAT white list (wl-api.mf.gov.pl). Returns the full taxpayer card: name, NIP, VAT status, REGON, KRS, address, every account (groups of 4), registration/denial/removal/restoration dates with legal basis, representatives, authorized clerks, partners, virtual accounts, and the MF requestId (legal proof of the answer). decision is czynny, zwolniony, niezarejestrowany or not found. Pass nip, or nips (up to 30, one search/nips call) for a batch with progress. Optionally bank_account to verify that account against the NIP: result TAK or NIE plus a separate requestId (the 15 000 PLN proof). When both nip and bank_account are set, the top-level requestId is the account-check id and detail.requestId is the taxpayer-search id. Or pass regon, or bank_account alone to find the owner. Reads a public registry and does not change it. Callable without an API key, within the daily per-IP limit. Errors and the daily MF limit come back in Polish.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bank_account": {
                "description": "26-digit NRB or PL IBAN. With nip, verifies the account (TAK/NIE). Alone, finds the owner.",
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD, default today (Europe/Warsaw). MF allows up to 5 years back.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "nip": {
                "type": "string"
              },
              "nips": {
                "description": "Up to 30 NIPs, checked with one MF search/nips request. Each entry has decision and the full card.",
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "regon": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4608c8b81f745d798cfde4654673ad36bcbe55902e0915896920c5922bd4f8a3"
