        {
          "name": "generate_fa3_xml",
          "title": "Generate FA(3) invoice XML",
          "description": "Build a sales invoice XML in the FA(3) schema (kodSystemowy FA (3), variant 3) from seller, buyer and line items. Header VAT is computed from the summed net base of each rate. Does not send the invoice to KSeF and does not store it. Callable without an API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyer": {
                "$ref": "#/properties/seller"
              },
              "currency": {
                "description": "ISO 4217, default PLN.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "dueDate": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "exemptionBasis": {
                "description": "Required when any line uses vatRate zw.",
                "maxLength": 256,
                "type": "string"
              },
              "gv": {
                "description": "Buyer is in a VAT group: 1 yes, 2 no (default).",
                "enum": ["1", "2"],
                "type": "string"
              },
              "iban": {
                "description": "Polish NRB, 26 digits or PL IBAN.",
                "maxLength": 40,
                "type": "string"
              },
              "issueDate": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "jst": {
                "description": "Buyer is a local-government unit: 1 yes, 2 no (default).",
                "enum": ["1", "2"],
                "type": "string"
              },
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "maxLength": 512,
                      "minLength": 1,
                      "type": "string"
                    },
                    "qty": {
                      "description": "Quantity. Negative only for a correction delta.",
                      "type": "number"
                    },
                    "unit": {
                      "description": "Unit, default szt.",
                      "maxLength": 256,
                      "type": "string"
                    },
                    "unitGross": {
                      "type": "number"
                    },
                    "unitNet": {
                      "description": "Net unit price. Provide this or unitGross, not both.",
                      "type": "number"
                    },
                    "vatRate": {
                      "enum": ["23", "22", "8", "7", "5", "0 KR", "0 WDT", "0 EX", "zw"],
                      "type": "string"
                    }
                  },
                  "required": ["name", "qty", "vatRate"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "note": {
                "maxLength": 256,
                "type": "string"
              },
              "number": {
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "paid": {
                "type": "boolean"
              },
              "paidDate": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "place": {
                "maxLength": 256,
                "type": "string"
              },
              "saleDate": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "seller": {
                "additionalProperties": false,
                "properties": {
                  "addressLine1": {
                    "maxLength": 512,
                    "minLength": 1,
                    "type": "string"
                  },
                  "addressLine2": {
                    "maxLength": 512,
                    "minLength": 1,
                    "type": "string"
                  },
                  "brakId": {
                    "description": "Buyer has no tax id (FA(3) BrakID=1).",
                    "type": "boolean"
                  },
                  "country": {
                    "description": "ISO country code, default PL.",
                    "pattern": "^[A-Za-z]{2}$",
                    "type": "string"
                  },
                  "email": {
                    "format": "email",
                    "maxLength": 256,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 512,
                    "minLength": 1,
                    "type": "string"
                  },
                  "nip": {
                    "description": "Polish NIP, 10 digits. Required unless buyer.brakId is true.",
                    "maxLength": 20,
                    "type": "string"
                  }
                },
                "required": ["addressLine1", "addressLine2", "name"],
                "type": "object"
              },
              "splitPayment": {
                "description": "Set true to mark MPP (P_18A).",
                "type": "boolean"
              }
            },
            "required": ["buyer", "issueDate", "lines", "number", "seller"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:144f5d0f688be4684dc69af58d5d4133153b0bd76e3cf1903c61052c31d36459"
