            "readOnly": false
          },
          "digest": "sha256:08b26b148d11c1d193785ef630400d7a21b3faebd285e7d5467c09e7d625b096"
        },
        {
          "name": "build_transfer_title",
          "title": "KSeF transfer title",
          "description": "Build a Polish bank transfer title that carries one KSeF invoice number or a collective identifier (art. 108g VAT). mode=mpp builds the split-payment message /VAT/IDC/INV/TXT and checks the supplier NIP checksum. Does not send a payment. Callable without an API key.",
