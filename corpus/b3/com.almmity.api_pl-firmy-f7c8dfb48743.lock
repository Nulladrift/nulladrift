        {
          "name": "generate_correction_xml",
          "title": "Generate FA(3) correction XML",
          "description": "Build an FA(3) correction invoice (RodzajFaktury KOR). Header amounts are the difference versus the original. Pass beforeLines to emit state-before (StanPrzed) and state-after rows; otherwise lines are the delta. Does not send the invoice to KSeF. Callable without an API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "beforeLines": {
                "description": "State before correction, same length as lines. Omit to send lines as the difference.",
                "items": {
                  "$ref": "#/properties/lines/items"
                },
                "maxItems": 100,
                "type": "array"
              },
              "buyer": {
                "$ref": "#/properties/seller"
              },
              "corrected": {
                "additionalProperties": false,
                "properties": {
                  "issueDate": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "ksefNumber": {
                    "description": "KSeF number of the invoice being corrected, when it has one.",
                    "maxLength": 64,
                    "type": "string"
                  },
                  "number": {
                    "maxLength": 256,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["issueDate", "number"],
                "type": "object"
              },
              "correctionType": {
                "description": "FA(3) TypKorekty. Default 2.",
                "enum": [1, 2, 3],
                "type": "number"
              },
              "currency": {
                "description": "ISO 4217, default PLN.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "dueDate": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "exemptionBasis": {
                "description": "Required when any line uses vatRate zw.",
                "maxLength": 256,
                "type": "string"
              },
              "gv": {
                "description": "Buyer is in a VAT group: 1 yes, 2 no (default).",
                "enum": ["1", "2"],
                "type": "string"
              },
              "iban": {
                "description": "Polish NRB, 26 digits or PL IBAN.",
                "maxLength": 40,
                "type": "string"
              },
              "issueDate": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "jst": {
                "description": "Buyer is a local-government unit: 1 yes, 2 no (default).",
                "enum": ["1", "2"],
                "type": "string"
              },
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "maxLength": 512,
                      "minLength": 1,
                      "type": "string"
                    },
                    "qty": {
                      "description": "Quantity. Negative only for a correction delta.",
                      "type": "number"
                    },
                    "unit": {
                      "description": "Unit, default szt.",
                      "maxLength": 256,
                      "type": "string"
                    },
                    "unitGross": {
                      "type": "number"
                    },
                    "unitNet": {
                      "description": "Net unit price. Provide this or unitGross, not both.",
                      "type": "number"
                    },
                    "vatRate": {
                      "enum": ["23", "22", "8", "7", "5", "0 KR", "0 WDT", "0 EX", "zw"],
                      "type": "string"
                    }
                  },
                  "required": ["name", "qty", "vatRate"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "note": {
                "maxLength": 256,
                "type": "string"
              },
              "number": {
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "paid": {
                "type": "boolean"
              },
              "paidDate": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "place": {
                "maxLength": 256,
