        {
          "name": "notaris_dossiercheck",
          "title": "Belgian notarial preparation checklist",
          "description": "Prepare a Belgian notary meeting: document checklist, questions and official source links for property, inheritance, gifts, care mandates, marriage contracts or BV incorporation. Optional region; no personal data, live verification, tax calculation or certification of legal completeness.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "gewest": {
                "default": "onbekend",
                "description": "Region if known; an orientation, not a tax-jurisdiction determination.",
                "enum": ["onbekend", "vlaanderen", "brussel", "wallonie"],
                "type": "string"
              },
              "onderwerp": {
                "description": "Belgian notarial matter to prepare.",
                "enum": ["vastgoed", "nalatenschap", "schenking", "zorgvolmacht", "huwelijkscontract", "bv_oprichting"],
                "type": "string"
              }
            },
            "required": ["onderwerp"],
            "type": "object"
          },
          "annotations": {
