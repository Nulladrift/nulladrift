      "instructions": "Co-Legal legal/fiscal lookup tools for Belgium (Vlaams Gewest primary) and the Netherlands. Lookup tools use official public sources and return concise answers with citation URLs. Belgian notarial preparation is available through notaris_dossiercheck: curated document checklists, questions and source links, without personal data or register access. The optional region does not determine tax jurisdiction; these checklists do not certify legal completeness. Use lookups to ground answers about Belgian company numbers (KBO/BCE), EU VAT validation (VIES), Belgian & Dutch case law (ECLI), EU legislation (EUR-Lex/CELEX), Belgian legislation (Justel) and Dutch legislation (wetten.overheid.nl). Informational only — not legal advice.",
      "tools": [
        {
          "name": "ecb_rates",
          "title": "ECB euro reference rate",
          "description": "Return the official daily ECB euro reference rate 1 EUR = X currency for a given ISO 4217 code (e.g. USD, GBP, CHF).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Three-letter ISO 4217 code, e.g. USD, GBP, CHF.",
                "maxLength": 3,
                "minLength": 3,
                "title": "Currency",
                "type": "string"
              }
            },
            "required": ["currency"],
            "title": "ecb_ratesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "ECB euro reference rate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5f234fdba664a7ad572a8bba66e9548d3bccbe4b33543e45a61d158ddc2976cd"
        },
        {
          "name": "ecli_lookup",
          "title": "Belgian case-law reference (ECLI)",
          "description": "Resolve a Belgian ECLI (European Case Law Identifier) to canonical public lookup URLs (EU e-Justice + Juportal) plus court metadata. Example: ECLI:BE:CASS:2020:ARR.20200101.1.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ecli": {
                "description": "A Belgian ECLI identifier.",
                "maxLength": 80,
                "minLength": 15,
                "title": "Ecli",
                "type": "string"
              }
            },
            "required": ["ecli"],
            "title": "ecli_lookupArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Belgian case-law reference (ECLI)"
          },
          "behavior": {
            "destructive": false,
