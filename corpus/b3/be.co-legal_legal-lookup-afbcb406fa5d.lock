            "readOnly": true
          },
          "digest": "sha256:4c028a0e482c8f8b6837083cbf9d482a6fbe62c9d20bef915ad9212ec9c2e9bb"
        },
        {
          "name": "erfbelasting_tarieven",
          "title": "Flemish inheritance-tax rates",
          "description": "Flemish inheritance-tax (erfbelasting) rate brackets, parsed deterministically from the in-force Flemish Tax Code (VCF art. 2.7.4.1.1) — for ALL heir categories: direct line & partners, siblings, and others. Omit `categorie` to get all three; the rates come from the current official text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "categorie": {
                "anyOf": [
                  {
                    "enum": ["rechte_lijn_partners", "broers_zussen", "anderen"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Heir category: rechte_lijn_partners, broers_zussen or anderen. Omit for all three.",
                "title": "Categorie"
              }
            },
            "title": "erfbelasting_tarievenArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Flemish inheritance-tax rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3da06ad0c1126ce0a6f56e5cadb2baccc9986dcae22ec48dc11808c7582e9e79"
        },
