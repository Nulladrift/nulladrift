        },
        {
          "name": "legal_read",
          "title": "Read an official legal text",
          "description": "Fetch and clean the full text of an official Belgian or European legal document (HTML or PDF) from a URL on the allowlist of official sources (e.g. ejustice.just.fgov.be, eur-lex.europa.eu). Capped at 30,000 characters. Pair with legal_lookup / eurlex_lookup to get the URL first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_chars": {
                "default": 30000,
                "description": "Max characters to return (default 30000).",
                "maximum": 60000,
                "minimum": 1000,
                "title": "Max Chars",
                "type": "integer"
              },
              "url": {
                "description": "Document URL on an allowed official domain.",
                "maxLength": 2048,
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "legal_readArguments",
            "type": "object"
