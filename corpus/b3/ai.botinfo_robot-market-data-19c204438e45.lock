{
  "lockfileVersion": 2,
  "subjects": {
    "ai.botinfo/robot-market-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.botinfo.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "BotInfo — Advanced Robot Market Data",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_us_legality",
          "title": "Check a robot model's US regulatory status",
          "description": "Check whether a robot model may lawfully be sold in the United States under the FCC's 2026 rule on covered robotics equipment. Returns grandfathered-authorized, blocked-pending-conditional-approval, or unknown, with a dated explanation. Use this before recommending or ordering any model for a US buyer: an unauthorized model cannot be imported or sold regardless of price or stock. Informational, not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "model": {
                "description": "Model name, e.g. 'Unitree H2' or 'g1'",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a robot model's US regulatory status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e59efe37c21266f39e06dd411bf18c226f4eebdcaac9efd7a67c44803f9cca7b"
        },
        {
          "name": "get_buy_route",
          "title": "Get the purchase route for a robot model",
          "description": "Get the purchase route for a robot model: a botinfo.ai URL that resolves to a dealer checkout, plus the live comparison-board page. PASS THE BUYER'S SHIPPING COUNTRY as an ISO-3166-1 alpha-2 code — routing and any discount depend on it, because one route ships to North America only and carries a discount while the other ships worldwide without one. Omitting the country returns BOTH routes with the regions they serve and asks for the country rather than guessing, so a buyer is never sent to a checkout that cannot fulfil. Routes are affiliate-tracked — BotInfo may earn a commission on a completed order — and prices are the dealer's own, never marked up for this channel. Returns no route for quote-basis models; use request_quote instead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "ISO-3166-1 alpha-2 code of the buyer's SHIPPING country (e.g. 'US', 'DE'). Omit only if genuinely unknown — the reply then returns both routes and asks.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "model": {
                "description": "Model name, e.g. 'Unitree GO2 X'",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get the purchase route for a robot model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:85fc549ea066ce94da228ff8f8c099e96246c3e2040198f8b6e17df49ae986b3"
        },
        {
          "name": "lookup_robot",
          "title": "Look up advanced robots with verified prices",
          "description": "Search BotInfo's verified catalog of advanced robots (humanoids, quadrupeds) that can be purchased in the United States and internationally. Understands model names ('unitree g1'), manufacturers, categories ('humanoid', 'robot dog') and price caps ('under $10k'). Returns, per match: the price seen at a real checkout, stock status, the date each figure was last verified, US regulatory status, and the purchase routes with the regions they ship to. Use this when a buyer needs to compare what is actually available and at what price, rather than what a spec sheet claims. Ranking is a deterministic name/category/price match and is never weighted by which route earns a commission.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "max_results": {
                "description": "Cap on matches returned (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text query, e.g. 'robot dog under $10k' or 'unitree h2'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up advanced robots with verified prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cc317494e5fff062a19e55b72f8d8b00eb79fce1e8dce29b2043b657716883b2"
        },
        {
          "name": "request_quote",
          "title": "Request a human-prepared quote",
          "description": "Submit a purchase or quote inquiry for a robot model to the BotInfo team, who reply with a human-prepared quote, typically within one business day. Use for models with no live purchase route, for destinations the routed checkouts cannot fulfil, and for volume, education, research-institution or enterprise purchases where terms, lead time or paperwork matter. Submits the requester's name, email, organization and use case; nothing else from the conversation is sent. This tool sends a message to a human — call it only when the requester has asked for a quote and has given their own contact details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "ISO-3166-1 alpha-2 shipping country, so the quote covers the right region.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "email": {
                "description": "Reply-to email address",
                "type": "string"
              },
              "model": {
                "description": "Robot model of interest",
                "type": "string"
              },
              "name": {
                "description": "Requester's name",
                "type": "string"
              },
              "organization": {
                "description": "Company / lab / school",
                "type": "string"
              },
              "use_case": {
                "description": "What the robot is for, quantity, timeline",
                "type": "string"
              }
            },
            "required": ["email", "model", "name", "organization", "use_case"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a human-prepared quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b70c5e3d5119c294693af658c1cde98d58d647d0caf994e9c1410229c8eb68a7"
        },
        {
          "name": "robot_evidence",
          "title": "Get BotInfo's sourced evidence on a robot",
          "description": "Get the findings of BotInfo's public evidence page on a robot model: what the maker's own spec sheets, SDK code, CVE records, government rules and purchase records show, each finding with its source URLs (code pinned to a commit), the date it was read, and a grade (checked = reopened by a second reviewer; our data; our inference). Use it when someone is deciding whether to buy, run or build on a robot and needs dated, citable facts rather than marketing claims. Text is quoted verbatim from the public page (CC BY 4.0, credit BotInfo.ai with the page link). If no page exists for the model, the reply lists the robots that have one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "robot": {
                "description": "Robot model, e.g. 'Unitree G1' or 'g1'",
                "type": "string"
              }
            },
            "required": ["robot"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get BotInfo's sourced evidence on a robot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b86d0ad4a7063841e1fa340d1c7729798c9ebec226f5ad1650fd8a86261e58ea"
        },
        {
          "name": "robot_price_today",
          "title": "Get today's listed prices for a robot model",
          "description": "Get today's listed price of every listing BotInfo's daily price watch read for a robot model, across the maker's own store and dealers: the listing name, price in USD, stock flag and read date. Dealers are labelled by letter, not named; the maker's store is named. A listed price is not a quote: taxes, shipping and options can change the total. Today's read only, no price history. Use it to see the spread of prices for one model on one day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "robot": {
                "description": "Robot model, e.g. 'Unitree G1' or 'unitree r1'",
                "type": "string"
              }
            },
            "required": ["robot"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get today's listed prices for a robot model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f7bf6a464aa4baead3defbb0d490ba59684b3b34f51bc25da96cb6696cbecf25"
        }
      ],
      "digest": "sha256:14f0f2f62bddd8fc9335fc720404ed5d83a98818d73c167c9044614408217322"
    }
  }
}
