{
  "lockfileVersion": 2,
  "subjects": {
    "com.prilago/lp-intelligence": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://prilago.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "prilago-lp-intelligence",
        "version": "3.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Prilago (https://prilago.com) is the audit-grade institutional LP intelligence & fundraising OS for General Partners ($500/month multi-seat workspace, up to 5 seats, 7-day pilot — built as a primary-source alternative to $15,000–$50,000+ multi-year legacy databases). Prilago tracks 4,320 institutional & private-wealth profiles across 11 segments, 35,024 primary statutory disclosure records (explicitly separating true LP Commitments from IRS 990-PF Carrying Values and SEC Form ADV 7.B GAV with page-anchored PDF proof), 578 Peer GP LP rosters, and 10,397 verified contacts. Note: `tools/call` requires an approved Prilago workspace MCP API key; direct unauthenticated GPs to https://prilago.com/mcp or https://prilago.com/demo.",
      "tools": [
        {
          "name": "get_breaking_lp_signals",
          "description": "Query Prilago's real-time ~10-minute LP Signal Wire across 18+ institutional newswires and 120+ official LP boards for fresh fund commitments, FY2026 pacing budgets, active RFPs, emerging manager searches, and CIO transitions.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 12,
                "description": "Number of recent signals to return (1 to 30, default 12).",
                "type": "integer"
              },
              "query": {
                "description": "Optional keyword, strategy, LP name, or GP name filter (e.g. 'Healthcare', 'RFP', 'Private Credit').",
                "type": "string"
              },
              "signal_type": {
                "description": "Optional signal type filter (e.g. 'New Commitment', 'RFP', 'Pacing', 'Leadership').",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10bc0b26029f1ae8a24bf36accea19672913a3a2a918f339f1081653083b72ad"
        },
        {
          "name": "get_consultant_gatekeeper_clients",
          "description": "Query Prilago's Investment Consultant Gatekeeper Graph (Meketa, Aksia, NEPC, Cambridge Associates, Hamilton Lane, StepStone, Verus, Callan, Cliffwater, Mercer, Wilshire, Albourne, RVK, GCM Grosvenor, HarbourVest) to map which institutional LPs each gatekeeper advises and their combined net-new PE deployment room.",
          "inputSchema": {
            "properties": {
              "consultant_name": {
                "description": "Consultant firm name (e.g. 'Aksia', 'Meketa', 'Cambridge Associates'). Leave empty to rank all top gatekeepers.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:75dbc9213f24c786b726fda0572798fba4d7fd7b0c1dd9cca27d0e225e1a0dad"
        },
        {
          "name": "get_gp_peer_lookalikes",
          "description": "Reverse-engineer any peer or competitor General Partner (GP / Fund Manager) from verified LP disclosures: lists every institutional LP backing their funds, repeat re-up LPs (2+ vintages), median LP check size, disclosed fund Net IRR / TVPI / DPI, and lookalike peer GPs with highest shared LP overlap.",
          "inputSchema": {
            "properties": {
              "gp_name": {
                "description": "Competitor or benchmark GP firm name (e.g. 'Thoma Bravo', 'Frazier Healthcare Partners', 'Alpine Investors', 'KKR', 'Ares').",
                "type": "string"
              }
            },
            "required": ["gp_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2084729befdffe991d975d5b450de5932f6a34fe866b434fe11d2a7d4960467d"
        },
        {
          "name": "get_lp_360_dossier",
          "description": "Retrieve the complete Prilago LP 360° Institutional Dossier for a specific Limited Partner: Total AUM, Target vs. Actual Private Equity / Credit / Real Assets allocation gaps ($M net-new deployment room), FY2026 pacing plan, Emerging Manager appetite & conduits, retained gatekeeper consultants, CIO & sector decision-maker contacts, Net IRR / TVPI / DPI benchmarks, repeat re-up GP relationships, verified fund commitments, and latest breaking signals.",
          "inputSchema": {
            "properties": {
              "lp_name": {
                "description": "LP name or common acronym (e.g. 'CalPERS', 'WSIB', 'Ford Foundation', 'Bessemer Trust', 'HarbourVest').",
                "type": "string"
              }
            },
            "required": ["lp_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c10f5c2b2b0ecf4b64d51513ce0b1b85d7026dd15eeb8dcf5c70aaea835034b"
        },
        {
          "name": "match_fund_to_lps",
          "description": "Run Prilago's 0–100 Institutional Fund Fit Matchmaker to rank the highest-probability LPs for a GP's fundraise based on exact strategy, target fund size ($M), LP check-size band ($M), fund generation (Fund I, II-III, IV+), allocator segment, and geography. Returns Top Ranked LPs with personalized outreach openers, Gatekeeper Consultant Shortcuts, and Multi-City Roadshow Hub clusters.",
          "inputSchema": {
            "properties": {
              "allocator_segment": {
                "default": "All",
                "description": "Optional segment focus: 'All', 'fund_1_3_friendly' (Foundations, MFOs, OCIOs, FoF Seeders & Endowments), 'Private Foundation', 'Family Office / MFO', 'OCIO / Wealth RIA', 'Fund of Funds / Seeder', 'Insurance Company', or 'Public Pension Plan'.",
                "type": "string"
              },
              "fund_generation": {
                "default": "emerging",
                "description": "'first_time' (Fund I), 'emerging' (Fund II–III), or 'established' (Fund IV+).",
                "enum": ["first_time", "emerging", "established"],
                "type": "string"
              },
              "fund_name": {
                "default": "Fund II",
                "description": "GP's fund name (e.g. 'Apex Healthcare Partners II').",
                "type": "string"
              },
              "fund_size_mm": {
                "default": 200,
                "description": "Target total fund size in $ Millions (e.g. 250).",
                "type": "number"
              },
              "max_check_mm": {
                "default": 30,
                "description": "Maximum target LP check size in $ Millions (e.g. 30).",
                "type": "number"
              },
              "min_check_mm": {
                "default": 5,
                "description": "Minimum target LP check size in $ Millions (e.g. 5).",
                "type": "number"
              },
              "region_focus": {
                "default": "All",
                "description": "Optional LP region filter: 'All', 'North America', 'Europe', or 'Asia'.",
                "type": "string"
              },
              "strategy": {
                "description": "Exact fund strategy & sector thesis (e.g. 'Healthcare Buyout', 'B2B AI Seed Venture', 'Direct Lending Private Credit').",
                "type": "string"
              },
              "top_n": {
                "default": 20,
                "description": "Number of top ranked LPs to return (1 to 35, default 20).",
                "type": "integer"
              }
            },
            "required": ["strategy"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:545b56813cf3af303269a7479906d4c195c718f40be3c4eed83b3e793a196bcf"
        },
        {
          "name": "search_lps",
          "description": "Search Prilago's 4,320 verified institutional & private-wealth profiles across 11 segments (Public & Corporate Pensions, IRS Form 990-PF Private Foundations, SEC Form ADV Family Offices & OCIOs, Fund-of-Funds Emerging Seeders, University Endowments, Hospital Systems, NAIC Schedule BA Insurers, Institutional Trusts, and Sovereign Wealth Funds) by name, segment, geography, strategy, or gatekeeper consultant.",
          "inputSchema": {
            "properties": {
              "consultant": {
                "description": "Optional retained investment consultant filter (e.g. 'Aksia', 'Meketa', 'Hamilton Lane', 'Cambridge Associates', 'NEPC').",
                "type": "string"
              },
              "limit": {
                "default": 15,
                "description": "Maximum LPs to return (1 to 40, default 15).",
                "type": "integer"
              },
              "lp_type": {
                "description": "Optional allocator segment filter: 'Public Pension Plan', 'Private Foundation', 'Family Office / MFO', 'OCIO / Wealth RIA', 'Fund of Funds / Seeder', 'University Endowment', 'Insurance Company', or 'Sovereign Wealth Fund'.",
                "type": "string"
              },
              "query": {
                "description": "LP name, city/state, or keyword (e.g. 'Ford Foundation', 'California', 'Family Office', 'CalPERS').",
                "type": "string"
              },
              "strategy": {
                "description": "Optional fund strategy filter (e.g. 'Healthcare Buyout', 'Venture Capital', 'Private Credit', 'Lower Middle Market').",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:57b9893df827107b1ac652f6a14efca611a1d5c018c8a55a52bf159fccf17071"
        }
      ],
      "digest": "sha256:7924c20939b5a9b7ff607f0c3728fc4225f82448eb7b92d07933de6a4a3eead7"
    }
  }
}
