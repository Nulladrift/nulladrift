{
  "lockfileVersion": 2,
  "subjects": {
    "com.prilago/lp-intelligence": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://prilago.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "prilago-lp-intelligence",
        "version": "3.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Prilago LLC (https://prilago.com) provides primary-source institutional LP research for emerging private-markets managers ($500/month multi-seat workspace, up to 5 seats). Prilago indexes 5,180 direct institutional LPs (5,180 with private funds on file), 1,926 SEC Form ADV advisers, 56,029 primary disclosure records (separating LP Commitments, IRS 990-PF Carrying Values, and Managed fund assets (Form ADV)), and Early-Backers matching for Funds I to IV. `tools/call` requires an approved Prilago workspace MCP API key; generate or manage keys at https://prilago.com/mcp or preview at https://prilago.com/demo.",
      "tools": [
        {
          "name": "get_breaking_lp_signals",
          "description": "Query Prilago's LP Filing & News Feed across SEC Form D XML filings, primary LP board/ACFR PDFs, and labeled trade-press items for disclosed fund commitments, pacing plans, RFPs, and CIO transitions.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 12,
                "description": "Number of recent signals to return (1 to 30, default 12).",
                "type": "integer"
              },
              "query": {
                "description": "Optional keyword, strategy, LP name, or GP name filter.",
                "type": "string"
              },
              "signal_type": {
                "description": "Optional signal type filter (e.g. 'Commitment', 'RFP', 'Pacing', 'Leadership').",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa0d27742133c3b50cc8d1103219fb7110f232c8dfa395340ae79fea1b7d3081"
        },
        {
          "name": "get_consultant_gatekeeper_clients",
          "description": "Query Prilago's Investment Consultant & OCIO Graph to map which institutional LPs each consultant advises and their disclosed room under target allocation.",
          "inputSchema": {
            "properties": {
              "consultant_name": {
                "description": "Consultant firm name (e.g. 'Aksia', 'Meketa', 'Cambridge Associates'). Leave empty to list top consultants.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0e76c067106a74d7afca7a4f92a14c65c216df51434ec9e45a116779a9e4aba7"
        },
        {
          "name": "get_gp_peer_lookalikes",
          "description": "Inspect any General Partner (Fund Manager) from verified LP disclosures: lists direct institutional LPs backing their funds, repeat re-up LPs, median disclosed check size, filed Net IRR / TVPI / DPI, and peer GPs.",
          "inputSchema": {
            "properties": {
              "gp_name": {
                "description": "Benchmark or peer GP firm name.",
                "type": "string"
              }
            },
            "required": ["gp_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fde631c0a25205bae1ebb2128fd768899f03444f32f90446672dcd82c24773bf"
        },
        {
          "name": "get_lp_360_dossier",
          "description": "Retrieve the complete Prilago Investor Profile for a specific Limited Partner: Total AUM, Target vs. Actual Private Equity / Credit / Real Assets room under target ($M), disclosed pacing plan, retained investment consultants, named investment-staff and governance contacts, filed Net IRR / TVPI / DPI figures, repeat GP relationships, primary-sourced fund holdings, and filing signals.",
          "inputSchema": {
            "properties": {
              "lp_name": {
                "description": "Investor name or common acronym (e.g. 'Surdna Foundation', 'UTIMCO', 'WSIB', 'CalSTRS').",
                "type": "string"
              }
            },
            "required": ["lp_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:703358b3b69b68d29514db3eddb9430785a044d375149d1d039ca396b3ea104d"
        },
        {
          "name": "match_fund_to_lps",
          "description": "Find direct institutional LPs proven in primary filings to back early-series funds (Funds I to IV) from managers under $5B AUM in your strategy and check-size band, automatically removing any existing investors of a reference manager. Uses the exact same Early-Backers ranking engine as the Prilago web app.",
          "inputSchema": {
            "properties": {
              "allocator_segment": {
                "default": "All",
                "description": "Optional institution type filter (e.g. 'All', 'Private Foundation', 'University Endowment', 'Public Pension Plan').",
                "type": "string"
              },
              "fund_generation": {
                "default": "emerging",
                "description": "'first_time' (Fund I), 'emerging' (Funds I to IV), or 'established' (Fund V+ allocation fit).",
                "enum": ["first_time", "emerging", "established"],
                "type": "string"
              },
              "fund_name": {
                "default": "Fund II",
                "description": "GP's fund name (e.g. 'Apex Partners II').",
                "type": "string"
              },
              "fund_size_mm": {
                "default": 75,
                "description": "Target fund size in $ Millions (e.g. 75).",
                "type": "number"
              },
              "manager_query": {
                "description": "Optional reference or peer manager name to exclude existing LPs and weight shared peers.",
                "type": "string"
              },
              "max_check_mm": {
                "default": 5,
                "description": "Target / reference LP check size in $ Millions (e.g. 5).",
                "type": "number"
              },
              "min_check_mm": {
                "default": 0.25,
                "description": "Minimum LP check size in $ Millions (e.g. 0.25).",
                "type": "number"
              },
              "region_focus": {
                "default": "All",
                "description": "Optional location/region filter (e.g. 'All', 'CA', 'NY', 'Northeast', 'Pacific').",
                "type": "string"
              },
              "strategy": {
                "description": "Fund strategy or family ('Venture Capital', 'Buyout', 'Growth Equity', 'Direct Lending', 'Real Estate', 'Infrastructure').",
                "type": "string"
              },
              "top_n": {
                "default": 25,
                "description": "Number of top ranked LPs to return (1 to 50, default 25).",
                "type": "integer"
              }
            },
            "required": ["strategy"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dad16da7cccfe67c2263ae5bf9cb9c1923332bceb35054c2f51a405d6080d8d1"
        },
        {
          "name": "search_lps",
          "description": "Search Prilago's 5,180 direct institutional LPs (Private Foundations, Public & Corporate Pensions, University Endowments, Healthcare Systems, Insurers, Institutional Trusts, and Sovereign Funds) by name, institution type, geography, strategy, or retained investment consultant.",
          "inputSchema": {
            "properties": {
              "consultant": {
                "description": "Optional retained investment consultant filter (e.g. 'Aksia', 'Meketa', 'Hamilton Lane', 'Cambridge Associates', 'NEPC').",
                "type": "string"
              },
              "limit": {
                "default": 15,
                "description": "Maximum LPs to return (1 to 40, default 15).",
                "type": "integer"
              },
              "lp_type": {
                "description": "Optional institution type filter: 'Private Foundation', 'Public Pension Plan', 'Corporate Pension', 'University Endowment', 'Healthcare / Hospital System', 'Insurance Company', 'Institutional Trust', or 'Sovereign Wealth Fund'.",
                "type": "string"
              },
              "query": {
                "description": "Investor name, city/state, or keyword (e.g. 'Surdna Foundation', 'UTIMCO', 'California', 'WSIB').",
                "type": "string"
              },
              "strategy": {
                "description": "Optional fund strategy filter (e.g. 'Venture Capital', 'Buyout', 'Growth Equity', 'Direct Lending', 'Real Estate').",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2ff602ae73f902e226723ab6954556ffa3b83e82dbd3a21d2b847b8495ae371f"
        }
      ],
      "digest": "sha256:94dfbc6e5202fbeb8a9250cc05f01df250d673af30c5a430958a924204549b68"
    }
  }
}
