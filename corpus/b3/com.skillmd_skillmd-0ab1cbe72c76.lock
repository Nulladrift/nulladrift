                "minimum": 1,
                "type": "integer"
              },
              "min_rating": {
                "description": "Minimum average rating, 0 to 5",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Natural-language query or keywords describing the task or skill",
                "type": "string"
              },
              "type": {
                "description": "Restrict to single-file skills or multi-file packs",
                "enum": ["single", "pack"],
                "type": "string"
              },
              "verified_only": {
