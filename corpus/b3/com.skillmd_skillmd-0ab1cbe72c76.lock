{
  "lockfileVersion": 2,
  "subjects": {
    "com.skillmd/skillmd": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.skillmd.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "skillmd",
        "title": "SkillMD",
        "version": "1.1.1",
        "description": "The open registry of Agent Skills: search, inspect and download 860,000+ linted, security-reviewed SKILL.md files for Claude Code, Cursor, Codex and 60+ other agents.",
        "websiteUrl": "https://skillmd.com",
        "icons": [
          {
            "src": "https://api.skillmd.com/favicon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://api.skillmd.com/favicon.ico",
            "mimeType": "image/x-icon",
            "sizes": ["16x16", "32x32", "48x48"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "SkillMD is a registry of Agent Skills (SKILL.md files). Use skillmd_search to find skills for a task, skillmd_get to inspect one (safety verdict, capability flags, provenance), and skillmd_download to fetch its files for writing to disk. skillmd_trending and skillmd_recommend surface popular and related skills. All tools are read-only against the public registry; no account is needed.",
      "tools": [
        {
          "name": "skillmd_download",
          "title": "Download skill files",
          "description": "Return the full contents of any public skill by owner/name slug: the SKILL.md text plus every companion file for packs, ready to write to disk. Skills are plain-text instructions an agent reads on demand; nothing executes, and every listed skill has passed SkillMD's safety review.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Skill identifier as owner/name, e.g. anthropic/pdf",
                "pattern": "^[^/]+/[^/]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "files": {
                "description": "Every file in the skill, SKILL.md first",
                "items": {
                  "properties": {
                    "content": {
                      "description": "UTF-8 text content",
                      "type": "string"
                    },
                    "content_base64": {
                      "description": "Base64 content for binary files",
                      "type": "string"
                    },
                    "note": {
                      "description": "How to treat this entry when content is not inlined",
                      "type": "string"
                    },
                    "path": {
                      "description": "Relative path inside the skill folder",
                      "type": "string"
                    },
                    "source_url": {
                      "description": "Fetch URL for large or binary companions not inlined",
                      "type": "string"
                    }
                  },
                  "required": ["path"],
                  "type": "object"
                },
                "type": "array"
              },
              "slug": {
                "description": "owner/name of the skill",
                "type": "string"
              }
            },
            "required": ["files", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Download skill files"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9fbd55aeee513613bf0d667aa2cf71a3d6de9237777c6873396cbc24c0f4337"
        },
        {
          "name": "skillmd_get",
          "title": "Get skill details",
          "description": "Fetch one skill by owner/name slug: description, SKILL.md body, provenance (source repo and pinned commit), license, safety verdict and capability flags, plus companion file listing for packs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Skill identifier as owner/name, e.g. anthropic/pdf",
                "pattern": "^[^/]+/[^/]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Full skill record.",
            "properties": {
              "ai_audit_verdict": {
                "description": "Safety review verdict: pass, caution, warning, fail or inconclusive",
                "type": ["string", "null"]
              },
              "body_md": {
                "description": "Markdown body of SKILL.md",
                "type": "string"
              },
              "categories": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "category": {
                "description": "Category name",
                "type": "string"
              },
              "commit_sha": {
                "description": "Pinned upstream commit",
                "type": ["string", "null"]
              },
              "description": {
                "description": "What the skill does and when an agent should use it",
                "type": "string"
              },
              "files": {
                "description": "Companion files for packs",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "install_snippet": {
                "description": "One-line install command",
                "type": "string"
              },
              "license": {
                "description": "SPDX license id when declared",
                "type": ["string", "null"]
              },
              "owner_handle": {
                "description": "Publisher handle",
                "type": "string"
              },
              "owner_name": {
                "description": "Publisher display name",
                "type": "string"
              },
              "raw_md": {
                "description": "Verbatim SKILL.md including frontmatter when stored",
                "type": ["string", "null"]
              },
              "repo_stars": {
                "description": "GitHub stars of the source repository",
                "type": ["number", "null"]
              },
              "security_flags": {
                "description": "Capability flags: docs_only, network_calls, executes_scripts, reads_secrets, untrusted_install",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "slug": {
                "description": "owner/name identifier, e.g. anthropic/pdf",
                "type": "string"
              },
              "source_repo": {
                "description": "Upstream repository",
                "type": ["string", "null"]
              },
              "tags": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "title": {
                "description": "Human-readable skill title",
                "type": "string"
              },
              "type": {
                "description": "single SKILL.md or a multi-file pack",
                "enum": ["single", "pack"],
                "type": "string"
              },
              "verified": {
                "description": "Published by a verified publisher",
                "type": "boolean"
              }
            },
            "required": ["description", "slug", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get skill details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1d74484790726fd6f454e3896d9e0f560c1e255ffd8a877e14b95a5863919b5"
        },
        {
          "name": "skillmd_recommend",
          "title": "Recommend skills",
          "description": "Recommend skills. With based_on set to a skill's owner/name slug, returns the top skills in that skill's category (excluding itself); without it, returns what is trending over the last 30 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "based_on": {
                "description": "Skill slug (owner/name) to base recommendations on",
                "pattern": "^[^/]+/[^/]+$",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results (default 10)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
