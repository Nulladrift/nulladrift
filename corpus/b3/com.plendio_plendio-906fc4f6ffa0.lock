                      "type": "string"
                    },
                    "product_id": {
                      "description": "Plendio product id (the id field of a search result).",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "slug": {
                      "description": "Alternative to product_id: the product's url, or the slug-and-id at its end (acme-book-15-42). The number after the last dash is the id.",
                      "maxLength": 300,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": ["null", "array"]
              },
              "market": {
                "description": "Market for the urls in the answer: dk, se, de or no. Default: the market the list was made for.",
                "enum": ["dk", "se", "de", "no"],
                "type": "string"
