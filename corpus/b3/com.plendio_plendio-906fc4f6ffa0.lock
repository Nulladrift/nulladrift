        {
          "name": "add_to_wishlist",
          "title": "Add products to a wishlist",
          "description": "Adds products to a wishlist made earlier, given its edit link or the token at the end of it. A product already on the list stays as it is, with its note. A list holds at most 50 products; unknown or unavailable products, and products that no longer fit, are reported and not added. Returns the list's items with their best current prices. The token stops working once the list has been saved to a Plendio account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "edit_token": {
                "description": "The wishlist's edit link as returned when it was created, or just the token at the end of it.",
                "maxLength": 300,
                "minLength": 20,
                "type": "string"
              },
              "items": {
                "description": "The products to add: 1 to 50. A product already on the list stays as it is, with its note.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
