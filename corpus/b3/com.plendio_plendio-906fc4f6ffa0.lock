        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search Plendio's product catalogue: free text in Danish, Swedish, German, Norwegian or English (\"laptop 32 GB RAM under 12000\", \"Sony WH-1000XM5\", \"running shoes women\") plus optional filters. Spec words in the query (RAM, storage, screen size, price limits, in stock) are understood the way the Plendio website understands them. Each result has the cheapest current price, the number of shops selling it and the url of its Plendio page. Results are limited to shops that ship to the market unless include_other_markets is true. 24 results per page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brands": {
                "description": "Only these brands (up to 25), e.g. [\"Sony\",\"Bose\"].",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "category": {
                "description": "Category slug to narrow the search to, e.g. computere.",
                "type": "string"
              },
              "in_stock": {
                "description": "Only products that at least one shop has in stock.",
                "type": "boolean"
              },
              "include_other_markets": {
                "description": "Also include products no shop ships to the market. Default false: only products the market's shoppers can have delivered.",
                "type": "boolean"
              },
              "market": {
                "description": "Market to search: dk, se, de or no. Default: the market of the site you connected to (plendio.dk is dk).",
                "enum": ["dk", "se", "de", "no"],
                "type": "string"
              },
              "max_price": {
                "description": "Highest price, in the market's currency (major units).",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Lowest price, in the market's currency (major units, e.g. 500 means 500 kr.).",
                "minimum": 0,
                "type": "number"
              },
              "page": {
                "description": "Result page, 24 products per page. Default 1.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in any of the market languages or English: a product name, a type, or a description with specs and limits (\"laptop 32 GB RAM under 12000\"). Required unless category is given.",
                "maxLength": 200,
                "type": "string"
              },
              "shops": {
                "description": "Only offers from these shops, by domain, e.g. [\"elgiganten.dk\"].",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "sort": {
                "description": "relevance (default), price_asc or price_desc.",
                "enum": ["relevance", "price_asc", "price_desc"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "applied": {
                "additionalProperties": false,
                "description": "Filters the search applied, including ones it read from the query text.",
                "properties": {
                  "brands": {
                    "items": {
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  },
                  "category": {
                    "description": "Category slug applied.",
                    "type": "string"
                  },
                  "in_stock": {
                    "type": "boolean"
                  },
                  "max_price": {
                    "type": ["null", "number"]
                  },
                  "min_price": {
                    "type": ["null", "number"]
                  },
                  "sort": {
                    "type": "string"
                  },
                  "specs": {
                    "description": "Spec constraints read from the query, e.g. \"ram_gb >= 32\".",
                    "items": {
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  }
                },
                "type": ["null", "object"]
              },
              "currency": {
                "description": "Currency of the market.",
                "type": "string"
              },
              "did_you_mean": {
                "description": "Set when the results answer a corrected spelling of the query.",
                "type": "string"
              },
              "market": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "page": {
                "type": "integer"
              },
              "page_size": {
                "type": "integer"
              },
              "products": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "category": {
                      "description": "The product's category, named in the market's language.",
                      "type": "string"
                    },
                    "currency": {
                      "description": "ISO 4217 currency of price_from.",
                      "type": "string"
                    },
                    "id": {
                      "description": "Plendio product id.",
                      "type": "integer"
                    },
                    "image": {
                      "description": "Product photo URL.",
                      "type": "string"
                    },
                    "in_stock": {
                      "type": "boolean"
                    },
                    "market_currency": {
                      "description": "The market's currency price_from_market is in.",
                      "type": "string"
                    },
                    "offer_count": {
                      "description": "How many shops sell it (to the market, unless include_other_markets).",
                      "type": "integer"
                    },
                    "price_from": {
                      "description": "Cheapest current price, in major units of currency; absent when no shop lists a price.",
                      "type": ["null", "number"]
                    },
                    "price_from_market": {
                      "description": "price_from converted to market_currency (equal to price_from when the shop prices in that currency); absent when no exchange rate is available.",
                      "type": ["null", "number"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The product's page on Plendio, listing all its offers.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "in_stock", "offer_count", "title", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "query": {
                "type": "string"
              },
              "search_url": {
                "description": "The same search on the Plendio website.",
                "type": "string"
              },
              "total": {
                "description": "Number of matching products.",
                "type": "integer"
              },
              "total_exact": {
                "description": "False when total is a lower bound (\"at least\").",
                "type": "boolean"
              },
              "total_pages": {
                "type": "integer"
              },
              "understood_as": {
                "description": "Set when the query was a sentence: the product searches it was read as, which the results answer.",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["currency", "market", "page", "page_size", "products", "query", "search_url", "total", "total_exact", "total_pages"],
            "type": "object"
          },
