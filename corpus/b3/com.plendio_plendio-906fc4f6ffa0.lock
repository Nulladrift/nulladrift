        {
          "name": "compare_prices",
          "title": "Compare prices",
          "description": "Returns the shops selling one product, one offer per shop (its best, with a count of its other offers), cheapest first by total price including shipping (price alone where a shop's shipping is unknown), with each amount also converted to the market's currency. Offers that are in stock come first. Out-of-stock offers are left out unless include_out_of_stock is true, and only shops that ship to the market are listed unless include_other_markets is true. The result includes the url of the product's Plendio page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_other_markets": {
                "description": "Also list shops not known to ship to the market. Default false.",
                "type": "boolean"
              },
              "include_out_of_stock": {
                "description": "Also list offers that are out of stock or discontinued. Default false: only offers a shopper can order now.",
                "type": "boolean"
              },
              "market": {
                "description": "Market the shopper is in: dk, se, de or no. Default: the market of the site you connected to.",
                "enum": ["dk", "se", "de", "no"],
                "type": "string"
              },
              "product_id": {
                "description": "Plendio product id (the id field of a search result, or the number at the end of a Plendio product URL).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency of the market.",
                "type": "string"
              },
              "id": {
                "type": "integer"
              },
              "market": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "offers": {
                "description": "Cheapest first, by total price including shipping (price alone where shipping is unknown).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "availability": {
                      "description": "in_stock, out_of_stock, preorder, backorder, discontinued or unknown.",
                      "type": "string"
                    },
                    "condition": {
                      "description": "new, refurbished or used, when the shop says.",
                      "type": "string"
                    },
                    "currency": {
                      "description": "ISO 4217 currency the shop prices in.",
                      "type": "string"
                    },
                    "delivery_days": {
                      "description": "Estimated delivery, e.g. \"1-3\" days, when known.",
                      "type": "string"
                    },
                    "last_seen": {
                      "description": "When Plendio last saw this price (RFC 3339).",
                      "type": "string"
                    },
                    "market_currency": {
                      "description": "The market's currency price_market and total_market are in.",
                      "type": "string"
                    },
                    "more_offers": {
                      "description": "How many further offers this shop has for the product (other colours or variants, dearer or out of stock); only this shop's best one is listed.",
                      "type": "integer"
                    },
                    "price": {
                      "description": "Item price in major units of currency, including VAT.",
                      "type": "number"
                    },
                    "price_market": {
                      "description": "price converted to market_currency (equal to price when the shop prices in that currency); absent when no exchange rate is available.",
                      "type": ["null", "number"]
                    },
                    "price_stale": {
                      "description": "True when the price was not confirmed recently; check it at the shop.",
                      "type": "boolean"
                    },
                    "shipping": {
                      "description": "Shipping cost to the market in major units; 0 is free shipping; absent when unknown.",
                      "type": ["null", "number"]
                    },
                    "ships_to_market": {
                      "description": "Whether the shop delivers to the market: yes (the shop or its platform says so), probably, no, or unknown.",
                      "type": "string"
                    },
                    "shop": {
                      "description": "The shop's name.",
                      "type": "string"
                    },
                    "shop_country": {
                      "description": "ISO 3166 country the shop is in.",
                      "type": "string"
                    },
                    "shop_host": {
                      "description": "The shop's domain.",
                      "type": "string"
                    },
                    "total": {
                      "description": "Price plus shipping; absent when shipping is unknown (then compare on price alone).",
                      "type": ["null", "number"]
                    },
                    "total_market": {
                      "description": "total converted to market_currency.",
                      "type": ["null", "number"]
                    }
                  },
                  "required": ["availability", "currency", "price", "ships_to_market", "shop", "shop_host"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "offers_omitted": {
                "description": "Offers left out because their shop does not ship to the market.",
                "type": "integer"
              },
              "out_of_stock_omitted": {
                "description": "Offers left out because they are out of stock or discontinued (set include_out_of_stock to list them).",
                "type": "integer"
              },
              "price_history": {
                "additionalProperties": false,
                "properties": {
                  "average": {
                    "type": "number"
                  },
                  "currency": {
                    "type": "string"
                  },
                  "current": {
                    "description": "Cheapest price now; absent when nobody sells it.",
                    "type": ["null", "number"]
                  },
                  "days": {
                    "description": "Length of the recorded history in days (at most 365).",
                    "type": "integer"
                  },
                  "highest": {
                    "type": "number"
                  },
                  "low_90d": {
                    "description": "Lowest cheapest-price in the last 90 days (or all the history if shorter).",
                    "type": ["null", "number"]
                  },
                  "lowest": {
                    "type": "number"
                  },
                  "median_1y": {
                    "description": "Median cheapest-price over the recorded span (at most a year), weighted by how long each price held.",
                    "type": ["null", "number"]
                  },
                  "median_90d": {
                    "description": "Median cheapest-price over the last 90 days, weighted by how long each price held.",
                    "type": ["null", "number"]
                  },
                  "points": {
                    "description": "At most 24 evenly spaced samples of the cheapest price, oldest first.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "date": {
                          "description": "YYYY-MM-DD.",
                          "type": "string"
                        },
                        "price": {
                          "description": "Cheapest price that day in major units; null when nobody sold the product.",
                          "type": ["null", "number"]
                        }
                      },
                      "required": ["date", "price"],
                      "type": "object"
                    },
                    "type": ["null", "array"]
                  },
                  "scope": {
                    "description": "What the history covers.",
                    "type": "string"
                  },
                  "signal": {
                    "additionalProperties": false,
                    "properties": {
                      "above_low_percent": {
                        "description": "How far over the lowest price of the period the price now is, in per cent.",
                        "type": "number"
                      },
                      "basis": {
                        "description": "The period the comparison covers, e.g. \"1 year\" or \"90 days\" or \"41 days\" (all the history there is).",
                        "type": "string"
                      },
                      "good_price": {
                        "description": "True for lowest_in_period, near_lowest and below_typical: a price at or under what the product usually costs.",
                        "type": "boolean"
                      },
                      "summary": {
                        "description": "The signal in one sentence.",
                        "type": "string"
                      },
                      "verdict": {
                        "description": "lowest_in_period, near_lowest (within 5% of the low), below_typical (3% or more under the median), typical, above_typical (more than 3% over the median) or unknown.",
                        "type": "string"
                      },
                      "vs_median_percent": {
                        "description": "The price now against the median price of the period, in per cent; negative is cheaper than usual.",
                        "type": "number"
                      }
                    },
                    "required": ["basis", "good_price", "summary", "verdict"],
                    "type": ["null", "object"]
                  },
                  "since": {
                    "description": "First day of the recorded history (YYYY-MM-DD).",
                    "type": "string"
                  }
                },
                "required": ["average", "currency", "days", "highest", "lowest", "scope", "since"],
                "type": ["null", "object"]
              },
              "title": {
                "type": "string"
              },
              "url": {
                "description": "The product's page on Plendio, listing all its offers.",
                "type": "string"
              }
            },
            "required": ["currency", "id", "market", "offers", "offers_omitted", "out_of_stock_omitted", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare prices"
          },
          "behavior": {
