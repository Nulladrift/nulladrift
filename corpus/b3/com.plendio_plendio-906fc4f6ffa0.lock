        {
          "name": "create_wishlist",
          "title": "Create a shareable wishlist",
          "description": "Creates a shareable wishlist (\"ønskeseddel\") on Plendio from products a person has picked, for example gifts found with a search, once they want a list to send to family or friends. Takes a title (up to 80 characters), a market and 1 to 50 products by Plendio id, each with an optional note of up to 140 characters, and optionally who the list is for (recipient, up to 80 characters) and the day of the occasion (occasion_date, YYYY-MM-DD, today or later). Returns two links, a read-only share link to the list's page on Plendio and a private edit link for changing the list and saving it to a Plendio account, together with the list's items and their best current prices. No login is needed and no personal data is collected. Unknown or unavailable products are reported and not stored. The edit link is a secret: anyone who holds it can change the list. A list that is not viewed or edited for 90 days is deleted. Each request creates a new list.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "The products on the list: 1 to 50.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "note": {
                      "description": "Optional short note shown with the product, e.g. a size or colour. Up to 140 characters; markup and links are removed.",
                      "maxLength": 140,
                      "type": "string"
                    },
                    "product_id": {
                      "description": "Plendio product id (the id field of a search result).",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "slug": {
                      "description": "Alternative to product_id: the product's url, or the slug-and-id at its end (acme-book-15-42). The number after the last dash is the id.",
                      "maxLength": 300,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": ["null", "array"]
              },
              "market": {
                "description": "Market the list is for: dk, se, de or no. Default: the market of the site you connected to.",
                "enum": ["dk", "se", "de", "no"],
                "type": "string"
              },
              "occasion_date": {
                "description": "Optional: the day of the occasion as YYYY-MM-DD, today or later (a birthday, Christmas Eve).",
                "maxLength": 10,
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "recipient": {
                "description": "Optional: who the list is for, e.g. \"Emma\". Up to 80 characters; markup and links are removed.",
                "maxLength": 80,
                "type": "string"
              },
              "title": {
                "description": "Name of the list, e.g. \"Emmas fødselsdag\". Up to 80 characters; markup and links are removed.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["items", "title"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency of total_from.",
                "type": "string"
              },
              "edit_url": {
                "description": "Private link for changing the list on Plendio and saving it to an account. Shown once.",
                "type": "string"
              },
              "instruction": {
                "description": "A line for the user about the two links.",
                "type": "string"
              },
              "item_count": {
                "type": "integer"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "available": {
                      "description": "False for a product that has left the catalogue or has no offer now.",
                      "type": "boolean"
                    },
                    "currency": {
                      "description": "ISO 4217 currency of price_from.",
                      "type": "string"
                    },
                    "note": {
                      "description": "Text written by whoever made the list.",
                      "type": "string"
