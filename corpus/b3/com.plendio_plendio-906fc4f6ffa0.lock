      "serverInfo": {
        "name": "plendio",
        "title": "Plendio product search",
        "version": "1.4.0"
      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "Plendio is a price comparison and product search engine for consumer products in four markets: Denmark (dk, DKK), Sweden (se, SEK), Germany (de, EUR) and Norway (no, NOK). It indexes the catalogues of online shops and shows, per product, every shop that sells it, the price, the shipping cost and whether the shop ships to the shopper's country.\n\nThe market is taken from the site the server is reached on (plendio.dk is Denmark, plendio.se Sweden, plendio.de Germany); every tool accepts a market argument for another one. Prices are consumer prices including VAT, in the market's currency unless an offer states another one, and by default only shops that ship to the market are included. Every product in a result has a url: the product's page on Plendio, where all its offers are listed. Prices change during the day. The search, product, price and category tools are read-only. The wishlist tools make and edit anonymous wishlists on Plendio: no account, no personal data, a read-only share link and a private edit link; a list nobody views or edits for 90 days is deleted.\n\nDeals, brand, shop and gift-idea data are read-only. A giver who holds a wishlist's share link can reserve one of its products, without an account, so that nobody else buys it; the person the list is for is not shown who reserved what. A product's price history includes how today's price compares with its year.",
      "tools": [
        {
