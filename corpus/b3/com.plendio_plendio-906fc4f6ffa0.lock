        {
          "name": "reserve_gift",
          "title": "Reserve a gift on a wishlist",
          "description": "Marks one product on a shared wishlist as taken by the giver, given the list's share link, so that nobody else buys the same gift. Takes the share link, the product's Plendio id and optionally the giver's first name (letters only, up to 40 characters; it is shown to other givers on the list's page, and not to the person the list is for). Returns a reservation_token: it undoes the reservation and reserves more products under the same name; one token holds at most 5 reservations on a list. A product somebody else already reserved is reported and not changed. The person who made the list is not shown who reserved what, so the gift stays a surprise. No login is needed. Reserving does not buy the product.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "market": {
                "description": "Market for the urls in the answer: dk, se, de or no. Default: the market the list was made for.",
                "enum": ["dk", "se", "de", "no"],
                "type": "string"
              },
              "name": {
                "description": "The giver's first name, shown to other givers on the list's page. Letters, spaces, hyphens, apostrophes and full stops only, up to 40 characters. Default: a neutral word in the market's language.",
                "maxLength": 40,
                "type": "string"
              },
              "product_id": {
                "description": "Plendio product id of the gift (the id of an item on the list).",
                "minimum": 1,
                "type": "integer"
              },
              "reservation_token": {
                "description": "Token returned by an earlier reservation on this list, to reserve another product under the same name. Empty for the first reservation.",
                "maxLength": 64,
                "type": "string"
              },
              "share_url": {
                "description": "The wishlist's share link, or the share id at the end of it. The edit link is not accepted.",
                "maxLength": 300,
                "minLength": 16,
                "type": "string"
              }
            },
            "required": ["product_id", "share_url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "list_title": {
                "description": "The list's name, written by whoever made it.",
                "type": "string"
