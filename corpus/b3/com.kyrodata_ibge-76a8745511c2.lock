          "description": "Finds SIDRA tables (IBGE's statistical database, about 9,300 tables) by what they measure. Returns table ids, titles and the survey each belongs to, best match first. Matching is accent-insensitive and maps everyday terms to IBGE vocabulary (unemployment → desocupação, income → rendimento), and every query word has to match. It returns no values: ibge_describe_table explains a table's variables, levels and periods, and ibge_get_table_data reads the numbers. Read-only; reads IBGE's public API live through Kyrodata (cached up to an hour). An identical call within 10 minutes is served from memo at 0 credits. Result status is ok, denied or error, with the reason in text. Credit class: free (0 credits).",
