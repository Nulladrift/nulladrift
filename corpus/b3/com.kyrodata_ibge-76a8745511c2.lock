        {
          "name": "ibge_get_table_data",
          "title": "Read values from a SIDRA table",
          "description": "Reads values from one SIDRA table for chosen variables, periods, territorial level, localities and breakdowns. The query is validated against the table's metadata first, so an invalid variable, period, level or category comes back naming the field and the valid options instead of IBGE's bare error. Values are numbers; IBGE's symbols are kept (`-` is a true zero, `X` is withheld, `..` not applicable). Up to 20,000 values per call. Concise returns the first 40 values plus totals; detailed adds every value as rows. Each answer carries the SIDRA link and a citation line. Read-only; reads IBGE's public API live through Kyrodata (cached up to an hour). An identical call within 10 minutes is served from memo at 0 credits. Result status is ok, denied or error, with the reason in text. Credit class: comex (up to 2 comex tools per 60-second session = 1 credit).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "classifications": {
                "description": "Breakdowns. A classification left out is returned at its total, as IBGE does by default.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "categories": {
                      "description": "Category ids to break the values down by; an empty list returns every category.",
                      "items": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "maxItems": 50,
                      "type": "array"
                    },
                    "classification": {
                      "description": "Classification id from ibge_describe_table.",
                      "maximum": 9007199254740991,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["categories", "classification"],
                  "type": "object"
                },
                "maxItems": 4,
                "type": "array"
              },
              "lastPeriods": {
                "description": "How many of the most recent periods to return when periods is omitted (default 1).",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "level": {
                "description": "Territorial level of the rows (default N1, Brazil). Must be one the table publishes.",
                "pattern": "^N\\d{1,3}$",
                "type": "string"
              },
              "localities": {
                "description": "Locality ids at `level` (state 35, municipality 3550308 — ibge_find_places returns them). Omitted: all.",
                "items": {
                  "pattern": "^\\d{1,8}$",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "periods": {
                "description": "Period ids as the table publishes them: '2022' (year), '202403' (month or quarter). Overrides lastPeriods.",
                "items": {
                  "pattern": "^\\d{4,6}$",
                  "type": "string"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "response_format": {
                "description": "How much of the answer to return. `concise` (the default) carries the headline figures; `detailed` adds the row-level series behind them and counts against the export quota.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "table": {
                "description": "SIDRA table (aggregate) id, e.g. 1612. ibge_search_tables returns ids.",
                "maximum": 99999,
                "minimum": 1,
                "type": "integer"
              },
              "variables": {
                "description": "Variable ids from ibge_describe_table. Omitted: every variable except the percentage-of-total ones.",
                "items": {
                  "maximum": 9007199254740991,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "within": {
                "description": "Keeps only localities inside one parent, as 'LEVEL:id': 'N3:51' returns every municipality of Mato Grosso when level is N6.",
                "pattern": "^N\\d{1,3}:\\d{1,8}$",
                "type": "string"
              }
            },
            "required": ["table"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "caveats": {
                "description": "Reading caveats.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "credits": {
                "description": "charged, balance (null = unlimited), resetAt, session {charged, endsAt} of the 60-s billing session.",
                "type": "object"
              },
              "data": {
                "description": "Raw numbers behind the text.",
                "type": "object"
              },
              "dataVersion": {
                "description": "Identity of the data that answered.",
                "type": "string"
              },
              "denied": {
                "description": "When status = denied: reason, feature, upgradeUrl.",
                "type": "object"
              },
              "error": {
                "description": "Failure message when status = error.",
                "type": "string"
              },
              "links": {
                "description": "screen = product page with these numbers.",
                "type": "object"
              },
              "memo": {
                "description": "true = identical call in the last 10 min, served again: 0 credits.",
                "type": "boolean"
              },
              "rows": {
                "description": "Table rows; detailed only, capped per tool.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "sources": {
                "description": "Per source: label, nameable, asOf.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "ok = data; denied = plan; error = failure or timeout.",
                "enum": ["ok", "denied", "error"],
                "type": "string"
              },
              "window": {
                "description": "Like-for-like window: from, to (YYYY-MM), label, months, crossesSeason.",
                "type": "object"
              }
            },
            "required": ["caveats", "credits", "data", "dataVersion", "links", "memo", "sources", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
