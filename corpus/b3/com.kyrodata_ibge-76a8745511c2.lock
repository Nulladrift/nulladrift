        {
          "name": "ibge_search_news",
          "title": "Search IBGE News Agency texts",
          "description": "Searches the IBGE News Agency: editorial news and official release texts (press releases), newest first. Each item has the publication time, type, title, a short introduction and its link on agenciadenoticias.ibge.gov.br. `type: release` keeps only result releases, the text IBGE publishes with a new figure. Dates bound the search. Release dates still to come are in ibge_get_release_calendar. Read-only; reads IBGE's public API live through Kyrodata (cached up to an hour). An identical call within 10 minutes is served from memo at 0 credits. Result status is ok, denied or error, with the reason in text. Credit class: comex (up to 2 comex tools per 60-second session = 1 credit).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
