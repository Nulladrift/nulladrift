        {
          "name": "ibge_get_city_profile",
          "title": "Read a municipality's IBGE Cidades indicators",
          "description": "Reads a municipality's indicators from IBGE Cidades, the portal that gathers each city's census, economy, health, education, environment and public-management figures. Give a `survey` id to get its indicators (up to 30), or specific `indicators`; each comes with its unit, latest year and value, and the recent years. With only the municipality it lists the survey ids available. Municipality codes come from ibge_find_places. Read-only; reads IBGE's public API live through Kyrodata (cached up to an hour). An identical call within 10 minutes is served from memo at 0 credits. Result status is ok, denied or error, with the reason in text. Credit class: comex (up to 2 comex tools per 60-second session = 1 credit).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "indicators": {
                "description": "Specific indicator ids (as listed under a survey). Overrides survey.",
                "items": {
                  "maximum": 9007199254740991,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "municipality": {
                "description": "Municipality code, 7 digits (3550308) or 6 without the check digit. ibge_find_places returns it.",
                "pattern": "^\\d{6,7}$",
                "type": "string"
              },
              "response_format": {
                "description": "How much of the answer to return. `concise` (the default) carries the headline figures; `detailed` adds the row-level series behind them and counts against the export quota.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "survey": {
                "description": "Cities survey id whose indicators to return. Omitted together with indicators: the list of survey ids.",
                "maximum": 9999,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["municipality"],
