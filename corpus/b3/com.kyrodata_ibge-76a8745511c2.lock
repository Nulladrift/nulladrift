        {
          "name": "ibge_get_survey_metadata",
          "title": "Describe IBGE surveys and their editions",
          "description": "Describes IBGE surveys from the official metadata registry: code, name, status (active or discontinued), category, collection and release frequency, and themes. With `survey` (a code such as PA or PNADC) it lists the survey's occurrences, the editions actually carried out. `query` filters the list by name or theme. Tables of a survey are found with ibge_search_tables; release dates with ibge_get_release_calendar. Read-only; reads IBGE's public API live through Kyrodata (cached up to an hour). An identical call within 10 minutes is served from memo at 0 credits. Result status is ok, denied or error, with the reason in text. Credit class: free (0 credits).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many items to return (1–50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words that filter the survey list by name or theme (e.g. 'agrícola', 'emprego'). Ignored when survey is given.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "response_format": {
                "description": "How much of the answer to return. `concise` (the default) carries the headline figures; `detailed` adds the row-level series behind them and counts against the export quota.",
