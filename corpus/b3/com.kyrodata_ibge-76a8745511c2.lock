      },
      "instructions": "The whole IBGE, one smart connection: every public IBGE API, searchable and validated through Kyrodata. Unofficial, not affiliated with IBGE. SIDRA tables chain as search → describe → read: ibge_search_tables finds a table id, ibge_describe_table lists its variables, levels, periods and categories, and ibge_get_table_data reads values with the query validated first. ibge_find_places turns place names into IBGE codes. Labels come in Portuguese as IBGE publishes them; every answer carries a citation line (IBGE open data, free use with attribution). Brazilian trade, production and commodity forecasts are on the sibling Kyrodata server at mcp.kyrodata.com/mcp. Each tool's description states its credit class.",
      "tools": [
        {
          "name": "ibge_describe_table",
          "title": "Describe one SIDRA table's variables and breakdowns",
          "description": "Explains one SIDRA table before reading it: survey, subject, periodicity and the first and last period, the territorial levels it publishes (N1 Brazil … N6 municipality), every variable with its unit, and each classification (breakdown) with its categories. categorySearch narrows long category lists (a crop table has dozens of products). The ids returned here are exactly what ibge_get_table_data accepts. Read-only; reads IBGE's public API live through Kyrodata (cached up to an hour). An identical call within 10 minutes is served from memo at 0 credits. Result status is ok, denied or error, with the reason in text. Credit class: free (0 credits).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "categorySearch": {
                "description": "Filters the categories listed under each classification by these words (e.g. 'soja'). Without it, the first categories of each classification are listed and the total count is given.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "response_format": {
                "description": "How much of the answer to return. `concise` (the default) carries the headline figures; `detailed` adds the row-level series behind them and counts against the export quota.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "table": {
                "description": "SIDRA table (aggregate) id, e.g. 1612. ibge_search_tables returns ids.",
                "maximum": 99999,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["table"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "caveats": {
                "description": "Reading caveats.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "credits": {
                "description": "charged, balance (null = unlimited), resetAt, session {charged, endsAt} of the 60-s billing session.",
                "type": "object"
              },
              "data": {
                "description": "Raw numbers behind the text.",
                "type": "object"
              },
              "dataVersion": {
                "description": "Identity of the data that answered.",
                "type": "string"
              },
              "denied": {
                "description": "When status = denied: reason, feature, upgradeUrl.",
                "type": "object"
              },
              "error": {
                "description": "Failure message when status = error.",
                "type": "string"
              },
              "links": {
                "description": "screen = product page with these numbers.",
                "type": "object"
              },
              "memo": {
                "description": "true = identical call in the last 10 min, served again: 0 credits.",
                "type": "boolean"
              },
              "rows": {
                "description": "Table rows; detailed only, capped per tool.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
