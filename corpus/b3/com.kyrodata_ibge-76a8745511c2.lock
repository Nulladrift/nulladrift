        {
          "name": "ibge_lookup_cnae",
          "title": "Look up a CNAE activity code",
          "description": "Looks up Brazil's official activity classification (CNAE 2.0, kept by IBGE). With `code` it returns that node (section, division, group, class or subclass), its full hierarchy and IBGE's notes on what it includes and excludes. With `query` it finds the classes whose description matches. Useful to tag a company activity or to read SIDRA tables broken down by CNAE. Read-only; reads IBGE's public API live through Kyrodata (cached up to an hour). An identical call within 10 minutes is served from memo at 0 credits. Result status is ok, denied or error, with the reason in text. Credit class: free (0 credits).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
