        {
          "name": "ibge_get_boundary",
          "title": "Get an official territorial boundary",
          "description": "Returns the official boundary of Brazil, a macro-region, a state or a municipality from IBGE's territorial mesh: name, area in km², centroid and bounding box, plus the GeoJSON URL. includeGeometry adds the polygon itself (minimal quality by default; anything above 300 KB is refused and only the URL is given). Coordinates are SIRGAS 2000 longitude/latitude. Read-only; reads IBGE's public API live through Kyrodata (cached up to an hour). An identical call within 10 minutes is served from memo at 0 credits. Result status is ok, denied or error, with the reason in text. Credit class: comex (up to 2 comex tools per 60-second session = 1 credit).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "BR for the country; region 1–5; state code (35); municipality code (3550308).",
                "pattern": "^(BR|\\d{1,7})$",
                "type": "string"
              },
              "includeGeometry": {
                "description": "true adds the GeoJSON polygon (refused above 300 KB, the URL is always given). Default false: centroid, area and bounding box.",
                "type": "boolean"
              },
              "level": {
                "description": "Kind of territory.",
                "enum": ["country", "region", "state", "municipality"],
                "type": "string"
              },
              "quality": {
                "description": "Geometry detail when includeGeometry is true (default minimal; maximal can be megabytes).",
                "enum": ["minimal", "intermediate", "maximal"],
                "type": "string"
              },
              "response_format": {
                "description": "How much of the answer to return. `concise` (the default) carries the headline figures; `detailed` adds the row-level series behind them and counts against the export quota.",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "required": ["id", "level"],
            "type": "object"
          },
          "outputSchema": {
