        {
          "name": "ibge_get_name_frequency",
          "title": "Read Census first-name statistics",
          "description": "Reads the 2010 Census first-name statistics. With `names` it returns how many people with each name were born per decade, from before 1930 to the 2000s; without it, the ranking of the most common names, optionally for one decade. `sex` and `locality` (state or municipality code) narrow both. Counts refer to people alive at the 2010 Census, not to all births. Read-only; reads IBGE's public API live through Kyrodata (cached up to an hour). An identical call within 10 minutes is served from memo at 0 credits. Result status is ok, denied or error, with the reason in text. Credit class: comex (up to 2 comex tools per 60-second session = 1 credit).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "decade": {
                "description": "Ranking only: decade of birth (1930–2010). Omitted: all decades together.",
                "maximum": 2010,
                "minimum": 1930,
                "multipleOf": 10,
                "type": "integer"
              },
              "locality": {
                "description": "State (2 digits) or municipality (7 digits) code. Omitted: Brazil.",
                "pattern": "^\\d{2}$|^\\d{7}$",
                "type": "string"
              },
              "names": {
                "description": "First names to look up (e.g. ['Maria','João']). Returns births per decade. Omitted: the ranking instead.",
                "items": {
                  "pattern": "^[\\p{L}' -]{2,40}$",
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "response_format": {
                "description": "How much of the answer to return. `concise` (the default) carries the headline figures; `detailed` adds the row-level series behind them and counts against the export quota.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "sex": {
                "description": "F or M. Omitted: both.",
                "enum": ["F", "M"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "caveats": {
                "description": "Reading caveats.",
                "items": {
                  "type": "string"
                },
