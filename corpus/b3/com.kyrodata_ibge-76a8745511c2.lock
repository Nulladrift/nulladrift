        {
          "name": "ibge_find_places",
          "title": "Find IBGE codes for Brazilian places",
          "description": "Finds Brazilian places by name and returns their official IBGE codes: regions, states, mesoregions, microregions or municipalities (all 5,571). Accent-insensitive; `state` narrows by two-letter abbreviation; `capitals` returns the 27 state capitals in one call. Each result carries the SIDRA level code (N3, N6…) so its id can go straight into ibge_get_table_data `localities`, and the 7-digit municipality code that ibge_get_city_profile and ibge_get_boundary take. Read-only; reads IBGE's public API live through Kyrodata (cached up to an hour). An identical call within 10 minutes is served from memo at 0 credits. Result status is ok, denied or error, with the reason in text. Credit class: free (0 credits).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "capitals": {
                "description": "true returns the 27 state capitals (Brasília included) as municipalities, ignoring level, query and state; their ids go straight into ibge_get_table_data `localities` at level N6.",
                "type": "boolean"
              },
              "level": {
                "description": "Which kind of place to return (default municipality). Each result carries the SIDRA level code to query it.",
                "enum": ["region", "state", "mesoregion", "microregion", "municipality"],
                "type": "string"
              },
              "limit": {
                "description": "How many items to return (1–50, default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Place name, accents optional (e.g. 'sorriso', 'Sao Paulo'). Omitted: every place at the level, within `state`.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "response_format": {
                "description": "How much of the answer to return. `concise` (the default) carries the headline figures; `detailed` adds the row-level series behind them and counts against the export quota.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter state abbreviation that restricts the results (e.g. 'MT').",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "caveats": {
                "description": "Reading caveats.",
                "items": {
                  "type": "string"
                },
                "type": "array"
