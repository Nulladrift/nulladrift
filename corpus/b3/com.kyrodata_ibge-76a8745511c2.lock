        {
          "name": "ibge_query_geodesy",
          "title": "Query IBGE geodetic services",
          "description": "Queries IBGE's geodetic services. `stations` lists control stations of a municipality or state from the Geodetic Database (code, type, status, coordinates, orthometric height). `tide_gauges` lists the permanent tide-gauge network. `convert_datum` converts a point between Brazilian datums (SAD69, Córrego Alegre, SIRGAS 2000) with IBGE's ProGriD grids. `height_conversion` returns the hgeoHNOR factor that turns a GNSS (ellipsoidal) height into a normal height at a point. Read-only; reads IBGE's public API live through Kyrodata (cached up to an hour). An identical call within 10 minutes is served from memo at 0 credits. Result status is ok, denied or error, with the reason in text. Credit class: comex (up to 2 comex tools per 60-second session = 1 credit).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "altitude": {
                "description": "convert_datum, height_conversion: height in metres (default 0).",
                "maximum": 9000,
                "minimum": -500,
                "type": "number"
              },
              "fromDatum": {
                "description": "convert_datum: datum of the input point (default sad69).",
                "enum": ["ca61", "ca7072", "sad69", "sad69_96", "sad69_96_gps", "sirgas2000"],
                "type": "string"
              },
              "lat": {
                "description": "convert_datum, height_conversion: latitude in decimal degrees.",
                "maximum": 7,
                "minimum": -35,
                "type": "number"
              },
              "limit": {
                "description": "How many items to return (1–50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "convert_datum, height_conversion: longitude in decimal degrees.",
                "maximum": -28,
                "minimum": -75,
                "type": "number"
              },
              "municipality": {
                "description": "stations: 7-digit municipality code.",
                "pattern": "^\\d{7}$",
                "type": "string"
              },
              "operation": {
                "description": "`stations`: geodetic control stations of a municipality or state. `tide_gauges`: the national tide-gauge network. `convert_datum`: a point from one datum to another (ProGriD). `height_conversion`: the hgeoHNOR factor between a GNSS (ellipsoidal) height and a normal height at a point.",
                "enum": ["stations", "tide_gauges", "convert_datum", "height_conversion"],
                "type": "string"
              },
              "response_format": {
                "description": "How much of the answer to return. `concise` (the default) carries the headline figures; `detailed` adds the row-level series behind them and counts against the export quota.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "state": {
                "description": "stations: two-letter state abbreviation (used when municipality is absent).",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "toDatum": {
                "description": "convert_datum: datum to convert to (default sirgas2000).",
                "enum": ["ca61", "ca7072", "sad69", "sad69_96", "sad69_96_gps", "sirgas2000"],
                "type": "string"
              }
            },
            "required": ["operation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "caveats": {
                "description": "Reading caveats.",
                "items": {
                  "type": "string"
                },
                "type": "array"
