{
  "lockfileVersion": 2,
  "subjects": {
    "app.makeroo/makeroo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://makeroo.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "makeroo",
        "title": "Makeroo",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "confirm_submission",
          "title": "Confirm submission",
          "description": "Step 2 of 2. Call only after the maker explicitly confirmed the exact details and recipient email from the submit_listing preview. Pass the same fields plus its confirmationToken (valid 30 minutes). Emails a confirm link to makerEmail (expires after 48 hours) and returns a submission id that stays pending until the maker clicks it; poll get_submission_status. Changed fields or an expired token are rejected.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category id from list_categories",
                "type": "string"
              },
              "confirmationToken": {
                "description": "confirmationToken from the submit_listing preview",
                "type": "string"
              },
              "description": {
                "description": "Plain description of what it does, 20-2000 chars",
                "type": "string"
              },
              "logoUrl": {
                "description": "Public http(s) URL of a logo",
                "type": "string"
              },
              "makerEmail": {
                "description": "Contact email of the maker; receives a confirm link once confirm_submission runs",
                "type": "string"
              },
              "name": {
                "description": "Product name, 2-60 chars",
                "type": "string"
              },
              "openSource": {
                "description": "Whether the product is open source, only if verified; omit when unsure",
                "type": "boolean"
              },
              "platforms": {
                "description": "Platforms it runs on; api_cli covers APIs, SDKs and CLIs; omit when unsure",
                "items": {
                  "enum": ["web", "macos", "windows", "linux", "ios", "android", "api_cli"],
                  "type": "string"
                },
                "type": "array"
              },
              "pricing": {
                "description": "Pricing model, only if verified; omit when unsure",
                "enum": ["free", "freemium", "paid", "free_trial"],
                "type": "string"
              },
              "repoUrl": {
                "description": "Public GitHub, GitLab or Codeberg repo of an open-source product",
                "type": "string"
              },
              "tagline": {
                "description": "One line pitch, 5-100 chars",
                "type": "string"
              },
              "tags": {
                "description": "Up to 5 short tags",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "Public http(s) URL of the product",
                "type": "string"
              }
            },
            "required": ["category", "confirmationToken", "description", "makerEmail", "name", "tagline", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Confirm submission"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:40a2b0501edfc7d4d629ad314eee4477eb00cb078e96a5bdfd35d1d9be99e9a4"
        },
        {
          "name": "get_listing",
          "title": "Get listing",
          "description": "Get one live listing by its slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Listing slug, e.g. from search_listings",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:76c6e05a3678f36e8c040b4bf93279c0239f3855d533a6eafe195e57c58018e1"
        },
        {
          "name": "get_submission_status",
          "title": "Get submission status",
          "description": "Check a submission: pending, review (needs human look), live or rejected, with the verification verdict and reasons.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Submission id returned by confirm_submission",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get submission status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3a54e993a8e5d5594ec295ce17fc2aea92916750fd52c7be91c84749c1fb95c"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List valid category ids and names for submit_listing.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:111347d579e80ddc043216d538e318e06e919cb94ce3913b9d2de6cbd3ccb161"
        },
        {
          "name": "search_listings",
          "title": "Search listings",
          "description": "Search live Makeroo listings by keyword across name, tagline, description and tags. Omit query to browse the newest. Narrow by pricing, open source and platform; a listing whose value is unknown never matches that filter. Each listing carries attributes: pricing, openSource, repoUrl and platforms, null when unknown.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category id from list_categories",
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "open_source": {
                "const": true,
                "description": "true for open-source listings only",
                "type": "boolean"
              },
              "platform": {
                "description": "Only listings that run on this platform; api_cli covers APIs, SDKs and CLIs",
                "enum": ["web", "macos", "windows", "linux", "ios", "android", "api_cli"],
                "type": "string"
              },
              "pricing": {
                "description": "Only listings with this pricing model; free_trial means paid after a trial",
                "enum": ["free", "freemium", "paid", "free_trial"],
                "type": "string"
              },
              "query": {
                "description": "Keyword(s) to look for",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8bd0332242851eae8981de2c0dfe840be3e82fc6e235241682e8fe1caaae1c53"
        },
        {
          "name": "submit_listing",
          "title": "Submit listing",
          "description": "Step 1 of 2 for submitting a product to Makeroo on the maker's behalf. Only submit what you verified from the product's repo or site. Validates the details and returns a preview plus a confirmationToken. Stores and emails nothing. Show the maker the preview and the recipient email, and only after they explicitly confirm call confirm_submission.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category id from list_categories",
                "type": "string"
              },
              "description": {
                "description": "Plain description of what it does, 20-2000 chars",
                "type": "string"
              },
              "logoUrl": {
                "description": "Public http(s) URL of a logo",
                "type": "string"
              },
              "makerEmail": {
                "description": "Contact email of the maker; receives a confirm link once confirm_submission runs",
                "type": "string"
              },
              "name": {
                "description": "Product name, 2-60 chars",
                "type": "string"
              },
              "openSource": {
                "description": "Whether the product is open source, only if verified; omit when unsure",
                "type": "boolean"
              },
              "platforms": {
                "description": "Platforms it runs on; api_cli covers APIs, SDKs and CLIs; omit when unsure",
                "items": {
                  "enum": ["web", "macos", "windows", "linux", "ios", "android", "api_cli"],
                  "type": "string"
                },
                "type": "array"
              },
              "pricing": {
                "description": "Pricing model, only if verified; omit when unsure",
                "enum": ["free", "freemium", "paid", "free_trial"],
                "type": "string"
              },
              "repoUrl": {
                "description": "Public GitHub, GitLab or Codeberg repo of an open-source product",
                "type": "string"
              },
              "tagline": {
                "description": "One line pitch, 5-100 chars",
                "type": "string"
              },
              "tags": {
                "description": "Up to 5 short tags",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "Public http(s) URL of the product",
                "type": "string"
              }
            },
            "required": ["category", "description", "makerEmail", "name", "tagline", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Submit listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc2fcf7dba5e771b77f36af7518ef1715799bdc4f0ce6d872a8bff591cc7ca05"
        }
      ],
      "digest": "sha256:a4f7ca0b6d40d0b13ee72529b1cda2ea4215b5fe2e8598b57a712ad7df551f54"
    }
  }
}
