        "url": "https://makeroo.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "makeroo",
        "title": "Makeroo",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "confirm_submission",
          "title": "Confirm submission",
          "description": "Step 2 of 2. Call only after the maker explicitly confirmed the exact details and recipient email from the submit_listing preview. Pass the same fields plus its confirmationToken (valid 30 minutes). Emails a confirm link to makerEmail (expires after 48 hours) and returns a submission id that stays pending until the maker clicks it; poll get_submission_status. Changed fields or an expired token are rejected.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category id from list_categories",
                "type": "string"
              },
              "confirmationToken": {
                "description": "confirmationToken from the submit_listing preview",
                "type": "string"
              },
              "description": {
                "description": "Plain description of what it does, 20-2000 chars",
                "type": "string"
              },
              "logoUrl": {
                "description": "Public http(s) URL of a logo",
                "type": "string"
              },
              "makerEmail": {
                "description": "Contact email of the maker; receives a confirm link once confirm_submission runs",
                "type": "string"
              },
              "name": {
                "description": "Product name, 2-60 chars",
                "type": "string"
              },
              "openSource": {
                "description": "Whether the product is open source, only if verified; omit when unsure",
                "type": "boolean"
              },
              "platforms": {
                "description": "Platforms it runs on; api_cli covers APIs, SDKs and CLIs; omit when unsure",
                "items": {
                  "enum": ["web", "macos", "windows", "linux", "ios", "android", "api_cli"],
                  "type": "string"
                },
                "type": "array"
              },
              "pricing": {
                "description": "Pricing model, only if verified; omit when unsure",
                "enum": ["free", "freemium", "paid", "free_trial"],
                "type": "string"
              },
              "repoUrl": {
                "description": "Public GitHub, GitLab or Codeberg repo of an open-source product",
                "type": "string"
              },
              "tagline": {
                "description": "One line pitch, 5-100 chars",
                "type": "string"
              },
              "tags": {
                "description": "Up to 5 short tags",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "Public http(s) URL of the product",
                "type": "string"
              }
            },
            "required": ["category", "confirmationToken", "description", "makerEmail", "name", "tagline", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Confirm submission"
          },
          "behavior": {
            "destructive": false,
