  "subjects": {
    "app.haterpicks/api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.haterpicks.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "haterpicks-api",
        "title": "HaterPicks API",
        "version": "1.0.0",
        "websiteUrl": "https://www.haterpicks.app/api"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "HaterPicks API: live Australian bookmaker odds, player props, best prices, live scores for 120+ leagues, and (Pro plan) +EV prices, arbitrage and same-game multi quotes. Data tools need the user's HaterPicks API key on the connection (Authorization: Bearer hp_live_…). If a tool says it needs a key or a higher plan, relay that message and the link in it (https://www.haterpicks.app/developer); do not retry. Start with list_sports_and_bookmakers for sport codes and market keys. Narrow get_odds and get_best_price with search (a team or player) and market. Each data tool call is one API call against the key's monthly allowance; the answer's quota field says how many are left. Odds are decimal; times are ISO 8601 UTC. HaterPicks is analytics only and never places bets. Prices move: tell the user to confirm a price at the bookmaker.",
      "tools": [
        {
          "name": "get_arbitrage",
          "title": "Get arbitrage opportunities",
          "description": "Markets where backing every outcome at different Australian bookmakers returns more than the total stake: the profit % and each leg's side, bookmaker and decimal price, best first. Prices move fast; check them at the bookmaker before acting. Needs the Pro plan ($79 AUD a month) or higher. Counts as one API call (GET /api/v1/arbs).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 20,
                "description": "How many rows to return (default 20, at most 100). Use search or market to narrow first.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_profit_pct": {
                "description": "Minimum guaranteed return, percent of total stake (default 0.5).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "sport": {
                "description": "Only this sport, e.g. AFL or SOCCER (any case).",
                "maxLength": 20,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get arbitrage opportunities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c729f9a054d6d848324c15c95a18d1439c024411b263df987ba187462ffb6fd2"
        },
        {
          "name": "get_best_price",
          "title": "Find the best price for a market",
          "description": "Which Australian bookmaker pays the most for each side of a market: the best decimal price, the bookmaker, how many books price that side and how much more the best pays than the worst (spread_pct). Sharp reference books that cannot be backed are left out. Free keys cover game lines; player props need Starter or higher. Works on every plan, Free included. Counts as one API call (GET /api/v1/odds?sport=).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many rows to return (default 10, at most 50). Use search or market to narrow first.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "A market key such as AFL_H2H or NBA_POINTS, or just its ending: H2H, TOTAL, LINE, SPREAD, POINTS, DISPOSALS.",
                "maxLength": 40,
                "type": "string"
              },
              "search": {
                "description": "Team, player or matchup words, e.g. \"Carlton\" or \"Nick Daicos\". Every word must match.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "sport": {
                "description": "Sport code, upper case. list_sports_and_bookmakers lists every code and its markets.",
                "enum": ["AFL", "AFLW", "BOXING", "CRICKET", "ESPORTS", "GOLF", "MLB", "NBA", "NBL", "NCAAB", "NCAAF", "NFL", "NHL", "NRL", "NRLW", "RACING", "RUGBY_UNION", "SOCCER", "TENNIS", "UFC", "WNBA"],
                "type": "string"
              }
            },
            "required": ["search", "sport"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find the best price for a market"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:154570fe29a2cebe3eaff91881418aa9b433a30b8be669afb876a4fd79a0a8e9"
        },
        {
          "name": "get_ev",
          "title": "Get +EV player-prop prices",
          "description": "Player-prop prices where the best Australian bookmaker price beats the fair price, best edge first: player, stat, line, side, best price and bookmaker, edge % (market_ev_pct) and fair probability. basis says whether the fair price comes from our model and the market or the market alone. Needs the Pro plan ($79 AUD a month) or higher. Counts as one API call (GET /api/v1/ev).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 20,
                "description": "How many rows to return (default 20, at most 100). Use search or market to narrow first.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_edge_pct": {
                "description": "Only picks whose edge (market_ev_pct) is at least this percent.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "sport": {
                "description": "Only this sport, e.g. AFL or NBA (any case).",
                "maxLength": 20,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get +EV player-prop prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cfe34bc9a5df05c7aaaf0760a0eb955e534fbf5073f0783fc7954cb8d4ee6a86"
        },
        {
          "name": "get_odds",
          "title": "Get live odds",
          "description": "Live odds for one sport across Australian bookmakers: one row per game, market and line, with each bookmaker's decimal price for every side. Narrow with search (team or player) and market. Free keys get game lines (head-to-head, line, total); player-prop rows need Starter or higher. Works on every plan, Free included. Counts as one API call (GET /api/v1/odds?sport=).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 25,
                "description": "How many rows to return (default 25, at most 100). Use search or market to narrow first.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "A market key such as AFL_H2H or NBA_POINTS, or just its ending: H2H, TOTAL, LINE, SPREAD, POINTS, DISPOSALS.",
                "maxLength": 40,
                "type": "string"
              },
              "search": {
                "description": "Team, player or matchup words, e.g. \"Collingwood\" or \"Lakers Celtics\". Every word must match.",
                "maxLength": 80,
                "type": "string"
              },
              "sport": {
                "description": "Sport code, upper case. list_sports_and_bookmakers lists every code and its markets.",
                "enum": ["AFL", "AFLW", "BOXING", "CRICKET", "ESPORTS", "GOLF", "MLB", "NBA", "NBL", "NCAAB", "NCAAF", "NFL", "NHL", "NRL", "NRLW", "RACING", "RUGBY_UNION", "SOCCER", "TENNIS", "UFC", "WNBA"],
                "type": "string"
              }
            },
            "required": ["sport"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get live odds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:27ad39880d81b76272112033d2d14d59631b2a4c790a554cf0ea193e3b2f4160"
        },
        {
          "name": "get_player_props",
          "title": "Get player props",
          "description": "Player-prop markets for one sport across Australian bookmakers: player, market, line and each bookmaker's over and under price. Narrow with player, team and market. Needs the Starter plan ($29 AUD a month) or higher. Free keys can read sport nba from a copy refreshed every 30 minutes. Counts as one API call (GET /api/v1/props?sport=).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 25,
                "description": "How many rows to return (default 25, at most 100). Use search or market to narrow first.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "A market key such as AFL_H2H or NBA_POINTS, or just its ending: H2H, TOTAL, LINE, SPREAD, POINTS, DISPOSALS.",
                "maxLength": 40,
                "type": "string"
              },
              "player": {
                "description": "Player name words, e.g. \"Daicos\". Every word must match.",
                "maxLength": 80,
                "type": "string"
              },
              "sport": {
                "description": "Sport key, lower case.",
                "enum": ["nrl", "nrlw", "nhl", "mlb", "afl", "aflw", "nba", "wnba", "nbl", "soccer", "tennis", "ufc", "boxing", "nfl", "ncaaf", "ncaab", "cricket", "rugby_union", "golf"],
                "type": "string"
              },
              "team": {
                "description": "Team or matchup words, e.g. \"Collingwood\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["sport"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get player props"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5db6dc1bd0b0dbce907df52eafdfe53ee943b89754cc132ebb4da5d68cd63950"
        },
        {
          "name": "get_scores",
          "title": "Get live scores",
          "description": "Live scores for 120+ leagues: score, period, clock and status for every game around today (yesterday's finals to two days ahead). With no league it lists the league keys. Golf and motor racing add a top-10 leaderboard. Works on every plan, Free included. A box score (game) needs Starter or higher. Counts as one API call (GET /api/v1/scores).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "game": {
                "description": "A game id from the league's scores, for its box score (WNBL and NBL1; needs Starter or higher). Needs league.",
                "maxLength": 60,
                "type": "string"
              },
              "league": {
                "description": "League key, e.g. nba, afl, nrl, eng.1, wnbl. Leave it off for the list of every league key.",
                "maxLength": 40,
                "type": "string"
              },
              "season": {
                "const": "current",
                "description": "\"current\" for every game of the season, played and to come (WNBL and NBL1). Needs league.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get live scores"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e5d503b872a3e1c7398e9d223f6aeeb021e03ea01b5fb4798b001d39a651039c"
        },
        {
          "name": "get_started",
          "title": "Get started with the HaterPicks API",
          "description": "How to connect a HaterPicks API key, what each plan includes and which tool needs which plan. Call this first if no key is connected or a tool says it needs one. Needs no key. Get a free key at https://www.haterpicks.app/developer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get started with the HaterPicks API"
          },
          "behavior": {
