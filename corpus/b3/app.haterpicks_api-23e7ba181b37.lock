          "digest": "sha256:02d824f6eb0d5c033ee6451dc4b244732d9f4f3b233cde6a281c3c0f6ef226b3"
        },
        {
          "name": "list_sports_and_bookmakers",
          "title": "List sports, markets and bookmakers",
          "description": "The sport codes get_odds and get_best_price accept, with each sport's market keys; the sports get_player_props accepts; and the bookmakers whose prices the feeds carry (id and name). Needs no key and costs no API call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "sport": {
                "description": "Only this sport's markets. Leave it off for every sport.",
                "enum": ["AFL", "AFLW", "BOXING", "CRICKET", "ESPORTS", "GOLF", "MLB", "NBA", "NBL", "NCAAB", "NCAAF", "NFL", "NHL", "NRL", "NRLW", "RACING", "RUGBY_UNION", "SOCCER", "TENNIS", "UFC", "WNBA"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List sports, markets and bookmakers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d6a33fbeed1c3cae168b017089ab4377b0b3d9daeaf7362c42f437e186251ff"
        },
        {
          "name": "quote_same_game_multi",
          "title": "Quote a same-game multi",
          "description": "Live price for a same-game multi (parlay) of two or more player-prop legs from one game, at each Australian bookmaker that will price it, with a fair quote. Read-only: it asks for a price and never places a bet. Needs the Pro plan ($79 AUD a month) or higher. Counts as one API call (POST /api/v1/sgm-quote).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "away": {
                "description": "Away team name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "books": {
                "description": "Only these bookmaker ids (see list_sports_and_bookmakers). Leave it off for every bookmaker that prices it.",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "home": {
                "description": "Home team name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "legs": {
                "description": "Two or more player-prop legs from the same game.",
                "items": {
                  "properties": {
                    "line": {
                      "description": "The over line, a half point: 29.5 for 30+.",
                      "type": "number"
                    },
                    "player": {
                      "description": "Player name as the bookmakers list it, e.g. \"Nick Daicos\".",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "side": {
                      "default": "OVER",
                      "enum": ["OVER", "UNDER"],
                      "type": "string"
                    },
                    "stat": {
                      "description": "Stat code, e.g. DISP, GOAL, MARK, TACK (AFL) or PTS, REB, AST (basketball).",
                      "maxLength": 20,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["line", "player", "stat"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "sport": {
                "description": "Sport key, lower case, e.g. afl, nrl, nba.",
                "maxLength": 20,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["away", "home", "legs", "sport"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Quote a same-game multi"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a6db4e00c39a22726487c0bc53f15f79a1756d59148a0fb22806c53fc79d1967"
        }
      ],
