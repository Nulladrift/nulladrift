      },
      "transport": {
        "type": "http",
        "url": "https://scrapeselect.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ScrapeSelect",
        "title": "ScrapeSelect — web scraping infrastructure pricing",
        "version": "1.0.1",
        "websiteUrl": "https://scrapeselect.com",
        "icons": [
          {
            "src": "https://scrapeselect.com/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://scrapeselect.com/apple-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Current pricing, normalized monthly costs and recommendations for web scraping APIs, unlockers and browser infrastructure. Every number cites an official source with a check date. Quote the sources and assumptions you rely on; estimates are not invoices.",
      "tools": [
        {
          "name": "compare_products",
          "description": "Compare up to three products on one workload: monthly cost range, chosen plan,\n    capabilities, limits and caveats.",
          "inputSchema": {
            "$defs": {
              "AntiBotLevel": {
                "enum": ["low", "medium", "high", "unknown"],
                "title": "AntiBotLevel",
                "type": "string"
              },
              "Workload": {
                "additionalProperties": false,
                "description": "Monthly scraping workload. Unset optional fields fall back to visible assumptions.",
                "properties": {
                  "anti_bot_level": {
                    "$ref": "#/$defs/AntiBotLevel",
                    "default": "unknown"
                  },
                  "average_browser_seconds": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "maximum": 3600,
                        "type": "number"
                      },
                      {
                        "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Average Browser Seconds"
                  },
                  "average_page_size_kb": {
                    "anyOf": [
                      {
                        "maximum": 102400,
                        "minimum": 1,
                        "type": "number"
                      },
                      {
                        "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Average Page Size Kb"
                  },
                  "country_required": {
                    "default": true,
                    "title": "Country Required",
                    "type": "boolean"
                  },
                  "domain_class": {
                    "anyOf": [
                      {
                        "maxLength": 40,
                        "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Target category with special pricing, e.g. 'amazon'.",
                    "title": "Domain Class"
                  },
                  "expected_success_rate": {
                    "anyOf": [
                      {
                        "maximum": 1,
                        "minimum": 0.5,
                        "type": "number"
                      },
                      {
                        "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Expected Success Rate"
                  },
                  "javascript_ratio": {
                    "anyOf": [
                      {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$",
                        "type": "string"
                      }
                    ],
                    "default": "0",
                    "title": "Javascript Ratio"
                  },
                  "monthly_billing_only": {
                    "default": false,
                    "title": "Monthly Billing Only",
                    "type": "boolean"
                  },
                  "peak_concurrency": {
                    "default": 10,
                    "maximum": 100000,
                    "minimum": 1,
                    "title": "Peak Concurrency",
                    "type": "integer"
                  },
                  "successful_pages_per_month": {
                    "maximum": 1000000000,
                    "minimum": 1,
                    "title": "Successful Pages Per Month",
                    "type": "integer"
                  },
                  "target_country": {
                    "anyOf": [
                      {
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Target Country"
                  }
                },
                "required": ["successful_pages_per_month"],
                "title": "Workload",
                "type": "object"
              }
            },
            "properties": {
              "products": {
                "description": "Up to 3 as \"provider/product\"",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "title": "Products",
                "type": "array"
              },
              "workload": {
                "$ref": "#/$defs/Workload"
              }
            },
            "required": ["products", "workload"],
            "title": "compare_productsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "compare_productsDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22f6b947b0aa5d0b1b986f7dc0990194b00a985811d720361d038ac70285a041"
        },
