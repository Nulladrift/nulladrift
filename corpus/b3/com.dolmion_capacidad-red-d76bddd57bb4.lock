      "serverInfo": {
        "name": "cnmc-capacidad",
        "title": "Capacidad de la red eléctrica en España (mapas CNMC)",
        "version": "0.1.0",
        "description": "Capacidad eléctrica disponible para conectar nueva demanda (consumo) o nueva generación en los nudos y subestaciones de la red de distribución y de transporte de España, cerca de una dirección, municipio, parcela o referencia catastral. Datos de los mapas de capacidad de acceso que la CNMC publica cada mes, con su evolución. Y afecciones territoriales (Natura 2000, inundables, dominio público hidráulico, carreteras, planeamiento) hasta el nudo.",
        "websiteUrl": "https://dolmion.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Capacidad de acceso a la red eléctrica española publicada mensualmente por la CNMC (Circular 6/2025): capacidad disponible para nueva demanda o nueva generación en cada barra de tensión superior a 1 kV de las subestaciones de distribución (63 distribuidoras) y de transporte (Red Eléctrica).\n\nReglas al presentar resultados:\n- Indica siempre el periodo del dato (campo 'periodo') y que las capacidades son informativas.\n- Las capacidades de distintos nudos NO son sumables (unos nudos influyen sobre otros). Dentro de un nudo se da la capacidad de cada barra y el máximo por barra, nunca la suma.\n- No hay datos de centros de transformación: para potencias pequeñas en baja o media tensión local, el mapa no responde a la pregunta.\n- Las solicitudes de acceso y conexión se tramitan con el gestor de red que aparece en cada nudo.\n- Si 'ubicacion_interpretada.alternativas' no está vacío, el lugar era ambiguo: dilo y ofrece repetir con la provincia.\n- 'en_radio' cuenta los nudos del radio con y sin capacidad: da las dos cifras, no solo los favorables.\n- Si la respuesta empieza por 'nota_potencia', dila antes que cualquier cifra: para esa potencia (o sin potencia indicada) el mapa no decide. Pasa potencia_kw siempre que se conozca.\n- 'resumen' da las cifras del radio: úsalo tal cual, con los nudos sin capacidad. Si hay 'resumen_presion', dilo también.\n- 'geo_corregida' indica que la coordenada publicada era errónea y se tomó la de la propia subestación.\n- 'presion' compara, en cada barra, las solicitudes admitidas pendientes (cola) con la capacidad disponible: sin_cola, baja (< 25 %), media (< 100 %) o alta (la cola iguala o supera lo disponible). Es una señal de competencia por esa capacidad, no una probabilidad de obtenerla: da su 'explicacion' con las cifras.\n- 'solicitudes_ree' (solo nudos de transporte, demanda) resume los listados de solicitudes de acceso de Red Eléctrica: cuántas, MW pedidos por tipo (consumo, autoconsumo, incremento, almacenamiento), la más reciente y si el nudo es de concurso de demanda. Explica qué hay detrás de la cola; no la sustituye ni se suma a las cifras de la CNMC. Si 'concurso' es true, dilo: esa capacidad se asigna por concurso.\n- 'afecciones' da las restricciones territoriales del emplazamiento y del corredor hasta el nudo: empieza por su 'resumen' y su 'aviso', di lo que queda fuera ('sin_cobertura') y ofrece 'consultar_tambien'. Las bandas marcadas 'probable' (dominio público, servidumbre) se miden desde el eje estimado: no las des como exactas. Que una capa no dé resultado no prueba que no haya afección. 'urbanismo', si viene, da la clase y el uso del suelo según la fuente que indica: es informativo y sin validez jurídica; dilo así y remite al ayuntamiento para confirmarlo.\nEl recurso cnmc://acerca explica fuentes, cobertura y campos.",
      "tools": [
        {
          "name": "afecciones",
          "description": "Afecciones territoriales de un emplazamiento y del corredor hasta su nudo de conexión a la red:\n    Red Natura 2000, zonas inundables (10, 100 y 500 años), dominio público hidráulico con sus zonas de\n    servidumbre y policía (y cauces menores), montes de utilidad pública, vías pecuarias, carreteras y\n    ferrocarriles con sus zonas de protección por ley, sensibilidad ambiental para renovables (MITECO),\n    clase de suelo catastral y planeamiento urbanístico (clase y uso del suelo: Comunidad de Madrid y\n    Ayuntamiento de Madrid, Aragón, Comunitat Valenciana y, en el resto, el SIU del Ministerio de Vivienda).\n\n    Úsala cuando pregunten qué restricciones o permisos afectan a un terreno, a una planta, a una nave o\n    a la línea o acometida hasta la subestación. Para el corredor, pasa el barra_id del nudo elegido.\n\n    Devuelve 'resumen' (dilo tal cual), las afecciones del emplazamiento y del corredor, 'sin_cobertura'\n    (lo que no se consulta: patrimonio cultural, calificación detallada...), 'consultar_tambien' (fuentes oficiales con\n    enlace) y la fuente y fecha de cada capa. Con dirección personal, además las bandas legales, la norma\n    y el organismo que tramita. Informativo: no sustituye a los informes sectoriales.",
          "inputSchema": {
            "properties": {
              "barra_id": {
                "anyOf": [
                  {
                    "pattern": "^[0-9a-f]{16}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Nudo de conexión (de buscar_capacidad o ranking_nudos): se estudia el corredor en línea recta desde el emplazamiento hasta su subestación.",
                "title": "Barra Id"
              },
              "radio_m": {
                "default": 500,
                "description": "Radio alrededor del emplazamiento, en metros.",
                "maximum": 5000,
                "minimum": 50,
                "title": "Radio M",
                "type": "integer"
              },
              "trazado": {
                "anyOf": [
                  {
                    "items": {
                      "items": {
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "maxItems": 500,
                    "minItems": 2,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Trazado propio de la línea o acometida, como lista de puntos [lon, lat] en grados (orden GeoJSON). Sustituye a la recta hasta el nudo. Solo con dirección personal de acceso.",
                "title": "Trazado"
              },
              "ubicacion": {
                "description": "Emplazamiento: dirección, municipio, referencia catastral o coordenadas 'lat, lon', como en buscar_capacidad.",
                "maxLength": 200,
                "minLength": 1,
                "title": "Ubicacion",
                "type": "string"
              }
            },
            "required": ["ubicacion"],
            "title": "afeccionesArguments",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eee165d281e1169b3109dbecabb7f8159855cc52ef8e38e92306154e18d8bf11"
        },
        {
          "name": "buscar_capacidad",
          "description": "Capacidad eléctrica disponible cerca de un lugar de España: nudos de la red (subestaciones)\n    más cercanos a una dirección, municipio, parcela o referencia catastral, ordenados por distancia,\n    con los MW disponibles para conectar nueva demanda (consumo) o nueva generación según el último\n    mapa de capacidad de acceso publicado por la CNMC.\n\n    Úsala cuando pregunten si hay capacidad eléctrica, potencia disponible o punto de conexión para\n    una parcela, nave, vivienda, cargadores, planta fotovoltaica, baterías o centro de datos. Si se\n    conoce la potencia del proyecto, pásala siempre en potencia_kw (la de la pregunta: 15 kW, 2 MW).\n\n    Devuelve por nudo: subestación, tensión (kV), gestor de red, distancia (km), capacidad disponible\n    de cada barra y máximo por barra (MW), y en generación el nudo de transporte del que depende\n    (nudo_afeccion_rdt), y la presión del nudo: solicitudes admitidas pendientes frente a lo\n    disponible ('presion', con su explicación). En nudos de transporte para demanda, 'solicitudes_ree'\n    resume las solicitudes publicadas por Red Eléctrica y si el nudo va a concurso. 'en_radio' cuenta cuántos nudos del radio tienen capacidad y cuántos no:\n    al responder, da las dos cifras, no solo los nudos favorables. Usa 'barra_id' con detalle_nudo\n    para ver la ficha y su evolución mensual.\n\n    Límites del dato: capacidades informativas y NO sumables entre nudos; no incluye centros de\n    transformación ni baja tensión, así que para potencias pequeñas no confirma el suministro; las\n    solicitudes se tramitan con el gestor de red de cada nudo.",
          "inputSchema": {
            "properties": {
              "limite": {
                "default": 15,
                "description": "Máximo de nudos devueltos.",
                "maximum": 50,
                "minimum": 1,
                "title": "Limite",
                "type": "integer"
              },
              "potencia_kw": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 5000000,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Potencia del proyecto en kW, si se conoce (15 para una vivienda o un taller, 2000 para 2 MW). Con ella cada nudo indica si alguna de sus barras la cubre, y para potencias pequeñas se avisa de que el mapa no decide.",
                "title": "Potencia Kw"
              },
              "radio_km": {
                "default": 25,
                "description": "Radio de búsqueda en km.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "title": "Radio Km",
                "type": "number"
              },
              "red": {
                "default": "ambas",
                "description": "Red de distribución (≤ 132 kV, distribuidoras), de transporte (220/400 kV, Red Eléctrica) o ambas.",
                "enum": ["ambas", "distribucion", "transporte"],
                "title": "Red",
                "type": "string"
              },
              "solo_con_capacidad": {
                "default": false,
                "description": "Si es true, omite los nudos sin capacidad disponible.",
                "title": "Solo Con Capacidad",
                "type": "boolean"
              },
              "tension_min_kv": {
                "default": 0,
                "description": "Tensión mínima de la barra en kV. Útil para descartar barras que no sirven a la potencia del proyecto.",
                "maximum": 400,
                "minimum": 0,
                "title": "Tension Min Kv",
                "type": "integer"
              },
              "ubicacion": {
                "description": "Dónde: dirección ('Calle Castilla 10, Santander'), población o municipio ('Reinosa'; si el nombre existe en varias provincias añade ', Provincia'), referencia catastral de 14 o 20 caracteres, o coordenadas 'lat, lon' en grados decimales.",
                "maxLength": 200,
                "minLength": 1,
                "title": "Ubicacion",
                "type": "string"
              },
              "uso": {
                "default": "demanda",
                "description": "'demanda' para consumir (nave, cargadores, electrolizador, centro de datos, bomba de calor); 'generacion' para inyectar (fotovoltaica, eólica, almacenamiento vertiendo).",
                "enum": ["demanda", "generacion"],
                "title": "Uso",
                "type": "string"
              }
            },
            "required": ["ubicacion"],
            "title": "buscar_capacidadArguments",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ce4b9d8444514ca3931e831d434bdefb163ce3026411dbb417ff63976b68bc92"
        },
        {
          "name": "detalle_nudo",
          "description": "Ficha completa de un nudo: capacidad por barra para demanda y para generación (si el nudo\n    figura en ambos mapas), ocupada, comprometida y pendiente de evaluar, posiciones libres, nudo de\n    transporte del que depende, presión (solicitudes pendientes frente a lo disponible), en\n    transporte las solicitudes publicadas por Red Eléctrica ('solicitudes_ree', con el concurso) y la\n    evolución mes a mes desde que hay histórico.\n\n    Datos de los mapas de capacidad de acceso de la CNMC. Límites del dato: capacidades informativas\n    y NO sumables entre nudos; no incluye centros de transformación ni baja tensión; las solicitudes\n    se tramitan con el gestor de red del nudo.",
          "inputSchema": {
            "properties": {
              "barra_id": {
                "description": "Identificador del nudo tal como lo devuelven buscar_capacidad o ranking_nudos.",
                "pattern": "^[0-9a-f]{16}$",
                "title": "Barra Id",
                "type": "string"
              }
            },
            "required": ["barra_id"],
            "title": "detalle_nudoArguments",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85d81b7f86cf28b82e64829b0f5e55c328bb6a259cebd042ed2546e2642ea4fe"
        },
        {
          "name": "ranking_nudos",
          "description": "Nudos con mayor capacidad disponible (máximo por barra) en una provincia, de un gestor, o en\n    toda España, según los mapas de capacidad de acceso de la CNMC. Sirve para localizar dónde hay\n    hueco en la red eléctrica (para demanda o para generación) antes de buscar emplazamiento. Con\n    orden='presion', muestra dónde hay más solicitudes pendientes frente a lo disponible.\n\n    Límites del dato: capacidades informativas y NO sumables entre nudos; no incluye centros de\n    transformación ni baja tensión; las solicitudes se tramitan con el gestor de red de cada nudo.",
          "inputSchema": {
            "properties": {
              "gestor": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Gestor de red por nombre parcial ('Viesgo', 'i-DE') o código ('R1-005').",
                "title": "Gestor"
              },
              "n": {
                "default": 15,
                "description": "Número de nudos.",
                "maximum": 50,
                "minimum": 1,
                "title": "N",
                "type": "integer"
              },
              "orden": {
                "default": "capacidad",
                "description": "'capacidad': primero los de más capacidad disponible. 'presion': primero los de más solicitudes pendientes frente a lo disponible (dónde se compite por la red).",
                "enum": ["capacidad", "presion"],
                "title": "Orden",
                "type": "string"
              },
              "provincia": {
                "anyOf": [
                  {
                    "maxLength": 60,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Provincia (coincidencia parcial: 'Cantabria', 'Valencia'). Vacío para toda España.",
                "title": "Provincia"
              },
              "red": {
                "default": "distribucion",
                "description": "Red.",
                "enum": ["distribucion", "transporte"],
                "title": "Red",
                "type": "string"
              },
              "uso": {
                "default": "demanda",
                "description": "Demanda o generación.",
                "enum": ["demanda", "generacion"],
                "title": "Uso",
                "type": "string"
              }
            },
            "title": "ranking_nudosArguments",
            "type": "object"
          },
