{
  "lockfileVersion": 2,
  "subjects": {
    "com.colorwillow/free-coloring-pages": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://colorwillow.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "colorwillow",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "search_coloring_pages",
          "title": "Find free coloring pages",
          "description": "Search ColorWillow’s published free printable coloring pages. Returns previews and page links for viewing, printing and downloading. No account required. Up to 10 searches per minute per source IP.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 6,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "enum": ["en", "es", "pt-BR", "fr", "de", "ja", "ko", "zh-CN", "zh-TW", "it", "nl"],
                "type": "string"
              },
              "query": {
                "description": "Subject to find in the free printable coloring-page library.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "difficulty": {
                      "maxLength": 32,
                      "type": "string"
                    },
                    "id": {
                      "maxLength": 160,
                      "type": "string"
                    },
                    "pageUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "previewUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "title": {
                      "maxLength": 512,
                      "type": "string"
                    }
                  },
                  "required": ["difficulty", "id", "pageUrl", "previewUrl", "title"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "moreResultsUrl": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["items", "moreResultsUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0d0c8fe4bc3c78a7148e71ee91f1ed349b0d078d98f0daf7e042d0fba0e718f7"
        }
      ],
      "digest": "sha256:b1f445b7b3c56e0e57b8b900d7179da0795ad276f53ba8bdbfb55dc7db1015b6"
    }
  }
}
