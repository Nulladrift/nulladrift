        {
          "name": "compare_industry",
          "description": "以完整產業名稱查同月份公司，依年增率降冪、同值依代號升冪。樣本數為截斷前可排名家數；排除缺營收或年增率者。sort 僅支援 yoy。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "industry": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "YYYY-MM；省略時使用最近已發布月份。未發布月份不推估。",
                "pattern": "^[0-9]{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "sort": {
                "default": "yoy",
                "enum": ["yoy"],
                "type": "string"
              }
            },
            "required": ["industry"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
