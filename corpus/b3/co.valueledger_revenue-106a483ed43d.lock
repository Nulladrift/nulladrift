          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "pattern": "^[0-9]{4,6}$",
                "type": "string"
              },
              "month": {
                "description": "YYYY-MM；省略時使用最近已發布月份。未發布月份不推估。",
