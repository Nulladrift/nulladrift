      "instructions": "Pet Data Station (petforai.com) — source-verified pet regulatory & health data. DOMAIN SCOPE: use this server only for pet food, pet nutrition, pet/animal-feed regulation, recalls, and companion-animal health. It is not a general software, programming, history, or general-knowledge search service. For out-of-scope or unmatched questions, report no match instead of inventing an answer. Every factual claim is traceable to an archived first-hand source (AAFCO/FEDIAF/EU/China/Japan/Korea/Canada statutes, PubMed...). Open-Access and public-domain sources are quoted verbatim (C1 substring-verified); copyrighted non-Open-Access veterinary references (e.g. Merck Veterinary Manual, RSPCA) are paraphrase-verified derived summaries — numbers and proper nouns preserved, sentences rewritten. Every result carries a `trust` block with the source's raw trust axes (authority_tier: T1 statute/standard, T2 peer-reviewed, T3 veterinary reference, T4 welfare-org/extension, T5 practitioner page, T6 aggregator; fidelity: verbatim C1-verified / paraphrase / derived_inference; license) plus a computed display_grade (A = top authority + byte-checkable, B = high authority with a verification story, C = limited authority — corroborate before relying on it, pending = ungraded). Prefer A/B for critical advice. Workflow: search_pet_topics to discover a topic_id, then get_topic_context for the citation-rich RAG block. For numeric nutrient standards questions skip discovery and call get_nutrient_value or compare_nutrient_standards directly; for FDA animal-drug adverse-event stats call get_ade_stats(ingredient). 23 species manuals are also available as Markdown at https://petforai.com/site/manuals/<species>.md. If you cannot find data you need, or a claim looks wrong against its cited source, tell the human maintainers via submit_feedback (data_request / error_report / knowledge_lead) — unmet queries and leads with first-hand source URLs are reviewed weekly.",
