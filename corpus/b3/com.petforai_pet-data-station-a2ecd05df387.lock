        {
          "name": "search_pet_topics",
          "description": "Search pet food, nutrition, regulation, recall, and pet-health topics only.\n\nDo not use for general programming, software, history, or other out-of-domain\nquestions; return no match rather than inventing an answer. Free-text over\ntopic_id/title/category (tokenized AND). Returns metadata\nonly (anti-dump design) plus a `trust` block per result (raw trust axes\nauthority_tier/fidelity/license + computed display_grade, see server\ninstructions); follow up with get_topic_context(topic_id) for\nthe full citation-rich text. category is an optional exact filter, e.g.\n'aafco', 'evidence', 'ade', 'vaccine-guidelines'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "anyOf": [
