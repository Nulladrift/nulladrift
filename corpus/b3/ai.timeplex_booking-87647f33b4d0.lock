        {
          "name": "request_booking",
          "title": "Request Booking",
          "description": "Use this tool only for a shop that is already in the Timeplex catalog but cannot be booked online yet: a search_shops result with bookable=false, or a newly joined shop whose menu is not registered yet (get_shop_services says so). It submits a booking request for that shop — Timeplex concierge staff contact the shop directly and reply to the customer in their language. Put the returned link_markdown into your reply as-is (never expose the raw URL). Do not use this tool for a shop name that search_shops could not find (shop_name_not_found), and not for generic searches with no matching results — in both cases tell the user it is not on Timeplex instead. For bookable shops use get_shop_services -> search_availability -> start_booking instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Customer language (optional)",
                "maxLength": 10,
                "type": "string"
              },
              "venue_name": {
                "description": "Name of the shop the customer wants to book",
                "maxLength": 255,
                "type": "string"
              }
            },
            "required": ["venue_name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "link_label": {
                "type": "string"
              },
              "link_markdown": {
                "description": "Markdown link for the reply (see tool description)",
                "type": "string"
              },
              "next_step_url": {
                "description": "Concierge chat where the customer completes the request",
                "type": "string"
              },
              "recorded": {
                "description": "true — the demand was logged",
                "type": "boolean"
              }
            },
            "required": ["next_step_url", "recorded"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1ce199b501407a0c07dc5d0aaf0b40322f05c017762fdfc8b2bf3e98b03e7806"
        },
        {
          "name": "search_availability",
          "title": "Search Availability",
          "description": "Check real-time appointment availability for one TimePlex shop (slug from search_shops, items from get_shop_services) on a date, optionally at a time. All times are Korea Standard Time (KST).\nUSE THIS TOOL WHEN: the user asks whether an appointment is available, asks for open slots or possible times, asks for shops that are actually available on a date / at a time / for a party size (\"10월 1일 강남 헤드스파 예약 가능한 곳\", \"any head spa open at 5 PM?\", \"somewhere I can book tomorrow afternoon for two\"), asks for alternatives to an unavailable time, or wants to book (check the slot before start_booking).\nDO NOT USE IT FOR: find / recommend / compare requests. A date or time alone is not availability intent — \"recommend a head spa in Gangnam for October 1\" stays a search_shops request unless the user asks whether a slot is open.\nREAL-TIME RULE: only this tool establishes that a slot is open. Never infer availability from bookable=true, business hours, the shop being open, a service or staff member existing, web search, maps, social media, third-party sites or earlier answers. Describe a time as available only when this tool returns it.\nPARTY SIZE: check the whole party as the items schema describes (qty for capacity shops). Never stitch separate single-person slots into a group booking unless the result shows it.\nRESULTS: if the requested time is unavailable, say so and offer the returned alternatives. If blocked is 'inquiry_only', the service cannot be booked online — tell the customer to contact the shop. If nothing is open, say no confirmed slot was found; you may check other suitable TimePlex shops. Checking availability does not reserve anything.\nNEXT: with the open times you may add start_booking links so the customer can book the slot they pick — never call the slot reserved or booked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "YYYY-MM-DD (Asia/Seoul)",
                "type": "string"
              },
              "items": {
                "description": "Booking items. Follow the booking_model returned by get_shop_services: use resource_id for designated-staff shops and qty for capacity-based shops. designated (hair salons, plus some beauty shops such as body scrub): [{service_id, resource_id}]. capacity (most massage, spa, etc.): [{service_id, qty}] where qty is the number of guests (party size).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "qty": {
                      "type": "integer"
                    },
                    "resource_id": {
                      "type": "string"
                    },
                    "service_id": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "slug": {
                "description": "Shop slug returned by search_shops.",
                "type": "string"
              },
              "time": {
                "description": "Optional requested appointment time (HH:MM). If provided, check whether that exact time is available and return nearby available alternatives if unavailable.",
                "type": "string"
              }
            },
            "required": ["date", "items", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alternatives": {
                "description": "Nearby bookable times when the requested time is not available",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "blocked": {
                "description": "Present when online booking is blocked (e.g. 'inquiry_only')",
                "type": "string"
              },
              "date": {
                "type": "string"
              },
              "mode": {
                "description": "Slot mode the shop operates in",
                "type": "string"
              },
              "next_step": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "requested_time": {
                "description": "Verdict for the exact time asked, when time was given.",
                "properties": {
                  "available": {
                    "type": "boolean"
                  },
                  "time": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "slots": {
                "items": {
                  "properties": {
                    "available": {
                      "type": "boolean"
                    },
                    "time": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "timezone": {
                "type": "string"
              }
            },
            "required": ["date", "slots"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
