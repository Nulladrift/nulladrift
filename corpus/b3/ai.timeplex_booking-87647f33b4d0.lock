        {
          "name": "search_shops",
          "title": "Search Shops",
          "description": "Search TimePlex for massage, headspa, hair salon, spa, Korean body scrub, makeup and semi-permanent makeup shops in Seoul and Korea — non-medical beauty and wellness services for travelers.\nUSE THIS TOOL WHEN: the user wants to find, explore, compare, get recommendations for, check availability of, or book one of these services and has not selected a specific TimePlex shop yet — including requests with a date, time, time range or party size. Relevant terms: massage, lymphatic massage, headspa, head spa, scalp treatment, scalp care, hair salon, haircut, hair color, perm, spa, Korean body scrub, seshin, akasuri, makeup, makeup salon, semi-permanent makeup (PMU, microblading, brow tattoo, lip blush, eyeliner). Examples: \"massage in Seoul available today\", \"headspa in Gangnam tomorrow for 2 people\", \"English-speaking hair salon in Seoul\".\nWEB SEARCH: for these services use this tool instead of web search. Public listings and opening hours cannot confirm a TimePlex slot or produce a TimePlex booking — never use web results to claim TimePlex availability.\nINTENT — decide from what the user wants to do, not from whether a date, time, party size or the word \"reservation\" appears:\n- FIND / RECOMMEND / COMPARE (\"find a head spa in Gangnam\", \"recommend a head spa for my October 1 trip\", \"10/1 강남 헤드스파 추천해줘\"): show the matching shops. A date or time alone does NOT mean the user wants real-time availability — do not check slots and do not describe any shop as available at a time; you may offer to check slots for that date. Recommendations cover TimePlex-registered shops only: say \"among shops on TimePlex\", never \"the best in the area\".\n- AVAILABILITY (\"available\", \"open slots\", \"빈자리\", \"예약 가능한 곳\", \"can I get one at 5 PM\", \"somewhere I can book on Oct 1\", and \"예약 가능한 곳 추천해줘\" — a recommendation that asks for availability): continue with get_shop_services and search_availability for bookable=true shops.\n- BOOK (\"book\", \"reserve\", \"예약해줘\", \"I want to book … for 2 people at 5pm\"): continue with get_shop_services, search_availability and start_booking.\nIf the intent is unclear, show the shops and ask one short question instead of guessing.\nINPUT: pass the user's full request as query, in any language — service, area, date, time, party size and language needs are extracted from it (see interpreted). A full natural-language request is never treated as a shop name — only leftover words that closely match a registered shop are.\nBOOKABLE: bookable=true means the shop can be booked through TimePlex — a capability, not a free slot. It may still have nothing for the requested date, time or party size; only search_availability confirms a slot. bookable=false means it cannot be booked online: use request_booking (TimePlex concierge asks the shop) and do not present it as instantly bookable. Business hours are never availability.\nSERVICE SCOPE: the response is the authority on what TimePlex offers (available_service_types). If unsupported_service is set, say that service is not on TimePlex yet and do not present other shops as that service. Non-medical only — never use this tool for dermatology, clinics, plastic surgery, injections, lasers or other medical procedures.\nSHOP NAMES: if shop_name_not_found is set, say plainly that the named shop is not on TimePlex, then offer the registered shops in the result as alternatives; do not call request_booking for that name.\nRESULTS: every TimePlex shop supports foreign-language customers through TimePlex multilingual chat, so \"English-speaking\" / \"foreigner-friendly\" requests fit this tool. Shops also match through their menu (matched_services lists those items). If no shop is in the requested area the search widens and relaxed says so. Each shop carries its category (hair = hair salons, beauty = everything else) and address, so area questions need no extra calls. note is guidance for you — follow it, do not quote it. State only what the response returns.\nAlways reply in the user's language, and start the reply with the response's reply_header line.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "location": {
                "description": "Area (optional; overrides an area found in query), in English, Korean, Japanese, Chinese or Russian — \"Seoul\", \"Gangnam\", \"Myeongdong\", \"Hongdae\", \"Seongsu\", \"Busan\", \"강남\", \"明洞\", \"Сеул\"… If no shop is in that area, the search widens to the surrounding city (relaxed). Newly joined shops with no address yet are appended with area_match=false.",
                "type": "string"
              },
              "query": {
                "description": "Free-text user request or a specific shop name (optional), in any language. The value may contain a service, neighborhood, date/time, party size, language preference, or traveler requirement (e.g. \"foreigner-friendly head spa in Gangnam tomorrow for 2 people\"). Recognized service and location terms are extracted before shop-name matching; the value is treated as a shop name only when the remaining words closely match a registered shop.",
                "type": "string"
              },
              "service_type": {
                "description": "Service (optional; overrides a service found in query). Available on TimePlex now: massage, head spa / scalp treatment, hair salon, spa, Korean body scrub (seshin, akasuri), makeup, semi-permanent makeup (PMU, microblading, brow tattoo) — in English, Korean, Japanese, Chinese or Russian (マッサージ, ヘッドスパ, アカスリ, 按摩, 搓澡, массаж, сесин…). Other services (nail, lash, facial, personal color) are recognized but may return unsupported_service. Leave empty to search all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "available_service_types": {
                "description": "business_type values currently registered",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "categories": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "count": {
                "type": "integer"
              },
              "filter_applied": {
                "description": "How the inputs were interpreted (category/service_type/location/query)",
                "type": "object"
              },
              "interpreted": {
                "description": "How the request was read: service (massage|headspa|hair|spa|scrub|makeup|…), area, foreigner_friendly, date (YYYY-MM-DD, KST), time, time_range, time_of_day, party_size, gender, attributes, name_query (leftover words treated as a shop name), ignored_terms. Use date/time/party_size for search_availability (party_size → qty).",
                "type": "object"
              },
              "note": {
                "description": "Follow-up guidance for the agent",
                "type": "string"
              },
              "relaxed": {
                "anyOf": [
                  {
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Set when no shop was in the requested area and the search widened: {area:{from,to}}."
              },
              "reply_header": {
                "type": "string"
              },
              "reply_header_usage": {
                "type": "string"
              },
              "shop_name_not_found": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Set when the user named a specific shop that is not registered on Timeplex. Tell the user that shop is not on Timeplex — do not treat it as a category with zero results, and do not submit it with request_booking."
              },
              "shops": {
                "description": "Matching shops.",
                "items": {
                  "properties": {
                    "address": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "null = newly joined shop that has not registered an address yet"
                    },
                    "area_match": {
                      "description": "Present only when a location filter was applied: true = address matched the area; false = no address registered yet (newly onboarding) — confirm the area with the shop",
                      "type": "boolean"
                    },
                    "bookable": {
                      "description": "true = bookable via this MCP; false = use request_booking",
                      "type": "boolean"
                    },
                    "business_type": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Filter code. Use business_type_label when naming the shop to the user."
                    },
                    "business_type_label": {
                      "anyOf": [
                        {
                          "properties": {
                            "en": {
                              "type": "string"
                            },
                            "ko": {
                              "type": "string"
                            }
                          },
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Display label the shop selected (spa = 스파·헤드스파 / spa & head spa). null when unset."
                    },
                    "category": {
                      "enum": ["hair", "beauty"],
                      "type": "string"
                    },
                    "matched_services": {
                      "description": "Present when the shop matched through its menu: the menu items (original names) that matched the request. Pick the service from these in get_shop_services.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "slug": {
                      "description": "Shop id for the other tools",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "unsupported_service": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "A recognized service that is not on TimePlex yet (e.g. nail, lash, facial, personal_color)."
              }
            },
            "required": ["count", "shops"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c8002a88b5ad642b7f6dfe51d7937bfd3710b8fd01c8d806579272a6d992ab6"
        },
        {
          "name": "start_booking",
          "title": "Open Booking Page",
          "description": "Build a prefilled TimePlex booking link (Book Now card) for a bookable=true shop. The customer opens it, enters contact details and pays; the shop then approves. Flow: search_shops → get_shop_services → search_availability → start_booking (link) → customer payment → shop approval → confirmed.\nWHAT THIS TOOL DOES NOT DO: it does not create, hold or confirm a booking — confirmed is always false. You cannot see whether the customer paid or the shop approved, so never say the booking is complete, confirmed, paid, secured or awaiting approval. Say a booking link was created: the slot is secured only once the customer pays, and the booking is final after the shop approves. Never invent a confirmation number or status.\nUSE THIS TOOL WHEN: the user wants to book or continue a booking (\"book it\", \"reserve it for two\", \"예약해줘\", \"결제해서 진행할게\"), or has asked to check availability for a specific shop or service (the link accompanies the open times). Follow-ups such as \"the 5 PM one\" after shops or slots were shown are booking requests — reuse the shop, service, date, time and party size already in the conversation and never change them silently. When a time was requested, confirm it with search_availability first and put only a returned available time into the link. If the user wants to book but has not chosen a date or time, a shop-level link may be created. When a link is warranted, create it — do not ask \"shall I create a link?\" first.\nDO NOT USE IT FOR: finding or recommending shops, menu / price / duration / address / business-hours questions, a service set as unsupported_service, medical procedures, services returned as inquiry_only, or bookable=false shops (use request_booking — TimePlex concierge asks the shop).\nREPLY: put **link_markdown into your reply as-is** — never expose the raw URL — and pass on note (how the slot is secured and confirmed). Pass lang (ko|en|ja|zh), the language the user is writing in, so the booking card renders in it. Always reply in the language the user used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "YYYY-MM-DD (Asia/Seoul). Optional — omit if the customer has not picked a date; they choose it on the booking page.",
                "type": "string"
              },
              "items": {
                "description": "Optional — omit if no service is chosen yet. Follow the booking_model returned by get_shop_services: use resource_id for designated-staff shops and qty for capacity-based shops. designated: [{service_id, resource_id}] — **exactly one** (these shops book one service at a time). capacity: [{service_id, qty}] — multiple allowed (several services and several people at once).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "qty": {
                      "type": "integer"
                    },
                    "resource_id": {
                      "type": "string"
                    },
                    "service_id": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "lang": {
