        {
          "name": "post_numerology_chart",
          "title": "Generate numerology chart - Complete numerology reading API",
          "description": "Generate a complete numerology chart from a full birth name and birth date in one call. It returns the six core numbers (Life Path, Expression, Soul Urge, Personality, Birth Day and Maturity) with their calculations and full interpretations, the four Pinnacles and four Challenges with their ages, Karmic Lessons, karmic debt in all five positions, Hidden Passion, Subconscious Self, Cornerstone, Capstone and First Vowel, the Birth Day profile for the exact day, lucky associations, the Maturity activation status, the Personal Year with the current Personal Month, and a written summary, in the language set by lang. The age behind the Maturity status, the Personal Month and the Personal Year are read on targetDate, the current UTC date when omitted, and currentYear overrides the Personal Year alone. Built for full numerology readings, PDF reports, onboarding profiles and AI agents.",
          "inputSchema": {
            "examples": [
              {
                "day": 15,
                "fullName": "John William Smith",
                "month": 7,
                "year": 1990
              }
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "currentYear": {
                "description": "Calendar year for the Personal Year. When omitted it is the year of targetDate, or of the current UTC date when targetDate is omitted too. It moves the Personal Year only: the nested personalMonth and maturityStatus.currentAge read targetDate.",
                "example": 2025,
                "maximum": 2100,
                "minimum": 100,
                "type": "integer"
              },
              "day": {
                "description": "Birth day (1-31)",
                "example": 15,
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "fullName": {
                "description": "Full birth name as it appears on the birth certificate. Used for every letter-based number in the chart: Expression, Soul Urge, Personality, Karmic Lessons, Hidden Passion, Subconscious Self and the special letters. A name in any script is converted to Latin letters before it is counted, Cyrillic and Greek as the passport spelling and accents folded to the base letter, and the calculation lists the letters counted. For a script that does not write its vowels, send the Latin spelling the person uses.",
                "example": "John William Smith",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
                "enum": ["en", "tr", "de", "es", "hi", "pt", "fr", "ru", "zh-Hans", "zh-Hant"],
                "example": "en",
                "type": "string"
              },
              "month": {
                "description": "Birth month (1-12)",
                "example": 7,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "targetDate": {
                "description": "Date to read the chart on, in YYYY-MM-DD format, in the years 100 to 2100, on or after the birth date. Send the local date of the user for an exact answer: it sets maturityStatus.currentAge and isActive, the Personal Month, and the Personal Year when currentYear is absent. Defaults to today (UTC).",
                "example": "2026-10-28",
                "format": "date",
                "type": "string"
              },
              "year": {
                "description": "Birth year between 100 and 2100. Supports historical figures like Einstein (1879) and Shakespeare (1564).",
                "example": 1990,
                "maximum": 2100,
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["day", "fullName", "month", "year"],
            "type": "object"
          },
