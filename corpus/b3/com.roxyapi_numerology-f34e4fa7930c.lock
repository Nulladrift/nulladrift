      "tools": [
        {
          "name": "get_numerology_compound_number",
          "title": "Get compound number meaning - Chaldean compound numbers 10 to 52 API",
          "description": "Get the classical Chaldean meaning of a compound number, also called a fadic number, from 10 to 52 as Cheiro defines it. A compound number is the unreduced two-digit total behind a name or date, read beside its single-digit root. The response returns the root, the nature (fortunate, unfortunate or mixed), the full interpretation in the language set by lang, and the symbolic name where Cheiro gives one, such as The Wheel of Fortune for 10 or The Crown of the Magi for 21; a number from 33 up that repeats a lower one carries a sameAs pointer to it. Built for Chaldean numerology references, name analysis tools and AI agents.",
          "inputSchema": {
            "examples": [
              {
                "number": "23"
              }
            ],
            "properties": {
              "compact": {
                "default": false,
                "description": "Set true for the same data in a compact shape: arrays of same-shaped objects arrive columnar as {\"__cols\":[names],\"__rows\":[[values]]}. Lossless, typically 40 to 52 percent fewer tokens.",
                "type": "boolean"
              },
              "lang": {
                "default": "en",
                "description": "Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.",
                "enum": ["en", "tr", "de", "es", "hi", "pt", "fr", "ru", "zh-Hans", "zh-Hant"],
                "example": "en",
                "type": "string"
              },
              "number": {
                "description": "Compound number from 10 to 52.",
                "example": "23",
                "pattern": "^(1\\d|2\\d|3\\d|4\\d|5[0-2])$",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "meaning": {
                "type": "string"
              },
              "name": {
                "type": ["string", "null"]
              },
              "nature": {
                "enum": ["fortunate", "unfortunate", "mixed"],
                "type": "string"
              },
              "number": {
                "type": "number"
              },
              "root": {
                "type": "number"
              },
              "sameAs": {
                "type": "number"
              }
            },
            "required": ["meaning", "name", "nature", "number", "root"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:200e9bea9abfea20be72689634e889fe21ef8ea68bc246d0159e76c496554eb9"
        },
