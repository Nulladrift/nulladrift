          },
          "digest": "sha256:e51874b23a54406fdffab7cd6161ac4f8cd1496a696562f615df3e9524cfecef"
        },
        {
          "name": "get_tool",
          "title": "Get one AI tool",
          "description": "Full review detail for a single tool by its WireTensors slug (from search_tools results).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The tool's WireTensors slug, e.g. \"chatgpt\" or \"deepseek\"",
