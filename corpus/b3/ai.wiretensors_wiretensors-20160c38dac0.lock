          "digest": "sha256:ccdabe820a843b3ea5740a2234d9cb267476d5119608414669144ce2e11e717c"
        },
        {
          "name": "recommend_tool",
          "title": "Recommend an AI tool",
          "description": "Get a ranked recommendation for a use case — e.g. \"best free coding AI under $20/mo\". Filters by category/budget/free-tier and ranks by WireTensors rating.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
