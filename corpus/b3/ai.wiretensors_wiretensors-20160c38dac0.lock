        },
        {
          "name": "search_tools",
          "title": "Search AI tools",
          "description": "Search/filter the WireTensors AI tool catalogue. Returns a ranked (by rating) list of tools matching the given filters, with pricing, rating and links. Use get_tool for full detail on one tool.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "e.g. coding, writing, image, video, productivity, seo",
                "type": "string"
              },
              "free_tier": {
                "description": "true = only tools with a free tier",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results to return (default: all matches)",
                "type": "number"
              },
              "max_price": {
                "description": "Maximum monthly USD price for the cheapest paid tier",
                "type": "number"
              },
              "min_rating": {
                "description": "Minimum WireTensors rating, 1-5",
                "type": "number"
              },
              "origin_country": {
                "description": "e.g. \"China\" — filter by the tool developer's country of origin",
                "type": "string"
              },
              "q": {
                "description": "Free-text search across name, tagline, summary, best_for",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
