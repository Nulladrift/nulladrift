          "name": "what_changed",
          "title": "Recent price changes",
          "description": "Recorded price changes since a date, newest first, optionally for one tool. Price records only; initial_record marks a plan first recorded on that date.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
