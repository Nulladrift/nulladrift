        {
          "name": "get_player_props",
          "description": "Return the live player-props board for NFL, MLB, WNBA, NBA or NHL (MCP Connect or Pro).\n\n    Requires ``Authorization: Bearer obmcp_...`` (MCP Connect — included with\n    website Premium — or MCP Pro). Free and anonymous callers are denied.\n\n    Each prop row carries: player, team, game, kickoff (America/New_York),\n    market, line, model projection, model over/under probability, the stored\n    best price and book (plus other books where the odds file stores them),\n    edge_pct, the model's pick side, confidence tier and units where the lane\n    produces them, whether it is on the lane's premium board, and\n    ``lane_status`` — the factual verdict of that lane's promotion gate\n    (e.g. NFL ``research_board``, WNBA ``promoted_live``, NHL\n    ``stays_dark``, MLB per market, NBA ``per_cell``: an NBA edge is shown\n    only for a market x side cell the lane's gate has published).\n    lane_status is information, not a filter: every row is returned.\n\n    NBA and NHL also carry ``over_prob``/``under_prob`` at the row's line and\n    ``model_prob_basis`` (how that probability was produced; ``\"none\"`` when\n    the lane has no probability for the line, and then the probability fields\n    are null: never interpolated or approximated).\n\n    ``lines=\"all\"`` (NBA and NHL only) returns every line a US-executable book\n    quotes for each player x market (main line plus the alternate rungs,\n    e.g. NBA points 14.5/19.5/24.5/29.5, NHL shots 2.5/3.5), one row per\n    line: ``is_main_line`` marks the board's main line, the best\n    US-executable over and under price with its book, the model's over/under\n    probability at that line where the lane stores one, and\n    ``over_edge_pct``/``under_edge_pct`` = model probability minus the\n    price's vig-included break-even, in percentage points, only where both\n    exist. NBA alternates are Over-only at the books. At most 30 lines per\n    player x market; rows sorted by kickoff, game, player, market, line.\n\n    Prices are exactly as stored by the odds pipeline; a missing price is\n    ``null`` (never a placeholder). MLB rows come from the daily MLB props\n    export: the MLB ledger stores no pick side for player props, so\n    ``pick_side`` is null and ``edge_pct`` is the stored OVER-side edge\n    (``edge_side: \"over\"``).\n\n    Args:\n        league: ``nfl``, ``mlb``, ``wnba``, ``nba`` or ``nhl`` (required).\n        date: ``YYYY-MM-DD`` slate date in the live window — yesterday through\n            7 days ahead (America/New_York); defaults to today. Earlier dates\n            are resolved history: use ``get_player_prop_history`` (MCP Pro).\n        game: Optional matchup/team filter (e.g. ``\"NE@JAX\"``, ``\"JAX\"``).\n        player: Optional player-name filter (substring, accent-insensitive).\n        market: Optional market filter (e.g. ``rush_yds``, ``points``,\n            ``pitcher_ks``).\n        limit: Max rows (1-200, default 100), sorted by edge_pct descending\n            (``lines=\"all\"``: by kickoff, game, player, market, line).\n        lines: ``\"main\"`` (default: each lane's board) or ``\"all\"`` (NBA/NHL:\n            one row per quoted line).\n    ",
