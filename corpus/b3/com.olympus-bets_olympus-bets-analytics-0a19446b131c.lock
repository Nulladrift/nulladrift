        {
          "name": "get_oracle_insights",
          "description": "Return the Oracle board plus whether each whale fill is still buyable.\n\n    Same plays as ``get_oracle_board`` — the price band, the missing-sport\n    drop, sim confirmation, and the profitability-zone and tier gates. This\n    tool adds the detection-time order-book mid (``executable_price``) and\n    whether that mid is still inside the validated band\n    (``executable_in_band``). The board's ``entry_price`` is the whale's\n    fill. A fill inside the band with a live mid outside it is not an entry\n    a member can take. ``executable_in_band`` is null when no live mid was\n    captured; it is never guessed.\n\n    Flat 0.5 unit sizing. Ordered by event start time only — not a quality\n    ranking. ``compound_confidence`` is not included. An empty result is a\n    normal outcome, not an error.\n\n    Requires an active Premium customer (MCP Connect, bundled with website\n    Premium) or an active MCP Pro bearer token. Free keys, anonymous\n    callers, and expired entitlements are rejected.\n\n    Args:\n        sport: Optional sport filter (e.g. \"NBA\", \"SOCCER\"). Omit for all sports.\n        limit: Max plays to return (1-60).\n    ",
