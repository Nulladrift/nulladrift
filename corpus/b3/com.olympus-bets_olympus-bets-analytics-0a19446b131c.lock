        {
          "name": "get_projection_history",
          "description": "Query the full available normalized projection archive for MCP Pro.\n\n    This is the broader research dataset, not an exclusive copy of the public\n    resolved-pick ledger. It includes model-only observations where a league's\n    point-in-time archive supports full-universe reconstruction, plus\n    outcomes and closing-market context when available. Coverage varies by\n    league and era, and only resolved historical observations are returned.\n\n    For per-player NFL/MLB/WNBA prop history (line, stored price, pick side,\n    actual stat, outcome) call ``get_player_prop_history`` (MCP Pro).\n    ",
