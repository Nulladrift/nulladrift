          "description": "Return resolved player props for NFL, MLB or WNBA (MCP Pro only).\n\n    Rows carry the projection, line, stored price, side, actual stat and\n    outcome (plus stored units/units_won where the lane logs them). The\n    summary counts overs and unders separately. It gives row counts only: no\n    units, ROI or hit-rate totals, because the site publishes no track record\n    for these props ledgers to match.\n\n    NFL and WNBA read each lane's props ledger. MLB reads the per-date history\n    shards written by the daily MLB props export; MLB rows have no stored pick\n    side, so their summary counts where the actual stat landed vs the line.\n\n    Args:\n        league: ``nfl``, ``mlb`` or ``wnba`` (required).\n        date_from / date_to: ``YYYY-MM-DD`` inclusive range, at most 31 days\n            (at most 7 days for MLB without a player or market filter).\n            Defaults to the 7 days ending yesterday (America/New_York).\n        player: Optional player-name filter (substring, accent-insensitive).\n        market: Optional market filter (substring, e.g. ``pass_yds``).\n        recommended_only: Keep only rows the lane recommended. Every NFL\n            ledger row is a model pick; the WNBA ledger also holds both sides\n            of every graded candidate (shadow rows), so its unfiltered over and\n            under counts mirror each other; MLB rows carry no pick flag, so\n            this returns no MLB rows.\n        limit: Page size (1-200, default 100).\n        cursor: Row offset from a previous response's ``next_cursor``.\n        include_alt_lines: NFL only. The NFL ledger logs one row per priced\n            alternate line; by default each player-market-side play appears\n            once (the line the board would publish) and the summary counts\n            plays. ``true`` returns and counts every alt-line row.\n    ",
