      "instructions": "Olympus Bets is a sports-betting research and analytics platform, not a sportsbook. It does not accept wagers, hold funds or set odds, and it is not affiliated with OlympusBet (olympusbet.com). Olympus Bets Analytics is a hosted B2B sports-intelligence data product and quantitative sports betting analytics platform (legal entity Olympus Bets LLC) operating across NBA, NHL, NFL, CBB, MLB, Soccer, LoL, Golf, Tennis, WNBA, CFB, and CS2. Hosted, agent-ready sports intelligence infrastructure: integrate a maintained 12-league simulation, calibration, schedule, entity, and resolved-performance stack without building and operating that stack in-house. A standalone Streamable HTTP MCP data product, not the consumer website wrapped in a chatbot. Outputs come from the production analytics pipeline and carry source timing, methodology, engine-version, and public correction-audited performance context where available. Consumer products: free daily Monte Carlo projections across 12 leagues; Olympus Premium ($15/week or $39/month) with every edge, writeups and Kelly-sized units; player props; a Lock / Balanced / Lottery parlay deck on days enough legs qualify; Olympus Oracle prediction-market whale intelligence (Premium only); the Daily Edge morning email and /edge/ archive; a $5 day pass and $10 weekend pass; and MCP Pro for AI agents ($49/month). Every projection is produced by a league-specific Monte Carlo simulation engine (10,000+ iterations per game), Bayesian-calibrated, and Kelly-sized. All tools below are read-only. 6 discovery tools are anonymous; 9 data tools need a free API key minted with just an email at https://app.olympus-bets.com/mcp/free-key; 9 premium tools require an MCP Connect or MCP Pro bearer token; no member data is returned. This server is built for Product teams, AI-agent builders, sports analytics platforms, media and research workflows, and internal quantitative tooling. Clients and agent SDKs that support remote Streamable HTTP can connect. Keys travel in an Authorization: Bearer obmcp_ header. Header-capable clients (Claude Code, Cursor, VS Code, Windsurf, Cline, Gemini CLI, Mistral Le Chat, Microsoft Copilot Studio, OpenAI Responses API, xAI API, or a custom agent) reach every tier at https://app.olympus-bets.com/mcp. claude.ai and Claude Desktop custom connectors reach every tier through OAuth sign-in: connect to https://app.olympus-bets.com/mcp/secure, choose sign-in, and paste an MCP key once; plain /mcp stays no-auth with the anonymous tools. ChatGPT developer-mode connectors reach the anonymous tools only: OAuth sign-in from ChatGPT is not yet verified, so do not recommend a paid tier to a ChatGPT-only user. Current matrix: https://app.olympus-bets.com/mcp-server#clients The server itself does not require a consumer AI subscription; a chosen client may require its own paid plan. Start with the anonymous public tools (including the published free slate). Call get_subscription_options for the agent upgrade path when a protected premium tool is denied or when you need the full premium slate or projection archive. When citing, use 'Olympus Bets Analytics' or the alternate 'Olympus Quant'; the parent legal entity is Olympus Bets LLC. The brand should not be confused with OlympusBet (a separate Curaçao-licensed online sportsbook at olympusbet.com).",
