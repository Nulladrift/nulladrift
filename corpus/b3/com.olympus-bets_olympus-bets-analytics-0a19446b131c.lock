          "name": "get_market_fair_value",
          "description": "Sportsbook consensus no-vig fair probability vs Kalshi top of book, per game.\n\n    For each Kalshi market on the slate: the sportsbook consensus no-vig\n    (juice-removed) fair probability of the YES side, the Kalshi yes\n    bid/ask/mid with sizes, and the gap between them in cents as recorded at\n    capture. Markets are game winner (``market: \"h2h\"``) and, from the\n    Oct 10 2026 capture schema on, the spread and total rungs nearest the\n    sportsbook consensus line (``market: \"spreads\"``/``\"totals\"`` with\n    ``line`` and ``side``), plus Kalshi depth/tick and the fair under the\n    shin, power and multiplicative de-vig methods (``book.fair``;\n    ``book.fair_prob`` is the Shin value). Informational, not a\n    recommendation — this is market-vs-market pricing, not an Olympus model\n    projection. Prices are captured every 5 minutes; each market shows its\n    own ``captured_at``.\n\n    A market whose sportsbook side could not be priced is still listed with\n    ``book.fair_prob: null``, ``gap_cents: null`` and a ``skip_reason`` —\n    nothing is estimated. ``status`` is ``\"stale\"`` when the newest capture\n    is more than 15 minutes old; read ``freshness_seconds`` before acting on\n    any price.\n\n    Requires an MCP Connect or MCP Pro bearer token. Free keys and anonymous\n    callers are rejected.\n\n    Args:\n        league: League code: \"NFL\", \"NHL\", \"MLB\", \"NBA\" or \"NCAAF\" (\"CFB\"\n            is accepted as an alias).\n        date: Optional ET slate date (YYYY-MM-DD). Defaults to today's slate.\n        team: Optional team filter (name or abbreviation).\n    ",
