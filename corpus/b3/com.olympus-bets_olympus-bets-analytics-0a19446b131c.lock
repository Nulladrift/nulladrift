        {
          "name": "get_track_record",
          "description": "Return resolved sports betting picks from the public Olympus Bets Analytics record.\n\n    Each row is a fully-resolved historical projection with line, odds, model\n    probability, edge, units, outcome, units won/lost, and final scores. The record is timestamped and publicly auditable. When an official-score,\n    grading, or data-quality error requires correction, the canonical row may\n    be regraded under a controlled backup-and-manifest process that records its\n    prior result and supporting evidence; the service therefore does not claim\n    the underlying file is immutable.\n\n    Args:\n        league: Filter by league (NBA, NHL, MLB, CBB, NFL, SOCCER, LOL, GOLF, TENNIS).\n        result: Filter to WIN, LOSS, or PUSH only.\n        tier: Filter to public free rows, masked premium rows, or masked\n            Premium Leans rows (``lean`` — flat 0.5u model disagreements with\n            the price, graded in their own column, never blended into\n            ``premium``; masked identically to premium rows since leans are\n            paid content — matchup/result/units only, no line/odds/edge).\n        days_back: Only include projections with publication date within this many\n            days of today (EST). Default 30.\n        limit: Maximum rows to return (capped at 500).\n        cursor: Zero-based result offset for stable pagination.\n\n    Returns:\n        ``{filter, count, summary: {wins, losses, pushes, voids, other,\n        cross_tier_duplicates, units_won}, excluded: {...}, picks: [...]}``\n        ``total_matching`` always equals ``summary.wins + losses + pushes +\n        voids + other + cross_tier_duplicates`` -- every row counted in\n        ``total_matching`` lands in exactly one disclosed bucket. A wager\n        published on two tiers counts once in a mixed-tier summary; its\n        second tier's row is in ``cross_tier_duplicates``. ``excluded`` is a separate, all-time\n        (not filtered by this call's args) count of what never reaches this\n        population at all. Picks are newest-first.\n    ",
          "inputSchema": {
            "properties": {
              "cursor": {
                "default": 0,
                "title": "Cursor",
                "type": "integer"
              },
              "days_back": {
                "default": 30,
                "title": "Days Back",
                "type": "integer"
              },
              "league": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "League"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
