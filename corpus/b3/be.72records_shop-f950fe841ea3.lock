{
  "lockfileVersion": 2,
  "subjects": {
    "be.72records/shop": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.72records.be/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "be.72records/shop",
        "title": "72 Records",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "72 Records is a second-hand record shop in Brussels. Use search_catalog and\nget_product to find records; prices are in EUR, conditions use the Goldmine\nscale. To buy, call cart_link and give the human the URL: it opens their\ncart on 72records.be, where they check out. Stock is one copy for most\nrecords and is not held until checkout starts.\n",
      "tools": [
        {
          "name": "cart_link",
          "title": "Cart link",
          "description": "A URL that fills the human's cart on 72records.be with these records. Give it to the human; they check out there. Sold records are skipped when they open it.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Your name, e.g. claude or chatgpt (for our stats)",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "enum": ["de", "en", "fr", "nl"],
                "type": "string"
              },
              "slugs": {
                "items": {
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5bbe96ea62a8670fb855b4c4ef8e6501c568764be993b93259a2faf9e435833e"
        },
        {
          "name": "get_product",
          "title": "Record details",
          "description": "Full details of one record by slug: pressing, sleeve and media condition, tracks, price, stock, shipping per country.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:07c0b3c019dcdc738c01aed9279bf941f8566a5459b64286a11c44243821f637"
        },
        {
          "name": "search_catalog",
          "title": "Search records",
          "description": "Search the published catalog by artist, title, label, catalog number or barcode. In-stock records only unless in_stock_only is false.",
          "inputSchema": {
            "properties": {
              "condition": {
                "enum": ["Mint", "Near Mint", "Very Good Plus", "Very Good", "Good Plus", "Good", "Fair", "Poor"],
                "type": "string"
              },
              "format": {
                "enum": ["LP", "EP", "Single", "CD", "Cassette", "Box Set", "7\"", "10\"", "12\"", "DVD", "VHS", "Book"],
                "type": "string"
              },
              "genre": {
                "description": "Discogs genre, e.g. Jazz, Electronic",
                "type": "string"
              },
              "in_stock_only": {
                "default": true,
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "EUR",
                "type": "number"
              },
              "query": {
                "description": "Free text: artist, title, label, catalog number",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a2a7676c0ba02a602b07b43f4a382cd63cd68544621222f6d05df63fb178ad7f"
        },
        {
          "name": "shipping_quote",
          "title": "Shipping cost",
          "description": "What shipping an order of a given subtotal costs to a country. Free from the free-shipping threshold.",
          "inputSchema": {
            "properties": {
              "country": {
                "enum": ["BE", "NL", "LU", "DE", "FR", "GB"],
                "type": "string"
              },
              "subtotal": {
                "description": "EUR, records only",
                "type": "number"
              }
            },
            "required": ["country", "subtotal"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9e27b3dd1c776f8062f22b20f0fe7dad5268c1109c24c069d23adb8264165b62"
        }
      ],
      "digest": "sha256:0c13566f17e290f1bd49e12be67719ac23610990db9c362d0bfdf6589fabe48a"
    }
  }
}
