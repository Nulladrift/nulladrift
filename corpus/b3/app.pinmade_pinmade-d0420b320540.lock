{
  "lockfileVersion": 2,
  "subjects": {
    "app.pinmade/pinmade": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.pinmade.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pinmade",
        "title": "Pinmade: local makers",
        "version": "1.0.0",
        "websiteUrl": "https://www.pinmade.app/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Pinmade is a worldwide, hand-checked map of local makers (shops that make their own things, with a place you can walk into). Use search_shops to find them by words, category, place or distance; link people to each shop's Pinmade page, which has directions and up-to-date hours.",
      "tools": [
        {
          "name": "get_shop",
          "title": "Get one shop",
          "description": "Full details of one Pinmade shop by its slug (the last part of its page address).",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "e.g. 'kakimori'",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3cbc40aa4d5459e72f6b18266985ec296cc9f9577d54cbc8bd5d4a1d02828cd3"
        },
        {
          "name": "list_places",
          "title": "List places with shops",
          "description": "Countries, regions, cities and neighbourhoods that have shops on Pinmade, with how many.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Two-letter country code, e.g. 'JP'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1990a95d4c59c743767462212d59ccfa6e695f17d38437aa965a07739bdd6d55"
        },
        {
          "name": "search_shops",
          "title": "Search local makers",
          "description": "Find hand-checked local makers on Pinmade: shops that design and make their own things (clothing, leather, ceramics, crafts…) with a place you can walk into. Filter by words, category, place, distance and open now. Returns each shop's page link, address, opening hours and what they make.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "Place path, e.g. 'jp/tokyo/taito' or 'jp/tokyo/taito/kuramae'",
                "type": "string"
              },
              "category": {
                "description": "Category, e.g. 'Leather goods', 'Ceramics', 'Clothing'",
                "type": "string"
              },
              "lat": {
                "description": "Latitude to search near",
                "type": "number"
              },
              "limit": {
                "description": "Maximum results (default 10, max 50)",
                "type": "integer"
              },
              "lng": {
                "description": "Longitude to search near",
                "type": "number"
              },
              "open_now": {
                "description": "Only shops open right now (their local time)",
                "type": "boolean"
              },
              "query": {
                "description": "Words, e.g. 'leather wallet', 'indigo', 'combs'",
                "type": "string"
              },
              "radius_km": {
                "description": "Distance from lat/lng in km (default 5, max 50)",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f54cbed999336376353023937992a2b16ee0fe71beaa94a8f00181c4db61efbf"
        }
      ],
      "digest": "sha256:bc9a4f3e7384febd264eff3dd58966c27139274109d6a5b377cb3f27ae244a80"
    }
  }
}
