          },
          "digest": "sha256:5d03452578a54362a25f77fb73350756d0c2afd37092b622a5564d82d314f04e"
        },
        {
          "name": "sample_reading",
          "title": "Latest settled market regime (free)",
          "description": "What was the US market regime at the last close? Returns the newest settled Regime Card reading, the same one regimecard.com shows: a score from 0 to 100, one of five regimes, the eight cross-asset category labels, and the paid routes with their prices. Useful as a free first look at the response shape and the paid routes. Free. One reading per US trading day, settled at 4:30 PM ET.",
