        },
        {
          "name": "stress_gate",
          "description": "Is there market stress right now in credit, volatility or rates? Returns the Regime Card stress gate in one call: Calm, Elevated or Stressed, how many of its three components are confirmed (N of 3), and each component (Credit, Volatility, Rates) as Clear or Confirmed. States only, never the levels behind them. Useful when an agent needs a market stress or market risk check on credit, volatility and rates before it acts. $0.01 per call in USDC on Base (x402). Recomputed hourly during the US session. \"stale\" is true when a scheduled update is missing.",
