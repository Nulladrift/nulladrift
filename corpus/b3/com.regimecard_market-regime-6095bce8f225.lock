          "name": "crypto_regime",
          "title": "Market regime for crypto: how BTC and altcoins did in markets like today's",
          "description": "Is crypto risk-on or risk-off, and what does bitcoin risk look like in markets like today's? Returns the current crypto market regime and each covered coin's typical return and how often it rose over 1, 2 and 3 months when the period started in this regime, as historical odds. $0.01 per call in USDC on Base, Polygon or Solana (x402). Regime updates after each US close, coins once a day. Useful when an agent needs the market regime for crypto across BTC and altcoins. Covers altcoin risk as well as bitcoin.",
