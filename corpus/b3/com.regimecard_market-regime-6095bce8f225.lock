        "name": "com.regimecard/market-regime",
        "title": "Regime Card",
        "version": "1.0.0",
        "websiteUrl": "https://regimecard.com/agents"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Regime Card describes US market conditions: a score from 0 (most risk-off) to 100 (most risk-on), one of five regimes, a stress gate, and how stocks and coins have typically done in the current regime. Start with the free sample. Paid calls cost a few cents in USDC over x402 and return data only after the payment settles. Every response says whether it is live or settled. It describes conditions and is not investment advice.",
      "tools": [
        {
          "name": "brief",
          "description": "What are US market conditions today, in one call? Returns the live market regime reading, the stress gate, and the scorecard row for the current regime: what the S&P 500 did in the 5 and 20 trading days after past readings in this regime (typical return, how often it rose, and a bad outcome, a measure of drawdown risk). Useful when an agent wants one cross-asset macro signal as a risk check before a trade or as a position sizing input. $0.01 per call in USDC on Base (x402). The reading and the gate are recomputed hourly during the US session. The scorecard gains one reading per trading day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Market risk brief: regime, stress gate and what happened next"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.01
          },
          "digest": "sha256:836aad0aab81199fe7ffd9d0efc94144752c977a2e3d04c84ad4a7b8fe611a42"
        },
        {
          "name": "crypto_regime",
          "description": "Is it risk-on or risk-off for BTC and altcoins, and how have coins behaved in markets like today's? Returns the market regime for crypto: the current regime, and every covered coin (BTC, ETH, SOL and other large altcoins) with its typical return and how often it rose over 1, 2 and 3 months when the period started in this regime, sorted highest first. Useful when an agent needs crypto returns by market regime as historical odds across coins. $0.01 per call in USDC on Base (x402). Settled figures. The regime updates after each US close and the coin figures once a day. The same figures as the /crypto pages on regimecard.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Market regime for crypto: how BTC and altcoins did in markets like today's"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.01
          },
          "digest": "sha256:c864fa04cb609841381d5863d33b3834bfacc6d4c7ec6e2fa257519102de3f5f"
        },
        {
          "name": "live_reading",
          "description": "Is the US market risk-on or risk-off right now? Returns the live Regime Card reading: a score from 0 (most risk-off) to 100 (most risk-on) and one of five market regimes, from Risk-Off to Risk-On, built from eight cross-asset signals, beside the last settled close. Useful when an agent needs a market sentiment or market conditions check for today, or a fear and greed alternative that reads credit, volatility, rates, currencies, commodities and sectors. $0.01 per call in USDC on Base (x402). Recomputed hourly during the US session (10:00 AM to 4:00 PM ET) and marked \"live\". Outside the session it returns the settled reading, marked \"settled\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Live market regime: risk-on or risk-off right now"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.01
          },
          "digest": "sha256:fa1267ee2fbe5db8ee96f1463784f702ce31009c876f0c0d54d6cbb53b8a7b34"
        },
        {
          "name": "lookup_symbols",
          "description": "How has this stock or crypto typically done in markets like today's? Returns, for up to 20 stock or crypto symbols, each one's typical return and how often it rose over 1 to 12 months when the period started in the current regime, as historical odds. A symbol outside coverage comes back as not covered, never as an error. Useful when an agent needs stock returns by market regime or crypto returns by market regime for a watchlist or a portfolio. $0.01 per call in USDC on Base (x402). Settled figures, updated after each US close (coins daily). The same figures as the symbol's page on regimecard.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "symbols": {
                "description": "Stock or crypto symbols, for example [\"NVDA\", \"XLK\", \"BTC\"]. At most 20. Upper or lower case. Repeats are answered once.",
                "examples": [
                  ["NVDA", "BTC", "ZZZZ"]
                ],
                "items": {
                  "description": "One stock, ETF or crypto symbol.",
                  "examples": ["NVDA", "XLK", "BTC"],
                  "maxLength": 10,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["symbols"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Stock and crypto returns by market regime"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
