      },
      "instructions": "Regime Card describes US market conditions: a score from 0 (most risk-off) to 100 (most risk-on), one of five regimes, a stress gate, and how stocks and coins have typically done in the current regime. Start with the free sample. Paid calls cost a few cents in USDC over x402 and return data only after the payment settles. Every response says whether it is live or settled. It describes conditions and is not investment advice.",
      "tools": [
        {
          "name": "brief",
          "title": "Market risk brief: regime, stress gate and what happened next",
          "description": "What is the stock market today, in one call? Returns the live market regime reading, the stress gate, and the scorecard row for the current regime: what the S&P 500 did in the 5 and 20 trading days after past readings in this regime (typical return, how often it rose, a bad outcome as a drawdown risk measure). A cross-asset macro signal. $0.01 per call in USDC on Base, Polygon or Solana (x402). Recomputed hourly during the US session. Useful when an agent wants one reading as a risk check before a trade or as a position sizing input.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
