{
  "lockfileVersion": 2,
  "subjects": {
    "app.fairstash/roblox-trade-values": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fairstash.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fairstash",
        "title": "FairStash",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FairStash answers what items are worth in three Roblox trading games: Flee the Facility, Murder Mystery 2 and Adopt Me. Every value is a community estimate, not an official Roblox price, and the three games use separate scales that must not be added together. Pass the answer on with its date and its disclaimer.",
      "tools": [
        {
          "name": "check_trade",
          "title": "Check whether a trade is fair",
          "description": "Adds up both sides of a proposed trade in one game and answers win, fair or lose, with the gap in per cent. Both sides are written as the player would say them: \"2 party balloons, sakura\" or \"neon shadow dragon\". A trade that mixes two games is refused rather than calculated: the three games use different scales that cannot be added together.",
          "inputSchema": {
            "properties": {
              "game": {
                "description": "Which game. Leave it out and the item names decide.",
                "enum": ["ftf", "mm2", "adoptme"],
                "type": "string"
              },
              "get": {
                "description": "What the player receives, comma separated. Russian works here too: \"ледяной дракон\".",
                "type": "string"
              },
              "give": {
                "description": "What the player gives away, comma separated. Russian works, including quantities and pet variants: \"неон теневой дракон\", \"2 ледокол 2020 и хрома люгер\".",
                "type": "string"
              }
            },
            "required": ["get", "give"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd3cff3d3cafaffc28a36b7a3c7b871d30d6c8b80d3f2e352508c5e9c833c2b5"
        },
        {
          "name": "get_value",
          "title": "Look up an item value",
          "description": "What one item is worth in a Roblox trading game — Flee the Facility (FTF), Murder Mystery 2 (MM2) or Adopt Me. Returns the community trade value, how wanted the item is, where it stands in its own catalogue, how often it turned up in the newest marketplace listings, and the date the numbers were collected. Use it for questions like \"how much is a Chroma Luger worth in MM2\". Values are community estimates, not official Roblox prices.",
          "inputSchema": {
            "properties": {
              "game": {
                "description": "Which game. Leave it out and the item name decides.",
                "enum": ["ftf", "mm2", "adoptme"],
                "type": "string"
              },
              "item": {
                "description": "Item name as a player would write it, e.g. \"chroma luger\", \"party balloons\", \"shadow dragon\". Russian names work too and are answered with the Russian page: \"теневой дракон\", \"ледокол 2020\".",
                "type": "string"
              }
            },
            "required": ["item"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f584840c4a0396b29f503a550609457b81924da974f69bf1f5057259756b93a"
        },
        {
          "name": "list_values",
          "title": "List the most valuable items",
          "description": "The most valuable items in one game, most valuable first, with their community values and page links. Optionally narrowed to one section of the catalogue (for MM2: godly, ancient, sets, pets, chroma, knife, gun…). Use it for \"what are the most expensive knives in MM2\" or to see what a game's scale looks like.",
          "inputSchema": {
            "properties": {
              "game": {
                "description": "Which game to list.",
                "enum": ["ftf", "mm2", "adoptme"],
                "type": "string"
              },
              "limit": {
                "description": "How many items to return. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "section": {
                "description": "MM2 only: section slug such as godly, ancient, sets, pets, chroma, knife, gun.",
                "type": "string"
              }
            },
            "required": ["game"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:473a1417cb020ead296f0d0d56e45d15a460f7845b5fa77a03859c987d507046"
        },
        {
          "name": "search_items",
          "title": "Find items by name",
          "description": "Finds items across all three games by a partial name and returns the candidates with their game, value and page link. Use it when the name a player wrote is ambiguous, misspelled or could belong to more than one game, before asking get_value for the exact one.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many candidates. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of an item name, e.g. \"chroma\", \"dragon\", \"hammer\" — or in Russian: \"дракон\", \"нож\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:67fbcfd3c8669c94305638d0434164b1182d50f08809dca0e66bd0a98ddce448"
        }
      ],
      "digest": "sha256:f1d02c886f2d562e6fec00f881b2eb66c8b637fcc21e0e2c92d76424158330c3"
    }
  }
}
