                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "hourly_wage_chf": {
                "description": "Agreed gross hourly wage in CHF, to prefill the contract generator.",
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "hours_per_week": {
                "description": "Average weekly hours, to prefill the contract generator.",
                "exclusiveMinimum": 0,
                "maximum": 70,
                "type": "number"
              },
              "language": {
                "default": "en",
                "description": "Language of the explanatory texts and of the clino.ch links: en, de, fr, it, es or pt. Default en.",
                "enum": ["en", "de", "fr", "it", "es", "pt"],
                "type": "string"
              },
              "lives_in": {
                "default": false,
                "description": "true if the worker lives in the household (board and lodging). Neuchâtel's standard contract only covers live-in staff, and Vaud gives them a longer notice.",
                "type": "boolean"
              },
              "monthly_wage_chf": {
                "description": "Agreed gross monthly wage in CHF instead of an hourly wage (nanny, carer), or the au pair's pocket money.",
                "exclusiveMinimum": 0,
                "maximum": 20000,
                "type": "number"
              },
              "role": {
                "default": "cleaner",
                "description": "What the worker does: cleaner, nanny (childcare), carer (care of an elderly or disabled person), au_pair or other. Sets which contract generator the link opens; au_pair in Geneva adds the au pair contract's own rules.",
                "enum": ["cleaner", "nanny", "carer", "au_pair", "other"],
                "type": "string"
              },
              "start_date": {
                "description": "First working day, YYYY-MM-DD, to prefill the contract and date the end of the probation.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "worker_age": {
                "description": "Age of the worker in years, for the vacation entitlement (more weeks under 20 and, in some cantons, from 50 or 60). Never a birthdate.",
                "maximum": 90,
                "minimum": 13,
                "type": "integer"
              },
              "workplace_postcode": {
                "description": "4-digit Swiss postcode (PLZ/NPA) of the WORKPLACE. City minimum wages (e.g. Stadt Luzern) depend on it.",
                "pattern": "^\\d{4}$",
                "type": "string"
              }
            },
            "required": ["canton"],
            "type": "object"
          },
