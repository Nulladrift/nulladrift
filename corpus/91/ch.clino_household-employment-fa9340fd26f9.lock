              "canton": {
                "description": "Swiss canton: two-letter code (ZH, BE, GE, VD, TI...) or its name in German, French, Italian or English (Zürich, Genève, Ticino, Basel-Stadt). For employer contributions this is the canton where the household lives.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "contract_months": {
                "description": "Agreed length of a fixed-term contract in months. Omit for an open-ended contract. Some cantons only require sickness insurance for longer contracts.",
                "exclusiveMinimum": 0,
                "maximum": 120,
                "type": "integer"
              },
              "hourly_wage_chf": {
                "description": "Agreed hourly wage in CHF, before the vacation supplement (e.g. 30).",
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "hours_per_week": {
                "description": "Average working hours per week with this household (e.g. 4).",
                "exclusiveMinimum": 0,
                "maximum": 70,
                "type": "number"
              },
              "language": {
                "default": "en",
                "description": "Language of the explanatory texts and of the clino.ch links: en, de, fr, it, es or pt. Default en.",
                "enum": ["en", "de", "fr", "it", "es", "pt"],
                "type": "string"
              },
              "role": {
                "default": "cleaner",
                "description": "What the worker does: cleaner (household help), nanny (childcare, babysitter), carer (care of an elderly or disabled person) or other. Sets which contract template and guide the links open.",
                "enum": ["cleaner", "nanny", "carer", "other"],
                "type": "string"
              },
              "skill_level": {
                "description": "Qualification of the worker for the minimum-wage check. Default unskilled, the lowest tier.",
                "enum": ["unskilled", "experienced", "eba", "efz"],
                "type": "string"
              },
              "start_date": {
                "description": "First working day, YYYY-MM-DD. With it the checklist gives real dates: registration deadline, first payslip, annual declaration.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "vacation_weeks": {
                "default": 4,
                "description": "Paid vacation weeks per year: 4 (legal minimum), 5 (under age 20) or 6. Default 4.",
                "maximum": 6,
                "minimum": 4,
                "type": "integer"
