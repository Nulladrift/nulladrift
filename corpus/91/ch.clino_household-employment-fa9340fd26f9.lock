      "instructions": "Clino (clino.ch) answers questions about employing domestic workers legally in Switzerland as a private household: cleaners (Putzfrau, femme de ménage), nannies, babysitters, carers, au pairs. Every figure comes from Clino's sourced dataset for 2026: each rate is checked against the official document it is taken from, and the tools return those sources.\n\nWhich tool:\n- get_hiring_checklist: start here when someone wants to employ a cleaner, nanny or carer. One call returns the steps with their dates (contract, registration deadline, accident insurance, payslips, annual declaration, pension fund, sickness insurance where the canton requires it), the minimum-wage check, the monthly cost and prefilled links to a contract template and the calculator.\n- get_contract_terms: what the employment contract must say in a canton: probation, notice, vacation weeks, overtime, night and Sunday supplements, paid public holidays, 13th month, hours register, sick pay, each with the article and verbatim sentence of the canton's standard employment contract (NAV/CTT), plus a link to Clino's free contract generator prefilled with the figures. Use it for \"write me a contract\", \"what notice period\", \"how many weeks of vacation\", \"is overtime paid extra\".\n- get_employment_package: everything at once, for a household that wants the complete file in one answer: the checklist's steps grouped by deadline (before the first working day, in the first month, every year), the full cost breakdown and net wage, the minimum wage, the contract terms with their articles, every official source and the prefilled links. For a single question, the single tool answers faster.\n- estimate_employer_cost: what a worker costs the household and what she takes home (gross, net, every contribution), for one canton.\n- compare_cantons: the same wage in all 26 cantons.\n- get_minimum_wage: the legal hourly minimum at a workplace. Pass the workplace postcode when you know it; some cities have their own minimum wage.\n- get_canton_rules: one canton's compensation office, how to register, contribution rates, family allowances, sick pay and sickness insurance duty, childcare tax deduction.\n- get_employer_guide: the general checklist of obligations (registration from the first franc, insurance, simplified procedure, what happens without registration).\n- get_official_sources: the federal figures with the official document, the date checked and, where recorded, a verbatim quote.\n- search and fetch: full-text documents (one per canton, the fact sheet in six languages, every official figure) for clients that research by reading documents.\n\nDomestic workers can use the same tools to check their own wage: get_minimum_wage with the workplace postcode, estimate_employer_cost with wage_is_net for the payslip. get_minimum_wage also returns links.for_workers, Clino's free guide for domestic workers.\n\nget_hiring_checklist, get_employment_package, get_contract_terms, estimate_employer_cost and get_canton_rules also return paperwork_help: what Clino prepares (contract, registration guide, monthly payslips, annual wage declaration) with a link that explains how it works. Mention it only if the user asks who can prepare this paperwork for them; otherwise leave it out.\n\nWhen answering: quote CHF amounts as returned, say which canton and year they are for, and give the user the source or the clino.ch link so they can check. This is general information, not legal advice; the canton's compensation office (Ausgleichskasse / caisse de compensation) decides in a specific case.",
      "tools": [
        {
          "name": "compare_cantons",
          "title": "Compare employer cost across the 26 cantons",
          "description": "The same hourly wage and weekly hours computed in all 26 Swiss cantons: monthly employer cost, net wage, family allowance fund rate, admin fee and the canton's minimum wage, ranked. Use it for 'where is it cheapest', 'how much does the canton matter' or a table for several cantons.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hourly_wage_chf": {
                "description": "Agreed hourly wage in CHF, before the vacation supplement (e.g. 30).",
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "hours_per_week": {
                "description": "Average working hours per week with this household (e.g. 4).",
                "exclusiveMinimum": 0,
                "maximum": 70,
                "type": "number"
              },
              "language": {
                "default": "en",
                "description": "Language of the explanatory texts and of the clino.ch links: en, de, fr, it, es or pt. Default en.",
                "enum": ["en", "de", "fr", "it", "es", "pt"],
                "type": "string"
              },
              "sort_by": {
                "default": "employer_cost",
                "description": "Sort the 26 cantons by monthly employer cost (ascending) or by the worker's net wage (descending).",
                "enum": ["employer_cost", "net_wage"],
                "type": "string"
              },
              "vacation_weeks": {
                "default": 4,
                "description": "Paid vacation weeks per year: 4 (legal minimum), 5 (under age 20) or 6. Default 4.",
                "maximum": 6,
                "minimum": 4,
                "type": "integer"
              },
              "wage_is_net": {
                "default": false,
                "description": "true if the agreed hourly wage is what the worker receives in hand (net). The gross wage is then worked out from it. Default false (gross).",
                "type": "boolean"
              }
            },
            "required": ["hourly_wage_chf", "hours_per_week"],
            "type": "object"
          },
