                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "hourly_wage_chf": {
                "description": "Agreed GROSS hourly wage in CHF, before the vacation supplement (e.g. 30).",
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "hours_per_week": {
                "description": "Average working hours per week with this household (e.g. 4).",
