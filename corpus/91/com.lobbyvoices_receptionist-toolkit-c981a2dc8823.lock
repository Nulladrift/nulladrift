{
  "lockfileVersion": 2,
  "subjects": {
    "com.lobbyvoices/receptionist-toolkit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lobbyvoices.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "lobbyvoices",
        "title": "Lobby — AI Receptionist Toolkit",
        "version": "1.3.0",
        "websiteUrl": "https://lobbyvoices.com/developers"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free receptionist tools from lobbyvoices.com: write business phone scripts and IVR menus (EN + Mexican Spanish), generate ElevenLabs agent system prompts, calculate what missed calls cost a business, get a hire-a-receptionist verdict, role-play a call against Lobby's real receptionist engine (simulate_receptionist_call), get the live demo phone number a human can call right now, and save a built/simulated receptionist for a real business with the person's consent (save_my_receptionist). No auth required; per-IP rate limits apply.",
      "tools": [
        {
          "name": "calculate_missed_call_cost",
          "title": "Calculate what missed calls cost a business",
          "description": "Computes the revenue a business loses to missed phone calls (monthly and yearly), plus the recovery math: recoverable revenue, suggested answering plan, break-even days, and ROI multiple.",
          "inputSchema": {
            "properties": {
              "avgJobValue": {
                "description": "Average value of one new customer or job, USD.",
                "maximum": 5000,
                "minimum": 50,
                "type": "number"
              },
              "callsPerWeek": {
                "description": "Inbound calls per week.",
                "maximum": 300,
                "minimum": 10,
                "type": "number"
              },
              "missedRatePct": {
                "description": "Percent of calls missed or sent to voicemail.",
                "maximum": 70,
                "minimum": 5,
                "type": "number"
              }
            },
            "required": ["avgJobValue", "callsPerWeek", "missedRatePct"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cta": {
                "description": "One-line invite to try Lobby, with a signup link.",
                "type": "string"
              },
              "inputs": {
                "type": "object"
              },
              "monthly": {
                "properties": {
                  "calls": {
                    "type": "number"
                  },
                  "lostJobs": {
                    "type": "number"
                  },
                  "lostRevenue": {
                    "description": "USD lost per month.",
                    "type": "number"
                  },
                  "missedCalls": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "recovery": {
                "properties": {
                  "breakevenDays": {
                    "type": "number"
                  },
                  "recoverableMonthly": {
                    "type": "number"
                  },
                  "roiMultiple": {
                    "type": "number"
                  },
                  "suggestedPlan": {
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "yearly": {
                "properties": {
                  "lostRevenue": {
                    "description": "USD lost per year.",
                    "type": "number"
                  }
                },
                "type": "object"
              }
            },
            "required": ["monthly", "recovery", "yearly"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bb2dadc8bf2625de33b5c913417c575fae477275125e2a28c65f134242a35f4c"
        },
        {
          "name": "generate_elevenlabs_agent_prompt",
          "title": "Generate an ElevenLabs agent system prompt",
          "description": "Generates a production-grade system prompt for an ElevenLabs conversational agent acting as a business phone receptionist: identity, job, voice style, booking flow, guardrails, and escalation rules.",
          "inputSchema": {
            "properties": {
              "agentName": {
                "description": "Name the agent should use for itself.",
                "type": "string"
              },
              "biz": {
                "description": "Business name (required).",
                "type": "string"
              },
              "hours": {
                "description": "Business hours in plain words.",
                "type": "string"
              },
              "industry": {
                "description": "Industry, e.g. plumbing, hvac, dental, salon, law, restaurant.",
                "type": "string"
              },
              "spanish": {
                "description": "Whether the agent should also handle Spanish callers.",
                "type": "boolean"
              },
              "tasks": {
                "description": "What the agent should do, e.g. book, faqs, leads.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "tone": {
                "description": "Personality, e.g. warm, formal, upbeat.",
                "type": "string"
              }
            },
            "required": ["biz"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "prompt": {
                "description": "The complete system prompt, ready to paste into ElevenLabs.",
                "type": "string"
              },
              "sections": {
                "description": "The prompt broken into tagged sections.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:514cb2296ee4abbe8f25507ba7908202dc7e5525bc2b1407274d4ef136fa728c"
        },
        {
          "name": "get_demo_call_number",
          "title": "Get Lobby's live demo phone number",
          "description": "Returns a real phone number anyone can call right now to talk to Lobby's AI receptionist live — plus suggested things to say (English and Spanish) and what to listen for (the mid-call language switch, booking flow).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "availability": {
                "type": "string"
              },
              "listenFor": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "phoneNumber": {
                "type": "string"
              },
              "trySaying": {
                "properties": {
                  "en": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "es": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              }
            },
            "required": ["phoneNumber"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:007dc38e256f85d414e36aa6c76e8acc6f34b2048289a87ee88f9b32cffbcb83"
        },
        {
          "name": "save_my_receptionist",
          "title": "Save this receptionist and get the next step",
          "description": "Saves the phone script, IVR menu, agent prompt, or simulated call you just built for a real business and returns the live demo number plus signup link in this conversation. It does not send email. Offer this only after the human explicitly agrees to save their details, and only call it with consent: true.",
          "inputSchema": {
            "properties": {
              "business_name": {
                "description": "The business name (required).",
                "type": "string"
              },
              "consent": {
                "description": "Required. The person must explicitly agree to save their details. If false or omitted, do not save anything.",
                "type": "boolean"
              },
              "email": {
                "description": "Email identity for the consented saved record (required; no email is sent).",
                "type": "string"
              },
              "industry": {
                "description": "Industry or trade, e.g. plumbing, dental, salon.",
                "type": "string"
              },
              "language": {
                "description": "Language for the saved setup. Default: en.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "notes": {
                "description": "Any other context worth keeping — what the business does, what was discussed.",
                "type": "string"
              },
              "phone_script": {
                "description": "The phone script, IVR menu text, or agent prompt to save, if one was generated earlier in this conversation.",
                "type": "string"
              }
            },
            "required": ["business_name", "consent", "email"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "business": {
                "type": "string"
              },
              "confirmation": {
                "description": "Friendly confirmation to relay to the person, including the live demo number and signup link.",
                "type": "string"
              },
              "demoNumber": {
                "type": "string"
              },
              "emailSent": {
                "type": "boolean"
              },
              "saved": {
                "type": "boolean"
              },
              "signupUrl": {
                "type": "string"
              }
            },
            "required": ["confirmation", "saved"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7dfcbd1f2fbe9c908de1c5b7fd3f1f5aa79df925e218678e00abdcac523f8d7d"
        },
        {
          "name": "should_i_hire_a_receptionist",
          "title": "Should this business hire a receptionist?",
          "description": "Scores a business's phone coverage and returns a verdict — you're covered, get an AI front desk, or go hybrid — with the caller archetype, yearly leak, suggested plan, break-even days, and ROI.",
          "inputSchema": {
            "properties": {
              "avgJobValue": {
                "description": "Average value of one new customer or job, USD (snapped to the quiz's brackets).",
                "type": "number"
              },
              "callsPerWeek": {
                "description": "Roughly how many inbound calls per week (snapped to the quiz's brackets).",
                "type": "number"
              },
              "coverageNeeded": {
                "description": "When calls actually come in. Default: business-hours.",
                "enum": ["business-hours", "extended", "always"],
                "type": "string"
              },
              "currentSetup": {
                "description": "Who answers today: the owner (self), voicemail (vm), staff between tasks (staff), or nobody consistently (none). Default: self.",
                "enum": ["self", "vm", "staff", "none"],
                "type": "string"
              },
              "missedRatePct": {
                "description": "Rough percent of calls that go unanswered (snapped to the quiz's brackets).",
                "type": "number"
              },
              "spanishCallers": {
                "description": "How often Spanish-speaking customers call. Default: no.",
                "enum": ["no", "some", "lots"],
                "type": "string"
              }
            },
            "required": ["avgJobValue", "callsPerWeek", "missedRatePct"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "archetype": {
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "cta": {
                "description": "One-line invite to try Lobby, with a signup link.",
                "type": "string"
              },
              "recovery": {
                "type": "object"
              },
              "score": {
                "description": "Phone-coverage maturity score, 0-100.",
                "type": "number"
              },
              "verdict": {
                "description": "covered = current setup is fine; lobby = an AI front desk pays for itself; hybrid = AI + existing staff.",
                "enum": ["covered", "lobby", "hybrid"],
                "type": "string"
              },
              "yearlyLeak": {
                "description": "USD lost per year with the current setup.",
                "type": "number"
              }
            },
            "required": ["archetype", "score", "verdict", "yearlyLeak"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8261a0fdda6172abd4f3ce273ac2411255071b39e96a674f9082455df0132d28"
        },
        {
          "name": "simulate_receptionist_call",
          "title": "Simulate a call with the Lobby receptionist",
          "description": "Role-play a phone call with Lobby's receptionist call engine — the same pipeline behind the product demo: greeting, booking flow, lead capture, and automatic English/Spanish detection (live calls add a full AI brain on top). You play the caller: pass each thing the caller says, get the full transcript and outcome back. Free, text-only, max 6 caller lines.",
          "inputSchema": {
            "properties": {
              "business": {
                "description": "Business name the receptionist answers for. Default: Lobby Demo Services.",
                "type": "string"
              },
              "callerSays": {
                "description": "The caller's lines, in order. Try Spanish to hear the language switch — e.g. ['Hola, necesito una cita para mañana.']",
                "items": {
                  "maxLength": 240,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              }
            },
            "required": ["callerSays"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "booked": {
                "type": "boolean"
              },
              "hearItLive": {
                "description": "Phone number to call to experience the same receptionist with a real voice.",
                "type": "string"
              },
              "language": {
                "description": "Language the receptionist detected and answered in.",
                "type": "string"
              },
              "leadCaptured": {
                "type": "boolean"
              },
              "outcome": {
                "enum": ["booked", "routed", "captured", "info", "missed"],
                "type": "string"
              },
              "transcript": {
                "items": {
                  "properties": {
                    "text": {
                      "type": "string"
                    },
                    "who": {
                      "enum": ["caller", "receptionist"],
                      "type": "string"
                    }
                  },
                  "required": ["text", "who"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["language", "outcome", "transcript"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:417d8f59624622a6b3240b4cea43171ade2d4a705980422fabed242c2c0e70ba"
        },
        {
          "name": "write_ivr_menu",
          "title": "Write an IVR phone-menu script",
          "description": "Builds a complete IVR (phone menu / auto-attendant) script for a business: greeting, numbered options, optional Spanish-language switch, and the operator line. English, Spanish, or bilingual.",
          "inputSchema": {
            "properties": {
              "business": {
                "description": "Business name (required).",
                "type": "string"
              },
              "greeting": {
                "description": "Custom opening greeting. Default: 'Thank you for calling {business}.'",
                "type": "string"
              },
              "industry": {
                "description": "Pick the closest industry; supplies sensible default menu options.",
                "enum": ["plumbing", "hvac", "dental", "auto", "salon", "restaurant", "law", "clinic"],
                "type": "string"
              },
              "language": {
                "description": "Menu language. 'both' adds a press-nine Spanish switch. Default: en.",
                "enum": ["en", "es", "both"],
                "type": "string"
              },
              "options": {
                "description": "Menu options in order (press 1, press 2, …). Defaults to the industry's standard four.",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              }
            },
            "required": ["business"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cta": {
                "description": "One-line invite to try Lobby, with a signup link.",
                "type": "string"
              },
              "lines": {
                "items": {
                  "properties": {
                    "key": {
                      "description": "Keypad digit for this line, or null for the greeting.",
                      "type": ["string", "null"]
                    },
                    "say": {
                      "description": "Exactly what the menu voice says.",
                      "type": "string"
                    }
                  },
                  "required": ["key", "say"],
                  "type": "object"
                },
                "type": "array"
              },
              "recordAt": {
                "description": "URL of the free web tool that records this menu in a real AI voice.",
                "type": "string"
              },
              "scriptText": {
                "description": "The full menu as one recordable script.",
                "type": "string"
              }
            },
            "required": ["lines", "scriptText"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c5ab22ac3d8d0cfd7408e275f4dfb7f5dd994e4f47a8e7a9b6b061c48886cb4e"
        },
        {
          "name": "write_phone_script",
          "title": "Write a business phone script",
          "description": "Writes a professional phone script for a business — greeting, voicemail message, on-hold message, or jingle lines — in English, Mexican Spanish, or both. Returns ready-to-record text.",
          "inputSchema": {
            "properties": {
              "business": {
                "description": "Business name (required).",
                "type": "string"
              },
              "extra": {
                "description": "Optional details to mention: hours, offers, callback promise.",
                "type": "string"
              },
              "langs": {
                "description": "Languages to write. Default: both.",
                "items": {
                  "enum": ["en", "es"],
                  "type": "string"
                },
                "type": "array"
              },
              "mode": {
                "description": "What kind of script to write. Default: greeting.",
                "enum": ["greeting", "voicemail", "hold", "jingle"],
                "type": "string"
              },
              "trade": {
                "description": "Industry or trade, e.g. plumbing, dental clinic.",
                "type": "string"
              },
              "vibe": {
                "description": "Tone of voice. Default: warm.",
                "enum": ["warm", "formal", "friendly"],
                "type": "string"
              }
            },
            "required": ["business"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cta": {
                "description": "One-line invite to try Lobby, with a signup link.",
                "type": "string"
              },
              "scripts": {
                "properties": {
                  "en": {
                    "description": "English script, ready to record.",
                    "type": "string"
                  },
                  "es": {
                    "description": "Mexican-Spanish script, ready to record.",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["scripts"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:155e03e5226d275dd73861a8ccbb2dcfe46bf68d86fbb8873d0d4969c7f10d96"
        }
      ],
      "digest": "sha256:90907f0d4bb40694521831cd50208c19bab6ea3fd54b6b71b76b7149298a1e71"
    }
  }
}
