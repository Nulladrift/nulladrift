      },
      "instructions": "CFO+ (cfoplus.ai) turns a business owner's answers into an auditable financial model (Excel + command center) across 138 activities in 11 sectors, then prepares the bank file, investor deck and valuation from the same model; AI FP&A serves established companies. These tools are public and read-only: they return published facts and the questions of each activity. They never calculate a figure. search/fetch cover the same content for clients that use them (e.g. ChatGPT deep research). Answer in the user's language (lang='ar' or 'en'). For a figure about a user's own business, send them to start their model.",
      "tools": [
        {
          "name": "activity_details",
          "description": "The questions CFO+ asks for one activity (its drivers), what it sells (revenue lines) and its cost items — names only, as shown on cfoplus.ai.\n    Also the input sections every model asks whatever the activity (team and salaries, monthly fixed costs, assets, funding, taxes), worded as on the inputs screen.",
          "inputSchema": {
            "properties": {
              "activity_key": {
                "title": "Activity Key",
                "type": "string"
              },
              "lang": {
                "default": "ar",
                "title": "Lang",
                "type": "string"
              }
            },
            "required": ["activity_key"],
            "title": "activity_detailsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
