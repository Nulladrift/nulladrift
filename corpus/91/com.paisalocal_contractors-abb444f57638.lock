{
  "lockfileVersion": 2,
  "subjects": {
    "com.paisalocal/contractors": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.paisalocal.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "paisalocal-contractors",
        "version": "0.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PaisaLocal builds concrete patios and driveways, natural stone retaining walls and outdoor kitchens in Dallas-Fort Worth. These tools price a job line by line from PaisaLocal's own price list (the same quote paisalocal.com gives), hand back a link where the homeowner sees the job drawn onto a photo of their own yard, and book a free site visit that confirms the price. The person asking is usually a homeowner pricing their own job. The price is PaisaLocal's quote, not a market average.",
      "tools": [
        {
          "name": "find_contractor",
          "title": "Find a contractor",
          "description": "Check whether PaisaLocal builds this type of outdoor project at this ZIP code (Dallas-Fort Worth only). project_type: retaining-wall, outdoor-kitchen, concrete (patio/driveway), curb-stone (edging) or french-drain.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "project_type": {
                "description": "retaining-wall | outdoor-kitchen | concrete | curb-stone | french-drain",
                "maxLength": 40,
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP code of the job",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["project_type", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a contractor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a42d013300a275d7de48db1d41d1ec9b8b3920e49b0f1ef76fd26a57db0792a8"
        },
        {
          "name": "get_estimate",
          "title": "Get a price",
          "description": "PaisaLocal's installed price for a job, line by line, from its own Dallas-Fort Worth price list (the same quote paisalocal.com gives). Concrete needs length_ft, width_ft and a finish; a retaining wall needs length_ft, height_ft and a natural stone (e.g. Lueders Buff Chopped, Oklahoma Red Chopped, Granbury Stone). An outdoor kitchen needs length_ft (the total counter run in linear feet: 8-20, an L needs 10+, a U 15+), layout (straight, L or U), a natural stone for the outside of the island, an appliance package and a countertop slab (ask the homeowner; never pick one for them). If the reply asks for a stone, appliance package or countertop choice, ask the homeowner using the choices it lists and call again with their pick. Never call once per option to compare prices. When the reply has stoneOptions, show the homeowner every stone as its name linked to its photoUrl, so they can see each one before choosing. After pricing, link stonePhotoUrl next to the stone name. Returns estimate_id for request_site_visit and seeItInYourYardUrl: a paisalocal.com link where the homeowner uploads a photo of their yard and sees this job drawn onto it, and seeItInYourYardHowTo: the steps on that page. A photo shared in this chat cannot reach these tools, so after giving the price, offer the link with those steps in your own words, and tell the homeowner the photo goes on that page, not into this chat.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "appliances": {
                "description": "Outdoor kitchen only, required: compact_chef (The Compact Chef), entertainer (The Entertainer's Setup), pitmaster (The Pitmaster Pro) or structure_only (no appliances). Ask the homeowner; only packages that fit the run are accepted",
                "enum": ["compact_chef", "entertainer", "pitmaster", "structure_only"],
                "type": "string"
              },
              "countertop": {
                "description": "Outdoor kitchen only, required: countertop slab name (ask the homeowner; never pick one for them)",
                "maxLength": 80,
                "type": "string"
              },
              "finish": {
                "description": "Concrete only, required: broom, salt, exposed or stamped (ask the homeowner; never pick one for them)",
                "enum": ["broom", "salt", "exposed", "stamped"],
                "type": "string"
              },
              "height_ft": {
                "description": "Retaining wall only: height in feet",
                "type": "number"
              },
              "layout": {
                "description": "Outdoor kitchen only, required: straight, L or U (ask the homeowner; never pick one for them)",
                "enum": ["straight", "L", "U"],
                "type": "string"
              },
              "length_ft": {
                "description": "Length in feet (outdoor kitchen: total counter run in linear feet)",
                "type": "number"
              },
              "project_type": {
                "description": "concrete | retaining-wall | outdoor-kitchen (curb-stone, french-drain: priced on paisalocal.com)",
                "maxLength": 40,
                "type": "string"
              },
              "stone": {
                "description": "Retaining wall or outdoor kitchen: natural stone name",
                "maxLength": 80,
                "type": "string"
              },
              "use": {
                "description": "Concrete only: patio (default), driveway, sidewalk, walkway, slab, hot_tub (pad), trailer (RV/boat) or heavy (equipment)",
                "enum": ["patio", "driveway", "sidewalk", "walkway", "slab", "hot_tub", "trailer", "heavy"],
                "type": "string"
              },
              "width_ft": {
                "description": "Concrete only: width in feet",
                "type": "number"
              },
              "zip": {
                "description": "5-digit US ZIP code of the job",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["length_ft", "project_type", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Get a price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://paisalocal/stone-picker.html",
            "ui": {
              "resourceUri": "ui://paisalocal/stone-picker.html"
            },
            "ui/resourceUri": "ui://paisalocal/stone-picker.html"
          },
          "digest": "sha256:4fc8bb67ca612ed76fd7d882d6dfd0aa4c689c9a7cd50b607ead13ae9850f29d"
        },
        {
          "name": "request_site_visit",
          "title": "Book a free site visit",
          "description": "Book PaisaLocal's free site visit for an estimate from get_estimate. Call it first with estimate_id alone to get the open times, then again with one slot_date from that list plus the homeowner's name and email. Phone and the job's street address are optional; without an address PaisaLocal emails the homeowner for it. Only offered times can be booked. No deposit is taken.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "Street address of the job with the house number (optional; PaisaLocal asks by email if left out)",
                "maxLength": 200,
                "type": "string"
              },
              "email": {
                "description": "Homeowner email (needed to book)",
                "maxLength": 254,
                "type": "string"
              },
              "estimate_id": {
                "description": "estimate_id returned by get_estimate",
                "maxLength": 80,
                "type": "string"
              },
              "name": {
                "description": "Homeowner name (needed to book)",
                "maxLength": 120,
                "type": "string"
              },
              "phone": {
                "description": "Homeowner phone (optional)",
                "maxLength": 40,
                "type": "string"
              },
              "slot_date": {
                "description": "One slot_date exactly as returned by a previous request_site_visit call",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["estimate_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a free site visit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1bdb20aadfe619a1653488304bece6e8ccf8aa93be2e506455267006e5161cec"
        }
      ],
      "resources": [
        {
