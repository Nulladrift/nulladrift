      "serverInfo": {
        "name": "Footy Ferret",
        "title": "Footy Ferret",
        "version": "1.0.0",
        "description": "Football lineups, team ratings, tables, results and player numbers, including lower leagues, women’s and youth football.",
        "websiteUrl": "https://footyferret.com/developers",
        "icons": [
          {
            "src": "https://footyferret.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://footyferret.com/icons/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Football statistics from footyferret.com: lineups (shown 5 minutes after we had them, with the time we had them), team power ratings and rankings, league strength, league tables, results, fixtures, match stats and player numbers, including lower leagues, women’s and youth football. Find a competition, team or player by name with search (or competitions by country with list_competitions); get_matches lists a day. The get_ tools take the slug from those results. Times are UTC. Statistics only: no betting content and no live scores. Each result names the page that shows the same data (url): cite it as Footy Ferret (footyferret.com).",
      "tools": [
        {
          "name": "compare_teams",
          "title": "Compare two teams",
          "description": "Two teams side by side: power rating, attack, defence and rank, how far apart they are and what the rating gap means against the same opponent (only within one rating scale), each team’s league and last six results, and their meetings with the tally.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "team_a": {
                "description": "The first team's slug, from another tool's results or its footyferret.com page address.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "team_b": {
                "description": "The second team's slug, from another tool's results or its footyferret.com page address.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["team_a", "team_b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two teams"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e138d9e433bfed77a8f8adefa233d0fbaaf5d38c5adb0e75ae844a94ffe93b43"
        },
        {
          "name": "get_competition",
          "title": "Competition table, results and fixtures",
          "description": "One competition: the official table (or ours counted from results), every team with its rating, latest results, upcoming fixtures, goal numbers and coverage.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "competition": {
                "description": "The competition's slug, from another tool's results or its footyferret.com page address.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["competition"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Competition table, results and fixtures"
          },
          "behavior": {
