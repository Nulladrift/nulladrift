          "name": "get_match",
          "title": "Match details",
          "description": "One match: kickoff, state and final score; both lineups with the time we had them and each player’s season numbers; team news; final match stats and player lines once finished; both teams’ ratings, table lines and form; earlier meetings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
