            "readOnly": true
          },
          "digest": "sha256:50cfd4de440b8b671718b2ba3666278aaddeee40407ac973290e8e049d64b13e"
        },
        {
          "name": "get_league_strength",
          "title": "League strength",
          "description": "Competitions ranked by league strength on one rating scale, strongest first: what an average team in each is worth, its rank, country, level and how many rated teams mainly play in it. Filter by country.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "default": "senior",
                "description": "Youth competitions rank only within their age group, such as u19.",
                "pattern": "^(?:senior|u\\d{2})$",
                "type": "string"
              },
              "country": {
                "description": "Country name in English, such as \"England\"; \"International\" for competitions without one.",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "scale": {
                "default": "men_club",
                "description": "Strengths compare only within a scale.",
                "enum": ["men_club", "women_club", "men_national", "women_national"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "League strength"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
