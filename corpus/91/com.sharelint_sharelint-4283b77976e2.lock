{
  "lockfileVersion": 2,
  "subjects": {
    "com.sharelint/sharelint": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sharelint.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "sharelint",
        "title": "Sharelint",
        "version": "1.0.0",
        "websiteUrl": "https://sharelint.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Sharelint checks any public URL. Use check_link_preview when someone asks how a link looks when shared (WhatsApp, Facebook, X, LinkedIn, Slack, iMessage and others) or why a preview shows no image or the wrong title. Use check_ai_visibility when someone asks whether ChatGPT, Claude, Perplexity or other AI tools can find, read or cite a page. Use check_app_links when links open the browser instead of the iOS or Android app. Use check_performance when someone asks why a page is slow or about Core Web Vitals. Use check_security when someone asks whether a site is secure, about HTTPS, security headers, CSP or cookie flags; it is a passive check, so do not present a good score as proof that the site has no vulnerabilities. Use check_url for a full audit. Each result starts with an ordered \"What to fix\" list with copy-ready code: show the user those fixes, most important first, and the interactive report link.",
      "tools": [
        {
          "name": "check_ai_visibility",
          "title": "Check AI visibility",
          "description": "Check whether ChatGPT, Claude, Perplexity and other AI search tools and assistants can reach, read and cite a URL. Evaluates robots.txt for each AI bot, requests the page with each bot’s User-Agent to catch CDN or firewall blocks, checks noindex, and shows the text an AI crawler gets from the raw HTML without JavaScript. Returns a score, per-bot access and copy-ready fixes. Use it for questions like \"can ChatGPT see my site\" or \"why doesn’t Perplexity cite my page\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public http(s) URL or bare domain to check, for example \"example.com/pricing\". Private and local addresses are refused.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check AI visibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:20ff826d93c5f6e0a171b93d3d7835e52b82da2164ba66bc34f8bb3cae3298e2"
        },
        {
          "name": "check_app_links",
          "title": "Check app links",
          "description": "Check whether a URL opens the site’s iOS or Android app instead of the browser. Validates apple-app-site-association (iOS Universal Links) and assetlinks.json (Android App Links), tests this exact URL against the iOS path rules, and compares the files with the copies Apple’s CDN and Google’s Digital Asset Links service have cached. Returns status per platform and copy-ready fixes. Use it when Universal Links or App Links do not work.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public http(s) URL or bare domain to check, for example \"example.com/pricing\". Private and local addresses are refused.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check app links"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:87ea1df2e0a351674e550fca0a608975758d5f46feeddfe4d99aad11659c83d2"
        },
        {
          "name": "check_link_preview",
          "title": "Check link preview",
          "description": "Check how a URL’s link preview (title, description, image) appears when shared on WhatsApp, Facebook, Messenger, Instagram, X (Twitter), LinkedIn, Telegram, iMessage, Discord, Slack, Snapchat and TikTok. Fetches the page as each app’s crawler, validates Open Graph and Twitter Card tags and the preview image (size, format, weight), and returns a score, per-app results and copy-ready fixes. Use it when a shared link shows no preview, the wrong image or title, or before sharing a page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "crawler": {
                "default": "facebook",
                "description": "User-Agent to fetch the page as for share previews. Defaults to Facebook’s crawler, which most apps resemble.",
                "enum": ["facebook", "whatsapp", "twitter", "telegram", "linkedin", "discord", "slack", "imessage", "browser"],
                "type": "string"
              },
              "url": {
                "description": "Public http(s) URL or bare domain to check, for example \"example.com/pricing\". Private and local addresses are refused.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check link preview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eaa51c60caddc55d4840ab3a88164681db17ec0f9d8219ad5e82a38870386f5d"
        },
        {
          "name": "check_performance",
          "title": "Check performance",
          "description": "Check what slows a URL down, without running a browser. Times the server response as a regular browser (time to first byte, compression, caching, redirects, HTTP/3), reads the HTML for render-blocking scripts and stylesheets, third-party scripts, the main image (lazy loading, preload, weight), images without width and height, and font loading, and reports real-user Core Web Vitals (LCP, INP, CLS) on phones from the Chrome UX Report when Google has data. Returns a score and copy-ready fixes. Use it for questions like \"why is my site slow\" or \"how do I improve my Core Web Vitals\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public http(s) URL or bare domain to check, for example \"example.com/pricing\". Private and local addresses are refused.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check performance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:72234824a14f7c9c71447685e80f50c60a5a51e899a1a1445312579452e5320d"
        },
        {
          "name": "check_security",
          "title": "Check security basics",
          "description": "Check the basic, passive security of a URL: HTTPS and whether the http:// address redirects to it, Strict-Transport-Security, Content-Security-Policy (and whether it really limits scripts), clickjacking protection (frame-ancestors or X-Frame-Options), X-Content-Type-Options, Referrer-Policy, cookie flags (Secure, HttpOnly, SameSite), mixed content, forms that post to http://, third-party scripts without integrity hashes, headers that reveal software versions, and security.txt. Nothing is attacked or scanned, so it does not find vulnerabilities in the site’s code. Returns a score and copy-ready headers. Use it for questions like \"is my site secure\", \"which security headers am I missing\" or \"check my CSP\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public http(s) URL or bare domain to check, for example \"example.com/pricing\". Private and local addresses are refused.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check security basics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fddf9055ae51edc236c841a06ebfd0f70204645047fce2bb2f7266be926ad62d"
        },
        {
          "name": "check_url",
          "title": "Full link audit",
          "description": "Run every Sharelint check on a URL at once: link previews in 12 apps, AI visibility for ChatGPT, Claude and Perplexity, iOS and Android app links, performance, and security basics. Use it for a general \"check my website or link\" request; use the focused tools when the question is about one of these.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "crawler": {
                "default": "facebook",
                "description": "User-Agent to fetch the page as for share previews. Defaults to Facebook’s crawler, which most apps resemble.",
                "enum": ["facebook", "whatsapp", "twitter", "telegram", "linkedin", "discord", "slack", "imessage", "browser"],
                "type": "string"
              },
              "url": {
                "description": "Public http(s) URL or bare domain to check, for example \"example.com/pricing\". Private and local addresses are refused.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Full link audit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9f7da0bb9024a90ac6edcf35d6361f04a62352397042cd0eff4a0b38ad30d967"
        }
      ],
      "digest": "sha256:dc8e7197140668a29363d54e657f195cb58861307a4d7bb452edb64b2c2a3e8e"
    }
  }
}
