        {
          "name": "convertir_montos",
          "title": "Convertir montos a dólares o a pesos de hoy",
          "description": "Convierte montos en pesos argentinos de meses distintos (facturación, sueldos, ventas) a dólares con la cotización de cada mes (oficial, blue, MEP o CCL; promedio o cierre del mes) o a pesos de hoy ajustados por el IPC del INDEC. Hasta 120 meses por llamada. Devuelve el tipo de cambio o el factor de cada mes, los totales y los meses sin dato. Gratis.",
