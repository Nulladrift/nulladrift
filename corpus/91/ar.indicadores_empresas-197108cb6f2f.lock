        {
          "name": "buscar_llamados",
          "title": "Buscar llamados a licitación",
          "description": "Busca llamados a licitación del Estado argentino (Nación, CABA, Provincia de Buenos Aires y el resto de las provincias), una fila por proceso: las circulares y prórrogas no son llamados nuevos, y la fecha de apertura es la última informada. Trae organismo, objeto, rubro (suministros/servicios/obras/locaciones), expediente, apertura de ofertas y link para participar. Para seguir un vertical (por ejemplo salud) se arma un recorte: jurisdicciones + organismos + palabras clave en el objeto (entra lo que es de esos organismos O tiene esas palabras) + desde. Cuesta 1 crédito por página de 20 procesos. El detalle de un proceso, con su historial, es ficha_llamado.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "abiertas": {
                "description": "true = solo procesos con la apertura de ofertas todavía por delante",
                "type": "boolean"
              },
              "desde": {
                "description": "AAAA-MM-DD: sólo procesos con alguna publicación desde esa fecha",
                "type": "string"
              },
              "jurisdiccion": {
                "description": "jurisdicciones que convocan: nacional, caba, pba o la provincia",
                "items": {
                  "enum": ["nacional", "caba", "pba", "catamarca", "chaco", "chubut", "cordoba", "corrientes", "entrerios", "formosa", "jujuy", "lapampa", "larioja", "mendoza", "misiones", "neuquen", "rionegro", "salta", "sanjuan", "sanluis", "santacruz", "santafe", "sde", "tierradelfuego", "tucuman"],
                  "type": "string"
                },
                "type": "array"
              },
              "nivel": {
                "description": "nivel de gobierno que convoca: nacional, provincial o municipal (una municipalidad de PBA es municipal aunque su jurisdicción sea pba)",
                "items": {
                  "enum": ["nacional", "provincial", "municipal"],
                  "type": "string"
                },
                "type": "array"
              },
              "organismo": {
                "description": "un solo organismo_slug, en AND con el resto; uno sin llamados es un error sin cargo",
                "type": "string"
              },
              "organismos": {
                "description": "organismo_slug de resultados anteriores; se suman a palabras (uno u otro). Uno sin llamados es un error sin cargo",
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "pagina": {
                "minimum": 1,
                "type": "integer"
              },
              "palabras": {
                "description": "palabras clave buscadas en el objeto sin acentos ni mayúsculas (3 a 60 caracteres cada una); basta con una",
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "q": {
                "description": "búsqueda textual por organismo, objeto, rubro o procedimiento",
                "type": "string"
              },
              "rubro": {
                "description": "suministros | servicios | obras | locaciones; otro valor es un error sin cargo",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar llamados a licitación"
          },
          "behavior": {
