        {
          "name": "buscar_empresas",
          "title": "Buscar empresas",
          "description": "Busca empresas argentinas por razón social y/o filtros combinables (forma legal, jurisdicción, ciudad, actividad, estado fiscal, rango de capital y sellos booleanos como importador/exportador/empleador/contratista) y una zona (un círculo alrededor de un punto, un recuadro o un departamento INDEC) sobre un padrón de ~1,3M de empresas. Devuelve una página de resultados (10 o 50, según la cuenta) y el total. Cuesta 1 crédito por página.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "actividad": {
                "description": "código de actividad AFIP de hasta 6 dígitos (620100, 011211); matchea la principal y las secundarias que la empresa declara ante ARCA",
                "type": "string"
              },
              "apoc": {
                "description": "true = solo empresas con el sello \"En base APOC\"",
                "type": "boolean"
              },
              "capital": {
                "description": "rango de capital del último balance: lt-1m | 1m-10m | 10m-100m | gt-100m",
                "type": "string"
              },
              "cerca": {
                "description": "centro de un círculo, 'lat,lon' en grados decimales (-34.6037,-58.3816); va con radio_km. Uno solo de cerca, recuadro o departamento",
                "type": "string"
              },
              "cheque_rechazado": {
                "description": "true = solo empresas con el sello \"Con cheques rechazados\"",
                "type": "boolean"
              },
              "ciudad": {
                "type": "string"
              },
              "concurso_quiebra": {
                "description": "true = solo empresas con el sello \"En concurso o quiebra\"",
                "type": "boolean"
              },
              "contratista": {
                "description": "true = solo empresas con el sello \"Contratista del Estado\"",
                "type": "boolean"
              },
              "departamento": {
                "description": "código INDEC de 5 dígitos del departamento o partido (06441 = La Plata)",
                "type": "string"
              },
              "deuda_bcra": {
                "description": "true = solo empresas con el sello \"Con deuda BCRA\"",
                "type": "boolean"
              },
              "empleador": {
                "description": "true = solo empresas con el sello \"Empleadora\"",
                "type": "boolean"
              },
              "estado_fiscal": {
                "description": "activa | inactiva | baja | suspendida | unknown",
                "type": "string"
              },
              "exportador": {
                "description": "true = solo empresas con el sello \"Exportadora\"",
                "type": "boolean"
              },
              "forma_legal": {
                "description": "sa, srl, sas, cooperativa, fundacion…",
                "type": "string"
              },
              "importador": {
                "description": "true = solo empresas con el sello \"Importadora\"",
                "type": "boolean"
              },
              "jurisdiccion": {
                "description": "provincia o 'Ciudad Autónoma de Buenos Aires'",
                "type": "string"
              },
              "pagina": {
                "minimum": 1,
                "type": "integer"
              },
              "pep": {
                "description": "true = solo empresas con el sello \"Vinculada a funcionario (PEP)\"",
                "type": "boolean"
              },
              "q": {
                "description": "búsqueda textual por razón social",
                "type": "string"
              },
              "radio_km": {
                "description": "radio del círculo de cerca, en km (por defecto 1)",
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "number"
              },
              "recuadro": {
                "description": "'oeste,sur,este,norte' en grados decimales, de hasta 25 grados²",
                "type": "string"
              },
              "repsal": {
                "description": "true = solo empresas con el sello \"Sanciones laborales (REPSAL)\"",
                "type": "boolean"
              },
              "sancionada": {
                "description": "true = solo empresas con el sello \"Sancionada (UIF/CNV/BCRA)\"",
                "type": "boolean"
              }
            },
            "type": "object"
          },
