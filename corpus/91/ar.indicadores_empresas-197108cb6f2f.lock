        {
          "name": "ficha_empresa",
          "title": "Ficha de empresa",
          "description": "Ficha completa de una empresa argentina por CUIT: identificación registral, actividad principal y todas las declaradas ante ARCA, dirigentes y socios con el directorio vigente (último acto que designó a la administración; la sindicatura aparte), actos societarios del Boletín Oficial (constitución, reformas, quiebras, concursos), situación crediticia BCRA con detalle banco por banco, cheques rechazados cheque por cheque, comercio exterior, contratos con el Estado y sanciones. Cuesta 1 crédito. Con campos=beneficiarios agrega los beneficiarios finales estimados (+2 créditos) y con campos=presentaciones_igj los balances y asambleas presentados ante la IGJ con la evolución del capital social (+1); cada campo adicional se cobra sólo si vuelve con dato y la respuesta dice cuánto se cobró (creditos_cobrados) y qué campos vinieron vacíos sin cargo (campos_sin_cargo). Trae los 20 actos más recientes (con la descripción acortada y el link al aviso) y hasta 20 dirigentes, con eventos_total y dirigentes_total; detalle=completo devuelve todo, sin cargo si se pide dentro de los 5 minutos de la misma consulta. Cada dirigente trae su persona_id para pedir su ficha con ficha_persona. Si el CUIT es de una persona humana devuelve su ficha de persona (ficha: persona), salvo en ChatGPT, donde una persona se consulta sólo por persona_id y la ficha de empresa no incluye documentos de personas.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "campos": {
                "description": "campos adicionales separados por coma; cada uno suma créditos. Disponibles: empleados (+1), geo (+1), beneficiarios (+2), estados_contables (+2), situacion_historica (+1), paritarias (+1), score (+5), balances_cnv (+1), presentaciones_igj (+1), registros (+1), juicios (+1)",
                "type": "string"
              },
              "cuit": {
                "description": "CUIT de la empresa, 11 dígitos (con o sin guiones)",
                "type": "string"
              },
              "detalle": {
                "description": "completo = todos los actos y dirigentes con el texto entero. Por defecto, resumido",
                "enum": ["resumido", "completo"],
                "type": "string"
              },
              "directorio_al": {
                "description": "un día AAAA-MM-DD (hoy o antes) para saber quiénes administraban la sociedad ese día según los actos publicados; sin costo extra. Si no hay designaciones publicadas antes, directorio_al.fecha viene en null",
                "type": "string"
              }
            },
            "required": ["cuit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ficha de empresa"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
