      "instructions": "Datos societarios, crediticios y de contrataciones de empresas argentinas (Boletines Oficiales de las 24 jurisdicciones, BCRA, registros públicos) y series económicas (dólar oficial, blue, MEP y CCL, inflación, UVA, ICL, riesgo país) con conversiones de montos a dólares o a pesos de hoy, operado por indicadores.ar. Autenticación: OAuth con la cuenta de indicadores.ar (gratis, la primera conexión trae 100 créditos) o una API key en el header Authorization: Bearer. Documentación: https://indicadores.ar/api-empresas/docs#mcp",
      "tools": [
        {
          "name": "buscar_adjudicaciones",
          "title": "Buscar adjudicaciones",
          "description": "Contratos y órdenes de compra que el Estado argentino (Nación, CABA y provincias) ADJUDICÓ a empresas: CUIT y razón social del ganador, organismo, fecha, monto, moneda y objeto. Sólo adjudicaciones firmes y sólo personas jurídicas. Filtrable por texto en el objeto o el organismo, organismo, CUIT de la empresa, rango de fechas, jurisdicción y nivel de gobierno. Cuesta 1 crédito por página de 20.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cuit": {
                "description": "CUIT de la empresa adjudicataria (30, 33 o 34), 11 dígitos",
                "type": "string"
              },
              "desde": {
                "description": "fecha de adjudicación desde, AAAA-MM-DD",
                "type": "string"
              },
              "hasta": {
                "description": "fecha de adjudicación hasta, AAAA-MM-DD",
                "type": "string"
              },
              "jurisdiccion": {
                "description": "jurisdicciones que contrataron: nacional, caba, pba o la provincia",
                "items": {
                  "enum": ["nacional", "caba", "pba", "catamarca", "chaco", "chubut", "cordoba", "corrientes", "entrerios", "formosa", "jujuy", "lapampa", "larioja", "mendoza", "misiones", "neuquen", "rionegro", "salta", "sanjuan", "sanluis", "santacruz", "santafe", "sde", "tierradelfuego", "tucuman"],
                  "type": "string"
                },
                "type": "array"
              },
              "nivel": {
                "description": "nivel de gobierno que contrató: nacional, provincial o municipal",
                "items": {
                  "enum": ["nacional", "provincial", "municipal"],
                  "type": "string"
                },
                "type": "array"
              },
              "organismo": {
                "description": "texto en el nombre del organismo",
                "type": "string"
