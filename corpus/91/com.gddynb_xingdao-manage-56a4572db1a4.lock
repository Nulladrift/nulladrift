          "description": "重点灾害发生源审核：对隐患/发生源台账做「六大类重点灾害」归类、A/B/C 风险分级、点检周期建议与硬件优先违规检出，输出审核报告 + 规范化台账 CSV（可直接进 EHS/CMMS）。\n\n    Args:\n        sources: 发生源条目 JSON 数组字符串，至少 1 条（上限 300）。每条形如\n                 {\"id\":\"SR-001\",\"equipment\":\"CNC-07\",\"source\":\"主轴皮带轮防护罩\",\n                  \"phenomenon\":\"防护罩螺栓缺失，手可触及旋转皮带轮\",\"protection\":\"固定式防护罩（无联锁）\",\n                  \"severity\":\"致命|重伤|轻伤|无伤害\",\"frequency\":\"经常|偶尔|极少\",\n                  \"countermeasures\":[\"设备对策：加装联锁防护罩\"],\"owner\":\"保全班\"}。\n        payment_proof: 支付宝支付凭证。首次调用留空 → 返回付款信息；付款后带入此参数重试。\n        license_key: 买断/年费客户的授权码（有授权码则免付款）。与 payment_proof 填其一。\n    ",
