        {
          "name": "manager_development",
          "description": "中基层管理者育成 · 梯队健康度诊断：按后备人才池与现任管理者数据，算后备覆盖率、代理试岗率、资格达成度、退出健康度与 GL 监督时间被侵占，输出梯队诊断报告 + HR 台账 CSV。\n\n    Args:\n        positions: 关键管理岗位数（整数，如 \"6\"）。\n        managers: 现任管理者 JSON 数组字符串（可留空）。每条形如\n                  {\"id\":\"M01\",\"name\":\"张GL\",\"level\":\"GL\",\"eval_result\":82,\"eval_prev\":78,\"supervision_ratio\":0.62}。\n        candidates: 后备人才 JSON 数组字符串（与 managers 至少给一个）。每条形如\n                  {\"id\":\"C01\",\"name\":\"李四\",\"target_level\":\"GL\",\"months_in_pool\":9,\n                   \"courses_done\":[\"TWI-JI\",\"TWI-JM\",\"TBP/A3\",\"安全管理\",\"基础管理\"],\n                   \"kaizen_themes\":3,\"acting_months\":4,\"acting_score\":81,\"experience_years\":7}。\n        payment_proof: 支付宝支付凭证。首次调用留空 → 返回付款信息；付款后带入此参数重试。\n        license_key: 买断/年费客户的授权码（有授权码则免付款）。与 payment_proof 填其一。\n    ",
