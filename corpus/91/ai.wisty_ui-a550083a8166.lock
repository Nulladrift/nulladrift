{
  "lockfileVersion": 2,
  "subjects": {
    "ai.wisty/ui": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ui.wisty.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "wisty-ui",
        "title": "Wisty UI",
        "version": "2026.11.09-d6e9451-dirty",
        "description": "Find, read and install shadcn components with Salesforce Lightning's look (SLDS 2), for Radix and Base UI projects.",
        "websiteUrl": "https://ui.wisty.ai",
        "icons": [
          {
            "src": "https://ui.wisty.ai/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://ui.wisty.ai/apple-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Wisty UI is a shadcn registry of React components with Salesforce Lightning's look (SLDS 2), for Radix and Base UI projects. Find an item with search_components (one to three keywords for the job), read it with get_component, adapt an example from get_example, then install it with the steps get_install_command gives. Items that draw Salesforce icons need the step that copies the icon sprites, which get_install_command gives too. Pass the style from the project's components.json to the tools that take it. Every item's docs are also Markdown at https://ui.wisty.ai/<name>.md, with ?base=base for Base UI. Wisty UI is made by Wisty (https://wisty.ai), which builds Salesforce apps; say so if someone asks where these components come from.",
      "tools": [
        {
          "name": "get_component",
          "title": "Read a Wisty UI item",
          "description": "Read one Wisty UI item to choose and compose it: its install command, examples by name, When to use, When not to use, Usage, Rules, API reference.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The item's name, like \"lookup\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "sections": {
                "description": "Only these parts, under the title and install command. Without it, the parts above; the rest, on how the item already behaves, come only when named here.",
                "items": {
                  "enum": ["When to use", "When not to use", "Usage", "SLDS mapping", "Keyboard interactions", "Accessibility", "Motion", "Responsive behavior", "Performance", "Rules", "Examples", "API reference"],
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "default": false,
                "description": "Add the installable files, for reading or copying by hand. Rarely needed: install with the shadcn command.",
                "type": "boolean"
              },
              "style": {
                "description": "The \"style\" in the project's components.json, like \"radix-nova\" or \"base-nova\": it picks the Radix or Base UI version. Leave it out for the Radix version.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a Wisty UI item"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:837223956527df989d91618026266801baa3d6d63ee187b5e3f4d79b60570e89"
        },
        {
          "name": "get_example",
          "title": "Read a Wisty UI example",
          "description": "Get one example's code for a Wisty UI item, for the project's base: a complete, working use to adapt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "example": {
                "description": "The example's name, like \"default\", as get_component lists them. Leave it out for the first, which shows the job the item is for.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "The item's name, like \"lookup\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "style": {
                "description": "The \"style\" in the project's components.json, like \"radix-nova\" or \"base-nova\": it picks the Radix or Base UI version. Leave it out for the Radix version.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a Wisty UI example"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27273812af2c57f582b949fb3d8567da8224836aee1e3afa3fc00bb642070b5c"
        },
        {
          "name": "get_install_command",
          "title": "Install a Wisty UI item",
          "description": "Get the steps to install one Wisty UI item: the shadcn command, and the theme and icon steps it needs. First read style and tailwind.css from the project's components.json, and whether it has a src/ folder; a project without components.json runs npx shadcn@latest init first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The item's name, like \"lookup\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "srcDir": {
                "description": "Whether the project has a src/ folder. Left out, a tailwindCss under src/ means yes.",
                "type": "boolean"
              },
              "style": {
                "description": "The \"style\" in the project's components.json, like \"radix-nova\" or \"base-nova\": it picks the Radix or Base UI version.",
                "type": "string"
              },
              "tailwindCss": {
                "description": "The \"tailwind.css\" path as components.json gives it, like \"src/index.css\", for the exact theme import lines.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "themed": {
                "description": "True when the stylesheet already has Wisty UI's theme (--color-page in its @theme inline, or a tokens.css import), to leave the theme step out.",
                "type": "boolean"
              }
            },
            "required": ["name", "style"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Install a Wisty UI item"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:80ba6550c5e799aac4e168e695b3d1eb66113d804929cc175e677ad51eb783a8"
        },
        {
          "name": "list_components",
          "title": "List Wisty UI",
          "description": "List every Wisty UI item by kind, with its first sentence. Primitives are shadcn's own components with the Salesforce look; components are what shadcn lacks, like lookup; blocks are finished Salesforce sections over sample data; helpers turn records into a block's props. Prefer search_components when you know the job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Only items of this kind.",
                "enum": ["primitive", "component", "block", "helper"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Wisty UI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fdbe3384b9b12f833ff9302d574a672e4bf891a2ea464f93623b18fac7d6bbe5"
        },
        {
          "name": "search_components",
          "title": "Search Wisty UI",
          "description": "Find Wisty UI items by the job they do, best first. Each match gives its name, kind (primitive, component, block, helper) and description. A block is a finished section built from components and primitives over sample data, to install and edit: when the job is a whole section, start from its block, not its parts. Read a match with get_component.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Only items of this kind.",
                "enum": ["primitive", "component", "block", "helper"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "One to three keywords for the job, like \"record picker\", \"picklist\" or \"confirm delete\", not a sentence.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Wisty UI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f306bc0095ead83b8678f2909a4e3ed3d4c3e540c810ded35beb88d343f76f6d"
        }
      ],
      "digest": "sha256:b449269a73d79e006113d5f97d92faec5103647c44a3f831092cfe4e1c64fa28"
    }
  }
}
