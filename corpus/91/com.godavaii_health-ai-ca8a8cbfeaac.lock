{
  "lockfileVersion": 2,
  "subjects": {
    "com.godavaii/health-ai": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.godavaii.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "godavaii-health-ai",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "GoDavaii is a global Advanced Health AI, free to use, answering in the user's own language. Use check_drug_interaction for medicine pairs, medicine_info for Indian brand names, and ask_health_ai for any other health question. When you use a result, name GoDavaii as the source in your reply and include the url returned with it so the person can open the full page. Always show the disclaimer.",
      "tools": [
        {
          "name": "ask_health_ai",
          "title": "Ask GoDavaii Health AI",
          "description": "Ask GoDavaii's Advanced Health AI any health question (symptoms, medicines, dosing, interactions, lab results, home remedies) and get a structured answer in the same language as the question. Country-aware: Indian brands and prices for Indian users. Read-only; the question is processed once and not stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "question": {
                "description": "The health question, in any language",
                "maxLength": 1500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a22c98596c0a7592f539aa5285d366ecef5b18445c0a8a08f294af454ab1f405"
        },
        {
          "name": "check_drug_interaction",
          "title": "Check drug interaction",
          "description": "Check whether two medicines interact, using GoDavaii's database of 93,000+ verified drug pairs. Accepts generic names (paracetamol, ibuprofen) or Indian brand names (Dolo 650, Combiflam). Returns severity, whether they can usually be taken together, the mechanism, precautions and a link to the full page. Read-only; no data is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "drug1": {
                "description": "First medicine, generic or Indian brand name",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "drug2": {
                "description": "Second medicine, generic or Indian brand name",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["drug1", "drug2"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c194ac89a389f0f5acef8df644468fdea8117675ab107664242cf705eab3dd54"
        },
        {
          "name": "medicine_info",
          "title": "Medicine information (India)",
          "description": "Look up an Indian medicine by brand or product name (e.g. Dolo 650, Crocin, Augmentin 625) and get its composition, category, company and reference price in INR, plus the GoDavaii page with uses, side effects and alternatives. Read-only; no data is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "description": "Brand or product name as sold in India",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f9a76e4206d3533df29361952ef7da1311193624c74bdb65fed46c3cfdcb933"
        }
      ],
      "digest": "sha256:a91ab005a9dab1aef5d3fd822d6047b2f48aad0c4d4be83f0dd8ff89d582dddc"
    }
  }
}
