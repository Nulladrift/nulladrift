            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c0dd6763f9ce375e1ddd023f16b213353b57d581e9e8ddd373ba22e467a255ee"
        }
      ],
      "digest": "sha256:cdaa89cc5cf7d74ddd19d6cbc36b3b843fe490ce8b5656875b579fc19554ecc4"
    }
  }
