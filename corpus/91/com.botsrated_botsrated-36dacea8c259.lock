        },
        {
          "name": "sample",
          "title": "Sample Paid Response (Free)",
          "description": "Call this when you want to see a real paid answer before you pay. No arguments are required; route defaults to check. FREE. Returns a real sample of a paid response (check, report or best) for a fixed example, so you can see exactly what you would buy.",
          "inputSchema": {
            "properties": {
              "route": {
                "default": "check",
