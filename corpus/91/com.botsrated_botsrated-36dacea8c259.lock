        {
          "name": "seller_announce",
          "title": "Seller statement (Free, owner)",
          "description": "Call this when you are the verified owner and you are posting a planned price or payTo. FREE. Verified owner posts a planned price and/or payTo set, effective_at, note, and sig_b64 over the canonical statement. Stored as an owner-signed record. Does not change a measurement. A payTo alert is not suppressed.",
          "inputSchema": {
