        },
        {
          "name": "find",
          "title": "Find (Free)",
          "description": "Call this when you need covered sellers or MCP servers for a task and you have not picked a host yet. FREE (uses 1 of the 25 free checks per client per UTC day, shared with /v1/check). Top matching covered x402 sellers and remote MCP servers for what you need, each with a one-line factual reason (text match, recent valid 402s or handshakes, median latency, quoted price) and its page URL. Same filters as best, without the full ranking and receipts. Seller text is the seller's own words; we don't check it. Optional category is a Works Today slug; it is ignored unless that directory is live and the category is published.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional Works Today category slug. Ignored unless the directory is live and the category is published. Same free daily check as find.",
                "type": "string"
              },
              "q": {
                "description": "What you need, 1-4 keywords, e.g. weather or crypto price",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find (Free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c619aeb287303b5ec1d46fbcc698ba59ef7f94b946344e591f92410491c1476"
        },
        {
          "name": "preflight",
          "title": "Preflight",
          "description": "Call this when you have a host, or you just pasted an MCP config, and you want the latest check before anything else. Not charged. Is this x402 seller or remote MCP server covered, and what did its latest unpaid probe show? For MCP server hosts: last handshake state (ok, auth_required, handshake_failed, unreachable, or blocked = not contacted because the URL, a redirect or its DNS points somewhere our rules don't allow), protocol version, tool count and tools hash. Returns status, whether the 402 challenge was valid, quoted vs listed price and payTo, freshness (age, stale flag) and the receipt link. Use before paying any x402 seller. Cap: 1000 per client IP (IPv6 /48) per UTC day, then an error preflight_cap. A key allows 25000 per key per UTC day. No public price is listed for a key.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Seller hostname or URL, e.g. blockrun.ai or https://blockrun.ai/api/v1/chat/completions",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
