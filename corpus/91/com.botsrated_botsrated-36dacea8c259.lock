        {
          "name": "report",
          "title": "Report ($0.002)",
          "description": "Call this when you want the full receipt history for one host. PAID $0.002 USDC on Base mainnet via x402 (the first 3 calls per client per UTC day are free over HTTP GET /v1/report/{host}). Full receipt history for one host (up to 1000 probes plus all paid test-buys). An unpaid call returns an x402 v2 PaymentRequired tool error (isError, structuredContent with accepts); an x402-aware MCP client signs it and retries with the payment in _meta[\"x402/payment\"]. Input is checked before any payment request; charged only when the tool returns an answer (settlement in result _meta[\"x402/payment-response\"]).",
          "inputSchema": {
            "properties": {
              "host": {
