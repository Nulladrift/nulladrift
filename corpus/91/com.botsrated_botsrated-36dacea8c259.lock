        {
          "name": "coverage",
          "title": "Coverage (Free)",
          "description": "Call this when you want to know how many sellers and MCP servers are covered. No arguments are required. FREE. How many x402 seller hosts and remote MCP servers BotsRated covers (mcp_servers: servers, hosts, probed, last-state counts; chains: measured hosts quoting Base USDC / Solana USDC in the last 48 h, null until measured), from which discovery sources, the probe schedules and when the last probe runs finished.",
          "inputSchema": {
