        {
          "name": "seller_announce",
          "title": "Seller statement (Free, owner)",
          "description": "Use when you are the verified owner and you are posting a planned price or payTo. Free (owner session + signature required). Verified owner posts a planned price and/or payTo with effective_at, sig_b64, session.",
          "inputSchema": {
            "properties": {
              "effective_at": {
                "description": "ISO-8601 UTC timestamp string, e.g. 2026-12-01T00:00:00Z",
                "type": "string"
              },
              "host": {
                "description": "Seller hostname or URL, for example api.agentweather.io",
                "type": "string"
              },
              "note": {
                "description": "Optional short plain-text note (up to 500 chars)",
                "type": "string"
              },
              "payto": {
                "description": "Planned payTo address list, e.g. [\"0x...\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "planned_price_usd": {
                "description": "Planned USD price >= 0, e.g. 0.02 (planned_price_usd or payto required)",
                "type": "number"
              },
              "session": {
                "description": "Owner session token from POST /v1/seller/claim/verify",
                "type": "string"
              },
              "sig_b64": {
                "description": "Base64 Ed25519 or P-256 signature over canonical statement",
                "type": "string"
              }
            },
            "required": ["effective_at", "host", "session", "sig_b64"],
            "type": "object"
