          "name": "list_law_types",
          "description": "Lists law types under one subcategory, with the parent category and subcategory names. This is the last taxonomy step. It does not return documents.\n\nWhen to use: When you already have a subcategory_id from list_subcategories. Examples: 'law types under subcategory A.1.1.1', 'find law types named statute'. Pass law_type only to narrow by name. When not: Do not use this to list subcategories, categories, domains, or documents. For those use list_subcategories, list_categories, list_domains, list_documents, or search. Do not call without a subcategory_id from list_subcategories. Skip if you already have this law type list for the same subcategory_id and law_type filter.\n\nParameters: subcategory_id (required) is the subcategory reference from list_subcategories. It must be exactly four dot-separated segments, such as A.1.1.1, and is uppercased before the query. law_type is an optional case-insensitive substring of the law type name. A subcategory_id with the wrong shape is rejected before the query. limit defaults to 20 and is capped at 100. next_id is the numeric id from pagination.next_id, not subcategory_id. Empty data means that subcategory has no matching law type.\n\nBehavior: Read-only SELECT; does not create, update, or delete records, files, or credentials. The only effect is a database read. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. Not cached; each call reads the current law type table. total_count is the full match count, not the page size. There is no further taxonomy tool after this one.\n\nReturns: A page of {id, category_id, category_name, subcategory_id, subcategory_name, law_type_id, law_type}. id and law_type_id are the same numeric id. Example law_type \"Statute\".",
