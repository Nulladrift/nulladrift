        {
          "name": "list_categories",
          "description": "Lists categories under one subdomain, with the parent domain and subdomain names. This is the third taxonomy step.\n\nWhen to use: When you already have a subdomain_id from list_subdomains. Examples: 'categories under subdomain A.1', 'find a category named jurisdiction'. Pass category_name only to narrow by name. When not: Do not use this for subcategories; use list_subcategories with the returned category_id. Do not use it for law types; use list_law_types. For the parent lists use list_domains and list_subdomains. For documents use list_documents or search. Do not call without a subdomain_id from list_subdomains. Skip if you already have this category list for the same subdomain_id and category_name.\n\nParameters: subdomain_id is the subdomain reference from list_subdomains, such as A.1. A call without it, or with an unknown value, returns Subdomain not found. category_name is an optional case-insensitive substring of the category name; the parameter is category_name, not category. limit defaults to 20 and is capped at 100. next_id is the numeric id from pagination.next_id, not category_id. Empty data means that subdomain has no matching category.\n\nBehavior: Read-only SELECT; does not create, update, or delete records, files, or credentials. The only effect is a database read. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. Not cached; each call reads the current category table. total_count is the full match count, not the page size. The input marks subdomain_id optional, but the query returns Subdomain not found when it is missing.\n\nReturns: A page of {id, domain, subdomain, category_id, category_name}. domain and subdomain are display names, not reference codes. Example category_id \"A.1.1\", category_name \"General Private International Law\". Pass category_id, not id, to list_subcategories.",
