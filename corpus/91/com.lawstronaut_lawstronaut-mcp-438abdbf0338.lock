        {
          "name": "evidence_pull",
          "description": "Returns one complete citation bundle for a single document: metadata, a permanent legal_link, a citation_template, the body, and a temporary source-file URL when one exists.\n\nWhen to use: When one call must support a citation or an audit. Examples: 'show me the source for this Irish statute', 'cite uuid … with its authority, date, link, and text'. Prefer this over calling the body and file tools separately. When not: For plain text alone, use list_full_text (example: 'quote the operative wording'). For structured Markdown alone, use list_markdown (example: 'keep the article headings'). For only a temporary URL to the original PDF or source file, use document_presigned_url (example: 'download the original file'). To browse or search without the bundle, use list_documents, search, or horizon_scan. For one historical version, use document_version. Do not call without an iso from list_jurisdictions and the document uuid. Skip if you already have this bundle for the same iso and uuid.\n\nParameters: iso (required) is a jurisdiction code from list_jurisdictions and is uppercased (e.g. IE, NL, US_CA). uuid (required) is the document UUID from list_documents, search, or horizon_scan. include_text defaults to true and fetches the body. include_source_url defaults to true and adds a temporary signed URL to the original file when one exists. text_format defaults to 'markdown' (structured Markdown); 'plain' returns plain text instead. Set include_text or include_source_url to false only when that part of the bundle is unnecessary.\n\nBehavior: Read-only. Reads the document record, optionally the stored body, and optionally signs a temporary source-file URL. Does not create, update, or delete records, files, or credentials. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. Not cached. The source-file URL is temporary: source_file_note says to fetch it promptly, and legal_link is the permanent citation URL. source_file_url is null when no original file is stored. An archived document returns an archived error.\n\nReturns: One citation bundle: uuid, version, metadata, legal_link, citation_template, and, when requested, content_format plus content, and source_file_url.",
