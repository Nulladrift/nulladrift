          "name": "list_documents",
          "description": "Lists document metadata in a jurisdiction (title, dates, source, classification) with filters and pagination. It does not return the document body, a citation bundle, or a source-file URL.\n\nWhen to use: When you need to find or browse documents before reading them. Example: 'which Belgian employment statutes mention night work?' Use the returned uuid with a body or citation tool. When not: Do not use this for the body or the file. For plain text, use list_full_text (example: 'quote the operative wording'). For structured Markdown, use list_markdown (example: 'keep the article headings'). For a complete citation bundle — metadata, permanent legal link, citation template, body, and a temporary source-file URL — use evidence_pull (example: 'show me the source'). For only a temporary URL to the original file, use document_presigned_url (example: 'download the PDF'). Do not call without an iso from list_jurisdictions. Skip if you already have this document list for the same iso and filters.\n\nParameters: iso (required) is a jurisdiction code from list_jurisdictions (e.g. BE, or US_CA for a state). version, section_title, date_of_decision, file_data_only, issuing_authority, type_of_authority, source_identifier, source_secondary_identifier, tag are optional, section_title is a case-insensitive substring of the section title, date_of_decision is a date, file_data_only is a boolean, issuing_authority is a case-insensitive substring of the issuing authority, type_of_authority is a case-insensitive substring of the type of authority, source_identifier is a case-insensitive substring of the source identifier, source_secondary_identifier is a case-insensitive substring of the source secondary identifier, tag is a case-insensitive substring of the tag. With limit, next_id parameters to paginate the results. Empty data means the iso is outside the subscription, or no document matched.\n\nBehavior: Read-only SELECT; does not create, update, or delete records, files, or credentials. The only effect is a database read. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. Not cached; each call reads current subscription and document data. Documents with total_links of 0 are omitted.\n\nReturns: A list of documents matching the filters, with pagination information.",
