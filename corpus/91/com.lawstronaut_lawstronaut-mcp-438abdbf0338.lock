        {
          "name": "document_presigned_url",
          "description": "Returns a temporary signed URL to the original source file (PDF or other stored file) for one document. The URL expires. This tool does not return the document body or a citation bundle.\n\nWhen to use: When you need to open or download the original file. Examples: 'give me the PDF for uuid …', 'link to the source file so I can download it'. Use the uuid from list_documents, search, or horizon_scan. When not: For plain text of the body, use list_full_text (example: 'quote the operative wording'). For structured Markdown, use list_markdown (example: 'keep the article headings'). For a complete citation bundle — metadata, permanent legal link, citation template, body, and this temporary URL together — use evidence_pull (example: 'show me the source'). For a permanent citation link without a file download, use the legal_link from evidence_pull or list_documents. Do not call without a uuid. Skip if you already have an unexpired URL for that uuid.\n\nParameters: uuid (required) is the document UUID. There is no iso parameter. The response includes expires_at; fetch the URL before it expires. A missing file or an archived document returns an error rather than a URL.\n\nBehavior: Read-only. Looks up the stored file and signs a temporary URL. Does not create, update, or delete records, files, or credentials. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. Not cached. Each call signs a new URL. expires_at is when that URL stops working. The URL is not a permanent legal link.\n\nReturns: One object: uuid, url (temporary source-file URL), and expires_at. url is empty when no file could be signed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "uuid": {
                "description": "UUID",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["uuid"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "data": {
                "additionalProperties": false,
                "description": "Presigned URL for the requested document",
                "properties": {
                  "expires_at": {
                    "description": "ISO timestamp when the temporary URL stops working",
                    "type": "string"
                  },
                  "url": {
                    "description": "Temporary signed URL to the original source file. Fetch it before expires_at. Not the document body.",
                    "type": "string"
                  },
                  "uuid": {
                    "description": "UUID",
                    "type": "string"
                  }
                },
                "required": ["expires_at", "url", "uuid"],
                "type": "object"
              },
              "message": {
                "description": "Result message",
                "type": "string"
              }
            },
            "required": ["data", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get source url"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4e2cd14e2d2d5336e34b89978fd4681b179c623c426cfbf3c254ad6f202ca1fc"
