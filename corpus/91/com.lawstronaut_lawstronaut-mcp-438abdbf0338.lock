          "description": "List every country and state in the authenticated subscription's Lawstronaut legal corpus (name, iso, type, documents_count) — not the global unfiltered catalog, and not legal documents or full text.\n\nWhen to use: Call FIRST, before any jurisdiction-scoped legal query, so you know which iso codes are valid for this credential. When not: Skip if you already have this list from earlier in the session. Do not use this to fetch documents, markdown, source files, or portals.\n\nParameters: Takes none — invoke with {}. Do not pass iso, country, limit, offset, or other filters; they are not accepted and would not change the result. There is no page size or default filter. Empty data means the subscription includes no jurisdictions.\n\nBehavior: Read-only SELECT; does not create, update, or delete records, files, or credentials. The only effect is a database read. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. Not cached; each call reads current subscription and portal data.\n\nReturns: A list of jurisdictions matching the filters, with pagination information.",
          "inputSchema": {
