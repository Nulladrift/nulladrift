        {
          "name": "list_full_text",
          "description": "Returns the plain-text body of documents (id, uuid, version, text). This is the plain-text read: wording only, with no Markdown headings or lists, and no citation metadata.\n\nWhen to use: When you need the body as plain text. Examples: 'quote the operative wording of this Belgian statute', 'give me the raw text of uuid …'. Pass uuid when you already have one document; otherwise filter by title and paginate. When not: For structured Markdown that keeps headings and lists, use list_markdown. For a complete citation bundle in one call — metadata, permanent legal link, citation template, body, and a temporary source-file URL — use evidence_pull (example: 'show me the source'). For only a temporary URL to the original PDF or source file, use document_presigned_url (example: 'download the original file'). To browse titles and dates without the body, use list_documents or search. For one historical version's metadata plus both bodies, use document_version. Do not call without an iso from list_jurisdictions. Skip if you already have this plain text for the same iso, uuid, and filters.\n\nParameters: iso (required) is a jurisdiction code from list_jurisdictions and is uppercased before the query (e.g. BE, or US_CA for a state). uuid is optional; when set, the call targets that document. title is an optional case-insensitive substring. with_empty_data defaults to false and omits documents that have no stored plain text; true includes them with text null. limit defaults to 20 and is capped at 100. include_total adds pagination.total_count when true. Other optional filters match the input schema and are combined with AND.\n\nBehavior: Read-only SELECT plus a read of the stored text. Does not create, update, or delete records, files, or credentials. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. Not cached; each call reads current subscription data and the stored plain text. An archived uuid returns an archived error instead of the body.\n\nReturns: A page of {id, uuid, version, text} where text is plain text. Empty data means nothing matched, or the iso is outside the subscription.",
