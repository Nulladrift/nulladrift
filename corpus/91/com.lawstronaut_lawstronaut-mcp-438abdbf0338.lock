                "minimum": 1,
                "type": "integer"
              },
              "next_id": {
                "description": "document id of the first row of the next page, from pagination.next_id. Omit on the first page.",
                "type": "number"
              },
              "portal": {
                "description": "Filter by portal name",
                "type": "string"
              },
              "portal_id": {
                "description": "Filter by portal ID",
                "type": "number"
              },
              "publication_date": {
                "description": "YYYY-MM-DD, or a range YYYY-MM-DD-to-YYYY-MM-DD. Leave blank to apply no date filter.",
