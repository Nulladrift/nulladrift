              "date_of_enactment": {
                "description": "YYYY-MM-DD, or a range YYYY-MM-DD-to-YYYY-MM-DD. Leave blank to apply no date filter.",
                "type": "string"
              },
              "effective_date": {
                "description": "YYYY-MM-DD, or a range YYYY-MM-DD-to-YYYY-MM-DD. Leave blank to apply no date filter.",
                "type": "string"
              },
              "expiration_date": {
                "description": "YYYY-MM-DD, or a range YYYY-MM-DD-to-YYYY-MM-DD. Leave blank to apply no date filter.",
                "type": "string"
