        {
          "name": "search",
          "description": "Searches legal documents using OpenSearch to discover relevant documents based on the supplied search criteria. Returns matching documents and their available metadata.\n\nWhen to use: Use when you need to discover relevant legal documents through search, especially when looking for documents matching a search query rather than retrieving a structured list. Use this to explore legal content relevant to a topic, legal issue, phrase, or other supported search criteria. When not: Do not use this to browse with structured filters and cursor pagination; use list_documents. Do not use it to read a body or a file. For plain text use list_full_text (example: 'quote the operative wording'). For structured Markdown use list_markdown (example: 'keep the article headings'). For a complete citation bundle use evidence_pull (example: 'show me the source'). For a temporary source-file URL use document_presigned_url (example: 'download the PDF'). For one historical version use document_version. Do not call without a valid iso from list_jurisdictions. Avoid repeating an equivalent search when you already have sufficient results for the same query and filters.\n\nParameters: iso (required) is the jurisdiction code from list_jurisdictions (e.g. BE or US_CA for a state). Provide the search query and any supported optional filters defined by the input schema. Optional filters may narrow the search by document metadata, dates, authority, source identifiers, tags, or other supported criteria. Use only parameters defined by the schema. The results depend on the query, jurisdiction, filters, and the user's subscription access. An empty data array means no matching documents were returned; it does not necessarily mean that the jurisdiction has no documents.\n\nBehavior: Read-only search operation. Does not create, update, or delete documents, records, files, or credentials. The primary side effect is the computational and resource cost of executing an OpenSearch query. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. Search results are determined by the OpenSearch query implementation, relevance logic, supported filters, and available indexed data. Results may not include every document in the jurisdiction. Search results may differ from list_documents because the tools use different retrieval mechanisms. Repeating a search executes another query. Do not assume results are cached or that the search index contains every recently updated document.\n\nReturns: Matching legal documents and their available metadata, together with a result message. The returned documents depend on the search query, jurisdiction, supported filters, and subscription permissions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "crawling_date": {
                "description": "YYYY-MM-DD, or a range YYYY-MM-DD-to-YYYY-MM-DD. Leave blank to apply no date filter.",
                "type": "string"
              },
              "date_of_decision": {
                "description": "YYYY-MM-DD, or a range YYYY-MM-DD-to-YYYY-MM-DD. Leave blank to apply no date filter.",
                "type": "string"
