        {
          "name": "list_subcategories",
          "description": "Lists subcategories under one category (id, category_id, category_name, subcategory_id, subcategory_name). This is the fourth taxonomy step.\n\nWhen to use: When you already have a category_id from list_categories. Examples: 'subcategories of category A.1.1', 'find the Jurisdiction subcategory'. Pass subcategory_name only to narrow by name. When not: Do not use this for law types; use list_law_types with the returned subcategory_id. For categories use list_categories. For domains or subdomains use list_domains or list_subdomains. For documents use list_documents or search. Do not call without a category_id from list_categories. Skip if you already have this subcategory list for the same category_id and subcategory_name.\n\nParameters: category_id (required) is the category reference from list_categories. It must be exactly three dot-separated segments ending in a number, such as A.1.1, and is uppercased before the query. subcategory_name is an optional case-insensitive substring of the subcategory name; the parameter is subcategory_name, not subcategory. An unknown category_id returns Category not found. A category_id with the wrong shape is rejected before the query. limit defaults to 20 and is capped at 100. next_id is the numeric id from pagination.next_id, not subcategory_id. Empty data means that category has no matching subcategory.\n\nBehavior: Read-only SELECT; does not create, update, or delete records, files, or credentials. The only effect is a database read. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. Not cached; each call reads the current subcategory table. total_count is the full match count, not the page size.\n\nReturns: A page of {id, category_id, category_name, subcategory_id, subcategory_name}. Example: {\"category_id\":\"A.1.1\",\"category_name\":\"General Private International Law\",\"subcategory_id\":\"A.1.1.1\",\"subcategory_name\":\"Jurisdiction\"}. Pass subcategory_id, not id, to list_law_types.",
          "inputSchema": {
