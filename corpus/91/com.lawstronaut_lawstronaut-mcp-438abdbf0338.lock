                "default": false,
                "description": "Filter by file data only",
                "type": "boolean"
              },
              "include_total": {
                "default": false,
                "description": "Include total count in response",
                "type": "boolean"
              },
              "is_repealed": {
                "default": false,
                "description": "Filter by repealed documents. default value is false",
                "type": "boolean"
              },
              "iso": {
                "description": "Filter by Jurisdiction ISO code (e.g. 'US')",
                "type": "string"
              },
              "issuing_authority": {
                "description": "Filter by issuing authority",
                "type": "string"
              },
              "issuing_authority_tags": {
                "description": "Filter by issuing authority tags",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "keyword": {
                "description": "Search text matched against the heading and the body. Example: '29 CFR 825.500 retention period'. Omit it to list by filters only, newest document id first.",
                "type": "string"
              },
              "lang": {
                "description": "Exact portal language name, for example English. Filters the portal, not the document language.",
                "type": "string"
              },
              "last_amendment": {
                "description": "YYYY-MM-DD, or a range YYYY-MM-DD-to-YYYY-MM-DD. Leave blank to apply no date filter.",
