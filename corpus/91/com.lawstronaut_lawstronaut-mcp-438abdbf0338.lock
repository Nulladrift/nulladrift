        {
          "name": "list_domains",
          "description": "Lists the top-level legal domains (id, domain_id, domain name). This is the first taxonomy step. It does not return subdomains, categories, documents, or jurisdictions.\n\nWhen to use: When you need the domain list or a name match. Examples: 'what legal domains exist?', 'find the domain for private law'. Pass domain only to narrow by name. When not: Do not use this for children of a domain. For subdomains use list_subdomains with the returned domain_id. For categories use list_categories. For subcategories use list_subcategories. For law types use list_law_types. For documents use list_documents or search. For jurisdictions use list_jurisdictions. Skip if you already have this domain list for the same domain filter.\n\nParameters: domain is an optional case-insensitive substring of the domain name. There is no parent id and no iso. limit defaults to 20 and is capped at 100. next_id is the numeric id from the previous pagination.next_id; omit it on the first page. A null next_id means there is no further page. Empty data means no domain name matched.\n\nBehavior: Read-only SELECT; does not create, update, or delete records, files, or credentials. The only effect is a database read. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. Not cached; each call reads the current domain table. total_count is the full match count, not the page size. Results are not limited to a jurisdiction.\n\nReturns: A page of {id, domain_id, domain}. Example: {\"id\":1,\"domain_id\":\"A\",\"domain\":\"Private law\"}. Pass domain_id, not id, to list_subdomains.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "Filter by domain name",
                "type": "string"
              },
              "limit": {
                "description": "Number of results to return",
                "type": "number"
              },
              "next_id": {
                "description": "Next ID to paginate the results",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
