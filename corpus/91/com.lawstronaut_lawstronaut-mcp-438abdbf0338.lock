; safe to retry. Not cached; each call reads current subscription data and the stored Markdown. An archived uuid returns an archived error instead of the body.\n\nReturns: A page of {id, uuid, version, markdown} where markdown is structured Markdown. Empty data means nothing matched, or the iso is outside the subscription.",
