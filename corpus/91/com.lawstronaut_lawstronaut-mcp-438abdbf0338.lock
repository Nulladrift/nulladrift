        {
          "name": "health_check",
          "description": "Verify that the Lawstronaut MCP server and its backing services (database, cache) are reachable and responding. Returns the overall status, per-service status, server version, and a UTC timestamp.\n\nWhen to use: Call at the start of a session to confirm connectivity before running any data tools, or when a previous tool call returned an unexpected error and you want to diagnose whether the service itself is down. When not: Do not call on every tool invocation — use it only for diagnostic purposes. It does not return legal data.\n\nParameters: Takes none — invoke with {}. No filters, pagination, or auth-scoped data.\n\nBehavior: Read-only: one lightweight SELECT 1 against the database and one PING against the cache. Does not create, update, or delete any records. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. If the database is unreachable the overall status will be 'degraded'. If only the cache is unreachable the overall status will be 'degraded'. Both must be healthy for status 'ok'.\n\nReturns: status ('ok' | 'degraded'), version string, utc_timestamp, and a services object with db and cache each reporting their own status ('ok' | 'error') plus optional latency_ms.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "description": "No arguments. Call with {}.",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "services": {
                "additionalProperties": false,
                "properties": {
                  "cache": {
                    "additionalProperties": false,
                    "properties": {
                      "latency_ms": {
                        "description": "Round-trip latency in milliseconds",
                        "type": "number"
                      },
                      "status": {
                        "description": "Cache connectivity status",
                        "enum": ["ok", "error", "disabled"],
                        "type": "string"
                      }
                    },
                    "required": ["status"],
                    "type": "object"
                  },
                  "db": {
                    "additionalProperties": false,
                    "properties": {
                      "latency_ms": {
                        "description": "Round-trip latency in milliseconds",
                        "type": "number"
                      },
                      "status": {
                        "description": "Database connectivity status",
                        "enum": ["ok", "error"],
                        "type": "string"
                      }
                    },
                    "required": ["status"],
                    "type": "object"
                  }
                },
                "required": ["cache", "db"],
                "type": "object"
              },
              "status": {
                "description": "Overall health status",
                "enum": ["ok", "degraded"],
                "type": "string"
              },
              "utc_timestamp": {
                "description": "UTC timestamp of the health check",
                "type": "string"
              },
              "version": {
                "description": "MCP server version",
                "type": "string"
              }
            },
            "required": ["services", "status", "utc_timestamp", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Health check"
          },
          "behavior": {
            "destructive": false,
