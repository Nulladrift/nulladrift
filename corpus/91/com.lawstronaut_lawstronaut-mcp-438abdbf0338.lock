          "description": "Lists the authority types available through this tool, with metadata such as jurisdiction and portal name.\n\nWhen to use: When you need authority types for a known iso. Pass optional portal name or authority type only to narrow that list. When not: Do not call without an iso from list_jurisdictions. Skip if you already have this authority type list for the same iso and filters.\n\nParameters: iso (required) is a jurisdiction code from list_jurisdictions and is uppercased before the query (e.g. BE, or US_CA for a state). portal_name and authority_type are optional. authority_type must match one authority type exactly. With limit, next_id parameters to paginate the results.\n\nBehavior: Read-only SELECT; does not create, update, or delete records, files, or credentials. The only effect is a database read. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. Not cached; each call reads current subscription and authority type data. Authority types with total_links of 0 are omitted.\n\nReturns: A list of authority types matching the filters, with pagination information.",
          "inputSchema": {
