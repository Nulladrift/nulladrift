        {
          "name": "list_portals",
          "description": "Lists the source portals available through this tool, with metadata such as jurisdiction and language. A jurisdiction may have multiple portals, including those maintained by regulators or ministries.\n\nWhen to use: When you need portals, legal websites, or sources for a known iso. Pass optional name, tag, or lang only to narrow that list. When not: Do not use this to read a document. For metadata use list_documents. For plain text use list_full_text. For structured Markdown use list_markdown. For a complete citation bundle use evidence_pull. For a temporary source-file URL use document_presigned_url. Do not call without an iso from list_jurisdictions. Skip if you already have this portal list for the same iso and filters.\n\nParameters: iso (required) is a jurisdiction code from list_jurisdictions (e.g. BE, or US_CA for a state). name, tag, and lang are optional and combined with AND: name is a case-insensitive substring of the portal name, tag must match one portal tag exactly, lang must match the language name exactly (e.g. English). With limit, next_id parameters to paginate the results. Empty data means the iso is outside the subscription, or no portal with crawled links matched.\n\nBehavior: Read-only SELECT; does not create, update, or delete records, files, or credentials. The only effect is a database read. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. Not cached; each call reads current subscription and portal data. Portals with total_links of 0 are omitted.\n\nReturns: A list of portals matching the filters, with pagination information.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "description": "iso is required. name, tag, and lang are optional AND filters. Scope is the authenticated subscription.",
            "properties": {
              "advanced_search": {
                "default": false,
                "description": "Advanced search enabled",
                "type": "boolean"
              },
              "iso": {
                "description": "iso (required) is a jurisdiction code from list_jurisdictions (e.g. BE, or US_CA for a state).",
                "type": "string"
              },
              "lang": {
                "description": "Exact language name, e.g. English",
                "type": "string"
              },
              "limit": {
                "description": "Number of portals to return",
                "type": "number"
              },
              "name": {
                "description": "Case-insensitive substring of the portal name",
                "type": "string"
              },
              "next_id": {
                "description": "Next portal ID to return",
                "type": "number"
              },
              "portal_id": {
                "description": "Portal ID",
                "type": "number"
              },
              "portal_tags": {
                "description": "Exact portal tag; the portal must include this tag",
                "type": "string"
              }
            },
            "required": ["iso"],
            "type": "object"
