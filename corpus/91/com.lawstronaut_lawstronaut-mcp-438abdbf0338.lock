        {
          "name": "list_subdomains",
          "description": "Lists subdomains under one domain (id, domain_id, subdomain_id, subdomain name). This is the second taxonomy step.\n\nWhen to use: When you already have a domain_id from list_domains. Examples: 'subdomains under domain A', 'international law under Private law'. Pass subdomain only to narrow by name. When not: Do not call without a domain_id from list_domains; use list_domains first. For categories under a subdomain use list_categories with subdomain_id. For subcategories use list_subcategories. For law types use list_law_types. For documents use list_documents or search. Skip if you already have this subdomain list for the same domain_id and subdomain filter.\n\nParameters: domain_id (required) is the domain reference from list_domains, such as A, and is uppercased before the query. It is not the numeric id. subdomain is an optional case-insensitive substring of the subdomain name. An unknown domain_id returns Domain not found. limit defaults to 20 and is capped at 100. next_id is the numeric id from pagination.next_id, not subdomain_id. Empty data means that domain has no matching subdomain.\n\nBehavior: Read-only SELECT; does not create, update, or delete records, files, or credentials. The only effect is a database read. Auth: tools/call requires OAuth 2.0 or a Bearer token (401 if missing, invalid, revoked, or no active subscription). Rate limits: none at the MCP layer; safe to retry. Not cached; each call reads the current subdomain table. total_count is the full match count, not the page size.\n\nReturns: A page of {id, domain_id, subdomain_id, subdomain}. Example: {\"id\":1,\"domain_id\":\"A\",\"subdomain_id\":\"A.1\",\"subdomain\":\"Private International Law\"}. Pass subdomain_id, not id, to list_categories.",
