      "instructions": "CityVistion 三维城市生成套件：NL2CGA（自然语言生成 CGA 规则）、CGA.js（CGA 编译为三维模型）、CityEngine（官方引擎解析/一键出模/官方案例库）。典型链路：nl2cga_generate_cga 生成规则 → cgajs_compile_cga 或 cityengine_parse_cga 出三维模型；也可 cityengine_generate_model 一键直达。",
      "tools": [
        {
          "name": "cgajs_compile_cga",
          "title": "Cgajs Compile Cga",
          "description": "把 CGA 规则源码编译为三维模型（GLB），经 CGA.js 云端引擎。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cga_source": {
                "description": "CGA 规则源码全文（需含 @StartRule 与 Lot 规则）。",
                "type": "string"
              },
              "download_glb": {
                "default": true,
                "description": "是否把 glb 落盘（默认 True）。",
                "type": "boolean"
              },
              "engine": {
                "default": "",
                "description": "\"\" = js（默认，×1 配额）；\"python\" = 服务器原生引擎（×3 配额，\n    对 CityEngine 方言兼容性更好）。",
                "type": "string"
              },
              "output_dir": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "glb 落盘目录。"
              }
            },
            "required": ["cga_source"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:edef667ddbe8941ffe504bc90d190a689ffdbc719639ef9d937158542eb33fa8"
        },
