        {
          "name": "cityengine_generate_cga",
          "title": "Cityengine Generate Cga",
          "description": "自然语言 → CGA 规则源码（CityEngine 网关 NL2CGA 通道，不渲染）。\n\n两种模式二选一：\n  1. text：自然语言描述，如「三层小楼，坡屋顶，底层商铺」。\n  2. base_cga + instruction：在既有 CGA 上按指令修改。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "base_cga": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "instruction": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "text": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:7469ad5ea57a755e21349eb6c61be5da12742bd472eb92e3638feb8d79721f9a"
        },
        {
          "name": "cityengine_generate_model",
          "title": "Cityengine Generate Model",
          "description": "自然语言一句话 → 直接生成三维模型（NL2CGA + CityEngine 引擎一键串联）。\n\n两种模式二选一：\n  1. text：自然语言描述，如「生成一栋 12 层现代玻璃幕墙办公楼」。\n  2. base_cga + instruction：回传既有 CGA + 修改指令，二次生成再出模型。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attributes": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "base_cga": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "download_glb": {
                "default": true,
                "type": "boolean"
              },
              "initial_shape": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "instruction": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "output_dir": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "seed": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "text": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
