{
  "lockfileVersion": 2,
  "subjects": {
    "ae.brainy.tipline/gta6": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tipline.brainy.ae/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tipline-gta6",
        "title": "Tipline: GTA 6 guide",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Unofficial Grand Theft Auto VI guide with sourced facts only. Use search_gta6_guide first, then get_gta6_entry for detail. Cite the entry url. If nothing matches, say it is not known yet; do not guess. Entries marked spoiler=true describe story content.",
      "tools": [
        {
          "name": "get_gta6_entry",
          "title": "Get one guide entry",
          "description": "Get the full text (markdown) of one Tipline entry by id, with its sources.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Entry id from search or list results, e.g. 'lucia-caminos'",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:98d159e06c34d9e0f4ba2d15f793f466f99893298e6f47f48aa0dc3e626a29ca"
        },
        {
          "name": "gta6_release_times",
          "title": "GTA 6 release time by country",
          "description": "When Grand Theft Auto VI unlocks in each country (UTC and local time), the rules behind it, and sources.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional country name or ISO code to filter, e.g. 'Brazil' or 'AE'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2fa225ab965f13e2f8587ce6d635a67b37352546953c9947fdebb7be36d8bd6b"
        },
        {
          "name": "list_gta6_entries",
          "title": "List guide entries",
          "description": "List Tipline entries (id, title, summary, url), optionally filtered by type.",
          "inputSchema": {
            "properties": {
              "type": {
                "description": "Optional entry type filter, e.g. 'vehicle'",
                "enum": ["activity", "character", "cheat", "collectible", "mission", "patch", "topic", "vehicle", "weapon", "zone"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:300730b30504a396e30792e32183da71e2f79d19e81b512b49f47ec25b5be0bf"
        },
        {
          "name": "search_gta6_guide",
          "title": "Search the GTA 6 guide",
          "description": "Search Tipline's sourced notes about Grand Theft Auto VI (characters, places, vehicles, weapons, activities, systems, release info; missions, cheats and collectibles as they are confirmed after launch). Returns short entries, each with its page URL and original sources. Only sourced facts; if nothing matches, the guide doesn't know yet.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many entries to return (1 to 10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in English, e.g. 'Ultimate Edition cars' or 'who is Cal'",
                "type": "string"
              },
              "type": {
                "description": "Optional entry type filter",
                "enum": ["activity", "character", "cheat", "collectible", "mission", "patch", "topic", "vehicle", "weapon", "zone"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8964d70710375bfafb768f2a119bc38787b07284e913e8c617883041a330fc09"
        }
      ],
      "digest": "sha256:ee7c356b444bbbb20e99f7a1acc2bb0b81042bdc6e0b37cd7c68dae82ee19d24"
    }
  }
}
