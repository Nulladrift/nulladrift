        {
          "name": "8d_audio_maker",
          "title": "8D Audio Maker",
          "description": "Pans the audio in a circle around the listener (the \"8D audio\" effect). Input: one file with a public HTTPS download_url. Optional settings for set_8d_effect: secondsPerTurn, distance. Optional outputFormat (for example mp3, wav, m4a) and bitrateKbps where the tool supports them. Returns download links for the result, which expire after 1 hour. The server downloads the file from download_url, keeps it in ihateaudio's Cloudflare R2 storage while the job runs, and processes it with the ihateaudio.com tool page in a headless browser on Cloudflare. The input is deleted when the job ends.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bitrateKbps": {
                "description": "Bitrate for lossy formats, in kbps.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "files": {
                "description": "One input media file.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "description": "Public HTTPS link to the audio or video file. The server downloads it from here.",
                      "format": "uri",
                      "type": "string"
                    },
                    "file_id": {
                      "description": "Set by ChatGPT for files shared in the chat. Other clients leave it out.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "file_name": {
                      "type": "string"
                    },
                    "mime_type": {
                      "type": "string"
                    }
                  },
                  "required": ["download_url"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "outputFormat": {
                "description": "Output format, for example mp3, wav, m4a, ogg or flac.",
                "type": "string"
              },
              "settings": {
                "additionalProperties": {},
                "description": "Parameters for set_8d_effect: secondsPerTurn, distance.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["files"],
            "type": "object"
