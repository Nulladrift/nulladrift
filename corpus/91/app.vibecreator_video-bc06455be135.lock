      "serverInfo": {
        "name": "vibecreator",
        "title": "VibeCreator",
        "version": "1.0.1",
        "websiteUrl": "https://vibecreator.app/conector/en",
        "icons": [
          {
            "src": "https://vibecreator.app/conector/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Tools for making short animated videos with VibeCreator. First call get_script_format, then write the script and call create_video. For explainers, use \"draw\" beats so the screen draws what each sentence explains. Show the returned link to the user as a markdown link, copied exactly. The video is rendered in the user's browser; nothing is stored on a server.",
      "tools": [
        {
          "name": "create_video",
          "title": "Create a VibeCreator video",
          "description": "Checks a script written in the VibeCreator format and returns a link that opens it as an animated video in the user's browser, where they can preview it, edit every part and export the MP4. The video is built from the script by code; no image or video model is used and nothing is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Optional handle shown in the video, for example \"@mychannel\".",
                "type": "string"
              },
              "character": {
                "description": "How the cast is drawn: \"cara\" = white round head with an expressive face and stick limbs (the classic viral stickman look), \"palito\" = black head with big eyes, \"desenho\" = cartoon person, \"ilustrado\" = hand-drawn people, \"anime\" = 3D anime cast, \"nenhum\" = no characters. Leave it out to keep the choice the user already made on the site.",
                "enum": ["palito", "cara", "desenho", "ilustrado", "anime", "nenhum"],
                "type": "string"
              },
              "format": {
                "description": "Frame shape. Default 9x16 (vertical).",
                "enum": ["9x16", "4x5", "1x1", "16x9"],
                "type": "string"
              },
              "script": {
                "additionalProperties": true,
                "description": "The script object described by get_script_format: { title, lang, cast, scenes: [{ place, time, mood, beats: [{ say, ... }] }], post }.",
                "type": "object"
              },
              "style": {
                "description": "Visual style id from list_styles (for example \"palito\" or \"jornal\"). Leave it out and the site picks one by topic.",
                "type": "string"
              }
            },
            "required": ["script"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create a VibeCreator video"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e0c02532ea430df39f55e2d02eef86e3cd869b05d3e12151801f2be4c84a86d"
        },
        {
          "name": "get_script_format",
          "title": "VibeCreator script format",
          "description": "Returns the full guide for writing a VibeCreator video script (one JSON object): fields, rules, places, poses, emotions, kinds of video and visual styles.",
