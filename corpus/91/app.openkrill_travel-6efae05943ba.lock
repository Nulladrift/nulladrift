        {
          "name": "get_travel_advice",
          "title": "Get travel advice",
          "description": "Use this when the user asks about the official travel advice, safety warnings or entry requirements for one country, such as \"is it safe to travel to Thailand?\" or \"what are the entry requirements for Japan?\". Returns: the UK FCDO alert (which parts of the country it advises against travelling to) with its review date and latest change, and the US State Department level (1 to 4), summary and date, with official links. Input tips: pass one country name or two-letter ISO code; set section to entry-requirements, safety or health to add that part of the UK advice. If status is ambiguous, ask the user to pick one of candidates and call again with that name. If uk or us is none or unavailable, report the other side and its link; do not guess. Not for: visa rules for other passports (UK advice is for British citizens, US advice for US citizens), medical advice, or calling a country safe in your own words.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country name in English or two-letter ISO code, such as \"Thailand\" or \"TH\". One country per call; use compare_advisories for several.",
                "examples": ["Thailand", "TH", "Japan"],
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "section": {
                "default": "summary",
                "description": "What to include from the UK advice: summary (default, alert and dates only), entry-requirements, safety or health (adds that page's text). The US summary is always included.",
                "enum": ["summary", "entry-requirements", "safety", "health"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "candidates": {
                "description": "With status ambiguous: the places the name could mean. Ask the user which one, then call again with that exact name.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "citizenship": {
                "description": "Who each government writes for. Tell the user this.",
                "type": "string"
              },
              "country": {
                "description": "The country matched.",
                "type": "string"
              },
              "license": {
                "description": "Attribution for the UK text (Open Government Licence).",
                "type": "string"
              },
              "message": {
                "description": "What to tell the user or do next when the answer is not a plain ok.",
                "type": "string"
              },
              "notice": {
                "description": "The limits of this information, to pass on.",
                "type": "string"
              },
              "query": {
                "description": "The country text as sent.",
                "type": "string"
              },
              "section": {
                "description": "The section returned.",
                "enum": ["summary", "entry-requirements", "safety", "health"],
                "type": "string"
              },
              "sources": {
                "description": "The official sources, to link in the answer.",
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["name", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "ok: see uk and us, each with its own status. not_found: no such country; check the spelling with the user. ambiguous: ask the user to pick one of candidates, then call again. unavailable: both sources are down; try again in a few minutes and give the official links. message says the next step.",
                "enum": ["ok", "not_found", "ambiguous", "unavailable"],
                "type": "string"
              },
              "uk": {
                "properties": {
                  "alertStatus": {
                    "description": "FCDO alert codes, such as avoid_all_but_essential_travel_to_parts. Empty when the FCDO advises against no travel.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "alertText": {
                    "description": "One plain sentence for each alert code, to quote as written. Holds one sentence saying no travel is advised against when there is no alert.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "latestChange": {
                    "description": "The FCDO's own note on what changed last.",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "description": "Country name as GOV.UK writes it.",
                    "type": "string"
                  },
                  "reviewedAt": {
                    "description": "When the FCDO last reviewed the advice, as an ISO 8601 time.",
                    "format": "date-time",
                    "type": ["string", "null"]
                  },
                  "section": {
                    "description": "The asked-for part of the UK advice (when section is not summary).",
                    "properties": {
                      "name": {
                        "description": "Section name, such as Entry requirements.",
                        "type": "string"
                      },
                      "text": {
                        "description": "The section text as GOV.UK writes it.",
                        "type": "string"
                      },
                      "truncated": {
                        "description": "true when the text was cut; the full text is at url.",
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  },
                  "status": {
                    "description": "ok: advice found. none: this government publishes no advisory for the place. unavailable: its source could not be read; report the other government's advice and the official link, and do not guess this one.",
                    "enum": ["ok", "none", "unavailable"],
                    "type": "string"
                  },
                  "updatedAt": {
                    "description": "When GOV.UK last published a change, as an ISO 8601 time.",
                    "format": "date-time",
                    "type": ["string", "null"]
                  },
                  "url": {
                    "description": "The GOV.UK travel advice page.",
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["status"],
                "type": "object"
              },
              "us": {
                "properties": {
                  "level": {
                    "description": "US advisory level: 1 exercise normal precautions, 2 increased caution, 3 reconsider travel, 4 do not travel. null when the advisory names no level.",
                    "maximum": 4,
                    "minimum": 1,
                    "type": ["integer", "null"]
                  },
                  "levelText": {
                    "description": "The level as the State Department words it, such as \"Level 2: Exercise Increased Caution\".",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "description": "Country name as the State Department writes it.",
                    "type": "string"
                  },
                  "status": {
                    "description": "ok: advice found. none: this government publishes no advisory for the place. unavailable: its source could not be read; report the other government's advice and the official link, and do not guess this one.",
                    "enum": ["ok", "none", "unavailable"],
                    "type": "string"
                  },
                  "summary": {
                    "description": "The advisory text as the State Department writes it.",
                    "type": "string"
                  },
                  "summaryTruncated": {
                    "description": "true when the summary was cut; the full text is at url.",
                    "type": "boolean"
                  },
                  "updated": {
                    "description": "When the State Department last updated the advisory, as an ISO 8601 time.",
                    "format": "date-time",
                    "type": ["string", "null"]
                  },
                  "url": {
                    "description": "The US State Department advisory page.",
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["status"],
                "type": "object"
              }
            },
            "required": ["citizenship", "license", "notice", "query", "sources", "status"],
            "type": "object"
          },
