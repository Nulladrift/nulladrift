{
  "lockfileVersion": 2,
  "subjects": {
    "app.openkrill/travel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://travel.openkrill.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "travel",
        "title": "Travel Check: Travel advice and airports",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Travel Check: Travel advice and airports. Use these tools for questions about official government travel advice for a country and about current airport conditions. For one country, call get_travel_advice with the country name or ISO code; set section to entry-requirements, safety or health when the user asks about one of those. For several countries, call compare_advisories with up to five. For an airport, call get_airport_status with its IATA or ICAO code. Always give the user the dates and the source links, and say that UK advice is written for British citizens and US advice for US citizens, so entry rules for other passports can differ. Do not claim a country is safe or unsafe in your own words: quote the advisory level or alert as the government states it. Do not give visa, medical or legal advice, and do not present airport weather as a flight-planning source. If a result is ambiguous, ask the user which of the candidates they mean and call again; in compare_advisories check each country's own status. If the UK or US half is none or unavailable, report the other half and the official link, and do not guess. FAA delay information covers US airports only, and no tool looks up a flight by number. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "compare_advisories",
          "title": "Compare travel advisories",
          "description": "Use this when the user wants to compare the travel advice for several countries side by side, such as \"compare Mexico, Colombia and Peru\" or \"which of these countries has the highest advisory level?\". Returns: for each country the UK FCDO alert and review date and the US State Department level (1 to 4) and date, with official links. Input tips: pass 1 to 5 country names or ISO codes. Check each country's own status: one can be not_found, or ambiguous with candidates to ask the user about, while the rest are ok. If uk or us is none or unavailable for a country, report the other side and its link; do not guess. Not for: the full text of one country (use get_travel_advice) or visa rules for other passports. UK advice is for British citizens and US advice for US citizens.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "Country names in English or two-letter ISO codes, 1 to 5, such as [\"Mexico\", \"Colombia\", \"PE\"]. Repeats are removed.",
                "examples": [
                  ["Mexico", "Colombia", "Peru"]
                ],
                "items": {
                  "maxLength": 80,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["countries"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "citizenship": {
                "description": "Who each government writes for. Tell the user this.",
                "type": "string"
              },
              "countries": {
                "description": "One entry per country asked for, in the same order. Check each entry's status: a batch can mix ok, not_found and ambiguous.",
                "items": {
                  "properties": {
                    "candidates": {
                      "description": "With status ambiguous: the places the name could mean. Ask the user which one, then call again with that exact name.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "country": {
                      "description": "The country matched.",
                      "type": "string"
                    },
                    "query": {
                      "description": "The country text as sent.",
                      "type": "string"
                    },
                    "status": {
                      "description": "ok: see uk and us. not_found: no such country; check the spelling with the user. ambiguous: ask the user to pick one of candidates, then call again.",
                      "enum": ["ok", "not_found", "ambiguous", "unavailable"],
                      "type": "string"
                    },
                    "uk": {
                      "properties": {
                        "alertText": {
                          "description": "All FCDO alerts as one string of plain sentences, to quote as written. get_travel_advice returns the same sentences as a list.",
                          "type": "string"
                        },
                        "reviewedAt": {
                          "description": "When the FCDO last reviewed the advice, as an ISO 8601 time.",
                          "format": "date-time",
                          "type": ["string", "null"]
                        },
                        "status": {
                          "description": "ok: advice found. none: this government publishes no advisory for the place. unavailable: its source could not be read; report the other government's advice and the official link, and do not guess this one.",
                          "enum": ["ok", "none", "unavailable"],
                          "type": "string"
                        },
                        "url": {
                          "description": "The GOV.UK travel advice page.",
                          "format": "uri",
                          "type": "string"
                        }
                      },
                      "required": ["status"],
                      "type": "object"
                    },
                    "us": {
                      "properties": {
                        "level": {
                          "description": "US advisory level: 1 exercise normal precautions, 2 increased caution, 3 reconsider travel, 4 do not travel. null when the advisory names no level.",
                          "maximum": 4,
                          "minimum": 1,
                          "type": ["integer", "null"]
                        },
                        "levelText": {
                          "description": "The level as the State Department words it, such as \"Level 2: Exercise Increased Caution\".",
                          "type": ["string", "null"]
                        },
                        "status": {
                          "description": "ok: advice found. none: this government publishes no advisory for the place. unavailable: its source could not be read; report the other government's advice and the official link, and do not guess this one.",
                          "enum": ["ok", "none", "unavailable"],
                          "type": "string"
                        },
                        "updated": {
                          "description": "When the State Department last updated the advisory, as an ISO 8601 time.",
                          "format": "date-time",
                          "type": ["string", "null"]
                        },
                        "url": {
                          "description": "The US State Department advisory page.",
                          "format": "uri",
                          "type": "string"
                        }
                      },
                      "required": ["status"],
                      "type": "object"
                    }
                  },
                  "required": ["query", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "license": {
                "description": "Attribution for the UK text (Open Government Licence).",
                "type": "string"
              },
              "message": {
                "description": "What to tell the user or do next when status is unavailable.",
                "type": "string"
              },
              "notice": {
                "description": "The limits of this information, to pass on.",
                "type": "string"
              },
              "sources": {
                "description": "The official sources, to link in the answer.",
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["name", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "ok: see each country's own status. unavailable: both sources are down; try again in a few minutes and give the official links.",
                "enum": ["ok", "unavailable"],
                "type": "string"
              }
            },
            "required": ["citizenship", "countries", "license", "notice", "sources", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Compared travel advisories",
            "openai/toolInvocation/invoking": "Comparing travel advisories..."
          },
          "digest": "sha256:c1c7bb0008ffa726846a6bcd03fc9b8d8b4bac217287eb28304c1d303b776291"
        },
        {
          "name": "get_airport_status",
          "title": "Get airport status",
          "description": "Use this when the user asks about airport delays, closures or weather right now, such as \"is JFK delayed?\" or \"what is the weather at Heathrow?\". Returns: active FAA delays, ground stops and closures with reason and times (US airports only), the latest METAR observation (flight category, temperature, wind, visibility) and the raw TAF forecast. Input tips: pass the four-letter ICAO code (EGLL) for an airport outside the US, or the IATA code (JFK) for a US airport. If status is not_found, ask the user for the ICAO code and call again. Not for: looking up a flight by number (such as BA117), schedules, seats or whether a flight will leave on time, or for flight planning.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airport": {
                "description": "Airport code, 3 or 4 letters: the four-letter ICAO code such as \"EGLL\" (London Heathrow) for an airport outside the US, or the three-letter IATA code such as \"JFK\" for a US airport. Not a city name or a flight number.",
                "examples": ["EGLL", "JFK", "KORD"],
                "pattern": "^[A-Za-z][A-Za-z0-9]{2,3}$",
                "type": "string"
              }
            },
            "required": ["airport"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "airport": {
                "description": "The code as sent, in capitals.",
                "type": "string"
              },
              "faa": {
                "description": "FAA delays. US airports only.",
                "properties": {
                  "delays": {
                    "items": {
                      "properties": {
                        "detail": {
                          "description": "Average, shortest and longest delay and the trend, when given.",
                          "type": ["string", "null"]
                        },
                        "reason": {
                          "description": "The FAA's stated reason, such as weather or volume.",
                          "type": ["string", "null"]
                        },
                        "since": {
                          "description": "Start time as the FAA writes it (free text, not ISO).",
                          "type": ["string", "null"]
                        },
                        "type": {
                          "description": "The FAA program, such as Ground Stop, Ground Delay or Airport Closure, with arrival or departure when given.",
                          "type": "string"
                        },
                        "until": {
                          "description": "Expected end or reopening time as the FAA writes it (free text, not ISO).",
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["type"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "status": {
                    "description": "ok: delays lists every active FAA delay (empty means none). unavailable: the FAA feed could not be read, so say the delays are unknown and do not guess them. not_applicable: the airport is outside the US, so the FAA has no data.",
                    "enum": ["ok", "unavailable", "not_applicable"],
                    "type": "string"
                  },
                  "updated": {
                    "description": "When the FAA feed was updated, as the FAA writes it, such as \"Sat Oct 10 17:02:57 2026 GMT\".",
                    "type": ["string", "null"]
                  }
                },
                "required": ["status"],
                "type": "object"
              },
              "icao": {
                "description": "The ICAO code used for the weather, such as KJFK.",
                "type": "string"
              },
              "message": {
                "description": "What to tell the user or do next when status is not ok.",
                "type": "string"
              },
              "metar": {
                "description": "The latest weather observation, or null when the station has none.",
                "properties": {
                  "flightCategory": {
                    "description": "VFR (good), MVFR (marginal), IFR (low cloud or poor visibility) or LIFR (very low), as the Aviation Weather Center sets it.",
                    "type": ["string", "null"]
                  },
                  "observedAt": {
                    "description": "When the observation was made, as an ISO 8601 UTC time.",
                    "format": "date-time",
                    "type": ["string", "null"]
                  },
                  "raw": {
                    "description": "The METAR report as published.",
                    "type": "string"
                  },
                  "station": {
                    "description": "Station name, such as New York/JF Kennedy Intl, NY, US.",
                    "type": ["string", "null"]
                  },
                  "temperatureC": {
                    "description": "Air temperature in degrees Celsius.",
                    "type": ["number", "null"]
                  },
                  "visibility": {
                    "description": "Visibility in statute miles, such as \"10+ statute miles\".",
                    "type": ["string", "null"]
                  },
                  "wind": {
                    "description": "Wind direction and speed in knots, such as \"200° at 7 kt\", or \"calm\".",
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "notice": {
                "description": "The limits of this information: not for flight planning.",
                "type": "string"
              },
              "sources": {
                "description": "The official sources, to link in the answer.",
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["name", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "ok: see faa, metar and tafRaw. not_found: no station for that code; ask the user for the four-letter ICAO code and call again. invalid: the code is not 3 or 4 letters. unavailable: a source is down; try again in a few minutes. message says the next step.",
                "enum": ["ok", "not_found", "invalid", "unavailable"],
                "type": "string"
              },
              "tafRaw": {
                "description": "The raw TAF forecast as published, or null when there is none.",
                "type": ["string", "null"]
              }
            },
            "required": ["airport", "notice", "sources", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Checked airport delays and weather",
            "openai/toolInvocation/invoking": "Checking airport delays and weather..."
          },
          "digest": "sha256:1aa85704d31a1a759982fa3f2cda457e16bf6f718c8a9730c821c77a779648a9"
        },
        {
