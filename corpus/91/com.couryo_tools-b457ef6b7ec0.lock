{
  "lockfileVersion": 2,
  "subjects": {
    "com.couryo/tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.couryo.com/tools"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "couryo-free-tools",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_domain_dns",
          "title": "Check a domain's email DNS / Verificar SPF, DKIM e DMARC",
          "description": "Checks the email setup of any domain: SPF (one record, ending, the 10 DNS lookup limit), DKIM on the common selectors (or dkim_selector), DMARC policy and reports, MX and mailbox provider, MTA-STS, TLS-RPT and BIMI. Answers a 0 to 100 score, a grade, the fix for each problem in plain words and records ready to copy. Free, read only. / Confere SPF, DKIM, DMARC e MX de qualquer domínio, com nota e a correção de cada problema.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "dkim_selector": {
                "description": "A DKIM selector to look up besides the common ones (the s= of the DKIM-Signature header)",
                "type": "string"
              },
              "domain": {
                "description": "e.g. \"example.com\" (a URL or an address also works)",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:06e2eb3c6aa272efa622ecf0a85c0f2e6b2ff3b245f569193d96697143ac6369"
        },
        {
          "name": "explain_smtp_error",
          "title": "Explain an SMTP error / Explicar erro de e-mail",
          "description": "Explains a bounce or SMTP error text (\"550 5.7.515 Access denied\", \"452 4.2.2 mailbox full\") in plain words: hard (the address does not work), soft (temporary) or policy (a provider rule, not the address), the provider and the next step. Free, read only. / Explica uma devolução ou erro SMTP em linguagem simples, com o próximo passo.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "message": {
                "description": "The error or bounce text, as it came",
                "maxLength": 4000,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0cc93be9c19294bd309c0e18e00e9f3d7d0da1d152402a947a3c9bdc8ad83df9"
        },
        {
          "name": "generate_dmarc",
          "title": "Generate a DMARC record / Gerar registro DMARC",
          "description": "Builds one DMARC record (TXT at _dmarc.<domain>). Start with policy none and a report address (rua), read the reports, then move to quarantine and reject once every legitimate sender passes SPF or DKIM aligned. Free, no network. / Monta o registro DMARC; comece com p=none e suba para quarantine e reject.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "The domain, to name the record",
                "type": "string"
              },
              "pct": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "policy": {
                "enum": ["none", "quarantine", "reject"],
                "type": "string"
              },
              "rua": {
                "description": "Address for the aggregate reports",
                "type": "string"
              },
              "subdomain_policy": {
                "enum": ["none", "quarantine", "reject"],
                "type": "string"
              }
            },
            "required": ["domain", "policy"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2a2f65650adc511394cc068590da6faffeb4486474cb02c8d1e76cb4aee24068"
        },
        {
          "name": "generate_spf",
          "title": "Generate an SPF record / Gerar registro SPF",
          "description": "Builds one SPF record (TXT at the domain) from the services that send for it: includes, IPv4 and IPv6, mx and a. Starts with ~all (softfail), the safe choice; use policy fail (-all) once every sender is listed. Remember the limit of 10 DNS lookups (each include costs at least one). Free, no network. / Monta o registro SPF a partir dos serviços que enviam pelo domínio.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "a": {
                "description": "The domain's own address may send",
                "type": "boolean"
              },
              "includes": {
                "description": "include: hosts, e.g. [\"_spf.google.com\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ip4": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ip6": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "mx": {
                "description": "Servers in the domain's MX may send",
                "type": "boolean"
              },
              "policy": {
                "enum": ["softfail", "fail", "neutral"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4cfab2ab1fe3cb2f8d7d68eb3c5cca5a1aeafab1177148b9bdc2aff487f0435b"
        },
        {
          "name": "verify_email",
          "title": "Verify an email address / Verificar e-mail",
          "description": "Checks one email address without sending anything: format, typo in big providers (\"gmail.com.br\" → \"gmail.com\", \"hotmial.com\"), disposable inbox, shared mailbox (contato@, sales@) and whether the domain receives email (MX). Verdict valid, risky or invalid, with did_you_mean. The mailbox itself is never probed. Free, read only. / Confere um endereço sem enviar nada: formato, erro de digitação, e-mail temporário, caixa compartilhada e se o domínio recebe e-mail.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "The address to check",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cadaf59fd66d352ec9b39ac18eb343cf3cd8ab77323d945d580fde9825ca0479"
        },
        {
          "name": "verify_emails",
          "title": "Verify up to 100 email addresses / Verificar até 100 e-mails",
          "description": "Batch of verify_email: the same checks for up to 100 addresses at once, one verdict each (valid, risky, invalid) plus the totals. Run it before a send and drop invalid and disposable addresses. Each address counts in the daily limit. Free, read only. / Confere até 100 endereços de uma vez antes de um envio.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "emails": {
                "description": "1 to 100 addresses",
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["emails"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e4630803c872623c0d2305d7d9ede35942df095dda9ed622a96922efae04b627"
        }
      ],
      "digest": "sha256:3513bbc077fb583994f9e77433457b9ed8f7defb9b92f96338635685ccd846bc"
    }
  }
}
