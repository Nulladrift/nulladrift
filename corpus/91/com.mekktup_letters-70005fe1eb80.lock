      "instructions": "mekktup: online mektup yazma ve gönderme (Türkiye; cezaevi, askeri birlik, kurum, ev/iş adresi; PTT ile). Akış: get_options → (cezaevi/kurum için) search_destinations → quote_letter → create_letter → kullanıcıya handoff_url'i ver. Kullanıcı bağlantıyı tarayıcıda açar, mektubu okur, eksikleri ve ekleri tamamlar, giriş yapar ve kartla öder. Sen ödeme yapmaz, dosya yüklemez, T.C. kimlik no / telefon uydurmazsın. Fiyatı yalnız quote_letter / create_letter sonucundan söyle (kuruş; 1 TL = 100; KDV dahil). Cezaevi mektubunda alıcı baba adı ve katalogdan cezaevi (recipient_destination_id) zorunlu; yasak içerik (tehdit, suç, şifreli mesaj) yazma. create_letter yanıtındaki token'ı sakla: update_letter / get_letter onunla çalışır. Kaynaklar (resources): sayfalar, SSS, blog yazıları, cezaevi rehberi (mekktup://cezaevleri → il → mekktup://cezaevi/{slug}: adres, görüş günleri, koğuşlar).",
