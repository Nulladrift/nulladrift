        {
          "name": "gpucloud_create_server",
          "title": "Launch a server (spends money)",
          "description": "Launches a GPU server billed to the account. Requires the confirmationToken of gpucloud_quote_server for exactly these arguments and the key caps. Neither a card nor the automatic reload is required when the credits pay the first hour; the saved card is charged (and then needed) only for missing credits (at least $25, or the automatic reload amount when larger) or a monthly / annual order. Without enough funds (no credit and no usable card, or a cap reached) it returns a tool error with httpStatus 402 and accountAction (code PAYMENT_REQUIRED; BUDGET_CAP_REACHED for a cap) carrying the message and the console link to fix it; the quote itself never carries a payment link. Hourly: the answer carries onFundsExhausted and, when the automatic reload is off, autoReloadWarning. The owner receives an email for every spend. [SPENDS MONEY] (permission: servers:create) [Requires a free GPU Cloud account and MCP key]",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmationToken": {
                "description": "Token returned by the previous (quote) call, valid 10 minutes, single use.",
                "maxLength": 64,
                "minLength": 16,
                "type": "string"
              },
              "cycle": {
                "default": "hourly",
                "description": "hourly: first hour from credits, then billed per hour. monthly / annual: first month charged to the saved card.",
                "enum": ["hourly", "monthly", "annual"],
                "type": "string"
              },
              "name": {
                "description": "Display name of the server.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "onFundsExhausted": {
                "description": "Hourly servers: what happens when the balance runs short and no automatic reload brings it back. HIBERNATE (default): hibernated at its threshold (its GPU place is kept, hourly hibernation fee), restarted as soon as the balance is back. DELETE: no hibernation fee, kept running while the balance pays its next hour, then stopped. Machines that cannot be hibernated (spot) are always DELETE. A server is never deleted while the account has credit left. When the balance covers only about 24 hours of what the account spends per hour, a first notice is sent while the servers still run, then two more about 24 hours and 1 hour before the deletion; a server is deleted with its data only once it is out of service (stopped or hibernated for lack of credit, or hibernated by the user for at least 72 hours), once the credit is exhausted (the balance no longer pays the next hour of the account's servers), after the three notices and at least 24 hours after the first. Adding credits cancels the deletion.",
                "enum": ["HIBERNATE", "DELETE"],
                "type": "string"
              },
              "productId": {
                "description": "GPU product id (gpucloud_list_products).",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "default": "canada-montreal",
                "description": "Region id (gpucloud_list_regions), default canada-montreal.",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              },
              "sshKeyId": {
                "description": "SSH key id (gpucloud_list_ssh_keys).",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "templateId": {
                "description": "Optional one-click template installed at creation (gpucloud_list_templates): jupyter, ollama-openwebui, vllm, comfyui, pytorch.",
                "enum": ["jupyter", "ollama-openwebui", "vllm", "comfyui", "pytorch"],
                "type": "string"
              },
              "templateModel": {
                "description": "Model served by the vllm template (gpucloud_list_templates models[].id); default: the first one.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["confirmationToken", "productId", "sshKeyId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
