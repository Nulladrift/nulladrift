        {
          "name": "gpucloud_reserve_server",
          "title": "Reserve a GPU (automatic launch when back in stock)",
          "description": "Reserves a GPU machine that is out of stock: GPU Cloud launches the server AUTOMATICALLY as soon as it is back (machines are gone in 1 to 2 minutes), before other customers (first come, first served per machine). Requires a saved credit card (else httpStatus 402 PAYMENT_REQUIRED with the card link: an AI never enters card details), the user's explicit agreement (consent: true) and a maximum hourly price. The automatic reload is not required: the answer carries onFundsExhausted (the action at the threshold, chosen with the onFundsExhausted argument) and, when the reload is off, autoReloadWarning (show its message to the user). At launch, if the balance does not cover the first hour plus the hibernation threshold, only the missing amount is charged to the saved card; then the server is billed by the hour. Nothing is charged when reserving. [SPENDS MONEY] (permission: servers:reserve) [Requires a free GPU Cloud account and MCP key]",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acceptAlternative": {
                "description": "true: an equivalent machine (same usage, at least the same GPU memory, never spot) may be launched when the exact one is not in stock. Default false: this exact machine only.",
                "type": "boolean"
              },
              "consent": {
                "description": "true ONLY once the user explicitly agreed to: \"I authorize GPU Cloud to launch this server as soon as it is available, to charge my saved card the amount needed if my balance is not enough, then to bill it by the hour under the terms.\" (version 2026-10-10). Without it nothing is reserved.",
                "type": "boolean"
              },
              "maxHourlyCad": {
                "description": "Highest hourly price (CAD) the user accepts: at least the current price (gpucloud_get_product), at most 5 times it. Above it at launch time, the reservation waits.",
                "type": "number"
              },
              "name": {
                "description": "Server name (letters, digits, space, dot, dash, underscore).",
                "maxLength": 63,
                "minLength": 1,
                "type": "string"
              },
              "onFundsExhausted": {
                "description": "What happens to the launched server when the balance runs short: HIBERNATE (default: hibernated at its threshold with an hourly hibernation fee, restarted when the balance is back) or DELETE (no hibernation fee, kept running while the balance pays its next hour, then stopped). Spot machines are always DELETE. A server is never deleted while the account has credit left. When the balance covers only about 24 hours of what the account spends per hour, a first notice is sent while the servers still run, then two more about 24 hours and 1 hour before the deletion; a server is deleted with its data only once it is out of service (stopped or hibernated for lack of credit, or hibernated by the user for at least 72 hours), once the credit is exhausted (the balance no longer pays the next hour of the account's servers), after the three notices and at least 24 hours after the first. Adding credits cancels the deletion.",
                "enum": ["HIBERNATE", "DELETE"],
                "type": "string"
              },
              "productId": {
                "description": "Exact GPU machine to reserve (model and size, gpucloud_list_products), e.g. one shown out of stock.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
