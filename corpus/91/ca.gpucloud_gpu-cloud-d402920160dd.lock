        {
          "name": "gpucloud_set_auto_reload",
          "title": "Change auto-reload",
          "description": "Turns automatic credit reload on/off. Needs canCharge; the reload amount may not exceed the key max single charge, and every reload counts in this key monthly card-charge cap and in the account budget limit. Turning it on (or changing it while on) takes two steps: without confirmationToken returns the settings and a token; call again with the same arguments and the token once the user approved. Turning it off applies at once. Threshold $10-$5,000, amount $25-$10,000 (turning it off may repeat the amount already saved, as gpucloud_get_auto_reload returns it). monthlyCapCad: the most the automatic reloads may charge per calendar month (Montreal time), $25-$100,000, null = no cap, absent = unchanged (200 for a new configuration); once reached, no automatic reload until next month and the user is told. It never limits a manual payment. [SPENDS MONEY] (permission: billing:auto_reload) [Requires a free GPU Cloud account and MCP key]",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmationToken": {
                "description": "Token returned by the previous call (valid 10 minutes, single use).",
                "maxLength": 64,
                "minLength": 16,
                "type": "string"
              },
              "enabled": {
                "type": "boolean"
              },
              "monthlyCapCad": {
                "anyOf": [
                  {
                    "maximum": 100000,
                    "minimum": 25,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "reloadAmountCad": {
                "maximum": 10000,
                "minimum": 25,
                "type": "number"
              },
              "thresholdCad": {
                "maximum": 5000,
                "minimum": 10,
                "type": "number"
              }
            },
            "required": ["enabled", "reloadAmountCad", "thresholdCad"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Change auto-reload"
          },
          "behavior": {
