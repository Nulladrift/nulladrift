                "default": "ingress",
                "enum": ["ingress", "egress"],
                "type": "string"
              },
              "ethertype": {
                "default": "IPv4",
                "enum": ["IPv4", "IPv6"],
                "type": "string"
              },
              "portRangeMax": {
                "maximum": 65535,
                "minimum": 1,
                "type": "integer"
              },
              "portRangeMin": {
                "maximum": 65535,
                "minimum": 1,
                "type": "integer"
