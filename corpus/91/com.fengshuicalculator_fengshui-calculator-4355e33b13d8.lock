{
  "lockfileVersion": 2,
  "subjects": {
    "com.fengshuicalculator/fengshui-calculator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fengshuicalculator.com/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "fengshuicalculator",
        "title": "Fengshui Calculator",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Traditional Chinese calendar and feng shui computation (BaZi pillars, solar terms, Ming Gua, flying stars). All results carry provenance (engine version + ruleset + SHA-256 input digest) and are for cultural/educational use — not predictions. Docs: https://fengshuicalculator.com/docs/mcp/",
      "tools": [
        {
          "name": "calendar",
          "description": "Chinese calendar for a date: lunar date (with leap month), zodiac, day officer 建除, yellow/black path, six-day cycle — computed on Beijing time",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD, 1901–2199; defaults to today (Beijing)",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:274c9ef7e69754aefcf56be494cf4f651e592c4b9dc14508f88ed29a970457ff"
        },
        {
          "name": "flying_star_chart",
          "description": "Xuan Kong flying star natal chart: nine palaces with mountain/facing/period stars plus classical pattern labels (e.g. 旺山旺向). Period from a construction date, or explicit yun",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "when yun is omitted: the construction date whose period is used",
                "type": "string"
              },
              "kind": {
                "enum": ["xiagua", "tigua"],
                "type": "string"
              },
              "sitting": {
                "description": "sitting mountain: index 0–23 or Chinese name 子癸丑艮寅甲卯乙辰巽巳丙午丁未坤申庚酉辛戌乾亥壬",
                "type": "string"
              },
              "yun": {
                "description": "period 1–9; omit to use the period of the reference date",
                "type": "integer"
              }
            },
            "required": ["sitting"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:001e824e39dcba33c15a13a6c42d1d58391d57476f1d7918ca49ff17fc8da5ed"
        },
        {
          "name": "form_analysis",
          "description": "Indoor form-sha from a floor-plan wireframe: 穿堂煞 (door-window alignment), 缺角 (nine-palace missing corners), 厕占中宫 (toilet at centre) — plus optional fusion with the Eight Mansions house stars and Ming Gua. Grade B verdicts, no aggregate score",
          "inputSchema": {
            "properties": {
              "birth_year": {
                "description": "birth year for Ming Gua (enables personal palace stars + 宅命配)",
                "type": "integer"
              },
              "gender": {
                "enum": ["male", "female"],
                "type": "string"
              },
              "minggua_convention": {
                "enum": ["standard", "gen"],
                "type": "string"
              },
              "plan": {
                "description": "floor-plan wireframe: { exterior: [[x,y]...], rooms: [{kind, polygon}], openings: [{kind, a, b, is_entry}], walls: [[a,b]...] } in meters (y axis = north by drafting convention)",
                "type": "object"
              },
              "rotation_deg": {
                "description": "plan y-axis deviation from true north, clockwise — must come from compass measurement",
                "type": "number"
              },
              "sitting_index": {
                "description": "sitting mountain index 0–23 (0 = 子), enables Eight Mansions fusion",
                "type": "integer"
              }
            },
            "required": ["plan"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:63a480cee7d398659d2e5632dbbd74e301beb8111c8f92d86a7daa77adcf944f"
        },
        {
          "name": "ganzhi",
          "description": "Four pillars (BaZi) for a date+hour, returned under BOTH year conventions (Lichun vs Lunar New Year) × BOTH day boundaries (midnight vs 23:00) — differences are shown, not hidden",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "hour": {
                "description": "0–23; defaults to noon",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:538d50af0f568b0aa6dcdfb093201e6adfba925d21e5338bb3ea162a63e8a2f2"
        },
        {
          "name": "kua_number",
          "description": "Ming Gua (Kua number) from birth date + gender, with the Lichun year boundary computed astronomically, five-yellow substitution conventions, and eight favourable/unfavourable directions",
          "inputSchema": {
            "properties": {
              "convention": {
                "description": "five-yellow substitution: standard = male Kun/female Gen; gen = both Gen",
                "enum": ["standard", "gen"],
                "type": "string"
              },
              "date": {
                "description": "birth date YYYY-MM-DD",
                "type": "string"
              },
              "gender": {
                "enum": ["male", "female"],
                "type": "string"
              },
              "hour": {
                "type": "integer"
              },
              "minute": {
                "type": "integer"
              }
            },
            "required": ["gender"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7247f004a2fe39420ad8f4989d961dd6cd5dd0396b8b6625dd13391fc3f78b0b"
        },
        {
          "name": "replay",
          "description": "Verifiability as an API call: recompute a stored request and compare its SHA-256 input digest (JCS-canonicalised) against an expected value — byte-identical reproduction or honest mismatch",
          "inputSchema": {
            "properties": {
              "engine_version": {
                "description": "snapshot engine version; mismatch → 409-style error",
                "type": "string"
              },
              "expected_input_digest": {
                "description": "64-hex SHA-256 from the report being verified",
                "type": "string"
              },
              "request": {
                "description": "the original kernel request JSON",
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6671974aa8bc2beb5f5c74d59d83b9e0f07adc614283a1f808d80de20fc55252"
        },
        {
          "name": "rulesets",
          "description": "List the rule sets the kernel actually implements, with parameters and honest review_state — nothing not implemented is advertised",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:79bf98502044e3a69e392cfc53bdcb98d0beedd6d42a01607566bdf83082a822"
        },
        {
          "name": "solar_terms",
          "description": "All 24 solar terms of a year with exact Beijing instants. Model: VSOP87D apparent solar longitude + nutation + aberration + ΔT; root tolerance 1e-7 day (~8.6 ms); verified against an independent JPL DE441-based reconstruction. ΔT and midnight-margin uncertainty flags included.",
          "inputSchema": {
            "properties": {
              "year": {
                "description": "1901–2199",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bbb4ae9e72df6c592debcc6e3bbc414b8171676566cefb22731338440c0a68ad"
        },
        {
          "name": "sun_position",
          "description": "Sun azimuth/elevation for a location and instant (solar compass numeric base): azimuth 0=north clockwise, geometric vs apparent (Sæmundsson refraction) elevation, declination, hour angle, explicit polar day/night state — measurement link only, no direction is inferred from photos",
          "inputSchema": {
            "properties": {
              "at": {
                "description": "Unix seconds or ISO 8601; defaults to now. Pass explicitly for a reproducible input_digest",
                "type": "string"
              },
              "lat": {
                "description": "latitude in degrees, [-90, 90]",
                "type": "number"
              },
              "lon": {
                "description": "longitude in degrees, [-180, 180], east-positive",
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1fc89416086ae6e8406553199895d00f7bf6e5ef216eb06de30e365c78916002"
        },
        {
          "name": "terrain_white_tiger",
          "description": "White tiger elevation check (白虎抬头) from a DEM-derived 360-bin skyline: compares the right (white tiger) vs left (azure dragon) sector elevation within ±45° of the sitting direction",
          "inputSchema": {
            "properties": {
              "sitting_azimuth_deg": {
                "description": "sitting direction azimuth (0 = north, clockwise)",
                "type": "number"
              },
              "skyline_360": {
                "description": "360 elevation angles (degrees), one per azimuth degree",
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
            "required": ["sitting_azimuth_deg", "skyline_360"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:313a51ae5241092b82d4dbb51992d6f42c00fe320c4229cfae11883276dc49d6"
        },
        {
          "name": "yun_period",
          "description": "San Yuan period (三元九运, 1–9) for a date; periods switch at Lichun, anchored 1984 = start of Period 7",
          "inputSchema": {
            "properties": {
              "date": {
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ab41076e03f7e8ffaa2e15dc9cddc3810379d737afc54ac54b099f924862846f"
        }
      ],
      "digest": "sha256:317fa7fe381186a1670665769c58ca0727ed15ef30c41b4c74ab8ffc5582f3ab"
    }
  }
}
