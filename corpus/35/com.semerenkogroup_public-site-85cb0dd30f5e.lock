        {
          "name": "sem.calc_invest_score",
          "title": "Israel property investment score",
          "description": "Scores a budget + goal + Israeli city against the Semerenko market dataset (nadlan.gov.il Israel Tax Authority transactions, 203 cities). Returns the 0-100 fit score, citywide benchmark price/rent/yield, purchase tax estimate, and verdict. Use sem.market_cities for the exact city list.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Total budget in ILS (500,000 - 15,000,000)",
                "type": "number"
              },
              "city": {
                "description": "Any of the 203 Israeli benchmark cities, English name (e.g. Tel Aviv-Yafo, Netanya, Ra'anana)",
                "type": "string"
              },
              "goal": {
                "description": "What the buyer wants to do",
                "enum": ["live", "invest", "rent_out"],
                "type": "string"
              }
            },
            "required": ["budget", "city", "goal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6225176105b9aa67496247ce0a5aead412ecb5d027503cb4b552890cd34abe91"
        },
        {
          "name": "sem.calc_seller_net_proceeds",
          "title": "Israel seller net proceeds calculator",
          "description": "Computes estimated net proceeds for selling an Israeli home: agent fee with 18% VAT, legal costs, estimated mas shevach (25% of the CPI-indexed real gain, with the only-home exemption and its ₪5,008,000 ceiling), mortgage payoff, and other costs.",
          "inputSchema": {
            "properties": {
              "agentPct": {
                "description": "Agent fee percent before VAT (default 2)",
                "type": "number"
              },
              "expenses": {
                "description": "Documented deductible expenses in ILS",
                "type": "number"
              },
              "legal": {
                "description": "Legal and closing costs in ILS (default 18000)",
                "type": "number"
              },
              "misc": {
                "description": "Moving and other costs in ILS",
                "type": "number"
              },
              "mortgagePayoff": {
                "description": "Remaining mortgage to pay off in ILS",
                "type": "number"
              },
              "onlyHome": {
                "description": "Is this the seller's only home (default yes)",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "prepayPenalty": {
                "description": "Early mortgage repayment penalty in ILS",
                "type": "number"
              },
              "purchasePrice": {
                "description": "Original purchase price in ILS",
                "type": "number"
              },
              "purchaseYear": {
                "description": "Year purchased, 2000-2026 (default 2015)",
                "type": "number"
              },
              "salePrice": {
                "description": "Expected sale price in ILS (required)",
                "type": "number"
              },
              "taxes": {
                "description": "Betterment levy or other taxes in ILS",
                "type": "number"
              }
            },
            "required": ["salePrice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85909140a3f7372a507c987c2ef836ecc823b7c06183ade35ac8edcab8d5983f"
        },
        {
          "name": "sem.find_related",
          "title": "Find related content and internal-link targets",
          "description": "Given a topic, draft title, or existing URL, returns the most relevant existing public pages ranked by a 0-1 relevance score, each tagged duplicate_risk (link or update instead of writing new), related (good internal-link target), or weak. Top-level recommendation says whether to write new or consolidate. Use this BEFORE writing new content to avoid cannibalization and to pick internal links. Title/keyword/category scoring only - no external calls, no AI cost.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum related pages to return. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "Topic, keywords, or draft title for the content you intend to write. Required unless \"url\" is given.",
                "type": "string"
              },
              "type": {
                "description": "Optional content-type filter. Default \"any\".",
                "enum": ["any", "post", "page", "listings", "market-insight"],
                "type": "string"
              },
              "url": {
                "description": "Optional existing Semerenko URL; its title and excerpt seed the topic and it is excluded from results.",
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "duplicateRiskUrl": {
                "type": ["string", "null"]
              },
              "recommendation": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "categories": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "excerpt": {
                      "type": "string"
                    },
                    "id": {
                      "type": "integer"
                    },
                    "modified": {
                      "type": "string"
                    },
                    "readApi": {
                      "format": "uri",
                      "type": "string"
                    },
                    "recommendation": {
                      "type": "string"
                    },
                    "score": {
                      "type": "number"
                    },
                    "title": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "suggestedInternalLinks": {
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "type": "array"
              },
              "topic": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
