{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kwekuanansi/day-names": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kwekuanansi.ai/mcp/day-names"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "kweku-anansi-day-names",
        "title": "Akan Day Names",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Akan Day Names gives the Ghanaian (Akan) name a person carries for the weekday they were born on, in its common Asante Twi and Fante forms. When a date of birth is given, call day_names.for_date so the weekday is worked out rather than guessed. Say that spellings vary by family and area. Do not add meanings or personality traits the tool did not return.",
      "tools": [
        {
          "name": "day_names.for_date",
          "title": "Akan day name for a birth date",
          "description": "Use this when someone gives a date of birth and asks for their Akan or Ghanaian day name (for example \"what is my Ghanaian name, I was born on 6 March 1994\"), or asks what day name a baby born on a date would have. It works out the weekday itself; do not guess the weekday first. Do not use it for names from other naming traditions, for the meaning of a surname, or for horoscopes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date_of_birth": {
                "description": "The date of birth as YYYY-MM-DD, for example 1994-03-06.",
                "maxLength": 40,
                "type": "string"
              },
              "sex": {
                "description": "Leave out to get both the girl's and the boy's name.",
                "enum": ["female", "male"],
                "type": "string"
              }
            },
            "required": ["date_of_birth"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "akan_day": {
                "type": "string"
              },
              "appellation": {
                "type": "string"
              },
              "date_of_birth": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "female": {
                "type": "object"
              },
              "male": {
                "type": "object"
              },
              "note": {
                "type": "string"
              },
              "weekday": {
                "type": "string"
              }
            },
            "required": ["akan_day", "date_of_birth", "note", "weekday"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:686be36eee19a8326f6cc0781736f8f61d8d37c2fbbfa43ab065259daafb1bd0"
        },
        {
          "name": "day_names.for_weekday",
          "title": "Akan day names for a weekday",
          "description": "Use this when someone already knows the weekday and asks for the Akan day names for it (for example \"what are the Akan names for someone born on a Friday\"), or asks what weekday an Akan day name such as Kofi or Akosua belongs to. Do not use it when a date of birth is given: use day_names.for_date so the weekday is worked out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "An Akan day name to look up instead, for example \"Kofi\" or \"Akosua\".",
                "maxLength": 40,
                "type": "string"
              },
              "sex": {
                "description": "Leave out to get both.",
                "enum": ["female", "male"],
                "type": "string"
              },
              "weekday": {
                "description": "The weekday in English.",
                "enum": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "akan_day": {
                "type": "string"
              },
              "appellation": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "female": {
                "type": "object"
              },
              "male": {
                "type": "object"
              },
              "note": {
                "type": "string"
              },
              "weekday": {
                "type": "string"
              }
            },
            "required": ["akan_day", "note", "weekday"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfc3705edeaf8e3841a703a2cfc7f37e3cb0a592b62c745966cd80d67665c635"
        }
      ],
      "digest": "sha256:2566b56932514e2530b528a31cf66602b6b7aad4ba651baa41396ae399aa879a"
    }
  }
}
