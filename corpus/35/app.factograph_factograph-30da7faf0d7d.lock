        {
          "name": "startStep",
          "title": "Start a step in the person's store",
          "description": "Start a step - propose, add, documents, ask or remove - in a private store, with its JSON body, as the manual says. propose stores nothing; add stores only facts the person approved, with propose's proposal_id and their reply as confirmation; remove deletes only with confirm true, after the person confirmed. Returns the step's state: `waiting` (a prompt to do and answer with replyToPrompt), `running` (call getStep), `done` (do what `next` says) or `failed`.",
          "inputSchema": {
            "properties": {
              "body": {
                "properties": {
                  "confirm": {
                    "description": "remove: true to delete, after the person confirmed.",
                    "type": "boolean"
                  },
                  "confirmation": {
                    "description": "add: the person's approving reply, quoted.",
                    "type": "string"
                  },
                  "conversation_id": {
                    "description": "add: from propose's result.",
                    "type": "string"
                  },
                  "facts": {
                    "description": "add: the approved facts. remove: fact ids, F<n> numbers or exact words.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "keep_both": {
                    "description": "add: [new fact, stored fact] pairs the person says are both true.",
                    "items": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "part_of": {
                    "description": "documents: the first part's document_id, for every later part. Send parts in order, one at a time, each after the previous part's result.",
                    "type": "string"
                  },
                  "proposal_id": {
                    "description": "add: from propose's result.",
                    "type": "string"
                  },
                  "question": {
                    "description": "ask: the question.",
                    "type": "string"
                  },
                  "replace": {
                    "description": "add: stored fact ids the person chose to replace.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "text": {
                    "description": "propose: the person's message. documents: the document's text, or one part of it - at most the manual's per-call limit; longer text goes in parts.",
                    "type": "string"
                  },
                  "title": {
                    "description": "documents: the document's title.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "step": {
                "description": "The step to run.",
                "enum": ["propose", "add", "documents", "ask", "remove"],
                "type": "string"
              },
              "store": {
                "description": "The person's private store link, as they gave it: https://.../api/k/<id> or https://.../#/store/<id>. Public links are read-only.",
                "type": "string"
              }
            },
            "required": ["body", "step", "store"],
            "type": "object"
