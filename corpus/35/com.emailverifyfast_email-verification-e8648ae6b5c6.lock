{
  "lockfileVersion": 2,
  "subjects": {
    "com.emailverifyfast/email-verification": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.emailverifyfast.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "emailverifyfast",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_credits",
          "title": "Check account and usage",
          "description": "Confirm the EmailVerifyFast API key works and summarise recent usage (lists and addresses submitted). The EVF API does not yet expose an exact remaining-credit balance; free accounts include 100 checks once, and the dashboard shows the exact balance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c44497cb1ace0952f13b18b60ad960c2106eacd0de1c184699041804f27dbebc"
        },
        {
          "name": "get_results",
          "title": "Get results for a verification job",
          "description": "Fetch progress and results for a job_id returned by verify_email or verify_list. Results are paged (50 per page); optionally filter by status.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "job_id": {
                "description": "The job_id returned by verify_email or verify_list",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Results page (50 per page)",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "description": "Only return results with this status",
                "enum": ["valid", "invalid", "catch_all", "accepted", "unknown", "pending", "processing", "cancelled"],
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:86d51ba5bea39554f89109ac3ee28b40d8afd0817bd7938a77ceaed442e01b26"
        },
        {
          "name": "verify_email",
          "title": "Verify one email address",
          "description": "Check whether a single email address is deliverable using EmailVerifyFast (syntax, domain/MX and SMTP mailbox checks). Uses one verification credit. Waits up to wait_seconds for the result; if it is still running, returns a job_id to pass to get_results.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "email": {
                "description": "The email address to verify",
                "maxLength": 320,
                "minLength": 3,
                "type": "string"
              },
              "wait_seconds": {
                "default": 25,
                "description": "How long to wait for the result (0-45 s)",
                "maximum": 45,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:28715d6fe3710b5fc77710f73b81549110ac834c9bcb3211a293a4deb926eceb"
        },
        {
          "name": "verify_list",
          "title": "Verify a list of email addresses",
          "description": "Submit up to 500 email addresses as one EmailVerifyFast job (duplicates are removed; uses one credit per unique address). Waits up to wait_seconds; returns results if finished, otherwise a job_id and progress counts to use with get_results. For larger lists, split into batches or upload a CSV at https://emailverifyfast.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "emails": {
                "description": "Email addresses to verify (max 500)",
                "items": {
                  "maxLength": 320,
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "name": {
                "default": "MCP list",
                "description": "A name for this list in the EmailVerifyFast dashboard",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "wait_seconds": {
                "default": 30,
                "description": "How long to wait before returning (0-45 s)",
                "maximum": 45,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["emails"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:27db92c107ee9b693b61ba2ecd314285de844c4ad31f77983e5feb414a42b9cb"
        }
      ],
      "digest": "sha256:9117d3cc001bfaeb05b111f2a7e9561239be1c25219c6a5e10dab7603d32af5c"
    }
  }
}
