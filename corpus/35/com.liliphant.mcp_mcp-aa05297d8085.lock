        {
          "name": "call_any_api_of_liliphant",
          "description": "Send a POST, PUT, PATCH or DELETE request to any Liliphant API API endpoint for the user and return its response. Use it once you know the exact endpoint: look it up with get_liliphant_api_docs first to get its URL, headers, query params and body, unless the skill or a dedicated tool on this server already gives them exactly. Load the quickstart-liliphant skill first: it explains which tool to use when. For GET requests use call_any_read_api_of_liliphant. Pass the full url with path variables filled in, the headers the docs list, query params in `query` (not in the url) and the JSON body in `body`. For the auth header the docs name (Authorization, proxy_auth_token, x-api-key, ...), pass it with an empty value \"\": the signed-in user's token is filled in automatically. Never put a real or made-up token there; if the docs name no auth header, leave it out and the token is sent as Authorization. If the API needs the user to sign in, they're asked the first time. Returns { status, ok, headers, data }: the HTTP status and the response body, including error details on failure.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "body": {
                "additionalProperties": {},
                "description": "JSON request body, as the endpoint's docs show it. Leave it out when the endpoint takes no body.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "headers": {
                "additionalProperties": {},
                "description": "Request headers as name/value pairs, as the docs list them. Give the auth header (Authorization, proxy_auth_token, x-api-key, ...) an empty value \"\" so the signed-in user's token is filled in; never put a token here yourself. Pass {} when the endpoint needs no headers. Example: {\"proxy_auth_token\": \"\", \"Content-Type\": \"application/json\"}",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "method": {
                "description": "HTTP method from the endpoint's docs",
                "enum": ["POST", "PUT", "PATCH", "DELETE"],
                "type": "string"
              },
              "query": {
                "additionalProperties": {},
                "description": "Query params as name/value pairs; an array sends the param once per item. Example: {\"type\": \"flow\", \"bringflows\": true}",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "url": {
                "description": "Full endpoint URL with path variables replaced by real values, e.g. https://api.example.com/users/42. Put query params in `query`, not here.",
                "type": "string"
              }
            },
            "required": ["headers", "method", "url"],
            "type": "object"
          },
