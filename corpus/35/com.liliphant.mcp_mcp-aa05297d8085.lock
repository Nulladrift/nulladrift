        {
          "name": "ask_a_question",
          "description": "Answers a plain-language question from the company's processed meetings, with a headline, a short answer, an optional chart and the quotes it is based on. Use it whenever someone asks what was said, decided or promised in their meetings. Leave out meetingId to search every meeting the asker may see; set it to answer from one meeting only.\n\nWho may call it: any member of the company. An owner or admin asks over every meeting in the company; a member asks only over the meetings they may see (ones they booked or were invited to, plus their teams' meetings). The company comes from the x-company-id header. meetingId comes from List Meetings (meetings[].id).\n\nThis is slow: a minute is normal and up to three minutes happens, so allow a long timeout.\n\nA question it cannot answer is still a 200 with chart null and the reason in body: \"No conversations in this company yet\" when the company has no processed meetings or meetingId names a meeting that does not exist or that the asker may not see; \"No conversation covers that yet\" when nothing matches; \"Could not answer that\" when the engine fails, with the reason in body and any failures in warnings and a \"What went wrong\" block in detail.\n\ntags narrow a company-wide question to meetings carrying any of those tags or topic names. Each tag is normalised before matching: trimmed, upper-cased, spaces and underscores turned into dashes, other characters dropped, so \"Renewal terms\" matches the topic \"Renewal terms\". tags are ignored when meetingId is set.\n\nid is the same for the same question (case and spacing ignored) and the same meetingId, so it can be used to keep the answer on the board with Keep Question on Board. Quotes are only traced to transcript lines in this company's meetings; one that cannot be traced keeps its words with affiliation \"from the conversation\" and no meetingId.\n\nErrors: 400 VALIDATION_FAILED for a missing, too short or too long question, an empty or too long meetingId, a tag over 40 characters or with no letter or digit, more than 10 tags, or any other field; 401 when the token is missing or expired; 403 SPENDING_STOPPED when a Liliphant admin stopped this company's AI answers. POST https://meet-analyzer-api.50agents.com/api/v1/ui/ask",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "meetingId": {
                "type": "string"
              },
              "question": {
                "type": "string"
              },
              "tags": {
                "description": "e.g. [\"\"]",
                "items": {},
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ask a question"
          },
          "behavior": {
