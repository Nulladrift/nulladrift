        {
          "name": "get_me",
          "description": "Returns who is signed in and every company they can open, with their role in each. This is the first call a client makes after sign-in: almost every other call needs a company id from companies[].id.\n\nAny signed-in person may call it. It also does housekeeping on the way: it makes sure the person's personal company exists and turns any email invitations waiting for them into memberships, so a company someone was just added to shows up here.\n\nThe x-company-id header is optional here. currentCompanyId tells you which company the server will use for requests that send this header; with no header, or one naming a company the person is not in, it falls back to their personal company instead of failing.\n\nOther fields: companyLimit is how many companies a person may create (null means no limit) and companiesCreated is how many they have created so far, for a \"New company\" button. onboardedAt on each company is null until its setup is finished. paused on each company lists what a Liliphant admin has stopped there because it costs money (recording, processing, ask, automations); empty means nothing is, and ask means AI answers are refused, so a screen can say so instead of offering them. operator is true for the people who may open the admin panel. logoUrl and brandColor appear on a company whose profile has a website that Things of Brand knows; both are left out otherwise. hasMeetings is true once the current company has at least one meeting (one still being processed counts); until then the app shows only the first-meeting screen and Settings.\n\nErrors: 401 NOT_SIGNED_IN when no token is sent; 401 SESSION_EXPIRED when the token is no longer valid. GET https://meet-analyzer-api.50agents.com/api/v1/ui/me",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get me"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:abb89ef1572631ae50def1d586677316ab47efe0e91d2111c585986f0574fcf6"
        },
        {
          "name": "list_meetings",
          "description": "Lists the analysed meetings the caller may see, as cards, newest first, with the filter choices the Meetings screen offers. Use it to show or search the meeting list, and to find a meetingId for Get Meeting, Get Meeting Transcript, Get Share Link or the notes routes (meetings[].id).\n\nAny member of the company may call it, but what comes back depends on their role. An owner or admin sees every meeting in the company. A member sees only the meetings they booked or were invited to, plus every meeting of each team they are in (only their own when they are in no team). It never returns meetings from a company other than the one named in x-company-id.\n\nPaging: send limit (1 to 100) to get pages. When there are more results, nextCursor holds a token; pass it back as cursor to get the next page. nextCursor is null on the last page. Without limit, every matching meeting comes back in one response. Never build a cursor yourself.\n\nThe first page (no cursor) also carries the extras: filters (the types, tags, people and teams that actually occur, each with a count), totals (all meetings the caller may see, and how many of them still need attention, ignoring the filters) and processing (up to 50 meetings the caller may see that are still being analysed, newest first). On later pages filters and totals are null and processing is empty, so keep the first page's copy. meetingCount is the number of matches across all pages. In filters.people, team is true for someone who was ever on the company's side of a call.\n\nFilters combine: q searches title, headline, summary, type, tag, a participant's name or email, a team's name, or an exact meeting id; type, tag and person take values from filters; teamId limits to meetings booked by or with that team's members (an id from filters.teams[].value); within keeps meetings from the last N days; from and to pick a custom date range instead; status is open (still needs something) or handled.\n\nTeam filter: an owner or admin may pass any of the company's teams. A member may pass only a team they are in, and filters.teams lists only their teams.\n\nA company with no meetings gets an empty list, not an error.\n\nErrors: 400 VALIDATION_FAILED when a query value is out of range, a date cannot be read, or the cursor is not one this server issued; 401 when not signed in or the sign-in expired; 404 TEAM_NOT_FOUND when teamId is not one of this company's teams, or (for a member) not a team they are in. GET https://meet-analyzer-api.50agents.com/api/v1/ui/meetings?q=&type=&person=&tag=&teamId=&within=&from=&to=&status=&cursor=&limit=",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cursor": {
                "description": "Optional. The nextCursor from the previous page. Omit for the first page",
                "type": "string"
              },
              "from": {
                "description": "Optional. Start of a custom date range, a date or date-time (ISO 8601), inclusive. Either end may be left open",
                "type": "string"
              },
              "limit": {
                "description": "Optional. Page size, 1 to 100. Omit to get every matching meeting at once",
                "type": "string"
              },
              "person": {
                "description": "Optional. A participant's name, a value from filters.people[].value",
                "type": "string"
              },
              "q": {
                "description": "Optional. Free-text search, up to 200 characters. Matches title, headline, summary, type, tag, a participant's name or email, a team's name, or an exact meeting id",
                "type": "string"
              },
              "status": {
                "description": "Optional. open (still needs something) or handled",
                "type": "string"
              },
              "tag": {
                "description": "Optional. A tag, a value from filters.tags[].value",
                "type": "string"
              },
              "teamId": {
                "description": "Optional. A team id from filters.teams[].value. Keeps meetings that team's members booked or were invited to. A member may only pass a team they are in",
                "type": "string"
              },
              "to": {
                "description": "Optional. End of a custom date range, a date or date-time (ISO 8601), exclusive",
                "type": "string"
              },
              "type": {
                "description": "Optional. Meeting type, a value from filters.types[].value, e.g. SALES, SUPPORT, PARTNERSHIP, MARKETING, INTERNAL",
                "type": "string"
              },
              "within": {
                "description": "Optional. Whole number 1 to 3650: only meetings that started within this many days",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List meetings"
          },
          "behavior": {
            "destructive": false,
