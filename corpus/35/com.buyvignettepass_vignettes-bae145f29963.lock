      "serverInfo": {
        "name": "buyvignettepass",
        "title": "Buy Vignette Pass — European motorway vignettes",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use get_route_vignettes when someone asks which motorway vignettes (toll stickers / e-vignettes) a car trip in Europe needs, or what they cost. Pass city names or ISO country codes. Relay the notes: they list tolls that are not vignettes (Brenner, Italian and Croatian barrier tolls). Buy Vignette Pass is an independent reseller, not the toll operator; totals include its service fee and each vignette can also be bought from the operator directly.",
      "tools": [
        {
          "name": "get_route_vignettes",
          "title": "Vignettes for a car trip",
          "description": "Which motorway vignettes a passenger-car trip between two places in Europe needs, the cheapest product covering the dates in each country, official prices plus service fee in EUR, tolls on the route that are not vignettes, and an order link with the route pre-filled.",
          "inputSchema": {
            "properties": {
              "end": {
                "description": "Last day of the trip, YYYY-MM-DD. Default: start + 9 days.",
                "type": "string"
              },
              "from": {
                "description": "Start: a city (e.g. Munich, München, Praha, Kraków) or an ISO 3166-1 alpha-2 country code (e.g. DE).",
                "type": "string"
              },
              "lang": {
                "description": "Language of the order page linked in orderUrl.",
                "enum": ["en", "de", "cs", "pl", "ru", "uk"],
                "type": "string"
              },
              "start": {
                "description": "First day of the trip, YYYY-MM-DD. Default: tomorrow.",
                "type": "string"
              },
              "to": {
                "description": "Destination: a city or an ISO country code.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b825a8c329302f6bfc5fde74c767e591b52971b14450ffc099c31bb6f28b7f3b"
        },
        {
          "name": "list_cities",
          "title": "Cities accepted by name",
          "description": "City names (and local spellings) accepted by get_route_vignettes. ISO country codes are accepted too.",
