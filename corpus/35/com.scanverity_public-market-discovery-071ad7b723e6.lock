    "com.scanverity/public-market-discovery": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scanverity.com/mcp-discovery"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "scanverity-public-discovery",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Search public prediction-market identities for a user question, then offer written EUR100 one-contract research, EUR100 one-authorized-rule QA, EUR500 up-to-five-authorized-rules QA or a scoped Team quote. Market search is free and accountless here; it is not an assessment, live odds, investment advice or a payment. Match exact contract and deadline; do not invent absent results. This public connector cannot request or read private assessments. A quote request is not a purchase.",
      "tools": [
        {
          "name": "scanverity_offers",
          "title": "Find Scanverity report prices and written ordering paths",
          "description": "Use this public tool when a user asks about Scanverity prices, products, access, written research, agent ordering or what to do without an approved customer account, including a single Polymarket contract review or a larger multi-contract research engagement. Public information only: returns the written EUR100 single-report quote path, the EUR100 one-authorized-own-rule QA option, the EUR500 up-to-five-authorized-own-rule-set QA pilot, a separate team-research quote path with no fixed published price, the EUR19 agent-order guide, and current API availability (new paid API pilots are closed). It does not create an account, order, report, invoice or charge. A quote request and an MCP connection are not purchases.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b53cd5c4f018dcc6d765c965b42bd1b6ec9c2b2dc472c2f13903bb1f505ebb3d"
        },
        {
          "name": "scanverity_search_markets",
          "title": "Find prediction markets for a topic or question",
          "description": "Use this account-free, read-only search when a user asks which prediction markets cover a topic, forecast, event deadline or settlement question. Search short keywords and show exact contracts, IDs, source links, deadlines and any verified outcomes. Results are a bounded identity search, not a resolution assessment, live odds, profit forecast or guarantee that absent markets do not exist. Ask the user to select one contract; for deeper written research use scanverity_offers and its EUR100 quote route. This public connector cannot request a paid report or take payment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cursor": {
                "description": "Exact next_cursor from the previous page with the same query, dates and limit. An empty truncated page is not proof of absence.",
                "maxLength": 2048,
                "type": "string"
              },
              "end_date_from": {
                "description": "Earliest scheduled end date, YYYY-MM-DD; defaults to today UTC. Only active rows from the available identity source.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "end_date_to": {
                "description": "Latest scheduled end date, YYYY-MM-DD; set when the user specifies a horizon.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "description": "Maximum contracts on this page, default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A short topic or keyword from the user question; omit personal information. Prefer English market wording. Do not pass a full URL or a long conversational prompt.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f8ed17d8f98533d3f1edcbf495387f9c9fc01d52912d93d896c305f401df0bab"
        }
      ],
      "digest": "sha256:8203f597f3384460145dbff73971936ae89834c6c210ce9a1c3696a945f1603c"
    }
  }
}
