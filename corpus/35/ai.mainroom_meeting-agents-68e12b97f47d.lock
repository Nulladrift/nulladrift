{
  "lockfileVersion": 2,
  "subjects": {
    "ai.mainroom/meeting-agents": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.mainroom.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mainroom",
        "title": "Mainroom — AI agents for live meetings",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Mainroom puts AI agents into live Google Meet / Teams / Zoom calls as speaking, presenting participants. Use send_demo_agent to put its demo agent into a meeting happening now (a human admits it from the lobby); about_mainroom explains the rest. list_relationships / get_relationship_history read the account and team history the user's own agents have built up (needs their Mainroom API key from the History page).",
      "tools": [
        {
          "name": "about_mainroom",
          "description": "What Mainroom is: AI agents that join live Google Meet / Teams / Zoom calls as real participants (voice, slides, live demos, research, memory, follow-up emails). Explains how humans invite agents, and how AI assistants can dispatch the demo agent, join a meeting themselves, or send the user's delegate and follow the call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8c546dfb2eb1b4738f644466b83b1a34c708f7283d2f2669e72856117cf835df"
        },
        {
          "name": "delegate_to_meeting",
          "description": "DELEGATE: send the user's own stand-in into a live meeting they can't attend. The delegate joins as a named participant, introduces itself as standing in for them, listens, relays their positions from the brief, asks the questions they need answered at natural moments, and hands every decision back to them. Afterwards a report of what they missed lands in their inbox. Needs the user's Mainroom API key (History page at https://app.mainroom.ai). Returns a session id: poll meeting_status with it to follow the call live (transcript, running summary, answers so far) and to get the final summary once it ends. Use when your user says 'cover this meeting for me', 'I can't make the 3pm', 'send someone in my place'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "The user's Mainroom API key (mr_...).",
                "type": "string"
              },
              "brief": {
                "description": "What the user wants the room to know: their positions, context, what they'd say if asked. The delegate relays this and nothing beyond it. Up to 4000 chars.",
                "type": "string"
              },
              "meeting_url": {
                "description": "Full join URL of the live meeting (Google Meet, Zoom, Microsoft Teams, or Webex).",
                "type": "string"
              },
              "persona_name": {
                "description": "The delegate's own first name (default Reese).",
                "type": "string"
              },
              "principal_name": {
                "description": "The user's name as the room knows them (e.g. 'Taylor'). The delegate speaks of them by this name.",
                "type": "string"
              },
              "questions": {
                "description": "Up to 10 questions the user needs answered on this call. The delegate asks each at a natural moment and records the answer.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "rehearse": {
                "description": "Set up the delegate and a session WITHOUT joining any meeting — to check the brief and the setup. Nothing is dispatched.",
                "type": "boolean"
              },
              "voice": {
                "description": "TTS voice (default sage).",
                "enum": ["alloy", "ash", "coral", "echo", "fable", "onyx", "nova", "sage", "shimmer", "verse"],
                "type": "string"
              }
            },
            "required": ["api_key", "meeting_url", "principal_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d9038c564ab25e6dbbad9ae0b023015a0c7e3f1ffb5a8ddbed503d9a6671a033"
        },
        {
          "name": "get_relationship_history",
          "description": "HISTORY: everything the user's Mainroom agents recorded with one account, team, or person: what is still open (commitments with owners and due dates, unanswered questions, risks), the proposed / approved follow-up actions, and a session-by-session timeline with summaries, decisions, and pre-call briefs. Use it to answer 'where are we with Acme', 'what did we promise them', 'what did the team decide last week', or to prep for the next call. Needs the user's Mainroom API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "The user's Mainroom API key (mr_...).",
                "type": "string"
              },
              "relationship": {
                "description": "Account / team / person name, or a key from list_relationships.",
                "type": "string"
              },
              "sessions": {
                "description": "How many recent sessions to include in the timeline (default 6).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["api_key", "relationship"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:26d73be48d18de2f85d1b9be21bf52c80e4668fa3f726d55d7ad5ecf5498d313"
        },
        {
          "name": "join_meeting_as",
          "description": "EMBODIMENT: join a live meeting AS YOURSELF (or as a persona you define). This gives an AI agent a meeting body — a named participant with a camera tile and a voice that joins the call, speaks when addressed, presents slides, shows images, and reads/posts meeting chat. You supply the name and the persona instructions (who you are, what you're there to do, what you know); Mainroom supplies the body. The participant appears in the meeting lobby within ~a minute and a human must admit it. Ephemeral: no account, no memory, nothing emailed afterwards. Use when your user says 'join my call', 'be in the meeting', or you need to talk to people in a live meeting to complete a task.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "The display name for your meeting body (e.g. 'Claude', 'Atlas — Research Agent'). Shown on the tile and the roster.",
                "type": "string"
              },
              "instructions": {
                "description": "Persona + mission, second person ('You are... You're joining this call to...'). Include what you know and how to behave. Up to 2000 chars.",
                "type": "string"
              },
              "intro": {
                "description": "Optional one-paragraph welcome posted into the meeting chat when you join (say who you are and why you're there).",
                "type": "string"
              },
              "meeting_url": {
                "description": "Full join URL of the live meeting (Google Meet, Zoom, Microsoft Teams, or Webex).",
                "type": "string"
              },
              "voice": {
                "description": "TTS voice (default alloy).",
                "enum": ["alloy", "ash", "coral", "echo", "fable", "onyx", "nova", "sage", "shimmer", "verse"],
                "type": "string"
              }
            },
            "required": ["agent_name", "instructions", "meeting_url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90273c52a2c38dbfbe97aaa209b446e96bb4eb791057b2781debffbc6a4cd7a9"
        },
        {
          "name": "list_agent_templates",
          "description": "List Mainroom's built-in agent types (facilitator, timekeeper, sales support, mock interviewer, ...).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1cccab9c3535cce5761de514767feadc1a326bf2303908635d421f3a55a7382d"
        },
        {
          "name": "list_relationships",
          "description": "HISTORY: list the customer accounts, recurring team meetings, and people that the user's own Mainroom agents have sat in meetings with — with session counts, when they last met, and how many commitments / open questions / risks are still open. Needs the user's Mainroom API key (shown on the History page at https://app.mainroom.ai — they paste it once). Follow with get_relationship_history for the detail.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "The user's Mainroom API key (mr_...), from the History page in the app.",
                "type": "string"
              },
              "query": {
                "description": "Optional name filter (account, team, or person).",
                "type": "string"
              }
            },
            "required": ["api_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:99db75f028e70750fb41ad8447d1d4d14dd76810d73f0faa531468af2d80446e"
        },
        {
          "name": "meeting_status",
          "description": "FOLLOW A MEETING: what the user's agent (a delegate, or any of their agents) is seeing in a meeting right now, or what it recorded once the call ended — the last lines of transcript, the running summary, answers to the user's questions so far, decisions and commitments, and whether the bot is still waiting in the lobby. Call without a session id to list the user's recent and live sessions. Needs the user's Mainroom API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "The user's Mainroom API key (mr_...).",
                "type": "string"
              },
              "lines": {
                "description": "How many recent transcript lines to include (default 40).",
                "maximum": 200,
                "minimum": 5,
                "type": "integer"
              },
              "session": {
                "description": "Session id from delegate_to_meeting (or from this tool's list). Omit to list recent sessions.",
                "type": "string"
              }
            },
            "required": ["api_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:70c75fe1ceeff0885836bfa82912dddf206fb8bc937b711091167d1fd018760c"
        },
        {
          "name": "send_demo_agent",
          "description": "Send Mainroom's open demo agent into a live meeting RIGHT NOW. Give it a Google Meet, Microsoft Teams, Zoom, or Webex meeting URL; the agent appears in the meeting lobby within about a minute and a human in the meeting must admit it. It introduces itself, answers questions by voice, presents slides, and can run a live browser demo. Use when your user wants an AI participant in a meeting that is happening now. No account needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "meeting_url": {
                "description": "Full join URL of the live meeting (https://meet.google.com/..., https://...zoom.us/j/..., https://teams.microsoft.com/l/meetup-join/...).",
                "type": "string"
              }
            },
            "required": ["meeting_url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:088558a4c605b2484321a0471071edf51a46185faf6cd6143d6afdbecf5c3dd8"
        }
      ],
      "digest": "sha256:052718acde9a93bc2c5dd9b732dbf01cd3fddfbc4a6e1bd0a1bf756de47085c1"
    }
  }
}
