      "instructions": "Read/Link only. Same SSOT as WebMCP. No forms. Canonical https://www.ikeytz.com. ai-train=no. initialize serverInfo.version 1.0.0 is protocol identity — not the catalog. Official registry com.ikeytz/website v1.0.20. npm @ikeytz/mcp@1.1.54 is the CLI, not this HTTP server. Prices: GET /llms.txt or tools/call get_prices — not initialize.",
      "tools": [
        {
          "name": "compose_mailto",
          "title": "Compose Mailto",
          "description": "WHAT: mailto:info@ikeytz.com with the SAME prefab as compose_whatsapp (subject+body). option = contactOption of one of the 10 end-invoices, or cylinder_mount, or beratung. Call with {} → beratung (empty advice template), not a bare mailbox with no text. Does not send email. Partner mailbox is on get_partner_info.partnerEmail (not this href).",
          "inputSchema": {
            "properties": {
              "option": {
                "description": "Same ids as compose_whatsapp. Omit = beratung template, still a prefab.",
                "enum": ["opening_slam_day", "opening_slam_night", "opening_locked_day", "opening_locked_night", "pkg_key_slam_day", "pkg_key_slam_night", "pkg_key_locked_day", "pkg_key_locked_night", "cylinder_only_day", "cylinder_only_night", "cylinder_mount", "beratung", "zugefallen", "abgeschlossen", "zylinder"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Always the same envelope. tools/call returns content[0].text = summary (or JSON) AND structuredContent = this object. On success ok=true with summary + canonicalUrl + extra fields. On failure ok=false with error (snake_case code) and hint (recovery URL). Never writes, never submits forms, never calls /api/*. Attribution must be kept when quoting. Policy: ai-input yes with attribution; ai-train=no.",
            "properties": {
              "ambiguous": {
                "type": "boolean"
              },
              "amountEur": {
                "type": ["number", "null"]
              },
              "attribution": {
                "description": "Required citation: 'Quelle: Schlüsseldienst Ludwigsburg ikeytz (ikeytz.com) · ai-train=no · https://www.ikeytz.com/.well-known/ai.txt'",
                "type": "string"
              },
              "canonicalUrl": {
                "description": "Best URL to show the user: https://www.ikeytz.com… page, or tel:+49…, mailto:…, https://wa.me/…. Prefer this over constructing URLs.",
                "type": "string"
              },
              "error": {
                "description": "Present when ok=false. Codes include: unknown_tool, unknown_place, unknown_auswahl, unknown_ratgeber, unknown_doc, unknown_discovery, faq_not_found, wissen_not_found, serp_not_found, q_required, bad_datetime, bad_when_key, plus HTTP errors from fetch.",
                "type": "string"
              },
              "hint": {
                "description": "Present when ok=false. Absolute URL the agent should open or pass to get_ai_page / get_discovery.",
                "type": "string"
              },
              "href": {
                "description": "mailto:info@ikeytz.com?subject=…&body=…",
                "type": "string"
              },
              "isEndInvoice": {
                "type": "boolean"
              },
              "locale": {
                "description": "Locale actually used for URLs (args.locale or de).",
                "enum": ["de", "en", "fr", "ru", "fa", "ar", "tr"],
                "type": "string"
              },
              "ok": {
                "description": "true = use summary, canonicalUrl, and extra keys. false = do not invent data; read error + hint and retry with valid args or open hint.",
                "type": "boolean"
              },
              "option": {
                "description": "Resolved contactOption id",
                "type": "string"
              },
              "related": {
                "description": "Always includes https://www.ikeytz.com/llms.txt. Geo tools also include https://maps.ikeytz.com/llms.txt.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "type": "array"
              },
              "situationKey": {
                "type": ["string", "null"]
              },
              "subject": {
                "type": "string"
              },
              "summary": {
                "description": "Primary text for the model. For discovery tools this is the file window (possibly thousands of characters). For list tools a compact one-liner. Quote with attribution.",
                "type": "string"
              },
              "tool": {
                "description": "Echo of the tool name that produced this object (e.g. get_service_area).",
                "type": "string"
              },
              "whenKey": {
                "type": ["string", "null"]
              }
            },
            "required": ["attribution", "ok", "tool"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Compose Mailto"
