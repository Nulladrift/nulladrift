                "properties": {
                  "countries": {
                    "type": "array"
                  },
                  "country_groups": {
                    "type": "array"
                  },
                  "crypto": {
                    "type": "array"
                  },
                  "currencies": {
                    "type": "array"
                  },
                  "etf_exposures": {
                    "type": "array"
                  },
                  "exchanges": {
                    "type": "array"
                  },
                  "exclude_leveraged": {
                    "type": "boolean"
                  },
                  "index": {
                    "type": "array"
                  },
                  "industries": {
                    "type": "array"
                  },
