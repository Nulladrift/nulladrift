                    "cash_weight": {
                      "type": ["number", "null"]
                    },
                    "disclosure": {
                      "additionalProperties": false,
                      "description": "The disclosure that applies to this book: paper-money values are hypothetical, a live book's are from stored snapshots.",
                      "properties": {
                        "hypothetical": {
                          "type": "boolean"
                        },
                        "short": {
                          "maxLength": 240,
                          "type": "string"
                        }
                      },
                      "required": ["hypothetical", "short"],
                      "type": "object"
                    },
                    "environment": {
                      "enum": ["demo", "real", null],
                      "type": ["string", "null"]
                    },
                    "holdings": {
                      "items": {
                        "$ref": "#/$defs/Holding"
                      },
                      "type": "array"
                    },
                    "holdings_total": {
                      "type": "integer"
                    },
                    "hypothetical": {
