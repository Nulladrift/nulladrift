            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "A previous next_cursor.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Page size.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "The language of this conversation.",
                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              },
              "mode": {
                "default": "any",
                "description": "Kind of strategy. archived: deleted and still restorable.",
                "enum": ["any", "draft", "paper", "live", "archived"],
                "type": "string"
              },
              "name_contains": {
                "description": "Case-insensitive part of the name.",
                "maxLength": 100,
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Experience": {
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
              },
              "Holding": {
                "additionalProperties": false,
                "properties": {
                  "asset_class": {
                    "type": ["string", "null"]
                  },
                  "name": {
                    "type": ["string", "null"]
                  },
                  "symbol": {
                    "type": "string"
                  },
                  "weight": {
                    "description": "Fraction of the book, 0.05 is 5%.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
