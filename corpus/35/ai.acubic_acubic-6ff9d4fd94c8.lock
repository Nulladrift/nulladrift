                        "maximum": 100,
                        "minimum": 0,
                        "type": ["number", "null"]
                      },
                      "poll_after_seconds": {
                        "type": "integer"
                      },
                      "started_at": {
                        "type": ["string", "null"]
                      }
                    },
                    "type": ["object", "null"]
                  },
