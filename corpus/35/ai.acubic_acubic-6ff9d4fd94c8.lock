        {
          "name": "acubic_get_portfolio",
          "title": "Get my portfolio positions",
          "description": "Returns holdings, value, return since activation and the last rebalance outcome of the person's live or paper-money strategies, from Acubic's latest daily snapshot (as_of); it does not contact the broker and never returns credentials or account numbers. Use it for how a running portfolio is doing; to start automating use acubic_go_live.",
