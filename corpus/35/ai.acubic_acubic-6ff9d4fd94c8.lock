        {
          "name": "acubic_lookup_instrument",
          "title": "Look up an instrument",
          "description": "Looks up a stock, ETF, crypto asset or currency pair by ticker, ISIN or name: its identity, whether it is in Acubic's tradable universe, whether eToro and Trading 212 list it, and any equivalent product Acubic substitutes (e.g. a UCITS ETF). Identity only: no price, return or rating. To filter many by metrics use acubic_screen_universe.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_class": {
                "description": "Limit to one asset class.",
                "enum": ["equity", "etf", "crypto", "fx"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Maximum matches.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "The language of this conversation.",
                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              },
              "query": {
                "description": "A ticker (AAPL, BTCUSD), an ISIN (US0378331005) or part of a name.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {},
            "anyOf": [
              {
                "required": ["matches"]
              },
              {
                "required": ["error"]
              }
            ],
            "properties": {
              "degraded": {
                "description": "True when profile data could not be read (profile fields are null).",
                "type": "boolean"
              },
              "error": {
                "type": "object"
              },
              "matches": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "asset_class": {
                      "enum": ["equity", "etf", "crypto", "fx", "commodity", "index", "other"],
                      "type": "string"
                    },
                    "brokers": {
                      "additionalProperties": false,
                      "properties": {
                        "etoro": {
                          "additionalProperties": false,
                          "properties": {
                            "listed": {
                              "type": "boolean"
                            },
                            "reason": {
                              "description": "Why not, in plain words, when listed is false.",
                              "type": ["string", "null"]
                            },
                            "via_equivalent": {
                              "type": "boolean"
                            }
                          },
                          "required": ["listed"],
                          "type": "object"
                        },
                        "trading212": {
                          "additionalProperties": false,
                          "properties": {
                            "listed": {
                              "type": "boolean"
                            },
                            "reason": {
                              "description": "Why not, in plain words, when listed is false.",
                              "type": ["string", "null"]
                            },
                            "via_equivalent": {
                              "type": "boolean"
                            }
                          },
                          "required": ["listed"],
                          "type": "object"
                        }
                      },
                      "required": ["etoro", "trading212"],
                      "type": "object"
                    },
                    "country": {
                      "type": ["string", "null"]
                    },
                    "currency": {
                      "type": ["string", "null"]
                    },
                    "data_only": {
                      "description": "Indices and commodity price series: usable as data, never held.",
                      "type": "boolean"
                    },
                    "equivalents": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "broker": {
                            "enum": ["trading212"],
                            "type": "string"
                          },
                          "isin": {
                            "type": "string"
                          },
                          "kind": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "note": {
                            "type": ["string", "null"]
                          },
                          "symbol": {
                            "type": "string"
                          },
                          "ter_percent": {
                            "type": ["number", "null"]
                          }
                        },
                        "required": ["broker", "isin", "kind", "name", "symbol"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "exchange": {
                      "type": ["string", "null"]
                    },
                    "exposure_group": {
                      "description": "ETFs: the exposure Acubic groups it under (two funds on one index share a group; only one is held).",
                      "type": ["string", "null"]
                    },
                    "in_acubic_universe": {
                      "description": "True when both launch brokers can hold it; null while the universe loads.",
                      "type": ["boolean", "null"]
                    },
                    "industry": {
                      "type": ["string", "null"]
                    },
                    "isin": {
                      "pattern": "^[A-Z]{2}[A-Z0-9]{9}[0-9]$",
                      "type": ["string", "null"]
                    },
                    "market_cap_usd": {
                      "type": ["number", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "open_url": {
                      "format": "uri",
                      "type": ["string", "null"]
                    },
                    "sector": {
                      "type": ["string", "null"]
                    },
                    "symbol": {
                      "type": "string"
                    }
                  },
                  "required": ["asset_class", "brokers", "in_acubic_universe", "name", "symbol"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "truncated": {
