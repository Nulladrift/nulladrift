        {
          "name": "acubic_go_live",
          "title": "Get a link to go live on acubic.ai",
          "description": "Returns a signed link, valid 15 minutes, to automate one strategy on acubic.ai with the person's own eToro or Trading 212 account, where they connect the broker and activate it. It also says whether the plan includes live portfolios. Use it whenever the person wants to automate or go live; for a running portfolio use acubic_get_portfolio.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "The language of this conversation.",
                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              },
              "strategy_id": {
                "description": "The strategy to continue on acubic.ai.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["strategy_id"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "PlanRef": {
                "additionalProperties": false,
                "properties": {
                  "code": {
                    "enum": ["free", "starter", "pro", "quant"],
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["code", "name"],
                "type": "object"
              },
              "PlanRow": {
                "additionalProperties": false,
                "properties": {
                  "annual_per_month_usd": {
                    "type": ["number", "null"]
                  },
                  "backtests_per_month": {
                    "type": ["integer", "null"]
                  },
                  "capital_ceiling_amount": {
                    "description": "Plan capital ceiling; null: none.",
                    "type": ["number", "null"]
                  },
                  "ceiling_currency": {
                    "description": "Ceiling currency (the customer's own).",
                    "enum": ["EUR", "USD"],
                    "type": "string"
                  },
                  "generations_per_day": {
