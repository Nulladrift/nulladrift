        {
          "name": "acubic_update_strategy",
          "title": "Update an agent",
          "description": "Updates the name, description, filter rules, include lists or Exclude list of one saved strategy, and lists each previous value. Holdings are not recomputed. It cannot change the ranking, weighting, limits or sizes: for that build a new strategy with acubic_create_strategy. A strategy with a broker connection accepts name and description only.",
          "inputSchema": {
            "$defs": {
              "FilterRule": {
                "additionalProperties": false,
                "description": "One rule: metric op value.",
                "properties": {
                  "metric": {
                    "description": "A filter metric id (acubic_list_strategy_options, section filters).",
                    "pattern": "^[a-z][a-z0-9_]{1,40}$",
                    "type": "string"
                  },
                  "op": {
                    "enum": [">=", "<=", ">", "<"],
                    "type": "string"
                  },
                  "value": {
                    "description": "The metric's unit: US dollars for market_cap, percent for pct metrics (40 = 40%).",
                    "type": "number"
                  }
                },
                "required": ["metric", "op", "value"],
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "description": {
                "anyOf": [
                  {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "null clears it."
              },
              "excluded_symbols": {
                "description": "The whole Exclude list (replaces the saved one; [] clears it; up to 200 tickers, none locked). Never bought; a held one is sold at the next rebalance.",
                "items": {
                  "maxLength": 32,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "filter_rules": {
                "items": {
                  "$ref": "#/$defs/FilterRule",
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "include": {
                "additionalProperties": false,
                "description": "Ids per acubic_list_strategy_options section (index: indices).",
                "properties": {
                  "countries": {
                    "type": "array"
                  },
                  "country_groups": {
                    "type": "array"
                  },
                  "crypto": {
                    "type": "array"
                  },
                  "currencies": {
                    "type": "array"
                  },
                  "etf_exposures": {
                    "type": "array"
                  },
                  "exchanges": {
                    "type": "array"
                  },
                  "exclude_leveraged": {
                    "type": "boolean"
                  },
                  "index": {
                    "type": "array"
                  },
                  "industries": {
                    "type": "array"
                  },
                  "instrument_types": {
                    "type": "array"
                  },
                  "symbols_only": {
                    "type": "array"
                  },
                  "themes": {
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "locale": {
                "description": "The language of this conversation.",
                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              },
              "name": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "strategy_id": {
                "description": "The strategy to change.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["strategy_id"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Experience": {
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
              },
