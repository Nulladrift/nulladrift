              "locale": {
                "description": "The language of this conversation.",
                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "risk_level": {
                "description": "One risk level only (largest accepted drawdown).",
                "enum": ["low", "medium", "high", "unconstrained"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
