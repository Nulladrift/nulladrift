        {
          "name": "acubic_run_backtest",
          "title": "Run an Audit (backtest)",
          "description": "Runs a walk-forward backtest of one saved strategy and saves it in place of the previous one: at each rebalance the strategy is rebuilt from the data then available, with transaction costs, against the S&P 500 (SPY). 1 to 10 years (over 5 may need a higher plan: upgrade_required), monthly, quarterly or annual rebalancing, 0 to 200 bps costs. It uses one backtest from the plan's monthly allowance, returned if the run fails or is cancelled. May return a run_id for acubic_get_backtest_status. One MCP run per person at a time. Results are hypothetical and carry a disclosure. To read a saved backtest use acubic_get_backtest.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client_request_id": {
                "description": "Idempotency key.",
                "maxLength": 64,
                "minLength": 1,
