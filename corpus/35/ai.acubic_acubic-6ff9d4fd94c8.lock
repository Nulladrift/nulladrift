        {
          "name": "acubic_get_build_status",
          "title": "Check an agent build's progress",
          "description": "Tracks a new draft from acubic_create_strategy by its build_id while it is assembled: progress and poll_after_seconds, then the saved strategy's id to open once. A failed or cancelled build is an error that cost nothing. Backtests have acubic_get_backtest_status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "build_id": {
                "description": "The build_id acubic_create_strategy returned.",
                "format": "uuid",
                "type": "string"
              },
              "locale": {
                "description": "The language of this conversation.",
                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              }
            },
            "required": ["build_id"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Disclosure": {
                "additionalProperties": false,
                "properties": {
                  "hypothetical": {
                    "type": "boolean"
                  },
                  "kind": {
                    "enum": ["hypothetical_backtest", "track_record", "market_data", "educational"],
                    "type": "string"
                  },
                  "locale": {
                    "$ref": "#/$defs/Locale",
                    "description": "Language of short and text."
                  },
                  "not_investment_advice": {
                    "const": true
                  },
                  "short": {
                    "maxLength": 240,
                    "type": "string"
                  },
                  "text": {
                    "maxLength": 900,
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "version": {
                    "description": "Wording date, YYYY-MM-DD.",
                    "type": "string"
                  }
                },
                "required": ["hypothetical", "kind", "locale", "not_investment_advice", "short", "text", "url", "version"],
                "type": "object"
              },
              "Locale": {
                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              },
              "Uuid": {
                "format": "uuid",
                "type": "string"
              }
            },
            "anyOf": [
              {
                "required": ["build", "disclosure"]
              },
              {
                "required": ["error"]
              }
            ],
            "properties": {
              "build": {
                "properties": {
                  "build_id": {
                    "$ref": "#/$defs/Uuid"
                  },
                  "progress": {
                    "properties": {
                      "message": {
                        "type": ["string", "null"]
                      },
                      "next_percent": {
                        "type": ["number", "null"]
                      },
                      "percent": {
                        "description": "Completed share, 0 to 100 (42 means 42%), not a fraction.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": ["number", "null"]
                      },
                      "poll_after_seconds": {
                        "type": "integer"
                      },
                      "started_at": {
                        "type": ["string", "null"]
                      }
                    },
                    "type": "object"
                  },
                  "status": {
                    "enum": ["running", "completed"],
                    "type": "string"
                  },
                  "strategy_id": {
                    "$ref": "#/$defs/Uuid",
                    "description": "Once completed: the saved strategy, for acubic_get_strategy."
                  }
                },
                "required": ["build_id", "status"],
                "type": "object"
              },
              "disclosure": {
                "$ref": "#/$defs/Disclosure"
              },
              "error": {
                "type": "object"
              },
              "next_steps": {
                "items": {
                  "enum": ["acubic_get_strategy", "acubic_go_live"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an agent build's progress"
          },
