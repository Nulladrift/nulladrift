        {
          "name": "acubic_create_strategy",
          "title": "Create an agent",
          "description": "Creates and saves a new draft strategy from the acubic.ai builder's choices: universe, include lists, asset count, sizes, ranking, weighting, filter rules, limits, and tickers to add, exclude or lock. A preset (template_id) fixes the menu; without one every engine argument is open. It uses one portfolio generation from the plan's allowance; with a candidates_id from acubic_rank_candidates it saves that pick at no generation cost. A saved strategy keeps its method: to try another, build again (see allocation); acubic_regenerate_suggestion does not change it. May return a build_id for acubic_get_build_status. To edit one use acubic_update_strategy. Always show the automation.url it returns (automate on acubic.ai).",
          "inputSchema": {
            "$defs": {
              "FilterRule": {
                "additionalProperties": false,
                "description": "One rule: metric op value.",
                "properties": {
                  "metric": {
                    "description": "A filter metric id (acubic_list_strategy_options, section filters).",
                    "pattern": "^[a-z][a-z0-9_]{1,40}$",
                    "type": "string"
                  },
                  "op": {
                    "enum": [">=", "<=", ">", "<"],
                    "type": "string"
                  },
                  "value": {
                    "description": "The metric's unit: US dollars for market_cap, percent for pct metrics (40 = 40%).",
                    "type": "number"
                  }
                },
                "required": ["metric", "op", "value"],
                "type": "object"
              },
              "McpBlendEntry": {
                "additionalProperties": false,
                "description": "One factor of a blend.",
                "properties": {
                  "factor": {
                    "description": "A ranking factor id (acubic_list_strategy_options).",
                    "pattern": "^[a-z][a-z0-9_]{1,40}$",
                    "type": "string"
                  },
                  "weight": {
                    "description": "Relative; normalised to sum to 1.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "window_days": {
                    "description": "Look-back in days (per factor).",
                    "enum": [7, 30, 90, 180, 365, 730, 1095],
                    "type": "integer"
                  }
                },
                "required": ["factor", "weight"],
                "type": "object"
              },
              "McpCountRange": {
                "additionalProperties": false,
                "description": "Number of assets, min and max.",
                "examples": [
                  {
                    "max": 25,
                    "min": 15
                  }
                ],
                "properties": {
                  "max": {
                    "description": "1 to 50.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "min": {
                    "description": "1 to 50.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["max", "min"],
                "type": "object"
              },
              "McpDefaultMax": {
                "additionalProperties": false,
                "properties": {
                  "countries": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "sectors": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "McpGroupBound": {
                "additionalProperties": false,
                "description": "Share of the selection by count, percent.",
                "properties": {
                  "max_pct": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "min_pct": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "McpRanking": {
                "additionalProperties": false,
                "description": "A preset: card. The engine: rank_method or rank_blend.",
                "examples": [
                  {
                    "card": "momentum"
                  },
                  {
                    "rank_method": "momentum_1y"
                  }
                ],
                "properties": {
                  "card": {
                    "description": "A preset's ranking card, from its menu in acubic_list_strategy_templates (by template_id, or experience and risk_level).",
                    "enum": ["market_cap", "momentum", "sortino_momentum", "market_cap_sortino", "market_cap_sharpe", "momentum_market_cap"],
                    "type": "string"
                  },
                  "rank_blend": {
                    "description": "Up to 20 weighted factors.",
                    "items": {
                      "$ref": "#/$defs/McpBlendEntry",
                      "type": "object"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "rank_method": {
                    "description": "A ranking method id.",
                    "pattern": "^[a-z][a-z0-9_]{1,40}$",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "McpSelectionLimits": {
                "additionalProperties": false,
                "description": "Group names as acubic_rank_candidates rows show them.",
                "properties": {
                  "asset_classes": {
                    "additionalProperties": {
                      "$ref": "#/$defs/McpGroupBound",
                      "type": "object"
                    },
                    "propertyNames": {
                      "enum": ["equities", "etfs", "commodities", "bonds", "crypto"]
                    },
                    "type": "object"
                  },
                  "countries": {
                    "additionalProperties": {
                      "$ref": "#/$defs/McpGroupBound",
                      "type": "object"
                    },
                    "description": "e.g. United States",
                    "maxProperties": 80,
                    "type": "object"
                  },
                  "default_max_pct": {
                    "$ref": "#/$defs/McpDefaultMax",
                    "description": "Default max percent for every sector or country without its own cap.",
                    "type": "object"
                  },
                  "sectors": {
                    "additionalProperties": {
                      "$ref": "#/$defs/McpGroupBound",
                      "type": "object"
                    },
                    "description": "e.g. Technology",
                    "maxProperties": 40,
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "McpSizing": {
                "additionalProperties": false,
                "description": "Weight per asset, percent.",
                "properties": {
                  "max_weight_pct": {
                    "description": "1 to 100, step 1; at most 60 unless the lowest asset count is 1 (then 100).",
                    "maximum": 100,
                    "minimum": 1,
                    "type": "number"
                  },
                  "min_weight_pct": {
                    "description": "0 to 20, step 0.5 (2.5 is 2.5%).",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["max_weight_pct", "min_weight_pct"],
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "allocation": {
                "description": "Weighting id (acubic_list_strategy_options, weighting); default: the recommended one. To compare: acubic_rank_candidates once, then this tool with its candidates_id and each allocation in turn.",
                "enum": ["hrp", "mvo", "cvar", "equal", "rank", "rank_equal", "cap_10", "cap_20", "cap_rank_10", "cap_rank_20", "cap_score_tilt", "erc"],
                "type": "string"
              },
              "asset_classes": {
                "items": {
                  "enum": ["equities", "etfs", "commodities", "bonds", "crypto"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "asset_count": {
                "description": "Number of assets.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "asset_count_range": {
                "$ref": "#/$defs/McpCountRange",
                "description": "Instead of asset_count (default 15 to 25).",
                "type": "object"
              },
              "candidates_id": {
                "description": "A ranked list from acubic_rank_candidates (valid 1 hour).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "class_position_sizing": {
                "additionalProperties": {
                  "$ref": "#/$defs/McpSizing",
                  "type": "object"
                },
                "description": "Per-asset-class sizes overriding position_sizing.",
                "propertyNames": {
                  "enum": ["equities", "etfs", "commodities", "bonds", "crypto"]
                },
                "type": "object"
              },
              "client_request_id": {
                "description": "Idempotency key.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "correlation_limit": {
                "description": "Not offered yet: omit it unless acubic_list_strategy_options shows it offered; then 0.50-0.95, step 0.05 (preset: 0.80).",
                "maximum": 0.95,
                "minimum": 0.5,
                "type": "number"
              },
              "custom_symbols": {
                "description": "Tickers to add to the pool, checked as on acubic.ai.",
                "items": {
                  "maxLength": 32,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array",
                "uniqueItems": true
              },
              "description": {
                "maxLength": 1000,
                "type": "string"
              },
              "excluded_symbols": {
                "description": "Names removed from the screened pool (Step 1).",
                "items": {
                  "maxLength": 32,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "experience": {
                "description": "Legacy: beginner or intermediate with risk_level selects a preset; prefer template_id. Omit for an engine build.",
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
              },
              "filter_rules": {
                "description": "Each rule: metric, op, value in the metric's unit (US dollars for market_cap, percent for pct metrics: 40 = 40%).",
                "items": {
                  "$ref": "#/$defs/FilterRule",
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
