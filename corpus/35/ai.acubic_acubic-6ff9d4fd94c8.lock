                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              },
              "rebalance_freq": {
                "default": "M",
                "description": "M monthly, Q quarterly, A annual (needs at least 3 years).",
                "enum": ["M", "Q", "A"],
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "strategy_id": {
                "description": "The saved strategy to backtest.",
                "format": "uuid",
                "type": "string"
              },
              "transaction_cost_bps": {
                "default": 15,
                "description": "Cost of each buy and sell in basis points.",
                "maximum": 200,
                "minimum": 0,
                "type": "number"
              },
              "years": {
                "default": 5,
                "description": "Length of the test in years.",
