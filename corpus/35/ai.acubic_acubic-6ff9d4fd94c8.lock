        {
          "name": "acubic_list_strategy_templates",
          "title": "List agent templates",
          "description": "Lists the ready preset strategies, one per experience level and risk level (largest accepted drawdown), plus Custom (advanced): the full engine. Each preset gives its universe rules, recommended pair and the arguments for acubic_create_strategy. Use it to explore or compare presets before choosing; single settings and their ids are in acubic_list_strategy_options.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "experience": {
                "description": "Limit to one experience level.",
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
