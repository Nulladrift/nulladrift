        {
          "name": "acubic_project_strategy",
          "title": "Project an agent (Simulated)",
          "description": "Runs a Monte Carlo of 500 paths over 1, 3, 5 or 10 years for one saved strategy, from its walk-forward backtest (the AI Scenario Simulation of acubic.ai): bear case (5th percentile), median, bull case (95th) and the percentile fan. Hypothetical, with a disclosure. Paid plans only. For past results use acubic_get_backtest.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "horizon": {
                "default": "3y",
                "description": "How far ahead to simulate.",
                "enum": ["1y", "3y", "5y", "10y"],
                "type": "string"
              },
              "locale": {
                "description": "The language of this conversation.",
                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "strategy_id": {
                "description": "The saved strategy to project.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["strategy_id"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Disclosure": {
                "additionalProperties": false,
                "properties": {
                  "hypothetical": {
                    "type": "boolean"
                  },
                  "kind": {
                    "enum": ["hypothetical_backtest", "track_record", "market_data", "educational"],
                    "type": "string"
                  },
                  "locale": {
                    "$ref": "#/$defs/Locale",
                    "description": "Language of short and text."
                  },
                  "not_investment_advice": {
                    "const": true
                  },
                  "short": {
                    "maxLength": 240,
                    "type": "string"
                  },
                  "text": {
                    "maxLength": 900,
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "version": {
                    "description": "Wording date, YYYY-MM-DD.",
                    "type": "string"
                  }
                },
                "required": ["hypothetical", "kind", "locale", "not_investment_advice", "short", "text", "url", "version"],
                "type": "object"
              },
              "Locale": {
                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              },
              "Uuid": {
                "format": "uuid",
                "type": "string"
              }
            },
            "anyOf": [
              {
                "required": ["disclosure", "projection"]
              },
              {
                "required": ["error"]
              }
            ],
            "properties": {
              "disclosure": {
                "$ref": "#/$defs/Disclosure"
              },
              "error": {
                "type": "object"
              },
              "projection": {
                "additionalProperties": false,
                "properties": {
                  "assumptions": {
                    "description": "The model's inputs after de-biasing: drift and sigma per year, drift_se, raw_cagr, out_of_sample, market_prior, alpha.",
                    "properties": {
                      "alpha": {
                        "properties": {
                          "bench_cagr": {
                            "type": "number"
                          },
                          "fwd": {
                            "type": "number"
                          },
                          "hat": {
                            "type": "number"
                          }
                        },
                        "type": ["object", "null"]
                      },
                      "drift": {
                        "type": "number"
                      },
                      "drift_se": {
                        "type": "number"
                      },
                      "market_prior": {
                        "type": "number"
                      },
                      "out_of_sample": {
                        "type": "boolean"
                      },
                      "raw_cagr": {
                        "type": "number"
                      },
                      "sigma": {
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "fan": {
                    "additionalProperties": false,
                    "properties": {
                      "base": {
                        "const": 100
                      },
                      "downsampled": {
                        "type": "boolean"
                      },
                      "points": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "day": {
                              "description": "Trading days from the start (252 a year).",
                              "type": "integer"
                            },
                            "p25": {
                              "type": "number"
                            },
                            "p5": {
                              "type": "number"
                            },
                            "p50": {
                              "type": "number"
                            },
                            "p75": {
                              "type": "number"
                            },
                            "p95": {
                              "type": "number"
                            },
                            "year": {
                              "type": "number"
                            }
                          },
                          "required": ["day", "p25", "p5", "p50", "p75", "p95"],
                          "type": "object"
                        },
                        "maxItems": 105,
                        "type": "array"
                      },
                      "points_total": {
                        "type": "integer"
                      }
                    },
                    "required": ["downsampled", "points", "points_total"],
                    "type": "object"
                  },
                  "horizon": {
                    "enum": ["1y", "3y", "5y", "10y"],
                    "type": "string"
                  },
                  "horizon_years": {
                    "type": "number"
                  },
                  "inputs": {
                    "additionalProperties": false,
                    "properties": {
                      "basis": {
                        "description": "walkforward: from the saved backtest; in_sample: from the generation's figures (no backtest).",
                        "enum": ["walkforward", "in_sample", null],
                        "type": ["string", "null"]
                      },
                      "history_years": {
                        "type": ["number", "null"]
                      }
                    },
                    "type": "object"
                  },
                  "outcomes": {
                    "additionalProperties": false,
                    "description": "At the horizon: bear case 5th percentile, median, bull case 95th percentile.",
                    "properties": {
                      "bear": {
                        "additionalProperties": false,
                        "properties": {
                          "annualized_return": {
                            "description": "Fraction per year; null for a 1-year horizon (as acubic.ai shows it).",
                            "type": ["number", "null"]
                          },
                          "multiple": {
                            "description": "Multiple of the starting capital.",
                            "type": "number"
                          },
                          "percentile": {
                            "type": "integer"
                          },
                          "total_return": {
                            "description": "Fraction over the horizon, 0.25 is +25%.",
                            "type": "number"
                          },
                          "value_index": {
                            "description": "Value at the horizon when the start is 100.",
                            "type": "number"
                          }
                        },
                        "required": ["multiple", "percentile", "total_return", "value_index"],
                        "type": "object"
                      },
                      "bull": {
                        "additionalProperties": false,
                        "properties": {
                          "annualized_return": {
                            "description": "Fraction per year; null for a 1-year horizon (as acubic.ai shows it).",
                            "type": ["number", "null"]
                          },
                          "multiple": {
                            "description": "Multiple of the starting capital.",
                            "type": "number"
                          },
                          "percentile": {
                            "type": "integer"
                          },
                          "total_return": {
                            "description": "Fraction over the horizon, 0.25 is +25%.",
                            "type": "number"
                          },
                          "value_index": {
                            "description": "Value at the horizon when the start is 100.",
                            "type": "number"
                          }
                        },
                        "required": ["multiple", "percentile", "total_return", "value_index"],
                        "type": "object"
                      },
                      "median": {
                        "additionalProperties": false,
                        "properties": {
                          "annualized_return": {
                            "description": "Fraction per year; null for a 1-year horizon (as acubic.ai shows it).",
                            "type": ["number", "null"]
                          },
                          "multiple": {
                            "description": "Multiple of the starting capital.",
                            "type": "number"
                          },
                          "percentile": {
                            "type": "integer"
                          },
                          "total_return": {
                            "description": "Fraction over the horizon, 0.25 is +25%.",
                            "type": "number"
                          },
                          "value_index": {
                            "description": "Value at the horizon when the start is 100.",
                            "type": "number"
                          }
                        },
                        "required": ["multiple", "percentile", "total_return", "value_index"],
                        "type": "object"
                      }
                    },
                    "required": ["bear", "bull", "median"],
                    "type": "object"
                  },
                  "paths": {
                    "description": "Simulated paths behind the percentiles.",
                    "type": "integer"
                  },
                  "strategy_id": {
                    "$ref": "#/$defs/Uuid"
                  }
                },
                "required": ["assumptions", "fan", "horizon", "inputs", "outcomes", "paths", "strategy_id"],
                "type": "object"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Project an agent (Simulated)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "acubic/rate_class": "projection",
            "acubic/scopes": ["strategies:read"]
          },
          "digest": "sha256:b48327e140991bbd8987f3905de1e6cf295a86494fac6c74db2a4e5b76ee1788"
        },
        {
          "name": "acubic_rank_candidates",
          "title": "Rank candidates",
          "description": "Ranks the candidates of a design before anything is saved (Order & Select on acubic.ai): the ranked list, page by page, with score, per-factor values (vs industry: also the peers' median), sector, country and asset class, and the pick the site would make. A fresh ranking uses one portfolio generation. The list is kept 1 hour under candidates_id: paging, previewing a pick or re-ranking it cost nothing more, and acubic_create_strategy saves the pick, once per weighting you want to compare. It saves nothing. To count names that pass filters use acubic_screen_universe.",
          "inputSchema": {
            "$defs": {
              "FilterRule": {
                "additionalProperties": false,
                "description": "One rule: metric op value.",
                "properties": {
                  "metric": {
                    "description": "A filter metric id (acubic_list_strategy_options, section filters).",
                    "pattern": "^[a-z][a-z0-9_]{1,40}$",
                    "type": "string"
                  },
                  "op": {
                    "enum": [">=", "<=", ">", "<"],
                    "type": "string"
                  },
                  "value": {
                    "description": "The metric's unit: US dollars for market_cap, percent for pct metrics (40 = 40%).",
                    "type": "number"
                  }
                },
                "required": ["metric", "op", "value"],
                "type": "object"
              },
              "McpBlendEntry": {
                "additionalProperties": false,
                "description": "One factor of a blend.",
                "properties": {
                  "factor": {
                    "description": "A ranking factor id (acubic_list_strategy_options).",
                    "pattern": "^[a-z][a-z0-9_]{1,40}$",
                    "type": "string"
                  },
                  "weight": {
                    "description": "Relative; normalised to sum to 1.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "window_days": {
                    "description": "Look-back in days (per factor).",
                    "enum": [7, 30, 90, 180, 365, 730, 1095],
                    "type": "integer"
                  }
                },
                "required": ["factor", "weight"],
                "type": "object"
              },
              "McpCountRange": {
                "additionalProperties": false,
                "description": "Number of assets, min and max.",
                "examples": [
                  {
                    "max": 25,
                    "min": 15
                  }
                ],
                "properties": {
                  "max": {
                    "description": "1 to 50.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "min": {
                    "description": "1 to 50.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["max", "min"],
                "type": "object"
              },
              "McpDefaultMax": {
                "additionalProperties": false,
                "properties": {
                  "countries": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "sectors": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "McpGroupBound": {
                "additionalProperties": false,
                "description": "Share of the selection by count, percent.",
                "properties": {
                  "max_pct": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "min_pct": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "McpRanking": {
                "additionalProperties": false,
                "description": "A preset: card. The engine: rank_method or rank_blend.",
                "examples": [
                  {
                    "card": "momentum"
                  },
                  {
                    "rank_method": "momentum_1y"
                  }
                ],
                "properties": {
                  "card": {
                    "description": "A preset's ranking card, from its menu in acubic_list_strategy_templates (by template_id, or experience and risk_level).",
                    "enum": ["market_cap", "momentum", "sortino_momentum", "market_cap_sortino", "market_cap_sharpe", "momentum_market_cap"],
                    "type": "string"
                  },
                  "rank_blend": {
                    "description": "Up to 20 weighted factors.",
                    "items": {
                      "$ref": "#/$defs/McpBlendEntry",
                      "type": "object"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "rank_method": {
                    "description": "A ranking method id.",
                    "pattern": "^[a-z][a-z0-9_]{1,40}$",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "McpSelectionLimits": {
                "additionalProperties": false,
                "description": "Group names as acubic_rank_candidates rows show them.",
                "properties": {
                  "asset_classes": {
                    "additionalProperties": {
                      "$ref": "#/$defs/McpGroupBound",
                      "type": "object"
                    },
                    "propertyNames": {
                      "enum": ["equities", "etfs", "commodities", "bonds", "crypto"]
                    },
                    "type": "object"
                  },
                  "countries": {
                    "additionalProperties": {
                      "$ref": "#/$defs/McpGroupBound",
                      "type": "object"
                    },
                    "description": "e.g. United States",
                    "maxProperties": 80,
                    "type": "object"
                  },
                  "default_max_pct": {
                    "$ref": "#/$defs/McpDefaultMax",
                    "description": "Default max percent for every sector or country without its own cap.",
                    "type": "object"
                  },
                  "sectors": {
                    "additionalProperties": {
                      "$ref": "#/$defs/McpGroupBound",
                      "type": "object"
                    },
                    "description": "e.g. Technology",
                    "maxProperties": 40,
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "McpSizing": {
                "additionalProperties": false,
                "description": "Weight per asset, percent.",
                "properties": {
                  "max_weight_pct": {
                    "description": "1 to 100, step 1; at most 60 unless the lowest asset count is 1 (then 100).",
                    "maximum": 100,
                    "minimum": 1,
                    "type": "number"
                  },
                  "min_weight_pct": {
                    "description": "0 to 20, step 0.5 (2.5 is 2.5%).",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["max_weight_pct", "min_weight_pct"],
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "asset_classes": {
                "items": {
                  "enum": ["equities", "etfs", "commodities", "bonds", "crypto"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "asset_count": {
                "description": "Number of assets.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "asset_count_range": {
                "$ref": "#/$defs/McpCountRange",
                "description": "Instead of asset_count (default 15 to 25).",
                "type": "object"
              },
              "candidates_id": {
                "description": "A ranked list from acubic_rank_candidates (valid 1 hour).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "class_position_sizing": {
                "additionalProperties": {
                  "$ref": "#/$defs/McpSizing",
                  "type": "object"
                },
                "description": "Per-asset-class sizes overriding position_sizing.",
                "propertyNames": {
                  "enum": ["equities", "etfs", "commodities", "bonds", "crypto"]
                },
                "type": "object"
              },
              "client_request_id": {
                "description": "Idempotency key.",
                "maxLength": 64,
                "minLength": 1,
