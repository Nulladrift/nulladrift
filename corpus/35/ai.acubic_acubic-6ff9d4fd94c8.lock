                    "type": "boolean"
                  },
                  "kind": {
                    "enum": ["hypothetical_backtest", "track_record", "market_data", "educational"],
                    "type": "string"
                  },
                  "locale": {
                    "$ref": "#/$defs/Locale",
                    "description": "Language of short and text."
                  },
                  "not_investment_advice": {
                    "const": true
                  },
                  "short": {
                    "maxLength": 240,
                    "type": "string"
                  },
                  "text": {
                    "maxLength": 900,
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  },
                  "version": {
                    "description": "Wording date, YYYY-MM-DD.",
                    "type": "string"
                  }
                },
                "required": ["hypothetical", "kind", "locale", "not_investment_advice", "short", "text", "url", "version"],
                "type": "object"
              },
              "Holding": {
                "additionalProperties": false,
                "properties": {
                  "asset_class": {
                    "type": ["string", "null"]
                  },
                  "name": {
                    "type": ["string", "null"]
                  },
                  "symbol": {
                    "type": "string"
                  },
                  "weight": {
                    "description": "Fraction of the book, 0.05 is 5%.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["symbol", "weight"],
                "type": "object"
              },
              "Locale": {
                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              },
              "RebalanceFreq": {
                "enum": ["M", "Q", "A"],
                "type": "string"
              },
              "Uuid": {
                "format": "uuid",
                "type": "string"
              }
            },
            "anyOf": [
              {
                "required": ["disclosure", "portfolios"]
              },
              {
                "required": ["error"]
              }
            ],
            "properties": {
              "disclosure": {
                "$ref": "#/$defs/Disclosure"
              },
              "error": {
                "type": "object"
              },
              "next_cursor": {
                "type": ["string", "null"]
              },
              "portfolios": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "as_of": {
                      "description": "Time of the stored snapshot the figures come from; null before the first one.",
                      "format": "date-time",
                      "type": ["string", "null"]
                    },
                    "automation_mode": {
                      "enum": ["one_click", "full_auto", null],
                      "type": ["string", "null"]
                    },
                    "broker": {
                      "enum": ["etoro", "trading212", "alpaca", "robinhood", null],
                      "type": ["string", "null"]
