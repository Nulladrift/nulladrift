              },
              "response_format": {
                "default": "concise",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "strategy_id": {
                "description": "One strategy; omit for all that have a live or paper book.",
                "format": "uuid",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Disclosure": {
                "additionalProperties": false,
