                            "properties": {
                              "advanced": {
                                "type": "boolean"
                              },
                              "beginner": {
                                "type": "boolean"
                              },
                              "intermediate": {
                                "type": "boolean"
                              }
                            },
                            "type": "object"
                          },
                          "description": {
                            "type": "string"
                          },
                          "id": {
                            "description": "The value to pass to acubic_create_strategy or acubic_run_backtest.",
                            "type": "string"
                          },
                          "label": {
                            "type": "string"
                          },
                          "not_offered_reason": {
                            "type": ["string", "null"]
                          },
                          "offered": {
                            "type": "boolean"
                          },
                          "range": {
                            "description": "For numeric settings.",
                            "properties": {
                              "default": {
                                "type": "number"
                              },
                              "max": {
                                "type": "number"
                              },
                              "min": {
                                "type": "number"
                              },
                              "step": {
                                "type": "number"
                              },
                              "unit": {
                                "type": "string"
                              }
