        {
          "name": "acubic_explain",
          "title": "Explain a term or setting",
          "description": "Explains one investing term or Acubic setting in plain language (a metric such as P/E or maximum drawdown, a filter, ranking or weighting method, risk level, rebalance or backtest term): its meaning, how Acubic uses it, default, caveats and its page. Use it whenever the user asks what a term means, so the answer matches how Acubic computes it. It does not say what a person should choose. For articles, pricing or the FAQ use acubic_search_knowledge.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Limit to one kind of term.",
                "enum": ["metric", "filter", "ranking_method", "allocation_method", "experience_level", "risk_level", "rebalance_frequency", "backtest_term", "other"],
                "type": "string"
              },
              "locale": {
                "description": "The language of this conversation.",
                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "topic": {
                "description": "A term or option id, e.g. 'P/E ratio', 'pe', 'cap_rank_10', 'walk-forward'.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {},
            "anyOf": [
              {
                "required": ["matches"]
              },
              {
                "required": ["error"]
              }
            ],
            "properties": {
              "content_locale": {
                "description": "Language of the wording: en for now.",
                "enum": ["en"],
                "type": "string"
              },
              "error": {
                "type": "object"
              },
              "matches": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "caveats": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "default": {
                      "description": "What Acubic uses when nothing is chosen, per experience level where it differs.",
                      "type": ["string", "null"]
                    },
                    "explanation": {
                      "maxLength": 700,
                      "type": "string"
                    },
                    "how_acubic_uses_it": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "related": {
                      "items": {
