                "format": "uuid",
                "type": "string"
              }
            },
            "anyOf": [
              {
                "required": ["deleted"]
              },
              {
                "required": ["error"]
              }
            ],
            "properties": {
              "archived_with": {
                "additionalProperties": false,
                "description": "What was archived along with the strategy and comes back with a restore.",
                "properties": {
                  "paper_account": {
                    "type": "boolean"
                  },
                  "saved_backtest": {
                    "type": "boolean"
