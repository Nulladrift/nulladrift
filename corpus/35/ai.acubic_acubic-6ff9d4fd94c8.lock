                    "sources": {
                      "items": {
                        "properties": {
                          "title": {
                            "type": "string"
                          },
                          "url": {
                            "format": "uri",
                            "type": "string"
                          }
                        },
                        "required": ["title", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "term": {
                      "type": "string"
                    },
                    "unit": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["explanation", "id", "kind", "term"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "suggestions": {
                "description": "Close terms when nothing matches exactly.",
