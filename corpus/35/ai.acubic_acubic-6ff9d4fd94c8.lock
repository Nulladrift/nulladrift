                              "pros": {
                                "items": {
                                  "type": "string"
                                },
                                "type": "array"
                              }
                            },
                            "type": "object"
                          }
                        },
                        "required": ["id", "label", "offered"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "options", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "truncated": {
                "type": "boolean"
              }
