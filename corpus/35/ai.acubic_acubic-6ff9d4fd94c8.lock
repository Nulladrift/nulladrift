        {
          "name": "acubic_screen_universe",
          "title": "Screen the tradable universe",
          "description": "Applies filter rules (e.g. market cap at least $10 billion, P/E at most 25; AND, up to 20) to the universe eToro and Trading 212 both hold, after optional asset class, region, sector and include narrowing. Returns how many pass, per asset class, with up to 25 example rows, from the latest snapshot (as_of). A stock-only metric passes funds and crypto. To rank names for a strategy use acubic_rank_candidates.",
          "inputSchema": {
            "$defs": {
              "FilterRule": {
                "additionalProperties": false,
                "description": "One rule: metric op value.",
                "properties": {
                  "metric": {
                    "description": "A filter metric id (acubic_list_strategy_options, section filters).",
                    "pattern": "^[a-z][a-z0-9_]{1,40}$",
                    "type": "string"
                  },
                  "op": {
                    "enum": [">=", "<=", ">", "<"],
                    "type": "string"
                  },
                  "value": {
                    "description": "The metric's unit: US dollars for market_cap, percent for pct metrics (40 = 40%).",
                    "type": "number"
                  }
                },
                "required": ["metric", "op", "value"],
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "asset_classes": {
                "description": "Narrow to these asset classes first.",
                "items": {
                  "enum": ["equities", "etfs", "commodities", "bonds", "crypto"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "cursor": {
                "description": "A previous next_cursor.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "filter_rules": {
                "default": [],
                "description": "Rules combined with AND.",
                "items": {
                  "$ref": "#/$defs/FilterRule",
                  "type": "object"
