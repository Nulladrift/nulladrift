                        },
                        "stock_count": {
                          "type": "integer"
                        },
                        "summary": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "ranking_options": {
                      "items": {
                        "$ref": "#/$defs/RankingOption"
                      },
                      "type": "array"
                    },
                    "recommended": {
                      "description": "The pair Acubic's menu marks recommended.",
                      "oneOf": [
                        {
                          "$ref": "#/$defs/MenuPair"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "risk_level": {
                      "oneOf": [
                        {
                          "$ref": "#/$defs/RiskLevel"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "summary": {
                      "maxLength": 600,
                      "type": "string"
                    },
