              "response_format": {
                "default": "concise",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "run_id": {
                "description": "A finished run of acubic_run_backtest to read.",
                "format": "uuid",
                "type": "string"
              },
              "strategy_id": {
                "description": "The strategy whose latest saved backtest to read.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["strategy_id"],
            "type": "object"
