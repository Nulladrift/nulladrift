                "type": "string"
              },
              "locale": {
                "description": "The language of this conversation.",
                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              },
              "strategy_id": {
                "description": "The draft or paper-money strategy to delete.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["strategy_id"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
