                        "$ref": "#/$defs/RiskLevel"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "top_holdings": {
                    "items": {
                      "$ref": "#/$defs/Holding"
                    },
                    "type": "array"
                  },
                  "updated_at": {
                    "format": "date-time",
                    "type": ["string", "null"]
                  }
                },
                "required": ["asset_count", "created_at", "filtered", "has_backtest", "id", "mode", "name", "open_url"],
