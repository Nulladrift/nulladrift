        {
          "name": "acubic_list_strategy_options",
          "title": "List agent-builder options",
          "description": "Lists every choice the strategy builder offers, with ids, trade-offs and defaults: universe, filter metrics, include lists, ranking methods, weighting methods, rebalance, backtest settings and recipes. Optionally one section. It describes options; the choice is the person's. For ready presets use acubic_list_strategy_templates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "experience": {
                "description": "Keep only the options available at this experience level.",
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
              },
              "locale": {
                "description": "The language of this conversation.",
                "enum": ["en", "de", "it", "fr", "es", "pt-PT"],
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "section": {
                "default": "all",
                "description": "One section, or all (always concise).",
                "enum": ["all", "risk_levels", "universe", "filters", "ranking", "weighting", "rebalance", "backtest_settings", "recipes", "countries", "country_groups", "industries", "themes", "exchanges", "currencies", "instrument_types", "etf_exposures", "indices"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Experience": {
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
              }
            },
            "anyOf": [
              {
                "required": ["sections"]
              },
              {
                "required": ["error"]
              }
            ],
            "properties": {
              "content_locale": {
                "description": "Language of the wording: en for now.",
                "enum": ["en"],
                "type": "string"
              },
              "error": {
                "type": "object"
              },
              "sections": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "enum": ["risk_levels", "universe", "filters", "ranking", "weighting", "rebalance", "backtest_settings", "recipes", "countries", "country_groups", "industries", "themes", "exchanges", "currencies", "instrument_types", "etf_exposures", "indices"],
                      "type": "string"
                    },
                    "intro": {
                      "type": "string"
                    },
                    "options": {
                      "items": {
                        "properties": {
                          "available_to": {
                            "items": {
                              "$ref": "#/$defs/Experience"
