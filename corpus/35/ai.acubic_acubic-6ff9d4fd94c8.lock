        {
          "name": "acubic_list_strategies",
          "title": "List my agents",
          "description": "Lists the signed-in person's saved strategies, newest first: name, kind (draft, paper or live), holdings count, method, backtest date and link; mode archived shows the archive. It has no performance figures: use acubic_get_strategy for one strategy, acubic_get_backtest for results.",
