                    },
                    "rebalance_frequency": {
                      "oneOf": [
                        {
                          "$ref": "#/$defs/RebalanceFreq"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "status": {
                      "enum": ["active", "inactive", "paused_by_platform", "never_deployed"],
                      "type": "string"
                    },
                    "strategy_id": {
                      "$ref": "#/$defs/Uuid"
                    },
                    "twr_note": {
                      "type": ["string", "null"]
                    },
                    "twr_since_activation": {
                      "description": "Time-weighted return as a fraction; null when the stored flow records cannot support one.",
                      "type": ["number", "null"]
                    },
                    "value": {
                      "properties": {
                        "amount": {
                          "type": "number"
                        },
                        "currency": {
                          "type": "string"
                        }
                      },
                      "type": ["object", "null"]
                    }
                  },
                  "required": ["as_of", "mode", "name", "status", "strategy_id"],
                  "type": "object"
                },
                "maxItems": 25,
                "type": "array"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get my portfolio positions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
