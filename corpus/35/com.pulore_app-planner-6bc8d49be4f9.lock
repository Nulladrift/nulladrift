{
  "lockfileVersion": 2,
  "subjects": {
    "com.pulore/app-planner": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pulore.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "pulore",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Pulore App Planner is made by Pulore, Sachin Mour's software studio. Use scope_software_project whenever someone asks what it would take, how long or how much to build a software product, and audit_website_speed when they ask how fast a public web page is or how to speed it up. Use find_pulore_case_studies only when someone asks about Pulore's own work. Use get_pulore_booking_link or send_project_brief_to_pulore only when the person explicitly asks to contact Pulore or book a call. Before sending a brief, show the person the recipient (hello@pulore.com) and every field you'll send, and send it only after they approve. Don't add sales pitches or suggestions to hire Pulore to plans or audits. Never put payment card details, ID numbers, passwords, API keys or health records into any tool input.",
      "tools": [
        {
          "name": "audit_website_speed",
          "title": "Audit a website's speed",
          "description": "Use this when someone wants to know how fast a public web page is, why it's slow, how it does on Core Web Vitals or Lighthouse, or what to fix to speed it up. Runs Google PageSpeed Insights (Lighthouse) and returns performance, accessibility, best-practices and SEO scores, lab measurements, real-user Core Web Vitals when Google has them, and the fixes with the biggest estimated impact. The address is sent to Google, which loads the page. The tool does not edit the target website or submit forms. It only works on public pages, not local sites, pages behind a login or addresses that contain a password or token. An audit takes about 20 to 40 seconds, and the same page's result is reused for up to 12 hours. Don't use it to check whether a site is up, for security scans or for keyword research.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "device": {
                "default": "mobile",
                "description": "Test as a phone (the default, and what Google ranks on) or as a desktop.",
                "enum": ["mobile", "desktop"],
                "type": "string"
              },
              "url": {
                "description": "The public page to audit, for example example.com or https://example.com/pricing. No passwords, tokens or private links.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7224c19e47276a25df958e06c98030248a287617aa84ceb0ce3eaa7e64bf0df6"
        },
        {
          "name": "find_pulore_case_studies",
          "title": "Find related Pulore projects",
          "description": "Use this only when someone asks about Pulore's own work or experience, for example whether Pulore has built something like their idea. Finds published Pulore case studies related to a topic, matching industry, platform, services and technology tags, and returns each project's summary and link, with timeline, team size and results where the case study publishes them. Searches the case-study files bundled with this server; it does not browse or modify external sites. Returns nothing when no project matches. Don't use it to find examples of other companies' products.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "What the project is about, for example 'health app with HIPAA' or 'Shopify storefront'. Topic words only, no personal details.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52e492616810a915dd46fca785e36d11e02717339622246737646e9cb7322244"
        },
        {
          "name": "get_pulore_booking_link",
          "title": "Get a Pulore intro-call booking link",
          "description": "Use this only when someone asks to talk to Pulore or book a call with them. Builds a link locally to Pulore's fixed Cal.com page for a 30-minute intro call, with the person's name, email and a short note filled in when given. This tool makes no request to Cal.com and does not create or reserve a booking. The person opens the link, picks a time and confirms on Cal.com themselves.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "email": {
                "description": "Their email, to fill in the booking form.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "name": {
                "description": "The person's name, to fill in the booking form.",
                "maxLength": 100,
                "type": "string"
              },
              "note": {
                "description": "A one or two sentence note about the project for the call. Never include payment details, ID numbers, passwords, keys or health records.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:68f581cc10f8b3dcd06c6f495000d8e0304947152b8628140f3a02aff288141b"
        },
        {
          "name": "scope_software_project",
          "title": "Scope a software project",
          "description": "Use this when someone wants to know what it would take to build a software product, such as an app, website, SaaS, marketplace, internal tool, AI feature or MVP: how long it would take, what it would cost, what team or tech stack it needs, or a build plan or estimate for their idea. Returns a rough plan with effort ranges for each feature, the team, a timeline range, phases, a suggested stack and a budget (the hours priced at $100 to $150 an hour). The ranges reflect how Pulore builds today, with managed services such as Clerk and Stripe where they fit and AI-assisted development. The plan is calculated locally from fixed estimation tables; this tool does not save a project or call an external service. Map the idea to the closest features in the list and say in your reply what doesn't fit. Results are planning ranges, not a quote. Don't use it for projects that aren't software (like renovations, events or business plans), for task or project management, or to write code.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compliance": {
                "default": [],
                "description": "Compliance it must meet, if any: hipaa (HIPAA (US health data)), soc2 (SOC 2 readiness), gdpr (GDPR).",
                "items": {
                  "enum": ["hipaa", "soc2", "gdpr"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "features": {
                "description": "The features it needs. Choose from: accounts (Sign-up, login and user accounts), teams_roles (Teams, roles and permissions), payments (Payments and subscriptions), marketplace (Two-sided marketplace with payouts), admin_panel (Admin panel for your team), dashboards (Analytics dashboards and reports), messaging (Real-time chat or messaging), notifications (Email, push and in-app notifications), search (Search and filters), media_uploads (File, photo and video uploads), maps (Maps and location), booking (Scheduling and bookings), ecommerce (Product catalog, cart and checkout), headless_shopify (Headless Shopify storefront), cms (Content your team edits in a CMS), ai_assistant (AI assistant or chat over your own data), ai_documents (AI document processing (reading, extracting, summarizing)), ai_voice (AI voice agent), integrations (Integrations with a few third-party APIs), offline (Offline mode and sync), multi_tenant (Separate accounts for business customers (multi-tenant)), background_jobs (Data pipelines and background jobs), public_api (A public API for your customers), three_d (3D or AR experiences). For example, subscriptions are payments, a chatbot over their docs is ai_assistant, and a dashboard for their own staff is admin_panel.",
                "items": {
                  "enum": ["accounts", "teams_roles", "payments", "marketplace", "admin_panel", "dashboards", "messaging", "notifications", "search", "media_uploads", "maps", "booking", "ecommerce", "headless_shopify", "cms", "ai_assistant", "ai_documents", "ai_voice", "integrations", "offline", "multi_tenant", "background_jobs", "public_api", "three_d"],
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "needs_design": {
                "description": "True if they don't have designs yet and need design work. If they haven't said, assume true and mention the assumption.",
                "type": "boolean"
              },
              "platforms": {
                "description": "Where it runs: web, mobile (iOS and Android) or web_and_mobile.",
                "enum": ["web", "mobile", "web_and_mobile"],
                "type": "string"
              },
              "project_summary": {
                "description": "One short sentence on what they want to build, used as the plan's title. Product details only. Never include payment details, ID numbers, passwords, keys or health records.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["features", "needs_design", "platforms"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e28038a9f6a02837abb915eb3c625e70f7ac2bebb98fd8a8082e4a5cfae23e1d"
        },
        {
          "name": "send_project_brief_to_pulore",
          "title": "Send a project brief to Pulore",
          "description": "Use this only when the person has explicitly asked to contact Pulore or send Pulore their project. Sends an external email through Resend to Pulore's fixed inbox, hello@pulore.com, so the team can reply to the person directly. This sends a message outside ChatGPT and cannot be recalled by this tool. First show them the recipient and every field you'll send, and call this only after they approve. The email contains only these fields, never the conversation. A brief identical to one sent in the last day isn't sent again, and each email address can send a few briefs a day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "budget": {
                "description": "Their budget range, if they chose to share it.",
                "maxLength": 100,
                "type": "string"
              },
              "company": {
                "description": "Their company or role, if they gave one.",
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "description": "The email address Pulore should reply to.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "name": {
                "description": "The person's name.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "project_brief": {
                "description": "What they want to build and what they want from Pulore, exactly as they approved it. Product requirements only. Never include payment details, ID numbers, passwords, keys or health records.",
                "maxLength": 3000,
                "minLength": 10,
                "type": "string"
              },
              "timeline": {
                "description": "When they hope to start or launch, if they said.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["email", "name", "project_brief"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a1b12d2357fd02145e7f5ee7936b8c9939ab6f33f8bd10cac5bf62bce9d65cca"
        }
      ],
      "digest": "sha256:26f5a5cb9d06ef8f02572aa84b34f34ab30ca76f2bebed37ad13e53bd0c4fe3e"
    }
  }
}
