        {
          "name": "get_flood_history",
          "title": "Flood history of Crosby's river gauges",
          "description": "The flood record for the river gauges near Crosby, TX that have one (Cedar Bayou near Crosby, the San Jacinto River near Sheldon and at Lake Houston, the East Fork San Jacinto near New Caney): each gauge's highest historic crests as NOAA publishes them, measured against TODAY's NWS flood stages (stages may have differed when a crest happened), how many crests and river flood warnings the record holds, and a link to the full page. Crests NOAA marks as on an older gauge datum are counted but never compared. For current levels use get_river_levels.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "gauges": {
                "items": {
                  "properties": {
                    "crestCount": {
                      "type": "integer"
                    },
                    "floodStages": {
                      "description": "Today's NWS flood stages in ft, keyed action/minor/moderate/major; empty where none are defined.",
                      "type": "object"
                    },
                    "highestCrests": {
                      "items": {
                        "properties": {
                          "againstTodaysStages": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          },
                          "date": {
                            "description": "YYYY-MM-DD when NOAA gives no time, else an ISO instant.",
                            "type": "string"
                          },
                          "noaaCode": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "The letter NWPS publishes for that status (P, O, R)."
                          },
                          "noaaFlowCfs": {
                            "anyOf": [
                              {
                                "type": "number"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Crest flow as NOAA publishes it; null when none, or on gauges where NOAA's figure is not a measured flow."
                          },
                          "stageFt": {
                            "type": "number"
                          },
                          "status": {
                            "description": "NWS crest status: Preliminary, Official or Record (— when none).",
                            "type": "string"
                          },
                          "usgsFlowCfs": {
                            "anyOf": [
                              {
                                "type": "number"
                              },
                              {
