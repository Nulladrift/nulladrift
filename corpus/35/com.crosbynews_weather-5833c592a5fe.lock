        {
          "name": "get_forecast",
          "title": "Forecast",
          "description": "Forecast for Crosby, TX from the U.S. National Weather Service. Returns the 7-day day/night forecast, or upcoming hourly periods if `hours` is given (up to 48 — through about two days out).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hours": {
                "description": "Return this many upcoming hourly periods instead of the daily forecast.",
                "maximum": 48,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "forecast": {
