      "instructions": "Live Crosby, Texas data: weather from the U.S. National Weather Service, a measured air-quality index (EPA/AirNow), the daily pollen and mold count, the Atlantic tropical outlook, river/bayou flood levels, USGS water conditions for nearby fishing waters, road incidents and lane closures, a radar image, measured rain at the Lake Houston dam station, local news headlines, the Crosby ISD school calendar, and an emergency-contacts directory.",
      "tools": [
        {
          "name": "get_air_quality",
          "title": "Air quality (AQI)",
          "description": "Current U.S. Air Quality Index (0–500). When measured:true it is the EPA/AirNow monitor reading for the Houston-Galveston-Brazoria reporting area, which includes Crosby, TX: a regional reading, not Crosby-specific. When measured:false it is an Open-Meteo modeled estimate at Crosby's coordinates, not a monitor reading. Use this for AQI questions; get_current_conditions also carries an AQI summary.",
