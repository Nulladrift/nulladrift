        {
          "name": "get_burn_ban",
          "title": "Burn ban status",
          "description": "Current outdoor-burning ban status for Harris County, TX (which includes Crosby) from the Texas A&M Forest Service, with a lift the Harris County Fire Marshal's Office has announced before the map shows it. Countywide only — TFS has no sub-county resolution, so this is never a Crosby-specific status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "county": {
                "description": "Always \"Harris\".",
                "type": "string"
              },
              "lastChecked": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "ISO 8601 timestamp of the last data refresh."
              },
              "liftedBy": {
                "description": "With mapStatus: the Fire Marshal's announcement (day, url).",
                "properties": {
                  "day": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "mapStartDate": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "With mapStatus: the start date the map still reports."
              },
              "mapStatus": {
                "description": "Present only while the Harris County Fire Marshal's Office has announced a lift the Forest Service map does not show yet: the map's own status.",
                "type": "string"
              },
              "officialUrl": {
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "startDate": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "ISO date-time the current ban took effect, as reported by TFS; null when there is no active ban."
              },
              "status": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "\"Yes\" = ban in effect, \"No\" = no active ban, null = status unavailable from the last check."
              },
              "statusSince": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "When the CURRENT status was first observed. Equal to trackingSince means no change has ever been witnessed — it is when observation began, NOT a transition date."
              },
              "trackingSince": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
