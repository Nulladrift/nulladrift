        {
          "name": "get_current_conditions",
          "title": "Current conditions",
          "description": "Current weather for Crosby, TX from the National Weather Service. The `current` block is the NWS hourly forecast period in effect at current.startTime: temperature (°F), sky, probabilityOfPrecipitation, feelsLike, dewpointF, humidityPercent, and wind speed as text in mph. Those are forecast values, not a station observation. `updated` is when this data was refreshed. Also the EPA UV index, a summary of measured air quality (for AQI detail use get_air_quality), and sunrise/sunset. For an AQI-only question, use get_air_quality.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "airQuality": {
                "anyOf": [
