                      },
                      "reportingArea": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "usAqi": {
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "US AQI. measured:true = EPA/AirNow monitors in the Houston-Galveston-Brazoria reporting area (regional, not Crosby-specific); measured:false = Open-Meteo modeled estimate at Crosby's coordinates, not a monitor reading."
              },
              "current": {
                "description": "An NWS forecast period, passed through (startTime, temperature, shortForecast, windSpeed, probabilityOfPrecipitation, ...) plus computed feelsLike °F where applicable. Full schema: https://crosbynews.com/openapi.json Adds dewpointF and humidityPercent.",
                "type": "object"
              },
              "location": {
                "type": "string"
              },
              "sun": {
                "anyOf": [
                  {
                    "properties": {
