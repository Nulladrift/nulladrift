      },
      "instructions": "PricingLab prices financial and insurance models and returns every sensitivity from one\nadjoint pass (MatLogica AADC), not by re-running the model once per input.\n\nStart with list_models, then describe_model for the inputs, units and defaults. price_model returns the\nvalue and all sensitivities. check_against_bumping recomputes the same sensitivities by bump-and-revalue\non the same scenarios and reports the gaps and both timings - use it when the user asks whether the\nnumbers can be trusted or how much time the one-pass method saves. run_model_function runs a model's\nextra calculations (e.g. the variable annuity's nested run). Every number in an answer must come from a\ntool result; do not compute or estimate numbers yourself. Model pages: pricinglab://model/<id>.",
      "tools": [
        {
          "name": "check_against_bumping",
          "description": "Recompute the sensitivities by central bump-and-revalue on the same scenarios; report each gap,\n    whether they agree within tolerance, and the time each method took.",
          "inputSchema": {
            "properties": {
              "inputs": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Inputs"
              },
              "model": {
                "title": "Model",
                "type": "string"
              }
            },
            "required": ["model"],
            "title": "check_against_bumpingArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "check_against_bumpingOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:39203b62101c27c0daf27a9f1454f21c1cf5010f3d1aad27a4ef151c126e7344"
