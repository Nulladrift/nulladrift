{
  "lockfileVersion": 2,
  "subjects": {
    "com.scriptmasterlabs/omnipost": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sml-omnipost.vercel.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "sml-omnipost",
        "title": "SML OmniPost",
        "version": "1.0.0",
        "websiteUrl": "https://sml-omnipost.vercel.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OmniPost turns one post into native posts for 14 platforms. Free: omnipost_platform_specs, omnipost_validate, omnipost_share_intents, omnipost_payment_contract. Paid via canonical x402 v2 (USDC on Base): omnipost_fanout, omnipost_media_pack, omnipost_publish — call once without payment_signature to get the challenge, then retry with it. Failed jobs are never charged.",
      "tools": [
        {
          "name": "omnipost_fanout",
          "title": "Fan out one post",
          "description": "PAID x402 ($0.05 USDC hosted model, or $0.01 with your own provider key). Rewrites one post into native versions for up to 14 platforms, validates every variant, auto-repairs violations, and returns hooks, Fit Scores and share intents. Never invents facts.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "BYOK key — used once, never stored",
                "type": "string"
              },
              "audience": {
                "type": "string"
              },
              "avoid": {
                "type": "string"
              },
              "brand": {
                "type": "string"
              },
              "cashtags": {
                "description": "$TICKERS to use where they fit",
                "type": "string"
              },
              "cta": {
                "type": "string"
              },
              "goal": {
                "type": "string"
              },
              "hasMedia": {
                "type": "boolean"
              },
              "hashtags": {
                "description": "#tags to prefer (caps enforced per platform)",
                "type": "string"
              },
              "language": {
                "type": "string"
              },
              "link": {
                "type": "string"
              },
              "mentions": {
                "description": "@handles to weave in",
                "type": "string"
              },
              "model": {
                "description": "BYOK model id",
                "type": "string"
              },
              "payment_signature": {
                "description": "Base64 x402 v2 PaymentPayload (same value as the PAYMENT-SIGNATURE HTTP header). Omit to receive the payment challenge.",
                "type": "string"
              },
              "platforms": {
                "description": "Target platforms (default: all 14)",
                "items": {
                  "enum": ["x", "threads", "instagram", "tiktok", "youtube", "linkedin", "facebook", "pinterest", "reddit", "discord", "telegram", "whatsapp", "gbp", "bluesky"],
                  "type": "string"
                },
                "type": "array"
              },
              "post": {
                "description": "The one source post to adapt",
                "type": "string"
              },
              "provider": {
                "description": "BYOK provider (optional)",
                "enum": ["anthropic", "openai", "gemini", "openrouter"],
                "type": "string"
              },
              "voice": {
                "type": "string"
              }
            },
            "required": ["post"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:83eb6b751316b710257df4b4cc25a1656f67c718141423ff89b56b798882e06b"
        },
        {
          "name": "omnipost_media_pack",
          "title": "Media pack",
          "description": "PAID x402 ($0.01 USDC). Turns one image into every platform's exact ratio and pixel size (16:9, 4:5, 1:1, 9:16, 2:3, 4:3) with focal-point cropping. Returns data URLs.",
          "inputSchema": {
            "properties": {
              "focus": {
                "description": "{ x: 0..1, y: 0..1 }",
                "type": "object"
              },
              "format": {
                "enum": ["jpeg", "png", "webp"],
                "type": "string"
              },
              "image": {
                "description": "{ data: base64 or data URL } or { url: https URL }",
                "type": "object"
              },
              "payment_signature": {
                "description": "Base64 x402 v2 PaymentPayload (same value as the PAYMENT-SIGNATURE HTTP header). Omit to receive the payment challenge.",
                "type": "string"
              },
              "platforms": {
                "description": "Target platforms (default: all 14)",
                "items": {
                  "enum": ["x", "threads", "instagram", "tiktok", "youtube", "linkedin", "facebook", "pinterest", "reddit", "discord", "telegram", "whatsapp", "gbp", "bluesky"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["image"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c6bd65602d0cba1ecf1dad5434765fbf024a3dc52d6f36a744be538aa60521f8"
        },
        {
          "name": "omnipost_payment_contract",
          "title": "Payment contract",
          "description": "FREE. x402 v2 payment terms for OmniPost paid tools: network, USDC asset, payTo, facilitator, headers and current prices.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e96bc5ad81387aae04401e47060fbcc9cbb8a2799c43954c47d6075383372a9f"
        },
        {
          "name": "omnipost_platform_specs",
          "title": "Platform specs",
          "description": "FREE. Verified character limits, title limits, hashtag caps, image ratios/pixel sizes, link behavior and publishing method for 14 social platforms. Use before writing any social post.",
          "inputSchema": {
            "properties": {
              "platforms": {
                "description": "Target platforms (default: all 14)",
                "items": {
                  "enum": ["x", "threads", "instagram", "tiktok", "youtube", "linkedin", "facebook", "pinterest", "reddit", "discord", "telegram", "whatsapp", "gbp", "bluesky"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:261155a1421064a0ec1716fa8a7a1c1b27887b28e7d6935052461771e3e73e20"
        },
        {
          "name": "omnipost_publish",
          "title": "Publish",
          "description": "PAID x402 ($0.01 USDC per call, up to 20 targets). Publishes directly to Discord (webhook), Telegram (bot), Bluesky (app password) and any Zapier/Make/n8n webhook. Credentials are used once and never stored.",
          "inputSchema": {
            "properties": {
              "jobs": {
                "description": "[{ target:'discord', webhookUrl, text }, { target:'telegram', botToken, chatId, text }, { target:'bluesky', handle, appPassword, text }, { target:'webhook', url, bundle }]",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "payment_signature": {
                "description": "Base64 x402 v2 PaymentPayload (same value as the PAYMENT-SIGNATURE HTTP header). Omit to receive the payment challenge.",
                "type": "string"
              }
            },
            "required": ["jobs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:01d5e6adcbec8f9423e370697ec2f8b5b6fdd2cfe50e4d5afd89d12d90910769"
        },
        {
          "name": "omnipost_share_intents",
          "title": "Share intents",
          "description": "FREE. Builds official one-tap share URLs (X, Threads, LinkedIn, Reddit, WhatsApp, Telegram, Bluesky, Pinterest, Facebook) for each variant, plus copy-and-open targets for Instagram, TikTok, YouTube and Google Business.",
          "inputSchema": {
            "properties": {
              "link": {
                "type": "string"
              },
              "mediaUrl": {
                "type": "string"
              },
              "variants": {
                "type": "object"
              }
            },
            "required": ["variants"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93f55303cbd9f542bc69821f8972fda604f300eea1e72dec5c794b5294dd8ab7"
        },
        {
          "name": "omnipost_validate",
          "title": "Validate posts",
          "description": "FREE. Deterministically checks platform-specific post variants against verified limits (X weighted count, Instagram 5-hashtag cap, Telegram caption limit, title limits, dead links, hook-below-fold) and returns a 0–100 format-compliance Fit Score per platform.",
          "inputSchema": {
            "properties": {
              "hasMedia": {
                "type": "boolean"
              },
              "variants": {
                "description": "{ platformId: { text, title? } }",
                "type": "object"
              }
            },
            "required": ["variants"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
