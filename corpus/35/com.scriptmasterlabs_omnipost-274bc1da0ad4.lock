            "readOnly": true
          },
          "digest": "sha256:db82fa0c00f8c516b34a481a9dc75d37b9c8a437ee5e14a92f4ddb3ac065957a"
        }
      ],
      "digest": "sha256:7a712054a21b44108e97021e578245d5e8e634430f620d5dfddd74e294b01dc1"
    }
  }
