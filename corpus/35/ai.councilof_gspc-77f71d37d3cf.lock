        {
          "name": "commission_card",
          "title": "Commission a measurement card (paid, x402)",
          "description": "PAID (x402). Commission one signed card-v0 receipt (surface ras.commission) for a named subject on the frozen bank via https://councilof.ai/api/request-attestation. Re-serves every signed measurement card already on file for the subject; a payment never mints a MEASURED cell (fresh_run stays UNMEASURED until a published run exists). Without x_payment the tool returns the 402 challenge (accepts[] with asset, amount, payTo) plus a free preview of the cards already on file. Measurement, not certification — never a rank, a grade or a certificate. Verification stays free.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["subject"]
              },
              {
                "required": ["purchase_action"]
              }
            ],
            "properties": {
              "axis": {
                "description": "Optional axis slug; omit for the subject-level commission.",
                "type": "string"
              },
              "purchase_action": {
                "description": "Selfserve account-owned purchase action. Use Council bearer transport, omit x_payment; no new financial/provider action.",
                "enum": ["history", "recover", "decisions", "accept", "reject", "request_correction"],
                "type": "string"
              },
              "purchase_cursor": {
                "description": "Owner-scoped history/decision page cursor; do not combine with exact decision id.",
                "maxLength": 2048,
                "type": "string"
              },
              "purchase_reason": {
                "maxLength": 2000,
                "type": "string"
              },
              "purchase_request_id": {
                "description": "Idempotency id for the same exact decision intent, or exact id lookup when reading decisions. Never change inputs on an unknown write.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "purchase_result_sha256": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "purchase_result_version": {
                "type": "string"
              },
              "purchase_transaction": {
                "maxLength": 256,
                "type": "string"
              },
              "subject": {
                "description": "Subject to commission: a model id, instrument id or card sha (1-120 chars of [A-Za-z0-9._:/@+-]).",
                "type": "string"
              },
              "x_payment": {
                "description": "The X-PAYMENT header value (base64 x402 payload) signed by your wallet against accepts[] from the previous 402. Omit to receive the challenge.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "The wrapper's status fields. On PAYMENT_REQUIRED (isError:true) the route's x402 PaymentRequired object (x402Version, resource, accepts, extensions) is spread at the top level too, per the x402 MCP transport.",
            "properties": {
              "accepts": {
                "type": "array"
