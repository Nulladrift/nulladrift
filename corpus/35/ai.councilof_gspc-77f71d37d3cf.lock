{
  "lockfileVersion": 2,
  "subjects": {
    "ai.councilof/gspc": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://councilof.ai/mcp/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "csoai-gspc-mcp",
        "version": "1.4.4"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GSPC MCP. 49 free read-only tools and 5 paid x402 tools. Call tools/list for the current definitions. Call a paid tool without x_payment for its payment challenge; payment comes from the caller's wallet. Payment travels as the x_payment ARGUMENT; each implementation sets the X-PAYMENT header itself. A 402 challenge is not settlement, delivery or revenue. Measurement, not certification; verification stays free. witness_hash is quarantined and not advertised. MCP Registry server.version identifies this Pages HTTP implementation; npm is a separately versioned implementation.",
      "tools": [
        {
          "name": "art50_marking_evidence",
          "title": "Article 50 marking evidence (paid, x402; preview free)",
          "description": "PAID (x402 or CSOAI LTD invoice). Article 50 marking-evidence pack via https://councilof.ai/api/art50/marking-evidence: which machine-readable marks the named methods DETECT in these bytes right now. Scope: C2PA and IPTC metadata only (C2PA manifest store, assertion hashes, hard binding, claim signature; IPTC digitalSourceType); no watermark, fingerprint or other kind of mark is read. NOT_DETECTED is not unmarked: Article 50(2) is technology-neutral, so a mark this pack cannot read may be present, and metadata is often stripped on re-save. Disclosure: CSOAI is a member of the C2PA, whose specification is one of the two methods read. The pack carries the verbatim Art 50(2) text hash and the dates it turns on. Point-in-time detection — never a conformity opinion, never a compliance word of any kind. preview=true is free and returns the same measurement unsigned. Without x_payment the tool returns the 402 challenge. If the route is not deployed on this origin the tool says NOT_DEPLOYED rather than inventing a result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bytes_b64": {
                "description": "Alternatively the output bytes, base64 (≤20 MiB decoded).",
                "type": "string"
              },
              "manifest_b64": {
                "description": "Alternatively a detached C2PA manifest store, base64 (manifest-only mode).",
                "type": "string"
              },
              "preview": {
                "description": "true = free unsigned measurement (no card sha, no signature).",
                "type": "boolean"
              },
              "purchase_action": {
                "description": "Selfserve account-owned purchase action. Use Council bearer transport, omit x_payment; no new financial/provider action.",
                "enum": ["history", "recover", "decisions", "accept", "reject", "request_correction"],
                "type": "string"
              },
              "purchase_cursor": {
                "description": "Owner-scoped history/decision page cursor; do not combine with exact decision id.",
                "maxLength": 2048,
                "type": "string"
              },
              "purchase_reason": {
                "maxLength": 2000,
                "type": "string"
              },
              "purchase_request_id": {
                "description": "Idempotency id for the same exact decision intent, or exact id lookup when reading decisions. Never change inputs on an unknown write.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "purchase_result_sha256": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "purchase_result_version": {
                "type": "string"
              },
              "purchase_transaction": {
                "maxLength": 256,
                "type": "string"
              },
              "url": {
                "description": "Public HTTP(S) URL of the generative output to measure (≤20 MiB). The server fetches only this declared measurement subject.",
                "format": "uri",
                "maxLength": 2048,
                "pattern": "^https?://",
                "type": "string"
              },
              "x_payment": {
                "description": "The X-PAYMENT header value signed against accepts[] from the previous 402. Omit to receive the challenge.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "The wrapper's status fields. On PAYMENT_REQUIRED (isError:true) the route's x402 PaymentRequired object (x402Version, resource, accepts, extensions) is spread at the top level too, per the x402 MCP transport.",
            "properties": {
              "accepts": {
                "type": "array"
              },
              "deliverable": {},
              "delivery_state": {
                "type": "string"
              },
              "http_status": {
                "type": "integer"
              },
              "not_a_certification": {
                "type": "boolean"
              },
              "payment_presented": {
                "type": "boolean"
              },
              "resource": {
                "type": "object"
              },
              "route": {
                "type": "string"
              },
              "settlement_state": {
                "type": "string"
              },
              "status": {
                "description": "PAYMENT_REQUIRED, DELIVERED, NOT_DEPLOYED, UNREACHABLE, UNREADABLE_RESPONSE, BAD_ARGUMENTS or HTTP_<code>",
                "type": "string"
              },
              "tool": {
                "type": "string"
              },
              "x402Version": {
                "type": "integer"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Article 50 marking evidence (paid, x402; preview free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc61a328e3744e34ccb3b4f4f4937ece262f1e63ef6769bf96fdc8fe87c5c030"
        },
