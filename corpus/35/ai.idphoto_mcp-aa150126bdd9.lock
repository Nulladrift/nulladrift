{
  "lockfileVersion": 2,
  "subjects": {
    "ai.idphoto/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.idphoto.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "idphoto-ai",
        "title": "idphoto.ai ID Photo",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Create compliant passport, visa and ID photos with idphoto.ai. Use list_photo_specs / get_photo_spec to find the right specCode, then call make_id_photo with a base64 portrait. Without API credentials, make_id_photo is limited to 3 free photos per day.",
      "tools": [
        {
          "name": "get_photo_spec",
          "title": "Get photo spec",
          "description": "Get the detailed requirements of one photo spec: physical size, pixel size, DPI, background color, glasses and expression rules.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "specCode": {
                "description": "Spec code from list_photo_specs, e.g. 'us-passport'.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["specCode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ae12d99eda6117ef2d0a82c2fcd7c91307b76d988d0bfb1aa113a7163fe1d400"
        },
        {
          "name": "get_usage",
          "title": "Get usage",
          "description": "Show remaining quota. With API credentials: the idphoto.ai account status and remaining make-photo quota. Without credentials: how many free make_id_photo calls are left today.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a0a1b2abfbc9bf1b1c5fb860d8be28747571a2062261c1f167dcec4b0a4d138d"
        },
        {
          "name": "list_photo_specs",
          "title": "List photo specs",
          "description": "List all supported passport / visa / ID photo specifications as specCode + human-readable name (e.g. 'us-passport' = 'US Passport'). Use this to find the specCode for make_id_photo.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:55d349d0daf81c70c667e254fabab1a4b857be6831b6c2759a1610e08f83eeab"
        },
        {
          "name": "make_id_photo",
          "title": "Make ID photo",
          "description": "Turn a portrait photo into a compliant passport / visa / ID photo for a given document spec (cropping, resizing, background replacement, quality checks). Returns a temporary download URL for the finished JPEG, its pixel/physical size, and any detected quality issues (e.g. ISSUE_EYEGLASSES_NOT_ALLOWED) that may require a retake. Use list_photo_specs or get_photo_spec first if you are unsure of the specCode. The input image must be base64 (data URI prefix allowed), at most ~4 MB decoded, showing one person facing the camera. Without API credentials this is limited to 3 photos per day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "imageBase64": {
                "description": "Source portrait as base64 (JPEG/PNG). A 'data:image/jpeg;base64,' prefix is optional.",
                "minLength": 1,
                "type": "string"
              },
              "specCode": {
                "description": "Document spec code, e.g. 'us-passport', 'uk-passport', 'schengen-visa'. Specs starting with 'ai-' use AI generation and may be slow.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["imageBase64", "specCode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:579caf5259f8012859a4a67cf0e590179ad11a3d707ef9016a9a8d0a65959039"
        }
      ],
      "digest": "sha256:f8721e9c1c3b1d8dc68bacb12a4b9353ed9513ffaa40a62a8cbdc1e68f083166"
    }
  }
}
