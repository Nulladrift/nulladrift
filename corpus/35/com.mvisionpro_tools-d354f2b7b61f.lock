        "url": "https://mvisionpro.com/tools/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mvisionpro-tools",
        "version": "public-calc-core-v1; data=sha256:e339a85d4a45449df107f98077ad8ebfac723ab9022cbf041910945152991c71"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Machine-vision calculations for optics, interfaces, line scan, camera cross-reference, sensors, and models. Linear dimensions, pixel sizes, and exposure times use mm, µm, and µs. No pricing is provided. Details: https://mvisionpro.com/tools/api/",
      "tools": [
        {
          "name": "analog",
          "title": "Camera cross-reference",
          "description": "Compare one unambiguous competitor model with bounded Hikrobot candidates. Compare one unambiguous competitor model with a bounded set of public Hikrobot candidates.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Compare one unambiguous competitor model with a bounded set of public Hikrobot candidates.",
            "properties": {
              "lang": {
                "default": "en",
                "description": "Presentation language.",
                "enum": ["en", "ru"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum results.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Competitor model.",
                "maxLength": 128,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ff35fc9803d0fafa55de49d35268674770d2d88a2539964428996497fa18f021"
        },
        {
          "name": "interface",
          "title": "Interface bandwidth",
          "description": "Calculate stream bandwidth and evaluate interface options. Provide either camera or the complete manual stream set widthPx, heightPx, fps, bits, streamType and packed; do not combine the two modes. width and height are independent aliases for widthPx and heightPx, so mixed alias pairs are accepted, but do not send both aliases for one axis. The discovery alternatives describe complete sets; execution also rejects partial manual sets and every camera/manual mixture, for example camera with widthPx.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "allOf": [
              {
                "oneOf": [
                  {
                    "required": ["camera"]
                  },
                  {
                    "required": ["bits", "fps", "heightPx", "packed", "streamType", "widthPx"]
                  },
                  {
                    "required": ["bits", "fps", "height", "packed", "streamType", "widthPx"]
                  },
                  {
                    "required": ["bits", "fps", "heightPx", "packed", "streamType", "width"]
                  },
                  {
                    "required": ["bits", "fps", "height", "packed", "streamType", "width"]
                  }
                ]
              },
              {
                "not": {
                  "required": ["width", "widthPx"]
                }
              },
              {
                "not": {
                  "required": ["height", "heightPx"]
                }
              }
            ],
            "description": "Provide either camera or the complete manual stream set widthPx, heightPx, fps, bits, streamType and packed; do not combine the two modes. width and height are independent aliases for widthPx and heightPx, so mixed alias pairs are accepted, but do not send both aliases for one axis. The discovery alternatives describe complete sets; execution also rejects partial manual sets and every camera/manual mixture, for example camera with widthPx.",
            "properties": {
              "bits": {
                "description": "Logical bit depth.",
                "enum": [8, 10, 12, 14, 16],
                "type": "integer"
              },
              "cableLengthM": {
                "description": "Cable length in metres.",
                "maximum": 1000,
                "minimum": 0.1,
                "type": "number"
              },
              "camera": {
                "description": "Catalog camera model; exclusive with manual stream fields.",
                "maxLength": 128,
                "type": "string"
              },
              "cameras": {
                "description": "Camera count.",
                "maximum": 64,
                "minimum": 1,
                "type": "integer"
              },
              "fps": {
                "description": "Frame rate.",
                "maximum": 100000,
                "minimum": 0.001,
                "type": "number"
              },
              "height": {
                "description": "Alias for heightPx; do not send both.",
                "maximum": 200000,
                "minimum": 1,
                "type": "integer"
              },
              "heightPx": {
                "description": "Manual frame height in pixels.",
                "maximum": 200000,
                "minimum": 1,
                "type": "integer"
              },
              "interface": {
                "description": "Optional interface family to evaluate.",
                "maxLength": 32,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Presentation language.",
                "enum": ["en", "ru"],
                "type": "string"
              },
              "packed": {
                "description": "Whether a greater-than-eight-bit stream is packed.",
                "type": "boolean"
              },
              "streamType": {
                "description": "Stream type.",
                "enum": ["mono", "bayer", "rgb"],
                "type": "string"
              },
              "width": {
                "description": "Alias for widthPx; do not send both.",
                "maximum": 200000,
                "minimum": 1,
                "type": "integer"
              },
              "widthPx": {
                "description": "Manual frame width in pixels.",
                "maximum": 200000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72c5b0cf9c9e4c0d978b0f1c0c003f1e3aa0023f321c63cb90601502bb91b823"
        },
        {
          "name": "linescan",
          "title": "Line-scan calculation",
          "description": "Calculate line width, line rate, exposure and confirmed camera modes. widthMm is required. Provide exactly one speed field (speedMmS or speedMMin) and exactly one calculation set (defectMm+nPx or accuracyMm+kPx); mode is inferred when omitted. samplingMode defaults to xy, or to width when longitudinalStepMm is present.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "allOf": [
              {
                "oneOf": [
                  {
                    "required": ["speedMmS"]
                  },
                  {
                    "required": ["speedMMin"]
                  }
                ]
              },
              {
                "oneOf": [
                  {
                    "required": ["defectMm", "nPx"]
                  },
                  {
                    "required": ["accuracyMm", "kPx"]
                  }
                ]
              }
            ],
            "description": "widthMm is required. Provide exactly one speed field (speedMmS or speedMMin) and exactly one calculation set (defectMm+nPx or accuracyMm+kPx); mode is inferred when omitted. samplingMode defaults to xy, or to width when longitudinalStepMm is present.",
            "properties": {
              "accuracyMm": {
                "description": "Allowed error for measure-v2 mode.",
                "exclusiveMinimum": 0,
                "maximum": 1.7976931348623157e+308,
                "type": "number"
              },
              "camera": {
                "description": "Optional line-scan camera model.",
                "maxLength": 128,
                "type": "string"
              },
              "defectMm": {
                "description": "Minimum defect for detect mode.",
                "maximum": 100,
                "minimum": 0.001,
                "type": "number"
              },
              "dutyCycle": {
                "default": 0.8,
                "description": "Fraction of a line period available for exposure.",
                "maximum": 1,
                "minimum": 0.1,
                "type": "number"
              },
              "interface": {
                "description": "Optional interface family filter.",
                "maxLength": 32,
                "type": "string"
              },
              "kPx": {
                "description": "Sampling coefficient for measure-v2 mode.",
                "enum": [3, 5, 10],
                "type": "integer"
              },
              "lang": {
                "default": "en",
                "description": "Presentation language.",
                "enum": ["en", "ru"],
                "type": "string"
              },
              "longitudinalStepMm": {
                "description": "Required when samplingMode is width.",
                "exclusiveMinimum": 0,
                "maximum": 1.7976931348623157e+308,
                "type": "number"
              },
              "marginPct": {
                "default": 20,
                "description": "Line-rate reserve percentage.",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "mode": {
                "description": "Calculation mode; inferred from the exclusive defect or accuracy input set when omitted.",
                "enum": ["detect", "measure-v2"],
                "type": "string"
              },
              "nPx": {
                "description": "Pixels per defect for detect mode.",
                "maximum": 20,
                "minimum": 2,
                "type": "number"
              },
              "pixelFormat": {
                "description": "Optional confirmed mode pixel format.",
                "maxLength": 32,
                "type": "string"
              },
              "samplingMode": {
                "default": "xy",
                "description": "Two-axis or explicit longitudinal sampling.",
                "enum": ["xy", "width"],
                "type": "string"
              },
              "speedMMin": {
                "description": "Alternative speed in metres per minute; exclusive with speedMmS.",
                "exclusiveMinimum": 0,
                "maximum": 6000,
                "type": "number"
              },
              "speedMmS": {
                "description": "Speed in millimetres per second; exclusive with speedMMin.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "tdiStages": {
                "description": "Optional TDI stage requirement.",
                "maximum": 256,
                "minimum": 1,
                "type": "integer"
              },
              "widthMm": {
                "description": "Inspected web width in millimetres.",
                "maximum": 10000,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["widthMm"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:448c20091956fa051b9c96dc4f2350779fd192ec2828804497beb15cd9e80078"
        },
        {
          "name": "models",
          "title": "Model search",
          "description": "Search the bounded public catalog projection. Search the bounded public catalog projection by literal model, alias, SKU or slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Search the bounded public catalog projection by literal model, alias, SKU or slug.",
            "properties": {
              "lang": {
                "default": "en",
                "description": "Presentation language.",
                "enum": ["en", "ru"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum results.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Literal model, alias, SKU or slug search.",
                "maxLength": 128,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:609adda371af9c97fbd03f1423831fef8b8a4cbf430e2f205dd0b4cc0885cc5e"
        },
        {
          "name": "optics",
          "title": "Optics calculation",
          "description": "Calculate camera geometry, object sampling, exposure and depth of field. Provide exactly one sensor source: camera, sensor, or both manual sensor axes. Camera cannot be combined with manual passport fields. fovMm and wdMm are always required.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Provide exactly one sensor source: camera, sensor, or both manual sensor axes. Camera cannot be combined with manual passport fields. fovMm and wdMm are always required.",
            "oneOf": [
              {
                "required": ["camera"]
              },
              {
                "required": ["sensor"]
              },
              {
                "required": ["sensorHeightMm", "sensorWidthMm"]
              }
            ],
            "properties": {
              "blurPx": {
                "description": "Allowed motion blur in pixels.",
                "exclusiveMinimum": 0,
                "maximum": 20,
                "type": "number"
              },
              "camera": {
                "description": "Catalog camera model; exclusive with sensor or manual sensor axes.",
                "maxLength": 128,
                "type": "string"
              },
              "defectMm": {
                "description": "Feature size in millimetres.",
                "maximum": 100,
                "minimum": 0.001,
                "type": "number"
              },
              "fNumber": {
                "description": "Lens F-number.",
                "exclusiveMinimum": 0,
                "maximum": 256,
                "type": "number"
              },
              "fovHeightMm": {
                "description": "Optional field-of-view height in millimetres.",
                "maximum": 5000,
                "minimum": 1,
                "type": "number"
              },
              "fovMm": {
                "description": "Field-of-view width in millimetres.",
                "maximum": 5000,
                "minimum": 1,
                "type": "number"
              },
              "lang": {
                "default": "en",
                "description": "Presentation language.",
                "enum": ["en", "ru"],
                "type": "string"
              },
              "motionAxis": {
                "default": "width",
                "description": "Motion axis.",
                "enum": ["width", "height"],
                "type": "string"
              },
              "nPx": {
                "description": "Pixels required across a feature.",
                "maximum": 20,
                "minimum": 2,
                "type": "number"
              },
              "pixelSizeXUm": {
                "description": "Manual horizontal pixel size in micrometres; use with pixelSizeYUm.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "pixelSizeYUm": {
                "description": "Manual vertical pixel size in micrometres; use with pixelSizeXUm.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "resolutionHeightPx": {
                "description": "Manual vertical resolution; use with resolutionWidthPx.",
                "maximum": 200000,
                "minimum": 1,
                "type": "integer"
              },
              "resolutionWidthPx": {
                "description": "Manual horizontal resolution; use with resolutionHeightPx.",
                "maximum": 200000,
                "minimum": 1,
                "type": "integer"
              },
              "sensor": {
                "description": "Optical format; exclusive with camera or manual sensor axes.",
                "maxLength": 32,
                "type": "string"
              },
              "sensorHeightMm": {
                "description": "Manual active sensor height in millimetres; use with sensorWidthMm.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "sensorWidthMm": {
                "description": "Manual active sensor width in millimetres; use with sensorHeightMm.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "speedMmS": {
                "description": "Object speed in millimetres per second.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "wdMm": {
                "description": "Working distance in millimetres.",
                "maximum": 20000,
                "minimum": 10,
                "type": "number"
              }
            },
            "required": ["fovMm", "wdMm"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8dab45bf93532cfe85611adba574265c8e019594cfa22c137ee0973ce7eac2c6"
        },
        {
          "name": "sensors",
          "title": "Sensor lookup",
          "description": "Get a sensor aggregation by exactly one camera model or sensor part. Provide exactly one lookup key: a catalog camera model or a sensor part number.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "Provide exactly one lookup key: a catalog camera model or a sensor part number.",
            "oneOf": [
              {
                "required": ["model"]
              },
              {
                "required": ["sensor"]
              }
            ],
            "properties": {
              "lang": {
                "default": "en",
                "description": "Presentation language.",
                "enum": ["en", "ru"],
                "type": "string"
              },
              "model": {
                "description": "Catalog camera model; exclusive with sensor.",
                "maxLength": 128,
                "type": "string"
              },
              "sensor": {
                "description": "Sensor part number; exclusive with model.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bca185bf4ab3209920c4052eee0ac020b47bddad9923f610afd0cb2e0a977916"
        }
      ],
      "digest": "sha256:eb5acabc76e1c3e5e2a1e06b76b6977299e1ab7b4ad7100d81874ddb3892cf19"
    }
  }
}
