                "type": "string"
              },
              "provincia_id": {
                "type": "integer"
              },
              "tipo_vehiculo_id": {
                "type": "integer"
              }
            },
            "required": ["tipo_vehiculo_id"],
            "type": "object"
          },
          "annotations": {
