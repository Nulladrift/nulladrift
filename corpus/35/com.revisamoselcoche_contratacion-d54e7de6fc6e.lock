          },
          "digest": "sha256:8e404ca63a5048f17311e4e5dce35e1f6a2fb914bcaa9e2eb04fbfc7b31eb7da"
        },
        {
          "name": "huecos_disponibles",
          "title": "Cuándo puede ese perito",
          "description": "Si ese perito está disponible entre esas dos fechas. Aviso: la plataforma no tiene agenda por horas, así que esto dice si está o no ausente. La fecha concreta se acuerda después con el perito. No prometas una hora.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "desde": {
                "description": "AAAA-MM-DD",
                "type": "string"
              },
              "hasta": {
                "description": "AAAA-MM-DD",
                "type": "string"
              },
              "token_perito": {
                "type": "string"
              }
            },
            "required": ["desde", "hasta", "token_perito"],
            "type": "object"
          },
