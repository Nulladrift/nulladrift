        {
          "name": "huecos_disponibles",
          "title": "Cuándo puede ese perito",
          "description": "Si ese perito está disponible entre esas dos fechas. Aviso: la plataforma no tiene agenda por horas, así que esto dice si está o no ausente. La fecha concreta se acuerda después con el perito. No prometas una hora.",
