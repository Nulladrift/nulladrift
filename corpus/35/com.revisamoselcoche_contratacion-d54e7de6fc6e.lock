      "tools": [
        {
          "name": "buscar_servicio",
          "title": "Qué revisiones hay para ese coche",
          "description": "Traduce lo que ha dicho la persona («un Golf», «una furgoneta») a un tipo de vehículo del catálogo y devuelve las revisiones disponibles. Si no se puede saber con seguridad de qué vehículo habla, NO elige: devuelve la lista para que preguntes cuál es.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "tipo_vehiculo": {
                "description": "Lo que ha dicho la persona sobre su vehículo, tal cual.",
                "type": "string"
              }
            },
            "required": ["tipo_vehiculo"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf6efe3b857da5f13b3a82ad32287b937fd4695edf40000f2babb7d136a26a04"
        },
        {
          "name": "consultar_precio",
          "title": "Cuánto cuesta",
          "description": "El precio de la revisión para ese vehículo, esos informes y esa provincia. Es el mismo número que enseña la web: no lo calcules tú ni lo redondees.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ciudad_id": {
                "type": "integer"
              },
              "provincia": {
                "description": "La provincia por su nombre (\"Pontevedra\", \"A Coruña\"). Usa esto si no te ha dado el id la plataforma; no inventes ids.",
                "type": "string"
              },
              "provincia_id": {
                "type": "integer"
              },
              "tipo_informe_ids": {
                "items": {
                  "type": "integer"
                },
                "minItems": 1,
                "type": "array"
              },
              "tipo_vehiculo_id": {
                "type": "integer"
              },
              "token_perito": {
                "description": "Solo si se pregunta por el precio de un perito concreto.",
                "type": "string"
              }
            },
            "required": ["tipo_informe_ids", "tipo_vehiculo_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e45b37d4dbb553ac310c06b4fa7eff6bc149862568c09b011e7c149a27d8953"
        },
        {
          "name": "crear_reserva",
          "title": "Cerrar la contratación",
          "description": "Da de alta la solicitud de revisión. Es la ÚNICA herramienta que crea algo. Antes de llamarla tienes que haberle dicho a la persona, en voz alta, qué va a contratar —vehículo, informe, provincia y precio— y haber recibido un sí. Ese mismo texto va en `resumen_confirmado`. Si lo dejas vacío, no se crea nada: se te devuelve el resumen para que lo leas.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "acepta_condiciones": {
                "type": "boolean"
              },
              "apellidos": {
                "type": "string"
              },
              "autorizacion_vendedor": {
                "type": "boolean"
              },
              "ciudad": {
                "description": "La ciudad donde está el coche, tal cual la dice la persona. No inventes un id: la plataforma la busca en la provincia y, si no la encuentra, te devuelve parecidas para preguntar.",
                "type": "string"
              },
              "ciudad_id": {
                "description": "Solo si la plataforma te ha dado ya el id de esa ciudad.",
                "type": "integer"
              },
              "clave_idempotencia": {
                "description": "Para no duplicar. Si reintentas la MISMA solicitud, manda la misma clave.",
                "type": "string"
              },
              "email": {
                "format": "email",
                "type": "string"
              },
              "informacion_vendedor": {
                "type": "string"
              },
              "modo_seleccion": {
                "description": "1 = que le propongan peritos. 2 = un perito concreto.",
                "maximum": 2,
                "minimum": 1,
                "type": "integer"
              },
              "movimiento_vehiculo": {
                "description": "Kilómetros de desplazamiento extra que pide la persona, si los hay. Si no lo sabe, no lo mandes: vale 0.",
                "minimum": 0,
                "type": "integer"
              },
              "nombre": {
                "type": "string"
              },
              "pais_id": {
                "type": "integer"
              },
              "provincia": {
                "description": "La provincia por su nombre (\"Pontevedra\", \"A Coruña\"). Usa esto si no te ha dado el id la plataforma; no inventes ids.",
                "type": "string"
              },
              "provincia_id": {
                "type": "integer"
              },
              "resumen_confirmado": {
                "description": "Lo que le has leído a la persona y ha aceptado. Sin esto no se crea nada.",
                "type": "string"
              },
              "telefono": {
                "description": "Nueve dígitos, como pide el formulario.",
                "maxLength": 9,
                "minLength": 9,
                "type": "string"
              },
              "tipo_informe_ids": {
                "items": {
                  "type": "integer"
                },
                "minItems": 1,
                "type": "array"
              },
              "tipo_vehiculo_id": {
                "type": "integer"
              },
              "token_perito": {
                "type": "string"
              }
            },
            "required": ["acepta_condiciones", "apellidos", "autorizacion_vendedor", "email", "informacion_vendedor", "modo_seleccion", "nombre", "telefono", "tipo_informe_ids", "tipo_vehiculo_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
