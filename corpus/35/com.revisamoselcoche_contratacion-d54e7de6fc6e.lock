        },
        {
          "name": "puntos_de_servicio",
          "title": "Qué peritos pueden hacerla",
          "description": "Los peritos que cubren esa provincia y ese tipo de vehículo, con su valoración y su precio. Los que están de vacaciones no salen.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
