          "digest": "sha256:d9c7701dc906539802f767f5c445dc3464e95b3b1e5e03b8133aa7c593f9a787"
        },
        {
          "name": "estado_reserva",
          "title": "Cómo va una solicitud",
          "description": "El estado de una solicitud ya hecha. Hacen falta la referencia y el correo con el que se creó: con la referencia sola no se abre.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "format": "email",
                "type": "string"
              },
              "token_reserva": {
                "type": "string"
              }
            },
            "required": ["email", "token_reserva"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
