{
  "lockfileVersion": 2,
  "subjects": {
    "com.hoopsapi/basketball-odds": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hoopsapi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "hoopsapi",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Basketball odds from 6 bookmakers (1xbet, betway, fanduel, pinnacle, smarkets, unibet) for 100+ competitions, refreshed every 10 minutes. Odds are decimal; spread lines are the home team's handicap. Use list_competitions to find a competition's exact name. Each tool call counts as one request against the user's HoopsAPI plan.",
      "tools": [
        {
          "name": "get_game",
          "description": "One game by id with every bookmaker's main lines for every period. Works for finished games too, returning their closing odds.",
          "inputSchema": {
            "properties": {
              "game_id": {
                "type": "integer"
              },
              "include_alternate_lines": {
                "default": false,
                "description": "Also return every alternate handicap and total line (larger response)",
                "type": "boolean"
              }
            },
            "required": ["game_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2787763056bf7f0fd61151ce3c1c47f80d8da66707311bcca222d38ad8afa00a"
        },
        {
          "name": "get_game_history",
          "description": "Every price change for a game, newest first (Data plan). Use it for line movement and closing odds.",
          "inputSchema": {
            "properties": {
              "game_id": {
                "type": "integer"
              },
              "limit": {
                "default": 100,
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "enum": ["moneyline", "spread", "total", "team_total_home", "team_total_away"],
                "type": "string"
              },
              "period": {
                "enum": ["ft", "h1", "h2", "q1", "q2", "q3", "q4"],
                "type": "string"
              },
              "provider": {
                "description": "Only this bookmaker, e.g. pinnacle (see list_providers)",
                "type": "string"
              }
            },
            "required": ["game_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:012cdb2cb0c491c0f80f87b50350fdb99f57ede902430b70800d7d1443f9f2a2"
        },
        {
          "name": "list_competitions",
          "description": "Basketball competitions that have upcoming games with odds, with the number of games in each. Use it to find the exact competition name for the other tools.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef78eebdcb51b7c4e8110480ffba68c0eab762c315e22d50dc2f7bc2e400c9b2"
        },
        {
          "name": "list_discrepancies",
          "description": "The biggest cross-bookmaker differences on main lines for upcoming games: moneyline prices, handicap lines and totals (Pro and Data plans).",
          "inputSchema": {
            "properties": {
              "competition": {
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "default": "ft",
                "enum": ["ft", "h1", "h2", "q1", "q2", "q3", "q4"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0ff58e9ff34cc3bdc38a8240542433c5d53934a78bc367fc4e40f1b8c676ca27"
        },
        {
          "name": "list_games",
          "description": "Upcoming games in one competition with each bookmaker's main moneyline, handicap (spread, line = home team's handicap) and total, in decimal odds. Full game only unless include_periods is true.",
          "inputSchema": {
            "properties": {
              "competition": {
                "description": "Competition name, case-insensitive, e.g. \"NBA\" or \"Europe - Euroleague\" (see list_competitions)",
                "type": "string"
              },
              "include_periods": {
                "default": false,
                "description": "Also return halves and quarters (larger response)",
                "type": "boolean"
              }
            },
            "required": ["competition"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ecae89d2b723c41d91961f0179e0f2be13b295a6cd69962c384f59f9193055e4"
        },
        {
          "name": "list_providers",
          "description": "The bookmakers covered and when each was last collected.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:276d4c51df7c96bb993926b4cbbf8f247d6f839f4bdbbf708d637cb98b4262ac"
        }
      ],
      "digest": "sha256:b3c09197277c1a9120a0ab39ad896e189c2a75af3ec56551429c74d45069c5c7"
    }
  }
}
