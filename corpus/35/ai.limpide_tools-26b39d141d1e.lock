      "tools": [
        {
          "name": "explain_principle",
          "title": "Understand a principle",
          "description": "Why a maths principle holds, shown on its figure, for a student who asks why or a tutor preparing an explanation. special-products: the identités remarquables of the first year of maturité, (a + b)^2 = a^2 + 2ab + b^2, (a - b)^2 = a^2 - 2ab + b^2 and (a + b)(a - b) = a^2 - b^2, each read on a figure of squares and rectangles, then why a sum of squares x^2 + b^2, with b a nonzero number, does not factor over the reals, read on the parabola y = x^2 + b^2 above the axis. pythagoras: in a right triangle with hypotenuse c, a^2 + b^2 = c^2, read on four copies of the triangle in a square of side a + b. For each part: a question for the student, the statement, the trap students fall into, why it is true, an example with numbers, for the identities how to read them backwards to factor, with the rule that recognises each, and the generate_exercises topic and trap that practise it. To teach with a part, ask its `question` first, about what its figure shows, and wait for the student's answer before giving the explanation, which holds the answer. In French (Swiss course conventions) or English. A host that draws views shows each figure and its explanation under the call. pageUrl is the page of the principle, with the figures and their explanation, in the language asked for: give it to the student only when the figures are not shown under the call. Deterministic: use this instead of explaining from memory.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the explanation: fr (Swiss course conventions) or en.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "principle": {
                "description": "special-products: the identités remarquables (a + b)^2, (a - b)^2 and (a + b)(a - b) = a^2 - b^2, and why a sum of squares x^2 + b^2, with b a nonzero number, does not factor over the reals. pythagoras: in a right triangle with hypotenuse c, a^2 + b^2 = c^2.",
                "enum": ["special-products", "pythagoras"],
                "type": "string"
              }
            },
            "required": ["principle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://limpide/exercise.html"
            },
            "ui/resourceUri": "ui://limpide/exercise.html"
          },
          "digest": "sha256:722a2e3e93e488f281ba08990f982abf837422d63838e05d68e5f9d2b52e5140"
        },
        {
          "name": "generate_exercises",
          "title": "Verified exercises",
          "description": "Verified maths exercises for tutors, human or AI, in French (Swiss course conventions) or English. Seven topics, six for the first year of maturité: product equations (équations produit) of degree 2 and 3, linear equations (équations du premier degré), quadratic equations (équations du second degré), solved by factoring or the discriminant, 2x2 linear systems, fractional equations (équations fractionnaires) with their domain, and factoring (factorisation), an expression to factor completely; and for beginners, before that year, Pythagoras' theorem, a right triangle with a missing side, or the distance between two points. Each exercise is built from its solutions, so its answer key is always right. Each one sets a named trap, the error it tests: for product equations hidden common factor, difference of squares, sum of squares, x as a common factor, grouping, perfect square; for linear equations moving a term, minus before brackets, common denominator, x cancels (no solution, or every real number); for quadratic equations no constant term, sum and product, negative coefficient b, sign of the discriminant (one solution, or none); for systems substitution, subtracting the equations, multiplying an equation, x and y cancel (parallel lines, or one line); for fractional equations checking the domain (a candidate root that is an excluded value), a term without a denominator, a minus before a fraction, the common denominator; for factoring common factor first, difference of squares, square of a sum, square of a difference, sum of squares (x^2 + b^2, with b a nonzero number, does not factor over the reals), grouping; for Pythagoras missing leg, missing hypotenuse, finding the hypotenuse, distance between two points (a sign lost when subtracting a negative coordinate). Returns the statement for the student and, for the tutor only, the solution set ([] when there is none, one element, U+211D, the symbol of the reals, when every real number is a solution; for a system the pair \"(x ; y)\", [] for parallel lines, or \"(x ; mx + p)\" when both equations are one line; for factoring the factored form; for Pythagoras the length asked), and explained steps with the trap step and its note; in the tutor view, a host that draws views also shows the figure behind a switch: the graph of the function, its zeros the solutions, the two lines of a system, the triangle to scale for Pythagoras or the two points on axes with their right triangle, or for factoring the drawing of the identité remarquable in the step that uses it (its `identity`). Never show the solution to the student. To check a student's answer by substitution, each exercise carries equation (everything moved to the left, as integer coefficients from the constant term up; for factoring, the expression to factor; for Pythagoras, in the length asked, whose positive root is the answer) or, for a system, system (each equation as [constant, x, y]). For a fractional equation, `excluded` lists the values x cannot take, and the solutions are the roots of `equation` outside it. explain_principle with pythagoras says why the theorem holds. Give a seed to get the same exercise again; its id names it. Give a date (YYYY-MM-DD) instead for the exercise of that day, the same for every reader: today's date gives the exercise of the day. Deterministic: use this instead of writing exercises and answer keys yourself.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "default": 1,
                "description": "How many exercises, from 1 to 20. With a seed, they use seed, seed + 1, and so on.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "date": {
                "description": "The exercise of that day (YYYY-MM-DD), the same for every reader: today's date gives the exercise of the day. In place of a seed.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the statement and the solution: fr (Swiss course conventions) or en.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "seed": {
                "description": "The same seed (with the same trap) always gives the same exercise. Leave it out for a new one.",
                "maximum": 2147483647,
                "minimum": 0,
                "type": "integer"
              },
              "topic": {
                "default": "product-equations",
                "description": "product-equations: équations produit of degree 2 and 3, solved by factoring. linear-equations: équations du premier degré, with brackets, fractions, and the cases with no solution or every real number. quadratic-equations: équations du second degré ax^2 + bx + c = 0, by factoring or the discriminant. linear-systems: systems of two linear equations in x and y, by substitution or elimination, with the parallel and identical cases. fractional-equations: équations fractionnaires, x in a denominator, with their domain of definition. factoring: an expression to factor completely, with a common factor, grouping and the identités remarquables. All first year of maturité, except pythagoras: for beginners, before that year, a right triangle, find the missing side, or the distance between two points.",
                "enum": ["product-equations", "linear-equations", "quadratic-equations", "linear-systems", "fractional-equations", "factoring", "pythagoras"],
                "type": "string"
              },
              "trap": {
                "description": "The error the exercise tests, one of its topic's. Leave it out and the seed chooses one; the answer names it.",
                "enum": ["common-factor-in-brackets", "difference-of-squares", "sum-of-squares", "x-common-factor", "grouping", "perfect-square", "moving-terms", "minus-before-brackets", "clearing-denominators", "x-cancels", "no-constant-term", "sum-and-product", "negative-b", "sign-of-discriminant", "substitution", "subtracting-equations", "multiplying-an-equation", "unknowns-cancel", "excluded-candidate", "term-without-denominator", "minus-before-fraction", "wrong-common-denominator", "common-factor-first", "square-of-a-sum", "square-of-a-difference", "missing-leg", "missing-hypotenuse", "find-the-hypotenuse", "distance-between-points"],
                "type": "string"
              },
              "view": {
                "default": "tutor",
                "description": "What a host that draws views shows under the call. tutor: the exercise with its steps, solution and figure behind a switch, for a tutor reading this chat. student: the statement only, when the student reads this chat. The result carries the solution either way, for you. With student, the student reads your reply too: do not write the solution, the steps or the answer set in it; use them to check the student's work.",
                "enum": ["tutor", "student"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
