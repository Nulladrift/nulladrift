        },
        {
          "name": "request_exercise",
          "title": "Ask for a missing topic",
          "description": "Ask Limpide for maths exercises this server does not have yet, or give one line of feedback on an exercise. Use it when generate_exercises has no topic for what the tutor needs. Limpide reads the requests each morning to choose the next topics, and promises nothing; the answer lists the topics that exist today. Never include a student's name, work or answers: name the topic, the level and, if useful, one line about what is missing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the exercises wanted, and of this answer: fr or en.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "level": {
                "description": "The school level, if known (\"first year of maturité\"), at most 40 characters.",
                "maxLength": 40,
                "minLength": 1,
                "pattern": "^[^\\r\\n\\v\\f\\u0085\\u2028\\u2029]*$",
                "type": "string"
              },
              "note": {
                "description": "One line of feedback, at most 200 characters: what is missing, or what is wrong in an exercise (give its id). Never a student's name, work or answers.",
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[^\\r\\n\\v\\f\\u0085\\u2028\\u2029]*$",
                "type": "string"
              },
              "topic": {
                "description": "The topic wanted, in a few words (\"quadratic equations\", \"trigonométrie\"), at most 80 characters.",
                "maxLength": 80,
                "minLength": 1,
                "pattern": "^[^\\r\\n\\v\\f\\u0085\\u2028\\u2029]*$",
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1d1d4cf9eb01798876e9bf6e883629b1bdbaa2029ad20d77ee8e7bb19efea1f6"
        }
