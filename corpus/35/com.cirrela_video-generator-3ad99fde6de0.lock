        {
          "name": "make_wish",
          "title": "Make a personalised video wish",
          "description": "Prepares a personalised video wish: Santa Claus, Mrs Claus, an elf, Saint Nicholas, the Three Kings, the Tooth Fairy, a birthday bear or another character says a first name and a short message, in the chosen language. Returns the link to its page on cirrela.com, already filled in: there the person watches the whole video with the Cirrela mark before deciding anything, and can keep it without the mark with one payment on that page. Nothing is rendered or paid in the chat, and no sign-in is needed. A first name and words only: no photo, no real person's face or voice; the words can't hold a link, an address or a phone number. Fits requests such as \"personalised Santa video for my son Leo\", \"vidéo personnalisée du Père Noël pour Emma\", \"video personalizado de Papá Noel para Lucía\", \"vídeo personalizado do Papai Noel para o João\". Give the person the link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "character": {
                "description": "Optional: who speaks, if the person chose (santa-cabin or santa-workshop for Santa, mrs-claus, elf, saint-nicolas, king-melchior, tooth-fairy, birthday-bear…). It must belong to the occasion; left out, the occasion's usual character.",
                "enum": ["santa-cabin", "santa-workshop", "mrs-claus", "elf", "christmas-reindeer", "christmas-snowman", "birthday-bear", "birthday-baker", "newyear-penguin", "newyear-host", "diwali-host", "diwali-elder", "tooth-fairy", "tooth-mouse", "king-balthasar", "king-melchior", "king-gaspar", "valentine-cat", "valentine-bear", "eid-host", "eid-elder", "easter-bunny", "mothers-bear", "fathers-bear", "hanukkah-host", "saint-nicolas"],
                "type": "string"
              },
              "language": {
                "description": "The language spoken: en, fr, es, pt (Brazil), pt-PT (Portugal), hi, ar or id. Usually the language the person writes in.",
                "enum": ["en", "fr", "pt", "pt-PT", "es", "hi", "ar", "id"],
                "type": "string"
              },
              "message": {
                "description": "Optional: the exact words, with the first name in them, at most about 12 seconds spoken. Left out, the page offers the occasion's own words.",
                "maxLength": 200,
                "type": "string"
              },
              "name": {
                "description": "The first name the video says, as it should be written (a child's first name is fine; never a surname or an address).",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "occasion": {
                "description": "Default santa. The occasion: santa (Santa Claus speaks to a child), nice-list (Santa tells a child they are on the Nice List, always kind), elf-arrival (a Christmas elf tells a child he is back for December), santa-reminder (Santa kindly encourages a child: bedtime, sharing or listening; never a threat), elf-magic (the family’s Christmas elf was touched: Santa tells the child the magic is mended and nobody is in trouble), elf-asleep (the elf forgot to move overnight: Santa says he was simply too tired), santa-exists (a child doubts Santa is real: Santa answers with warmth), gift-late (the Christmas gift hasn't arrived: Santa says it's on its way, a little late but worth the wait), santa-departs (Christmas Eve: Santa announces he is taking off with everyone's gifts), first-christmas (Santa, Mrs Claus or the elf welcomes the family's new baby to their first Christmas, saying the baby's name), baby-news (Santa announces a baby on the way to the person named: a grandparent, a big sibling, an aunt), elf-goodbye (24 December: the family's Christmas elf says goodbye to the child and flies home with Santa), saint-nicolas (Saint Nicholas, the bishop of 6 December in Belgium, the Netherlands, Alsace and Germany, speaks to a child), christmas (a reindeer, a snowman or Mrs Claus, for anyone), birthday, engagement (congratulates a couple by their names), wedding (wedding wishes or a toast from a guest who can't attend, with the couple's names), anniversary (a wedding anniversary, the couple's names), retirement (a happy retirement and thank-you, by name), new-year, tooth-fairy, three-kings (5 January), valentine, easter, mothers-day, fathers-day, eid, diwali, hanukkah.",
                "enum": ["santa", "christmas", "birthday", "new-year", "diwali", "tooth-fairy", "three-kings", "valentine", "eid", "easter", "mothers-day", "fathers-day", "hanukkah", "engagement", "wedding", "anniversary", "retirement", "nice-list", "elf-arrival", "santa-reminder", "elf-magic", "elf-asleep", "santa-exists", "gift-late", "santa-departs", "first-christmas", "baby-news", "elf-goodbye", "saint-nicolas"],
                "type": "string"
              }
            },
            "required": ["language", "name"],
            "type": "object"
          },
