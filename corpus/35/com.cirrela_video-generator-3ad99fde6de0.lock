        },
        {
          "name": "create_image",
          "title": "Create an image",
          "description": "Starts making one or more images and spends their credits (refunded if it fails). Poll get_generation with the id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect_ratio": {
                "description": "Aspect ratio, e.g. \"16:9\", \"9:16\" (vertical, for Reels and TikTok) or \"1:1\".",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Retrying with the same key never creates twice.",
                "maxLength": 255,
                "type": "string"
              },
              "image": {
                "description": "Optional start image: base64 JPEG, PNG or WebP (a data: URL works), under 10 MB.",
                "type": "string"
              },
              "image_id": {
                "description": "Optional start image already sent to POST /v1/uploads.",
                "type": "string"
              },
              "max_credits": {
                "description": "Refuse instead of spending more than this many credits.",
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "description": "A model id from list_models, instead of a tier.",
                "type": "string"
              },
              "num_images": {
                "description": "Images to make, up to the model's max_images.",
                "minimum": 1,
                "type": "integer"
              },
              "photo_consent": {
                "description": "Required with an image: true only if the person confirmed they have the right to use it and the people in it agree.",
                "type": "boolean"
              },
              "prompt": {
                "description": "What to make, in plain words. @handles use the person's saved characters.",
                "maxLength": 4000,
                "minLength": 3,
                "type": "string"
              },
              "resolution": {
                "description": "e.g. \"720p\" or \"1080p\" for videos, \"2K\" for images. Defaults to the tier's.",
                "type": "string"
              },
              "tier": {
                "description": "Quality tier: quick (cheapest), great (best value, default), cinema (most realistic). Or give `model` instead.",
                "enum": ["quick", "great", "cinema"],
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
