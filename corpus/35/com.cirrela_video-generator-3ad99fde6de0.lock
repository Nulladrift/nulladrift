  "subjects": {
    "com.cirrela/video-generator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cirrela.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "cirrela",
        "title": "Cirrela",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Cirrela makes short AI videos. make_wish (Santa or another character says a first name), create_film and create_ad need no sign-in: they return a cirrela.com link where the person watches and decides; give them the link. create_video and create_image spend the connected account's credits: say the cost first (estimate_cost) unless already agreed. An account with no credits can't render: say so, without naming a price or an offer. After creating, call get_generation with the id until it is completed or failed. Videos take about 1 to 3 minutes and images about 20 seconds. A failed render is refunded automatically. Quality tiers: quick (cheapest), great (best value, the default), cinema (most realistic). Wishes use a first name and words only: never ask for or send a photo of a child.",
      "tools": [
        {
          "name": "create_ad",
          "title": "Prepare a product video ad",
          "description": "Prepares video ads for a product, one per format (vertical 9:16 for Reels and TikTok, square 1:1, wide 16:9), from the product's page (Shopify, Amazon, Etsy or any shop) or its name. Returns the link to Cirrela's product-ad page filled in: the page reads the product when the person taps Import, shows the start images and the cost before anything is spent. This tool fetches nothing and renders nothing. Fits \"make an ad for my product\", \"fais une pub vidéo pour mon produit\", \"haz un anuncio en vídeo de mi producto\", \"faça um anúncio em vídeo do meu produto\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Optional: the page's language, usually the one the person writes in. Default en.",
                "enum": ["en", "fr", "es", "pt"],
                "type": "string"
              },
              "product": {
                "description": "Or, without a page: the product in a few words.",
                "maxLength": 300,
                "type": "string"
              },
              "product_url": {
                "description": "The product's page, https://…",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
