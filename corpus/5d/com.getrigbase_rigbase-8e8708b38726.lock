{
  "lockfileVersion": 2,
  "subjects": {
    "com.getrigbase/rigbase": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getrigbase.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "rigbase",
        "title": "RigBase",
        "version": "1.0.0",
        "websiteUrl": "https://getrigbase.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RigBase is a database of measured local-LLM speeds (tokens/sec) on real home AI rigs (NVIDIA/AMD/Intel GPUs, Apple Silicon, Strix Halo, DGX Spark). Every measured number links to its public original source with credit (e.g. Mia's AI Lab, Tech2wild). Use search_builds / get_build / best_gpu_for_model for measured data; use can_it_run for measured matches first, and only then a labelled VRAM-fit estimate. Always cite the source credit and the canonical https://getrigbase.com URL from the tool result. Never invent tok/s numbers. Advise against quants below Q4.",
      "tools": [
        {
          "name": "best_gpu_for_model",
          "description": "Return the fastest measured RigBase result for a model, plus tok/s per euro where a build cost or known GPU street price exists. Includes source credit and canonical URL.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many top results to return (default 5, max 15).",
                "type": "integer"
              },
              "model": {
                "description": "Model name or substring, e.g. \"Gemma 4 31B\" or \"Qwen3.8\".",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ff723f1627dd6321e38cce772491c2e09ed6210efd2e5e94a49894453e58e48"
        },
        {
          "name": "can_it_run",
          "description": "Ask whether a given GPU setup can run a model. Returns measured RigBase results when available; otherwise a VRAM-fit estimate clearly labelled as an estimate (weights arithmetic, not a measured speed). Advises against quants below Q4. Always includes source credit and URLs for measured rows.",
          "inputSchema": {
            "properties": {
              "count": {
                "description": "How many identical GPUs / nodes (default 1).",
                "type": "integer"
              },
              "gpu": {
                "description": "GPU or system name, e.g. \"RTX 3090\", \"RTX 5090\", \"DGX Spark\", \"Apple Silicon Mac\".",
                "type": "string"
              },
              "model": {
                "description": "Model name, e.g. \"Qwen3.8 27B\", \"gpt-oss 120B\", \"Gemma 4 31B\".",
                "type": "string"
              },
              "quant": {
                "description": "Optional quant for the estimate (default Q4_K_M). Avoid below Q4.",
                "type": "string"
              }
            },
            "required": ["gpu", "model"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ce162ab145d31adb3f714f0333ad4e5d7070691be3607d798b4963fdabff07ea"
        },
        {
          "name": "get_build",
          "description": "Fetch one RigBase build by slug (e.g. \"dual-3090-ryzen-3700x\"). Returns parts, measured results, source credit and canonical URL.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Build slug from a RigBase /builds/.../ URL.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f9e69a93abf800aeda02d529d6df5f10249f68734209c1d3044fa63e74caf131"
        },
        {
          "name": "search_builds",
          "description": "Search RigBase measured home AI builds. Filter by GPU name, model name, minimum VRAM (GB), and/or maximum build cost. Returns top matches with tok/s, quant, engine, source credit and canonical getrigbase.com URL. Never invents numbers.",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "Optional currency filter: EUR or USD.",
                "type": "string"
              },
              "gpu": {
                "description": "Substring to match in the GPUs field (e.g. \"3090\", \"DGX Spark\", \"5090\").",
                "type": "string"
              },
              "limit": {
                "description": "Max builds to return (default 8, max 25).",
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum reported build cost (same currency as the build, usually EUR or USD).",
                "type": "number"
              },
              "min_vram_gb": {
                "description": "Minimum total VRAM / unified memory in GB.",
                "type": "number"
              },
              "model": {
                "description": "Substring to match a measured model name (e.g. \"Qwen3.8\", \"gpt-oss 120B\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f56253073d9f93f0abcb4f1ea1645a9e5e36f1ba67f0e439e2bcf8c239379b4"
        }
      ],
      "digest": "sha256:1e0c93c08311e9edadd1cb5b2897d6b7bd4d27d841f123b8f81e763004aa43cc"
    }
  }
}
