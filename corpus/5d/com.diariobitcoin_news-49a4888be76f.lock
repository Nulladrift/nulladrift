                "type": ["string", "null"]
              },
              "cursor": {
                "description": "`next_cursor` of the previous page, with the same query, category,\nexclude_category, since and until.",
                "type": ["string", "null"]
              },
              "exclude_category": {
                "default": null,
                "description": "Category slugs to leave out (with their subcategories), e.g.\n[\"analisis\"]: the automated per-token market analyses, dozens a day,\nwhich otherwise fill the newest-first listing. Up to 10.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": ["array", "null"]
              },
              "limit": {
                "description": "Items per page (1-25, default 10).",
                "format": "uint32",
                "maximum": 25,
                "minimum": 1,
                "type": ["integer", "null"]
              },
              "query": {
                "description": "Search words. The corpus is Spanish: write queries in Spanish\n(\"regulación\", not \"regulation\"); tickers and names (BTC, ETF,\nBlackRock) work as-is. Every word must match. Omit to list the newest\narticles.",
                "maxLength": 200,
                "type": ["string", "null"]
              },
              "since": {
                "description": "Only articles published at or after this time: an ISO 8601 date\n(\"2026-10-27\", midnight UTC) or date-time (\"2026-10-27T09:00:00Z\").",
                "type": ["string", "null"]
              },
              "until": {
                "description": "Only articles published up to this time: an ISO 8601 date (the whole\nday, UTC, included: \"2016-12-31\") or date-time. With since, a past\nperiod (\"halving\" between 2016-06-01 and 2016-07-31).",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
