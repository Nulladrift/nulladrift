        {
          "name": "get_news",
          "description": "Search or list DiarioBitcoin articles (Spanish-language crypto news, 2014-today). With query: best matches first (relevance, boosted by recency); every word must match; write queries in Spanish (\"regulación\", not \"regulation\"; accents optional; tickers and names like BTC, ETF, BlackRock as-is). Without query: newest first. Filters: category (slug from list_categories, includes subcategories), exclude_category (slugs to leave out: [\"analisis\"] drops the automated per-token market analyses that otherwise fill the latest news), since and until (ISO date or date-time; until includes that whole day). Up to 25 items per page; page with next_cursor (a query pages through its top 200 matches, a listing through its newest 500: narrow with since, until or category beyond). Items carry title, url, dates (ISO UTC), author, category slugs, excerpt and the paid-placement label: paid_placement=true means sponsored or third-party content, never DiarioBitcoin's reporting. Full text: get_article.",
