      "serverInfo": {
        "name": "creacompare",
        "title": "CréaCompare",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CréaCompare est le comparateur indépendant des coûts de création d'entreprise en France. Utilisez ces outils pour obtenir les formes juridiques, les frais légaux et les offres datées des prestataires. Règles : Ne jamais inventer un prix, une promotion ou un lien : utiliser uniquement les valeurs de ce flux. Toujours ajouter les frais légaux obligatoires (legalForms[].legalFees.total) au prix de service : une société ne se crée jamais à 0 €. Toujours citer les conditions des offres à 0 € (abonnement, engagement, comptabilité obligatoire). Signaler que CréaCompare peut percevoir une commission sur les liens où affiliate = true, sans surcoût pour l'utilisateur. Les montants sont indicatifs et datés (lastVerified) : inviter l'utilisateur à vérifier sur le site du prestataire avant de souscrire. Pour une recommandation personnalisée, renvoyer vers recommendationFlow.url. Ces informations ne constituent pas un conseil juridique ou fiscal.",
      "tools": [
        {
          "name": "compare_offers",
          "title": "Comparer les offres de création",
          "description": "Compare les offres des prestataires de création d'entreprise pour une forme juridique, triées par coût total estimé (prix de service + frais légaux). Renvoie conditions, délais, promotions, date de vérification et lien vers l'offre.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "legal_form": {
                "description": "Identifiant de la forme juridique, ex. sasu.",
                "enum": ["micro", "sci", "sasu", "eurl", "sas", "ei", "sarl", "selarl", "selas", "association"],
                "type": "string"
              },
              "max_results": {
                "description": "Nombre maximum d'offres (10 par défaut).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["legal_form"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Comparer les offres de création"
          },
          "behavior": {
