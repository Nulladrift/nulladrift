        {
          "name": "get_case",
          "title": "Case details",
          "description": "One case: dates, disposition, trial, verdict and offer amounts, its motion rulings, and the judges, attorneys and law firms by side.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "docket_number": {
                "description": "Docket number, e.g. HHD-CV-21-6140000-S.",
                "type": "string"
              },
              "purpose": {
                "description": "One sentence on what you are trying to find out. Logged to improve the dataset; never returned.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["docket_number"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attorneys": {
                "description": "Attorneys who appeared, with their juris numbers for get_attorney.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "jurisNumber": {
                      "description": "Juris number.",
                      "type": "string"
                    },
                    "name": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Name; null when the registry has none."
                    },
                    "side": {
                      "description": "Side the attorney appeared for: plaintiff or defendant.",
                      "type": "string"
                    }
                  },
                  "required": ["jurisNumber", "name", "side"],
                  "type": "object"
                },
                "type": "array"
              },
              "case": {
                "additionalProperties": false,
                "description": "The case record.",
                "properties": {
                  "acceptedOfferCents": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Amount of the offer of compromise that was accepted, in cents; null when none was accepted or the amount is unknown."
                  },
                  "arbitrationNetAwardCents": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Net court-annexed arbitration award, in cents, when one was read from the award."
                  },
                  "caseType": {
                    "description": "Court case type code: V01 driver or passenger vs driver, V04 pedestrian vs driver, V09 other motor-vehicle torts.",
                    "type": "string"
                  },
                  "closedPleadingsDate": {
                    "anyOf": [
                      {
                        "format": "date",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Date pleadings were closed."
                  },
                  "daysToDisposition": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Days from filing to disposition; null while pending."
                  },
                  "defendants": {
                    "description": "Number of defendants.",
