      "instructions": "Personal injury litigation data for motor vehicle cases in Connecticut Superior Court, Hartford Judicial District: case outcomes, jury verdicts, settlement offers, motion rulings, and profiles of judges, law firms, attorneys and medical experts. Call describe_dataset first; it lists every metric, filter and caveat. Derived from public Connecticut court records. For the official record of a specific case, see the court's civil inquiry site; each case result links to it as officialUrl.",
