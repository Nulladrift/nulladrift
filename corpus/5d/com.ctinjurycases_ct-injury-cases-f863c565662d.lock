                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "filed_to": {
                "description": "Filed on or before this date (YYYY-MM-DD).",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "firm_juris_number": {
                "description": "Juris number from search_firms; matches either side's lead firm.",
                "type": "string"
              },
              "judge_key": {
                "description": "Judge key from search_judges; matches the judge who decided the disposition.",
                "type": "string"
              },
              "limit": {
                "description": "Results per page, at most 50 (the default).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "litigation_type": {
                "description": "third_party, um_uim or subrogation.",
                "type": "string"
              },
              "purpose": {
                "description": "One sentence on what you are trying to find out. Logged to improve the dataset; never returned.",
