                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Pass as cursor for the next page; null on the last."
              },
              "results": {
                "description": "This page of matches.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "caseType": {
                      "description": "Court case type code: V01 driver or passenger vs driver, V04 pedestrian vs driver, V09 other motor-vehicle torts.",
                      "type": "string"
                    },
                    "dispositionCategory": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "How the case ended, grouped from the court disposition text; null while pending. damages_hearing is a judgment after a hearing that only set damages, usually after a default, not a trial."
                    },
                    "dispositionDate": {
                      "anyOf": [
                        {
                          "format": "date",
                          "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Date of disposition; null while pending."
                    },
                    "district": {
                      "description": "Judicial district the case is filed in, e.g. HARTFORD JD.",
                      "type": "string"
                    },
                    "docketNumber": {
                      "description": "Connecticut docket number, e.g. HHD-CV-21-6140000-S.",
                      "type": "string"
                    },
                    "fileDate": {
                      "description": "Date the case was filed.",
                      "format": "date",
                      "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                      "type": "string"
