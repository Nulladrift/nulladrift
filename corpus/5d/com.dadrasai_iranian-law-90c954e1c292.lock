        {
          "name": "calculate_diya",
          "title": "Diya — blood money (محاسبهٔ دیه)",
          "description": "Compute the diya (دیه, blood money) owed for a death or a bodily injury under the Islamic Penal Code: the injury's legal fraction applied to the year's full diya from the Judiciary's annual circular, with the sacred-month and Haram increase and the woman's share where they apply. Use it when the question is how much diya an injury or death carries; for the full-diya figure of a year alone use get_reference_rates, and for the articles that set a fraction use search_iranian_law. Covers the 22 injuries listed under `injury`; for others the articles give the fraction. Returns the amount in rial and toman, its breakdown, the circular used and the legal basis. Amounts in rial; dates in the Jalali calendar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "How many injuries of this kind (e.g. three fingers); 1 when not given.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "full_diya_rial": {
                "description": "A full-diya figure in rial to use instead of the table's, e.g. from a newer circular; normally left out.",
                "minimum": 0,
                "type": "integer"
              },
              "injury": {
                "description": "The death or injury. Values: life = قتل نفس — قتل نفس — دیه کامل; eye-one = اعضا و منافع — از بین بردن یک چشم; eye-both = اعضا و منافع — از بین بردن هر دو چشم; ear-one = اعضا و منافع — از بین بردن یک گوش; nose = اعضا و منافع — از بین بردن کل بینی; tongue = اعضا و منافع — از بین بردن زبان (گویا); lip-one = اعضا و منافع — از بین بردن یک لب; hand-one = اعضا و منافع — قطع یک دست; foot-one = اعضا و منافع — قطع یک پا; finger = اعضا و منافع — قطع یک انگشت دست یا پا; phalanx = اعضا و منافع — قطع یک بند از انگشت غیرشست; thumb-phalanx = اعضا و منافع — قطع یک بند از انگشت شست; harseh = جراحات سر و صورت — حارصه — خراش پوست بدون خون‌آمدن; damiyeh = جراحات سر و صورت — دامیه — بریدگی همراه با خون‌آمدن; motalahemeh = جراحات سر و صورت — متلاحمه — بریدگی عمیق گوشت; semhaq = جراحات سر و صورت — سمحاق — رسیدن جراحت به پرده استخوان; muzeheh = جراحات سر و صورت — موضحه — نمایان شدن استخوان; hashemeh = جراحات سر و صورت — هاشمه — شکستگی استخوان; monaqqeleh = جراحات سر و صورت — منقله — جابه‌جایی استخوان; maamumeh = جراحات سر و صورت — مأمومه — رسیدن جراحت به کیسه مغز; damegheh = جراحات سر و صورت — دامغه — پاره شدن کیسه مغز; jaefeh = جراحات بدن — جائفه — نفوذ جراحت به داخل بدن.",
                "enum": ["life", "eye-one", "eye-both", "ear-one", "nose", "tongue", "lip-one", "hand-one", "foot-one", "finger", "phalanx", "thumb-phalanx", "harseh", "damiyeh", "motalahemeh", "semhaq", "muzeheh", "hashemeh", "monaqqeleh", "maamumeh", "damegheh", "jaefeh"],
                "type": "string"
              },
              "inside_haram": {
                "description": "The act took place inside the Haram of Mecca.",
