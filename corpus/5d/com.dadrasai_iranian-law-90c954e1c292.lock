      "instructions": "Tools over the text of Iranian statutes and regulations as published in the public library of Dadras (دادرس, https://dadrasai.com), a Persian legal AI platform — over 95,000 articles of more than 5,900 laws, regulations and resolutions: search by topic or by article number, read one article, find a law and list its articles, look up a legal term in Dadras's glossary, run Iranian legal calculators (mehrieh at today's value, late-payment damages, stamp duty, diya, inheritance shares, court fees, lawyer's fees, court deadlines) and read the official figures behind them (the year's diya, coin prices, the price index). Results are in Persian, quote the primary text, and carry the dadrasai.com address of each article. Queries work best in Persian. Court rulings and advisory opinions are not part of this server. The tools return legal text and figures, not legal advice.",
      "tools": [
        {
          "name": "calculate_court_deadline",
          "title": "Court deadlines (مهلت‌های دادرسی)",
          "description": "Compute the last day to appeal (تجدیدنظرخواهی), seek cassation (فرجام‌خواهی) or object to a default judgment (واخواهی) in an Iranian civil or criminal case, from the Jalali date the judgment was served, skipping Fridays and official holidays. Use it when the question is until when an objection can be filed; for the articles that set the periods use search_iranian_law. A third-party objection has no fixed deadline and the result explains why. Returns the deadline date, the period applied and its legal basis. Amounts in rial; dates in the Jalali calendar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "judgment": {
                "description": "For appeal or cassation: whether the judgment was given in presence or by default; a default judgment's period runs from the end of the objection period. Values: presence = حضوری; absence = غیابی.",
                "enum": ["presence", "absence"],
                "type": "string"
              },
              "matter": {
                "description": "Civil or criminal case; civil when not given. Values: civil = حقوقی; criminal = کیفری.",
                "enum": ["civil", "criminal"],
                "type": "string"
              },
              "remedy": {
                "description": "The objection to file. Values: appeal = تجدیدنظرخواهی; cassation = فرجام‌خواهی; objection = واخواهی از رأی غیابی; third_party = اعتراض ثالث.",
                "enum": ["appeal", "cassation", "objection", "third_party"],
                "type": "string"
              },
              "residence": {
                "description": "Where the objecting party lives; abroad lengthens the period. Inside Iran when not given. Values: inside = مقیم ایران; abroad = مقیم خارج از کشور.",
                "enum": ["inside", "abroad"],
                "type": "string"
              },
              "served_day": {
                "description": "Day of the month it was served.",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "served_month": {
                "description": "Jalali month it was served, 1 for فروردین.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "served_year": {
                "description": "Jalali year the judgment was served, e.g. 1405.",
                "maximum": 1406,
                "minimum": 1404,
                "type": "integer"
              }
            },
            "required": ["remedy"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "links": {
                "description": "The dadrasai.com pages the result cites, in order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "text": {
                "description": "The result, in Persian, as it should be quoted.",
                "type": "string"
              }
            },
            "required": ["links", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
