        {
          "name": "calculate_court_fee",
          "title": "Court fees (هزینهٔ دادرسی)",
          "description": "Compute the court fee (هزینهٔ دادرسی) to file a claim or an appeal in Iran: tiered by the claim's value for a financial claim, a fixed amount for a non-financial claim or a request such as تأمین خواسته, from the Budget Act and the Judiciary's circular. Use it when the question is what filing will cost; for a lawyer's fee use calculate_lawyer_fee, and for the power-of-attorney stamp calculate_stamp_duty. Returns the fee in rial with its breakdown and source; a fixed fee whose figure is not yet verified says so. Amounts in rial; dates in the Jalali calendar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount_rial": {
                "description": "For a financial claim: the claim's value at first instance, the judgment sum at later stages, in rial.",
                "minimum": 0,
                "type": "integer"
              },
              "claim_kind": {
                "description": "Financial claim or non-financial claim/request. Values: financial = دعوای مالی; non-financial = دعوای غیرمالی و درخواست‌ها.",
                "enum": ["financial", "non-financial"],
                "type": "string"
              },
              "fixed_fee_rial": {
                "description": "A fixed fee in rial to use instead of the table's (family matters pay less); normally left out.",
                "minimum": 0,
                "type": "integer"
              },
              "non_financial_kind": {
                "description": "For a non-financial claim or request: which one. Values: non-financial-first = دعاوی غیرمالی — مرحله بدوی; non-financial-objection = دعاوی غیرمالی — واخواهی; non-financial-appeal = دعاوی غیرمالی — تجدیدنظر; non-financial-retrial = دعاوی غیرمالی — اعاده دادرسی و اعتراض ثالث; family-first = دعاوی غیرمالی خانواده (حضانت، ملاقات، تمکین و مانند آن) — مرحله بدوی; family-objection = دعاوی غیرمالی خانواده (حضانت، ملاقات، تمکین و مانند آن) — واخواهی; family-appeal = دعاوی غیرمالی خانواده (حضانت، ملاقات، تمکین و مانند آن) — تجدیدنظر; family-retrial = دعاوی غیرمالی خانواده (حضانت، ملاقات، تمکین و مانند آن) — اعاده دادرسی و اعتراض ثالث; family-interim = تأمین خواسته یا دستور موقت در امور خانواده — مرحله بدوی; marriage-first = طلاق، نکاح، فسخ نکاح و نسب — مرحله بدوی; marriage-objection = طلاق، نکاح، فسخ نکاح و نسب — واخواهی; marriage-appeal = طلاق، نکاح، فسخ نکاح و نسب — تجدیدنظر; marriage-cassation = طلاق، نکاح، فسخ نکاح و نسب — فرجام‌خواهی; marriage-retrial = طلاق، نکاح، فسخ نکاح و نسب — اعاده دادرسی و اعتراض ثالث; hasbi-first = امور حسبی — مرحله بدوی; hasbi-objection = امور حسبی — واخواهی; hasbi-appeal = امور حسبی — تجدیدنظر; hasbi-cassation = امور حسبی — فرجام‌خواهی; hasbi-retrial = امور حسبی — اعاده دادرسی و اعتراض ثالث; civil-status-first = دعاوی اسناد سجلی — مرحله بدوی; civil-status-objection = دعاوی اسناد سجلی — واخواهی; civil-status-appeal = دعاوی اسناد سجلی — تجدیدنظر; civil-status-retrial = دعاوی اسناد سجلی — اعاده دادرسی و اعتراض ثالث; non-judicial-first = اعتراض به رأی مراجع غیرقضایی — مرحله بدوی; non-judicial-objection = اعتراض به رأی مراجع غیرقضایی — واخواهی; non-judicial-appeal = اعتراض به رأی مراجع غیرقضایی — تجدیدنظر; non-judicial-retrial = اعتراض به رأی مراجع غیرقضایی — اعاده دادرسی و اعتراض ثالث; evidence-preservation = درخواست تأمین دلیل; claim-security = درخواست تأمین خواسته; interim-order = درخواست دستور موقت; request-appeal = تأمین خواسته یا دستور موقت — تجدیدنظر; unvalued-claim = خواستهٔ مالی که هنگام تقدیم تقویم نشده (علی‌الحساب); provisional-enforcement = درخواست اجرای موقت حکم; order-appeal = اعتراض یا تجدیدنظر از قرار (دادگاه و دیوان عالی کشور); enforcement-third-party = اعتراض شخص ثالث به اجرای احکام مدنی.",
                "enum": ["non-financial-first", "non-financial-objection", "non-financial-appeal", "non-financial-retrial", "family-first", "family-objection", "family-appeal", "family-retrial", "family-interim", "marriage-first", "marriage-objection", "marriage-appeal", "marriage-cassation", "marriage-retrial", "hasbi-first", "hasbi-objection", "hasbi-appeal", "hasbi-cassation", "hasbi-retrial", "civil-status-first", "civil-status-objection", "civil-status-appeal", "civil-status-retrial", "non-judicial-first", "non-judicial-objection", "non-judicial-appeal", "non-judicial-retrial", "evidence-preservation", "claim-security", "interim-order", "request-appeal", "unvalued-claim", "provisional-enforcement", "order-appeal", "enforcement-third-party"],
                "type": "string"
              },
              "stage": {
                "description": "Stage, for a financial claim; first when not given. Values: first = مرحله بدوی; appeal = واخواهی و تجدیدنظرخواهی; supreme = فرجام‌خواهی، اعاده دادرسی و اعتراض ثالث.",
                "enum": ["first", "appeal", "supreme"],
                "type": "string"
              }
            },
            "required": ["claim_kind"],
            "type": "object"
          },
