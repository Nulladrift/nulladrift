{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentscouthq/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.agentscouthq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agentscout",
        "title": "AgentScout directory",
        "version": "1.0.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only search over the AgentScout directory of AI agent tools and MCP servers (agentscouthq.com). Use search_tools or best_for_task, then get_tool for details. Pricing is as makers state it. For tools that must keep data on the user's machine or servers, pass runs_locally ('offline' or 'self_hosted_or_offline') and relay data_locality_note plus the caveat; locality is inferred from listings, so tell users to verify it for compliance. Cite the agentscout_url.",
      "tools": [
        {
          "name": "best_for_task",
          "title": "Best tools for a task",
          "description": "Suggest AgentScout tools for a task described in plain words (e.g. 'scrape websites with an agent'), ranked by relevance with listed GitHub stars as a tiebreak. Optional pricing, open-source and runs_locally filters; use runs_locally when data must stay on the user's machine or servers (e.g. 'no-code automation that runs locally').",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "open_source": {
                "type": "boolean"
              },
              "pricing": {
                "enum": ["any", "free", "freemium", "paid", "unknown"],
                "type": "string"
              },
              "runs_locally": {
                "description": "Where the tool can run, so data can stay on your side. 'offline' = runs fully on your own machine (e.g. with local models). 'self_hosted_or_offline' = also includes tools you can deploy on your own server. 'any' (default) = no filter. Based on what each listing says; tools without clear evidence are excluded from both filters.",
                "enum": ["offline", "self_hosted_or_offline", "any"],
                "type": "string"
              },
              "task": {
                "description": "What you want to get done.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86018b2a38faa4271fb39dd71c617b7b4400e93098129d371bdab6e95856eab5"
        },
        {
          "name": "get_tool",
          "title": "Get one tool",
          "description": "Get the full AgentScout listing for one tool by its slug (from search_tools results), including key features, platforms, GitHub repo and stars, and data_locality with the evidence phrase.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Tool slug, e.g. 'cursor'.",
                "pattern": "^[a-z0-9][a-z0-9-]{0,99}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:55c8e05df3507a7bed9a770fb5d29253a51914b0c9c5716bc7f0b94f1b78280b"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List every AgentScout category with its tool count and page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eaf6cb693d6744ac4674ecba83204d00ea6803d605fdad36d4fdf476e0a6f0de"
        },
        {
          "name": "list_packages",
          "title": "List AgentScout maker packages & pre-trained bots",
          "description": "List AgentScout's 4 maker listing packages ($0, $15 Fast-Track with a same-day Bing and IndexNow ping, $49 category pin, $99/wk sponsor), the separate $49 Directory Launch Pack add-on, and the Made by AgentScout pre-trained bot lineup. The Launch Pack is not a listing tier.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Filter by product category (default 'all'). 'addon' is the Directory Launch Pack, not a listing tier.",
                "enum": ["all", "listing_package", "addon", "bot_template", "agent_pack"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:01a4f79ad190eae2a291e7cd1d4aa6438beb756a0daf708b2ceeaf9647f6a0bc"
        },
        {
          "name": "search_tools",
          "title": "Search AI agent tools",
          "description": "Search the AgentScout directory of AI agent tools and MCP servers by keyword, with optional category, pricing, open-source and data-locality (runs_locally) filters. Each result has data_locality (offline, self_hosted, cloud or unknown) with a plain note. Returns up to 25 matches with pricing as the maker states it and the AgentScout listing URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Exact category name from list_categories, e.g. 'MCP servers'.",
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "open_source": {
                "description": "true = only open-source tools.",
                "type": "boolean"
              },
              "pricing": {
                "description": "Pricing type. 'freemium' = free plan plus paid plans.",
                "enum": ["any", "free", "freemium", "paid", "unknown"],
                "type": "string"
              },
              "query": {
                "description": "Keywords, e.g. 'browser automation' or 'postgres'. Optional if a filter is set.",
                "maxLength": 200,
                "type": "string"
              },
              "runs_locally": {
                "description": "Where the tool can run, so data can stay on your side. 'offline' = runs fully on your own machine (e.g. with local models). 'self_hosted_or_offline' = also includes tools you can deploy on your own server. 'any' (default) = no filter. Based on what each listing says; tools without clear evidence are excluded from both filters.",
                "enum": ["offline", "self_hosted_or_offline", "any"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:964c718b6107d917fbf3ec0cbc74f9cfb22e0b80e46ea45bc9b3caa6fa862476"
        }
      ],
      "digest": "sha256:62a41d64d191f4ff0f25e58a5ef4f4fd6ac8dfc8a758cc9d53b086e49cab6ce6"
    }
  }
