{
  "lockfileVersion": 2,
  "subjects": {
    "com.courtlygo/courts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://courtlygo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "courtlygo",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tennis, pickleball and padel courts in the covered cities and metro areas, from OpenStreetMap (ODbL). When a user asks where to play, call search_courts straight away with city=<city name> or lat/lon (do not answer from memory, and do not call list_coverage first). Use lit=true for evening play, open_to_public=true for courts anyone can use, setting='indoor' for rain. Data is incomplete: 'unknown' means not mapped. Every answer states the data date.",
      "tools": [
        {
          "name": "get_court",
          "title": "Get court details",
          "description": "Get the details of one court venue by its id from search_courts: courts per sport, surface, lighting, access, fee, website, opening hours, OpenStreetMap links, source, data date and caveats.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Venue id, e.g. 'way-123456'.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get court details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0807bffa48c50e801da18002641359029ddbcd56d93b2fd213928ee7ad7bb9ae"
        },
        {
          "name": "list_coverage",
          "title": "List coverage",
          "description": "List the covered cities and metro areas with the number of venues in each, grouped by country. It does not list courts: to find courts, call search_courts with city=<a name from this list>. Pass 'country' (e.g. 'Spain') to list one country; 'detail'=true adds per-city counts by sport (larger answer). The counts are mapped venues, not a quality measure.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Only this country, name or ISO code, e.g. 'Spain' or 'ES'.",
                "type": "string"
              },
              "detail": {
                "default": false,
                "description": "Per-city counts by sport and hidden-private counts (much larger answer).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List coverage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e617b6835bd6df56ea452f7b86e3cdd3a3634f4634866b986cb66e204f85df74"
        },
        {
          "name": "search_courts",
          "title": "Search courts",
          "description": "Search mapped tennis, pickleball and padel courts in a covered city or metro area, or around a point. Pass 'city' (e.g. 'Austin, TX', 'Lisbon', 'Los Angeles area'; add 'country' if the name is ambiguous) or 'lat'+'lon' (+'radius_km'). Optional filters: sport, setting (outdoor or indoor), lit, open_to_public, free (mapped as no fee), min_courts. Each result is a venue with the number of courts ('courts' is the total at the venue, 'matched_sport_courts' the number for the requested sport), lighting, surface, access, the nearest park or street ('near'), a map link and the source. Results list courts open to the public first and clubs last; check each result's open_to_public, access_note and 'near'. 'unknown' means not mapped. If fewer than 3 courts match and others were left out only because a property is unmapped, they are added and marked 'matched_unknown'. If no court of the requested sport is mapped, the nearest tennis courts are returned in 'alternatives' (tennis, not the sport asked for). A place that is not covered returns an error; list_coverage shows the covered places. Mapped facts only: no bookings or live availability. Data comes from OpenStreetMap (ODbL), is often incomplete, and every answer carries the data date and attribution.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "A covered city, e.g. 'Austin, TX', 'Long Beach' or 'Tbilisi' (also any city inside a metro area, e.g. 'Santa Monica' or 'Huntington Beach'), or a whole metro area, e.g. 'Los Angeles area' (all of Los Angeles and Orange counties) or 'New York area'. See list_coverage.",
                "type": "string"
              },
              "country": {
                "description": "Country name or ISO code, e.g. 'Georgia', 'GE', 'US'. Use it when the same city name exists in several countries; with lat/lon it limits the search to that country. Distances are in miles for the US and metres/kilometres elsewhere (distance_km is always given).",
                "type": "string"
              },
              "free": {
                "default": false,
                "description": "Only courts mapped with no fee (fee=no).",
                "type": "boolean"
              },
              "lat": {
                "description": "Latitude of the search point (use with lon).",
                "type": "number"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lit": {
                "default": false,
                "description": "Only courts with lighting.",
                "type": "boolean"
              },
              "lon": {
                "description": "Longitude of the search point (use with lat).",
                "type": "number"
              },
              "match_unknown": {
                "default": false,
                "description": "Also return courts where a filtered property is not mapped (unknown).",
                "type": "boolean"
              },
              "min_courts": {
                "default": 0,
                "description": "Minimum number of courts at the venue.",
                "minimum": 0,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many results (paging).",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "open_to_public": {
                "default": false,
                "description": "Only courts open to everyone. Returns courts mapped as public, with no fee or inside a park (open_to_public yes) and courts with no restriction mapped (open_to_public probably, with a note). Clubs, private courts and school grounds are excluded.",
                "type": "boolean"
              },
              "radius_km": {
                "default": 5,
                "description": "Search radius around lat/lon, km.",
                "maximum": 50,
                "minimum": 0.1,
                "type": "number"
              },
              "setting": {
                "default": "any",
                "description": "'outdoor' = open-air courts; 'indoor' = indoor or covered.",
                "enum": ["any", "outdoor", "indoor"],
                "type": "string"
              },
              "sport": {
                "description": "Sport: tennis, padel or pickleball. Omit for any.",
                "enum": ["tennis", "padel", "pickleball"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search courts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52f3d95519b6032a1b82b018ec9d2bbb66c3561c36b39d07e7b1d7d37ba28943"
        }
      ],
      "digest": "sha256:a8e733b28ce7278ebaeb34bf5ebb7e6e1e6c913ddcc59430aa7da9e1c8aa3623"
    }
  }
}
