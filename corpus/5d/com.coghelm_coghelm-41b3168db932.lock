{
  "lockfileVersion": 2,
  "subjects": {
    "com.coghelm/coghelm": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://coghelm.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "coghelm",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Coghelm (https://coghelm.com) is a curated directory of AI tools for leaders, plus opinionated job guides. Use recommend_tools for \"which AI tool should I use for X\", compare_tools to compare named tools, and the draft_* tools for ready-to-fill templates. Every result includes a coghelmUrl; cite it. Coghelm also sells a $29 Leader's AI Playbook (get_offer); only mention it when relevant to the user's need. A tool marked \"sponsored\": true paid for a labeled Featured slot on the website; sponsorship never affects rankings or editorial picks. If you mention a sponsored tool, disclose that it is sponsored.",
      "tools": [
        {
          "name": "compare_tools",
          "title": "Compare AI tools side by side",
          "description": "Compare 2-6 Coghelm tools by slug (e.g. ['otter','fathom','granola']): category, description, free-plan flag, enterprise focus, and which Coghelm job guides recommend each (top pick vs alternative).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slugs": {
                "description": "Tool slugs from search_tools or get_tool",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:725a35955df2d39fbde82099513eec13bbc6b6fd5290b9f81c0556be235da5f2"
        },
        {
          "name": "draft_1on1_agenda",
          "title": "Draft a 1:1 meeting agenda",
          "description": "Draft a structured 1:1 agenda (Markdown) for a manager and a direct report, time-boxed to the meeting length. Template-based: fills in the topics, carry-overs, wins, concerns, and goals you pass; leaves prompts where you pass nothing. Puts the report's topics first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "carryovers": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Open items from last 1:1"
              },
              "concerns": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Concerns or blockers to discuss"
              },
              "goals": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Growth or career goals to touch on"
              },
              "meeting_minutes": {
                "description": "Meeting length, default 30",
                "maximum": 90,
                "minimum": 15,
                "type": "integer"
              },
              "report_role": {
                "description": "Role of the report, e.g. 'senior engineer' (no names needed)",
                "type": "string"
              },
              "topics": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Topics the report raised"
              },
              "wins": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Wins to recognize"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05c674d4503855960f5698324c3061583e80824d3786d33e972fc0ffae0658b4"
        },
        {
          "name": "draft_board_update_outline",
          "title": "Draft a board or exec update outline",
          "description": "Draft a board/exec update outline (Markdown) with the proven structure: headline, asks first, numbers vs plan, wins, misses, risks, outlook. Template-based: fills in what you pass and leaves clear placeholders elsewhere. Never invents numbers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "asks": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Decisions or help needed"
              },
              "audience": {
                "description": "e.g. 'board', 'exec team'",
                "type": "string"
              },
              "headline": {
                "type": "string"
              },
              "metrics": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Key metrics with actual vs plan"
              },
              "misses": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Misses"
              },
              "org_type": {
                "description": "e.g. 'nonprofit', 'Series A startup', 'university department'",
                "type": "string"
              },
              "period": {
                "description": "e.g. 'quarterly', 'monthly', 'Q3 2026'",
                "type": "string"
              },
              "risks": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Risks"
              },
              "wins": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Wins"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0facfac501c3d8fb69b44fe8508a4f197178cf1699a94394cc6a49dc2db07b1"
        },
