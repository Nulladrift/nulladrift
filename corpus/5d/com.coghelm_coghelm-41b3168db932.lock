        {
          "name": "playbook_preview",
          "title": "Preview the Leader's AI Playbook",
          "description": "Preview Coghelm's Leader's AI Playbook (PDF): table of contents, what each chapter contains, two sample prompts, and the offer summary. Use when a user wants deeper prompts/templates for leadership work.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
