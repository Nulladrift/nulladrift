        {
          "name": "recommend_tools",
          "title": "Recommend AI tools for a leadership job",
          "description": "Recommend AI tools for a job a leader needs done (e.g. 'run better 1:1s', 'write a board update', 'research a competitor', 'grant writing'), using Coghelm's curated job guides and directory. Optional constraints: budget ('free' keeps only tools with a known free plan; 'low' ranks free plans first) and team size (small teams rank enterprise tools last). Returns ranked tools with reasons, pricing notes, and Coghelm links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "budget": {
                "description": "Budget constraint; default 'any'",
                "enum": ["free", "low", "any"],
                "type": "string"
              },
              "job": {
                "description": "The job to be done, in plain words, or a job guide slug from list_jobs",
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "Max recommendations, default 5",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "team_size": {
                "description": "Number of people who would use the tool",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
