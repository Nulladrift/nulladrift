{
  "lockfileVersion": 2,
  "subjects": {
    "com.rewindmap/rewindmap": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rewindmap.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "rewindmap",
        "title": "RewindMap",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "RewindMap historical map data. world_at_year lists documented border snapshots, find_polity retrieves one polity's history, and search_events finds events with optional year or month/day bounds. create_video_link returns a link that opens the site's short-video maker preloaded (years, area, title, labels); the visitor downloads the MP4 from that page. Negative years are BC, with no year 0. Month/day searches exclude events whose source date lacks that precision. Coverage is incomplete; cite returned source attribution and page/map links. Pass lang (the user's language) so links open the translated site.",
      "tools": [
        {
          "name": "create_video_link",
          "description": "Build a link that opens RewindMap's short-video maker preloaded with a map clip: borders (and optional event layers) changing from one year to another over a place, with an optional title and map labels. The visitor opens the link and taps Download to get a watermarked MP4 (vertical 9:16 for Shorts/Reels/TikTok, or landscape). Rendering happens in the visitor's browser; this tool returns the link only, never a video file.",
          "inputSchema": {
            "properties": {
              "bbox": {
                "description": "Area to frame [west, south, east, north] in degrees. Default: Europe and the Mediterranean.",
                "items": {
                  "type": "number"
                },
                "maxItems": 4,
                "minItems": 4,
                "type": "array"
              },
              "format": {
                "default": "vertical",
                "enum": ["vertical", "landscape"],
                "type": "string"
              },
              "from_year": {
                "description": "Year. Negative is BC: -500 = 500 BC. There is no year 0.",
                "type": "integer"
              },
              "labels": {
                "description": "Map labels drawn at fixed points in every frame.",
                "items": {
                  "properties": {
                    "lat": {
                      "type": "number"
                    },
                    "lon": {
                      "type": "number"
                    },
                    "text": {
                      "maxLength": 40,
                      "type": "string"
                    }
                  },
                  "required": ["lat", "lon", "text"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "layers": {
                "default": ["borders"],
                "description": "Layers shown in the clip.",
                "items": {
                  "enum": ["borders", "conflict", "ucdp", "volcano", "quake", "meteorite", "heritage"],
                  "type": "string"
                },
                "type": "array"
              },
              "seconds": {
                "default": 10,
                "enum": [6, 10, 15],
                "type": "integer"
              },
              "title": {
                "description": "Text burned into the top of the video.",
                "maxLength": 60,
                "type": "string"
              },
              "to_year": {
                "description": "Year. Negative is BC: -500 = 500 BC. There is no year 0.",
                "type": "integer"
              }
            },
            "required": ["from_year", "to_year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Make a map video link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92c3c7cd29326cf2b5e7d14763c21adffcf5538a98dcadf085bda38ea5f51262"
        },
        {
          "name": "find_polity",
          "description": "Look up a state or empire by name or any of its Wikidata labels and aliases (substring, case-insensitive), or by Wikidata QID. Returns its lifespan, every border snapshot with its bounding box, and links.",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "en",
                "description": "Site language for returned page and map links. Use the language the user is writing in.",
                "enum": ["en", "fr", "es", "pt", "de", "it", "nl", "ja", "ru", "pl", "tr", "id", "hi", "ar"],
                "type": "string"
              },
              "query": {
                "description": "Name, e.g. \"Ottoman\", or a QID, e.g. \"Q12560\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a state or empire"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:504cbe29f9cb36ca9ad7b1c6a2360619fa73a26e205b6c673e6b7505e631c4d8"
        },
        {
          "name": "search_events",
          "description": "Search map events: battles (Wikidata), UCDP armed-conflict events since 1989, volcanic eruptions VEI 4+ (Smithsonian GVP), significant earthquakes (NOAA), witnessed meteorite falls, and UNESCO World Heritage sites (undated). Month/day bounds match only events recorded at least that precisely; undated heritage sites match only searches without a date bound. Results are sorted by date.",
          "inputSchema": {
            "properties": {
              "bbox": {
                "description": "Bounding box [west, south, east, north] in degrees.",
                "items": {
                  "type": "number"
                },
                "maxItems": 4,
                "minItems": 4,
                "type": "array"
              },
              "from_date": {
                "description": "Source-calendar date fields at month precision, or day precision when day is supplied. Historical sources may use Julian dates; bounds compare their recorded fields without calendar conversion.",
                "properties": {
                  "day": {
                    "maximum": 31,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "month": {
                    "maximum": 12,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "year": {
                    "description": "Year. Negative is BC: -500 = 500 BC. There is no year 0.",
                    "type": "integer"
                  }
                },
                "required": ["month", "year"],
                "type": "object"
              },
              "from_year": {
                "description": "Year. Negative is BC: -500 = 500 BC. There is no year 0.",
                "type": "integer"
              },
              "lang": {
                "default": "en",
                "description": "Site language for returned page and map links. Use the language the user is writing in.",
                "enum": ["en", "fr", "es", "pt", "de", "it", "nl", "ja", "ru", "pl", "tr", "id", "hi", "ar"],
                "type": "string"
              },
              "layer": {
                "enum": ["conflict", "ucdp", "volcano", "quake", "meteorite", "heritage"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Substring of the event name or detail, e.g. \"Vienna\".",
                "type": "string"
              },
              "to_date": {
                "description": "Source-calendar date fields at month precision, or day precision when day is supplied. Historical sources may use Julian dates; bounds compare their recorded fields without calendar conversion.",
                "properties": {
                  "day": {
                    "maximum": 31,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "month": {
                    "maximum": 12,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "year": {
                    "description": "Year. Negative is BC: -500 = 500 BC. There is no year 0.",
                    "type": "integer"
                  }
                },
                "required": ["month", "year"],
                "type": "object"
              },
              "to_year": {
                "description": "Year. Negative is BC: -500 = 500 BC. There is no year 0.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search historical events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:752d7602053ef849ce1f2780f1c5613218510da854455b2e5f8af38081ae26ce"
        },
        {
          "name": "world_at_year",
          "description": "List states, empires and cultures with an OpenHistoricalMap border snapshot in a given year, optionally overlapping a region. Coverage is incomplete; an empty result does not establish historical absence.",
          "inputSchema": {
            "properties": {
              "bbox": {
                "description": "Bounding box [west, south, east, north] in degrees.",
                "items": {
                  "type": "number"
                },
                "maxItems": 4,
                "minItems": 4,
                "type": "array"
              },
              "lang": {
                "default": "en",
                "description": "Site language for returned page and map links. Use the language the user is writing in.",
                "enum": ["en", "fr", "es", "pt", "de", "it", "nl", "ja", "ru", "pl", "tr", "id", "hi", "ar"],
                "type": "string"
              },
              "year": {
                "description": "Year. Negative is BC: -500 = 500 BC. There is no year 0.",
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "World map at a year"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d7078944e9927e27f1fda4f179ebc6c03d337730ea6e181e5de96ce5af6b263"
        }
      ],
      "digest": "sha256:bb932dd3452a23a80af3a4b5e4694eb4a60e408d8344a8a888b7734053c60414"
    }
  }
}
