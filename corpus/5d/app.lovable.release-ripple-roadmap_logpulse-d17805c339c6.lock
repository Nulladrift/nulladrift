{
  "lockfileVersion": 2,
  "subjects": {
    "app.lovable.release-ripple-roadmap/logpulse": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://release-ripple-roadmap.lovable.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "logpulse",
        "title": "LogPulse",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LogPulse hosts machine-readable changelogs and public roadmaps for software products. Reading needs no sign-in and only returns what changelog owners have published publicly. To answer “what changed between X and Y, and what do I need to change?”, find the slug with search_changelogs, then call compare_versions and apply its migration steps. Use list_releases and get_release for details and get_roadmap for what's planned. For a project that isn't on LogPulse, convert_changelog turns its CHANGELOG.md text or a GitHub release URL into the same structured shape. publish_release and post_roadmap_update write to the caller's own changelog and need a LogPulse API key sent as the HTTP header 'Authorization: Bearer lp_…' in the MCP client settings — never ask the user to paste a key into the chat.",
      "tools": [
        {
          "name": "compare_versions",
          "title": "Compare versions",
          "description": "Answer “what changed between two versions, and what do I need to change?”: breaking changes with migration steps, deprecations and every release after `from` up to `to`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "changelog": {
                "description": "Changelog slug, e.g. \"acme\". Use search_changelogs to find it from a package, repository or product name.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "format": {
                "description": "markdown (default) returns an upgrade guide; json returns structured data only.",
                "enum": ["markdown", "json"],
                "type": "string"
              },
              "from": {
                "description": "The version the user is on, e.g. 1.4.0. Omit to start from the first release.",
                "maxLength": 40,
                "type": "string"
              },
              "to": {
                "description": "The version to upgrade to. Omit for the latest.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["changelog"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:31356fb717b82dcda809c79e9d187c4e5ef990d91174f99eee44bf3e154d23f7"
        },
        {
          "name": "convert_changelog",
          "title": "Convert a changelog",
          "description": "Turn any project's CHANGELOG.md text, or a GitHub release, releases page, repository or changelog file URL, into a machine-readable changelog: versions, dates, breaking changes with migration steps, and deprecations. Works for projects that aren't on LogPulse. Returns an llms.txt-style summary plus structured JSON.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "include_notes": {
                "description": "Include each release's full notes in the JSON. Default false to keep the answer short.",
                "type": "boolean"
              },
              "markdown": {
                "description": "The changelog text itself, e.g. the contents of CHANGELOG.md. Use this or url.",
                "maxLength": 900000,
                "type": "string"
              },
              "name": {
                "description": "Project name to use in the summary.",
                "maxLength": 100,
                "type": "string"
              },
              "url": {
                "description": "GitHub URL: a release (github.com/owner/repo/releases/tag/v1.2.0), the releases page, a repository, or a CHANGELOG.md file. Use this or markdown.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3dd827b191150bad38242894e2451de1ce705b9b93a355932ecf40ed1c0daccf"
        },
        {
          "name": "get_changelog",
          "title": "Get changelog",
          "description": "Get a changelog's name, repository, packages, latest version and feed links.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "changelog": {
                "description": "Changelog slug, e.g. \"acme\". Use search_changelogs to find it from a package, repository or product name.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["changelog"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8efde4d1284adcddb4045d7183efbb0aadb03f1de577ab7353f708404f0b4afe"
        },
        {
          "name": "get_release",
          "title": "Get release",
          "description": "Get one release by version (2.0.0 or v2.0.0) or URL slug, with full notes, breaking changes and deprecations.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "changelog": {
                "description": "Changelog slug, e.g. \"acme\". Use search_changelogs to find it from a package, repository or product name.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "release": {
                "description": "Version like 2.0.0, or the release's URL slug.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["changelog", "release"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e29c6732059cc6e9d323d36fac228e5e991f927b7ae9a28fc6ee6ff62308c80c"
        },
        {
          "name": "get_roadmap",
          "title": "Get roadmap",
          "description": "Get the public roadmap: items under review, planned, in progress and shipped, with vote counts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "changelog": {
                "description": "Changelog slug, e.g. \"acme\". Use search_changelogs to find it from a package, repository or product name.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "status": {
                "description": "Only items in this column.",
                "enum": ["under_review", "planned", "in_progress", "shipped"],
                "type": "string"
              }
            },
            "required": ["changelog"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6057dc5afd64cb18e820f1e89a03b7b2ce102738a5ed512b59e2e3b254a52a76"
        },
        {
          "name": "list_releases",
          "title": "List releases",
          "description": "List published releases, newest first, with versions, breaking changes, migration steps and deprecations.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "breaking_only": {
                "description": "Only releases that contain breaking changes.",
                "type": "boolean"
              },
              "changelog": {
                "description": "Changelog slug, e.g. \"acme\". Use search_changelogs to find it from a package, repository or product name.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Maximum releases. Default 20.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Only releases published at or after this ISO 8601 time, e.g. 2026-01-01.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["changelog"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2102ae0a8a191cd5e8075d36991e29e6ba8b3183589fb2555b9dc25ff6e5d0eb"
        },
        {
          "name": "post_roadmap_update",
          "title": "Post roadmap update",
          "description": "Add an item to your LogPulse roadmap, or update one by id — move it to in progress or shipped, change its ETA, or link the release that shipped it. Needs a LogPulse API key with the “Update roadmap” permission, sent as the Authorization header.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "description": {
                "anyOf": [
                  {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "What and why, in a sentence or two."
              },
              "eta": {
                "anyOf": [
                  {
                    "maxLength": 40,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Free text, e.g. Q3 or July."
              },
              "id": {
                "description": "Update this item instead of creating a new one.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "is_public": {
                "description": "Show on the public roadmap. Defaults to true for new items.",
                "type": "boolean"
              },
              "label": {
                "anyOf": [
                  {
                    "maxLength": 40,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Short tag, e.g. API or Mobile."
              },
              "linked_release": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Release id, version or slug that shipped this item."
              },
              "status": {
                "description": "Roadmap column. New items default to planned.",
                "enum": ["under_review", "planned", "in_progress", "shipped"],
                "type": "string"
              },
              "title": {
                "description": "Item title. Required when creating.",
                "maxLength": 140,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:6a4761e95a01e6bc2ad02260e6960b69433d602e3fa057a28643c3d9e3aca9bf"
        },
        {
          "name": "publish_release",
          "title": "Publish release",
          "description": "Publish a release note to your LogPulse changelog right after shipping — with version, breaking changes, migration steps and deprecations. Needs a LogPulse API key with the “Publish releases” permission, sent as the Authorization header.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "author_name": {
                "description": "Shown as the author. Defaults to the API key's name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "body": {
                "default": "",
                "description": "Release notes in Markdown.",
                "maxLength": 100000,
                "type": "string"
              },
              "breaking_changes": {
                "description": "What breaks for existing users, each with migration steps.",
                "items": {
                  "properties": {
                    "affects": {
                      "description": "What is affected, e.g. REST API, @acme/sdk.",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "migration": {
                      "description": "Markdown steps to migrate.",
                      "maxLength": 4000,
                      "type": "string"
                    },
                    "summary": {
                      "description": "One line: what broke.",
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["summary"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "category": {
                "default": "new",
                "description": "new, improved or fixed. Default new.",
                "enum": ["new", "improved", "fixed"],
                "type": "string"
              },
              "deprecations": {
                "description": "What is deprecated, its replacement and planned removal version.",
                "items": {
                  "properties": {
                    "item": {
                      "description": "What is deprecated.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "note": {
                      "maxLength": 1000,
                      "type": "string"
                    },
                    "removal_version": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "replacement": {
                      "maxLength": 200,
                      "type": "string"
                    }
                  },
                  "required": ["item"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "labels": {
                "description": "Up to 10 short labels, e.g. API, Dashboard.",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "published_at": {
                "description": "Schedule a future time, or backdate an import.",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "slug": {
                "description": "URL slug. Defaults to the title.",
                "maxLength": 80,
                "type": "string"
              },
              "status": {
                "default": "published",
                "description": "published (default) goes live now, or at published_at. draft saves it for a human to review in LogPulse.",
                "enum": ["published", "draft"],
                "type": "string"
              },
              "summary": {
                "description": "One sentence for lists and link previews.",
                "maxLength": 300,
                "type": "string"
              },
              "title": {
                "description": "Short, user-facing headline, e.g. “Webhooks retry automatically”.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "version": {
                "description": "Version this release ships in, e.g. 2.0.0. Unique per changelog.",
                "pattern": "^[vV]?[0-9A-Za-z][0-9A-Za-z.+_-]{0,39}$",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3aeac3c9a6a6b3186eb6e0a18626c64350cc8ba98ba320c8398df6b312ba22db"
        },
        {
          "name": "search_changelogs",
          "title": "Search changelogs",
          "description": "Find a public LogPulse changelog by package name, repository, product name or slug. Returns slugs to use with the other tools.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum results. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Package (e.g. @acme/analytics), repository (acme/analytics-js), product name or slug.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b968931c63539f8dc744491190ecbfe4f2098b990adea9af94bb0fb7df6df08e"
        }
      ],
      "digest": "sha256:0b5daa259517ee43322b8bb6d47b61dafe25086e51af0c60bd4935370868d601"
    }
  }
}
