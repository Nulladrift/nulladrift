{
  "lockfileVersion": 2,
  "subjects": {
    "com.ontrackmoving/moving-quotes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.ontrackmoving.com/quote/agent-mcp.php"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ontrack-moving-quotes",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Ask for move details and explicit permission to share them with Ontrack. No pricing or bookings. Requests are saved before screening and sales delivery. Only received_by_sales confirms sales-system acceptance. Keep the receipt private.",
      "tools": [
        {
          "name": "get_quote_request_status",
          "title": "Check an Ontrack request receipt",
          "description": "Check this request using its private receipt. Returns status only, no personal details. Never put receipt tokens or customer details in URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "receipt_token": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "request_id": {
                "pattern": "^[a-f0-9]{32}$",
                "type": "string"
              }
            },
            "required": ["receipt_token", "request_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ddc714cfe4065d777d3e8b15175d4a3c1b2d37cf33bfbae92cbe85bc5574f9d2"
        },
        {
          "name": "request_moving_quote",
          "title": "Request an Ontrack moving quote",
          "description": "Submit a moving quote request to Ontrack. Ask conversationally for name, contact, origin, destination, date and size; unknown destination/date/size may be empty. Show a summary and obtain explicit customer permission to share with Ontrack before calling. Never invent missing details, quote a price or promise a booking. Only a saved receipt means the request was received. Requests that pass screening go directly to sales; exceptions are saved for staff follow-up. Use the returned status to distinguish saved from received_by_sales. Requires an enabled Ontrack tool connection in the customer’s assistant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assistant": {
                "description": "Self-reported assistant name; not verified attribution.",
                "maxLength": 60,
                "type": "string"
              },
              "customer_confirmed": {
                "const": true,
                "description": "Set true only after showing the customer these details and obtaining explicit permission to share them with Ontrack for a moving quote and contact by phone/email. This does not enroll them in SMS.",
                "type": "boolean"
              },
              "destination": {
                "description": "Destination city/state or address; leave empty if unknown.",
                "maxLength": 300,
                "type": "string"
              },
              "email": {
                "description": "Customer email, or empty if phone provided.",
                "maxLength": 254,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Generate a random UUID or 128-bit random key for this move. Reuse the exact key and details on retries. Use a new key for a different move.",
                "maxLength": 128,
                "minLength": 32,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "move_date": {
                "description": "YYYY-MM-DD, or empty if unknown.",
                "maxLength": 10,
                "type": "string"
              },
              "move_size": {
                "description": "Home/office size or inventory summary, or empty if unknown.",
                "maxLength": 120,
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "notes": {
                "description": "Move needs only. Do not send payment details, passwords, identity documents or unrelated conversation.",
                "maxLength": 2000,
                "type": "string"
              },
              "origin": {
                "description": "Origin city and state or full address, as provided by the customer.",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "description": "Customer phone including area/country code, or empty if email provided.",
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["customer_confirmed", "idempotency_key", "name", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e9453ff7e2040898ee35fc2255b9991582d08bb230442484a4dbb314fb467b0c"
        }
      ],
      "digest": "sha256:89eefb03afba8745a6af6c3460d07cf84bbe5eebed11487ae25125fa212b7b0d"
    }
  }
}
