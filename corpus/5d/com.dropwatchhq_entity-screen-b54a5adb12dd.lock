        {
          "name": "screen_entity",
          "description": "Screen a company/provider/vendor/counterparty for risk before onboarding. Resolves the entity across SEC, USAspending, NPI, NIH and FDA, then checks federal exclusion lists (OIG LEIE, SAM.gov), FDA enforcement/recalls, and absence signals (stopped filing, lapsed activity). Returns a risk score plus sourced, neutral evidence with links.",
