      "instructions": "Educational US tax reference tools from Arc & Ledger Accounting. Arc & Ledger is not a CPA firm; its practitioners are not licensed by the State of California as certified public accountants, and the services it offers do not require a California state license. Use these tools to explain an IRS notice or tax document, screen general filing and reporting rules, and calculate clearly labeled estimates. The tools do not prepare or file a return, transmit data to a tax authority, create an engagement, sell a service, or replace review by a qualified tax professional. Do not ask for Social Security numbers, tax account numbers, bank details, passwords, or documents. Treat every result as general information and verify it against the cited official authority before the user acts.",
      "tools": [
        {
          "name": "check_5472_obligation",
          "title": "Check Form 5472 obligation",
          "description": "Use to screen common Form 5472 triggers for a foreign-owned US disregarded entity or corporation. The result is a general filing screen and does not prepare or file the form.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entity_type": {
                "description": "The US entity. single_member_llc = a US LLC with ONE owner (a disregarded entity); multi_member_llc = a US LLC with two or more owners (a partnership by default); us_corporation = a US C-corporation; not_sure = you do not know. Form 5472 is filed by foreign-owned disregarded entities and by corporations with 25%+ foreign owners, but NOT by a default partnership.",
                "enum": ["single_member_llc", "multi_member_llc", "us_corporation", "not_sure"],
                "type": "string"
              },
              "foreign_owned": {
                "description": "Whether 25% or more of the entity is owned, directly or indirectly, by a non-US person or foreign company. Form 5472 is triggered by 25% foreign ownership.",
                "type": "boolean"
              },
              "formed_in_us": {
                "description": "Whether the entity was formed in the US (a Wyoming or Delaware LLC is US-formed). Relevant only to the separate BOI report, from which US-formed companies are now exempt.",
                "type": "boolean"
              },
              "had_reportable_transaction": {
                "description": "Whether there was a reportable transaction with the foreign owner during the year. Reportable transactions include forming or funding the company, capital contributions, distributions, loans in either direction, and sales or payments between you and the company. Defaults to not_sure.",
                "enum": ["yes", "no", "not_sure"],
                "type": "string"
              }
            },
            "required": ["entity_type", "foreign_owned"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "disclaimer": {
                "description": "General-information disclaimer (identical on every response).",
                "type": "string"
              },
              "next_step": {
                "description": "A single review link appropriate to this server surface.",
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["label", "url"],
                "type": "object"
              },
              "relay": {
                "description": "Instruction to the calling assistant: relay figures and dates verbatim (identical on every response).",
                "type": "string"
              },
              "server_version": {
                "description": "Server release that produced this response (matches GET /version).",
                "type": "string"
              },
              "source_url": {
                "description": "Official IRS or FinCEN authority to review before relying on the result.",
                "type": "string"
              }
            },
            "required": ["disclaimer", "next_step", "relay", "source_url"],
            "type": "object"
