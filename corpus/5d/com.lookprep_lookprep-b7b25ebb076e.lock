      "serverInfo": {
        "name": "com.lookprep/lookprep",
        "title": "LookPrep",
        "version": "1.1.1",
        "description": "Read-only LookPrep catalogue: lip looks, prices, stored demo simulations and a link to the web flow.",
        "websiteUrl": "https://lookprep.com",
        "icons": [
          {
            "src": "https://mcp.lookprep.com/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://mcp.lookprep.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LookPrep shows simulated previews of lip filler looks and a lip flip for adults (18+) planning a consultation. These tools only read the public look catalogue, prices and stored demo images, and give a link into the web flow. A personal preview needs the person to open the link, accept the photo terms and upload their own photo on lookprep.com; it cannot be done here. Payment happens only on LookPrep's Stripe Checkout page, never through these tools. Link is enabled there, so an agent whose owner has a Link wallet for agents (Stripe offers it to buyers in the United States and Canada) can pay on that page after the owner approves; everyone else pays on the page themselves. Describe every image as a simulation, not a prediction of a result, and not medical advice.",
      "tools": [
        {
          "name": "get_lip_style",
          "title": "Get one lip look",
          "description": "Details of one named lip look: what the name usually describes, where sources disagree, what the simulation shows, the demo amounts (demo_amounts) and the cited sources.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "style_id": {
                "description": "Look id from list_lip_styles, for example russian or natural.",
                "maxLength": 48,
                "pattern": "^[a-z0-9][a-z0-9-]{0,47}$",
                "type": "string"
              }
            },
            "required": ["style_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "One named lip look.",
            "properties": {
              "caption": {
                "description": "Say this with every image or preview: a simulation, not a prediction of a result, not medical advice.",
                "type": "string"
              },
              "demo_amounts": {
                "description": "The amounts show_demo_look accepts for this look, in demo_unit. Empty when the look has no stored demo.",
                "items": {
                  "description": "A demo amount.",
                  "type": "number"
                },
                "type": "array"
              },
              "demo_default_amount": {
                "description": "The amount show_demo_look uses when amount is omitted; null without a demo.",
                "type": ["number", "null"]
              },
              "demo_settings": {
                "description": "The demo amounts as labels, in the same order as demo_amounts.",
                "items": {
                  "description": "A label such as 0.55 mL.",
                  "type": "string"
                },
                "type": "array"
              },
              "demo_settings_note": {
                "description": "The demo amounts are simulation settings, not a recommended amount.",
                "type": "string"
              },
              "demo_unit": {
                "description": "Unit of demo_amounts: mL, or units for the lip flip; null without a demo.",
                "type": ["string", "null"]
              },
              "features": {
                "description": "Lip features the look emphasises.",
                "items": {
                  "description": "A feature id.",
                  "type": "string"
                },
                "type": "array"
              },
              "id": {
                "description": "Look id for the other tools.",
                "type": "string"
              },
              "label_reliability": {
                "description": "How consistently sources use the name: well-defined, contested or marketing-label.",
                "type": "string"
              },
              "name": {
                "description": "Display name.",
                "type": "string"
              },
              "other_names": {
                "description": "Other names sources use for it.",
                "items": {
                  "description": "A name.",
                  "type": "string"
                },
                "type": "array"
              },
              "page_url": {
                "description": "The look's page on lookprep.com.",
                "type": "string"
              },
              "previewable": {
                "description": "True when the look can be shown on the person's own photo (start_personal_preview).",
                "type": "boolean"
              },
              "sources": {
                "description": "Cited sources.",
                "items": {
                  "description": "One source.",
                  "properties": {
                    "label": {
                      "description": "Title and publisher.",
                      "type": "string"
                    },
                    "tier": {
                      "description": "clinical, trade or marketing.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Link to the source.",
                      "type": "string"
                    }
                  },
                  "required": ["label", "tier", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "sources_disagree": {
                "description": "Where the cited sources disagree; null when they agree.",
                "type": ["string", "null"]
              },
              "summary": {
                "description": "What the name usually describes, in one line.",
                "type": "string"
              },
              "what_the_simulation_shows": {
                "description": "What the simulation shows and does not establish.",
                "type": "string"
              }
            },
            "required": ["caption", "demo_amounts", "demo_default_amount", "demo_settings", "demo_settings_note", "demo_unit", "features", "id", "label_reliability", "name", "other_names", "page_url", "previewable", "sources", "sources_disagree", "summary", "what_the_simulation_shows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one lip look"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
