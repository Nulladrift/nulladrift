        {
          "name": "get_pricing",
          "title": "Get pricing",
          "description": "Current LookPrep prices in USD before tax: the free first preview, the fixed packs and the custom price by number of looks (custom_selection.price_by_look_count and rule), and how paying works. Payment happens only on LookPrep's Stripe Checkout page, not through this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "description": "Current prices.",
            "properties": {
              "audience": {
                "description": "Who may use the service.",
                "type": "string"
              },
              "currency": {
                "description": "Always USD.",
                "enum": ["USD"],
                "type": "string"
              },
              "custom_selection": {
                "description": "The price of any selection that is not exactly a pack.",
                "properties": {
                  "each_additional_look_price": {
                    "description": "Added to the total for each look after the first, in USD.",
                    "type": "number"
                  },
                  "each_extra_look_price": {
                    "description": "Older field: equal to each_additional_look_price.",
                    "type": "number"
                  },
                  "first_look_price": {
                    "description": "Older field: the total for the free preview's look plus one added look (2 looks). Not the price of 1 look; use one_look_price.",
                    "type": "number"
                  },
                  "note_on_older_fields": {
                    "description": "What the 1.0.0 fields first_look_price and each_extra_look_price mean against the totals.",
                    "type": "string"
                  },
                  "one_look_price": {
                    "description": "Total for 1 look, in USD before tax.",
                    "type": "number"
                  },
                  "price_by_look_count": {
                    "description": "Totals for the smallest selections.",
                    "items": {
                      "description": "The custom price of one selection size.",
                      "properties": {
                        "looks": {
                          "description": "Number of looks unlocked, the free preview's look included.",
                          "type": "number"
                        },
                        "price": {
                          "description": "Price in USD before tax.",
                          "type": "number"
                        }
                      },
                      "required": ["looks", "price"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "rule": {
                    "description": "The rule in words, for any number of looks.",
                    "type": "string"
                  },
                  "summary": {
                    "description": "The custom rule in one phrase: 1 look, 2 looks and each further look, the free preview's look counted.",
                    "type": "string"
                  }
                },
                "required": ["each_additional_look_price", "each_extra_look_price", "first_look_price", "note_on_older_fields", "one_look_price", "price_by_look_count", "rule", "summary"],
                "type": "object"
              },
              "free_preview": {
                "description": "The site's wording for the free preview.",
                "type": "string"
              },
              "free_preview_detail": {
                "description": "What the free preview is and how the prices count it.",
                "type": "string"
              },
              "note": {
                "description": "How paying works.",
                "type": "string"
              },
              "packs": {
                "description": "Fixed packs.",
                "items": {
                  "description": "One pack.",
                  "properties": {
                    "applies_when": {
                      "description": "When the pack price applies instead of the custom price.",
                      "type": "string"
                    },
                    "id": {
                      "description": "Pack id.",
                      "type": "string"
                    },
                    "looks": {
                      "description": "The pack's exact looks as start_personal_preview looks items: pass the list unchanged to get the pack price.",
                      "items": {
                        "description": "One look of the pack.",
                        "properties": {
                          "amount": {
                            "description": "The pack's setting for this look: mL, or units for lip-flip.",
                            "type": "number"
                          },
                          "style_id": {
                            "description": "Look id, or lip-flip.",
                            "type": "string"
                          }
                        },
                        "required": ["amount", "style_id"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "looks_param": {
                      "description": "The same looks as comma-separated link tokens, for the REST preview-link looks parameter.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Display name.",
                      "type": "string"
                    },
                    "payment": {
                      "description": "Always one-time.",
                      "type": "string"
                    },
                    "previews": {
                      "description": "Looks in the pack, the free preview's look included.",
                      "type": "number"
                    },
                    "price": {
                      "description": "Price in USD before tax.",
                      "type": "number"
                    }
                  },
                  "required": ["applies_when", "id", "looks", "looks_param", "name", "payment", "previews", "price"],
                  "type": "object"
                },
                "type": "array"
              },
              "price_rule": {
                "description": "The prices in one paragraph: the custom rule, each pack against the custom price for the same count, and how to get a pack.",
                "type": "string"
              },
              "summary": {
                "description": "The pricing lines; the custom line states the same rule as price_rule.",
                "items": {
                  "description": "One line.",
                  "type": "string"
                },
                "type": "array"
              },
              "tax": {
                "description": "How tax is handled.",
                "type": "string"
              }
            },
            "required": ["audience", "currency", "custom_selection", "free_preview", "free_preview_detail", "note", "packs", "price_rule", "summary", "tax"],
            "type": "object"
          },
