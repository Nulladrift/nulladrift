        {
          "name": "start_personal_preview",
          "title": "Start a personal preview",
          "description": "A link into the LookPrep web flow with looks preselected: looks for one or more, style_id as a shortcut for one, neither for the plain flow. Returns the link, its price and an instruction. Give the link to the person, who confirms they are 18 or older, uploads their own photo, consents and pays on the page; never ask for their photo.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "looks": {
                "description": "Looks to preselect, in order: 1 to 32 items. The first 20 valid, distinct looks are kept (the largest pack); every other item is returned in dropped with the reason.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "One of the look's demo_amounts (list_lip_styles, get_lip_style): mL, or units for lip-flip. Defaults to the look's standard setting.",
                      "maximum": 20,
                      "minimum": 0,
                      "type": "number"
                    },
                    "style_id": {
                      "description": "Look id from list_lip_styles, or lip-flip.",
                      "maxLength": 48,
                      "pattern": "^[a-z0-9][a-z0-9-]{0,47}$",
                      "type": "string"
                    }
                  },
                  "required": ["style_id"],
                  "type": "object"
                },
                "maxItems": 32,
                "minItems": 1,
                "type": "array"
              },
              "style_id": {
                "description": "Shortcut for looks: [{ style_id }], one look at its standard setting. A look id from list_lip_styles, or lip-flip. Not with looks.",
                "maxLength": 48,
                "pattern": "^[a-z0-9][a-z0-9-]{0,47}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "A link that opens the web flow for the person.",
            "properties": {
              "caption": {
                "description": "Say this with every image or preview: a simulation, not a prediction of a result, not medical advice.",
                "type": "string"
              },
              "dropped": {
                "description": "Requested looks that were left out, with the reason.",
                "items": {
                  "description": "A requested look that was left out.",
                  "properties": {
                    "amount": {
                      "description": "The amount as sent, when one was sent.",
                      "type": "number"
                    },
                    "index": {
                      "description": "Position in the request (looks), from 0.",
                      "type": "number"
                    },
                    "reason": {
                      "description": "Why it was left out.",
                      "type": "string"
                    },
                    "requested": {
                      "description": "The look id or token as sent.",
                      "type": "string"
                    }
                  },
                  "required": ["index", "reason", "requested"],
                  "type": "object"
                },
                "type": "array"
              },
              "first_preview_free": {
                "description": "Always true: the person sees one look free before paying.",
                "type": "boolean"
              },
              "flow_url": {
                "description": "Where the link lands: the upload page, with the looks in its looks parameter when any are selected.",
                "type": "string"
              },
              "instruction": {
                "description": "What to tell the person. Pass it on with the link.",
                "type": "string"
              },
              "look": {
                "description": "The style_id the call was made with, as a catalogue id; null when looks or nothing was sent.",
                "type": ["string", "null"]
              },
              "looks": {
                "description": "The preselected looks, in order, at most 20. Empty for the plain flow.",
                "items": {
                  "description": "One preselected look.",
                  "properties": {
                    "amount": {
                      "description": "The amount, in unit.",
                      "type": "number"
                    },
