{
  "lockfileVersion": 2,
  "subjects": {
    "com.llmcutover/audit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.llmcutover.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "llmcutover",
        "title": "LLM Cutover",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call run_cutover_audit with 5-10 real samples and the answers your current model gave. Anonymous: 3 audits/day. With a full-audit pass as the Bearer token: up to 500 samples, 5 runs.",
      "tools": [
        {
          "name": "list_models",
          "title": "List priced models",
          "description": "Current models with $/1M token prices and effort levels, usable as current.model.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ba49ac0741bb4924aad721388f8950c5a82b7daca8dd5417384d6501b8125cf8"
        },
        {
          "name": "run_cutover_audit",
          "title": "Run an LLM cutover audit",
          "description": "Measures how often a cheaper model (Sage 2) agrees with your current LLM on your samples, the confidence threshold for routing, and the monthly cost now vs a hybrid. Returns the full report as JSON.",
          "inputSchema": {
            "properties": {
              "current": {
                "description": "Your current model: {\"model\": \"<id from GET /api/models>\", \"effort\": \"<level>\"} or custom prices {\"in\": USD per 1M input tokens, \"out\": USD per 1M output tokens}.",
                "properties": {
                  "effort": {
                    "type": "string"
                  },
                  "in": {
                    "maximum": 1000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "model": {
                    "enum": ["claude-fable-5.1", "claude-opus-5.5", "claude-sonnet-5.5", "claude-haiku-5.5", "gpt-6-astra", "gpt-5.6-sol", "gpt-6.1-sol", "gpt-6.1-terra", "gpt-5-mini", "gpt-6-luna", "gemini-4-argon", "gemini-3.8-flash", "gemini-3.1-flash-lite"],
                    "type": "string"
                  },
                  "out": {
                    "maximum": 1000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "fields": {
                "additionalProperties": {
                  "properties": {
                    "definition": {
                      "maxLength": 300,
                      "type": "string"
                    },
                    "type": {
                      "enum": ["string", "number", "integer", "boolean", "date", "money"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "description": "extract only. Up to 12 fields: {\"name\": {\"type\": \"string|number|integer|boolean|date|money\", \"definition\": \"...\"}}",
                "type": "object"
              },
              "mode": {
                "description": "yesno: a yes/no decision per text. extract: fields pulled out of each text.",
                "enum": ["yesno", "extract"],
                "type": "string"
              },
              "question": {
                "description": "yesno only. The yes/no question your current model answers, e.g. \"Is this ticket about billing?\"",
                "maxLength": 600,
                "type": "string"
              },
              "samples": {
                "description": "Real inputs with the answer your CURRENT model gave. Array of objects or a JSONL/CSV string. yesno: {\"text\",\"label\":\"yes|no\"}; extract: {\"text\",\"expected\":{...}}. Each text ≤ 4000 chars. Min 5. Max 10 anonymous, 25 free on the website, 500 yesno / 200 extract with a pass.",
                "oneOf": [
                  {
                    "items": {
                      "properties": {
                        "expected": {
                          "type": "object"
                        },
                        "label": {
                          "enum": ["yes", "no"],
                          "type": "string"
                        },
                        "text": {
                          "type": "string"
                        }
                      },
                      "required": ["text"],
                      "type": "object"
                    },
                    "minItems": 5,
                    "type": "array"
                  },
                  {
                    "type": "string"
                  }
                ]
              },
              "target": {
                "default": 0.98,
                "description": "Agreement you need on the calls the cheap model keeps.",
                "enum": [0.95, 0.98, 0.99],
                "type": "number"
              },
              "usage": {
                "properties": {
                  "monthlyCalls": {
                    "default": 100000,
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "outputTokens": {
                    "maximum": 4000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "promptOverheadTokens": {
                    "default": 400,
                    "maximum": 20000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "reasoningTokens": {
                    "description": "Measured reasoning tokens per call, if you know them; otherwise estimated from effort.",
                    "maximum": 50000,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["current", "mode", "samples"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:55ff2cb3069b2320f58bd1e1774f6e11f408359709d2785e30985af4b3e6dfdd"
        }
      ],
      "digest": "sha256:add3a675f5786af668f05bf05a5ca2229a711a1240bfd06c6305579be30c9542"
    }
  }
}
