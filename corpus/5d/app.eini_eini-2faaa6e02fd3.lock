{
  "lockfileVersion": 2,
  "subjects": {
    "app.eini/eini": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.eini.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "eini",
        "title": "EINI",
        "version": "1.2.0",
        "websiteUrl": "https://eini.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "EINI (eini.app) is a Swiss app for saving money in everyday life. Its tools cover Switzerland only: eini_search_deals finds this week's promotions (Aktionen / actions / azioni) at Coop, Migros, Lidl, Aldi, Denner, Aligro, Volg and Otto's; eini_compare_health_insurance gives the official 2027 basic health-insurance (KVG/LAMal) premiums by municipality, age and franchise. Prices are in CHF and come from EINI's data (retailer offers, official BAG premiums); quote them as returned. With the user's EINI login, eini_my_meal_plan and eini_my_shopping_list read the user's current meal plan and shopping list, and eini_create_meal_plan makes a new plan when the user asks for one.",
      "tools": [
        {
          "name": "eini_compare_health_insurance",
          "title": "Compare Swiss health insurance premiums",
          "description": "Official monthly premiums of Swiss basic health insurance (KVG / LAMal) for next year, cheapest insurer first, for a municipality or postcode, an age and a franchise. Optional: model (standard, family doctor 'hausarzt', HMO, Telmed) and accident cover (employees working 8+ hours a week are usually covered by their employer and can leave it out). Data: BAG, all insurers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accident_cover": {
                "default": true,
                "type": "boolean"
              },
              "age": {
                "description": "Age of the insured person.",
                "maximum": 120,
                "minimum": 0,
                "type": "integer"
              },
              "franchise": {
                "description": "Deductible in CHF. Adults: 300, 500, 1000, 1500, 2000 or 2500 (default 2500). Children: 0-600.",
                "type": "integer"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "default": "any",
                "description": "'any' = each insurer's cheapest model.",
                "enum": ["any", "standard", "hausarzt", "hmo", "telmed"],
                "type": "string"
              },
              "place": {
                "description": "Swiss municipality or 4-digit postcode, e.g. 'Emmen', 'Lausanne', '8001'.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["age", "place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare Swiss health insurance premiums"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:eeb5c3f2e23631d64408954f8f15dbc24f34d0b1f2b73612035924d544d264fb"
        },
        {
          "name": "eini_create_meal_plan",
          "title": "Make a new EINI meal plan",
          "description": "Make a NEW weekly meal plan (lunch and dinner, 7 days) in the user's EINI account, built around this week's Swiss supermarket deals, with its shopping list. Uses the user's saved EINI settings (people, diets, stores); you may change people, diets or language. Call it only when the user asks for a new plan: the new plan becomes their current plan in the app (earlier plans are not deleted). The account may need an EINI subscription for it (the answer says so). Needs the user's EINI login.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "Optional. Adults eating; default: the user's saved setting.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "children": {
                "description": "Optional. Children eating; default: the user's saved setting.",
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "diet": {
                "description": "Optional. Replaces the saved diets; [] for none.",
                "items": {
                  "enum": ["vegetarian", "vegan", "gluten-free", "lactose-free", "nut-free", "low-carb", "high-protein"],
                  "type": "string"
                },
                "type": "array"
              },
              "language": {
                "description": "Optional. Language of recipes and shopping list; default: saved.",
                "enum": ["de", "fr", "it", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Make a new EINI meal plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:370eeb9e729756dc9b16157530d17bd0efac01f35b1aa0a93bfae00b4333497b"
        },
        {
          "name": "eini_my_meal_plan",
          "title": "My EINI meal plan",
          "description": "The user's current weekly meal plan from their EINI account (lunch and dinner per day, built around this week's Swiss supermarket deals). Without 'day': the week overview. With 'day': that day's recipes with ingredients, quantities and steps. Needs the user's EINI login. If there is no plan yet, the answer says so.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "day": {
                "description": "Optional. Weekday in any language ('Monday', 'Montag', 'lundi', 'lunedì') or the day number 1-7 in the plan.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "My EINI meal plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:6ca8051a918230af377d7a5db0632147938b71993786271b7abfb89f61556c05"
        },
        {
          "name": "eini_my_shopping_list",
          "title": "My EINI shopping list",
          "description": "The shopping list of the user's current EINI meal plan: each item with quantity, the store and product EINI picked (cheapest, using this week's deals), pack price in CHF and whether it is on promotion. By default only items not ticked off yet. Needs the user's EINI login.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "open_only": {
                "default": true,
                "description": "true (default): only items not ticked off yet; false: the whole list.",
                "type": "boolean"
              },
              "store": {
                "description": "Optional. Only items to buy at this store, e.g. 'Coop', 'Migros', 'Lidl'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "My EINI shopping list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:7c122b04a222df2943164143da9aaa675ad3ec1ca9f8cd89bae4d942c71b7a89"
        },
        {
          "name": "eini_search_deals",
          "title": "Search Swiss supermarket deals",
          "description": "Find this week's promotions (Aktionen) at Swiss supermarkets: Coop, Migros, Lidl, Aldi, Denner, Aligro, Volg and Otto's. Search by product (any language; German/French/Italian names match best), filter by store and category. Returns at most 20 deals, biggest discount first, with price, regular price, discount and last day (null = while stocks last). A multi-buy offer (Coop's 'ab 2 Stück') adds a condition; its price is for one piece. Switzerland only, prices in CHF.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "produce (fruit & veg), protein (meat & fish), dairy (incl. eggs), pantry, frozen, beverage.",
                "enum": ["produce", "protein", "dairy", "pantry", "frozen", "beverage"],
                "type": "string"
              },
              "language": {
                "default": "de",
                "description": "Language for product names and labels (Aligro and Volg are not shown for 'it').",
                "enum": ["de", "fr", "it", "en"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Product to look for, e.g. 'Poulet', 'chicken', 'Kaffee', 'mozzarella'. Leave empty for the biggest discounts overall.",
                "maxLength": 80,
                "type": "string"
              },
              "retailers": {
                "description": "Only these stores. Leave empty for all.",
                "items": {
                  "enum": ["Coop", "Migros", "Lidl", "Aldi", "Denner", "Aligro", "Volg", "Otto's"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Swiss supermarket deals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:48b3115ad29ad8572d1a47ee4fc8e84ad5b63f76b4d91ac01ef5731aa5e44719"
        }
      ],
      "digest": "sha256:c5d4f11f0221bdaf76592f6c1473f3e7c97f05f481740da336f3f13374d90ef2"
    }
  }
