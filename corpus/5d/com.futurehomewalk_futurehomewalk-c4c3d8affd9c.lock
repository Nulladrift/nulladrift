        {
          "name": "start_order",
          "title": "Where to start an order",
          "description": "Returns the web address where a person can start a Future Home Walk order for a house, an apartment or a commercial unit, with the steps that follow. It creates nothing: no account, no order, no payment, and it accepts no personal data. Use when the user says they want to order (Polish: zamów, zamówienie, jak zacząć, rozpocznij projekt).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
