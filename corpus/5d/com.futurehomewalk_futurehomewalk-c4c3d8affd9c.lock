          "description": "Returns the current Future Home Walk price list, which depends on the floor area and is in US dollars, and what the payment covers. Use when the user asks what it costs (Polish: cena, cennik, ile kosztuje, koszt spaceru 3D, ile kosztuje wizualizacja domu lub mieszkania).",
