        {
          "name": "get_service_overview",
          "title": "Service overview",
          "description": "Describes Future Home Walk, a paid online service run from Poland, in English, priced in US dollars and available worldwide, that turns the plans of a building into a 3D walkthrough in the browser: what it does, who it is for, how an order works and what its limits are. Use when the user asks what Future Home Walk is, or about getting a 3D walkthrough of a house, apartment or commercial unit from its plans (Polish: spacer 3D, wirtualny spacer po domu, wizualizacja domu z projektu, wizualizacja mieszkania, wizualizacja lokalu, rzut, plany).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "links": {
                "items": {
