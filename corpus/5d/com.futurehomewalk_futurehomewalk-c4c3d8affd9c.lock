      "instructions": "Read-only information about Future Home Walk and a free-sky sun estimate. Customer accounts and projects are not reachable through this server.",
      "tools": [
        {
          "name": "estimate_sun_hours",
          "title": "Estimate sun hours",
          "description": "Calculates sunrise, sunset, day length, noon sun elevation and direct-sun hours for a window facing north, east, south and west (and optionally a given azimuth) at a location, for the 21st of a month. This is a free-sky estimate that ignores buildings, trees and terrain. Use when the user asks how much sun a window, apartment, plot or facade gets, or about sunrise and sunset at a place (Polish: ile słońca, nasłonecznienie, godziny słońca, wschód i zachód słońca, strona świata, okna na południe).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "facade_azimuth_deg": {
                "description": "Optional direction a window faces, in degrees clockwise from north (0 north, 90 east, 180 south, 270 west).",
                "maximum": 360,
                "minimum": 0,
                "type": "number"
              },
              "lat": {
                "description": "Latitude in degrees (north is positive).",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lng": {
                "description": "Longitude in degrees (east is positive).",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "month": {
                "description": "Month from 1 to 12. The 21st of that month is used.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["lat", "lng", "month"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "links": {
                "items": {
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["day_length_hours", "direct_sun_hours", "estimate_type", "links", "noon_sun_elevation_deg", "note", "sunrise_local", "sunset_local"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate sun hours"
          },
          "behavior": {
