{
  "lockfileVersion": 2,
  "subjects": {
    "app.netlify.clify-dev/clify": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bold-cloud-h4u6s.run.mcp-use.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "clify",
        "title": "clify — websites as agent tools",
        "version": "0.3.0",
        "description": "135 real websites (1619 verified commands) as typed, JSON-first calls for agents, through 3 core tools (+4 shortcuts)."
      },
      "capabilities": {
        "completions": {},
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "clify turns real websites into typed commands. Find a site with clify_sites {query}, read its commands with clify_help {site} (add command for full params), then call clify_run {site, command, args}. Pass fields (comma-separated keys) and limit to keep results small. Writes never send without confirm:true; without it they return a dry-run preview of the exact request.",
      "tools": [
        {
          "name": "clify_help",
          "title": "Commands and params of a site",
          "description": "A site's commands with params (\"name*\" = required, \":a|b\" = allowed values, \"=x\" = default). Pass command for full param docs, default fields and a ready clify_run call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "command": {
                "description": "one command name for full details",
                "type": "string"
              },
              "site": {
                "description": "site name from clify_sites, e.g. crates, weather",
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4687fa443913ed5db7ae74c090cf95d06c6f00d94dbbecf82673d32799eba526"
        },
        {
          "name": "clify_run",
          "title": "Run a site command",
          "description": "Call one command of a clify site and get JSON back. args holds the command's params (see clify_help). Lists return count, total and nextPage (args for the next page). Write commands return a dry-run preview unless confirm:true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "args": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "params, e.g. {\"name\":\"serde\"}",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "command": {
                "description": "command name, e.g. get-crate",
                "type": "string"
              },
              "confirm": {
                "description": "true sends a write; otherwise writes return a preview",
                "type": "boolean"
              },
              "fields": {
                "description": "comma-separated keys to keep (dot paths ok); \"*\" for all",
                "type": "string"
              },
              "limit": {
                "description": "first N items of a list",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "site": {
                "description": "site name, e.g. crates",
                "type": "string"
              }
            },
            "required": ["command", "site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:198a7a05ec6473fe426f40028c6090694f3c9b63e2fe9aef92b85eb89517f791"
        },
        {
          "name": "clify_sites",
          "title": "Find a clify site",
          "description": "Search the catalogue of 135 real websites clify can call (package registries, government data, science, news, jobs, weather, culture…). Pass a keyword query to get the best sites with their matching commands. Without a query it pages through the catalogue, one line per site (\"name (category, commands): about\"); filter with category. Start here.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "enum": ["culture", "dev", "gov-eu", "gov-nordic", "gov-us", "jobs-market", "maps-weather", "news", "sandbox", "science", "sports-ent"],
                "type": "string"
              },
              "limit": {
                "description": "max sites (default 6 with a query, 40 per page without)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "offset": {
                "description": "skip this many sites when paging the catalogue (see nextPage)",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "what you need, e.g. \"rust crate versions\" or \"weather forecast\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eaadd3ac2da7448eb20ddcc146e372e295651f68e68601ab1d009264321c40d4"
        },
        {
          "name": "crates__get-crate",
          "title": "crates get-crate",
          "description": "crates.io: Get a crate's details: description, links, download totals, keywords, categories and default version Returns name, description, default_version, downloads, recent_downloads, num_versions, keywords, categories, repository, documentation, homepage, updated_at by default. (Same as clify_run site=crates command=get-crate.)",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "fields": {
                "description": "keys to keep; \"*\" for all",
                "type": "string"
              },
              "limit": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "name": {
                "description": "Crate name",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8c936bbdac005afe74c66fa63d5c4993b951fc704861d3f9360203d9fed7456f"
        },
        {
          "name": "hnsearch__search",
          "title": "hnsearch search",
          "description": "hn.algolia.com: Search stories/comments by relevance Returns title, points, num_comments, author, created_at, url, objectID by default. (Same as clify_run site=hnsearch command=search.)",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "fields": {
                "description": "keys to keep; \"*\" for all",
                "type": "string"
              },
              "hitsPerPage": {
                "type": "number"
              },
              "limit": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "page": {
                "type": "number"
              },
              "query": {
                "type": "string"
              },
              "tags": {
                "description": "default story",
                "enum": ["story", "comment", "ask_hn", "show_hn", "poll"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1ab9fa244110bbb2645422667629db1a4db74b06644122959230b2c8e0b18b6b"
        },
        {
          "name": "pypi__get-package",
          "title": "pypi get-package",
          "description": "pypi.org: Get a package's PyPI page for its latest version: name and version, summary, pip install command, project links and metadata sidebar, and README text. Returns name_version, summary, pip_command, sidebar, description by default. (Same as clify_run site=pypi command=get-package.)",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "fields": {
                "description": "keys to keep; \"*\" for all",
                "type": "string"
              },
              "limit": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "name": {
                "description": "Package name as it appears on PyPI, e.g. requests",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1a55f1ee3c69b3c4997331b905f7ed7e35e2e84b4b895f59340d242c5cfb30c2"
        },
        {
          "name": "wikipedia__summary",
          "title": "wikipedia summary",
          "description": "en.wikipedia.org: Short summary of an article (title, description, extract, url) Returns title, description, extract, content_urls.desktop.page by default. (Same as clify_run site=wikipedia command=summary.)",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "fields": {
                "description": "keys to keep; \"*\" for all",
                "type": "string"
              },
              "limit": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "title": {
                "description": "article title, spaces as underscores, e.g. Y_Combinator",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4b974f11e88727fc08ba26f0a8f984231f344da493c602deb933be04be306210"
        }
      ],
      "resources": [
        {
          "uri": "clify://guide",
          "name": "clify-guide",
          "title": "How to use clify",
          "description": "Workflow, output shaping and write-safety rules for agents.",
          "mimeType": "text/markdown",
          "digest": "sha256:88e3b2ce0442eda36ed749767fab7fbd23be3beb93eb1b40c47516f97d0cdb05"
        }
      ],
      "resourceTemplates": [
        {
          "uriTemplate": "clify://sites/{site}",
          "name": "clify-site-spec",
          "title": "clify site spec",
          "description": "The full JSON spec (commands, params, extractors) behind one site.",
          "mimeType": "application/json",
          "digest": "sha256:e76ca74b73e2ce242bd27fb03ac653f4f9cec44783e56af87048d4413369ea45"
        }
      ],
      "prompts": [
        {
          "name": "use-clify",
          "title": "Do a web task with clify",
          "description": "Instructions for answering a web task through clify tools instead of a browser.",
          "arguments": [
            {
              "name": "task",
              "description": "what the user wants from the web",
              "required": true
            }
          ],
          "digest": "sha256:71959971ab471e9d8832db48d7a0b88e432d94be724e336988c5bd4d832bb731"
        }
      ],
      "digest": "sha256:2253df34d4f8fc9c66e9cffe2e5d775de734f2634ab15cc0c56c701ca0aa4cd7"
    }
  }
}
