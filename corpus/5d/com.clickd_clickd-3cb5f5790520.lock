        },
        {
          "name": "clickd_schema_create",
          "title": "Write structured data",
          "description": "Makes JSON-LD for one page from the fields given, ready to paste, and fetches nothing.\nWhen: to write the structured data a fix asks for; call it with only type to see the fields.\nInstead: clickd_check with kind product to check a live product page.\nInputs: `type` is one of the types offered; `as` a more exact one, such as Plumber; `fields` the values by field key, as text. Give only what the page shows.\nReturns: jsonld, script (ready to paste), missing, problems, recommended and fields.\nFails: a type not offered says which are. Works with no key.",
          "inputSchema": {
