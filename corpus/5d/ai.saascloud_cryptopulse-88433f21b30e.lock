              },
              "callback_url": {
                "description": "Optional https URL; MuslimTasker POSTs a JSON status update to it whenever the lead status changes",
                "type": "string"
              },
              "category": {
                "description": "Service category: plumbing, electrical, handyman, cleaning, moving, furniture-assembly, tv-mounting, painting, yard-work, appliance-repair, hvac, roofing, remodel, general-contracting, emergency-repair, other (default: other)",
                "type": "string"
              },
              "city": {
                "description": "City",
                "type": "string"
              },
              "contact_preference": {
                "description": "How the customer prefers to be contacted: call, text, whatsapp or email (default: call)",
                "type": "string"
              },
              "country": {
                "description": "US or CA (default US)",
                "type": "string"
              },
              "customer_consent": {
