        {
          "name": "bridge_quote",
          "description": "[$0.01 USDC per call via x402] Best cross-chain bridge route and quote for moving a token between chains (Base, Ethereum, Arbitrum, Optimism, Polygon, BSC, Avalanche, Solana and more): output amount, fees, gas, duration, via Relay (LI.FI fallback).",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Amount in human units, e.g. 100",
                "type": "string"
              },
              "from_address": {
                "description": "Optional sender wallet; required for an executable transaction request",
                "type": "string"
              },
              "from_chain": {
                "description": "Source chain name or id (base, ethereum, arbitrum, optimism, polygon, bsc, avalanche, solana, ...)",
