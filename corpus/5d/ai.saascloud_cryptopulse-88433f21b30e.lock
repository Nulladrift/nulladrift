              },
              "from_token": {
                "description": "Token symbol or address on the source chain (default USDC)",
                "type": "string"
              },
              "slippage": {
                "description": "Max slippage fraction, 0.0005-0.05 (default 0.005)",
                "type": "string"
              },
              "to_address": {
                "description": "Optional recipient wallet on the destination chain (Solana address for Solana destinations)",
                "type": "string"
