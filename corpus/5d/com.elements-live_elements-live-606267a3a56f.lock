      },
      "instructions": "Elements Live is a research tool for chemistry, materials and physics literature: one question in, several ways of finding papers out -- classic title+abstract relevance search, research communities, the classics a field cites, what matters now, the newest work, element/topic lists, boolean filters, start-from-a-DOI -- plus research-intensity measurements for the 118 elements and thousands of topics. WHICH TOOL FIRST: any literature question, broad or about a specific process -> research (its `relevant` lens matches title AND abstract across the whole corpus); one element's or topic's top papers -> get_element_papers with keyword, or search_subjects then get_subject_papers; counting or filtering by several elements/topics -> lab_quote, then read its `warnings`. ABSTRACTS: every paper carries its abstract where one is on file (about 6 in 10); the rest match by title only. COVERAGE: our corpus is curated, not complete, so research's `relevant` lens also brings up to 3 of every 10 results from OpenAlex, marked source='openalex' (no community or impact data). A miss means 'not found', never 'not published'. ACCESS: get_element_ri needs no key; search_subjects is free with any key; topic metrics, paper lists and research need Personal+, the Lab tools Professional+. Without a key, priced tools can be paid per call in USDC on Base or Solana with x402 (each tool's description gives its price; pay only with the user's approval). Every payload carries a notes block on how its metrics may be compared: read it before citing a number. Usage guide (always the latest version): https://www.elements-live.com/docs/api/elements-live-skill.md",
      "tools": [
        {
          "name": "get_element_papers",
          "title": "Top papers for an element",
          "description": "The top papers for one element, narrowed with keyword to one of its materials or applications (e.g. symbol='Al', keyword='aluminum nitride'; the keyword must name one of the element's topics exactly, case aside -- search_subjects finds topic names). Returns title, DOI, venue, year, citations. sort=impact (default) favours recent, well-cited work; sort=foundational gives the most-cited classics; sort=newest the latest. Each paper carries its abstract where one is on file (about 6 in 10). Requires a Personal+ account. Capped at 100 papers with no pagination. Without a key, pay per call: $0.02 for up to 20 papers, $0.10 for up to 100, in USDC on Base or Solana via x402 (send the payment in _meta[\"x402/payment\"]).",
          "inputSchema": {
            "properties": {
              "keyword": {
                "description": "Optional: narrow to one application keyword.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "type": "integer"
              },
              "sort": {
                "default": "impact",
                "description": "impact = citation-impact ranking (default); newest = most recently published first; foundational = most-cited first (the classics a reading list starts from).",
                "enum": ["impact", "newest", "foundational"],
                "type": "string"
              },
              "symbol": {
                "description": "Element symbol, e.g. 'Fe' (a name like 'Iron' or an atomic number like '26' also works)",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
