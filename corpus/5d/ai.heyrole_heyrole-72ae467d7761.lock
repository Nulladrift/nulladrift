                    "name": {
                      "type": "string"
                    },
                    "open_remote_jobs": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["company_id", "domain", "heyrole_url", "industry", "name", "open_remote_jobs"],
                  "type": "object"
                },
                "type": "array"
              },
              "next_page": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "retrieved_at": {
                "type": "string"
              },
              "total": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["api_version", "companies", "next_page", "retrieved_at", "total"],
            "type": "object"
