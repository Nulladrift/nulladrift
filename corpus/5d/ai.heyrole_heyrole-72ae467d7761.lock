        {
          "name": "search_companies",
          "title": "Search companies",
          "description": "Find companies by name, domain or industry, ordered by open remote jobs. Pass a company_id to search_jobs for its active postings. Continue with next_page and the same filters and limit.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "hiring_only": {
                "default": false,
                "description": "Only companies with active remote jobs.",
                "type": "boolean"
              },
              "industry": {
                "default": "",
                "description": "Exact industry label from a company result. Use Unspecified industry for unknown values.",
                "maxLength": 200,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "q": {
                "default": "",
                "description": "Case-insensitive substring of a company name or domain.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "api_version": {
                "const": "1",
                "type": "string"
