                      "type": ["string", "null"]
                    },
                    "salary_text": {
                      "type": ["string", "null"]
                    },
                    "seniority": {
                      "type": ["string", "null"]
                    },
                    "skills": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "source": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": ["string", "null"]
                    },
                    "status": {
