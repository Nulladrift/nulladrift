            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "api_version": {
                "const": "1",
                "type": "string"
              },
              "categories": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["key", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "employment_types": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["key", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "location_matching": {
                "type": "string"
              },
              "locations": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["key", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "retrieved_at": {
                "type": "string"
              },
              "seniorities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["key", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "skills": {
                "items": {
                  "type": "string"
                },
                "type": "array"
