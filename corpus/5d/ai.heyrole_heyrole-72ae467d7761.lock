                  "enum": ["engineering", "data", "design", "product", "marketing", "sales", "customer", "operations", "people", "finance", "healthcare", "other"],
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "cursor": {
                "description": "Opaque next_cursor from the previous page; keep filters unchanged.",
                "maxLength": 1024,
                "minLength": 1,
                "type": "string"
              },
              "employment_type": {
                "enum": ["full-time", "part-time", "contract", "internship", "temporary"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locations": {
                "default": [],
                "description": "Any matching posting location. Country keys do not automatically include worldwide or broad-region postings; add those keys explicitly.",
                "items": {
                  "enum": ["worldwide", "europe", "emea", "americas", "north-america", "latam", "apac", "mea", "ad", "ae", "af", "ag", "ai", "al", "am", "ao", "ar", "as", "at", "au", "aw", "ax", "az", "ba", "bb", "bd", "be", "bf", "bg", "bh", "bi", "bj", "bl", "bm", "bn", "bo", "bq", "br", "bs", "bt", "bv", "bw", "by", "bz", "ca", "cc", "cd", "cf", "cg", "ch", "ci", "ck", "cl", "cm", "cn", "co", "cr", "cu", "cv", "cw", "cx", "cy", "cz", "de", "dj", "dk", "dm", "do", "dz", "ec", "ee", "eg", "eh", "er", "es", "et", "fi", "fj", "fk", "fm", "fo", "fr", "ga", "gb", "gd", "ge", "gf", "gg", "gh", "gi", "gl", "gm", "gn", "gp", "gq", "gr", "gs", "gt", "gu", "gw", "gy", "hk", "hm", "hn", "hr", "ht", "hu", "id", "ie", "il", "im", "in", "io", "iq", "ir", "is", "it", "je", "jm", "jo", "jp", "ke", "kg", "kh", "ki", "km", "kn", "kp", "kr", "kw", "ky", "kz", "la", "lb", "lc", "li", "lk", "lr", "ls", "lt", "lu", "lv", "ly", "ma", "mc", "md", "me", "mf", "mg", "mh", "mk", "ml", "mm", "mn", "mo", "mp", "mq", "mr", "ms", "mt", "mu", "mv", "mw", "mx", "my", "mz", "na", "nc", "ne", "nf", "ng", "ni", "nl", "no", "np", "nr", "nu", "nz", "om", "pa", "pe", "pf", "pg", "ph", "pk", "pl", "pm", "pn", "pr", "ps", "pt", "pw", "py", "qa", "re", "ro", "rs", "ru", "rw", "sa", "sb", "sc", "sd", "se", "sg", "sh", "si", "sj", "sk", "sl", "sm", "sn", "so", "sr", "ss", "st", "sv", "sx", "sy", "sz", "tc", "td", "tf", "tg", "th", "tj", "tk", "tl", "tm", "tn", "to", "tr", "tt", "tv", "tw", "tz", "ua", "ug", "um", "us", "uy", "uz", "va", "vc", "ve", "vg", "vi", "vn", "vu", "wf", "ws", "xk", "ye", "yt", "za", "zm", "zw"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "q": {
                "default": "",
                "description": "Literal substring in job title, company or posting locations; not a natural-language query.",
                "maxLength": 160,
                "type": "string"
              },
              "salary_only": {
                "default": false,
                "type": "boolean"
              },
              "seniority": {
                "enum": ["intern", "entry", "senior", "staff", "manager", "executive"],
                "type": "string"
              },
              "skills": {
                "default": [],
                "description": "Any matching skill, case-insensitive.",
                "items": {
                  "maxLength": 32,
                  "minLength": 1,
                  "pattern": "^[A-Za-z0-9.][A-Za-z0-9 .+#/-]*$",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
