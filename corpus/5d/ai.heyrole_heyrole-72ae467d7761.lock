                },
                "type": "array"
              },
              "retrieved_at": {
                "type": "string"
              },
              "seniorities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["key", "label"],
                  "type": "object"
                },
