                "additionalProperties": false,
                "properties": {
                  "apply_url": {
                    "type": ["string", "null"]
                  },
                  "category": {
                    "type": "string"
                  },
                  "company": {
                    "type": "string"
                  },
                  "company_id": {
                    "type": ["string", "null"]
