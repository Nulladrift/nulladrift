                "maxLength": 120,
                "type": "string"
              },
              "has_contractors": {
                "description": "Whether 1099 contractors are paid.",
                "type": "boolean"
              },
              "has_raised": {
                "description": "Whether the business has raised on a SAFE, note or priced round, or taken a loan.",
