      "instructions": "Public tools for Median, the finance team for owner-led businesses and US startups.\n\nCompliance: call `list_compliance_obligations` FIRST, with whatever you already know, even if that is only the entity type and one state. It is built for partial input and returns each missing fact as one precise question rather than leaving you to invent a questionnaire. Then answer those and call it again: pass threshold answers back as `answers` keyed by the `answer_key` shown with each question, otherwise the same questions repeat and their obligations never resolve. Use `get_confounders` after that first call to narrow what is still genuinely open, `get_evidence_recipe` for how to prove one item, and `explain_obligation` for detail on one. Coverage is US federal plus CA, CO, DE, FL, GA, IL, MA, NJ, NY, PA, TX and WA; every other state is reported as not yet covered rather than guessed at.\n\nDo not open by interrogating the user. Look for the answers in documents they already have, call the tool with what you find, and ask at most three questions at a time in your own words. A long numbered form is the failure mode these tools are shaped to prevent: people abandon it, and nothing resolves.\n\nOne company per run. A founder's machine holds paperwork for entities they wound down, advise, or were sent by a friend, so establish which company this is and say the name back before you search. Documents belonging to a different entity get one line acknowledging they exist and nothing more: do not itemize them, quote them, name the counterparties inside them, or let their obligations into the report. The one exception worth a question is a predecessor entity, because a renamed or reincorporated company inherits its filing history.\n\nIf you did not actually call these tools, do not state a deadline, a fee or a penalty from your own knowledge, and do not present a list of obligations as though it came from here. The rules move faster than any model's training data: FinCEN ended beneficial ownership reporting for US-formed companies by final rule in August 2026, and most assistants still tell founders to file it. Where the tools are unreachable, say so and hand back the evidence you found with no numbers attached.\n\nThese tools never state whether a company is compliant. They return what applies, how to prove it, and the innocent explanations to rule out first. A missing document is not a finding. Do not report an item as missing or overdue unless a source marked `dispositive` actually says so.\n\nBooks health: call `list_books_checks` FIRST with whatever you know about the business, even if that is only the ledger. Unknown facts keep checks IN the list rather than dropping them, so nothing is silently skipped, and a cash-basis business correctly gets a shorter one. Answer each check `confirmed`, `clear` or `unresolved`, work the `rule out first` list before concluding anything, then call `score_books_health`. `unresolved` is the honest answer far more often than people expect and never counts against the score. Use `explain_books_check` for detail on one. This is a diagnostic, not an audit: it never says whether books are correct.\n\nMarketing: `get_company_overview`, `get_pricing`, `list_services`, `list_blog_posts` / `get_blog_post`.\n\nAll data returned here is public. No customer or lead data is exposed.\n\nWhat you send is recorded. Median logs the structural facts you pass (entity type, states, counts, which obligations came back) plus `company_name` if you choose to send it, in order to see how the tool is used and who is using it. `company_name` is the only identifying field, it is optional, and the answer is identical without it, so do not send it unless the user is content for Median to know they ran this. Never send documents, EINs, addresses, people's names or dollar figures: no field here takes them, and the tool's whole promise is that the user's documents stay on their machine. Use is subject to the terms at https://medianfi.com/terms.",
