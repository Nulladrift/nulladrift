        {
          "name": "watch_company",
          "title": "Watch a company",
          "description": "Subscribe to a company's hiring events on a registered webhook --\n    `webhook_endpoint_id` must belong to the same customer as the\n    authenticated key. Meters one `watch` unit.\n\n    `event_types` names which events fire it, at least one of: `opened` (a\n    req seen for the first time), `reobserved` (a known req seen again on a\n    later day), `reposted` (a req that came back after it was gone), `closed`\n    (a req verified gone from its source), `role_hard_to_fill` (an employer's\n    own role pulled and put back, or pulled after 30+ days unfilled),\n    `sponsor_added` (the company joined the UK register of licensed sponsors),\n    `officer_appointed` and `officer_resigned` (a Companies House officer\n    change, with its role, date and company number). Anything else is refused and\n    creates nothing: a watch on a type that never fires would be billed and\n    silent.\n\n    A free key holds a limited number of watches at once; the one past that\n    is refused with the same 402 the REST route raises, and cancelling a\n    watch returns the slot.",
