        {
          "name": "search_jobs",
          "title": "Search open roles",
          "description": "Flat, role-granular job search -- the individual open roles across\n    companies matching `function` / `geo` (country) / `since`, one\n    row per logical req (each with its own `company_id` + `req_key`),\n    LinkedIn-excluded (ATS tenants plus public job boards and aggregators; each row's `board` names its source) +\n    freshness-floored. `since` filters on `first_seen`, our first\n    observation of the req (not the employer's posting date); each row's\n    `source_posted_at` is the date the source itself published, null when it\n    gave none. Keyset-paginated via the opaque `cursor`\n    (a prior call's `next_cursor`). Use `who_is_hiring_for` for the\n    company-granular reverse view. `function` is a function name (a prior\n    result's `function_name`, like 'Software & IT') or a function id (its\n    `function`); anything else, like 'engineering', is rejected with an\n    explicit error that lists the names, rather than an empty result -- pass plain\n    language as `q` instead, which searches the posting's own title,\n    expanded semantically to nearby titles, and reports each row's\n    `relevance` (0-1). `exclude_employer_types` (e.g. ['staffing']) drops\n    roles whose posting is classified as that employer type -- 'direct',\n    'staffing', 'consultancy' or 'unknown'; unclassified roles are kept unless\n    'unknown' is listed. `q` is independent of `function`: pass both to search\n    titles within one function. `sort` is 'relevance' (the default with a\n    `q`) or 'recency'; omit both and the page keeps its stable default\n    order. `limit` is bounded: an oversized page is rejected rather than\n    truncated, so page through the full set with `cursor` instead of\n    raising `limit`. No key yet? The call answers with a signup link\n    instead of rows.",
