        {
          "name": "get_open_reqs",
          "title": "Open requisitions for a company",
          "description": "The company's current active reqs, deduped across boards --\n    LinkedIn-excluded: ATS tenants plus public job boards and aggregators; each row's `boards` names its source.\n    Freshness-floored. Each row's `first_seen` is our first observation of\n    the req, not the employer's posting date; `source_posted_at` is the date\n    the source itself published, null when it gave none. `function` is a function name\n    (a prior result's `function_name`, like 'Software & IT') or a function id\n    (its `function`); anything else, like 'engineering', is\n    rejected with an explicit error that lists the names, rather than an empty result. `limit`\n    is bounded: an oversized page is rejected rather than truncated.",
