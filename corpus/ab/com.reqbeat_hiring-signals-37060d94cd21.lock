        {
          "name": "register_webhook",
          "title": "Register a webhook endpoint",
          "description": "Register the delivery target a watch fires to, and get back the\n    `webhook_endpoint_id` `watch_company` needs -- call this first if you\n    do not already hold one. Idempotent: registering the same `url` twice\n    returns the same id, so retrying is safe and never leaves you with two\n    endpoints. `secret` is optional; supply one to verify the\n    `X-Reqbeat-Signature` on delivered payloads, omit it and one is\n    generated and returned once in `secret` (never again after this call).\n    Registration itself is free -- the `watch_company` call that follows is\n    what bills.",
          "inputSchema": {
            "properties": {
              "plane_api_key": {
                "anyOf": [
                  {
