        {
          "name": "find_qualified_reqs",
          "title": "Find live roles matching an ICP",
          "description": "WHEN an agent already knows its ideal customer profile and wants the\n    matching open roles as rows it can act on: several countries, an\n    industry, a headcount band and title keywords in ONE call, instead of a\n    search followed by a lookup per company. `criteria` takes up to three\n    groups -- `company` (country, industry, industry_terms, headcount_band,\n    company_kind), `req` (q, q_excludes, seniority_level, function,\n    skills, remote_type, location) and `event` (company_id,\n    board, source_type, ats_vendor, country) -- AND across fields, OR within\n    one.\n    A field outside that list is an explicit error, never quietly dropped.\n    criteria={\"company\": {\"country\": [\"United States\", \"Germany\"]},\n    \"req\": {\"q\": [\"backend engineer\"]}} -> live backend roles in\n    both countries, each row naming the company and carrying the posting\n    URL, seniority, skills and declared or estimated yearly pay.\n    `salary_min_usd` / `salary_max_usd` bracket that pay. Agencies and\n    expired postings are excluded by default. Page with `cursor` (the\n    previous `next_cursor`); `limit` is bounded. Billed per row returned, and\n    an empty page bills nothing. Needs an API key: without one the answer is\n    a signup link. For a first look at who is hiring before you have a key,\n    use `who_is_hiring_for`.",
          "inputSchema": {
            "properties": {
              "criteria": {
                "additionalProperties": true,
                "title": "Criteria",
                "type": "object"
              },
              "cursor": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Cursor"
              },
              "exclude_agencies": {
                "default": true,
                "title": "Exclude Agencies",
                "type": "boolean"
              },
              "idempotency_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Idempotency Key"
              },
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "live_only": {
                "default": true,
                "title": "Live Only",
                "type": "boolean"
              },
              "plane_api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
