        {
          "name": "get_changes",
          "title": "Change feed since cursor",
          "description": "The change feed, not a search: ledger events -- a req opened,\n    re-observed, reposted or closed -- with `event_seq > since`,\n    ascending, plus `next_cursor`. Replay with `next_cursor` instead of\n    polling or re-searching; an empty page bills nothing and one `change`\n    unit is metered per event returned. Filter by `company_id`, or by one\n    exact `event_type`. `limit` is bounded -- page with the cursor rather\n    than raising it. Free-tier callers see events at the same freshness\n    floor as every other free read. This is the pull-based twin of\n    `watch_company` (push via webhook).",
          "inputSchema": {
            "properties": {
              "company_id": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
