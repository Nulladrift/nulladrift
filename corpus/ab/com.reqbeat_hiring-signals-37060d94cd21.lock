        {
          "name": "find_company",
          "title": "Find company by domain or name",
          "description": "WHEN you hold a company's website or name but not the `company_id`\n    every company-scoped tool takes (`is_hiring`, `get_open_reqs`,\n    `hiring_pulse`, `pre_action_brief`, `watch_company`). Pass exactly one of\n    `domain` or `name`; both or neither is an error naming that rule.\n    `domain` takes a bare host or a full URL and matches exactly\n    ({\"domain\": \"https://www.stripe.com/jobs\"} -> the companies at\n    `stripe.com`); `name` returns up to five candidates, each with a\n    `match_confidence` -- 1.0 for an exact name, 0.8 for a match once legal\n    suffixes are dropped. Each company carries `company_id`, `company_name`,\n    `company_domain`, `country_code` and `coverage_status`, and no hiring\n    signal: ask `is_hiring` for that. Nothing matching is an empty\n    `companies` list, never an error. Never billed. No key yet? The call\n    answers with a signup link instead of companies.",
          "inputSchema": {
            "properties": {
              "domain": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
