        },
        {
          "name": "calculate_ghg_inventory",
          "title": "Calculate a GHG inventory (ISO 14064-1)",
          "description": "GHG inventory from activity data, reported by ISO 14064-1 category (1-6), GHG Protocol scope and gas: fuels (IPCC 2006 tier-1 defaults; litres, kg, t, GJ, MWh…; stationary or mobile), purchased electricity (official Viet Nam grid factor of the year built in — 2024 = 0.6187 tCO2/MWh, CV 1232/BNNMT-BĐKH — or give your own), refrigerant / SF6 recharges (GWP AR5 or AR6), and custom lines with your own factor (Scope 3 via scope3_category). Biogenic CO2 reported separately; optional uncertainty.",
          "inputSchema": {
            "properties": {
              "gwp": {
                "description": "GWP set (AR5 for Vietnam Decree 06 and EU CBAM; default AR5).",
                "enum": ["AR5", "AR6"],
                "type": "string"
              },
              "lines": {
                "description": "Activity data lines.",
                "items": {
                  "properties": {
                    "density_kg_per_l": {
                      "description": "Supplier density for litres (optional).",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "factor_kg_co2e_per_unit": {
                      "description": "Custom factor, kg CO2e per unit of quantity.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "factor_source": {
                      "description": "Source of the custom factor.",
                      "type": "string"
                    },
                    "fuel": {
                      "description": "diesel, gasoline, fuel_oil, lpg, natural_gas, kerosene, anthracite, bituminous_coal, sub_bituminous_coal, wood, other_solid_biomass (rice husk, bagasse). Vietnamese: dầu DO = diesel, dầu FO = fuel_oil, xăng = gasoline, gas / khí hoá lỏng = lpg, than cám / than antraxit = anthracite, trấu = other_solid_biomass.",
                      "type": "string"
                    },
                    "grid_ef_t_per_mwh": {
                      "description": "Electricity: grid emission factor, tCO2e/MWh. Omit for Viet Nam: the official factor of grid_year (or the period year) is used, e.g. 2024 = 0.6187 (CV 1232/BNNMT-BĐKH).",
                      "minimum": 0,
                      "type": "number"
                    },
                    "grid_year": {
                      "description": "Electricity without grid_ef_t_per_mwh: year of the official Viet Nam grid factor (default: year in period, else latest).",
                      "type": "integer"
                    },
                    "iso_category": {
                      "maximum": 6,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "quantity": {
                      "description": "JSON number in the given unit. Convert Vietnamese writing first (dot = thousands, comma = decimals): \"1.050 lít\" -> 1050, \"1.220 MWh\" -> 1220, \"3,2 tấn\" -> 3.2. A string such as \"1.050\" is refused as ambiguous unless number_format is set.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "refrigerant": {
                      "description": "R-22, R-32, R-134a, R-125, R-410A, R-404A, R-407C, SF6.",
                      "type": "string"
                    },
                    "scope3_category": {
                      "maximum": 15,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "self_generated": {
                      "description": "Electricity produced on site (not category 2).",
                      "type": "boolean"
                    },
                    "source": {
                      "description": "Label, e.g. \"Diesel generator Sep 2026\".",
                      "type": "string"
                    },
                    "type": {
                      "enum": ["fuel", "electricity", "refrigerant", "custom"],
                      "type": "string"
                    },
                    "uncertainty_pct": {
                      "description": "Line uncertainty at 95 %, %.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "unit": {
                      "description": "fuel: L, m3, kg, t, GJ, TJ, MWh, kWh, mmBtu; electricity: kWh, MWh, GJ; refrigerant: kg, t; custom: any.",
                      "type": "string"
                    },
                    "use": {
                      "description": "Fuel use (CH4/N2O factors), default stationary. mobile = road vehicles; off_road = forklifts, construction / farm machinery (IPCC Table 3.3.1, diesel or gasoline).",
                      "enum": ["stationary", "mobile", "off_road"],
                      "type": "string"
                    }
                  },
                  "required": ["quantity"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "number_format": {
                "description": "Only for quantities sent as strings: vi = \"1.050,5\" style (dot thousands), en = \"1,050.5\" style. Ambiguous strings without it are refused.",
                "enum": ["vi", "en"],
                "type": "string"
              },
              "organization": {
                "type": "string"
              },
              "period": {
                "description": "Reporting period, e.g. 2026 or 2026-Q1.",
                "type": "string"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate a GHG inventory (ISO 14064-1)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a37ed48b359e0522ea7c4078cbb355ba9aea23c388c12a953ceeb1f6f97443fa"
        },
        {
          "name": "cbam_default_value",
          "title": "EU CBAM default value",
          "description": "EU CBAM default value (tCO2e per tonne) of a CN8 code for a country of production, from Implementing Regulation (EU) 2025/2621 as corrected by 2026/1740, with the mark-up of the import year (10 % 2026, 20 % 2027, 30 % from 2028; fertilisers 1 %). When the exact code has no row, returns candidate codes with full descriptions.",
          "inputSchema": {
            "properties": {
              "cn_code": {
                "description": "Exact 8-digit CN code, e.g. \"72083900\".",
                "type": "string"
              },
              "country": {
                "description": "ISO-2 country of production (default VN; unknown -> Annex IV highest values).",
                "type": "string"
              },
              "variant": {
                "description": "Clinker / hydraulic cement only.",
                "enum": ["GREY", "WHITE"],
                "type": "string"
              },
              "year": {
                "description": "Year of import (mark-up), default 2026.",
                "maximum": 2034,
                "minimum": 2026,
                "type": "integer"
              }
            },
            "required": ["cn_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "EU CBAM default value"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
