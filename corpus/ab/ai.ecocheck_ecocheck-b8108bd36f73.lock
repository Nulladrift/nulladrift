      "serverInfo": {
        "name": "ecocheck",
        "title": "EcoCheck",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only access to EcoCheck (ecocheck.ai), the Vietnamese GHG inventory platform. For \"must my facility do a GHG inventory?\" call check_ghg_inventory_obligation; for 2026 rules call get_ghg_regulations; for EU CBAM call cbam_scope_check (is a CN code covered), cbam_default_value (EU default value + mark-up) and estimate_cbam_cost (certificate cost after the free-allocation adjustment); always use the exact 8-digit CN code. For a GHG inventory (ISO 14064-1 / GHG Protocol) call calculate_ghg_inventory with the activity data (ask for the official grid factor of the year for electricity), ghg_emission_factors to cite defaults, and iso14064_guide for method questions. For topics use search_ecocheck then get_article. Articles are in Vietnamese; CBAM tools answer in English data, explain them in the language of the user. Estimates are indicative, not a CBAM declaration.",
      "tools": [
        {
          "name": "about_ecocheck",
          "title": "About EcoCheck",
          "description": "What EcoCheck is (company, product, services) with links to its pricing page, case studies and contact page.",
          "inputSchema": {
