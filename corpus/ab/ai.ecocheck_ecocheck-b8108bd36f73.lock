        {
          "name": "check_ghg_inventory_obligation",
          "title": "Check GHG inventory obligation (Vietnam)",
          "description": "Check whether a Vietnamese facility must do a mandatory greenhouse-gas (GHG) inventory under Decree 06/2022 (amended by 119/2025) and the 2026 list (Decision 42/2026/QĐ-TTg). Thresholds: 3,000 tCO2e, 1,000 TOE or 65,000 t of waste per year.",
          "inputSchema": {
            "properties": {
              "annualElectricityKwh": {
                "description": "Annual electricity use in kWh (used if TOE is unknown; converted at 0.0001543 TOE/kWh per Appendix I of Circular 02/2014/TT-BCT, so 1,000 TOE ≈ 6.48 million kWh).",
                "minimum": 0,
                "type": "number"
              },
              "annualEmissionsTco2e": {
                "description": "Annual GHG emissions in tonnes CO2e.",
                "minimum": 0,
                "type": "number"
              },
              "annualEnergyToe": {
                "description": "Annual energy use in TOE (tonnes of oil equivalent).",
                "minimum": 0,
                "type": "number"
              },
              "annualWasteTonnes": {
                "description": "Solid-waste treatment capacity, tonnes/year (waste facilities).",
                "minimum": 0,
                "type": "number"
              },
              "sector": {
                "description": "cong-nghiep (industry), nhiet-dien (power), van-tai (freight transport), toa-nha (commercial building), chat-thai (solid waste), khac (other).",
                "enum": ["cong-nghiep", "nhiet-dien", "van-tai", "toa-nha", "chat-thai", "khac"],
                "type": "string"
              }
            },
            "required": ["sector"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check GHG inventory obligation (Vietnam)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2089c3f15ac89ccc22d9a90413c1c25bdd84e30fcb1d8b0e925806789fa3b297"
        },
        {
          "name": "estimate_cbam_cost",
          "title": "Estimate EU CBAM certificate cost",
          "description": "Indicative CBAM certificate cost for the EU importer: embedded emissions (default value with mark-up, or the producer's actual SEE) minus the free-allocation adjustment (Reg 2025/2620 benchmark × CBAM factor 97.5 % in 2026 × CSCF), times the official certificate price (latest quarterly price unless given). Shows the saving with actual data.",
          "inputSchema": {
            "properties": {
              "actual_see": {
                "description": "Producer's actual specific embedded emissions, tCO2e/t (verified), instead of the default value.",
                "minimum": 0,
                "type": "number"
              },
              "carbon_price_paid_eur_per_t": {
                "description": "Carbon price effectively paid in the country of origin, EUR per tCO2e embedded (none for Viet Nam in 2026).",
                "minimum": 0,
                "type": "number"
              },
              "certificate_price_eur": {
                "description": "CBAM certificate price EUR/tCO2e (default: latest official quarterly price).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "cn_code": {
                "description": "Exact 8-digit CN code.",
                "type": "string"
              },
              "country": {
                "description": "ISO-2 country of production, default VN.",
                "type": "string"
              },
              "tonnes": {
                "description": "Net mass imported into the EU, tonnes.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "variant": {
                "description": "Clinker / hydraulic cement only.",
                "enum": ["GREY", "WHITE"],
                "type": "string"
              },
              "year": {
                "description": "Year of import, default 2026.",
                "maximum": 2034,
                "minimum": 2026,
                "type": "integer"
              }
            },
            "required": ["cn_code", "tonnes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate EU CBAM certificate cost"
          },
          "behavior": {
