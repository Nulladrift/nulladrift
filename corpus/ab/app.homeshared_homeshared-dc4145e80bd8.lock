{
  "lockfileVersion": 2,
  "subjects": {
    "app.homeshared/homeshared": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://homeshared.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "homeshared",
        "title": "HomeShared",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Prices are checked live each time a tool runs (see checked_at) and include fees and taxes. Nothing is booked by these tools: book returns a checkout_url where the traveler reviews and pays. No tool accepts payment details.",
      "tools": [
        {
          "name": "book",
          "title": "Get a checkout link",
          "description": "Checks a quote_id is still available and returns a checkout_url for the traveler to open. The traveler signs in, reviews the price, house rules and cancellation policy, and pays there; this tool reserves nothing and charges nothing by itself. It accepts no card or payment details: a request containing them is refused.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "quote_id": {
                "description": "The quote_id from get_quote. Quotes last 15 minutes",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["quote_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Get a checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:314be09e012ed4a3cb1f9afc9c8529310ad12db4af2fe54c4b44df674e0006a6"
        },
        {
          "name": "find_cheaper",
          "title": "Find a cheaper stay",
          "description": "Given an Airbnb listing URL and trip dates, finds the same home bookable somewhere else (on HomeShared, where guests pay no service fee, or on a host's own booking site) and returns each match with its all-in total including fees and taxes, how confident the match is, a link, and when the price was checked, plus the savings against the Airbnb total for the same nights when that total is known (airbnb_total, or Airbnb's own prices for homes that copy them). Reads only that one public Airbnb listing page; it doesn't search Airbnb. If the home isn't listed anywhere else it returns no offers and says so.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Guests aged 13 or older",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "airbnb_total": {
                "description": "Optional: the total in USD that Airbnb shows at checkout for these dates and guests. Savings are measured against it when given. Without it, savings are reported only for homes whose prices are copied from their Airbnb calendar, against Airbnb's prices for the same nights",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "airbnb_url": {
                "description": "The Airbnb listing link, e.g. https://www.airbnb.com/rooms/12345678",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "check_in": {
                "description": "Check-in date, YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date (the morning the traveler leaves), YYYY-MM-DD",
                "type": "string"
              },
              "children": {
                "description": "Guests aged 2-12. Default 0",
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              },
              "infants": {
                "description": "Guests under 2; they don't count toward capacity. Default 0",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "pets": {
                "description": "Pets (service animals don't count). Default 0",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["adults", "airbnb_url", "check_in", "check_out"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find a cheaper stay"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bcb28cefd9593d71d42f5ca8040d041d7d09690e1e406991460fea02882078f4"
        },
        {
          "name": "get_quote",
          "title": "Get a quote",
          "description": "Gets a fresh, itemized all-in price and availability for one offer_id (from find_cheaper or search_stays) for specific dates and guests. Returns a quote_id that book needs; it stays valid for 15 minutes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Guests aged 13 or older",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "check_in": {
                "description": "Check-in date, YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date (the morning the traveler leaves), YYYY-MM-DD",
                "type": "string"
              },
              "children": {
                "description": "Guests aged 2-12. Default 0",
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              },
              "infants": {
                "description": "Guests under 2; they don't count toward capacity. Default 0",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "offer_id": {
                "description": "The offer_id from a find_cheaper or search_stays result",
                "pattern": "^[a-z_]{2,20}:[A-Za-z0-9_-]{1,40}$",
                "type": "string"
              },
              "pets": {
                "description": "Pets (service animals don't count). Default 0",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["adults", "check_in", "check_out", "offer_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4d7a881d4afd8207cc1e36864e95d590fa7d6c3f1f07a587dc8911dbd3644b89"
        },
        {
          "name": "search_stays",
          "title": "Search stays",
          "description": "Searches vacation rentals that are free for the given dates in a place and returns homes with their all-in totals (fees and taxes included), cheapest first, with links and offer_ids for get_quote. For trips without a specific listing in mind.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Guests aged 13 or older",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "check_in": {
                "description": "Check-in date, YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date (the morning the traveler leaves), YYYY-MM-DD",
                "type": "string"
              },
              "children": {
                "description": "Guests aged 2-12. Default 0",
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              },
              "infants": {
                "description": "Guests under 2; they don't count toward capacity. Default 0",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "description": "How many results to return, 1-20. Default 10",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Where to stay: a city, region or neighborhood, e.g. \"Lisbon\" or \"Joshua Tree, California\"",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "max_total": {
                "description": "Only stays whose all-in total (USD) is at most this",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "min_bedrooms": {
                "description": "Only homes with at least this many bedrooms",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "pets": {
                "description": "Pets (service animals don't count). Default 0",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["adults", "check_in", "check_out", "location"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search stays"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d78a7248329365c0aa571808fc63064bc244796773545069c5ff9c4622740d73"
        }
      ],
      "digest": "sha256:b1e644e593b0bd6491ce5e8722d60693747fa3020e19ec4a9b9098aede02540e"
    }
  }
}
