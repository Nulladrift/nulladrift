  "subjects": {
    "com.everylot/everylot": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://everylot.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "everylot",
        "title": "Everylot",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Everylot searches used cars on US dealer websites. Start with search_listings; get_listing gives full facts, market_prices model asking prices, price_drops recent cuts, dealer_lot one seller. Cite returned page URLs. Asking prices are not valuations. Physical condition, history, options and fees can differ. Confirm price and availability with the dealer.",
      "tools": [
        {
          "name": "dealer_lot",
          "title": "One dealer's lot",
          "description": "Find a dealer by name, slug or host. Returns inventory count, asking-price range/median, weekly drops, newest cars and page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dealer": {
                "description": "Dealer name, Everylot dealer slug, or website host.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "How many of the newest cars to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["dealer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One dealer's lot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb9b04807cf4a51e553898580eab807612c1a47278eaa9a0fa74242012fdffea"
        },
        {
          "name": "fetch",
          "title": "Fetch",
          "description": "Read one document returned by search, by its id, with its full text and source URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A document id from search.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0e4e6665127a729261e1dafdfe37ec463424656645076992ca70c057433a029"
        },
        {
          "name": "get_listing",
          "title": "Get one listing",
          "description": "Full vehicle facts, current/previous asking price, seller, location and page URL, by listing id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The id from a result, or its page URL.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:89edeab1c9ec0b4dd2924ec917e6ca23507917109b814908bb60ab8b2131e066"
        },
        {
          "name": "market_prices",
          "title": "What a used model costs",
          "description": "Model asking prices: median, range, listing/dealer counts, weekly/monthly drops, year averages and cheapest cars. Optional state filter. Not a vehicle valuation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "make": {
                "description": "Vehicle make, such as \"Toyota\".",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "description": "Vehicle model, such as \"Tacoma\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "description": "US state name or code; omit for all covered states.",
                "maxLength": 30,
                "type": "string"
              }
            },
            "required": ["make", "model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What a used model costs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:faa2bf25a715fdca0cceec452032b3b70482c46f509152ae7c179b38e595dd93"
        },
        {
          "name": "price_drops",
          "title": "This week's price drops",
          "description": "Advertised price drops in the last seven days, largest first. Returns old/new prices and listing URLs. Optional state, city or zip radius.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many price drops to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "US zip, state, or city/state; omit for all coverage.",
                "maxLength": 80,
                "type": "string"
              },
              "radius": {
                "description": "Miles from a zip; 30 if left out. Ignored for a city or state.",
                "maximum": 250,
                "minimum": 10,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "This week's price drops"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f761601816de58c810c975cb7a53a50d4cf675c5733ac74bf44dc7cc1f365a4"
        },
        {
          "name": "search",
          "title": "Search",
          "description": "Search Everylot used-car listings for use as a research source. Returns document ids, titles and URLs; read one with fetch.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Plain-language search query.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:12b28ee72338c36565c8ba13ca0363d284c2cf1be30631c50af2b8b111afd7dd"
        },
        {
          "name": "search_listings",
          "title": "Search used cars on dealer lots",
          "description": "Search dealer listings in plain words, optionally near a US zip or city/state. Returns vehicle facts, asking and previous prices, location, seller, page URLs and supported median asking-price comparisons. Comparisons match year, make, model, trim, state, a fixed 20,000-mile band, drivetrain, fuel and sale condition. They need eight cars at two other dealers, excluding this seller and VIN. Missing facts mean no assessment. Asking prices are not valuations. Physical condition, history, options and fees can differ. Confirm price and availability with the dealer. For good deals use sort=best_deal; unassessed cars rank last. Page through with page; get_listing gives full details. Cite page URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "description": "How many cars to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "A US zip, or a city and state (\"Tampa, FL\"), or a state name.",
                "maxLength": 80,
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Which page of results, each `limit` long.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "price_max": {
                "description": "Highest asking price in US dollars.",
                "maximum": 2000000,
                "minimum": 500,
                "type": "integer"
              },
              "query": {
                "description": "Plain words: make, model, body type, fuel, \"under 25k\", a year.",
                "maxLength": 120,
                "type": "string"
              },
              "radius": {
                "description": "Miles from the place; 30 if left out.",
                "maximum": 250,
                "minimum": 10,
                "type": "integer"
              },
              "sort": {
                "description": "best_deal ranks supported comparison gaps; unassessed last. Default: nearest with a place, newest without.",
                "enum": ["best_deal", "distance", "price", "price_desc", "miles", "year", "newest"],
                "type": "string"
              },
              "year_max": {
                "description": "Newest model year to include.",
                "maximum": 2030,
                "minimum": 1980,
                "type": "integer"
              },
              "year_min": {
                "description": "Oldest model year to include.",
                "maximum": 2030,
                "minimum": 1980,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search used cars on dealer lots"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c7cecb821526681d81df378cf8df7e2306707577a0a2df739bfd2a84302cda6"
        }
      ],
      "digest": "sha256:6e8e5b4cc597855c187ab97d5aeec3628e8e48b99892d00fc1e5eb7053eb85e1"
    }
  }
}
