{
  "lockfileVersion": 2,
  "subjects": {
    "com.estimatemypaycheck/paycheck": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://estimatemypaycheck.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "estimatemypaycheck",
        "title": "Paycheck API (estimatemypaycheck.com)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free API and MCP server for US take-home pay in 2026: federal income tax, Social Security, Medicare, state income tax and state payroll levies (SDI, PFML) for the 50 states and DC, per paycheck and per year, plus a 51-state comparison and the bonus check after the 22% supplemental withholding. No key, CORS open. Estimates, not tax advice. Every tool is read-only and deterministic. Human documentation: https://estimatemypaycheck.com/paycheck-api/",
      "tools": [
        {
          "name": "calculate_bonus_tax",
          "title": "Bonus after taxes",
          "description": "What a bonus check pays after the flat 22% federal supplemental withholding, FICA and state tax, and how much of the federal withholding comes back (or is still owed) at tax time, on top of a salary, 2026 rules (IRS Pub. 15).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bonus": {
                "description": "Bonus in dollars.",
                "example": 5000,
                "type": "number"
              },
              "filing_status": {
                "description": "Default single.",
                "enum": ["single", "joint", "head"],
                "example": "single",
                "type": "string"
              },
              "salary": {
                "description": "Annual gross salary in dollars. Give this or hourly_rate.",
                "example": 60000,
                "type": "number"
              },
              "state": {
                "description": "Two-letter state code or name: TX, CA, new-york, DC.",
                "example": "CA",
                "type": "string"
              },
              "tax_year": {
                "description": "Tax year, 2026 or 2027. Default: the year in force today (2026 now; 2027 from January 1, 2027).",
                "example": 2026,
                "type": "number"
              }
            },
            "required": ["bonus", "salary", "state"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:708f40c6a504f5f34963cab21534bae5d86192babc856b0de5e6941f7b3e5e7b"
        },
        {
          "name": "calculate_paycheck",
          "title": "Calculate take-home pay",
          "description": "Compute a US paycheck for 2026: gross, each tax and pre-tax deduction, and take-home pay per paycheck and per year, for a salary or an hourly rate (overtime over 40 hours at 1.5 times) in any state or DC. Federal withholding follows the annual tax on wages; local city and county taxes are not included (the answer names them when material).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filing_status": {
                "description": "Default single.",
                "enum": ["single", "joint", "head"],
                "example": "single",
                "type": "string"
              },
              "health_per_paycheck": {
                "description": "Pre-tax health premium per paycheck, dollars. Default 0.",
                "example": 0,
                "type": "number"
              },
              "hourly_rate": {
                "description": "Hourly rate in dollars, instead of salary.",
                "example": 25,
                "type": "number"
              },
              "hours_per_week": {
                "description": "Hours a week with hourly_rate (over 40 paid at 1.5 times). Default 40.",
                "example": 40,
                "type": "number"
              },
              "k401_percent": {
                "description": "Pre-tax 401(k) contribution, percent of gross. Default 0.",
                "example": 5,
                "type": "number"
              },
              "pay_frequency": {
                "description": "Default biweekly.",
                "enum": ["weekly", "biweekly", "semimonthly", "monthly"],
                "example": "biweekly",
                "type": "string"
              },
              "residency": {
                "description": "resident (default), nonresident (e.g. H-1B first year: taxed as single), student (F/J/M/Q nonresident: no FICA).",
                "enum": ["resident", "nonresident", "student"],
                "example": "resident",
                "type": "string"
              },
              "salary": {
                "description": "Annual gross salary in dollars. Give this or hourly_rate.",
                "example": 60000,
                "type": "number"
              },
              "state": {
                "description": "Two-letter state code or name: TX, CA, new-york, DC.",
                "example": "CA",
                "type": "string"
              },
              "tax_year": {
                "description": "Tax year, 2026 or 2027. Default: the year in force today (2026 now; 2027 from January 1, 2027).",
                "example": 2026,
                "type": "number"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc20dd7e23468cc802b60269127c37510b643d7a20fb53f7da5704728c51b3f1"
        },
        {
          "name": "compare_states",
          "title": "Compare take-home pay in every state",
          "description": "Take-home pay for the same salary in the 50 states and DC in 2026, sorted from the highest. Useful to answer \"which state lets me keep the most\" or to price a move.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filing_status": {
                "description": "Default single.",
                "enum": ["single", "joint", "head"],
                "example": "single",
                "type": "string"
              },
              "k401_percent": {
                "description": "Pre-tax 401(k) contribution, percent of gross. Default 0.",
                "example": 5,
                "type": "number"
              },
              "pay_frequency": {
                "description": "Default biweekly.",
                "enum": ["weekly", "biweekly", "semimonthly", "monthly"],
                "example": "biweekly",
                "type": "string"
              },
              "salary": {
                "description": "Annual gross salary in dollars. Give this or hourly_rate.",
                "example": 60000,
                "type": "number"
              },
              "tax_year": {
                "description": "Tax year, 2026 or 2027. Default: the year in force today (2026 now; 2027 from January 1, 2027).",
                "example": 2026,
                "type": "number"
              }
            },
            "required": ["salary"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6e0b2a8fbf85408f7aaee26ffe85995ba267b4785f773b82b1602335f28565ef"
        }
      ],
      "digest": "sha256:15cabb39e2e2e6eae0cc7801d894faa3fc1cbc8910a2f55f436b0016caa7d4ba"
    }
  }
