      "serverInfo": {
        "name": "fundopshq",
        "title": "FundOpsHQ",
        "version": "1.1.0",
        "websiteUrl": "https://fundopshq.com/developers"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "FundOpsHQ (fundopshq.com) is a free daily news site on private markets for GPs, LPs, and fund service providers.\nThese tools read its public tables: private fund closes reported in the news and each fund's stages, the firms in\nthem, US public pensions' asset allocations from their own documents, news said on podcasts and shows (Heard on),\nthe week's new rows, the public change log of rows added, corrected and verified, the North American private\nmarkets events calendar (every date checked at the organizer), and its stories. Read-only. Every answer includes\n\"Source: FundOpsHQ, fundopshq.com/data, CC BY 4.0\" and, per row, the FundOpsHQ page (fundopshq_url) and the report or document it came from\n(source_url), for citing. Sizes are as the linked reports state them, in USD millions; a figure converted from\nanother currency is marked ≈. Free to use under CC BY 4.0 with credit and a link to the FundOpsHQ page.",
      "tools": [
        {
          "name": "compare_vendors",
          "title": "Compare fund software vendors",
          "description": "Two to 4 FundOpsHQ Tech vendors' sourced facts side by side, A to Z, with the categories they share. No winner and no score: every fact carries its source_url and the day it was checked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "vendors": {
                "description": "Vendor names, slugs or FundOpsHQ addresses, e.g. [\"Affinity\", \"DealCloud\"].",
                "items": {
                  "maxLength": 300,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["vendors"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare fund software vendors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e39cc117b16c39b25a1b5a32b948521f0353a4bd256ab865e74c01501439b859"
        },
        {
          "name": "data_changes",
          "title": "The data change log",
          "description": "FundOpsHQ's public change log for the last 30 days: rows added, updated (LP allocations), corrected, removed and verified against their source, each with the reason and the source, newest first; plus the \"time to row\" (median days from a report's publication to its row) and counts. Filter by kind, table and date.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date_from": {
                "description": "Changes on or after this date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "kind": {
                "description": "added, updated, corrected, removed or verified.",
                "enum": ["added", "updated", "corrected", "removed", "verified"],
                "type": "string"
              },
              "limit": {
                "description": "How many rows to return, 1 to 50 (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "table": {
                "description": "A table: \"Fund closes\", \"LP allocations\", \"Deals\", \"People moves\", \"News\".",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "The data change log"
