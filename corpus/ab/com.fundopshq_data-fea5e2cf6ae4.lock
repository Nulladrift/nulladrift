        {
          "name": "search_vendors",
          "title": "Search fund software vendors",
          "description": "Search FundOpsHQ Tech, a directory of software used across private markets and hedge funds (no fund administrators): private equity CRM, portfolio monitoring software, fund accounting software, investor and LP portals, virtual data rooms (VDR), hedge fund OMS and EMS, compliance, ESG, AI tools and more. Words are matched as words, wherever a word starts, across names, products, categories, named clients, integrations, owners, security certificates (SOC 2, ISO 27001) and asset classes; filler such as \"software\", \"best\" or \"for\" is ignored, and acronyms (OMS, VDR, LP, CRM) are read. Filter by category (key, page slug or title), buyer, asset class, region and \"works with\" (an integration such as Salesforce). With words, rows come in order of where the words were found, A to Z within each; without, A to Z. Page with offset. Nothing found answers did_you_mean, a known-not-listed reason, or a removed listing, never a bare zero. Never ranked by merit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "asset_class": {
                "description": "An asset class or strategy the vendor states, e.g. \"private credit\" or \"real estate\".",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "buyer": {
                "description": "Who the vendor says it sells to: GP, LP, Service provider or Wealth.",
                "enum": ["GP", "LP", "Service provider", "Wealth"],
                "type": "string"
              },
              "category": {
                "description": "A FundOpsHQ Tech category by key (crm, fund-accounting, investor-portals, data-rooms), page slug (private-equity-crm, portfolio-monitoring-software) or title (Private Equity CRM Software).",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "How many rows to return, 1 to 50 (default 10); more is read as 50.",
                "type": "number"
              },
              "offset": {
                "description": "Rows to skip, for the next page (the answer gives next_offset).",
                "type": "number"
              },
              "query": {
                "description": "Words, as a person would type them: \"private equity crm\", \"hedge fund oms\", \"LP portal\", \"soc 2\", \"fund accounting private credit\", or a name (\"DealCloud\").",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "region": {
                "description": "A region the vendor states: North America, Europe, Asia-Pacific, Middle East, Latin America, Africa.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "works_with": {
                "description": "An integration the vendor or the other side states, e.g. \"Salesforce\", \"Excel\", \"DealCloud\".",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
