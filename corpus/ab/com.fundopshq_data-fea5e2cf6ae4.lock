          "description": "Upcoming private markets conferences, forums and networking events in North America from the FundOpsHQ events calendar (in person and hybrid; every date checked at the organizer), soonest first. Filter by city, topic and date window. Returns up to 50 events with dates, place, organizer, cost where checked, the organizer's page and the FundOpsHQ event page.",
