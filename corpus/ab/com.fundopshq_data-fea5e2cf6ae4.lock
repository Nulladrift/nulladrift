        {
          "name": "search_fund_closes",
          "title": "Search private fund closes",
          "description": "Search FundOpsHQ's table of private fund closes (first, interim and final) reported in the news. Filter by asset class, date range, minimum size in USD millions, firm or fund name words, and stage. Returns up to 50 rows, newest first (or largest first with sort=\"size\"), each with firm, fund, size, stage, date, the source report and the FundOpsHQ story URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "asset_class": {
                "description": "Asset class: PE (private equity), VC (venture and growth), credit, real_estate, infrastructure, secondaries, gp_stakes.",
                "enum": ["PE", "VC", "credit", "real_estate", "infrastructure", "secondaries", "gp_stakes"],
                "type": "string"
              },
              "date_from": {
                "description": "Earliest report date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Latest report date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "firm": {
                "description": "Words from the firm or fund name, e.g. \"Ares\" or \"KKR Asia\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "How many rows to return, 1 to 50 (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_size_usd_m": {
                "description": "Smallest fund size to include, in USD millions (1000 = $1B). Rows with no stated size are left out when this is set.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "sort": {
                "description": "date (newest first, default) or size (largest first).",
