        {
          "name": "portfolio_funds",
          "title": "Portfolio funds look through",
          "description": "The funds of the caller team's Depot A, looked through to their constituents. Without fund_id it lists the live funds, the weakest fund first, each with its ISIN or LEI, the as of date the fund's manager states, how many lines resolved to a company, the weight per standing and the weakest standing. With fund_id it returns that fund's constituents weakest first, each with line, isin, lei, the name in the file (never used to match), weight in percent, resolution (resolved, conflict, ambiguous or unresolved, from the GLEIF and ANNA ISIN to LEI map, ESMA and FCA FIRDS or the stated LEI) with its reason, basis and cited evidence, the matched company, and its standing, which is the credit status in the team's book (red, amber, insufficient, green, not_assessed, sole_trader), unmatched for a line not resolved (never guessed) or not_in_book. A constituent with an ISIN carries its security as the European reference data list it (kind, maturity, type of interest with a stated rate or index, guarantee, seniority and redemption, with the records that list it), null when no record is held for it. No register leads. A fact on which the statements differ is null and listed under differs with every statement and with between. Where between is registers, two registers state two values, so say that the registers differ. Where it is code_and_field, a classification code contradicts a stated field, so say that the code and the stated value differ and never that the registers do. Never pick a side. A security without a fixed maturity carries no_fixed_maturity true and no maturity date. A matched constituent carries the company's LEI and class. An in book constituent carries its score, top signals and newest daily press tone reading. Weakest first is red, amber, unmatched, insufficient, the honesty states and green last, the more negative press tone first within a standing, then the larger weight. Lines page with limit and offset. A fund outside the team answers