        {
          "name": "social_sentiment",
          "title": "Social media sentiment of the monitored names",
          "description": "What public posts on social platforms say about the names the workspace monitors, the one list of Monitoring (companies, organisations, brands, persons and topics), searched once a day on X, LinkedIn, TikTok, Instagram, YouTube, Reddit and Threads and labelled by our reader. Every answer carries source.enabled; while it is false no search source is switched on and nothing current is read, and paused_until, set while the workspace's updates are paused until that day. Without target_id it lists the names in name order, each with its newest reading of a day read in full, or latest null while none is stored; node_id keeps the names matched to one company or person. With target_id it returns that name's daily readings, newest first (days, default 30), and its newest 100 posts of the last 30 days, each with its item_key, platform, url (null with link_withheld true when every form of the link would name a person), published_at, language, the reader's sentiment label, the matched_word and source_kind (organisation, media or person). A post the reader found to be about something else is never listed. A reading counts the posts of its 30 day window by platform and by sentiment; its state is reading (sentiment_net is positive minus negative over the rated posts, from -1 to +1), too_little_coverage or feed_gap. No author, handle, title or post text is ever kept. A person's reading is context for the bank's own diligence, never a score, rating or ranking of the person. A sole trader's name (held sole_trader) is never searched and carries no reading and no post; held not_read marks a name the daily search does not read yet. Each name carries days, its posts per day over the 30 days of its reading, oldest first, each day with read, positive, negative, neutral and unrated, and one name's answer adds platforms, the same day counts per platform. No reading is ever part of the risk score. A name outside the workspace's list answers 404.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Daily readings to return with target_id, default 30.",
