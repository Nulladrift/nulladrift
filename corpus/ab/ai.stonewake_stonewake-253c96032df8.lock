        {
          "name": "alert_deliveries",
          "title": "Alert deliveries",
          "description": "The delivery status of the workspace's alerts, newest first. Every attempt has a claim row (queued, or held_budget or held_quiet when it was not sent, digest when the fact arrived too old for an immediate alert) and an outcome row (sent or failed with its error_class). A delivered row means the receiver confirmed it (a signed webhook, or the SMS provider's final report), undelivered is the SMS provider's final negative report, and a dead_letter row closes an endpoint delivery whose failure is permanent or whose every retry is spent. Rows name the alert event by event_id and an endpoint by endpoint_id; a user's identity is not served. A key reads the deliveries of its own team's alerts and of workspace wide ones. Filter by event_id, status or channel. Paged with limit and offset; the response carries the exact total.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "Only rows on this channel.",
                "enum": ["email", "sms", "teams", "webhook", "in_app"],
                "type": "string"
              },
              "event_id": {
                "description": "Only the deliveries of this alert event.",
                "maximum": 9223372036854776000,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Page size, default 50, maximum 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Rows to skip, default 0.",
                "maximum": 9223372036854776000,
                "minimum": 0,
                "type": "integer"
              },
              "status": {
                "description": "Only rows with this status.",
                "enum": ["queued", "sent", "delivered", "failed", "held_budget", "held_quiet", "collapsed", "digest", "undelivered", "dead_letter"],
                "type": "string"
              }
            },
            "type": "object"
