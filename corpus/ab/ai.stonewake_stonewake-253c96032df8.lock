        {
          "name": "country_profile",
          "title": "Country profile",
          "description": "Country intelligence for export finance. Without iso3 this returns the index of covered countries with each one's risk score and the caller team's live deal rollup. With iso3 (a three letter ISO 3166-1 alpha-3 code such as TUR) it returns one country in depth: the risk score with its cited component breakdown and, as gaps, each component it is computed without and why, indicator values, membership lists with legal citations, reference events, and the team's deals there. The deal fields are filled only for a workspace with the deals module; without it they read zero and empty, which says nothing about deals in that country, so never report them as no deals. Indicator and dataset entries carry attribution fields such as attribution_text stating the data licence terms; preserve that attribution whenever values are quoted onward. The index holds more countries than one answer's output cap, so it serves its first countries whole and names in output_cap their number in countries_served and the next_offset to read on from; offset then serves the index from that country on and names it in countries_offset.",
