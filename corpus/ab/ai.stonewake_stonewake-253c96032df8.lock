        {
          "name": "deal_book",
          "title": "Deal book",
          "description": "The deal book of the one team the caller's key reads; every row names that team (team_id, team_name). Without deal_id this lists deals ordered by their ranking window first (financing open, early stage, not confirmed, financing set, cancelled) and the score inside it unless sort names one column, filterable by stage, window, country_code (ISO 3166-1 alpha-3 codes in upper case, such as DEU), region (the desk region of the deal's country), sector, status, eca, eca_named (only deals naming an export credit agency), minimum contract value (min_value_usd, a finite number), free text (q) and team (one team you read by its id, or all; a key reads its own team); every closed value is case exact and an unknown one is refused with the allowed values; sort is priority (the default, the window order above) or one column that orders the whole filtered book, score, value (the USD value), last_activity, stage (the pipeline order), name or first_seen, with direction desc (the default) or asc and rows without a value last, or latest_update, which ignores the window and orders by the newest dated event, rows without one last, desc only; paged with limit (default 50, maximum 100) and offset, with the exact total. Dismissed deals are excluded unless status asks for them, and the portfolio rows a desk holds back by default (financing set, cancelled, older than the stale window of 12 months by default, no movement within the movement hold, own bank, domestic, below the value floor, a market outside the mandate where the rubric holds such rows; score_hidden true) are off the page unless include_hidden is true, stale_months and movement_months naming the two age rules in months, outside_markets_held true where a market outside the mandate holds a row back, and score_own_bank marks the rows where your own bank is a lender. A row carrying merged_into was found to be a duplicate and folded into the deal that field names: read that deal instead, and expect this one to be dismissed. from_pool marks a deal of the shared deal pool, whose facts and research Stonewake keeps once for every workspace while its status and dismissal are your team's own, and dismissed_in_pool one Stonewake dismissed in the pool (merged into another deal, or set aside, for example as historical), which reads dismissed in every workspace and can be neither reopened nor followed, so neither it nor a merged row lists a reopen_suggested event. Your team's status, dismissal and next step on a merged row carry to the deal it was merged into. Each row carries its window (score_window and its label), the band word and reason count behind its score (score_band, score_reason_count), the confirmed state over its linked findings (state, state_label), the newest quote backed event date (event_date, null when no source stated one), the lender names on the deal (lenders), and the two derived sentences a desk reads first: angle (why the row is on the list) and ask (what is still to be financed, read from the confirmed state, the window, the agencies and the lenders; a row whose state no source confirmed reads State not confirmed by a source yet), latest_update (the newest event a source dated and confirmed, with its date, a short label naming the confirmed state and the amount only where a quote states it, the state and the finding_id it rests on, null when there is none) and has_unseen_update (true when that event reached the deal after your last open of it in the dashboard, null for an API key, which records no opens). With deal_id (the deal_id field of list rows) it returns one deal in full, with score_reasons, one plain sentence per scoring component saying which fact it matched, alongside parties carrying entity_id and node_id where bound, the cited timeline with press quotes (timeline_limit entries, default 50, at most 200, each also carrying the state its quote confirmed, the confirming passage and the event date), lifecycle events, sources each carrying source_tier (1 a primary source, 2 trade press, 3 an aggregator, which is also where an unclassified publisher lands) and its tier_label, and reliability with reliability_label where a public authority names the outlet as part of a disinformation network (shown, never counted toward confirmation; a deal cites only pages naming its project or a party), the deal summary (summary_lines, three lines generated from the cited findings by fixed rules, not by a model, each with the finding and quote behind every field it states), the briefing (null, or text, drafted_at, drafted_by, which reads model, and sources, a quick summary an AI model drafts from the text of the deal's cited sources with those sources listed by source_id, url, publisher and published_at, its numbers written in digits and its names checked against that text, null until it is drafted, whenever no sentence passes its check, and when nothing is left once a clause asking the reader to confirm, verify, check or review anything is removed), the analyst's own next_action, and economics.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country_code": {
                "description": "Keep only deals in these countries, each an ISO 3166-1 alpha-3 code in upper case, such as DEU (two letter codes are refused).",
                "items": {
