        {
          "name": "company_events",
          "title": "Company events",
          "description": "The register event feed of one company: filings, status changes, and other register happenings, grouped into display rows and ordered by significance tier, each row citing its evidencing record where one exists. Takes node_id, the graph node id from search_companies hits. Related events arrive folded into one rollup row with a member_count and a group_key; pass that group_key as group to expand one rollup into its member events. A citation whose notice is set carries a text to show with the record; keep that notice with the record wherever it is quoted onward. For a company with a German register entry, insolvency_lookup states when your workspace last looked its German insolvency notices up (the portal allows single company lookups only, so they are only as complete as that lookup). Its state is pending while a lookup is queued (a company a person opened in the dashboard is looked up within minutes), then current with the date of the lookup; not_requested, with no timestamp, for a company no person of your workspace opened in the dashboard, screened, put into a dossier or holds in the portfolio, since reading this tool never asks for a lookup; and not_looked_up, with no timestamp, in any workspace where the lookups are not switched on. Show its note beside the feed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "group": {
                "description": "A group_key from a previous response; expands that one rollup into its member events.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "node_id": {
                "description": "The graph node id, as returned by search_companies hits. Not the entity_id of company_profile.",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
