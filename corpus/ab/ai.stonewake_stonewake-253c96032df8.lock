        {
          "name": "portfolio_groups",
          "title": "Portfolio holdings by group",
          "description": "What the caller team holds of each group, added up. Without group_id it lists the groups the team holds something of, the weakest group first, each with the company at its top, the positions the team's depots hold of the group, each fund that holds a line of it with its lines and the sum of their weights in percent of that fund, the group's companies in the team's book, of which those no position and no fund line names, the weakest standing among them, and under bases how the groups of its companies were found. With group_id, the node id of the company at the top, it returns that group's companies the team holds, weakest first, each with its LEI and class, how its group was found, its standing in the team's book and the positions and fund lines that name it. A group is the ultimate parent the public consolidation records of the LEI system name for a company, else the top of its chain of direct parents, else the company itself. A branch belongs to its head office's group and reads head_office. Where the records state a parent they do not name, in a company's own record or in one above it, the basis is parent_not_named, and a group whose bases hold parent_not_named cannot be added up completely here, so say that with its sums. Where the records name two parents, the walk stops at the last company they agree on (parents_disagree), where they lead back to where they started the company stands alone (parents_loop), and so does a company whose chain of parents is longer than any on record (chain_cut). It is what the records state, never a bank's own determination of connected clients. No amount is held or served. Groups and companies page with limit and offset. A group the team holds nothing of answers 404. Read only.",
