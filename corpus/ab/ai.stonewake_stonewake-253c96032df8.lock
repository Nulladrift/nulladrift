        {
          "name": "audit_log_export",
          "title": "Audit log export",
          "description": "The workspace's own audit log for a window of days: every recorded action with its time (UTC), action name, actor, the team it acted in, target, run, the model that served its model calls (several joined by +, unknown when that cannot be shown, never the planned model) and details, each an id, a count, a code or a time, in ledger order, including sign ins, single sign on provisioning and role changes, and member removals. Takes from and to as YYYY-MM-DD, both days included, at most 3653 days. Needs an API key a workspace administrator issued with the audit scope; any other key answers forbidden. The export itself is recorded in the audit log. Large windows are cut at the output cap, so ask for shorter windows.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "First day, YYYY-MM-DD (UTC).",
                "format": "date",
                "type": "string"
              },
              "to": {
                "description": "Last day, YYYY-MM-DD (UTC), included.",
                "format": "date",
                "type": "string"
