        {
          "name": "portfolio_fund_import_preview",
          "title": "Portfolio fund import preview",
          "description": "Preview importing funds into the caller team's Depot A. Pass the fund file as CSV text whose header is fund_isin,fund_lei,fund_name,as_of,isin,lei,name,weight (as_of, weight, fund_isin or fund_lei, and isin, lei or name are needed); at most 2,000 rows. Each line names its fund by the fund's ISIN or LEI, the constituent by ISIN, LEI or name, its weight in percent and the as of date (YYYY-MM-DD or DD.MM.YYYY). Every line is matched by the holdings resolver and answers its status, reason, the matched company with its LEI and class, the security as the European reference data list it, and what the import would do in the team's book (add, reactivate, in_book, duplicate); a name is never used to match. Every fund answers new, replaces, unchanged or invalid; a fund with one unreadable line is invalid whole. Lines page with limit and offset in file order; funds, counts and total cover the whole file. Nothing is written, and applying an import happens in the Stonewake dashboard.",
