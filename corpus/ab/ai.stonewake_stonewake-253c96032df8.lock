          "description": "Where to download the documents of one subject, for filing them into a document library such as SharePoint. A deal (the id deal_book serves) has its deal report, committee pack and committee deck, a counterparty (the registry id company_profile speaks) its counterparty report and pack, a company (a graph node id from search_companies) its company profile and, held by your team, its credit monitoring deck. The decks are pptx slides. The tool first reads the subject, so an id the key cannot read answers not found, then returns each document's /v1 path. The documents are fetched with the same key, which needs the reports scope. No document is generated by this call.",
