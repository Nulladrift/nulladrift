          "title": "Company financing",
          "description": "The debt surface of one company: registered charges with status lines and bound lenders, listed debt instruments, filed debt position facts, derived aggregates, a maturity wall, and per section coverage states saying how complete each section is. Takes node_id, the graph node id from search_companies hits. Long instrument books fold into the maturity wall; pass bucket (within_12m, 1_to_2y, 2_to_5y, beyond_5y, no_fixed_maturity or no_maturity) to expand one maturity slice. An instrument without a fixed maturity carries no_fixed_maturity true and no maturity date. Pass include_matured true to also list matured and delisted ones; coverage names an unstated debt half.",
