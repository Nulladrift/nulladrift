        {
          "name": "portfolio_securities",
          "title": "Portfolio own securities by depot",
          "description": "The securities the caller team's bank holds on its own account, its Depot A, by depot. Without depot_id it lists the live depots, the weakest depot first, each with the label the bank gave it, the day its positions are stated for, how many positions resolved to an issuer, the positions per standing and the weakest standing. With depot_id it returns that depot's positions weakest first, one line per position, with isin or lei, the name in the file (never used to match), resolution (resolved, conflict, ambiguous or unresolved, from the GLEIF and ANNA ISIN to LEI map, ESMA and FCA FIRDS or the stated LEI) with its reason, basis and cited evidence, the issuer, and its standing, which is the issuer's credit status in the team's book (red, amber, insufficient, green, not_assessed, sole_trader), unmatched for a line not resolved (never guessed) or not_in_book. A position with an ISIN carries its security as the European reference data list it (kind, maturity, type of interest with a stated rate or index, guarantee, seniority and redemption, with the records that list it), null when no record is held for it. No register leads. A fact on which the statements differ is null and listed under differs with every statement and with between. Where between is registers, two registers state two values, so say that the registers differ. Where it is code_and_field, a classification code contradicts a stated field, so say that the code and the stated value differ and never that the registers do. Never pick a side. A security without a fixed maturity carries no_fixed_maturity true and no maturity date. A matched position carries its issuer's LEI and class. An in book position carries its issuer's score, top signals and newest daily press tone reading. Two positions of one issuer are two lines. No amount and no valuation is held or served. Weakest first is red, amber, unmatched, insufficient, the honesty states and green last, the more negative press tone first 