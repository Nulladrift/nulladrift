        {
          "name": "company_overview",
          "title": "Company overview",
          "description": "One company the way the dashboard's Network view shows it, by node_id, the graph node id carried by search_companies hits (not the entity_id of company_profile). Answers the register identity, what the register records held for the company state (GLEIF, Companies House, a German register extract where one was read, SEC EDGAR, the Swiss gazette and the Marktstammdatenregister operator) in plain words, each fact with the record it cites and when that record was last confirmed, and the risk status. risk_state is portfolio when your team holds the company (risk then carries its portfolio assessment, as entity_risk_profile returns it), assessed when an assessment was made on the spot for your team, in_progress while one is being made, not_assessed with risk_reason allowance, failed or not_started, or sole_trader when the register states a natural person's business, which is never scored (risk then carries sole_trader true and no assessment). list_entry is set only for a German company known from the OffeneRegister.de list of 2017 to 2019 and not read from the register yet: its sentence says so, and its source line is the list's attribution; it is never a register fact. A tool call reads only and never starts an assessment. Pass locale de for the whole answer in German, the risk block included; codes stay as served. german_register is null unless the register number another source gave for the company belongs to another company's register sheet. It then carries state other_sheet and a note that says so, and the company's own German register entry has not been read.",
