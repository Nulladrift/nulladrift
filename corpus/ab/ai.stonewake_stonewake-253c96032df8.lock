        {
          "name": "tender_matches",
          "title": "Tender matches",
          "description": "The public procurement notices the caller team's tender profiles matched, newest first, one row per procedure citing its newest matching notice. Each match explains every criterion its profile sets (CPV code, NUTS region, value band in EUR, keyword, procedure type, buyer legal type, notice kind, days to the tender deadline) with the outcome hit, the notice field it read, what the notice states there and what the profile asks, and carries the notice itself with its source_url and record_id as the citation. A notice is a match only when it hits every criterion its profile sets, so an unknown is never a match. Each match names its notice kind in kind_label and where it stands in state, open for a call for tenders whose deadline has not passed, expired once it has, awarded for an award, direct award, contract change or completion, planned for prior information, other, dismissed or in_deal_book. An award lists in winners the companies its award is bound to; a winner identifier is never shown, and a buyer whose legal type may name a natural person is withheld (buyer_withheld). Pass view open for the open calls only (the fewest days left first), awards for the awards and other notices, expired, dismissed or in_deal_book. Filter also by status (new, dismissed or in_deal_book) or profile_id, page with limit and offset, or pass match_id alone to read one match. A match outside the caller team answers not_found. A match can also cite a notice of the team's own portal lane (portal_notice, an export the bank uploaded or an alert of one of its portal accounts), chosen by a profile or by the portal's own saved search (decided_by portal_search). Pass deal_id, paged with limit and offset, for the matches an analyst took into that deal of the Deal Book (status in_deal_book), where the notice is cited on the deal. deadline_passed is true once the cited notice's tender deadline lies before today on the buyer's calendar (Europe/Berlin); the deadline day itself is still open, and the status stays as it is.",
