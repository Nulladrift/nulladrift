      "serverInfo": {
        "name": "MCP Heartbeat",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "These figures are automated measurements with timestamps. They are not a review, rating, grade, or recommendation. Read-only tools: search_servers, get_server, find_tools, list_categories, check_status. Each result includes measured timestamps and a page URL. Limit 25. 60 calls per minute per hashed IP. No account.",
      "tools": [
        {
          "name": "check_status",
          "title": "Check status",
          "description": "Return the latest probe outcome for one server, with the measured timestamp and the server page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Server id or a unique fragment of the id or title.",
                "pattern": "\\S",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7453bfa1e3bd707b69489e7cfb5d6b9898b83af357215c6a0e48af5fe75a4d59"
        },
        {
          "name": "find_tools",
          "title": "Find tools",
          "description": "Find servers whose measured tools match a capability. Results are grouped by server and include page URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "capability": {
                "description": "Words matched against tool name and description.",
                "pattern": "\\S",
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["capability"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1f8d51b87a2e42e761a26ad960a753b285c22db5d5d0f1d322cd03fca073815f"
        },
        {
          "name": "get_server",
          "title": "Get server",
          "description": "Return one server's metadata, status, latency p50 and p95, checks, and tool list, with measured timestamps and the server page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Server id, for example com.example/weather.",
                "pattern": "\\S",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get server"
          },
          "behavior": {
            "destructive": false,
