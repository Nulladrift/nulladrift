        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List industry and function categories and how many servers are in each.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
