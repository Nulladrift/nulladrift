{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpheartbeat/mcp-heartbeat": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcpheartbeat.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "MCP Heartbeat",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "These figures are automated measurements with timestamps. They are not a review, rating, grade, or recommendation. Read-only tools: search_servers, get_server, find_tools, list_categories, check_status. Each result includes measured timestamps and a page URL. Limit 25. 60 calls per minute per hashed IP. No account.",
      "tools": [
        {
          "name": "check_status",
          "title": "Check status",
          "description": "Return the latest probe outcome, the observed check cadence from the last 7 days, and the server page URL. The cadence is null until 3 probes are stored. An overdue server has no promised next check.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Server id or a unique fragment of the id or title.",
                "pattern": "\\S",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9045b43754626f751d96c7967ed20aa5b25590e2b8d3cf9fc5cbf6ae10157750"
        },
        {
          "name": "find_tools",
          "title": "Find tools",
          "description": "Find servers whose measured tools match a capability. Results are grouped by server and include page URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "capability": {
                "description": "Words matched against tool name and description.",
                "pattern": "\\S",
                "type": "string"
              },
              "limit": {
                "description": "Maximum matching tools to return. Integer from 1 to 25; default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["capability"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb1b869529da36939a5124225c9a1cfc9228fccf5d336a861e3203cb8a7e3253"
        },
        {
          "name": "get_server",
          "title": "Get server",
          "description": "Return one server's metadata, status, latency, checks, and tool list. check_cadence is the median gap between probes over 7 days ('checked about every 6 hr'), or null when fewer than 3 probes were stored. next_check_at is omitted when that sample is missing or the server is overdue.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Server id, for example com.example/weather.",
                "pattern": "\\S",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get server"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bc75fafe24e4beafdc940e4c57179aa25f3ab2b436dc3ae404080711dde6e85a"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List industry and function categories and how many servers are in each.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8791cde5dc837e51dd87de3a8adc0cdcb0853e4d4f0908d7510edf57adbd3fd8"
        },
        {
          "name": "search_servers",
          "title": "Search servers",
          "description": "Search the server directory. Results include measured timestamps and the server page URL. Ranked by checks passed. These are automated measurements, not a rating.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "function": {
                "description": "Function slug, for example data-access.",
                "type": "string"
              },
              "industry": {
                "description": "Industry slug, for example finance-crypto.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum servers to return. Integer from 1 to 25; default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words matched against server id, title, description, and publisher name.",
                "type": "string"
              },
              "status": {
                "description": "Latest probe status.",
                "enum": ["up", "auth", "down", "unchecked"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search servers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:46be8c980b256621bf6053f5f0952b897cc3c7e28a8666306ae30edc2de9f4c0"
        }
      ],
      "digest": "sha256:28e219e82ebab5b4cf3a5750e9794a9836df178c48c95f10df20ad3b6dbfc2db"
    }
  }
}
