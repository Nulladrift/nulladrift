        {
          "name": "get_result",
          "title": "Read a result",
          "description": "Reads a backtest result by its run_id (when run_backtest answered \"running\", call this until the run ends), or a study's runs by study_id (one of them with version). A run comes with its trades, a page at a time (trades_page).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "before_version": {
                "anyOf": [
                  {
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "pattern": "^[vV]?\\d+$",
                    "type": "string"
                  }
                ],
                "description": "With study_id: the 20 runs before this version (a list's `next` gives it)."
              },
              "run_id": {
                "description": "A run_id run_backtest or run_held_out_test returned.",
                "type": "string"
              },
              "study_id": {
                "description": "A study's id, for its runs (the newest 20 by default); with `version`, one of them.",
                "type": "string"
              },
              "trades_page": {
                "description": "With a run (run_id, or study_id with version): the page of its trade list, from 1; a page holds 100 trades. Left out: the first.",
                "minimum": 1,
                "type": "integer"
              },
              "version": {
                "anyOf": [
                  {
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "pattern": "^[vV]?\\d+$",
                    "type": "string"
