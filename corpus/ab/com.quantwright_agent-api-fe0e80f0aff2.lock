        {
          "name": "create_study",
          "title": "Start a study",
          "description": "Opens a study, the named set of runs every backtest belongs to: call it once per question, before run_backtest. Can set a hold-out period, once and only here, that no run tests except run_held_out_test. Only the first held-out test per account and market counts, and any earlier run on the market (in any study, at any bar size) that read its days disqualifies it: set the hold-out in your first study on a market, before any run on it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hold_out": {
                "additionalProperties": false,
                "description": "The days kept back from every run but run_held_out_test; set once, here. Set it in your first study on a market, before any run on it: a held-out test on days an earlier run on the market read does not count.",
                "properties": {
                  "from": {
                    "description": "A day, YYYY-MM-DD.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "to": {
                    "description": "A day, YYYY-MM-DD.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["from"],
                "type": "object"
              },
              "name": {
                "description": "What the study tests, in a few words.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
