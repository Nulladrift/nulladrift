      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Backtests a trading rule or strategy on historical prices: US stocks and ETFs, FX, spot gold and silver, and spot crypto. The server holds the price history and runs the backtest on it.\n\nFlow: describe_data, create_study, run_backtest, get_result; run_held_out_test once, at the end. You write the strategy as one backtesting.py Strategy class; the server runs it in a sandbox and returns summary figures and the run's trades (when each entered and left, which exit ended it, its side, win or loss), never prices or bars.\n\ndescribe_data lists the markets, bar sizes, default costs and rules, and how to write the code. create_study can set a hold-out period that only run_held_out_test uses: set it in your first study on a market, before any run on it, as a held-out test on days an earlier run read does not count. run_backtest takes one symbol and one bar size per run; it waits up to 90 s, then answers \"running\" with a run_id for get_result. Run the held-out test once, on the run you would keep: only the first per account and market counts, and a hold-out with too few trades for a result to show figures spends it all the same (each development run says how many it is expected to hold: hold_out_estimate). To check which of a trader's own trades a run's rule would have taken, and why not, use compare_trades with the run and their trades.\n\nLimits: results are summary figures and a trade list (no prices, bars or charts); a run reads one symbol; a day takes at most 40 runs per symbol and 150 runs and 50 studies in all (the count resets at 00:00 UTC).",
      "tools": [
        {
          "name": "compare_trades",
          "title": "Check my own trades",
          "description": "Checks a trader's own trades against a run's rule, on the price history this server holds: for each trade, in their order, whether the rule would have taken it and, if not, why (already in a trade, no entry signal that day, no bar that day). Use it when the trader lists trades they made and asks which the rule took. Takes a run (run_id) and the trades, each {side, entry, exit?}; answers in words, never prices. It re-runs the run's code, so it counts as a run on the run's symbol.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "run_id": {
                "description": "A run_id run_backtest or run_held_out_test returned: the run whose code is checked against the trades.",
                "type": "string"
              },
              "study_id": {
                "description": "A study's id; with `version`, one of its runs.",
                "type": "string"
              },
              "time_zone": {
                "description": "The clock the trader says their times are on (\"UTC+2\", \"New York\", \"Europe/Prague\"). Left out: the clock the run's trade list is on (ET for stocks and ETFs, UTC otherwise).",
                "type": "string"
              },
              "trades": {
                "description": "The trader's own trades, in their order, each stamp exactly as the trader wrote it.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "entry": {
                      "description": "When they entered: \"YYYY-MM-DD\", or \"YYYY-MM-DD HH:MM\" on the clock they wrote.",
                      "type": "string"
                    },
                    "exit": {
                      "description": "When they exited, the same way. Left out when they gave none.",
                      "type": "string"
                    },
                    "side": {
                      "enum": ["long", "short"],
                      "type": "string"
                    }
                  },
                  "required": ["entry", "side"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "version": {
                "anyOf": [
                  {
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "pattern": "^[vV]?\\d+$",
                    "type": "string"
                  }
                ]
              }
            },
            "required": ["trades"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "clock": {
                "description": "On bars shorter than a day: the clock every time of the answer is on (your time_zone as you stated it, else ET for stocks and ETFs, UTC otherwise).",
                "type": "string"
              },
              "counts": {
                "additionalProperties": false,
                "properties": {
                  "not_compared": {
                    "type": "integer"
                  },
                  "not_taken": {
                    "type": "integer"
                  },
                  "taken": {
                    "type": "integer"
                  }
                },
                "required": ["not_compared", "not_taken", "taken"],
                "type": "object"
              },
              "market": {
                "additionalProperties": false,
                "properties": {
                  "symbol": {
                    "type": "string"
                  },
                  "timeframe": {
                    "type": "string"
                  }
                },
                "required": ["symbol", "timeframe"],
                "type": "object"
              },
              "message": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "run_id": {
                "type": "string"
              },
              "runs_left_today": {
                "additionalProperties": false,
                "properties": {
                  "left": {
                    "type": "integer"
                  },
                  "per_day": {
                    "type": "integer"
                  },
                  "symbol": {
                    "type": "string"
                  }
                },
                "required": ["left", "per_day", "symbol"],
                "type": "object"
              },
              "status": {
                "enum": ["compared", "invalid_arguments", "not_found", "refused", "error"],
                "type": "string"
              },
              "study_id": {
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
