        {
          "name": "run_backtest",
          "title": "Backtest a strategy",
          "description": "Backtests a trading rule on this server's price history: one backtesting.py Strategy class, one symbol, one bar size, in a study. Use it to test, backtest or evaluate a trading rule or strategy. Returns summary figures (return, drawdown, Sharpe, win rate, trades, a grade, whether it beat buy-and-hold) and the run's trades (when each entered and left, which exit ended it, its side, win or loss), never prices or bars; a figure may be withheld, with the reason. Waits up to 90 s, then answers status \"running\" with a run_id for get_result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_usd": {
                "description": "The starting account, in US dollars.",
                "type": "number"
              },
              "code": {
                "description": "One backtesting.py Strategy class (describe_data has the rules).",
                "maxLength": 50000,
                "type": "string"
              },
              "costs": {
                "description": "The costs: two fractions of the trade value, or a list of costs each in its own unit.",
                "oneOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "commission": {
                        "description": "A fraction of the trade value at entry (0.0005 is 0.05%), charged once per round trip.",
                        "maximum": 0.05,
                        "minimum": 0,
                        "type": "number"
                      },
                      "slippage": {
                        "description": "A fraction of the trade value per fill (entry and exit).",
                        "maximum": 0.05,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": [],
                    "type": "object"
                  },
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "amount": {
                          "description": "The figure in `unit` (0.005 usd_per_share is half a cent a share; 0.1 percent is 0.1%).",
                          "minimum": 0,
                          "type": "number"
                        },
                        "basis": {
                          "description": "per_side: on each fill; round_trip: once for the entry and exit together.",
                          "enum": ["per_side", "round_trip"],
                          "type": "string"
                        },
                        "side": {
                          "enum": ["commission", "slippage", "spread"],
                          "type": "string"
                        },
                        "unit": {
                          "description": "usd_per_share on stocks and ETFs; usd_per_ounce on spot gold and silver; pips on currency pairs; percent, bps and usd_per_order (a flat fee per order, such as a broker's fee per order or per lot) on any market.",
                          "enum": ["percent", "bps", "usd_per_share", "usd_per_ounce", "pips", "usd_per_order"],
                          "type": "string"
                        }
                      },
                      "required": ["amount", "basis", "side", "unit"],
                      "type": "object"
                    },
                    "maxItems": 6,
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "label": {
                "description": "A short text shown with the run.",
                "type": "string"
              },
              "stated_rules": {
                "description": "Rules the trades are checked against, one per kind.",
                "items": {
                  "oneOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "const": "no_overnight",
                          "type": "string"
                        }
                      },
                      "required": ["kind"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "const": "flat_by",
                          "type": "string"
                        },
                        "time": {
                          "description": "\"HH:MM\", 24-hour.",
                          "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                          "type": "string"
                        },
                        "tz": {
                          "description": "An IANA time zone (\"America/New_York\"); none is New York.",
                          "type": "string"
                        }
                      },
                      "required": ["kind", "time"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "from": {
                          "description": "\"HH:MM\", 24-hour.",
                          "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                          "type": "string"
                        },
                        "kind": {
                          "const": "session",
                          "type": "string"
                        },
                        "to": {
                          "description": "\"HH:MM\", 24-hour.",
                          "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                          "type": "string"
                        },
                        "tz": {
                          "description": "An IANA time zone (\"America/New_York\"); none is New York.",
                          "type": "string"
                        }
                      },
                      "required": ["from", "kind", "to"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "const": "max_trades_per_day",
                          "type": "string"
                        },
                        "n": {
                          "maximum": 10,
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["kind", "n"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "const": "risk_per_trade_pct",
                          "type": "string"
                        },
                        "pct": {
                          "description": "A percent as written: 0.5 is 0.5%.",
                          "exclusiveMinimum": 0,
                          "maximum": 10,
                          "type": "number"
                        }
                      },
                      "required": ["kind", "pct"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 5,
                "type": "array"
              },
              "study_id": {
                "description": "The id create_study returned.",
                "type": "string"
              },
              "symbol": {
                "description": "One ticker (\"QQQ\", \"BTCUSD\", \"EURUSD\").",
                "type": "string"
              },
              "timeframe": {
                "enum": ["1m", "5m", "15m", "30m", "1h", "4h", "1d"],
                "type": "string"
