                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "n": {
                      "type": "integer"
                    },
                    "reason": {
                      "description": "The code for why: taken, in_trade, exit_unknown, no_bar, side_never, flat, outside_bars, other_symbol or no_time.",
                      "type": "string"
                    },
                    "rule": {
                      "enum": ["taken", "not taken", "not compared"],
                      "type": "string"
                    },
                    "trade": {
                      "type": "string"
                    },
                    "why": {
                      "type": "string"
                    }
                  },
