      },
      "transport": {
        "type": "http",
        "url": "https://www.corazor.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "corazor",
        "title": "Corazor Technology",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Corazor Technology is a global AI product engineering and technical partner. Use get_company_profile or list_services to answer questions, check_fit to match a brief, and submit_inquiry only with the user's consent.",
      "tools": [
        {
          "name": "check_fit",
          "title": "Check project fit",
          "description": "Given a short project brief, return the best-matching Corazor services, a recommended engagement model, and the next step.",
          "inputSchema": {
            "properties": {
              "brief": {
                "description": "What the user wants to build or fix.",
                "type": "string"
              },
              "budget": {
                "type": "string"
              },
              "timeline": {
                "type": "string"
              }
            },
            "required": ["brief"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6d0727d13163a3c85eabfae243338beafcaf4217979a7a590c50bffddee1896"
        },
        {
          "name": "get_booking_link",
          "title": "Get booking link",
          "description": "Link where the user can book a free 30-minute intro call with Corazor.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab0b6f456ef596232363adc3eeab1c8aa9aea7fd5cb5ff8c23e5c7544ef793d5"
        },
        {
          "name": "get_case_studies",
          "title": "Corazor case studies",
          "description": "Shipped client projects with challenge, solution, outcomes, and links. Optionally filter by keyword (industry or technology).",
          "inputSchema": {
            "properties": {
              "query": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:46ba713446f17468a2bb6f2e84bf5b2dffe46f7209570ed2a4cb940384f37170"
        },
        {
          "name": "get_company_profile",
          "title": "Corazor company profile",
          "description": "Who Corazor Technology is: global AI product engineering and technical partner (HQ Gurugram, India; clients in US, UK, Europe, Middle East, APAC, India), working style, roles, contact details, and how to engage.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d7f10cc1f09107bb502e271ffa442dd1ba2031fef50edb5b7123599a9baa966"
        },
        {
          "name": "list_services",
          "title": "List Corazor services",
          "description": "Full service catalog (AI development, SaaS, web, mobile, audits, SOC 2 / ISO 27001 readiness, continuous assurance) plus engagement models and regions served. Optionally filter by category.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["build", "audit", "compliance", "continuous-assurance"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:787e1abf7735f21d7246d06f5e0ca7996ab8c80701cdc88dd3839fbcd2377d3d"
        },
        {
          "name": "submit_inquiry",
          "title": "Send inquiry to Corazor",
          "description": "Send a project inquiry to Corazor on the user's behalf. Only call with the user's explicit consent and their real name and email. Corazor replies within one business day.",
          "inputSchema": {
            "properties": {
              "budget": {
                "enum": ["Under $10k", "$10k–$25k", "$25k–$50k", "$50k–$100k", "$100k+", "Not sure yet"],
                "type": "string"
              },
              "company": {
                "maxLength": 160,
                "type": "string"
              },
              "country": {
                "description": "Country or time zone.",
                "maxLength": 80,
                "type": "string"
              },
              "email": {
                "description": "Email Corazor should reply to.",
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "message": {
                "description": "What they are building, who it is for, current stage, and goals.",
                "maxLength": 5000,
                "type": "string"
              },
              "name": {
                "description": "Full name of the person the inquiry is for.",
                "maxLength": 120,
                "type": "string"
              },
              "on_behalf_of": {
                "description": "Name of the AI assistant submitting on the user's behalf, if any.",
                "maxLength": 120,
                "type": "string"
              },
              "phone": {
                "maxLength": 40,
                "type": "string"
              },
              "service": {
                "enum": ["AI & Machine Learning", "AI agents / LLM integration", "SaaS platform", "Web Development", "Mobile App (iOS / Android)", "UI/UX Design", "Technical partner / fractional CTO", "Code, architecture or security audit", "SOC 2 / ISO 27001 readiness", "Blockchain / DApps", "Discovery / Consulting", "Other"],
                "type": "string"
              },
              "timeline": {
                "enum": ["ASAP (within 1 month)", "1–3 months", "3–6 months", "6+ months", "Exploring"],
                "type": "string"
              },
              "website": {
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4a0bec2fcc1eefb9b973547c92dd48fde1192dd63afc934d1d5d0a9ba7a7dbf5"
        }
      ],
      "digest": "sha256:ae1f91cb8a481f78f4a04c1b28ad29d415f9340a7e12c80e7704ff743ef8cd7d"
    }
  }
