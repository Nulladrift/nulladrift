        },
        {
          "name": "enquiry_fields",
          "title": "The questions the enquiry asks",
          "description": "Every field of the Background Check Quotes enquiry: key, label, type, whether required, help text and the allowed options where there are any. Pass answers to submit_enquiry keyed by field key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e700cc8ae60ffb099451adad012ede6ec55a91a67b3a6b5af6847c841deffdd"
        },
        {
          "name": "submit_enquiry",
          "title": "Submit an ENQUIRY to human providers (two steps; not a purchase)",
          "description": "Submits an enquiry to Background Check Quotes — NOT a purchase, NOT a guaranteed quote. Step 1: call with the answers (keyed by field key from enquiry_fields) and consent=true; it validates and returns a summary, the consent line and a confirmation token — show the person the summary and the consent line. Step 2: only if the person agrees, call again with the same answers, consent=true and the confirmation token; the enquiry is then submitted, and the person receives an email with a link they must click before any provider sees it. Consent means the person has read and agreed to: \"By sending this you agree the Background Check Quotes team reads your enquiry and replies by email. We do not pass it to anyone else.\"",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "the person's answers, keyed by field key",
                "type": "object"
              },
              "confirmation": {
                "description": "the confirmation token from step 1, after the person has approved the summary",
                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: By sending this you agree the Background Check Quotes team reads your enquiry and replies by email. We do not pass it to anyone else.",
                "type": "boolean"
              }
            },
            "required": ["answers", "consent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3267d14dc78d7d6b45f228bdcea32d47a863f2a3960a3dd31904439f69ffd53b"
        }
