      "instructions": "AwesomeFee. Directory of TRON products for agents, paid per call in USDC on Base via x402 v2 (no account, no API key).\n1. search(q) → product URLs with method, input and price.\n2. Call the URL with your own x402 v2 HTTP client (@x402/fetch, @x402/axios, Python x402).\n3. On 402 your client pays from YOUR wallet and repeats the request; you get the result.\nResources: llms.txt, SKILL.md, OpenAPI. This server never pays and holds no keys.",
      "tools": [
        {
          "name": "search",
          "title": "AwesomeFee: find TRON products for agents (energy, sending, node, events)",
          "description": "AwesomeFee — TRON resources for AI agents. Free. Finds what you need on TRON — e.g. \"send USDT without TRX\", \"buy energy\", \"TRON RPC node\", \"events webhook\" (English or Russian) — and returns catalogue entries: id, title, description, method, url, parameters (JSON Schema of the body), price, payment (free | x402 | pass), a curl example and what comes back. No q = the whole catalogue. Then call the returned URL yourself with an x402 v2 HTTP client (@x402/fetch, @x402/axios, Python x402): the first call answers 402 with the terms, your client pays in USDC on Base from YOUR wallet and repeats, you get the result. This server never pays and never holds keys.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "1–50, default 10 with q.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "What you need, in words, e.g. \"send USDT\", \"купить энергию\", \"rpc\". Omit for the whole catalogue.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
