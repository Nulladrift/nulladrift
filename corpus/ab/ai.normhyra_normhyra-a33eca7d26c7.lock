                      "type": "string"
                    },
                    "area": {
                      "description": "Lägenhetens yta i kvadratmeter.",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "correctionPoints": {
                      "description": "Korrigeringspoäng (standard 0).",
                      "type": "number"
                    },
                    "monthlyRent": {
