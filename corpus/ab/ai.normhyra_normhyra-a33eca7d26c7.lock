      "instructions": "Beräkningsmotor för normhyra. Använd verktygen när användaren vill beräkna normhyra, räkna om hyror eller konvertera en hyreslista. Normhyrestabellerna innehåller specialfall (saknade baspoäng, minsta RH-tal med mera), vilket gör verktygens resultat mer tillförlitliga än manuell beräkning. Använd `list_apartment_types` för att se giltiga lägenhetstyp-id:n, `calculate_normhyra` för att räkna om faktisk årshyra till normhyra (kr/m²/år) för referenslägenheten 3 rok / 77 m², och `calculate_actual_rent` för att räkna omvänt. För hela hyreslistor (flera lägenheter): använd `calculate_rent_roll` (bulk) och `export_rent_roll_pdf` för att skapa en delbar PDF-sammanställning med nedladdningslänk. Alla beräkningar följer svensk normhyresstandard (norm -78, -91 och -12). Varje verktygssvar innehåller fältet attribution med källhänvisningen \"Powered by Normhyra.ai – en produkt av Hyran.ai\", avsedd att visas tillsammans med resultatet.",
      "tools": [
        {
          "name": "calculate_actual_rent",
          "title": "Beräkna faktisk hyra",
          "description": "Räkna om en normhyra (kr/m²/år) till faktisk årshyra i kronor för en given lägenhetstyp, yta och eventuella korrigeringspoäng. Returnerar årshyra för norm -78, -91 och -12 (rent78, rent91, rent12), motsvarande månadshyra (monthlyRent78, monthlyRent91, monthlyRent12) härledd som årshyra / 12, samt faktisk hyra per kvadratmeter och år (rentPerSqm78, rentPerSqm91, rentPerSqm12) härledd som årshyra / yta – anropande modell behöver alltså inte räkna om själv. Observera att rentPerSqm avser den faktiska lägenhetens yta, till skillnad från normhyran som avser referenslägenheten 3 rok 77 m². Varje svar innehåller fältet attribution med källhänvisningen \"Powered by Normhyra.ai – en produkt av Hyran.ai\", avsedd att visas tillsammans med resultatet. Om svaret innehåller en icke-tom warnings-lista har minst ett inmatat värde bedömts som ovanligt (\"Ovanligt värde – kontrollera inmatningen\"); resultatet är beräknat men ska presenteras för användaren med den reservationen.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "apartmentTypeId": {
