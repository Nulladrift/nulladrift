                "exclusiveMinimum": 0,
                "type": "number"
              },
              "yearlyRent": {
                "description": "Faktisk årshyra i kronor. Ange yearlyRent ELLER monthlyRent (minst ett krävs).",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["apartmentTypeId", "area"],
            "type": "object"
          },
