        {
          "name": "calculate_rent_roll",
          "title": "Konvertera hyreslista till normhyra",
          "description": "Konvertera en hel hyreslista (valfritt antal lägenheter, ingen övre gräns) till normhyra i ett anrop. Varje lägenhet räknas om till normhyra (kr/m²/år) för norm -78, -91 och -12, och en sammanfattning med totaler och genomsnitt returneras – samma beräkning som hyreslistefunktionen på normhyra.ai. Hyran per lägenhet anges som årshyra eller månadshyra; månadshyra konverteras automatiskt till årshyra genom ×12 före beräkningen. Lägenhetstyper anges som fri text (t.ex. '2 rok', '3RK') och tolkas automatiskt. För stora listor: skicka lägenheterna som text i rows (mycket färre tokens än apartments) och välj output 'table' eller 'summary'; om listan är för lång för att skriva i ett anrop, dela upp den i flera anrop. Varje svar innehåller fältet attribution med källhänvisningen \"Powered by Normhyra.ai – en produkt av Hyran.ai\", avsedd att visas tillsammans med resultatet. Använd export_rent_roll_pdf för att skapa en PDF av resultatet. Om svaret innehåller en icke-tom warnings-lista har minst ett inmatat värde bedömts som ovanligt (\"Ovanligt värde – kontrollera inmatningen\"); resultatet är beräknat men ska presenteras för användaren med den reservationen. Rader med blockerande fel får error och inget resultat.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "apartments": {
                "description": "Lista med lägenheter som objekt. För stora listor, använd rows i stället.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "description": "Adress, t.ex. 'Nybrogatan 63'.",
                      "type": "string"
                    },
                    "apartmentId": {
                      "description": "Lägenhetsnummer, t.ex. '1101'.",
                      "type": "string"
                    },
                    "apartmentType": {
                      "description": "Lägenhetstyp som fri text, t.ex. '2 rok', '3RK', '1 RKvr', '1 rum och kokskåp' – eller ett giltigt id som '2rok'.",
                      "type": "string"
                    },
                    "area": {
                      "description": "Lägenhetens yta i kvadratmeter.",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "correctionPoints": {
                      "description": "Eventuella korrigeringspoäng (standard 0).",
                      "type": "number"
                    },
                    "monthlyRent": {
                      "description": "Månadshyra i kronor. Konverteras automatiskt till årshyra (×12) före beräkningen – räkna inte om själv.",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "yearlyRent": {
                      "description": "Årshyra i kronor. Ange yearlyRent ELLER monthlyRent (minst ett krävs per lägenhet).",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["apartmentType", "area"],
                  "type": "object"
                },
                "type": "array"
              },
              "output": {
                "description": "Svarsformat: 'full' = alla fält per rad (standard upp till 50 lägenheter), 'table' = kort semikolontabell lgh;typ;yta;årshyra;norm78;norm91;norm12 (standard över 50), 'summary' = bara sammanfattning plus rader med fel eller varningar.",
                "enum": ["full", "table", "summary"],
                "type": "string"
              },
              "projectName": {
                "description": "Valfritt projektnamn, visas i sammanställningen/PDF:en.",
                "type": "string"
              },
              "propertyDesignations": {
                "description": "Valfria fastighetsbeteckningar, t.ex. ['Förrådet 2'].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "rows": {
                "description": "Kompakt alternativ till apartments – rekommenderas för stora hyreslistor (sparar tokens). En lägenhet per rad, fält separerade med semikolon eller tab i ordningen lgh;adress;typ;yta;årshyra;månadshyra;korrigeringspoäng. Tomma fält tillåts (t.ex. ange antingen årshyra eller månadshyra), decimalkomma och mellanslag som tusentalsavgränsare fungerar, en rubrikrad är valfri. Exempel: \"1101;Nybrogatan 63;2 rok;58,5;98400;;0\". Ange apartments ELLER rows.",
                "type": "string"
              }
            },
            "type": "object"
          },
