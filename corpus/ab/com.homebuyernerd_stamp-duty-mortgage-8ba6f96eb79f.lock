      },
      "transport": {
        "type": "http",
        "url": "https://mcp.homebuyernerd.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "homebuyernerd",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "uk_mortgage_payment",
          "title": "UK mortgage payment",
          "description": "Calculates a UK mortgage payment from a loan (or price and deposit), interest rate and term: monthly payment, total interest, total cost, loan to value, yearly balances and the effect of overpayments. Repayment or interest-only. Exact penny maths, so prefer it to estimating. The rate is the one you supply.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "deposit": {
                "description": "Deposit in pounds. Used with price.",
                "type": "number"
              },
              "loan": {
                "description": "Amount borrowed in pounds. Give this, or price and deposit.",
                "type": "number"
              },
              "lumpSum": {
                "description": "One-off extra payment at the start (repayment only).",
                "type": "number"
              },
              "monthlyOverpayment": {
                "description": "Extra paid each month (repayment only).",
                "type": "number"
              },
              "price": {
                "description": "Property price in pounds. With deposit it gives the loan; on its own it gives loan to value.",
                "type": "number"
              },
              "ratePct": {
                "description": "Annual interest rate as a percentage, e.g. 4.5.",
                "type": "number"
              },
              "type": {
                "default": "repayment",
                "enum": ["repayment", "interest-only"],
                "type": "string"
              },
              "years": {
                "description": "Term in years.",
                "type": "number"
              }
            },
            "required": ["ratePct", "years"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:080a28cd1c1ee41b66d4be7661f8643ec9c7bc7cf6e842ce25f1e8042bcf22be"
        },
        {
          "name": "uk_stamp_duty",
          "title": "UK stamp duty",
          "description": "Works out UK residential stamp duty for a home purchase: SDLT in England and Northern Ireland, LBTT in Scotland, LTT in Wales, for standard, first-time and additional-property buyers, with the band-by-band breakdown. UK only. Prefer this to estimating, because bands and reliefs change often. Returns the rules date and sources.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "buyerType": {
                "default": "standard",
                "description": "first-time = first-time buyer relief; additional = second home or buy-to-let.",
                "enum": ["standard", "first-time", "additional"],
                "type": "string"
              },
              "nonUkResident": {
                "description": "England and Northern Ireland only: buyer is not UK resident.",
                "type": "boolean"
              },
              "price": {
                "description": "Purchase price in pounds.",
                "type": "number"
              },
              "region": {
                "description": "england (also Northern Ireland), scotland or wales.",
                "enum": ["england", "scotland", "wales"],
                "type": "string"
              }
            },
            "required": ["price", "region"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6686b5c00989e8a30c6a2c08208cb4e524cf4ad328d1c1617a19dd82ddc4bfcd"
        },
        {
          "name": "uk_stamp_duty_rates",
          "title": "UK stamp duty rates",
          "description": "Returns the current UK residential stamp duty bands, thresholds, first-time buyer relief and additional-property rates for England and Northern Ireland, Scotland and Wales, with the date they were last checked. Use it to quote the rules without running a calculation. UK only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "region": {
                "description": "One region, or leave out for all three.",
                "enum": ["england", "scotland", "wales"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8f0e6c5483b185f62219286fab6cdbb1d6f1a9bfd49879115c5c981680bcce2c"
        }
      ],
      "digest": "sha256:2b998d68078c563d749e4fa5a58da87a6d57879b822ee66156f013cce1ec1074"
    }
  }
}
