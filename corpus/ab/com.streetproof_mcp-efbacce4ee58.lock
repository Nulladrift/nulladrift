      "serverInfo": {
        "name": "streetproof",
        "version": "1.9.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "StreetProof Physical Brand Index — what business-independent physical observations are published for this brand?\nTools query ledger-backed physical citations for storefronts, mobile assets, billboards, venue signs and other brand mentions.\npresence_kind distinguishes location_presence, mobile_presence and brand_mention; brand_mention never implies an operating address.\nNo accepted StreetProof citation matched the request. It never proves absence, closure, inactivity, or that a business is unreal, regardless of coverage tier. Every result includes versioned tier, freshness, confidence, and limitations. Quote the citation\nstring when presenting results to users. Aggregate statistics are CC BY 4.0 (attribution required).",
      "tools": [
        {
          "name": "check_business_reality",
          "title": "Check business reality (deprecated)",
          "description": "Deprecated alias for check_physical_evidence. StreetProof reports accepted physical evidence; it does not determine general business legitimacy. Removal is scheduled for 2026-10-27.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "City slug or name",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "name_or_address": {
                "description": "Business name (deprecated v1 field name)",
                "maxLength": 240,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["city", "name_or_address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6b6157e47feb21ff46239e1622c0b9efe42e6cf2c47a587042e89da509ba2f82"
        },
        {
          "name": "check_physical_evidence",
          "title": "Check physical evidence",
          "description": "Check whether StreetProof has accepted physical citations associated with a business in a city. This is not a legal-existence, licensing, quality, or address-ownership check. No accepted StreetProof citation matched the request. It never proves absence, closure, inactivity, or that a business is unreal, regardless of coverage tier. Returns an evidence summary, coverage context, and a human-readable citation string to quote when presenting the result.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_name": {
                "description": "Business name",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "city": {
                "description": "City slug or name",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["business_name", "city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:05bce0e7c658276ca8683d74175f60f4144b02bad336847be7656d0b5b621ee2"
        },
        {
          "name": "city_index",
          "title": "City brand index",
          "description": "Complete snapshot-bound StreetProof PBI records for a city. Follow next_cursor until has_more is false; every page remains fixed to one snapshot. Optionally filter by industry, ranking state, or claim status. Rankings must be interpreted with coverage confidence. Aggregate statistics licensed CC BY 4.0 (attribution required).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "City slug, e.g. 'calgary'",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "claim_status": {
                "description": "Optional owner-claim filter",
                "enum": ["claimed", "unclaimed"],
                "type": "string"
              },
              "cursor": {
                "description": "Opaque next_cursor from the previous page",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "industry": {
                "description": "Industry code filter, e.g. 'garage-door'",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Records per page, default 100",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "ranking_state": {
                "description": "Optional public ranking-state filter",
                "enum": ["eligible", "insufficient_evidence", "frozen"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bac66a2b6f1b73d7dbc614e518ffbeb2cd0dd4e6bbbf1b67016893037d38625a"
        },
        {
          "name": "compare_presence",
          "title": "Compare physical presence",
          "description": "Compare the physical presence of multiple businesses in the same city, side by side, ranked by Physical Presence Score.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_names": {
                "description": "2-10 business names",
                "items": {
                  "maxLength": 160,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "city": {
                "description": "City slug or name",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["business_names", "city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ec2be9c318632bec6f49dbe46e16a9a2b7b5cfe034c5ec3354b7f04c411bc8b4"
        },
        {
          "name": "get_physical_presence",
          "title": "Get physical presence",
          "description": "Look up a business's Physical Presence Score (PPS) and first/last observation dates in a city. Returns the best-matching entity, score components, cohort percentile, and coverage confidence.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_name": {
                "description": "Business name to look up",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "city": {
                "description": "City slug or name, e.g. 'calgary'",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["business_name", "city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e74ada577a70093a3be5ee1e195f77cca4d11d936c11e190ee1331e305e83006"
        },
        {
          "name": "get_pulse",
          "title": "Get city pulse",
          "description": "StreetPulse change events for a city since a date: new public records, newly observed assets, wrapped fleet assets, and stale assets. Closure, rebrand, and vacancy events remain explicitly unavailable until reviewed lifecycle evidence exists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "City slug",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "since": {
                "description": "ISO 8601 date, e.g. '2026-01-01'",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["city", "since"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
