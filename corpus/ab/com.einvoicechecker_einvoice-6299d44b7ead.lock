        },
        {
          "name": "repair_xml",
          "title": "Repair broken invoice XML",
          "description": "Repair an invoice XML that is not well-formed (validate/parse answer MALFORMED_XML): closes unclosed elements, removes stray closing tags, fixes prefix/case mismatches, escapes bare & and <. Refuses truncated files, HTML and files needing more than 25 changes (REPAIR_NOT_POSSIBLE). Returns every change and the repaired XML; validate it before sending. XML only, not PDF.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Invoice XML (UBL, CII, XRechnung, Peppol BIS, ZUGFeRD/Factur-X XML, KSeF FA(3)) as text",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dc7ed69c75a83ebd11c5fbd0a757cb0c89512be4a37e32f47e1c98e811d792f1"
        },
        {
          "name": "validate_invoice",
          "title": "Validate e-invoice",
          "description": "Run the official rule set for the detected format (KoSIT for XRechnung/ZUGFeRD/Factur-X, OpenPeppol for Peppol BIS, FA(3) schema for KSeF, Porezna uprava HR-CIUS schematron for Croatian eRačun, Facturae XSD + calculation/NIF/DIR3 rules for Spain, LHDN SDK rules for MyInvois). Returns valid/invalid with every failed rule: id, severity, message, XPath.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Invoice XML (UBL, CII, XRechnung, Peppol BIS, ZUGFeRD/Factur-X XML, KSeF FA(3)) as text",
                "type": "string"
              },
              "content_base64": {
                "description": "A ZUGFeRD / Factur-X PDF (or any invoice file) as base64, when the invoice is not plain XML",
                "type": "string"
              },
              "kosit": {
                "description": "Run the full KoSIT schematron (default true). false = schema and core checks only, faster",
                "type": "boolean"
              }
            },
            "type": "object"
          },
