{
  "lockfileVersion": 2,
  "subjects": {
    "com.einvoicechecker/einvoice": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://einvoicechecker.com/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "einvoicechecker",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "EU e-invoice tools (XRechnung, ZUGFeRD, Factur-X, Peppol BIS 3.0, UBL, CII, KSeF FA(3), Croatian eRačun HR CIUS 2025, Spanish Facturae 3.2.x, Malaysian MyInvois XML/JSON). Pass the invoice XML in \"content\" or a PDF as \"content_base64\". detect_invoice is cheap; validate_invoice runs the official KoSIT / OpenPeppol / KSeF rule sets; parse_invoice returns the invoice as normalised JSON; render_invoice_html / render_invoice_pdf produce a human-readable document. Without an API key you share the anonymous rate limit; with a key (free at https://einvoicechecker.com/developers/) calls count against your monthly quota.",
      "tools": [
        {
          "name": "detect_invoice",
          "title": "Detect e-invoice format",
          "description": "Identify the format, syntax, profile/customization and country standard of an e-invoice file. Cheap first step before validating.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Invoice XML (UBL, CII, XRechnung, Peppol BIS, ZUGFeRD/Factur-X XML, KSeF FA(3)) as text",
                "type": "string"
              },
              "content_base64": {
                "description": "A ZUGFeRD / Factur-X PDF (or any invoice file) as base64, when the invoice is not plain XML",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:22938ad29d9404ec387349201d21b3caef5605f7bcb898c516ed8ed173afc708"
        },
        {
          "name": "fix_invoice",
          "title": "Auto-fix e-invoice",
          "description": "Fix validation errors of an EN 16931 invoice (XRechnung, Peppol BIS, ZUGFeRD/Factur-X XML, UBL, CII) deterministically: empty elements, decimals, date and code formats, specification ids; with totals=true also recalculates totals and the VAT breakdown from the lines. Data that is not in the file (Leitweg-ID, seller contact, endpoint ids, payment terms) is taken from \"values\"; missing ones are listed in needs_input. Returns the change list, the remaining errors and the corrected XML. Counts as 2 requests.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Invoice XML (UBL, CII, XRechnung, Peppol BIS, ZUGFeRD/Factur-X XML, KSeF FA(3)) as text",
                "type": "string"
              },
              "content_base64": {
                "description": "A ZUGFeRD / Factur-X PDF (or any invoice file) as base64, when the invoice is not plain XML",
                "type": "string"
              },
              "dry_run": {
                "description": "Only report what would change",
                "type": "boolean"
              },
              "totals": {
                "description": "Allow recalculating document totals and VAT breakdown from the line amounts",
                "type": "boolean"
              },
              "values": {
                "additionalProperties": false,
                "description": "Values for data that is missing in the file",
                "properties": {
                  "buyerEndpoint": {
                    "description": "Buyer electronic address (BT-49), scheme:value, e.g. 0204:04011000-12345-03",
                    "type": "string"
                  },
                  "buyerReference": {
                    "description": "Buyer reference / Leitweg-ID (BT-10), e.g. 04011000-12345-03",
                    "type": "string"
                  },
                  "invoiceTypeCode": {
                    "description": "Invoice type code (BT-3, UNTDID 1001), e.g. 380",
                    "type": "string"
                  },
                  "paymentTerms": {
                    "description": "Payment terms (BT-20), e.g. Zahlbar innerhalb 30 Tagen ohne Abzug",
                    "type": "string"
                  },
                  "sellerContactName": {
                    "description": "Seller contact person (BT-41), e.g. Max Mustermann",
                    "type": "string"
                  },
                  "sellerEmail": {
                    "description": "Seller contact e-mail (BT-43), e.g. billing@example.com",
                    "type": "string"
                  },
                  "sellerEndpoint": {
                    "description": "Seller electronic address (BT-34), scheme:value, e.g. EM:billing@example.com",
                    "type": "string"
                  },
                  "sellerPhone": {
                    "description": "Seller contact phone (BT-42), e.g. +49 30 1234567",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0b4c19dc682a47c7c108d77b4f76449f2e691beaecaab9314cdbfb709ced4390"
        },
        {
          "name": "list_supported_formats",
          "title": "Supported e-invoice formats",
          "description": "Which formats, profiles and rule sets this service supports, and what each tool costs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b4448605df3a8113902b8bcff1a374652e52a93e1a1cf8c870dbcb84ce93ac45"
        },
        {
          "name": "my_usage",
          "title": "My plan and usage",
          "description": "Plan, monthly quota, usage this month and subscription state of the API key used for this connection. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:54dd5af657870a65d974fe886064fc96f48d5316c2f2efd1160c2b6f08a6664d"
        },
        {
          "name": "parse_invoice",
          "title": "Parse e-invoice to JSON",
          "description": "Extract the invoice as normalised JSON: number, dates, seller, buyer, lines, VAT breakdown, totals, payment details. Works for every supported format.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Invoice XML (UBL, CII, XRechnung, Peppol BIS, ZUGFeRD/Factur-X XML, KSeF FA(3)) as text",
                "type": "string"
              },
              "content_base64": {
                "description": "A ZUGFeRD / Factur-X PDF (or any invoice file) as base64, when the invoice is not plain XML",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7bebcd8b741d27adcf344381193691dadd4c9855aa0ba84891adbff3037a765d"
        },
        {
          "name": "render_invoice_html",
          "title": "Render e-invoice as HTML",
          "description": "Human-readable invoice document (HTML, A4 print layout) from the XML, in the requested language.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Invoice XML (UBL, CII, XRechnung, Peppol BIS, ZUGFeRD/Factur-X XML, KSeF FA(3)) as text",
                "type": "string"
              },
              "content_base64": {
                "description": "A ZUGFeRD / Factur-X PDF (or any invoice file) as base64, when the invoice is not plain XML",
                "type": "string"
              },
              "lang": {
                "description": "Label language, default en",
                "enum": ["en", "de", "fr", "pl", "nl", "hr", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1bf07b01776362098afc4bde7161b53955fbe17952171e94f464b27a94ad548d"
        },
        {
          "name": "render_invoice_pdf",
          "title": "Render e-invoice as PDF",
          "description": "Human-readable PDF of the invoice (counts as 2 requests). Returned as a base64 resource.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Invoice XML (UBL, CII, XRechnung, Peppol BIS, ZUGFeRD/Factur-X XML, KSeF FA(3)) as text",
                "type": "string"
              },
              "content_base64": {
                "description": "A ZUGFeRD / Factur-X PDF (or any invoice file) as base64, when the invoice is not plain XML",
                "type": "string"
              },
              "lang": {
                "enum": ["en", "de", "fr", "pl", "nl", "hr", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3a4ead0654926a245b5559534809ddf143d0cba825bcb4c62893213f4ee3cbc6"
        },
        {
          "name": "validate_invoice",
          "title": "Validate e-invoice",
          "description": "Run the official rule set for the detected format (KoSIT for XRechnung/ZUGFeRD/Factur-X, OpenPeppol for Peppol BIS, FA(3) schema for KSeF, Porezna uprava HR-CIUS schematron for Croatian eRačun, Facturae XSD + calculation/NIF/DIR3 rules for Spain, LHDN SDK rules for MyInvois). Returns valid/invalid with every failed rule: id, severity, message, XPath.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Invoice XML (UBL, CII, XRechnung, Peppol BIS, ZUGFeRD/Factur-X XML, KSeF FA(3)) as text",
                "type": "string"
              },
              "content_base64": {
                "description": "A ZUGFeRD / Factur-X PDF (or any invoice file) as base64, when the invoice is not plain XML",
                "type": "string"
              },
              "kosit": {
                "description": "Run the full KoSIT schematron (default true). false = schema and core checks only, faster",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b7a3e36bf9bd1c6c92641ac9810b0af7afa09fd22a125d4d28bac6783411d59d"
        }
      ],
      "digest": "sha256:5dbf4152b706b5c45eff38070eb07776d92c6c174137f573bd8034ab4e08fc95"
    }
  }
}
