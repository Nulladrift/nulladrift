        {
          "name": "request_contact",
          "title": "Have a specialist contact the customer",
          "description": "Passes the customer’s name and phone number or email to Watches in Stock so a specialist contacts them about a watch, by WhatsApp, call, text or email, at the time they prefer. Use it when the customer asks to be contacted and has given these details for that purpose. The details are kept privately for 90 days and never shown to dealers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "app": {
                "description": "The app the customer is using.",
                "maxLength": 40,
                "type": "string"
              },
              "best_time": {
                "description": "When they prefer to be reached. Default any.",
                "enum": ["any", "morning", "afternoon", "evening"],
                "type": "string"
              },
              "email": {
                "description": "Email address.",
                "maxLength": 120,
                "type": "string"
              },
              "listing_id": {
                "description": "The listing it is about, from search_watches.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "name": {
                "description": "The customer’s name, as they gave it.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "description": "Phone number with its country code, such as +1 305 555 0123.",
                "maxLength": 24,
                "type": "string"
              },
              "preferred": {
                "description": "How they want to be reached.",
                "enum": ["whatsapp", "call", "text", "email"],
                "type": "string"
              },
              "purpose": {
                "description": "With request: find a watch, or sell one they own.",
                "enum": ["find", "sell"],
                "type": "string"
              },
              "request": {
                "description": "Without a listing: the watch they want, or the one they want to sell.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["name", "preferred"],
            "type": "object"
          },
