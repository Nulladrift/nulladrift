      "serverInfo": {
        "name": "watchesinstock",
        "title": "Watches in Stock",
        "version": "0.3.0",
        "websiteUrl": "https://www.watchesinstock.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
