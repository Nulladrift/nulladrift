        {
          "name": "get_sourcing_link",
          "title": "Get a link to ask for a watch",
          "description": "For a watch that is not listed, or not listed the way the customer wants it, or a watch the customer owns and is thinking of selling. Returns a WhatsApp link to a Watches in Stock specialist with a draft note. Nothing is sent to the customer or the specialist, and nothing is ordered, reserved or paid for; the request is recorded for Watches in Stock, which may be told by phone, and each call asks the store for its next specialist. Use it only when the customer asks for that help.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "app": {
                "description": "The app the customer is using, such as Claude or ChatGPT, named in the note.",
                "maxLength": 40,
                "type": "string"
              },
              "purpose": {
                "description": "find (the default) to look for a watch to buy; sell when the customer owns the watch and is thinking of selling it.",
                "enum": ["find", "sell"],
                "type": "string"
              },
              "request": {
                "description": "The watch, such as \"a 2019 Batgirl, full set, under USD 20,000\", or for selling \"2021 Rolex Batgirl 126710BLNR, full set\".",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["request"],
            "type": "object"
