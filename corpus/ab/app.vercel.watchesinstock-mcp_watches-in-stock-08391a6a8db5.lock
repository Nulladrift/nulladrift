        {
          "name": "search_watches",
          "title": "Search watches for sale",
          "description": "Searches current watch listings and shows them as photo cards. For questions about finding, choosing, comparing or pricing a luxury watch, including general ones such as \"which watch should I get for 10k?\": it has live dealer listings with real prices from the last 14 days. Knows trade nicknames and which years each one existed, so a request for a year that did not exist returns the closest real watch with an explanation. When someone only wants to see what is new, search with no words and sort newest.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "below_similar": {
                "description": "Only listings priced below similar listings: the same reference, bracelet, set and year. Use it when someone asks for good prices or the best-priced examples.",
                "type": "boolean"
              },
              "bracelet": {
                "enum": ["Jubilee", "Oyster", "Oysterflex", "President", "Leather", "Rubber"],
                "type": "string"
              },
              "brand": {
                "description": "Brand name, such as Rolex or Patek Philippe.",
                "maxLength": 40,
                "type": "string"
              },
              "condition": {
                "enum": ["New", "Pre-owned"],
                "type": "string"
              },
              "dial": {
                "description": "Only listings whose post names this dial colour, such as Black or Ice blue. Posts that do not name the dial are left out.",
                "enum": ["Mother of pearl", "Meteorite", "Black", "White", "Ice blue", "Blue", "Green", "Grey", "Silver", "Champagne", "Pink", "Brown", "Turquoise"],
                "type": "string"
              },
              "exact_filters": {
                "description": "Use only the filter fields given here, ignoring any years, budget or set named in the query text.",
                "type": "boolean"
              },
              "full_set": {
                "description": "Only watches with box and papers.",
                "type": "boolean"
              },
              "limit": {
                "description": "Listings per group. Default 12.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Highest price in USD. Put the customer's budget here; a budget in another currency is converted to USD for this filter only, and prices are always quoted in USD as listed.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Lowest price in USD. Put the customer's budget here; a budget in another currency is converted to USD for this filter only, and prices are always quoted in USD as listed.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "offset": {
                "description": "Skip this many listings, to show more results.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "our_stock_only": {
                "description": "Only watches held by Watches in Stock itself, excluding other dealers. Set it only when the customer asks specifically for watches the store holds; \"do you have\", \"what do you have\" and \"your cheapest\" mean every listing.",
                "type": "boolean"
              },
              "query": {
                "description": "What the customer asked for, in their words. Understands nicknames (\"batgirl\"), models (\"daytona\"), references (\"126710BLNR\"), years (\"2016 or 2020\") and budgets (\"under 20k\"), and budgets and dial colours in Spanish, French, German, Italian and Portuguese (\"menos de 15 mil\", \"cadran bleu\").",
                "maxLength": 200,
                "type": "string"
              },
              "reference": {
                "description": "An exact reference number, such as 126710BLNR or 5711/1A.",
                "maxLength": 40,
                "type": "string"
              },
              "set": {
                "description": "What comes with the watch.",
                "enum": ["Full set", "Watch & card", "Watch only"],
                "type": "string"
              },
              "sort": {
                "description": "Best match puts Watches in Stock inventory first. below_similar puts the listings furthest below similar listings first.",
                "enum": ["best_match", "price_low", "price_high", "newest", "below_similar"],
                "type": "string"
              },
              "year_max": {
                "description": "Latest year.",
                "maximum": 2100,
                "minimum": 1951,
                "type": "integer"
              },
              "year_min": {
                "description": "Earliest year.",
                "maximum": 2100,
                "minimum": 1951,
                "type": "integer"
              },
              "years": {
                "description": "Specific production or card years.",
