        {
          "name": "hostname_create",
          "title": "Dynamic DNS hostname under dynkite.com (200 sats 30d, 2,000 sats 1y)",
          "description": "Creates a dynamic hostname such as myhome.dynkite.com. The answer gives the hostname token once (keep it: hostname_update and routers use it). Nothing renews it automatically: give npub to get Nostr reminders before it expires. From 2026-11-10, a create for a hostname that is already taken (bought more than a day ago) RENEWS it instead, like the renew tool: payment_required says so first, and it gives no hostname and no token. Paid, no account. Without payment the call returns payment_required with the price, a Lightning invoice and a Cashu payment request; pay only within what your user allowed, then call again with the same arguments plus l402='<macaroon>:<preimage>', or call with cashu='<token>'. Every request is checked for free before an invoice is made; use check first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cashu": {
                "description": "Cashu token (cashuA... or cashuB...) worth at least the price, from an accepted mint (see info). Pays without a previous call.",
                "type": "string"
              },
              "hostname": {
                "description": "A label such as myhome (becomes myhome.dynkite.com), or the full name.",
                "type": "string"
              },
              "l402": {
                "description": "Lightning payment proof for a retry: '<macaroon>:<preimage>', where macaroon comes from the payment_required answer of the previous call and preimage is the 64-hex proof your wallet returns after paying its invoice. Use it with the same tool and arguments.",
                "type": "string"
              },
              "npub": {
                "description": "Optional: a Nostr public key (npub1... or 64 hex) that gets direct-message reminders before the hostname expires, when grace starts and before removal. Reminders only: the key gets no control; managing the hostname still needs its token.",
                "type": "string"
              },
              "period": {
                "description": "30d (30 days) or 1y (365 days). Prices differ: see the tool title.",
                "enum": ["30d", "1y"],
                "type": "string"
              },
              "token": {
                "description": "Only if you already hold this hostname's token (jdh_...): a create for your own hostname then answers hostname_owned with its expiry and how to renew, instead of hostname_taken (from 2026-11-10: a renewal invoice that says the hostname is already yours).",
                "type": "string"
              }
            },
            "required": ["hostname", "period"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
