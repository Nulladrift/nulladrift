      "serverInfo": {
        "name": "satsdns",
        "title": "SatsDNS",
        "version": "0.2.9",
        "websiteUrl": "https://satsdns.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "SatsDNS hosts DNS zones, secondary zones and dynamic DNS hostnames (under dynkite.com), paid per order in bitcoin (Lightning L402 or Cashu ecash); no account needed. Free: info (prices, nameservers, mints, steps), check (the free check of a paid call, and its price), domain_check. Paid: zone_create and secondary_create (500 sats 30d, 5,000 1y), hostname_create (200 / 2,000), renew, zone_add_queries (200). A paid tool called without payment returns payment_required with a Lightning invoice and a macaroon: pay only within what your user allowed, then repeat the same call adding l402='<macaroon>:<preimage>', or pass cashu='<token>'. Invalid requests are refused before any invoice is made. A new zone needs its own nameserver pair set at the registrar first: call check with tool zone_create and follow its answer. Management (records, DNSSEC, status, dynamic IP update, renewal address) is free with the token the create answer gives once, or with a scoped account API key (jdk_). With a Nostr account: account_objects, account_order (pay check is free; else an invoice), order_status, claim and token_rotate; calls that need the account's signature answer signature_required with the exact request to sign (NIP-98, with proof of work for accounts without a paid order): sign it with your own signer and repeat the call adding nip98='<base64 event>'. Never send private keys (nsec or 64 hex characters), wallet connection strings or seed words: an nsec, a wallet string or a bare seed phrase is refused, but a raw hex key or seed words inside a sentence cannot be told apart from data and would be sent on. Docs: https://satsdns.com/docs",
      "tools": [
        {
          "name": "account_objects",
          "title": "Your SatsDNS account: objects, invoices, state (free, API key or signature)",
          "description": "Free, read-only: the account's state and limits, or the zones, hostnames or invoices it owns. With api_key, only the objects the key's scope covers and only their invoices (the account view of limits and counts is the same for every key). Called without nip98 it returns signature_required: the exact URL, method and body to sign, the body's sha256 and an unsigned kind 27235 event template (with proof of work for accounts without a paid order). Sign that, then call again with the same arguments plus nip98. Each signed event works once, within 60 s. Secrets that are ours to receive: object tokens, account API keys (jdk_), signed NIP-98 events; never a private key (nsec or 64 hex characters), wallet connection string or seed words. A raw hex key or seed words inside a sentence cannot be caught here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "A scoped account API key (jdk_...) made in the dashboard. It passes through your model context and transcript: treat it like a password. Key model: a key reads (or, with write access, changes) only the objects in its scope, and sees only their invoices; every key reads the account view (limits and counts); a key never orders new objects and never receives a new object's shown-once token.",
                "type": "string"
              },
              "nip98": {
                "description": "The signed NIP-98 event (base64 of its JSON) for exactly the request the signature_required answer of the same call named. Sign it with your own Nostr signer (local key, NIP-46 bunker or a signer tool); never send the private key itself, in any form (nsec, hex or seed words).",
                "type": "string"
              },
              "type": {
                "description": "account: state, tier, limits and whether proof of work is needed; zones, hostnames: what the account owns; invoices: the 50 newest.",
                "enum": ["account", "zones", "hostnames", "invoices"],
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Account objects"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b1aa75b28843c677e4993d61322bb65a1f8bb3d07ae84cc948f344d532970ed1"
        },
        {
          "name": "account_order",
          "title": "Order with your Nostr account (pay check is free; else an invoice in sats)",
          "description": "Orders a product into your account, paid by its own invoice: Lightning (15 min) or a new on-chain address (orders of 5,000 sats and up). Prices as in info. pay=check runs the free checks only and makes no invoice: use it first. Refused orders make no invoice. New objects need nip98; renewals and extra queries also work with an api_key whose scope covers the object. Pay only within what your user allowed, then poll order_status with the invoice id. Accounts without a paid order are limited (see info, accounts.npub_limits). Called without nip98 it returns signature_required: the exact URL, method and body to sign, the body's sha256 and an unsigned kind 27235 event template (with proof of work for accounts without a paid order). Sign that, then call again with the same arguments plus nip98. Each signed event works once, within 60 s. Secrets that are ours to receive: object tokens, account API keys (jdk_), signed NIP-98 events; never a private key (nsec or 64 hex characters), wallet connection string or seed words. A raw hex key or seed words inside a sentence cannot be caught here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "A scoped account API key (jdk_...) made in the dashboard. It passes through your model context and transcript: treat it like a password. Key model: a key reads (or, with write access, changes) only the objects in its scope, and sees only their invoices; every key reads the account view (limits and counts); a key never orders new objects and never receives a new object's shown-once token.",
                "type": "string"
              },
              "hostname": {
                "description": "ddns_*: the hostname label or full name.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional, 1-64 of A-Z a-z 0-9 _ -: repeat an order with the same key (and a fresh signature) to get the same invoice back instead of a second one, e.g. after a lost answer.",
                "type": "string"
              },
              "nip98": {
                "description": "The signed NIP-98 event (base64 of its JSON) for exactly the request the signature_required answer of the same call named. Sign it with your own Nostr signer (local key, NIP-46 bunker or a signer tool); never send the private key itself, in any form (nsec, hex or seed words).",
                "type": "string"
              },
              "pay": {
                "description": "check: the free checks only, no invoice (do this first); lightning: a BOLT11 invoice (15 min); onchain: a new bitcoin address (orders of 5,000 sats and up, 24 h, confirmations as in the answer); both.",
                "enum": ["lightning", "onchain", "both", "check"],
                "type": "string"
              },
              "period": {
                "description": "30d or 1y; 1m for zone_queries (default).",
                "enum": ["30d", "1y", "1m"],
                "type": "string"
              },
              "primaries": {
                "description": "secondary_create: public IPv4 addresses of your primary servers.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "product": {
                "description": "zone_create, secondary_create, ddns_create (new objects: nip98 only); zone_renew, ddns_renew, zone_queries (1 million queries; api_key or nip98).",
                "enum": ["zone_create", "zone_renew", "zone_queries", "ddns_create", "ddns_renew", "secondary_create"],
                "type": "string"
              },
              "zone": {
                "description": "zone_* and secondary_create: the zone, e.g. example.com.",
                "type": "string"
              }
            },
            "required": ["pay", "product"],
            "type": "object"
          },
          "annotations": {
