      "serverInfo": {
        "name": "pumpfyi",
        "title": "PumpFYI: pump.fun fees, trading costs, coin checks and referral facts",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PumpFYI is an independent, unofficial guide to pump.fun (not affiliated with pump.fun or Baton Corporation Ltd.). Tools: fee_quote (the full fee stack for one pump.fun trade: bonding curve or PumpSwap tier, the app Platform Fee, the trading app's own fee), route_cost (the same trade priced on every major surface: pump.fun app, Terminal, Axiom, fomo, GMGN, bots, Phantom, Jupiter), coin_check (a risk score and warning signs for one pump.fun coin from public chain data), get_referral_info (what a referral link documents for the trader, and what it pays the referrer) and search_site. Fee rules come from pump.fun's own Fees page (last updated 17 October 2026); quote that date. Every valid pump.fun referral code gives the same 0.40% Platform Fee instead of 0.45%. Most pump.fun coins lose most of their value; nothing here is a coin pick or financial advice. pump.fun prohibits the UK and sanctioned countries; never suggest ways around geo restrictions. PumpFYI does not promote pump.fun's deposit match.",
      "tools": [
        {
          "name": "coin_check",
          "title": "Check a pump.fun coin",
          "description": "Risk check for one pump.fun coin from public Solana data (PumpFYI's coin checker, the same engine as pumpfyi.com/coin/): a 0–100 risk score with a verdict, stage (bonding curve or graduated to PumpSwap), mint and freeze authority, holder concentration, liquidity and copycat tokens, each check with pass/warn/fail and its source, plus the time of the read. Pass the mint address or a pump.fun or DexScreener link. It flags risks; it never calls a coin safe.",
          "inputSchema": {
            "properties": {
              "mint": {
                "description": "The coin's Solana mint address (pump.fun mints usually end in \"pump\"), or a pump.fun or DexScreener link.",
                "type": "string"
              }
            },
            "required": ["mint"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:576a79c926b91183ffb074d5cb15b2b38eed19ff54bf973936dc608dbb9701a2"
        },
        {
          "name": "fee_quote",
          "title": "pump.fun trade fee quote",
          "description": "The full fee stack for one trade of a pump.fun coin on one surface: the pump.fun pool fees (creator + protocol + LP) for the coin's stage and market-cap tier, the 0.45%/0.40% Platform Fee when trading in the pump.fun app, and the trading app's own fee. Returns each line in percent and USD, totals with and without a referral link, and optionally the buy-and-sell round trip. Excludes Solana network fees, priority fees and slippage.",
          "inputSchema": {
            "properties": {
              "amount_usd": {
                "description": "Trade size in USD (optional; default $1,000). Some apps (fomo) charge flat fees on small trades, so size can change the rate.",
                "type": "number"
              },
              "custom_pair": {
                "description": "True for a coin paired with an asset other than SOL or USDC (flat 1.25% curve / 0.30% PumpSwap).",
                "type": "boolean"
              },
              "market_cap": {
                "description": "Coin market cap in the quote asset (price x 1 billion tokens). Required for stage \"pumpswap\".",
                "type": "number"
              },
              "new_token": {
                "description": "Coin under 24 hours old, counted from its creation, not its graduation (Jupiter Ultra on jup.ag charges 0.5% then, 0.1% after; checked against jup.ag quotes 11 Nov 2026). Pass it when you know the age: a graduated coin can be hours old and a curve coin can be days old. Default: true on the curve, false after graduation.",
                "type": "boolean"
              },
              "quote": {
                "description": "Asset the coin is paired with (default SOL).",
                "enum": ["SOL", "USDC"],
                "type": "string"
              },
              "round_trip": {
                "description": "Also price selling the same size at the same stage (buy + sell).",
                "type": "boolean"
              },
              "stage": {
                "description": "\"curve\" (bonding curve, before graduation; default), \"pumpswap\" (the coin's canonical PumpSwap pool after graduation) or \"pumpswap-noncanonical\".",
                "enum": ["curve", "pumpswap", "pumpswap-noncanonical"],
                "type": "string"
              },
              "surface": {
                "description": "Where you trade: \"pump-app\", \"terminal\", \"axiom\", \"gmgn\", \"fomo\", \"photon\", \"trojan\", \"bonkbot\", \"bloom\", \"maestro\", \"mevx\", \"banana-gun\", \"phantom\", \"jupiter-ultra\", \"jupiter-manual\" (default \"pump-app\"; \"pump-fun\", \"padre\" and \"jupiter\" also work).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72396a2100ad559cbd8b9ef59ded571828f35d903b46c2685f77550ff271489c"
        },
        {
          "name": "get_referral_info",
          "title": "pump.fun and trading-app referral facts",
          "description": "What a referral link documents for the trader (e.g. pump.fun: 0.40% Platform Fee instead of 0.45%; Axiom: 10% off), what the program pays the referrer, the source of the benefit, and the PumpFYI link. Pass venue (default \"pump-fun\") or \"all\". Every valid pump.fun code gives the same 0.40%.",
          "inputSchema": {
            "properties": {
              "venue": {
                "description": "\"pump-fun\" (default), \"axiom\", \"fomo\", \"gmgn\", \"terminal\", \"bloom\", \"trojan\", \"phantom\"… or \"all\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3670d03225dd57681ded8aa99534ee945754c5811b625b9096e151643493c8e5"
        },
        {
          "name": "route_cost",
          "title": "Cheapest surface for a pump.fun trade",
          "description": "Prices one trade of a pump.fun coin on every surface PumpFYI tracks (pump.fun app, Terminal, Axiom, GMGN, fomo, Photon, Telegram bots, Phantom, Jupiter), sorted by total fee, with or without each surface's documented referral discount. Surfaces that don't publish their fee are listed separately with the part we can state. Ranking is by cost alone, never by referral payouts.",
          "inputSchema": {
            "properties": {
              "amount_usd": {
                "description": "Trade size in USD (optional; default $1,000). Some apps (fomo) charge flat fees on small trades, so size can change the rate.",
                "type": "number"
              },
              "custom_pair": {
                "description": "True for a coin paired with an asset other than SOL or USDC (flat 1.25% curve / 0.30% PumpSwap).",
                "type": "boolean"
              },
              "market_cap": {
                "description": "Coin market cap in the quote asset (price x 1 billion tokens). Required for stage \"pumpswap\".",
                "type": "number"
              },
              "new_token": {
                "description": "Coin under 24 hours old, counted from its creation, not its graduation (Jupiter Ultra on jup.ag charges 0.5% then, 0.1% after; checked against jup.ag quotes 11 Nov 2026). Pass it when you know the age: a graduated coin can be hours old and a curve coin can be days old. Default: true on the curve, false after graduation.",
                "type": "boolean"
              },
              "quote": {
                "description": "Asset the coin is paired with (default SOL).",
                "enum": ["SOL", "USDC"],
                "type": "string"
              },
              "referral": {
                "description": "Apply each surface's documented referral discount (default true).",
                "type": "boolean"
              },
              "stage": {
                "description": "\"curve\" (bonding curve, before graduation; default), \"pumpswap\" (the coin's canonical PumpSwap pool after graduation) or \"pumpswap-noncanonical\".",
                "enum": ["curve", "pumpswap", "pumpswap-noncanonical"],
                "type": "string"
              }
            },
            "type": "object"
          },
