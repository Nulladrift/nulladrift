          "title": "Search PumpFYI",
          "description": "Find PumpFYI pages (fees, guides, explainers, where-to-trade pages, comparisons, datasets, news) for a question or keyword. Returns titles, one-line summaries and URLs; read the page for its dated short answer.",
          "inputSchema": {
            "properties": {
