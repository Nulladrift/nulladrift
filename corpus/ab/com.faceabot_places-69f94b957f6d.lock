{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/places": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/places"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-places",
        "title": "Faceabot Places",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot Places: find places (restaurants, hotels, museums, pharmacies, ATMs, EV charging…) in any city or near a point, and geocode addresses, worldwide, free, no key.\nplaces_search {\"what\":\"restaurant\",\"where\":\"Rome\"} · places_near {\"what\":\"pharmacy\",\"lat\":…,\"lon\":…} · geocode_address {\"query\":\"…\"} · reverse_geocode {\"lat\":…,\"lon\":…}.\nData: OpenStreetMap (© OpenStreetMap contributors, ODbL): cite it. Community data: no ratings, and hours can be out of date: tell the user to check.\nPart of Faceabot (https://faceabot.com): any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "geocode_address",
          "title": "Address or place name to coordinates",
          "description": "Turns an address, a place name or a city into coordinates (latitude, longitude) with its full address, type and country. Worldwide, any language.\nUse when: you need coordinates for a map, a distance, weather or places_near.\nExample: {\"query\":\"Grand-Place, Brussels\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "type": "string"
              },
              "limit": {
                "default": 3,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Address, landmark or place name",
                "examples": ["Grand-Place, Brussels"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:981f7ea10e4bba30714a66172db589df7290613cbc5e2ba29ec06741d448aac6"
        },
        {
          "name": "places_near",
          "title": "Find places near a point",
          "description": "Finds places of one kind around a latitude/longitude or an address (up to 5 km), nearest first, with distance in meters.\nUse when: you need the closest pharmacy, ATM, restaurant, charging station… to the user's location or to an address.\nExample: {\"what\":\"pharmacy\",\"lat\":50.8467,\"lon\":4.3525,\"radius_m\":1000} or {\"what\":\"pharmacy\",\"where\":\"Grand-Place, Brussels\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "type": "string"
              },
              "lat": {
                "examples": [50.8467],
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "examples": [4.3525],
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius_m": {
                "default": 1000,
                "maximum": 5000,
                "minimum": 100,
                "type": "integer"
              },
              "what": {
                "description": "Kind of place (any language)",
                "examples": ["pharmacy"],
                "type": "string"
              },
              "where": {
                "description": "Instead of lat/lon: an address or place name (any language), converted to coordinates",
                "examples": ["Grand-Place, Brussels"],
                "type": "string"
              }
            },
            "required": ["what"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:91c5cd9d84ed02cc0182dc8c4c24f8c2fe2d96f23597e1c92930112d3ef669fa"
        },
        {
          "name": "places_search",
          "title": "Find places in a city",
          "description": "Finds places of one kind in a city or area from OpenStreetMap: restaurants, cafes, bars, hotels, hostels, museums, attractions, pharmacies, hospitals, supermarkets, ATMs, parking, EV charging, parks… with address, coordinates, opening hours, website and phone when known.\nUse when: someone asks for \"restaurants in Rome\", \"museums in Amsterdam\", \"a pharmacy in Brussels\".\nExample: {\"what\":\"restaurant\",\"where\":\"Rome\",\"limit\":10}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language for names and addresses. Default: en",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "what": {
                "description": "Kind of place, in English or another language (restaurant, hotel, musée, apotheek…)",
                "examples": ["restaurant"],
                "type": "string"
              },
              "where": {
                "description": "City, district or area (any language), e.g. \"Rome\", \"Ixelles, Brussels\"",
                "examples": ["Rome"],
                "type": "string"
              }
            },
            "required": ["what", "where"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dd0f90fc1a0e5f9c6c3d0d62752f4f9a120b62b62fccd38c2e2ff62c48a71d5c"
        },
        {
          "name": "reverse_geocode",
          "title": "Coordinates to address",
          "description": "Turns a latitude/longitude into the nearest address (street, postcode, city, country).\nUse when: you have GPS coordinates and need a readable address.\nExample: {\"lat\":48.8584,\"lon\":2.2945}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "type": "string"
              },
              "lat": {
                "examples": [48.8584],
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "examples": [2.2945],
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fcc697bcb08d4a5af5427c07be5d944ff3d211629bb78c1b04575082e5529936"
        }
      ],
      "digest": "sha256:2c9a7e5f66a11b26560f21783ff20464de2ef798d56448b9d608e13ff6fcd4da"
    }
  }
}
