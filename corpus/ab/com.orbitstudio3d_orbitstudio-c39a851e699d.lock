      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "orbitstudio",
        "title": "OrbitStudio",
        "version": "1.0.0",
        "websiteUrl": "https://orbitstudio3d.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "OrbitStudio turns real elevation data of the Moon, planets and dwarf planets into 3D-printable jigsaw puzzles and ornaments, and makes 3D-printable star map plates. These tools look up the places the app knows, suggest settings from the app's own defaults, return pictures already published on orbitstudio3d.com, and build links that open the app at a place. They do not generate models or download files.",
      "tools": [
        {
          "name": "get_preview",
          "title": "Show existing pictures",
          "description": "Return pictures already published on orbitstudio3d.com for a world or a place: photos of printed models, renders made with the app, and the world's map texture, each captioned with what it shows. Use it when the user wants to see what a model looks like. Nothing is rendered on request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "place": {
                "description": "Optional place name or id from search_places.",
                "maxLength": 80,
                "type": "string"
              },
              "world": {
                "description": "Which world: moon, mars, mercury, venus, jupiter, pluto, vesta, ceres, mimas, enceladus, tethys or charon (only the ones OrbitStudio currently offers are accepted).",
                "type": "string"
              }
            },
            "required": ["world"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show existing pictures"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4053041b88eed91a5b08d213c390f36fd61b141e96a09259be1a4bd20128307a"
        },
        {
          "name": "get_product_info",
          "title": "About OrbitStudio",
          "description": "Facts about OrbitStudio: what it makes, its two tools and the worlds offered, which steps are free and which are not, a link to the page that lists the plans, and the support address. Use it when the user asks what OrbitStudio is or which parts of it are free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About OrbitStudio"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aed2defe5f74303a6f508f98dad7e0cdd5bf2ee53c1dc2b24e6e53d4175b45bd"
        },
        {
          "name": "list_worlds",
          "title": "List worlds",
          "description": "List the worlds OrbitStudio currently offers, with each world's size, number of known places, default relief, smallest selection and data caveats. Use it when the user asks which planets or moons can be printed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List worlds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:21e74a7c5dcf389293008e540759ee29e27b535674c940c2d61f4c8bd373bf86"
        },
        {
          "name": "search_places",
          "title": "Search OrbitStudio places",
          "description": "Search the named places OrbitStudio can open directly: craters, mountains, valleys, basins and spacecraft landing sites on the Moon and other worlds. Use it when the user names or describes a place to 3D print, or asks what there is on a world. Returns each match's world, coordinates, the size of its box in the app's travel list, a short description and a link that opens the generator at that place.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Most results to return.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name or part of a name, e.g. 'Tycho', 'Apollo 11', 'Olympus', 'volcano'.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "world": {
                "description": "Which world: moon, mars, mercury, venus, jupiter, pluto, vesta, ceres, mimas, enceladus, tethys or charon (only the ones OrbitStudio currently offers are accepted).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search OrbitStudio places"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a03db56fce5a2e84ad044072a7e485b90b23856988d0a40d1020f614d30888e7"
        },
        {
          "name": "star_map_link",
          "title": "Star map link",
          "description": "Build a link that opens OrbitStudio Sky with the night sky over a place on Earth at a local date and time, as a 3D-printable star map plate. Use it for a birth, wedding or 'night we met' star map. Give a place name, which is looked up on OpenStreetMap, or latitude and longitude, which win when both are given. When a name matches more than one place, the tool lists them instead of choosing: ask the user which one they mean.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Local date, YYYY-MM-DD, 1900-01-01 to 2100-12-31.",
                "type": "string"
              },
              "label": {
                "description": "Optional text engraved on the plate instead of the place name.",
                "maxLength": 40,
                "type": "string"
              },
              "latitude": {
                "description": "Latitude in degrees. Give it with longitude instead of a place name; it wins over one.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude in degrees east (negative is west).",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "place": {
                "description": "The place on Earth, e.g. 'Amsterdam, Netherlands'; adding the region or country avoids a list of candidates. Looked up when latitude and longitude are not given. Also the label engraved on the plate (first 40 characters) unless label is given.",
                "maxLength": 120,
                "type": "string"
              },
              "time": {
                "default": "21:00",
                "description": "Local time, HH:MM 24-hour. Defaults to 21:00.",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Star map link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:df04e6877f961c0f099ebe32abe3f49e5d609337437cae6b21f4d1b4b4e7c5e4"
        },
        {
          "name": "suggest_model",
          "title": "Suggest model settings",
          "description": "Suggest OrbitStudio settings for a 3D-printed puzzle or ornament of a place, from the app's own defaults and the limits of that world's elevation data, plus a link that opens the app at the place with those settings filled in, ready for the user to press Generate. Use it when the user wants to make or print a model of a specific place. Give either a place from search_places or latitude and longitude (a coordinate link cannot carry settings). Shape, size and relief may be chosen; otherwise the app's defaults apply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "latitude": {
                "description": "Latitude in degrees, if no place is given.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude in degrees east, if no place is given.",
                "maximum": 360,
                "minimum": -180,
                "type": "number"
              },
              "place": {
                "description": "Place name or id from search_places, e.g. 'tycho'.",
                "maxLength": 80,
                "type": "string"
              },
              "purpose": {
                "default": "ornament",
                "description": "puzzle for a jigsaw puzzle; ornament, gift or display for a solid model.",
                "enum": ["puzzle", "ornament", "gift", "display"],
                "type": "string"
              },
              "relief": {
                "description": "Terrain Height Scale; 1 is true scale. Defaults to the world's own starting value.",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              },
              "shape": {
                "default": "circle",
                "description": "Outline of the model.",
                "enum": ["circle", "square", "hexagon"],
                "type": "string"
              },
              "size_mm": {
                "default": 200,
                "description": "Printed width or diameter in mm (rounded to 10); fit it to the printer's bed.",
                "maximum": 320,
                "minimum": 50,
                "type": "number"
              },
              "world": {
                "description": "Which world: moon, mars, mercury, venus, jupiter, pluto, vesta, ceres, mimas, enceladus, tethys or charon (only the ones OrbitStudio currently offers are accepted).",
                "type": "string"
              }
            },
            "required": ["world"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Suggest model settings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a653dcabf9d621dced8a1fbf65054e615c8fceb46c92ebb3ef15140e279c649d"
        }
      ],
      "digest": "sha256:cbe0138c6bbbdea5a54914f151d9a5a06e66aacf7cceb607388292ab99499721"
    }
  }
