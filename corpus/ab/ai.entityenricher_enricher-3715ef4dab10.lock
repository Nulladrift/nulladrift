        {
          "name": "retry_expertises",
          "title": "Retry failed expertises",
          "description": "Retry only an existing record's failed expertise domains, then update its output and attempt the run's fusion/synchronization. Billed for retried work. Requires failed_expertises on that record (get_record); a surviving successful sibling is not retryable and returns no_failed_expertises. Supply its entity_input_data and saved_schema_id; model optionally substitutes the failed model. Returns job_id: poll get_job_status, then re-read get_record. When the failed leg left no record, use a one-model enrich_entity with database_sync=false followed by merge_records instead. Recovery decisions: enricher://docs/enrichment-and-fusion.",
          "inputSchema": {
            "properties": {
              "enable_web_search": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "On your model (the default), true asks you to ground the answers with your own web search tool and false not to; omitted returns web_search_undecided so you ask the user first. On platform models, true enables the provider's builtin search where the model supports it (omitted = false).",
                "title": "Enable Web Search"
              },
              "entity_data": {
                "additionalProperties": true,
                "description": "The record's original entity input (get_record -> entity_input_data).",
                "title": "Entity Data",
                "type": "object"
              },
              "languages": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "ISO 639-1 codes; defaults to ['en'].",
                "title": "Languages"
              },
              "model": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Model to retry with. Omitted (the default), the retry runs on YOUR model or, with use_platform_models=true, on the record's own model. Name a stronger provider::model (list_models) only when a domain fails repeatedly on the record's model and the user agrees; that runs the retry on the platform (billed). Only the failed domains are re-run and re-billed; the record stays attributed to its original model.",
                "title": "Model"
              },
              "reasoning_effort": {
                "anyOf": [
                  {
                    "enum": ["low", "medium", "high"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Thinking (reasoning) opt-in: low, medium or high; omitted = off. On the platform, auto then picks only a model whose reasoning the platform can pilot, and the effort is translated per provider. On YOUR model, apply the effort yourself when you run the requests.",
                "title": "Reasoning Effort"
              },
              "record_id": {
                "description": "Enrichment record with failed expertises.",
