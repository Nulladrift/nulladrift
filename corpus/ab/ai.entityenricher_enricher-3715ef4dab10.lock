        {
          "name": "nest_schema_region",
          "title": "Materialize entity region",
          "description": "Materialize an entity region from get_schema's x-entityMap. Ordinary flat members (e.g. product_id, product_name on an order line) move into a new object named after the region, regions hanging from it move along (nest them in turn inside the new object), pairing facts stay on the host, and the moved names shed the region's tokens (product_name → name) unless strip_prefix=false. A pairing region nests the same way: its pair facts gather into a pairing object with the entity hanging from it (series_volume → series_engagement.volume beside book_series). Compact scalar occurrences (e.g. manufacturer_name or each therapeutic_classes[] item) are all converted to references to one shared $defs entity; host_path and strip_prefix do not apply to that form. If the schema already uses semantic IDs, the created object gets one when generation's gates allow (keyed, not only by exact values, not a pairing); no other object changes. host_path is '' for the root, an object path, 'path[]' for an array's items, or '$defs.X'. Defaults to dry_run=true: inspect the returned schema_content and notes, then persist with dry_run=false only after approval of the change. Requires editor; no LLM call. Database-linked structural edits still require publish_schema. Modeling consequences: enricher://docs/schema-reference.",
          "inputSchema": {
            "properties": {
              "dry_run": {
                "default": true,
                "description": "Report the rewrite without persisting it (the default).",
                "title": "Dry Run",
                "type": "boolean"
              },
              "host_path": {
                "default": "",
                "description": "Container holding the flat members ('' = root, object path, 'path[]', '$defs.X').",
                "title": "Host Path",
                "type": "string"
              },
              "region_id": {
                "description": "Entity region id from x-entityMap.regions (get_schema).",
                "title": "Region Id",
                "type": "string"
              },
              "schema_id": {
                "description": "UUID of the saved schema.",
                "title": "Schema Id",
                "type": "string"
              },
              "strip_prefix": {
                "default": true,
