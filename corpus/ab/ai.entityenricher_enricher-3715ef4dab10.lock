        {
          "name": "merge_records",
          "title": "Merge records",
          "description": "Fuse two or more records of the same entity into a new arbitration record. Without arbitration_model use voting, median and union rules; with an arbiter, conflicts may incur LLM cost. Returns output, conflicts, fusion metadata and a new record ID. The merged result can feed linked databases and overwrite current entity values. Inspect database warnings and the actual fusion method; an arbiter failure can fall back to rules. Use this after separately recovered model runs, not to merge different entities. See enricher://docs/enrichment-and-fusion. With arbitration_model='auto' YOU arbitrate (unless use_platform_models=true): the call returns the job status at its first pending request (answer_llm_request) or at the terminal state. A rule-based merge (no arbitration_model) makes no model call and blocks until done.",
          "inputSchema": {
            "properties": {
              "arbitration_model": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "LLM arbitration: None = rule-based (no model call), 'auto' = YOUR model (or the platform's pick with use_platform_models=true), a platform key = that model.",
                "title": "Arbitration Model"
              },
              "attachment_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Attachments passed to the arbitration LLM (ignored for rule-based merges).",
                "title": "Attachment Ids"
              },
              "result_ids": {
                "description": "UUIDs of the enrichment records to merge (minimum 2).",
                "items": {
                  "type": "string"
                },
                "minItems": 2,
                "title": "Result Ids",
                "type": "array"
              },
              "use_platform_models": {
                "default": false,
                "description": "false (default): every LLM call of this job runs on YOUR model — the job parks each call as a pending request you answer with answer_llm_request; no credits are consumed. true: the job runs on the platform (billed) and, with the model left on auto, on the organization's best model for the task — its highest blended benchmark score under the organization's quality/speed/cost weights, among the models that satisfy the run (attachments, web search, thinking). Naming a platform model also runs the job there, bypassing that pick: do it only when the user named one. Protocol: enricher://docs/llm-delegation.",
                "title": "Use Platform Models",
                "type": "boolean"
              },
              "wait_seconds": {
                "default": 120,
                "description": "Delegated merges only: how long to wait for the first pending request or completion before returning.",
                "maximum": 600,
                "minimum": 0,
                "title": "Wait Seconds",
                "type": "integer"
              }
            },
