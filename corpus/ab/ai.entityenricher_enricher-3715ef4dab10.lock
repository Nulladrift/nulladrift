        {
          "name": "create_database_sync",
          "title": "Create database sync",
          "description": "Register a saved schema for relational synchronization to PostgreSQL, MySQL or SQLite. Requires owner and a sync-enabled plan. Starts a billed classification job when available; returns database ID, classification_job_id or classification_skipped, stamped_keys and registration_notices. The webhook signing secret stays outside the MCP response and can be managed in the web app. The schema is initially unpublished: wait for classification, review keys/options/notices, then publish_schema before any data can sync. pk_strategy locks once the physical model ships. Owned child arrays replace previous membership, so omitted children are deleted on re-enrichment. purge_entity_state transfers custody to replicas; relay custody_warning. A connected host may provision automatically; otherwise get_database_setup_instructions starts browser-confirmed client pairing. Modeling, publication and delivery: enricher://docs/database-sync.",
          "inputSchema": {
            "properties": {
              "dialect": {
                "default": "postgres",
                "description": "SQL dialect the deltas are rendered in: postgres | mysql | sqlite.",
                "title": "Dialect",
                "type": "string"
              },
              "index_scalars": {
                "default": "filterable",
                "description": "none: identity/feed indexes; keys: add natural keys and relation access paths; filterable (default): add dates, search intent, spatial/range roles and entity query indexes; all: every scalar. Later changes queue index migrations.",
                "title": "Index Scalars",
                "type": "string"
              },
              "key_language": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Language of multilingual identity tokens (ISO 639-1), shared by all schemas of this database. Usually defaults to schema language when needed; publication may request it after classification. Locked once chosen for the database.",
                "title": "Key Language"
              },
              "name": {
                "description": "Name of the physical database (existing on the user's server, or created by `ee-database run --create-missing`); shared by every schema linked to this database sync. Also used (snake-cased) as the conventional replica database name by the ee-database CLI.",
                "maxLength": 255,
                "minLength": 1,
                "title": "Name",
                "type": "string"
              },
              "notify_debounce_s": {
                "default": 5,
                "description": "Quiet period (seconds) before a delta-available notification fires: each new delta resets the timer, so a burst is announced once. Default 5 for MCP callers (agent workflows expect near-immediate reaction); the web app defaults to 30 to coalesce human-scale editing bursts.",
                "maximum": 600,
                "minimum": 0,
                "title": "Notify Debounce S",
                "type": "integer"
              },
              "on_gaps": {
                "default": "skip_children",
                "description": "Admission gate — what is written when an enrichment has gaps (non-nullable fields unfilled). 'reject_entity': nothing — one gap anywhere refuses the whole enrichment. 'skip_children' (default): the entity without its incomplete children — an array item is dropped, a shared 1-1 reference is detached (child not written, parent's foreign key NULL); gaps with no such child above them still reject. 'accept_partial': everything — gaps land as NULLs, and under last-write-wins a later partial run erases what an earlier one filled.",
                "title": "On Gaps",
                "type": "string"
              },
              "pattern_index_localized_keys": {
                "default": false,
                "description": "Add per-language pattern-match indexes on indexed localized keys/labels (default false). Useful for prefix autocomplete; increases write/index cost. Concrete SQL depends on the selected dialect.",
                "title": "Pattern Index Localized Keys",
                "type": "boolean"
              },
              "pk_strategy": {
                "default": "surrogate",
                "description": "surrogate (default): physical surrogate IDs with unique schema keys; natural: use schema keys as physical primary keys and restrict later re-keying. Locks once the physical model ships; decide before publication. See enricher://docs/database-sync.",
                "title": "Pk Strategy",
                "type": "string"
              },
              "propagate_not_null": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Mirror required schema fields as SQL NOT NULL. Omitted: on for strict gap policies, off for accept_partial. True with accept_partial is refused. Later tightening requires validating existing replica rows; violations can quarantine the migration.",
                "title": "Propagate Not Null"
              },
              "purge_entity_state": {
                "default": false,
                "description": "Delete fully delivered entity state after every linked database acknowledges it. Transfers custody to replicas, makes server snapshots incomplete and limits duplicate checks. Relay custody_warning and obtain agreement before enabling. Default false.",
                "title": "Purge Entity State",
                "type": "boolean"
              },
              "purge_entity_state_delay_days": {
                "anyOf": [
                  {
                    "maximum": 365,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Grace period for purge_entity_state: a fully-delivered entity row is kept until it has gone this many days without an update, then the hourly purge deletes it. Omit to delete it as soon as every database of the schema acknowledged it.",
                "title": "Purge Entity State Delay Days"
              },
              "purge_on_ack": {
                "default": false,
                "description": "Delete delivered delta copies once acknowledged.",
                "title": "Purge On Ack",
                "type": "boolean"
              },
              "purge_on_ack_delay_days": {
                "anyOf": [
                  {
                    "maximum": 365,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Grace period for purge_on_ack: keep acknowledged delta copies this many days (from acknowledgement) before the hourly purge deletes them. Omit to delete them at acknowledgement. Bounded by the plan's delta retention ceiling.",
                "title": "Purge On Ack Delay Days"
              },
              "schema_id": {
                "description": "Saved schema UUID to connect the database to.",
                "title": "Schema Id",
                "type": "string"
              },
              "target_host": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Sync host (id or name) that should provision and sync this registration automatically (managed ee-database mode). Omitted: auto-assigned when exactly one eligible host is connected; otherwise the response's connected_hosts lists the candidates — relay the choice to the user and call assign_sync_host, or fall back to get_database_setup_instructions for browser-confirmed manual pairing.",
                "title": "Target Host"
              },
              "use_platform_models": {
                "default": false,
                "description": "By default (false) the registration's classification pass runs on YOUR model: its calls come back as pending requests on classification_job_id, to answer with answer_llm_request; no credits are consumed. true runs it on the platform (billed). Protocol: enricher://docs/llm-delegation.",
                "title": "Use Platform Models",
                "type": "boolean"
              }
            },
            "required": ["name", "schema_id"],
            "title": "create_database_syncArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "create_database_syncDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create database sync"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:05a86725f61f17d68239f6c12c394517d16d545f5339d0c92b49a600a1ac44cb"
        },
        {
          "name": "create_schema_from_sample",
          "title": "Create schema from sample",
          "description": "Generate and auto-save a schema from reviewed samples, returning schema_id, schema content and record links. Supply entity_samples (or samples_csv), sample_record_id, or both; explicit samples override stored JSON while attachment inheritance is preserved. Samples must describe one entity type in one language. Generation combines their fields and annotates relationships; it does not redesign the approved structure. Resolve consequential modeling choices and whether to generate semantic IDs before calling; semantic IDs need an organization embedding model and add cost. Requires editor; synchronous and billed. Review returned suggestions before applying edits with property tools. Sample review and canonicalizations: enricher://docs/schema-from-sample; schema format: enricher://docs/schema-reference.",
          "inputSchema": {
            "properties": {
              "attachment_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "UUIDs used as source context and persisted for regeneration. With sample_record_id, omit to inherit its linked attachments; pass [] to deliberately use none, or a non-empty list to override.",
                "title": "Attachment Ids"
              },
              "entity_samples": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "1..20 reviewed instances of one entity type. Required without sample_record_id. Explicit samples override stored JSON while keeping attachment inheritance. Fields are unioned; missing/null observations become nullable. Use consistent names across samples and array items. Single-language data only; set multilingual flags after generation with update_schema_property.",
                "title": "Entity Samples"
              },
              "generate_semantic_ids": {
                "default": false,
                "description": "Add semantic IDs to eligible keyed objects. Requires an organization embedding model and adds resolution cost. Recommend for reusable identities without stable machine keys; obtain agreement before enabling unless already authorized. Defaults false. Modeling guidance: enricher://docs/schema-from-sample.",
                "title": "Generate Semantic Ids",
                "type": "boolean"
              },
              "language": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Language of schema type names/descriptions and annotations; defaults to the sample-key language. Sample property names are not translated. Separate from enrichment output languages.",
                "title": "Language"
              },
              "model": {
                "default": "auto",
                "description": "Model composite key; leave it on auto (the default). auto is YOUR model, or with use_platform_models=true the organization's best model for this task from its benchmark scores (quality/speed/cost weights), within the run's constraints (attachments, web search, thinking) — the result reports the pick as model_selection. Name a provider::model only when the user named one; that runs the job on the platform (billed). Keys: list_models.",
                "title": "Model",
                "type": "string"
              },
              "reasoning_effort": {
                "anyOf": [
                  {
                    "enum": ["low", "medium", "high"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Thinking (reasoning) opt-in: low, medium or high; omitted = off. On the platform, auto then picks only a model whose reasoning the platform can pilot, and the effort is translated per provider. On YOUR model, apply the effort yourself when you run the requests.",
                "title": "Reasoning Effort"
              },
              "sample_record_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "UUID of a successful sample_generation record. Its stored sample(s) are used when entity_samples is omitted, and its linked attachments are inherited when attachment_ids is omitted.",
                "title": "Sample Record Id"
              },
              "samples_csv": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Samples as CSV text instead of entity_samples (never both): the first row is ALWAYS the header, each data row one sample. Delimiter ',', ';' or tab; headers become identifier keys ('Author Name' -> author_name); each column gets one type (integer, number, boolean or text; empty cell = null; decimal commas read in ';'/tab text). Over 20 rows, 20 are kept, covering every column. Read the result's csv_import and relay the kept rows and renamed headers.",
                "title": "Samples Csv"
              },
              "timeout_seconds": {
                "default": 300,
                "description": "Wall-clock cap; returns a timeout error past this.",
                "maximum": 900,
                "minimum": 10,
                "title": "Timeout Seconds",
                "type": "integer"
              },
              "use_platform_models": {
                "default": false,
                "description": "false (default): every LLM call of this job runs on YOUR model — the job parks each call as a pending request you answer with answer_llm_request; no credits are consumed. true: the job runs on the platform (billed) and, with the model left on auto, on the organization's best model for the task — its highest blended benchmark score under the organization's quality/speed/cost weights, among the models that satisfy the run (attachments, web search, thinking). Naming a platform model also runs the job there, bypassing that pick: do it only when the user named one. Protocol: enricher://docs/llm-delegation.",
                "title": "Use Platform Models",
                "type": "boolean"
              }
            },
            "title": "create_schema_from_sampleArguments",
            "type": "object"
