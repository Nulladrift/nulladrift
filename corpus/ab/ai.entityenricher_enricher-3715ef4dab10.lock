        {
          "name": "create_benchmark_scenario",
          "title": "Create benchmark scenario",
          "description": "Create a reusable benchmark with a mandatory scoring judge. scenario_type='enrichment' needs schema_id and entity_data (the entity to enrich, as enrich_entity takes it — refused when it carries no value; never put it in description); 'sample_generation' needs sample_request; 'schema_generation' needs entity_samples (1..20 samples of one entity type). Enrichment and schema generation need a verified gold reference via set_benchmark_reference before running. Sample generation is rubric-scored and takes no reference. Requires owner and a plan with benchmarks; creating the scenario does not run the models. Returns the scenario and link. Next call run_benchmark when its reference requirements are satisfied. See enricher://docs/model-benchmark.",
          "inputSchema": {
            "properties": {
              "attachment_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Attachment UUIDs included in every run.",
                "title": "Attachment Ids"
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Free-text note shown in the Benchmarks tab; no model ever reads it. The entity to enrich goes in entity_data, never here.",
                "title": "Description"
              },
              "enable_web_search": {
                "default": false,
                "description": "sample_generation: ground values with the model's web search.",
                "title": "Enable Web Search",
                "type": "boolean"
              },
              "entity_data": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Enrichment (required there): the fixed entity input every model enriches — the same JSON enrich_entity takes. Read get_schema.input_contract first: identifying fields, preserve paths and keys for supplied array items. Refused when it carries no value.",
                "title": "Entity Data"
              },
              "entity_samples": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "schema_generation: the 1..20 fixed input samples (JSON objects of one entity type) every model converts to a schema. Several samples let the scoring read evidence the reference cannot state alone (nullable, types, identity).",
                "title": "Entity Samples"
              },
              "generate_semantic_ids": {
                "default": false,
                "description": "schema_generation: add semantic_id properties to keyed objects.",
                "title": "Generate Semantic Ids",
                "type": "boolean"
              },
              "language": {
                "default": "en",
                "description": "sample_generation: output language for names + values.",
                "title": "Language",
                "type": "string"
              },
              "languages": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Enrichment: defaults to ['en'].",
                "title": "Languages"
              },
              "name": {
                "maxLength": 255,
                "minLength": 1,
                "title": "Name",
                "type": "string"
              },
              "naming_convention": {
                "default": "auto",
                "description": "sample_generation: auto | snake_case | camelCase.",
                "title": "Naming Convention",
                "type": "string"
              },
              "repetitions": {
                "default": 2,
                "description": "Run each model N times per run; keeps mean + consistency spread.",
                "maximum": 3,
                "minimum": 1,
                "title": "Repetitions",
                "type": "integer"
              },
              "sample_request": {
                "anyOf": [
                  {
                    "maxLength": 4000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "sample_generation: the free-text sample request every model answers — the kind of entity, what the sample must contain, any budget or structural preference (same contract as generate_sample's request).",
                "title": "Sample Request"
              },
              "scenario_type": {
                "default": "enrichment",
                "description": "enrichment | sample_generation | schema_generation (immutable).",
                "title": "Scenario Type",
                "type": "string"
              },
              "schema_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "UUID of the saved schema to enrich against (enrichment only, required there).",
                "title": "Schema Id"
              },
              "scoring_judge_model_key": {
                "description": "LLM judge composite key used to score results (required).",
                "title": "Scoring Judge Model Key",
                "type": "string"
              },
              "strategy": {
                "default": "single_pass",
                "description": "Enrichment: pinned strategy (no 'auto'): single_pass | expert_domains | multi_expertise",
                "title": "Strategy",
                "type": "string"
              },
              "typical_object": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "sample_generation: a specific instance to model (e.g. 'Serena Williams').",
                "title": "Typical Object"
              }
            },
            "required": ["name", "scoring_judge_model_key"],
            "title": "create_benchmark_scenarioArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "create_benchmark_scenarioDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create benchmark scenario"
          },
