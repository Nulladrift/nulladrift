        {
          "name": "delete_benchmark_scenario",
          "title": "Delete benchmark scenario",
          "description": "Delete a benchmark scenario and its stored results. Requires owner and a plan with benchmarks. No LLM call; inspect the scenario before deleting it.",
          "inputSchema": {
