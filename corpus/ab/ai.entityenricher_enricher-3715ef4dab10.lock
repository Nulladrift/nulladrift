        {
          "name": "get_job_status",
          "title": "Get job status",
          "description": "Read a job's status, progress and compact terminal summary with persisted record IDs. Status is pending, running, paused, completed, failed or cancelled. Relay pause questions with answer_job_question; answer a delegated job's llm_requests with answer_llm_request. include_result=true returns full terminal details; batch summaries count entities and database outcomes. A failed job is not usable output; inspect individual records for partial recovery. Unknown IDs may be invalid, expired or lost after restart: look for persisted outputs with list_records(job_id=...), without assuming success. events_after=<seq> adds the job's event log past that cursor (per-model completions, scoring progress, pauses) — the poll equivalent of the SSE stream; pass the returned last_seq next time. On a delegated job, llm_requests lists the pending model calls: the first complete, the rest as envelopes; llm_request_id=<id> returns that one complete. No LLM call. Polling, failure and recovery guidance: enricher://docs/enrichment-and-fusion.",
          "inputSchema": {
            "properties": {
              "events_after": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Event-log cursor: 0 returns the job's events from the start, a previous call's last_seq returns only the newer ones (at most 100 per call; events_has_more says when to call again). Omit to skip the log.",
                "title": "Events After"
              },
              "include_result": {
                "default": false,
                "description": "Include the full terminal result payload (can be large). Default returns a compact scalar summary per model.",
                "title": "Include Result",
                "type": "boolean"
              },
              "job_id": {
                "description": "Job ID returned by a start tool.",
                "title": "Job Id",
                "type": "string"
              },
              "llm_request_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "On a job delegating its LLM calls: return this pending request complete (messages, systemPrompt, tools, toolChoice, attachments) as the only entry of llm_requests. request_not_pending when it is no longer waiting.",
                "title": "Llm Request Id"
              }
            },
            "required": ["job_id"],
            "title": "get_job_statusArguments",
