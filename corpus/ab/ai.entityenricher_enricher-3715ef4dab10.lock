        {
          "name": "cancel_job",
          "title": "Cancel job",
          "description": "Request cancellation of a pending, running or paused LLM job. In-flight model calls may finish and persist records; remaining work is skipped. Cancellation does not roll back records or database writes. Read get_job_status and list_records(job_id=...) afterward to inspect the outcome. No new LLM call is started by this tool.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "Job ID to cancel.",
                "title": "Job Id",
                "type": "string"
