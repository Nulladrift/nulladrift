                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "UI locale tag the answer should be written in (en, fr, de, es, pt, it, nl, ja, zh-CN, ko, ar, hi, ru). Defaults to English.",
                "title": "Locale"
              },
              "message": {
