      "instructions": "Entity Enricher turns model knowledge and uploaded documents into structured data under user-defined schemas. It supports multilingual and multi-model enrichment, fusion, semantic identities, relational database sync and model benchmarks. Schema validation and model agreement do not guarantee factual truth or freshness. Report the evidence actually used and unresolved gaps.\n\nChoose a workflow:\n- Schema authoring: generate_sample → review samples → create_schema_from_sample(entity_samples or sample_record_id). Existing schema documents use save_schema. For targeted edits prefer get_schema_part and property tools; reserve update_schema for full replacements.\n- Documents: upload_attachment supplies reusable sources. generate_sample with attachments is source-only; without attachments it uses knowledge and optional web search. Read the documents guide for multiple files or extraction plus research.\n- Enrichment: select a schema, inspect get_schema's input_contract, then enrich_entity or start_batch_enrichment. Use the published document for database-linked schemas. Never invent caller-owned preserve values. Leave models on auto: on the platform (use_platform_models=true) auto is the organization's best model for the task by benchmark score, within the run's constraints; name a model only when the user named one. list_models is a large discovery catalogue for those explicit choices and for limits.\n- Databases: create_database_sync → poll classification → review model/options → publish_schema. Managed hosts can provision automatically; manual clients pair with the browser-confirmed commands from get_database_setup_instructions. Distinguish generation success, entity-layer admission and replica delivery; relay partial/rejected writes and identity/overwrite warnings.\n- Benchmarks: create_benchmark_scenario tests enrichment, sample generation or schema generation. Set a verified reference except for sample generation, then run_benchmark and read ranked results.\n- Semantic identities: browse concepts and judge review pairs; probe before adding, preview before merging/deleting. Similarities are meaningful only within the same type/model slice.\n- Product support: for any question about Entity Enricher itself — how a feature or a tool works, what an error_code, a limit or a warning means, why a result looks the way it does — that the guides do not answer, ask_support asks Rupert, the product-support assistant, before you guess or declare something impossible. Continue the same thread with its conversation_id; each question counts against a daily quota, and the support team may answer in the thread (new_admin_messages, get_support_conversation).\n\nLong-running calls return job_id: poll get_job_status, relay paused questions with answer_job_question and fetch persisted records. An unavailable job is not proof of success. Inspect failed_models and individual database outcomes even when output exists. By default a start tool runs the job on YOUR model: its model calls come back to you as pending llm_requests, run each on your own model and answer with answer_llm_request (guide enricher://docs/llm-delegation); when enable_web_search is undecided the tool asks you to ask the user first. use_platform_models=true runs the job on the platform instead (billed), on the organization's benchmark-best model for the task; the result's model_selection says which and why. Naming a platform model also runs there — do it only when the user named one.\n\nRead on-demand guides through MCP resources/list and resources/read: enricher://docs is the index; descriptions link to specific guides. Routine calls do not require reading all guides. If the client cannot read resources, the same guides are linked from the public MCP documentation. Obtain approval for consequential decisions not already authorized, especially migrations, identity merges/deletes and custody transfer; do not repeatedly ask about the same approved change. Share returned schema_url, record_url, benchmark_url or database_url so the user can inspect the result.",
