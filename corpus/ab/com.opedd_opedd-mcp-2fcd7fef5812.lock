          "title": "Export a licence order's articles",
          "description": "Bulk-export the articles in a licence order you hold. Returns up to 1000 articles per call (collected from line-delimited JSON wire format). Same content contract as list_feed: full text for AI training orders only; every other order exports metadata (content_body null); get_content returns article text. Each exported article is recorded for analytics; a bulk export is not billed per article. `since` (ISO 8601) returns a delta feed; `cursor` pages beyond 1000. Backend supports 5000 articles per call; the MCP cap is 1000 for transport reasonability. For bulk-ingest pipelines, the Python SDK (pip install opedd) reads the same feed without the MCP cap. Credentials as list_feed: OPEDD_ACCESS_KEY (ent_*) OR your buyer API key + order_id.",
