        {
          "name": "list_feed",
          "title": "List a licence order's articles",
          "description": "List the articles in a licence order you hold. Content contract: AI training orders include full content_body for the back catalogue up to the order date (content_access 'included'). Every other order is discovery-only (content_body null): an AI answers subscription lists its publishers' whole catalogue and fetches text per article via get_content (content_access 'retrieval_per_article'); pay-per-request fetches billed snippets via get_content (content_access 'metered_per_call'). Returns JSON-format response with paginated articles. Use `since` (ISO 8601) for delta-feed polling — only articles published after the timestamp. Use `cursor` for pagination across pages. Credentials: the order's enterprise access key (OPEDD_ACCESS_KEY, ent_*) OR your buyer API key (OPEDD_BUYER_TOKEN) with order_id — if your account holds exactly one active order, order_id may be omitted; with several, the error lists them. stream_feed_ndjson returns up to 1000 articles per call (200 here).",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "Opaque cursor from the prior response's data.pagination.next_cursor",
                "type": "string"
              },
              "limit": {
                "description": "Max articles per response (default: 50, max: 200)",
                "type": "number"
              },
              "order_id": {
                "description": "The licence order to list (UUID, from list_licence_orders). Used with a buyer API key; ignored with an ent_* key.",
                "type": "string"
              },
              "since": {
                "description": "ISO 8601 timestamp — return only articles with published_at > since",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
