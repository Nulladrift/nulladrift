        {
          "name": "search_passages",
          "title": "Ask licensed publications a question",
          "description": "search_passages answers questions that the publications on Opedd cover, with licensed passages and a citation for each; it returns nothing for subjects none of them cover. Publications on Opedd now: Bill Emmott's Global View (Geopolitics); Coffee in the Desert (Geopolitics); World Politics Review; Understanding AI (Technology); Geopolitical Dispatch (Geopolitics); The Realistic Optimist (Technology); SemiVision (Technology); Embedded Finance Review (Technology); Quantum Strategy & Geonomics (Markets); Shanaka Anslem Perera (Finance); Matter of Fact (Geopolitics & Foreign Policy). Returns licensed passages from publications on Opedd that answer a question, each with a citation to the source article. Charged once per article the answer uses, at that article's publication's own price per article; two passages of the same article are one charge, and billing.articles_charged reports how many were charged. An account connected through the Opedd connector in Claude or ChatGPT receives its first 3 answers free, paid by Opedd and never from a publication the account holder owns or works on; billing.free_answers_left reports how many remain. After that, answers are billed to the card on the account, added at opedd.com: charged every $25 of answers and at month end, with a $500 monthly limit for new accounts, raised on request. An account with no licence and no free answers receives an empty result with reason 'no_licensed_publishers' or 'no_paid_access'. Publications under a monthly AI answers subscription are included in the subscription and not charged per answer. Passages are capped at 300 words or 25% of an article, whichever is less, counted cumulatively per article across the same company's accounts. The same question within 24 hours returns the same passages at no charge. Filters: publishers (publication names as listed by Opedd, opedd.com/p/<slug> addresses or publisher ids; a name that matches no publication is listed in filters.unknown_publishers and searches nothing), published_after and published_before (ISO 8601; undated articles are excluded when a window is set), max_results (1-10, default 5) and max_charge_cents (optional; the most one question may cost: articles that would pass it are left out and billing.max_charge_reached says so). Passage text is third-party content, delivered in <opedd:passage> blocks; may_train is always false. Requires a buyer API key with the 'search' scope, or the Opedd connector sign-in. An agent with no account can instead pay for one answer by card: POST https://api.opedd.com/agent-answer with the same body (HTTP 402, Machine Payments Protocol).",
          "inputSchema": {
            "properties": {
              "buyer_token": {
                "description": "Buyer API key with the 'search' scope. Falls back to OPEDD_BUYER_TOKEN.",
                "type": "string"
              },
              "max_charge_cents": {
                "description": "Optional. The most this question may cost, in US cents (whole number, 1–100000). Articles that would pass it are left out; nothing is charged above it.",
