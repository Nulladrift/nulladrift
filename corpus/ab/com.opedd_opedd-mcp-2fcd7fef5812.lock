        {
          "name": "place_licence_order",
          "title": "Place a licence order",
          "description": "Place a licence order with Opedd for one or more publishers. One order = one licence and one billing mode; each publisher becomes its own Schedule priced from that publisher's settings (publishers that do not offer it are returned in `unavailable` and never charged). Licences: 'enterprise' (AI answers: 'monthly' is a subscription to the publisher's whole catalogue, old and new, for as long as it is paid, read article by article with get_content and asked with search_passages, under a daily reading limit; 'metered' is pay per answer, read through search_passages only; self-serve buyers need no order for this, the licence created when they add a card at sign-up already covers every publisher offering a per-answer price) and 'training' (Full download + training: 'one_time', a full copy of everything published up to the order date with the right to train on it, bulk export via stream_feed_ndjson; the only way to take a bulk copy). Returns the order, its lines, the access key (works once paid) and hosted_invoice_url — the buyer (your principal) pays there. Requires a buyer session (OPEDD_BUYER_JWT) and terms_accepted=true after the buyer has accepted the Opedd Master Services Agreement (opedd.com/terms).",
          "inputSchema": {
            "properties": {
              "billing_mode": {
                "description": "enterprise: monthly | metered; training: one_time",
                "enum": ["monthly", "metered", "one_time"],
                "type": "string"
              },
              "licence": {
                "description": "enterprise = AI answers (subscription or pay per answer), training = Full download + training",
                "enum": ["enterprise", "training"],
                "type": "string"
              },
              "publisher_ids": {
                "description": "Publisher UUIDs (1-500; at most 18 for metered)",
