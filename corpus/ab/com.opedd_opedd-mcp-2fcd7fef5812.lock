      "instructions": "Opedd provides licensed passages, with citations, from independent publications and research firms. search_passages answers questions that the publications on Opedd cover, with licensed passages and a citation for each; it returns nothing for subjects none of them cover.\n\nPublications on Opedd now:\n- Bill Emmott's Global View (Geopolitics): Analysis and commentary on world events, current affairs and ideas from a former editor-in-chief of The Economist with a special addiction to Japan and Italy\n- Coffee in the Desert (Geopolitics): Dispatches from the intersection of the Middle East, China, and international order\n- World Politics Review: World Politics Review publishes in-depth news and expert analysis on global affairs to help our readers identify and make sense of the events and trends…\n- Understanding AI (Technology): Exploring how AI works and how it's changing our world.\n- Geopolitical Dispatch (Geopolitics): Independent analysis of international affairs, written by former diplomats. Five concise analyses each weekday, with historical perspective, clear judgments…\n- The Realistic Optimist (Technology): Exclusive, written interviews with founders & VCs around the world, focusing on emerging markets (Africa, MENA, Asia, LatAm).\n- SemiVision (Technology): SemiVision is a semiconductor industry research institution committed to transforming analysis into vision through comprehensive insights into the…\n- Embedded Finance Review (Technology): Newsletter, podcast and events on Embedded Finance in Europe: How brands launch embedded payments, banking and lending, and the enablers behind them.\n- Quantum Strategy & Geonomics (Markets): Quantum Strategy is a Singapore-based macro-geopolitical research firm, founded by David Roche, that helps asset managers, asset owners, family offices and…\n- Shanaka Anslem Perera (Finance): Writing about money, tech, AI, science, physics, politics & the messy world we live in. Bitcoin included. Just trying to understand reality a bit better.\n- Matter of Fact (Geopolitics & Foreign Policy): Expert analysis on geopolitics, foreign policy, and the intersection of technology and global power dynamics.\n\nFor developers: Opedd is content licensing for the AI era, between expert publishers and AI products: discover, license, verify and retrieve rights-cleared expert content — a verifiable licence for every use, a public record on Tempo, and compliance artifacts (audit ledger and dossiers). A licensed alternative to unlicensed scraping for RAG, AI search and training corpora.\n\nNo credentials needed: lookup_content, publisher_directory, verify_license, browse_registry, rsl_get, detect_platform, request_publication.\nBuyer tools (licence orders, account, audit/compliance): free buyer signup at https://opedd.com/buyer/signup (~2 min; an API key is issued instantly). Publisher tools (content push): free publisher signup at https://opedd.com, key under Settings → For developers.\nSupply credentials as env vars (local/stdio) or an Authorization: Bearer header (hosted gateway, https://mcp.opedd.com/mcp).\nEU CDSM Art. 4(3) / TDM-reservation queries: rsl_get. Compliance evidence: get_compliance_dossier. Docs: https://docs.opedd.com",
