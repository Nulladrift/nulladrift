        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Leave Hacker (https://leavehacker.app) works out which days of annual leave to book around public holidays and weekends to get the most days off in a row, plans a whole leave year, and finds cheap flights that fit a break. It's the same planning logic as the Leave Hacker iPhone app. UK bank holidays come from gov.uk (Open Government Licence v3.0); Ireland's, each Australian state's and the US federal holidays from Leave Hacker's checked copy of the official lists (2026–2028); other countries' public holidays from Nager.Date.\n\nHow to use the tools well:\n- Ask or infer the person's region first. In the UK there are three sets of bank holidays: england-and-wales, scotland and northern-ireland. In Australia public holidays depend on the state or territory: pass AU-NSW, AU-VIC, AU-QLD, AU-WA, AU-SA, AU-TAS, AU-ACT or AU-NT. Ireland is IE. Elsewhere, pass a two-letter country code (US, DE...).\n- In the US, private employers choose which holidays they give: ask, and pass us_holidays (common = the usual six, federal = all 11, or custom with us_holiday_ids). Say \"PTO\" for leave there. In Ireland and Australia full-time workers get at least 20 days (four weeks) on top of public holidays.\n- In Ireland a public holiday at a weekend isn't moved. If the person gets the next working day off instead (ask; many employers give it), pass next_working_day_off: true.\n- \"Which days should I book around Easter / Christmas / the May bank holiday?\" → best_days_to_book (use the holiday filter). It lists \"book N days, get M off\" options per holiday.\n- \"Plan my year\" / \"I have 28 days of leave\" → plan_leave_year. Ask for their allowance, days already used, when their leave year starts (often January or April) and whether school holidays matter (school: parent or staff). Use year: next for next leave year.\n- When school holidays matter in the UK, ask which council the school is in (a town, county or the first half of the postcode is enough) and pass it as council to plan_leave_year, best_days_to_book (with school: parent) or get_school_holidays. Leave Hacker has the published term dates of over 100 councils, each checked against the council's own page; for school years a council hasn't published, and without a council, the tools use typical dates and say so.\n- \"Find flights for that break\" → find_trips with a departure airport (MAN, LGW, LON...) and the break's first and last day. Fares are cached and may change; when the result says sample, they are example prices only. The links are affiliate links: say that Leave Hacker may earn a commission.\n- \"How do I ask my manager?\" → leave_request_message with the dates to book.\n- get_bank_holidays and get_school_holidays list dates. Say whose school dates they are: a council's published dates (give its source link and when it was checked) or TYPICAL dates, which aren't official. Academies, church and independent schools can set their own, so tell people to check their school's.\nAlways show dates with the weekday (the tools give labels like \"Fri 26 Mar 2027\"), say which region the answer is for, and credit gov.uk for UK bank holidays. Breaks count every day off from first to last, weekends included. The tools only need regions, dates, numbers, airport codes and a council or the first half of a postcode: never send names, employers, schools' names, full addresses or calendar details. Nothing is stored.",
      "tools": [
        {
          "name": "best_days_to_book",
          "title": "Best days to book",
          "description": "Find the days of annual leave to book around each public holiday (or cluster, such as Christmas and New Year) to get the most days off in a row: \"book 4 days, get 10 off\" options, cheapest first, with the exact dates. Use for \"Which days should I book around Easter 2027 in Scotland?\". Filter by holiday name (Easter, Christmas, Early May, Spring, Summer, St Patrick...). Past days are skipped. For parents in the UK, school: parent keeps leave inside the school holidays, using the council's published term dates when you pass council.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "council": {
                "description": "With school: parent. The UK council whose term dates the school follows: its name (\"Surrey\", \"Edinburgh\"), its id (\"surrey\", \"city-of-edinburgh\") or the first half of a postcode (\"GU1\", \"EH1\"), looked up in Leave Hacker's own copy of the ONS list. Send only the first half of a postcode, not the full one.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "from": {
                "description": "Start of a date range, instead of year (yyyy-MM-dd).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "holiday": {
                "description": "Only holidays whose name contains this, e.g. \"Easter\", \"Christmas\", \"May\".",
                "maxLength": 60,
                "type": "string"
              },
              "max_leave_days": {
                "default": 9,
                "description": "Most days of leave for one break. Default 9.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "next_working_day_off": {
                "description": "Ireland only: true if the person's employer gives the next working day off when a public holiday falls on a Saturday or Sunday (the civil service and banks do; Irish law doesn't require it, so the employer may give a day within a month, an extra day's leave or a day's pay instead). Adds those days, e.g. Mon 27 and Tue 28 Dec 2027. Default false.",
                "type": "boolean"
              },
              "region": {
                "description": "Where the person works: england-and-wales, scotland or northern-ireland for UK bank holidays (from gov.uk); IE for Ireland; an Australian state or territory as AU-NSW, AU-VIC, AU-QLD, AU-WA, AU-SA, AU-TAS, AU-ACT or AU-NT (their public holidays differ a lot); US for US federal holidays; or a two-letter ISO 3166-1 country code such as DE or FR for other countries' public holidays (from Nager.Date). Defaults to england-and-wales, or to the council's nation when council is given.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "school": {
                "default": "none",
                "description": "none (default); parent: children at school, so leave is only booked in the school holidays. UK only. School staff can't book leave in term: use plan_leave_year with school: staff.",
                "enum": ["none", "parent"],
                "type": "string"
              },
              "to": {
                "description": "End of the date range, inclusive (yyyy-MM-dd).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "us_holiday_ids": {
                "description": "US only, with us_holidays: custom. Any of: new-years-day, mlk-day, washingtons-birthday, memorial-day, juneteenth, independence-day, labor-day, columbus-day, veterans-day, thanksgiving, day-after-thanksgiving, christmas-day (day-after-thanksgiving isn't federal, but many employers give it).",
                "items": {
                  "enum": ["new-years-day", "mlk-day", "washingtons-birthday", "memorial-day", "juneteenth", "independence-day", "labor-day", "columbus-day", "veterans-day", "thanksgiving", "day-after-thanksgiving", "christmas-day"],
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "us_holidays": {
                "default": "federal",
                "description": "US only: which holidays the person's employer gives. Private employers choose: common = the usual six (New Year's Day, Memorial Day, Independence Day, Labor Day, Thanksgiving, Christmas); federal = all 11 federal holidays; custom = the ones in us_holiday_ids. Default here: federal, to show every option.",
                "enum": ["common", "federal", "custom"],
                "type": "string"
              },
              "workdays": {
                "description": "Days the person works, e.g. [\"mon\",\"tue\",\"wed\",\"thu\"] for a four-day week. Defaults to Monday to Friday.",
                "items": {
                  "enum": ["mon", "tue", "wed", "thu", "fri", "sat", "sun"],
                  "type": "string"
                },
                "maxItems": 7,
                "minItems": 1,
                "type": "array"
              },
              "year": {
                "description": "Calendar year, e.g. 2027. Defaults to this year.",
                "maximum": 2100,
                "minimum": 2019,
                "type": "integer"
              }
            },
            "type": "object"
          },
