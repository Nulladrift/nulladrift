      "serverInfo": {
        "name": "leave-hacker",
        "title": "Leave Hacker",
        "version": "1.1.0",
        "description": "Which days of annual leave to book around bank holidays for the most days off, whole-year leave plans and cheap flights that fit.",
        "websiteUrl": "https://leavehacker.app/mcp-server",
        "icons": [
          {
            "src": "https://leavehacker.app/icon.png",
            "mimeType": "image/png",
            "sizes": ["1024x1024"]
          }
        ]
      },
