        {
          "name": "find_trips",
          "title": "Find cheap flights for a break",
          "description": "Find the cheapest return flights from a departure airport that fit a break, one per destination, cheapest first, with booking links. Prices are cached airline fares in the departure country's currency (GBP, EUR, AUD or USD) and can change; if the result says sample, they are example prices only. Links go through leavehacker.app/go and are affiliate links: Leave Hacker may earn a commission if you book, at no extra cost to you. Say so when you share them. Use for \"Find cheap flights from Manchester that fit the May bank holiday weekend\" (work out the break's dates with best_days_to_book first).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "depart": {
                "description": "Outbound date, the first day of the break (yyyy-MM-dd).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many destinations to return, up to 20. Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "origin": {
                "description": "Departure airport or city IATA code, e.g. MAN (Manchester), LGW (Gatwick), EDI (Edinburgh), BHX, LON (all London airports).",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "return": {
                "description": "Return date, the last day of the break (yyyy-MM-dd).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["depart", "origin", "return"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "affiliate": {
                "const": true,
                "type": "boolean"
              },
              "currency": {
                "description": "ISO 4217: GBP from the UK, EUR from Ireland, AUD from Australia, USD from the US",
                "type": "string"
              },
              "depart": {
                "additionalProperties": false,
                "properties": {
                  "date": {
                    "description": "yyyy-MM-dd",
                    "type": "string"
                  },
                  "label": {
                    "description": "e.g. \"Fri 26 Mar 2027\"",
                    "type": "string"
                  }
                },
                "required": ["date", "label"],
                "type": "object"
              },
              "disclosure": {
                "type": "string"
              },
              "fares": {
