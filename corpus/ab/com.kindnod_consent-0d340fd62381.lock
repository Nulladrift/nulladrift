{
  "lockfileVersion": 2,
  "subjects": {
    "com.kindnod/consent": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kindnod.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "shortbread",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_install",
          "title": "Check whether Shortbread is live on a domain",
          "description": "Fetches the live homepage and reports whether the Shortbread tag is present, whether a Cookiebot tag is still there, and whether the site is claimed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:166be5a82050b2394c43ce329377ba6b0efe764b4a8a15e517dd0afc61eff4c0"
        },
        {
          "name": "compare_cookiebot_cost",
          "title": "Compare a site's consent tool price with Shortbread",
          "description": "Scans the site, detects its consent tool (Cookiebot, iubenda, CookieYes, Termly, Cookie Script, Complianz, or others), maps the page count to that vendor's list tier, and returns the annual cost next to Shortbread's flat price. Sites with no consent tool get Cookiebot as the reference. The `incumbent.basis` field states the assumption behind the number.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domains": {
                "description": "How many domains the account runs; agencies get a different Cookiebot tier",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:043d60c0fbbf18ec852a26cdf1841fdc70033411088f3555a8ef2e378c8699f6"
        },
        {
          "name": "get_snippet",
          "title": "Get the Shortbread install snippet",
          "description": "Returns the keyless install snippet (works for any public domain with no setup) and the npm usage for React/Next.js. Use provision_site instead when you want a site key and a claim link now.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "owner": {
                "description": "Site owner's email to put on the tag so they get the claim link",
                "type": "string"
              },
              "via": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6f108cd906aadbf1ccf94e115774eb43c8fc82efbe15dcd560efe0847f5bddb4"
        },
        {
          "name": "provision_site",
          "title": "Create a Shortbread site and get the install snippet",
          "description": "Creates (or finds) a free Shortbread consent-banner site for a domain and returns the script tag to add before </head>, plus a claim URL the site owner uses to take over the dashboard. No account needed. Idempotent per domain. Pass the owner's email so the claim link is emailed to them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Public hostname, e.g. example.com (no localhost)",
                "type": "string"
              },
              "owner": {
                "description": "Site owner's email; Shortbread emails the claim link",
                "type": "string"
              },
              "via": {
                "description": "Which tool is installing, e.g. claude-code, cursor, codex. Defaults to mcp",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2049e681bd021b25d4050c224da8130c79241f4f444609ca69bcf78166238108"
        },
        {
          "name": "scan_site",
          "title": "Scan a site for cookies and its current consent tool",
          "description": "Fetches the homepage and a few internal pages, detects the platform, the current consent banner (Cookiebot, CookieYes, OneTrust…), tracking tools, and drafts a cookie declaration. Also counts pages from the sitemap.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Site URL or domain",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:04ee00af6df1317741c9f2f5df94a4d9f0239d0d1dd4b7e29ef67230ee7c7404"
        }
      ],
      "digest": "sha256:60089f2acac80c27b1e51af8eb370a3ca05d8d155e3223e3a7aed6bfb909edf1"
    }
  }
}
