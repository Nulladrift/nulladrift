      "serverInfo": {
        "name": "eurc402",
        "title": "eurc402 — EU compliance (VAT + company data)",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "eurc402 provides EURC-priced, EU-sovereign compliance data for agents. `validate_eu_vat` is FREE (official VIES, all 27 EU member states). `lookup_eu_company` detects a company's jurisdiction for free and returns how to fetch the FULL normalized record (name, status, legal form + ELF code, address, officers across 10 EU registers) via the paid x402 endpoint — payable per call in EURC or USDC on Base, no signup.",
      "tools": [
        {
          "name": "list_supported_countries",
          "title": "List supported EU registers",
          "description": "List the EU company registers currently covered by lookup_eu_company / the paid eu-company endpoint, with each register's country, source, licence, whether officers are returned, and the identifier format. FREE. Call this to discover coverage before paying.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:15d598aa22815d839a9a88f0c39dfa2d37ec5c73db9c34db2bb88fbbd13e832e"
        },
        {
          "name": "lookup_eu_company",
          "title": "Look up an EU company (paid full record)",
          "description": "Detect the jurisdiction of a company registration number for FREE across 10 EU registers (no, fr, fi, sk, gb, lv, ro, ee, cz, pl). The FULL normalized record (legal name, status, legal form, registered address, incorporation date, officers, provenance) is a PAID x402 service (EUR 0.05/call in EURC or USDC on Base) — this tool returns the exact paid endpoint, price, and how to pay.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional ISO country code to disambiguate; otherwise auto-detected from the id.",
                "type": "string"
              },
              "id": {
                "description": "Company/registration number: SIREN (FR), org.nr (NO), Y-tunnus (FI), IČO (SK), company number (UK), regcode (LV), CUI or J-number (RO).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:416ad7aab4102e926224507cd6000c51cb145b0bbf23acee02a1c8c7d172bd27"
        },
        {
          "name": "validate_eu_vat",
          "title": "Validate EU VAT number (VIES)",
          "description": "Validate an EU VAT number against the official EU VIES registry. FREE. Returns whether the number is currently valid and, when the member state discloses it, the registered company name and address. Covers all 27 EU member states.",
          "inputSchema": {
            "properties": {
              "vat": {
                "description": "EU VAT number: 2-letter country code + number, e.g. IT08714440016.",
                "type": "string"
              }
            },
            "required": ["vat"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d37cf8f64377e23351a582c0f8f943c302bce4e4952360307304c220b8fc759c"
        }
      ],
      "digest": "sha256:1b3f18b4b57768b4510cf294b1f41678fce4b3b5494a6e45aa3a6e1a79ed0adb"
    }
  }
