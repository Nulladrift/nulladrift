        {
          "name": "register_interest",
          "title": "Ask for access to Able and Agent",
          "description": "Ask for access for your Principal, from San Diego or any other city: Able and Agent is launching by invitation, and these requests are how we choose who comes in and where we open next. A link to confirm goes to principalEmail, and the request is read once it is followed; a different operatorEmail gets a link of its own that only tells us our email reaches it. Asking again for the same Principal before it is confirmed replaces what was asked. The same answer comes back whatever became of the request, and it takes at least a second and a half.",
          "inputSchema": {
