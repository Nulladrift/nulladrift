        {
          "name": "search_inventory",
          "title": "Search Dealer-Direct New, Used & Classic/Collector Car Inventory",
          "description": "Search live New, Used, Certified Pre-Owned, and Classic/Collector car inventory across participating US franchise dealerships, 20+ specialist classic & collector showrooms (Streetside Classics, Classic Auto Mall, GR Auto Gallery, RK Motors, Vanguard Motor Sales, Volo Auto Museum, Worldwide Vintage Autos, Fleming's Ultimate Garage, DriverSource, Park Place LTD, Hagerty Classifieds), and live collector auctions (Bring a Trailer & Hagerty Marketplace). Supports natural free-text query (e.g., '427 4-speed', 'Coyote restomod', 'Slant Nose', 'numbers-matching'), classic_only, era ('pre_war', '1950s', '1960s', '1970s', '1980s', '1990s_radwood', 'modern_classic'), listing_type ('dealer_showroom' vs 'auction'), no_reserve_only, manual_only, origin ('american', 'european', 'german', 'italian', 'british', 'japanese'), build_style ('restomod', 'pro_touring', 'concours', 'survivor', 'original', 'restored', 'custom', 'driver'), numbers_matching, year_min/year_max (1900-2028), price_max (up to $10M), and zip + radius_miles (up to 3500 miles).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "air_cooled_only": {
                "description": "If true, filter exclusively to classic air-cooled collector vehicles (pre-1999 Porsche 356/911/912/914/930/964/993, classic Volkswagen Beetle/Bus/Karmann Ghia/Thing, Chevrolet Corvair, etc.).",
                "type": "boolean"
              },
              "american_suv_under_25k_only": {
                "description": "If true, filter exclusively to domestic American SUVs and Crossovers (Ford, Chevrolet, GMC, Jeep, Cadillac, Lincoln, Dodge, Buick) with a verified dealership price between $1,000 and $25,000 (excludes timed auctions).",
                "type": "boolean"
              },
              "american_trucks_and_suvs_only": {
                "description": "If true, filter exclusively to domestic American pickup trucks and SUVs (Ford, Chevrolet, GMC, Ram, Jeep, Cadillac, Lincoln, Dodge, Buick, Rivian, Hummer).",
                "type": "boolean"
              },
              "awd_hybrid_suv_only": {
                "description": "If true, filter exclusively to AWD / 4WD gas-electric Hybrid & Plug-In Hybrid SUVs and Crossovers (RAV4 Hybrid AWD, CR-V Hybrid AWD, Highlander Hybrid AWD, RX 350h/500h AWD, CX-50/CX-90 Hybrid AWD, Sportage/Tucson/Santa Fe Hybrid AWD, etc.).",
                "type": "boolean"
              },
              "awd_or_4wd_only": {
                "description": "If true, filter exclusively to all-weather & winter-ready AWD, 4WD, and 4x4 vehicles (including 4MATIC, quattro, xDrive, Symmetrical AWD, and 4WD trucks/SUVs).",
                "type": "boolean"
              },
              "awd_or_4wd_truck_under_35k_only": {
                "description": "If true, filter exclusively to 4WD / 4x4 / AWD pickup trucks with a verified dealership price between $1,000 and $35,000 (excludes timed auctions).",
                "type": "boolean"
              },
              "awd_sedan_or_coupe_only": {
                "description": "If true, filter exclusively to all-wheel-drive (AWD / 4MATIC / xDrive / Quattro / Symmetrical AWD) sedans, coupes, hatchbacks, and sportbacks (excluding SUVs, trucks, and vans).",
                "type": "boolean"
              },
              "awd_sedan_or_coupe_under_30k_only": {
                "description": "If true, filter exclusively to all-weather AWD / 4WD (4MATIC, xDrive, Quattro, Symmetrical AWD) sedans, coupes, hatchbacks, and sportbacks with a verified dealership price between $1,000 and $30,000 (excludes timed auctions).",
                "type": "boolean"
              },
              "awd_suv_under_25k_only": {
                "description": "If true, filter exclusively to all-weather AWD / 4WD SUVs & crossovers with a verified dealership price between $1,000 and $25,000 (excludes timed auctions).",
                "type": "boolean"
              },
              "awd_suv_under_30k_low_miles_only": {
                "description": "If true, filter exclusively to all-weather AWD / 4WD SUVs and Crossovers with a verified dealership price between $1,000 and $30,000 and verified odometer <= 50,000 miles (excludes timed auctions).",
                "type": "boolean"
              },
              "below_msrp_only": {
                "description": "If true, filter exclusively to verified-price vehicles advertised strictly below factory MSRP sticker (discounted by at least $250).",
                "type": "boolean"
              },
              "body_style": {
                "description": "Vehicle body style ('Coupe', 'Convertible', 'Roadster', 'Fastback', 'SUV', 'Sedan', 'Truck', 'Wagon', 'Hatchback', 'Van').",
                "type": "string"
              },
              "budget_luxury_under_30k_only": {
                "description": "If true, filter exclusively to verified-price luxury marque vehicles (BMW, Mercedes-Benz, Porsche, Audi, Lexus, Cadillac, Lincoln, Genesis, Acura, INFINITI, Volvo, Land Rover, Jaguar, Alfa Romeo, Maserati) priced under $30,000 (excluding timed auctions).",
                "type": "boolean"
              },
              "build_style": {
                "description": "Filter classic vehicles by restoration or build style ('restomod', 'pro_touring', 'concours', 'survivor', 'original', 'restored', 'custom', 'driver').",
                "enum": ["restomod", "pro_touring", "concours", "survivor", "original", "restored", "custom", "driver"],
                "type": "string"
              },
              "certified_only": {
                "description": "If true, only return factory Certified Pre-Owned (CPO) vehicles.",
                "type": "boolean"
