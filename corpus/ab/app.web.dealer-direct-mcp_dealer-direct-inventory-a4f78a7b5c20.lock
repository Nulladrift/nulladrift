        {
          "name": "search_inventory",
          "title": "Search Dealer-Direct New, Used & Classic/Collector Car Inventory",
          "description": "Search live New, Used, Certified Pre-Owned, and Classic/Collector car inventory across participating US franchise dealerships, 20+ specialist classic & collector showrooms (Streetside Classics, Classic Auto Mall, GR Auto Gallery, RK Motors, Vanguard Motor Sales, Volo Auto Museum, Worldwide Vintage Autos, Fleming's Ultimate Garage, DriverSource, Park Place LTD, Hagerty Classifieds), and live collector auctions (Bring a Trailer & Hagerty Marketplace). Supports natural free-text query (e.g., '427 4-speed', 'Coyote restomod', 'Slant Nose', 'numbers-matching'), classic_only, era ('pre_war', '1950s', '1960s', '1970s', '1980s', '1990s_radwood', 'modern_classic'), listing_type ('dealer_showroom' vs 'auction'), no_reserve_only, manual_only, origin ('american', 'european', 'german', 'italian', 'british', 'japanese'), build_style ('restomod', 'pro_touring', 'concours', 'survivor', 'original', 'restored', 'custom', 'driver'), numbers_matching, year_min/year_max (1900-2028), price_max (up to $10M), and zip + radius_miles (up to 3500 miles).",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "air_cooled_only": {
                "description": "If true, filter exclusively to classic air-cooled collector vehicles (pre-1999 Porsche 356/911/912/914/930/964/993, classic Volkswagen Beetle/Bus/Karmann Ghia/Thing, Chevrolet Corvair, etc.).",
                "type": "boolean"
              },
              "awd_or_4wd_only": {
                "description": "If true, filter exclusively to all-weather & winter-ready AWD, 4WD, and 4x4 vehicles (including 4MATIC, quattro, xDrive, Symmetrical AWD, and 4WD trucks/SUVs).",
                "type": "boolean"
              },
              "below_msrp_only": {
                "description": "If true, filter exclusively to verified-price vehicles advertised strictly below factory MSRP sticker (discounted by at least $250).",
                "type": "boolean"
              },
              "body_style": {
                "description": "Vehicle body style ('Coupe', 'Convertible', 'Roadster', 'Fastback', 'SUV', 'Sedan', 'Truck', 'Wagon', 'Hatchback', 'Van').",
                "type": "string"
              },
              "build_style": {
                "description": "Filter classic vehicles by restoration or build style ('restomod', 'pro_touring', 'concours', 'survivor', 'original', 'restored', 'custom', 'driver').",
                "enum": ["restomod", "pro_touring", "concours", "survivor", "original", "restored", "custom", "driver"],
                "type": "string"
              },
              "certified_only": {
                "description": "If true, only return factory Certified Pre-Owned (CPO) vehicles.",
                "type": "boolean"
              },
              "chassis_code": {
                "description": "Enthusiast chassis or generation code (e.g., Corvette 'C1'..'C8', Porsche '930'/'964'/'993'/'996'/'997'/'991'/'992', BMW 'E30'/'E36'/'E46'/'E39'/'E92'/'F80'/'G80', Nissan 'R32'/'R33'/'R34'/'R35'/'S30'/'Z32', Supra 'A80'/'MK4'/'A90'/'MK5', RX-7 'FD3S', S2000 'AP1'/'AP2', NSX 'NA1'/'NA2', Mustang 'Fox Body'/'S197'/'S550'/'S650', Chevy 'Tri-Five'/'Squarebody', 'Early Bronco', 'FJ40'/'FJ60'/'FJ80', Wrangler 'TJ'/'JK'/'JL').",
                "type": "string"
              },
              "city": {
                "description": "City name filter (e.g., 'Miami', 'Orlando', 'Tampa', 'Charlotte', 'Atlanta', 'Austin', 'Detroit', 'Phoenix').",
                "type": "string"
              },
              "classic_only": {
                "description": "If true, filter exclusively to classic, vintage, and collector vehicles (pre-2001 or specialist collector showrooms/auctions).",
                "type": "boolean"
              },
              "commercial_van_only": {
                "description": "If true, filter exclusively to commercial cargo, passenger & fleet vans (Ford Transit/E-Transit/E-Series, Mercedes-Benz Sprinter/eSprinter/Metris, Ram ProMaster, Chevrolet Express/BrightDrop, GMC Savana, Nissan NV).",
                "type": "boolean"
              },
              "commuter_special_only": {
                "description": "If true, filter exclusively to reliable late-model everyday commuter cars & SUVs (model year 2018+, verified price <= $22,000, and verified odometer <= 60,000 miles).",
                "type": "boolean"
              },
              "condition": {
                "description": "Filter by vehicle condition ('new', 'used', or 'certified'). Omit to search all conditions.",
                "enum": ["new", "used", "certified"],
                "type": "string"
              },
              "convertible_only": {
                "description": "If true, filter exclusively to open-top Convertibles, Roadsters, Cabriolets, Spyders/Spiders, and Targas.",
                "type": "boolean"
              },
              "cpo_or_new_only": {
                "description": "If true, filter exclusively to factory warranty-backed inventory (Brand-New or factory Certified Pre-Owned).",
                "type": "boolean"
              },
              "dealer_id": {
                "description": "Filter by specific dealer or classic showroom ID (e.g., 'dealer_rk_motors_charlotte', 'dealer_streetside_classics_tampa', 'dealer_bring_a_trailer').",
                "type": "string"
              },
              "diesel_only": {
                "description": "If true, filter exclusively to turbo-diesel & diesel-powered trucks, vans, SUVs, and cars (Power Stroke, Duramax, Cummins, EcoDiesel, TDI, BlueTEC).",
                "type": "boolean"
              },
              "drivetrain": {
                "description": "Drivetrain filter ('AWD', 'FWD', 'RWD', '4WD').",
                "type": "string"
              },
              "era": {
                "description": "Filter by classic automotive era ('pre_war' <1950, '1950s', '1960s', '1970s', '1980s', '1990s_radwood' 1980-1999, 'modern_classic' 2000-2012).",
                "enum": ["pre_war", "1950s", "1960s", "1970s", "1980s", "1990s_radwood", "modern_classic"],
                "type": "string"
              },
              "european_luxury_only": {
                "description": "If true, filter exclusively to German, British, Italian & Swedish luxury and performance marques (Porsche, BMW, Mercedes-Benz, Audi, Land Rover, Jaguar, Volvo, Alfa Romeo, Maserati, Ferrari, Lamborghini, Aston Martin, Bentley, Rolls-Royce, McLaren, Lotus, Polestar, INEOS).",
                "type": "boolean"
              },
              "exotic_only": {
                "description": "If true, filter exclusively to exotic supercars & ultra-luxury halo models (Ferrari, Lamborghini, McLaren, Aston Martin, Bentley, Rolls-Royce, Bugatti, Pagani, Koenigsegg, Lotus, Ford GT, Viper, NSX, R8, AMG GT, Porsche GT3/GT2/Turbo S/Carrera GT).",
                "type": "boolean"
              },
              "exterior_color": {
                "description": "Exterior color filter (e.g., 'Red', 'Green', 'Black', 'Blue', 'Silver', 'White').",
                "type": "string"
              },
              "family_suv_or_minivan_only": {
                "description": "If true, filter exclusively to family minivans and midsize/full-size family SUVs (Odyssey, Sienna, Pacifica, Carnival, Pilot, Passport, Highlander, Grand Highlander, Sequoia, Telluride, Palisade, Sorento, Santa Fe, Tahoe, Suburban, Yukon, Traverse, Enclave, Acadia, Expedition, Explorer, Atlas, Ascent, CX-90, Pathfinder, Armada, MDX, TX, GX, Q7, GLE, GLS, X5, X7, XC90, Wagoneer, Durango, EV9, R1S, Model X).",
                "type": "boolean"
              },
              "fuel_type": {
                "description": "Fuel type filter ('Gasoline', 'Hybrid', 'Electric', 'Plug-In Hybrid', 'Diesel').",
                "type": "string"
              },
              "full_size_truck_only": {
                "description": "If true, filter exclusively to half-ton and heavy-duty full-size pickup trucks (Ford F-150/Lightning/F-250/F-350/Super Duty, Chevrolet Silverado 1500/2500HD/3500HD/Silverado EV, GMC Sierra 1500/2500HD/3500HD/Hummer EV Pickup, Ram 1500/2500/3500, Toyota Tundra, Nissan Titan, Tesla Cybertruck, Rivian R1T).",
                "type": "boolean"
              },
              "heavy_duty_only": {
                "description": "If true, filter exclusively to heavy-duty 3/4-ton and 1-ton towing & work trucks (Ford F-250/F-350/F-450 Super Duty, Chevrolet Silverado 2500HD/3500HD, GMC Sierra 2500HD/3500HD, Ram 2500/3500).",
                "type": "boolean"
              },
              "hybrid_or_ev_only": {
                "description": "If true, filter exclusively to electrified vehicles across all battery-electric (EV), Hybrid, and Plug-In Hybrid (PHEV) powertrains.",
                "type": "boolean"
              },
              "induction_type": {
                "description": "Filter by engine aspiration / forced induction ('turbo', 'twin_turbo', 'supercharged', or 'naturally_aspirated').",
                "enum": ["turbo", "twin_turbo", "supercharged", "naturally_aspirated"],
                "type": "string"
              },
              "interior_color": {
                "description": "Interior cabin/upholstery color filter (e.g., 'Tan', 'Saddle', 'Red', 'Cognac', 'Black', 'White').",
                "type": "string"
              },
              "japanese_reliability_only": {
                "description": "If true, filter exclusively to Japanese reliability leader marques (Toyota, Lexus, Honda, Acura, Mazda, Subaru).",
                "type": "boolean"
              },
              "jdm_only": {
                "description": "If true, filter exclusively to JDM & Japanese enthusiast icons and right-hand-drive imports (Skyline GT-R, Supra, NSX, RX-7, S2000, Datsun 240Z/280Z, Silvia, Type R, WRX STI, Lancer Evo, Land Cruiser FJ40/FJ60/FJ80, Kei trucks/cars, RHD imports).",
                "type": "boolean"
              },
              "limit": {
                "description": "Max vehicles to return per page (1-100, default: 20).",
                "type": "integer"
              },
              "listing_type": {
                "description": "Filter by 'dealer_showroom' (fixed/negotiable dealership & classic showroom cars eligible for Shielded Deal-Desk OTD & shipping quotes) or 'auction' (live timed enthusiast auctions on Bring a Trailer and Hagerty Marketplace).",
                "enum": ["dealer_showroom", "auction"],
                "type": "string"
              },
              "low_mileage_collector_only": {
                "description": "If true, filter exclusively to investment-grade, low-mileage time-capsule collector & enthusiast cars (model year 2012 or older with verified odometer <= 25,000 miles).",
                "type": "boolean"
              },
              "luxury_only": {
                "description": "If true, filter exclusively to luxury & ultra-luxury marques (Porsche, BMW, Mercedes-Benz, Audi, Lexus, Cadillac, Lincoln, Genesis, Acura, INFINITI, Volvo, Land Rover, Jaguar, Maserati, Aston Martin, Bentley, Rolls-Royce, Ferrari, Lamborghini, McLaren, Lucid, Rivian).",
                "type": "boolean"
              },
              "make": {
                "description": "Vehicle make or colloquial enthusiast alias (e.g., 'Chevrolet' or 'Chevy', 'Volkswagen' or 'VW', 'Mercedes-Benz' or 'Mercedes', 'Mopar', 'Ford', 'Porsche', 'BMW', 'Toyota').",
                "type": "string"
              },
              "manual_only": {
                "description": "If true, filter exclusively to manual-transmission / stick-shift vehicles (4-speed, 5-speed, 6-speed, Tremec, etc.).",
                "type": "boolean"
              },
              "midsize_truck_only": {
                "description": "If true, filter exclusively to midsize & compact pickup trucks (Toyota Tacoma, Ford Ranger & Maverick, Chevrolet Colorado, GMC Canyon, Jeep Gladiator, Nissan Frontier, Honda Ridgeline, Hyundai Santa Cruz).",
                "type": "boolean"
