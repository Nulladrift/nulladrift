      "tools": [
        {
          "name": "accept_deal_and_reveal",
          "title": "Accept Verified OTD Deal & Reveal Buyer Identity (Consent-Gated)",
          "description": "Once the buyer approves a dealership's verified Out-The-Door quote, unlock the buyer's real name, email/phone, and preferred appointment window to the dealership. Requires explicit buyer permission (consent=true).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_email": {
                "description": "Buyer's real email address (at least one of buyer_email or buyer_phone is required).",
                "type": "string"
              },
              "buyer_name": {
                "description": "Buyer's real full name.",
                "type": "string"
              },
              "buyer_phone": {
                "description": "Buyer's real phone number (at least one of buyer_email or buyer_phone is required).",
                "type": "string"
              },
              "consent": {
                "description": "Explicit buyer consent flag. Must be true to unlock buyer PII to the dealership.",
                "type": "boolean"
              },
              "notes": {
                "description": "Optional final instructions for the sales manager.",
                "type": "string"
              },
              "opt_in_classic_ppi_shipping": {
                "description": "Optional collector opt-in: include a 150-point classic pre-purchase lift inspection (PPI) and enclosed hard-side carrier dispatch handoff.",
                "type": "boolean"
              },
              "opt_in_insurance_quote": {
                "description": "Optional buyer opt-in: return a VIN-prefilled insurance comparison payload alongside the locked OTD deal.",
                "type": "boolean"
              },
              "preferred_appointment_window": {
                "description": "Preferred appointment or delivery window (e.g., 'Saturday 11:00 AM - 1:00 PM').",
                "type": "string"
              },
              "thread_id": {
                "description": "The proxy deal thread_id being accepted.",
                "type": "string"
              }
            },
            "required": ["buyer_name", "consent", "thread_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bb2e166c85fac16237f95e3c4fdf2862d2a5aed4bc9f42308e2fa320a5f6d3ea"
        },
        {
          "name": "burn_proxy_thread",
          "title": "Burn Proxy Identity & Permanently Block Dealer Follow-Ups",
          "description": "One-click privacy kill-switch: permanently closes a shielded deal thread and revokes its proxy relay email address so any subsequent BDC drip emails or follow-ups from that dealership are silently dropped.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "reason": {
                "description": "Optional reason (e.g., 'Purchased vehicle elsewhere', 'Unacceptable mandatory add-ons').",
                "type": "string"
              },
              "thread_id": {
                "description": "The proxy deal thread_id to permanently burn.",
                "type": "string"
              }
            },
            "required": ["thread_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce88331b539bdc06d493d716e401fd5d06351c5ed5d5c3f9b11f078685ace969"
        },
        {
          "name": "get_deal_thread",
          "title": "Get Shielded Deal Thread, Verified OTD Quote & Filtered Reply Status",
          "description": "Inspect the current state of a shielded proxy deal thread, including physical lot verification answers, itemized Out-The-Door (OTD) quote, hidden add-on/markup warnings, filtered BDC auto-responder count vs. substantive human manager replies, Buyer Shield Pass status, 6-Digit Release Voucher state, and recommended next action.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_pass_id": {
                "description": "Optional Buyer Shield Pass ID ('bp_...') to resolve the pass status or latest auto-dispatched thread.",
                "type": "string"
              },
              "thread_id": {
                "description": "The unique thread_id returned by start_shielded_inquiry (e.g., 'dth_...').",
                "type": "string"
              }
            },
            "required": ["thread_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:19c2ecb8d252b04abe1c9a50535a9b6b416fe44858492032f050c3c736387078"
        },
        {
          "name": "get_lead_status",
          "title": "Get Lead Delivery & Billing Status (Dealer-Authenticated)",
          "description": "Check the delivery state, webhook/email attempts, duplicate flag, and billing ledger status of a submitted lead. Requires dealer_api_key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
