              "chassis_code": {
                "description": "Enthusiast chassis or generation code (e.g., Corvette 'C1'..'C8', Porsche '930'/'964'/'993'/'996'/'997'/'991'/'992', BMW 'E30'/'E36'/'E46'/'E39'/'E92'/'F80'/'G80', Nissan 'R32'/'R33'/'R34'/'R35'/'S30'/'Z32', Supra 'A80'/'MK4'/'A90'/'MK5', RX-7 'FD3S', S2000 'AP1'/'AP2', NSX 'NA1'/'NA2', Mustang 'Fox Body'/'S197'/'S550'/'S650', Chevy 'Tri-Five'/'Squarebody', 'Early Bronco', 'FJ40'/'FJ60'/'FJ80', Wrangler 'TJ'/'JK'/'JL').",
                "type": "string"
              },
              "city": {
                "description": "City name filter (e.g., 'Miami', 'Orlando', 'Tampa', 'Charlotte', 'Atlanta', 'Austin', 'Detroit', 'Phoenix').",
                "type": "string"
              },
              "classic_2000s_under_35k_only": {
                "description": "If true, filter exclusively to 2000–2009 modern-classic enthusiast cars, roadsters, sports coupes, and 4x4s (C5/C6 Corvettes, S2000, NB/NC Miata, E46/E90/E39 BMW, Porsche 996/997/986/987, S197/New Edge Mustang, TJ/LJ Wrangler, GMT800 pickups/Tahoes, 350Z, Pontiac GTO; model years 2000–2009) with a verified showroom/dealership price between $1,000 and $35,000 (excludes timed auctions).",
