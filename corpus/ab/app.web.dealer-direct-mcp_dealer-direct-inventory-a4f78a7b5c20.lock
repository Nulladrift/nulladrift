              "mileage_min": {
                "description": "Minimum odometer mileage in miles (e.g., 0 or 5000).",
                "type": "integer"
              },
              "model": {
                "description": "Vehicle model (e.g., 'Corvette', 'Mustang', '911', 'Challenger', 'Camaro', 'Bronco', 'CX-30').",
                "type": "string"
              },
              "mpg_min": {
                "description": "Minimum EPA fuel economy rating in MPG (e.g., 30, 35, 40, or 50 for high-efficiency commuters and hybrids).",
                "type": "integer"
              },
              "muscle_car_only": {
                "description": "If true, filter exclusively to classic & modern American muscle and pony cars (Mustang, Camaro, Challenger, Charger, Corvette, GTO, Chevelle, Firebird/Trans Am, Barracuda/'Cuda, Road Runner, 442, Grand National, Cobra, Viper).",
                "type": "boolean"
              },
              "no_reserve_only": {
                "description": "If true, filter live collector auctions to No-Reserve listings only.",
                "type": "boolean"
              },
              "numbers_matching": {
                "description": "If true, filter to classic vehicles advertising numbers-matching engine/drivetrain.",
                "type": "boolean"
              },
              "off_road_only": {
                "description": "If true, filter exclusively to factory off-road & overlanding packages/models (Ford Raptor/Bronco Badlands/Wildtrak/Sasquatch/Tremor, Toyota TRD Pro/TRD Off-Road/Trailhunter/Land Cruiser, Jeep Wrangler Rubicon/Mojave, Ram TRX/Rebel/Power Wagon, Chevy ZR2/Z71/Trail Boss, GMC AT4/AT4X, Subaru Wilderness, Lexus Overtrail, Land Rover Defender, Mercedes G-Class).",
                "type": "boolean"
              },
              "one_owner_only": {
                "description": "If true, filter exclusively to CARFAX One-Owner vehicles.",
                "type": "boolean"
              },
              "origin": {
                "description": "Filter by marque country/region of origin ('american', 'european', 'german', 'italian', 'british', 'japanese', 'korean', 'swedish').",
                "enum": ["american", "european", "german", "italian", "british", "japanese", "korean", "swedish"],
                "type": "string"
              },
              "page": {
                "description": "Page number for pagination (1-based, default: 1).",
                "type": "integer"
              },
              "powertrain_type": {
                "description": "Filter by powertrain architecture ('ev' for pure battery-electric, 'hybrid', 'plug_in_hybrid' for PHEV/4xe/Prime, 'diesel', or 'gasoline').",
                "enum": ["ev", "hybrid", "plug_in_hybrid", "diesel", "gasoline"],
                "type": "string"
              },
              "price_max": {
                "description": "Maximum advertised price (or current bid on auctions) in USD (up to 10000000).",
                "type": "number"
              },
              "price_min": {
                "description": "Minimum advertised price (or current bid on auctions) in USD (e.g., 15000 or 50000).",
                "type": "number"
              },
              "query": {
                "description": "Optional free-text search query (e.g., 'new SUV', '1968 Corvette 427', 'classic Mustang fastback', 'air-cooled 911', 'Coyote restomod').",
                "type": "string"
              },
              "radius_miles": {
                "description": "Search radius in miles from the ZIP centroid (default: 25, max: 3500 for coast-to-coast classic enclosed shipping).",
                "type": "number"
              },
              "region": {
                "description": "Regional market filter (e.g., 'South Florida', 'Classic & Collector Showrooms', 'Tampa Bay', 'Atlanta', 'Texas', 'Carolinas').",
                "type": "string"
              },
              "sort_by": {
                "description": "Sort order for results (default: 'price'; also supports 'price_desc', 'mileage', 'distance', 'newest', 'oldest', 'ending_soon' for live auctions, 'biggest_discount' for largest dollar savings below MSRP, 'msrp_discount_pct' for largest percentage discount off MSRP, 'highest_msrp', 'highest_mpg', 'best_mpg_per_dollar', 'lowest_miles_per_year', 'newest_arrival', 'year_desc_mileage_asc', and 'newest_lowest_price').",
                "enum": ["price", "price_asc", "price_desc", "mileage", "distance", "newest", "oldest", "ending_soon", "biggest_discount", "msrp_discount_pct", "highest_msrp", "highest_mpg", "best_mpg_per_dollar", "lowest_miles_per_year", "newest_arrival", "year_desc_mileage_asc", "newest_lowest_price"],
                "type": "string"
              },
