        {
          "name": "submit_urls_for_indexing",
          "title": "Submit URLs for Google, Bing and/or Brave indexing",
          "description": "Create an indexing task: Rapid Indexer signals Googlebot to crawl each URL so Google discovers it fast. also_bing sends Bingbot to each URL too; engine \"bing\" sends Bingbot only. Bing is priced per URL (see get_pricing), in beta (not guaranteed) and only available while Bing Indexing is enabled. brave adds Brave Search Boost (signals to Brave's Web Discovery Project, free next to Google); engine \"brave\" sends Brave only. Not guaranteed. SPENDS CREDITS immediately (standard ~1 credit/URL, VIP ~5 credits/URL). Run estimate_cost first and confirm with the user for large batches. Standard queue starts within minutes; VIP starts immediately with priority. drip_feed spreads submissions over several days for a natural pattern. Returns the task id; poll get_task for progress and get_task_links for per-URL status. Google makes the final indexing decision.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
