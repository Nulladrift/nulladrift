                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "task_id": {
                "type": "number"
              },
              "url_count": {
                "type": "number"
              }
            },
            "required": ["brave_check", "dashboard_url", "message", "task_id", "url_count"],
            "type": "object"
          },
