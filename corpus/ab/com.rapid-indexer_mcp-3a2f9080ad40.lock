      "serverInfo": {
        "name": "rapid-indexer",
        "title": "Rapid Indexer",
        "version": "0.2.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Rapid Indexer sends Googlebot to URLs so Google discovers and (usually) indexes them within minutes to hours, and can verify which URLs are in the index. Typical flow: get_account (check credits) -> estimate_cost -> submit_urls_for_indexing -> later get_task / get_task_links. Use check_index_status for a cheap index check without submitting. Engines: indexing can target Google, Bing (Bing Indexing, beta, not guaranteed) and Brave Search Boost (free next to Google). An index check can also look each URL up in Brave Search (also_brave). get_task_links reports bing_status and brave_status per URL where they apply. Credits are spent when a task is created. Standard indexing costs ~1 credit/URL, VIP ~5 credits/URL, an index check ~0.1 credit/URL ($1 = 100 credits). Always confirm with the user before submitting large batches or traffic campaigns. Rapid Indexer sends the crawler; Google decides what appears in search. \"completed\" means crawled/processed, not guaranteed indexed. Use check_index_status a day or two later to verify.",
      "tools": [
        {
          "name": "check_index_status",
          "title": "Check whether URLs are indexed by Google (and Brave)",
          "description": "Create an index-check task that reports, per URL, whether Google currently has it in the index (indexed / unindexed). also_brave looks every URL up in Brave Search too (extra credits per URL, see get_pricing); its result is brave_status in get_task_links. URLs Brave cannot look up are refunded. Cheap (~0.1 credit per URL) but still SPENDS CREDITS. Results arrive within a few minutes: poll get_task, then read get_task_links. Does not submit anything to Google; use submit_urls_for_indexing for that.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "also_brave": {
                "default": false,
                "description": "Also check each URL in Brave Search (extra credits per URL).",
                "type": "boolean"
              },
              "title": {
                "description": "Optional label shown in the dashboard.",
                "maxLength": 255,
                "type": "string"
              },
              "urls": {
                "description": "Absolute URLs (https://...). Scheme is added when missing. Max 10000 per task.",
                "items": {
                  "maxLength": 2048,
                  "minLength": 4,
                  "type": "string"
                },
                "maxItems": 10000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "brave_check": {
                "type": "boolean"
              },
