        {
          "name": "create_ctr_campaign",
          "title": "Create CTR (search-and-click) campaign",
          "description": "Send visitors who search the given keywords on a search engine (Google by default), find the target URL in the results and click it, then browse like a human. SPENDS CREDITS immediately (same rate as traffic, per visitor). Confirm with the user before creating. Use list_search_engines for valid search_engine values.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ai_enabled": {
                "default": true,
                "description": "Human-like AI browsing (scrolling, reading, internal clicks).",
                "type": "boolean"
              },
              "bounce_rate": {
                "default": 15,
                "description": "Percent of single-page visits.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "click_chance": {
                "default": 30,
                "description": "Percent of visitors who click one of click_links.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "click_links": {
                "description": "Paths or CSS selectors the visitor may click, e.g. [\"/pricing\", \"button.cta\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "country": {
                "default": "WW",
                "description": "Visitor geo. WW = worldwide mix.",
                "enum": ["WW", "US", "GB", "DE", "JP", "FR", "CA", "AU", "BR", "IN", "MX", "IT", "NL", "KR", "ID", "TR", "PL", "TH", "VN", "PH", "ES"],
                "type": "string"
              },
              "days": {
                "default": 1,
                "description": "Spread the visitors over this many days.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "delay_max": {
                "default": 90,
                "description": "Max seconds on page.",
                "maximum": 900,
                "minimum": 5,
                "type": "integer"
              },
              "delay_min": {
                "default": 30,
                "description": "Min seconds on page.",
                "maximum": 600,
                "minimum": 5,
                "type": "integer"
              },
              "device": {
                "default": "mixed",
                "enum": ["mixed", "desktop", "mobile", "tablet"],
                "type": "string"
              },
              "keywords": {
                "description": "Search queries the visitors will type.",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "link": {
                "description": "Target page the visitors should land on.",
                "format": "uri",
                "type": "string"
              },
              "pages_max": {
                "default": 5,
                "description": "Max internal pages per visit.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "pages_min": {
                "default": 2,
                "description": "Min internal pages per visit.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "referrer": {
                "description": "Apparent traffic source, e.g. \"facebook.com\" or a full URL. Empty = direct.",
                "maxLength": 255,
                "type": "string"
              },
              "search_engine": {
                "default": "GOOGLE",
                "description": "Engine key from list_search_engines (GOOGLE, BING, YAHOO, DUCKDUCKGO, YANDEX, BAIDU, NAVER, AMAZON, ...).",
                "type": "string"
              },
              "search_language": {
                "default": "en",
                "description": "Search UI language code.",
                "maxLength": 5,
                "minLength": 2,
                "type": "string"
              },
              "search_only": {
                "default": false,
                "description": "Search without clicking the result (search-volume boost only).",
                "type": "boolean"
              },
              "search_pages_max": {
                "default": 3,
                "description": "How many result pages to scan for the target URL.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "title": {
                "description": "Campaign name shown in the dashboard.",
                "maxLength": 255,
                "type": "string"
