      "instructions": "/call-me rings a real human's phone (iPhone or Android), reads your text aloud and returns what they said.\n\n- `to` is the 10-digit number from My Number in the Call Me app, not a phone number. No login or OAuth. On a local host read user_number from ~/.aiphone/config.json, and save it there after first setup (directory 700, file 600). This hosted server cannot read that file, so pass the number as `to`. Never invent or hardcode a number or reuse another user's.\n- No number yet: call `setup` and ALWAYS show its clickable links: [Download Call Me from the App Store](https://apps.apple.com/app/call-me/id6789575165) or [get it on Google Play](https://play.google.com/store/apps/details?id=com.serdaroztetik.callmeai). Never give only the app name.\n- Only a person's number works. The `from` in every result is your own identity: agents cannot reach each other through /call-me, and repeated wrong numbers block the caller for an hour.\n- `call` speaks up to 2000 characters word for word and waits ~30s. \"ringing\" or \"in_call\" means not settled: pass call_id to `poll_result` until it is.\n- The line stays open after their answer (\"open\": true): reply with `say`, end with `hang_up` as soon as you are done.\n- Reuse the session_token from every result so the phone keeps one thread; `wait_for_reply` returns texts and voicemails they send back.\n- `text` is one-way: notifications, or the fallback after a missed call. Recordings and audio links go to `play_audio`.\n- Speaking another language? Pass `language` (e.g. \"tr\") to `call` and `say`.\n- Want another voice? Pass `voice` to `call` or `say`: female first, \"bella\" (default), \"sarah\", \"jessica\"... or male \"roger\", \"eric\", \"brian\"... It sticks for your later calls.\n- \"this /call-me number is not active\" means their subscription lapsed: tell the person you work for.\n- The demo line 5550001234 answers automatically, for trying the loop without a human.\n- Do not retry an unanswered call in a loop; one call plus one text is the polite ceiling.",
      "tools": [
        {
          "name": "call",
          "title": "Call the human",
          "description": "Ring the human's phone (iPhone or Android), read `question` aloud word\n    for word, and return what they say back as text. Waits up to ~30s.\n\n    status \"completed\" carries their words in `transcript` (empty if they only\n    listened). \"ringing\" (not picked up yet) or \"in_call\" (listening) means the\n    call has not settled: pass call_id to poll_result until it does. An\n    unanswered ring settles as \"missed\" within about a minute; \"declined\" means\n    they refused it. Do not retry an unanswered call in a loop: send one `text`\n    instead.\n\n    By default the line stays open after their answer (\"open\": true): they hear\n    a soft hold sound while you think, and a voice assistant tells them you are\n    working on it. Reply with `say`, finish with `hang_up`; after about two\n    minutes of silence the line drops by itself. Anything they said while\n    waiting comes back with their next answer as \"said_while_waiting\". The\n    \"language\" and \"language_name\" fields report what the recognizer heard, as\n    information only. `voice` picks who speaks (female first: bella, sarah,\n    jessica, ...; male: roger, eric, brian, ...) and sticks for later calls.\n\n    Reuse the returned session_token in later calls and texts so the phone\n    keeps one thread. The `from` in the result is your own number: never call\n    or text it. Missing `to` returns setup_required with download links.",
          "inputSchema": {
            "properties": {
              "from_label": {
                "default": "Someone's AI",
                "description": "Who is calling, shown on their phone and spoken: e.g. \"Claude on my laptop\".",
                "title": "From Label",
                "type": "string"
              },
              "keep_open": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Keep the line up after their answer so you can reply with `say` (default on). false makes a one-shot call that hangs up after one answer.",
                "title": "Keep Open"
              },
              "language": {
                "default": "",
                "description": "The language you are speaking, e.g. \"tr\", \"pt-BR\" or \"Turkish\". The call's own short lines (thanks, goodbye) follow it. Empty means English, or on `say` keeps the current one.",
                "title": "Language",
                "type": "string"
              },
              "question": {
                "description": "What to say, read aloud word for word, up to 2000 characters (about two minutes). It need not be a question: a status update or a summary works too.",
                "title": "Question",
                "type": "string"
              },
              "session_token": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A session_token from an earlier result, to stay in that thread. Omit on first contact.",
                "title": "Session Token"
              },
              "to": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The human's 10-digit Call Me number, from My Number in the app (not a regular phone number). Local clients read it from ~/.aiphone/config.json user_number. In a host without file access, reuse a number given earlier in this chat, but do not claim it is saved across chats. Omit it only to get setup_required with the download links.",
                "title": "To"
              },
              "voice": {
                "default": "",
                "description": "Who speaks, female first (default \"bella\"). female: bella, sarah, jessica, matilda, laura, alice (british), lily (british); neutral: river; male: roger, eric, chris, brian, will, liam, bill, george (british), daniel (british), charlie (australian). \"female\" or \"male\" picks the first of that kind. Your choice sticks for this session's later calls until you pass another; empty keeps it, or else uses the voice the person chose in their app.",
                "title": "Voice",
                "type": "string"
              }
            },
            "required": ["question"],
            "title": "callArguments",
            "type": "object"
          },
