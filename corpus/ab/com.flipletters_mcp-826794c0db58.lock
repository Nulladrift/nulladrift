        {
          "name": "flipletters_share_to_postiz",
          "title": "Schedule export on Postiz",
          "description": "Uploads a cloud media URL (or Studio host local fileName) to a project's Postiz destination and schedules/drafts/posts it. Loop: render_board → list_workspaces → list_postiz_destinations → list_postiz_integrations → share_to_postiz. Requires Authorization: Bearer flk_…. Prefer mediaUrl from flipletters_render_board. Posts publicly to the connected social account when not drafted; confirm the destination and caption with the user before calling. Not idempotent: each call creates another post. If a call fails or times out, confirm with the user before retrying.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "content": {
                "description": "Caption / post body.",
                "type": "string"
              },
              "date": {
                "description": "UTC ISO datetime, e.g. 2026-08-14T15:00:00.000Z",
                "minLength": 1,
                "type": "string"
              },
              "destinationId": {
                "description": "Postiz destination id on that project.",
                "minLength": 1,
                "type": "string"
              },
              "fileName": {
                "description": "Local renders/*.mp4 name when Studio host has the file.",
                "type": "string"
              },
              "integrationId": {
                "description": "Postiz channel/integration id.",
                "minLength": 1,
                "type": "string"
              },
              "mediaUrl": {
                "description": "HTTPS URL of the MP4 (from cloud render).",
                "type": "string"
              },
              "providerType": {
                "description": "Postiz provider __type, e.g. tiktok, x, linkedin.",
                "type": "string"
              },
              "type": {
                "description": "Default schedule.",
                "enum": ["schedule", "draft", "now"],
                "type": "string"
              },
              "workspaceId": {
                "description": "FlipLetters project id.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["date", "destinationId", "integrationId", "workspaceId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e9efd30f5e47ab9b793c5266ec7232928bcbcd00b480b76b7267609301a2b5b3"
        },
        {
