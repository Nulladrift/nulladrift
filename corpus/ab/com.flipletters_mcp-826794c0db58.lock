                "minLength": 1,
                "type": "string"
              },
              "teamId": {
                "description": "Team id from flipletters_list_teams.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["code", "name", "teamId"],
            "type": "object"
          },
