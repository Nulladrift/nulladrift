        {
          "name": "flipletters_render_board",
          "title": "Cloud-render a board to MP4",
          "description": "Parses flipcode and submits a cloud MP4 render under the API key owner's FlipLetters plan (same free quota / Premium / Studio limits as the Studio). Requires Authorization: Bearer flk_… (or FLIPLETTERS_API_KEY on stdio). Polls until done (or returns jobId if wait=false). Prefer share links for free previews; only render when the human wants an MP4 file. Not idempotent: each call starts a new render and counts against the plan's render quota; poll flipletters_render_status instead of calling again. If a call fails or times out, confirm with the user before retrying.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "Complete flipcode document.",
                "minLength": 1,
                "type": "string"
              },
              "repeat": {
                "description": "Loop the segment this many times (default 1). Caps apply for long / 4K exports.",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "wait": {
                "description": "If true (default), poll until done/error (hosted: up to ~45s, then poll render_status). If false, return jobId immediately.",
                "type": "boolean"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "error": {
                "type": ["string", "null"]
              },
              "expiresAt": {
                "description": "ISO time the mp4Url stops working, or null when it does not expire.",
                "type": ["string", "null"]
              },
              "fileName": {
                "type": ["string", "null"]
              },
              "jobId": {
                "type": ["string", "null"]
              },
              "mp4Url": {
                "description": "HTTPS download URL for the finished MP4 (public token URL; no expiry). Null until status is done.",
                "type": ["string", "null"]
              },
              "shareUrl": {
                "description": "Opens the board in FlipLetters Studio. Null if the board is too large for a URL.",
                "type": ["string", "null"]
              },
              "status": {
                "description": "queued | running | done | error | cancelled | moderated | paywall",
                "type": "string"
              },
              "watermarked": {
                "type": ["boolean", "null"]
              }
            },
            "required": ["error", "expiresAt", "fileName", "jobId", "mp4Url", "shareUrl", "status", "watermarked"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
