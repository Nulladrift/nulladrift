        },
        {
          "name": "flipletters_template_url",
          "title": "Readable template URL",
          "description": "Builds a human-readable FlipLetters Studio URL where every query parameter mirrors one flipcode line — good for short text boards you want legible in the address itself (chat messages, docs). For full fidelity or paint grids use flipletters_validate_board's share link instead. Slides are strings with | between rows.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "accent": {
                "description": "Hex color, # optional.",
                "type": "string"
              },
              "board": {
                "description": "Board type/alias, e.g. \"station\".",
                "type": "string"
              },
              "flip": {
                "description": "Transition, commas for spaces: \"cascade,9,0.2,0.4\".",
                "type": "string"
              },
              "grid": {
                "description": "ROWSxCOLS, e.g. \"8x34\".",
                "type": "string"
              },
              "hold": {
                "description": "Seconds, e.g. \"6\".",
                "type": "string"
              },
              "out": {
                "description": "Canvas: \"vertical\", \"square\", \"1200x630@25\", …",
                "type": "string"
              },
              "slides": {
                "description": "Each entry is one slide; | separates rows: \"EGGS BENEDICT|FLAT WHITE\".",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sound": {
                "type": "string"
              },
              "speed": {
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "url": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7a03e0f23ef1f9ca901c4270dc9d36916563ac696cb5720360dfd6e4122c3aef"
        },
        {
          "name": "flipletters_validate_board",
          "title": "Validate a board",
          "description": "Parses a flipcode document, returning the normalized canonical code, any warnings (out-of-range values are clamped, unknown lines ignored), a board summary, and links: a share URL that opens the exact board in the FlipLetters Studio, and an open-with-code URL that also reveals the code panel. Use this after drafting a board; fix warnings and re-validate until clean, then give the human the share link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "A complete flipcode document (see flipletters_flipcode_reference).",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "canonicalCode": {
                "type": "string"
              },
              "openWithCodeUrl": {
                "type": ["string", "null"]
              },
              "shareUrl": {
                "description": "Opens this exact board in the Studio. Null when the board is too large for a URL — share the code text instead.",
                "type": ["string", "null"]
              },
              "summary": {
                "additionalProperties": false,
                "properties": {
                  "boardCols": {
                    "type": "number"
                  },
                  "boardRows": {
                    "type": "number"
                  },
                  "canvas": {
                    "type": "string"
                  },
                  "slideCount": {
                    "type": "number"
                  },
                  "template": {
                    "type": "string"
                  }
                },
                "required": ["boardCols", "boardRows", "canvas", "slideCount", "template"],
                "type": "object"
              },
              "valid": {
                "type": "boolean"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["canonicalCode", "openWithCodeUrl", "shareUrl", "summary", "valid", "warnings"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
