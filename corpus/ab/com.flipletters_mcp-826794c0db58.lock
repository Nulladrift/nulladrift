          "description": "Parses flipcode and shares the board into a Team Library the key owner is a member of. Requires Authorization: Bearer flk_…. Use flipletters_list_teams first to get teamId. Not idempotent: each call adds another copy of the board to the Team Library. If a call fails or times out, confirm with the user before retrying.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "Complete flipcode document.",
                "minLength": 1,
