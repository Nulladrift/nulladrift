      "tools": [
        {
          "name": "flipletters_create_animation",
          "title": "Create a split-flap animation from text",
          "description": "One call from plain text to a FlipLetters video: builds a board on a text template (default minimal), checks the text against FlipLetters content rules, cloud-renders an MP4 under the signed-in owner's plan (free renders carry the FlipLetters watermark), and returns mp4Url (downloadable HTTPS), shareUrl (opens in Studio), jobId, status and expiresAt. If the render is still running when this returns, poll flipletters_render_status with jobId. Not idempotent: each call starts a new render and counts against the plan's render quota; poll render_status instead of calling again. If a call fails or times out, confirm with the user before retrying.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "template": {
                "description": "Board type: minimal, trainboard, marquee, announcement, arena (aliases like station, desk, poster, lightbox ok). Default minimal.",
                "type": "string"
              },
              "text": {
                "description": "What the board should say, e.g. \"I love sourdough\". Newlines force line breaks.",
                "maxLength": 1200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "error": {
                "type": ["string", "null"]
              },
              "expiresAt": {
                "description": "ISO time the mp4Url stops working, or null when it does not expire.",
                "type": ["string", "null"]
              },
              "fileName": {
                "type": ["string", "null"]
              },
              "jobId": {
                "type": ["string", "null"]
              },
              "mp4Url": {
                "description": "HTTPS download URL for the finished MP4 (public token URL; no expiry). Null until status is done.",
                "type": ["string", "null"]
              },
              "shareUrl": {
                "description": "Opens the board in FlipLetters Studio. Null if the board is too large for a URL.",
                "type": ["string", "null"]
              },
              "status": {
                "description": "queued | running | done | error | cancelled | moderated | paywall",
                "type": "string"
              },
              "watermarked": {
                "type": ["boolean", "null"]
              }
            },
            "required": ["error", "expiresAt", "fileName", "jobId", "mp4Url", "shareUrl", "status", "watermarked"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8b3c2f1fadf2b5d6fb9f0430bb8f5ea74c7b9c3771d0c448c2cb87a557fc814e"
        },
