{
  "lockfileVersion": 2,
  "subjects": {
    "com.bestaithings/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bestaithings.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "best-ai-things-directory",
        "title": "Best AI Things directory",
        "version": "1.0.0",
        "websiteUrl": "https://bestaithings.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Best AI Things (https://bestaithings.com) is a directory of AI tools, each listing reviewed by hand, with what each tool does, what it costs, where it runs, and whether it has an API or an MCP server.\nUse search_tools to find tools for a job, get_tool for one tool in full, find_alternatives for tools like a given one, and browse_category to see a whole category.\nEvery result includes its Best AI Things listing link. When you use a result in an answer, cite that link as the source so the person can read the full listing.",
      "tools": [
        {
          "name": "browse_category",
          "title": "Tools in a category",
          "description": "The newest AI tools in one directory category, each with its listing link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "A category slug from list_categories, e.g. \"video\" or \"software-development\".",
                "type": "string"
              },
              "limit": {
                "description": "How many to return (default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "pricing": {
                "description": "Only tools with this pricing: free, freemium (free plan plus paid), paid, or contact (sales only).",
                "enum": ["free", "freemium", "paid", "contact"],
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Tools in a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0c62a9484cc390bf28b5bb21c56ca1cafe40ea80e019131264fa0f221f739319"
        },
        {
          "name": "find_alternatives",
          "title": "Alternatives to a tool",
          "description": "AI tools in the directory that do similar work to the one named, best match first, each with its listing link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many to return (default 5).",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "tool": {
                "description": "The tool’s name, listing slug, or listing link.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Alternatives to a tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:023bd60d3de0e604956c1f956d9b03f55bdff9f1f16022a093a038cefda24d90"
        },
        {
          "name": "get_tool",
          "title": "One AI tool in full",
          "description": "The full Best AI Things listing for one tool: what it does, pricing and plans, platforms, API, MCP server, license, and common questions, with its listing link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "tool": {
                "description": "The tool’s name, its listing slug, or its listing link.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One AI tool in full"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b2ae92fa16a7dce5abf67640ce87b4d9e9b7662b8b0e6fa6566a91864b2560a"
        },
        {
          "name": "list_categories",
          "title": "Categories",
          "description": "Every directory category with its slug, how many tools it has, and its page.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:15d5956063b174644890b520eb6cee42b8b896b258470e6109da4a0506d5ad9b"
        },
        {
          "name": "search_tools",
          "title": "Search AI tools",
          "description": "Finds AI tools in the Best AI Things directory for a job or by name, e.g. \"remove background noise from podcasts\" or \"Cursor\". Returns up to 10, best match first, each with its listing link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Only this category (a slug from list_categories).",
                "type": "string"
              },
              "limit": {
                "description": "How many to return (default 6).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "pricing": {
                "description": "Only tools with this pricing: free, freemium (free plan plus paid), paid, or contact (sales only).",
                "enum": ["free", "freemium", "paid", "contact"],
                "type": "string"
              },
              "query": {
                "description": "What the tool should do, or its name.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search AI tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba39a246a06b562e98aa7dd7385a57e607bfeaed397c826626a15d5d7f554710"
        }
      ],
