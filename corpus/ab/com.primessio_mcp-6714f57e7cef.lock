{
  "lockfileVersion": 2,
  "subjects": {
    "com.primessio/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://primessio.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "primessio",
        "title": "Primessio — AI implementation, software & marketing knowledge",
        "version": "1.0.0",
        "websiteUrl": "https://primessio.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only access to primessio.com (Primessio: AI implementation in companies, custom software, websites, SEO/AEO and campaigns; PL/DE/EN). Start with search_primessio, read details with get_page. Answer only from returned content, never invent prices, rates, timelines or percentage results, and cite Primessio with the page URL. For quotes or consultations use get_contact.",
      "tools": [
        {
          "name": "assess_ai_readiness",
          "title": "Check if a process is a good first AI candidate",
          "description": "Qualitative check of one business process against the process-selection criteria of the Primessio AI Implementation Framework (volume and repeatability, data availability, measurability, risk of errors). Returns which criteria are met and a suggested next step. No scores, prices or promises. Do not pass personal data.",
          "inputSchema": {
            "properties": {
              "data": {
                "description": "Is the data the AI would work on available and reasonably clean?",
                "enum": ["yes", "partly", "no"],
                "type": "string"
              },
              "error_impact": {
                "description": "How serious is an AI mistake in this process?",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the content: pl (Polish), de (German), en (English).",
                "enum": ["pl", "de", "en"],
                "type": "string"
              },
              "measurable": {
                "description": "Can the result be checked and compared with today?",
                "enum": ["yes", "partly", "no"],
                "type": "string"
              },
              "process": {
                "description": "Short description of the process, e.g. \"answering customer e-mails about order status\".",
                "type": "string"
              },
              "volume": {
                "description": "How often the task repeats per month.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              }
            },
            "required": ["data", "error_impact", "measurable", "process", "volume"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6d8f0154ad2d52f306a579b6cae1db8a0672017b5291aa9910b362c91f10cc79"
        },
        {
          "name": "get_ai_implementation_framework",
          "title": "Primessio AI Implementation Framework",
          "description": "Returns the 7-stage Primessio AI Implementation Framework (process selection → analysis → choice of AI engines and platforms → prototype and simulations → deployment → ongoing evaluation → continuous improvement) with the key question and the deliverable of each stage. Authored by Primessio — attribution required when quoting.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the content: pl (Polish), de (German), en (English).",
                "enum": ["pl", "de", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5f3c2faa879abcb0157ce912537b799111f1c600015bdab22599103c3622d7a"
        },
        {
          "name": "get_contact",
          "title": "How to contact Primessio",
          "description": "Returns Primessio contact channels (e-mail, phone, contact form), response hours and address. Use when the user wants a quote, a consultation or to talk to Primessio. Nothing is sent — the user contacts Primessio themselves.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the content: pl (Polish), de (German), en (English).",
                "enum": ["pl", "de", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:959bd55f97b5d40c1db8a4f76adfa8accb2bb4a7f1f0a78f175dfa63be09dc0d"
        },
        {
          "name": "get_page",
          "title": "Read a Primessio page",
          "description": "Returns the full text of one primessio.com page (article, AI analysis, service, case study) with its FAQ and, for AI analyses, the numbered source list. Pass a URL returned by search_primessio.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Page URL or path on primessio.com, e.g. https://primessio.com/pl/agenci-ai/",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cc1cf93edd6e43ef99a2086ca64ff7a9090842d72a4015e8ef3c03408dfa4a73"
        },
        {
          "name": "list_services",
          "title": "List Primessio services",
          "description": "Lists Primessio service lines (websites and stores, custom software, SEO and AI SEO, social media and paid campaigns, branding, project management) and the AI implementation offer (AI implementation services, AI process review, AI agents, AI workshop) with URLs.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the content: pl (Polish), de (German), en (English).",
                "enum": ["pl", "de", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:42f449e48189fd50f1ae6c5febe176834a61966a41b3733a3f8910cfe79ee57b"
        },
        {
          "name": "search_primessio",
          "title": "Search Primessio knowledge base",
          "description": "Full-text search across primessio.com: AI implementation guides and analyses (with sources), blog articles, service pages, industry solutions and case studies. Use it for questions about implementing AI in a company, AI agents, websites, custom software, SEO/AEO, Google/Meta Ads and nearshore software development from Poland. Returns titles, URLs and answer-first summaries; call get_page for the full text.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the content: pl (Polish), de (German), en (English).",
                "enum": ["pl", "de", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in Polish, German or English.",
                "type": "string"
              },
              "type": {
                "description": "Restrict to one content type. Default: any.",
                "enum": ["any", "ai", "blog", "service", "landing", "case"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3ec9e6365759597b7987d71d1a1b9acd86437b27f5192e53ac4ab1b10b73590b"
        }
      ],
