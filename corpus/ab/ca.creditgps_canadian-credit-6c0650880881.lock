        {
          "name": "explain_canadian_credit_mechanics",
          "title": "How Canadian credit reporting actually works",
          "description": "Use this for a requested explanation of Canadian credit scores, reports, utilization, or reporting timing. Returns the Canada-specific mechanics of credit reporting, each entry leading with the correction to the common United States-based answer: the 300-900 scale and two-bureau market, statement-close versus due-date reporting, provincial rather than federal regulation, soft pulls and free-report rights, how utilization is read, and why open banking does not open up bureau data. Returns bundled reference material, optionally filtered or calculated from inputs; does not fetch live data or change accounts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "topic": {
                "description": "A single topic id. Omit to get all of them.",
                "enum": ["statement_close_vs_due_date", "scores_and_scale", "checking_your_own_file", "regulation", "open_banking", "utilization"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asOf": {
                "type": "string"
              },
              "disclosure": {
                "type": "string"
              },
              "topics": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "correction": {
                      "type": "string"
                    },
                    "detail": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "id": {
                      "type": "string"
                    },
                    "sources": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
