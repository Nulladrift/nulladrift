      "serverInfo": {
        "name": "creditgps",
        "title": "Credit GPS",
        "version": "0.3.1",
        "description": "Calculate credit-card utilization, compare payment scenarios, and estimate payoff timelines from figures you provide. Includes Canadian credit-reporting reference information. No bank or credit-bureau access.",
        "websiteUrl": "https://creditgps.ca",
        "icons": [
          {
            "src": "https://mcp.creditgps.ca/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"],
            "theme": "dark"
          },
          {
            "src": "https://mcp.creditgps.ca/icon-light.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"],
            "theme": "light"
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Credit GPS provides Canadian credit-card scenario calculations and dated reference material.\n\nUse calculation tools for user-requested utilization comparisons, payment scenarios, statement calendars, payoff timelines, and hypothetical card closures. Use reference tools for Canadian reporting questions, newcomer pathways, and product information. Budgeting, investment recommendations, transactions, and non-Canadian credit rules are outside scope.\n\nAll tools are read-only and use supplied figures or bundled data. They do not access bank accounts or credit files, execute payments, or fetch live information. Use card nicknames; do not request account numbers, a SIN, credentials, or full credit reports.\n\nCredit GPS is available throughout Canada, including Quebec. Users obtain free bureau reports themselves and manually enter figures in the separate Credit GPS application for score tracking. Use describe_credit_gps for those instructions. The plugin cannot save entries, retrieve stored scores, or pull Equifax or TransUnion files. Direct bureau pulls are not on the current near-term roadmap.\n\nCollect the figures required by the selected tool. The tools estimate_close_card_impact, find_statement_close_date, explain_when_issuers_report, explain_missed_payment, explain_retention_periods, explain_canadian_credit_mechanics, and list_credit_building_products can answer without figures; otherwise ask for missing inputs. Pass the user's local date as today. Keep unknown APR and minimum payments omitted. Treat assumed dates as provisional, never as confirmed deadlines.\n\nStatement closing dates are planning inputs, not verified bureau transmission dates. Actual reporting timing, balances, payment posting, and product eligibility can differ. Preserve assumptions and source dates. The calculator's utilization bands are planning thresholds, not validated score-model boundaries. No score-point forecasts, confidence percentages, or approval predictions are available.\n\nReference data as of 2026-08-23.",
      "tools": [
        {
          "name": "calculate_payoff_timeline",
          "title": "How long to pay this card off",
          "description": "Use this for \"if I pay $200 a month, when is this paid off?\" or \"what happens if I only pay the minimum?\". Returns how long a card takes to clear at a fixed monthly payment and the interest paid over that time. This is a cost question, not a reporting one: it does not change what the bureaus see, so use get_reported_snapshot or simulate_paydown for that. Requires the card's purchase APR; without it no timeline is returned, because the rate decides the answer. Calculates scenarios from supplied figures; does not make payments, change accounts, fetch external data, or retain tool inputs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cardName": {
                "description": "Which card to pay off. Partial names are matched.",
                "maxLength": 80,
                "type": "string"
              },
              "cards": {
                "description": "The person's revolving credit accounts. Ask for limit, statement balance, and statement closing date per card — those three drive everything.",
                "items": {
                  "properties": {
                    "aprPercent": {
                      "description": "Purchase APR as a percentage, e.g. 19.99. Omit when unknown. Never pass 0 to mean unknown — 0 is a real interest-free rate and cost estimates would understate what a balance costs.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "creditLimit": {
                      "description": "Credit limit in CAD. Use 0 for a charge card or any account with no set limit — it is then excluded from utilization.",
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "currentBalance": {
                      "description": "Today's balance, if it differs from the statement balance. Defaults to statementBalance.",
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "dueDate": {
                      "description": "Payment due date for the current statement. Defaults to 21 days after the closing date.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "isOverdue": {
                      "description": "True if a payment is past due right now.",
                      "type": "boolean"
                    },
                    "last4": {
                      "description": "Last four digits, only to tell two similar cards apart. Optional and never required.",
                      "maxLength": 4,
                      "type": "string"
                    },
                    "minimumPayment": {
                      "description": "The issuer's minimum payment. Omit if unknown — do not pass 0 to mean unknown.",
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "name": {
                      "description": "What the person calls this card, e.g. \"TD Cash Back Visa\" or \"the blue one\".",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "statementBalance": {
                      "description": "Balance at the most recent statement close. This is the figure the issuer reported, and the one utilization is read from. If only today's balance is known, pass it here and say so.",
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "statementCloseDate": {
                      "description": "The day the NEXT statement closes — the date the engine targets. Found on a statement or in online banking. If omitted, a placeholder 30 days out is assumed and flagged.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["creditLimit", "name", "statementBalance"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "monthlyPayment": {
                "description": "Fixed amount paid each month in CAD. Omit to use the card's minimum payment, if one was supplied.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "today": {
                "description": "Today's date in the person's local timezone, yyyy-mm-dd. Pass it — the server otherwise falls back to UTC, which is a day ahead for Canadian evenings.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["cardName", "cards"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "aprBps": {
                "type": ["number", "null"]
              },
              "aprUnknown": {
                "type": "boolean"
              },
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "atMinimum": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "monthlyPayment": {
                        "type": "number"
                      },
                      "months": {
                        "type": ["number", "null"]
                      },
                      "neverShrinks": {
                        "type": "boolean"
                      },
                      "totalInterest": {
                        "type": ["number", "null"]
                      }
                    },
                    "required": ["monthlyPayment", "months", "neverShrinks", "totalInterest"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "balance": {
                "type": "number"
              },
              "cardName": {
                "type": "string"
              },
              "disclosure": {
                "type": "string"
              },
              "monthlyPayment": {
                "type": "number"
              },
              "months": {
                "type": ["number", "null"]
              },
              "neverShrinks": {
                "type": "boolean"
              },
              "totalInterest": {
                "type": ["number", "null"]
              }
            },
            "required": ["aprBps", "aprUnknown", "assumptions", "atMinimum", "balance", "cardName", "disclosure", "monthlyPayment", "months", "neverShrinks", "totalInterest"],
            "type": "object"
          },
