        {
          "name": "get_reported_snapshot",
          "title": "Calculate utilization from supplied balances",
          "description": "Use this when someone asks how their cards look, where they stand, or which card is the problem. Returns utilization from supplied balances, days to the supplied closing date, and a hypothetical payment to reach the target. It does not determine future bureau-reported balances. This is the difference between today's balance and the figure the issuer transmits. Calculates scenarios from supplied figures; does not make payments, change accounts, fetch external data, or retain tool inputs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cards": {
                "description": "The person's revolving credit accounts. Ask for limit, statement balance, and statement closing date per card — those three drive everything.",
                "items": {
                  "properties": {
                    "aprPercent": {
                      "description": "Purchase APR as a percentage, e.g. 19.99. Omit when unknown. Never pass 0 to mean unknown — 0 is a real interest-free rate and cost estimates would understate what a balance costs.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "creditLimit": {
                      "description": "Credit limit in CAD. Use 0 for a charge card or any account with no set limit — it is then excluded from utilization.",
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "currentBalance": {
                      "description": "Today's balance, if it differs from the statement balance. Defaults to statementBalance.",
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "dueDate": {
                      "description": "Payment due date for the current statement. Defaults to 21 days after the closing date.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "isOverdue": {
                      "description": "True if a payment is past due right now.",
                      "type": "boolean"
                    },
                    "last4": {
                      "description": "Last four digits, only to tell two similar cards apart. Optional and never required.",
                      "maxLength": 4,
                      "type": "string"
                    },
                    "minimumPayment": {
                      "description": "The issuer's minimum payment. Omit if unknown — do not pass 0 to mean unknown.",
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "name": {
                      "description": "What the person calls this card, e.g. \"TD Cash Back Visa\" or \"the blue one\".",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "statementBalance": {
                      "description": "Balance at the most recent statement close. This is the figure the issuer reported, and the one utilization is read from. If only today's balance is known, pass it here and say so.",
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "statementCloseDate": {
                      "description": "The day the NEXT statement closes — the date the engine targets. Found on a statement or in online banking. If omitted, a placeholder 30 days out is assumed and flagged.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["creditLimit", "name", "statementBalance"],
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "targetUtilization": {
                "description": "Target utilization as a decimal. Defaults to 0.29 — one point under the 30% band.",
                "maximum": 0.95,
                "minimum": 0.01,
                "type": "number"
              },
              "today": {
                "description": "Today's date in the person's local timezone, yyyy-mm-dd. Pass it — the server otherwise falls back to UTC, which is a day ahead for Canadian evenings.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["cards"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "band": {
                "enum": ["good", "elevated", "high"],
                "type": "string"
              },
              "blendedUtilization": {
                "type": "number"
              },
              "cards": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "band": {
                      "enum": ["good", "elevated", "high"],
                      "type": "string"
                    },
                    "creditLimit": {
                      "type": "number"
                    },
                    "daysUntilClose": {
                      "type": "number"
                    },
                    "daysUntilDue": {
                      "type": "number"
                    },
                    "dueDate": {
                      "type": "string"
                    },
                    "isOverdue": {
                      "type": "boolean"
                    },
                    "minimumPayment": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "payToTarget": {
                      "type": ["number", "null"]
                    },
                    "reportedBalance": {
                      "type": "number"
                    },
                    "statementCloseDate": {
                      "type": "string"
                    },
                    "utilization": {
                      "type": "number"
                    }
                  },
                  "required": ["band", "creditLimit", "daysUntilClose", "daysUntilDue", "dueDate", "isOverdue", "minimumPayment", "name", "payToTarget", "reportedBalance", "statementCloseDate", "utilization"],
                  "type": "object"
                },
                "type": "array"
              },
              "disclosure": {
                "type": "string"
              },
              "isEmpty": {
                "type": "boolean"
              },
              "totalLimit": {
                "type": "number"
              },
              "totalReported": {
                "type": "number"
              }
            },
            "required": ["assumptions", "band", "blendedUtilization", "cards", "disclosure", "isEmpty", "totalLimit", "totalReported"],
            "type": "object"
          },
