        {
          "name": "explain_missed_payment",
          "title": "Missing a payment, and what happens after",
          "description": "Use this for a missed, late, or nearly-late payment, or for \"how long will this hurt me\". Returns what happens when a Canadian credit card payment is missed: the roughly 30-day gap before it is reported at all, the Canadian R1-R9 rating scale a tradeline actually carries, and how long a reported late payment stays on the file. The Canadian answer differs from the American one on both the scale and the duration, and the 30-day gap is frequently actionable, because a payment caught inside it often never reaches the file. Returns bundled reference material, optionally filtered or calculated from inputs; does not fetch live data or change accounts.",
