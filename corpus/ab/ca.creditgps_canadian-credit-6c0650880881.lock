                      "type": ["string", "null"]
                    },
                    "action": {
                      "type": "string"
                    },
                    "amount": {
                      "type": ["number", "null"]
                    },
                    "dueByDate": {
                      "type": ["string", "null"]
                    },
                    "forecast": {
                      "description": "No validated score prediction is available.",
                      "type": "null"
                    },
                    "kind": {
                      "enum": ["payment", "habit", "monitor"],
                      "type": "string"
                    },
                    "status": {
                      "enum": ["done", "current", "upcoming", "ongoing"],
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "why": {
                      "type": "string"
                    }
                  },
                  "required": ["accountName", "action", "amount", "dueByDate", "forecast", "kind", "status", "title", "why"],
                  "type": "object"
                },
                "type": "array"
