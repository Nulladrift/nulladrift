{
  "lockfileVersion": 2,
  "subjects": {
    "com.finflashes/finflashes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.finflashes.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "finflashes",
        "version": "0.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "FinFlashes answers with India's official statistics. Every data tool call uses one lookup from the user's daily allowance, so ask for a whole date range in one call. Each answer ends with how many lookups are left today. If FinFlashes says the lookups are used up, or that the plan does not cover the dates asked for, tell the user so in your reply. If you then use other sources, say that those figures are not from FinFlashes.",
      "tools": [
        {
          "name": "get_calendar",
          "title": "Get release calendar",
          "description": "Economic release calendar between two dates (default: the last 7 days to 30 days ahead), with scheduled times and, once out, the actual value. release_at is UTC; release_at_ist is the same time in India (IST), ready to show. Each call uses one FinFlashes lookup from a small daily allowance, so ask for the whole date range in one call instead of one call per year.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dataset": {
                "description": "a calendar dataset id from list_datasets; default all",
                "type": "string"
              },
              "from": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "importance": {
                "enum": ["high", "medium", "low"],
                "type": "string"
              },
              "limit": {
                "default": 300,
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["data"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:2fd61742eb57d184bbdbf2dbf80f5f317c057c3e2ae1e8fd499be0a1fe148c93"
        },
        {
          "name": "get_releases",
          "title": "Get economic releases",
          "description": "Statistics as first published by the source (first prints), as captured by FinFlashes: the scheduled release time, when we recorded the number, and the delay we recorded. Times are UTC; release_at_ist is the release time in India (IST), ready to show. India rows also carry `quote`, the sentence from the official press release that printed the number, when FinFlashes holds it: use it to quote the release word for word. Filter by dataset and series. Each call uses one FinFlashes lookup from a small daily allowance, so ask for the whole date range in one call instead of one call per year.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dataset": {
                "description": "a releases dataset id from list_datasets; default all",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "series": {
                "description": "series key or part of its name, e.g. CPI",
                "type": "string"
              },
              "since": {
                "description": "earliest period, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["data"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:65e629d8af3c76d0bfd96b3c56cd921f5fb505198282ef628ce6eecbdc6d170a"
        },
        {
          "name": "get_table",
          "title": "Get data table",
          "description": "Rows from a tabular dataset (flows, holdings, money markets, mutual funds, IPOs, index closes, power and more), newest first by the dataset's date column. Filter by date range and exact column values. The reply says how many rows matched, and has_more / next_offset when there are more to page through. list_datasets shows each table's columns. Each call uses one FinFlashes lookup from a small daily allowance, so ask for the whole date range in one call instead of one call per year.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dataset": {
                "description": "a table dataset id from list_datasets",
                "type": "string"
              },
              "from": {
                "description": "earliest date, YYYY-MM-DD (YYYY-MM and YYYY also work); applies to the dataset's date column",
                "type": "string"
              },
              "limit": {
                "default": 200,
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "to": {
                "description": "latest date, same formats as from",
                "type": "string"
              },
              "where": {
                "additionalProperties": {
                  "type": ["string", "number"]
                },
                "description": "exact matches (case-insensitive), e.g. {\"category\": \"FPI\"}",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["dataset"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["data"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:112be778065922cf45f835c369a0803464cce536b2d501f68d21214c9dad32fa"
        },
        {
          "name": "list_datasets",
          "title": "List datasets",
          "description": "List the datasets available to you: what each holds and its date coverage. Start here.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "enum": ["releases", "calendar", "prices", "table", "bars", "news"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["data"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:e225bf073c8d53cbafec686143a057e7e3096d65eb2794af5f89609066f2fd78"
        },
        {
          "name": "show_india_macro_dashboard",
          "title": "India macro dashboard",
          "description": "Show an interactive dashboard of statistics published by India's government, as first published: CPI inflation, industrial production (IIP) growth and real GDP growth, with their history, the latest US policy rate, inflation and unemployment figures, and the next scheduled releases. Open data only. Hosts that can't show the page get a text summary. Each call uses one FinFlashes lookup from a small daily allowance, so ask for the whole date range in one call instead of one call per year.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["data"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://finflashes/india-macro.html"
            },
            "ui/resourceUri": "ui://finflashes/india-macro.html"
          },
          "digest": "sha256:69d34b92860cb7e96dc4883071a9d934d20996fa3850604fb57b2b0e532b222b"
        }
      ],
      "resources": [
