          },
          "digest": "sha256:86ee61954971f67ae816c3c2ae7fea8b4645cbdc939629e74335b561f5a49c99"
        },
        {
          "name": "search_happy_hours",
          "title": "Search Happy Hours",
          "description": "Search public Austin happy-hour listings by text, day, and item type. Results are sanitized public data only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "day": {
                "enum": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
                "type": "string"
              },
              "itemType": {
                "enum": ["Beer", "Wine", "Spirit", "Food"],
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d76b72c04b0aeb51fd0cd734e715e08fa769cbf8ec4b78d1f15db5f7ba816dd8"
        }
      ],
      "digest": "sha256:6002d2d958466a1972374889c861d2d681bd16d2de30d6ecc75cf9b62e6e9606"
    }
