{
  "lockfileVersion": 2,
  "subjects": {
    "com.austinhappyhourdatabase/happy-hours": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.austinhappyhourdatabase.com/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "austin-happy-hour-database-public",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This MCP server exposes read-only public Austin Happy Hour Database listing data. Do not infer private Payload CMS state. Verify time-sensitive venue details with the venue source before presenting them as current fact.",
      "tools": [
        {
          "name": "find_happy_hours",
          "title": "Find Happy Hours",
          "description": "Find detailed public Austin happy-hour candidates by text, active day/time, category, and proximity. Returns matching schedules, offers, coordinates, source links, revision metadata, straight-line distance in meters, and remaining deal time for crawl planning.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "enum": ["Beer", "Wine", "Spirit", "Food"],
                "type": "string"
              },
              "day": {
                "description": "Austin local weekday. Required when time is provided.",
                "enum": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
                "type": "string"
              },
              "latitude": {
                "description": "Origin latitude. Must be provided with longitude.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "description": "Origin longitude. Must be provided with latitude.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "minimumRemainingMinutes": {
                "description": "Only include active windows with at least this many minutes remaining. Requires day and time.",
                "maximum": 1440,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "radiusMeters": {
                "description": "Maximum straight-line radius from the origin. Requires latitude and longitude.",
                "maximum": 50000,
                "minimum": 1,
                "type": "integer"
              },
              "time": {
                "description": "24-hour HH:mm in America/Chicago. Returns programs active at this time.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:211b422b3782eda90f928de87ab719700da238e0da489a3bfcf027dd7376589c"
        },
        {
          "name": "get_happy_hour",
          "title": "Get Happy Hour",
          "description": "Return one public Austin happy-hour listing by slug or exact name. Results are sanitized public data only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4b146f8c21e6815e7b71aefd0b6aa6849f5f988270aba71a17305b4d6dd36582"
        },
        {
          "name": "hhdb_public_prep",
          "title": "HHDB Public Prep",
          "description": "Check public MCP readiness, listing count, cache state, and available read-only tools.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a7bebe77a127d8931e687199c02273df6516454d96f01edca7fe0646b35e8ca2"
        },
        {
          "name": "list_happy_hours",
          "title": "List Happy Hours",
          "description": "Return paginated public Austin happy-hour listing summaries. Results are sanitized public data only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
