        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://certapoland.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "certapoland-assessment",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "book_consultation",
          "description": "Ask Certa Poland for a consultation call. Give preferred times with a time zone. A person replies by email with a Google Meet invitation or another proposed time, usually within 1 business day. Nothing is booked automatically. Before calling, show the user this privacy notice and get their agreement: \"We use your details only to reply. If you submit this form, we may also attach information about the source of your visit. Details: Privacy Policy (https://certapoland.com/privacy-policy/).\" Set userConfirmedPrivacyNotice to true only after the user agrees. This is not legal or tax advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "employerCountry": {
                "description": "Region where the employer is registered: EU for EU/EEA/Switzerland, US for the United States, ZZ for any other country",
                "enum": ["EU", "US", "ZZ"],
                "type": "string"
              },
              "message": {
                "maxLength": 2000,
                "type": "string"
              },
              "preferredTimes": {
                "description": "Preferred days and times for a call, with a time zone, e.g. \"Tue-Thu 10:00-14:00 CET\".",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "topic": {
                "enum": ["Hire a new employee in Poland", "Move a contractor to employment", "Run Polish payroll", "Check ZUS / PIT obligations", "A1 posted worker", "Compare with EOR / subsidiary", "Other"],
                "type": "string"
              },
              "userConfirmedPrivacyNotice": {
                "const": true,
                "type": "boolean"
              }
            },
            "required": ["email", "employerCountry", "preferredTimes", "topic", "userConfirmedPrivacyNotice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:37ff29f3e60d3b93238e536fd60f049df0f89fec6a7048d918eb71c1341755e7"
        },
        {
          "name": "estimate_employment_cost",
          "description": "Estimate the full employer cost (\"gross-to-gross\") of one employment contract in Poland from a monthly gross salary in PLN. Indicative model for a foreign employer with no Polish establishment: returns the January breakdown, the low/high band driven by the statutory accident-insurance rate, and the assumptions behind every number. `estimate.totalMonthly` is one person's January employment cost WITHOUT Certa's fee and WITHOUT setup. The additive `budget` block adds, for an optional headcount, the Certa fee (EUR 300 per employee per month, from get_services) and the model-year total (sum of 12 modelled months); there is no separate setup fee - registrations and HR documentation are included in the monthly fee (`budget.complete: true`). Not legal or tax advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accidentRate": {
                "description": "Employer accident-insurance rate as a fraction (statutory range 0.0067–0.0333). Omit for the default rate.",
                "maximum": 0.0333,
                "minimum": 0.0067,
                "type": "number"
              },
              "currency": {
                "default": "PLN",
                "description": "Presentation currency of the returned amounts. Does not change the input.",
                "enum": ["PLN", "EUR"],
                "type": "string"
              },
              "grossSalary": {
                "description": "Monthly gross salary in PLN. Always PLN, regardless of the currency field.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "number"
              },
              "headcount": {
                "default": 1,
                "description": "Number of people with the SAME salary and settings (whole number 1–100, default 1). Affects only the additive `budget` block; `estimate` always describes one person in January.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "ppk": {
                "default": false,
                "description": "Whether the employee participates in PPK (auto-enrolment pension plan).",
                "type": "boolean"
              }
            },
            "required": ["grossSalary"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:512e81ffe205b0f317a7195ea9ec52c08e89386581a376c88ff51e563ce95165"
        },
        {
          "name": "get_services",
          "description": "List packages and pricing for hiring and payroll in Poland (single source of truth for price). `serviceRoutes` lists the three routes (direct employment, Polish company setup, running a Polish entity) with price type fixed/from/range/quoted_after_assessment; `amount: null` means quoted after assessment, never zero.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:59f1ac15587eae1a9f9b61e97e31f48eb7375709c0b6d69bf10266b8585be957"
        },
        {
          "name": "request_assessment",
          "description": "Send a request for a written assessment to Certa Poland (Biuro Rachunkowe Precyzja Sp. z o.o.). A person reads it and replies by email, usually within 1 business day. Before calling, show the user this privacy notice and get their agreement: \"We use your details only to reply. If you submit this form, we may also attach information about the source of your visit. Details: Privacy Policy (https://certapoland.com/privacy-policy/).\" Set userConfirmedPrivacyNotice to true only after the user agrees. Nothing is booked, signed or paid by this call. This is not legal or tax advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "calculationSummary": {
                "maxLength": 2000,
                "type": "string"
              },
              "email": {
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "employeeStatus": {
                "enum": ["candidate_identified", "already_working", "planning"],
                "type": "string"
              },
              "employerCountry": {
                "description": "Region where the employer is registered: EU for EU/EEA/Switzerland, US for the United States, ZZ for any other country",
                "enum": ["EU", "US", "ZZ"],
                "type": "string"
              },
              "headcount": {
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "message": {
                "maxLength": 2000,
                "type": "string"
              },
              "peExposure": {
                "enum": ["no", "yes", "not_sure"],
                "type": "string"
              },
              "role": {
                "maxLength": 200,
                "type": "string"
              },
              "startDate": {
                "maxLength": 40,
                "type": "string"
              },
              "topic": {
                "enum": ["Hire a new employee in Poland", "Move a contractor to employment", "Run Polish payroll", "Check ZUS / PIT obligations", "A1 posted worker", "Compare with EOR / subsidiary", "Other"],
                "type": "string"
              },
              "urgency": {
                "enum": ["exploring", "this_quarter", "urgent"],
                "type": "string"
              },
              "userConfirmedPrivacyNotice": {
                "const": true,
                "type": "boolean"
              }
            },
            "required": ["email", "employeeStatus", "employerCountry", "headcount", "topic", "urgency", "userConfirmedPrivacyNotice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
