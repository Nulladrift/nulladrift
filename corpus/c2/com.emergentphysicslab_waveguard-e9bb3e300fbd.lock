        {
          "name": "waveguard_scan",
          "description": "Find outliers and anomalies in structured data — ideal as a second step after pulling records from Google Sheets, Airtable, Supabase, Notion databases, HubSpot, Financial APIs, GitHub, NPM, or any source that returns rows of JSON. Fully stateless: send known-good rows as training and suspect rows as test in ONE call. Returns per-row anomaly scores, confidence levels, and the top features explaining WHY each row was flagged.\n\nTypical workflow: (1) Pull data from another tool (e.g. Google Sheets, Supabase query, HubSpot deals). (2) Pass the first N rows as training (normal baseline). (3) Pass remaining or new rows as test. (4) Report which rows are anomalous and why.\n\nWorks on JSON objects, numbers, text, arrays. No separate training step required.\n\nExamples:\n- Spreadsheet QA: Pull 500 sales rows from Sheets → train on first 400 → test last 100 → flag outlier entries\n- Financial screening: Get ratios for 50 stocks from a financial API → find anomalous ones\n- CRM hygiene: Pull HubSpot deals → flag deals with unusual discount/value patterns\n- Dependency audit: Get NPM package metrics → flag packages with anomalous quality scores\n- Commit review: Pull GitHub commit metadata → flag unusual commit patterns",
          "inputSchema": {
            "properties": {
              "encoder_type": {
                "description": "Data encoder type. Omit to auto-detect from data shape.",
                "enum": ["json", "numeric", "text", "timeseries", "tabular", "image", "correlation", "complex_numeric"],
                "type": "string"
              },
              "field_level": {
                "description": "Physics field complexity. 0 = real scalar (default). 1 = complex field (phase-aware, 62-dim fingerprint).",
                "enum": [0, 1],
                "type": "integer"
              },
              "sensitivity": {
                "description": "Anomaly threshold multiplier (default: 2.0). Lower = more sensitive. Higher = less sensitive. Range: 0.5 to 5.0.",
                "type": "number"
              },
              "test": {
                "description": "1+ data points to check for anomalies — new entries, recent rows, or the subset you want validated. Same type/shape as training. Each sample is scored independently.",
                "minItems": 1,
                "type": "array"
              },
              "training": {
                "description": "2+ examples of NORMAL/expected data — the known-good baseline. Typically the bulk of rows from a spreadsheet, database query, or API response. All samples should be the same type/shape. More samples = better baseline (10-100 is ideal for tabular data).",
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["test", "training"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Scan Data for Anomalies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5f1d2698f3367a2b01708d07d87d27d7084ea596468d888cdd08748ffee2563b"
