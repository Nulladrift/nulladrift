{
  "lockfileVersion": 2,
  "subjects": {
    "com.resolvemesh/compatibility": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://resolvemesh.com/mcp/public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "resolvemesh-public-compatibility",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use these read-only tools only for the bounded ResolveMesh compatibility catalog and its approved change ledger. No authentication, tenant data, provider execution, or request-time remote fetching is available.",
      "tools": [
        {
          "name": "compatibility_changes",
          "title": "List approved compatibility changes",
          "description": "Return cursor-paginated, approved ResolveMesh compatibility events using the same allowlisted filters as the public JSON API.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client": {
                "enum": ["chatgpt-web", "chatgpt-desktop", "claude-code", "cursor", "codex", "gemini-cli", "vs-code", "windsurf", "copilot-coding-agent"],
                "type": "string"
              },
              "cursor": {
                "maxLength": 2048,
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "severity": {
                "enum": ["INFORMATIONAL", "ACTION_REQUIRED", "BREAKING"],
                "type": "string"
              },
              "since": {
                "type": "string"
              },
              "tool": {
                "enum": ["github", "linear", "figma", "notion", "atlassian", "stripe", "supabase", "sentry", "vercel", "neon"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cad01818f648f7fe5330f77783cc573407760f74cd1f4ba55b67e7737fedb84a"
        },
        {
          "name": "compatibility_lookup",
          "title": "Look up client and tool compatibility",
          "description": "Return the source-backed ResolveMesh compatibility result for one allowlisted client and hosted-tool pair.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client": {
                "enum": ["chatgpt-web", "chatgpt-desktop", "claude-code", "cursor", "codex", "gemini-cli", "vs-code", "windsurf", "copilot-coding-agent"],
                "type": "string"
              },
              "tool": {
                "enum": ["github", "linear", "figma", "notion", "atlassian", "stripe", "supabase", "sentry", "vercel", "neon"],
                "type": "string"
              }
            },
            "required": ["client", "tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c5f1544836505bb0e6b0c73a56753d761b6c24b73cdbe311754ff89e7ed16096"
        }
      ],
      "digest": "sha256:ffcaa683a20163a10bf5379cca873cd67c75f504f3baebe9efc156db15a1d79e"
    }
  }
}
