{
  "lockfileVersion": 2,
  "subjects": {
    "com.resolvemesh/compatibility": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://resolvemesh.com/mcp/public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "resolvemesh-public-compatibility",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use these read-only tools only for the bounded ResolveMesh compatibility catalog and its approved change ledger. No authentication, tenant data, provider execution, or request-time remote fetching is available.",
      "tools": [
        {
          "name": "compatibility_changes",
          "title": "List approved compatibility changes",
          "description": "Return cursor-paginated, approved ResolveMesh compatibility events using the same allowlisted filters as the public JSON API.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client": {
                "enum": ["chatgpt-web", "chatgpt-desktop", "claude-code", "cursor", "codex", "gemini-cli", "vs-code", "windsurf", "copilot-coding-agent"],
                "type": "string"
              },
              "cursor": {
                "maxLength": 2048,
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "severity": {
                "enum": ["INFORMATIONAL", "ACTION_REQUIRED", "BREAKING"],
                "type": "string"
              },
              "since": {
                "type": "string"
              },
              "tool": {
                "enum": ["github", "linear", "figma", "notion", "atlassian", "stripe", "supabase", "sentry", "vercel", "neon"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9828cd846a3cc8e44a030f96b7d5aa7243ca881ae3782e16e682c2984b23571c"
        },
        {
          "name": "compatibility_lookup",
          "title": "Look up client and tool compatibility",
          "description": "Return the source-backed ResolveMesh compatibility result for one allowlisted client and hosted-tool pair.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client": {
                "enum": ["chatgpt-web", "chatgpt-desktop", "claude-code", "cursor", "codex", "gemini-cli", "vs-code", "windsurf", "copilot-coding-agent"],
                "type": "string"
              },
              "tool": {
                "enum": ["github", "linear", "figma", "notion", "atlassian", "stripe", "supabase", "sentry", "vercel", "neon"],
                "type": "string"
              }
            },
            "required": ["client", "tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27caa30262227e7eb4de396706e6f0cc8eb278293f91aee14fded6566777ed5c"
        }
      ],
      "digest": "sha256:dea458860bc12774ad7c8ecffd041498cd1c0f795383e062d5aa700a0683f639"
    }
  }
}
