      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Package Pricing Lab by Modern Mustard Seed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Package Pricing Lab helps a service business price its work as fixed packages. build_packages turns costs, capacity and deliverables into three tiers with margin math and a capacity check. stress_test_package shows what scope creep and a slow month do to one package. compare_models sets the current time-based approach beside packages for the same work. package_scope_language writes the included, adjustments and not-included lines. All four are deterministic arithmetic or templates, read-only, with no network access and nothing stored.",
      "tools": [
        {
          "name": "build_packages",
          "title": "Build three fixed packages",
          "description": "Turn the work a service business does into three fixed-price packages (smallest, middle, largest). Takes the cost base (fixed costs, owner pay, staff, delivery capacity) and the deliverables the business offers, each marked core (every client needs it), common (most clients want it) or premium (some clients want it), with its typical effort and direct cost. Returns each tier with what it includes and leaves out, its cost, break-even price, target price, a recommended price rounded up to a clean number, margin and profit per sale, how far the work can overrun before the margin hits zero, and a capacity check: hours needed, break-even clients a month, and the month profit after owner pay. All results are deterministic arithmetic with the method explained. Adjustments to what was built are treated as included, so effort carries a variance buffer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business": {
                "description": "The business cost base.",
                "properties": {
                  "currency": {
                    "description": "Three-letter currency code. Default USD.",
                    "maxLength": 3,
                    "minLength": 3,
                    "type": "string"
                  },
                  "delivery_hours_per_month": {
                    "description": "Hours the whole team can put into client work in a month, not counting sales and admin. Used to measure capacity and cost, never shown to clients.",
                    "exclusiveMinimum": 0,
                    "maximum": 20000,
                    "type": "number"
                  },
                  "monthly_fixed_costs": {
                    "description": "Overhead every month regardless of work: rent, software, insurance, vehicles, accounting.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "monthly_owner_pay": {
                    "description": "What the owner needs to take home each month. It is treated as a cost, so profit is what is left after the owner is paid.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "monthly_staff_cost": {
                    "description": "Salaried team cost per month, including payroll taxes. Default 0.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "planned_utilization_pct": {
                    "description": "Share of delivery hours expected to be filled in a normal month. Default 80.",
                    "maximum": 100,
                    "minimum": 10,
                    "type": "number"
                  },
                  "variable_cost_per_hour": {
                    "description": "Cost that rises with each delivery hour, such as subcontractor or crew wages. Default 0.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["delivery_hours_per_month", "monthly_fixed_costs", "monthly_owner_pay"],
                "type": "object"
              },
              "clients_per_month": {
                "description": "Clients expected per month. When given, the capacity check shows hours needed and the month profit.",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "items": {
                "items": {
                  "properties": {
                    "direct_cost": {
                      "description": "Cost paid out for this deliverable: materials, licenses, printing, subcontracted parts. Default 0.",
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "effort_hours": {
                      "description": "Typical delivery effort for this deliverable, used for cost and capacity only.",
                      "exclusiveMinimum": 0,
                      "maximum": 10000,
                      "type": "number"
                    },
                    "level": {
                      "description": "core: every client needs it (in all three tiers). common: most clients want it (middle and largest tiers). premium: some clients want it (largest tier only).",
                      "enum": ["core", "common", "premium"],
                      "type": "string"
                    },
                    "name": {
                      "description": "A deliverable, for example \"Logo suite in three formats\" or \"Site visit and measurements\".",
                      "maxLength": 160,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["effort_hours", "level", "name"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 3,
                "type": "array"
              },
              "mix_pct": {
                "description": "Expected share of clients choosing each tier, smallest first, adding to 100. Default 30, 50, 20.",
                "items": {
                  "maximum": 100,
                  "minimum": 0,
                  "type": "number"
                },
                "maxItems": 3,
                "minItems": 3,
                "type": "array"
              },
              "offer_name": {
                "description": "What the packages sell, for example \"Brand identity\" or \"Bathroom remodel design\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "outcome_value": {
                "description": "What the result is worth to a typical client, for a value check on each price.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "target_margin_pct": {
                "description": "Profit as a share of price, after owner pay and every cost. Default 30.",
                "maximum": 80,
                "minimum": 0,
                "type": "number"
              },
              "tier_names": {
                "description": "Names for the three tiers, smallest first. Default Essential, Standard, Complete.",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 3,
                "type": "array"
              },
              "variance_buffer_pct": {
                "description": "Extra effort added to each tier because a fixed price absorbs jobs that run long. Default 15.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["business", "items", "offer_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build three fixed packages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bacada257583268cc0ad5008d87060a5bbd883c20aacf10ca42102167b0f7df5"
        },
        {
          "name": "compare_models",
          "title": "Compare time-based billing with packages",
          "description": "Compare the economics of how a business charges today, by the hour or by the day, with fixed packages for the same work. Takes the cost base, the current rate and unit, the share of hours worked that reach an invoice, one to three packages with price and typical effort, and jobs per month. The current rate always comes from the user and is never assumed. Returns, at several efficiency gains (default 0, 15 and 30 percent less effort as delivery gets repeatable), revenue and profit per job and per month under each model, earnings per hour worked, revenue ceilings at full capacity, the package price that matches what each job collects today, and plain findings. Deterministic arithmetic with the method explained.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business": {
                "description": "The business cost base.",
                "properties": {
                  "currency": {
                    "description": "Three-letter currency code. Default USD.",
                    "maxLength": 3,
                    "minLength": 3,
                    "type": "string"
                  },
                  "delivery_hours_per_month": {
                    "description": "Hours the whole team can put into client work in a month, not counting sales and admin. Used to measure capacity and cost, never shown to clients.",
                    "exclusiveMinimum": 0,
                    "maximum": 20000,
                    "type": "number"
                  },
                  "monthly_fixed_costs": {
                    "description": "Overhead every month regardless of work: rent, software, insurance, vehicles, accounting.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "monthly_owner_pay": {
                    "description": "What the owner needs to take home each month. It is treated as a cost, so profit is what is left after the owner is paid.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "monthly_staff_cost": {
                    "description": "Salaried team cost per month, including payroll taxes. Default 0.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "planned_utilization_pct": {
                    "description": "Share of delivery hours expected to be filled in a normal month. Default 80.",
                    "maximum": 100,
                    "minimum": 10,
                    "type": "number"
                  },
                  "variable_cost_per_hour": {
                    "description": "Cost that rises with each delivery hour, such as subcontractor or crew wages. Default 0.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["delivery_hours_per_month", "monthly_fixed_costs", "monthly_owner_pay"],
                "type": "object"
              },
              "current": {
                "properties": {
                  "billed_share_pct": {
                    "description": "Share of hours actually worked that end up on invoices, after write-downs and unbilled admin. Default 85.",
                    "maximum": 100,
                    "minimum": 1,
                    "type": "number"
                  },
                  "direct_costs_passed_through": {
                    "description": "True when materials and other direct costs are charged to the client at cost today. Default true.",
                    "type": "boolean"
                  },
                  "hours_per_day": {
                    "description": "Hours in a charged day, when unit is day. Default 8.",
                    "maximum": 24,
                    "minimum": 1,
                    "type": "number"
                  },
                  "rate": {
                    "exclusiveMinimum": 0,
                    "maximum": 1000000,
                    "type": "number"
                  },
                  "unit": {
                    "description": "Whether the current rate is charged per hour or per day.",
                    "enum": ["hour", "day"],
                    "type": "string"
                  }
                },
                "required": ["rate", "unit"],
                "type": "object"
              },
              "efficiency_gains_pct": {
                "description": "Effort reductions to compare, in percent. Default 0, 15, 30.",
                "items": {
                  "maximum": 89,
                  "minimum": 0,
                  "type": "number"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "jobs_per_month": {
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "packages": {
                "items": {
                  "properties": {
                    "direct_cost": {
                      "maximum": 100000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "effort_hours": {
                      "description": "Typical delivery effort for the same job today.",
                      "exclusiveMinimum": 0,
                      "maximum": 10000,
                      "type": "number"
                    },
                    "name": {
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "price": {
                      "exclusiveMinimum": 0,
                      "maximum": 100000000,
                      "type": "number"
                    },
                    "share_pct": {
                      "description": "Share of jobs that would be this package. Give for all or none.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["effort_hours", "name", "price"],
                  "type": "object"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["business", "current", "jobs_per_month", "packages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare time-based billing with packages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1bd531050cd8c44ce683ef3a935db1d681bc4ef1b84b1a44c631d5c64bab85bc"
        },
        {
          "name": "package_scope_language",
          "title": "Write package scope language",
          "description": "Write plain scope language for one to three fixed packages: an included line for each deliverable, an adjustments line (adjustments to anything delivered are included at no added cost), out-of-scope lines (deliverables from larger packages and anything listed as excluded), the rule that a genuinely new deliverable becomes a new package scoped and priced before work starts, worked boundary examples, and a ready-to-paste text block per package. Lines that use time-based or extra-charge wording are left out and named in notes. Written in \"we\" by default or \"I\" for a solo business.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ascending": {
                "description": "True when packages are listed smallest first and each includes the one before it. Default true when there is more than one package.",
                "type": "boolean"
              },
              "packages": {
                "items": {
                  "properties": {
                    "excludes": {
                      "description": "Things clients often assume are included but are not, for example \"Printing\" or \"Permit fees\".",
                      "items": {
                        "maxLength": 240,
                        "type": "string"
                      },
                      "maxItems": 30,
                      "type": "array"
                    },
                    "includes": {
                      "description": "Deliverables with quantities where they matter, for example \"2 logo concepts\" or \"One site visit and measurements\".",
                      "items": {
                        "maxLength": 240,
                        "type": "string"
                      },
                      "maxItems": 40,
                      "minItems": 1,
                      "type": "array"
                    },
                    "name": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["includes", "name"],
                  "type": "object"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "voice": {
                "description": "\"we\" (default) for a team, \"I\" for a solo business.",
                "enum": ["we", "I"],
                "type": "string"
              }
            },
            "required": ["packages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Write package scope language"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9ef050f2a9a13e6be63ce074199a2a8acdeb8f31dd18ecb8218317e818cbfb42"
        },
        {
          "name": "stress_test_package",
          "title": "Stress test a package",
          "description": "Show what scope creep and a slow month do to one fixed-price package. Takes the cost base, the package price, its typical effort and direct cost, and optionally sales per month and a cash reserve. Returns margin and profit per sale at each scope creep level (default 10, 25 and 50 percent more effort on the same deliverables), the overrun at which the package earns nothing, the price that holds the target margin at the worst case, and the month view: a normal month, a slow month (default 40 percent fewer sales), a slow month with creep, break-even sales a month, and how many slow months the reserve covers. Deterministic arithmetic with the method explained.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business": {
                "description": "The business cost base.",
                "properties": {
                  "currency": {
                    "description": "Three-letter currency code. Default USD.",
                    "maxLength": 3,
                    "minLength": 3,
                    "type": "string"
                  },
                  "delivery_hours_per_month": {
                    "description": "Hours the whole team can put into client work in a month, not counting sales and admin. Used to measure capacity and cost, never shown to clients.",
                    "exclusiveMinimum": 0,
                    "maximum": 20000,
                    "type": "number"
                  },
                  "monthly_fixed_costs": {
                    "description": "Overhead every month regardless of work: rent, software, insurance, vehicles, accounting.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "monthly_owner_pay": {
                    "description": "What the owner needs to take home each month. It is treated as a cost, so profit is what is left after the owner is paid.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "monthly_staff_cost": {
                    "description": "Salaried team cost per month, including payroll taxes. Default 0.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "planned_utilization_pct": {
                    "description": "Share of delivery hours expected to be filled in a normal month. Default 80.",
                    "maximum": 100,
                    "minimum": 10,
                    "type": "number"
                  },
                  "variable_cost_per_hour": {
                    "description": "Cost that rises with each delivery hour, such as subcontractor or crew wages. Default 0.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["delivery_hours_per_month", "monthly_fixed_costs", "monthly_owner_pay"],
                "type": "object"
              },
              "cash_reserve": {
                "description": "Cash set aside for slow months.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "package": {
                "properties": {
                  "direct_cost": {
                    "description": "Direct cost per sale. Default 0.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "effort_hours": {
                    "description": "Typical delivery effort for one sale of this package.",
                    "exclusiveMinimum": 0,
                    "maximum": 10000,
                    "type": "number"
                  },
                  "name": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "price": {
                    "exclusiveMinimum": 0,
                    "maximum": 100000000,
                    "type": "number"
                  }
                },
                "required": ["effort_hours", "name", "price"],
                "type": "object"
              },
              "sales_per_month": {
                "description": "Normal sales of this package per month. Enables the slow month view.",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "scope_creep_pct": {
                "description": "Extra effort levels to test, in percent. Default 10, 25, 50.",
                "items": {
                  "maximum": 300,
                  "minimum": 0,
                  "type": "number"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "slow_month_drop_pct": {
                "description": "How far sales fall in a slow month, in percent. Default 40.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "target_margin_pct": {
                "description": "Default 30.",
                "maximum": 80,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["business", "package"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Stress test a package"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0dc513b49162c9a1aa963a98d7744d1cd414e0e9a67a42b5ee81015f1b1bff30"
        }
      ],
      "digest": "sha256:1f9b1e298c302ab342d18c9a212479f1ad15c88c61e1947215f4dc6c91c05bd7"
    }
  }
