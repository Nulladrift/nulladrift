  "subjects": {
    "app.openkrill/contact-details": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://contacts.openkrill.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "contact-details",
        "title": "Contact Details Finder: Site emails, phones, socials",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Contact Details Finder: Site emails, phones, socials. Pass the company website as url; a bare domain means https. Lead with the emails and phones, then the social links. For each email domain say whether it is mail-ready from email_domains: mailReady true means the domain takes mail, not that the mailbox exists, so never promise an email will not bounce. phonesUncertain are numbers seen in page text: say they are unconfirmed. If status is blocked_by_robots, tell the user the site asks crawlers not to read it and do not try another way. If status is unreachable, give the reason from notes. Use it for company and organisation websites. Never use it to find a private person's contact details, to collect addresses for spam, or on a site the user may not crawl. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "find_contact_details",
          "title": "Find a website's emails, phones and social links",
          "description": "Finds the contact details a company website publishes. Use it when the user asks how to reach a company, or asks for its email, phone or social accounts. For example: \"find the contact email of example.com\" or \"what is the phone number on https://shop.example/contact?\". Pass the site address; it reads 10 pages unless max_pages asks for more, up to 20. It returns the emails, sure phones (tel: links), uncertain phones (page text) and social profile links for 13 networks, found on the start page and the same-site pages it links to. It also returns the pages it read, and for each email domain whether it can receive mail (MX) and has SPF and DMARC. It obeys robots.txt, runs no JavaScript and reads public sites only. Don't use it to look up a private person or to collect addresses for bulk mail.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "url": "https://www.python.org/"
              }
            ],
            "properties": {
              "check_mail": {
                "description": "Check MX, SPF and DMARC for each email domain found (true by default)",
                "type": "boolean"
              },
              "max_depth": {
                "description": "How many links away from the start page to go; 0 reads only the start page; 1 by default",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "max_pages": {
                "description": "Pages to read at most, the start page included; 10 by default",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "url": {
                "description": "The company website or page to start from, such as https://example.com or example.com",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "contacts": {
                "description": "Each list sorted, without repeats; social links in one canonical https form",
                "properties": {
                  "discords": {
                    "description": "discords found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "emails": {
                    "description": "emails found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "facebooks": {
                    "description": "facebooks found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "instagrams": {
                    "description": "instagrams found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "linkedIns": {
                    "description": "linkedIns found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "phones": {
                    "description": "phones found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "phonesUncertain": {
                    "description": "Numbers seen in page text, not in a tel: link",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "pinterests": {
                    "description": "pinterests found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "reddits": {
                    "description": "reddits found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "snapchats": {
                    "description": "snapchats found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "telegrams": {
                    "description": "telegrams found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "threads": {
                    "description": "threads found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "tiktoks": {
                    "description": "tiktoks found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "twitters": {
                    "description": "twitters found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "whatsapps": {
                    "description": "whatsapps found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "youtubes": {
                    "description": "youtubes found on the pages",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["discords", "emails", "facebooks", "instagrams", "linkedIns", "phones", "phonesUncertain", "pinterests", "reddits", "snapchats", "telegrams", "threads", "tiktoks", "twitters", "whatsapps", "youtubes"],
                "type": "object"
              },
              "domain": {
                "description": "The site's host without www.",
                "type": "string"
              },
              "email_domains": {
                "items": {
                  "properties": {
                    "dmarc": {
                      "type": ["boolean", "null"]
                    },
                    "domain": {
                      "type": "string"
                    },
                    "mailReady": {
                      "description": "true: accepts mail (has MX); false: no MX or a null MX; null: DNS did not answer",
                      "type": ["boolean", "null"]
                    },
                    "mx": {
                      "type": ["boolean", "null"]
                    },
                    "note": {
                      "type": "string"
                    },
                    "spf": {
                      "type": ["boolean", "null"]
                    }
                  },
                  "required": ["dmarc", "domain", "mailReady", "mx", "note", "spf"],
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "description": "Limits of this answer; show them",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pages_scraped": {
                "description": "Pages read and searched for contacts",
                "type": "integer"
              },
              "scraped_urls": {
                "description": "The pages read, in the order they were read",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "status": {
                "enum": ["ok", "blocked_by_robots", "unreachable"],
                "type": "string"
              },
              "url": {
                "description": "The start address as read",
                "type": "string"
              }
            },
            "required": ["as_of", "contacts", "domain", "email_domains", "notes", "pages_scraped", "scraped_urls", "source", "status", "url"],
            "type": "object"
          },
