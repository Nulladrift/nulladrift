                    "type": ["object", "null"]
                  },
                  "next_text": {
                    "description": "The first window ahead that passes the rule, in words on the place's clock, such as \"Mon 6:56 pm to 10:30 pm (3h 34m)\"; null when none does.",
                    "type": ["string", "null"]
                  },
                  "place": {
                    "description": "The place planned for: lat and lon (two decimals for a lat/lon call), tz, and name when a place name was resolved, else null.",
                    "type": "object"
