{
  "lockfileVersion": 2,
  "subjects": {
    "com.cyclecalcs/astronomy": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.cyclecalcs.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "cyclecalcs-astronomy",
        "title": "CycleCalcs Astronomy",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Astronomy calculations from CycleCalcs (cyclecalcs.com): sun and moon times, planet positions and visibility, Mercury and Venus apparition events, the oppositions, conjunctions with the Sun and quadratures of Mars to Neptune, constellation entries of every planet, eclipses, lunar phases, dark-sky observing windows, tonight's clear-sky windows under the MET Norway cloud forecast, and place lookup. Pure astronomy only: no astrology, no fortune-telling, no claims that sky events affect people or Earth. Tool calls work without a key, up to 50 a day per network address. A CycleCalcs API key from RapidAPI (the Basic plan is free; keys at https://rapidapi.com/info-8KZIhinZ9/api/cyclecalcs-astronomy-api3), sent as \"Authorization: Bearer YOUR_KEY\" or \"X-Api-Key: YOUR_KEY\", or entered at OAuth sign-in, meters tool calls on the caller's own plan instead. Dates are ISO 8601 within 1700-2200. Locations are lat/lon in decimal degrees, or a place name the API resolves itself. Numeric field names carry their units (_deg, _km, _hours, _fraction) and coordinate fields state their frame (equatorial.j2000, ecliptic.true_of_date).",
      "tools": [
        {
          "name": "astro_dark_window",
          "title": "Dark moonless observing window",
          "description": "The genuinely dark, moonless observing window for a night: astronomical night intersected with the Moon being down, ranked across up to 62 nights with a trend. The right tool for \"when should I stargaze / photograph the Milky Way / observe deep-sky objects\". Location required. For plain twilight times use astro_sun; for whether tonight's clouds allow it, use observing_windows.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["lat", "lon"]
              },
              {
                "required": ["place"]
              }
            ],
            "properties": {
              "date": {
                "description": "Night to start from. ISO 8601 UTC date or datetime, e.g. \"2026-08-06\" or \"2026-08-06T21:00:00Z\". With a location, a bare date means that date there: its day, its evening and its night. Or jd: followed by a Julian Day on the UT scale, e.g. \"jd:2461000.5\". On astro_positions, date may list up to 24 datetimes separated by commas, answered in the order sent. Omit for the current moment. Years 1700 to 2200 only; outside that range the API refuses with DATE_OUT_OF_RANGE because the ephemeris is not reliable there.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude in decimal degrees, north positive. Send lat and lon together.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, east positive (Lisbon is about -9.14). Send lat and lon together.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "moon_illumination_max": {
                "description": "Treat the Moon as tolerable below this illuminated fraction (0..1) even when up.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "nights": {
                "description": "How many nights to evaluate and rank. Default 1.",
                "maximum": 62,
                "minimum": 1,
                "type": "integer"
              },
              "place": {
                "description": "The place NAME only, one to three words, instead of lat/lon: \"City\" or \"City,CC\" with an ISO country code, e.g. \"Lisbon,PT\". Never a question or a sentence. Resolved server-side; the response then carries a required GeoNames CC BY 4.0 credit in its attribution field, which must be preserved when shown.",
                "type": "string"
              },
              "tz": {
                "description": "IANA timezone like \"Europe/Lisbon\" to render event times in local time. Optional; a resolved place supplies its own timezone.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "The MCP projection of a CycleCalcs v2 response: the answer, plus the provenance a caller needs to use it honestly.",
            "properties": {
              "attribution": {
                "description": "The credit line to display verbatim when rights is attribution_required.",
                "type": "string"
              },
              "data": {
                "additionalProperties": true,
                "description": "The best genuinely dark observing windows across a range of nights.",
                "properties": {
                  "best_night_index": {
                    "description": "Index into `nights` of the best one.",
                    "type": "integer"
                  },
                  "high_latitude_caution": {
                    "description": "True when latitude makes true darkness scarce or absent, so the ranking means less.",
                    "type": "boolean"
                  },
                  "high_latitude_note": {
                    "description": "The explanation when that caution is set.",
                    "type": ["string", "null"]
                  },
                  "method": {
                    "description": "How darkness was defined and how nights were ranked.",
                    "type": "object"
                  },
                  "nights": {
                    "description": "Each night with its dark window and what the Moon does to it.",
                    "type": "array"
                  },
                  "ranked": {
                    "description": "Night indices best to worst.",
                    "type": "array"
                  },
                  "summary": {
                    "description": "The recommendation in brief.",
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "next_cursor": {
                "description": "Present only when more rows exist. Send it back with the SAME start/end arguments as the first call to get the next page.",
                "type": "string"
              },
              "not_computed": {
                "description": "Data this API deliberately does not serve, and why. Present only when the question touched such a field. An absence named here is information: treat it as \"withheld\", never as \"none exists\".",
                "type": "array"
              },
              "rights": {
                "description": "Either unrestricted, or attribution_required when third-party place data was used. When attribution_required, the attribution line must be shown.",
                "type": "string"
              },
              "warnings": {
                "description": "Machine-readable notices about this answer. Present only when non-empty. Never changes whether the call succeeded.",
                "type": "array"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Dark moonless observing window"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["astronomy.read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:61d3c42d86b4c368e62be74a3d259920b01d10635c6becd20a02a704d19d47f4"
        },
        {
          "name": "astro_eclipses",
          "title": "Solar and lunar eclipses",
          "description": "Solar and lunar eclipses: the next or previous from a date, or all in a range, with type, magnitude, obscuration, Saros series and global geometry. A solar eclipse also carries a computed hybrid flag and, when central, the duration, path width and Sun altitude at greatest eclipse. With a location it adds local circumstances, contact times, and an explicit visible-from-here answer; set visible_only to true to keep only eclipses visible there. include adds the precomputed central path or the circumstances at greatest local eclipse. NOTE: count applies per type, so count=3 with type \"both\" can return six events.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "How many eclipses PER TYPE to return.",
                "minimum": 1,
                "type": "integer"
              },
              "cursor": {
                "description": "Opaque pagination cursor from a previous result's next_cursor. Send it with the same start/end arguments as the first page.",
                "type": "string"
              },
              "date": {
                "description": "Anchor date to search from. ISO 8601 UTC date or datetime, e.g. \"2026-08-06\" or \"2026-08-06T21:00:00Z\". With a location, a bare date means that date there: its day, its evening and its night. Or jd: followed by a Julian Day on the UT scale, e.g. \"jd:2461000.5\". On astro_positions, date may list up to 24 datetimes separated by commas, answered in the order sent. Omit for the current moment. Years 1700 to 2200 only; outside that range the API refuses with DATE_OUT_OF_RANGE because the ephemeris is not reliable there.",
                "type": "string"
              },
              "direction": {
                "description": "Search direction from the anchor date. Default \"next\".",
                "enum": ["next", "previous"],
                "type": "string"
              },
              "end": {
                "description": "Last day of an explicit window. ISO 8601 UTC date or datetime, e.g. \"2026-08-06\" or \"2026-08-06T21:00:00Z\". With a location, a bare date means that date there: its day, its evening and its night. Or jd: followed by a Julian Day on the UT scale, e.g. \"jd:2461000.5\". On astro_positions, date may list up to 24 datetimes separated by commas, answered in the order sent. Omit for the current moment. Years 1700 to 2200 only; outside that range the API refuses with DATE_OUT_OF_RANGE because the ephemeris is not reliable there.",
                "type": "string"
              },
              "include": {
                "description": "Optional extras, added to the default blocks rather than replacing them. \"path\": the precomputed central path of a solar eclipse as inline GeoJSON (central line, northern and southern limits, and per-minute duration, width, phase and Sun altitude), for the central eclipses that have one; every other eclipse says why it has none. Large: about 65 to 90 KB of JSON per eclipse, returned as both text and structured content, so ask for one eclipse at a time (type \"solar\", a date just before it, count 1). \"greatest\": the circumstances at greatest eclipse from the supplied location, inside each solar eclipse's local block (requires a location).",
                "items": {
                  "enum": ["path", "greatest"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "lat": {
                "description": "Latitude in decimal degrees, north positive. Send lat and lon together.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, east positive (Lisbon is about -9.14). Send lat and lon together.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "place": {
                "description": "The place NAME only, one to three words, instead of lat/lon: \"City\" or \"City,CC\" with an ISO country code, e.g. \"Lisbon,PT\". Never a question or a sentence. Resolved server-side; the response then carries a required GeoNames CC BY 4.0 credit in its attribution field, which must be preserved when shown.",
                "type": "string"
              },
              "start": {
                "description": "First day of an explicit window (use with end). ISO 8601 UTC date or datetime, e.g. \"2026-08-06\" or \"2026-08-06T21:00:00Z\". With a location, a bare date means that date there: its day, its evening and its night. Or jd: followed by a Julian Day on the UT scale, e.g. \"jd:2461000.5\". On astro_positions, date may list up to 24 datetimes separated by commas, answered in the order sent. Omit for the current moment. Years 1700 to 2200 only; outside that range the API refuses with DATE_OUT_OF_RANGE because the ephemeris is not reliable there.",
                "type": "string"
              },
              "type": {
                "description": "Which kind of eclipse to report. Default \"both\".",
                "enum": ["solar", "lunar", "both"],
                "type": "string"
              },
              "tz": {
                "description": "IANA timezone like \"Europe/Lisbon\" to render event times in local time. Optional; a resolved place supplies its own timezone.",
                "type": "string"
              },
              "visible_only": {
                "description": "true keeps only eclipses visible from the supplied location (requires a location).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "The MCP projection of a CycleCalcs v2 response: the answer, plus the provenance a caller needs to use it honestly.",
            "properties": {
              "attribution": {
                "description": "The credit line to display verbatim when rights is attribution_required.",
                "type": "string"
              },
              "data": {
                "additionalProperties": true,
                "description": "Solar and lunar eclipses in a date range, optionally filtered to one location.",
                "properties": {
                  "central_geometry_note": {
                    "description": "Only when solar eclipses are listed: the lunar-radius convention behind hybrid, the greatest_eclipse fields and the path.",
                    "type": "string"
                  },
                  "eclipse_count": {
                    "description": "How many eclipses matched.",
                    "type": "integer"
                  },
                  "eclipses": {
                    "description": "Each eclipse with its peak instant, kind and Saros series. peak is greatest eclipse for the whole Earth; with a location, a solar row's local block gives the kind, magnitude and maximum_instant where you are. Solar rows also carry hybrid (true for an eclipse total along part of its central track and annular along the rest; kind keeps the value at greatest eclipse), hybrid_transitions, and greatest_eclipse_duration_seconds, greatest_eclipse_path_width_km and greatest_eclipse_sun_altitude_deg (null when there is no central line). With include path, each row has a path object: available, and when true an inline GeoJSON FeatureCollection.",
                    "type": "array"
                  },
                  "next_visible": {
                    "description": "Only when a location was given: the next one visible from there, with local circumstances.",
                    "type": "object"
                  },
                  "next_visible_note": {
                    "description": "Only when a location was given: a caveat about that visibility, when one applies.",
                    "type": "string"
                  },
                  "summary": {
                    "description": "A one-line reading of the range.",
                    "type": "string"
                  },
                  "type": {
                    "description": "Which kinds were asked for: solar, lunar or both.",
                    "type": "string"
                  },
                  "window": {
                    "description": "The range actually evaluated.",
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "next_cursor": {
                "description": "Present only when more rows exist. Send it back with the SAME start/end arguments as the first call to get the next page.",
                "type": "string"
              },
              "not_computed": {
                "description": "Data this API deliberately does not serve, and why. Present only when the question touched such a field. An absence named here is information: treat it as \"withheld\", never as \"none exists\".",
                "type": "array"
              },
              "rights": {
                "description": "Either unrestricted, or attribution_required when third-party place data was used. When attribution_required, the attribution line must be shown.",
                "type": "string"
              },
              "warnings": {
                "description": "Machine-readable notices about this answer. Present only when non-empty. Never changes whether the call succeeded.",
                "type": "array"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Solar and lunar eclipses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["astronomy.read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:a79571879bbaaa68bf84ed143be7c4179010359c9f88ae57500b3a2e598de38c"
        },
        {
          "name": "astro_find_place",
          "title": "Place name to coordinates and timezone",
          "description": "Resolve a place name to coordinates, region, country, IANA timezone and a stable place_id, or reverse-look-up the nearest places to a lat/lon. Results are GeoNames data (CC BY 4.0); the response carries the required credit in its attribution field, which must be preserved when results are shown. Note the other tools accept a place argument directly, so this is only needed to disambiguate a name, filter by country, or reverse-geocode.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["query"]
              },
              {
                "required": ["id"]
              },
              {
                "required": ["lat", "lon"]
              }
            ],
            "properties": {
              "country": {
                "description": "Two-letter ISO country code filter, e.g. \"US\".",
                "type": "string"
              },
              "id": {
                "description": "A place_id from an earlier result, to fetch that exact place.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude in decimal degrees, north positive. Send lat and lon together.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "Maximum matches to return. Default 5.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Longitude in decimal degrees, east positive (Lisbon is about -9.14). Send lat and lon together.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "query": {
                "description": "The place NAME to search for, one to three words, e.g. \"Springfield\" or \"Springfield,US\". Never a question or a sentence: send \"Lisbon\", not \"moon phase tonight in Lisbon\".",
                "type": "string"
              }
            },
            "type": "object"
