                    "type": "object"
                  },
                  "go_tonight": {
                    "description": "True when tonight has a window that passes the rule.",
                    "type": "boolean"
                  },
                  "later": {
                    "description": "Up to two later nights the hourly forecast covers, shaped like tonight.",
