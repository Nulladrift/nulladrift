          "description": "Is tonight good for observing here, and when? The clear, dark windows of tonight, and of the next nights the hourly cloud forecast covers, for one place: astronomical night with the Moon down (or up, with moon \"any\"), under the MET Norway cloud forecast. The windows are the ones the CycleCalcs Observing Planner widget draws, and the rule below decides which count; the answer is the /api/observing-windows feed's. Returns summary (tonight in one sentence on the place's clock), go_tonight (true when tonight has a window that passes the rule), next (the first window ahead that passes, with start, end, minutes and starts_in_minutes), tonight and later. Give lat, lon and tz, or a place name; lat and lon are rounded to two decimals (about 1 km), the precision of the forecast. The right tool for \"is it clear enough to stargaze tonight\" or \"when should I set up the telescope\". For the moonless dark alone, without weather, or for nights past the forecast, use astro_dark_window.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["lat", "lon", "tz"]
              },
              {
                "required": ["place"]
              }
            ],
            "properties": {
              "cloudmax": {
                "description": "The clear limit: an hour is clear when the forecast gives under this percent of total cloud (and under 25 percent fog, with no rain forecast). Default 30.",
                "maximum": 50,
                "minimum": 10,
                "type": "integer"
              },
              "lat": {
                "description": "Latitude in decimal degrees, north positive. Send lat and lon together.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees, east positive (Lisbon is about -9.14). Send lat and lon together.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "min_minutes": {
                "description": "The shortest window worth going out for, in minutes. Default 60.",
                "maximum": 360,
                "minimum": 30,
                "type": "integer"
              },
              "moon": {
                "description": "\"down\" (the default) counts only windows with the Moon below the horizon; \"any\" lets it be up.",
                "enum": ["down", "any"],
                "type": "string"
              },
              "place": {
                "description": "The place NAME only, one to three words, instead of lat/lon: \"City\" or \"City,CC\" with an ISO country code, e.g. \"Lisbon,PT\". Never a question or a sentence. Resolved server-side; the response then carries a required GeoNames CC BY 4.0 credit in its attribution field, which must be preserved when shown.",
                "type": "string"
              },
              "tz": {
                "description": "The place's IANA timezone, such as \"America/Chicago\". Required with lat and lon: tonight and every time in the answer are on the place's clock. A resolved place supplies its own.",
                "type": "string"
              }
            },
            "type": "object"
          },
