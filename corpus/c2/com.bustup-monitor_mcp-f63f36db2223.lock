          "name": "get_concern_detail",
          "description": "指定した悩みの詳細情報を取得します。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "concernId": {
                "description": "悩みID（small-breasts, breast-sagging, post-pregnancy-and-diet, breast-asymmetry, wide-set-breasts, body-proportions, nipple-darkening, choosing-underware）",
