        },
        {
          "name": "get_clinic_detail",
          "description": "指定したクリニックの詳細情報を取得します。各ブランチの住所だけでなく、駅からのアクセス（出口・徒歩分・タクシー・バス・行き方の目印）も含まれます。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "clinicId": {
                "description": "クリニックID（sbc, seishin, shibuya, tokyo, theclinic, ikeda, bell, garden, nagumo, isea, yokohama, mods-clinic）",
                "type": "string"
              }
            },
            "required": ["clinicId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:30ce85cf0072cf0967475b7891cad0364ee4979394d636e7eca4a2c3d9cabed6"
        },
        {
          "name": "get_clinics_by_area",
          "description": "都道府県を指定してクリニックを検索します。該当する院の詳細（院名・住所・駅アクセス）も含めて返します。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "prefecture": {
                "description": "都道府県名（例: 東京都、大阪府、福岡県）",
                "type": "string"
              }
            },
            "required": ["prefecture"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
