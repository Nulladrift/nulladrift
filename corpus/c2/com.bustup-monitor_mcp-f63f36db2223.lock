        {
          "name": "get_postop_guide",
          "description": "豊胸術後の経過ガイド（正常範囲・医学的機序・要注意サイン・推奨アクション）を取得します。症状名でフィルタ可能。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "symptom": {
                "description": "症状名（pain, swelling, fever, redness, lump, hardness, sensation, asymmetry）。省略すると全症状を返す。",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:52a40972a7265ba83ba7dd411c9edfcd5b949cda9df78f5337ec60cfd9102ae4"
        },
        {
          "name": "get_procedure_detail",
          "description": "指定した術式の詳細情報を取得します。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "procedureId": {
                "description": "術式ID（hyaluronic, breast-implants, fat-transfer, condensed-rich-fat-grafting, stem-cell-transfer）",
                "type": "string"
              }
            },
            "required": ["procedureId"],
            "type": "object"
