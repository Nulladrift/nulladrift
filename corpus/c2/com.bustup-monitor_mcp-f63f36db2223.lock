        },
        {
          "name": "get_guide_article_by_slug",
          "description": "スラグを指定してクリニック選びガイドの記事を取得します。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "記事スラグ（例: choosing-by-price, revision-surgery-reality, dangerous-clinic-signs, post-op-aftercare）",
