        },
        {
          "name": "get_complication_detail",
          "description": "指定した合併症の詳細情報（定義・メカニズム・統計・予防・治療・FAQ・引用文献）を取得します。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "complicationId": {
                "description": "合併症ID（capsular-contracture, infection, fat-necrosis, bia-alcl, vascular-embolism, fat-embolism, seroma, implant-rupture, malposition, allergy）",
                "type": "string"
              }
            },
            "required": ["complicationId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
