      "tools": [
        {
          "name": "get_article_by_slug",
          "description": "スラグを指定して世代別記事を取得します。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "記事スラグ（例: elegant-aging）",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
