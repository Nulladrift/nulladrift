          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5f11e4931855ff5daaabab7572a306a2428ff72ce04e960b53530fc9df6fc52c"
        },
        {
          "name": "get_report_by_slug",
          "description": "スラグを指定して編集部レポートを取得します（個人を特定しない形でSNSの声を集約した第三者レポート）。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "レポートスラグ（例: hyaluronic-acid-real-voices, fat-transfer-long-term, monitor-reality-report）",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8596d2861030dbad22687f95d94457ebe6dfd81e0bb3086c5c38fefbd98a335c"
        },
        {
          "name": "search_clinics",
          "description": "条件に合うクリニックを検索します。エリア（都道府県または地方名）と術式で絞り込めます。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "keyword": {
                "description": "クリニック名や説明文での部分検索",
                "type": "string"
              },
              "prefecture": {
                "description": "都道府県名（例: 東京都、大阪府）",
                "type": "string"
              },
              "procedure": {
                "description": "術式名（例: ヒアルロン酸、バッグ挿入、脂肪注入）",
                "type": "string"
              },
              "region": {
                "description": "地方名（例: 関東、関西、九州）。prefectureより優先度が低い",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bc91709ec71c47b6f4032ba9805a871b84b8fb6f14834cf746aac1d67fc2f849"
