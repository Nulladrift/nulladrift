            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "start": {
                "description": "The start of an open hour exactly as my_bookings lists it, e.g. \"2026-09-17T13:30:00.000+02:00\".",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "timeZone": {
                "description": "The person's time zone, e.g. \"Europe/Berlin\". Defaults to Berlin.",
                "maxLength": 64,
                "type": "string"
              },
              "topic": {
                "description": "What the person wants to work on in the hour, in a sentence or two.",
                "maxLength": 500,
