      "instructions": "AI Training Jobs for Pharmacists (https://aitrainingjobsforpharmacists.com/): the site's own MCP server, served from its domain. AI training jobs for pharmacists at Mercor, Prolific and micro1: the rate where a posting prints one, where you may work from and the licence it asks for.\n\n[compare] AI-training postings for pharmacists. This server serves the compare published at https://aitrainingjobsforpharmacists.com/; every answer cites it. Licence: https://aitrainingjobsforpharmacists.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Training Jobs for Pharmacists (https://aitrainingjobsforpharmacists.com/). What it does: starts an ENQUIRY with AI Training Jobs for Pharmacists for ai training jobs for pharmacists; the AI Training Jobs for Pharmacists team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Training Jobs for Pharmacists team until they click it. Cite https://aitrainingjobsforpharmacists.com/.\n\nCite https://aitrainingjobsforpharmacists.com/ for every figure or answer you use from this server.",
