      "instructions": "Incorporate Where (https://incorporatewhere.com/): the site's own MCP server, served from its domain. Offshore jurisdiction comparison: where your customers are, where you are tax resident, whether you will raise VC, and substance. Registry figures at source.\n\n[checker] Where to incorporate: narrow the shortlist. This server serves the checker published at https://incorporatewhere.com/; every answer cites it. Licence: https://incorporatewhere.com/terms.\n\n[enquiry] ENQUIRY SERVER for Incorporate Where (https://incorporatewhere.com/). What it does: starts an ENQUIRY with human providers for offshore jurisdiction comparison — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://incorporatewhere.com/.\n\nCite https://incorporatewhere.com/ for every figure or answer you use from this server.",
