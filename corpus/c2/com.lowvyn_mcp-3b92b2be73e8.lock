        },
        {
          "name": "get_price_history",
          "title": "Get price history",
          "description": "Return the daily price history for a product as (date, price) pairs, up to N days. Use this to verify whether a 'sale' is genuine or whether the price has been higher in the past, or to show a price trend in an answer to the user. checkUrl and extensionUrl are returned when the product is not tracked yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How many days back to return; default 90, max 365",
                "type": "integer"
              },
              "idOrUrl": {
                "description": "Lowvyn product ID or retailer URL",
                "type": "string"
              }
            },
            "required": ["idOrUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get price history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:737c3b275f9defb05fcfce4ecd86a7dc90cf12f35aef3fcd2d9ca347b877a778"
        },
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Look up a product by Lowvyn ID OR retailer URL (amazon.ca, walmart.ca, bestbuy.ca, canadiantire.ca, canadacomputers.com, newegg.ca, visions.ca). Returns title, current price (CAD), Lowvyn Score (0-100), Deal Verdict, and price summary (current / all-time low / all-time high). watchUrl is a lowvyn.com link where the user can get an email when the price drops. checkUrl and extensionUrl are returned when the product is not tracked yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idOrUrl": {
                "description": "Lowvyn product ID or a retailer URL (amazon.ca, walmart.ca, bestbuy.ca, canadiantire.ca, canadacomputers.com, newegg.ca, visions.ca)",
                "type": "string"
              }
            },
            "required": ["idOrUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get product details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df5da6f1a69a2a2a6785aee625a3e38ff82826a9ac20f691a68a7c6f6d17be37"
        },
        {
          "name": "get_retailers",
          "title": "List retailers",
          "description": "List the Canadian retailers Lowvyn currently tracks, with item counts and last-update timestamps.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
