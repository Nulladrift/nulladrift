{
  "lockfileVersion": 2,
  "subjects": {
    "com.lowvyn/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.lowvyn.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lowvyn",
        "version": "0.1.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "find_cheaper",
          "description": "Given a product (by Lowvyn ID or retailer URL), return the same physical product on other Canadian retailers with their current prices and savings. Uses verified UPC matches. Use this when a user wants to know 'can I get this cheaper somewhere else?'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idOrUrl": {
                "description": "Lowvyn product ID or retailer URL",
                "type": "string"
              }
            },
            "required": ["idOrUrl"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7240ac746cc9b1557e9d7bc12072d8d311169785950a29470b26510f1c911800"
        },
        {
          "name": "get_categories",
          "description": "List the product categories Lowvyn covers, with item counts. Useful for narrowing search_products calls.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9698e73e81ed753bcc0eef95048dfa43d4b69f6a3b34d0d5b9d17dc77cb4395a"
        },
        {
          "name": "get_price_history",
          "description": "Return the daily price history for a product as (date, price) pairs, up to N days. Use this to verify whether a 'sale' is genuine or whether the price has been higher in the past, or to show a price trend in an answer to the user.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How many days back to return; default 90, max 365",
                "type": "integer"
              },
              "idOrUrl": {
                "description": "Lowvyn product ID or retailer URL",
                "type": "string"
              }
            },
            "required": ["idOrUrl"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:47a2d14a39a0ba063ce8ebfc6dce119613c2eb150361f267430036a3a18338f3"
        },
        {
          "name": "get_product",
          "description": "Look up a product by Lowvyn ID OR retailer URL (amazon.ca / walmart.ca / bestbuy.ca / canadiantire.ca). Returns title, current price (CAD), Lowvyn Score (0-100), Deal Verdict, and price summary (current / all-time low / all-time high).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idOrUrl": {
                "description": "Lowvyn product ID or a retailer URL (amazon.ca/walmart.ca/bestbuy.ca/canadiantire.ca)",
                "type": "string"
              }
            },
            "required": ["idOrUrl"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f263f4a3e614d8f327321fd8897fe38483a7b48f3ea6e277b6f82cf68aec1303"
        },
        {
          "name": "get_retailers",
          "description": "List the Canadian retailers Lowvyn currently tracks, with item counts and last-update timestamps.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c27a5386eac3e1e15e82d720e35b678e874c570a685228a5f2d666fc3b0df2b1"
        },
        {
          "name": "intent_search",
          "description": "Search the Canadian catalogue by a natural-language description of a NEED rather than keywords. Give it what the shopper actually wants (e.g. 'a quiet gaming laptop under $1500', 'a reliable stroller for travel') and it returns the best-matching products with their current price (CAD), Lowvyn Score, and Deal Verdict, plus what it understood (category, budget, must-haves). A relevance model does the matching; the deterministic deal gate decides the verdict — it never inflates a deal. Use this when the user describes a use case, budget, or constraints instead of naming a product; use search_products for a plain category/price filter. Each result carries an id + canonicalUrl you can pass to get_product, verify_deal, or find_cheaper.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A natural-language description of what the shopper wants, e.g. 'a quiet gaming laptop under $1500' or 'a reliable stroller for travel'",
                "type": "string"
              },
              "sort": {
                "description": "How to order/filter results. 'match' (default) = best match to the described need. 'deal' = order matches by deal quality (best time to buy first), no filter. 'good' = keep only confident good deals (real or modest saving). 'great' (alias 'real') = keep ONLY matches the deterministic gate rates a genuine great deal right now (may be few or none). If the query text itself asks for a good/great deal, that is auto-applied even without this field; set it to override.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:213ea26a6fc977b346a6262550d2982818499481a1d6242013b74b566415aba0"
        },
        {
          "name": "search_products",
          "description": "Search the Canadian product catalogue. Filter by category slug, max price (CAD), and retailer. Returns up to 20 matching products with current price and Lowvyn Score. Use this when a user is exploring what is available in a category rather than asking about a specific product. Each result carries an id + canonicalUrl you can pass to get_product, verify_deal, find_cheaper, or get_price_history.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category slug (e.g. 'cribs')",
                "type": "string"
              },
              "maxPrice": {
                "description": "Optional max price in CAD",
                "type": "number"
              },
              "query": {
                "description": "Free-text search across product titles",
                "type": "string"
              },
              "retailer": {
                "description": "Optional retailer filter: 'amazon', 'walmart', 'bestbuy', or 'canadiantire'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4fab28176efb3ce0c14ddedd8cb8f6f0956f5e312d6c478839a9d4c791fe404d"
        },
        {
          "name": "verify_deal",
          "description": "Given a product (by Lowvyn ID, retailer URL, or a lowvyn.com product URL from another tool's result) and an optional claimed price, return whether the deal is genuine. Compares against Lowvyn's price history and returns a verdict ('real_deal', 'modest_deal', 'average', 'bad_time', 'insufficient_data') plus an explanation. Use this first when a user asks 'is this actually a good price?'. Accepts the id or canonicalUrl from a search_products / intent_search result directly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claimedPrice": {
                "description": "The price the deal claims, in CAD; omit to verify the live tracked price",
                "type": "number"
              },
              "idOrUrl": {
                "description": "Lowvyn product ID, a retailer URL (amazon.ca/walmart.ca/bestbuy.ca/canadiantire.ca), or a lowvyn.com/product-detail URL from another tool's result",
                "type": "string"
              }
            },
            "required": ["idOrUrl"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ba5f2520e20943d7194f93305f9c3bac4fcd67ad56dcb8960352fd6ae043c97e"
        }
      ],
      "digest": "sha256:53be0bbeb783af1c05964e939df6fc90d4e4350ce4c3d25df98f717541c3f515"
    }
  }
}
