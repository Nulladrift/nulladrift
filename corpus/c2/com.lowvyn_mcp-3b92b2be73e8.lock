            "readOnly": true
          },
          "digest": "sha256:324c942d639fbcdd4d210d8d12418c4ae3dc653afbaa9424248d3ba1f953cfb1"
        },
        {
          "name": "intent_search",
          "title": "Search by need",
          "description": "Search the Canadian catalogue by a natural-language description of a NEED rather than keywords. Give it what the shopper actually wants (e.g. 'a quiet gaming laptop under $1500', 'a reliable stroller for travel') and it returns the best-matching products with their current price (CAD), Lowvyn Score, and Deal Verdict, plus what it understood (category, budget, must-haves). A relevance model does the matching; the deterministic deal gate decides the verdict — it never inflates a deal. Use this when the user describes a use case, budget, or constraints instead of naming a product; use search_products for a plain category/price filter. Each result carries an id + canonicalUrl you can pass to get_product, verify_deal, or find_cheaper.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A natural-language description of what the shopper wants, e.g. 'a quiet gaming laptop under $1500' or 'a reliable stroller for travel'",
                "type": "string"
              },
              "sort": {
                "description": "How to order/filter results. 'match' (default) = best match to the described need. 'deal' = order matches by deal quality (best time to buy first), no filter. 'good' = keep only confident good deals (real or modest saving). 'great' (alias 'real') = keep ONLY matches the deterministic gate rates a genuine great deal right now (may be few or none). If the query text itself asks for a good/great deal, that is auto-applied even without this field; set it to override.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search by need"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b117ef1d4b82ce3b1e66ba8cf6f1e4d38310b4765e5417a5e661fef1025ff76"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search the Canadian product catalogue. Filter by category slug, max price (CAD), and retailer. Returns up to 20 matching products with current price and Lowvyn Score. Use this when a user is exploring what is available in a category rather than asking about a specific product. Each result carries an id + canonicalUrl you can pass to get_product, verify_deal, find_cheaper, or get_price_history.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category slug (e.g. 'cribs')",
                "type": "string"
              },
              "maxPrice": {
                "description": "Optional max price in CAD",
                "type": "number"
              },
              "query": {
                "description": "Free-text search across product titles",
                "type": "string"
              },
              "retailer": {
                "description": "Optional retailer filter: 'amazon', 'walmart', 'bestbuy', or 'canadiantire'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1442673a5a2e1a79ec9c29863b67a8b3d4e8105b84aedd1d8064e120bdae2b5c"
        },
        {
          "name": "verify_deal",
          "title": "Verify a deal",
          "description": "Given a product (by Lowvyn ID, retailer URL, or a lowvyn.com product URL from another tool's result) and an optional claimed price, return whether the deal is genuine. Compares against Lowvyn's price history and returns a verdict ('real_deal', 'modest_deal', 'average', 'bad_time', 'insufficient_data') plus an explanation. Use this when a user asks 'is this actually a good price?' and other retailers don't matter; check_deal answers that and the cheaper-elsewhere question in one call. Accepts the id or canonicalUrl from a search_products / intent_search result directly. watchUrl is a lowvyn.com link where the user can get an email when the price drops. checkUrl and extensionUrl are returned when the product is not tracked yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claimedPrice": {
                "description": "The price the deal claims, in CAD; omit to verify the live tracked price",
                "type": "number"
              },
              "idOrUrl": {
                "description": "Lowvyn product ID, a retailer URL (amazon.ca, walmart.ca, bestbuy.ca, canadiantire.ca, canadacomputers.com, newegg.ca, visions.ca), or a lowvyn.com/product-detail URL from another tool's result",
                "type": "string"
              }
            },
            "required": ["idOrUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a deal"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c2a627f991e906f670746c3cb5309a6592ab087b6adffaf3999d207cb6ac193"
        }
      ],
