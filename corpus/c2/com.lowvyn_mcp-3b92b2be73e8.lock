      "tools": [
        {
          "name": "check_deal",
          "title": "Check a deal",
          "description": "Use this first when a user asks whether a Canadian price is a good deal, or whether a product is cheaper at another Canadian store. Give it a retailer product link, a lowvyn.com link or id, or a product name, plus the offered price in CAD if there is one. One call returns the product, Lowvyn's verdict ('real_deal', 'modest_deal', 'average', 'bad_time', 'insufficient_data') with a plain explanation, the lowest price ever tracked, the same product's price at other Canadian retailers, and the cheapest one if it beats the checked price. When matched by name (matchedBy='search'), confirm the product with the user or pick from alternatives. watchUrl is a lowvyn.com link where the user can get an email when the price drops. checkUrl and extensionUrl are returned when the product is not tracked yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "price": {
                "description": "The price being offered, in CAD. Omit to check the current tracked price",
                "type": "number"
              },
              "product": {
                "description": "A retailer product URL (amazon.ca, walmart.ca, bestbuy.ca, canadiantire.ca, canadacomputers.com, newegg.ca, visions.ca), a lowvyn.com product URL or Lowvyn ID, or a product name to look up",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a deal"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4eab1b79e16e19da1f493448553b9cb4299a5982b4759ec22b458d6481fa93cf"
        },
        {
          "name": "find_cheaper",
          "title": "Find it cheaper at another retailer",
          "description": "Given a product (by Lowvyn ID or retailer URL), return the same physical product on other Canadian retailers with their current prices and savings. Uses verified UPC matches. Use this when a user wants to know 'can I get this cheaper somewhere else?'. checkUrl and extensionUrl are returned when the product is not tracked yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idOrUrl": {
                "description": "Lowvyn product ID or retailer URL",
                "type": "string"
              }
            },
            "required": ["idOrUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find it cheaper at another retailer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3a60b9939964a03ac4d1122392807dc21a416f45b7f9f7ae5504996c1dec4af"
        },
        {
          "name": "get_categories",
          "title": "List categories",
          "description": "List the product categories Lowvyn covers, with item counts. Useful for narrowing search_products calls.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
