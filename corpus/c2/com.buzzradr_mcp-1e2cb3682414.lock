{
  "lockfileVersion": 2,
  "subjects": {
    "com.buzzradr/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://buzzradr.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "buzzradr",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "BuzzRadr serves read-only trend signals. Start with get_daily_digest for a roundup or list_trends to search by keyword, then get_topic for details on one topic. Users can send feedback or report a problem at https://github.com/buzzradr/mcp/issues/new; mention it only when the user comments on result quality or asks how to reach BuzzRadr.",
      "tools": [
        {
          "name": "get_daily_digest",
          "title": "Get the BuzzRadr daily digest",
          "description": "Return the top ~12 trending topics for a vertical as a daily briefing. Use this when the user asks \"what is trending today\", \"what is the AI news today\", or wants a quick roundup. Each topic includes a title, AI summary, why-it-matters reason, a one-line \"why this one\" judgement (aiWhy; absent when none was generated), composite ranking score, platforms, keywords, trusted-source count, and its top items. The score combines source, coverage, engagement and freshness signals; it is not 24-hour discussion heat. locale=\"zh\" opts into Chinese summaries (default English). Read the full topic at https://buzzradr.com/ai/{topicId}.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "description": "Summary and aiWhy language: \"en\" (default) or \"zh\".",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "vertical": {
                "description": "Topic vertical to read. Defaults to \"ai\" (the flagship AI-news radar).",
                "enum": ["ai", "jobs", "world-cup-2026", "finance", "real-estate"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:af551a51ae6208365c675f83705a7a2816d1aba7f663334a739fd5c83afe2f08"
        },
        {
          "name": "get_source_health",
          "title": "Get BuzzRadr source health",
          "description": "Report the ingestion sources behind a vertical and their health: status, last fetch time, accepted/filtered item counts, and any public message. Use this to check data freshness or which platforms feed the radar.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "vertical": {
                "description": "Topic vertical to read. Defaults to \"ai\" (the flagship AI-news radar).",
                "enum": ["ai", "jobs", "world-cup-2026", "finance", "real-estate"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fff6e970debc358b66a2d4d9598cea112d3e0b56514fc684667fd87abe1467d3"
        },
        {
          "name": "get_topic",
          "title": "Get a single BuzzRadr topic",
          "description": "Fetch one trending topic by its topicId (as returned by get_daily_digest / list_trends). Use this to drill into a specific story. Returns \"topic not found\" if the id is unknown or the topic no longer clears the public quality gate. locale=\"zh\" opts into Chinese summaries (default English). Topic page: https://buzzradr.com/ai/{topicId}.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "description": "Summary and aiWhy language: \"en\" (default) or \"zh\".",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "topicId": {
                "description": "The topic id, e.g. \"ai_topic_ugfymp\".",
                "type": "string"
              },
              "vertical": {
                "description": "Topic vertical to read. Defaults to \"ai\" (the flagship AI-news radar).",
                "enum": ["ai", "jobs", "world-cup-2026", "finance", "real-estate"],
                "type": "string"
              }
            },
            "required": ["topicId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b66ca08572392c46cd0950c2ad61ac25e650d0e1ba3b57ec8e8cd6ff54c9e0c8"
        },
        {
          "name": "list_trends",
          "title": "List BuzzRadr trending topics",
          "description": "Search and list trending topics for a vertical with optional filters. Use this to answer \"what is happening with <keyword>\", to filter by platform, or to pull a ranked list. keywords/platforms narrow the results; sort=\"hot\" (default) ranks by composite ranking score, sort=\"time\" by recency; limit is 1-50 (default 20); locale=\"zh\" opts into Chinese summaries (default English). Read a topic at https://buzzradr.com/ai/{topicId}.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "keywords": {
                "description": "Case-insensitive keyword filter; any match keeps a topic.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Maximum topics to return (1-50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Summary and aiWhy language: \"en\" (default) or \"zh\".",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "platforms": {
                "description": "Platform filter, e.g. [\"x\",\"reddit\",\"hackernews\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sort": {
                "description": "Ranking: \"hot\" by composite ranking score (default), not 24-hour discussion heat; or \"time\" by recency.",
                "enum": ["hot", "time"],
                "type": "string"
              },
              "vertical": {
                "description": "Topic vertical to read. Defaults to \"ai\" (the flagship AI-news radar).",
                "enum": ["ai", "jobs", "world-cup-2026", "finance", "real-estate"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:86032cb39c47a79a67cb54d1b8dde877f86e804a4298b65622cb2e222f014a66"
        }
      ],
      "digest": "sha256:6f4e2ab7e7545443de52e9e76e6b412b1d3822bdee7c9c0f942fca98cc1f4bcb"
    }
  }
}
