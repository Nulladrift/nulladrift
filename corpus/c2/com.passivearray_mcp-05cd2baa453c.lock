{
  "lockfileVersion": 2,
  "subjects": {
    "com.passivearray/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://passivearray.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "passive-array",
        "title": "Passive Array",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Passive Array gives measured YouTube and Twitch data from the official APIs: channel stats, daily growth history, monetization signals, comments, keyword research with real ranking data, outlier videos and earnings estimates. Subscriber counts from YouTube are rounded to three significant figures. Earnings and monetization results are estimates and say so. There is no search-volume data. Each call costs Passive Array credits; the result says how many remain today.",
      "tools": [
        {
          "name": "analyze_video_comments",
          "title": "YouTube comment analysis",
          "description": "Comment analytics for one public YouTube video or Short: the channel's reply rate, questions without a reply from the channel (most liked first, with links), buying and collab comments, scam spam still visible, busiest comment hours (UTC) and the words viewers use most. Simple visible word rules, not AI. Reads up to 2,000 comments. Costs 3 Passive Array credits.",
          "inputSchema": {
            "properties": {
              "max": {
                "default": 1000,
                "description": "Top-level comments to read.",
                "maximum": 2000,
                "minimum": 100,
                "type": "integer"
              },
              "order": {
                "default": "time",
                "description": "time = newest first (best for timing), relevance = YouTube's top comments (best for questions).",
                "enum": ["time", "relevance"],
                "type": "string"
              },
              "video": {
                "description": "Video link, Shorts link or 11-character video ID.",
                "type": "string"
              }
            },
            "required": ["video"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "YouTube comment analysis"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b298a38d1d0dc5c36582b7a7bd51fb1c223af88bbe65ee1435e422b036d98aa9"
        },
        {
          "name": "audit_channel_comments",
          "title": "YouTube channel comment audit",
          "description": "Audits a channel's comment section across its latest 5 or 10 uploads: a 0 to 100 comment health score (Passive Array's rubric, every part returned), reply rate, unanswered questions across videos, regular commenters who comment on several videos, buying and collab comments, visible scam spam, comments per 1,000 views and a per-video breakdown. Costs 8 Passive Array credits.",
          "inputSchema": {
            "properties": {
              "channel": {
                "description": "YouTube channel: a link, an @handle, a channel ID starting with UC, or a name. A link or @handle is most reliable.",
                "type": "string"
              },
              "per": {
                "default": 100,
                "description": "Newest comments to read per video.",
                "maximum": 300,
                "minimum": 100,
                "type": "integer"
              },
              "videos": {
                "default": 10,
                "description": "Latest uploads to audit.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["channel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "YouTube channel comment audit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7f58f24669197ecc4b364c16826de4439187dab1112f753857472a28fe81febb"
        },
        {
          "name": "check_monetization",
          "title": "YouTube monetization check",
          "description": "Estimates whether a YouTube channel is in the YouTube Partner Program from public signals: subscriber thresholds, uploads in the last 90 days, made-for-kids flags and, when visible, ad placements on recent videos. Returns a verdict with a confidence percentage, never a certainty, and an ad-revenue range when likely monetized. Costs 2 Passive Array credits.",
          "inputSchema": {
            "properties": {
              "channel": {
                "description": "YouTube channel: a link, an @handle, a channel ID starting with UC, or a name. A link or @handle is most reliable.",
                "type": "string"
              }
            },
            "required": ["channel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "YouTube monetization check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b43ac2d6f1445292e2727e9345ad577af4fb715a74dd0a522aa64e470dd32da1"
        },
        {
          "name": "compare_channels",
          "title": "Compare YouTube channels",
          "description": "Side-by-side live stats for two or three YouTube channels: subscribers, total views, videos, average views, likes and comments on recent uploads, upload pace and Shorts share. Costs 2 Passive Array credits.",
          "inputSchema": {
            "properties": {
              "channels": {
                "description": "Two or three channels (links, @handles, IDs or names).",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["channels"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare YouTube channels"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3eb507d6b67c179170ec515bc7e1907a0dedebd08c9f0b908b03a4830aee2912"
        },
        {
          "name": "estimate_earnings",
          "title": "Estimate YouTube ad earnings",
          "description": "Estimates a channel's monthly and yearly YouTube ad earnings as a range: views on uploads from the last 30 days times an RPM range (what creators keep per 1,000 views). Excludes sponsorships, memberships and merchandise. Costs 1 Passive Array credit.",
          "inputSchema": {
            "properties": {
              "channel": {
                "description": "YouTube channel: a link, an @handle, a channel ID starting with UC, or a name. A link or @handle is most reliable.",
                "type": "string"
              },
              "rpm_high": {
                "default": 4,
                "description": "High RPM in USD per 1,000 views.",
                "type": "number"
              },
              "rpm_low": {
                "default": 0.5,
                "description": "Low RPM in USD per 1,000 views.",
                "type": "number"
              }
            },
            "required": ["channel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Estimate YouTube ad earnings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:01f4208a27a0ad404cb74be959f7f3215ed9f551efbd7f0288184a50c5ac9e1c"
        },
        {
          "name": "get_channel_growth",
          "title": "YouTube channel growth history",
          "description": "Daily subscriber, view and video-count history for a YouTube channel as recorded by Passive Array, with 1, 7, 30, 90 and 365-day change. History starts the day Passive Array first tracked the channel; nothing earlier is backfilled or estimated. Looking a channel up adds it to daily tracking. Costs 1 Passive Array credit.",
          "inputSchema": {
            "properties": {
              "channel": {
                "description": "YouTube channel: a link, an @handle, a channel ID starting with UC, or a name. A link or @handle is most reliable.",
                "type": "string"
              },
              "days": {
                "default": 90,
                "description": "How many most recent daily points to return.",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["channel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "YouTube channel growth history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:90579654ab5b72cd66838a8be90a3cc7c5628555f41c568ce2de2ed272d4dfe3"
        },
        {
          "name": "get_channel_stats",
          "title": "YouTube channel stats",
          "description": "Live public stats for a YouTube channel from the official YouTube Data API: subscribers, total views, video count, country, creation date, keywords, topics, and the last 10 uploads with views, likes, comments, length and date, plus averages (views, likes, comments, uploads per month, Shorts share). Costs 1 Passive Array credit.",
          "inputSchema": {
            "properties": {
              "channel": {
                "description": "YouTube channel: a link, an @handle, a channel ID starting with UC, or a name. A link or @handle is most reliable.",
                "type": "string"
              }
            },
            "required": ["channel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "YouTube channel stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8598d316d49a5edb76b29bed23d3e0d239fd647e2b9042cdc3b2bcb2b468da63"
        },
        {
          "name": "get_outlier_videos",
          "title": "Outlier videos",
          "description": "Videos that are getting far more views than their channel's usual upload (views divided by the channel's median), from Passive Array's daily scan of tracked channels. Filter by topic, long-form or Shorts, and age. Good for spotting ideas that are working right now. Costs 1 Passive Array credit.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 30,
                "description": "Only videos published in the last N days.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "description": "How many videos to return.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_multiplier": {
                "default": 3,
                "description": "Minimum views multiple over the channel's median.",
                "type": "number"
              },
              "topic": {
                "description": "Optional topic filter, e.g. Gaming, Technology, Food, Lifestyle.",
                "type": "string"
              },
              "type": {
                "default": "all",
                "description": "videos = long-form only, shorts = Shorts only.",
                "enum": ["all", "videos", "shorts"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Outlier videos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5be5182f8bc345956373594dd2c57dbd209c52d7be1423e263c1feb6b9d6db2e"
        },
        {
          "name": "get_twitch_channel",
          "title": "Twitch channel and follower history",
          "description": "A Twitch streamer's live data from the official Twitch Helix API (exact follower total, partner status, live status and viewers, recent videos) plus the daily follower history Passive Array has recorded, with 7, 30 and 90-day change. Costs 1 Passive Array credit.",
          "inputSchema": {
            "properties": {
              "login": {
                "description": "Twitch username or twitch.tv link.",
                "type": "string"
              }
            },
            "required": ["login"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Twitch channel and follower history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4719f4e8a6fc9d024c2a8803d54d5e7612b4c9397d10ee1d45a0ecca4698b614"
        },
        {
          "name": "get_video_comments",
          "title": "YouTube video comments",
          "description": "Public comments on a YouTube video or Short, with author, text, likes, reply count and date, plus up to 5 replies per comment. Comments held for review, flagged as spam or deleted are never returned by YouTube's API. Costs 2 Passive Array credits.",
          "inputSchema": {
            "properties": {
              "max": {
                "default": 100,
                "description": "Top-level comments to read.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "order": {
                "default": "relevance",
                "description": "relevance = YouTube's top comments, time = newest first.",
                "enum": ["relevance", "time"],
                "type": "string"
              },
              "video": {
                "description": "Video link, Shorts link or 11-character video ID.",
                "type": "string"
              }
            },
            "required": ["video"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "YouTube video comments"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2980a448e17cd815b31decd8e5cddc7890923bc35465a3920a9c334e804d5344"
        },
        {
          "name": "get_video_stats",
          "title": "YouTube video stats",
          "description": "Live stats for up to 50 YouTube videos: title, channel, publish date, views, likes, comments, length, whether it is live, tag count and tags, plus the channel's subscriber count. Costs 1 Passive Array credit.",
          "inputSchema": {
            "properties": {
              "videos": {
                "description": "Video links, Shorts links or 11-character video IDs.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["videos"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "YouTube video stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9f36d13718748b74be586baf51aa857704f5e33690c8d4f333f308712ac97b5c"
        },
        {
          "name": "keyword_research",
          "title": "YouTube keyword research",
          "description": "Measured YouTube keyword research: YouTube search autocomplete suggestions for the phrase, the top 10 videos ranking for it today (views, channel size, age, engagement), competition metrics and an opportunity score with its formula. No search-volume number is returned, because nobody outside Google measures YouTube search volume. Costs 5 Passive Array credits.",
          "inputSchema": {
            "properties": {
              "keyword": {
                "description": "The search phrase, e.g. \"budget travel japan\".",
                "type": "string"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "YouTube keyword research"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:55f9eca316b1f1a8a330cd9392a394a29bf35fd15c9370b6e5b1fefb325ebfba"
        },
        {
          "name": "search_channels",
          "title": "Find YouTube channels",
          "description": "Finds YouTube channels by keyword or niche, optionally limited to a country (ISO code such as US, GB, IN, BD, PK) and a subscriber range. Returns up to 25 channels with subscribers, views, videos and country. Costs 5 Passive Array credits.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional two-letter country code.",
                "type": "string"
              },
              "max_subscribers": {
                "minimum": 0,
                "type": "integer"
              },
              "min_subscribers": {
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Niche or keyword, e.g. \"home espresso\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find YouTube channels"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a444ab7a13096bd4c8786d7150c9380356856926ea17236b3001e16faa10ee46"
        }
      ],
      "digest": "sha256:02b8a1b6ac26a8ab29ad289c7ce3338a344416646b1b869c7520ea6d64da26d8"
    }
  }
