        },
        {
          "name": "search_european_tools",
          "title": "Search European tools",
          "description": "European software tools by name or by category (\"crm\", \"web analytics\"), with optional filters on exposure level, country and open source. Needs a query or a category.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "A category by slug or name (\"crm\", \"Web analytics\"). See list_categories.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "Country of the contracting company, as an ISO 3166-1 code (\"DE\") or an English name (\"Germany\").",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "How many tools to return, at most 25. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_level": {
                "description": "Only tools whose exposure level, for who can reach the customer's data, is at most this (1: European stack; 2: European region, non-European provider; 3: Account or support data leaves Europe; 4: Core data leaves Europe on some paths; 5: Stored outside Europe by default). A level that is only a lower bound, because the subprocessor list is not complete, does not pass.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "open_source": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "enum": ["0", "1", "true", "false"],
                    "type": "string"
                  }
                ],
                "description": "Only tools whose code is published under an open source licence."
              },
              "query": {
                "description": "Words in the tool's name.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
