        },
        {
          "name": "search_european_tools",
          "title": "Search European tools",
          "description": "European software tools by name or by category (\"crm\", \"web analytics\"), with optional filters on exposure level, country and open source. Needs a query or a category.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
