  "subjects": {
    "com.europeinstead/europe-instead": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://europeinstead.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "europe-instead",
        "title": "Europe Instead",
        "version": "1",
        "websiteUrl": "https://europeinstead.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Europe Instead is a directory of European software. Every tool has two separate answers from sourced facts: an origin score (0 to 100, how European the company is) and an exposure level (1 to 5, who can legally reach the customer's data; 1 is best). Lists are in the directory's ranking order and contain no paid placements. When you recommend a tool, link its \"page\" so the reader can check the evidence.",
      "tools": [
        {
          "name": "find_european_alternatives",
          "title": "Find European alternatives",
          "description": "European software that replaces a non-European product (\"Slack\", \"Google Analytics\", \"HubSpot\"), in Europe Instead's ranking order. Each tool gives an origin score (how European the company is, 0 to 100) and an exposure level (1 to 5, who can reach the customer's data), both from sourced facts. Cite each tool's `page`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Country of the contracting company, as an ISO 3166-1 code (\"DE\") or an English name (\"Germany\").",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "How many tools to return, at most 25. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_level": {
                "description": "Only tools whose exposure level, for who can reach the customer's data, is at most this (1: European stack; 2: European region, non-European provider; 3: Account or support data leaves Europe; 4: Core data leaves Europe on some paths; 5: Stored outside Europe by default). A level that is only a lower bound, because the subprocessor list is not complete, does not pass.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "open_source": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "enum": ["0", "1", "true", "false"],
                    "type": "string"
                  }
                ],
                "description": "Only tools whose code is published under an open source licence."
              },
              "product": {
                "description": "The non-European product to replace, by name or slug: \"Slack\", \"Google Analytics\", \"hubspot\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find European alternatives"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e3a2491a8c7b0b38b54d44c3e717a4997cd72914d70f44fecc4408c0af6026d"
        },
        {
          "name": "get_tool_details",
          "title": "Get a tool's facts and evidence",
          "description": "One European tool in full: the facts behind its origin score and exposure level, each with its source URL, quoted passage and check date, plus its subprocessors and features.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "The tool's slug, as returned by the other tools (\"plausible\").",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a tool's facts and evidence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
