          },
          "digest": "sha256:1accf4f0939cd660f8a10df0d4aae195b8d2bd6ab2b4af14d343e73484b948c1"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Software categories with how many European tools each has, most first. At most 50; filter with a query.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Only names containing these words.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
