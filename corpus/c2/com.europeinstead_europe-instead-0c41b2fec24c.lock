          },
          "digest": "sha256:aaa73a06900d8fe7afa49ac7aaf4b10ba1ecdc8cf2d0748893f57dfab92fec84"
        },
        {
          "name": "submit_correction",
          "title": "Correct a tool's entry",
          "description": "Corrects facts in a listed tool's entry. Read https://europeinstead.com/vendors/correct/{tool}.md first (or get_tool_details): it shows what is held now and its sources, and the exact request to send. Send only the facts that change. A confirmation link is emailed to `email`; nothing counts until the owner of that address opens it within 48 hours, and then a person checks it against public sources before anything on the site changes. Ask the person you act for for their own work email and whether they work at the vendor; never invent either. Every fact needs a public source URL, preferably the vendor's own page. Use dry_run: true first to check the input without sending an email.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "corrections": {
                "additionalProperties": {
                  "additionalProperties": false,
                  "properties": {
                    "action": {
                      "const": "correct",
                      "type": "string"
                    },
                    "note": {
                      "maxLength": 500,
                      "type": "string"
                    },
                    "source": {
                      "maxLength": 300,
                      "type": "string"
                    },
                    "value": {
                      "maxLength": 600,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["action", "note", "source", "value"],
                  "type": "object"
                },
                "description": "Only the facts that are wrong, keyed by fact: legal_entity, ownership, operations, data_residency, openness, exposure, or \"feature.<key>\" for one feature. Each is { \"action\": \"correct\", \"value\": the right fact (at most 200 characters), \"source\": a public http(s) URL that shows it (the vendor's own page preferred), \"note\": \"\" or a short explanation }. At most 60 facts.",
                "propertyNames": {
                  "anyOf": [
                    {
                      "enum": ["legal_entity", "ownership", "operations", "data_residency", "openness", "exposure", "features"],
                      "type": "string"
                    },
                    {
                      "maxLength": 100,
                      "pattern": "^feature\\.[a-z0-9]+(_[a-z0-9]+)*$",
                      "type": "string"
                    }
                  ]
                },
                "type": "object"
              },
              "dry_run": {
                "description": "true to check the input without sending anything: no email, no reference. Send again without it to submit.",
                "type": "boolean"
              },
              "email": {
                "description": "The work email address of the person you act for. Ask them for it; never invent one or use your own. The confirmation link goes there, and an address at the vendor's own domain marks the message as the vendor's.",
                "maxLength": 254,
                "type": "string"
              },
              "tool": {
                "description": "The listed tool's slug (\"plausible\"), as search_european_tools and get_tool_details return it.",
                "maxLength": 100,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              },
              "worksThere": {
                "description": "\"yes\" if that person works at the vendor, else \"no\". Ask them; never guess.",
                "enum": ["yes", "no"],
                "type": "string"
              }
            },
            "required": ["corrections", "email", "tool", "worksThere"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Correct a tool's entry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dfcaf71900586d55b42bb6ba903f5886420ec74d19069df382f2d8b0246df4e5"
        },
        {
          "name": "submit_tool",
          "title": "Suggest a European tool",
          "description": "Suggests a European software tool for the directory. A confirmation link is emailed to `email`; nothing counts until the owner of that address opens it within 48 hours, and then a person checks it against public sources before anything on the site changes. Ask the person you act for for their own work email and whether they work at the vendor; never invent either. Every fact needs a public source URL, preferably the vendor's own page. Use dry_run: true first to check the input without sending an email. Instructions for agents: https://europeinstead.com/vendors/submit.md",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "dry_run": {
                "description": "true to check the input without sending anything: no email, no reference. Send again without it to submit.",
                "type": "boolean"
              },
              "email": {
                "description": "The work email address of the person you act for. Ask them for it; never invent one or use your own. The confirmation link goes there, and an address at the vendor's own domain marks the message as the vendor's.",
                "maxLength": 254,
                "type": "string"
              },
              "name": {
                "description": "The tool's name.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "note": {
                "default": "",
                "description": "Anything a reviewer should know, in a few sentences.",
                "maxLength": 1000,
                "type": "string"
              },
              "replaces": {
                "default": "",
                "description": "Non-European products it replaces, comma-separated (\"Slack, Microsoft Teams\").",
                "maxLength": 200,
                "type": "string"
              },
              "source": {
                "anyOf": [
                  {
                    "const": "",
                    "type": "string"
                  },
                  {
                    "maxLength": 300,
                    "type": "string"
                  }
                ],
                "default": "",
                "description": "A public http(s) page that shows where the company is registered, such as its imprint or legal notice. The vendor's own page is preferred."
              },
              "website": {
                "description": "The tool's website, an http(s) URL.",
                "maxLength": 300,
                "type": "string"
              },
              "worksThere": {
                "description": "\"yes\" if that person works at the vendor, else \"no\". Ask them; never guess.",
                "enum": ["yes", "no"],
                "type": "string"
              }
            },
            "required": ["email", "name", "website", "worksThere"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Suggest a European tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:12a6c9602001ba6601344c4e206a3ec61cea519b48bdeaaa502a50f1e25409dd"
        }
      ],
      "digest": "sha256:8082229a40664a0e2a53898b887c8ddf14c08e2ea5a691cc3abc2e856ab99c37"
    }
  }
