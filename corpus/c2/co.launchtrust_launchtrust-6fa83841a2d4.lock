          "title": "Get sourced compliance rule snapshots",
          "description": "Fetch LaunchTrust's sourced, founder-reviewed compliance rule snapshots, optionally filtered to one jurisdiction code (e.g. eu-ai-act-50, gdpr, ca-sb243). Compliance aid, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jurisdiction": {
                "description": "Optional jurisdiction code to filter by, e.g. gdpr or eu-ai-act-50.",
                "type": "string"
              }
            },
            "type": "object"
          },
