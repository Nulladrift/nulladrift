        {
          "name": "scan_url",
          "title": "Free count-only quick scan",
          "description": "Run a FREE, count-only LaunchTrust quick scan on a public web URL. It runs a quick subset of LaunchTrust's compliance and security checks (frontend secrets, exposed .env/.git files, security headers, HTTPS/HSTS, privacy and terms pages, trackers and cookie consent, AI-interaction disclosure) and returns how many gaps it found, not which ones. The result is unsigned; the count is cached for 15 minutes and not otherwise stored. Which gaps they are, the evidence and how to close them come with LaunchTrust Monitoring (every detector, signed and dated records) or a one-time Launch Audit. Compliance aid, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public http(s) URL to scan, e.g. https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Free count-only quick scan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:70387689e42ede23bddfc293a873d3f24c54a06d8e8c6cbef88778296151a0f1"
        },
        {
          "name": "verify_record",
          "title": "Verify a LaunchTrust signed record",
          "description": "Independently verify the ECDSA (ES256) signature on a LaunchTrust signed scan/disclosure record against the published public key. Pass the record JSON (the downloaded record, or an object containing `canonical` and `signature`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "record": {
