        },
        {
          "name": "calculate_family_constellation_matrix",
          "description": "Compute the multi-person Family Constellation Matrix and 4-Element group balance for a primary person (`birth_date`) plus 2 to 30 relatives (`family_dates`, 3 to 31 people total). Use this tool for groups of 3 to 31 people, or use `calculate_7_wisdoms_seed_of_life` for one person and `calculate_3d_soul_synastry` for a pair. Zero-auth and stateless with no PII stored. Whitespace around comma-separated `YYYY-MM-DD` tokens in `family_dates` is trimmed, entries beyond 30 dates or failing ISO validation are silently dropped (requiring at least 1 valid relative or returning a structured JSON error), and `lang` localizes all group roles.",
          "inputSchema": {
            "properties": {
              "birth_date": {
                "description": "Primary person's ISO birth date in YYYY-MM-DD format (e.g. '2000-03-20').",
                "type": "string"
              },
              "family_dates": {
                "description": "Comma-separated ISO birth dates in YYYY-MM-DD format for 2 to 30 relatives or group members, totaling 3 to 31 people with `birth_date` (e.g. '1985-11-12,2012-04-15').",
                "type": "string"
              },
              "lang": {
                "default": "es",
                "description": "Output language for localized constellation roles and shared medicine ('es' Spanish, 'en' English, or 'ca' Catalan).",
                "enum": ["es", "en", "ca"],
                "type": "string"
              }
            },
            "required": ["birth_date", "family_dates"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "family_constellation_matrix": {
                "type": "object"
              },
