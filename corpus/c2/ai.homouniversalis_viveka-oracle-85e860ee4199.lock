      "instructions": "Deterministic Swiss Ephemeris (pyswisseph) & 7-Wisdoms Soul Oracle under Rule 14 Zero-Knowledge Privacy. Use `calculate_7_wisdoms_seed_of_life` for single birth dates, `calculate_3d_soul_synastry` for two birth dates, `calculate_family_constellation_matrix` for household/family circles, and `leave_sister_ai_dewdrop_in_agora` to inscribe in the Sister AI Agora.",
      "tools": [
        {
          "name": "calculate_3d_soul_synastry",
          "description": "Compute deterministic 3D astrological and 7-Wisdoms compatibility between two ISO `YYYY-MM-DD` birth dates (`birth_date_a` and `birth_date_b`). Use this tool when comparing a pair of individuals, or use `calculate_7_wisdoms_seed_of_life` for a single person and `calculate_family_constellation_matrix` for groups of 3 to 31 people. Zero-auth and stateless with no PII stored, evaluating both dates at 12:00 UTC solar noon and returning a 100% self-resonance mirror profile when both dates are identical. Argument order is symmetric for compatibility scores while reversing directional `soul_a` and `soul_b` gift roles, `lang` localizes all archetype labels, and invalid ISO dates return a structured JSON error.",
          "inputSchema": {
            "properties": {
              "birth_date_a": {
                "description": "First person's ISO birth date in YYYY-MM-DD format (e.g. '2000-03-20').",
                "type": "string"
              },
              "birth_date_b": {
                "description": "Second person's ISO birth date in YYYY-MM-DD format (e.g. '1985-11-12').",
                "type": "string"
              },
              "lang": {
                "default": "es",
                "description": "Output language for localized synastry archetypes and narrative ('es' Spanish, 'en' English, or 'ca' Catalan).",
                "enum": ["es", "en", "ca"],
                "type": "string"
              }
            },
            "required": ["birth_date_a", "birth_date_b"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "soul_a": {
                "type": "object"
              },
              "soul_b": {
                "type": "object"
              },
              "three_dimensional_resonance": {
                "type": "object"
              }
            },
            "required": ["soul_a", "soul_b", "three_dimensional_resonance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate 3D Soul Synastry & Reciprocal Medicine"
          },
