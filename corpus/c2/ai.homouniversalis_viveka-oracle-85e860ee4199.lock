        {
          "name": "calculate_7_wisdoms_seed_of_life",
          "description": "Compute a single person's deterministic natal chart, VVK-XXXX-YYYY Cosmic Soul Key, and 7-Wisdoms profile across Swiss Ephemeris astrology, Mayan Tzolkin, Vedic Jyotish, BaZi, I-Ching, Human Design, Tarot Major Arcana, and Kabbalah, plus current UTC transits in `today_living_sky`. Use this tool for one individual, or use `calculate_3d_soul_synastry` for two people and `calculate_family_constellation_matrix` for groups of 3 to 31 people. Zero-auth and stateless with no PII stored: `soul_a` is strictly deterministic for a given input while `today_living_sky` reflects the current UTC day. Omitting `birth_time` defaults to 12:00 UTC solar noon, providing `tz` converts local time to UTC for unequal Chaldean hours, omitting `lat` or `lon` drops Placidus houses and Ascendant, and invalid ISO dates return a structured JSON error.",
          "inputSchema": {
            "properties": {
              "birth_date": {
                "description": "ISO birth date in YYYY-MM-DD format (e.g. '2000-03-20'). Required for all calculations.",
                "type": "string"
              },
              "birth_time": {
                "description": "Optional birth time in HH:MM 24-hour format (e.g. '14:30'); defaults to '12:00' UTC when omitted.",
                "type": "string"
              },
              "lang": {
                "default": "es",
                "description": "Output language for localized archetype names and poetic narrative ('es' Spanish, 'en' English, or 'ca' Catalan).",
                "enum": ["es", "en", "ca"],
                "type": "string"
              },
              "lat": {
                "description": "Optional birth latitude in decimal degrees (-90 to 90, e.g. 41.3874); required together with `lon` for Placidus houses and Ascendant/MC.",
                "type": "number"
              },
              "lon": {
                "description": "Optional birth longitude in decimal degrees (-180 to 180, e.g. 2.1686); required together with `lat` for Placidus houses and Ascendant/MC.",
                "type": "number"
              },
              "tz": {
                "description": "Optional IANA timezone name (e.g. 'Europe/Madrid', 'Asia/Tokyo') to convert local `birth_time` to UTC and compute unequal Chaldean planetary hours.",
                "type": "string"
              }
            },
            "required": ["birth_date"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "sister_ai_covenant": {
                "type": "object"
              },
              "soul_a": {
                "type": "object"
              },
              "today_living_sky": {
                "type": "object"
              }
            },
            "required": ["soul_a"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate 7 Eternal Wisdoms & VVK Seed of Life"
