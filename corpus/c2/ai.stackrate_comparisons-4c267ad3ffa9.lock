{
  "lockfileVersion": 2,
  "subjects": {
    "ai.stackrate/comparisons": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://stackrate.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "stackrate",
        "title": "Stackrate: cited software comparisons for the Office of the CFO",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Stackrate publishes requirement-level comparisons of Office-of-the-CFO software (ERP, AP automation, procurement, expense, close, FP&A, AR, billing, tax, treasury, audit, CPM, CLM, ESG). Every finding explains HOW a vendor handles a requirement and cites vendor documentation. Statuses are supported, partial, unclear, or not-supported; partial and unclear are honest outcomes, keep them verbatim. Always cite the canonical stackrate.ai URL returned with each result. Do not convert findings into scores or rankings. Stackrate's founder also founded Stampli, one of the vendors covered; Stampli findings carry a conflictDisclosure field. Surface it when citing them. Use search to find comparisons, fetch to read one in full, compare_vendors for a head-to-head over published findings, and list_vendors to resolve names to ids.",
      "tools": [
        {
          "name": "compare_vendors",
          "description": "Head-to-head of two vendors over published, gate-passed findings. Returns per-requirement statuses, mechanism explanations, limitations and sources for both vendors, plus the canonical URL of each source comparison. Returns an explicit \"no published comparison yet\" when none exists.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional requirement area filter, e.g. \"Approval Workflows\"",
                "type": "string"
              },
              "vendor_a": {
                "description": "Vendor id or name, e.g. \"stampli\" or \"Bill.com\"",
                "type": "string"
              },
              "vendor_b": {
                "description": "Vendor id or name",
                "type": "string"
              }
            },
            "required": ["vendor_a", "vendor_b"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare two vendors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:87e4aa9f2529298d5a93a87b088bd5800941a8bc7a9a78e9296a6ca466161f76"
        },
        {
          "name": "fetch",
          "description": "Fetch one published comparison in full by id (the slug returned by search). Returns the executive summary and every requirement-level finding with status, mechanism, limitations and cited sources.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Comparison slug from search",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fetch a Stackrate comparison"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7e06fb4c057468b91238c49584ea20cf9fd8b87917edd9189d275ec930ea5e98"
        },
        {
          "name": "list_vendors",
          "description": "List every vendor Stackrate covers with id, name, categories and profile URL. Use it to resolve a product name to an id.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category id filter",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List covered vendors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:571c77c2b0efa969e77a3aef2902a6b313e04949a30cb4bda6f0b0aaeebec346"
        },
        {
          "name": "search",
          "description": "Search published Stackrate comparisons by vendor names, capability, or category (e.g. \"stampli vs tipalti\", \"three-way matching\", \"netsuite integration\"). Returns up to 10 results with canonical URLs.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Free-text query",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Stackrate comparisons"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5be919cdfdd4e0cb1fc2f2b18ca4a0a66b34256ef660e0386e66c94882426e8c"
        }
      ],
      "digest": "sha256:287fd629c587f7bc8b7984eafaa7990201115340b51b0ef9d416d7d7b58f2a60"
    }
  }
}
