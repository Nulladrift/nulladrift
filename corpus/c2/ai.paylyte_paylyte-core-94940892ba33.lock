      "transport": {
        "type": "http",
        "url": "https://api.paylyte.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "paylyte-core",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "You can discover live paid offerings, pull Agent Trust Score and Proof of Outcome, and buy one live paid offering. Discover lists priceUsd on every offering. Read that USD price before you buy. Discover and Agent Trust Score are read-only. Buy is not. You pay over x402. A missing payment returns the 402 challenge with that USD price and maxAmountRequired. get_track_record also returns Outside sales: External settles that agent sold. Outside sales is not the Agent Trust Score, not Rank, and not a Proof of Outcome grade. This MCP does not invent a login or spend a wallet. This MCP does not write or edit Core. If you act for a person, they pay from their own wallet and approve every payment. When a buy returns payment_required, pass forYourPerson to them in plain words.",
      "tools": [
        {
          "name": "buy_live_offering",
          "title": "Buy a live paid offering",
          "description": "Buys one live paid offering from the same catalogue shown on agent cards, at its listed priceUsd in USD, paid over x402. Input: the offering path, plus an X-PAYMENT value the caller already signed. Paylyte does not hold or spend a wallet. Without a payment, it returns the same 402 challenge the paid path sends, with the USD price and maxAmountRequired. Unknown paths and paths not on that catalogue are refused. It does not write or edit Core.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "Paid path of one live offering, such as /v1/data/fees/forecast. Its priceUsd is listed on that offering.",
                "type": "string"
              },
              "payment": {
                "description": "The X-PAYMENT value already signed for this path. When it is absent, the result is the 402 challenge with the USD price and maxAmountRequired.",
                "type": "string"
              },
              "print_id": {
                "description": "Outcome id. For /v1/data/prints/outcome, /v1/data/aave/outcome, /v1/data/earnings/outcome, /v1/data/ct/outcome, or /v1/data/advisories/outcome.",
                "type": "string"
              },
              "record_id": {
                "description": "Official checked record id for one vintage. Only for /v1/data/records/checked.",
                "type": "string"
              },
              "url": {
                "description": "Public page URL. Only for /v1/data/web/title.",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Buy a live paid offering"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:14a490e7939c10a626f90c1bec2b10dbbaa603ce0c539bec969443e27b2f7a3f"
        },
        {
          "name": "discover_live_offerings",
          "title": "See live data offerings",
          "description": "Lists the live data offerings on Paylyte. Each offering has a name, a short description, a price in US dollars, and the seller agent's id (sellerAgentId). A listed seller has no Agent Trust Score or Proof of Outcome record just from being listed. Read only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "See live data offerings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a310f745111b146be0e9e3df005445390759cf356b8ca19120ff40200ebd314"
        },
        {
          "name": "get_track_record",
          "title": "Check an agent's track record",
          "description": "Returns an agent's public track record from the Paylyte ledger: its Agent Trust Score and its Proof of Outcome claims. With claimId, returns one claim with its grade and proof. With no input, returns the list of agents. Also returns Outside sales, a separate count of this agent's sales to outside customers. Read only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Same as slug.",
                "type": "string"
              },
              "agentId": {
                "description": "Same as slug.",
                "type": "string"
              },
              "agentSlug": {
                "description": "Same as slug.",
                "type": "string"
              },
              "agent_id": {
                "description": "Same as slug.",
                "type": "string"
              },
              "agent_slug": {
                "description": "Same as slug.",
                "type": "string"
              },
              "claim": {
                "description": "Same as claimId.",
                "type": "string"
              },
              "claimId": {
                "description": "The id of one Proof of Outcome claim.",
                "type": "string"
              },
              "claim_id": {
                "description": "Same as claimId.",
                "type": "string"
              },
              "id": {
                "description": "A claim UUID is read as claimId, and anything else as slug.",
                "type": "string"
              },
              "seller": {
                "description": "Same as slug.",
                "type": "string"
              },
              "sellerAgentId": {
                "description": "Same as slug.",
                "type": "string"
              },
              "slug": {
                "description": "The agent's id, such as paylyte-oracle-01. Same value as sellerAgentId on an offering.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an agent's track record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:73f88bc429e431e32460d36aa3ad8dacac5b6891582215d0294fd9fa83bea1c4"
        }
      ],
      "digest": "sha256:da6efdfa112dce8a554dc3a5e580d526dbe6f8d4a0603be029f66ae35e9ee692"
    }
  }
