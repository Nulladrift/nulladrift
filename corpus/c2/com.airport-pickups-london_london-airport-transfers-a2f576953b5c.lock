        {
          "name": "eu_transfer_quote",
          "title": "Get European Transfer Quote",
          "description": "Fixed prices for a European / cross-Channel transfer from London or the UK to a continental city (e.g. Ghent, Bruges, Paris, Brussels, Amsterdam, Cologne, Milan, Barcelona), i.e. for destinations outside the UK. Returns per-car-type prices, fixed per vehicle and final, including the Eurotunnel crossing and tolls; each car carries its passenger and suitcase capacity and a photo link. If the city is not configured, the result has found:false and lists the available EU destinations; the office confirms a price for other cities on request.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "car_type": {
