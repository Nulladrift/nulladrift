        {
          "name": "find_nearest_drivers",
          "title": "Find Nearest Drivers",
          "description": "Live availability of APL cars near a location, from fleet GPS. The target is an airport or cruise-port code (LHR, LGW, STN, LTN, LCY, EDI, SOU, BHX, MAN), a UK postcode, or lat+lng. Returns the free cars (online, not on a job) grouped by car class with a drive ETA rounded to 5 minutes; on hosts with UI the result renders as the 'Cars near you' card. With `destination` the result also carries the final fixed fare of every car class for that trip (same pricing engine as the quote; pickup = now plus the nearest car's ETA unless transfer_date / transfer_time are given; the fare is the final fixed price for that pickup time) and the card shows a Book button per car. min_pax limits the result to vehicles of at least that size. Customer and partner callers receive an availability view only: car class (Saloon / People Carrier / 8 Seater, executive flag), seats and ETA for up to 5 cars, never a driver name, vehicle, plate, position, distance or fleet size (driver details are shared after a booking is confirmed). Staff callers see full detail and can include busy drivers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "airport": {
                "description": "Airport/hub code, e.g. \"LHR\", \"LGW\".",
                "maxLength": 4,
                "type": "string"
              },
              "destination": {
                "description": "Optional drop-off (full postcode, address, London landmark, station or uniquely named hotel; airports are fine). When given, the result also carries the fixed fares from the target to this destination for every car class, and the card shows Book buttons.",
                "maxLength": 200,
                "type": "string"
              },
              "include_on_job": {
                "description": "Also include drivers currently on a job (default false = available only).",
                "type": "boolean"
              },
              "lat": {
                "description": "Target latitude (use with lng).",
                "type": "number"
              },
              "limit": {
                "description": "How many drivers to return (default 5).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Target longitude (use with lat).",
                "type": "number"
              },
              "min_pax": {
                "description": "Only vehicles seating at least this many passengers.",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "passengers": {
                "description": "With destination: passenger count if the customer said it (marks the recommended car).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "postcode": {
                "description": "UK postcode, e.g. \"SW1A 1AA\", or just the district, e.g. \"SL4\".",
                "maxLength": 10,
                "type": "string"
              },
              "transfer_date": {
                "description": "With destination: travel date YYYY-MM-DD for a LATER trip. Default = today (Europe/London).",
                "type": "string"
              },
              "transfer_time": {
                "description": "With destination: pickup time HH:MM (Europe/London) for a later trip. Default = now plus the nearest car's ETA, rounded up to 5 minutes — an ASAP pickup; the fare returned is the final fixed price for that pickup time.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
