        {
          "name": "london_airport_transfer_quote",
          "title": "Get Airport Transfer Quote",
          "description": "Fixed prices for a transfer between a UK airport or cruise port and any UK address or postcode: all London airports (Heathrow, Gatwick, Stansted, Luton, City Airport), Edinburgh Airport, the cruise ports Southampton, Dover and Portsmouth, and any UK postcode nationwide. Returns every car type with its final price (GBP, per vehicle), passenger and suitcase capacity and a photo (photo_url is the car image, an HTTPS link; set include_inline_photos=true only if your client cannot load external images - small inline copies then come back in car_photos at the end of the result). When passenger and suitcase counts are supplied, the result also marks which cars fit and which one is recommended (capacity_assessed). Every price includes Meet & Greet in the arrivals hall (driver with a name board; at Heathrow Terminal 4 ONLY the driver meets the customer outside at Zone 1 during the car-park works; the quote says which applies to this pickup), flight monitoring, waiting time, airport parking and tolls. Prices are final: APL offers no discounts and nothing is added beyond what is returned. The price depends on the travel date (seasonal and peak-date pricing). Prices are fixed per route for bookings made 3 or more hours before pickup; bookings under 3 hours are ASAP jobs and are quoted at a higher live price, because drivers are dispatched at short notice — always quote the final price only, never described as a surcharge. The result states the price basis. Accepted locations: airport and cruise-port names, full UK postcodes, street addresses, London neighbourhoods, landmarks, stations and uniquely identifiable hotels (Mayfair, Canary Wharf, Kings Cross, The Shard, Hilton Paddington). A bare city or town name (\"Windsor\", \"Manchester\", \"central London\") is not a valid location, because UK place names cover wide areas and the price and pickup point depend on the exact place. One pickup to one drop-off; extra stops are not priced.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Drop-off location: full UK postcode (e.g. \"SL4 5LP\"), full street address, a London neighbourhood, landmark or station (Mayfair, The Shard, Kings Cross), or a uniquely identifiable hotel or airport name. A bare city or town name (\"Windsor\", \"Manchester\") is not a valid value: UK towns cover wide areas and the price and pickup point would be wrong.",
                "maxLength": 200,
                "type": "string"
              },
              "include_inline_photos": {
                "description": "Default false (true for clients known to be unable to load external images). Every car already has photo_url (an HTTPS image link). Set true ONLY if your client cannot load external images: the result then also carries car_photos, small inline images by car type (about 30 KB of extra text).",
                "type": "boolean"
              },
              "origin": {
                "description": "Pickup location: airport or cruise-port name (e.g. \"Heathrow\", \"Gatwick\", \"Southampton Cruise Port\"), full UK postcode (e.g. \"SW1A 1AA\"), or full street address. A bare city or town name is not a valid value.",
                "maxLength": 200,
                "type": "string"
              },
              "passengers": {
                "description": "Number of passengers, when known. Without it the result has capacity_assessed:false, no \"fits\" flags and no recommended car.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "suitcases": {
                "description": "Number of suitcases or large bags (medium suitcases; hand luggage does not count), when known.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "transfer_date": {
                "description": "Travel date as YYYY-MM-DD (required). The price depends on the date (seasonal and peak-date pricing).",
                "type": "string"
              },
              "transfer_time": {
                "description": "Pickup time as HH:MM (Europe/London), optional but needed for a same-day pickup: the price depends on the time of day and on how far ahead the pickup is; the result states the price basis.",
                "type": "string"
              }
            },
            "required": ["destination", "origin", "transfer_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
