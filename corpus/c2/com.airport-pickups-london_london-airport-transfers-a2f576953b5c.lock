        {
          "name": "book_london_airport_transfer",
          "title": "Book Airport Transfer",
          "description": "Create a reservation for a London airport or cruise-port transfer to or from any UK address. This creates a REAL booking in the APL dispatch system.\n\nRequired inputs: pickup and drop-off (airport name with terminal, full UK postcode with building number or name, or full street address; a bare city, town or area name such as \"Windsor\", \"Manchester\" or \"central London\" is not a valid location because the driver needs the exact door), transfer date and time, the exact passenger and suitcase counts (operational data for seat allocation, child seats and dispatch, whatever the car size), the car type chosen from the quote, passenger full name, phone with country code, email (with the booking reference it is the customer's key to manage the booking later) and the WhatsApp opt-in answer.\n\nTransport detail by route: airport pickup = flight number plus airport_wait_minutes (the tool refuses an airport pickup without the wait time); airport drop-off = flight number optional; cruise port = cruise or ship name; train station = train number or origin; other routes need none.\n\nSpecial requests (child seats with the child's age: baby seat 0-12 months, child seat 1-4 years, booster 4-12 years, limits Saloon 1 / People Carrier 2 / 8 Seater 3; extra luggage; wheelchair; pet; an extra stop) go in special_requests. An extra stop is not in the quoted price: the booking covers one pickup to one drop-off and the office confirms the cost of a stop before the trip.\n\nPayment: the booking is created as cash to the driver; online payment (all major cards including Amex, Apple Pay, Google Pay, PayPal, Revolut, WeChat Pay, AliPay) is available through the manage-booking link. Prices are the final prices returned by the quote; no discounts exist.\n\nReturns: reservation_id (the numeric customer-facing reference that appears on the confirmation email and that the manage-booking page accepts), manage_booking_url with manage_booking_label (\"Manage and pay: pay online, track your driver, see car details\" — the wording to show for the link), the price, and meeting_point with the terminal or location name. booking_reference carries the same plain number.\n\nBOOKINGS WITHOUT AN ACCOUNT: passenger_email is REQUIRED (the booking reference + this email is how the customer manages the booking later), and callers without an account may create at most 5 bookings per hour.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "airport_wait_minutes": {
                "description": "Airport pickups only, and required for them (the tool refuses an airport pickup without it): minutes after landing at which the driver is in the arrivals hall — 15, 30, 45, 60 or 90. Defaults by flight type, as validate_flight returns in pickup_suggestion: international (non-EU) 60, EU 45, UK domestic 15; a smaller value is the customer's choice. Parking and the first 30 minutes of waiting are included; the pickup follows the actual landing time.",
                "maximum": 180,
                "minimum": 0,
                "type": "integer"
              },
              "car_type": {
                "description": "The car type chosen from the quote (e.g. \"Saloon\", \"People Carrier\", \"Executive Saloon\"), required.",
                "maxLength": 50,
                "type": "string"
              },
              "country": {
                "description": "Set to \"TR\" for Turkey routes (Istanbul, Sabiha Gökçen/SAW, Istanbul Airport/IST, Antalya, Dalaman, Bodrum, etc.) — these are cash bookings priced in EUR. Omit for UK routes.",
                "maxLength": 4,
                "type": "string"
              },
              "cruise_name": {
                "description": "Cruise/ship name for cruise port pickups/dropoffs (e.g. \"P&O Ventura\")",
                "maxLength": 100,
                "type": "string"
              },
              "destination": {
                "description": "Drop-off location: full UK postcode with building number or name (e.g. \"SL4 5LP, 12 Castle Hill\"), full street address, or airport name. A bare city or town name (\"Windsor\", \"Manchester\") is not a valid value: UK towns cover wide areas and the price and drop-off point would be wrong.",
                "maxLength": 200,
                "type": "string"
              },
              "door_number": {
                "description": "House/building number or name for the postcode end of the journey - pickup or drop-off (e.g. \"12\", \"Flat 3\", \"The Old Rectory\"); it is prepended to that postcode point. Required when the pickup or the destination is a postcode.",
                "maxLength": 100,
                "type": "string"
              },
              "flight_number": {
                "description": "Flight number for airport pickups/dropoffs (e.g. \"BA2534\")",
                "maxLength": 20,
                "type": "string"
              },
              "origin": {
                "description": "Pickup location: airport name with terminal for an airport pickup (e.g. \"Heathrow Terminal 2\"), full UK postcode with building number or name, or full street address. A bare city or town name (e.g. \"Manchester\") is not a valid value.",
                "maxLength": 200,
                "type": "string"
              },
              "passenger_email": {
                "description": "Passenger email address — REQUIRED: it receives the confirmation and, with the booking reference, is the customer's key to manage the booking later.",
                "format": "email",
                "maxLength": 100,
                "type": "string"
              },
              "passenger_name": {
                "description": "Full name of the passenger",
                "maxLength": 100,
                "type": "string"
              },
              "passenger_phone": {
                "description": "Passenger phone number with country code (e.g. \"+447123456789\")",
                "maxLength": 30,
                "type": "string"
              },
              "passengers": {
                "description": "Exact number of passengers travelling (required; operational data for seat allocation, child seats and dispatch, whatever the car size).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "special_requests": {
                "description": "Any special requirements (e.g. \"child seat needed\", \"extra luggage\")",
                "maxLength": 500,
                "type": "string"
              },
              "suitcases": {
                "description": "Number of suitcases or large bags, hand luggage not counted (required).",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "train_number": {
                "description": "Train number or origin for train station pickups/dropoffs (e.g. \"from Manchester\")",
                "maxLength": 50,
                "type": "string"
              },
              "transfer_date": {
                "description": "Transfer date as YYYY-MM-DD (e.g. \"2026-03-15\").",
                "type": "string"
              },
              "transfer_time": {
                "description": "Pickup time as HH:MM, 24-hour, Europe/London (e.g. \"14:30\").",
                "type": "string"
              },
              "whatsapp_opt_in": {
                "description": "Whether the customer agreed to receive the confirmation, driver details and pickup updates on WhatsApp at passenger_phone (true = yes, false = no, in which case email and phone are used). Required; customers can opt out any time by replying STOP.",
                "type": "boolean"
              }
            },
