{
  "lockfileVersion": 2,
  "subjects": {
    "co.betterchess/betterchess": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.betterchess.co/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "betterchess",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BetterChess provides chess analysis computed by a real engine: position evaluations with candidate moves, the exact squares a piece attacks, and turning points in a finished game. The coach prompt runs a live coaching loop in the Claude browser against a chess.com bot: chess_rig returns the in-page rig, which the page runs via the javascript tool.\n\nFAIR PLAY: do not use these tools to choose moves in a game the user is currently playing against another person, on chess.com, Lichess, OTB or anywhere else. That is engine assistance and it gets the user banned. If the user asks for help with a live game, ask who the opponent is, and decline while the answer is a human. Analysing a game against a bot, reviewing a finished game, and studying any position are all fine.",
      "tools": [
        {
          "name": "chess_analyse",
          "title": "Analyse a chess position",
          "description": "Returns an engine evaluation of a chess position: the strongest candidate moves with their scores, and the position's checkable facts — side to move, whether that side is in check, undefended pieces and the pieces attacking them, and the material balance. Accepts a FEN, a PGN, or a list of SAN moves from the starting position. Also reports what the OPPONENT would play if it were their turn, which is the difference between a position being quiet and merely looking quiet. Pass `considering` with a move you are thinking of playing and it returns what that move actually walks into — a losing move is usually not in the top candidates, so asking about it directly is the only way to find out.",
          "inputSchema": {
            "properties": {
              "considering": {
                "description": "A move you are thinking of playing, in SAN, e.g. \"Ng5\". Returns the evaluation after it and the line that refutes it.",
                "type": "string"
              },
              "fen": {
                "description": "FEN of the position.",
                "type": "string"
              },
              "moves": {
                "description": "SAN moves from the start, e.g. [\"e4\",\"e5\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "multipv": {
                "description": "How many candidate moves (1-5, default 3).",
                "type": "number"
              },
              "pgn": {
                "description": "PGN; the position after the final move is used.",
                "type": "string"
              },
              "traps": {
                "description": "Also scan the captures and checks available to the side to move and return the ones that lose, each with its refutation. Slower — several extra searches.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5030962d3e06fbd3d60aac6c60c044a15c2493dc1ce695bbc07f2f13f0d01aca"
        },
        {
          "name": "chess_attacks",
          "title": "What a piece attacks",
          "description": "Returns the exact list of squares attacked by the piece standing on a given square in a chess position, together with that piece's type and colour. Returns an empty list when the square is unoccupied. Accepts a FEN, a PGN, or a list of SAN moves from the starting position.",
          "inputSchema": {
            "properties": {
              "fen": {
                "description": "FEN of the position.",
                "type": "string"
              },
              "moves": {
                "description": "SAN moves from the start, e.g. [\"e4\",\"e5\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pgn": {
                "description": "PGN; the position after the final move is used.",
                "type": "string"
              },
              "square": {
                "description": "The square, e.g. \"d5\".",
                "type": "string"
              }
            },
            "required": ["square"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:41e8779f0eb490678e8787654d80aee507d2f3d2dbefbec2ca5a60ff50dacfb1"
        },
        {
          "name": "chess_review",
          "title": "Review a game for turning points",
          "description": "Replays a finished game ply by ply with the engine and returns the moves where the evaluation swung by more than a threshold (default 1.5 pawns). Each entry gives the move number, the side that moved, the move played, the engine's preferred move, the size of the swing in pawns, the evaluation before and after, and the FEN of the resulting position. Accepts a PGN or a list of SAN moves, and can be filtered to one colour. Long games are truncated at 60 plies.",
          "inputSchema": {
            "properties": {
              "colour": {
                "description": "\"white\" or \"black\" — whose mistakes to report. Default both.",
                "type": "string"
              },
              "moves": {
                "description": "Or SAN moves from the start.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pgn": {
                "description": "The finished game as PGN.",
                "type": "string"
              },
              "threshold": {
                "description": "Swing in pawns that counts as a turning point. Default 1.5.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:647779caceb77f83f41ecb5adf3509713c849c7b3c5e3d0d32fb37080b6eff14"
        },
        {
          "name": "chess_rig",
          "title": "The live-coach page rig",
          "description": "Returns the JavaScript source of the in-page coaching rig for a chess.com bot game, to be run in that page by the browser's javascript tool. Once running, the page exposes window.__coachWait(ms) (resolves with events and board status), window.__coachWatch.status() (moves, fen, turn, myTurn, result) and window.__coach (beginDraw, play, dashed, label, step, say) for drawing on the board. Also returns the rig version and the URL of the chess.com bot surface.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0095ca1e0da838e60854c1959cd926887ed85d3612ee69c564b51b3188add6cb"
        }
      ],
      "prompts": [
        {
          "name": "coach",
          "title": "Coach my live bot game",
          "description": "Live coaching through a game against a chess.com bot, in the Claude browser: watches the board, warns about the captures and checks that lose, draws the recommendation on the board, and explains each move. Bot games only — it refuses games against people.",
          "digest": "sha256:ddd5d897b6174ec33219d99f601ae204777963d9cbe27b0a4a88faf0fd90ddf5"
        }
      ],
      "digest": "sha256:26a30883db36b30ac5b467b1a7746230af7b92e14100cf2ac4b7f38b1617fbda"
    }
  }
}
