        {
          "name": "update_element",
          "description": "Update an existing element by `type` and `id`, changing ONLY the fields you\npass; omitted fields are kept.\n\nThis is the same partial update as `PATCH /api/v2/{type}/{id}`: each field you\npass replaces that field's value whole. A text field you pass is set (pass an\nempty string `\"\"` to clear it). A multi-link field you pass REPLACES that\nfield's whole array with the array you send, each id kept once (pass an empty\narray `[]` to clear it): a partial array drops every link it leaves out (only\nlinks your key cannot see are kept). To keep the rest, read the element first and send the\nwhole array, or use `edit_links`, which adds or removes single links and\nleaves the rest of the array as it is. `type` is a slug from\n`list_element_types`; `id` is the element's UUID. Requires a WRITE API-Key.\nReturns the full updated element in the v2 wire shape. Errors if the element\ndoes not exist, or (naming the field) on an unknown field or a bad link target.\nAn AI seat's update may be held for review instead (see get_me): the answer\nis then `{proposed, proposal}`, never the element.\n`hidden` in `fields` is dropped: an update never hides or unhides an\nelement. An update with only `hidden` succeeds and changes nothing. Hide one with\n`PUT /api/v2/{type}/{id}/hidden` and unhide it with\n`DELETE /api/v2/{type}/{id}/hidden`; this server has no tool for either.\n`if_match` (optional) is the element's `change_seq` as you read it: the\n`change_seq` field every v2 answer carries on the element, as\n`PATCH /api/v2/{type}/{id}` takes it in its `If-Match` header. The update\napplies only while the element is still at that number; if anyone wrote it\nsince, nothing is written and the error's code is `precondition_failed`, with\nthe element as it is now under `current`: re-read it, then send again or ask\nthe user. Left out, the update applies whatever changed in between.\nA refusal from keel is the API's own error as JSON text, `{\"error\":\n{message, type, code, param, doc_url}}` (as the HTTP route answers it), with\n`retry_after` (seconds) beside it when the route would send Retry-After.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "additionalProperties": true,
                "type": "object"
              },
              "id": {
                "type": "string"
              },
              "if_match": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "type": {
                "type": "string"
              }
            },
            "required": ["fields", "id", "type"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
