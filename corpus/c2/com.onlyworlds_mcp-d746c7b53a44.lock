        {
          "name": "get_image_upload_ticket",
          "description": "Get a ticket to upload ONE image into this world, for an element's\n`image_url` (Keel #59). The image never passes through this tool: you send\nits bytes yourself, straight to the image host, with the ticket.\n\nSteps:\n1. Call this tool. You get `ticket`, `upload_url`, `max_bytes` and `exp`.\n2. Upload the image yourself:\n   `curl -X POST <upload_url> -H \"Authorization: Bearer <ticket>\"\n    --data-binary @picture.webp`\n   (raw bytes as the body; webp, png, jpeg or avif, no SVG; at most\n   `max_bytes`; before `exp`). The host answers 201 with `{url, key, bytes,\n   type, etag}`.\n3. Set the element's picture: `update_element(type, id, {\"image_url\": <url>})`.\n\nOne ticket, one upload: a second upload with the same ticket is refused\n(401 ticket_used); call this tool again for the next image. Each ticket\ncounts toward the world's daily limit, and each upload toward its account's\nimage storage (1 GB by default; `max_bytes` shrinks to what is left, and a\nfull account is refused). Requires a WRITE API-Key and its PIN.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
