          },
          "digest": "sha256:1b666484a20f980da846a9c392d77dff8ac098e0bdab4a17bef624279ef2712a"
        },
        {
          "name": "get_element_schema",
          "description": "Return the field structure of one OnlyWorlds element `type` (a slug from\n`list_element_types`, e.g. \"character\").\n\nThe result groups the type's writable fields by kind so a caller knows how to\nread and write them: `text` (strings), `integer`, `single_link` (one UUID),\n`multi_link` (an array of UUIDs), and `generic` (a type+id pair pointing at any\nelement type). For every link field the target element type is given under\n`link_targets`. All link values are element UUIDs. Unauthenticated. Errors if\n`type` is not one of the 22 types.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "type": {
                "type": "string"
              }
