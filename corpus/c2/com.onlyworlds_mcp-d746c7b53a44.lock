        {
          "name": "list_files",
          "description": "List the files attached to one element (`type` and `id`, a UUID) in the\nworld named by your API-Key header: PDFs, text files, images (png, jpg, webp,\navif) and world bundles kept on onlyworlds.com beside the element, never\ninside it.\n\nReturns `{data: [{id, name, kind, size, label, added_by, added_at}, ...]}`,\nnewest first. `label` is the field the file belongs to, free text, or null;\n`added_by` says who added it, whether an agent did, and whether the\nworld's current owner did (`owner`, true or false). `membership` is null\nfor the owner's files and for a file whose membership no longer exists;\n`owner` tells the two apart. A file with a null `membership` and `owner`\nfalse is named \"a former member\". A removed member's file keeps its\nmembership id and name; a file whose member's account was deleted keeps\nits membership id and is named \"a former member\". You see a file\nexactly when you may see its element. Read a text file's words with\n`read_file(file_id)`. Requires a READ or WRITE API-Key.",
