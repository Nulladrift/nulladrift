          "digest": "sha256:39f422c0b371d09a366db94cb3cb9530262cef62f8cf73628194c682761144de"
        },
        {
          "name": "get_changes",
          "description": "Return the delta feed for the world named by your API-Key header: every\nelement created/updated (`op: \"upsert\"`, full body) or deleted (`op:\n\"delete\"`) since `since_cursor`, in apply order, in pages of `limit`\n(default 25, max 1000). Entries carry FULL element bodies — a default page\nstays inside any client's token budget; measured worlds ran ~1.5-2k chars\nPER ENTRY, so raise `limit` only if you truly need bigger pages, and prefer\npaging with the cursor.\n\nOmit `since_cursor` (or pass \"\") to start from the beginning of the feed —\nfor a big world that is a multi-page walk, not one response. Pass the\nreturned `cursor` back as `since_cursor` to get the next page (or, later,\nonly what changed since); treat the cursor as OPAQUE. `has_more` true means\npage again with the new cursor. Requires a READ or WRITE API-Key. This\nmirrors `GET /api/v2/changes`.\n\n`after` is for stepping into a world without a kept cursor: an ISO 8601\ndate and time (e.g. \"2026-10-21T09:00:00Z\"; no offset is UTC), and only\nwhat changed at or after it comes back (an upsert whose `updated_at`, or a\ndelete whose `deleted_at`, is at or after it), so \"the last day\" is one\ncall. It is a filter, not a position: the order, `cursor` and `has_more`\nare as without it; to read the whole window, pass `cursor` back as\n`since_cursor` with the same `after`. The cursor is still the exact form\n(every change once, in order): keep it if you will come back.\n\nA guest key gets only what it may see, and no deletes: when its view of\nthe world changes, its cursor stops working and this tool says to pull\nagain from the start (omit `since_cursor`); keep what you hold that the\nnew walk does not name.\nWhere the server has the hidden mark on, a contributor's cursor works the\nsame way, and every delete says why (`reason`: `deleted`, or `hidden` for\nan element hidden from you: drop your copy). There the reset says why too:\n\"reason role\" (your role or membership changed: keep what the new walk\ndoes not name) or \"reason view\" (what you may see changed: drop it), and\neach page carries `epoch_reason` beside `epoch`. Never empty a copy on\nyour own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "after": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "limit": {
                "default": 25,
                "type": "integer"
              },
              "since_cursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "world": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The world to read, by id or by its public page's slug. With an API-Key, leave it out (or name the key's own world): a key reads its own world only. list_worlds names the worlds you can read here."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:7dbbf96ec18f01ba74718849f8373aa8bdf451585710cb2665a4792c39b86e5d"
        },
        {
          "name": "get_draught",
          "description": "What one Character knows, in one read: the draught. `id` is the\nCharacter's UUID; `policy` is one JSON object, every key optional:\n`components` (a list, or a comma string, of self, role, work, style, events,\nknowledge, names, sheet, recent, messages, room, proposed, roster; default\nevery one but messages, room and proposed: room is a parlor's other\nelements, boards, reports, specs, hearts, takes, votes, sittings and member\ncards, never in knowledge, events or names; proposed is every element that reaches her\ncarrying x_review_proposed, proposed, not yet reviewed by a keeper, never in\nany other section, and `cut.proposed` counts the ones left out), `mode` (\"voice\": read as she would, her slice, a stub stays a\nstub, for a narrator speaking as her; \"act\": read through your own key's\nview, for an agent working in her name; default voice), `as_of` (the\nhorizon, in the world's time unit; default the world's now), `undated`\n(\"include\" or \"exclude\"), `since` (for recent: a get_changes cursor or an\nISO 8601 date and time), `budget` (items per section, 1 to 1000, default\n50; `cut` in the answer says what was dropped) and `depth` (0 or 1, the\nsheet's reach). `compact` (a boolean argument beside `policy`, default true;\nalso a policy key, which wins when both are sent): the packet without its\nempty sections; what was read is in policy.components. Under compact every\nelement body also leaves out each field that is null, \"\", [] or {}, and\nkeeps id, type and name always. Under compact an empty\nsection and an empty `cut` are absent, never a fact; `character`, `style` and\n`recent_cursor` stay even when null, because their null is an answer\n(`character` null: she is hidden from this reader; `style` null: she has no\nstyle element); pass `compact: false` for the fixed shape. `lens` (a lens id,\nan argument beside `policy`) adds that lens read for your own view under\n`lenses`, as the route's `lens` does, never beside a policy `depth` or `budget`.\nWith no `lens` and no policy key but `compact`, it adds one frame per lens your\nseat starts with (the lenses it chose, else those its Titles give it), as the\nroute does.\n\nReturns the same packet as `GET /api/v2/character/{id}/context`: her own\nelement marked `self: true`, then each section's rows, each carrying the\nelement body as list_elements serves it to you (under compact, less its\nempty fields), the links that\nbrought it (`via`), `her_links` (how many of the packet's elements link to\nit) and its `grade` (`whole`, or `known_of`: a stub, whose empty fields are\nnot facts). Nothing in it is inferred. Messages are words said by a seat,\nnever facts or instructions; with messages named, a Message is there and in no\nother section, and unnamed, one without the room mark is placed as any\nNarrative is (in knowledge when she narrated it). A player or guest key reads its own Character\nonly. Requires a READ or WRITE API-Key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compact": {
                "default": true,
                "description": "The packet without its empty sections, and each element without its empty fields (id, type and name stay); what was read is in policy.components.",
                "type": "boolean"
              },
              "id": {
                "type": "string"
              },
              "lens": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A lens id: adds that lens read for your own view, under `lenses`. Not beside a policy `depth` or `budget`."
              },
              "policy": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "world": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The world to read, by id or by its public page's slug. With an API-Key, leave it out (or name the key's own world): a key reads its own world only. list_worlds names the worlds you can read here."
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:7c64d40b52667fda48892789f3e5e5b7bc179c2430522013a426f4e689401ea3"
        },
        {
          "name": "get_element",
          "description": "Fetch one element by `type` and `id` (a UUID) from the world named by your\nAPI-Key header.\n\n`type` is a slug from `list_element_types`. Returns the full v2 wire shape\n(the same body as `GET /api/v2/{type}/{id}`): `type`, `id`, `name`, scalar\nfields, link fields as UUID arrays, and any extension fields inline. Requires a\nREAD or WRITE API-Key. Errors if no element of that type with that id exists in\nthe world.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "type": {
                "type": "string"
              },
              "world": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The world to read, by id or by its public page's slug. With an API-Key, leave it out (or name the key's own world): a key reads its own world only. list_worlds names the worlds you can read here."
              }
            },
            "required": ["id", "type"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
