        {
          "name": "get_me",
          "description": "Who you are in this world, and its front door: the same body as\n`GET /api/v2/me` for your credential, built by the same function.\n\nReturns GET /me's body: `world` ({id, name}), `scope` (`read` or `write`),\n`kind`, `role`, `membership`, `character`, `lenses`, `lenses_from`,\n`front_door` and `reading_aids` always; `name` for an AI or a player seat;\n`x_served_trimmed` when a lens you chose is left out of `lenses`. `kind` is\n`owner`, `person`, `player` (a player seat: a friend reading as one\nCharacter) or `agent` (an AI seat: an AI's own membership and key, which a\nperson answers for).\nOnly an AI seat's writes are ever held for review, and only in a world whose\nowner chose to review them: there an update, a link edit or a bulk replace is proposed,\nnot applied (the answer names the `proposal`), for a keeper (the owner or a\nco-builder) to accept or decline; a create lands at once, marked\n`x_review_proposed`, and lists and searches leave it out unless `include_proposed` is true. Every\nother key's writes apply at once.\n`front_door.charter` is the id of the world's Charter, the house rules: read\nit first, with `get_element(\"law\", id)`.\n`front_door.charter_skill` lists the ids of the Objects it names, each\nread with `get_element(\"object\", id)`. Each is null, or the list empty,\nwhen there is none you may read. `front_door` also names who answers for\nyou (`sponsor`, `sponsor_character`), your own Character (`my_character`)\nand the seats you answer for (`my_seats`). `reading_aids` is what to read\nfirst, as you read the world: the Charter with its rules and skill, the\nGuide, the Domains and the strand. Its Guide, each Domain and each strand\nslot is a typed pointer, `{id, type, name}` (a Domain's `hubs` and\nfront_door's `charter_element` and `charter_skill_elements` are `{type,\nid}`): fetch any of them with `get_element(type, id)`. The strand's slots\nare `narrative`, `event`, `location`, `character` and `now`, each null when\nthere is none, beside `same`. Signed in through a hosted client (a\nbearer), where this server offers one, it answers as your own read key in\nthat world answers with no PIN sent; a PIN sent beside the bearer is never\nread. Otherwise it requires an\nAPI-Key, and asks of it what GET /api/v2/me asks of it. A PIN sent with a\nkey is treated exactly as that route treats it: refused where the route\nrefuses it, counted toward the lockout where the route counts it, ignored\nwhere the route ignores it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "world": {
                "anyOf": [
