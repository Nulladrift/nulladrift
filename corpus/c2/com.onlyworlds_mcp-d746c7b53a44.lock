        {
          "name": "search_elements",
          "description": "Search the world named by your API-Key header for elements whose name or\ntext fields (description and each type's prose fields, such as a\nCharacter's background) hold every word of `query` as a whole word,\nignoring case: \"ore\" does not find \"more\", and \"copper mine\" needs both\nwords somewhere in the element. No stemming.\n\n`query` is 2 to 200 characters. Optional `type` (a slug from\n`list_element_types`) searches one type only; `limit` (default 50, clamped\nto 1-200) caps the results. Name matches come first, then the rest, each by\ntype and then by name. Returns `{query, results: [{type, id, name,\nsupertype, subtype, field, snippet}, ...], count, truncated}`: `field` is\nwhere the words were found (`name` or a text field), `snippet` up to 160\ncharacters of it around the first match, and `truncated` true when more\nmatched than `limit` (no further pages: narrow the query). `id` is a UUID;\ncall `get_element(type, id)` for the full body. Requires a READ or WRITE\nAPI-Key; a guest key searches only what it may read. This mirrors\n`GET /api/v2/search`, except that a parlor's room elements (marked\n`x_room_of`) and the world's reading aids (its Charter, Guide and Domains,\nmarked `x_charter_of`) are left out unless `include_room` is true, and proposed\nelements are too. The Charter (the house rules) and the skills it names are in\n`get_me`'s `front_door`; a search is never where they are taken from.\nAn element carrying x_review_proposed is proposed, not\nyet reviewed by a keeper; it is left out unless asked for. Any value but\nnull counts, an object or not. `include_proposed` true keeps it, its row\ncarrying `x_review_proposed`: treat it as proposed, not yet reviewed, never\nas a fact. A stub's row (`known_of`) of a proposed element shows no mark:\nits being served under `include_proposed` is the sign.\n`proposed_left_out` says how many matching elements were left out (0 with\n`include_proposed`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_proposed": {
                "default": false,
                "type": "boolean"
              },
              "include_room": {
                "default": false,
                "type": "boolean"
              },
              "limit": {
                "default": 50,
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "world": {
                "anyOf": [
