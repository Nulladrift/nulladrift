        {
          "name": "list_elements",
          "description": "List elements of one `type` in the world named by your API-Key header,\nnewest-created first.\n\n`type` is a slug from `list_element_types` (e.g. \"character\"). Optional\n`name_contains` filters by case-insensitive name substring; `supertype` is\ntrimmed and matched without regard to case, the whole word, as the profiles\nread it and as GET /api/v2/{type}?supertype= does (\" message \" and \"MESSAGE\"\nmatch Message, \"Messages\" does not; an empty string lists the elements with\nnone); `subtype` is read the same way, as ?subtype= does. `ids` (a list of\n1 to 200 element ids) keeps only those, as ?ids= does. `created_by` (a\nmembership id, as GET /api/v2/members lists them, or \"owner\" for the\nowner's own writes) keeps what that member created, as ?created_by= does.\n`link` filters by the type's single-link fields, as ?<field>=<id> does: one\nobject, each key a single-link field of this type (get_element_schema lists\nthem under `single_link`), each value an element id, or \"\" for the\nelements you are served with none. A key with no member behind it (an\n`ow_r_` or `ow_w_` key the owner made, a classic or demo key) or the\nowner's own sign-in, a co-builder's, and a contributor's while no element\nof the world is hidden are served each stored link, whatever it names, and\nmatch on it. Any other is served a link null where it names no element it\ncan see, and on an element it knows of only as a stub (`known_of`),\nwhatever the stub stores; it matches only what it is served: an element it\ncannot see gives the same empty list as an id that names nothing.\n`list_elements(\"pin\", link={\"map\": \"<map id>\"})` lists the pins on one map;\n`link={\"location\": \"<id>\"}` on a character, the characters there.\n`limit` (default 100, max 1000) and `offset` page the result.\nRequires a READ or WRITE API-Key. Returns `{data: [element, ...], limit,\noffset, has_more, proposed_left_out}` where each element is the full v2 wire\nshape and `id` is a UUID. Use `get_element(type, id)` for a single element.\nA parlor's room elements (boards, reports, specs, hearts, takes, votes,\nsittings, member cards and room messages, each marked `x_room_of`) are left out unless\n`include_room` is true, and so are the world's reading aids (its Charter,\nGuide and Domains, marked `x_charter_of`). With `include_room` true both come\nback: the Charter is a `law` with supertype Charter, the Guide and the Domains\nare `construct`s with supertype Guide or Domain, so `list_elements(\"law\",\nsupertype=\"Charter\", include_room=true)` finds the Charter. The strand, the\nstory this world is about, is the World's `x_strand` mark, not an element, and\nno tool here serves it. (A client that also reads the REST API finds the aids\nand the strand named in GET /api/v2/me's `reading_aids`.)\nAn element carrying x_review_proposed is proposed, not yet reviewed by a\nkeeper; it is left out unless asked for. A mark (an object with something\nin it) or a doubt (any other value that counts as present: a string with\nsomething in it, a number, a boolean, a list with something in it) counts,\nand is counted with the proposed; null, an empty string or one of\nWhite_Space alone, [] and {} are no mark. `include_proposed` true serves it whole, mark on: treat it\nas proposed, not yet reviewed, never as a fact. A stub (`known_of`) of a\nproposed element shows no mark: its being served under `include_proposed`\nis the sign.\n`proposed_left_out` says how many matching elements were left out (0 with\n`include_proposed`).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
