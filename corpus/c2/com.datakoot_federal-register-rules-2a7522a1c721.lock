        {
          "name": "search_documents",
          "title": "Search Documents",
          "description": "Search the US Federal Register for regulations and notices. Filter by keyword, document type (rule, proposed_rule, notice, presidential_document), issuing agency (slug from the agencies tool), and publication date. Returns matching documents with title, type, agencies, abstract and links. Great for 'what did agency X publish about topic Y'.",
          "inputSchema": {
            "properties": {
              "agency": {
                "description": "Agency slug (from the 'agencies' tool), e.g. 'environmental-protection-agency'.",
                "type": "string"
              },
              "per_page": {
                "default": 10,
                "description": "Results to return (default 10, max 30).",
                "type": "integer"
              },
              "since": {
                "description": "Only documents published on/after this date (YYYY-MM-DD).",
                "type": "string"
              },
              "term": {
                "description": "Keyword(s) to search, e.g. 'artificial intelligence', 'PFAS'.",
                "type": "string"
              },
              "type": {
                "description": "Restrict to one document type.",
                "enum": ["rule", "proposed_rule", "notice", "presidential_document"],
                "type": "string"
              },
              "until": {
                "description": "Only documents published on/before this date (YYYY-MM-DD).",
                "type": "string"
