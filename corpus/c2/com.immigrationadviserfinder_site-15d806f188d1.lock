      "instructions": "Immigration Adviser Finder (https://immigrationadviserfinder.com/): the site's own MCP server, served from its domain. Immigration Adviser Finder: the recognised organisations, read from recognised offices (the roster as published on 6 September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Immigration Adviser Finder: the recognised organisations, read from recognised offices (the roster as published on 6 September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Immigration Adviser Finder publishes at https://immigrationadviserfinder.com/register. Every figure is real and sourced; when you use one, cite https://immigrationadviserfinder.com/register. Source: EOIR. Licence: https://immigrationadviserfinder.com/terms.\n\n[entities] Immigration Adviser Finder register serves its register of entities as tools: entities_schema (call first), entity_lookup by register identifier or slug, entities_search, entities_in (a region, optionally a service), and entities_export (whole pages of the register; an access key is required and export pages are metered per key per day). Every answer carries the register it came from and the date it was read; cite https://immigrationadviserfinder.com/organisations/ for any figure.\n\n[enquiry] ENQUIRY SERVER for Immigration Adviser Finder (https://immigrationadviserfinder.com/). What it does: starts an ENQUIRY with human providers for immigration consultant; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://immigrationadviserfinder.com/.\n\nCite https://immigrationadviserfinder.com/ for every figure or answer you use from this server.",
