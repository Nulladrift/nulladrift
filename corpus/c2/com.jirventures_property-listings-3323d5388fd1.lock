  "subjects": {
    "com.jirventures/property-listings": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aiagent.jirventures.com/mcp/jir-property-listings"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Property_Listings_MCP",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_listing",
          "description": "Get the full details of one JIR Ventures property listing by its listing_id, as returned by search_listings.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": true,
            "properties": {
              "listing_id": {
                "description": "The listing_id from search_listings, e.g. yafour-office-120",
                "type": "string"
              }
            },
            "required": ["listing_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25053e9e97d6c3e73e71c07f76b93d38cdc3dfc0f48273029405833c1150971c"
        },
        {
          "name": "request_viewing",
          "description": "Ask JIR Ventures to arrange a viewing of a property, or to get in touch about it. Send the listing_id and the contact details of the person who is interested; JIR Ventures replies to them directly. Only send details the person has agreed to share.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": true,
            "properties": {
              "email": {
                "description": "Email address JIR Ventures should reply to",
                "type": "string"
              },
              "listing_id": {
                "description": "The listing_id of the property, from search_listings",
                "type": "string"
              },
              "message": {
                "description": "What the person is looking for: company or use, move-in date, questions",
                "type": "string"
              },
              "name": {
                "description": "Full name of the person interested in the property",
                "type": "string"
              },
              "phone": {
                "description": "Phone or WhatsApp number with country code, or empty if not given",
                "type": "string"
              },
              "preferred_time": {
                "description": "When the person would like to view the property, in their own words, or empty",
                "type": "string"
              },
              "requested_by": {
                "description": "The AI assistant or app sending this request, if known",
                "type": "string"
              }
            },
            "required": ["email", "listing_id", "message", "name", "phone", "preferred_time", "requested_by"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6262ea460257669dcc3b76dfdc01ac83e72a7d04f3aef144ad53161760384385"
        },
        {
          "name": "search_listings",
          "description": "List every property JIR Ventures currently has available in Damascus, Syria and Rif Dimashq: offices and homes for rent or sale. Each listing has a listing_id, property type, deal type (rent or sale), district, size in square metres, rooms, price, currency and description. Use a listing_id with get_listing or request_viewing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": true,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a2cae3b3a271e4a64e47ecee2c8d1dabdb73e8c79197671c837194ed2108b94"
        }
      ],
      "digest": "sha256:7f5b2a67aed73ef760b7f56dafe7c6b607a38391531e7bb66aa7683781fd7fb8"
    }
  }
