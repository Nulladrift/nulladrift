        {
          "name": "get_company",
          "title": "Profil firmy",
          "description": "Tryb darmowy czyta tylko to, co serwis już zna (sekcja spoza pamięci wraca jako \"missing\" z AUTH_REQUIRED); \"id\" to KRS, NIP, REGON, adres firmy.ai albo \"p-…\" osoby; zacznij od search_companies, gdy nie masz identyfikatora. Zwraca profil firmy i sekcje z \"include\" (bez \"include\": profile, people, ownership, ai_scores, description) w jednym wywołaniu oraz mapę \"available\", która mówi, co jeszcze można dopytać (finanse, dokumenty, VAT, sankcje, przetargi i inne). Sekcje do wyboru: profile, people, ownership, subsidiaries, group_structure, sole_proprietor, financials, documents, beneficial_owners, vat, bankruptcy, sanctions, knf_warnings, tenders, public_aid, domain, ai_scores, description, job_offers, foundation_spending, reviews, similar. Użyj, gdy masz KRS, NIP, REGON albo adres strony firmy; gdy masz tylko nazwę, najpierw search_companies. Koszt w trybie Pro (operacje za sekcję, która chybiła w pamięci serwisu): profile 3, subsidiaries 1, sole_proprietor 1, financials 20, documents 1, beneficial_owners 5, vat 1, bankruptcy 4, public_aid 1, domain 1, description 1, job_offers 1, foundation_spending 20; w trybie darmowym 0, a sekcja spoza pamięci wraca jako \"missing\" z AUTH_REQUIRED. Przykład: {\"id\": \"0000006865\", \"include\": [\"financials\", \"vat\", \"sanctions\"]}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "estimate": {
                "description": "Nic nie pobieraj, pokaż tylko, które sekcje są w pamięci i ile by kosztowały w trybie Pro.",
                "type": "boolean"
              },
              "fresh": {
                "description": "Pobierz ponownie mimo pamięci serwisu. W trybie darmowym zawsze AUTH_REQUIRED.",
                "type": "boolean"
              },
              "id": {
                "description": "KRS (10 cyfr), NIP (także z myślnikami), REGON (9 albo 14 cyfr) albo adres strony firmy na firmy.ai (/KRS/…, /NIP/…). Serwer sam rozpoznaje typ.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "id_type": {
                "description": "Wymusza typ identyfikatora, gdy wiesz lepiej: krs, nip, regon albo person. Zwykle zbędne: serwer rozpoznaje typ sam.",
                "enum": ["krs", "nip", "regon", "person"],
                "type": "string"
              },
              "include": {
                "description": "Które sekcje zwrócić: profile, people, ownership, subsidiaries, group_structure, sole_proprietor, financials, documents, beneficial_owners, vat, bankruptcy, sanctions, knf_warnings, tenders, public_aid, domain, ai_scores, description, job_offers, foundation_spending, reviews, similar. Sekcja profile jest zawsze. Bez tego pola: profile, people, ownership, ai_scores, description.",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              }
            },
            "required": ["id"],
            "type": "object"
