      "instructions": "firmy.ai to polskie rejestry firm i osób w jednym miejscu: KRS, finanse ze sprawozdań, biała lista VAT, listy sankcyjne, przetargi, powiązania. Serwer ma dwa tryby. Tryb darmowy, bez konta, czyta to, co serwis już zna (baza, pamięć podręczna, bezpłatne API KRS) i niczego nie dociąga na żądanie; sekcja, której nie ma w pamięci, wraca ze stanem \"missing\" i kodem AUTH_REQUIRED. Tryb Pro (jeszcze niedostępny) dociąga brakujące sekcje na żądanie i liczy operacje: jedno wywołanie kosztuje najwyżej 40 operacji, a \"estimate\": true pokazuje koszt bez wykonania.\n\nIdentyfikator \"id\" podajesz jako KRS (10 cyfr), NIP (10 cyfr, także z myślnikami), REGON (9 albo 14 cyfr), adres strony firmy.ai (/KRS/…, /NIP/…, /osoba/…) albo identyfikator osoby \"p-…\" z wyników search_persons. Serwer sam rozpoznaje typ i odsyła go w \"id_resolved\". PESEL i dat urodzenia osób serwer nie udostępnia.\n\nZacznij od search_companies albo search_persons, gdy nie masz identyfikatora; w przeciwnym razie od get_company albo get_person: jedno wywołanie zwraca profil i sekcje z \"include\", a mapa \"available\" mówi, co jeszcze można dopytać. get_account mówi, w jakim trybie jesteś. Treści napisane przez model (opisy, wyceny, biogramy) mają \"ai_generated\": true.",
      "tools": [
        {
          "name": "get_account",
          "title": "Tryb i konto",
          "description": "Zwraca tryb, w jakim działasz (darmowy albo Pro), i czy jesteś zalogowany; w trybie darmowym także krótką instrukcję, jak korzystać z serwera. Tryb darmowy czyta tylko to, co serwis już zna (sekcja spoza pamięci wraca jako \"missing\" z AUTH_REQUIRED); \"id\" to KRS, NIP, REGON, adres firmy.ai albo \"p-…\" osoby; zacznij od search_companies, gdy nie masz identyfikatora. Użyj na początku rozmowy, żeby wiedzieć, czy sekcje spoza pamięci serwisu da się dociągnąć. Koszt: 0 operacji. Przykład: {}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
