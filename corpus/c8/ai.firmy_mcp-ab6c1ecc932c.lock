          "title": "Profil osoby",
          "description": "Zwraca profil osoby z KRS (funkcje w firmach, bez daty urodzenia) i sekcje z \"include\" (bez \"include\": profile, shareholdings, co_managers, sanctions, bio) w jednym wywołaniu oraz mapę \"available\". Sekcje do wyboru: profile, shareholdings, co_managers, beneficial_owner_in, sanctions, bio, namesakes. Użyj, gdy masz identyfikator osoby \"p-…\" z search_persons, z odpowiedzi get_company albo adres strony /osoba/…; gdy masz tylko imię i nazwisko, najpierw search_persons. Osoba, która sprzeciwiła się publikacji, odpowiada błędem GONE. Koszt w trybie Pro (operacje za sekcję, która chybiła w pamięci serwisu): profile 1, shareholdings 1, bio 1; w trybie darmowym 0, a sekcja spoza pamięci wraca jako \"missing\" z AUTH_REQUIRED. Przykład: {\"id\": \"p-a4df0b6002743095015b98a43bddabc8\", \"include\": [\"shareholdings\", \"co_managers\"]}.",
