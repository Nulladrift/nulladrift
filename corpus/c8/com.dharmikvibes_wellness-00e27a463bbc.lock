      "instructions": "DharmikVibes Retreats & Experiences (wellness.dharmikvibes.com) is a travel catalogue of spiritual retreats, yatras and experiences across India: temple darshan and aarti, puja and havan, katha and satsang, yoga and meditation sessions as part of the day, and group sessions for families and teams. Use list_trips or search to find a retreat, yatra or experience, then get_trip_details or fetch for the full itinerary, inclusions and link. Price rules: every figure is a FROM-price per person on twin-sharing unless stated; say \"indicative, confirmed on enquiry\" for indicative prices, never present them as firm; the 4-day Short Reset and anything built to order is \"priced on enquiry\". Group sessions are per group plus GST. Always give the page URL. To book or ask, send people to WhatsApp +91 92203 52244 or spiritualwellness@dharmikvibes.com (booking_contact). This server is read-only: it cannot book or take payment, and it neither asks for nor receives anyone's personal data.",
