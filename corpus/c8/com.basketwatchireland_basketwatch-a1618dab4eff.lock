        {
          "name": "find_products",
          "title": "Find products by ingredients and nutrition",
          "description": "Find products that meet ingredient, nutrition, alcohol or offer\n    conditions, optionally sorted. For questions like \"biscuits without palm\n    oil\", \"nut-free snacks at Tesco\", \"vegan chocolate\", \"cereal with the least\n    sugar\", \"high protein yoghurt\", \"bread with the fewest ingredients\",\n    \"alcohol-free beer\", \"low salt soup\" or \"cheapest olive oil at Aldi\".\n    Every product comes with its nutrition, ingredients, ingredient count,\n    country of origin where stated and today's price. Fibre and saturated fat\n    are not recorded.\n\n    Ingredient words. exclude_ingredients are ingredients a product is free\n    of; include_ingredients ones it contains. These words are expanded to the\n    label terms they cover: palm oil, nuts (includes peanuts), peanuts, gluten,\n    milk (dairy), eggs, soya, sesame, mustard, celery, fish, crustaceans,\n    molluscs, shellfish, sulphites, lupin, gelatine, alcohol, added sugar,\n    sweeteners, pork, meat, vegetarian (meat, fish, gelatine and other\n    animal-derived ingredients) and vegan (vegetarian plus milk, eggs, honey and\n    other animal products). Any other word is matched as written, e.g.\n    \"coconut\" or \"oats\".\n\n    With no store, results alternate across the stores (each store's best\n    match, then each store's next), and matched_by_store gives each store's\n    full count.\n\n    A product whose ingredient list or nutrition is not on record, or whose\n    ingredient list on record is incomplete, is left out, never assumed to\n    pass: left_out_unknown counts them, left_out_by_reason gives the reasons,\n    and caveats lists known gaps (Aldi's own ingredient lists are often cut\n    short, so an Aldi product is offered as free from something only when its\n    full list comes from the same barcode at Tesco, SuperValu or Dunnes). Claims printed in\n    a product's NAME, such as \"gluten free\", \"lactose free\", \"alcohol free\" or\n    \"vegan\", are matched through query; exclude_ingredients also checks the\n    ingredients. Alcohol strength is recorded for most SuperValu, Dunnes and\n    Tesco drinks but few at Aldi or Lidl; \"alcohol free\" and \"0.0\" in query\n    match drinks named that way.\n\n    Answers come from the ingredient lists and nutrition the retailers publish.\n    Where a retailer gives no list, it may come from the same barcode at another\n    retailer or from Open Food Facts (ingredients_source); an Open Food Facts\n    list is never used to show a product is free from something.\n    \"Free from\" means none of the listed ingredients names it; not every\n    \"may contain\" warning is covered. Results carry a note that this is information\n    only. Each product returned costs one credit.\n\n    Args:\n        query: product words, e.g. \"biscuits\", \"crisps\", \"dark chocolate\".\n            Needed unless category is given.\n        store: aldi, tesco, supervalu, dunnes or lidl. Leave out to search all five.\n        category: an aisle or shelf to narrow by, e.g. \"Breakfast Cereals\"\n            or \"Kefir\". A store with no aisle or shelf of that name is searched\n            by product name instead, and caveats say so.\n        exclude_ingredients: ingredients a product has to be free of, e.g.\n            [\"palm oil\"], [\"nuts\", \"sesame\"], [\"vegan\"]. A product whose\n            allergy advice says it contains or may contain one is left out\n            too, and counted in left_out_may_contain.\n        include_ingredients: e.g. [\"oats\"].\n        max_sugar_g, max_salt_g, max_fat_g, max_carbs_g, min_protein_g:\n            grams per 100g or 100ml, e.g. max_sugar_g=5.\n        max_kcal: kilocalories per 100g or 100ml.\n        max_abv, min_abv: alcohol by volume, percent.\n        max_ingredients: at most this many listed ingredients, e.g. 5. A\n            compound ingredient's own bracketed list counts as one.\n        max_additives: at most this many additives in the product's whole\n            ingredient list, e.g. 0 for none: each E-number or additive by name\n            once (preservatives, emulsifiers, raising agents, acidity regulators,\n            thickeners, colours and the like); flavourings, vitamins, minerals and\n            colouring foods are not additives. A list that is cut short or comes\n            from Open Food Facts is left out as unknown, unless what it shows is\n            already too many.\n        on_offer: only products on promotion or with a member price\n            (Tesco Clubcard, SuperValu Real Rewards, Lidl Plus).\n        origin: country of origin, e.g. \"Ireland\" (or \"Irish\"); several may be\n            given comma-separated. A product matches only when every country its\n            label states is one asked for: \"Made in Ireland\" with \"EU chicken\" is\n            not Irish chicken, and is counted in left_out_partly_from_origin.\n            Northern Ireland answers for Ireland (one island, one Bord Bia\n            scheme), not the other way round. Products with no stated origin are\n            counted in left_out_unknown, not returned. A provenance word in the\n            query works too: \"Irish honey\" searches honey from Ireland.\n        sort_by: price, unit_price (per kg or litre), sugar, salt, fat, carbs,\n            protein, kcal, abv, ingredients or additives (fewest first). Products that\n            are the kind of thing searched for rank ahead of name-only matches\n            (name_match_only), so \"chocolate\" sorted by price does not lead\n            with chocolate-flavour popcorn.\n        descending: true for highest first, e.g. most protein.\n        limit: most products to return (default 10, max 50). When a search excludes an allergen, every product carries allergy_check. Show that line with every product you mention, word for word.",
