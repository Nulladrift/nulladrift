          "name": "price_movements",
          "title": "How a kind of product's prices moved",
          "description": "How a whole category's prices moved between two dates, in one call: the biggest regular-price rises and falls, promotions starting and ending, member price changes (Tesco Clubcard, SuperValu Real Rewards, Lidl Plus) and pack-size changes, kept apart, with a summary over every product compared (average and median shelf change, counts of rises and falls) overall and per store.\n\nshelf_rise and shelf_fall are changes to the regular price; promotion_started and promotion_ended are changes in what was paid while the regular price stayed the same (a product at 18 euro on promotion and 23 euro after is a promotion ending, not a 27.8% price rise); loyalty_change is a member price moving; pack_change is the same product in a different pack size, confirmed over three days of records (a smaller pack at the same price is a hidden rise); was_price_change is an offer running at both dates while only its \"was\" price moved, kept out of the shelf figures because nobody paid it. Averages are geometric, so a half-price offer starting and ending cancel out; average_member_paid_change_pct uses member prices where they apply.\n\nEach mover returned costs one credit; the summaries are free.",
