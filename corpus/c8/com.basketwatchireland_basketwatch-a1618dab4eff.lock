        {
          "name": "get_promotions",
          "title": "Current promotions at a supermarket",
          "description": "List products currently on promotion at a given supermarket, the\n    biggest saving the shop states first. Every promotion can be reached:\n    each call returns one page, and offset moves through the whole list.\n\n    Returns offer label (e.g. \"3 for €5\", \"SAVE €0.75\"), was-price,\n    validity window, offer_ends (the last day the offer applies, Irish\n    time), and where applicable Tesco Clubcard prices,\n    SuperValu Real Rewards prices, Dunnes member offers or Lidl Plus prices\n    (scan the Lidl Plus app at the till).\n\n    Args:\n        store: one of \"tesco\", \"supervalu\", \"dunnes\", \"lidl\". (Aldi doesn't\n            publish multibuy promos so isn't supported here.)\n        limit: how many promotional rows to return in one page (default 25,\n            max 200).\n        offset: how many rows to skip, for the next page (default 0). A page\n            shorter than limit is the last one.\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "title": "Offset",
                "type": "integer"
              },
              "store": {
                "title": "Store",
                "type": "string"
              }
            },
            "required": ["store"],
            "title": "get_promotionsArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Promotion": {
                "additionalProperties": true,
                "properties": {
                  "id": {
                    "title": "Id",
                    "type": "string"
                  },
