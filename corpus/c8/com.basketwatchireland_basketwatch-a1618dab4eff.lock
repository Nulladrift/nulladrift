      "instructions": "Irish grocery data across Aldi, Tesco, SuperValu, Dunnes Stores and Lidl: shelf prices, promotions, loyalty-card prices, price history, ingredients and nutrition, refreshed every night.",
      "tools": [
        {
          "name": "best_deals",
          "title": "Best real deals today",
          "description": "Today's real deals at Aldi, Tesco, SuperValu, Dunnes Stores and Lidl:\n    offers at the lowest price on record for that product at that shop, or\n    the first offer it has ever had. Each is measured against the product's\n    own price history, not the shop's was price, so a recurring or\n    long-running price does not count as a deal.\n\n    The biggest saving comes first, against the usual price or the price it\n    typically sold at, whichever is less, so a product that is usually on\n    offer does not lead. By that saving, the shops take turns among deals\n    that save alike, so one shop does not fill the top of the list, and no\n    deal comes ahead of one that saves more than twice as much. Every\n    promotion on sale is judged, so this covers them all, and offset reaches\n    every deal. Covers food, drinks, alcohol, household, baby and pet\n    products unless another aisle is named. Tobacco, infant formula and\n    medicines are never included.\n\n    Args:\n        query: words in the product's name or brand, e.g. \"heinz\" or\n            \"baileys\": a product or a brand, never an aisle (few wines have\n            the word wine in their name).\n        category: an aisle or shelf, e.g. \"frozen\", \"household\" or\n            \"toiletries\". \"alcohol\" is every drink above 0.5% ABV at the\n            five chains, low-alcohol ones included. \"alcohol free\" is the\n            drinks of 0.5% ABV or less: by the strength on record, by a name\n            that says alcohol free, non-alcoholic, 0.0 or de-alcoholised, or,\n            with no strength on record, by a shelf that says so (a shop's\n            shared \"low and no\" shelf alone does not count); \"low and no\"\n            adds the low-alcohol drinks on those shelves. The drinks aisles\n            are \"wine\", \"beer\", \"cider\", \"spirits\" (liqueurs included),\n            \"liqueurs\" and \"premixes\" (alcopops and canned cocktails), or a\n            list such as \"beer and cider\". Together they hold all of\n            \"alcohol\" but a drink whose shelf, name, type and strength place\n            it in none of them, such as a beer shelved only under a shop's\n            whole drinks department with only its brand for a name. \"drinks\"\n            is every drink, alcohol included; \"soft drinks\" leaves alcohol\n            out.\n        store: one of \"aldi\", \"tesco\", \"supervalu\", \"dunnes\", \"lidl\". Leave it\n            out for all five.\n        limit: how many deals to return in one page (default 20, max 200).\n        offset: how many deals to skip, for the next page (default 0).\n\n    Returns {\"as_of\", \"note\", \"total\", \"deals\"}. total counts every deal for\n    this search, across all pages. Each deal has name, store, pack,\n    you_pay, regular_price, saving_eur, saving_pct, card_needed, buy_quantity,\n    offer_ends, url and category, and the record behind it: kind, lowest_since,\n    low_before, low_before_date, offer_start, run_start, days_on_offer,\n    started_today, cut_today, yesterday_price, back_after_days, typical_price,\n    offer_share and abv. started_today is true only for an offer that began on\n    the collection day; an offer running for weeks whose price fell that day\n    has cut_today instead, and offer_start says since when it has been on\n    offer. One credit per deal returned.\n    ",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Category"
              },
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "title": "Offset",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Query"
              },
              "store": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Store"
              }
            },
            "title": "best_dealsArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Deal": {
                "additionalProperties": true,
                "properties": {
                  "abv": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Alcohol by volume in percent, as the product's record has it. Empty when none is stated, and when the record cannot be right: over 100, over what a drink of its aisle reaches, or over 0.5 for a drink named alcohol free",
                    "title": "Abv"
                  },
                  "back_after_days": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
