        {
          "name": "compare_price_across_stores",
          "title": "Each shop's own matches for a product name",
          "description": "Raw per-store search results for a product name at all five supermarkets: every matching line at each store, including other pack sizes, without matching the same product across stores, so its rows are not like for like.\n\nstores is keyed by store, each shop's closest matches first; total_by_store is how many each has in all; as_of is the day the prices are from. Each product returned costs one credit, up to limit_per_store at each of the five stores.",
