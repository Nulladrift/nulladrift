        {
          "name": "compare_prices",
          "title": "Where is a product cheapest",
          "description": "Find where a product is cheapest right now. Matches the same product at\n    Aldi, Tesco, SuperValu, Dunnes Stores and Lidl and returns each store's\n    current price side by side, with unit prices, offers and member prices\n    (Tesco Clubcard, SuperValu Real Rewards, Lidl Plus). To list the products most stores stock,\n    leave out query and set min_stores, e.g. min_stores=5 for every product\n    matched at all five.\n    Free: no BasketWatch account needed.\n\n    Args:\n        query: the product, e.g. \"heinz ketchup\" or \"kerrygold butter 454g\".\n            Optional when min_stores is given.\n        limit: how many matched products to return (default 5, max 50).\n        min_stores: only products matched at at least this many stores, 2 to\n            5, with or without query.\n\n    Returns {\"as_of\", \"query\", \"matches\": [{\"product\", \"pack\", \"prices\":\n    {store: {name, price, unit_price, unit_basis, offer_text, was_price,\n    offer_ends, clubcard_price, url}}, \"cheapest_store\"}]}. A store missing from \"prices\" did not have that product in its online range today and may still sell it in store: say \"not found online\", not that the store lacks it. offer_ends is the last day an\n    offer applies (Irish time): say when an offer ends, as online orders are\n    priced for the delivery or collection day.\n    ",
