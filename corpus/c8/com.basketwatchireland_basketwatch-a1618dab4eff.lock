                    "default": null,
                    "description": "For an offer that began on the collection day: the days with no offer right before it, 14 or more, after an earlier offer. Given only when the whole break is on the price record, so it is never a guess",
                    "title": "Back After Days"
                  },
                  "buy_quantity": {
                    "default": 1,
                    "description": "How many to buy together to pay you_pay",
                    "title": "Buy Quantity",
