        {
          "name": "get_price_history",
          "title": "Price history",
          "description": "A product's recorded daily prices over a date range. BasketWatch has kept\n    every night's price at Aldi, Tesco, SuperValu and Dunnes Stores since May\n    2026 and at Lidl since 17 October 2026, and, with\n    with_nutrition_and_ingredients, each day's nutrition per 100g or 100ml and\n    ingredients list as the retailer's own data stated them, kept since\n    16 October 2026: for questions like \"has the sugar in Frosties changed\".\n\n    Takes product ids (as returned in product results; an Aldi id has no store\n    prefix, and \"aldi:\" in front of one is accepted) or a query; with a query,\n    the closest matching products are looked up first. A range returns one row\n    per product per day, and each row costs one credit; with from_date equal\n    to to_date, one day's price is returned.\n\n    Every product gets the same days. When products x days would pass the row\n    limit, the range is shortened to its most recent days for all of them and\n    note says so; ids with no price in the range are listed in not_found.\n\n    Args:\n        product_ids: e.g. [\"tesco:300793546\", \"dunnes:100873410\",\n            \"000000000000387044\"], up to 50; each id's store is taken from it.\n        query: product name words, used when no product_ids are given.\n        store: aldi, tesco, supervalu, dunnes or lidl, to narrow a query.\n            Leave it out to look in all five.\n        from_date: first day, YYYY-MM-DD. Defaults to 30 days before to_date.\n        to_date: last day, YYYY-MM-DD. Defaults to today.\n        limit: most rows to return in total (default and maximum 200).\n        with_nutrition_and_ingredients: true adds nutrition_per_100 to every\n            row and the ingredients list on each product's first day and on\n            any day it changed. Days before 16 October 2026 have none.\n\n    Returns rows (id, name, store, scrape_date, price, unit_price, unit_basis,\n    clubcard_price, offer_text, was_price), the days covered, not_found, note.\n    ",
