      "instructions": "Irish grocery prices and labels at Aldi, Tesco, SuperValu, Dunnes Stores and Lidl, read from each shop's website every night: shelf prices, offers, loyalty-card prices, daily price history (since May 2026; Lidl since 17 October 2026), ingredients, nutrition and country of origin.\n\nCost. compare_prices, status and check_credits are free. Every other tool uses credits from the person's BasketWatch account, one for each record it returns, and its answer says what it used and what is left (credits). Make sure the person knows: the first time a tool uses credits in a conversation, say that it did and how many are left. For a call likely to use more than about 30 (a long price history, a full page of offers), say what it is likely to cost and go ahead; for a job likely to use more than about 150 in all, ask first. It answers questions and exports no shop's range: an account can look up only so many different products a day.\n\nWhich tool. Where one product is cheapest: compare_prices. A shopping list or a receipt: price_basket, once, with every line. Products by what is in them, their nutrition, an offer or a quality mark, or sorted by price: find_products. A product by name with nothing to filter or sort: search_products. The label of particular products: get_product_details. Today's offers: best_deals for those that are a real low, get_promotions for everything one shop has on offer. How prices moved: get_price_history for products, price_movements for a whole kind of product, price_basket_over_time for a basket.\n\nReading an answer. Prices are each shop's online price on the day in as_of; prices in store can differ. price is what anyone pays, clubcard_price what a member pays (Tesco Clubcard, SuperValu Real Rewards, Lidl Plus). Compare packs on price_per_kg or price_per_litre, never on unit_price, which each shop states in its own measure. A shop with no price for a product did not have it in its online range that day: say \"not found online\", never that the shop does not sell it. A product id goes back into another tool exactly as it was given. Nutrition and ingredients are for information only: tell people to check the pack, and never to rely on them for an allergy.",
      "tools": [
        {
          "name": "best_deals",
          "title": "Best real deals today",
          "description": "Today's real deals at Aldi, Tesco, SuperValu, Dunnes Stores and Lidl: offers at the lowest price on record for that product at that shop, or the first offer it has ever had. Each is measured against the product's own price history, not the shop's was price, so a recurring or long-running price does not count as a deal.\n\nThe biggest saving comes first, against the usual price or the price it typically sold at, whichever is less, so a product that is usually on offer does not lead. By that saving, the shops take turns among deals that save alike, so one shop does not fill the top of the list, and no deal comes ahead of one that saves more than twice as much. Every promotion on sale is judged, so this covers them all, and offset reaches every deal. Covers food, drinks, alcohol, household, baby and pet products unless another aisle is named. Tobacco, infant formula and medicines are never included.\n\nReturns {\"as_of\", \"note\", \"total\", \"deals\"}. total counts every deal for this search, across all pages, and next_offset is the next page's offset, missing on the last page. Each deal has name, store, pack, you_pay, regular_price, saving_eur, saving_pct, card_needed, buy_quantity, offer_ends, url and category, and the record behind it: kind, lowest_since, low_before, low_before_date, offer_start, run_start, days_on_offer, started_today, cut_today, yesterday_price, back_after_days, typical_price, offer_share and abv. started_today is true only for an offer that began on the collection day; an offer running for weeks whose price fell that day has cut_today instead, and offer_start says since when it has been on offer. One credit per deal returned.",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
