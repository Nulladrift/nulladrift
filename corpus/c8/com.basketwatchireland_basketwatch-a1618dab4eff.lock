        {
          "name": "find_products",
          "title": "Find products by ingredients, nutrition, quality mark, offers or price",
          "description": "Find products that meet ingredient, nutrition, alcohol or offer conditions, optionally sorted. For questions like \"biscuits without palm oil\", \"nut-free snacks at Tesco\", \"vegan chocolate\", \"cereal with the least sugar\", \"high protein yoghurt\", \"bread with the fewest ingredients\", \"alcohol-free beer\", \"low salt soup\" or \"cheapest olive oil at Aldi\". Fibre and saturated fat are not recorded. quality_mark finds products by mark (Bord Bia, organic, free range), with or without a query.\n\nA search is for one kind of product: every word of query has to be in a product's name, so several kinds in one query (\"lentils chickpeas beans\") match nothing. A search on price or offers alone returns short rows: name, pack, shop, shelf, price, offer and unit price (unit_price in the shop's own measure, price_per_kg or price_per_litre the same figure per kilo or per litre). A search with an ingredient, nutrition, additive, origin or strength condition, or sorted on one, returns each product's label as well: nutrition, ingredients, ingredient count, allergy advice and where they came from. detail chooses either for any search.\n\nWith no store, results alternate across the stores (each store's best match, then each store's next), and matched_by_store gives each store's full count: the first row is one store's best, and the best of a kind across the stores is among each store's first rows. The counts add up: of_kind, the products that are the kind searched for, is matched + left_out_unknown + left_out_failed_filters + left_out_partly_from_origin + left_out_may_contain, and \"N of M\" is matched of of_kind.\n\nA product whose ingredient list or nutrition is not on record, or whose ingredient list on record is incomplete, is left out, never assumed to pass: left_out_unknown counts them, left_out_by_reason gives the reasons, and caveats lists known gaps (Aldi's own ingredient lists are often cut short, so an Aldi product is offered as free from something only when its full list comes from the same barcode at Tesco, SuperValu or Dunnes). Claims printed in a product's NAME, such as \"gluten free\", \"lactose free\", \"alcohol free\" or \"vegan\", are matched through query; exclude_ingredients also checks the ingredients. Alcohol strength is recorded for most SuperValu, Dunnes and Tesco drinks but few at Aldi or Lidl; \"alcohol free\" and \"0.0\" in query match drinks named that way.\n\nAnswers come from the ingredient lists and nutrition the retailers publish. Where a retailer gives no list, it may come from the same barcode at another retailer or from Open Food Facts (ingredients_source); an Open Food Facts list is never used to show a product is free from something. \"Free from\" means none of the listed ingredients names it; not every \"may contain\" warning is covered. Results that show ingredients or nutrition carry a note that this is information only. Each product returned costs one credit. When a search excludes an allergen, every product carries allergy_check. Show that line with every product you mention, word for word.",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "An aisle or shelf to narrow by, e.g. 'Breakfast Cereals' or 'Kefir'. A shop with no shelf of that name is searched by product name instead, and caveats names the shops where that happened."
              },
              "descending": {
                "default": false,
                "description": "True for highest first, e.g. most protein.",
                "type": "boolean"
              },
              "detail": {
                "anyOf": [
                  {
                    "enum": ["short", "full"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "'short' rows hold name, pack, shop, shelf, price, offer and unit price; 'full' rows hold each product's label as well (nutrition, ingredients, allergy advice). Left out: short for a search on price or offers alone, full for a search with any condition or sort on the label."
              },
              "exclude_ingredients": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
