        {
          "name": "get_product_details",
          "title": "Nutrition, ingredients and product details",
          "description": "Nutrition per 100g or 100ml (energy, fat, carbohydrate, sugars, protein,\n    salt), the ingredients list as printed (allergens included), how many\n    ingredients it lists, country of origin, alcohol strength, pack size,\n    description and today's price, for particular products.\n\n    Products are looked up by product id (store-prefixed, as returned in\n    product results), by the retailer's own item numbers (skus with store, as\n    printed on its receipts), or by name (query). ingredients_incomplete marks\n    an ingredient list on record that is cut short, which cannot show that an\n    ingredient is absent. Results carry a note that nutrition and ingredients\n    are for information only. Each product returned costs one credit.\n\n    Args:\n        query: product name words, e.g. \"kellogg's corn flakes\".\n        product_ids: e.g. [\"tesco:300793546\", \"dunnes:100873410\"], up to 50.\n        skus: the store's own item numbers, e.g. [\"100873410\"], up to 50;\n            needs store. An Aldi article number can return several variants.\n        store: aldi, tesco, supervalu, dunnes or lidl: required with skus,\n            narrows a query; leave out for all five.\n        limit: most products to return for a query (default 5, max 50).\n    ",
