          "name": "compare_prices",
          "title": "Where is a product cheapest",
          "description": "Find where a product is cheapest right now. Matches the same product at Aldi, Tesco, SuperValu, Dunnes Stores and Lidl and returns each store's current price side by side, with unit prices, offers and member prices (Tesco Clubcard, SuperValu Real Rewards, Lidl Plus). It answers for one product a call. To list the products matched at several stores, leave out query and set min_stores, e.g. min_stores=5 for every product matched at all five. Free: no BasketWatch account needed.\n\ntotal is how many matched products the search found in all. cheapest_match is the cheapest product of the kind asked for, by shelf price; matches lists the closest matches first, not the cheapest, so the first of them is not the cheapest. In each match, prices is keyed by store; cheapest_store goes by shelf price and cheapest_store_with_card by the loyalty-card price where a shop has one. unit_price is in the shop's own measure (unit_basis); price_per_kg or price_per_litre is the same figure per kilo or per litre. A store missing from \"prices\" did not have that product in its online range today and may still sell it in store: say \"not found online\", not that the store lacks it. offer_ends is the last day an offer applies (Irish time): say when an offer ends, as online orders are priced for the delivery or collection day.",
