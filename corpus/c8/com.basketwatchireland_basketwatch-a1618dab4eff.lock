        {
          "name": "get_price_history",
          "title": "Price history",
          "description": "A product's recorded daily prices over a date range. BasketWatch has kept every night's price at Aldi, Tesco, SuperValu and Dunnes Stores since May 2026 and at Lidl since 17 October 2026, and, with with_nutrition_and_ingredients, each day's nutrition per 100g or 100ml and ingredients list as the retailer's own data stated them, kept since 16 October 2026: for questions like \"has the sugar in Frosties changed\".\n\nTakes product ids (as returned in product results; an Aldi id has no store prefix, and \"aldi:\" in front of one is accepted) or a query; with a query, the closest matching product at each shop is looked up first, one a shop, so a month of days fits whole, and each row names the product it is for. A range returns one row per product per day, and each row costs one credit; with from_date equal to to_date, one day's price is returned. One credit per row comes to about 31 for one product for a month and about 155 for a product at five shops, and a look-up by name adds one for each shop that has the product.\n\nEvery product gets the same days. When products x days would pass the row limit, the range is shortened to its most recent days for all of them and note says so; ids with no price in the range are listed in not_found.\n\nReturns rows (id, name, store, scrape_date, price, unit_price, unit_basis, clubcard_price, offer_text, was_price), the days covered, not_found, note.",
