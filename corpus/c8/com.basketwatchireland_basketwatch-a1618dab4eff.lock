                "default": null,
                "description": "An aisle or shelf, e.g. \"frozen\", \"household\" or \"toiletries\". \"alcohol\" is every drink above 0.5% ABV at the five chains, low-alcohol ones included. \"alcohol free\" is the drinks of 0.5% ABV or less: by the strength on record, by a name that says alcohol free, non-alcoholic, 0.0 or de-alcoholised, or, with no strength on record, by a shelf that says so (a shop's shared \"low and no\" shelf alone does not count); \"low and no\" adds the low-alcohol drinks on those shelves. The drinks aisles are \"wine\", \"beer\", \"cider\", \"spirits\" (liqueurs included), \"liqueurs\" and \"premixes\" (alcopops and canned cocktails), or a list such as \"beer and cider\". Together they hold all of \"alcohol\" but a drink whose shelf, name, type and strength place it in none of them, such as a beer shelved only under a shop's whole drinks department with only its brand for a name. \"drinks\" is every drink, alcohol included; \"soft drinks\" leaves alcohol out."
              },
              "limit": {
                "default": 20,
                "description": "How many deals to return in one page (default 20, at most 200).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
