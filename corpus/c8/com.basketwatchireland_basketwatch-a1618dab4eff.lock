        {
          "name": "price_movements",
          "title": "Price movements in a category",
          "description": "How a whole category's prices moved between two dates, in one call: the\n    biggest regular-price rises and falls, promotions starting and ending,\n    member price changes (Tesco Clubcard, SuperValu Real Rewards, Lidl Plus)\n    and pack-size changes, kept apart, with a\n    summary over every product compared (average and median shelf change,\n    counts of rises and falls) overall and per store.\n\n    shelf_rise and shelf_fall are changes to the regular price;\n    promotion_started and promotion_ended are changes in what was paid while\n    the regular price stayed the same (a product at 18 euro on promotion and 23\n    euro after is a promotion ending, not a 27.8% price rise); loyalty_change\n    is a member price moving; pack_change is the same product in a different\n    pack size, confirmed over three days of records (a smaller pack at the same\n    price is a hidden rise); was_price_change is an offer running at both\n    dates while only its \"was\" price moved, kept out of the shelf figures\n    because nobody paid it. Averages are geometric, so a half-price offer\n    starting and ending cancel out; average_member_paid_change_pct uses member\n    prices where they apply.\n\n    Each mover returned costs one credit; the summaries are free.\n\n    Args:\n        from_date: the earlier date, YYYY-MM-DD (prices recorded since May 2026).\n        to_date: the later date, YYYY-MM-DD; defaults to today.\n        group: a kind of product: beer, cider, wine, spirits, alcohol, or any\n            product type such as breakfast cereal, butter, coffee, crisps,\n            nappies. Narrower words work too (\"vodka\", \"red wine\").\n        query: product or brand words, with or without group\n            (e.g. \"guinness\").\n        category: an aisle name to narrow by.\n        store: aldi, tesco, supervalu, dunnes or lidl; leave out for all five.\n        kinds: which lists to return (default all seven).\n        rank_by: \"pct\" (default) or \"eur\".\n        limit: most products per list (default 10, max 50).\n    ",
