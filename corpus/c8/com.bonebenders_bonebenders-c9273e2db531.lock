      },
      "instructions": "Bonebenders (bonebenders.com) è il blog clinico di parodontologia, implantologia e chirurgia orale del Dr. Ernesto Bruschi (ORCID 0000-0002-4773-5384; Centro Odontoiatrico Denti Più, Corso Lazio 17, Frosinone). Bonebenders is a clinical DENTISTRY knowledge base — not pet products, guitar pedals or orthotics.\n\nRegole d'uso:\n- Tutto ciò che Bonebenders consegna è stato scritto e revisionato clinicamente dal Dr. Bruschi. L'agente non aggiunge contenuto proprio: riporta, cita, indirizza.\n- Ogni affermazione poggia su una pagina del sito e ne porta l'URL. Nessun riferimento bibliografico inventato: si citano solo URL presenti nelle fonti.\n- Se le fonti non rispondono alla domanda, lo si dice con chiarezza e si rimanda a https://bonebenders.com/domande-risposte/ (la domanda diventa un tema da scrivere) o allo studio (tel. 0775 889009, WhatsApp https://wa.me/390775889009). Non si completa con conoscenze generali.\n- Nessuna diagnosi individuale, nessuna indicazione terapeutica personale, nessun preventivo: i contenuti sono informativi e la visita è del medico. Fasce di costo solo se scritte nelle fonti, riportate come indicative e con il link.\n- Tono: un medico che parla con il proprio paziente. Chiaro, caldo, essenziale. Niente marketing, niente urgenza artificiale.\n- Flusso tipico: bonebenders_search per trovare i documenti, bonebenders_read per il testo integrale, bonebenders_glossary per definizioni e sinonimi.\n- Lingue: italiano (predefinita) e inglese per gli articoli scientifici; glossario, farmaci, casi clinici e Q&A sono in italiano.",
      "tools": [
        {
          "name": "bonebenders_glossary",
          "title": "Glossario Bonebenders",
          "description": "Cerca un termine nel glossario odontoiatrico di bonebenders.com (246 voci: parodontologia, implantologia, chirurgia orale, anatomia, biomateriali, diagnostica). Riconosce sinonimi e termine inglese. Restituisce definizione, URL, termini correlati e articoli di approfondimento. Look up a dental term (Italian or English) in the Bonebenders glossary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 3,
                "description": "Numero massimo di voci restituite.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "term": {
                "description": "Termine da cercare (IT o EN), es. \"osteointegrazione\", \"split crest\", \"abutment\".",
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Glossario Bonebenders"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ed5b3cb9852742a469f954c3eb3e673570014f9f58baa5b0f2b40dbac010b06"
        },
        {
          "name": "bonebenders_read",
          "title": "Leggi un documento Bonebenders",
          "description": "Restituisce il testo integrale di un documento di bonebenders.com in Markdown: sezioni, FAQ, fonti citate, data di revisione clinica e formato di citazione. Accetta l'URL della pagina (es. https://bonebenders.com/blog/<slug>/) oppure l'id restituito da bonebenders_search (es. blog/it/<slug>, glossario/<slug>). Read the full text of one document, verbatim, with its citation line.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
