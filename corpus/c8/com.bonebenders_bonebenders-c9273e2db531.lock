            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3efe55084225c3cc91a5ba19d9cfddbc3ea9dcf4cee87ea93038637872888299"
        },
        {
          "name": "bonebenders_search",
          "title": "Cerca nel corpus Bonebenders",
          "description": "Cerca tra articoli del blog (IT/EN), voci di glossario, schede farmaci, casi clinici, Q&A e pagine fisse (chi sono, contatti, pagine cliniche) di bonebenders.com. Restituisce titolo, URL, data, revisione clinica e il passaggio più pertinente di ogni risultato. Usa parole chiave cliniche in italiano o inglese (es. \"split crest\", \"peri-implantite\", \"bifosfonati impianti\"). Search the clinical corpus written by Dr. Ernesto Bruschi; results are quotes with their source URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
