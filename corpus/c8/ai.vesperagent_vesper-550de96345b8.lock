{
  "lockfileVersion": 2,
  "subjects": {
    "ai.vesperagent/vesper": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.vesperagent.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "vesper",
        "title": "VESPER",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "VESPER provides read-only automation estimates, specification drafts, and Japanese advertising copy checks. Inputs are processed locally within this service without storage or external API calls; results are reference information.",
      "tools": [
        {
          "name": "check_japanese_ad_copy",
          "title": "日本向け広告文の表現チェック",
          "description": "Mechanically flag potentially misleading Japanese advertising claims with severity, quoted context, and alternative wording. This is not a legal determination. 日本向け広告・LPの表現を機械的に点検します。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "findings": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "category": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "context": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "end": {
                          "minimum": 0,
                          "type": "integer"
                        },
                        "match": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "reason": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "severity": {
                          "enum": ["high", "medium", "low"],
                          "type": "string"
                        },
                        "start": {
                          "minimum": 0,
                          "type": "integer"
                        },
                        "suggestion": {
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["category", "context", "end", "match", "reason", "severity", "start", "suggestion"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "note": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "position_unit": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "summary": {
                    "additionalProperties": false,
                    "properties": {
                      "high": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "low": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "medium": {
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "required": ["high", "low", "medium"],
                    "type": "object"
                  }
                },
                "required": ["findings", "note", "position_unit", "summary"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "error": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["error"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "日本向け広告文の表現チェック"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8fa8d6f67376d78e02a338574abfd525efbe60ddcb87a045601fe211ced91680"
        },
        {
          "name": "draft_automation_spec",
          "title": "自動化仕様書の下書き",
          "description": "Draft a ten-section automation specification from existing steps, marking human approval gates and automation candidates. No actions are executed. 現行手順から承認箇所を明示した仕様書の下書きを作成します。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "current_steps": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "frequency": {
                "minLength": 1,
                "type": "string"
              },
              "owner_role": {
                "minLength": 1,
                "type": "string"
              },
              "task_name": {
                "minLength": 1,
                "type": "string"
              },
              "tools_used": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["current_steps", "task_name"],
            "type": "object"
          },
          "outputSchema": {
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "approval_gates": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "placement": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "step": {
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["placement", "step"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "automation_candidates": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "instruction": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "step": {
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["instruction", "step"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "flow": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "automation_candidate": {
                          "type": "boolean"
                        },
                        "instruction": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "requires_approval": {
                          "type": "boolean"
                        },
                        "step": {
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["automation_candidate", "instruction", "requires_approval", "step"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "note": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "sections": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "items": {
                          "items": {
                            "minLength": 1,
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "title": {
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["items", "title"],
                      "type": "object"
                    },
                    "maxItems": 10,
                    "minItems": 10,
                    "type": "array"
                  },
                  "task_name": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["approval_gates", "automation_candidates", "flow", "note", "sections", "task_name"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "error": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["error"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "自動化仕様書の下書き"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0e9964dc52caaf7ba48808341dda8ed91b28378157613d17a7ad60575192ded"
        },
        {
          "name": "estimate_automation_savings",
          "title": "業務自動化の削減効果試算",
          "description": "Estimate monthly and annual time savings and JPY equivalents from task assumptions; rank tasks by time saved. Estimates do not guarantee outcomes. 業務ごとの前提から削減時間と円換算を試算します。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hourly_cost_jpy": {
                "default": 3000,
                "minimum": 0,
                "type": "number"
              },
              "tasks": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "automatable_ratio": {
                      "default": 0.6,
                      "maximum": 1,
                      "minimum": 0,
                      "type": "number"
                    },
                    "minutes_per_run": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "name": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "people": {
                      "default": 1,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "runs_per_month": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["minutes_per_run", "name", "runs_per_month"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["tasks"],
            "type": "object"
          },
          "outputSchema": {
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "annual_total": {
                    "additionalProperties": false,
                    "properties": {
                      "hours": {
                        "type": "number"
                      },
                      "value_jpy": {
                        "type": "number"
                      }
                    },
                    "required": ["hours", "value_jpy"],
                    "type": "object"
                  },
                  "assumptions": {
                    "additionalProperties": false,
                    "properties": {
                      "calculation": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "hourly_cost_jpy": {
                        "type": "number"
                      },
                      "months_per_year": {
                        "minimum": 1,
                        "type": "integer"
                      },
                      "rounding": {
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["calculation", "hourly_cost_jpy", "months_per_year", "rounding"],
                    "type": "object"
                  },
                  "monthly_total": {
                    "additionalProperties": false,
                    "properties": {
                      "hours": {
                        "type": "number"
                      },
                      "value_jpy": {
                        "type": "number"
                      }
                    },
                    "required": ["hours", "value_jpy"],
                    "type": "object"
                  },
                  "note": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "priority": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "monthly_hours": {
                          "type": "number"
                        },
                        "name": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "rank": {
                          "minimum": 1,
                          "type": "integer"
                        },
                        "task_index": {
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["monthly_hours", "name", "rank", "task_index"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "tasks": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "automatable_ratio": {
                          "type": "number"
                        },
                        "minutes_per_run": {
                          "type": "number"
                        },
                        "monthly_hours": {
                          "type": "number"
                        },
                        "monthly_value_jpy": {
                          "type": "number"
                        },
                        "name": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "people": {
                          "minimum": 1,
                          "type": "integer"
                        },
                        "runs_per_month": {
                          "type": "number"
                        }
                      },
                      "required": ["automatable_ratio", "minutes_per_run", "monthly_hours", "monthly_value_jpy", "name", "people", "runs_per_month"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["annual_total", "assumptions", "monthly_total", "note", "priority", "tasks"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "error": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["error"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "業務自動化の削減効果試算"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b8c2f7adf75748f106a78da5058cad936e4f950878f79e54b3656a18f08f0d0a"
        }
      ],
      "digest": "sha256:4d5bb1c7cefdaf7b211324e8a4dedfbca286368aaa8e92c43bdece942e692df1"
    }
  }
}
