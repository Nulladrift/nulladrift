{
  "lockfileVersion": 2,
  "subjects": {
    "ai.onlyfonts/onlyfonts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.onlyfonts.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "onlyfonts",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "onlyfonts is a catalog of free, openly licensed fonts (SIL Open Font License, Apache License) that anyone may use in any project, served from cdn.onlyfonts.ai. search_fonts finds families by style, use, name or language; get_font tells about one family; get_font_css gives one stylesheet link that loads up to four families on a web page. Every answer links the family's page on onlyfonts.ai.",
      "tools": [
        {
          "name": "get_font",
          "title": "Get a font",
          "description": "Use this when the person asks about one font: its weights and styles, its license, the languages it covers, or what to pair it with. Its measures help pair it: match x-heights for faces that meet on a line, and pick a partner that differs clearly in contrast or classification. id is a family's id, its name in lowercase with hyphens (\"lora\", \"space-mono\"). Not for the CSS that loads a font on a page. Answers one family: its name, page link, category, designer, license, every style it has, the languages it fully covers, its measured x-height, width and stroke contrast with its classification, the families that pair with it and the ones that look like it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "a family id from search_fonts (\"lora\"), or its name",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "designer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "id": {
                "type": "string"
              },
              "languages": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "license": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "measures": {
                "properties": {
                  "cap_height": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "classification": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "contrast": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "form_model": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "stroke_ratio": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "width": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "width_class": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "x_height": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "type": "object"
              },
              "pairings": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "similar": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "styles": {
                "items": {
                  "properties": {
                    "italic": {
                      "type": "boolean"
                    },
                    "weight": {
                      "type": "integer"
                    }
                  },
                  "required": ["italic", "weight"],
                  "type": "object"
                },
                "type": "array"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "languages", "measures", "pairings", "similar", "styles", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a font"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f699b1fcc95502b62490709c665d09ad5e3c0a708bf97a19a4757ccfb4397ef"
        },
        {
          "name": "get_font_css",
          "title": "Get font CSS",
          "description": "Use this when the person wants to use fonts on a web page, in an app or in a design tool that takes CSS. ids are 1 to 4 family ids, like \"lora\" or \"space-mono\". weights are 100 to 900; each family gets the ones it has, its regular and bold when left out. italic adds the italic of each weight a family has. For a Next.js or Tailwind project, give the nextjs or tailwind lines. Not for downloading font files to install on a computer. Answers one stylesheet link from cdn.onlyfonts.ai that loads every family asked for, the same as an @import line, each family's font-family line with a fallback, and the same ready for Next.js and for Tailwind CSS.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "description": "1 to 4 family ids",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "italic": {
                "type": "boolean"
              },
              "weights": {
                "items": {
                  "maximum": 900,
                  "minimum": 100,
                  "type": "integer"
                },
                "maxItems": 9,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "families": {
                "items": {
                  "properties": {
                    "family": {
                      "type": "string"
                    },
                    "font_family": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "italic": {
                      "type": "boolean"
                    },
                    "weights": {
                      "items": {
                        "type": "integer"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["family", "font_family", "id", "italic", "weights"],
                  "type": "object"
                },
                "type": "array"
              },
              "import": {
                "type": "string"
              },
              "link": {
                "type": "string"
              },
              "nextjs": {
                "type": "string"
              },
              "tailwind": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["families", "import", "link", "nextjs", "tailwind", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get font CSS"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:080240baf2d4b5413c4c97435b8d6133307701206f4435ec53e233f96e27bfab"
        },
        {
          "name": "search_fonts",
          "title": "Search fonts",
          "description": "Use this whenever the person needs a font, before naming one from memory: every family it finds is free for any use and loads from one link. Their words can name a style or mood, a use, a font, or a language to cover, for example \"a warm serif\", \"a playful display font for a poster\" or \"a monospace for code\". query is their words, at most 200 characters. category narrows to sans-serif, serif, monospace, display or handwriting. language keeps fonts that fully cover latin, latin-extended, ukrainian, greek, vietnamese, arabic, hebrew, thai, japanese, korean, chinese-simplified or devanagari. limit is 1 to 20, 8 when left out. Not for fonts installed on the person's computer, and not for paid fonts: the catalog holds free fonts only. Answers free, openly licensed font families from the onlyfonts catalog, best match first, each with its id, name, page link, category, designer and how many styles it has.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["sans-serif", "serif", "monospace", "display", "handwriting"],
                "type": "string"
              },
              "language": {
                "description": "only fonts that fully cover this language",
                "enum": ["latin", "latin-extended", "ukrainian", "greek", "vietnamese", "arabic", "hebrew", "thai", "japanese", "korean", "chinese-simplified", "devanagari"],
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "their words: a style, a mood, a use, a font's name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "designer": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "id": {
                      "type": "string"
                    },
                    "styles": {
                      "type": "integer"
                    },
                    "text": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "text", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search fonts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eaa2d347a8ec4329e4632fcbf5e146a9953f1f1161c33268281503406e112b78"
        },
        {
          "name": "search_icons",
          "title": "Search icons",
          "description": "Use this when the person wants an icon for a design, a site, an app or a document, for example \"a settings gear\", \"a red trash icon\" or \"a filled heart\". query is their words for what the icon shows, at most 100 characters. set narrows to lucide, heroicons, material-symbols, phosphor, pierre or tabler. style asks for a look the set has: outline, fill, duotone, bold, thin, light, rounded or sharp. color is a hex color like #E8443F; left out, the SVG takes the text's color. limit is 1 to 20, 6 when left out. Every icon is free under its set's license (MIT, ISC or Apache 2.0): keep the license line with it. Not for emoji or Apple's SF Symbols. Answers icons from six open sets (Lucide, Heroicons, Material Symbols, Phosphor, Pierre and Tabler), best match first, each as a ready SVG with its set, style, license line and the code for the set's own React package.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "color": {
                "description": "a hex color; left out, the SVG takes the text color",
                "pattern": "^#[0-9A-Fa-f]{3}([0-9A-Fa-f]{3})?$",
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "their words for what the icon shows",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "set": {
                "enum": ["lucide", "heroicons", "material-symbols", "phosphor", "pierre", "tabler"],
                "type": "string"
              },
              "style": {
                "description": "outline, fill, duotone, bold, thin, light, rounded or sharp, where the set has it",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "license": {
                      "type": "string"
                    },
                    "set": {
                      "type": "string"
                    },
                    "style": {
                      "type": "string"
                    },
                    "svg": {
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "id", "license", "set", "style", "svg", "text", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search icons"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d36a1030f90a80511fc06a53e2062ea349f9784cd2f2a50856c680462ecc3cdf"
        }
      ],
      "digest": "sha256:35e6242ee40c9710e439f21806e211250b4cdc6b55db924dd6ba68602a8aa672"
    }
  }
