{
  "lockfileVersion": 2,
  "subjects": {
    "ai.onlyfonts/onlyfonts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.onlyfonts.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "onlyfonts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "onlyfonts is a catalog of free, openly licensed fonts (SIL Open Font License, Apache License) that anyone may use in any project, served from cdn.onlyfonts.ai. search_fonts finds families by style, use, name or language; get_font tells about one family; get_font_css gives one stylesheet link that loads up to four families on a web page. Every answer links the family's page on onlyfonts.ai.",
      "tools": [
        {
          "name": "get_font",
          "title": "Get a font",
          "description": "Use this when the person asks about one font: its weights and styles, its license, the languages it covers, or what to pair it with. id is a family's id, its name in lowercase with hyphens (\"lora\", \"space-mono\"). Not for the CSS that loads a font on a page. Answers one family: its name, page link, category, designer, license, every style it has, the languages it fully covers, the families that pair with it and the ones that look like it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "a family id from search_fonts (\"lora\"), or its name",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "designer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "id": {
                "type": "string"
              },
              "languages": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "license": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "pairings": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "similar": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "styles": {
                "items": {
                  "properties": {
                    "italic": {
                      "type": "boolean"
                    },
                    "weight": {
                      "type": "integer"
                    }
                  },
                  "required": ["italic", "weight"],
                  "type": "object"
                },
                "type": "array"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "languages", "pairings", "similar", "styles", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a font"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1293dee2a2d749c9a7341467a7b0fe2770f0715382a2004080a6e646945f754b"
        },
        {
          "name": "get_font_css",
          "title": "Get font CSS",
          "description": "Use this when the person wants to use fonts on a web page, in an app or in a design tool that takes CSS. ids are 1 to 4 family ids, like \"lora\" or \"space-mono\". weights are 100 to 900; each family gets the ones it has, its regular and bold when left out. italic adds the italic of each weight a family has. Not for downloading font files to install on a computer. Answers one stylesheet link from cdn.onlyfonts.ai that loads every family asked for, the same as an @import line, and each family's font-family line with a fallback.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "description": "1 to 4 family ids",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "italic": {
                "type": "boolean"
              },
              "weights": {
                "items": {
                  "maximum": 900,
                  "minimum": 100,
                  "type": "integer"
                },
                "maxItems": 9,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "families": {
                "items": {
                  "properties": {
                    "family": {
                      "type": "string"
                    },
                    "font_family": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "italic": {
                      "type": "boolean"
                    },
                    "weights": {
                      "items": {
                        "type": "integer"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["family", "font_family", "id", "italic", "weights"],
                  "type": "object"
                },
                "type": "array"
              },
              "import": {
                "type": "string"
              },
              "link": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["families", "import", "link", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get font CSS"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0f4c85744c6c8c8a50819674e58de2a2c9dbee93e09800ad185ba7bc8031230"
        },
        {
          "name": "search_fonts",
          "title": "Search fonts",
          "description": "Use this when the person wants fonts for something: a style or mood, a use, a font by name, or a language to cover. For example \"a warm serif\", \"a playful display font for a poster\" or \"a monospace for code\". query is their words, at most 200 characters. category narrows to sans-serif, serif, monospace, display or handwriting. language keeps fonts that fully cover latin, latin-extended, ukrainian, greek, vietnamese, arabic, hebrew, thai, japanese, korean, chinese-simplified or devanagari. limit is 1 to 20, 8 when left out. Not for fonts installed on the person's computer, and not for paid fonts: the catalog holds free fonts only. Answers free, openly licensed font families from the onlyfonts catalog, best match first, each with its id, name, page link, category, designer and how many styles it has.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["sans-serif", "serif", "monospace", "display", "handwriting"],
                "type": "string"
              },
              "language": {
                "description": "only fonts that fully cover this language",
                "enum": ["latin", "latin-extended", "ukrainian", "greek", "vietnamese", "arabic", "hebrew", "thai", "japanese", "korean", "chinese-simplified", "devanagari"],
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "their words: a style, a mood, a use, a font's name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "designer": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "id": {
                      "type": "string"
                    },
                    "styles": {
                      "type": "integer"
                    },
                    "text": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "text", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search fonts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d59c062f80287c49681b3c9386d488011b406adf8cbb0db806aef59ab7decb77"
        }
      ],
      "digest": "sha256:d421a4a937cab729123901c2c51e8966866da641429ee1067ed3929548992b25"
    }
  }
}
