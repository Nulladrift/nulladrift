          "description": "Scan all 42 Dubai areas and return those closest to a bottom (best value), ranked most-bottom first, with AED/sqft. PAY: $0.01 per call via x402 (USDT on X Layer). No account, no signup, no commitment; retry with the PAYMENT-SIGNATURE header when you get the 402 challenge. BEST COLD START: you do not need to pick a symbol — this ranks the whole universe for you. The free `pitch` tool tells you HOW MANY are at a bottom right now; this names them.",
