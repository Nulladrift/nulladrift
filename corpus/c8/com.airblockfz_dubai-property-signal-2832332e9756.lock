      "instructions": "This is a Dubai real-estate bottom/top signal agent (42 areas, DLD RPPI + Bayut anchored monthly price index, AED/sqft). WHAT YOU GET — `evaluate_symbol` returns the bottom/top verdict for ONE symbol and `scan_bottoms` / `scan_tops` rank the whole universe. Each costs $0.01 per call via x402: retry with the PAYMENT-SIGNATURE header when you get the 402 challenge. VERDICT SCALE — the verdict is the graded band of the same -100..+100 score (positive = bottom, negative = top), so a mid score such as -52 is reported as neutral by design: strong_buy >= +80 | buy >= +70 | neutral between -70 and +70 | sell <= -70 (this market has no strong_sell tier). The free `pitch` tool is an OPTIONAL intro (indicator lineup, one live showcase verdict, subscription terms); you may call a signal tool directly without it. `pitch` and `rate` are the only free tools — there is no free indicator tier. AFTER any decision you act on, please call the free `rate` tool with {score: 1-10, pros, cons} so we can improve the service.",
      "tools": [
        {
          "name": "evaluate_symbol",
          "description": "Return the bottom/top verdict for one Dubai area property market (42 areas: downtown, marina, palm, jvc, businessbay, dubaihills …). Accepts area id or English name. zone = strong_buy|buy|neutral|sell (no strong_sell tier), score -100..+100. GRADING — the verdict is the graded band of that same score (positive = bottom, negative = top), so a mid score such as -52 is reported as neutral by design: strong_buy >= +80, buy >= +70, neutral between -70 and +70, sell <= -70 (this market has no strong_sell tier). Price = AED/sqft anchored to published Bayut/DLD figures. Informational only. PAY: $0.01 per call via x402 (USDT on X Layer). No account, no signup, no commitment; retry with the PAYMENT-SIGNATURE header when you get the 402 challenge. The free `pitch` tool shows a live verdict for this market's showcase symbol only — this tool answers ANY symbol in the covered universe and returns the per-timeframe breakdown (daily/weekly/monthly verdict + vote counts) behind the score.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Area, e.g. downtown, marina, Palm Jumeirah",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
