      "serverInfo": {
        "name": "contractorroster",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "count_contractors",
          "description": "Count contractors matching a state × trade × geo query, without charging. Use to qualify a query before calling search_contractors. Returns total count and estimated cost in cents at the caller's price tier.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "active_only": {
                "type": "boolean"
              },
              "geo_type": {
                "enum": ["zip", "city"],
                "type": "string"
              },
              "geo_value": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "enum": ["CO", "TX", "WA", "OR", "CA", "FL", "VA", "MN", "OH", "AZ", "IL", "NY", "PA", "NV", "UT", "MA", "CT", "LA", "OK", "AL", "AR", "WV", "NE", "ID", "AK", "IA", "ME", "TN", "MS", "MT", "HI", "DE", "VT", "DC"],
                "type": "string"
              },
              "trade": {
                "enum": ["EC", "PC", "HVAC", "GC", "ROOFING", "SOLAR", "LANDSCAPE", "POOL", "FIRE_PROTECTION", "CARPENTRY", "CONCRETE", "MASONRY", "DRYWALL", "TILE", "EXCAVATING", "PAINTING", "FLOORING"],
                "type": "string"
              }
            },
            "required": ["geo_type", "geo_value", "state", "trade"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:af181e31b67ef051e532d35b30e512db7347873a4f5a0938e20596185b663bcb"
        },
        {
          "name": "get_usage",
          "description": "Return the partner's current balance, pricing, and the 20 most recent transactions (top-ups + api calls). No charge.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2d33d2aca95e97c0ab97a146b8270a37a41b9327290bb4b4dbfe1c571aeb8acd"
        },
        {
          "name": "list_states",
          "description": "List supported US states with their available geo types and per-trade availability. Free; no auth required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c7c5d49977f3a106e842a43017555b956d6c1f698456e955da3586061e3ea6a6"
        },
        {
          "name": "list_trades",
          "description": "List supported trade codes with display names. Free; no auth required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
