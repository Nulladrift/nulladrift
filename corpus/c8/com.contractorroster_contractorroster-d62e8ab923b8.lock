{
  "lockfileVersion": 2,
  "subjects": {
    "com.contractorroster/contractorroster": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://contractorroster.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "contractorroster",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "count_contractors",
          "description": "Count contractors matching a state × trade × geo query, without charging. Use to qualify a query before calling search_contractors. Returns total count and estimated cost in cents at the caller's price tier.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "active_only": {
                "type": "boolean"
              },
              "geo_type": {
                "enum": ["zip", "city"],
                "type": "string"
              },
              "geo_value": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "enum": ["CO", "TX", "WA", "OR", "CA", "FL", "VA", "MN", "OH", "AZ", "IL", "NY", "PA", "NV", "UT", "MA", "CT", "LA", "OK", "AL", "AR", "WV", "NE", "ID", "AK", "IA", "ME", "TN", "MS", "MT", "HI", "DE", "VT", "DC"],
                "type": "string"
              },
              "trade": {
                "enum": ["EC", "PC", "HVAC", "GC", "ROOFING", "SOLAR", "LANDSCAPE", "POOL", "FIRE_PROTECTION", "CARPENTRY", "CONCRETE", "MASONRY", "DRYWALL", "TILE", "EXCAVATING", "PAINTING", "FLOORING"],
                "type": "string"
              }
            },
            "required": ["geo_type", "geo_value", "state", "trade"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:205adc223e201fb397df3a9911216d58fecea3ffbdbc5becef1122fd78b20e00"
        },
        {
          "name": "get_usage",
          "description": "Return the partner's current balance, pricing, and the 20 most recent transactions (top-ups + api calls). No charge.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:020f15dcf6c93345e38af57782ff5e7f66f84e09640204e8642ec1bf1b28cab3"
        },
        {
          "name": "list_states",
          "description": "List supported US states with their available geo types and per-trade availability. Free; no auth required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:02d7a2982478c9d63fbd9caad8e5d209e34ffe2d77cd27b0f58ab74bf778ed6d"
        },
        {
          "name": "list_trades",
          "description": "List supported trade codes with display names. Free; no auth required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c44efdc5095fc77e76c5c491058027c9d6e15db118ba32ab1db0c06e7fe28be"
        },
        {
          "name": "search_contractors",
          "description": "Fetch enriched contractor records for a state × trade × geo query. Charges the partner balance at price_per_record_cents × records_delivered. Set dry_run:true for a free cost preview. Returns structured shortfall info on insufficient balance so the agent can prompt the user to top up.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "active_only": {
                "type": "boolean"
              },
              "dry_run": {
                "type": "boolean"
              },
              "geo_type": {
                "enum": ["zip", "city"],
                "type": "string"
              },
              "geo_value": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "enum": ["CO", "TX", "WA", "OR", "CA", "FL", "VA", "MN", "OH", "AZ", "IL", "NY", "PA", "NV", "UT", "MA", "CT", "LA", "OK", "AL", "AR", "WV", "NE", "ID", "AK", "IA", "ME", "TN", "MS", "MT", "HI", "DE", "VT", "DC"],
                "type": "string"
              },
              "trade": {
                "enum": ["EC", "PC", "HVAC", "GC", "ROOFING", "SOLAR", "LANDSCAPE", "POOL", "FIRE_PROTECTION", "CARPENTRY", "CONCRETE", "MASONRY", "DRYWALL", "TILE", "EXCAVATING", "PAINTING", "FLOORING"],
                "type": "string"
              }
            },
            "required": ["geo_type", "geo_value", "state", "trade"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cebefaa8708d102659abf87f9128651f13bedb4ce5b79a403ca8725550a84662"
        }
      ],
      "digest": "sha256:2077304010d7ad1c2e09216e3bedf49fd3a386f60afea4c5dc1d45abc9ae0136"
    }
  }
}
