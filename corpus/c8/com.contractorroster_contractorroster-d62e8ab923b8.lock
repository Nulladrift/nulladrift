  "subjects": {
    "com.contractorroster/contractorroster": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://contractorroster.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
