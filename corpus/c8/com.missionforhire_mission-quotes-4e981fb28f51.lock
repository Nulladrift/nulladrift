      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.missionforhire/mission-quotes",
        "title": "Mission for HIRE",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Price a proxy-presence mission: one real person goes to a named city, carries out one mission, and sends proof. quote_mission needs both a mission slug and a city. Prices are indicative floors, not offers - flights, lodging and local transport are client-funded on top, and the operator confirms the exact figure on acceptance. Booking is WhatsApp only: https://wa.me/639566225915",
      "tools": [
        {
          "name": "city_missions",
          "description": "Every mission priced for one city, side by side, so the user can compare what is possible there.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug or plain name",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7cc5717d7d1fdc2c76a0b9e836a673e31ef55e39fd203fd107741629771cf834"
        },
        {
          "name": "list_cities",
          "description": "Which cities are already priced, with distance from the current operator base and travel band. Call this when the user names a city you cannot match, to pick the nearest listed anchor.",
          "inputSchema": {
            "properties": {
              "region": {
                "description": "Optional region filter",
                "enum": ["EU", "AF", "AS", "NA", "SA", "OC"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0959da04cc5f4f868950f8feb557f0b617e57dece09ef576a825aeab4436c6d9"
        },
        {
          "name": "list_missions",
          "description": "Which kinds of mission will a person on the ground actually carry out, and what proof does each one return? Call this when the user's request is free text and you need to map it to a mission slug.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eda8fb8d655d4fc10f7b794dfa0c4b1ab490536e00c37eab6135b18371af164b"
        },
        {
          "name": "quote_mission",
          "description": "What does it cost to send one real person to a named city to carry out one mission and bring back proof? Returns the indicative from-price in EUR, billable days, travel band, distance and proof format. Both mission and city are required; neither alone produces a valid answer. Do not estimate this yourself.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug or plain name, e.g. manila or Manila",
                "type": "string"
              },
              "mission": {
                "description": "Mission slug, e.g. grave-visit",
                "enum": ["grave-visit", "property-check", "document-pickup", "welfare-visit", "hand-delivery", "attend-event", "place-flowers", "queue-stand", "property-viewing", "vehicle-inspection", "personal-shopper", "grocery-run"],
                "type": "string"
              }
            },
            "required": ["city", "mission"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4fddd9992b66001e2b792c561564f3e920fd274055c2b299dba5a91ed8f3b0a4"
        }
      ],
