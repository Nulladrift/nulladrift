        {
          "name": "price_check",
          "description": "Check whether a price for a collectible is FAIR / OVER / SCALPED vs the current retail median across the shops we poll. Returns the retail min/max/median, the number of shops carrying it, the price multiple, and a verdict. Use this to decide if a listing is overpriced before buying. niche must be one of: tcg (Pokémon & TCG), lego (LEGO sets), funko (Funko Pop), keebs (Mechanical keyboards), vinyl (Vinyl records), aqua (Aquarium livestock).",
          "inputSchema": {
            "properties": {
              "niche": {
                "description": "Niche key, e.g. 'tcg', 'lego', 'funko', 'keebs', 'vinyl', 'aqua'.",
                "type": "string"
              },
              "price": {
                "description": "Optional: the price you are seeing. If given, the verdict compares against it.",
                "type": "number"
              },
              "query": {
                "description": "Product name to look up, e.g. 'Charizard V' or 'LEGO 10307'.",
                "type": "string"
              }
            },
            "required": ["niche", "query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
