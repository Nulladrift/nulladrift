        {
          "name": "check_circuit",
          "title": "Check a circuit",
          "description": "Checks whether a circuit is wired correctly: loose ends, parts with no power source, an LED with the wrong diode model, unknown parts, labels on top of parts. With \"request\", also checks that the parts asked for are there (a bulb, an ammeter, a voltmeter, a switch). Use this when the person has a circuit and asks \"is my wiring right?\", \"did I connect this correctly?\" or \"is anything missing?\". Checks structure only, not voltages or currents. Takes a CircuitJS (falstad) circuit or a breadboardhub.com/sim link. Returns the problems found, the parts list and a link that opens the circuit running live in the browser. Free and instant, with no daily limit.",
          "inputSchema": {
            "properties": {
              "circuit": {
                "description": "The circuit: CircuitJS (falstad.com/circuit) text, a \"$\" options line then one part per line such as \"r 176 112 304 112 0 220\" for a 220 ohm resistor (at most 20,000 characters), or a breadboardhub.com/sim link that carries one.",
                "type": "string"
              },
              "request": {
                "description": "Optional: what the circuit is meant to be, in plain words, such as \"a 9V battery, a switch and a bulb with an ammeter\" (at most 1,000 characters).",
                "type": "string"
              }
            },
            "required": ["circuit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a circuit"
          },
          "behavior": {
            "destructive": false,
