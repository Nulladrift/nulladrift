        {
          "name": "debug_circuit",
          "title": "Debug a real circuit",
          "description": "Finds why a circuit someone built does not work. Use this when the person says \"why won't my LED light?\", \"my 555 does not blink\", \"the motor does not turn\" or \"I built this and nothing happens\". Takes the symptom and either the circuit or a description of what was built, which it draws as built. Simulates that and a proposed fix, and says if the simulator confirms the fix or the circuit as drawn works (so the fault is on the board). Returns the likely causes, its reading of a described circuit, live links to both circuits, checks to make on the board and the readings a working circuit gives. Takes up to 3 minutes. Counts toward the daily design limit.",
          "inputSchema": {
            "properties": {
              "circuit": {
                "description": "The circuit: CircuitJS (falstad.com/circuit) text, a \"$\" options line then one part per line such as \"r 176 112 304 112 0 220\" for a 220 ohm resistor (at most 20,000 characters), or a breadboardhub.com/sim link that carries one.",
                "type": "string"
              },
              "description": {
                "description": "What was built, drawn as built with any mistakes: the parts, their values and what connects to what, including which way round parts are, such as \"9V battery + to a 470 ohm resistor, then the LED long leg, short leg to battery -\" (up to 3,000 characters). Needed when no circuit is given.",
                "type": "string"
              },
              "symptom": {
                "description": "What goes wrong, what was expected, and anything measured, such as \"the LED does not light; the battery reads 9V\" (3 to 1,000 characters).",
                "type": "string"
              }
            },
            "required": ["symptom"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Debug a real circuit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:00ce88d0cf39cce23dadca747a713f42e4d759f854c704cfee1584e51efd7f12"
        },
        {
          "name": "design_chip",
          "title": "Design a digital chip in Verilog",
          "description": "Designs digital logic in Verilog from a plain description, such as a 4-bit counter, a traffic light state machine or a logic circuit for an FPGA. Use this when the person asks \"write a Verilog counter\", \"design a state machine for my FPGA\" or \"make a 7-segment decoder\". Writes the module and a step-by-step test, builds it with Yosys and runs the test on the built circuit, correcting it up to twice. \"verified\" means it built clean and every test step passed; the AI wrote the test too, so it is returned for checking. Returns the code, the test and a link that opens the design with its diagram and waveforms. Takes up to 4 minutes. Counts toward the daily design limit.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "The digital circuit wanted, in plain words, such as \"a 4-bit counter with enable and synchronous reset\" (3 to 1,000 characters).",
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Design a digital chip in Verilog"
