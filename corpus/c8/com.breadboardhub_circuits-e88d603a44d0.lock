        {
          "name": "simulate_circuit",
          "title": "Simulate a circuit",
          "description": "Runs a CircuitJS circuit in a real circuit simulator until it settles and returns the voltage across and current through each part, plus faults found: a short circuit, nothing flowing, an LED over its current rating, a bulb too dim to light. Takes 10 to 30 seconds. Limited per day; an API token raises the limit.",
          "inputSchema": {
