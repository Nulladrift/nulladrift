                "description": "The problem's id, such as \"gray-code-converter\".",
                "type": "string"
              },
              "test": {
                "description": "Find-the-bug problems: the test, as { \"clock\": \"clk\", \"steps\": [{ \"set\": { \"rst\": 1 }, \"tick\": 1, \"expect\": { \"count\": 0 } }] }. \"set\" drives inputs, \"tick\" applies clock edges, \"expect\" checks outputs; leave \"clock\" out for a design without one.",
                "type": "object"
              },
              "verilog": {
                "description": "Design problems: the Verilog source, with the module name and ports the problem gives (at most 20,000 characters).",
