        {
          "name": "debug_circuit",
          "title": "Debug a real circuit",
          "description": "Finds why a circuit someone built does not work, such as an LED that stays off or a 555 that does not blink on a breadboard. Takes the symptom and either the circuit or a description of what was built, which it draws as built. Simulates that and a proposed fix, and says if the simulator confirms the fix or the circuit as drawn works (so the fault is on the board). Returns the likely causes, its reading of a described circuit, live links to both circuits, checks to make on the board and the readings a working circuit gives. Takes up to 3 minutes. Counts toward the daily design limit.",
          "inputSchema": {
            "properties": {
              "circuit": {
                "description": "The circuit: CircuitJS (falstad.com/circuit) text, a \"$\" options line then one part per line such as \"r 176 112 304 112 0 220\" for a 220 ohm resistor (at most 20,000 characters), or a breadboardhub.com/sim link that carries one.",
                "type": "string"
              },
              "description": {
                "description": "What was built, drawn as built with any mistakes: the parts, their values and what connects to what, including which way round parts are, such as \"9V battery + to a 470 ohm resistor, then the LED long leg, short leg to battery -\" (up to 3,000 characters). Needed when no circuit is given.",
                "type": "string"
              },
              "symptom": {
                "description": "What goes wrong, what was expected, and anything measured, such as \"the LED does not light; the battery reads 9V\" (3 to 1,000 characters).",
                "type": "string"
              }
            },
            "required": ["symptom"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Debug a real circuit"
