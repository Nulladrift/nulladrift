        {
          "name": "sweep_circuit",
          "title": "Sweep a circuit across values",
          "description": "Runs a circuit across a range of values for one part, such as a supply from 5V to 12V or a resistor from 100 to 10k ohms, and returns the simulator's readings at each value. With \"measure\", also reports how one reading changes across the range: its lowest and highest value and the spread. Suits checking how a circuit holds up as a battery sags, or finding the part value that hits a target. Runs CircuitJS on a CircuitJS circuit or a breadboardhub.com/sim link. Up to 12 values without signing in, 25 signed in. Counts toward the daily simulation limit, one per 5 values.",
          "inputSchema": {
            "properties": {
              "circuit": {
                "description": "The circuit: CircuitJS (falstad.com/circuit) text, a \"$\" options line then one part per line such as \"r 176 112 304 112 0 220\" for a 220 ohm resistor (at most 20,000 characters), or a breadboardhub.com/sim link that carries one.",
                "type": "string"
              },
              "measure": {
                "description": "Optional: one reading to summarise across the sweep, such as { \"part\": { \"kind\": \"led\", \"index\": 0 }, \"quantity\": \"current\" }. Kinds as the readings name them: \"voltage\", \"resistor\", \"led\", \"diode\", \"transistor\", \"capacitor\", \"ammeter\", \"voltmeter\", \"lamp\" and so on.",
                "properties": {
                  "part": {
                    "description": "A part by kind and zero-based index among the parts of that kind, in the order of the circuit text, such as { \"kind\": \"resistor\", \"index\": 1 } for the second resistor.",
                    "properties": {
                      "index": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "kind": {
                        "type": "string"
                      }
                    },
                    "required": ["index", "kind"],
                    "type": "object"
                  },
                  "quantity": {
                    "description": "\"current\" through the part (amps) or \"voltage\" across it (volts). Default \"current\".",
                    "enum": ["current", "voltage"],
                    "type": "string"
                  }
                },
                "required": ["part"],
                "type": "object"
              },
              "sweep": {
                "description": "The part to change and its values. A part is addressed by kind and index: index 0 is the first part of that kind in the circuit text. Kinds that can be swept: \"voltage\" (a DC voltage source, volts, under 24 V) and \"resistor\" (ohms, above 0).",
                "properties": {
                  "part": {
                    "description": "A part by kind and zero-based index among the parts of that kind, in the order of the circuit text, such as { \"kind\": \"resistor\", \"index\": 1 } for the second resistor.",
                    "properties": {
                      "index": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "kind": {
                        "type": "string"
                      }
                    },
                    "required": ["index", "kind"],
                    "type": "object"
                  },
                  "values": {
                    "description": "Either a range, { \"from\": 5, \"to\": 12, \"steps\": 8, \"scale\": \"linear\" } (steps counts the values, both ends included; scale \"linear\" or \"log\"), or a list, { \"list\": [5, 9, 12] }. Values may be numbers or strings with SI prefixes such as \"4.7k\".",
                    "properties": {
                      "from": {
                        "type": ["number", "string"]
                      },
                      "list": {
                        "items": {
                          "type": ["number", "string"]
                        },
                        "type": "array"
                      },
                      "scale": {
                        "enum": ["linear", "log"],
                        "type": "string"
                      },
                      "steps": {
                        "minimum": 2,
                        "type": "integer"
                      },
                      "to": {
                        "type": ["number", "string"]
                      }
                    },
                    "type": "object"
                  }
                },
                "required": ["part", "values"],
                "type": "object"
              }
            },
            "required": ["circuit", "sweep"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sweep a circuit across values"
          },
