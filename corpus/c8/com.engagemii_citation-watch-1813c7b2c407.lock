        {
          "name": "data_quote",
          "title": "Quote a list of companies",
          "description": "Quote a list of companies: how many match, what the file costs, and a link that opens the order with the same list filled in. For a list in any words (wedding photographers in Austin, vegan bakeries, Shopify stores selling candles) pass words, with state and city apart: the count is exact and instant. For a whole industry pass industry alone. The same count and price the Engagemii order page and checkout use. Free, read only, no key: nothing is bought here. industry is one of: Technology, E-commerce, Food & Beverage, Health & Wellness, Healthcare, Beauty & Personal Care, Fashion & Apparel, Finance & Insurance, Legal, Real Estate, Travel & Hospitality, Education, Media & Entertainment, Home & Living, Pet Care, Automotive, Sports & Recreation, Professional Services, Nonprofits, Government & Public Sector, Membership Organizations, Manufacturing & Industrial, Other. kind narrows an industry to one kind of business and needs an industry; a US state makes it faster. score_band is low (0 to 3), medium (4 to 7) or high (8 to 10). scope is us (default) or all (worldwide). Without count the price is for every matching company; with count it is for that many.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "With words: a city name.",
                "type": "string"
              },
              "count": {
                "description": "Only when a number of companies is wanted. Leave it out to price every matching company.",
                "type": "number"
              },
              "country": {
                "description": "With words: a country other than the United States, for example Germany. scope all searches every country.",
                "type": "string"
              },
              "industry": {
                "description": "Business category.",
                "enum": ["Technology", "E-commerce", "Food & Beverage", "Health & Wellness", "Healthcare", "Beauty & Personal Care", "Fashion & Apparel", "Finance & Insurance", "Legal", "Real Estate", "Travel & Hospitality", "Education", "Media & Entertainment", "Home & Living", "Pet Care", "Automotive", "Sports & Recreation", "Professional Services", "Nonprofits", "Government & Public Sector", "Membership Organizations", "Manufacturing & Industrial", "Other"],
                "type": "string"
              },
              "kind": {
                "description": "Optional kind of business inside the industry, matched by words in the company name, website address or page title.",
                "enum": ["dentists", "chiropractors", "physical-therapists", "veterinarians", "pharmacies", "med-spas", "law-firms", "accountants", "insurance-agencies", "real-estate-agents", "mortgage-lenders", "plumbers", "electricians", "hvac", "roofers", "landscapers", "cleaning-services", "pest-control", "contractors", "movers", "auto-repair", "car-dealers", "restaurants", "bakeries", "coffee-shops", "breweries", "hotels", "salons", "gyms", "photographers", "funeral-homes", "churches", "child-care"],
                "type": "string"
              },
              "label": {
                "description": "With words: the list in plain words, shown on the order page, for example Wedding photographers in Austin.",
                "type": "string"
              },
              "min_employees": {
                "description": "With words: lowest number of employees. Few companies publish their size.",
                "type": "number"
              },
              "platform": {
                "description": "With words: a website platform, for example shopify or wordpress.",
                "type": "string"
              },
              "scope": {
                "description": "us (default) or all (worldwide).",
                "enum": ["us", "all"],
                "type": "string"
              },
              "score_band": {
                "description": "AI visibility band.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "state": {
                "description": "US state name or two-letter code.",
                "type": "string"
              },
              "terms": {
                "description": "The steadier way to describe the companies: groups of plain words. Every group must match, any word in a group may match: [[\"roofer\"]] for roofers, [[\"wedding\"], [\"photographer\"]] for wedding photographers. No plurals, no words like company or contractor: the search adds word forms itself, so the same list always gets the same count. Use terms instead of words.",
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "words": {
                "description": "Any words for the companies wanted. Every word must match what the company says about itself (name, website address, page title, description, headings); a | b is either; quotes make a phrase. Example: wedding (photographer | photography). For a trade write the trade word alone with its other forms, for example (roofer | roofing), without words such as contractor, company or service. With words the answer is instant for any kind of business; kind is then not needed.",
                "type": "string"
              }
            },
            "type": "object"
          },
