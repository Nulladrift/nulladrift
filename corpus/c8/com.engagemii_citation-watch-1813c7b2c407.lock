                      "type": "number"
                    },
                    "others_scoring_6_plus": {
                      "type": "number"
                    },
                    "question": {
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "checks_in_window": {
                "type": "number"
              },
              "engines": {
