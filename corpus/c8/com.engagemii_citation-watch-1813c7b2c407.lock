          "description": "Get the Engagemii AEO score (0-10) for any company domain, with the six on-page and six off-page signals each rated Weak, Fair, Good or Strong, and the llms.txt audit verdict. Drawn from the Engagemii Index of more than 82 million companies. Free, no auth.",
          "inputSchema": {
