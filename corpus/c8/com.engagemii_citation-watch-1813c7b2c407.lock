        {
          "name": "data_records",
          "title": "Pull licensed company records",
          "description": "Pull full licensed records from the Engagemii dataset (the same 113 columns as a purchased file, in the same order, fingerprinted; every column is filled where we hold the data, the same as in a data file). Metered: every record returned uses one unit of the account's purchased API quota, public companies included; the response states unitsPerRow and unitsSpent. Asking for public companies only (publicCompanies \"only\") costs 10 units a record and runs only with acceptUnitsPerRow 10; without it the tool answers with the cost and charges nothing. Page with offset: pass the nextOffset of the previous answer until hasMore is false. A filter value that is not recognised is refused with the allowed values and nothing is charged. Returns 25 records by default and at most 100 per call. Larger pulls are available through the REST API at https://api.engagemii.com/api/v1/data/records with the same key. Any returned record whose score is more than 30 days old is queued for a fresh rescore. Requires an Engagemii data API key.",
          "inputSchema": {
            "properties": {
              "acceptUnitsPerRow": {
                "description": "confirm the public rate (10) for publicCompanies \"only\"",
                "type": "number"
              },
              "api_key": {
                "description": "Your Engagemii data API key (edk_...). Only needed when the key is not already sent as a request header.",
                "type": "string"
              },
              "countries": {
                "description": "Country names or ISO codes (worldwide rows)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "employeesMax": {
                "description": "Most staff, e.g. 5000. Only companies whose size is published are returned.",
                "type": "number"
              },
              "employeesMin": {
                "description": "Fewest staff, e.g. 1001. Only companies whose size is published (own site, SEC, Wikidata) are returned.",
                "type": "number"
              },
              "industries": {
                "description": "Categories, any case: Technology, Healthcare, Real Estate, ...",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "records to draw, 1 unit each. Default 25, max 100 in-chat.",
                "type": "number"
              },
              "offset": {
                "description": "0 for the first page, then the previous answer's nextOffset",
                "type": "number"
              },
              "publicCompanies": {
                "description": "public companies only, 10 units a record",
                "enum": ["only"],
                "type": "string"
              },
              "scope": {
                "description": "us = verified US companies; all = worldwide",
                "enum": ["us", "all"],
                "type": "string"
              },
              "scoreMax": {
                "description": "Highest AI visibility score to include, 0 to 10",
                "type": "number"
              },
              "scoreMin": {
                "description": "Lowest AI visibility score to include, 0 to 10",
                "type": "number"
              },
              "sizeBands": {
                "description": "Staff bands instead of a range, e.g. [\"1001-5000\"]",
                "items": {
                  "enum": ["1-10", "11-50", "51-200", "201-500", "501-1000", "1001-5000", "5001-10000", "10001+"],
                  "type": "string"
                },
                "type": "array"
              },
              "states": {
                "description": "US states by name or code",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "apiQuotaRemaining": {
                "type": "number"
              },
              "count": {
                "type": "number"
              },
              "hasMore": {
                "type": "boolean"
              },
              "message": {
                "type": "string"
              },
              "nextOffset": {
                "type": "number"
              },
              "publicRecords": {
                "type": "number"
              },
              "rateClass": {
                "type": "string"
              },
              "recordCheck": {
                "type": "object"
              },
              "records": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "standardRecords": {
                "type": "number"
              },
              "unitsPerRow": {
                "type": "number"
              },
              "unitsSpent": {
                "type": "number"
              }
            },
            "type": "object"
          },
