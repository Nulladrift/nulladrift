        {
          "name": "citation_watch",
          "title": "See which brands AI is recommending",
          "description": "Which brands AI assistants name right now. Every 30 minutes from 6am to 11pm ET, Engagemii puts a real question that names no brand to ChatGPT, Meta AI and Gemini with live web search and records the first brand each names, alongside that brand's standing AI visibility score (computed before the question was asked). Most checks ask about what is trending on Google (kind trending); about 1 in 4 is a buying question in a business category (kind buying). Returns checks from the last 48 hours, newest first, each naming its engine. Filter by business category (for example Technology or Legal), by words in the question (topic, for example crm), by engine or by kind. Free, no auth.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Business category, case-insensitive substring, e.g. Legal, Technology, Finance & Insurance, Trending. Not a topic: use topic for words in the question.",
                "type": "string"
              },
              "engine": {
                "description": "Only checks put to this engine.",
                "enum": ["ChatGPT", "Meta AI", "Gemini"],
                "type": "string"
              },
              "kind": {
                "description": "buying: a fixed buying question by category; trending: a question about what is trending on Google.",
                "enum": ["buying", "trending"],
                "type": "string"
              },
              "limit": {
                "description": "How many checks to return, 1 to 50. Default 20.",
                "type": "number"
              },
              "topic": {
                "description": "Words that must appear in the question, case-insensitive, e.g. crm or help desk.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cadence": {
                "type": "string"
              },
              "categories_available": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "checks": {
                "items": {
                  "properties": {
                    "ai_visibility_score": {
                      "type": ["number", "null"]
                    },
