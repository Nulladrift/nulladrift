      "instructions": "Engagemii measures how visible a company is to AI answer engines such as ChatGPT, Claude, Gemini, Perplexity and Meta AI, across an index of more than 81 million companies.\nFree tools with no sign-in: aeo_score (the stored 0-10 score with its on-page and off-page breakdown), aeo_audit (a live audit of a site with fixes), brand_profile, company_verify (a company's facts with their sources and dates, and match, differs or not known for values you pass), dataset_sample, citation_watch (brands AI is recommending) and ai_readstream (which AI engines are reading company pages).\nOrdering a list: data_quote turns filters (industry, kind of business, state) into the matching count, the price and a link that opens the order with that list filled in; nothing is bought by the tool.\nRequests to a company: company_request passes a quote, booking, question or vendor check to a company in the index with the requester's reply-to email (used only on that one email); company_request_status gives its status.\nTools that use the site owner's email: free_kit (a fix kit written for the owner's site, sent by email after the owner confirms the address) and connect_tracker (free AI-crawler monitoring; the tracker key is emailed to the site's verified owner).\nTools for the company dataset: data_signup creates a free data account; search_companies and data_records use an Engagemii data API key, issued at https://engagemii.com/aeo/data. Free lookups: a data account gets 20, one time; an agency account gets 1 as a sample, then 2 a month while the Agency plan is paid; a brand account has no lookups (it sees its own brand only). More at https://engagemii.com/aeo/data/api.\nScores, rankings, connections and company data are automated estimates, provided as is and not investment advice. Terms: https://engagemii.com/terms. Data license: https://engagemii.com/aeo/data/license.\nREST Data API: base https://api.engagemii.com/api/v1/data, key in the X-Engagemii-Data-Key header, 1 unit = 1 company record (free: 20 one time on a data account, 1 on an agency account then 2 a month on the paid Agency plan, none on a brand account; then 5c a unit in the 5,000-unit top-up, $250).\nGET /info | cost 0 | 60 requests a minute per key\nGET /lookup?domain= | 1 unit per record returned, 0 when nothing is returned | 60 requests a minute per key; 30 scans of new websites per hour per key\nPOST /records | 1 unit per record returned; publicCompanies \"only\" 10 units per record, confirmed with acceptUnitsPerRow | limit 1 to 5,000 per call (default 1,000); 60 requests a minute per key\nGET /orders | cost 0 | 60 requests a minute per key\nLists and files: 10c a company, 5c from 5,000. Minimum order: 500 companies and $40.\nOpenAPI: https://engagemii.com/openapi/data-api.json. Docs: https://engagemii.com/aeo/data/api. Data dictionary: https://engagemii.com/aeo/data/dictionary.",
