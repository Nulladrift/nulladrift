      },
      "instructions": "Engagemii measures how visible a company is to AI answer engines such as ChatGPT, Claude, Gemini, Perplexity and Meta AI, across an index of more than 82 million companies.\nFree tools with no sign-in: aeo_score (the stored 0-10 score with its on-page and off-page breakdown), aeo_audit (a live audit of a site with fixes), brand_profile, dataset_sample, citation_watch (brands AI is recommending) and ai_readstream (which AI engines are reading company pages).\nTools that use the site owner's email: free_kit (a fix kit written for the owner's site, sent by email after the owner confirms the address) and connect_tracker (free AI-crawler monitoring with an install snippet).\nTools for the company dataset: data_signup creates a free data account; search_companies and data_records use an Engagemii data API key, issued at https://engagemii.com/aeo/data. Every verified key includes 20 free company lookups a month; more at https://engagemii.com/aeo/data/api.\nScores, rankings, connections and company data are automated estimates, provided as is and not investment advice. Terms: https://engagemii.com/terms. Data license: https://engagemii.com/aeo/data/license.",
      "tools": [
        {
          "name": "aeo_audit",
          "title": "Run a live AI visibility audit",
          "description": "Run a LIVE AEO audit of a site right now: fresh fetch of the homepage, robots.txt, sitemap, llms.txt, and about page, scored on the six on-page categories with concrete recommendations. Differs from aeo_score, which returns the stored score from the index; that score updates when Engagemii next reads the site. Free, no auth, up to 5 live audits per hour.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Company domain or URL, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Run a live AI visibility audit"
          },
          "behavior": {
