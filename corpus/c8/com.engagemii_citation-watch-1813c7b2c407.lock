        {
          "name": "free_kit",
          "title": "Request the free fix kit",
          "description": "Request the FREE Customized Fix Kit for a domain. There is one kit and it is the free Customized Fix Kit: ready-to-install fix files written from your own site, plus a PDF audit. Flow: pass the owner's email; Engagemii emails a verification link; after the owner clicks it the kit is built and the download link is emailed automatically. Kits are queued, so delivery is by email rather than in-chat. One kit per domain; repeat requests resend the stored kit.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The site, e.g. example.com",
                "type": "string"
              },
              "email": {
                "description": "The site owner's email (the verification link and the kit go there)",
                "type": "string"
              },
              "owner_confirmed": {
