        {
          "name": "data_records",
          "title": "Pull licensed company records",
          "description": "Pull full licensed records from the Engagemii dataset (the same 113 columns as a purchased file, in the same order, fingerprinted; add-on cells are empty here; they are filled in data files that buy the add-on and in the free Databricks Marketplace sample, where we hold the data). Metered: every record returned uses one unit of the account's purchased API quota. Returns 25 records by default and at most 100 per call. Larger pulls are available through the REST API at https://api.engagemii.com/api/v1/data/records with the same key. Any returned record whose score is more than 30 days old is queued for a fresh rescore. Requires an Engagemii data API key.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Your Engagemii data API key (edk_...). Only needed when the key is not already sent as a request header.",
                "type": "string"
              },
              "industries": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "records to draw (each costs 1 quota). Default 25, max 100 in-chat.",
                "type": "number"
              },
              "scope": {
                "enum": ["us", "all"],
                "type": "string"
              },
              "scoreMax": {
                "type": "number"
              },
              "scoreMin": {
                "type": "number"
              },
              "states": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Pull licensed company records"
