        {
          "name": "ai_readstream",
          "title": "See which AI engines are reading company pages",
          "description": "Which AI engines are reading the business web right now. Server-side, IP-verified crawler logs across one of the largest networks of business pages online. Returns per-engine reads over the last ten minutes, the last 24 hours and all time, plus a daily series. Free, no auth. Answers questions such as which AI crawler is most active, how two engines compare, and whether AI reading is rising.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How many days of the daily series to return, 0 to 30. Default 7.",
                "type": "number"
