        {
          "name": "citation_watch",
          "title": "See which brands AI is recommending",
          "description": "What ChatGPT is recommending right now. Every 30 minutes Engagemii puts a real, non-branded buyer question to ChatGPT with live web search and records which brands it names, alongside each brand's standing AI visibility score (computed before the question was asked). Returns the last 48 hours. Free, no auth. Answers questions such as which brands AI recommends in a category, and whether an AI visibility score relates to being recommended.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional filter, e.g. Legal, Finance & Insurance, Fashion & Apparel. Case-insensitive substring match.",
                "type": "string"
              },
              "limit": {
                "description": "How many checks to return, 1 to 50. Default 20.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "See which brands AI is recommending"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f02185fddfae5b092f0f63392bcde1a073ad4f4fff845af40b8d4ab935b68ae5"
        },
        {
          "name": "connect_tracker",
          "title": "Set up AI crawler monitoring",
          "description": "Set up free Engagemii AI-crawler monitoring for a site, entirely from here. It provisions the owner's free account and tracker key and returns a small install snippet (Node/Express, Next.js, PHP, or Cloudflare Worker) with the key already in it. Once the snippet for the site's stack is installed, AI-bot visits start reporting, and the owner sees them per bot and per day at the dashboard link. Requires the owner's email. Terms of the free service: Engagemii licenses the AI-crawler activity data the tracker collects, in aggregated form and, unless the owner opts out in portal settings, identified by their domain. The tracker records bot visits only, never human visitors.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The site, e.g. example.com",
                "type": "string"
              },
              "email": {
                "description": "The site owner's email (required)",
                "type": "string"
              },
              "platform": {
                "description": "The site's stack, if known. Omit to get all four snippets.",
                "enum": ["node", "nextjs", "php", "cloudflare"],
                "type": "string"
              }
            },
            "required": ["domain", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Set up AI crawler monitoring"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c1e424eb37d0a5fc7b1035f04f775d970c85560c138686daf6a7e1ebdde27969"
        },
