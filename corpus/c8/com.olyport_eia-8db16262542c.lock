            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:15837868f9cddbe3435359c4bdf6752330e788cc4a619d85cba7c35f3c0b13b5"
        },
        {
          "name": "get_petroleum_data",
          "description": "Get petroleum and oil price or production data from the EIA.\n\n    Returns time series data for petroleum products including crude oil prices,\n    production volumes, imports, exports, and refinery operations.\n\n    Args:\n        series: EIA series ID for the petroleum data. Common series:\n                'PET.RWTC.D' (WTI crude oil daily price),\n                'PET.RBRTE.D' (Brent crude oil daily price),\n                'PET.EMM_EPMR_PTE_NUS_DPG.W' (US regular gasoline weekly price),\n                'PET.MCRFPUS2.M' (US crude oil production monthly).\n                Default is 'PET.RWTC.D'.\n        limit: Maximum number of records to return (default 100, max 5000).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 100,
                "title": "Limit",
                "type": "integer"
              },
              "series": {
                "default": "PET.RWTC.D",
                "title": "Series",
                "type": "string"
              }
            },
            "title": "get_petroleum_dataArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_petroleum_dataOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9742764d979e191290acfd889e4fbcbd8d26a1dab8cc050690c9cb4386359d88"
        },
        {
          "name": "get_state_energy_profile",
          "description": "Get a comprehensive energy profile for a US state from the EIA.\n\n    Returns an overview of energy production, consumption, prices, and\n    expenditures across all fuel types for the specified state. Useful for\n    understanding a state's full energy landscape.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'TX', 'NY').\n    ",
          "inputSchema": {
