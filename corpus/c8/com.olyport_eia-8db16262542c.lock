        {
          "name": "get_electricity_data",
          "description": "Get electricity generation, consumption, or price data from the EIA.\n\n    Returns data on electricity production, retail sales, prices, and fuel\n    consumption for power generation across US states and sectors.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'TX'). Omit for national data.\n        sector: Sector filter. Common values: 'RES' (residential), 'COM' (commercial),\n                'IND' (industrial), 'TRA' (transportation), 'ALL' (all sectors).\n        frequency: Data frequency: 'monthly', 'quarterly', or 'annual'. Default is 'monthly'.\n        limit: Maximum number of records to return (default 100, max 5000).\n    ",
          "inputSchema": {
            "properties": {
              "frequency": {
                "default": "monthly",
                "title": "Frequency",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "title": "Limit",
                "type": "integer"
              },
              "sector": {
                "default": null,
                "title": "Sector",
                "type": "string"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              }
            },
            "title": "get_electricity_dataArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_electricity_dataOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c5b33a0bab7fac8ee4d4f17367f6cae68dbd4a671a594945f2b9c1c007a3608"
        },
        {
          "name": "get_natural_gas_data",
          "description": "Get natural gas production, consumption, or price data from the EIA.\n\n    Returns data on natural gas wellhead prices, marketed production, consumption\n    by sector, and interstate pipeline flows.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'TX', 'PA'). Omit for national data.\n        frequency: Data frequency: 'monthly' or 'annual'. Default is 'monthly'.\n        limit: Maximum number of records to return (default 100, max 5000).\n    ",
          "inputSchema": {
            "properties": {
              "frequency": {
                "default": "monthly",
                "title": "Frequency",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              }
            },
            "title": "get_natural_gas_dataArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_natural_gas_dataOutput",
            "type": "object"
          },
