        {
          "name": "search_inventory",
          "description": "Search the SYNTHETIC demo inventory (about 860 fictional vehicles at 20 fictional dealers in TX, CA, FL, GA, AZ,\nIL, NY and OH). Results are not real vehicles for sale; say so when you show them.\nEach result has listing_id (dealer_key:VIN), vehicle basics, headline_price (before tax, title and fees), dealer_name,\nand selling_location: the store that holds the unit, with address and phone. link_status is linked, or ambiguous\nwhen the listing does not say which of the dealer's stores holds it (see selling_location_candidates). A unit can\nbe held at a sister store run by another dealer in the same group; operated_by_dealer_id then differs from dealer_id.\nMatching is exact on vocabularies, so a total of 0 often means a wrong value: check the parameter descriptions,\nwiden radius_miles or drop a filter; a zero total also returns hints.\nThe named parameters are shortcuts. filters reaches every other attribute: for example\n{\"field\": \"canonical.vin\", \"op\": \"eq\", \"value\": \"<VIN>\"} finds a VIN, {\"field\": \"price_summary.doc_fee\", \"op\": \"range\",\n\"max\": 300}, {\"field\": \"incentives[].label_raw\", \"op\": \"eq\", \"value\": \"Military Appreciation\"}.\nPayment search: payment_max / payment_min filter on a DEMO monthly finance estimate computed per listing from its\nitemized out-the-door estimate (tax, title, registration, dealer fees) for the buyer location, minus down payment and\ntrade equity, at a demo APR by credit tier unless apr is given. Each result then has estimated_payment (rounded to\n$5, with a range) and dealer_advertised_payment when the listing shows one; the response has payment_assumptions\nand a one-line assumptions_summary to read back to the shopper. For 'under $300/month' pass max_monthly_payment=300.\nWith a cap, near_misses lists up to 3 cars just above it, and a zero result returns to_reach_target (extra down\npayment, or a 72 or 84 month term). To compare scenarios for one car, use compare_payment_scenarios.\nEvery result has estimated_out_the_door (exact, same as estimate_out_the_door for the buyer location), availability\n(status, price_valid_until, last_updated, observed_at), seating_capacity, third_row and cargo_capacity_cu_ft\n(synthetic demo specs). sort=best_value score = 0.35 * cost_score + 0.30 * age_score + 0.35 * mileage_score\n(formula in best_value_formula). A zero result with zip returns coverage: nearest_store, nearest_new_inventory and\nnearest_qualifying_inventory with distance, match count and lowest out the door, plus a coverage_note.\nestimated_out_the_door on results and near_misses carries the same warnings and excluded_items (for example an\noptional add-on's name and price) that estimate_out_the_door returns. Each result has group_id, region_id and store_id\n(dealer hierarchy; also filterable) and dealer_segment / dealer_type,\nthird_row_type and sliding_doors. With payment inputs, estimated_payment has financing_eligibility, credit_tier and\ncredit_tier_source (default when not given), negative_equity_rolled_in, loan_to_value_pct and warnings; the response\nhas financing_summary. Pass financeable_only=true to drop listings the demo financing rules flag.\nEstimate, not an offer; dealer sets price, lender sets rate. Not penny-accurate.",
          "inputSchema": {
            "$defs": {
              "FieldFilter": {
                "description": "One generic filter on any ontology field (see list_searchable_fields).",
                "properties": {
                  "field": {
                    "description": "Dotted field path from list_searchable_fields, e.g. canonical.exterior_color.family, price_summary.doc_fee, incentives[].label_raw, store.name, payment.estimated_monthly. Shortcut names such as make, model, color, price, state also work.",
                    "title": "Field",
                    "type": "string"
                  },
                  "max": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Upper bound for range (inclusive).",
                    "title": "Max"
                  },
                  "min": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Lower bound for range (inclusive).",
                    "title": "Min"
                  },
                  "negate": {
                    "default": false,
                    "description": "True to invert the filter.",
                    "title": "Negate",
                    "type": "boolean"
                  },
