        {
          "name": "get_price_breakdown",
          "description": "Use this to see what the dealer LISTS for ONE listing, as published: headline price, MSRP (new cars),\nprice_components, dealer fees (doc fee and others) and fee bundles (parts marked part_of_bundle, not double\ncounted), flags such as whether the advertised price already includes fees, options, incentives split into\nall_buyer (already in the price) and conditional (not in the price), and the state's public tax and fee RULES\nwith data-flag checks. It takes no buyer inputs and computes no tax amounts or total.\nUse estimate_out_the_door next for the buyer's total with tax, title, registration and fees, and\nget_payment_estimate for a monthly payment. Pass conditional incentive label_raw values to those tools as\neligible_incentive_labels only if the shopper qualifies. A dealer-advertised monthly payment, when present, is a\nprice_components item of type payment_quote: dealer ad text, not a calculation. Each price_component has a plain\nlabel, source_text and method_text; fees and incentives carry tax_treatment (taxable or reduces_taxable_amount,\nwhether it is inside the advertised price, and why).",
          "inputSchema": {
            "properties": {
              "listing_id": {
                "description": "dealer_key:VIN from search_inventory.",
                "title": "Listing Id",
                "type": "string"
