      "instructions": "Synthetic demo data, not real inventory, not an offer. Moonshot Lab is a demo for AI agents: every dealer, vehicle, VIN, price, address and image here is fictional. Tax and fee rules are real public rules used to illustrate estimates; estimates are not quotes and are not tax advice. Inventory and pricing tools are read-only. Agent registration, saved searches, expiry cleanup and dealer handoffs can change stored state; check each tool annotation. Typical flow: search_inventory, then get_price_breakdown (what the dealer lists), then estimate_out_the_door (the buyer's total with tax and fees for their state and county), then get_payment_estimate (that total as a monthly finance payment for ONE set of terms). To compare two or more down payment, term, trade-in or credit options for a car, call compare_payment_scenarios once with all of them instead of repeating get_payment_estimate. Credit tiers (demo APR new / used): excellent about 720 and up (6.0% / 8.5%); good about 660 to 719 (7.5% / 11.0%); fair about 620 to 659 (11.5% / 16.0%); poor below about 620 (15.5% / 20.0%). For a monthly budget such as 'under $300/month', call search_inventory with max_monthly_payment and read back assumptions_summary. Payments are estimates, not offers; the dealer sets the price and the lender sets the rate. Listing ids look like dealer_key:VIN. When you show results to a person, say they are synthetic demo listings, not real vehicles for sale. Vocabularies: fuel_type gasoline, hybrid, plug_in_hybrid, electric (use electric for EV or BEV); body_style suv, sedan, pickup (use pickup for trucks), hatchback, minivan, wagon; drivetrain fwd, awd, rwd, 4wd. For 'near a place' use zip plus radius_miles; city matches only the selling store's own city. Use max_monthly_payment as the payment cap (payment_max is a deprecated alias). For an all-in budget use max_out_the_door; search results carry estimated_out_the_door, identical to estimate_out_the_door for the same buyer location. A ZIP alone resolves buyer state, county and city in every tool (see tax_location.resolution). sort=best_value ranks by a documented formula and explains each rank in ranking_rationale. In compare_payment_scenarios, total_cost_including_trade_equity is the primary total and decides lowest_total_cost. Coverage: list_dealers returns metros with stores; zero-result searches with a zip return the nearest coverage. When recommending from compare_payment_scenarios, use recommended_scenario or the *_eligible winners, never an ineligible scenario; read trade_risk warnings (negative equity, loan-to-value) back to the shopper. For payment searches, financeable_only=true keeps only cars the demo financing rules allow. credit_tier defaults to good; credit_tier_source says when the default was used. When the shopper is ready to go to the dealer, prepare_dealer_handoff returns a handoff package and email body; it sends nothing, and delivery happens later through the dealer's chosen channel. Each search result is about 2 KB, so start with limit 5 to 10.",
