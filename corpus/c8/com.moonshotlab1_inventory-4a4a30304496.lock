        {
          "name": "compare_payment_scenarios",
          "description": "Use this to compare several financing what-ifs for ONE listing side by side in one call (for example cash\ndown, term, credit tier or APR, trade-in, incentives). Each scenario reruns the itemized out-the-door estimate and\nreturns estimated_out_the_door, amount_financed_estimate, apr_percent and apr_source, term_months,\nestimated_monthly_payment (rounded to $5) with the unrounded value and an outward-rounded range,\ntotal_interest_estimate, total_cost_including_trade_equity (PRIMARY total: cash down plus all payments plus net\ntrade equity given up), cash_outlay_excluding_trade_equity (cash down plus payments only; total_cost_estimate is\nits deprecated alias) and financing_eligibility with flags (demo rules), plus lowest_monthly, lowest_total_cost\n(decided by total_cost_including_trade_equity) and lowest_cash_outlay_excluding_trade_equity. Those lowest_* keys are\nUNFILTERED math winners. Present recommended_scenario, lowest_monthly_eligible or lowest_total_cost_eligible instead:\nthey skip scenarios the demo financing rules flag, so an ineligible scenario is never the recommendation. A scenario\n{\"name\":\"cash\",\"cash\":true} prices paying cash (no loan, no interest); cash_purchase always gives the cash amount due.\nEach scenario has trade_risk (negative_equity_rolled_in, loan_to_value_pct and warnings, for example LTV over 110%)\nand credit_tier_source. Prefer this over repeated get_payment_estimate calls. Up to 6 scenarios. For a single scenario use\nget_payment_estimate. Estimate, not an offer; dealer sets price, lender sets rate. Leases are not modeled.",
          "inputSchema": {
            "$defs": {
              "PaymentScenario": {
                "description": "One what-if finance scenario. Omitted fields use the call's defaults ($0 down, 60 months, good credit).",
