        {
          "name": "get_payment_estimate",
          "description": "Use this to answer 'what would my monthly payment be' for ONE listing. It runs the same itemized\nout-the-door calculation as estimate_out_the_door (always treated as financed) and turns it into a DEMO monthly\nfinance payment: out-the-door total minus down payment and trade equity, amortized at the APR (or a demo APR\nby credit_tier) over term_months. Returns finance.estimated_monthly_payment rounded to $5 with monthly_payment_unrounded,\nmonthly_payment_range (rounded outward, so it always contains the unrounded value), financing_eligibility (demo\nlender rules: minimum amount financed, max term by vehicle age and mileage, with flags),\namount_financed_estimate, total_of_payments, finance_charge and every assumption, plus the out-the-door figure\nit used, a one-line assumptions_summary and any dealer-advertised payment shown separately (not comparable unless\nthe terms match). Totals: total_cost_including_trade_equity (PRIMARY: cash down plus payments plus net trade\nequity given up) and cash_outlay_excluding_trade_equity (cash down plus payments); total_cost_estimate is a\ndeprecated alias of the latter, kept for one version. For ONE set of terms only: to compare two or more down, term, trade or\ncredit options, call compare_payment_scenarios once instead of calling this tool repeatedly.\nUse get_price_breakdown instead for the dealer's listed price and fees only, and estimate_out_the_door for\nthe full itemized total without a payment. To find cars by payment across many listings, use search_inventory\nwith max_monthly_payment (canonical; payment_max is a deprecated alias). Estimate, not an offer; dealer sets price, lender sets rate. Not penny-accurate. Leases are not modeled.",
          "inputSchema": {
            "properties": {
              "apr": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
