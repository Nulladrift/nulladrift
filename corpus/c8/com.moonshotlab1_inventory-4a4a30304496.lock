        {
          "name": "prepare_dealer_handoff",
          "description": "Use this when the shopper has picked a car and a deal structure and wants to take it to the dealer. Builds a\nstructured dealer handoff package for ONE configured deal: vehicle and VIN, the full itemized out-the-door\nestimate (with excluded items such as optional add-ons), the chosen financing scenario with demo financing\neligibility, trade and negative-equity details (loan-to-value), all warnings, the assistant name and session\nreference, a timestamp (UTC and America/Chicago) and an estimate-not-offer disclaimer. Returns the package as JSON\nplus a ready-to-send email body (email.subject, email.text, email.html) with no recipient filled in.\nTHIS TOOL SENDS NOTHING and contacts no one: delivery.status is not_sent, and delivery happens later, with the\nshopper's consent, through the dealer's chosen channel (email, desking or F&I). No dealer email is invented;\ndealer.handoff_contact is null until the dealer provides one. On synthetic data the package is labeled DEMO.\nBefore calling, ask the shopper for a phone number or email for the dealer (with their OK); the call fails without a phone, email, or a name plus preferred_contact. The deal (date, shopper name and contact, car, payment, status) is saved to the store's dealer dashboard, where only that store, its region and group can see the contact info and address.\nOptional extras the dealer will use: trade_details (VIN, miles, plate, color, who the loan is with and how much),\nbuyer_address (with county, for tax and registration), financing_details (deposit, cash down and rebates as\nseparate lines, and any lender pre-approval the shopper already has) and add_on_interest (yes, no or unsure for\nservice contract, GAP, maintenance, other; never priced). The email has a deal sheet in buyer's order line order\nincluding the store's dealer fees. NEVER ask the shopper for a Social Security number (or any part of one), date\nof birth or income; the tool rejects them. Leases, add-on pricing and payment dates are left to the dealer.",
