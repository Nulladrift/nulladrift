        {
          "name": "estimate_out_the_door",
          "description": "Use this for the buyer's TOTAL price of ONE listing: an itemized out-the-door DEMO ESTIMATE for the buyer's\nstate, county and city, built with real public tax and fee rules for the 8 covered states. Lines include the\nprice, dealer fees, eligible incentives, state and local sales tax, title and registration fees, and a trade-in\nblock (allowance, payoff, equity, tax credit). Every line has a source and confidence; unknowns become ranges.\nRead estimated_out_the_door with estimate_range and confidence. With a trade-in, estimated_out_the_door is the\nbalance due after the trade (negative equity added); deal.vehicle_out_the_door_before_trade is the car alone.\nUse get_price_breakdown instead for only the dealer's listed price and fees, and get_payment_estimate to turn\nthis total into a monthly finance payment (this tool returns payments: null). Read warnings, for example when the\nshopper's state differs from the store's state. Not an offer, not a quote, not penny-accurate. Inputs are not stored.",
          "inputSchema": {
            "properties": {
              "buyer_city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Shopper's city, e.g. Chicago. Some city taxes depend on it; it can also imply the county.",
                "title": "Buyer City"
              },
              "buyer_county": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Shopper's county name without the word County, e.g. Harris, Cook, Orange. Improves local tax lines.",
                "title": "Buyer County"
              },
              "buyer_state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Shopper's two-letter state; sets the tax and fee state. Defaults to the selling store's state, or the state of buyer_zip. States outside the 8 covered return a low-confidence estimate without tax and government fees.",
                "title": "Buyer State"
              },
