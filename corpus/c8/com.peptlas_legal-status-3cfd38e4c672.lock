{
  "lockfileVersion": 2,
  "subjects": {
    "com.peptlas/legal-status": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://peptlas.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "peptlas",
        "title": "Peptlas: is this peptide legal?",
        "version": "1.1.0",
        "websiteUrl": "https://peptlas.com/mcp-server/",
        "icons": [
          {
            "src": "https://peptlas.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://peptlas.com/brand/peptlas-mark-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Peptlas tracks the legal status of peptides and GLP-1 drugs (BPC-157, TB-500, semaglutide, tirzepatide, retatrutide and more) and of seller-named blends (KLOW, GLOW, the Wolverine stack), which take their strictest ingredient's status, with the FDA, TGA, MHRA, EMA, Health Canada, ANVISA and WADA. Every status is dated and linked to its primary source. Use check_legal_status for \"is X legal (in Y)?\", status_in_place for \"what is legal in Y?\", recent_changes for news, and list_compounds to see what is covered. Quote the status label and its date, link the page from the result, and credit Peptlas (peptlas.com, CC BY 4.0). Statuses describe the law, not safety, efficacy or dosing: Peptlas gives no medical or legal advice and recommends no products or sellers.",
      "tools": [
        {
          "name": "check_legal_status",
          "title": "Is this peptide legal?",
          "description": "The legal status of one peptide, GLP-1 drug or seller-named blend (KLOW, GLOW, the Wolverine stack) in the United States (FDA), Australia (TGA), the UK (MHRA), the EU (EMA), Canada (Health Canada), Brazil (ANVISA, where covered) and sport (WADA), or in the one place you name. Returns each status with a plain-language note; for the U.S. also the full answer (compounding rules, the latest FDA advisory vote, the next dated event), plus primary sources and the date it was last verified.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compound": {
                "description": "A compound by name, brand, code or street name (\"BPC-157\", \"Ozempic\", \"reta\", \"TB500\"), or a blend (\"KLOW\", \"GLOW\", \"Wolverine stack\").",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "place": {
                "description": "A country, region or regulator: \"Australia\", \"UK\", \"Germany\" (EU), \"Brazil\", \"FDA\", or \"sport\" for WADA. Omit it for every place.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["compound"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5db1860634acfdcd546e99eb7e105c93d2328bc79ae1d8bba285cf862fa571d4"
        },
        {
          "name": "list_compounds",
          "title": "List compounds",
          "description": "The 26 compounds and 3 blends Peptlas tracks, with the names people search by (brands, codes, street names), each U.S. status and its page. Use it to see what is covered.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "us_status": {
                "description": "Only compounds with this U.S. status.",
                "enum": ["compounding_legal", "under_review", "in_limbo", "restricted", "unscheduled"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6ff53e770181d8802ae79a0fe8d492f51328ab7d75245bdeb6e165299151b9ea"
        },
        {
          "name": "recent_changes",
          "title": "Recent changes",
          "description": "Dated regulatory events from the Peptlas changelog, newest first: FDA advisory votes, list changes, comment deadlines, warning letters. Optionally for one compound (or a blend, meaning all its ingredients) or since a date. Use it for \"what changed\" or \"any news on BPC-157\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compound": {
                "description": "Only this compound. Omit it for every compound.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many events, newest first (1-50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Only events on or after this date (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbeb33986c51e4bb0f505525dc2cf1b2059079f5027c3e6fca1edb68821ea067"
        },
        {
          "name": "status_in_place",
          "title": "What is legal in a country?",
          "description": "Every tracked peptide in one place, with its status and a note: use it for \"which peptides are legal in Australia\" or \"what does WADA ban\". Optionally only one status.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "place": {
                "description": "A country, region or regulator: \"Australia\", \"UK\", \"Germany\" (EU), \"Brazil\", \"FDA\", or \"sport\" for WADA.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "status": {
                "description": "Only this status: compounding_legal, under_review, in_limbo, restricted or unscheduled.",
                "enum": ["compounding_legal", "under_review", "in_limbo", "restricted", "unscheduled"],
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7ca453322e66b29482d064969715f9307add2597336fc7ddce6e279c1ef2cab"
        }
      ],
      "digest": "sha256:8fc1a5388aa8ac1d50b9efaf78e3d532d036d8578bcfcd55042814b5dfadcc95"
    }
  }
}
