          },
          "digest": "sha256:d8a74ee4d154613738aedb440ed799f6fde00e3fcb73dd486e20fe45c74bd233"
        },
        {
          "name": "web_search",
          "title": "Search the web",
          "description": "Search the web and get the top results (title, URL, snippet). Set read (1-5) to also get the full text of the top results as Markdown, so you can answer from the pages themselves. Use it for current events, facts you are unsure about, documentation and anything after your training data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter country code for local results, e.g. us, gb, de, vn. Default worldwide.",
                "type": "string"
              },
              "query": {
                "description": "Search query, e.g. \"docker compose healthcheck example\"",
                "type": "string"
              },
              "read": {
                "description": "How many top results to read in full (0-5). Default 0.",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "time": {
                "description": "Only results from this recent period.",
                "enum": ["day", "week", "month", "year"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
