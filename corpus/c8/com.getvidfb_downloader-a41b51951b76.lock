          },
          "digest": "sha256:a835521b9db597f32d657ae6a4ffab7fd8ba0fd55e5ae8a0879124986440dcaa"
        },
        {
          "name": "instagram_post_info",
          "title": "Instagram post details",
          "description": "Get the details of a public Instagram post or reel: publish date, likes, comment count, views, caption, hashtags, mentions, location, tagged users, owner, media links and the comments shown publicly on the page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Post or reel URL, or its shortcode, e.g. https://www.instagram.com/p/DfsjOcnl4nQ/",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7f91ef6fa4c3d8dee3891776f78925cebeb1303fc2bb9993af84a728a298e8d9"
        },
        {
          "name": "instagram_profile",
          "title": "Instagram public profile",
          "description": "Get a public Instagram profile: full name, bio, verified badge, follower, following and post counts, profile picture and the 12 most recent posts (link, type, caption, thumbnail).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "username": {
                "description": "Instagram username or profile URL, e.g. nasa",
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1d1d85596ea77a09cdfa3b7034e5c2682e27eb0941afb0a0e5ac59fb0a503600"
        },
        {
          "name": "news_search",
          "title": "Search recent news",
          "description": "Find recent news articles about a topic: headline, source, publish time, snippet and URL. Combine with read_webpage to read an article in full.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Number of articles, default 10.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "country": {
                "description": "Two-letter country code, e.g. us, gb, vn. Default us.",
                "type": "string"
              },
              "query": {
                "description": "News topic, e.g. \"nvidia earnings\"",
                "type": "string"
              },
              "time": {
                "description": "Only articles from this recent period.",
                "enum": ["hour", "day", "week", "month"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7345fcca29a4972207c729154f05411cf9eb8a8bacbc426d2e24fcde3949303d"
        },
        {
          "name": "pinterest_download_links",
          "title": "Pinterest media download links",
          "description": "Get download links for the videos, images and GIFs of a public Pinterest pin or Idea Pin (pinterest.com or pin.it short links).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public post URL, e.g. https://pin.it/abc123",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
