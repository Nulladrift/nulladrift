          },
          "digest": "sha256:00ce9d34c5e80820f09dc30fb6a65c36c7d34305e9733e3c728f891b9f90867c"
        },
        {
          "name": "read_webpage",
          "title": "Read a web page as Markdown",
          "description": "Fetch a public web page and return its main content as clean Markdown (or plain text), with title, description, author, publish date and language. Pages that need JavaScript are rendered automatically. Use it to read articles, docs, blog posts and product pages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "format": {
                "description": "Output format. Default markdown.",
                "enum": ["markdown", "text"],
                "type": "string"
              },
              "main_content": {
                "description": "Only the main article (default true); false keeps the whole page.",
                "type": "boolean"
              },
              "max_chars": {
                "description": "Cut the content at this many characters. Default 100000.",
                "maximum": 500000,
                "minimum": 100,
                "type": "integer"
              },
              "url": {
                "description": "Public web page URL, e.g. https://en.wikipedia.org/wiki/Web_scraping",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0d123c6248e650f3e52b2e358c180af2aeec057ffb1432f5a914a96f851d823e"
        },
        {
          "name": "shopify_products",
          "title": "Browse or search a Shopify store",
          "description": "List or search the products of any Shopify store: title, URL, vendor, type, price range, availability and variants. Give a product URL to get that product with per-variant stock when the store shows it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "page": {
                "description": "Catalog page (20 products per page). Default 1.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search the store for this text (max 10 results). Omit to list the catalog.",
                "type": "string"
              },
              "url": {
                "description": "Store URL or domain (e.g. allbirds.com), or a product URL (https://store.com/products/<handle>)",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
