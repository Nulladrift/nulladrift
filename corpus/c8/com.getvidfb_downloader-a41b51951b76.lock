{
  "lockfileVersion": 2,
  "subjects": {
    "com.getvidfb/downloader": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.getvidfb.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "getvidfb",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Returns direct download links (MP4, audio, images) for public Facebook, Instagram, TikTok and Pinterest posts. Private posts and Stories are not supported. The links point at the platforms' CDNs and expire after a few hours, so hand them to the user right away. Only download content the user owns or has permission to use. read_webpage returns any public web page as clean Markdown; web_search and news_search find pages and articles to read.",
      "tools": [
        {
          "name": "facebook_download_links",
          "title": "Facebook video download links",
          "description": "Get direct download links for a public Facebook video, reel, watch link, share link or photo post: SD and HD MP4 with audio, separate video/audio tracks, thumbnail, title and duration.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public post URL, e.g. https://www.facebook.com/reel/29099013063058043",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3db68761b813a532cbb5d1d4d84f57817dcdccfad22dd56586c173d4129c4f46"
        },
        {
          "name": "instagram_download_links",
          "title": "Instagram post and reel download links",
          "description": "Get download links for a public Instagram post, reel or carousel: MP4 with audio, higher-resolution video and audio tracks, full-size images in carousel order, author and caption.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public post URL, e.g. https://www.instagram.com/reel/DAbCdEfGhIj/",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
