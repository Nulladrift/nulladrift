  "lockfileVersion": 2,
  "subjects": {
    "com.getvidfb/downloader": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.getvidfb.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "getvidfb",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Returns direct download links (MP4, audio, images) for public Facebook, TikTok and Pinterest posts. Private posts and Facebook Stories are not supported. The links point at the platforms' CDNs and expire after a few hours, so hand them to the user right away. Only download content the user owns or has permission to use.",
      "tools": [
        {
          "name": "facebook_download_links",
          "title": "Facebook video download links",
          "description": "Get direct download links for a public Facebook video, reel, watch link, share link or photo post: SD and HD MP4 with audio, separate video/audio tracks, thumbnail, title and duration.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public post URL, e.g. https://www.facebook.com/reel/29099013063058043",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6795b8f43587e4be56bfa1d6debb88ee150a1ecd707b7c6b98dfe446df099523"
        },
        {
          "name": "pinterest_download_links",
          "title": "Pinterest media download links",
          "description": "Get download links for the videos, images and GIFs of a public Pinterest pin or Idea Pin (pinterest.com or pin.it short links).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public post URL, e.g. https://pin.it/abc123",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9b1f66e19015127d3656de2bd783e5c51a74b876d5ea64fed9a84389a91b9a13"
        },
        {
          "name": "tiktok_download_links",
          "title": "TikTok video and photo download links",
          "description": "Get no-watermark MP4 links (HD original quality and SD, with file sizes), every image of a photo post or slideshow, the music track, cover image, title and author for a public TikTok post.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public post URL, e.g. https://www.tiktok.com/@user/video/7300000000000000000",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
