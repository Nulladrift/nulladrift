{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kineticad.get/cnc-parts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://get.kineticad.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "kineticad",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "KinetiCAD gets custom parts CNC machined in the US. Use these tools when the user has designed a part, or wants you to design one, and wants to know what it costs to machine or wants it made.\n1. build_part: send the part as CadQuery code. You get back a part_id, the part's measured size, its holes and round features, warnings and a picture. If the build fails, the error names the problem and the line: fix the code and send it again. A STEP file on disk is uploaded over HTTP instead: curl -F file=@part.step https://get.kineticad.ai/api/agent/parts\n2. view_part: look at the part from another side when you need to check a feature.\n3. price_part: the price and delivery date from a machining plan made for this part.\n4. request_order: only after the user has seen the price and said yes. No payment is taken.\nUnits are millimeters. One part per call, no assemblies. Give the user the links.see_in_3d address so they can rotate the part themselves. Full guide: https://get.kineticad.ai/agents.md",
      "tools": [
        {
          "name": "build_part",
          "title": "Build and check a part",
          "description": "Build one part from CadQuery code in KinetiCAD's CAD kernel and check that it is a solid a shop can machine. Returns a part_id, the measured size and volume, every round hole and round outside surface with its diameter and direction, warnings (for example a cut that removed nothing), a picture, and a link where the user can rotate the part in 3D. The code runs in a sandbox with only `cadquery` (as `cq`) and `math`. Leave the finished solid in a variable named `result`, or pass it to `show_object()`. Units are millimeters. The part must be ONE closed solid, at most 1000 mm long. A cavity sealed inside the material is rejected, because no cutter can reach it. The code can be up to 20000 characters long. Optional: define PARAMS (a list of {name, label, unit, value, min, max}) and a function build(p) that returns the solid. The user can then change those dimensions on the part's page. If the build fails, the error says what is wrong and on which line: fix the code and call again. Parts are kept for 30 days.",
          "inputSchema": {
            "properties": {
              "about": {
                "description": "One sentence on what the part is for. The KinetiCAD team sees it with an order request.",
                "type": "string"
              },
              "cadquery": {
                "description": "CadQuery (Python) code for one part, in millimeters.",
                "type": "string"
              },
              "name": {
                "description": "Short name of the part, for example: Motor bracket.",
                "type": "string"
              }
            },
            "required": ["cadquery"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Build and check a part"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9bf48584055cf18c9ebb50dea6a4bd7a16d60eaa8e00ba02565ef0ac85c44aa3"
        },
        {
          "name": "price_part",
          "title": "Price a part",
          "description": "Get the price to CNC machine a part in the US. KinetiCAD's engine plans how the part is machined (the machine, the setups, the tools and the cycle time), and the price is the setup time and the machine time at a US shop rate, plus the material. Returns the unit price for the quantity, the cost lines, the plan and the delivery date. Planning a new part takes from about 10 seconds to a few minutes: if status is planning, call again after retry_after_seconds. Prices are in US dollars.",
          "inputSchema": {
            "properties": {
              "material": {
                "default": "aluminum-6061",
                "description": "What the part is machined from.",
                "enum": ["aluminum-6061", "aluminum-7075", "steel-1045", "stainless-304", "acetal"],
                "type": "string"
              },
              "part_id": {
                "description": "The part_id that build_part (or the HTTP upload of a STEP file) returned.",
                "pattern": "^[a-z0-9]{24}$",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "description": "How many pieces.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["part_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Price a part"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f2ad93925c3f2882e6ce7947d9c67fff87cc5b1215c92c7ac0b734b8838bcec5"
        },
        {
          "name": "request_order",
          "title": "Request an order",
          "description": "Send an order request for a part to KinetiCAD. Call this only after the user has seen the price and said yes, and has given a shipping address and an email address. It sends those details to KinetiCAD. No payment is taken: Bera Demirhan at KinetiCAD emails the user within 1 business day with the confirmed price and delivery date, and the user pays only after agreeing. Ships within the US only.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Shipping address: city.",
                "type": "string"
              },
              "company": {
                "description": "Optional. The user's company.",
                "type": "string"
              },
              "email": {
                "description": "Where KinetiCAD sends the confirmed price and delivery date.",
                "type": "string"
              },
              "material": {
                "default": "aluminum-6061",
                "description": "What the part is machined from.",
                "enum": ["aluminum-6061", "aluminum-7075", "steel-1045", "stainless-304", "acetal"],
                "type": "string"
              },
              "name": {
                "description": "The user's full name.",
                "type": "string"
              },
              "notes": {
                "description": "Anything the shop should know: threads, fits, finish, a date the parts are needed by.",
                "type": "string"
              },
              "part_id": {
                "description": "The part_id that build_part (or the HTTP upload of a STEP file) returned.",
                "pattern": "^[a-z0-9]{24}$",
                "type": "string"
              },
              "phone": {
                "description": "Optional. The user's phone number.",
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "description": "How many pieces.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "US state, two letters, for example CA.",
                "type": "string"
              },
              "street": {
                "description": "Shipping address: number and street.",
                "type": "string"
              },
              "zip": {
                "description": "US ZIP code.",
                "type": "string"
              }
            },
            "required": ["city", "email", "name", "part_id", "state", "street", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request an order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13d3951d8fa345f7ca26b239446391544eae0847dac94b797c2c80ba25c9c9ba"
        },
        {
          "name": "view_part",
          "title": "Look at a part",
          "description": "Get a picture of a part from one side, with its measured size and features. Use it to check that the part is what the user asked for before you price or order it.",
          "inputSchema": {
            "properties": {
              "part_id": {
                "description": "The part_id that build_part (or the HTTP upload of a STEP file) returned.",
                "pattern": "^[a-z0-9]{24}$",
                "type": "string"
              },
              "view": {
                "default": "iso",
                "description": "The side to look from. iso looks down from the front right; under shows the underside.",
                "enum": ["iso", "iso_back", "top", "bottom", "front", "back", "right", "left", "under"],
                "type": "string"
              }
            },
            "required": ["part_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look at a part"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:02d14863e9a522f16cbfc77406e82b675a32c83a04468d1ea592ff2bd31009b9"
        }
      ],
      "digest": "sha256:0516977c895248c39ccfbbbe4a1cd95c29bd1b9fcd0b071a263f3bfbb33b4524"
    }
  }
