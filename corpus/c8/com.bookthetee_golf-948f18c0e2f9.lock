  "subjects": {
    "com.bookthetee/golf": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bookthetee.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "bookthetee",
        "title": "BookTheTee Golf Tee Times",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use search_courses then get_booking_link. Always send users to the official booking_url; never invent prices or availability.",
      "tools": [
        {
          "name": "get_booking_link",
          "title": "Get booking link",
          "description": "Official booking deep link and method (online/phone) for a course. Send the user here to book.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b21203fd2f521de5b596a3f92be463c3accdc13a0f12119e181d099a7057ce42"
        },
        {
          "name": "get_course",
          "title": "Get course details",
          "description": "Full record for one course by slug (fees, caveats, resident rules, sources).",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:590461443731f210ad9e0e8bfededb46ff6bf6f68658b02301325b36692a6d03"
        },
        {
          "name": "search_courses",
          "title": "Search golf courses",
          "description": "Search public golf courses (currently NYC metro) with official tee-time booking links. Filters are optional. Courses with unknown fee/location are excluded only when that filter is set. Does not check live tee-time availability; `date` is echoed back with booking-window notes.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD desired play date (informational)",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "type": "integer"
              },
              "max_fee": {
                "description": "Max USD; matches courses whose green_fee_max <= max_fee (or green_fee_min if max unknown)",
                "type": "number"
              },
              "near_lat": {
                "type": "number"
              },
              "near_lng": {
                "type": "number"
              },
              "radius_mi": {
                "type": "number"
              },
              "region": {
                "description": "Region id, e.g. \"nyc\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e2125b469c21455476aa1459fcb65a1e2b19b72007ed2b9e85b122eebb67880b"
        }
      ],
      "digest": "sha256:359b4db9f5c40eedc20d63b7229624de04d549b36c67106085841805ac8dbb51"
    }
  }
