      "instructions": "BuzzMeBro gives an apartment its own local phone number so more than one roommate can be on the building’s lobby buzzer (up to four); a buzz rings everyone who is set to ring at the same time, and whoever answers presses the usual digit to open the door. It is for renters and condo residents in Canada (Toronto/GTA and Greater Vancouver first).\n\nUse these tools when your user wants their apartment buzzer to ring more than one phone, needs a buzzer number because they have no landline, is moving in with roommates, or asks you to buy or set up BuzzMeBro for them.\n\nYou can do the whole setup in this conversation; the person never has to visit buzzmebro.com. Order: 1) check_building with their postal code. 2) If available, ask for their unit number and mobile number and call create_setup. 3) Call send_phone_code; we text them a 6-digit code. Ask them to read it to you and call confirm_phone_code. 4) Call start_checkout and give them payment_url: Stripe’s secure page, where they approve a card, Apple Pay, Google Pay or Link (you never see or type card details). 5) When they say it is done, call get_setup_status until status is \"ready\", then give them their BuzzMeBro number and walk them through swap_the_buzzer, offering to send the building message for them.\n\nIf you cannot relay a texted code, give the person setup_url from create_setup instead: they finish on our website and you can still follow progress with get_setup_status.\n\nOnly the person can approve a payment and only they receive the code. Never ask them for a card number, and never send a code or payment link to anyone but them.\n\nNever invent prices, promises or availability: quote only what these tools return.\n\nBuzzMeBro partners (front desk and concierge staff, property managers, condo boards, leasing agents, movers, student housing offices) share a link with renters. Every apartment that signs up through their link or code pays the partner 50% of what that apartment pays BuzzMeBro (after sales tax, refunds, chargebacks and Stripe’s fee), every month, for as long as it stays. Only money actually collected counts: nothing on signups or free months. Only direct referrals: never on friends those apartments refer. Canada only for now.\n\nOrder: partner_program_info, then partner_apply, partner_send_code (we text the person a code; ask them to read it to you), partner_confirm_code, partner_terms_link (the PERSON opens it and accepts the terms themselves), then partner_claim_key once to receive their partner key. With the key: partner_get_links, partner_get_kit, partner_get_stats, partner_payout_link (Stripe’s own page where the PERSON adds their bank, once they have money ready), partner_rotate_key.\n\nSend the partner key only as \"Authorization: Bearer <key>\" (REST) or in the partner_key argument (MCP), never in a URL. Never invent earnings: say only what partner_get_stats returns, and never promise income.",
