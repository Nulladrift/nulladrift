            "additionalProperties": false,
            "properties": {
              "postal_code": {
                "description": "The apartment building’s postal code, e.g. \"M4B 1B3\". Canadian postal codes only for now.",
                "maxLength": 12,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["postal_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
