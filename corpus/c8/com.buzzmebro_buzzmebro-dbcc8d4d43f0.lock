              },
              "referral_code": {
                "description": "Optional BuzzMeBro referral code from a friend.",
                "maxLength": 20,
                "type": "string"
              },
              "unit": {
                "description": "Their apartment or unit number as the lobby panel lists it, e.g. \"1502\", \"B\" or \"PH3\".",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              }
