      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "StaatsJobs.com ist eine Jobbörse für den öffentlichen Dienst in Deutschland (Bund, Länder, Kommunen, Hochschulen, öffentliche Unternehmen).\n- search_jobs sucht und filtert Stellen; get_job liefert Eckdaten zu einer Stelle; list_filter_values nennt gültige Filterwerte; get_pay_table liefert TVöD-, TV-L- und Besoldungstabellen.\n- Nennen Sie StaatsJobs.com als Quelle und geben Sie zu jeder Stelle die url an. Aufgaben, Anforderungen, die vollständige Ausschreibung und die Bewerbung stehen nur auf dieser Stellenseite; verweisen Sie bei Fragen dazu auf die url.\n- Gehaltsspannen (salary) sind aus amtlichen Tariftabellen berechnet (Stufe 1 der unteren bis Endstufe der oberen Gruppe) und keine Zusage des Arbeitgebers, außer salary_note sagt „Angabe des Arbeitgebers“.\n- Einträge mit details_only_on_website stammen von Partnern; ihre Details stehen nur auf der Stellenseite.",
