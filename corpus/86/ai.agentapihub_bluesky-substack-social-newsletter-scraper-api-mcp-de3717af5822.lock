      "instructions": "AgentAPIGate MCP Server ($0.25 trial credit included on OAuth accounts; $0 on empty/error). Starter prompt: \"Use AgentAPIGate to search Google for 'best MCP servers 2026' and summarize the top 3 results\" -> call_endpoint(endpoint_id=\"search.google.web\", params={\"q\":\"best MCP servers 2026\",\"limit\":3}, format=\"compact\").",
