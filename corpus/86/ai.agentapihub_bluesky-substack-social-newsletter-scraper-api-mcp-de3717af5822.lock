        {
          "name": "call_endpoint",
          "description": "Execute any endpoint (e.g. search.google.web, search.google.news, web.extract.markdown, youtube.video.transcript) and return compact LLM-ready output (-80% context tokens).",
          "inputSchema": {
            "properties": {
              "endpoint_id": {
                "description": "Target endpoint ID from search_endpoints, e.g. \"search.google.web\".",
                "type": "string"
              },
              "format": {
                "default": "compact",
                "description": "Output compression format (\"compact\", \"md\", or \"json\"), e.g. \"compact\".",
                "enum": ["compact", "md", "json"],
                "type": "string"
              },
              "max_cost_usd": {
                "description": "Optional per-call USD ceiling, e.g. 0.005.",
                "type": "number"
              },
              "params": {
                "additionalProperties": true,
                "description": "Endpoint request arguments matching get_endpoint_schema, e.g. {\"q\":\"MCP servers\",\"limit\":5}.",
                "type": "object"
              }
            },
            "required": ["endpoint_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "data": {
                "description": "Normalized response object (or compact markdown string when format=\"md\")."
              },
              "meta": {
                "additionalProperties": true,
                "description": "Execution receipt (request_id, endpoint, cost_usd, tokens_est, cached).",
                "type": "object"
