      "instructions": "Use resources for exact publications, bibliographies, and evidence graphs. Use search_site for discovery; use get_claim, trace_evidence, and simulate_failure for the CryptoPunks preservation proposal. All exposed content is approved public CC0 material.",
      "tools": [
        {
          "name": "get_citation",
          "title": "Get a citation or bibliography",
          "description": "Return the citation for a maxand98 publication or its complete bibliography in CSL-JSON, BibTeX, or RIS.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "default": "csl-json",
                "enum": ["csl-json", "bibtex", "ris"],
                "type": "string"
              },
              "kind": {
                "enum": ["article", "project"],
                "type": "string"
              },
              "slug": {
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              },
              "target": {
                "default": "publication",
                "enum": ["publication", "bibliography"],
                "type": "string"
              }
            },
            "required": ["kind", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a citation or bibliography"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1394365c77705fc91e9ea373dac4091c949fb82b2ffeb3a90960c41fd61ea813"
        },
        {
          "name": "get_claim",
          "title": "Get a CryptoPunks preservation claim",
          "description": "Return one evidence-backed claim from The Punks Are Permanent, including its article references and source relationships.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "pattern": "^cp-claim-[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a CryptoPunks preservation claim"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
