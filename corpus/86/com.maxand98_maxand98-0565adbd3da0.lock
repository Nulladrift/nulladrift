          "name": "simulate_failure",
          "title": "Simulate CryptoPunks interface failures",
          "description": "Model what survives, degrades, or becomes unavailable when parts of the current CryptoPunks presentation stack fail.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "failures": {
                "items": {
