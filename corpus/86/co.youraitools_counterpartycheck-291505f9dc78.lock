  "subjects": {
    "co.youraitools/counterpartycheck": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.youraitools.co/counterpartycheck/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "counterpartycheck",
        "title": "CounterpartyCheck",
        "version": "0.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call check_counterparty with the address (and chain, intent) before your agent pays, approves or interacts with it. Returns ok / caution / block; reasons and evidence are on the paid x402 routes.",
      "tools": [
        {
          "name": "check_counterparty",
          "title": "Is it safe to pay this address?",
          "description": "Pre-payment counterparty check: before paying, approving or interacting with an EVM (Base, Ethereum, Polygon, Arbitrum One) or Solana address, get ok / caution / block. Free preview tier: verdict, confidence, address kind and flag counts. The paid x402 endpoints /v1/lite ($0.005), /v1/quick ($0.015) and /v1/full ($0.05) add the reasons and evidence (OFAC SDN, scam lists, x402 directory, verification, deployer, names, cross-chain, age, exposure). Informational safety check, not legal or financial advice.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Counterparty address: EVM 0x + 40 hex, or a Solana base58 address",
                "type": "string"
              },
              "chain": {
                "description": "Chain of the payment (default base; a base58 address implies solana)",
                "enum": ["base", "ethereum", "polygon", "arbitrum", "solana"],
                "type": "string"
              },
              "intent": {
                "description": "What you are about to do (default pay): changes which signals matter, e.g. paying a token contract or approving an EOA",
                "enum": ["pay", "approve", "interact"],
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:05562156a927121a596629a187da8a338a46eff8f553f6d3e8165d7a4815d1ac"
        }
      ],
      "digest": "sha256:3499e881290950b314438d5f06c4e7c681ac25b1786db7d9769f3ac185562e78"
    }
  }
}
