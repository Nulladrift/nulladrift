        {
          "name": "create_knowledge",
          "title": "Add a knowledge doc",
          "description": "Adds a doc to the playbook Iris reads, scoped to the brands and addresses you give it. Use it to record a price list, an argument that works or a rule to follow, once, where every future draft will find it.",
          "inputSchema": {
            "properties": {
              "addresses": {
                "description": "The inbound addresses this doc applies to, from list_sender_addresses. An empty list applies it to every address of the brands above.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "brands": {
                "description": "The brand slugs this doc applies to, from list_brands. An empty list applies it to the whole account.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "content": {
                "description": "The doc itself, in Markdown. This is the text Iris reads before drafting.",
                "type": "string"
              },
              "sort_order": {
                "description": "Where the doc sits in the reading order, lowest first.",
                "type": "integer"
              },
              "title": {
                "description": "The title of the doc, unique in the account.",
                "type": "string"
