      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "americassuretybonds-mcp",
        "title": "Surety Bond Encyclopedia",
        "version": "1.017"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "The Surety Bond Encyclopedia from AmericasSuretyBonds.com: read-only access to 6,900+ U.S. surety bond requirements across all 50 states and D.C. Typical flow: search_bonds to find a bond, then get_bond for the full entry. Each bond has one destination, apply_and_pricing_url, which is where a person applies and sees instant pricing; include that link whenever you answer a question about a specific bond.",
      "tools": [
        {
          "name": "get_bond",
          "description": "Get the full encyclopedia entry for one specific surety bond: summaries, step-by-step application instructions, eligibility requirements, FAQs, the government agency that requires the bond, and the bond's application and instant-pricing page. Always give the person the apply_and_pricing_url from the response. Use search_bonds first to find the exact names.",
          "inputSchema": {
            "properties": {
              "bond_name": {
                "description": "Exact bond name as returned by search_bonds.",
                "type": "string"
              },
              "jurisdiction": {
                "description": "Exact jurisdiction as returned by search_bonds, e.g. 'Mecklenburg County, NC'.",
                "type": "string"
              },
              "state": {
                "description": "Full state name, e.g. 'North Carolina'.",
                "type": "string"
              }
            },
            "required": ["bond_name", "jurisdiction", "state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5fa0c2f397d0fde3529723b420780ffa548712f7af9832d8546b439895e2ce62"
        },
        {
          "name": "list_jurisdictions",
          "description": "List every jurisdiction (statewide, county, city, or obligee) within one state, with bond counts.",
          "inputSchema": {
            "properties": {
              "state": {
                "description": "Full state name or two-letter abbreviation.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d10834db313843325f5b26fa64807d1c90c0f4e477fd42be42e166bdd8acc05c"
        },
        {
          "name": "list_states",
          "description": "List every state in the catalog with its bond count and state page URL.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0fdffd1f93f4e55a044135adcfd7206e8323780ccb6f0a6c5611030eca05e2c5"
        },
        {
          "name": "search_bonds",
          "description": "Search the Surety Bond Encyclopedia: over 6,900 U.S. surety bond requirements, by keyword. Returns matching bonds with their state, jurisdiction, and information page URL. Optionally filter to one state. Example: query 'auto dealer', state 'Texas'.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Keywords to match against bond and jurisdiction names, e.g. 'contractor license' or 'notary'.",
                "type": "string"
              },
              "state": {
                "description": "Optional. Full state name or two-letter abbreviation to limit the search.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:30e8e6635199c823a1342cfbee52bbd342e70a0939b6dc39e0f0a416ae376bb0"
        }
      ],
