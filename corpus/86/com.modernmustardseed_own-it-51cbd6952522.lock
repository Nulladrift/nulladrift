{
  "lockfileVersion": 2,
  "subjects": {
    "com.modernmustardseed/own-it": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.modernmustardseed.com/own-it"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Own It by Modern Mustard Seed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Own It maps who controls a business’s web presence and how hard it would be to leave each vendor. audit_ownership reads the domain registry, public DNS and the homepage and returns the full ownership map with a portability score. check_domain_control covers only the domain, DNS and email. list_fingerprints shows every detection rule and its source. All tools are read-only and use public data.",
      "tools": [
        {
          "name": "audit_ownership",
          "title": "Audit who controls a business online",
          "description": "Map who controls each layer of a business’s web presence and how hard each would be to leave, from public data only: domain registration over RDAP (registrar, registrant when public, EPP status and transfer locks, expiry, DNSSEC), DNS host from the nameservers, website platform from public fingerprints (Wix, Squarespace, Shopify, WordPress, Webflow, GoDaddy Website Builder, Duda, HighLevel, Framer, agency and franchise builders and others), email provider from MX and SPF, analytics and ad tag IDs present in the page (GA4, Tag Manager, Google Ads, Meta Pixel and others), call tracking, embedded booking, CRM, chat and email signup tools, and profile links including a Google Business Profile when supplied. Returns an ownership map with, per layer, who controls it, a portability rating, a plain-words reason, evidence, sources and the first step to take control, plus a 0 to 100 portability score. It cannot see inside any account, so ownership of a Google Business Profile or tag account is reported as a check to make, never guessed. Results are cached for 24 hours.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business_name": {
                "description": "The business’s legal or trading name. When given, it is compared with the registrant shown in the public domain record.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "domain": {
                "description": "The business domain or website address, such as example.com or https://www.example.com/. Public names only.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              },
              "profile_urls": {
                "description": "Links to the business’s profiles, such as its Google Business Profile or Maps link, Facebook page, Instagram or Yelp page. They are classified, not fetched.",
                "items": {
                  "format": "uri",
                  "maxLength": 500,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Audit who controls a business online"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4d13e6c1c861ade2429598e48482b91e99f30b56add4a125bd22dc83a83e3326"
        },
        {
          "name": "check_domain_control",
          "title": "Check domain, DNS and email control",
          "description": "Check who controls a domain, its DNS and its email, without reading the website: registrar and IANA id, registrant when the public record shows one, EPP status codes and transfer locks, registration and expiry dates, DNSSEC, nameservers and DNS host, and mail provider from MX and SPF. Returns a 0 to 100 control score, each layer with a reason and the first step to take control, and the raw registration facts. Shares the 24 hour cache with audit_ownership.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business_name": {
                "description": "The business’s legal or trading name. When given, it is compared with the registrant shown in the public domain record.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "domain": {
                "description": "The business domain or website address, such as example.com or https://www.example.com/. Public names only.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check domain, DNS and email control"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:661d5f941f548ef9d0908106633190903a6f6a1fa2c36234b7f926c598f59fb9"
        },
        {
          "name": "list_fingerprints",
          "title": "List detection rules",
          "description": "List the rules Own It uses to name vendors: website platforms, hosts, agency builders and reseller registrars, DNS hosts, email providers, tag ID formats, call tracking, booking and CRM widgets, and profile sites, each with its public marker, portability rating and source. Without kind it returns counts per kind. Static reference, no network access.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "One kind of rule to list: website, hosting, agency, dns, email, tags, call_tracking, widgets or profiles.",
                "enum": ["website", "hosting", "agency", "dns", "email", "tags", "call_tracking", "widgets", "profiles"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List detection rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a0e64bfc069d206659ede8d23b72aefe9cd234ab2f8c1e5ec750d35424652947"
        }
      ],
      "digest": "sha256:a0c714e46ced9abfff232e68dcd604d1174b85f0caabe02905f4b5c60c052c4b"
    }
  }
}
