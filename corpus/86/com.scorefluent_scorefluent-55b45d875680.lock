              "taskType": {
                "type": "string"
              }
            },
            "required": ["answerUrl", "difficulty", "estimatedDurationSeconds", "exam", "pillar", "question", "questionId", "taskLabel", "taskType"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Practice question"
          },
          "behavior": {
            "destructive": false,
