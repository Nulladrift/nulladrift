                  "defaultTarget": {
                    "type": "number"
                  },
                  "max": {
                    "type": "number"
                  },
                  "min": {
                    "type": "number"
                  },
                  "step": {
                    "type": "number"
                  }
                },
                "required": ["defaultTarget", "max", "min"],
                "type": "object"
              },
              "scoredBy": {
                "enum": ["machine", "human"],
                "type": "string"
              },
              "sections": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "pillar": {
                      "type": ["string", "null"]
                    },
                    "questionCount": {
                      "type": "number"
                    },
                    "taskTypes": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "label": {
                            "type": "string"
                          },
                          "slug": {
                            "type": "string"
                          }
                        },
                        "required": ["label", "slug"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "timeLimitSeconds": {
                      "type": "number"
                    }
                  },
                  "required": ["label", "pillar", "questionCount", "taskTypes", "timeLimitSeconds"],
                  "type": "object"
                },
                "type": "array"
              },
              "speakingCriteria": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "criteria": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "label": {
                            "type": "string"
                          },
                          "max": {
                            "anyOf": [
                              {
                                "type": "number"
                              },
                              {
                                "const": "reference_words",
                                "type": "string"
                              }
                            ]
                          }
                        },
                        "required": ["label", "max"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "footnote": {
                      "type": "string"
                    },
                    "framing": {
                      "enum": ["official", "practice_estimate"],
                      "type": "string"
                    },
                    "taskLabel": {
                      "type": "string"
                    },
                    "taskType": {
                      "type": "string"
                    }
                  },
                  "required": ["criteria", "framing", "taskLabel", "taskType"],
                  "type": "object"
                },
                "type": "array"
              },
              "writingRubrics": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "criteria": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "label": {
                            "type": "string"
                          },
                          "max": {
                            "type": "number"
                          }
                        },
                        "required": ["label", "max"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "taskLabel": {
                      "type": "string"
                    },
                    "taskType": {
                      "type": "string"
                    },
                    "totalMax": {
                      "type": "number"
                    },
                    "wordMax": {
                      "type": "number"
                    },
                    "wordMin": {
                      "type": "number"
                    },
                    "zeroRule": {
                      "type": "string"
                    }
                  },
                  "required": ["criteria", "taskLabel", "taskType", "totalMax", "wordMax", "wordMin"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["exam", "label", "links", "scale", "sections", "speakingCriteria", "writingRubrics"],
            "type": "object"
          },
