        {
          "name": "score_writing",
          "title": "Score writing",
          "description": "Use this when a student pastes an essay or summary for a PTE, IELTS, TOEFL, LanguageCert, MET or CELPIP writing task and wants a score. Returns marks out of the exam task maximum, a score and one line of feedback for each marking criterion, and the top improvements. Pass the questionId from practice_question when the text answers one of our questions; otherwise pass the prompt the student wrote to. Pass exactly one of the two. Free up to a daily limit. This is the quick score: Personalised Tips on the site add sentence-level annotations and verified marks. When the student is signed in to ScoreFluent and the text answers one of our questions, the scored attempt is saved to their History.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "exam": {
                "description": "Exam id, e.g. \"pte\" or \"toefl\".",
                "enum": ["pte", "languagecert_academic", "toefl", "met", "celpip", "ielts", "ielts_general", "c1_advanced", "pte_core"],
                "type": "string"
              },
              "prompt": {
                "description": "The prompt the student wrote to, when the text does not answer one of our questions.",
                "maxLength": 1500,
                "type": "string"
              },
              "questionId": {
                "description": "The questionId returned by practice_question, when the text answers one of our questions.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "taskType": {
                "description": "Writing task-type slug, e.g. \"write-essay\" or \"summarize-written-text\". Call exam_overview to list the valid slugs.",
                "type": "string"
              },
              "text": {
                "description": "The student's essay or summary, exactly as they wrote it.",
                "maxLength": 5000,
                "minLength": 20,
                "type": "string"
              }
            },
            "required": ["exam", "taskType", "text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "criteria": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "feedback": {
                      "type": "string"
                    },
                    "key": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "max": {
                      "type": "number"
                    },
                    "score": {
                      "type": "number"
                    }
