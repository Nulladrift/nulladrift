        {
          "name": "check_read_aloud",
          "title": "Check a Read Aloud transcript",
          "description": "Use when a student has read a Read Aloud passage aloud and you have the transcript of what they said (for example from voice mode) but no audio. Compares the words said against the passage: omitted, inserted and substituted words and a word-accuracy percentage. CONTENT ONLY — pronunciation, fluency and prosody need a recording: offer speak_practice or the answer link for those.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "questionId": {
                "description": "The questionId returned by speak_practice or practice_question for a Read Aloud passage.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "transcript": {
                "description": "What the student said, as text.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["questionId", "transcript"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "accuracy": {
                "type": "number"
              },
              "answerUrl": {
                "type": "string"
              },
              "inserted": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "matched": {
                "type": "number"
              },
              "omitted": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "passageWordCount": {
                "type": "number"
              },
              "questionId": {
                "type": "string"
              },
              "saidWordCount": {
                "type": "number"
              },
              "scope": {
                "const": "content-only",
                "type": "string"
              },
              "substituted": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "expected": {
                      "type": "string"
                    },
                    "said": {
                      "type": "string"
                    }
                  },
                  "required": ["expected", "said"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["accuracy", "answerUrl", "inserted", "matched", "omitted", "passageWordCount", "questionId", "saidWordCount", "scope", "substituted"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a Read Aloud transcript"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:815700e4a1b92a8599bb707bd088764dbb1bd78b7c62b8bdfb2f8cb80000988f"
        },
        {
          "name": "exam_overview",
          "title": "Exam overview",
          "description": "Use this when a student asks what an English exam contains, how a task type is scored, how long a section is, what the score scale is, or where to start preparing. Returns the exam sections with task types, question counts and time limits, the writing and speaking scoring criteria (writing with word limits), and links to ScoreFluent guides. Do not use this to score or mark a student's answer; it only describes the exam.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "exam": {
                "description": "Exam id, e.g. \"pte\", \"toefl\", \"ielts\", \"languagecert_academic\".",
                "enum": ["pte", "languagecert_academic", "toefl", "met", "celpip", "ielts", "ielts_general", "c1_advanced", "pte_core"],
                "type": "string"
              },
              "taskType": {
                "description": "Optional task-type slug (e.g. \"write-essay\") to narrow the answer to one task.",
                "type": "string"
              }
            },
            "required": ["exam"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "exam": {
                "type": "string"
              },
              "label": {
                "type": "string"
              },
              "links": {
                "additionalProperties": false,
                "properties": {
                  "examHub": {
                    "type": "string"
