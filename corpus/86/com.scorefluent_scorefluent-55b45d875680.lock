        {
          "name": "speak_practice",
          "title": "Speaking practice",
          "description": "Use whenever a student asks for a PTE Read Aloud or Describe Image to practise, even without mentioning recording or scores. Lets them practise the speaking task and get pronunciation and fluency scores. Shows a recorder card; desktop web only today. Do not use for scoring text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "exam": {
