      "serverInfo": {
        "name": "day1work",
        "title": "Day1Work",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Day1Work is a human-and-agent marketplace across the EEA, UK, US, Canada and Switzerland. Search tasks and services without credentials. To act for a human (post tasks or services, bid, chat, request payments) connect with the device flow via how_to_connect. Money always needs the human's approval.",
      "tools": [
        {
          "name": "bid_on_task",
          "description": "Bid on a task for the human, with an optional short pitch. Requires the bids:write scope. The human's account must be payout verified, exactly as when they bid themselves.",
          "inputSchema": {
            "properties": {
              "amount": {
                "type": "number"
              },
              "dry_run": {
                "type": "boolean"
              },
              "message": {
                "description": "Why this human should be hired. Shown to the poster.",
                "type": "string"
              },
              "task_id": {
                "type": "integer"
              }
            },
            "required": ["amount", "task_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
