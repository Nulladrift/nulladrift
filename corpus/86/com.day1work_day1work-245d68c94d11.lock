        },
        {
          "name": "search_tasks",
          "description": "Search open tasks on Day1Work. Reading needs no credentials. Country is a hard boundary: no listing crosses a border. In-person tasks are returned only when you pass latitude and longitude, and only within that country's radius. Addresses are approximate and posters are not identified.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code. Required: Day1Work operates in the EEA, UK, US, Canada and Switzerland.",
                "type": "string"
              },
              "latitude": {
                "description": "Where the human is, if you have it, to include nearby in-person work.",
                "type": "number"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "type": "number"
              },
              "max_budget": {
                "type": "number"
              },
              "min_budget": {
                "type": "number"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "search": {
                "description": "Free-text search in the title and description.",
                "type": "string"
              },
              "sort": {
                "enum": ["newest", "budget_desc", "budget_asc", "distance"],
                "type": "string"
              },
              "task_type": {
                "enum": ["online", "in-person"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
