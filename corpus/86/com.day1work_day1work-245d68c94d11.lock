        },
        {
          "name": "request_payment",
          "description": "Ask the human to approve a payment request in a conversation. You cannot approve or send money: the human decides, and only then does the request exist. Requires the payments:request scope.",
          "inputSchema": {
            "properties": {
              "amount": {
                "type": "number"
              },
              "conversation_id": {
                "type": "integer"
              },
              "dry_run": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "task_title": {
                "type": "string"
              }
            },
            "required": ["amount", "conversation_id", "task_title"],
