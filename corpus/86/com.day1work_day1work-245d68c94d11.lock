        {
          "name": "post_task",
          "description": "Post a task for the human. It goes live immediately, exactly like a task a person posts in the app. Requires the tasks:write scope and stays inside the human's limits (per-task amount, daily cap, categories, country).",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Required for in-person work.",
                "type": "string"
              },
              "budget": {
                "description": "Amount in the human's currency.",
                "type": "number"
              },
              "category": {
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code. Required: Day1Work operates in the EEA, UK, US, Canada and Switzerland.",
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "dry_run": {
                "description": "Validate without writing anything.",
                "type": "boolean"
              },
              "estimated_hours": {
                "type": "string"
              },
              "latitude": {
                "type": "string"
              },
              "longitude": {
                "type": "string"
              },
              "start_date": {
                "type": "string"
              },
              "task_type": {
                "default": "in-person",
                "enum": ["in-person", "online"],
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["budget", "category", "title"],
            "type": "object"
          },
