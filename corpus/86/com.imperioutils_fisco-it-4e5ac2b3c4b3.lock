      "instructions": "Imperio Utilities: FREE infrastructure for agents and integrators on Italian tax — deterministic, verified tools (algorithms and official sources, no LLM inference in the calculations). The MCP tools come in TWO groups, with different permissions. (1) 23 Italian tax tools (Codice Fiscale, Partita IVA, IBAN, CAP, PEC, ATECO, VAT/IVA, IMU, forfettario, F24, FatturaPA, Intrastat, NIS2) plus anti-fraud supplier verification (IBAN + VIES): free (€0) and no login. (2) 5 guardian_* tools (the ledger of monitored suppliers): they cost no credits, but REQUIRE an API key in the X-API-Key header — get one free at https://imperioutils.com/signup; it also raises the per-minute limit. The tax tools are deterministic; supplier verification uses live VIES (openWorldHint) and degrades honestly when unavailable. Use tools/list for each tool schema: the description of every guardian tool states that the key is required. Integrating Imperio into a product, missing a tool, or a result looks wrong? Write to support@imperioutils.com: we read it and, if we are wrong, we fix it. Documentation: https://imperioutils.com/en/mcp",
      "tools": [
        {
          "name": "calc_forfettario",
          "title": "Regime Forfettario calculator",
          "description": "Computes the substitute tax and INPS contributions of the Italian regime forfettario (flat-rate scheme) from turnover. With `ateco` or `coefficiente`: the exact calculation, with deadlines and advance payments. With `ricavi` only: a TABLE with the calculation for each statutory profitability coefficient (`modalita: 'tabella_per_coefficiente'`, field `scenari`), because the coefficient depends on the activity and has no default. Field `soglia_ricavi` states whether the regime applies (`fascia`: entro_limite = within €85,000; uscita_anno_successivo = above €85,000 up to €100,000, valid this year, exit next year; uscita_immediata = above €100,000, the regime ceases this year and `calcolo_valido_anno_corrente` is false: the amounts do not apply). Free (€0), deterministic, no login required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ateco": {
                "description": "ATECO code from which the profitability coefficient is derived. ALTERNATIVE to `coefficiente`. With neither, the response is the per-coefficient table, not the exact calculation.",
                "maxLength": 12,
                "pattern": "^[0-9.]{1,12}$",
                "type": "string"
              },
              "codice_ateco": {
                "description": "Alias of `ateco` (ATECO activity code): the same value, accepted because other tools of this server use this name. If you send both names, the values must match.",
                "maxLength": 12,
                "pattern": "^[0-9.]{1,12}$",
                "type": "string"
              },
              "coefficiente": {
                "description": "Profitability coefficient in % (manual override). ALTERNATIVE to `ateco`. With neither, the response is the per-coefficient table.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "contributi_cassa_privata": {
                "description": "Private professional fund contributions already paid, in euro (optional).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "gestione_inps": {
                "description": "INPS pension scheme or professional fund (optional).",
                "enum": ["gestione_separata", "artigiani", "commercianti", "cassa_privata"],
                "type": "string"
              },
              "ricavi": {
                "description": "Annual revenue/fees in euro.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "riduzione_35": {
                "default": false,
                "description": "35% INPS contribution reduction (artisans/traders).",
                "type": "boolean"
              },
              "startup": {
                "default": false,
                "description": "Reduced 5% rate for new businesses: applies to the starting year and the following four (default false → 15%). It does not change the advance payments: none are due in the first year of activity, and the response notes say so.",
                "type": "boolean"
              }
            },
            "required": ["ricavi"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Regime Forfettario calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:54674976262a8e0b8ec27d6973a6b9507f80b1f12fa9bd938e4055ae448e5ffb"
        },
        {
          "name": "calc_imu",
          "title": "Calculate IMU",
          "description": "Computes Italian IMU property tax (L.160/2019) for buildings (from cadastral income + category), agricultural land (from reddito dominicale) and building land (from market value), with first/second instalment. The rate (‰) is the one set by the municipality: pass it (`aliquota_permille`) OR pass the `comune` (cadastral code or name) and the server uses the rate from its prospetto published by the MEF, with its legal status (prospetto of the year · previous year, L.160/2019 c.767 · base rates) and the source in `aliquota_comune`. If the prospetto has not been read yet, or the municipality has no IMU (Trento, Bolzano, Friuli Venezia Giulia), it answers `calcolato: false` with the explanation, without an amount. Free (€0), deterministic, no login required.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "not": {
                    "required": ["comune"]
                  }
                },
                "then": {
                  "required": ["aliquota_permille"]
                }
              }
            ],
            "anyOf": [
              {
                "required": ["rendita_catastale"]
              },
              {
                "properties": {
                  "tipo_immobile": {
                    "const": "terreno_agricolo"
                  }
                },
                "required": ["reddito_dominicale", "tipo_immobile"]
              },
              {
                "properties": {
                  "tipo_immobile": {
                    "const": "area_edificabile"
                  }
                },
                "required": ["tipo_immobile", "valore_venale"]
              },
              {
                "properties": {
                  "coltivatore_diretto_iap": {
                    "const": true
                  },
                  "tipo_immobile": {
                    "const": "terreno_agricolo"
                  }
                },
                "required": ["coltivatore_diretto_iap", "tipo_immobile"]
              },
              {
                "properties": {
                  "esente_montano_isola": {
                    "const": true
                  },
                  "tipo_immobile": {
                    "const": "terreno_agricolo"
                  }
                },
                "required": ["esente_montano_isola", "tipo_immobile"]
              }
            ],
            "properties": {
              "aliquota_permille": {
                "description": "Rate set by the municipality, per thousand (e.g. 8.6 for 8.6‰). REQUIRED if you do not pass `comune`; with both, this one wins, and the response says whether it differs from the prospetto.",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              },
              "anno": {
                "description": "Tax year of the per-municipality verdict (default the current year). Only with `comune`.",
                "maximum": 2100,
                "minimum": 2025,
                "type": "integer"
              },
              "categoria_catastale": {
                "description": "Buildings only: cadastral category as on the visura, without the slash (A/2 → `A2`, C/1 → `C1`). It sets the multiplier and, for `abitazione_principale_A1_A8_A9`, whether the tax is due (only A1, A8, A9) or the home is exempt. `A` without a number applies to dwellings when the number is unknown; if missing, it is computed as `A` and the response says so. Not used with `terreno_agricolo` and `area_edificabile`.",
                "enum": ["A", "A1", "A2", "A3", "A4", "A5", "A6", "A7", "A8", "A9", "A11", "A10", "B", "C1", "C2_C6_C7", "C3_C4_C5", "D", "D5", "E", "F"],
                "type": "string"
              },
              "coltivatore_diretto_iap": {
                "description": "Land: coltivatore diretto/IAP farmer enrolled in agricultural social security → exempt.",
                "type": "boolean"
              },
              "comune": {
                "description": "Cadastral code (e.g. B519) or name of the municipality. The rate becomes the one in its IMU prospetto published by the MEF for the year (or, by law, the previous year's or the base rate).",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "detrazione": {
                "description": "Deduction in euro (buildings only; e.g. 200 for a luxury main residence).",
                "minimum": 0,
                "type": "number"
              },
              "esente_montano_isola": {
                "description": "Land: in a mountain/hill municipality or minor island → exempt.",
                "type": "boolean"
              },
              "ex_comune": {
                "description": "Only merged municipalities with differentiated rates: the former municipality where the property is. If needed and missing, the response lists the possible ones.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "mese_fine": {
                "description": "Last month of ownership counted (12 = December). Default 12.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "mese_inizio": {
                "description": "First month of ownership counted (1 = January; a month counts if owned for more than half its days). With mese_fine the June instalment becomes the tax for the first half-year (L. 160/2019 c. 762). Default 1.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "mesi_possesso": {
                "description": "Months of ownership in the year (default 12). With partial ownership it does not say WHICH months: to split the first and second instalment use mese_inizio/mese_fine.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "provincia": {
                "description": "Province code, for municipalities with the same name (e.g. TO). Only with `comune`.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "quota_possesso_pct": {
                "description": "Ownership share in % (default 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "reddito_dominicale": {
                "description": "Agricultural land: reddito dominicale from the visura (base = ×1.25×135). REQUIRED with `tipo_immobile: terreno_agricolo`, except when the land is exempt (see the two flags).",
                "minimum": 0.01,
                "type": "number"
              },
              "rendita_catastale": {
                "description": "Buildings: annual cadastral income (rendita catastale) in euro (from the visura). REQUIRED for all types other than `terreno_agricolo` and `area_edificabile` — i.e. also for the default type `abitazione_non_principale`.",
                "minimum": 0.01,
                "type": "number"
              },
              "tipo_immobile": {
                "description": "Property type → selects the formula (default abitazione_non_principale).",
                "enum": ["abitazione_principale_A1_A8_A9", "abitazione_non_principale", "immobile_produttivo", "immobile_locato_canone_concordato", "comodato_uso_parenti", "terreno_agricolo", "area_edificabile"],
                "type": "string"
              },
              "valore_venale": {
                "description": "Building land: market value as of 1 January (€). REQUIRED with `tipo_immobile: area_edificabile`.",
                "minimum": 0.01,
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate IMU"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4bf185220deb7a34258838987a248e79b3e4c1aeac79841a6cc97a9dde00a2d7"
        },
        {
          "name": "calc_iva",
          "title": "Calculate IVA (VAT)",
          "description": "Computes Italian IVA (VAT) on a taxable amount (rates 22/10/5/4/0/exempt/out of scope), with optional withholding tax (self-employed 20%, agents 11.5%), and decides the TERRITORIALITY of cross-border transactions: goods or services, business or consumer, EU or non-EU → taxable in Italy, non-taxable, out of scope or VAT of the destination country (official TEDB standard rate of the 27 Member States), with FatturaPA Natura code, invoice wording and legal reference. EU €10,000 threshold not declared → two scenarios computed, never a number chosen on your behalf. Cited laws follow the transaction date: DPR 633/72 until 31/12/2026, Testo unico IVA from 1/1/2027. Handles the TWO taxable bases of a professional's invoice (professional fund contribution only in the VAT base, INPS recharge in both). Free (€0), deterministic, no login required.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "properties": {
                  "tipo_operazione": {
                    "enum": ["b2b", "b2c", "PA"]
                  }
                }
              },
              {
                "properties": {
                  "oggetto": {
                    "const": "beni"
                  },
                  "tipo_operazione": {
                    "const": "extraUE"
                  }
                },
                "required": ["tipo_operazione"]
              },
              {
                "properties": {
                  "cessionario_soggetto_iva": {
                    "type": "boolean"
                  },
                  "oggetto": {
                    "const": "servizi"
                  },
                  "tipo_operazione": {
                    "const": "extraUE"
                  }
                },
                "required": ["cessionario_soggetto_iva", "oggetto", "tipo_operazione"]
              },
              {
                "properties": {
                  "cessionario_soggetto_iva": {
                    "const": true
                  },
                  "tipo_operazione": {
                    "const": "intraUE"
                  }
                },
                "required": ["cessionario_soggetto_iva", "tipo_operazione"]
              },
              {
                "properties": {
                  "cessionario_soggetto_iva": {
                    "const": false
                  },
                  "oggetto": {
                    "enum": ["beni", "servizi"]
                  },
                  "tipo_operazione": {
                    "const": "intraUE"
                  }
                },
                "required": ["cessionario_soggetto_iva", "oggetto", "tipo_operazione"]
              }
            ],
            "properties": {
              "aliquota_destinazione_pct": {
                "description": "Rate of the destination country, if the goods have a REDUCED rate there. Without it, the official standard rate (TEDB) is used and the response says so.",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "aliquota_iva": {
                "description": "VAT rate (default 22).",
                "enum": ["22", "10", "5", "4", "0", "esente", "fuori_campo"],
                "type": "string"
              },
              "cessionario_soggetto_iva": {
                "description": "REQUIRED for tipo_operazione='intraUE' (and for extraUE with oggetto='servizi'). true = taxable person with a VAT number valid in VIES: goods non-taxable (N3.2), services out of scope (N2.1). false = private consumer: the VAT is Italian or of the destination country depending on `oggetto`, `vendita_a_distanza`, `soglia_ue_superata` and `tipo_servizio`.",
                "type": "boolean"
              },
              "con_ritenuta": {
                "description": "Apply withholding tax (default false).",
                "type": "boolean"
              },
              "contributo_integrativo_pct": {
                "description": "Rate % of the professional fund's integrative contribution (default 0 = no fund). Typically 4; 5 for surveyors (geometri); 2 for ENPAP/ENPAV — read it from the fund's rules: the tool does not infer it from ATECO. It enters the VAT base but NOT the withholding base.",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "data_operazione": {
                "description": "YYYY-MM-DD, default today. It decides the cited law: DPR 633/72 and DL 331/93 until 31/12/2026, Testo unico IVA (D.Lgs. 10/2026) from 1/1/2027.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "imponibile": {
                "description": "Fee/consideration in EUR (e.g. 1000), NET of the professional fund contribution and of the INPS recharge: those are added with the two dedicated fields.",
                "maximum": 1000000000000,
                "minimum": 0.01,
                "type": "number"
              },
              "oggetto": {
                "description": "For intraUE/extraUE. It changes the regime: intra-EU B2B supply of goods = non-taxable (N3.2, «operazione non imponibile»); B2B services = out of scope (N2.1, «inversione contabile»). Required towards an EU consumer.",
                "enum": ["beni", "servizi"],
                "type": "string"
              },
              "paese_destinazione": {
                "description": "ISO2 of the customer's country ('EL' Greece; 'XI' Northern Ireland = EU for goods only). Used for the destination rate above the threshold.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "rivalsa_inps_pct": {
                "description": "Rate % of the INPS gestione separata recharge billed on the invoice (default 0). By law 4 (art. 1 c. 212 L. 662/1996). It enters BOTH bases.",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "servizio_7_septies": {
                "description": "Services to a non-EU consumer: true if the service is one of those in art. 7-septies (consulting, advertising, data, financial, staff, hire of movable goods…): out of scope.",
                "type": "boolean"
              },
              "soglia_ue_superata": {
                "description": "Distance sales and electronic services to EU consumers: true if distance sales + TBE services to EU consumers exceeded €10,000 (previous or current year) OR if you opted for destination VAT. If you do not declare it you get TWO computed scenarios and `iva_importo: null`.",
                "type": "boolean"
              },
              "tipo_operazione": {
                "description": "Transaction type (default b2b). intraUE REQUIRES `cessionario_soggetto_iva`; towards an EU consumer it also requires `oggetto`. extraUE without `oggetto` is treated as an export of goods (stated in `presupposti`); for services declare `oggetto` and `cessionario_soggetto_iva`: towards a non-EU consumer the VAT is as a rule Italian.",
                "enum": ["b2b", "b2c", "intraUE", "extraUE", "PA"],
                "type": "string"
              },
              "tipo_ritenuta": {
                "description": "Withholding type if con_ritenuta=true (autonomo 20% | agente 11.5%).",
                "enum": ["autonomo", "agente"],
                "type": "string"
              },
              "tipo_servizio": {
                "description": "For oggetto='servizi'. generico = general rule (default assumed, and stated); elettronico = telecommunications, broadcasting, electronic services; speciale = real estate, transport, catering, events, vehicle hire, intermediation, work on movable goods — the tool does NOT compute the place of supply and says so, citing the laws.",
                "enum": ["generico", "elettronico", "speciale"],
                "type": "string"
              },
              "vendita_a_distanza": {
                "description": "Goods to an EU consumer: true if transport is by or on behalf of the seller (default assumed true, and stated). false = the customer transports them → Italian VAT.",
                "type": "boolean"
              }
            },
            "required": ["imponibile"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate IVA (VAT)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b573234e63a88e05eb14bc6088d7a3522482ae039d0de3ec5f59879d7f375ab"
        },
        {
          "name": "calc_reverse_charge",
          "title": "Reverse charge (inversione contabile)",
          "description": "Computes the VAT the BUYER (cessionario) must self-assess under the Italian reverse charge and returns both parties' obligations with the applicable law. It separates the three cases most often confused: INTRA-EU reverse charge (non-IT EU supplier — art. 46 DL 331/93 for goods, art. 17 c. 2 DPR 633/72 for services: with 'oggetto' it also says how the supplier invoices and which integration document is needed), DOMESTIC reverse charge (Italian supplier — art. 17 c. 6, which is NOT general: it applies only in listed sectors such as construction subcontracting, scrap, building cleaning, electronics) and non-EU country (explicit error, not an implicit branch). Free (€0), deterministic, no login required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aliquota_iva": {
                "description": "VAT rate to self-assess (default 22).",
                "enum": ["22", "10", "5", "4", "0", "esente", "fuori_campo"],
                "type": "string"
              },
              "imponibile": {
                "description": "Taxable amount of the invoice in EUR.",
                "maximum": 1000000000000,
                "minimum": 0.01,
                "type": "number"
              },
              "oggetto": {
                "description": "intraUE only: 'beni' (goods) or 'servizi' (services). For goods the EU supplier invoices an exempt intra-EU supply (integration TD18); for services «inversione contabile» (TD17). If missing, the response gives both cases in `per_oggetto`.",
                "enum": ["beni", "servizi"],
                "type": "string"
              },
              "paese_cedente": {
                "description": "ISO2 code of the SUPPLIER's (cedente) country: an EU Member State (e.g. DE, FR, ES; 'EL' or 'GR' for Greece; 'XI' for Northern Ireland) for the intra-EU reverse charge, or 'IT' for the domestic one.",
                "maxLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["imponibile", "paese_cedente"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Reverse charge (inversione contabile)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f9cf15ab3c4de2da48f9210bdc556fa3494cbe799e6e581c86f8a321e0f3f28"
