        {
          "name": "nis2_ambito",
          "title": "NIS2: scope and entity category",
          "description": "Tells whether an entity falls within the scope of Italian D.Lgs. 138/2024 (NIS2) and whether it is an ESSENTIAL or IMPORTANT entity, citing ARTICLE AND PARAGRAPH for every step of the reasoning. When a datum that would change the answer is missing it returns `esito: \"indeterminato\"` (undetermined) and the QUESTION to ask, instead of an invented answer. `in_ambito` answers the scope question on its own: true (in scope — with `esito: \"indeterminato\"` only the category is still open), false (out), null (scope itself undetermined). The rules most often got wrong, all applied here: (1) the ENTRY threshold is that of the SMALL enterprise, not the medium one — an entity is in with headcount >= 50 OR (turnover > €10M AND balance sheet > €10M) — so the scope is much wider than usually described; (2) exceeding a ceiling requires headcount above threshold OR BOTH financial values above threshold: 30 employees with €12M turnover and €8M balance sheet is still SMALL, so OUT; (3) art. 3 §4 of Recommendation 2003/361/EC is DISAPPLIED (art. 3 c. 3): a public shareholding of 25% or more does not remove SME status; (4) an annex II entity is NEVER essential by size — art. 6 c. 1 lett. a) cites only annex I — not even with thousands of employees. It registers nothing with the ACN (Italian national cybersecurity agency): it is the pre-flight of the declaration, whose preliminary assessment is performed automatically by the ACN platform (art. 11 c. 6 of ACN determination 314287/2026); inclusion or not in the list of NIS entities is then notified by the ACN (art. 15 c. 3 of the determination). Indicative, not legal advice. Free (€0), deterministic, no login required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bilancio_eur": {
                "description": "Annual balance sheet total in euro.",
                "minimum": 0,
                "type": "number"
              },
              "criteri_impresa_collegata": {
                "description": "Letters of art. 3 c. 10 met when the entity is a linked enterprise of an essential or important entity: a) dominant influence over decisions on risk-management measures; b) holds or operates the systems on which the service provision depends; c) performs its cybersecurity operations; d) provides it with ICT or security services. Even a single letter brings it in scope regardless of size.",
                "items": {
                  "enum": ["a", "b", "c", "d"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "dati_consolidati": {
                "description": "true if the size values provided are ALREADY consolidated at group level.",
                "type": "boolean"
              },
              "fatturato_eur": {
                "description": "Annual turnover in euro.",
                "minimum": 0,
                "type": "number"
              },
              "impresa_autonoma": {
                "description": "false if the entity has linked or partner enterprises: art. 3 c. 4 then requires consolidation under art. 6 §2 of the Recommendation. Omit it if you do not know — the tool asks. An exceedance already visible on individual data stays valid (consolidation can only increase the values); a NON-exceedance does not.",
                "type": "boolean"
              },
              "individuato_da_acn": {
                "description": "true if the national NIS competent authority has notified the identification (art. 3 c. 13). For annex IV it is THE scope condition: without it, scope cannot be self-assessed and the tool says so instead of guessing.",
                "type": "boolean"
              },
              "occupati": {
                "description": "Headcount (annual work units).",
                "minimum": 0,
                "type": "integer"
              },
              "prestatore_fiduciario_qualificato": {
                "description": "Only for trust service providers: QUALIFIED ones are essential regardless of size (art. 6 c. 1 lett. d), non-qualified ones are not.",
                "type": "boolean"
              },
              "soggetto_critico_cer": {
                "description": "true if the entity is identified as a critical entity under the decree that transposes Directive (EU) 2022/2557 (CER): it is in scope and ESSENTIAL regardless of size (art. 3 c. 5 lett. a; art. 6 c. 1 lett. b).",
                "type": "boolean"
              },
              "tipologia_id": {
                "description": "Entity type id from the official list — get it with `nis2_tipologie`. E.g. 'I.1.a.1' (electricity undertaking), 'III.a.2' (Ministries). It is NOT an ATECO code.",
                "maxLength": 32,
                "type": "string"
              }
            },
