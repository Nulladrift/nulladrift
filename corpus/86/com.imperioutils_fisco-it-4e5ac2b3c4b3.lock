        {
          "name": "calc_split_payment",
          "title": "Split payment (scissione dei pagamenti)",
          "description": "Computes the split payment (scissione dei pagamenti) for supplies to the Italian Public Administration (art. 17-ter DPR 633/72): the supplier invoices taxable amount + VAT but collects from the PA ONLY the taxable amount, while the PA pays the VAT directly to the Treasury. Returns the two amounts separately, the cash-flow impact for the supplier and the FatturaPA instructions (EsigibilitaIVA=S; the N6 Natura codes are NOT used, they belong to the reverse charge only). It does NOT apply to self-employed fee invoices with withholding tax (art. 17-ter c. 1-sexies): for a professional use calc_iva with con_ritenuta. Free (€0), deterministic, no login required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aliquota_iva": {
                "description": "VAT rate shown on the invoice (default 22).",
                "enum": ["22", "10", "5", "4", "0", "esente", "fuori_campo"],
                "type": "string"
              },
              "imponibile": {
                "description": "Taxable amount of the supply to the PA in EUR.",
                "maximum": 1000000000000,
                "minimum": 0.01,
                "type": "number"
              }
            },
            "required": ["imponibile"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Split payment (scissione dei pagamenti)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de50b09494c194d6565dc4daba2af4ebdc5a2434575840a7c805c35bb133b0e5"
        },
        {
          "name": "compose_f24",
          "title": "Pre-filled F24 (Erario / INPS / IMU lines)",
          "description": "Composes the LINES of the Italian F24 payment form (Erario, INPS, IMU sections) with the official tax codes and causali, starting from amounts already computed (code meanings below are the Italian labels the tool returns): substitute tax and contributions of the regime forfettario (codici tributo 1790 = acconto prima rata, 1791 = acconto seconda rata o unica soluzione, 1792 = saldo; causali INPS PXX = Gestione Separata senza altra copertura, AF = artigiani sul minimale, AP = artigiani sull'eccedenza, CF = commercianti sul minimale, CP = commercianti sull'eccedenza) or IMU (3912 = abitazione principale e pertinenze (A/1, A/8, A/9), 3918 = altri fabbricati, 3914 = terreni, 3916 = aree fabbricabili; for group D 3925 = quota Stato (7,6‰) and 3930 = incremento Comune; with the municipality's cadastral code) or the STAMP DUTY (imposta di bollo) on the e-invoices of a quarter (2521 = primo trimestre, 2522 = secondo trimestre, 2523 = terzo trimestre, 2524 = quarto trimestre; deadlines 31/05 · 30/09 · 30/11 · 28/02, with the deferral rule below €5,000). For the forfettario the response also carries `regola_acconti`: the two 50% instalments apply to businesses whose activity has approved ISA (also in the forfettario), otherwise 40% and 60% — with the law and the calculation base. Returns structured lines (section, code, year, amount, indicative deadline) + a text rendering. COMPOSABLE: the typical input is the output of `calc_forfettario` (imposta_sostitutiva.importo, contributi_inps), `calc_imu` (imu_dovuta, acconto_giugno, saldo_dicembre) and `parse_fatturapa` (how many invoices have `bollo_analisi.dovuto = true`). It does NOT generate the official F24 form — neither PDF nor official facsimile: it is an INDICATIVE compilation that does not replace the accountant or checking with the Agenzia delle Entrate. Free (€0), deterministic, no login required.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "properties": {
                    "kind": {
                      "const": "forfettario"
                    }
                  },
                  "required": ["kind"]
                },
                "then": {
                  "required": ["forfettario"]
                }
              },
              {
                "if": {
                  "properties": {
                    "kind": {
                      "const": "imu"
                    }
                  },
                  "required": ["kind"]
                },
                "then": {
                  "required": ["imu"]
                }
              },
              {
                "if": {
                  "properties": {
                    "kind": {
                      "const": "bollo"
                    }
                  },
                  "required": ["kind"]
                },
                "then": {
                  "required": ["bollo"]
                }
              }
            ],
            "properties": {
              "bollo": {
                "additionalProperties": false,
                "anyOf": [
                  {
                    "required": ["numero_fatture"]
                  },
                  {
                    "required": ["importo"]
                  }
                ],
                "description": "Required when kind='bollo'. Closes the chain parse → stamp duty → F24: count how many invoices of the quarter are subject to stamp duty according to `parse_fatturapa` (field `bollo_analisi.dovuto` of each invoice) and compose the payment line.",
                "properties": {
                  "anno": {
                    "description": "Year of the invoices (e.g. 2026). NB: the 4th quarter is paid by 28 February of the FOLLOWING year.",
                    "maximum": 2100,
                    "minimum": 2019,
                    "type": "integer"
                  },
                  "importo": {
                    "description": "Stamp duty amount already computed, in euro. Alternative to `numero_fatture`. If you pass both and they do not match, this one wins and the discrepancy is reported in a note.",
                    "maximum": 10000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "importo_trimestri_precedenti": {
                    "description": "Stamp duty already due for the previous quarters of the same year (default 0). Used by the deferral rule, which looks at the CUMULATIVE amount: below €5,000 the 1st-quarter payment can move to 30/09 and that of 1st+2nd to 30/11 (art. 3 DL 73/2022). The 3rd and 4th quarter can never be deferred.",
                    "maximum": 10000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "numero_fatture": {
                    "description": "How many invoices of the quarter are subject to stamp duty (€2.00 each). Alternative to `importo`: provide at least one of the two.",
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "trimestre": {
                    "description": "Calendar quarter (1-4). It sets the codice tributo: 2521 = primo trimestre, 2522 = secondo trimestre, 2523 = terzo trimestre, 2524 = quarto trimestre.",
                    "maximum": 4,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["anno", "trimestre"],
                "type": "object"
              },
              "forfettario": {
                "additionalProperties": false,
                "description": "Required when kind='forfettario'. Fields from the output of calc_forfettario.",
                "properties": {
                  "anno": {
                    "description": "Reference tax year (e.g. 2026).",
                    "maximum": 2100,
                    "minimum": 2015,
                    "type": "integer"
                  },
                  "gestione_inps": {
                    "description": "Pension scheme (default gestione_separata) — it sets the causali INPS (PXX = Gestione Separata senza altra copertura; AF = artigiani sul minimale, AP = artigiani sull'eccedenza; CF = commercianti sul minimale, CP = commercianti sull'eccedenza). With cassa_privata there is no INPS line: those contributions are not paid via F24.",
                    "enum": ["gestione_separata", "artigiani", "commercianti", "cassa_privata"],
                    "type": "string"
                  },
                  "imposta": {
                    "description": "Substitute tax due in euro — calc_forfettario → imposta_sostitutiva.importo.",
                    "maximum": 10000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "inps_fisso": {
                    "description": "INPS contributions on the minimum/fixed part in euro — calc_forfettario → contributi_inps.fisso.",
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "inps_totale": {
                    "description": "Total INPS contributions in euro — calc_forfettario → contributi_inps.importo. Used only if fisso/variabile are not provided.",
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "inps_variabile": {
                    "description": "INPS contributions on the excess in euro — calc_forfettario → contributi_inps.variabile.",
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "startup": {
                    "default": false,
                    "description": "First year of activity: no advance payments, only the balance is paid. It is not the 5% rate (which lasts five years): here the tax arrives already computed.",
                    "type": "boolean"
                  }
                },
                "required": ["anno", "imposta"],
                "type": "object"
              },
              "imu": {
                "additionalProperties": false,
                "description": "Required when kind='imu'. Fields from the output of calc_imu.",
                "properties": {
                  "acconto": {
                    "description": "June instalment in euro — calc_imu → acconto_giugno.",
                    "maximum": 10000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "aliquota_permille": {
                    "description": "Rate set by the municipality, per thousand — calc_imu → parametri.aliquota_permille. Used for the group D split (7.6‰ State + municipal excess).",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "number"
                  },
                  "anno": {
                    "description": "Reference tax year (e.g. 2026).",
                    "maximum": 2100,
                    "minimum": 2012,
                    "type": "integer"
                  },
                  "base_imponibile": {
                    "description": "Taxable base in euro — calc_imu → base_imponibile. Used for the group D split.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "categoria_catastale": {
                    "description": "Cadastral category (default A) — calc_imu → parametri.categoria_catastale.",
                    "enum": ["A", "A10", "B", "C1", "C2_C6_C7", "C3_C4_C5", "D", "D5", "E", "F"],
                    "type": "string"
                  },
                  "codice_comune": {
                    "description": "Cadastral/Belfiore code of the municipality = F24 codice ente (1 letter + 3 digits, e.g. H501 for Rome).",
                    "maxLength": 4,
                    "pattern": "^[A-Za-z][0-9]{3}$",
                    "type": "string"
                  },
                  "imu_dovuta": {
                    "description": "Annual IMU due in euro — calc_imu → imu_dovuta.",
                    "maximum": 10000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "saldo": {
                    "description": "December balance in euro — calc_imu → saldo_dicembre.",
                    "maximum": 10000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "tipo_immobile": {
                    "description": "Property type — calc_imu → parametri.tipo_immobile. It sets the IMU codice tributo.",
                    "enum": ["abitazione_principale_A1_A8_A9", "abitazione_non_principale", "immobile_produttivo", "immobile_locato_canone_concordato", "comodato_uso_parenti", "terreno_agricolo", "area_edificabile"],
                    "type": "string"
                  }
                },
                "required": ["acconto", "anno", "codice_comune", "imu_dovuta", "saldo", "tipo_immobile"],
                "type": "object"
              },
              "kind": {
                "description": "Domain to compose: 'forfettario' (Erario + INPS), 'imu' (IMU and other local taxes section) or 'bollo' (stamp duty on the e-invoices of a quarter).",
                "enum": ["forfettario", "imu", "bollo"],
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Pre-filled F24 (Erario / INPS / IMU lines)"
