      "serverInfo": {
        "name": "imperio-mcp",
        "title": "Imperio — Italian Tax & Compliance Tools",
        "version": "3.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Imperio Utilities: infrastruttura GRATUITA per agenti e integratori sul fisco italiano — strumenti deterministici e verificati (algoritmi e fonti ufficiali, nessuna inferenza LLM nei calcoli). I tool MCP sono DUE gruppi, con permessi diversi. (1) 23 strumenti fiscali italiani (Codice Fiscale, Partita IVA, IBAN, CAP, PEC, ATECO, IVA, IMU, forfettario, F24, FatturaPA, Intrastat, NIS2) più la verifica fornitore anti-frode (IBAN + VIES): gratuiti (€0) e senza login. (2) 5 tool guardian_* (il libretto dei fornitori monitorati): non costano crediti, ma ESIGONO una API key nell'header X-API-Key — si ottiene gratis su https://imperioutils.com/signup, e alza anche il limite al minuto. I fiscali sono deterministici; la verifica fornitore usa il VIES live (openWorldHint) e degrada onestamente se non disponibile. Usa tools/list per lo schema di ogni strumento: la description di ogni tool guardiano dichiara che serve la chiave. Integri Imperio in un prodotto, ti manca un tool o un risultato ti sembra sbagliato? Scrivi a support@imperioutils.com: lo leggiamo e, se sbagliamo, correggiamo. Documentazione: https://imperioutils.com/mcp",
      "tools": [
        {
          "name": "calc_forfettario",
          "title": "Calcolatore Regime Forfettario",
          "description": "Calcola imposta sostitutiva e contributi INPS del regime forfettario italiano dal fatturato. Con `ateco` o `coefficiente`: il calcolo puntuale, con scadenze e acconti. Con i soli `ricavi`: una TABELLA con il calcolo per ciascuno dei coefficienti di redditività di legge (`modalita: 'tabella_per_coefficiente'`, campo `scenari`), perché il coefficiente dipende dall'attività e non ha un default. Gratis (€0), deterministico, nessun login richiesto.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ateco": {
                "description": "Codice ATECO da cui derivare il coefficiente di redditività. ALTERNATIVO a `coefficiente`. Senza nessuno dei due la risposta è la tabella per coefficiente, non il calcolo puntuale.",
                "maxLength": 12,
                "pattern": "^[0-9.]{1,12}$",
                "type": "string"
              },
              "codice_ateco": {
                "description": "Alias di `ateco` (codice ATECO): stesso dato, accettato perché altri tool di questo server lo chiamano così. Se mandi entrambi i nomi, i valori devono coincidere.",
                "maxLength": 12,
                "pattern": "^[0-9.]{1,12}$",
                "type": "string"
              },
              "coefficiente": {
                "description": "Coefficiente di redditività in % (override manuale). ALTERNATIVO ad `ateco`. Senza nessuno dei due la risposta è la tabella per coefficiente.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "contributi_cassa_privata": {
                "description": "Contributi cassa privata già versati, in euro (opzionale).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "gestione_inps": {
                "description": "Gestione previdenziale INPS/cassa (opzionale).",
                "enum": ["gestione_separata", "artigiani", "commercianti", "cassa_privata"],
                "type": "string"
              },
              "ricavi": {
                "description": "Ricavi/compensi annui in euro.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "riduzione_35": {
                "default": false,
                "description": "Riduzione contributiva INPS del 35% (artigiani/commercianti).",
                "type": "boolean"
              },
              "startup": {
                "default": false,
                "description": "Aliquota agevolata 5% per le nuove attività: vale per l'anno di inizio e per i quattro successivi (default false → 15%). Non cambia gli acconti: nel primo anno di attività non sono dovuti, e le note della risposta lo dicono.",
                "type": "boolean"
              }
            },
            "required": ["ricavi"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calcolatore Regime Forfettario"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b0bfa38a5943696df5e574878d81322b6abcfc0a079e70f4f8a65bc37f13883"
        },
        {
          "name": "calc_imu",
          "title": "Calcola IMU",
          "description": "Calcola l'IMU italiana (L.160/2019) per fabbricati (da rendita catastale + categoria), terreni agricoli (da reddito dominicale) e aree edificabili (da valore venale), con acconto/saldo. L'aliquota (‰) è quella deliberata dal Comune: indicala (`aliquota_permille`) OPPURE indica il `comune` (codice catastale o nome) e il server usa l'aliquota del suo prospetto pubblicato dal MEF, con lo stato di legge (prospetto dell'anno · anno precedente, L.160/2019 c.767 · aliquote di base) e la fonte in `aliquota_comune`. Se il prospetto non è ancora stato letto, o il comune non ha l'IMU (Trento, Bolzano, Friuli Venezia Giulia), risponde `calcolato: false` con la spiegazione, senza importo. Gratis (€0), deterministico, nessun login richiesto.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "not": {
                    "required": ["comune"]
                  }
                },
                "then": {
                  "required": ["aliquota_permille"]
                }
              }
            ],
            "anyOf": [
              {
                "required": ["rendita_catastale"]
              },
              {
                "properties": {
                  "tipo_immobile": {
                    "const": "terreno_agricolo"
                  }
                },
                "required": ["reddito_dominicale", "tipo_immobile"]
              },
              {
                "properties": {
                  "tipo_immobile": {
                    "const": "area_edificabile"
                  }
                },
                "required": ["tipo_immobile", "valore_venale"]
              },
              {
                "properties": {
                  "coltivatore_diretto_iap": {
                    "const": true
                  },
                  "tipo_immobile": {
                    "const": "terreno_agricolo"
                  }
                },
                "required": ["coltivatore_diretto_iap", "tipo_immobile"]
              },
              {
                "properties": {
                  "esente_montano_isola": {
                    "const": true
                  },
                  "tipo_immobile": {
                    "const": "terreno_agricolo"
                  }
                },
                "required": ["esente_montano_isola", "tipo_immobile"]
              }
            ],
            "properties": {
              "aliquota_permille": {
                "description": "Aliquota deliberata dal Comune, in per mille (es. 8.6 per 8,6‰). OBBLIGATORIA se non indichi `comune`; con tutti e due vince questa, e la risposta dice se differisce dal prospetto.",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              },
              "anno": {
                "description": "Anno d'imposta del verdetto per comune (default l'anno in corso). Solo con `comune`.",
                "maximum": 2100,
                "minimum": 2025,
                "type": "integer"
              },
              "categoria_catastale": {
                "description": "Solo fabbricati: categoria catastale come sulla visura, senza la barra (A/2 → `A2`, C/1 → `C1`). Determina il moltiplicatore e, per `abitazione_principale_A1_A8_A9`, se l'imposta è dovuta (solo A1, A8, A9) o se la casa è esente. `A` senza numero vale per le abitazioni quando il numero non si sa; se manca, si calcola come `A` e la risposta lo dice. Su `terreno_agricolo` e `area_edificabile` non si indica.",
                "enum": ["A", "A1", "A2", "A3", "A4", "A5", "A6", "A7", "A8", "A9", "A11", "A10", "B", "C1", "C2_C6_C7", "C3_C4_C5", "D", "D5", "E", "F"],
                "type": "string"
              },
              "coltivatore_diretto_iap": {
                "description": "Terreni: coltivatore diretto/IAP iscritto alla previdenza agricola → esente.",
                "type": "boolean"
              },
              "comune": {
                "description": "Codice catastale (es. B519) o nome del comune. L'aliquota diventa quella del suo prospetto IMU pubblicato dal MEF per l'anno (o, per legge, quella dell'anno precedente o di base).",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "detrazione": {
                "description": "Detrazione in euro (solo fabbricati; es. 200 per abitazione principale di lusso).",
                "minimum": 0,
                "type": "number"
              },
              "esente_montano_isola": {
                "description": "Terreni: in comune montano/collinare o isola minore → esente.",
                "type": "boolean"
              },
              "ex_comune": {
                "description": "Solo comuni fusi con aliquote differenziate: l'ex comune dove sta l'immobile. Se serve e manca, la risposta elenca quelli possibili.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "mese_fine": {
                "description": "Ultimo mese di possesso computato (12 = dicembre). Default 12.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "mese_inizio": {
                "description": "Primo mese di possesso computato (1 = gennaio; conta il mese posseduto per più della metà dei giorni). Con mese_fine l'acconto di giugno diventa l'imposta del primo semestre (L. 160/2019 c. 762). Default 1.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "mesi_possesso": {
                "description": "Mesi di possesso nell'anno (default 12). Con possesso parziale non dice QUALI mesi: per dividere acconto e saldo usa mese_inizio/mese_fine.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "provincia": {
                "description": "Sigla della provincia, per i comuni omonimi (es. TO). Solo con `comune`.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "quota_possesso_pct": {
                "description": "Quota di possesso in % (default 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "reddito_dominicale": {
                "description": "Terreni agricoli: reddito dominicale da visura (base = ×1,25×135). OBBLIGATORIO con `tipo_immobile: terreno_agricolo`, tranne quando il terreno è esente (vedi i due flag).",
                "minimum": 0.01,
                "type": "number"
              },
              "rendita_catastale": {
                "description": "Fabbricati: rendita catastale annua in euro (da visura). OBBLIGATORIA per tutti i tipi diversi da `terreno_agricolo` e `area_edificabile` — cioè anche per il tipo di default `abitazione_non_principale`.",
                "minimum": 0.01,
                "type": "number"
              },
              "tipo_immobile": {
                "description": "Tipo immobile → seleziona la formula (default abitazione_non_principale).",
                "enum": ["abitazione_principale_A1_A8_A9", "abitazione_non_principale", "immobile_produttivo", "immobile_locato_canone_concordato", "comodato_uso_parenti", "terreno_agricolo", "area_edificabile"],
                "type": "string"
              },
              "valore_venale": {
                "description": "Aree edificabili: valore venale in comune commercio al 1° gennaio (€). OBBLIGATORIO con `tipo_immobile: area_edificabile`.",
                "minimum": 0.01,
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calcola IMU"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4586720bf29d9a199ec6fe3992b0b9633618f8e726bc63b36f599dac25d1b00f"
        },
        {
          "name": "calc_iva",
          "title": "Calcola IVA",
          "description": "Calcola l'IVA italiana su un imponibile (aliquote 22/10/5/4/0/esente/fuori campo), con ritenuta d'acconto opzionale (autonomi 20%, agenti 11,5%), e decide la TERRITORIALITÀ delle operazioni con l'estero: beni o servizi, impresa o privato, UE o extra-UE → imponibile in Italia, non imponibile, non soggetta o IVA del paese di destinazione (aliquota ordinaria ufficiale TEDB dei 27 Stati), con Natura FatturaPA, annotazione in fattura e norma. Soglia UE di 10.000 € non dichiarata → due scenari calcolati, mai un numero scelto al posto tuo. Le norme citate seguono la data dell'operazione: DPR 633/72 fino al 31/12/2026, Testo unico IVA dal 1/1/2027. Gestisce le DUE basi imponibili della fattura di un professionista (contributo integrativo cassa solo nella base IVA, rivalsa INPS in entrambe). Gratis (€0), deterministico, nessun login richiesto.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "properties": {
                  "tipo_operazione": {
                    "enum": ["b2b", "b2c", "PA"]
                  }
                }
              },
              {
                "properties": {
                  "oggetto": {
                    "const": "beni"
                  },
                  "tipo_operazione": {
                    "const": "extraUE"
                  }
                },
                "required": ["tipo_operazione"]
              },
              {
                "properties": {
                  "cessionario_soggetto_iva": {
                    "type": "boolean"
                  },
                  "oggetto": {
                    "const": "servizi"
                  },
                  "tipo_operazione": {
                    "const": "extraUE"
                  }
                },
                "required": ["cessionario_soggetto_iva", "oggetto", "tipo_operazione"]
              },
              {
                "properties": {
                  "cessionario_soggetto_iva": {
                    "const": true
                  },
                  "tipo_operazione": {
                    "const": "intraUE"
                  }
                },
                "required": ["cessionario_soggetto_iva", "tipo_operazione"]
              },
              {
                "properties": {
                  "cessionario_soggetto_iva": {
                    "const": false
                  },
                  "oggetto": {
                    "enum": ["beni", "servizi"]
                  },
                  "tipo_operazione": {
                    "const": "intraUE"
                  }
                },
                "required": ["cessionario_soggetto_iva", "oggetto", "tipo_operazione"]
              }
            ],
            "properties": {
              "aliquota_destinazione_pct": {
                "description": "Aliquota del paese di destinazione, se il bene vi ha un'aliquota RIDOTTA. Senza, si usa l'ordinaria ufficiale (TEDB) e la risposta lo dichiara.",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "aliquota_iva": {
                "description": "Aliquota IVA (default 22).",
                "enum": ["22", "10", "5", "4", "0", "esente", "fuori_campo"],
                "type": "string"
              },
              "cessionario_soggetto_iva": {
                "description": "OBBLIGATORIO per tipo_operazione='intraUE' (e per extraUE con oggetto='servizi'). true = soggetto passivo con P.IVA valida al VIES: beni non imponibili (N3.2), servizi non soggetti (N2.1). false = consumatore privato: l'IVA è italiana o del paese di destinazione a seconda di `oggetto`, `vendita_a_distanza`, `soglia_ue_superata` e `tipo_servizio`.",
                "type": "boolean"
              },
              "con_ritenuta": {
                "description": "Applica la ritenuta d'acconto (default false).",
                "type": "boolean"
              },
              "contributo_integrativo_pct": {
                "description": "Aliquota % del contributo integrativo della cassa professionale (default 0 = nessuna cassa). Tipicamente 4; 5 per i geometri; 2 per ENPAP/ENPAV — leggila dal regolamento della cassa: il tool non la deduce da ATECO. Entra nella base IVA ma NON in quella della ritenuta.",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "data_operazione": {
                "description": "AAAA-MM-GG, default oggi. Decide la norma citata: DPR 633/72 e DL 331/93 fino al 31/12/2026, Testo unico IVA (D.Lgs. 10/2026) dal 1/1/2027.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "imponibile": {
                "description": "Compenso/corrispettivo in EUR (es. 1000), AL NETTO del contributo integrativo cassa e della rivalsa INPS: quelli si aggiungono con i due campi dedicati.",
                "maximum": 1000000000000,
                "minimum": 0.01,
                "type": "number"
              },
              "oggetto": {
                "description": "Per intraUE/extraUE. Cambia il regime: cessione di beni intraUE B2B = non imponibile (N3.2, «operazione non imponibile»); servizi B2B = non soggetti (N2.1, «inversione contabile»). Obbligatorio verso un privato UE.",
                "enum": ["beni", "servizi"],
                "type": "string"
              },
              "paese_destinazione": {
                "description": "ISO2 del paese del cliente ('EL' Grecia; 'XI' Irlanda del Nord = UE per i soli beni). Serve all'aliquota di destinazione sopra soglia.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "rivalsa_inps_pct": {
                "description": "Aliquota % della rivalsa INPS gestione separata addebitata in fattura (default 0). Per legge 4 (art. 1 c. 212 L. 662/1996). Entra in ENTRAMBE le basi.",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "servizio_7_septies": {
                "description": "Servizi a privato extra-UE: true se il servizio è fra quelli dell'art. 7-septies (consulenza, pubblicità, dati, finanziari, personale, noleggio beni mobili…): non soggetto.",
                "type": "boolean"
              },
              "soglia_ue_superata": {
                "description": "Beni a distanza e servizi elettronici a privati UE: true se vendite a distanza + servizi TTE a privati UE hanno superato 10.000 € (anno precedente o in corso) OPPURE se hai optato per l'IVA di destinazione. Se non la dichiari ricevi DUE scenari calcolati e `iva_importo: null`.",
                "type": "boolean"
              },
              "tipo_operazione": {
                "description": "Tipo operazione (default b2b). intraUE ESIGE `cessionario_soggetto_iva`; verso un privato UE esige anche `oggetto`. extraUE senza `oggetto` è trattata come esportazione di beni (lo dichiara nei `presupposti`); per i servizi dichiara `oggetto` e `cessionario_soggetto_iva`: verso un privato extra-UE l'IVA di regola è italiana.",
                "enum": ["b2b", "b2c", "intraUE", "extraUE", "PA"],
                "type": "string"
              },
              "tipo_ritenuta": {
                "description": "Tipo ritenuta se con_ritenuta=true (autonomo 20% | agente 11,5%).",
                "enum": ["autonomo", "agente"],
                "type": "string"
              },
              "tipo_servizio": {
                "description": "Per oggetto='servizi'. generico = regola generale (default assunto, e dichiarato); elettronico = telecomunicazione, teleradiodiffusione, servizi elettronici; speciale = immobili, trasporti, ristorazione, eventi, noleggio mezzi, intermediazione, lavorazioni su beni mobili — il tool NON calcola il luogo e lo dice, con le norme.",
                "enum": ["generico", "elettronico", "speciale"],
                "type": "string"
              },
              "vendita_a_distanza": {
                "description": "Beni a privato UE: true se il trasporto è a cura del cedente o per suo conto (default assunto true, e dichiarato). false = il cliente trasporta da sé → IVA italiana.",
                "type": "boolean"
              }
            },
            "required": ["imponibile"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calcola IVA"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7aa6a3a860b0d8258900aa9e1f52897fe9dd0e6b715d46370aa41bf34eb787e2"
        },
        {
          "name": "calc_reverse_charge",
          "title": "Reverse charge (inversione contabile)",
          "description": "Calcola l'IVA che il CESSIONARIO deve autoliquidare in regime di inversione contabile e restituisce gli obblighi delle due parti con la norma applicabile. Distingue i tre casi che si confondono più spesso: reverse charge INTRACOMUNITARIO (cedente UE non-IT — art. 46 DL 331/93 per i beni, art. 17 c. 2 DPR 633/72 per i servizi: con 'oggetto' dice anche come fattura il fornitore e quale documento d'integrazione serve), reverse charge INTERNO (cedente italiano — art. 17 c. 6, che NON è generalizzato: vale solo in settori tassativi come subappalti edili, rottami, pulizia edifici, elettronica) e paese non-UE (errore esplicito, non un ramo implicito). Gratis (€0), deterministico, nessun login richiesto.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aliquota_iva": {
                "description": "Aliquota IVA da autoliquidare (default 22).",
                "enum": ["22", "10", "5", "4", "0", "esente", "fuori_campo"],
                "type": "string"
              },
              "imponibile": {
                "description": "Imponibile della fattura in EUR.",
                "maximum": 1000000000000,
                "minimum": 0.01,
                "type": "number"
              },
              "oggetto": {
                "description": "Solo intraUE: 'beni' o 'servizi'. Per i beni il fornitore UE fattura una cessione intracomunitaria esente (integrazione TD18); per i servizi «inversione contabile» (TD17). Se manca, la risposta dà entrambi i casi in `per_oggetto`.",
                "enum": ["beni", "servizi"],
                "type": "string"
              },
              "paese_cedente": {
                "description": "Codice ISO2 del paese del CEDENTE: uno Stato membro UE (es. DE, FR, ES; 'EL' o 'GR' per la Grecia; 'XI' per l'Irlanda del Nord) per il reverse charge intracomunitario, oppure 'IT' per quello interno.",
                "maxLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["imponibile", "paese_cedente"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Reverse charge (inversione contabile)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
