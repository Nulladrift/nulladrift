        {
          "name": "calc_split_payment",
          "title": "Split payment (scissione dei pagamenti)",
          "description": "Calcola la scissione dei pagamenti per le forniture alla Pubblica Amministrazione (art. 17-ter DPR 633/72): il fornitore fattura imponibile + IVA ma incassa dalla PA il SOLO imponibile, mentre l'IVA la versa la PA direttamente all'Erario. Restituisce i due importi separati, l'impatto di liquidità per il fornitore e le istruzioni FatturaPA (EsigibilitaIVA=S; NON si usano i codici Natura N6, che sono solo del reverse charge). NON si applica alle parcelle con ritenuta d'acconto di lavoro autonomo (art. 17-ter c. 1-sexies): per un professionista usa calc_iva con con_ritenuta. Gratis (€0), deterministico, nessun login richiesto.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aliquota_iva": {
                "description": "Aliquota IVA esposta in fattura (default 22).",
                "enum": ["22", "10", "5", "4", "0", "esente", "fuori_campo"],
                "type": "string"
              },
              "imponibile": {
                "description": "Imponibile della fornitura alla PA in EUR.",
                "maximum": 1000000000000,
                "minimum": 0.01,
                "type": "number"
              }
            },
            "required": ["imponibile"],
            "type": "object"
          },
          "annotations": {
