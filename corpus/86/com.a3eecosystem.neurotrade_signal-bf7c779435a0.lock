{
  "lockfileVersion": 2,
  "subjects": {
    "com.a3eecosystem.neurotrade/signal": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://neurotrade.a3eecosystem.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "neurotrade-signal-api",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "generate_signal",
          "description": "Generate an AI-powered crypto trading signal for a given pair and timeframe. Returns: action (OPEN_LONG | OPEN_SHORT | CLOSE), confidence (0.0–1.0), entry_price, take_profit (array of price levels), stop_loss, risk_reward ratio, indicators (rsi, macd, ema_20, atr), risk_flags (overbought_rsi | oversold_rsi | low_volume | high_spread | near_resistance | near_support), generated_at (ISO 8601), expires_at (ISO 8601), and quota_remaining. The `thesis` field contains LLM reasoning and is only present when include_thesis=true. On quota exhaustion returns error_code=QUOTA_EXCEEDED with Retry-After header. Requires Authorization: Bearer nt_<api_key>.",
          "inputSchema": {
            "properties": {
              "include_thesis": {
                "default": true,
                "description": "When true, includes the LLM-generated reasoning in the `thesis` field of the response. Adds ~200ms latency.",
                "type": "boolean"
              },
              "personality": {
                "description": "Risk personality shaping confidence weighting and TP/SL aggressiveness. Defaults to scalper.",
                "enum": ["scalper", "swing", "macro", "trend_rider", "news_reactive", "breakout_hunter"],
                "type": "string"
              },
              "strategy": {
                "description": "Signal strategy to apply. Defaults to trend_rider.",
                "enum": ["trend_rider", "breakout_hunter", "scalper", "swing_master", "macro_lens", "news_reactive", "momentum_surge", "mean_reversion"],
                "type": "string"
              },
              "symbol": {
                "description": "Trading pair in BASE/QUOTE format, e.g. BTC/USDT, ETH/USDT, SOL/USDT.",
                "pattern": "^[A-Z0-9]+/[A-Z0-9]+$",
                "type": "string"
              },
              "timeframe": {
                "default": "15m",
                "description": "Candlestick timeframe for signal analysis. Defaults to 15m.",
                "enum": ["1m", "5m", "15m", "1h", "4h", "1d"],
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f2afeec0bcc719d0e65447b1a1451c956e30f32c98de0bb012aac606c9756476"
        },
        {
          "name": "get_account",
          "description": "Return the current NeuroTrade B2B API quota status: plan tier, calls used, calls remaining, and quota reset date. Requires a valid NeuroTrade B2B API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cbfb00f38c0a07c376cae96587436ef2a0695d1406259db76063be0ffa0e60a1"
        }
      ],
      "digest": "sha256:18d27a004c4ebd57857d17580bd8a1c10cf991a4475770d968261698bed534bb"
    }
  }
}
