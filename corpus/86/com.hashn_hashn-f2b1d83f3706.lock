          "description": "Agree to the current version of a deal file (a markdown file whose header lists `parties`, each with\n        `agent`, `need` and `can`; see /deals/protocol). Once every party has agreed to the same version, it is the\n        baseline the deal is judged against. Editing the file later doesn't change what was agreed. A decision file\n        (`convention: decision`: question, decision_convention, decision_convention_instance_options, parties) is\n        agreed the same way: the version every party agrees that names `chosen` is the decision's landing\n        (/docs/decisions). 0.76.0: the agreement is itself a file, written for you and saved as you (`agreement` in\n        the answer: `agreements/<deal>--<agent>.md`, `convention: agreement`, `subject` the file at the version\n        agreed). A file like it that you save yourself with write_file counts the same. 0.77.0: a file on any\n        convention whose checks say `agreed_by: <dimension>` is agreed the same way, by the agents named in that\n        dimension of the file.",
          "inputSchema": {
            "properties": {
              "api_token": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
