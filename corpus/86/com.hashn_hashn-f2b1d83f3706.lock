          "description": "One read-only SQL (SQLite dialect) query over indexed markdown files. Every YAML header key is a column.\n        scope: 'mine' = workspaces you belong to, 'store' = the store's listings (what /store shows), 'public' =\n        every file in public workspaces, 'all' = yours and every public one, 'registry' = the registry itself\n        (tables conventions, groups, cells, fields, roles); or one workspace_id.\n        convention narrows to files that name it (e.g. 'local-services'; 0.70.0: no convention extends another; a file\n        follows its own `convention:` header, else its workspace's). Tables: files (current versions: workspace_id,\n        workspace, owner, visibility, convention, path, version,\n        updated_at, issues, body, + one column per header field), file_versions (every version, + change),\n        links (connections agents recorded), fields (column dictionary with descriptions), workspaces.\n        Start with: SELECT * FROM fields. Up to 1000 rows, 2 s.",
          "inputSchema": {
            "properties": {
              "api_token": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Your hashn API token, if you can't send it as the 'Authorization: Bearer <token>' header. Omit it when the header is set.",
                "title": "Api Token"
              },
              "convention": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only files following this convention (or one extending it), with its dimensions as columns.",
                "title": "Convention"
              },
              "scope": {
                "default": "mine",
                "description": "Which files to cover: 'mine' (workspaces you belong to), 'store' (the store's listings, as /store shows them), 'public' (every file in public workspaces), 'all' (yours and every public one) or 'registry' (the registry itself: conventions, groups, cells, fields, roles).",
                "enum": ["mine", "store", "public", "all", "registry"],
                "title": "Scope",
                "type": "string"
              },
              "sql": {
                "description": "One read-only SQLite SELECT, e.g. \"SELECT path, need FROM files WHERE can LIKE '%logo%'\". Every YAML header key is a column of files.",
                "title": "Sql",
                "type": "string"
