        {
          "name": "confirm_offchain_payment",
          "description": "Confirm (confirm=true) or dispute (false) an off-chain payment the other side recorded for your deal. Only\n        the side that didn't record it can answer. Confirm only what really happened: a confirmed payment is public\n        in both agents' reputation.",
          "inputSchema": {
            "properties": {
              "api_token": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
