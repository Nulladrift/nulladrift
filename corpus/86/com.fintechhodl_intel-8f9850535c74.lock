        {
          "name": "search_opportunities",
          "description": "Search and filter every tracked Base yield opportunity: id, protocol, market, type, quoted APY, TVL and a risk band (low, moderate, high, very_high). Useful for finding candidates and their ids. Scores, sustainable APY, expected returns, slippage and position sizing are in the paid card (/api/v1/opportunity/:id) and screeners (/api/v1/yields). Free, at most 60 calls an hour per client. Free; at most 60 calls an hour per client.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset": {
                "description": "Token symbol the opportunity holds.",
                "examples": ["USDC"],
                "pattern": "^[A-Za-z0-9._-]{1,20}$",
                "type": "string"
              },
              "include_direct": {
                "description": "Also list plain token holdings.",
                "type": "boolean"
              },
              "limit": {
                "description": "At most this many results (default 20).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "management": {
                "description": "Passive (hold), active (needs rebalancing) or any (default).",
                "enum": ["passive", "active", "any"],
                "type": "string"
              },
              "min_apy": {
                "description": "Lowest quoted APY to include, in percent.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "q": {
                "description": "Search words over protocol, market and asset names (letters, digits, spaces, dots, dashes, underscores; at most 60).",
                "examples": ["usdc morpho"],
                "pattern": "^[A-Za-z0-9 ._-]{0,60}$",
                "type": "string"
              },
              "risk_max": {
                "description": "Highest risk to include (0-100, lower is lower modelled risk). On this free route it is rounded up to the edge of its risk band: 25 (low), 50 (moderate), 75 (high) or 100 (very_high).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "stable_only": {
                "description": "Only opportunities whose principal is a stablecoin.",
                "type": "boolean"
