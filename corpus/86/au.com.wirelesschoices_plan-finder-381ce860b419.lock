                      "connection_types": {
                        "type": ["string", "array", "null"]
                      },
                      "excess_data": {
                        "type": ["string", "null"]
                      },
                      "international_calls": {
                        "type": ["string", "null"]
                      },
                      "international_countries": {
                        "type": ["string", "number", "null"]
                      },
                      "international_sms": {
                        "type": ["string", "null"]
                      },
                      "modem": {
                        "type": ["string", "null"]
                      },
                      "national_calls_sms": {
                        "type": ["boolean", "string", "null"]
                      },
                      "notes": {
                        "type": ["string", "null"]
                      },
                      "roaming": {
                        "type": ["string", "null"]
                      }
                    },
                    "type": "object"
                  },
                  "modem_included": {
                    "description": "True only when a modem is in the plan price. False does not mean the provider sells no modem; read modem_label",
                    "type": ["boolean", "null"]
                  },
                  "modem_label": {
                    "description": "Internet plans: the modem position as recorded, e.g. \"BYO modem, or buy from $216\"",
                    "type": ["string", "null"]
                  },
                  "network": {
                    "description": "Network the provider sells access to (mobile types) or technology label (internet)",
                    "type": ["string", "null"]
                  },
                  "plan_name": {
                    "type": "string"
                  },
                  "plan_slug": {
                    "type": "string"
                  },
                  "plan_type": {
                    "enum": ["mobile", "prepaid", "mobile_broadband", "internet"],
                    "type": "string"
