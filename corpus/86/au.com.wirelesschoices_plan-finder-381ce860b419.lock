                  "additionalProperties": false,
                  "properties": {
                    "plan_slug": {
                      "maxLength": 200,
                      "pattern": "^[a-z0-9][a-z0-9-]{0,199}$",
                      "type": "string"
                    },
                    "plan_type": {
                      "enum": ["mobile", "prepaid", "mobile_broadband", "internet"],
                      "type": "string"
                    },
                    "provider_slug": {
                      "maxLength": 200,
                      "pattern": "^[a-z0-9][a-z0-9-]{0,199}$",
                      "type": "string"
                    }
                  },
                  "required": ["plan_slug", "plan_type", "provider_slug"],
                  "type": "object"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["plans"],
            "type": "object"
          },
