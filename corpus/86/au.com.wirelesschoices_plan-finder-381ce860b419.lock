                "type": "string"
              },
              "offset": {
                "description": "Number of matches to skip, to return the next plans in the same order; a result gives the value for the next page as next_offset. Only the first 50 matches can be paged",
                "maximum": 40,
                "minimum": 0,
                "type": "integer"
              },
              "plan_type": {
                "description": "Which catalogue to search",
                "enum": ["mobile", "prepaid", "mobile_broadband", "internet"],
                "type": "string"
              },
              "provider_slug": {
                "description": "Restrict to one provider by its slug, e.g. telstra, optus, boost-mobile",
