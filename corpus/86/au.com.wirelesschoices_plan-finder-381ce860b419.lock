        {
          "name": "get_outage_history",
          "title": "Resolved outage history",
          "description": "Return resolved outages published on the carrier outage registers required by the ACMA (Telstra, Optus, TPG Telecom for Vodafone, and nbn) by provider (provider_slug), postcode or state, newest first. For a provider that uses another network, the entries come from that host network's register and are labelled as on that network. Returns up to 10 entries, each with its source link; the offset parameter returns the next entries among the first 30. These are records of resolved outages, not current network status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Entries to return, up to 10 (default 10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Number of entries to skip; a result gives the value for the next page as next_offset. Only the first 30 entries can be paged",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "outage_type": {
                "description": "major = over 100,000 services or a whole state or territory; significant_local = smaller outages above the ACMA local thresholds",
                "enum": ["major", "significant_local"],
                "type": "string"
              },
              "postcode": {
                "description": "Australian postcode, four digits, e.g. 2320 or 0870",
                "maxLength": 4,
                "pattern": "^[0-9]{4}$",
                "type": "string"
              },
              "provider_slug": {
                "description": "Provider slug, e.g. telstra, optus, boost-mobile; nbn for nbn",
                "maxLength": 200,
                "pattern": "^[a-z0-9][a-z0-9-]{0,199}$",
                "type": "string"
              },
              "state": {
                "description": "State or territory code",
                "enum": ["ACT", "NSW", "NT", "QLD", "SA", "TAS", "VIC", "WA"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "type": "string"
              },
              "data_terms": {
                "type": "string"
              },
              "entries": {
                "items": {
                  "properties": {
                    "areas": {
                      "description": "Up to 5 affected areas as published",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "cause": {
                      "type": ["string", "null"]
                    },
                    "duration_hours": {
                      "type": ["number", "null"]
                    },
                    "ended_on": {
                      "description": "End date, Australia/Sydney, ISO date; null when the register published an end before the start",
                      "type": ["string", "null"]
                    },
                    "more_areas": {
                      "type": "integer"
                    },
                    "outage_type": {
                      "enum": ["major", "significant_local"],
                      "type": "string"
                    },
                    "outage_type_label": {
                      "type": "string"
                    },
                    "postcode_count": {
                      "type": "integer"
                    },
                    "premises_affected": {
                      "type": ["integer", "null"]
                    },
                    "published_by": {
                      "description": "Carrier that published the register entry",
                      "type": "string"
                    },
                    "reference": {
                      "type": ["string", "null"]
                    },
                    "register": {
                      "type": "string"
                    },
                    "resolved_by": {
                      "description": "Carrier the register names as responsible for resolving the outage",
                      "type": ["string", "null"]
                    },
                    "services": {
                      "type": ["string", "null"]
                    },
                    "source_url": {
                      "description": "The carrier outage register page",
                      "type": "string"
                    },
                    "started_on": {
                      "description": "Start date, Australia/Sydney, ISO date",
                      "type": ["string", "null"]
                    },
                    "states": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["areas", "outage_type", "outage_type_label", "published_by", "register", "source_url", "states"],
                  "type": "object"
                },
                "type": "array"
              },
              "error": {
                "description": "Error code, present only on an error result",
                "type": "string"
              },
              "filters_applied": {
                "description": "The lookup that was applied, echoed from the request",
                "type": "object"
              },
              "message": {
                "description": "User-facing error message, present only on an error result",
                "type": "string"
              },
              "mode": {
                "enum": ["outage_history"],
                "type": "string"
              },
              "next_offset": {
                "description": "Offset for the next entries; null when there are no more, or the 30-entry paging limit is reached",
                "type": ["integer", "null"]
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "offset": {
                "type": "integer"
              },
              "page": {
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["label", "url"],
                "type": "object"
              },
              "provider": {
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "result_count": {
                "type": "integer"
              },
              "source_note": {
                "type": "string"
              },
              "total_matching": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Resolved outage history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
