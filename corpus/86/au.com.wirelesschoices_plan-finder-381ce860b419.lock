                        "description": "Included data in GB; null when unlimited or not stated",
                        "type": ["number", "null"]
                      },
                      "max_speed": {
                        "description": "Full-speed cap, e.g. \"40Mbps\"; null when none is recorded",
                        "type": ["string", "null"]
                      },
                      "rollover": {
                        "type": "boolean"
                      },
                      "speed_after_allowance": {
                        "description": "Throttle applied after the included data (postpaid and mobile broadband only)",
                        "type": ["string", "null"]
                      },
                      "unlimited": {
                        "type": "boolean"
                      }
                    },
                    "required": ["gb", "max_speed", "rollover", "speed_after_allowance", "unlimited"],
                    "type": "object"
