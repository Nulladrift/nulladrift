        {
          "name": "search_plans",
          "title": "Search Australian telco plans",
          "description": "Search current Australian mobile, prepaid, mobile broadband and nbn home internet plans from providers listed on Wireless Choices. Filter by price, included data, network, speed tier, contract and features. Results are ordered by lowest ongoing price among matching plans and each one carries the date it was last updated on Wireless Choices. Returns up to 10 plans, each with a link to its detail page, and the total number of matches; the offset parameter returns the next plans among the first 50 matches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contract_months": {
                "description": "Contract term in months. 0 = month-to-month, with no fixed-term contract",
                "enum": [0, 12, 24],
                "type": "integer"
              },
              "expiry_days": {
                "description": "Recharge length in days. Prepaid and mobile broadband only. 28 and 30 are different lengths and match exactly; 180 covers recharges of 180 to 186 days and 365 covers 360 to 365 days",
                "enum": [7, 28, 30, 60, 90, 180, 365],
                "type": "integer"
              },
              "features": {
                "description": "All listed features must be included. Mobile, prepaid and mobile broadband only; not valid with internet",
