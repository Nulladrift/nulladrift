                  },
                  "provider_logo": {
                    "type": ["string", "null"]
                  },
                  "provider_slug": {
                    "type": "string"
                  },
                  "speed": {
                    "description": "Internet plans only. Exactly one of three forms is filled, chosen by basis: a typical evening speed, a typical evening range, or a provider-stated maximum",
                    "properties": {
                      "basis": {
                        "description": "\"typical_busy_period\", \"typical_range\" or \"theoretical_max\"; null when not assessed",
                        "type": ["string", "null"]
                      },
                      "stated_max_down_mbps": {
                        "description": "Provider-stated maximum download speed, for plans with no published typical figure. Not a typical speed",
                        "type": ["number", "null"]
                      },
                      "stated_max_up_mbps": {
                        "type": ["number", "null"]
