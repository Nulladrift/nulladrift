                        "type": ["number", "null"]
                      },
                      "typical_evening_up_mbps": {
                        "type": ["number", "null"]
                      },
                      "typical_range_down_max_mbps": {
                        "description": "High end of the published typical evening download range. Not a typical speed on its own",
                        "type": ["number", "null"]
                      },
                      "typical_range_down_min_mbps": {
                        "description": "Low end of the published typical evening download range",
                        "type": ["number", "null"]
                      },
                      "typical_range_up_mbps": {
                        "type": ["number", "null"]
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "updated_on": {
                    "description": "Date Wireless Choices last recorded a change to the plan, ISO date",
                    "type": ["string", "null"]
                  },
                  "url": {
                    "description": "Plan page on wirelesschoices.com.au with UTM parameters",
                    "type": "string"
                  }
