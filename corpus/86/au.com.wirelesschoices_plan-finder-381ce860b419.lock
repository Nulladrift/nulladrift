                        "description": "Bonus data, e.g. \"40GB\"",
                        "type": ["string", "null"]
                      },
                      "bonus_recharges": {
                        "description": "Recharges the bonus applies to",
                        "type": ["integer", "null"]
                      },
                      "customer_type": {
                        "description": "\"new\", \"all\" or a provider-specific value",
                        "type": ["string", "null"]
