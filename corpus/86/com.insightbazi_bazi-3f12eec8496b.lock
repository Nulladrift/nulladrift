      "serverInfo": {
        "name": "insightbazi",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "calculate_bazi_chart",
          "title": "Calculate BaZi chart",
          "description": "Calculates a BaZi (Four Pillars of Destiny, 八字, 四柱推命, Saju) chart from a birth date, time and place with the InsightBaZi engine, and shows it as a chart card. Use it when the user asks for a BaZi chart, or for their Four Pillars, Day Master, Ten Gods, element balance or 10-year luck pillars to be worked out from a birth date. It applies true solar time from the birthplace longitude and historical daylight-saving rules, changes the Day Pillar at 23:00, the year at Lichun and months at solar terms. The chart card is the user-facing result. After a chart-only request, briefly confirm it is ready; do not duplicate its chart, tables or element breakdown. Interpret the structured result only if requested, or provide a text chart if explicitly requested.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "birth_date": {
                "description": "Birth date in the Gregorian calendar, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "birth_time": {
                "description": "Clock time on the birth record, 24-hour HH:MM, exactly as recorded (do not adjust for daylight saving). Omit when the user does not know it.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "birthplace": {
                "description": "Birth city as the user gave it, shown on the card. This is the place of birth, never the user's current location.",
                "maxLength": 120,
                "type": "string"
              },
              "gender": {
                "description": "Needed only for the 10-year luck pillars, whose direction depends on it.",
                "enum": ["male", "female"],
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language for chart labels. Use the closest match to the user's language; use en when none matches.",
                "enum": ["en", "zh", "zh-hant", "ja", "ko", "th", "id", "es", "pt", "fr"],
                "type": "string"
              },
              "longitude": {
                "description": "Longitude of the birth city in decimal degrees, east positive, used only for the true-solar-time correction. Give the city's longitude when the birth city is known; never the user's current location.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "timezone": {
                "description": "IANA time zone of the birthplace, for example Asia/Bangkok or America/New_York.",
                "type": "string"
              }
            },
            "required": ["birth_date", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://widget/bazi-chart.html"
            },
            "ui/resourceUri": "ui://widget/bazi-chart.html"
          },
          "digest": "sha256:e2643a3db42c6b4d8d8b9e06bc3fa15d277c527dc4fe8f553a414fe646f6c9ac"
        }
