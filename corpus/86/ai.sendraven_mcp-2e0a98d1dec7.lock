              },
              "decision": {
                "enum": ["approve", "reject"],
                "type": "string"
              },
              "id": {
                "description": "The approval's id from list_pending_approvals, not the message_id",
                "type": "string"
              },
              "reason": {
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["decided_by", "decision", "id"],
            "type": "object"
          },
