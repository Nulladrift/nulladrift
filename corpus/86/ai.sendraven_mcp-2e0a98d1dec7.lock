        {
          "name": "send_template_email",
          "description": "Send an email built from a stored template. Variable values are HTML-escaped on substitution, so they are safe to fill from user-supplied text. Nothing is sent when a value is missing: 422 missing_variables lists the names in `missing`, and a call with those filled in goes through (render_template checks this without sending). An unknown slug answers 422 invalid_request. The response has the same fields as send_email: id, status, thread_id, scheduled_at, skipped, reason and approval_id. Refusals, by type: 422 no_verified_identity (the From domain has no verified sending domain; a retry answers the same until it is added and verified); 422 invalid_request (a bad field, or more than 50 recipients across to, cc and bcc, which fit as separate messages or a campaign); 422 unknown_topic; 422 invalid_schedule; 403 recipient_not_allowed (this key's allowlist); 429 daily_limit (this key's daily cap; it resets tomorrow, and a retry today answers the same); four billing refusals, all 402 and none retryable — plan_limit_reached (the Free plan's 3,000 emails a month are spent; a person has to activate paid sending), payment_method_required (the workspace has never had a payment method verified, so no outbound email leaves it at all, including on Free; only a person can add one, in the dashboard), billing_past_due (the payment failed for good) and budget_exceeded (the workspace's own spend ceiling; by default it stops marketing and lets transactional through); 422 workspace_suspended and 422 no_postal_address (a person has to act). 502 ses_error is the provider, and a later retry with the same idempotency_key is safe. get_usage shows which of these applies before a send, and apart from ses_error none clears by repeating the call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "from": {
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Any unique string for this one message, e.g. 'welcome-ana-2026-09-15'. Retrying with the same key and the identical arguments returns the first answer instead of sending again. A key reused for a different message is refused with 422 idempotency_key_reused and nothing is sent. 409 idempotency_in_progress means the first attempt is still running; a retry with the same key a few seconds later returns its answer",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "reply_to": {
                "description": "Where replies go instead of from; outside SendRaven's domains they never reach a thread",
                "type": "string"
              },
              "scheduled_at": {
                "type": "string"
              },
              "subject": {
                "description": "Overrides the template's subject",
                "type": "string"
              },
              "template": {
                "description": "Template slug",
                "type": "string"
              },
              "to": {
                "description": "Recipient address, or 'Name <address>' to show their name",
                "type": "string"
              },
              "variables": {
                "additionalProperties": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["from", "template", "to", "variables"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send template email"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f75c63b61dd0a1475c08b55c17f216ee8200c41fbdcb866c3fcb9e552a476ecb"
        },
        {
          "name": "set_automation_status",
          "description": "Activate, pause or return an automation to draft. A new automation is a draft and sends nothing until it is set to 'active'. Pausing ('paused' or 'draft') holds everyone on their current step: nobody is sent a step and nobody new is enrolled, but nobody's sequence ends, and setting 'active' again continues each person from where they were, with steps that came due meanwhile going out from the next worker run at the usual pace. A step's content is read when it is sent, so a paused automation's steps can be fixed without deleting it. Activating does not re-check the sending domain; if it is no longer verified each enrolment fails at its next step. Returns the automation. Activating starts mail to everyone it enrols, so the status change is a person's decision to start or stop the sequence.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "automation_id": {
                "description": "The automation's id from list_automations (a UUID), not its name or slug",
                "type": "string"
              },
              "status": {
                "enum": ["active", "paused", "draft"],
                "type": "string"
              }
            },
            "required": ["automation_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Activate or pause automation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:46773b1d48bb2ab9ba77e90c849347da869da9acc94ab52de99559ec67b5300e"
        },
        {
