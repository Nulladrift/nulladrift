        {
          "name": "tag_contact",
          "description": "Add or remove tags on a contact. Tags are flat labels — vip, beta, churned — as opposed to custom properties, which are declared fields with a value. They are lower-cased and spaces become hyphens, so VIP and vip are the same tag. Tagging reaches the person across every audience they are on. list_tags returns the tags the workspace already uses, so an existing tag can be reused rather than a synonym created. Adding a tag an automation exits on (e.g. customer), or removing one it requires (e.g. trial), ends the person's enrolment in it at once. Adding a tag the contact did not already carry starts every active automation with a tag_added trigger on it, so a tag can put someone on a sequence; list_automations shows each automation's trigger. Returns the contact, as get_contact does, with its tags after the change. list_automation_enrollments with status 'canceled' shows which enrolments a tag change ended, with each row's cancel_reason (exit_tag or required_tag_missing).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "add": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "contact_id": {
                "description": "The contact's id (a UUID) from find_contact, add_contact or get_contact — not the email address. find_contact returns the id for an address.",
                "type": "string"
              },
              "remove": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["contact_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Tag contact"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f4c58320e0095ecbaeddca87a522e0206384cd19fb69495ba8fd230a0d277913"
        },
        {
          "name": "update_automation",
          "description": "Change a sequence's steps, the rules that take someone out of it (topic_key, exit_tags, required_tags, exit_on_reply), its reply_to, its reenrollment, or its default_variables (replaces the whole set; {} clears it). The trigger is fixed once created. steps replaces every step and is safe on a live automation only when each step you keep is passed back with the id get_automation returned: people on a step stay on it wherever it moves, a step without an id is new, and someone on a removed step continues from the next kept step after it (or completes). Read the automation first; an id it does not have is refused with 422 invalid_request naming the step, and nothing is changed. A reenrollment change applies from the next enrolment; nobody already enrolled is touched. Fields left out keep their value; a null topic_key or reply_to, or an empty tag list, clears it. People already enrolled see the change from their next step, so a mistaken edit can be put back before it has ended anyone's sequence. Clearing reply_to has replies threaded in SendRaven again, where they stop the drip on their own. A topic_key that names no existing topic is refused with 422 unknown_topic, any field other than these is refused with 422 invalid_request, and an unknown automation_id answers 404 not_found.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "automation_id": {
                "description": "The automation's id from list_automations (a UUID), not its name or slug",
                "type": "string"
              },
              "default_variables": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Template values every enrolment gets, under the variables an enrolment passes (which win). Required for contact_added and tag_added, which enrol with no values: every placeholder in the steps' subjects, html and templates needs one here, or the call answers 422 missing_variables naming the missing ones. Read at each step, so a fix reaches people already enrolled",
                "type": "object"
              },
              "exit_on_reply": {
                "description": "End the enrolment when the person replies. Defaults to true; false suits dunning",
                "type": "boolean"
              },
              "exit_tags": {
                "description": "Contact tags that end the sequence: nobody carrying one is enrolled, and adding one ends the enrolment. A trial sequence with exit tag 'customer' stops for someone tagged 'customer' when they upgrade",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "reenrollment": {
                "description": "after_completion (the default): someone whose enrolment completed or was cancelled can be enrolled again. never: each person goes through it once, and a later enrolment answers enrolled: false with reason previously_enrolled. never suits onboarding or a one-time offer, where a second run would mail someone the same sequence twice",
                "enum": ["after_completion", "never"],
                "type": "string"
              },
              "reply_to": {
                "description": "Where replies go instead of from, e.g. the founder's own inbox. SendRaven receives mail for its own domains only, so with a reply-to elsewhere a reply cannot stop the sequence, however exit_on_reply is set",
                "type": ["string", "null"]
              },
              "required_tags": {
                "description": "Tags a person must keep: only people carrying all of them are enrolled, and removing one ends the enrolment. Someone with no contact record has no tags, so is never enrolled",
                "items": {
                  "$ref": "#/properties/exit_tags/items"
                },
                "maxItems": 20,
                "type": "array"
              },
              "steps": {
                "description": "Every step, in the new order. Pass back each kept step's id; leaving the field out keeps the steps unchanged",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "condition": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "description": "One yes/no question asked when the step comes due. False skips the step (nothing sent) and the person moves on to the next one. The usual one: lacks_tag customer on an upgrade pitch",
                          "properties": {
                            "key": {
                              "description": "Required for attribute_equals",
                              "maxLength": 100,
                              "pattern": "^[a-zA-Z0-9_]+$",
                              "type": "string"
                            },
                            "tag": {
                              "$ref": "#/properties/exit_tags/items",
                              "description": "Required for has_tag and lacks_tag"
                            },
                            "type": {
                              "description": "has_tag / lacks_tag: the contact carries tag. engaged / not_engaged: the person opened or clicked anything this sequence has sent them so far, scanners excluded; not allowed on the first step. attribute_equals: the contact attribute key equals value, compared as text",
                              "enum": ["has_tag", "lacks_tag", "engaged", "not_engaged", "attribute_equals"],
                              "type": "string"
                            },
                            "value": {
                              "description": "Required for attribute_equals",
                              "type": ["string", "number", "boolean"]
                            }
                          },
                          "required": ["type"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "One yes/no question asked when the step comes due. False skips the step (nothing sent) and the person moves on to the next one. The usual one: lacks_tag customer on an upgrade pitch"
                    },
                    "delay_minutes": {
                      "description": "From enrolment for the first step, from the previous step for the rest. At most 525600 (one year)",
                      "maximum": 525600,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "html": {
                      "description": "Inline body; template_slug is the alternative. One of the two is required",
                      "type": "string"
                    },
                    "id": {
                      "description": "The step's stable id. On create, optional (generated when left out). On update_automation, pass back the id get_automation returned for every step you keep, or the people on it lose their place; leave it out only for a new step. An id the automation does not have is refused",
                      "pattern": "^[a-zA-Z0-9_-]{1,40}$",
                      "type": "string"
                    },
                    "subject": {
                      "maxLength": 998,
                      "minLength": 1,
                      "type": "string"
                    },
                    "template_slug": {
                      "description": "A template from list_templates, rendered with the enrolment's variables. Must already exist",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["delay_minutes", "subject"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "topic_key": {
                "anyOf": [
                  {
                    "anyOf": [
                      {
                        "not": {}
                      },
                      {
                        "minLength": 1,
                        "type": "string"
                      }
                    ],
                    "description": "Send every step under this topic (see list_topics). Its unsubscribe link then opts the person out of this kind of mail only, and opting out ends the sequence. Must be an existing topic's key; an unknown one is refused with 422 unknown_topic"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Send every step under this topic (see list_topics). Its unsubscribe link then opts the person out of this kind of mail only, and opting out ends the sequence. Must be an existing topic's key; an unknown one is refused with 422 unknown_topic"
              }
            },
            "required": ["automation_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update automation"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4b8b401f9c092e7cf883ba53a73a4f77dd8dc3b8c2fe295e73ec89d222412375"
        },
