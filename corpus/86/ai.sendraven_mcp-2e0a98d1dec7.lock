        {
          "name": "enroll_in_automation",
          "description": "Put someone into a multi-step sequence. Unlike several separately scheduled emails, the sequence stops on its own if they unsubscribe (from everything or from the automation's topic), reply, hard bounce, gain one of its exit tags, or lose one of its required tags, which would otherwise have to be tracked and cancelled by hand. A sequence stops for someone who converted when the contact is tagged with an exit tag; nothing needs cancelling. Enrolling the same person twice is a no-op, so a retry is harmless. The answer always carries enrolled, reason and enrollment: enrolled: true with reason null and the enrollment, or enrolled: false with enrollment null. enrolled: false with reason already_enrolled is that no-op. reason previously_enrolled means they have already been through it and the automation's reenrollment is 'never': that is the automation doing what it was told, not an error, and a retry answers the same. reason suppressed, unsubscribed_from_topic, exit_tag or required_tag_missing means they are deliberately excluded, by the person's own choice or the automation's rules. Those are all 200s. A 409 invalid_state means the automation cannot take anyone (not active, no steps, or its topic was deleted); a retry answers the same until a person changes the automation. A paused automation is not_active, but the people already in it are held, not dropped. The calling key's guardrails apply: a key that holds its sends for approval cannot enrol anyone (403 forbidden), because the steps later go out with no approval, and a key with a recipient allowlist can enrol only addresses on it (403 recipient_not_allowed).",
