      },
      "serverInfo": {
        "name": "sendraven",
        "title": "SendRaven",
        "version": "0.4.28"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "add_contact",
          "description": "Add someone to an audience. A contact exists once per workspace and can be on any number of audiences, so adding an address that already exists joins them to this list rather than creating a second copy. status records that the person opted out elsewhere — it writes the suppression as well as the flag, and an add never resubscribes someone who opted out here. Someone new to the audience starts any automation triggered by joining it; re-adding an existing member starts nothing. A retry has the same result. import_contacts adds up to 5,000 people in one call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "attributes": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Custom properties by key. An unknown key creates a string property.",
                "type": "object"
              },
              "audience_id": {
                "description": "The audience's id from list_audiences (a UUID), not its name. list_audiences maps each name to its id.",
                "type": "string"
              },
              "email": {
                "format": "email",
                "type": "string"
              },
              "first_name": {
                "maxLength": 120,
                "type": "string"
              },
              "last_active_at": {
                "description": "ISO 8601 time the person was last active in your product (a login, a session). Counted by a segment's engaged_within_days. Kept only if later than the stored value.",
                "format": "date-time",
                "type": "string"
              },
              "last_name": {
                "maxLength": 120,
                "type": "string"
              },
              "status": {
                "description": "Standing with the previous sender. unsubscribed suppresses for marketing; bounced and complained suppress for everything. Defaults to subscribed.",
                "enum": ["subscribed", "unsubscribed", "bounced", "complained"],
                "type": "string"
              },
              "tags": {
                "description": "Flat labels; lower-cased, spaces become hyphens",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["audience_id", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add contact"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2f4b64653dd77403e94a18e63e330cdd1f989c4786850f7acad0a354aca9df29"
        },
        {
          "name": "add_sending_domain",
          "description": "Register a sending domain and get back the DNS records to publish. It takes the domain mail is sent from — mail.<domain> and news.<domain> are provisioned beneath it and the right one is chosen per message, so a marketing complaint spike can never affect password reset delivery. subdomains names the pair differently (tx. and promo.), still one domain. risk_class provisions one identity on the domain exactly as given instead; it cannot be combined with subdomains. Two records come back marked optional: an inbound MX so replies land in threads, and a link. CNAME that turns on click tracking on the customer's own name once its certificate is issued. Adding a domain that already exists returns it rather than a duplicate. A public suffix such as co.uk or github.io is not a domain anyone can send from and is refused with 422 invalid_request; the domain registered under it, e.g. example.co.uk, is accepted. Passing mail.example.co.uk or news.example.co.uk is read as example.co.uk. A plan with no room for another domain answers 402 plan_limit_reached; a retry answers the same until a person upgrades or removes a domain.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The bare domain mail is sent from, e.g. example.com: no scheme, path or @, and not a public suffix",
                "minLength": 3,
                "type": "string"
              },
              "risk_class": {
                "description": "Omitted, both are provisioned, which almost every sender needs",
                "enum": ["transactional", "marketing"],
                "type": "string"
              },
              "subdomains": {
                "additionalProperties": false,
                "description": "Only to name the pair something other than mail. and news.; the two must differ",
                "properties": {
                  "marketing": {
                    "description": "One label, e.g. promo for promo.example.com. Default news",
                    "type": "string"
                  },
                  "transactional": {
                    "description": "One label, e.g. tx for tx.example.com. Default mail",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add sending domain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:abd54a1f7f648bda10ad7aa3d013417a78452a709d91dffe90af753d78fc7c8c"
        },
        {
          "name": "add_suppression",
          "description": "Stop sending to an address. Scope 'marketing' leaves transactional mail working; the default is 'all'. Reason 'unsubscribe' is a real opt-out: it also cancels the person's queued scheduled sends and ends their automation enrolments, which is what a person who asked to stop expects and 'manual' does not do. A hard bounce or complaint already on file is never replaced; the response is the stored suppression (id, email, reason, scope, detail, created_at), so its reason says which one stands.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "format": "email",
                "type": "string"
              },
              "reason": {
                "description": "Defaults to manual. unsubscribe also cancels queued mail and ends enrolments",
                "enum": ["manual", "list_hygiene", "unsubscribe"],
                "type": "string"
              },
              "scope": {
                "description": "Defaults to all",
                "enum": ["all", "transactional", "marketing"],
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Suppress address"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:dd8e3d311595a7dc1e5b32bee65f285acf27e2d2938e2df5756e0dc9c7c05b24"
        },
        {
          "name": "cancel_scheduled_email",
          "description": "Cancel a scheduled email before it sends. Only works while status is 'scheduled': a message that has already started sending, or is in any other state, answers 409 invalid_state naming its status; a retry answers the same, and get_email shows where it stands. An unknown id answers 404 not_found.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel scheduled email"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:82993a522da440cec3fe62dc1dee94170cf8679181a5cca3d0629d17d52e83e1"
        },
        {
          "name": "count_segment",
          "description": "How many contacts a segment currently matches. A filter that matches nobody shows up here as 0, before any campaign is built around it or sent. Engagement windows and date conditions (e.g. attributes.trial_ends_at within_next_days 3) are measured from the moment of the call, so the count of the same segment moves from day to day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Count segment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:04fc45f9e63ce73b915d843f04ed4a1e73dc6211e8d9a840e8667e93a72c28ba"
        },
        {
          "name": "create_automation",
          "description": "Define a multi-step sequence as a draft; nothing is sent until it is activated, from the dashboard or with set_automation_status. Unlike several separately scheduled emails, it ends on its own when the person unsubscribes, replies, bounces, opts out of its topic, or their tags say so. identity_id must be a marketing sending domain (see list_sending_domains; risk_class 'marketing') and from must sit on it; both are checked here rather than at the first send. reply_to sends replies somewhere other than from, and it disables the reply exit: SendRaven never sees mail sent to another domain. Every reference is checked now rather than at the first enrolment: an unknown topic_key (422 unknown_topic), a template_slug that does not exist, or a step with neither html nor template_slug is refused with 422 invalid_request, a from with no verified marketing domain answers 422 no_verified_identity, and a slug already in use in this workspace answers 409 conflict; list_automations shows the existing automation with that slug. reenrollment decides whether someone whose enrolment ended can be enrolled again: 'after_completion' (the default) allows it, 'never' enrols each person once. When one audience holds everyone, a contact_added trigger mails every new contact, while a tag_added trigger on a product's tag reaches only that product's people.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "default_variables": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Template values every enrolment gets, under the variables an enrolment passes (which win). Required for contact_added and tag_added, which enrol with no values: every placeholder in the steps' subjects, html and templates needs one here, or the call answers 422 missing_variables naming the missing ones. Read at each step, so a fix reaches people already enrolled",
                "type": "object"
              },
              "exit_on_reply": {
                "description": "End the enrolment when the person replies. Defaults to true; false suits dunning",
                "type": "boolean"
              },
              "exit_tags": {
                "description": "Contact tags that end the sequence: nobody carrying one is enrolled, and adding one ends the enrolment. A trial sequence with exit tag 'customer' stops for someone tagged 'customer' when they upgrade",
                "items": {
                  "$ref": "#/properties/steps/items/properties/condition/anyOf/0/properties/tag"
                },
                "maxItems": 20,
                "type": "array"
              },
              "from": {
                "description": "On the identity's domain, e.g. 'Ana <ana@news.example.com>'",
                "minLength": 3,
                "type": "string"
              },
              "identity_id": {
                "description": "A marketing sending domain's id from list_sending_domains (a UUID), not the domain name",
                "type": "string"
              },
              "name": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "reenrollment": {
                "description": "after_completion (the default): someone whose enrolment completed or was cancelled can be enrolled again. never: each person goes through it once, and a later enrolment answers enrolled: false with reason previously_enrolled. never suits onboarding or a one-time offer, where a second run would mail someone the same sequence twice",
                "enum": ["after_completion", "never"],
                "type": "string"
              },
              "reply_to": {
                "description": "Where replies go instead of from, e.g. the founder's own inbox. SendRaven receives mail for its own domains only, so with a reply-to elsewhere a reply cannot stop the sequence, however exit_on_reply is set",
                "type": "string"
              },
              "required_tags": {
                "description": "Tags a person must keep: only people carrying all of them are enrolled, and removing one ends the enrolment. Someone with no contact record has no tags, so is never enrolled",
                "items": {
                  "$ref": "#/properties/steps/items/properties/condition/anyOf/0/properties/tag"
                },
                "maxItems": 20,
                "type": "array"
              },
              "slug": {
                "description": "Lowercase letters, digits and hyphens",
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "steps": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "condition": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "description": "One yes/no question asked when the step comes due. False skips the step (nothing sent) and the person moves on to the next one. The usual one: lacks_tag customer on an upgrade pitch",
                          "properties": {
                            "key": {
                              "description": "Required for attribute_equals",
                              "maxLength": 100,
                              "pattern": "^[a-zA-Z0-9_]+$",
                              "type": "string"
                            },
                            "tag": {
                              "description": "Required for has_tag and lacks_tag",
                              "maxLength": 60,
                              "minLength": 1,
                              "type": "string"
                            },
                            "type": {
                              "description": "has_tag / lacks_tag: the contact carries tag. engaged / not_engaged: the person opened or clicked anything this sequence has sent them so far, scanners excluded; not allowed on the first step. attribute_equals: the contact attribute key equals value, compared as text",
                              "enum": ["has_tag", "lacks_tag", "engaged", "not_engaged", "attribute_equals"],
                              "type": "string"
                            },
                            "value": {
                              "description": "Required for attribute_equals",
                              "type": ["string", "number", "boolean"]
                            }
                          },
                          "required": ["type"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "One yes/no question asked when the step comes due. False skips the step (nothing sent) and the person moves on to the next one. The usual one: lacks_tag customer on an upgrade pitch"
                    },
                    "delay_minutes": {
                      "description": "From enrolment for the first step, from the previous step for the rest. At most 525600 (one year)",
                      "maximum": 525600,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "html": {
                      "description": "Inline body; template_slug is the alternative. One of the two is required",
                      "type": "string"
                    },
                    "id": {
                      "description": "The step's stable id. On create, optional (generated when left out). On update_automation, pass back the id get_automation returned for every step you keep, or the people on it lose their place; leave it out only for a new step. An id the automation does not have is refused",
                      "pattern": "^[a-zA-Z0-9_-]{1,40}$",
                      "type": "string"
                    },
                    "subject": {
                      "maxLength": 998,
                      "minLength": 1,
                      "type": "string"
                    },
                    "template_slug": {
                      "description": "A template from list_templates, rendered with the enrolment's variables. Must already exist",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["delay_minutes", "subject"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "topic_key": {
                "description": "Send every step under this topic (see list_topics). Its unsubscribe link then opts the person out of this kind of mail only, and opting out ends the sequence. Must be an existing topic's key; an unknown one is refused with 422 unknown_topic",
                "minLength": 1,
                "type": "string"
              },
              "trigger": {
                "additionalProperties": false,
                "properties": {
                  "audience_id": {
                    "description": "Required for contact_added and date; the audience's id, not its name",
                    "type": "string"
                  },
                  "date_attribute": {
                    "description": "Required for date: the contact attribute holding a YYYY-MM-DD date or ISO timestamp, e.g. renewal_date or birthday. Contacts whose value is in any other format are skipped",
                    "maxLength": 100,
                    "pattern": "^[a-zA-Z0-9_]+$",
                    "type": "string"
                  },
                  "event_name": {
                    "description": "Required for event, e.g. trial_started. Up to 120 characters, matched exactly",
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "kind": {
                    "description": "api: enrol with enroll_in_automation. contact_added: starts when someone joins audience_id. event: starts on emit_event with event_name. tag_added: starts when a contact gains tag (tag_contact, or a contact added carrying it); a contact that already had the tag starts nothing, so turning it on does not mail everyone tagged. date: starts for each contact in audience_id on the day (UTC) their date_attribute plus offset_days comes round, once per date; activating it never mails dates already passed or already inside the offset window, only those due from that day on",
                    "enum": ["api", "contact_added", "event", "tag_added", "date"],
                    "type": "string"
                  },
                  "offset_days": {
                    "description": "For date: days from the date, negative for before (-7 is a week before a renewal). Defaults to 0",
                    "maximum": 365,
                    "minimum": -365,
                    "type": "integer"
                  },
                  "recurring_yearly": {
                    "description": "For date: fire on every anniversary (birthdays, yearly renewals) rather than once. Defaults to false",
                    "type": "boolean"
                  },
                  "tag": {
                    "description": "Required for tag_added, e.g. audio-player. Normalised like contact tags",
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["kind"],
                "type": "object"
              }
            },
            "required": ["from", "identity_id", "name", "slug", "steps", "trigger"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create automation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1473a0af30ef245506ef0917726730192208cea4b17b2327a2fa5b714fcb4df2"
        },
        {
          "name": "create_broadcast",
          "description": "Create a campaign as a draft. Nothing is sent: preview_broadcast reports its reach and send_broadcast sends it. identity_id must be a marketing sending domain (see list_sending_domains; risk_class 'marketing'). topic_key must name an existing topic (list_topics); an unknown one is refused with 422 unknown_topic, since it would count everyone as opted out. A segment_id must filter the same audience as audience_id. An A/B test takes 2 to 10 'variants' that differ in subject, from_name or send_at, and optionally 'ab_test'. A subject or from-name test sends sample_share of the audience (default 0.2) split evenly across the variants, waits decide_after_minutes (default 240) after the sample is out, picks the variant with the best unique open rate (or click rate with metric 'click'), and sends the rest to it. Each variant needs at least 100 recipients in the sample or the send is refused — preview_broadcast shows the number. Metric 'click' only works once the domain has click tracking; until then every variant shows zero clicks and the first variant wins by default. The response's web_version_url is a public page of the campaign (one URL, no recipient's unsubscribe link) to share on a site or social post; null until click tracking is active.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ab_test": {
                "additionalProperties": false,
                "properties": {
                  "decide_after_minutes": {
                    "description": "How long after the sample is fully sent to decide; 15 to 10080, default 240",
                    "type": "integer"
                  },
                  "goal_id": {
                    "description": "metric 'conversion' only: an id from list_conversion_goals; every goal counts when omitted",
                    "type": "string"
                  },
                  "metric": {
                    "description": "What decides the winner; default 'open'. 'conversion' decides on people with a conversion attributed to the variant (needs a goal from list_conversion_goals and click tracking); give it decide_after_minutes of 1440 or more, since conversions arrive after the click",
                    "enum": ["open", "click", "conversion"],
                    "type": "string"
                  },
                  "sample_share": {
                    "description": "Share of the audience in the test, 0.05 to 1; default 0.2. Ignored for a send-time test",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "audience_id": {
                "description": "The audience's id from list_audiences (a UUID), not its name",
                "type": "string"
              },
              "from_name": {
                "description": "From display name, e.g. 'Ana at Example'",
                "type": "string"
              },
              "html": {
                "minLength": 1,
                "type": "string"
              },
              "identity_id": {
                "description": "A marketing sending domain's id from list_sending_domains (a UUID), not the domain name",
                "type": "string"
              },
              "name": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "segment": {
                "additionalProperties": false,
                "properties": {
                  "clicked_within_days": {
                    "maximum": 3650,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "date_conditions": {
                    "description": "Dates relative to now, all of which must hold. A contact with no value for the field never matches, so 'never opened' is not 'opened more than 30 days ago'",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "days": {
                          "maximum": 3650,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "field": {
                          "description": "created_at, last_opened_at, last_clicked_at, last_active_at, or attributes.<key> for a date-valued attribute (an ISO 8601 string), e.g. attributes.trial_ends_at",
                          "type": "string"
                        },
                        "op": {
                          "description": "older_than_days: more than N days ago. within_last_days: in the past N days. within_next_days: in the coming N days. after_next_days: more than N days from now",
                          "enum": ["older_than_days", "within_last_days", "within_next_days", "after_next_days"],
                          "type": "string"
                        }
                      },
                      "required": ["days", "field", "op"],
                      "type": "object"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "engaged_within_days": {
                    "description": "Only contacts who opened, clicked or were active in your product (last_active_at) in N days. Unlike exclude_unengaged_days, which keeps everyone new, this one filters a freshly imported list.",
                    "maximum": 3650,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "exclude_tags": {
                    "description": "Leave out contacts carrying any of these tags, e.g. ['premium']",
                    "items": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "exclude_unengaged_days": {
                    "description": "Drops mailed contacts with no open or click in N days; keeps anyone never mailed or added in the window",
                    "maximum": 3650,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "opened_within_days": {
                    "maximum": 3650,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "tags": {
                    "description": "Only contacts carrying every one of these tags, e.g. ['audio-player'] to mail one product's users from an audience that holds everyone. list_tags returns the tags that exist",
                    "items": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "segment_id": {
                "description": "A saved segment's id from list_segments (a UUID), not its name or key",
                "type": "string"
              },
              "subject": {
                "maxLength": 998,
                "minLength": 1,
                "type": "string"
              },
              "topic_key": {
                "description": "An existing topic's key from list_topics. Lets recipients opt out of this kind of mail only",
                "type": "string"
              },
              "variants": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "from_name": {
                      "description": "From display name for this variant; the campaign's when omitted",
                      "type": "string"
                    },
                    "key": {
                      "description": "A name for this variant, lowercase letters, digits, - or _: 'urgent', 'question'",
                      "maxLength": 32,
                      "type": "string"
                    },
                    "send_at": {
                      "description": "ISO 8601 send time, for a send-time test only. Set it on every variant or on none; a send-time test mails the whole audience, each variant at its own time, with nothing held back",
                      "type": "string"
                    },
