{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sendraven/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
