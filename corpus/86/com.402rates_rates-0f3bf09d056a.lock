      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "402rates-rates",
        "title": "Rates by 402rates",
        "version": "0.6.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "cheapest_settlement_chain",
          "title": "Cheapest chain for a USDC transfer",
          "description": "Returns only the single cheapest chain for a USDC transfer right now, its total transaction fee in USD, the scope of that figure and how long it stays valid. Free and deliberately minimal: no per-chain table, no runner-up, no fee components and no source provenance. The paid tool compare_settlement_costs returns the full comparison with every input disclosed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chains": {
                "description": "comma-separated subset of base, polygon, arbitrum, ethereum, xdc. Defaults to all five.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a742262d96d8532fe743a548bbacd74e7377158fb82521c4127c52cdcecf9386"
        },
        {
          "name": "compare_rwa_benchmark",
          "title": "Compare a supplied USD Treasury return with a matching benchmark",
          "description": "Free arithmetic comparison of a saved measured USD instrument response and caller-supplied US Treasury total-return index levels with identical dates. Simple actual/365; 28-32 days. Input provenance is not verified. Spot rates, unmatched windows, quoted yields and other currencies are not comparable. The spread does not establish fees or causality.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "benchmark": {
                "additionalProperties": {},
                "description": "kind us_treasury_total_return_index, currency USD, start_date/end_date, positive start_value/end_value, HTTPS source_url and retrieved_at date. Caller declarations only.",
                "type": "object"
              },
              "snapshot": {
                "additionalProperties": {},
                "description": "Saved single-instrument response, schema_version 0.5.0, with a measured USD return.",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c3fece2821f3990d9c87e08c410a9fd70d075700b67e088fc913cdb555dd844"
        },
        {
          "name": "compare_rwa_snapshots",
          "title": "Compare yield and divergence fields in two saved Treasury responses",
          "description": "Free comparison of two supplied 402rates Treasury snapshots: yield, issuer divergence, source identifiers, calculation windows and data availability. Reports numeric threshold crossings without assigning economic significance. No new data access, authentication of snapshots, historical reconstruction or automatic monitoring. Examples are synthetic.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "after": {
                "additionalProperties": {},
                "description": "Later saved response. Input origin is not independently authenticated.",
                "type": "object"
              },
              "before": {
                "additionalProperties": {},
                "description": "Earlier saved yields, single instrument or complete instrument response; schema_version 0.5.0.",
                "type": "object"
              },
              "threshold_bps": {
                "description": "Absolute change in issuer_vs_basis_bps to flag, default 5; zero flags only nonzero changes.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f11eec0e489fba5b07746db3fe71d3bbb83066325f029663ff4debc473bb8da"
        },
        {
          "name": "compare_settlement_costs",
          "title": "Measured cost of a USDC transfer per chain, cheapest first",
          "description": "Measured USDC transfer costs on Base, Polygon, Arbitrum, Ethereum and XDC: simulated gas, current token prices, fresh chain heads and applicable rollup L1 fees. Inputs and block references accompany each figure. Cheapest first; unmeasurable chains are excluded, not estimated. Business/professional use only. Terms: https://402rates.com/data-terms/ Price: 0.01 USDC per call over x402.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chains": {
                "description": "comma-separated subset of base, polygon, arbitrum, ethereum, xdc. Defaults to all five.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ba57c5cdd704abc8dd5d153ab4eb4f91b5cfe6e646ac6ed4328a4b5c3fb8a520"
        },
        {
          "name": "estimate_payment_costs",
          "title": "Calculate workload costs from supplied payment profiles",
          "description": "Free exact-decimal calculation from caller-supplied prices, fees and setup costs for a planned number of calls. Separates locked capital and batches; unknown costs stay unknown. Compares complete profiles only within the same currency. No exchange-rate conversion, external fee measurement, payment or verification of supplied inputs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "calls": {
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "profiles": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "currency": {
                      "description": "Denomination for every amount in this profile. Codes remain distinct; no conversion or peg assumption.",
                      "enum": ["USD", "EUR", "GBP", "CHF", "JPY", "USDC", "USDT", "XDC", "XRP", "ETH", "BTC", "SOL"],
                      "type": "string"
                    },
                    "id": {
                      "maxLength": 80,
                      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,79}$",
                      "type": "string"
                    },
                    "label": {
                      "maxLength": 120,
                      "minLength": 1,
                      "pattern": "^[^\\u0000-\\u001f\\u007f]+$",
                      "type": "string"
                    },
                    "locked_capital": {
                      "anyOf": [
                        {
                          "description": "Nonnegative amount in the profile currency's whole units, not atomic units. At most 30 integer and 18 fractional digits; no exponent notation.",
                          "maxLength": 49,
                          "pattern": "^(0|[1-9][0-9]{0,29})(\\.[0-9]{1,18})?$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Caller capital held separately from expenditure, in the profile currency, or null when unknown. Excluded from totals."
                    },
                    "network_per_call": {
                      "anyOf": [
                        {
                          "description": "Nonnegative amount in the profile currency's whole units, not atomic units. At most 30 integer and 18 fractional digits; no exponent notation.",
                          "maxLength": 49,
                          "pattern": "^(0|[1-9][0-9]{0,29})(\\.[0-9]{1,18})?$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Additional network expenditure borne by the caller per call, or null when unknown."
                    },
                    "payment_per_call": {
                      "description": "Caller payment for the purchased service per call, in whole profile-currency units. Included in modeled expenditure.",
                      "maxLength": 49,
                      "pattern": "^(0|[1-9][0-9]{0,29})(\\.[0-9]{1,18})?$",
                      "type": "string"
                    },
                    "provider_per_call": {
                      "anyOf": [
                        {
                          "description": "Nonnegative amount in the profile currency's whole units, not atomic units. At most 30 integer and 18 fractional digits; no exponent notation.",
                          "maxLength": 49,
                          "pattern": "^(0|[1-9][0-9]{0,29})(\\.[0-9]{1,18})?$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Additional fee paid by the caller to the provider per call, beyond payment_per_call. Not the provider internal operating cost."
                    },
                    "settlement_cost": {
                      "anyOf": [
                        {
                          "description": "Nonnegative amount in the profile currency's whole units, not atomic units. At most 30 integer and 18 fractional digits; no exponent notation.",
                          "maxLength": 49,
                          "pattern": "^(0|[1-9][0-9]{0,29})(\\.[0-9]{1,18})?$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Additional caller expenditure per settlement, or null when unknown. Omission remains unknown."
                    },
                    "settlement_every_calls": {
                      "description": "Calls per settlement. Default 1; the final incomplete batch incurs one full settlement cost.",
                      "maximum": 1000000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "setup_cost": {
                      "anyOf": [
                        {
                          "description": "Nonnegative amount in the profile currency's whole units, not atomic units. At most 30 integer and 18 fractional digits; no exponent notation.",
                          "maxLength": 49,
                          "pattern": "^(0|[1-9][0-9]{0,29})(\\.[0-9]{1,18})?$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "One-time setup expenditure borne by the caller for this workload, or null when unknown."
                    },
                    "source": {
                      "additionalProperties": true,
                      "properties": {
                        "observed_at": {
                          "description": "Caller-stated UTC timestamp at or before report generation. Not independently authenticated.",
                          "type": "string"
                        },
                        "url": {
                          "description": "Caller-supplied HTTPS source reference without credentials, query or fragment. Never fetched.",
                          "maxLength": 2000,
                          "type": "string"
                        }
                      },
                      "required": ["observed_at", "url"],
                      "type": "object"
                    }
                  },
                  "required": ["currency", "id", "locked_capital", "network_per_call", "payment_per_call", "provider_per_call", "setup_cost"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "workload": {
                "description": "Shared caller-defined workload identifier. One call denotes the same declared unit of delivered work in every profile; equivalence is not verified.",
                "maxLength": 80,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,79}$",
                "type": "string"
              }
            },
            "required": ["calls", "profiles", "workload"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3f0a37c31572df9da4fef41bb6b54676cf52ef16435d949b8206bc924bd6139f"
        },
        {
          "name": "get_manifest",
          "title": "Get the manifest for Rates by 402rates",
          "description": "Free OpenAPI manifest for Rates by 402rates. Contains this product and shared service information only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "base_url": {
                "description": "absolute origin to render into the manifest's servers block. Defaults to the configured public base URL.",
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4ad06b81e2fd7cc37cfb0d2ca5bbab3d974da78baef76e77408659f9fc6db30c"
        },
        {
          "name": "get_rwa_history",
          "title": "Get one RWA source history",
          "description": "Returns free normalized observations for one tracked instrument, one reconstructible recorder source and one inclusive date window. Every point carries value, date, source id, revision and source-time versus read-time dating. Omit source_id to list the instrument's audited sources. The five current-only issuer series return HISTORY_SOURCE_RESERVED with the data-use URL, never an empty gap. Shares the instrument view's three-ticker rolling-hour breadth limit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date_from": {
                "description": "inclusive first observation date in YYYY-MM-DD form; required with source_id",
                "maxLength": 10,
                "type": "string"
              },
              "date_to": {
                "description": "inclusive last observation date in YYYY-MM-DD form; required with source_id",
                "maxLength": 10,
                "type": "string"
              },
              "source_id": {
                "description": "one source id belonging to ticker. Omit it to list that instrument's sources without observations.",
                "maxLength": 160,
                "type": "string"
              },
              "ticker": {
                "description": "tracked instrument ticker, case-insensitive. Omit it to list tickers and audited history sources.",
                "maxLength": 32,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:22dcc1f1b9b31538ec82e0353ab55fd2a06226bc30653ff706a21bb09eb190bb"
        },
        {
          "name": "get_rwa_instrument",
          "title": "Get one RWA instrument state",
          "description": "Returns the free frozen-contract state view for one tracked tokenized treasury: identity, Open Treasury Yield Basis result or explicit unavailable reason, issuer-term evidence cells, verified deployments and evidence dates. Three distinct tickers are free per caller in a rolling hour; repeats stay free, and the fourth returns BREADTH_LIMIT with the paid complete-snapshot path. An omitted ticker returns only the known ticker list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "tracked instrument ticker, case-insensitive. Omit it to receive the complete known ticker list.",
                "maxLength": 32,
                "type": "string"
              },
              "version": {
                "description": "1 retains the original record. 2 adds separately sourced access evidence.",
                "enum": ["1", "2"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e23bffaabb9142963d0727b431f723cc30486bd1a045e71f9b3989a5f4063561"
        },
        {
          "name": "get_rwa_instruments",
          "title": "Complete evidence snapshot for all tracked tokenized treasuries",
          "description": "Complete evidence snapshot for 13 tokenized treasury funds: yield or gap, measured size, subscription/redemption minimums, fees, settlement, access conditions, chain conflicts, quotes, URLs and dates. Same records as the free instrument view. Internal use with attribution included; continuous access, change notices and customer-facing use are separate. Business/professional use only. Terms: https://402rates.com/data-terms/ Price: 5 USDC per call over x402.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "version": {
                "description": "1 retains the original snapshot. 2 adds access evidence to each instrument.",
                "enum": ["1", "2"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d8740d89e4d09bb288f5ce4e660767c4c6095b9a34aa1d294fc4dc15159da8bc"
        },
        {
          "name": "get_rwa_yields",
          "title": "Realised 30-day yields of tokenized treasuries, recomputable",
          "description": "Realised 30-day yields for 13 tokenized treasury funds under the Open Treasury Yield Basis. Measured rows use NAV, price or verified passive-holder balances, with observations, sources and dates. Issuer figures and differences appear where available. Quoted and unavailable rows stay explicit; free coverage lists funds and gaps. Business/professional use only. Terms: https://402rates.com/data-terms/ Price: 0.03 USDC per call over x402.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "instruments": {
                "description": "comma-separated instrument tickers or ids; omitted means all tracked instruments",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0714b206e9cdf9ed85d589906f64451e130c64abbda0b3b744597575aa3ef7d3"
        },
        {
          "name": "list_capabilities",
          "title": "List capabilities for Rates by 402rates",
          "description": "Free capability and MCP tool catalogue for Rates by 402rates. Contains this product and shared service information only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
