        },
        {
          "name": "list_rwa_updates",
          "title": "Read observed Treasury changes since a saved cursor",
          "description": "Free cursor-based Treasury change notices. Instrument scope retains version 1; market and access scopes use version 2 and independent cursors. Source dates and digests remain distinct from retrieval times. Up to 90-day retention subject to source permissions. No paid market values or reconstruction before the first baseline.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "next_cursor from an earlier response; an expired cursor requires a fresh baseline.",
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "scope": {
                "description": "instrument retains version 1. market and access select version 2 with independent cursors.",
                "enum": ["instrument", "market", "access"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c51078c1b4fb28733a95c43c2c049222347614d629fe3c8089a441e272326531"
        },
        {
          "name": "read_rwa_access_evidence",
          "title": "Read dated Treasury access and settlement documentation",
          "description": "Free source-backed documentation of Treasury distribution and asset-settlement protocols. Distinguishes an announced access path from an identified fund and a protocol from a deployed fund integration. Unknown fund identity, investor access and liquidity remain explicit. No live quote, execution or eligibility determination.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "record_id": {
                "description": "Optional record identifier. Version 2 returns its available record index when no selection is supplied.",
                "maxLength": 120,
                "type": "string"
              },
              "ticker": {
                "description": "Version 2 only: select retained instrument and access evidence for one ticker.",
                "maxLength": 32,
                "type": "string"
              },
              "version": {
                "description": "Optional evidence contract version. Omitted keeps version 1.",
                "enum": ["1", "2"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
