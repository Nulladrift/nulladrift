{
  "lockfileVersion": 2,
  "subjects": {
    "app.kartic/digital-loyalty-stamp-cards": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.kartic.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "kartic",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Kartic helps venues run digital loyalty stamp cards in Google Wallet. For discovery questions use explain_loyalty_setup, list_supported_use_cases, or get_started. For a connected merchant account use list_card_programs, get_business_stats, search_customers, or send_wallet_notification. Do not start subscription checkout inside the chat.",
      "tools": [
        {
          "name": "explain_loyalty_setup",
          "title": "Explain Kartic loyalty setup",
          "description": "Use when someone asks how digital loyalty / stamp cards work with Kartic, or how to set up a Wallet punch card. Returns a short English overview and steps. Do not use for competitor comparisons or pricing checkout.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b6beb58b7617db342edf26de471ba15da1e844942929c5314d05b2a4e842ba8"
        },
        {
          "name": "get_business_stats",
          "title": "Get business stats",
          "description": "Use when a signed-in merchant asks for stamp/customer/reward stats. Requires owner or manager. Returns a short analytics snapshot for the last N days (default 30).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "description": "Lookback window in days (default 30)",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d44b081900b76929db235317119922ec6ce045c71ad501cac93d3f67519450ff"
        },
        {
          "name": "get_started",
          "title": "Get started with Kartic",
          "description": "Use when a venue wants to start using Kartic. Returns informational links (website, privacy, support). Does not start checkout or payment.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:152c8522e6eec74f6179c248cdefce378c7fe621d78d7e89de0d9d2c164e73ea"
        },
        {
          "name": "list_card_programs",
          "title": "List loyalty cards",
          "description": "Use when a signed-in merchant asks which stamp cards they have. Requires a connected Kartic account. Returns card names, slug, stamps required, reward, and language.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1f4265701a982221d639d29f25bac0d74e212c31443390a1843acdec367dcf3"
        },
        {
          "name": "list_supported_use_cases",
          "title": "List supported venue types",
          "description": "Use when asked which businesses Kartic fits (salon, café, bakery, gym, etc.). Returns industry examples for digital stamp cards.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:688d0ab8db7c76e2b78a568dcea94609ee194d6d1b5bef99bbfa33c3b4e98d2d"
        },
        {
          "name": "search_customers",
          "title": "Search customers",
          "description": "Use when a signed-in merchant wants to find customers by name or phone. Requires owner or manager. Returns matching cards with stamp counts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name or phone fragment to search",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d75e8be1e188b985baf643590516bcaf605afbc461e395761e6e35dba0472a3a"
        },
        {
          "name": "send_wallet_notification",
          "title": "Send Wallet notification",
          "description": "Use when a signed-in merchant wants to send a Google Wallet push message to holders of one stamp card. Requires owner or manager. Limited to a few sends per 24 hours. Side effect: sends a real notification to customers.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "body": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "header": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "program_id": {
                "description": "Card program id from list_card_programs",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["body", "header", "program_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:46ff54cfd248928ae24849371ff01efeec416b6be632df29e3ea4274dade20b8"
        }
      ],
      "digest": "sha256:f0a998a71c0368251ccc966e529955c4b6811145cceee42b3e1aa9268a20c99f"
    }
  }
}
