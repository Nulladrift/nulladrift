{
  "lockfileVersion": 2,
  "subjects": {
    "com.getgyeol.app/site-maker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.getgyeol.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gyeol-site-maker",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Website drafts for small businesses by GYEOL. Read the user's site first (gyeol_read_site), then gyeol_make_draft, then give the user previewUrl and claimUrl.",
      "tools": [
        {
          "name": "gyeol_make_draft",
          "description": "Create a free AI website draft (Korean + English, multi-page, mobile-first) from an existing site URL and/or a short description. Takes 30–90 seconds. Returns previewUrl (open it), claimUrl (the user signs in there to own and edit the draft — free, no card), pages, and what still needs the owner (photos, prices). Max 3 per hour per caller.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Neighborhood/city (optional)",
                "type": "string"
              },
              "kind": {
                "description": "What the business does, e.g. \"cafe\", \"pilates studio\", \"dental clinic\", \"app\"",
                "type": "string"
              },
              "menu": {
                "description": "Key items with prices, one per line, e.g. \"Latte 5,500원\" (optional, only real ones)",
                "type": "string"
              },
              "name": {
                "description": "Business name (optional if url given)",
                "type": "string"
              },
              "notes": {
                "description": "Anything the owner said: mood, colors (#hex ok), who the customers are, phone, KakaoTalk channel URL (optional)",
                "type": "string"
              },
              "url": {
                "description": "Existing website to migrate (optional if name+kind given)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5dded56a90f679e14d770528aad48dfa35bcbc99eef09688da40623cbe8c108a"
        },
        {
          "name": "gyeol_pricing",
          "description": "GYEOL (결) pricing for a small-business website: one-time build plans and monthly care plans (hosting, inquiries, AI edits by points). Korean won, VAT excluded. Also what is free (3 AI drafts).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:11f5ddcd0997b4e0a0d2954c606a10a967c2abe47ebc1f30c2bc0d925738a419"
        },
        {
          "name": "gyeol_read_site",
          "description": "Read an existing business website (home + menu pages): title, pages, phone/address/hours found, brand colors & fonts, photo count. Use before gyeol_make_draft to show the user what will be migrated. Instagram/Naver Place links are not readable.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "https:// address of the existing site",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c9537aff0b4cb8944372882354ebe88158f1ef4e3b44e8491d0d457e5bf175c"
        }
      ],
      "digest": "sha256:5fb3ff870c30fdfba16aaebb16d7c917c353c4dcd6c74a333bcc626caa94ea7b"
    }
  }
}
