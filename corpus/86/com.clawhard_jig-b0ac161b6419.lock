          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Jig: Jig checks JSON against a JSON Schema and lists every problem with its exact path, expected value and a retry message for the model. It also checks the schema itself: valid JSON Schema or not, and whether OpenAI strict mode, Claude structured outputs and Gemini structured output accept it, with a converted copy for each. No account. Use it when someone needs to check JSON against a JSON Schema with exact error paths, or wants to know whether a schema is valid and whether OpenAI, Claude and Gemini strict / structured-output modes accept it. Tools: jig_validate_json (Validate JSON against a JSON Schema (every error with its path)); jig_check_schema (Check a JSON Schema, and whether OpenAI, Claude and Gemini strict modes accept it). Results include a link (open_url) that the user can open to see the same result on the website.",
      "tools": [
        {
          "name": "jig_check_schema",
          "title": "Check a JSON Schema, and whether OpenAI, Claude and Gemini strict modes accept it",
          "description": "Use when the user asks whether a JSON Schema is valid, or whether it will work with OpenAI Structured Outputs or function calling with strict: true, Claude structured outputs or strict tool use, or Gemini structured output (response_json_schema), or is writing a tool or function schema, an MCP inputSchema, a response_format, or a schema exported from Zod or Pydantic (signals: \"Invalid schema for response_format\", \"strict mode error\", \"Claude returns 400 for my schema\", \"will this schema work with OpenAI\", \"Gemini ignores maxLength\", \"additionalProperties false\", \"all fields must be required\"). First checks the schema against its draft: type names like \"int\", \"required\": true on a property, misspelt keywords, unresolvable $ref, invalid regex, impossible ranges. Then checks each provider's documented rules: OpenAI (every property in required, additionalProperties false on every object, root an object and not anyOf, no allOf/not/if, at most 5000 properties, 10 levels, 1000 enum values, documented formats only), Claude (additionalProperties false, no minimum/maximum/multipleOf/minLength/maxLength, minItems only 0 or 1, no recursion, at most 24 optional and 16 union-typed parameters per request, regex without lookarounds or backreferences), Gemini (minLength, maxLength, uniqueItems, minProperties and similar are dropped without an error). Returns per provider a verdict (ok, warnings, fails), each issue with its JSON Pointer path, rule, fix and the provider's doc URL, plus a converted copy the provider accepts (optional fields made required and nullable for OpenAI, unsupported constraints moved into descriptions the way the official SDK helpers do), and counts (properties, depth, optional and union-typed parameters). Example: {\"schema\":{\"type\":\"object\",\"properties\":{\"city\":{\"type\":\"string\",\"maxLength\":40},\"days\":{\"type\":\"integer\",\"minimum\":1}},\"required\":[\"city\"]},\"providers\":[\"openai\",\"anthropic\"]}. Rules are from each provider's docs, checked 2026-11-18; providers can change them, and very large schemas can still hit unpublished size limits.",
          "inputSchema": {
            "properties": {
              "draft": {
                "description": "Force a draft: 2020-12, 2019-09, 7, 6 or 4. Default: from $schema, else 2020-12.",
                "enum": ["2020-12", "2019-09", "7", "6", "4"],
                "type": "string"
              },
              "include_converted": {
                "description": "Include a converted copy for each provider that does not accept the schema as is. Default true.",
                "type": "boolean"
              },
              "providers": {
                "description": "Which providers to check. Default: all three.",
                "items": {
                  "enum": ["openai", "anthropic", "gemini"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "schema": {
                "description": "The JSON Schema to check, as a JSON object (not a string).",
                "type": "object"
              }
            },
            "required": ["schema"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a JSON Schema, and whether OpenAI, Claude and Gemini strict modes accept it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/jig/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/jig/result"
          },
          "digest": "sha256:b26dd0b65dcd1bb904cc075508b5b8c4934e2bbb240df7f7882edb924dfdb0e6"
        },
        {
          "name": "jig_validate_json",
          "title": "Validate JSON against a JSON Schema (every error with its path)",
          "description": "Use when the user asks whether some JSON matches a JSON Schema, or when JSON from a model reply, structured output, tool call, API response or file has to be checked against its schema before it is used or stored (signals: \"validate this JSON\", \"does this match the schema\", \"which field is wrong\", \"the model returned bad JSON\", \"check the tool-call arguments\", \"why does my parser reject this\"). Validates a JSON value (data), or raw model text (json_text: a ```json fence or prose around one JSON value is stripped; a syntax error comes back with line and column), against JSON Schema draft 2020-12, 2019-09, 07, 06 or 04, including $ref/$defs, anyOf/oneOf/allOf, if/then/else, unevaluatedProperties, patterns and formats (email, date-time, date, time, uuid, uri, hostname, ipv4, ipv6, duration). Returns valid true/false, every problem with its JSON Pointer path, keyword, expected and got values, and retry_message: a ready-to-send list of fixes for the model that produced the JSON. Example: {\"schema\":{\"type\":\"object\",\"properties\":{\"price\":{\"type\":\"number\"}},\"required\":[\"price\",\"sku\"]},\"data\":{\"price\":\"12.50\"}}. Gives the expected answer on 6,018 of 6,227 official JSON-Schema-Test-Suite cases (ajv 8: 5,981); most misses are external $ref URLs, which are not fetched, $dynamicRef, and the idn-email, idn-hostname and iri formats, which are not checked. Not for repairing broken JSON syntax or for checking whether a schema works with OpenAI, Claude or Gemini (jig_check_schema).",
          "inputSchema": {
            "properties": {
              "check_formats": {
                "description": "Check \"format\" (email, date-time, uuid, uri, ...). Default true.",
                "type": "boolean"
              },
              "data": {
                "anyOf": [
                  {
                    "type": "object"
                  },
                  {
                    "type": "array"
                  },
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The JSON value to check: object, array, string, number, boolean or null. Use this or json_text."
              },
              "draft": {
                "description": "Force a draft: 2020-12, 2019-09, 7, 6 or 4. Default: from $schema, else 2020-12.",
                "enum": ["2020-12", "2019-09", "7", "6", "4"],
                "type": "string"
              },
              "json_text": {
                "description": "Raw text that should contain one JSON value, for example a model reply. Code fences and text around the JSON are stripped. Use this or data.",
                "maxLength": 300000,
                "type": "string"
              },
              "max_errors": {
                "description": "Most errors to list (default 50). error_count is always the full count.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "schema": {
                "description": "The JSON Schema, as a JSON object (not a string). $schema picks the draft; default 2020-12.",
                "type": "object"
              }
            },
            "required": ["schema"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate JSON against a JSON Schema (every error with its path)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
