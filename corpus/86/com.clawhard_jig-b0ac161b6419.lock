        "name": "com.clawhard/jig",
        "title": "Jig",
        "version": "1.0.0",
        "description": "Jig checks JSON against a JSON Schema and lists every problem with its exact path, expected value and a retry message for the model. It also checks the schema itself: valid JSON Schema or not, and whether OpenAI strict mode, Claude structured outputs and Gemini structured output accept it, with a converted copy for each. No account.",
        "websiteUrl": "https://jig.clawhard.com",
        "icons": [
          {
            "src": "https://clawhard.com/icon-512.png",
