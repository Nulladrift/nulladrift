          "name": "sobre_sarao",
          "title": "Sobre Sarao",
          "description": "Lo que no es buscar eventos: quién hace Sarao y cómo contactarle, qué ciudades cubre (si preguntan por otra, dilo y ofrece los hackathons de toda España), enlaces para proponer un evento, apuntarse al boletín o montar su propio asistente con el MCP, y qué hacer si alguien deja una sugerencia.",
