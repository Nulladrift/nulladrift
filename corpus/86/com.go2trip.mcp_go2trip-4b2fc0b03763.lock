{
  "lockfileVersion": 2,
  "subjects": {
    "com.go2trip.mcp/go2trip": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.go2trip.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "go2trip",
        "title": "Go2Trip",
        "version": "1.0.0",
        "websiteUrl": "https://www.go2trip.com",
        "icons": [
          {
            "src": "data:image/png;base64,",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "search_flights",
          "title": "Search Flights",
          "description": "Search flights between any two cities worldwide on Go2Trip. Returns a curated set of options, each tagged with one or more categories:\n- **best**: the engine's recommended balance of price, total duration, and stops.\n- **cheapest**: lowest total price.\n- **fastest**: shortest total travel time.\nThe categories overlap — a single flight can be both best and cheapest. Each option includes price, total durations, layovers, its `categories`, and a direct booking link on the Go2Trip site for the chosen `market`. Options may include `seats_remaining` — the number of seats left in this booking class at this price; values of 4 or fewer indicate limited availability.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adults": {
                "default": 1,
                "description": "Number of adult passengers (0–9)",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "children": {
                "default": 0,
                "description": "Number of child passengers (0–9)",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "departure_date": {
                "description": "Departure date in YYYY-MM-DD format",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "3-letter IATA city or airport code (e.g. 'TLV', 'LON', 'MAD')",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "flight_class": {
                "default": "tour",
                "description": "Cabin class: tour (economy), tourPlus (premium economy), business, or first",
                "enum": ["tour", "tourPlus", "business", "first"],
                "type": "string"
              },
              "infants": {
                "default": 0,
                "description": "Number of infant passengers (0–9)",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "language": {
                "default": "en",
                "description": "Language for the interactive results widget. English only.",
                "enum": ["en"],
                "type": "string"
              },
              "market": {
                "default": "uk",
                "description": "Go2Trip country site to search and book on: 'uk' (United Kingdom), 'ae' (United Arab Emirates), 'qa' (Qatar), 'au' (Australia), 'cy' (Cyprus), 'cz' (Czech Republic), 'gr' (Greece), 'mt' (Malta) or 'sk' (Slovakia). Use the site of the user's country of residence when the conversation makes it clear and it is one of these; otherwise use 'uk'. Prices come back in that site's currency and the booking link opens on that site.",
                "enum": ["uk", "ae", "qa", "au", "cy", "cz", "gr", "mt", "sk"],
                "type": "string"
              },
              "origin": {
                "description": "3-letter IATA city or airport code (e.g. 'TLV', 'LON', 'MAD')",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "return_date": {
                "description": "Return date for round trips (YYYY-MM-DD). Omit for one-way.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "seniors": {
                "default": 0,
                "description": "Number of senior passengers (0–9)",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["departure_date", "destination", "origin"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "flights": {
                "description": "Matching options, capped at 30",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "categories": {
                      "description": "Which curated selections this flight appeared in; may be more than one",
                      "items": {
                        "enum": ["best", "cheapest", "fastest"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "currency": {
                      "description": "ISO currency code of `price`",
                      "type": "string"
                    },
                    "deep_link": {
                      "description": "Link to complete this booking on the Go2Trip site for the searched market",
                      "type": "string"
                    },
                    "inbound": {
                      "$ref": "#/properties/flights/items/properties/outbound",
                      "description": "Absent on one-way trips"
                    },
                    "outbound": {
                      "additionalProperties": false,
                      "properties": {
                        "arrival_local": {
                          "type": "string"
                        },
                        "departure_local": {
                          "type": "string"
                        },
                        "duration_minutes": {
                          "type": "number"
                        },
                        "flights": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "arrival_local": {
                                "type": "string"
                              },
                              "brand": {
                                "description": "Fare brand, e.g. 'LITE', 'FLEX'",
                                "type": "string"
                              },
                              "cabin": {
                                "description": "Raw cabin code, e.g. 'Y', 'C'/'J', 'F'",
                                "type": "string"
                              },
                              "checked_bag_included": {
                                "type": "boolean"
                              },
                              "departure_local": {
                                "type": "string"
                              },
                              "duration_minutes": {
                                "type": "number"
                              },
                              "flight_number": {
                                "type": "string"
                              },
                              "from": {
                                "type": "string"
                              },
                              "seats_remaining": {
                                "type": "number"
                              },
                              "terminal_from": {
                                "type": "string"
                              },
                              "terminal_to": {
                                "type": "string"
                              },
                              "to": {
                                "type": "string"
                              }
                            },
                            "required": ["arrival_local", "departure_local", "duration_minutes", "flight_number", "from", "to"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "from": {
                          "type": "string"
                        },
                        "layovers": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "airport_code": {
                                "type": "string"
                              },
                              "arrival_local": {
                                "type": "string"
                              },
                              "departure_local": {
                                "type": "string"
                              }
                            },
                            "required": ["airport_code", "arrival_local", "departure_local"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "to": {
                          "type": "string"
                        }
                      },
                      "required": ["arrival_local", "departure_local", "duration_minutes", "flights", "from", "layovers", "to"],
                      "type": "object"
                    },
                    "price": {
                      "description": "Total trip price for all passengers",
                      "type": "number"
                    },
                    "pricing_details": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "passenger_type": {
                            "enum": ["ADT", "CHD", "INF", "YCD"],
                            "type": "string"
                          },
                          "total_price": {
                            "type": "number"
                          }
                        },
                        "required": ["passenger_type", "total_price"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "seats_remaining": {
                      "description": "Seats bookable at this price; 4 or fewer means limited availability",
                      "type": "number"
                    }
                  },
                  "required": ["categories", "outbound", "pricing_details"],
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "additionalProperties": false,
                "description": "The search parameters, with defaults applied",
                "properties": {
                  "adults": {
                    "default": 1,
                    "description": "Number of adult passengers (0–9)",
                    "maximum": 9,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "children": {
                    "default": 0,
                    "description": "Number of child passengers (0–9)",
                    "maximum": 9,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "departure_date": {
                    "description": "Departure date in YYYY-MM-DD format",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "destination": {
                    "description": "3-letter IATA city or airport code (e.g. 'TLV', 'LON', 'MAD')",
                    "maxLength": 3,
                    "minLength": 3,
                    "type": "string"
                  },
                  "flight_class": {
                    "default": "tour",
                    "description": "Cabin class: tour (economy), tourPlus (premium economy), business, or first",
                    "enum": ["tour", "tourPlus", "business", "first"],
                    "type": "string"
                  },
                  "infants": {
                    "default": 0,
                    "description": "Number of infant passengers (0–9)",
                    "maximum": 9,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "language": {
                    "default": "en",
                    "description": "Language for the interactive results widget. English only.",
                    "enum": ["en"],
                    "type": "string"
                  },
                  "market": {
                    "default": "uk",
                    "description": "Go2Trip country site to search and book on: 'uk' (United Kingdom), 'ae' (United Arab Emirates), 'qa' (Qatar), 'au' (Australia), 'cy' (Cyprus), 'cz' (Czech Republic), 'gr' (Greece), 'mt' (Malta) or 'sk' (Slovakia). Use the site of the user's country of residence when the conversation makes it clear and it is one of these; otherwise use 'uk'. Prices come back in that site's currency and the booking link opens on that site.",
                    "enum": ["uk", "ae", "qa", "au", "cy", "cz", "gr", "mt", "sk"],
                    "type": "string"
                  },
                  "origin": {
                    "description": "3-letter IATA city or airport code (e.g. 'TLV', 'LON', 'MAD')",
                    "maxLength": 3,
                    "minLength": 3,
                    "type": "string"
                  },
                  "return_date": {
                    "description": "Return date for round trips (YYYY-MM-DD). Omit for one-way.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "seniors": {
                    "default": 0,
                    "description": "Number of senior passengers (0–9)",
                    "maximum": 9,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["departure_date", "destination", "origin"],
                "type": "object"
              },
              "total": {
                "description": "Total matches found, which may exceed `flights.length`",
                "type": "integer"
              }
            },
            "required": ["flights", "query", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Flights"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/toolInvocation/invoked": "Found flight options",
            "openai/toolInvocation/invoking": "Searching flights…",
