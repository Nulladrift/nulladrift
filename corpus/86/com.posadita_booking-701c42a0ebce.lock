{
  "lockfileVersion": 2,
  "subjects": {
    "com.posadita/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.posadita.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "posadita",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Posadita: holiday rentals on their hosts' own direct-booking websites, without an OTA commission. A place is named by its slug; a collection of places (search_stays) by the collection's slug. Dates are YYYY-MM-DD in the place's own timezone; a stay's checkOut is the departure day and that night is not included. Amounts are integer cents in the place's currency. To book: get_quote, then create_checkout, then give the guest checkoutUrl. The checkout reserves nothing and is not a booking – the guest finishes it on the page, agreeing to the host's terms and paying there. Say exactly that to the guest.",
      "tools": [
        {
          "name": "check_availability",
          "description": "Which nights are free between two dates, both inclusive, at most 62 days per call. Each night has available, minStay, whether arrival/departure is allowed that day, and priceCents (null when the place takes no online booking). For the price of a whole stay use get_quote – nightly prices do not include fees or discounts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "First night, YYYY-MM-DD",
                "format": "date",
                "type": "string"
              },
              "slug": {
                "description": "The place's slug – the last part of its page URL (posadita.com/p/{slug}), or from search_stays or /llms.txt.",
                "type": "string"
              },
              "to": {
                "description": "Last night, YYYY-MM-DD",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["from", "slug", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:333b685a071cd910f7133bf4fdb31a63fc9636bfb2064a0a7ff189e7f457a0a4"
        },
        {
          "name": "create_checkout",
          "description": "Prepare a stay for the guest to confirm and pay. It reserves NOTHING and books nothing: no nights are held, the host is not told, no e-mail is sent. It returns checkoutUrl, a link you must give to the guest; the GUEST opens it, checks the stay, agrees to the host's terms and pays. Until they do, anyone else can book those nights. The link expires after 24 hours. Never tell the guest they are booked, and never try to complete the booking for them. Quote first; contact details are optional and only pre-fill the form, which the guest can change. Limited to a few per hour per caller.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "Adults (at least one).",
                "minimum": 1,
                "type": "integer"
              },
              "agent": {
                "description": "Who is asking – your assistant's name. Only the host's statistics see it.",
                "type": "string"
              },
              "checkIn": {
                "description": "Arrival, YYYY-MM-DD",
                "format": "date",
                "type": "string"
              },
              "checkOut": {
                "description": "Departure, YYYY-MM-DD",
                "format": "date",
                "type": "string"
              },
              "children": {
                "description": "Children, if any.",
                "minimum": 0,
                "type": "integer"
              },
              "guest": {
                "additionalProperties": false,
                "description": "Optional – pre-fills the booking form.",
                "properties": {
                  "email": {
                    "type": "string"
                  },
                  "firstName": {
                    "type": "string"
                  },
                  "lastName": {
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "locale": {
                "description": "Language the guest reads.",
                "enum": ["en", "cs", "sk", "de", "it", "fr", "pt", "es"],
                "type": "string"
              },
              "message": {
                "description": "Optional note to the host, pre-filled; the guest can edit it.",
                "type": "string"
              },
              "slug": {
                "description": "The place's slug – the last part of its page URL (posadita.com/p/{slug}), or from search_stays or /llms.txt.",
                "type": "string"
              }
            },
            "required": ["adults", "checkIn", "checkOut", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e62c299d588a85b924ec0f16d23d8c5314f9ce4ba65880d93ce592fdb6250c78"
        },
        {
          "name": "get_property",
          "description": "One holiday rental: what it is, where (rounded when the host keeps the address private), capacity, amenities (fixed ids + labels), house rules, check-in/out times, cancellation policy (`cancellation.terms` is what the level promises; for `custom` read `note`), photos and a from-price per night. `bookable: false` means the page shows the place but takes no online booking – the guest contacts the host; do not quote or prepare a checkout for it. `bookingMode` says what happens after the guest presses book: `request` (host confirms), `request_hold` (card held, host confirms) or `instant`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language of the texts (default en).",
                "enum": ["en", "cs", "sk", "de", "it", "fr", "pt", "es"],
                "type": "string"
              },
              "slug": {
                "description": "The place's slug – the last part of its page URL (posadita.com/p/{slug}), or from search_stays or /llms.txt.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee55908eb368479884ef6985e1b862def9074c19edf784fca3bef3583a5b87dd"
        },
        {
          "name": "get_quote",
          "description": "The total price of one stay for a party, with its breakdown (nights, length discount, extra-guest fee, cleaning) – the same calculation that charges the guest. Amounts are integer cents. When the stay cannot be booked the answer has ok:false and a reason: unavailable (with the taken dates), min_stay (with minStay), no_checkin_day, no_checkout_day, max_guests (with maxGuests), no_rates or invalid_range. A quote holds nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "Adults (at least one).",
                "minimum": 1,
                "type": "integer"
              },
              "checkIn": {
                "description": "Arrival, YYYY-MM-DD",
                "format": "date",
                "type": "string"
              },
              "checkOut": {
                "description": "Departure, YYYY-MM-DD (that night is not included)",
                "format": "date",
                "type": "string"
              },
              "children": {
                "description": "Children, if any.",
                "minimum": 0,
                "type": "integer"
              },
              "slug": {
                "description": "The place's slug – the last part of its page URL (posadita.com/p/{slug}), or from search_stays or /llms.txt.",
                "type": "string"
              }
            },
            "required": ["adults", "checkIn", "checkOut", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17b6553cf9e5d80c923e5685192798e4878f6ff421f141620076786b62c223d5"
        },
        {
          "name": "search_stays",
          "description": "Search ONE collection – a host's portfolio, a residential community or a destination – named by its slug (posadita.com/s/{slug}, or from /llms.txt). There is no search across all of Posadita. With dates and guests every place is priced for exactly that stay (totalCents, the same figure get_quote gives) and those that can be booked come first; without dates you get each place's from-price per night. Only places with bookable:true can be quoted or checked out; the others are booked by contacting their host.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amenities": {
                "description": "Every one of these, not any.",
                "items": {
                  "enum": ["wifi", "air_conditioning", "heating", "washing_machine", "dryer", "tv", "workspace", "kitchen", "dishwasher", "oven", "microwave", "coffee_machine", "pool", "terrace", "balcony", "garden", "bbq", "sea_view", "pool_view", "beach_nearby", "hot_tub", "sauna", "fireplace", "crib", "high_chair", "parking", "ev_charger", "elevator", "step_free", "ground_floor", "self_checkin", "pets_allowed", "smoking_allowed"],
                  "type": "string"
                },
                "type": "array"
              },
              "availableOnly": {
                "description": "With dates: leave out places that cannot be booked for them.",
                "type": "boolean"
              },
              "collection": {
                "description": "The collection's slug.",
                "type": "string"
              },
              "from": {
                "description": "Arrival, YYYY-MM-DD (with to)",
                "format": "date",
                "type": "string"
              },
              "guests": {
                "description": "Everyone staying, children included.",
                "minimum": 1,
                "type": "integer"
              },
              "minBedrooms": {
                "minimum": 1,
                "type": "integer"
              },
              "propertyType": {
                "enum": ["apartment", "house", "villa", "studio", "room", "cottage", "other"],
                "type": "string"
              },
              "to": {
                "description": "Departure, YYYY-MM-DD (with from)",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["collection"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2918b86d32673b6ddc8bda3d2a367c3560737aa5045eaaa3a39edf5448d17acb"
        }
      ],
      "digest": "sha256:96fb87bc6606959a0f2c6c3f0cb04772d3405415d5db1239fddd29c1879d55d0"
    }
  }
}
