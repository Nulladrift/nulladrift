              }
            ]
          },
          "digest": "sha256:4082e8a49164625609f068077744f4205e64c5fe03d93132a4bd4c25a8d669b8"
        },
        {
          "name": "lookup_brand",
          "title": "Look up a brand",
          "description": "Is this store running Meta ads? Finds the Facebook page behind a store domain and returns advertising since, live ads, trend (new, scaling, stable, stopped), channels and store platform. Signed in: catalog size, price range, recent launches and store age (free plan: 5 new domains a day); Pro and up also get recent ads. Unknown domains are checked live in the Meta Ad Library, within a daily limit.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The store's domain, e.g. brand.com. A URL works too.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Look up a brand"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/brand-v1.html",
            "openai/toolInvocation/invoked": "Looked up the brand",
            "openai/toolInvocation/invoking": "Looking up the brand…",
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://widget/brand-v1.html"
            }
          },
          "digest": "sha256:c6c939677f452e90f8c912ef42dee0f840cfc8caa2a328193e45be120bf60607"
        },
        {
          "name": "reveal_brand",
          "title": "Reveal a masked brand",
          "description": "Unmasks one brand from search_signals on the free plan: its name, domain, store and Ad Library link. Pass the masked row's ref. Spends one of the account's 10 reveals a month (they reset on the 1st; a brand already revealed is free) and needs a signed-in free account. A revealed brand stays unmasked in later searches, and lookup_brand on its domain shows the full brand detail. Paid plans already see every brand.",
          "inputSchema": {
            "properties": {
              "ref": {
                "description": "The ref of a masked row from search_signals.",
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Reveal a masked brand"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:0ae0f9b1a8626188181a094a2e2994f5c0d02a62d9a621a77f988ba0c9edec78"
        },
        {
          "name": "search_signals",
          "title": "Search ad signals",
          "description": "US ecommerce brands flagged on the latest day for a change in their Meta (Facebook/Instagram) ads: newly advertising, scaling, struggling or stopped, with store platform, live ad count and other ad channels. Defaults to new and scaling brands in every niche the caller's plan covers. Without signing in or on the free plan, brand names and domains are masked and only the niche filter applies; each masked row has a ref that reveal_brand unmasks with one of the free plan's monthly reveals. On paid plans each brand returned counts toward the account's monthly export rows (the same brand again that month is free).",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Rows to return, default 25. Masked results return at most 50.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "min_ads": {
                "description": "At least this many live ads. Not on the Free plan.",
                "minimum": 1,
                "type": "integer"
              },
              "niche": {
                "description": "One niche; all of the caller's niches when left out. An account that hasn't picked a niche yet must pass one, and it becomes the account's niche.",
                "enum": ["auto_aftermarket", "supplements", "skincare", "pet", "home_kitchen", "apparel", "jewelry_accessories", "makeup", "hair_care"],
                "type": "string"
              },
              "offset": {
                "description": "Rows to skip, for paging.",
                "minimum": 0,
                "type": "integer"
              },
              "pixel": {
                "description": "Also advertises on this channel (tracking pixel on the store). Not on the Free plan.",
                "enum": ["google_ads", "tiktok", "pinterest", "snapchat", "reddit", "bing"],
                "type": "string"
              },
              "platform": {
                "description": "Store platform. Not on the Free plan.",
                "enum": ["shopify", "woocommerce", "bigcommerce", "other_store"],
                "type": "string"
              },
              "q": {
                "description": "Brand name or domain contains this text. Not on the Free plan.",
                "type": "string"
              },
              "signal": {
                "description": "One signal type; newly_advertising and scaling when left out. Not on the Free plan.",
                "enum": ["newly_advertising", "scaling", "struggling", "stopped"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Search ad signals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
