      "serverInfo": {
        "name": "advertiserleads",
        "title": "AdvertiserLeads",
        "version": "1.0.0",
        "websiteUrl": "https://advertiserleads.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AdvertiserLeads tracks US ecommerce brands' Meta (Facebook and Instagram) ads every day and flags brands that just started advertising, are scaling, struggling or stopped: leads for agencies, creators and ecom software. Use search_signals to find flagged brands by niche and signal, lookup_brand to see whether a specific store runs Meta ads, check_store for a store's platform, catalog and tracking pixels, and list_niches for valid filter values and what the caller's plan includes. Without signing in or on the free plan, brand names in search results are masked; a signed-in free account can unmask a row by passing its ref to reveal_brand (10 reveals a month), then use lookup_brand on the revealed domain.",
      "tools": [
        {
          "name": "check_store",
          "title": "Check a store",
          "description": "Store platform (Shopify, WooCommerce, BigCommerce, other store or not a store), catalog size, price range and store age for a domain, plus the tracking pixels and marketing tools on its homepage (Meta, Google Ads, TikTok, Pinterest, Klaviyo, Triple Whale and more). Results under a day old are reused; fresh checks are limited per day (10 without signing in, 50 signed in).",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The store's domain, e.g. brand.com. A URL works too.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a store"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/brand-v1.html",
            "openai/toolInvocation/invoked": "Checked the store",
            "openai/toolInvocation/invoking": "Checking the store…",
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://widget/brand-v1.html"
            }
          },
          "digest": "sha256:d3f27e978327cee66d911f8449cdd1e1b44a4286b7b42765e9d1070657578881"
        },
        {
          "name": "list_niches",
          "title": "List niches and filters",
          "description": "The niches AdvertiserLeads tracks, the signal types and filter values search_signals accepts, and what the caller's plan includes.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List niches and filters"
          },
          "behavior": {
            "destructive": false,
