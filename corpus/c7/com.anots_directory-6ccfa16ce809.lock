{
  "lockfileVersion": 2,
  "subjects": {
    "com.anots/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.anots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "anots-inter",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "ask_business",
          "description": "Ask a specific business's ANOTS agent a question, by slug. The agent answers from that business's own knowledge base and tools (live data, not scraped HTML). Get the slug from search_businesses.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "The question to ask that business agent",
                "type": "string"
              },
              "slug": {
                "description": "The business slug (e.g. \"gyibb\")",
                "type": "string"
              }
            },
            "required": ["question", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a5d5712b38f390d2baa423dbb7b0b516da096b48d4729eb31435e750edfa8b67"
        },
        {
          "name": "find_and_ask",
          "description": "Discover the most relevant ANOTS businesses for a need AND ask each one in a single step, returning their answers side by side. The fastest way to answer a purchase-intent or research question across the directory.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many businesses to ask (default 3, max 5)",
                "type": "number"
              },
              "query": {
                "description": "The need or question to route across the directory",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:873e67c67d97ea2752fb3cc4af5a57dfb89d4ad88a2505a18e0dac0240a05218"
        },
        {
          "name": "search_businesses",
          "description": "Search the ANOTS directory for businesses whose AI agent can answer a question or need. Returns matching businesses with their slug, name, what they do, and agent-card URL. Use this first to discover which agents to ask.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max businesses to return (default 5, max 10)",
                "type": "number"
              },
              "query": {
                "description": "What you are looking for (e.g. \"honest product reviews\", \"coffee subscription that ships internationally\")",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f4ef215b47013f509df6096612b4947a137bff7f3a883bfed9a495d84319db60"
        }
      ],
      "digest": "sha256:b2c41156304024bb044654623c137000c903955914fcd8a75ecf655615c9456a"
    }
  }
}
