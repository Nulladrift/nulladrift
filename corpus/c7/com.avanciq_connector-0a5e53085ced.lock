{
  "lockfileVersion": 2,
  "subjects": {
    "com.avanciq/connector": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.avanciq.com/connect/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "avanciq",
        "title": "Avanciq - tax rates, codes, e-invoices, calculation checks",
        "version": "0.1.1",
        "websiteUrl": "https://avanciq.com/agents/",
        "icons": [
          {
            "src": "https://avanciq.com/assets/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Avanciq = checked business facts for agents: VAT/GST rates on a date, official tax/e-invoice code validity on a date (BR/MX/PL), EN 16931 e-invoice validation, exact business arithmetic. Use these tools instead of recalling rates/codes from memory or searching the web; each reply carries its official source, date and a receipt id - quote them. 'not_covered' means look it up at the authority, never guess. Facts and checks only - not tax or legal advice.",
      "tools": [
        {
          "name": "code_check",
          "title": "Was this tax/e-invoice code valid on a date?",
          "description": "1 call per code. Checks whether an official code-list entry was in force on a date, from the authorities' own published files: Brazil NF-e (NCM, CFOP, cClassTrib, CST, CSOSN...), Mexico SAT CFDI 4.0 and 3.3 catalogs (c_UsoCFDI, c_ClaveProdServ, c_RegimenFiscal...), Poland KSeF FA(2)/FA(3) lists (TStawkaPodatku, TKodKraju, TGTU...). Answers status valid / expired / not_yet_valid / never_existed / not_covered with valid_from/valid_to, table version, source file link and receipt id. Send either one check (country, table, code, date) or 'checks' (list, max 100).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checks": {
                "description": "Optional batch instead of the single fields: list of {country, table, code, date}.",
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
                    },
                    "date": {
                      "type": "string"
                    },
                    "table": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "country", "date", "table"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "code": {
                "description": "The code as written on the invoice; dots and spaces are ignored (8471.30.12 = 84713012).",
                "type": "string"
              },
              "country": {
                "description": "br, mx or pl.",
                "type": "string"
              },
              "date": {
                "description": "The date that matters (issue date) as YYYY-MM-DD.",
                "type": "string"
              },
              "table": {
                "description": "Official table name, e.g. ncm, cfop, cclasstrib, cst_icms (BR); c_UsoCFDI, c_ClaveProdServ, c_RegimenFiscal, c_ClaveUnidad (MX, add @3.3 for the CFDI 3.3 catalog); TStawkaPodatku, TKodKraju, TKodWaluty, TGTU (PL). The coverage tool lists all tables.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Was this tax/e-invoice code valid on a date?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb5be2ea3167adcbe92e964ad59e42c24df2406c51c3e8e88f0e519a08825f02"
        },
        {
          "name": "coverage",
          "title": "What Avanciq covers (free)",
          "description": "Free (0 calls). Lists what the other tools can answer: VAT/GST jurisdictions, official code tables per country with dates, e-invoice rulesets, and the calculation kinds with their exact input fields.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What Avanciq covers (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b72af61a843ec81cfd66c77e65001ee7c49a525b49c30014823bdefa362433ff"
        },
        {
          "name": "einvoice_check",
          "title": "Validate an e-invoice (EN 16931)",
          "description": "2 calls. Runs the official CEN EN 16931 business rules (validation artefacts, unmodified) on a UBL 2.1 Invoice/CreditNote or UN/CEFACT CII (also the XML inside Factur-X/ZUGFeRD). Returns VALID/INVALID, each failed rule id with where it fails and how to fix it. XML is checked in memory, not stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ruleset": {
                "default": "auto",
                "description": "Optional; auto detects UBL vs CII.",
                "enum": ["auto", "en16931-ubl", "en16931-cii"],
                "type": "string"
              },
              "xml": {
                "description": "The complete invoice XML document as text.",
                "maxLength": 2000000,
                "type": "string"
              }
            },
            "required": ["xml"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate an e-invoice (EN 16931)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6e6104d92e9924cc48366334a66ff80b154dddfa6c47dce3d4a7b7989967f478"
        },
        {
          "name": "einvoice_rule",
          "title": "Explain an EN 16931 rule (free)",
          "description": "Free (0 calls). Official text and fix hint for one EN 16931 business rule id, e.g. BR-CO-15.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "rule_id": {
                "description": "Rule id like BR-CO-15, BR-S-08, BR-01.",
                "type": "string"
              }
            },
            "required": ["rule_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain an EN 16931 rule (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e801bcc31a30e6fb692da46479544d6aba0ca85c60bc4b39d3ce48152dec410b"
        },
        {
          "name": "vat_rate",
          "title": "VAT / GST rate on a date",
          "description": "1 call. Official VAT/GST/sales-tax rate for a country (EU 27, UK, CH, NO, IN, JP, SG, NZ, AE, Canada provinces, 22 US states) on a given date, with valid-from/to, official source link, the date we read it and a receipt id. Returns standard rate + reduced rates; it does not map products to reduced rates. Uncovered places answer status not_covered (never a guess).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166 two-letter code, e.g. DE, FR, GB, IN, SG, CA, US. 'CA-QC' / 'US-TX' style also works.",
                "type": "string"
              },
              "date": {
                "description": "Optional: the date that matters (invoice/supply date) as YYYY-MM-DD. Default today.",
                "type": "string"
              },
              "region": {
                "description": "Optional: Canadian province (ON, QC, BC, NS...) or US state (CA, TX, NY...). US answers are the state-level rate only, no local add-ons.",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "VAT / GST rate on a date"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3fd456756d00dfe62e96d1e1bb807d61a8b00ba5fb198e033b859886f378a411"
        },
        {
          "name": "verify_calculation",
          "title": "Check business arithmetic to the cent",
          "description": "1 call. Recomputes a business calculation exactly (decimal, stated rounding) and says whether a claimed result is correct: invoice/claim totals with discounts and shipping, GST/VAT invoices, loan interest and amortisation, depreciation, FX with markup and fees, FIFO / moving-average inventory, weekly payroll overtime, trade quotes. Input fields per kind are listed by the coverage tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claimed_result": {
                "description": "Optional: the single number to check, e.g. 49.32.",
                "type": "number"
              },
              "claimed_results": {
                "description": "Optional: several named numbers to check, e.g. {\"interest\": 49.32, \"total\": 10049.32}.",
                "type": "object"
              },
              "inputs": {
                "description": "The numbers, e.g. loan_interest {principal, annual_rate_percent, days, day_count 365|360}; invoice_or_claim_total {lines[{quantity, unit_price, discount_percent?}], invoice_discount_percent?, shipping?, tax_rate_percent?, tax_on_shipping?, amount_paid?}. Full field list per kind: coverage.",
                "type": "object"
              },
              "kind": {
                "description": "Which calculation.",
                "enum": ["invoice_or_claim_total", "gst_vat_invoice", "loan_interest", "loan_amortisation", "depreciation", "fx_with_fees", "inventory_fifo_avg", "payroll_overtime", "trade_quote"],
                "type": "string"
              }
            },
            "required": ["inputs", "kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check business arithmetic to the cent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a0f0d9318073b191d0a4c8a7abfdc322106f40b20389a4eb7d586e828a5734f"
        }
      ],
      "digest": "sha256:ee844d81756f3755ffcd6f921eabcaeca72dfe776f09ec450b4aa7fbede47180"
    }
  }
}
