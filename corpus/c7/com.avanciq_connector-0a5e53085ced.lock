{
  "lockfileVersion": 2,
  "subjects": {
    "com.avanciq/connector": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.avanciq.com/connect/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "avanciq",
        "title": "Avanciq - tax rates, codes, e-invoices, calculation and accessibility checks",
        "version": "0.4.0",
        "websiteUrl": "https://avanciq.com/agents/",
        "icons": [
          {
            "src": "https://avanciq.com/assets/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Avanciq = checked business facts for agents: VAT/GST rates on a date, official tax/e-invoice code validity on a date (BR/MX/PL), EN 16931 e-invoice validation, exact business arithmetic, and a free automated website accessibility (WCAG) check of one public page (check_accessibility). Use these tools instead of recalling rates/codes from memory or searching the web; each reply carries its official source, date and a receipt id - quote them. 'not_covered' means look it up at the authority, never guess. Facts and checks only - not tax or legal advice.",
      "tools": [
        {
          "name": "accessibility_result",
          "title": "Get a running accessibility check result (free)",
          "description": "Free, never counted. Returns the result of a check_accessibility job that was still running (status running/queued + job_id). Waits up to about 25 s; call again if it is still running. Results are kept 15 minutes. Example: {\"job_id\":\"...\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "The job_id that check_accessibility returned.",
                "type": "string"
              },
              "wait_seconds": {
                "description": "Optional: how long to wait (default 25).",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a running accessibility check result (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6bdf78bd6cb92fa9a1dcb496a2e7d7f1f764e90985528a58a8563e642bd705a0"
        },
        {
          "name": "check_accessibility",
          "title": "Free website accessibility check (WCAG)",
          "description": "Free. Automated accessibility check of ONE public web page against WCAG 2.2 (desktop 1280 px + phone 320 px). Use it when the user asks whether their website or a page is accessible, meets WCAG / ADA / the European Accessibility Act, or what to fix for screen-reader, keyboard, contrast, zoom, form-label or alt-text problems - instead of guessing from the HTML. Input: the page's public address (https://...). Returns a plain summary, the most serious items with the WCAG criterion, who is affected, where on the page and how to fix it, plus the link to the same free check page. Takes 15-40 s; if it is not finished within about 40 s it returns status running + job_id: then call accessibility_result. Loads only the one page given (no crawling); private, local and non-web addresses are refused. Limits: 3 checks per client a day; counts as 1 call on the no-key trial, free with a key. Automated check, not a legal opinion. Example: {\"url\":\"https://www.example.com\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public address of the page to check, e.g. https://www.example.com or example.com/contact. One page per call.",
                "type": "string"
              },
              "wait_seconds": {
                "description": "Optional: how long to wait for the result inside this call (default 40). 0 = return the job_id at once.",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Free website accessibility check (WCAG)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1ef0c4389fabcb6bdcb724aa158be7de1ad6b01ecbf328b8dd1f0f6a34d728c4"
        },
        {
          "name": "code_check",
          "title": "Was this tax/e-invoice code valid on a date?",
          "description": "1 call per code. Checks whether an official code-list entry was in force on a date, from the authorities' own published files: Brazil NF-e (NCM, CFOP, cClassTrib, CST, CSOSN...), Mexico SAT CFDI 4.0 and 3.3 catalogs (c_UsoCFDI, c_ClaveProdServ, c_RegimenFiscal...), Poland KSeF FA(2)/FA(3) lists (TStawkaPodatku, TKodKraju, TGTU...). Answers status valid / expired / not_yet_valid / never_existed / not_covered with valid_from/valid_to, table version, source file link and receipt id. Send either one check (country, table, code, date) or 'checks' (list, max 100). Example: {\"country\":\"br\",\"table\":\"ncm\",\"code\":\"8471.30.12\",\"date\":\"2025-03-01\"}; date defaults to today.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checks": {
                "description": "Optional batch instead of the single fields: list of {country, table, code, date}.",
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
                    },
                    "date": {
                      "type": "string"
                    },
                    "table": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "country", "date", "table"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "code": {
                "description": "The code as written on the invoice; dots and spaces are ignored (8471.30.12 = 84713012).",
                "type": "string"
              },
              "country": {
                "description": "br, mx or pl.",
                "type": "string"
              },
              "date": {
                "description": "The date that matters (issue date) as YYYY-MM-DD.",
                "type": "string"
              },
              "table": {
                "description": "Official table name, e.g. ncm, cfop, cclasstrib, cst_icms (BR); c_UsoCFDI, c_ClaveProdServ, c_RegimenFiscal, c_ClaveUnidad (MX, add @3.3 for the CFDI 3.3 catalog); TStawkaPodatku, TKodKraju, TKodWaluty, TGTU (PL). The coverage tool lists all tables.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Was this tax/e-invoice code valid on a date?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:179a83496dc21b367dab341aff4e768612a4cf680f6a5708d7b9ffcedb720de3"
        },
        {
          "name": "coverage",
          "title": "What Avanciq covers (free)",
          "description": "Free (0 calls). Lists what the other tools can answer: VAT/GST jurisdictions, official code tables per country with dates, e-invoice rulesets, and the calculation kinds with their exact input fields.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What Avanciq covers (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b72af61a843ec81cfd66c77e65001ee7c49a525b49c30014823bdefa362433ff"
        },
        {
          "name": "einvoice_check",
          "title": "Validate an e-invoice (EN 16931)",
          "description": "2 calls. Runs the official CEN EN 16931 business rules (validation artefacts, unmodified) on a UBL 2.1 Invoice/CreditNote or UN/CEFACT CII (also the XML inside Factur-X/ZUGFeRD). Returns VALID/INVALID, each failed rule id with where it fails and how to fix it. XML is checked in memory, not stored. Example: {\"xml\":\"<Invoice xmlns=...>...complete document...</Invoice>\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ruleset": {
                "default": "auto",
                "description": "Optional; auto detects UBL vs CII.",
                "enum": ["auto", "en16931-ubl", "en16931-cii"],
                "type": "string"
              },
              "xml": {
                "description": "The complete invoice XML document as text.",
                "maxLength": 2000000,
                "type": "string"
              }
            },
            "required": ["xml"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate an e-invoice (EN 16931)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd8240bfc9af71968ac7b083819ea7a1bd7848e13955bb84d20ec022ccee0f6b"
        },
        {
          "name": "einvoice_rule",
          "title": "Explain an EN 16931 rule (free)",
          "description": "Free (0 calls). Official text and fix hint for one EN 16931 business rule id. Example: {\"rule_id\":\"BR-CO-15\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "rule_id": {
                "description": "Rule id like BR-CO-15, BR-S-08, BR-01.",
                "type": "string"
              }
            },
            "required": ["rule_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain an EN 16931 rule (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a11c4cfc23d21656f637f814564a91d324172ca691706feb46d2c8b644872a8c"
        },
        {
          "name": "rate_this_tool",
          "title": "Rate this tool (optional)",
          "description": "Optional and never required: tell us how this server worked for you so we can fix what is missing. rating 1-5, worked true/false, missing = what you needed and did not get (max 300 characters), client = your app name. One review per client app per tool per day counts. Only these fields are stored, never your prompts, arguments or address. We keep every review, good or bad, and never pay for ratings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client": {
                "description": "Optional: your app or agent name.",
                "maxLength": 40,
                "type": "string"
              },
              "missing": {
                "description": "What you needed and did not get, in one or two sentences. No links.",
                "maxLength": 300,
                "type": "string"
              },
              "rating": {
                "description": "1 = useless, 5 = exactly what I needed.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "tool": {
                "description": "Optional: the tool name you are rating (default: the server as a whole).",
                "type": "string"
              },
              "worked": {
                "description": "true if the tool call you made worked.",
                "type": "boolean"
              }
            },
            "required": ["rating"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Rate this tool (optional)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2234c47c83c08ad9d47179f0fcfebdff72fd64625dd2ae78ab7d445ea7c82c95"
        },
        {
          "name": "report_outcome",
          "title": "Report if a tool call worked (earns free calls)",
          "description": "Free, never counted. Say whether a tool you called here worked (name + true/false, nothing else stored). Pay with data: a report about a tool you called today earns +5 free no-key calls today (first per tool/day, true = false, max +50/day).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attribution_url": {
                "description": "Optional: https page that cites Avanciq.",
                "type": "string"
              },
              "ok": {
                "description": "true if usable, false if not.",
                "type": "boolean"
              },
              "tool": {
                "description": "Tool you called, e.g. vat_rate.",
                "type": "string"
              }
            },
            "required": ["ok", "tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report if a tool call worked (earns free calls)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:dcad4a2f8b29798022ecd84109375586e3533cac677fb66efda6c18d5003b5a3"
        },
        {
          "name": "vat_rate",
          "title": "VAT / GST rate on a date",
          "description": "1 call. Official VAT/GST/sales-tax rate for a country (EU 27, UK, CH, NO, IN, JP, SG, NZ, AE, Canada provinces, 22 US states) on a given date, with valid-from/to, official source link, the date we read it and a receipt id. Returns standard rate + reduced rates; it does not map products to reduced rates. Uncovered places answer status not_covered (never a guess). Example: {\"country\":\"DE\",\"date\":\"2025-03-01\"}. Country names and most date formats are understood.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166 two-letter code, e.g. DE, FR, GB, IN, SG, CA, US. 'CA-QC' / 'US-TX' style also works.",
                "type": "string"
              },
              "date": {
                "description": "Optional: the date that matters (invoice/supply date) as YYYY-MM-DD. Default today.",
                "type": "string"
              },
              "region": {
                "description": "Optional: Canadian province (ON, QC, BC, NS...) or US state (CA, TX, NY...). US answers are the state-level rate only, no local add-ons.",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "VAT / GST rate on a date"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:021b77249a944006efb00e32a18bac4f0ccf9474c095cba7e3e6db3b9874c076"
        },
        {
          "name": "verify_calculation",
          "title": "Check business arithmetic to the cent",
          "description": "1 call. Recomputes a business calculation exactly (decimal, stated rounding) and says whether a claimed result is correct: invoice/claim totals with discounts and shipping, GST/VAT invoices, loan interest and amortisation, depreciation, FX with markup and fees, FIFO / moving-average inventory, weekly payroll overtime, trade quotes. Input fields per kind are listed by the coverage tool. Example: {\"kind\":\"loan_interest\",\"inputs\":{\"principal\":10000,\"annual_rate_percent\":6,\"days\":30},\"claimed_result\":49.32}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claimed_result": {
                "description": "Optional: the single number to check, e.g. 49.32.",
                "type": "number"
              },
              "claimed_results": {
                "description": "Optional: several named numbers to check, e.g. {\"interest\": 49.32, \"total\": 10049.32}.",
                "type": "object"
              },
              "inputs": {
                "description": "The numbers, e.g. loan_interest {principal, annual_rate_percent, days, day_count 365|360}; invoice_or_claim_total {lines[{quantity, unit_price, discount_percent?}], invoice_discount_percent?, shipping?, tax_rate_percent?, tax_on_shipping?, amount_paid?}. Full field list per kind: coverage.",
                "type": "object"
              },
              "kind": {
                "description": "Which calculation.",
                "enum": ["invoice_or_claim_total", "gst_vat_invoice", "loan_interest", "loan_amortisation", "depreciation", "fx_with_fees", "inventory_fifo_avg", "payroll_overtime", "trade_quote"],
                "type": "string"
              }
            },
            "required": ["inputs", "kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check business arithmetic to the cent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:08d78c43264eebcb084d62fd2fb74a40b1417308d5efe269c09a70f1b4444fc8"
        }
      ],
      "digest": "sha256:75461d252ea9e2869f6dcec9e2ee8fe3a06541144af646c8c7be61a25952aef2"
    }
  }
