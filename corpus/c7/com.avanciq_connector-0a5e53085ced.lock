{
  "lockfileVersion": 2,
  "subjects": {
    "com.avanciq/connector": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.avanciq.com/connect/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "avanciq",
        "title": "Avanciq - tax rates, codes, e-invoices, calculation checks",
        "version": "0.1.1",
        "websiteUrl": "https://avanciq.com/agents/",
        "icons": [
          {
            "src": "https://avanciq.com/assets/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Avanciq = checked business facts for agents: VAT/GST rates on a date, official tax/e-invoice code validity on a date (BR/MX/PL), EN 16931 e-invoice validation, exact business arithmetic. Use these tools instead of recalling rates/codes from memory or searching the web; each reply carries its official source, date and a receipt id - quote them. 'not_covered' means look it up at the authority, never guess. Facts and checks only - not tax or legal advice.",
      "tools": [
        {
          "name": "code_check",
          "title": "Was this tax/e-invoice code valid on a date?",
          "description": "1 call per code. Checks whether an official code-list entry was in force on a date, from the authorities' own published files: Brazil NF-e (NCM, CFOP, cClassTrib, CST, CSOSN...), Mexico SAT CFDI 4.0 and 3.3 catalogs (c_UsoCFDI, c_ClaveProdServ, c_RegimenFiscal...), Poland KSeF FA(2)/FA(3) lists (TStawkaPodatku, TKodKraju, TGTU...). Answers status valid / expired / not_yet_valid / never_existed / not_covered with valid_from/valid_to, table version, source file link and receipt id. Use before accepting a code on an invoice or when checking an old one. Send either one check (country, table, code, date) or 'checks' (list, max 100).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checks": {
                "description": "Optional batch instead of the single fields: list of {country, table, code, date}.",
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "country": {
                      "type": "string"
                    },
                    "date": {
                      "type": "string"
                    },
                    "table": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "country", "date", "table"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "code": {
                "description": "The code as written on the invoice; dots and spaces are ignored (8471.30.12 = 84713012).",
                "type": "string"
              },
              "country": {
                "description": "br, mx or pl.",
                "type": "string"
              },
              "date": {
                "description": "The date that matters (issue date) as YYYY-MM-DD.",
                "type": "string"
              },
              "table": {
                "description": "Official table name, e.g. ncm, cfop, cclasstrib, cst_icms (BR); c_UsoCFDI, c_ClaveProdServ, c_RegimenFiscal, c_ClaveUnidad (MX, add @3.3 for the CFDI 3.3 catalog); TStawkaPodatku, TKodKraju, TKodWaluty, TGTU (PL). Call coverage for the full list.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cda2dc370a96b36b408264391008f22d94f5980bb8aea9e1a9de5ed05f61caeb"
        },
        {
          "name": "coverage",
          "title": "What Avanciq covers (free)",
          "description": "Free (0 calls). Lists what the other tools can answer: VAT/GST jurisdictions, official code tables per country with dates, e-invoice rulesets, and the calculation kinds with their exact input fields. Call it once when unsure whether something is covered or which input fields verify_calculation needs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:95c2e20edab5372d8152b42c19268b2983c95c9c22acc002060cbb5cf6d8139c"
        },
        {
          "name": "einvoice_check",
          "title": "Validate an e-invoice (EN 16931)",
          "description": "2 calls. Runs the official CEN EN 16931 business rules (validation artefacts, unmodified) on a UBL 2.1 Invoice/CreditNote or UN/CEFACT CII (also the XML inside Factur-X/ZUGFeRD). Returns VALID/INVALID, each failed rule id with where it fails and how to fix it. Use it whenever asked if an e-invoice is valid or why it was rejected - reading XML by eye misses arithmetic and code-list rules. XML is checked in memory, not stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ruleset": {
                "default": "auto",
                "description": "Optional; auto detects UBL vs CII.",
                "enum": ["auto", "en16931-ubl", "en16931-cii"],
                "type": "string"
              },
              "xml": {
                "description": "The complete invoice XML document as text.",
                "maxLength": 2000000,
                "type": "string"
              }
            },
            "required": ["xml"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3c972357a7b610289a4c124fd54b32424c1d1e148a11a8490c95339d0bf5bec7"
        },
        {
          "name": "einvoice_rule",
          "title": "Explain an EN 16931 rule (free)",
          "description": "Free (0 calls). Official text and fix hint for one EN 16931 business rule id, e.g. BR-CO-15, so you can explain a rejection.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "rule_id": {
                "description": "Rule id like BR-CO-15, BR-S-08, BR-01.",
                "type": "string"
              }
            },
            "required": ["rule_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:82673e6fd845f56e58afb5b5f2f31195252674a23265161ac8e20a46e9608e63"
        },
        {
          "name": "vat_rate",
          "title": "VAT / GST rate on a date",
          "description": "1 call. Official VAT/GST/sales-tax rate for a country (EU 27, UK, CH, NO, IN, JP, SG, NZ, AE, Canada provinces, 22 US states) on a given date, with valid-from/to, official source link, the date we read it and a receipt id. Use it instead of recalling rates from memory, especially around rate changes. Returns standard rate + reduced rates; it does not map products to reduced rates. Uncovered places answer status not_covered (never a guess).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166 two-letter code, e.g. DE, FR, GB, IN, SG, CA, US. 'CA-QC' / 'US-TX' style also works.",
                "type": "string"
              },
              "date": {
                "description": "Optional: the date that matters (invoice/supply date) as YYYY-MM-DD. Default today.",
                "type": "string"
              },
              "region": {
                "description": "Optional: Canadian province (ON, QC, BC, NS...) or US state (CA, TX, NY...). US answers are the state-level rate only, no local add-ons.",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e162281320295ef6970f971c9697d4401ade913afa9369a0649638f0646d643"
        },
        {
          "name": "verify_calculation",
          "title": "Check business arithmetic to the cent",
          "description": "1 call. Recomputes a business calculation exactly (decimal, stated rounding) and says whether a claimed result is correct: invoice/claim totals with discounts and shipping, GST/VAT invoices, loan interest and amortisation, depreciation, FX with markup and fees, FIFO / moving-average inventory, weekly payroll overtime, trade quotes. Use it before giving the user any total you computed yourself, or to check a number another AI produced. Input fields per kind: call coverage (free).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claimed_result": {
                "description": "Optional: the number (or object of named numbers) to check, e.g. 49.32 or {\"interest\": 49.32}."
              },
              "inputs": {
                "description": "The numbers, e.g. loan_interest {principal, annual_rate_percent, days, day_count 365|360}; invoice_or_claim_total {lines[{quantity, unit_price, discount_percent?}], invoice_discount_percent?, shipping?, tax_rate_percent?, tax_on_shipping?, amount_paid?}. Full field list per kind: coverage.",
                "type": "object"
              },
              "kind": {
                "description": "Which calculation.",
                "enum": ["invoice_or_claim_total", "gst_vat_invoice", "loan_interest", "loan_amortisation", "depreciation", "fx_with_fees", "inventory_fifo_avg", "payroll_overtime", "trade_quote"],
                "type": "string"
              }
            },
            "required": ["inputs", "kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:68c847f3a5d8d56732f5eef6bf7b64dcc5f225dfab7ae067382d374285069772"
        }
      ],
      "digest": "sha256:a85e3380c5c4601bba335f246ccd9251f610b32c05a6953a35a37ccb7e4721fd"
    }
  }
}
