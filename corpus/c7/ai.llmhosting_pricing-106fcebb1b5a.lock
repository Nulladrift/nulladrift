{
  "lockfileVersion": 2,
  "subjects": {
    "ai.llmhosting/pricing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://llmhosting.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "llmhosting",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Live LLM API prices and GPU rental prices from llmhosting.ai, refreshed daily. Prices are USD; token prices are per 1M tokens; GPU prices are per GPU-hour.",
      "tools": [
        {
          "name": "cheapest_gpu",
          "description": "Cheapest GPU rentals right now, optionally filtered by minimum VRAM (GB).",
          "inputSchema": {
            "properties": {
              "min_vram_gb": {
                "description": "minimum VRAM in GB, e.g. 80",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3219f768e0ff53f0a323457f1452b6ac379fbc9883a8032418d9ee312118449d"
        },
        {
          "name": "get_model_prices",
          "description": "All provider prices for one LLM model: input/output/cache price per 1M tokens and context window per provider, cheapest first.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "model slug or name, e.g. \"deepseek-v4-flash\"",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d1e5cb6341cf871720cab46e14f5ab8e0564e5c0b911ab8b829a7227ecda8444"
        },
        {
          "name": "gpu_price_history",
          "description": "Daily minimum rental price history for a GPU (recorded daily since 2026-07-06).",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "how many most-recent days to return (default 30)",
                "type": "number"
              },
              "gpu": {
                "description": "GPU name, e.g. \"H100 SXM\" or \"RTX 4090\"",
                "type": "string"
              }
            },
            "required": ["gpu"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1c7074a66c16cd1aadf3929af0b95521aef04ef5cf430fc022710bc0f8314e04"
        },
        {
          "name": "list_gpus",
          "description": "Every GPU with live rental pricing: cheapest $/hr, provider, tier, and VRAM.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:007299759cd80a84c4cd35eb243d8bfa1a81f845f2a4a5454750a598f77ad799"
        },
        {
          "name": "search_models",
          "description": "Search LLM models by name. Returns matching models with provider count and the cheapest input/output price per 1M tokens.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "model name or fragment, e.g. \"deepseek\" or \"llama 70b\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:efe3e64fc1e3bb7bafa6d87a15014fa0f3c5c9be5c676370e701a22a088c61d0"
        }
      ],
