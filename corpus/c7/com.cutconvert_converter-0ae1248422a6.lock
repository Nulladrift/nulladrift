{
  "lockfileVersion": 2,
  "subjects": {
    "com.cutconvert/converter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cutconvert.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "cutconvert",
        "title": "CutConvert — post-production file converters",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CutConvert converts post-production files: subtitles (SRT, VTT, ASS, SBV, ITT, TTML), transcripts (Rev/Otter/Word TXT, Whisper JSON, Adobe Premiere .prtranscript), EDLs, FCPXML, CSV, and Word DOCX. Call list_converters to see every supported pair, then convert_file with the file content. Text files go in `content`; binary files (.prtranscript) go in `content_base64`. Anonymous usage has a small monthly free quota per IP. When a usage limit is reached, the tool explains the limit. To make an edit (clips, captions, titles) into projects for CapCut, Premiere Pro, DaVinci Resolve and Final Cut Pro, call edit_export with a CutConvert Edit JSON document; it returns a zip and uses the Edit API allowance.",
      "tools": [
        {
          "name": "convert_file",
          "title": "Convert a post-production file",
          "description": "Convert a subtitle, transcript, caption, EDL, FCPXML, or Premiere .prtranscript file. Pass text file contents in `content`; pass binary files (.prtranscript) as base64 in `content_base64`. The filename extension drives format detection. Use `target` from list_converters to pick the output, or leave it as \"auto\" to get the default output for the detected format. Returns the converted file content (text formats inline; DOCX/ZIP as base64).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "caption_language": {
                "description": "BCP 47 caption language for ITT/TTML, e.g. en-US or ja. Defaults to the source language or undetermined.",
                "type": "string"
              },
              "content": {
                "description": "The file content for text formats (SRT, VTT, TXT, EDL, JSON, FCPXML, …).",
                "type": "string"
              },
              "content_base64": {
                "description": "Base64-encoded bytes for binary formats (.prtranscript).",
                "type": "string"
              },
              "filename": {
                "description": "Original file name including extension, e.g. \"episode1.srt\" — drives format detection.",
                "type": "string"
              },
              "frame_rate": {
                "description": "Frame rate for frame-based outputs such as ITT. Defaults to auto.",
                "enum": ["auto", "23.976", "24", "25", "29.97", "30", "50", "59.94", "60"],
                "type": "string"
              },
              "target": {
                "description": "Conversion target id from list_converters, or \"auto\" for the default output.",
                "enum": ["auto", "rppXml", "rppDrp", "rppFcpxml", "rppCapcut", "rppAaf", "prprojAaf", "fcpxmlAaf", "prprojRpp", "sesxRpp", "avbCsv", "avbXml", "avbFcpxml", "avbDrp", "avbAaf", "avbRpp", "avbShotlist", "avbEdl", "srtJson", "srtAvidTxt", "txtSrt", "edlCsv", "txtJson", "wordJson", "srtSbv", "srtAss", "srtVtt", "prtranscriptSrt", "prtranscriptVtt", "vttSrt", "srtText", "vttText", "prprojXml", "prprojDrp", "aafXml", "aafDrp", "fcpxmlXml", "fcpxmlDrp", "fcpxmlEdl", "fcpxmlShotlist", "drpXml", "prprojCsv", "prprojEdl", "prprojFcpxml", "drpFcpxml", "aafFcpxml", "drpCsv", "drpEdl", "aafCsv", "aafEdl", "prtranscriptDocx", "prtranscriptCsv", "capcutSrt", "capcutXml", "capcutDrp", "capcutFcpxml", "capcutAaf", "imovieCapcut", "imovieXml", "imovieDrp", "imovieFcpxml", "prprojCapcut", "drpCapcut", "fcpxmlCapcut", "aafCapcut", "filmoraXml", "filmoraDrp", "filmoraFcpxml", "filmoraAaf", "filmoraCapcut", "prprojFilmora", "drpFilmora", "fcpxmlFilmora", "aafFilmora", "capcutFilmora", "jsonVtt", "jsonDocx", "jsonText", "sccCsv", "mccCsv", "stlCsv", "fcpxmlDocx", "fcpxmlCsv", "prtranscriptText", "srtItt", "srtTtml", "sbvSrt", "srtDocx", "vttDocx", "assSrt", "jsonJson", "jsonSrt", "srtCsv", "csvSrt", "srtFcpxml", "fcpxmlSrt", "srtScc", "sccSrt", "srtMcc", "mccSrt", "srtStl", "stlSrt", "aafRpp", "fcpxmlRpp", "drpRpp", "drpAaf", "avbCapcut", "capcutRpp", "sesxXml", "sesxDrp", "sesxFcpxml", "sesxCapcut", "sesxAaf"],
                "type": "string"
              }
            },
            "required": ["filename"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Convert a post-production file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:55151525bffc2d68191063e9d989aa521f209925e9e0e2249bbb67bf47ffa09e"
        },
        {
          "name": "edit_export",
          "title": "Export an edit to CapCut, Premiere, Resolve or Final Cut",
          "description": "Turn an edit into projects that open in CapCut, Premiere Pro, DaVinci Resolve and Final Cut Pro, with captions and titles as each editor's own editable text. Pass a CutConvert Edit JSON document in `edit` and 1 to 4 editors in `targets`. Returns a zip as an embedded resource (application/zip): a folder for each editor and report.json, plus a short text with the warnings and the exports left. The tool sends no media. Each project points to the files at their `path` in the document; a file without a path opens offline, ready to relink. Each call is one export of the Edit API's allowance: 3 a month per network without a key, or an API key's 10 free a month and its packs when the MCP client sends \"Authorization: Bearer cck_…\". Edit JSON: times are seconds, positions are fractions of the frame, and unknown fields are errors. Every field: https://cutconvert.com/developers/edit-json (JSON Schema: https://cutconvert.com/developers/edit-json/schema.json). A small document: {\"cutconvert\":\"edit/1\",\"name\":\"My edit\",\"timeline\":{\"fps\":25,\"width\":1920,\"height\":1080},\"media\":[{\"id\":\"a\",\"name\":\"a.mp4\",\"path\":\"/Users/sam/Movies/a.mp4\",\"duration\":30,\"fps\":25,\"width\":1920,\"height\":1080,\"audio\":{\"streams\":[2],\"sampleRate\":48000}}],\"video\":[{\"clips\":[{\"media\":\"a\",\"start\":0,\"in\":2,\"out\":12}]}],\"captions\":{\"items\":[{\"start\":0.5,\"end\":3,\"text\":\"Hello\"}]}}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "edit": {
                "anyOf": [
                  {
                    "type": "object"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "The CutConvert Edit JSON document (version 1), as an object or as a string holding it. At most 8 MB."
              },
              "targets": {
                "description": "The editors to export for, each once: capcut (a CapCut desktop project folder), premiere (Premiere Pro XML), resolve (a DaVinci Resolve .drp project), finalcut (Final Cut Pro FCPXML).",
                "items": {
                  "enum": ["capcut", "premiere", "resolve", "finalcut"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["edit", "targets"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Export an edit to CapCut, Premiere, Resolve or Final Cut"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:eeb30de942448f52f2ccc200b402ea58273c669c2769ae15f082d4de55cdaae7"
        },
        {
          "name": "inspect_file",
          "title": "Detect a file’s format",
          "description": "Detect the format of a subtitle/transcript/EDL/FCPXML file and report what CutConvert would produce from it, without performing the conversion or using quota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "File content (text formats).",
                "type": "string"
              },
              "content_base64": {
                "description": "Base64 bytes (binary formats like .prtranscript).",
                "type": "string"
              },
              "filename": {
                "description": "Original file name including extension.",
                "type": "string"
              }
            },
            "required": ["filename"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Detect a file’s format"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bce98440057eee08724a9b06fbcb4e8fe79b440dcd4764458edab199ca482f4c"
        },
        {
          "name": "list_converters",
          "title": "List supported converters",
          "description": "List every conversion CutConvert supports (source format, output format, and the target id to pass to convert_file).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List supported converters"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ef53799fae225a48cc832f39b524be8444774cf8b813a0e54f15d60500cb24f"
        },
        {
          "name": "timecode_calculate",
          "title": "SMPTE timecode calculator",
          "description": "Parse an SMPTE timecode at a frame rate (including 29.97/59.94 drop-frame) and report its frame count and real elapsed seconds; optionally re-express it at another rate.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mode": {
                "description": "When converting rates: \"time\" keeps the same real-world moment (conform, default); \"frames\" keeps the frame count (reinterpret).",
                "enum": ["time", "frames"],
                "type": "string"
              },
              "rate": {
                "description": "Frame rate the timecode is expressed in.",
                "enum": ["23.976", "24", "25", "29.97df", "29.97", "30", "50", "59.94df", "59.94", "60"],
                "type": "string"
              },
              "timecode": {
                "description": "Timecode like \"01:00:02:12\" (use \";\" before frames for drop-frame).",
                "type": "string"
              },
              "to_rate": {
                "description": "Optional target frame rate to convert to.",
                "enum": ["23.976", "24", "25", "29.97df", "29.97", "30", "50", "59.94df", "59.94", "60"],
                "type": "string"
              }
            },
            "required": ["rate", "timecode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "SMPTE timecode calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1aaff7b10df017e6a379c6239f14e79d879f3c5f4c13b456f63449d1ce9e7bd4"
        }
      ],
      "digest": "sha256:64f88bb3d554a55cfef12867fea72ab238a30cb6e3154e132aacb11dce35fad2"
    }
  }
