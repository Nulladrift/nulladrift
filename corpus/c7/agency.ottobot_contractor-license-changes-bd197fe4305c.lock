{
  "lockfileVersion": 2,
  "subjects": {
    "agency.ottobot/contractor-license-changes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://license-changes-mcp.ottobot2025.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "license-changes",
        "version": "0.1.3"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_license_history",
          "description": "Has this contractor's licence changed? Returns every status transition observed in the state board's own published file since 2026-07-17 -- suspensions, expirations, reinstatements and first appearance -- with the date each was seen. This is change over time, not a current-status lookup: use it after a snapshot check, to find out whether the licence you are about to rely on lapsed and came back. Distinguishes 'no change observed' from 'this source is not observed for that change', which are not the same answer. Only public, unsuppressed directory records are returned. Read-only.",
          "inputSchema": {
            "properties": {
              "license_number": {
                "description": "The licence number as the board prints it",
                "pattern": ".*\\S.*",
                "patternMessage": "argument license_number must not be blank",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code. Covered: AZ, CA, CO, CT, DE, FL, IA, NV, NY, OR, TX, UT, VA, WA",
                "pattern": "^[A-Za-z]{2}$",
                "patternMessage": "argument state must be a two-letter state code, e.g. CA",
                "type": "string"
              }
            },
            "required": ["license_number", "state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:015abe22b1c0ca92d520e2c807c17ca6852b20d5c08ef0d587999916f5cbe282"
        },
        {
          "name": "recent_license_changes",
          "description": "What changed lately across a state: licences that lapsed, were reinstated, or appeared for the first time, newest first, optionally narrowed to one trade. Answers the monitoring question a single lookup cannot -- which contractors lost standing this month, or who is newly licensed in this trade. Read-only.",
          "inputSchema": {
            "properties": {
              "change_type": {
                "description": "lapse = active to suspended/expired/inactive; new_license = first observed",
                "enum": ["lapse", "reinstate", "status_change", "new_license"],
                "type": "string"
              },
              "days": {
                "description": "Look back 1 to 365 days (default 30)",
                "type": "integer"
              },
              "limit": {
                "description": "Max rows, clamped to 1 through 100 (default 25)",
                "type": "integer"
              },
              "state": {
                "description": "Two-letter state code. Covered: AZ, CA, CO, CT, DE, FL, IA, NV, NY, OR, TX, UT, VA, WA",
                "pattern": "^[A-Za-z]{2}$",
                "patternMessage": "argument state must be a two-letter state code, e.g. CA",
                "type": "string"
              },
              "trade": {
                "description": "Optional trade filter, e.g. electricians, plumbers",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:037e2467d74dee9fb0f57833bbd8ad4e77bed444e9b301fccd83cd65ba857a70"
        }
      ],
      "digest": "sha256:d99783744ee7f9836bb35673d05e419bec4936fdbca200fee69b104af89aaff8"
    }
  }
}
