{
  "lockfileVersion": 2,
  "subjects": {
    "com.regulane/compliance": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://regulane.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "regulane",
        "title": "Regulane compliance",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Regulane checks code against the workspace's secure-coding rules, each mapped to ISO/IEC 27001:2022 Annex A controls and, for personal data, the DPDP Act 2023. Before finishing a change that touches authentication, access control, personal data, cryptography, logging, dependencies, CI or infrastructure: call get_compliance_rules, review the change against those rules, then call report_compliance_check with what you checked and found. Never send source code, secrets or personal data to Regulane. A finding is a repository-relative file path, a line number and one sentence. This is the free check: Regulane does not store the report. To keep history and track findings for an audit, connect with a workspace token.",
      "tools": [
        {
          "name": "get_compliance_rules",
          "title": "Get Regulane secure-coding rules",
          "description": "Returns the workspace's secure-coding rules: what to look for, how to fix it, and the ISO 27001 Annex A controls and DPDP Act sections each rule evidences. Call this before reviewing a change, then report with report_compliance_check.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "areas": {
                "description": "Only the rules in these areas. Omit for all rules (recommended).",
                "items": {
                  "enum": ["secrets_and_auth", "injection", "cryptography", "personal_data", "logging", "supply_chain", "infrastructure", "change_safety"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Regulane secure-coding rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fcccc09cee75e5799e6909045b468eda03583dd18119e3e5404055cc46830633"
        },
        {
          "name": "report_compliance_check",
          "title": "Get a Regulane compliance scorecard",
          "description": "Turns the check you ran against the rules from get_compliance_rules into a scorecard: findings by severity, the ISO 27001 controls and DPDP Act sections affected, and the fix for each. Report a clean check too. Regulane does not store it. Send no source code, secrets or personal data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Which coding agent you are, such as \"Claude Code\", \"Cursor\", \"GitHub Copilot\", \"Codex\".",
                "type": "string"
              },
              "branch": {
                "description": "Current branch, if known.",
                "type": "string"
              },
              "commit": {
                "description": "Commit SHA the check ran against, if known.",
                "type": "string"
              },
              "findings": {
                "description": "One entry per problem found. Empty when the check is clean.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "file": {
                      "description": "Path relative to the repository root.",
                      "type": "string"
                    },
                    "line": {
                      "description": "Line number, if there is one.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "rule_id": {
                      "description": "The rule broken, such as RG-SC-004.",
                      "type": "string"
                    },
                    "summary": {
                      "description": "One sentence on the problem. No code, secrets or personal data.",
                      "type": "string"
                    }
                  },
                  "required": ["file", "rule_id", "summary"],
                  "type": "object"
                },
                "maxItems": 200,
                "type": "array"
              },
              "repository": {
                "description": "The git remote URL, or the project folder name when there is no remote.",
                "type": "string"
              },
              "rules_checked": {
                "description": "Every rule id you checked, including those with no finding.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "scope": {
                "description": "One line on what was examined, such as \"staged changes, 6 files\" or \"src/payments\".",
                "type": "string"
              }
            },
            "required": ["findings", "repository", "rules_checked", "scope"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a Regulane compliance scorecard"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:08976dab8950e569590f90ce3184e7b108d6f0f1eebd28773211e949c6d1b9bf"
        }
      ],
      "prompts": [
        {
          "name": "compliance_review",
          "title": "Regulane compliance review",
          "description": "Check code against your Regulane secure-coding rules and record the result.",
          "arguments": [
            {
              "name": "scope",
              "description": "What to check, such as \"staged changes\" or \"src/payments\". Defaults to uncommitted changes.",
              "required": false
            }
          ],
          "digest": "sha256:bba61f0688a1808438650530db82ea3dc3fbb3c0219772815a0e93d339a09310"
        }
      ],
      "digest": "sha256:f5e84c5438d84c095e1c23a9877d67dc1e386ef7e69f00dafa5dd8205d454eb0"
    }
  }
}
