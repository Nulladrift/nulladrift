      },
      "instructions": "BerthTime tracks ocean shipments (container, bill of lading or booking numbers) at the carrier. All data belongs to a company. Use list_shipments / list_arriving_shipments / list_delayed_shipments to find shipments, get_shipment for route, ETA and latest events, and track_shipment to start tracking a new reference. BerthTime updates every shipment automatically in the background (get_shipment shows when); there is no manual refresh. Times are UTC. Write tools need the `write` scope (a read + write API key, or read + write access granted at sign-in by an owner or admin of the company). Errors come back as a tool result with isError and a plain explanation of what to do next. You are not signed in: tools/list works, but every tool call needs a sign-in (OAuth, advertised in the 401 WWW-Authenticate header) or `Authorization: Bearer bt_live_...` (a BerthTime API key).",
      "tools": [
        {
          "name": "archive_shipment",
          "title": "Archive shipment",
          "description": "Stop tracking a shipment. Its history is kept and track_shipment with the same reference re-activates it. Only when the user asks to stop or remove a shipment. `shipment` (required) is the BerthTime id, the tracked reference, or a container number on the shipment. Returns: shipment_id, status (archived). Archiving an archived shipment changes nothing. Needs write access: a read + write API key, or read + write access granted at sign-in by an owner or admin of the company.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Which company to act for: its id, @handle or exact name (see list_companies). Omit for the connection's default company.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "shipment": {
                "description": "BerthTime shipment id, or the tracked reference (container, bill of lading or booking number), or a container number on the shipment.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["shipment"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Archive shipment"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f0b73a66a684bc7c8399dd0b6a27698f6c2b004e06a097d41743c4d4426a3a5a"
        },
        {
          "name": "create_share_link",
          "title": "Create share link",
          "description": "Create a public read-only tracking link for a shipment, or return the active one (safe to repeat). Anyone with the URL sees status, ETA, route and events, but no tags or company data. Disable or regenerate it in the web app. `shipment` (required) is the BerthTime id, the tracked reference, or a container number on the shipment. Returns: shipment_id, created (false = the existing link), share_link {url, active, expires_at, view_count, ...}. New links need a paid plan (the Free plan gets an error). Needs write access: a read + write API key, or read + write access granted at sign-in by an owner or admin of the company.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Which company to act for: its id, @handle or exact name (see list_companies). Omit for the connection's default company.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "shipment": {
                "description": "BerthTime shipment id, or the tracked reference (container, bill of lading or booking number), or a container number on the shipment.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["shipment"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create share link"
          },
          "behavior": {
            "destructive": false,
