        {
          "name": "create_support_request",
          "title": "Contact BerthTime support",
          "description": "Open a support request with the BerthTime team on behalf of the user. Only when the user asks to contact support or report a problem; to see existing requests use list_support_requests. Required: subject (3-200 characters), message (plain text). Optional: topic (support, sales, billing, partnership, other; default support), priority (normal or high, high only when the user says it is urgent). Returns: id, number (BT-1234), status, requester_email. The team answers by email and in the web app. Each call opens a new request, so do not repeat it. Needs write access: a read + write API key, or read + write access granted at sign-in by an owner or admin of the company.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Which company to act for: its id, @handle or exact name (see list_companies). Omit for the connection's default company.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "message": {
                "description": "What the user needs help with, in plain text.",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "priority": {
                "default": "normal",
                "description": "high only when the user says it is urgent (default normal).",
                "enum": ["normal", "high"],
                "type": "string"
              },
              "subject": {
                "description": "Short summary of the request, e.g. 'Wrong ETA on MSCU1234566'.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "topic": {
                "default": "support",
                "description": "What the request is about (default support).",
                "enum": ["sales", "support", "billing", "partnership", "other"],
                "type": "string"
              }
            },
            "required": ["message", "subject"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Contact BerthTime support"
