        {
          "name": "format_screenplay",
          "title": "Format screenplay (blocks + PDF)",
          "description": "Convert raw or loosely formatted screenplay text (Chinese, English, or mixed — including Japanese broadcast-drama format and Chinese colon-style dialogue scripts) into professionally structured screenplay blocks and a print-ready PDF on a fixed typewriter character grid identical to narracore.cn. Use it for screenplay formatting, import, or producing a shareable screenplay PDF — NOT for general prose rewriting or story editing.\n\nINPUT (contract_version 3) — two modes:\n• input_format=\"text\" (default): line-based screenplay text, one element per line — scene headings (\"INT. LAB - DAY\", \"第 N 场 …\"), CHARACTER names in CAPS or CJK on their own line, short dialogue lines after them, standalone (…) parentheticals, standalone transitions (\"CUT TO:\", \"切至：…\"). Inline dialogue 名前「セリフ」 and 人名：台词 is parsed natively. An unbroken wall of text renders as continuous action and is flagged UNRESOLVED_STRUCTURE.\n• input_format=\"blocks\": typed blocks validated and rendered EXACTLY as submitted, never re-classified; ids echoed. CHAINING: to run other tools on this screenplay, pass back the BLOCKS you received — not the plain text (it parses differently). The same screenplay is charged once per 24h across analyze/diagnose/convert/video-prompt tools; check_video_prompts is free.\n• output=\"validate_only\": structure check + diagnostics only, free.\n\nBefore delivering: read diagnostics[] (code/severity/line or block_id/message/suggested_action) with the user; confidence = share of non-ambiguous lines, NOT accuracy.\n\nBilling: one credit = one screenplay for 24h across the screenplay tools (or one film analysis / one story project). Free tier: one credit per day per visitor, no key. Failed calls are never charged; the same request_id never double-charges. On free_tier_exhausted or quota_exhausted: relay the price and purchase link from the response verbatim; never invent a license key.\n\nCompetition submissions: style=\"uk\"/\"fr\" (A4, BBC/French layout), dialogue_breaks=true ((MORE)/(CONT'D) on page breaks), cover.anonymous=true (no author on title page) — rendering options, free within the 24h bundle.\n\nFull parameter manual (cover/header/footer/style, examples): https://narracore.app/llms.txt",
