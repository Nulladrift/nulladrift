        {
          "name": "diagnose_scenes",
          "title": "Scene shootability diagnosis (AI cites, server scores)",
          "description": "Scene-level \"shootability\" diagnosis for a screenplay, using the same ai-2.0 rules as narracore.cn: YOU (the calling AI) cite the evidence, the server validates it and computes the score — no LLM on the server. Two steps: (1) mode=\"material\" (FREE) returns each scene as a numbered block list ([n] [type] text), the strict findings JSON schema, and 6 problem types (abstract_psychology, literary_summary, unfilmable_information, unclear_space, weak_visible_action, unplayable_direction); (2) after analyzing the material yourself, call mode=\"score\" with findings=[{scene, summary, problems:[{type, severity(low|medium|high), evidence (verbatim quote from the material), blocks (ordinals), suggestion}]}]. The server maps ordinals to blocks, drops any finding whose evidence cannot be verified (that scene then scores null — never faked), and computes each scene's 0-100 score (severity-weighted evidence coverage, exact arithmetic) plus a reference-only structural baseline. One credit covers one screenplay for 24 hours across the screenplay tools. Failed calls are never charged. 剧本逐场影视化度诊断：AI 举证、程序算分（0-100，证据核验，无效即空不冒充）。",
