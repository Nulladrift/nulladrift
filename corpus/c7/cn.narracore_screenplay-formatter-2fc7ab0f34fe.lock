        {
          "name": "validate_film_breakdown",
          "title": "Free breakdown preflight",
          "description": "FREE preflight for a film breakdown payload (film_manifest + shots + scenes + relations). Checks the contract WITHOUT watching anything: schema shape, closed vocabularies (exact→alias→reject), cross-references (shot ids, scene membership, relation endpoints), window topology (a long take's windows must be complete), provenance shape, and observability metadata only — it never judges whether an observation is TRUE (the server cannot see your video). Lossless representation fixes (alias/trim/wrap) are returned as normalized_patch; semantic problems are errors for YOU to fix, with retry_feedback to feed back to your model. This is advisory: compile_film_breakdown re-validates authoritatively. 免费预检：契约/词表/交叉引用/窗口拓扑校验，只修表示层、绝不代改语义；编译前先跑它可省一次失败往返。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "film_manifest": {
                "additionalProperties": false,
                "properties": {
                  "cut_timestamps": {
                    "items": {
                      "type": "number"
                    },
                    "maxItems": 4000,
                    "type": "array"
                  },
                  "duration_sec": {
                    "exclusiveMinimum": 0,
                    "maximum": 28800,
                    "type": "number"
                  },
                  "media_id": {
                    "pattern": "^[0-9a-f]{64}$",
                    "type": "string"
                  }
                },
                "required": ["cut_timestamps", "duration_sec", "media_id"],
                "type": "object"
              },
