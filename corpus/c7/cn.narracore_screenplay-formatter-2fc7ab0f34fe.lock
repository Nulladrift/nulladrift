        {
          "name": "compile_film_breakdown",
          "title": "Compile film analysis (charged)",
          "description": "CHARGED (1 credit per film analysis — the same analysis_id within 24h is NOT charged again; failed validation is never charged). Compile a validated film breakdown into a bounded, derivable result: authoritative validation → window→canonical shot merge (long-take windows are recombined so a 60s take is ONE shot in every statistic) → exact aggregates (distributions, shot lengths, per-scene aggregates, coverage) → deterministic-heuristic reconstructions (performance arc, cut logic, camera-performance logic — reproducible interpretations, explicitly labelled, NOT facts) → a print-ready PDF report (scene table + per-scene arcs + shot tables) with a 24h signed link. Your input records are NEVER echoed back — you already have them locally; this returns only the derived increments. analysis_id = sha256(media_id + sha256(topology_hash + film_schema_version + film_vocab_version)) with media_id = sha256(video bytes) computed locally; the server never sees the video and cannot verify media_id (it exists to protect YOU from double-charging, not as anti-cheat). Recompile after re-observing with a different model: same analysis_id, no re-charge; change the cuts or the protocol: new analysis. 收费编译：权威校验→长镜窗口合并→确定性统计+启发式重组→PDF 报告；不完整窗口/非法词表一律拒绝且不收费；同一分析任务 24h 内重复编译不重复扣费。",
