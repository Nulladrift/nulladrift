        {
          "name": "build_video_prompts",
          "title": "Video prompt scaffolds from screenplay",
          "description": "Turn a screenplay into structured video-generation prompt scaffolds (deterministic — no LLM on the server; YOU fill the creative fields). For each selected scene it estimates ~15s segments (marked estimated), registers entities (characters + dialogue counts), proposes ≤4 shots per segment at beat boundaries, pre-fills dialogue lines VERBATIM from the screenplay (never rewrite them), and emits a two-layer template per segment: a SHARED block (A/V limits, camera base, style, entities, causal chain, global guards) written once, plus SHOT blocks carrying only private fields, with CUT-OUT/CUT-IN handoff lines between shots. STYLE GUIDANCE, never a style lock: by default the style section is a decision checklist (medium / frame-rate mechanism / brush / color-domain boundaries / light & face readability / banned vocabulary, each with how-to and example); optionally pass style=\"engine_cinematic\" | \"painted_on_twos\" | \"live_action_neutral\" as an EDITABLE starting point, and/or style_note (≤500 chars, passed through verbatim). The response includes a condensed filling guide (eyeline = screen vector, performance arc, causal chain, motion domains, cut-point two-state, targeted negative guards). Estimates are proposals — adjust to the scene's beats. Charged like the other screenplay tools: one credit covers one screenplay for 24 hours across the screenplay tools; failed calls are never charged; same request_id retries never double-charge. After filling, call check_video_prompts (free) for drift findings. 剧本→视频提示词骨架：台词逐字预填、实体登记、段-镜两层结构与切点两态；风格由用户决定（决策清单+可选预设+自由附注），服务端不代做创意决定。",
