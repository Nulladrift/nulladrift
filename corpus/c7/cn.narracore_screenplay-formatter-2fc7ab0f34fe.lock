          "description": "FREE. Return the Narracore Film Contract by section — the protocol that lets ANY vision-capable agent turn its own observation of a film into a stable, comparable, traceable Film IR (shot/scene/relation), validated and compiled by this server. The video NEVER leaves your machine: you observe and reason with your own models, this server provides the shared language and the deterministic toolchain. section=\"core\" (default): pipeline, entities, the window protocol for long takes, observability levels (observed/mixed/inferred), entity-level provenance, limits. \"vocabulary\": the closed vocabularies + alias table (normalization is exact→alias→reject — no fuzzy guessing). \"observation_guidance\": the observation prompt template + how to write interpretive fields. \"reasoning_guidance\": the dramatic-layer/scene/relation prompt + the Q&A playbook for answering questions from the compiled result. \"media_recipe\": reference ffmpeg recipes (a platform adapter example — not authoritative output). \"all\": every section in one call — recommended on first contact. 免费下发的影视拉片契约：分类词表、观察/推理提示词、窗口协议、问答 playbook 与备料配方示例（section=\"all\" 一次拿全）。",
