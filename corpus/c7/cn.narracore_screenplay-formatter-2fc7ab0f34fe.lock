        {
          "name": "prepare_story_window",
          "title": "Story window split + anchoring",
          "description": "FREE. Split a story conversation (verbatim user/assistant turns) into stable, hash-anchored units for the Narracore Story Continuity Protocol. YOU judge the story; the server only slices and anchors provenance — a source is traceable, not proof your interpretation is true. Keep the full text and returned StoryState client-side (server stores nothing); failed calls are never charged. 免费：故事窗口确定性切分与锚定；AI 判断、服务端只核验出处，出处不证明结论真伪；全文与 state 由调用方保存，失败不收费。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "conversation": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "role": {
                      "enum": ["user", "assistant"],
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["role", "text"],
                  "type": "object"
                },
                "maxItems": 4000,
                "minItems": 1,
                "type": "array"
              },
              "lang": {
                "default": "en",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "request_id": {
                "description": "Idempotency key (optional; same request_id never double-charges)",
                "maxLength": 64,
                "type": "string"
              },
              "state": {
                "additionalProperties": false,
                "properties": {
