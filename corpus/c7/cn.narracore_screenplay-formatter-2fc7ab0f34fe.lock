          "name": "analyze_screenplay",
          "title": "Screenplay statistics",
          "description": "Deterministic screenplay statistics from the Narracore analyzer (analyzer_version 1.0, same rules as narracore.cn): a scene list with structured scene headings (scene number / location / time of day / INT-EXT parsed from each heading), per-scene word count, dialogue ratio and action density, a character table (cue count, scenes present, dialogue lines, dialogue chars, share of dialogue), and totals.genko_yoshi manuscript-sheet counts for Japanese competitions (400-character 20×20, 200-character 20×10, Kido-style 20×40 — always confirm the current rules of the competition you are entering). Accepts the same inputs as format_screenplay (input_format=\"text\" or \"blocks\") — pass the SAME screenplay to both tools: one credit covers one screenplay for 24 hours across the screenplay tools (format / analyze / diagnose / convert / video prompts). When chaining tools, pass back the blocks you received (structured), not the formatted plain text. Failed calls are never charged; retrying the same request_id never double-charges. 剧本确定性统计：场景清单（结构化场景头）、逐场字数/对白占比/动作密度、角色戏份表、日式稿纸枚数三口径；同一份剧本 24 小时内多工具只扣一次。",
