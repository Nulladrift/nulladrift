        {
          "name": "convert_fountain",
          "title": "Fountain ⇄ blocks converter",
          "description": "Convert between Narracore screenplay blocks and Fountain (the plain-text screenplay interchange format). direction=\"to_fountain\": screenplay (input_format=\"text\" or \"blocks\") → Fountain text (Latin content upper-cased per convention, CJK preserved verbatim; notes as [[…]]). direction=\"from_fountain\": Fountain text → typed blocks you can pass straight to format_screenplay (input_format=\"blocks\") — supports scene headings (INT/EXT/EST/I/E), character cues with (V.O.)-style extensions (extension becomes the delivery hint), parentheticals, dialogue, TO: transitions, > forced transitions, . forced action, [[notes]]; boneyard /*…*/ is stripped and reported, title-page keys and # section headers are skipped with warnings; mostly-Chinese content falls back to the Chinese screenplay parser (Fountain rules target Latin scripts). One credit covers one screenplay for 24 hours across the screenplay tools — converting and then formatting the same screenplay charges once. Failed calls are never charged. 剧本块与 Fountain 格式互转；同一份剧本 24 小时内多工具只扣一次。",
