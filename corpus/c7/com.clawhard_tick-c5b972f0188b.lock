        "name": "com.clawhard/tick",
        "title": "Tick",
        "version": "1.0.0",
        "description": "Tick shows the next run times for a cron expression in any IANA timezone, with a plain-English field breakdown and DST gap/fold warnings. No account.",
        "websiteUrl": "https://tick.clawhard.com",
        "icons": [
          {
            "src": "https://clawhard.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
