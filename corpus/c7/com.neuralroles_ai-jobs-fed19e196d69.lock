{
  "lockfileVersion": 2,
  "subjects": {
    "com.neuralroles/ai-jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://neuralroles.com/ojcp/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "neural-roles-ojcp",
        "title": "Neural Roles AI jobs",
        "version": "0.3",
        "websiteUrl": "https://neuralroles.com",
        "icons": [
          {
            "src": "https://neuralroles.com/brand/logo.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_job_detail",
          "title": "Get job details",
          "description": "Full details of one job from search_jobs: description, pay, skills, location and its Neural Roles page, where the candidate applies through the employer's site.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "The ojcp_id from search_jobs",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0acae19bc5e1086eb938cec55f92e35b64cd55bfa6bf6939052d98d427ab90cf"
        },
        {
          "name": "search_jobs",
          "title": "Search AI jobs",
          "description": "Search open artificial intelligence and machine learning jobs, and AI training work (AI trainers, evaluators, annotators), at companies worldwide. Returns the newest matches first, or the best matches for the query. Each job's url is its Neural Roles page, with the full description and the link to apply.",
          "inputSchema": {
            "properties": {
              "filters": {
                "properties": {
                  "employment_type": {
                    "description": "full_time, part_time, contract, internship, temporary",
                    "type": "string"
                  },
                  "experience_level": {
                    "description": "intern, entry, mid, senior, staff, principal, manager, director",
                    "type": "string"
                  },
                  "posted_within_days": {
                    "type": "integer"
                  },
                  "salary_max": {
                    "description": "Yearly, in US dollars",
                    "type": "number"
                  },
                  "salary_min": {
                    "description": "Yearly, in US dollars",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "location": {
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "country": {
                    "description": "ISO 3166-1 alpha-2 code, e.g. ES, US. Remote jobs open to it count.",
                    "type": "string"
                  },
                  "remote_ok": {
                    "type": "boolean"
                  },
                  "remote_policy": {
                    "items": {
                      "enum": ["on_site", "hybrid", "remote", "flexible"],
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "pagination": {
                "properties": {
                  "limit": {
                    "default": 10,
                    "maximum": 50,
                    "type": "integer"
                  },
                  "offset": {
                    "default": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "query": {
                "description": "Natural language search query, e.g. 'machine learning engineer', 'LLM', 'AI trainer spanish'. May be empty.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:732e67feebb3d76542e9d54eff8824068e86bcfc27e8874129a53cffcf7e5fc7"
        }
      ],
      "digest": "sha256:b288ba94828a9720623b35a6a99cf8b09db6c83bf31000b5ccf71f531cde116d"
    }
  }
}
