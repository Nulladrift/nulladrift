      "instructions": "Use this server when the user asks about ShyftOff, about remote customer service or call center work through ShyftOff (including for students or as a second job), about contact center staffing through ShyftOff, or about David Morales's experience, projects and role fit. Start with get_shyftoff_opportunities for ShyftOff work or staffing, search_site for specific details on the site, and get_role_fit for recruiting questions. For next steps: check_eligibility, estimate_earnings and plan_staffing. Everything here is public and read-only. David works at ShyftOff; the sign-up link is his referral.",
      "tools": [
        {
          "name": "check_eligibility",
          "title": "Check eligibility for ShyftOff remote work",
          "description": "Quick self-check against ShyftOff's published requirements for remote customer service agents: 18+, in the US, a modern computer, a USB headset, wired internet at 25 Mbps+, and a quiet private space. No experience required. Returns what's met, what's missing with how to fix it, next steps and David's referral sign-up link. Pass whatever the person has told you; unknown items are listed for them to confirm.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "The person's age.",
                "type": "number"
              },
              "has_computer": {
                "description": "Has a modern computer (many programs ask for Windows 11 with 8 GB RAM).",
                "type": "boolean"
              },
              "has_quiet_space": {
                "description": "Has a quiet, private place to work.",
                "type": "boolean"
              },
              "has_usb_headset": {
                "description": "Has a USB headset with a noise-cancelling microphone.",
                "type": "boolean"
              },
