        {
          "name": "get_shyftoff_opportunities",
          "title": "Remote CS jobs & contact center staffing (ShyftOff)",
          "description": "Two ShyftOff opportunities, with links. For job seekers: ongoing work-from-home customer service (phone, chat, email) at $14–$20 an hour, paid weekly, in shifts as short as 30 minutes with no minimum hours, no experience required, paid certification with no certification fee (a one-time $40 background check fee that ShyftOff pays back once agents start working), and growth into QA and Star status; includes pages for college students (18+) and for fast food, restaurant and retail workers adding a second job, common questions (is ShyftOff legit, weekly pay timing, certification pay, computer requirements, hours, login and support), plus David's referral sign-up link. For businesses, BPOs and contact centers: on-demand agents certified on your program during implementation, improved with performance data, low performers removed, billed per productive hour, with or without AI, plus David's ShyftOff email. Use when the user asks about ShyftOff, about remote customer service or call center work through ShyftOff, or about contact center staffing through ShyftOff.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "\"agents\" for people looking for remote customer service work, \"businesses\" for companies that need agent capacity. Omit for both.",
