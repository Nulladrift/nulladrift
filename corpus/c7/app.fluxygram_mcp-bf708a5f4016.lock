{
  "lockfileVersion": 2,
  "subjects": {
    "app.fluxygram/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fluxygram.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "fluxygram",
        "title": "Fluxygram",
        "version": "0.3.0",
        "websiteUrl": "https://fluxygram.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fluxygram turns a small JSON file (.flux.json) into an animated diagram that explains something step by step.\nWorkflow: call get_guide once to learn the format (and get_example for a model to copy), write the diagram JSON, call validate_diagram and fix every issue, then call share_link and give the user the link so they can watch it. Write labels and captions in the user's language.",
      "tools": [
        {
          "name": "get_example",
          "title": "Get an example diagram",
          "description": "Returns a complete example diagram to learn from or adapt. Without a name, lists the available examples (recipes, software architecture, OAuth login, order process, timelines, live order trackers and more).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the labels. Default en.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "name": {
                "description": "Example name from the list, for example \"sequence\" or \"tracker\". Omit to list them.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9eb3ed25c22d79977166fd8414327f56b42ebe693d2aadcc87c71ed3f289a42"
        },
        {
          "name": "get_guide",
          "title": "Fluxygram format guide",
          "description": "How to write a Fluxygram diagram: the seven diagram types and when to use each, nodes, edges, steps with captions, motion, live status (tracker mode), icons and the storytelling rules. Call it before writing your first diagram.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:07f32baafb805b758063abb8132ecf337b5128bd2bfef9b9b86ab0dff31ac078"
        },
        {
          "name": "share_link",
          "title": "Get a link to watch the diagram",
          "description": "Validates the diagram and returns links on fluxygram.app to watch it animated, open it in the editor or present it full screen. The diagram travels inside the link (compressed); nothing is uploaded or stored. Give the view link to the user.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "diagram": {
                "description": "The diagram: the JSON object or its text.",
                "type": ["object", "string"]
              }
            },
            "required": ["diagram"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:371958d4f759d12a724b25e3fadc450274032e2b8e75ecb02868ed3936b0d5da"
        },
        {
          "name": "validate_diagram",
          "title": "Validate a diagram",
          "description": "Checks a Fluxygram diagram with the same validator the viewer uses. Returns \"valid\" with a short summary, or every problem with its path so you can fix it. Always validate before sharing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "diagram": {
                "description": "The diagram: the JSON object or its text.",
                "type": ["object", "string"]
              },
              "lang": {
                "description": "Language of the error messages. Default en.",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "required": ["diagram"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27349f63ed8e367599045eb1b3945ad146d731a0134ce26542b8ba413ca82dd7"
        }
      ],
      "digest": "sha256:d4696ec43e716ac6afc38e3018b412d6aec17fa40b2b0fea48a22acbd6987110"
    }
  }
}
