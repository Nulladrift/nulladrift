        {
          "name": "company_enrich",
          "title": "company-enrich",
          "description": "Company profile from a domain or name in ONE call, for sales and research agents: what the company does, industry, services, service area, address, phones and emails published by the company (each with the page it came from), social links, plus official screening (registries, US, UK, EU and Canadian sanctions lists). Read live from the company's own website, no third-party database. No website found = HTTP 404 = no charge. Input: domain or name, optional city, country, lang (en|fr). Businesses only. Costs $0.02 USDC per call (x402 v2, Base or Solana). Send the HTTP header PAYMENT-SIGNATURE with your x402 payment, or call POST https://tolca.tonbot.ca/v1/company-enrich with an x402 client.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "City, to find the right company when several share the name",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "ISO 3166 alpha-2",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "domain": {
                "description": "Company website or domain, e.g. acme.com",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              },
              "lang": {
                "description": "Language of the profile: en or fr",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "name": {
                "description": "Company name, used to find the website when no domain is given",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              },
              "official_checks": {
                "description": "Also run official checks: sanctions lists, registries and licences",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
