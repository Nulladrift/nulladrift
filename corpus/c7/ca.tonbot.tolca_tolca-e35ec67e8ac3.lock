        {
          "name": "payment_check",
          "title": "payment-check",
          "description": "Check an x402 endpoint before paying it: is this x402 seller safe to pay? Send the seller's URL (or its 402). One call screens the payTo wallet against OFAC SDN crypto addresses, checks official USDC on its network (13 networks incl. Base, Solana, Polygon, Arbitrum) and compares price and payTo with the seller's Coinbase Bazaar listing. Returns allow / review / block, invoice hash and Ed25519-signed receipt. Input: url or payment_required, optional network, seller_name. Costs $0.01 USDC per call (x402 v2, Base or Solana). Send the HTTP header PAYMENT-SIGNATURE with your x402 payment, or call POST https://tolca.tonbot.ca/v1/payment-check with an x402 client.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "method": {
                "description": "Optional: method to use on the seller URL (default: GET, then POST)",
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "network": {
                "description": "Optional: network to check when the seller offers several, e.g. eip155:137, polygon, solana (default: Base)",
                "type": "string"
              },
              "payment_required": {
                "additionalProperties": {},
                "description": "Or the full 402 response body",
                "properties": {
                  "accepts": {
                    "description": "The accepts array from the 402 response: the seller's payment options (1 to 20)",
                    "items": {
                      "additionalProperties": {},
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["accepts"],
                "type": "object"
              },
              "requirements": {
                "additionalProperties": {},
                "description": "One entry of the accepts array from the seller's 402 response",
                "properties": {
                  "amount": {
                    "description": "Amount in atomic units (USDC has 6 decimals)",
                    "type": ["string", "number"]
                  },
                  "asset": {
                    "description": "Token contract address the seller asks for",
                    "type": "string"
                  },
                  "maxAmountRequired": {
                    "description": "Amount in atomic units, x402 v1 field name (use amount for v2)",
                    "type": ["string", "number"]
                  },
                  "network": {
                    "description": "Network of the invoice, e.g. eip155:8453 (Base)",
                    "type": "string"
                  },
                  "payTo": {
                    "description": "Seller wallet address that would receive the payment",
                    "type": "string"
                  },
                  "resource": {
                    "description": "URL of the paid resource"
                  },
                  "scheme": {
                    "description": "x402 payment scheme, e.g. exact",
                    "type": "string"
                  }
                },
                "required": ["asset", "network", "payTo"],
                "type": "object"
              },
              "seller_country": {
                "description": "Optional ISO-2 country code of the seller",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "seller_name": {
                "description": "Optional: seller company name, screened against sanctions lists",
                "type": "string"
              },
              "url": {
                "description": "Or just the seller's paid URL: Tolca fetches its 402 payment request itself, without paying",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "payment-check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
