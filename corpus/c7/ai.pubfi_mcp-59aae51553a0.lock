        {
          "name": "pubfi.route.execute",
          "description": "Execute one exact GET or POST path through the authenticated PubFi account lane and the same Registry v2 matcher and typed executor as the HTTP gateway. Append :free only when the capability catalog publishes that exact account-scoped free variant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "Exact optional ASCII request-body bytes. For JSON routes, supply one compact serialized JSON document rather than a nested MCP argument value.",
                "maxLength": 1048576,
                "pattern": "^[\\x20-\\x7E]*$",
                "type": "string"
              },
              "idempotency_key": {
                "maxLength": 256,
                "minLength": 1,
                "pattern": "^[\\x20-\\x7E]+$",
                "type": "string"
              },
              "method": {
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "query": {
                "description": "Exact ASCII raw query string without a leading question mark.",
                "maxLength": 65536,
                "pattern": "^(?!\\?)[\\x20-\\x7E]*$",
                "type": "string"
              },
              "raw_path": {
                "description": "Exact original URI path consumed by the Registry matcher. Segments use canonical unreserved ASCII only; percent escapes, dot segments, query, fragment, and backslash are forbidden.",
                "maxLength": 2048,
                "minLength": 2,
                "pattern": "^/(?!\\.{1,2}(?:/|$))[A-Za-z0-9._~-]{1,128}(?:/(?!\\.{1,2}(?:/|$))[A-Za-z0-9._~-]{1,128}){0,63}$",
                "type": "string"
              },
              "request_id": {
                "maxLength": 256,
                "minLength": 1,
                "pattern": "^[\\x20-\\x7E]+$",
                "type": "string"
              }
            },
            "required": ["method", "raw_path"],
            "type": "object"
          },
          "outputSchema": {
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "billing": {
                    "additionalProperties": false,
                    "properties": {
                      "mode": {
