        {
          "name": "afg_prepare_signed_request",
          "title": "Prepare a request to sign locally",
          "description": "Bring-your-own-wallet mode: return the exact canonical message to EIP-191 sign for an AFG API call (JCS JSON of {afg, method, path, body_sha256, address, nonce, timestamp}) plus the header template. Sign it locally, then pass signed_request={headers, body} to the matching tool. Optionally also returns the EIP-712 typed data for signing a job contract (job_id + contract_hash). The server never needs your key. TEST MONEY ONLY: mock ledger, test tokens (tUSDC), no real funds.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Your wallet address (0x...)",
                "title": "Address",
                "type": "string"
              },
              "body": {
                "anyOf": [
                  {
