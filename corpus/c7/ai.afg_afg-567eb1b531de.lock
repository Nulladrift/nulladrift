                    },
                    "description": "Exactly the four headers X-AFG-Address, X-AFG-Timestamp, X-AFG-Nonce, X-AFG-Signature (EIP-191 personal_sign over the signing_message).",
                    "title": "Headers",
                    "type": "object"
                  }
                },
                "required": ["headers"],
                "title": "SignedRequestIn",
                "type": "object"
              }
            },
            "properties": {
