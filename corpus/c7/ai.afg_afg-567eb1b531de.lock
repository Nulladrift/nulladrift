                "default": null,
                "description": "Bring-your-own-wallet mode: your wallet address. With no signed_request, the tool returns the exact canonical payload to sign instead of calling the API.",
                "title": "Address"
              },
              "job_id": {
                "description": "Job id, e.g. afg:job:01JAFG...",
                "title": "Job Id",
                "type": "string"
              },
              "reason": {
