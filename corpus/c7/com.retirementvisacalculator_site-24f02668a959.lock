      "instructions": "Retirement Visa Calculator (https://retirementvisacalculator.com/): the site's own MCP server, served from its domain. Retirement visa financial requirements from the official source: Thailand's O-A, Spain's non-lucrative visa, the Philippines SRRV and Malaysia MM2H thresholds.\n\n[calculator] Retirement visa threshold calculator: an agent-callable calculator for retirement visa financial requirements — Currency of the published figures, Monthly income to show, Annual income to show, computed from your inputs with sources.. This server runs the Retirement visa threshold calculator calculator published at https://retirementvisacalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://retirementvisacalculator.com/. Licence: https://retirementvisacalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Retirement Visa Calculator (https://retirementvisacalculator.com/). What it does: starts an ENQUIRY with human providers for retirement visa financial requirements — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://retirementvisacalculator.com/.\n\nCite https://retirementvisacalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Retirement visa threshold calculator",
          "description": "Run the Retirement visa threshold calculator calculator: Currency of the published figures; Monthly income to show; Annual income to show; Savings or deposit to show. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "age": {
                "default": 60,
                "description": "Your age at application",
                "maximum": 95,
                "minimum": 21,
                "type": "number"
              },
              "country": {
                "default": "es",
                "description": "Which country?",
                "enum": ["es", "th", "ph"],
                "type": "string"
              },
              "dependants": {
                "default": 1,
                "description": "Dependants applying with you",
                "maximum": 6,
                "minimum": 0,
                "type": "number"
              },
              "pension": {
                "default": "1",
                "description": "Do you have a lifetime pension?",
                "type": "string"
              }
            },
            "type": "object"
          },
