        {
          "name": "list_calendar_events",
          "title": "List closures, holidays and blocked chair time",
          "description": "Use this when someone asks when their dental practice is closed, or when a dentist or chair is blocked for holidays, courses, meetings or maintenance. Returns each block or extra opening with start, end, all-day flag, scope and type (no titles or notes). Not for patient appointments.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clinicId": {
                "description": "Only this practice (24 lowercase hexadecimal characters); every practice when absent",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "cursor": {
                "description": "The nextCursor of the previous page with the same filters; absent for the first page",
                "maxLength": 4096,
                "type": "string"
              },
              "endTime": {
                "$ref": "#/properties/startTime",
                "description": "Only blocks ending before this ISO 8601 date-time"
              },
              "limit": {
                "description": "Blocks per page, from 1 to 100; defaults to 20",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "integer"
              },
              "startTime": {
                "description": "Only blocks starting at or after this ISO 8601 date-time",
                "maxLength": 32,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "calendarEvents": {
                "description": "Non-appointment calendar blocks, earliest first. Event identifiers, staff and chair references, titles, notes and patient links are never returned.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "allDay": {
                      "type": "boolean"
                    },
                    "effect": {
                      "anyOf": [
                        {
                          "enum": ["BLOCK", "OPEN"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "BLOCK removes bookable time; OPEN adds hours on a normally closed time"
                    },
                    "endTime": {
                      "anyOf": [
                        {
                          "$ref": "#/properties/calendarEvents/items/properties/startTime/anyOf/0"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "scope": {
                      "anyOf": [
                        {
                          "enum": ["SEAT", "PROVIDER", "CLINIC"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "CLINIC: the whole practice; PROVIDER: one or more staff; SEAT: one chair"
                    },
                    "startTime": {
                      "anyOf": [
                        {
                          "maxLength": 32,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "type": {
                      "anyOf": [
                        {
                          "enum": ["COURSE", "MEETING", "VACATION", "SICK", "HOLIDAY", "MAINTENANCE", "OTHER"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["allDay", "effect", "endTime", "scope", "startTime", "type"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "nextCursor": {
                "anyOf": [
                  {
                    "maxLength": 4096,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Cursor for the next page; null on the last page"
              }
            },
            "required": ["calendarEvents", "nextCursor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
