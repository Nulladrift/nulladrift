                      "type": "string"
                    },
                    "lastEditTime": {
                      "anyOf": [
                        {
                          "$ref": "#/properties/appointments/items/properties/startTime/anyOf/0"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "The version reschedule_appointment and cancel_appointment check"
