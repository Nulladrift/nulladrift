        {
          "name": "find_patient",
          "title": "Find a patient by name",
          "description": "Use this when someone names a patient to book, move, cancel or update, and the patient's id is needed. Returns up to 5 patients whose name holds every word given, with id, name, practice and edit time, plus the last two phone digits when two share a name. Not for listing, browsing or counting patients.",
