        {
          "name": "show_clinic_overview",
          "title": "Show dental practice overview",
          "description": "Use this when someone wants a quick overview or dashboard of one dental practice. Returns an overview card with the practice's details, appointment counts for the next 7 days, how many staff take bookings, open online-booking slots and up to 12 treatment prices (no patient or clinical data). Not for a single patient or appointment.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "clinicId": {
                "description": "Practice id: 24 lowercase hexadecimal characters",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              }
            },
            "required": ["clinicId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "appointmentCount": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "appointmentCountIsLowerBound": {
                "type": "boolean"
              },
              "availabilityDays": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "day": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["count", "day"],
                  "type": "object"
                },
                "maxItems": 7,
                "type": "array"
              },
              "availableDayCount": {
                "maximum": 7,
                "minimum": 0,
                "type": "integer"
              },
              "availableSlotCount": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "clinic": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "currency": {
                        "anyOf": [
                          {
                            "pattern": "^[A-Za-z]{3}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "defaultLocale": {
                        "anyOf": [
                          {
                            "pattern": "^[a-zA-Z]{2,3}([_-][a-zA-Z0-9]{2,8}){0,2}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "id": {
                        "anyOf": [
                          {
                            "pattern": "^[0-9a-f]{24}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "name": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "timezone": {
                        "anyOf": [
                          {
                            "maxLength": 64,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "required": ["currency", "defaultLocale", "id", "name", "timezone"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Administrative practice metadata; null when the practice was not found. The overview never includes individual appointment records, patient information, diagnoses, treatment details, notes or other clinical data."
              },
              "procedureCount": {
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "procedureCountIsLowerBound": {
                "type": "boolean"
              },
              "procedures": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "lastEditTime": {
                      "anyOf": [
                        {
                          "maxLength": 32,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "name": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "price": {
                      "anyOf": [
                        {
                          "maximum": 1000000000000000,
                          "minimum": -1000000000000000,
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["lastEditTime", "name", "price"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "providerCount": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "providerCountIsLowerBound": {
                "type": "boolean"
              },
              "scheduleDays": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "day": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["count", "day"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "scheduleRange": {
                "additionalProperties": false,
                "properties": {
                  "endTime": {
                    "maxLength": 32,
                    "type": "string"
                  },
                  "startTime": {
                    "maxLength": 32,
                    "type": "string"
                  }
                },
                "required": ["endTime", "startTime"],
                "type": "object"
              }
            },
            "required": ["appointmentCount", "appointmentCountIsLowerBound", "availabilityDays", "availableDayCount", "availableSlotCount", "clinic", "procedureCount", "procedureCountIsLowerBound", "procedures", "providerCount", "providerCountIsLowerBound", "scheduleDays", "scheduleRange"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show dental practice overview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://dododentist/clinic-overview-v2.html",
            "openai/toolInvocation/invoked": "DodoDentist clinic overview ready.",
            "openai/toolInvocation/invoking": "Loading DodoDentist clinic…",
            "securitySchemes": [
              {
                "scopes": ["dododentist:read"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://dododentist/clinic-overview-v2.html"
            },
            "ui/resourceUri": "ui://dododentist/clinic-overview-v2.html"
          },
          "digest": "sha256:fe846f91a2e26a1dfd0384f4784aaf3a98b3f350c18007a33ce4c3a1c8eb7338"
        },
        {
          "name": "update_patient",
          "title": "Update a patient's details",
          "description": "Use this when someone asks to change a patient's name, phone, email or language. Returns the patient's id, name, practice and which fields changed; contact details are never returned. Not for clinical records or adding a new patient.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "New email address.",
                "maxLength": 254,
                "type": "string"
              },
              "expectedLastEditTime": {
                "description": "The lastEditTime from find_patient. A patient changed since then is refused.",
                "format": "date-time",
                "maxLength": 40,
                "type": "string"
              },
              "language": {
                "description": "New language for their messages, as a code such as en or it.",
                "maxLength": 10,
                "type": "string"
              },
              "name": {
                "description": "New full name.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "patientId": {
                "description": "Id of the patient, from find_patient.",
                "maxLength": 24,
                "minLength": 24,
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "phone": {
                "description": "New mobile number, with the country code when known.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["expectedLastEditTime", "patientId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "changedFields": {
                "items": {
                  "enum": ["name", "phone", "email", "language"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "patient": {
                "additionalProperties": false,
                "properties": {
                  "clinicId": {
                    "anyOf": [
                      {
                        "maxLength": 24,
                        "minLength": 24,
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "id": {
                    "anyOf": [
                      {
                        "maxLength": 24,
                        "minLength": 24,
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "language": {
                    "anyOf": [
                      {
                        "maxLength": 16,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "lastEditTime": {
                    "anyOf": [
                      {
                        "maxLength": 40,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "name": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "required": ["clinicId", "id", "language", "lastEditTime", "name"],
                "type": "object"
              },
              "status": {
                "enum": ["updated"],
                "type": "string"
              }
            },
            "required": ["changedFields", "patient", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update a patient's details"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
