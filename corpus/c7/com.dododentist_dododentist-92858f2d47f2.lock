        {
          "name": "get_clinic_schedule_summary",
          "title": "Count appointments per day",
          "description": "Use this when someone asks how busy their dental practice is or how many appointments are booked each day. Returns appointment counts per UTC day for one practice, whatever their status, for the next 7 days by default and at most 31 days; counting stops at 100. Not for counting cancellations or seeing who is booked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clinicId": {
                "description": "Practice id: 24 lowercase hexadecimal characters",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "endTime": {
                "$ref": "#/properties/startTime",
                "description": "End of the range as an ISO 8601 date-time, after startTime and at most 31 days later; defaults to 7 days after the start"
              },
              "startTime": {
                "description": "Start of the range as an ISO 8601 date-time; defaults to now",
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["clinicId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appointmentCount": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "appointmentCountIsLowerBound": {
                "description": "True when more than 100 appointments fall in the range",
                "type": "boolean"
              },
              "days": {
                "description": "One row per UTC day that has appointments, canceled ones included, counting only appointments the signed-in account can view. Aggregate counts only: appointment identifiers and times, patient information, procedures, diagnoses and notes are never returned.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "appointmentCount": {
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "day": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["appointmentCount", "day"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "range": {
