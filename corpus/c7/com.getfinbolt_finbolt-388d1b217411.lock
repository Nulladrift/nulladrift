        {
          "name": "restatement_history",
          "description": "Figures that a later SEC filing changed: the value as first filed, the latest value, the change in percent, and\nwhich one get_fact gives you. Most changes are recasts (a new accounting rule, a reclassification or a\ndiscontinued business shown again on the new basis), not corrections of errors. amended: true marks a change\nfrom an amended filing. Covers the main lines of the income statement, balance sheet and cash flow statement for\nup to 8 years, or any line you name. Not listed: rounding, stock-split rebasing, a sign flipped by tagging, a\n1,000-times scale fix, and a full-year figure tagged with a quarter's value. 1 credit. The main lines checked\nare: revenue, total_revenues, total_net_revenue, cost_of_revenue, gross_profit, selling_general_admin,\nresearch_and_development, operating_income, interest_expense, net_interest_income, noninterest_income,\nnoninterest_expense, provision_for_credit_losses, premiums_earned, benefits_and_losses, net_investment_income,\npretax_income, income_tax, net_income, eps_basic, eps_diluted, diluted_shares_weighted, total_assets,\ntotal_liabilities, stockholders_equity, cash, long_term_debt, loans_net, deposits, operating_cash_flow,\ninvesting_cash_flow, financing_cash_flow, capital_expenditure, depreciation_amortization, dividends_paid,\nshare_repurchases.",
