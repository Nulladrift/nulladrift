        {
          "name": "financials",
          "description": "A financial statement from SEC filings, newest period first, every value traceable to its filing.\nQuarterly figures the company reported only year-to-date are derived (e.g. Q4 = FY - 9M) and marked;\nper-share values and share counts can't be derived that way and are null with reason not_derivable.\nA line the company tagged with its own element is null with reason custom_element. Common equity and the\nbook values from it are null with reason pending when a preferred issue or redemption follows the last\ntagged liquidation preference.\nEvery null carries a reason, in cell_notes or (when all of a row's nulls share it) on the row. Banks,\ninsurers and broker-dealers get not_applicable, with a reason, for lines they don't present (capex,\ncurrent assets, total debt for banks and brokers); banks get loans, allowance and deposits. Broker-dealers\nand asset managers get the bank layout under net_revenues, with compensation and the compensation ratio.\nBalance sheets include common equity, book value per share and net debt. A balance the period's own\nfiling didn't present is null, with any later comparative value in a note. A derived or fallback line equal to\nanother row in every column (total equity with no NCI) is named in same_as instead of shown, and a derived Q4\nwith the opposite sign to Q1-Q3 says so. Values are in units as filed. Values and earlier\nversions come only from financial statements (10-K, 10-Q, their amendments and transition reports,\n20-F, 40-F).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional date: the statement as it was on file then"
              },
              "company": {
                "description": "Ticker (e.g. 'AAPL') or SEC CIK",
                "type": "string"
              },
              "limit": {
                "default": 4,
                "description": "Number of periods, 1 to 8",
                "type": "integer"
              },
              "period_type": {
                "default": "annual",
                "description": "'annual' or 'quarterly'",
                "type": "string"
              },
              "statement": {
                "default": "income",
                "description": "'income', 'balance' or 'cashflow'",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": ["sourced"]
            }
