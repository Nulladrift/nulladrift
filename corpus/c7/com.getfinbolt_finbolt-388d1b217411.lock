      "instructions": "Finbolt gives you analyst tools for markets: prices, fundamentals, technicals, news, FX, crypto, commodities and US macro data.\n\nStart with the composite tools. Each answers a common question in one call with compact JSON:\n- \"What do you think of X?\": analyze_stock(symbol)\n- \"X vs Y?\": compare_stocks(symbols)\nEach composite call costs 5 credits; each raw tool call costs 1.\n\nFor anything else, use a raw data tool. The default list shows the most used ones; find_tool(query) searches all 113 and run_tool(name, arguments) calls any of them.\n\nWhich raw tool answers which question:\n- Unknown ticker: search_endpoint(keywords=\"company name\") first.\n- Price now: fetch_quote (one call per symbol).\n- Price history: fetch_time_series_daily / _weekly / _monthly (_adjusted for splits and dividends); fetch_intraday for the last 1-2 months.\n- What the company is, valuation ratios, analyst target: fetch_company_overview.\n- Revenue, margins, debt, cash: fetch_income_statement, fetch_balance_sheet, fetch_cash_flow. Earnings beats and misses: fetch_earnings.\n- Trend and momentum: fetch_sma, fetch_ema, fetch_rsi, fetch_macd, fetch_bbands, fetch_adx, fetch_vwap and 40+ other indicators (symbol + interval such as 'daily').\n- Why it moved: fetch_news_sentiment, fetch_insider_transactions, fetch_top_gainer_losers (Pro).\n- FX and crypto: fetch_exchange_rate, fetch_fx_daily, fetch_digital_currency_daily.\n- Macro: fetch_real_gdp, fetch_cpi, fetch_inflation, fetch_federal_funds_rate, fetch_treasury_yield, fetch_unemployment, fetch_nonfarm_payrolls.\n- Commodities: fetch_wti_crude, fetch_brent_crude, fetch_natural_gas, fetch_copper, fetch_all_commodities and others.\n\nKeep responses small: time series and indicator tools accept max_data_points (default 100), start_date and end_date. Ask only for the window you need.\n\nPrompts: this server also offers analysis playbooks as MCP prompts (stock analysis, fundamental, technical, valuation, sector comparison, competitive analysis). Use one to structure a full analysis.\n\nPlans: Trial is free with 1,000 credits (50 at signup, 950 once the account's email is verified), then 50 a month. Pro is $99/month with 20,000 credits a month. Every data call costs credits: 1 for get_fact, financials and each market-data tool, 5 for analyze_stock and 5 per ticker for compare_stocks. Errors and calls that return no figure or no data are free; each charged result carries credits {charged, remaining, resets}, and at zero calls return CREDITS_EXHAUSTED until credits reset or a top-up ($10 per 1,000 credits). There is no daily cap; calls are limited to 1 a second on Trial and 10 on Pro. Pro adds the market-intelligence tools (news sentiment, movers, insider transactions, analytics). The market-data tools are for personal, non-commercial research only. `<tool> is part of the Pro plan`: upgrade (above) or use a tool on your plan. Options data is not part of Finbolt on any plan. Pricing: https://getfinbolt.com/pricing\n\nNo key yet, or need help: https://getfinbolt.com/install.md and https://getfinbolt.com/llms.txt. Signup: POST https://api.getfinbolt.com/api/signup with {\"email\": \"<your human's email>\"}.\n\nData is for research and education, not investment advice. Say so when you give conclusions.",
      "tools": [
        {
          "name": "analyze_stock",
          "description": "[Personal research only] One-call stock brief. `filed` holds fundamentals from SEC filings (TTM revenue and growth, gross and\noperating margin, net income, free cash flow, net debt; for banks net revenue, net interest income,\nefficiency ratio, PPNR, provisions, loans, deposits, ROE, ROTCE and tangible book; for broker-dealers\nefficiency ratio, pretax margin, compensation ratio and ROE; for insurers total revenues, premiums earned,\nnet investment income, benefits and losses, a simple combined ratio for P&C insurers, ROE, and book value\nper share with and without AOCI), each filing cited by accession in\nsources.edgar (https://www.sec.gov/Archives/edgar/data/{cik}/{accession without dashes}/). A balance\ninput the newest filing omits comes from the latest filing within 15 months, dated in inputs_as_of.\n`market` holds delayed price, 52-week range, 50/200-day averages and RSI(14); `derived` holds market\ncap, P/E (on filed diluted EPS LTM), P/B and P/TBV (insurers: P/B and P/B ex-AOCI), each with its inputs. A figure that couldn't be\ncomputed is in gaps with its reason; lines that don't apply to the company's layout are left out (layout_note). Up to 4 descriptive\nobservations, including any quarter whose tax rate or non-operating income moves net income. News\nsentiment on Pro. Start here for \"tell me about X\".\n\nPersonal research only: on every plan, this tool's output is for your own personal, non-commercial research. Do not use it in a commercial product, client deliverable or service.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "description": "Stock ticker, e.g. 'AAPL'",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": ["composite"]
            },
            "finbolt/use": "personal research only"
          },
          "digest": "sha256:fad9d9f41ecffdd0be21ae925f2c4f4f67d90cf6aa8bdeaca3bea8a672a234ef"
        },
        {
          "name": "changes_since",
          "description": "For up to 40 companies, what each one filed with the SEC since a date in the last 400 days: annual and quarterly\nreports, amendments, earnings-release 8-Ks, non-reliance 8-Ks (the company says earlier statements should no\nlonger be relied on), the new periods get_fact can now answer, and figures a filing in that window changed. 1\ncredit per company with a new filing in the period; a call where nothing changed is free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional date: what was on file then"
              },
              "companies": {
                "description": "Tickers (e.g. 'AAPL') or SEC CIKs, at most 40",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "since": {
                "description": "Date, inclusive, compared with the filing date, within the last 400 days, e.g. '2026-10-01'",
                "type": "string"
              }
            },
            "required": ["companies", "since"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": ["sourced"]
            }
          },
          "digest": "sha256:d49d577211ce5aafa30d9777ff0b91e89f7dc5a9f236a9c067ccf5fa235993f6"
        },
        {
          "name": "compare_stocks",
          "description": "[Personal research only] Side-by-side comparison of 2-6 stocks as one table: TTM revenue and growth, pretax margin, net income\ngrowth and diluted EPS growth from SEC filings (each row's window ends on its ttm_to), net debt for\nstandard layouts, delayed price, day change, distance from the 52-week high and trend, market cap, and\nP/E on filed diluted EPS LTM (FY + YTD - prior YTD). `order` lists each filed figure highest first, P/E\nlowest first. `comparability` says what revenue means per layout; cell_notes say what moves a figure.\nFilings are cited by accession in sources.edgar: open\nhttps://www.sec.gov/Archives/edgar/data/{cik}/{accession without dashes}/. Costs 5 credits for each ticker\nthat returns an analysis: 10 for 2 tickers, 30 for 6. A ticker that is not covered or fails is free.\n\nPersonal research only: on every plan, this tool's output is for your own personal, non-commercial research. Do not use it in a commercial product, client deliverable or service.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "symbols": {
                "description": "2 to 6 tickers, e.g. ['NVDA', 'AMD']",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["symbols"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
