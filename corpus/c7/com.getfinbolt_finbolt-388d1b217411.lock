        {
          "name": "earnings_release",
          "description": "The quarterly earnings release from the company's 8-K, as the company printed it: headline figures (GAAP,\nnon-GAAP and operating measures) with period and scale, the company's guidance word for word, and beside each\nfigure the SEC-tagged figure for the same quarter and for the quarter before. matches_tagged says whether the\nprinted and tagged figures agree. Differences are shown, never reconciled, and nothing is merged into get_fact. A\nquarter just released has no tagged figure until its 10-Q or 10-K is filed. Set all_cells to true to get every\nfigure in the release that matches one of our line items. 1 credit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "all_cells": {
                "default": false,
                "description": "Leave false to get the headline figures and the guidance. Set true to get every figure in the release that matches one of our line items, which can be long.",
                "type": "boolean"
              },
              "company": {
                "description": "Ticker (e.g. 'AAPL') or SEC CIK",
                "type": "string"
              },
              "period": {
                "default": "latest",
                "description": "'latest', a fiscal quarter 'FY2026 Q3', the quarter's end date '2026-09-30', or the 8-K's accession number",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
