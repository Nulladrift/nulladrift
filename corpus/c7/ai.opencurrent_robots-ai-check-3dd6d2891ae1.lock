{
  "lockfileVersion": 2,
  "subjects": {
    "ai.opencurrent/robots-ai-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opencurrent.ai/mcp/robots"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "robots-ai-check",
        "title": "AI Crawler Permission Check",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Before fetching or crawling a site for AI use, check its robots.txt rules for AI crawlers and user-agents (GPTBot, ClaudeBot, Claude-User, PerplexityBot, Google-Extended, CCBot and more), following RFC 9309 matching. robots.txt is a stated preference; also respect the site's terms.",
      "tools": [
        {
          "name": "check_ai_crawlers",
          "title": "Which AI crawlers may fetch this site",
          "description": "For a domain (and optional path), whether each known AI crawler/agent user-agent is allowed by robots.txt, with the deciding rule.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "path": {
                "maxLength": 500,
                "type": "string"
              },
              "site": {
                "maxLength": 255,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agents": {
                "items": {
                  "properties": {
                    "agent": {
                      "type": "string"
                    },
                    "allowed": {
                      "type": "boolean"
                    }
                  },
                  "required": ["agent", "allowed"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["agents"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b6f9b758d5bd767c8f2c9dc0902d72d3f2cecb01221edc64b5b598b37bd48ba5"
        },
        {
          "name": "check_user_agent",
          "title": "Is this user-agent allowed on a path",
          "description": "Whether a given crawler user-agent token may fetch a path on a domain according to robots.txt.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "path": {
                "maxLength": 500,
                "type": "string"
              },
              "site": {
                "maxLength": 255,
                "minLength": 4,
                "type": "string"
              },
              "user_agent": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["site", "user_agent"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "allowed": {
                "type": "boolean"
              }
            },
            "required": ["allowed"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2478c13ae95401fc9ca33dccd37d1b5525908fbd0753b73891e21bc1ff8a5cd3"
        }
      ],
      "digest": "sha256:12d227bbe5edabf6f05b2beb2e56109904160f2bc8a02fa674346a1daf6e9bbe"
    }
  }
}
