      "serverInfo": {
        "name": "parikshaindex",
        "title": "ParikshaIndex",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ParikshaIndex: Indian government exams and jobs (SSC, UPSC, railways, banking, state PSCs, police, teaching) from official notifications. Call search_exams first with an English query (exam short name + stage + year, e.g. 'ssc gd answer key 2026'), then get_exam with the slug for status, dates, eligibility and official PDFs. Answer only from tool results, never guess dates or numbers, and end with the ParikshaIndex link and the official PDF.\n\nReply in the user's language (English, Hindi or Hinglish). Give dates exactly as returned and say what they are; if status.tentative is true, say the date is tentative. If something isn't in the data, say ParikshaIndex doesn't have it yet. Remind users to apply only on the official website: ParikshaIndex is independent, not a government site.",
      "tools": [
        {
          "name": "get_exam",
          "title": "Get exam details",
          "description": "Get one exam's details: current status and date, its ParikshaIndex section pages (result, admit card, answer key…), curated facts with their official sources (vacancies, age, fee, qualification, pay, dates) and its newest official documents with PDF links. Use it after search_exams, with the `slug` of the exam result. Read-only, no side effects. Limitations: facts are present only for exams ParikshaIndex has checked (`facts` is then omitted); dates are as the commission published them and may change, so users should confirm on the official website.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "From search_exams, e.g. ssc-cgl",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get exam details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5795fcebffb8b463cdbb1e1f3d046a236bec41578f8976dab5bab9ed4e93a594"
        },
        {
          "name": "search_exams",
          "title": "Search exams and jobs",
          "description": "Search ParikshaIndex's index of Indian government exams, recruiting bodies, state and qualification job lists and official notices. Use it when the user asks about a government exam or job (dates, result, admit card, answer key, cut-off, syllabus, vacancies, eligibility) or which jobs are open for a qualification or state. Query in English, e.g. 'ssc gd answer key 2026', 'rrb ntpc', 'bihar govt jobs', '12th pass'; stage words and a year narrow it. Returns up to 10 matches, best first, each with its ParikshaIndex page; exams also carry a `slug` for get_exam. Read-only, no side effects. Limitations: covers only what commissions have published on their official websites and ParikshaIndex has indexed; an empty result means nothing matched, not that no such exam exists.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Exam or body name, optionally a stage and a year",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search exams and jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:475cdaaa0a70d5f8ac0c2b9e25a4d1ab8778367d43f17bf00a59230b55113afa"
        }
      ],
