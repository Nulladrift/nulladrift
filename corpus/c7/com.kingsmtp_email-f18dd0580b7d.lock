  "subjects": {
    "com.kingsmtp/email": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kingmailer.org/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "kingsmtp",
        "title": "KingSMTP",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "KingSMTP is a privacy-first SMTP and email API service. Use these tools to manage the customer's sending domains, DNS records, usage, statistics, sent messages, suppressions, webhooks and inbound routes, and to send transactional email. KingSMTP is for transactional email only: never send bulk or marketing email. DNS records must be added at the customer's domain registrar. Docs: https://kingsmtp.com/kingmailer-api/",
      "tools": [
        {
          "name": "add_domain",
          "title": "Add domain",
          "description": "Add a sending domain to the account. Returns the DNS records that must be added at the domain registrar (ownership TXT, SPF, DKIM, return path).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name, for example example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add domain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:add8b1588d051d8ee17a4f55f6b9c551df20c1e2907eb283037ad0508951e0f7"
        },
        {
          "name": "add_route",
          "title": "Add inbound route",
          "description": "Forward incoming email for an address on a verified domain to an email address, an https URL or smtp://host:port. The domain MX record must point to KingSMTP. Paid plans only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "For example info@example.com",
                "type": "string"
              },
              "forward_to": {
                "description": "Email address, https URL or smtp://host:port",
                "type": "string"
              }
            },
            "required": ["address", "forward_to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add inbound route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:45fa7ce01718c8864488a756b9ad89b78a5007044913842c60370969a01e9bbe"
        },
        {
          "name": "add_suppression",
          "title": "Add suppression",
          "description": "Stop sending to an email address. Removing an address is only possible in the dashboard.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Email address",
                "type": "string"
              },
              "expires": {
                "description": "Default 30d",
                "enum": ["30d", "1y", "never"],
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
