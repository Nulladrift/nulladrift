  "subjects": {
    "com.kingsmtp/email": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kingmailer.org/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "kingsmtp",
        "title": "KingSMTP",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "KingSMTP is a privacy-first SMTP and email API service. Use these tools to manage the customer's sending domains, DNS records, usage, statistics, sent messages, suppressions, webhooks and inbound routes, and to send transactional email. KingSMTP is for transactional email only: never send bulk or marketing email. DNS records must be added at the customer's domain registrar. Docs: https://kingsmtp.com/kingmailer-api/",
      "tools": [
        {
          "name": "add_domain",
          "title": "Add domain",
          "description": "Add a new sending domain to the account. Returns the exact DNS records (ownership TXT, SPF, DKIM, return path) that must be created at the domain registrar before the domain can send. The domain is not usable until those records exist and verify_domain succeeds. Fails if the domain already exists or the plan domain limit is reached (check get_usage). Does not change DNS itself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name without protocol or path, for example example.com. Must be a domain on this account (see list_domains).",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add domain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:facaf7fadb9a8932404f1a1115b80e805a52e400e489fe9ea33052d220643a60"
        },
        {
          "name": "add_route",
          "title": "Add inbound route",
          "description": "Forward incoming email for an address on a verified domain of the account to an email address, an https URL (the email is POSTed as JSON) or an SMTP server (smtp://host:port). The domain MX record must point to KingSMTP for email to arrive (see get_domain). Returns the new route with its id. Paid plans only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Receiving address on an account domain, for example info@example.com, or *@example.com for all addresses.",
                "type": "string"
              },
              "forward_to": {
                "description": "Destination: an email address, an https:// URL or smtp://host:port.",
                "type": "string"
              }
            },
            "required": ["address", "forward_to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add inbound route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1cb93eb5314232d2301a59775db68877697e85e89a8832d9697e8af727cd3bcf"
        },
        {
          "name": "add_suppression",
          "title": "Add suppression",
          "description": "Add an email address to the suppression list so no email is sent to it, for example when a user asks to never receive email again. Returns the stored entry. Adding an address that is already suppressed is harmless. Removing an address is only possible by the account owner in the KingSMTP dashboard, not through this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "A single email address, for example user@example.com.",
                "type": "string"
              },
              "expires": {
                "description": "How long the suppression lasts: 30d (default), 1y or never.",
                "enum": ["30d", "1y", "never"],
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add suppression"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d0733f6bf8d5308f856d46b793bd27ebb9f6e9322ec9b644a6e13434ee86b208"
        },
        {
          "name": "add_webhook",
          "title": "Add webhook",
          "description": "Create a webhook: KingSMTP will POST a JSON event to this https URL whenever one of the chosen delivery events happens. Give either \"events\" (names from list_webhooks) or all_events=true. Returns the new webhook with its id. Paid plans only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "all_events": {
                "description": "Set true to receive every event type instead of a list.",
                "type": "boolean"
              },
              "events": {
                "description": "Event names to subscribe to, for example [\"MessageBounced\", \"MessageDeliveryFailed\"]. See list_webhooks.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "Public https:// URL that accepts POST requests.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add webhook"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4bd1223d83267ad79cb4f0c8abe0e1fbb9ba4cbb05031fd72672815c3c333179"
        },
