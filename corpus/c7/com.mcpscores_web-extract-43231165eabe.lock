{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpscores/web-extract": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://web-extract.bowling-anthony.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.mcpscores/web-extract",
        "title": "MCPFax Web Extract",
        "version": "1.0.1",
        "websiteUrl": "https://mcpscores.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "You have a URL and need what the page actually says, not its markup and not more than your context holds. Tool calls are x402-paid in USDC on Base: send the base64 X-PAYMENT header on this POST /mcp request (or params._meta['x402/payment']). read_page and page_links cost $0.008 each. An unpaid call returns a PaymentRequired result and settles nothing; initialize, ping and tools/list are free, as are request_data and demand_report. JavaScript is NOT executed, so a client-rendered page returns its shell and the character count will show that. A site that blocks automated clients is reported honestly and NOT charged.",
      "tools": [
        {
          "name": "demand_report",
          "title": "What agents are asking for most (free)",
          "description": "FREE, no payment. The aggregate of what agents have told us they are looking for, most-requested first, with the categories nothing available yet serves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Window in days, default 30, max 90.",
                "examples": ["30"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:461261ad42bf84d61377fdd16143b94cfa57291dcfeff96122da0471054405cb"
        },
        {
          "name": "page_links",
          "title": "Every link on a page",
          "description": "Every hyperlink on a page, resolved to absolute URLs, each with its anchor text and whether it stays on the same host. Use to crawl an index, find the real article behind a landing page, or enumerate a documentation table of contents before deciding what to read. Capped at 300 links. Costs $0.008 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Absolute http(s) URL of the page whose links you want.",
                "examples": ["https://blog.rust-lang.org"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bff2d983430d4f1d4a9627b27442d074aa0ffc3beb219fbfdff5330f756b3f6b"
        },
        {
          "name": "read_page",
          "title": "Read a web page as clean text",
          "description": "Fetch a URL and return its readable text with scripts, styles, navigation and markup stripped, plus the title, description, site name and publication date from the page's own metadata. Use whenever you need the contents of a page rather than a search result about it. Output is capped so it fits a prompt — raise maxChars if you need more. JavaScript is not executed, so a page that renders entirely client-side returns its shell, and the character count tells you when that happened. A site that blocks automated clients is reported honestly and is NOT charged. Costs $0.008 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "maxChars": {
                "description": "Maximum characters of text to return. Default 12000, maximum 60000.",
                "examples": ["12000"],
                "type": "string"
              },
              "url": {
                "description": "Absolute http(s) URL of the page to read.",
                "examples": ["https://en.wikipedia.org/wiki/Web_scraping"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0a302abd550fddf9901294b123d719c89b0d522b83c0843cf6539c39108f8a5d"
        },
        {
          "name": "request_data",
          "title": "Tell us what data you are looking for (free)",
          "description": "FREE, no payment. Describe in your own words the data you are trying to buy — anything, not just web pages — and get back whether we operate a service that supplies it, with the MCP endpoint if so. Every request is catalogued so repeatedly-requested data gets built. Nothing identifying is stored, only the words of the request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "need": {
                "description": "What you are looking for.",
                "examples": ["live electricity spot prices by ZIP"],
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:526ec6b328b276899db33ddafda1caece3bac10208ba8b99a2f8866a68c818db"
        }
      ],
      "digest": "sha256:3554481ebad9dcf240194cc49e6829f7ce996de6e579cab6d16448f4a60c7bcd"
    }
  }
}
