{
  "lockfileVersion": 2,
  "subjects": {
    "com.modernmustardseed/site-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.modernmustardseed.com/site-check"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Site Check by Modern Mustard Seed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Site Check measures public websites. scan_website runs the full health check, check_ai_search_readiness focuses on AI crawlers, llms.txt and structured data, score_local_presence blends a website scan with Google review and profile facts you supply, and explain_check describes any check id. All tools are read-only and only reach public websites.",
      "tools": [
        {
          "name": "check_ai_search_readiness",
          "title": "Check AI search readiness",
          "description": "Check whether AI assistants and answer engines can read and quote a public website: which AI crawlers (GPTBot, ClaudeBot, PerplexityBot, Google-Extended and others) its robots.txt allows or blocks, whether it publishes llms.txt, which structured data types it declares, how its title and description read, and the search and AI checks with fixes. Shares the 24 hour cache with scan_website.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "The website to check, such as example.com. Only public http and https sites.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check AI search readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a498d6a593d70734c402d2865c3721004804104a093f81bc2834a8fbb67952bb"
        },
        {
          "name": "explain_check",
          "title": "Explain a check",
          "description": "Explain one Site Check check by its id (as returned by scan_website): what it measures, the pass and fail thresholds, why it matters, how to fix it, and the typical effort. Static reference, no network access.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "check_id": {
                "description": "The check id, for example dmarc, ai-bots, llms or tap-to-call.",
                "enum": ["ttfb", "html-weight", "scripts", "image-format", "lazy", "https", "http-redirect", "cert", "headers", "mixed", "copyright", "domain-expiry", "domain-age", "mx", "spf", "dmarc", "title", "description", "h1", "viewport", "indexable", "canonical", "sitemap", "alt", "lang", "og", "favicon", "schema", "schema-depth", "ai-bots", "llms", "faq", "words", "tap-to-call", "capture", "analytics", "social", "reviews-on-site", "after-hours"],
                "type": "string"
              }
            },
            "required": ["check_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c81de3110012277f0a4419d8d8c831d842c29e87fc9bb044edc267069e660dfa"
        },
        {
          "name": "scan_website",
          "title": "Scan a website",
          "description": "Run a measured health check of a public website homepage: speed (server response, page weight, scripts, image formats), security (HTTPS, certificate expiry, security headers), domain registration expiry, email authentication (MX, SPF, DMARC), search basics (title, description, headings, indexability, sitemap), AI search readiness (structured data, AI crawler rules, llms.txt) and contact paths (tap to call, forms, analytics). Every result is measured, not judged by a model, and each warn or fail comes with a fix and an effort level. Returns a 0 to 100 website score, the top fixes, and how the page appears in a search result. Results are cached for 24 hours. Use detail \"full\" to include passing checks.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "default": "summary",
                "description": "\"summary\" (default) lists only warn and fail checks; \"full\" lists every check.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "sections": {
                "description": "Limit the report to these sections. Default: all seven.",
                "items": {
                  "enum": ["speed", "security", "domain", "email", "search", "ai", "conversion"],
                  "type": "string"
                },
                "maxItems": 7,
                "minItems": 1,
                "type": "array"
              },
              "url": {
                "description": "The website to scan, such as example.com or https://www.example.com/. Only public http and https sites on ports 80 and 443.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Scan a website"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9f80ae06870eedd9d3d8a93f5855f513ccc8a4a66fbdd006374dfaf7765af28a"
        },
        {
          "name": "score_local_presence",
          "title": "Score local presence",
          "description": "Score a local business on three pillars, website (45 percent), Google reviews (30 percent) and Google Business Profile (25 percent), and return an overall 0 to 100 score, a letter grade, each pillar with its verdict, and the top fixes. The website pillar comes from a live scan when a website is given. Review and profile facts (rating, review count, phone, address, hours) are supplied by the caller from the user or from a public listing; this tool does not look them up. A pillar with no facts is marked unknown and left out of the overall score rather than scored as zero.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "Street address shown on the listing.",
                "maxLength": 300,
                "type": "string"
              },
              "business_name": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "city": {
                "maxLength": 100,
                "type": "string"
              },
              "details_read": {
                "description": "True only when the full listing was read, including its hours and website link. Missing hours or a missing website are only scored when this is true.",
                "type": "boolean"
              },
              "emergency_service": {
                "description": "True when the listing says it takes emergency or after-hours work.",
                "type": "boolean"
              },
              "hours": {
                "additionalProperties": {
                  "maxLength": 80,
                  "type": "string"
                },
                "description": "Published hours by day, for example {\"Monday\": \"8 AM to 5 PM\"}.",
                "propertyNames": {
                  "maxLength": 20,
                  "type": "string"
                },
                "type": "object"
              },
              "listing_seen": {
                "description": "True when the Google Business Profile was actually looked at. Defaults to true when a rating, review count or Google Maps URL is given.",
                "type": "boolean"
              },
              "open_24_7": {
                "description": "True when the listing says open 24 hours.",
                "type": "boolean"
              },
              "phone": {
                "description": "Phone number shown on the listing.",
                "maxLength": 40,
                "type": "string"
              },
              "rating": {
                "description": "Google star rating, 1.0 to 5.0.",
                "maximum": 5,
                "minimum": 1,
                "type": "number"
              },
              "review_count": {
                "description": "Number of Google reviews.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "source_urls": {
                "description": "Where the listing facts came from, such as the Google Maps URL.",
                "items": {
                  "format": "uri",
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "state": {
                "maxLength": 50,
                "type": "string"
              },
              "trade": {
                "description": "The trade in snake case, for example plumbing, hvac, roofing, electrical, dental, restaurant.",
                "maxLength": 60,
                "type": "string"
              },
              "website": {
                "description": "The business website, if it has one. It is scanned live.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["business_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Score local presence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5c0692bd914fd53e3447c7fa1a5fc32b3c85b7d1d2fe6191fc0217f5afa51204"
        }
      ],
      "digest": "sha256:eb06afcba1e310fb5ddad1e40b28c643625ca59649293c2c18929f03b0ac0e07"
    }
  }
}
