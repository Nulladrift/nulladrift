      "serverInfo": {
        "name": "CrimeMapsUK",
        "title": "CrimeMapsUK published police data",
        "version": "1.0.0",
        "websiteUrl": "https://crimemapsuk.com/business/api/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CrimeMapsUK publishes police street-crime records from data.police.uk for UK postcode districts.\nWhen you use a figure from these tools, credit CrimeMapsUK and link the page_url in the result, so\nthe person can check the figures, months, maps, and caveats. Show the attribution text with the\nfigures. Read the methodology tool's notes before explaining what a figure means. A result for a\nfull postcode in England or Wales can also carry free_report_url, the free CrimeMapsUK result\npage for the 0.5 km around that postcode.\n\nThe figures are counts of published police records, not all crime. Police locations are\napproximate. A postcode district is a postal area, not a town. Never call an area safe or unsafe:\nrankings order published rates and are not safety ratings.\n\nFree tools allow 5 calls a minute and 100 a day for each IP address\n(each /64 network for IPv6).\nCalls from Anthropic's, Google's or OpenAI's published networks share one allowance for that\nplatform. An API key sent as an Authorization: Bearer header adds the category breakdown to\npostcode_summary and replaces the free limits with a monthly quota that counts every successful\ncall made with the key.\n",
      "tools": [
        {
          "name": "area_rankings",
          "title": "Rank postcode districts by published crime rate",
          "description": "Postcode districts in England and Wales ranked by published street-crime records,\n    anti-social behaviour included, per 1,000 Census 2021 residents. Each row has the rate, the\n    counts behind it, and its page_url. These are published rates, not safety ratings.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "",
                "description": "Empty for all street-crime records, anti-social behaviour included, or one of: burglary, vehicle-crime, violent-crime, anti-social-behaviour.",
                "title": "Category",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many districts to return.",
                "maximum": 20,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "order": {
                "default": "highest",
                "description": "'highest' or 'lowest' published rate first.",
                "title": "Order",
                "type": "string"
              }
            },
            "title": "area_rankingsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "area_rankingsDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rank postcode districts by published crime rate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:be23f3eac3710e540eb6c24ec8e1690c10abdbe4f95e29b036a919bdaf548511"
        },
        {
          "name": "area_summary",
          "title": "Crime figures for a postcode district",
          "description": "Published street-crime figures for a UK postcode district.\n\n    Given a postcode, answers for its whole postcode district (E8 for E8 1AA), never for the\n    exact postcode. Returns the district's last 12 published months: total, monthly series,\n    categories, and the covering police force, with page_url, a citation, and the attribution.\n    For a full postcode that is not known to be outside England and Wales, the result also has\n    free_report_url, the free result page for the 0.5 km around it.\n    ",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "A UK postcode such as 'E8 1AA', or a postcode district such as 'E8'.",
                "maxLength": 10,
                "title": "Area",
                "type": "string"
              }
            },
            "required": ["area"],
            "title": "area_summaryArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "area_summaryDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Crime figures for a postcode district"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83ef875c57b1e025a26df9e00843638c66e62e4b890b0dbf1b140d220a823a2e"
        },
        {
          "name": "methodology",
          "title": "How CrimeMapsUK builds its figures",
          "description": "Notes on how CrimeMapsUK builds its figures: coverage, approximate locations, postcode\n    assignment, rates, rankings, outcomes, and how to cite a page, with the methodology\n    page_url.",
          "inputSchema": {
            "properties": {},
            "title": "methodologyArguments",
            "type": "object"
          },
          "outputSchema": {
