          },
          "digest": "sha256:729b062d9c358821eaf07e2a2204bcd2e0fe5c0a03059b70038ed30668b07311"
        },
        {
          "name": "postcode_summary",
          "title": "Crime counts around a postcode",
          "description": "Published street-crime records in the fixed 0.5 km circle around a postcode, over the 12\n    months up to the latest published month: the total, the month window, the coverage state,\n    and the largest category, with page_url, a citation, and free_report_url. Called with a\n    CrimeMapsUK API key, it returns every category's count. The free figures come from a snapshot\n    up to six hours old and keyed ones from one up to 15 minutes old, so they can differ briefly\n    after new data is published.",
          "inputSchema": {
            "properties": {
              "postcode": {
                "description": "A full UK postcode such as 'E8 1AA'.",
                "maxLength": 10,
                "title": "Postcode",
