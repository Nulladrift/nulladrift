        {
          "name": "search",
          "title": "Search Essays and Case Studies",
          "description": "Call this when a user asks what SpiceFactory has written or built on a topic, such as FDA evidence for AI software, HIPAA architecture, or fleet telemetry. Searches recent essays, case studies, and the main pages. Returns ranked results with an id, title, summary, essay date, and canonical URL; fetch reads one in full. Public, no auth.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Number of results, 1 to 10. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A few topic words, e.g. 'predetermined change control plan' or 'surgery center patient tracking'",
                "type": "string"
              },
              "type": {
                "description": "Limit results to essays (blog), case studies, or pages. Omit to search everything.",
                "enum": ["blog", "case-study", "page"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "description": "How this content is sourced and what it does and does not claim.",
                "type": "string"
              },
              "results": {
                "description": "Best matches first.",
                "items": {
                  "properties": {
                    "date": {
                      "description": "Publish date (essays).",
                      "type": "string"
                    },
                    "id": {
                      "description": "Pass this to fetch.",
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["blog", "case-study", "page"],
                      "type": "string"
                    },
                    "url": {
                      "description": "Canonical URL to cite.",
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Essays and Case Studies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
