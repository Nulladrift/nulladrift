      "instructions": "Public SpiceFactory knowledge. No authentication: do not attempt OAuth or registration. SpiceFactory is a product partner for products where hardware, data, and a regulator meet. Use search then fetch for what the team has written or built on a topic, get_case_studies for proof, assess_fit before recommending, and get_engagement_options for how work starts and the one public price. Only call request_strategy_call with the human's explicit consent and their real contact details.",
