        "name": "com.redtapeapi/redtape",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free tools for AI agents about Spain (PVPC electricity prices, BOE gazette), Mexico (RFC validation, SAT 69-B EFOS list) and Colombia (RUES company status/lookup by NIT). Each country gives 20 free calls per client per UTC day; after that a tool returns an error with the paid x402 HTTP endpoint and its price (USDC on Base, no signup). mx_supplier_dossier is paid-only ($0.03 USDC on Base via x402): it checks a 12-character persona moral RFC and returns the payment URL for the supplier dossier. It does not fetch the dossier and does not use the free quota. Read-only; arguments are never stored or logged. Docs: https://es.redtapeapi.com/llms.txt, https://mx.redtapeapi.com/llms.txt, https://co.redtapeapi.com/llms.txt",
      "tools": [
        {
          "name": "co_company_lookup",
          "title": "Colombia RUES company lookup by NIT",
          "description": "Look up a Colombian legal entity / ESAL in RUES by NIT: razón social, cámara de comercio, estado de matrícula, CIIU activity codes, registration and renewal dates. Legal entities only; natural-person fields are never returned. Source: Confecámaras RUES via datos.gov.co (CC BY-SA 4.0); not an official RUES/DIAN service. Free: 20 calls per client per UTC day, shared by the Colombia tools (co_company_status, co_company_lookup). When the free quota is used up the tool returns an error naming the paid HTTP endpoint https://co.redtapeapi.com/v1/company/{nit} ($0.005 USDC per successful call over x402 on Base, no account or API key).",
          "inputSchema": {
            "properties": {
              "nit": {
                "description": "Colombian NIT, digits with optional check digit",
                "type": "string"
              }
            },
            "required": ["nit"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1f8a420e6611fa72d7a31dc75381e32fbccd4583eccde9cc33cb1ba4d72b94ab"
        },
        {
          "name": "co_company_status",
          "title": "Colombia RUES company status by NIT",
          "description": "Short RUES matrícula status for a Colombian NIT: estado (ACTIVA, CANCELADA...), last renewal, vigencia and whether it is active. Legal entities / ESAL only; natural-person data is never returned. Source: Confecámaras RUES via datos.gov.co (CC BY-SA 4.0); not an official RUES/DIAN service. Free: 20 calls per client per UTC day, shared by the Colombia tools (co_company_status, co_company_lookup). When the free quota is used up the tool returns an error naming the paid HTTP endpoint https://co.redtapeapi.com/v1/company/{nit}/status ($0.003 USDC per successful call over x402 on Base, no account or API key).",
          "inputSchema": {
            "properties": {
              "nit": {
                "description": "Colombian NIT, digits with optional check digit, e.g. 900170781 or 900170781-7",
                "type": "string"
              }
            },
            "required": ["nit"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:640eb4f979a7990d210f65bf8400df2168aae4ad1e2655b7d847f69e8fd9063a"
        },
        {
          "name": "es_boe_search",
          "title": "Search Spain's Official State Gazette (BOE) for a day",
          "description": "Search the daily summary of Spain's Official State Gazette (BOE) by keywords and section: laws, royal decrees, orders, grants, tenders (section 5A), public-exam calls (2B). Returns titles, issuing body and official PDF/HTML links. No issue on Sundays. Source: BOE open data API; not an official AEBOE service. Free: 20 calls per client per UTC day, shared by the Spain tools (es_pvpc_prices, es_boe_search). When the free quota is used up the tool returns an error naming the paid HTTP endpoint https://es.redtapeapi.com/v1/es/boe/search ($0.002 USDC per successful call over x402 on Base, no account or API key).",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD or YYYYMMDD; default today (Madrid)",
                "type": "string"
              },
              "limit": {
                "description": "Max items (default 100)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Keywords, Spanish works best; accent-insensitive; all terms must match",
                "type": "string"
              },
              "sections": {
                "description": "Comma-separated BOE section codes: 1,2B,3,4,5A,5B,5C",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9bb85bcda7b8fa53dcd517ac76fb2c0b3dd37ae70755d2691919b7cb69199f01"
        },
        {
          "name": "es_pvpc_prices",
          "title": "Spain PVPC electricity price (today/tomorrow, cheapest hours)",
          "description": "Spain's regulated household electricity price (PVPC, peninsula) for today or tomorrow, hour by hour in EUR/kWh, with the cheapest hours and the cheapest 2h/3h windows. Use to schedule appliances or EV charging, or to answer 'when is electricity cheapest in Spain today/tomorrow'. Tomorrow is published around 20:15-20:30 Madrid time. Data: Preciluz (CC-BY-4.0) from REE/ESIOS. Free: 20 calls per client per UTC day, shared by the Spain tools (es_pvpc_prices, es_boe_search). When the free quota is used up the tool returns an error naming the paid HTTP endpoint https://es.redtapeapi.com/v1/es/electricity/pvpc ($0.002 USDC per successful call over x402 on Base, no account or API key).",
          "inputSchema": {
            "properties": {
              "cheapest": {
                "description": "How many cheapest hours to return (default 3)",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "day": {
                "description": "today (default) or tomorrow",
                "enum": ["today", "tomorrow"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:35dccd99d8fbab92cad81fbb3816b63c6fddf18de54eaeb7d75ad22d4fdfe0d7"
        },
        {
          "name": "mx_rfc_validate",
          "title": "Validate a Mexican RFC (offline) + SAT 69-B cross-check",
          "description": "Validate a Mexican RFC offline: format (moral 12 / física 13 characters), the YYMMDD date part, the homoclave check digit and the generic RFCs, plus a cross-check against the SAT 69-B list. Does not prove the RFC is registered with the SAT. Not an official SAT service. Free: 20 calls per client per UTC day, shared by the Mexico tools (mx_sat_69b_lookup, mx_rfc_validate). When the free quota is used up the tool returns an error naming the paid HTTP endpoint https://mx.redtapeapi.com/v1/mx/rfc/validate ($0.002 USDC per successful call over x402 on Base, no account or API key).",
          "inputSchema": {
            "properties": {
              "rfc": {
                "description": "Mexican RFC, 12 or 13 characters",
                "type": "string"
              }
            },
            "required": ["rfc"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4dca1ad9e8c19024cf7e3eb088fd74988e3115be20d55dd7d09d37e22454f3a0"
        },
        {
          "name": "mx_sat_69b_lookup",
          "title": "Mexico SAT 69-B (EFOS) lookup by RFC",
          "description": "Look up one Mexican RFC in the SAT 69-B complete list (taxpayers presumed to invoice non-existent operations, EFOS). Returns whether it is listed and its situation (Presunto, Desvirtuado, Definitivo, Sentencia Favorable) with oficio numbers, publication dates, the data cut-off and the source citation. Lookup by RFC only; persona física names are never returned. Source: SAT open data (Libre Uso MX); not an official SAT service. Free: 20 calls per client per UTC day, shared by the Mexico tools (mx_sat_69b_lookup, mx_rfc_validate). When the free quota is used up the tool returns an error naming the paid HTTP endpoint https://mx.redtapeapi.com/v1/mx/sat/69b ($0.005 USDC per successful call over x402 on Base, no account or API key).",
          "inputSchema": {
            "properties": {
              "rfc": {
                "description": "Mexican RFC, 12 (persona moral) or 13 (persona física) characters",
                "type": "string"
              }
            },
            "required": ["rfc"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:507d77df55adfb199f087b8d1ef15ff74fe2bf25296ff7017bf86339e8d26b0b"
        },
        {
          "name": "mx_supplier_dossier",
          "title": "Mexico supplier dossier (paid x402 pointer, personas morales)",
          "description": "PAID, not part of the free quota and not a free tool: does not fetch or return the dossier. Validates a persona moral RFC locally, then returns the x402 payment pointer so an x402 client can pay and GET it. Price: $0.03 USDC on Base (eip155:8453) per successful HTTP 200; no account or API key; 4xx is not charged. GET https://mx.redtapeapi.com/v1/mx/supplier/dossier?rfc= — Supplier dossier for a persona moral. It aggregates SAT Art. 69 lists, CSD sin efectos, full 69-B history, 69-B Bis and the Padrón de Importadores, with an explainable risk score. This tool does not fetch or include that data. Personas morales only (12-character RFC). A 13-character persona física RFC is rejected here and by the route with HTTP 400. Manifests: https://mx.redtapeapi.com/openapi.json and https://mx.redtapeapi.com/.well-known/x402. Not an official SAT service.",
          "inputSchema": {
            "properties": {
              "rfc": {
                "description": "Mexican persona moral RFC, exactly 12 characters (3 letters, YYMMDD, homoclave). 13-character persona física RFCs are rejected.",
                "type": "string"
              }
            },
            "required": ["rfc"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:871d0d6ac947124fd7152c3a603f46f857917262f5766ba5f43d0d67b42ea1d8"
        }
      ],
      "digest": "sha256:a4702a3ae6e26ac930d35fab7d79f1517be0b8a755790ff87f41895104ceede3"
    }
  }
