{
  "lockfileVersion": 2,
  "subjects": {
    "com.invokera/currency-rates": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://invokera.com/r/currency-rates"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "invokera-currency-rates",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Tools for Currency Rates (ECB). Served by Invokera on behalf of api.frankfurter.dev.",
      "tools": [
        {
          "name": "get_currencies",
          "description": "List all supported currencies. Returns every supported ISO 4217 currency code with its full English name. Returns: Map of currency code to currency name..",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1ef5f183173c5fbeb61cf52bf97ed96696c80b7e4e97a18e7b8b58a1dba02672"
        },
        {
          "name": "get_historical_rates",
          "description": "Get exchange rates for a past date. Returns the ECB reference rates that were published on (or nearest before) the given date. Returns: Historical reference rates for the requested date..",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "base": {
                "description": "Base currency as an ISO 4217 code. Defaults to EUR.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "date": {
                "description": "Date in YYYY-MM-DD format, e.g. 2024-01-15.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "symbols": {
                "description": "Comma-separated ISO 4217 codes to limit the response to.",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bd89266ad7525bc41eab64343ff177ea62839b4874b359aeaea48069babbc7a9"
        },
        {
          "name": "get_latest_rates",
          "description": "Get the latest exchange rates. Returns the most recent ECB reference rates. The base currency defaults to EUR unless \"base\" is given. Returns: Latest reference rates keyed by currency code..",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "base": {
                "description": "Base currency as an ISO 4217 code, e.g. USD or EUR. Defaults to EUR.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "symbols": {
                "description": "Comma-separated ISO 4217 codes to limit the response to, e.g. \"CNY,JPY,GBP\". Omit to get all currencies.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f5e724cf793d0b47b064e73711e9c5c17e022a9661f5c97ef35e0e1bfe2fdb05"
        }
      ],
      "digest": "sha256:39d79fc6c92696279eb6baa34c9c647a665e21ccd5154dfa08dd7b7bbaf9a434"
    }
  }
}
