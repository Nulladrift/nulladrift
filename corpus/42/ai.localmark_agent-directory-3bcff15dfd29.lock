{
  "lockfileVersion": 2,
  "subjects": {
    "ai.localmark/agent-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://localmark.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "LocalMark Agent Directory",
        "version": "1.2.0",
        "websiteUrl": "https://localmark.ai/for-agents"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Find and compare publicly advertised A2A agents using recommend_agents for capability matching, requirements, reasons and caveats. Public results include repair_links to the canonical agent repair guide, publisher report and JSON/CSV diagnostics. Reading those links uses stored evidence; it does not probe agents, request email or authorize tasks. Listings reflect stored card reachability and provider-declared skills; LocalMark does not test task execution or certify providers. Optional contribution details: https://localmark.ai/support. Payment requires your operator's authorization and never affects directory access or rankings.",
      "tools": [
        {
          "name": "get_agent",
          "description": "Get a full public agent record by LocalMark ID, including original card and complete stored evidence. Collection previews are compact; this explicit detail tool is not truncated.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "title": "Agent Id",
                "type": "integer"
              }
            },
            "required": ["agent_id"],
            "title": "get_agentArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4402d8c2ae5a96bfcdaab1deb740b6835554c3cf7040bac655eb19986271c3c3"
        },
        {
          "name": "get_connection_plan",
          "description": "Read connection metadata for a public agent without connecting to it.\n\n    Accepts a LocalMark agent ID, Agent Card URL, endpoint URL or domain.\n    Returns advertised interfaces, authentication scheme metadata, input/output\n    modes, skill names and stored evidence. A publisher domain may be\n    ambiguous. The plan never includes credentials and never authorizes a task\n    or payment. Obtain explicit task authorization before using any endpoint.\n    ",
          "inputSchema": {
            "properties": {
              "target": {
                "title": "Target",
                "type": "string"
              }
            },
            "required": ["target"],
            "title": "get_connection_planArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b2f856beb30818dd425df089c4ce3746c03f79580149088e4bc772c2b19cbdab"
        },
        {
          "name": "list_agents",
          "description": "Browse public agents with pagination and repair_links to read-only publisher diagnostics.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "title": "Offset",
                "type": "integer"
              }
            },
            "title": "list_agentsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9ff87832a201f8d6767264304d94ec6fc4462b139254acd6b45c9b42e4872a5c"
        },
        {
          "name": "recommend_agents",
          "description": "Recommend agents for a capability or job with matching reasons and caveats.\n\n    Uses exactly the website/API ranking and stored observations, never a live\n    task. Filters are requirements, so an empty shortlist is valid. auth is\n    'none' or 'declared'; signature is 'verified'; protocol is JSONRPC,\n    HTTP+JSON or GRPC. a2a_confirmed requires the latest current-endpoint\n    read-only probe to confirm A2A; it does not prove task quality or safety.\n    Observation age is 1..168 hours. max_amount is a\n    non-negative amount in human-readable asset units (0.05 means 0.05 USDC\n    for a USDC asset) and requires both network and asset with known decimals.\n    No price conversion across assets is performed. Returns compact structured\n    results (4 KiB per record), total_matches, pagination, ranking_version and\n    evidence scope. Use full_record_url or get_agent for full stored details.\n    ",
          "inputSchema": {
            "properties": {
              "a2a_confirmed": {
                "default": false,
                "title": "A2A Confirmed",
                "type": "boolean"
              },
              "a2a_response_within_hours": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "A2A Response Within Hours"
              },
              "asset": {
                "default": "",
                "title": "Asset",
                "type": "string"
              },
              "auth": {
                "default": "",
                "title": "Auth",
                "type": "string"
              },
              "checked_within_hours": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Checked Within Hours"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "max_amount": {
                "default": "",
                "title": "Max Amount",
                "type": "string"
              },
              "network": {
                "default": "",
                "title": "Network",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "title": "Offset",
                "type": "integer"
              },
              "protocol": {
                "default": "",
                "title": "Protocol",
                "type": "string"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "signature": {
                "default": "",
                "title": "Signature",
                "type": "string"
              },
              "tls_reachable": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Tls Reachable"
              }
            },
            "required": ["query"],
            "title": "recommend_agentsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2b7e9f8221714cbd11a2a7258fa925a0a46d29b100f1878c6c117ca3823887aa"
        },
        {
          "name": "search_agents",
          "description": "Search public agent names, descriptions and skills. Returns profile/card URLs and repair_links to stored publisher diagnostics; no task or probe is run.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_agentsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7c5d94d72640612185fe46b177e3446228bc79c19f087afdc0d7462095b15acc"
        },
        {
          "name": "verify_agent",
          "description": "Read stored checks for a card URL, endpoint URL or publisher domain.\n\n    Unseen targets return listing_status 'not_seen', including available\n    lookalike-domain hints. Publisher domains may return multiple matches.\n    No live request is made to the publisher.\n    ",
          "inputSchema": {
            "properties": {
              "card_url": {
                "title": "Card Url",
                "type": "string"
              }
            },
            "required": ["card_url"],
            "title": "verify_agentArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:96302f57a02e7a3e01073cfa5f6761824368a880446d81964e6c73a1048da7d8"
        }
      ],
      "digest": "sha256:3bae4e7984eddb52a0c73e4d8abf8cafcffac46831e11447d5ea5870d9c33a47"
    }
  }
}
