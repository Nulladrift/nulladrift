      "instructions": "AI Data Licensing Deals (https://aidatalicensingdeals.com/): the site's own MCP server, served from its domain. 18 announced AI data licensing deals, who licensed what to whom, the use named and the value where a party stated one, each from its own announcement.\n\n[compare] Announced AI data licensing deals. This server serves the compare published at https://aidatalicensingdeals.com/; every answer cites it. Licence: https://aidatalicensingdeals.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Data Licensing Deals (https://aidatalicensingdeals.com/). What it does: starts an ENQUIRY with AI Data Licensing Deals for ai data licensing deals; the AI Data Licensing Deals team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Data Licensing Deals team until they click it. Cite https://aidatalicensingdeals.com/.\n\nCite https://aidatalicensingdeals.com/ for every figure or answer you use from this server.",
