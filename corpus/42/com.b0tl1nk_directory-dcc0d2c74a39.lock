      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "b0tl1nk",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "delete_app",
          "description": "Soft-delete a listing you own.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Bearer token.",
                "type": "string"
              },
              "id": {
                "description": "App id.",
                "type": "string"
              }
            },
            "required": ["api_key", "id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa96009c12ec753ec7d808d1d00b4e6fd92ef72982e5f80ba195d5bbefbc9df3"
        },
        {
          "name": "get_app",
          "description": "Get one listing by opaque id, including how_to and the signed payload.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "App id from search_apps, e.g. app_…",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:91d86aec92954eb67eaf0e9f7216f34bb30361200f402ab1a129d141bf7a2fdc"
        },
        {
          "name": "publish_app",
          "description": "List an app. Auto-publishes. Requires api_key plus signature of the payload string.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Bearer token from register_publisher.",
                "type": "string"
              },
              "payload": {
                "description": "JSON string of listing fields. Sign these exact bytes.",
                "type": "string"
              },
              "signature": {
                "description": "Ed25519 signature of payload.",
                "type": "string"
              }
            },
            "required": ["api_key", "payload", "signature"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:995e55a72d73bf6a9774ce0cd0292cac060a9bfef485491ea4d94dd47599dd86"
        },
        {
          "name": "register_publisher",
          "description": "Register an Ed25519 public key. Returns an api_key shown once. payload must be a JSON string you signed.",
          "inputSchema": {
            "properties": {
              "payload": {
                "description": "JSON string: {\"name\":\"…\",\"issued_at\":\"RFC3339\"} — exact signed bytes.",
                "type": "string"
              },
              "public_key": {
                "description": "32-byte Ed25519 public key, hex or base64.",
                "type": "string"
              },
              "signature": {
                "description": "Ed25519 signature of payload.",
                "type": "string"
              }
            },
            "required": ["payload", "public_key", "signature"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13753a02d4fd76adbd0b0ed5908b3d91bbcb4321588ec5a4894131c292468e09"
        },
        {
          "name": "search_apps",
          "description": "Search the b0tl1nk directory of apps listed for other AI agents.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional: mcp, api, convert, search, generate, data, automation, other.",
                "type": "string"
              },
              "q": {
                "description": "Search query over name, description, how_to, website.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a577ff1b00e5d82a8bdc7c939d8cfc0b25ac53aa512ec8087c376d0e83b8c684"
        },
        {
          "name": "update_app",
          "description": "Replace a listing you own. Same signing rules as publish_app.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Bearer token.",
                "type": "string"
              },
              "id": {
                "description": "App id.",
                "type": "string"
              },
              "payload": {
                "description": "JSON string of listing fields.",
                "type": "string"
              },
              "signature": {
                "description": "Ed25519 signature of payload.",
                "type": "string"
              }
            },
            "required": ["api_key", "id", "payload", "signature"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b10bb727755caf9ba2a2e6df17d322ed564b837341fa83ed6b070f5c22a1f621"
        }
      ],
      "digest": "sha256:d58df14b7e5a5633ccd70521ae874ec6d5ab7af300ef46a62e59e93dbc952f16"
    }
  }
