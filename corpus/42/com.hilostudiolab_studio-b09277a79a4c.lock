        {
          "name": "hilo_recommend",
          "title": "Guided contact: what fits",
          "description": "Hilo Studio's guided contact, in the chat: the same three one-tap questions the website asks (goal, what's holding them back, timing). Call it with whatever the user has answered so far (all optional). It returns the next question with its options or, once all are answered, what fits, its starting price, when they'd have it and a related case. Ask ONE question at a time with its options, in the user's language; never answer for the user. Then you may ask whether the price fits (price_fit). No personal data needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the answer: 'en' (English) or 'es' (Spanish). Use the user's language.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "objective": {
                "description": "What the user wants to achieve (question 1).",
                "enum": ["web", "herramienta", "todo", "nose"],
                "type": "string"
              },
              "price_fit": {
                "description": "Optional: after seeing the recommended price, whether it fits what they had in mind.",
                "enum": ["si", "justo", "hablar"],
                "type": "string"
              },
              "situation": {
                "description": "What's holding them back today (question 2; the valid options depend on the objective, hilo_recommend lists them).",
                "enum": ["no-escriben", "no-cualificados", "presupuestos", "anticuada", "igual", "cero"],
                "type": "string"
              },
              "timing": {
                "description": "When they need it (question 3).",
                "enum": ["este-mes", "trimestre", "despues", "sin-fecha"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:90af959d4bdb44ad8014706b3af9fbbfabb4251648dc1b93d18a488d34fd102f"
        },
        {
          "name": "hilo_request_quote",
          "title": "Request a quote",
          "description": "Sends a project enquiry to Hilo Studio on behalf of the user (it reaches the team by email; they reply within 24 h and the user gets a confirmation email). ONLY call this after the user has explicitly confirmed they want to contact the studio and has given their name and email. Never invent contact details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "budget": {
                "description": "Budget range, if the user mentioned one.",
                "maxLength": 120,
                "type": "string"
              },
              "company": {
                "description": "Company or brand, if given.",
                "maxLength": 200,
                "type": "string"
              },
              "deadline": {
                "description": "Desired timing or deadline, if mentioned.",
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "description": "The user's email, where the studio will reply.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "interest": {
                "default": "unsure",
                "description": "Package of interest if the user picked one (from hilo_get_pricing), 'custom' for bespoke work, or 'unsure'.",
                "enum": ["NAVEGAR", "EXPLORAR", "IMPACTAR", "custom", "unsure"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the user: the confirmation email goes out in it.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "name": {
                "description": "The user's name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "objective": {
                "description": "What the user wants to achieve (question 1).",
                "enum": ["web", "herramienta", "todo", "nose"],
                "type": "string"
              },
              "price_fit": {
                "description": "Optional: after seeing the recommended price, whether it fits what they had in mind.",
                "enum": ["si", "justo", "hablar"],
                "type": "string"
              },
              "project": {
                "description": "What they need: goals, context, what it's for. Use the user's own words.",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              },
              "situation": {
                "description": "What's holding them back today (question 2; the valid options depend on the objective, hilo_recommend lists them).",
                "enum": ["no-escriben", "no-cualificados", "presupuestos", "anticuada", "igual", "cero"],
                "type": "string"
              },
              "timing": {
                "description": "When they need it (question 3).",
                "enum": ["este-mes", "trimestre", "despues", "sin-fecha"],
                "type": "string"
              },
              "user_confirmed": {
                "const": true,
                "description": "Must be true: the user explicitly agreed to send these details to Hilo Studio.",
                "type": "boolean"
              }
            },
            "required": ["email", "name", "project", "user_confirmed"],
            "type": "object"
          },
