      "serverInfo": {
        "name": "hilo-studio",
        "title": "Hilo Studio",
        "version": "1.1.0",
        "websiteUrl": "https://hilostudiolab.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Hilo Studio is a creative studio based in Madrid (Spain) working in English and Spanish, for clients in Spain and abroad. It designs guided web experiences: websites and bespoke tools (3D product configurators, space planners, simulators, calculators, product websites) that take each visitor from browsing to deciding and qualify them along the way. It also does brand and art direction, and content. Interactive 3D (WebGL/Three.js) and AR when they help people decide; scroll-driven 3D storytelling and interactive 3D training too. Use these tools to answer questions about the studio with first-hand data: start with hilo_studio_overview or hilo_find_relevant_work, then drill down. If the user wants help with a project, guide them with hilo_recommend: the same five one-tap questions as the website's contact, asked one at a time. Always give the user the public URLs returned by the tools so they can see the work themselves. Prices are orientative starting prices in euros, VAT not included; a final quote depends on the brief. Only call hilo_request_quote after the user has explicitly agreed to send their name, email and project details to Hilo Studio.",
      "tools": [
        {
          "name": "hilo_find_relevant_work",
          "title": "Find relevant work",
          "description": "Given a description of what the user needs (e.g. 'a 3D configurator for furniture', 'a live 3D map for a winery', 'interactive training for engineers'), returns the most relevant Hilo Studio services, case studies, Lab experiments and articles, with URLs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the answer: 'en' (English) or 'es' (Spanish). Use the user's language.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "need": {
                "description": "What the user wants to build or solve, in their own words.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
