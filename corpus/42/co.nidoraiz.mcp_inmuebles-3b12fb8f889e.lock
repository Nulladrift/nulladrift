        {
          "name": "calcular_financiacion",
          "title": "Calcular la cuota de un crédito hipotecario",
          "description": "Calcula la cuota mensual, el monto financiable y la cuota inicial de un crédito hipotecario en Colombia, por amortización francesa y con tasa efectiva anual. Es una estimación ilustrativa, no una oferta de crédito.",
