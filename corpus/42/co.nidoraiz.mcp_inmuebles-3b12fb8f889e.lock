        {
          "name": "agendar_visita",
          "title": "Solicitar una visita a un inmueble",
          "description": "Registra una solicitud de visita a un inmueble y comparte los datos de contacto de la persona con la inmobiliaria dueña, que la llamará para coordinar. SÓLO se puede llamar cuando la persona ha dado su nombre y su teléfono y ha dicho explícitamente que quiere que la contacten. No inventes ni supongas datos de contacto.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "codigo": {
                "description": "El \"codigo\" del inmueble que se quiere visitar",
                "type": "string"
              },
              "consentimiento": {
                "description": "true sólo si la persona dijo explícitamente que autoriza que la inmobiliaria la contacte con estos datos",
                "type": "boolean"
              },
              "correo": {
                "description": "Correo, si lo dio",
                "type": "string"
              },
              "fechaPreferida": {
                "description": "Cuándo le queda bien. Texto libre: \"el sábado por la mañana\"",
                "type": "string"
              },
              "nombre": {
                "description": "Nombre de la persona interesada",
                "minLength": 2,
                "type": "string"
              },
              "telefono": {
                "description": "Teléfono de contacto, tal como lo dio la persona",
                "minLength": 7,
                "type": "string"
              }
            },
            "required": ["codigo", "consentimiento", "nombre", "telefono"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "inmobiliaria": {
                "type": ["string", "null"]
              },
              "mensaje": {
                "type": "string"
              },
              "registrada": {
                "type": "boolean"
              }
            },
            "required": ["inmobiliaria", "mensaje", "registrada"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Solicitar una visita a un inmueble"
          },
