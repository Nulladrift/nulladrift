        {
          "name": "buscar_inmuebles",
          "title": "Buscar inmuebles en Colombia",
          "description": "Busca vivienda en venta o arriendo publicada por inmobiliarias colombianas: apartamentos, casas, fincas, lotes y locales. Los límites de precio son en COP y excluyen otras monedas o moneda desconocida, sin convertir divisas. Con negocio rent limita el canon mensual; sin negocio compara el campo de precio y no restringe la operación. Devuelve el total real de coincidencias y la URL de cada ficha.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "alcobas": {
                "description": "Alcobas mínimas",
                "type": "number"
              },
              "areaMin": {
                "description": "Área construida mínima en m²",
                "type": "number"
              },
              "banos": {
                "description": "Número mínimo de baños que debe tener el inmueble",
                "type": "number"
              },
              "barrio": {
                "description": "Barrio o sector",
                "type": "string"
              },
              "cursor": {
                "description": "Para la página siguiente: el \"cursorSiguiente\" de la respuesta anterior, sin cambiar los demás filtros",
                "type": "string"
              },
              "estrato": {
                "description": "Estrato socioeconómico colombiano, de 1 a 6. Indica el nivel del sector y determina el costo de los servicios públicos",
                "maximum": 6,
                "minimum": 1,
                "type": "number"
              },
              "limite": {
                "description": "Resultados por página. Por defecto 8, máximo 20",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              },
              "municipio": {
                "description": "Municipio o ciudad. Ej: \"Medellín\", \"Envigado\", \"Bogotá\", \"Sabaneta\"",
                "type": "string"
              },
              "negocio": {
                "description": "sale = venta, rent = arriendo; cada opción incluye los inmuebles ofrecidos en ambas modalidades (sale_rent)",
                "enum": ["sale", "rent"],
                "type": "string"
              },
              "precioMax": {
                "description": "Límite positivo en COP. Con negocio rent es el canon mensual; con sale o sin negocio es el campo de precio. 400 millones se escribe 400000000",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "precioMin": {
                "description": "Límite positivo en COP. Con negocio rent es el canon mensual; con sale o sin negocio es el campo de precio. 400 millones se escribe 400000000",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "q": {
                "description": "Texto libre cuando no se sabe si es ciudad, barrio o dirección",
                "type": "string"
              },
              "tipo": {
                "description": "Tipo de inmueble. lot es lote urbano, land es terreno rural, local es local comercial",
                "enum": ["apartment", "apartment_studio", "house", "farm", "lot", "land", "warehouse", "local", "office"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cursorSiguiente": {
                "type": ["string", "null"]
              },
              "devueltos": {
                "type": "number"
              },
              "nota": {
                "type": "string"
              },
              "resultados": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "alcobas": {
                      "type": ["number", "null"]
                    },
                    "area": {
