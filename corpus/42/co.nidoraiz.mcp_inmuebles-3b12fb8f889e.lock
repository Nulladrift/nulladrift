            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "anios": {
                "description": "Plazo del crédito en años. Por defecto 15, que es lo habitual en Colombia",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              },
              "cuotaInicialPct": {
                "description": "Porcentaje de cuota inicial. Por defecto 30",
                "maximum": 90,
                "minimum": 0,
                "type": "number"
              },
              "precio": {
                "description": "Precio del inmueble en pesos colombianos",
                "exclusiveMinimum": 0,
