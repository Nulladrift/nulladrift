              },
              "tasaEaPct": {
                "description": "Tasa efectiva anual en porcentaje. Por defecto 13",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["precio"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
