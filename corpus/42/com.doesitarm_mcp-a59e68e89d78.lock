              "status": {
                "description": "Filter by reported status. native means native support, rosetta means Rosetta 2, no means unsupported, no-in-progress means support is in progress, and unreported means native support has yet to be reported. Omit to include any status.",
                "enum": ["native", "rosetta", "no", "no-in-progress", "unreported"],
