      "serverInfo": {
        "name": "com.doesitarm/mcp",
        "title": "Does It ARM",
        "version": "1.4.1",
        "description": "Check Apple Silicon compatibility for Mac apps, games, and Homebrew formulae.",
        "websiteUrl": "https://doesitarm.com",
        "icons": [
          {
            "src": "https://doesitarm.com/images/mcp-icon-256.png",
            "mimeType": "image/png",
            "sizes": ["256x256"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Does It ARM is a read-only catalog of reported Apple Silicon compatibility for Mac apps, games, and Homebrew formulae, with reference pages for Mac models. Results link to the relevant catalog pages when available. A missing listing means compatibility is unknown from this catalog. Unreported means native support has yet to be reported.",
      "tools": [
        {
          "name": "check_apps",
          "title": "Compare Apple Silicon Compatibility",
          "description": "Check reported Apple Silicon compatibility for up to 50 software names in one call, including lists for a Mac migration. Returns the best Does It ARM catalog match, reported status, and listing link for each distinct name. Names without a sufficiently close match are marked as not listed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "default": "all",
                "description": "Limit results to app (Mac app), game, or homebrew (formula). Defaults to all, which covers all three.",
                "enum": ["app", "game", "homebrew", "all"],
                "type": "string"
              },
              "names": {
                "description": "One to 50 software names, one per array item, such as Spotify or Docker. Blank entries are skipped and identical trimmed names are checked once.",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "counts": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Number of names per reported status, plus not-listed.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "results": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "closest": {
                      "description": "Up to two closest listing names when found is false.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "description": {
                      "description": "Device description. Only on device listings.",
                      "type": "string"
                    },
                    "found": {
                      "type": "boolean"
                    },
                    "kind": {
                      "description": "Listing kind: app (Mac app), game, homebrew (formula) or device (Mac model).",
                      "type": "string"
                    },
                    "lastUpdated": {
                      "description": "Date of the last listing update, when the source has one.",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "query": {
                      "description": "The name as checked, trimmed.",
                      "type": "string"
                    },
                    "status": {
                      "description": "Reported status: native, rosetta, no (unsupported), no-in-progress (support in progress) or unreported (native support not yet reported). Null when the source has none.",
                      "type": ["string", "null"]
                    },
                    "statusText": {
                      "description": "Status headline shown on the listing page.",
                      "type": "string"
                    },
                    "url": {
                      "description": "Canonical doesitarm.com page for this listing.",
                      "type": "string"
                    }
                  },
                  "required": ["found", "query"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["counts", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare Apple Silicon Compatibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b4cf75f5bf4d91b11839f8176595b425056e0ea33a3795f4b65b1f06cbfe0532"
        },
        {
          "name": "check_inventory",
          "title": "Check Mac App Inventory for Apple Silicon",
          "description": "Check Apple Silicon compatibility for installed Mac apps from Jamf Pro, Iru Prism, Intune, Fleet, JumpCloud, MunkiReport, or system_profiler exports, or from up to 250 app-only rows. Raw exports are grouped by app, version and build and return device counts where available. Results include paged verdicts and evidence from version-scoped catalog statements and the ten most recent scanned versions per bundle ID. Name-only matches remain unknown and include a catalog hint where available.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "catalog_revision": {
                "description": "catalog_revision from the first page. A changed catalog returns an error so pages are not mixed across revisions.",
                "maxLength": 128,
                "type": "string"
              },
              "csv": {
                "description": "Delimited export text. Recognized raw formats support 1 MiB and 5000 rows. App-only CSV or TSV supports 250 rows and 64 KiB. Mutually exclusive with rows and json.",
                "maxLength": 1048576,
                "type": "string"
              },
              "filter": {
                "default": "all",
                "description": "Return only rows with this status. Defaults to all. Counts always cover the whole batch.",
                "enum": ["all", "native", "rosetta", "unsupported", "unknown"],
                "type": "string"
              },
              "format": {
                "description": "Raw export profile for csv or json. Omission enables detection from the export headers or JSON shape.",
                "enum": ["jamf-pro-applications", "jamf-pro-inventory", "iru-prism-apps", "intune-discovered-apps", "fleet-csv", "jumpcloud-system-app", "munkireport-applications", "system-profiler-json"],
                "type": "string"
              },
              "json": {
                "anyOf": [
                  {
                    "maxLength": 1048576,
                    "type": "string"
                  },
                  {
                    "additionalProperties": {},
                    "properties": {},
                    "type": "object"
                  },
                  {
                    "items": {},
                    "type": "array"
                  }
                ],
                "description": "Jamf Pro inventory or system_profiler export as JSON text, an object, or an array. Maximum 1 MiB and 5000 rows. Mutually exclusive with rows and csv."
              },
              "limit": {
                "default": 20,
                "description": "Maximum rows per page, from 1 to 50. Defaults to 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of filtered unique rows to skip. Defaults to 0. Maximum 249 for app-only input and 4999 for raw exports. next_offset refers to the same input, target_macos, filter and catalog_revision.",
                "maximum": 4999,
                "minimum": 0,
                "type": "integer"
              },
              "rows": {
                "description": "App-only input, 1 to 250 rows with a nonblank name or bundle_id. Mutually exclusive with csv and json.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "build": {
                      "description": "Installed CFBundleVersion, as a string. Up to 80 characters after trimming; longer values mark the row invalid.",
                      "type": "string"
                    },
                    "bundle_id": {
                      "description": "CFBundleIdentifier, such as com.tinyspeck.slackmacgap. Matched before the name. Up to 255 characters after trimming; longer values mark the row invalid.",
                      "type": "string"
                    },
                    "name": {
                      "description": "App name as shown in the inventory, such as Slack or Slack.app. Up to 160 characters after trimming; longer values mark the row invalid.",
                      "type": "string"
                    },
                    "publisher": {
                      "description": "Publisher or vendor name. Used only to group rows that have no bundle ID. Up to 160 characters after trimming; longer values mark the row invalid.",
                      "type": "string"
                    },
                    "version": {
                      "description": "Installed CFBundleShortVersionString, as a string. Up to 80 characters after trimming; longer values mark the row invalid.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 250,
                "minItems": 1,
                "type": "array"
              },
              "target_macos": {
                "anyOf": [
                  {
                    "const": 26,
                    "type": "number"
                  },
                  {
                    "const": 27,
                    "type": "number"
                  },
                  {
                    "const": 28,
                    "type": "number"
                  }
                ],
                "description": "macOS major version to assess, 26, 27 or 28. 28 is the first release without general-purpose Rosetta 2. Omit for architecture evidence only."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "catalog_revision": {
                "description": "Catalog revision these results come from. Pass it back with later pages.",
                "type": "string"
              },
              "counts": {
                "additionalProperties": {},
                "description": "Whole-batch counts: received = accepted + invalid, unique = accepted - duplicates, and the four statuses sum to unique.",
                "properties": {
                  "accepted": {
                    "type": "number"
                  },
                  "duplicates": {
                    "type": "number"
                  },
                  "invalid": {
                    "type": "number"
                  },
                  "native": {
                    "type": "number"
                  },
                  "received": {
                    "type": "number"
                  },
                  "rosetta": {
                    "type": "number"
                  },
                  "unique": {
                    "type": "number"
                  },
                  "unknown": {
                    "type": "number"
                  },
                  "unsupported": {
                    "type": "number"
                  }
                },
                "required": ["accepted", "duplicates", "invalid", "native", "received", "rosetta", "unique", "unknown", "unsupported"],
                "type": "object"
              },
              "filtered_count": {
                "description": "Unique rows matching filter.",
                "type": "number"
              },
              "format": {
                "description": "Profile used to read a recognized raw export.",
                "type": "string"
              },
              "invalid_rows": {
                "description": "Up to 10 invalid row numbers with reason codes.",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "code": {
                      "enum": ["missing_identity", "invalid_field"],
                      "type": "string"
                    },
                    "row": {
                      "type": "number"
                    }
                  },
                  "required": ["code", "row"],
                  "type": "object"
                },
                "type": "array"
              },
              "next_offset": {
                "description": "Offset of the next page, or null on the last page.",
                "type": ["number", "null"]
              },
              "results": {
                "description": "One page of unique rows in input order.",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "app": {
                      "additionalProperties": false,
                      "description": "App identity from a raw export.",
                      "properties": {
                        "bundle_id": {
                          "type": ["string", "null"]
                        },
                        "name": {
                          "type": ["string", "null"]
                        },
                        "publisher": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["bundle_id", "name", "publisher"],
                      "type": "object"
                    },
                    "candidates": {
                      "description": "Up to three catalog listings for an ambiguous or conflicting row.",
                      "items": {
                        "additionalProperties": {},
                        "properties": {
                          "title": {
                            "type": "string"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["title", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "catalog_hint": {
                      "anyOf": [
                        {
                          "additionalProperties": {},
                          "properties": {
                            "reported_status": {
                              "description": "Reported status: native, rosetta, no (unsupported), no-in-progress (support in progress) or unreported (native support not yet reported). Null when the source has none.",
                              "type": ["string", "null"]
                            },
                            "title": {
                              "type": "string"
                            },
                            "url": {
                              "type": "string"
                            }
                          },
                          "required": ["reported_status", "title", "url"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Latest catalog listing and status for triage. It does not describe the installed version."
                    },
                    "device_count": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Device count for the raw export tuple. Null when the export lacks enough information for a reliable count."
                    },
                    "duplicate_rows": {
                      "description": "Additional input rows collapsed into this one.",
                      "type": "number"
                    },
                    "evidence": {
                      "anyOf": [
                        {
                          "additionalProperties": {},
                          "properties": {
                            "architectures": {
                              "items": {
                                "type": "string"
                              },
                              "type": "array"
                            },
                            "basis": {
                              "description": "catalog_statement: the listing reports native support as of observed_version. binary_architecture: a catalog scan of exactly observed_version found these Mach-O architectures.",
                              "enum": ["catalog_statement", "binary_architecture", "vendor_statement", "runtime_test"],
                              "type": "string"
                            },
                            "observed_at": {
                              "type": ["string", "null"]
                            },
                            "observed_build": {
                              "type": ["string", "null"]
                            },
                            "observed_version": {
                              "type": ["string", "null"]
                            },
                            "source_url": {
                              "type": "string"
                            }
                          },
                          "required": ["architectures", "basis", "observed_at", "observed_build", "observed_version", "source_url"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "match": {
                      "description": "How the row was matched to the catalog. Only bundle_id establishes identity for a status.",
                      "enum": ["bundle_id", "name", "alias", "ambiguous", "none"],
                      "type": "string"
                    },
                    "requested_build": {
                      "type": ["string", "null"]
                    },
                    "requested_version": {
                      "type": ["string", "null"]
                    },
                    "row": {
                      "description": "First input row for the tuple. Raw CSV uses the file line at the end of the record. App-only inputs and raw JSON use one-based app row positions.",
                      "type": "number"
                    },
                    "status": {
                      "enum": ["native", "rosetta", "unsupported", "unknown"],
                      "type": "string"
                    },
                    "target_assessment": {
                      "anyOf": [
                        {
                          "enum": ["rosetta_available_if_installed", "rosetta_unavailable", "explicitly_unsupported", "needs_validation", "unknown"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Assessment for target_macos. Null when no target was given."
                    },
                    "unknown_reason": {
                      "anyOf": [
                        {
                          "enum": ["unlisted", "ambiguous_identity", "bundle_id_conflict", "version_missing", "version_unverified", "conflicting_variants", "stale_evidence", "insufficient_evidence"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Why status is unknown. Null otherwise."
                    }
                  },
                  "required": ["candidates", "catalog_hint", "duplicate_rows", "evidence", "match", "requested_build", "requested_version", "row", "status", "target_assessment", "unknown_reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "scanner_reference": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {
                      "catalog_submission": {
                        "type": "string"
                      },
                      "scope": {
                        "type": "string"
                      },
                      "title": {
                        "type": "string"
                      },
                      "unknown_rows": {
                        "type": "number"
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["catalog_submission", "scope", "title", "unknown_rows", "url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Fixed Does It ARM App Scanner v3 (preview) reference, present when the batch has unknown rows. Scanner results stay on the local Mac; catalog_submission is unavailable."
              },
              "target_macos": {
                "type": ["number", "null"]
              }
            },
            "required": ["catalog_revision", "counts", "filtered_count", "invalid_rows", "next_offset", "results", "scanner_reference", "target_macos"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check Mac App Inventory for Apple Silicon"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1e2669167da42a5a09c258fc8b6b6a1e86b6025d09f9fc4f74d383864fca6520"
