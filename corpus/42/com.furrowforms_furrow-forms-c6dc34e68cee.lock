                  "maxLength": 253,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "branding": {
                "description": "Per-project branding override for notification emails and hosted pages.",
                "properties": {
                  "agency_name": {
                    "anyOf": [
                      {
                        "maxLength": 120,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Agency name shown when mode is agency. Null clears it."
                  },
