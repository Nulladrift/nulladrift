                      ],
                      "description": "Bcc for this form only. Empty array sends no Bcc. Null inherits the project's notify_bcc."
                    },
                    "notify_cc_override": {
                      "anyOf": [
                        {
                          "items": {
                            "format": "email",
                            "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                            "type": "string"
                          },
                          "maxItems": 10,
                          "type": "array"
