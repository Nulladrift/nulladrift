                    },
                    "required": ["account_sid", "from"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The team's own Twilio account for new-lead text alerts. Null removes it. Numbers to text live on the project (notify_phones)."
