      "instructions": "Furrow Forms is a form backend you operate end to end: bootstrap_site → get_snippet → paste the snippet → test. Read furrow://docs/workflow before provisioning and furrow://docs/testing before you test or ask the human to.\n\nSetup needs no environment variables. Hardcode the submit_url from get_snippet (the public key is not a secret), keep your frw_ token out of the site repo, and never ask the human to edit .env.\n\nBefore bootstrap_site, ask in one message: who should receive notification emails (required, no default), thank-you page or on-page message, and whether to set up Turnstile (https://dash.cloudflare.com/?to=/:account/turnstile). Visitors get an on-site confirmation, not an email.\n\nTest the form yourself first (curl with an allowed Origin, then list_submissions), then give the human a short checklist: open this page, submit with your real email, expect this thank-you, expect an email at this address. Never send them to the dashboard for setup or checking.\n\nAfter it works, tell them spam is caught automatically and still emailed as [Potential spam], and offer the optional AI filter: a TypeSafe key from https://console.typesafe.ai/keys, saved with update_account ai.typesafe_api_key. Also offer, once, a text on their phone for every real lead through their own Twilio account. If they want it, read furrow://docs/text-alerts and walk them through it one step at a time.",
