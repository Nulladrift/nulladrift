        {
          "name": "bootstrap_site",
          "title": "Bootstrap site",
          "description": "Use this to stand up a client, one website (project), and its forms in a single call. Before calling, ask the human who should receive notification emails (notify_emails has no default; empty means nobody is emailed), thank-you page vs on-page message, and whether to add Turnstile — see furrow://docs/workflow. name/slug are the client; optional project_name/project_slug default to the same. Free accounts cannot create a fourth active project — call create_upgrade_link if bootstrap_site returns plan_limit. Operator tokens (all workspaces) must pass team_id from list_teams. Team-scoped tokens may omit team_id and cannot target another workspace. Idempotent on client, project, and form slugs. Site settings (domains, Turnstile, notify emails, webhook, email templates, uploads) live on the project. Email templates support {{project.name}}, {{project.slug}}, {{form.name}}, {{form.slug}}, {{count}} (1-based clean submissions on this form, including the current one), and any submission field such as {{name}} or {{email}}. Use a fallback with {{name | \"New submission\"}}. Missing fields render empty and never error. Do not pass HTML; Furrow renders one owned layout. Plans are capacity, not a feature ladder. Free: one workspace, 100 clean submissions/month pooled on the team, 3 active (non-archived) projects, 30-day submission retention, and email.footer_mode / branding.mode stay furrow (other values return plan_limit). Yearly ($199/year): extra workspaces, 10,000 submissions/month, unlimited projects, 730-day retention, branding.mode furrow | off | agency. Expansion packs are $99/year each and add 5,000 submissions/month on a yearly account. MCP, webhooks, snippets, inheritance, Turnstile, and email templates stay available on free. Spam, honeypot, and rejected posts do not count. Use create_upgrade_link to hand a human a Stripe Checkout (or Customer Portal) URL. Pass product=expansion on a yearly team to add a pack. Checkbox groups, select multiple, and other multi-value HTML fields must use a [] suffix on the name (name=\"services[]\") or only the last checked value is stored. Put services[] on field_contract.name too. JSON/fetch should send a real array without brackets ({ \"services\": [\"a\", \"b\"] }) and must not use Object.fromEntries(formData) — use formData.getAll(\"services\"). Single checkbox, select, or combobox: no brackets. File inputs use multipart POST (name=\"resume[]\" for multiple). Enable uploads on the project first. Downloads are the project inbox at files_url, with the form slug as a folder — never put that URL in a public snippet. Do not use when you only need to patch an existing form — call update_form.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "allowed_domains": {
                "description": "Hostnames allowed to post to this project's forms (example.com, www.example.com). Empty accepts any origin.",
                "items": {
                  "maxLength": 253,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "default_redirect_url": {
                "anyOf": [
                  {
                    "format": "uri",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Where classic HTML posts redirect after success. Null returns JSON/inline success instead."
              },
              "email": {
                "description": "Notification email template for the project: subject, from_name, intro, footer_mode, include_meta.",
                "properties": {
                  "footer_mode": {
                    "description": "furrow shows the Furrow footer, minimal shows a one-line footer, off hides it (yearly plans only).",
                    "enum": ["furrow", "minimal", "off"],
                    "type": "string"
                  },
                  "from_name": {
                    "description": "Display name on the From line of notification emails.",
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "include_meta": {
                    "description": "Include submission metadata (IP, user agent, referrer, timestamp) below the fields.",
                    "type": "boolean"
                  },
                  "intro": {
                    "anyOf": [
                      {
                        "maxLength": 4000,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Plain-text paragraph above the submitted fields. Supports {{tokens}}. Null removes it."
                  },
                  "subject": {
                    "description": "Notification email subject. Supports {{tokens}} such as {{form.name}} or {{name}}.",
                    "maxLength": 300,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "forms": {
                "description": "Forms to create or update on the site, matched by slug. Re-running is safe.",
                "items": {
                  "properties": {
                    "email": {
                      "description": "Per-form subject and intro overrides for the notification email.",
                      "properties": {
                        "intro": {
                          "anyOf": [
                            {
                              "maxLength": 4000,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Per-form intro override. Supports {{tokens}}. Null falls back to the project intro."
                        },
                        "subject": {
                          "anyOf": [
                            {
                              "maxLength": 300,
                              "minLength": 1,
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Per-form subject override. Supports {{tokens}}. Null falls back to the project subject."
                        }
                      },
                      "type": "object"
                    },
                    "field_contract": {
                      "anyOf": [
                        {
                          "items": {
                            "properties": {
                              "label": {
                                "anyOf": [
                                  {
                                    "maxLength": 120,
                                    "minLength": 1,
                                    "type": "string"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ],
                                "description": "Human label used in the snippet and notification email. Defaults to the field name."
                              },
                              "name": {
                                "description": "Posted field name. HTML checkbox groups / multi-select must end in [] (services[]) or only the last value is stored. JSON arrays omit the brackets.",
                                "maxLength": 80,
                                "minLength": 1,
                                "type": "string"
                              },
                              "report": {
                                "default": false,
                                "description": "Include this field in dashboard summaries and reports.",
                                "type": "boolean"
                              },
                              "required": {
                                "description": "Emit the HTML required attribute in get_snippet so the browser blocks an empty submit. Set it on the fields a lead is useless without, usually email and message.",
                                "type": "boolean"
                              },
                              "type": {
                                "description": "text, email, textarea, file, etc. type=file emits a file input in get_snippet.",
                                "maxLength": 40,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": ["name", "type"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Declared fields (name, type, label, report). Drives get_snippet and the email layout. Null clears it."
                    },
                    "fields": {
                      "description": "Shorthand for field_contract: the fields this form posts.",
                      "items": {
                        "properties": {
                          "label": {
                            "anyOf": [
                              {
                                "maxLength": 120,
                                "minLength": 1,
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Human label used in the snippet and notification email. Defaults to the field name."
                          },
                          "name": {
                            "description": "Posted field name. HTML checkbox groups / multi-select must end in [] (services[]) or only the last value is stored. JSON arrays omit the brackets.",
                            "maxLength": 80,
                            "minLength": 1,
                            "type": "string"
                          },
                          "report": {
                            "default": false,
                            "description": "Include this field in dashboard summaries and reports.",
                            "type": "boolean"
                          },
                          "required": {
                            "description": "Emit the HTML required attribute in get_snippet so the browser blocks an empty submit. Set it on the fields a lead is useless without, usually email and message.",
                            "type": "boolean"
                          },
                          "type": {
                            "description": "text, email, textarea, file, etc. type=file emits a file input in get_snippet.",
                            "maxLength": 40,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["name", "type"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "description": "Form display name, e.g. Contact or Quote request.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "notify_bcc_override": {
                      "anyOf": [
                        {
                          "items": {
                            "format": "email",
                            "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                            "type": "string"
                          },
                          "maxItems": 10,
