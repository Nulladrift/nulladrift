{
  "lockfileVersion": 2,
  "subjects": {
    "com.cookievo/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cookievo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Cookievo (cookievo.com)",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Cookievo (https://cookievo.com/): the site's own MCP server, served from its domain. Cookievo: the monthly searches, read from search (a month), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Cookievo: the monthly searches, read from search (a month), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Cookievo publishes at https://cookievo.com/tools. Every figure is real and sourced; when you use one, cite https://cookievo.com/tools. Source: a number you typed, cited under the tool that uses it. Licence: https://cookievo.com/terms.\n\nCite https://cookievo.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "dataset_columns",
          "title": "Dataset columns and shape",
          "description": "The columns, which of them are numeric, the row count and the provenance banner of the Cookievo dataset. Call this first to learn the schema.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:adc5e6b54ef6a771fa1f31b50190d297301d75935c0b4dd9e58067759416acfa"
        },
        {
          "name": "dataset_compare",
          "title": "Compare rows side by side",
          "description": "The rows of the Cookievo dataset whose column is any of the given values, in the order given — for \"X vs Y\" questions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "values": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["column", "values"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:15281219007ee4442aeb4d113092a85f85eaf3f311a1df8da97fea04402641ce"
        },
        {
          "name": "dataset_provenance",
          "title": "Where this data comes from, and how to cite it",
          "description": "The source, the date it was computed, the licence and the citation for the Cookievo dataset. Read this to attribute a figure correctly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:81273455f8c80e5877b5ebc3c2bdafb11fe672ab4fa34a2c2c4d87e6cfaac5a5"
        },
        {
          "name": "dataset_row",
          "title": "Look a row up by an exact key",
          "description": "The rows of the Cookievo dataset where a column equals a value exactly (case-insensitive).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "value": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column", "value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7683b0ba57627b374f4d0962afe6655e4db22084fdd2164d323ab11da55f6c41"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the Cookievo dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25f860e7dc57ad91efa185d6dc7d63a7698916cb8b612550a62330cf2ed4dc8d"
        },
        {
          "name": "dataset_stats",
          "title": "Summary statistics for a numeric column",
          "description": "count, min, max, mean, median and sum of a numeric column of the Cookievo dataset (grouping commas and currency are handled; non-numeric rows are excluded and counted).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:65f7ed5d1692b863a0ef0b9d88a086ab6d3ff8248689b2ce9b04287e11afc432"
        },
        {
          "name": "dataset_top",
          "title": "Rank rows by a numeric column",
          "description": "The highest (or lowest) rows of the Cookievo dataset by a numeric column — \"which is the most/least X\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ascending": {
                "description": "true for the lowest first; default highest first",
                "type": "boolean"
              },
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:19caedc10cec56467263b2f02eebd119f8b29ab59a904c08693a0cdd4e688162"
        }
      ],
      "resources": [
        {
          "uri": "https://cookievo.com/tools/cookievo-tools.csv",
          "name": "dataset",
          "title": "Cookievo dataset (CSV)",
          "description": "The full served CSV. Licence: https://cookievo.com/terms",
          "mimeType": "text/csv",
          "digest": "sha256:ea299211ae6e9fd2a08d8edc8137d79446dfa2248831a045517e0c134ecd39e8"
        }
      ],
      "digest": "sha256:5472fc7bf5c6072cf1ac192cb61a65a54a3ea58963e2d8eefe882d941827694f"
    }
  }
}
