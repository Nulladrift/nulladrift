        "url": "https://www.christianjobslist.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "www.christianjobslist.com",
        "title": "Christian Jobs List",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_job",
          "title": "Get a job on Christian Jobs List",
          "description": "Returns one current Christian Jobs List job by its id, with a sanitized description of up to 8,000 characters and a link to its page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "The id of a job from a search_jobs result. The number at the end of that id works on its own too, as an integer or a string."
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "type": "string"
              },
              "job": {
                "additionalProperties": false,
                "properties": {
                  "benefits": {
                    "anyOf": [
                      {
                        "maxLength": 2000,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "categories": {
                    "items": {
                      "$ref": "#/properties/job/properties/title"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  "company": {
                    "$ref": "#/properties/job/properties/title"
                  },
                  "description_html": {
                    "maxLength": 8000,
                    "type": "string"
                  },
                  "employment_type": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/job/properties/title"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "experience_level": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/job/properties/title"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "id": {
                    "type": "string"
                  },
                  "is_nonprofit": {
                    "type": "boolean"
                  },
                  "location": {
                    "anyOf": [
                      {
                        "$ref": "#/properties/job/properties/title"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "posted_at": {
                    "type": "string"
                  },
                  "remote": {
                    "type": "boolean"
                  },
                  "salary": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "max": {
                            "type": ["number", "null"]
                          },
                          "min": {
                            "type": ["number", "null"]
                          },
                          "type": {
                            "anyOf": [
                              {
                                "$ref": "#/properties/job/properties/title"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          }
                        },
                        "required": ["max", "min", "type"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "skills": {
                    "items": {
                      "$ref": "#/properties/job/properties/title"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  "title": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["benefits", "categories", "company", "description_html", "employment_type", "experience_level", "id", "is_nonprofit", "location", "posted_at", "remote", "salary", "skills", "title", "url"],
                "type": "object"
              },
              "premium_similar": {
                "additionalProperties": false,
                "properties": {
                  "count": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "note": {
                    "type": "string"
                  },
                  "scope": {
                    "additionalProperties": false,
                    "properties": {
                      "all_locations": {
                        "type": "boolean"
                      },
                      "category": {
                        "type": ["string", "null"]
                      },
                      "title_keyword": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["all_locations", "category", "title_keyword"],
                    "type": "object"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["count", "note", "scope", "url"],
                "type": "object"
              }
            },
            "required": ["brand", "job"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:3b25901bda920cf20c2cec53b63ee3d0f7c0f0fcb56ae3c51d9c263f68f8ca7c"
        },
        {
          "name": "list_categories",
          "title": "List Christian Jobs List job categories",
          "description": "Lists the job categories on Christian Jobs List with how many current listings each one has.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "type": "string"
              },
              "categories": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
                    "remote_count": {
                      "$ref": "#/properties/categories/items/properties/count"
                    }
                  },
                  "required": ["count", "name", "remote_count"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["brand", "categories"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:ca235268f005e1ae4ce1fd3d407a825da8bd8b2e7fa0edbc6be9c3645b3b05c6"
        },
        {
          "name": "search_jobs",
          "title": "Search jobs on Christian Jobs List",
          "description": "Searches the current job listings on Christian Jobs List by keyword, category, remote and location, and returns each job with a link to its page on Christian Jobs List.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "One category name from list_categories, matched case-insensitively, and known aliases work too. Any other name, or more than one category, returns an error instead of wider results. Without a category, the search covers every category.",
                "maxLength": 200,
                "type": "string"
              },
              "limit": {
                "description": "How many jobs to return, from 1 to 20. The default is 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "A city, state or country to look for in each job's location, matched case-insensitively. Remote jobs have Remote as their location, so the remote argument is the better way to find them.",
                "maxLength": 200,
                "type": "string"
              },
              "offset": {
                "description": "How many matching jobs to skip before the results start, for paging. The default is 0, and the response's total says how many jobs matched.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "A word or short phrase to look for in each job's title, company, skills and categories. Matching is case-insensitive and the whole phrase has to appear inside the title, the company, one skill or one category, so one or two words work best.",
                "maxLength": 200,
                "type": "string"
              },
              "remote": {
                "description": "With true only remote jobs come back, and with false only jobs that aren't remote. Without it, both come back. A job counts as remote when its location is Remote.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "type": "string"
              },
              "jobs": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "categories": {
                      "items": {
                        "$ref": "#/properties/jobs/items/properties/title"
                      },
                      "maxItems": 50,
                      "type": "array"
                    },
                    "company": {
                      "$ref": "#/properties/jobs/items/properties/title"
                    },
                    "employment_type": {
                      "anyOf": [
                        {
                          "$ref": "#/properties/jobs/items/properties/title"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "experience_level": {
                      "anyOf": [
                        {
                          "$ref": "#/properties/jobs/items/properties/title"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "id": {
                      "type": "string"
                    },
                    "is_nonprofit": {
                      "type": "boolean"
                    },
                    "location": {
                      "anyOf": [
                        {
                          "$ref": "#/properties/jobs/items/properties/title"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "posted_at": {
                      "type": "string"
                    },
                    "remote": {
                      "type": "boolean"
                    },
                    "salary": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "max": {
                              "type": ["number", "null"]
                            },
                            "min": {
                              "type": ["number", "null"]
                            },
                            "type": {
                              "anyOf": [
                                {
                                  "$ref": "#/properties/jobs/items/properties/title"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            }
                          },
                          "required": ["max", "min", "type"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "skills": {
                      "items": {
                        "$ref": "#/properties/jobs/items/properties/title"
                      },
                      "maxItems": 50,
                      "type": "array"
                    },
                    "title": {
                      "maxLength": 500,
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["categories", "company", "employment_type", "experience_level", "id", "is_nonprofit", "location", "posted_at", "remote", "salary", "skills", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "limit": {
                "$ref": "#/properties/total"
              },
              "offset": {
                "$ref": "#/properties/total"
              },
              "premium_more": {
                "additionalProperties": false,
                "properties": {
                  "count": {
                    "$ref": "#/properties/total"
                  },
                  "note": {
                    "type": "string"
                  },
                  "scope": {
                    "additionalProperties": false,
                    "properties": {
                      "all_locations": {
                        "type": "boolean"
                      },
                      "category": {
                        "type": ["string", "null"]
                      },
                      "title_keyword": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["all_locations", "category", "title_keyword"],
                    "type": "object"
                  }
                },
                "required": ["count", "note", "scope"],
                "type": "object"
              },
              "total": {
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["brand", "jobs", "limit", "offset", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:d72ccba013ead6622deb50859a1b917cc9ac1429e2fbeeb416e9705f2fc8733a"
        }
      ],
      "digest": "sha256:be1d43f66827435df5c339b0106edd281134e32ea5448fa35cb9b5fb4f0f76eb"
    }
  }
