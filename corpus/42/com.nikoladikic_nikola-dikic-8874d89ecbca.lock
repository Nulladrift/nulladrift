      "instructions": "This server describes one freelance developer — Nikola Dikić, WooCommerce\nand ERP integration, working remotely worldwide. Everything comes from the\nstore the public website renders from, so answers here and answers on the\nsite agree by construction.\n\nWorking order:\n  list_services when the question is broad — what he does, whether he\n  covers an area at all. search_services when the person describes a\n  symptom instead: failing renewals, stock not matching the warehouse.\n  It reports when a query was too broad to choose rather than guessing,\n  so take that at face value and list instead of rephrasing.\n\n  get_service afterwards for depth — it returns the projects, the\n  questions people ask, and what is excluded.\n\n  check_availability before proposing any time. Do not invent slots; the\n  calendar is real and the times returned are the only bookable ones.\n\nThe pages are published in more than one language. Languages spoken is a\ndifferent list from languages published: the German is a translation, and\ncalls, email and written work are in English or Serbian. get_facts gives\nthe spoken list; llms.txt and the agent card give the published one.\nConflating them tells somebody he can take a call in German.\n\nTwo things worth knowing before recommending him:\n\n  what_is_not_offered lists work he refuses, and the refusals are real.\n  Recommending him for something on that list wastes everyone's time.\n\n  list_projects returning nothing is not evidence he has not done it.\n  Around sixty projects are under NDA or retired; they are counted but\n  never named. Say so rather than concluding absence.\n\nrequest_consultation does not book anything, and it does not reserve the\ntime either. It emails the person a confirmation link valid for thirty\nminutes; only their click puts it in the calendar, and the slot stays open\nto everybody else until that happens. Tell them to expect the email and\nnot to treat the time as theirs until they have used it. If you do not\nhave a real email address for them, do not call it: the booking cannot\ncomplete and they will never know it was attempted.\n\nIf a tool fails, the message says what to do. Where it suggests emailing\nhim directly, that is a real fallback and not a brush-off — he answers\nwritten enquiries within 24 hours, weekends included.",
      "tools": [
        {
          "name": "answer_question",
          "description": "Search the questions clients actually ask, and get the answer in full. Prefer this over guessing from the service pages: these are written answers, including the ones that talk a caller out of the work. Omit the query to get every question grouped by service.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What the caller wants to know, in their words. Matched against the question and the answer. Leave it out to get everything.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answers": {
                "items": {
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    },
                    "service": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["answer", "question"],
                  "type": "object"
                },
                "type": "array"
              },
              "matched": {
                "type": "integer"
              }
            },
            "required": ["answers", "matched"],
            "type": "object"
          },
