      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/earthquakes"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-earthquakes",
        "title": "Faceabot Earthquakes",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot Earthquakes: recent earthquakes worldwide or near a place, from the USGS real-time catalog (public domain), free, no key.\nrecent_earthquakes {\"min_magnitude\":4.5,\"days\":1} · {\"place\":\"Istanbul\",\"days\":7,\"min_magnitude\":3}.\nFor safety alerts, follow the local authorities.\nPart of Faceabot (https://faceabot.com): any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "recent_earthquakes",
          "title": "Recent earthquakes worldwide or near a place",
          "description": "Recent earthquakes from the USGS real-time catalog (worldwide, up to 30 days): time, magnitude, place, depth, tsunami flag and impact alert; optionally near a city or coordinates.\nUse when: \"earthquakes today\", \"was there an earthquake in Tokyo?\", \"séismes en Italie cette semaine\".\nExample: {\"min_magnitude\":4.5,\"days\":1} or {\"place\":\"Tokyo\",\"days\":7,\"min_magnitude\":3}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 1,
                "description": "How many days back (max 30)",
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              },
              "lat": {
                "description": "Optional latitude instead of place",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Optional longitude (with lat)",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "min_magnitude": {
                "default": 4.5,
                "description": "Smallest magnitude (2.5 = felt nearby, 4.5 = significant, 6 = strong)",
                "examples": [4.5],
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "order": {
                "default": "time",
                "description": "Newest first, or strongest first",
                "enum": ["time", "magnitude"],
                "type": "string"
              },
              "place": {
                "description": "Optional city, region or country to search around (any language)",
                "type": "string"
              },
              "radius_km": {
                "default": 500,
                "description": "Search radius around the place, km",
                "maximum": 5000,
                "minimum": 10,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:679ad3154b2b8c893b79bebb82a8ce2f92c79e60081a5bec54d9ed98bfc70a33"
        }
      ],
      "digest": "sha256:e47c252d0f0747ef66a1cae8f34e20012ddc951ce888485b230dafbbada4121c"
    }
  }
