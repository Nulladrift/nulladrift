{
  "lockfileVersion": 2,
  "subjects": {
    "com.authichain/authichain": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://authichain.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "authichain",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free verification: verify_attestation fetches a published v0.1 JWS and checks issuer trust, signature, lifecycle and expiry; verify_record checks the separate reference protocol. Paid verification: verify is an x402 seal-registry tool requiring separately authorized payment. query_provenance is registration-only. No tool proves physical authenticity. dpp_readiness_check is informational EU Digital Product Passport readiness scoring, not legal advice.",
      "tools": [
        {
          "name": "dpp_readiness_check",
          "description": "Free informational EU Digital Product Passport readiness questionnaire; this cannot issue a passport or certify compliance. Returns a 0-100 score, gaps, and the dated obligation for the product category (battery passport is law from 18 Feb 2027; other categories are ESPR targets). Not legal advice.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "battery_passport: EV, LMT (e-bike, e-scooter) or industrial battery over 2 kWh; battery_other: Other battery (portable, SLI, industrial up to 2 kWh); textiles: Textiles, apparel or footwear; iron_steel: Iron and steel; aluminium: Aluminium; tyres: Tyres; furniture: Furniture; mattresses: Mattresses; electronics: Electronics and ICT; toys: Toys; construction: Construction products; detergents: Detergents and cleaning products; other: Something else",
                "enum": ["battery_passport", "battery_other", "textiles", "iron_steel", "aluminium", "tyres", "furniture", "mattresses", "electronics", "toys", "construction", "detergents", "other"],
                "type": "string"
              },
              "data_host": {
                "description": "You have a public web location where product data could be published behind a QR code.",
                "type": "boolean"
              },
              "data_owner": {
                "description": "A named person owns product compliance data.",
                "type": "boolean"
              },
              "footprint": {
                "description": "You have carbon or environmental footprint data for the product.",
                "type": "boolean"
              },
              "market_role": {
                "description": "You know who places the product on the EU market (you, an importer or an EU representative).",
                "type": "boolean"
              },
              "sells_in_eu": {
                "description": "Sold into the EU directly or via an importer. Default true.",
                "type": "boolean"
              },
              "supplier_data": {
                "description": "You can get material and substance data from your suppliers.",
                "type": "boolean"
              },
              "unique_id": {
                "description": "Each product (or model or batch) has a unique identifier, such as a GS1 GTIN with serial.",
                "type": "boolean"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca0f76ef623a2a4f4c978df7d0e4470c1a9523e770b437e7a12fd5bfe6753786"
        },
        {
          "name": "get_pricing",
          "description": "Free. Quotes without charging or authorizing payment the live x402 agent rail ($0.05 USDC on Base) and live human Stripe checkouts: $29 Starter Pack (100 generations, paid once) at https://authichain.com/checkout/starter and $299 EU DPP Readiness at https://authichain.com/checkout/dpp_readiness. Starting a monthly plan replaces unused pack credits.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e51a7d262acf3cad03fd65455ccb332ac8a9807010e577d8cec54456ddcb867"
        },
        {
          "name": "negotiate",
          "description": "Free, read-only, non-binding agent-to-agent capability/price-class quote. Returns available service, free vs separately authorized paid rail, and next step; never accepts terms, creates a commitment, transfers money, or calls an external service. This is NOT MCP initialize version negotiation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Display denomination only; no FX transaction. Defaults to USD.",
                "enum": ["USD"],
                "type": "string"
              },
              "max_budget_usd": {
                "description": "Optional caller budget ceiling; never authorizes a charge.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "mode": {
                "description": "Non-binding quote only. Defaults to quote_only.",
                "enum": ["quote_only"],
                "type": "string"
              },
              "service": {
                "description": "Existing MCP service the agent wants to discuss.",
                "enum": ["get_pricing", "verify", "query_provenance", "verify_attestation", "verify_record", "dpp_readiness_check", "scan_living_qr"],
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:139e621f798516278c2c56ef2c5e781239bfa8a9b0c089ef4c4958a5a787fed3"
        },
        {
          "name": "query_provenance",
          "description": "Free registry and published-pack lookup for an assetId / seal / QR token; use for discovery, not proof of authenticity. Reads matching rows from the canonical auth_seals registry when public Supabase configuration is available, and also resolves published packs. A registry match means registered only; it does not verify a signature or prove a physical item is genuine. Use verify_attestation for a published v0.1 JWS; verify_record is the separate reference-protocol verifier.",
          "inputSchema": {
            "properties": {
              "assetId": {
                "description": "Seal, serial, or QR token identifier",
                "type": "string"
              }
            },
            "required": ["assetId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ab05877deb70bb1f4b3fcf224f3bfc2fa863a47aada0a818e8473dd10ecf1fba"
        },
        {
          "name": "scan_living_qr",
          "description": "Free. Read an existing Living QR presentation, not a QR generator or x402 purchase. Scan a stored Living QR. GET https://authichain.com/qron/r/{object_id} returns AuthiChain Verification Decision v1. This host verifies the signature. A missing id is presentation_not_found. Not an x402 payment endpoint, and it does not inspect a physical product.",
          "inputSchema": {
            "properties": {
              "object_id": {
                "description": "Stored presentation id. Canonical form is qron:url: plus 8 hex characters.",
                "type": "string"
              }
            },
            "required": ["object_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f806ea4fcde7ca1c5c336c808fdc45f0de5e3e2dc6335331719c12f35d773aa7"
        },
        {
          "name": "verify",
          "description": "x402 paid seal-registry verification; use only after separate payment authorization, not for free lookup. Arguments that cannot be a seal UUID are HTTP 400 before payment. Empty arguments are unpaid HTTP 402. Paid calls are answered from the seal registry at $0.05 USDC on Base. For free verification use verify_record.",
          "inputSchema": {
            "properties": {
              "sealId": {
                "description": "Required seal UUID. productId and serial are not registry keys.",
                "format": "uuid",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:43de16b4ee9ca90f010fd03023f8216a0b6251aa898ffd7789f3a52e5bb8c804"
        },
        {
          "name": "verify_attestation",
          "description": "Free. Use when verifying a registry-published attestation, not a supplied offline protocol record. Fetch the exact published AuthiChain v0.1 JWS from the signed-record registry and pass it to the canonical edge-router verifier. Checks signature, issuer trust, durable revocation/status, expiry, and signed decision. Supply expectedObjectId to bind the record to a scanned object identifier. A valid signed claim alone does not prove physical authenticity.",
          "inputSchema": {
            "properties": {
              "assetId": {
                "description": "Unique attestation ID or exact seal/product identifier",
                "type": "string"
              },
              "expectedObjectId": {
                "description": "Optional independently observed object ID to compare with the signed subject",
                "type": "string"
              }
            },
            "required": ["assetId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:80d4cdc785d2860319d53ff085165a843bf7fa0318e9ed4f0ef726255e4644db"
        },
        {
          "name": "verify_record",
          "description": "Free. Use for a supplied signed protocol record or demonstration record, not published JWS issuer-status checks. Verify an AuthiChain signed provenance record with the open reference verifier. Pass id \"polygon-anchor-1\" for the published demonstration record, or pass your own record and anchor JSON. Returns verified, valid-unanchored, or invalid, plus whether the transaction carries the record hash. It does not inspect a physical product.",
          "inputSchema": {
            "properties": {
              "anchor": {
                "description": "Anchor JSON: { recordHash, chain: \"polygon:137\", txHash }. Optional.",
                "type": "object"
              },
              "id": {
                "description": "Published record id. Only \"polygon-anchor-1\" exists.",
                "type": "string"
              },
              "record": {
                "description": "A signed AuthiChain provenance record (JSON).",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bc0efa549e44b13a443087982b1e6c7cebf4626eb41ae075ec55f8bb4156a26f"
        }
      ],
      "digest": "sha256:12ab0c6961874e2395cd75e932c6a030f862d445a3db45eda4ca9ea8fdeb8a8b"
    }
  }
}
