      "instructions": "Cycle Intelligence: product infrastructure for physical-product businesses (cycle-platform.com). Free, deterministic verification tools for EU product-compliance readiness (Digital Product Passport / ESPR) and GS1 identifiers - pass product data as JSON, get internal data-readiness checks, not official certification. Also: map any product sheet/CSV to DPP fields (map_product_to_dpp), build and resolve GS1 Digital Link QR payloads and published passports (build_gs1_digital_link, resolve_digital_link), validate or draft a DPP JSON document (validate_dpp_document, draft_dpp_document), estimate textile CO2e/water/regulatory flags (estimate_textile_impact) and analyse supply-chain concentration and traceability gaps (analyze_supply_chain). All free. Resources: textile field glossary and Digital Link guide; prompts for catalogue audits and QR labels. Organisation-bound keys also allow scoped catalogue, provenance, sales and collection queries. Creating live product twins, versioned DPPs and GS1 carriers requires an organisation API key. Informational, not legal advice.",
      "tools": [
        {
          "name": "analyze_supply_chain",
          "description": "Use this tool to analyse a fashion/textile supply base from product data (supplier, country of manufacture, composition, facility id): per-supplier data scores, country shares, country concentration index (HHI), fibre mix and data-quality gaps that block traceability and DPPs. Up to 200 products. Deterministic, no account needed.",
          "inputSchema": {
            "properties": {
              "products": {
                "description": "Products with supplier, country, composition and optional facility_id.",
                "items": {
                  "type": "object"
                },
                "maxItems": 200,
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "required": ["error"]
              },
              {
                "required": ["country_shares", "products_analyzed"]
              }
            ],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze supply-chain concentration & data gaps"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd4fe0ab4896b0852b4aeb2932c1a2bfec4cac7ff1e5247e4929250303fc9e99"
        },
        {
          "name": "build_gs1_digital_link",
          "description": "Use this tool to turn a GTIN/EAN (plus optional lot and serial number) into a conformant GS1 Digital Link URL, the QR payload required for Sunrise 2027 retail QR codes and EU Digital Product Passport data carriers. If the GTIN check digit is wrong it explains why and suggests the corrected number. Deterministic, no account needed.",
          "inputSchema": {
            "properties": {
              "base": {
                "description": "Optional https resolver origin you control; default https://id.cycle-platform.com",
                "maxLength": 200,
                "type": "string"
              },
              "gtin": {
                "description": "GTIN-8/12/13/14 or EAN.",
                "maxLength": 20,
                "type": "string"
              },
              "lot": {
                "description": "Optional batch/lot (GS1 AI 10, ≤20 chars).",
                "maxLength": 20,
                "type": "string"
              },
              "serial": {
                "description": "Optional serial number (GS1 AI 21, ≤20 chars).",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["gtin"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "required": ["error"]
              },
              {
                "required": ["digital_link", "gtin14"]
              }
            ],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build GS1 Digital Link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b236c0b4067f47f63e6fef672f65b2fff824f9b5c37ddc00b0a016cf34504340"
        },
        {
          "name": "check_dpp_requirements",
          "description": "Use this tool when a company or user asks WHAT the EU Digital Product Passport (DPP) requires, WHEN it becomes mandatory, which ESPR/AGEC/French milestones apply to textile or fashion products, or whether the DPP is already obligatory. Returns the regulatory reference timeline with its recorded review status, the mandatory data fields a textile DPP needs, and honest notes on what is in force vs pending delegated acts. Deterministic, no account needed. Informational, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "sector": {
                "description": "Supported sector: textile or fashion. Other sectors return unsupported_sector rather than textile rules.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "required": ["error"]
              },
              {
                "required": ["last_verified_at", "sector", "timeline", "verification_status"]
              }
            ],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check DPP requirements & timeline"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b92dd5ade5b57fd208116adc8926361a97c317758574d3c77747cb1f9d810637"
        },
        {
          "name": "create_data_carrier",
          "description": "Use this tool to generate the printable data carrier (QR content) of a twin: a GS1 Digital Link URL (Sunrise 2027 standard) if you pass a valid GTIN, or a serialized twin URL fallback without one. The URL resolves to the product's live twin the moment it is created - it is connected, not a loose QR. Invalid GTINs are rejected before printing. Requires an organisation API key. OPTIONAL: pass allocation={channel|retailer, shipment?, region?, units?} to link the serial to its intended retail channel (channel-aware serialization: future scans of that unit resolve their channel, always labelled INFERRED).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allocation": {
                "additionalProperties": false,
                "properties": {
                  "channel": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "region": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "retailer": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "shipment": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "units": {
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "gtin": {
                "maxLength": 120,
                "type": "string"
              },
              "idempotency_key": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "product_id": {
                "maxLength": 120,
                "type": "string"
              },
              "serial": {
                "maxLength": 20,
                "type": "string"
              },
              "sku": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "required": ["error"]
              },
              {
                "required": ["carrier", "created"]
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create GS1 data carrier"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:cf249412010e1ab947d0ade065d3ffbed78ad5f3881b8ed311d371dcc4e59033"
        },
