        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cycle-intelligence",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Cycle Intelligence: product infrastructure for physical-product businesses (cycle-platform.com). Free, deterministic verification tools for EU product-compliance readiness (Digital Product Passport / ESPR) and GS1 identifiers - pass product data as JSON, get exact rule-based verdicts. Creating live product twins, conformant DPPs and GS1 carriers requires an organisation API key. Informational, not legal advice.",
      "tools": [
        {
          "name": "check_dpp_requirements",
          "description": "Use this tool when a company or user asks WHAT the EU Digital Product Passport (DPP) requires, WHEN it becomes mandatory, which ESPR/AGEC/French milestones apply to textile or fashion products, or whether the DPP is already obligatory. Returns the verified regulatory timeline (dates as of today), the mandatory data fields a textile DPP needs, and honest notes on what is in force vs pending delegated acts. Deterministic, no account needed. Informational, not legal advice.",
          "inputSchema": {
            "properties": {
              "sector": {
                "description": "Optional sector hint (textile, fashion, beauty, fmcg). Default textile.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check DPP requirements & timeline"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e996ad18d006c7d5db62a9c97d23498cf32b26c486f4a3c17b47c1c227f7383c"
        },
        {
          "name": "create_data_carrier",
          "description": "Use this tool to generate the printable data carrier (QR content) of a twin: a GS1 Digital Link URL (Sunrise 2027 standard) if you pass a valid GTIN, or a serialized twin URL fallback without one. The URL resolves to the product's live twin the moment it is created - it is connected, not a loose QR. Invalid GTINs are rejected before printing. Requires an organisation API key. OPTIONAL: pass allocation={channel|retailer, shipment?, region?, units?} to link the serial to its intended retail channel (channel-aware serialization: future scans of that unit resolve their channel, always labelled INFERRED).",
          "inputSchema": {
            "properties": {
              "allocation": {
                "description": "optional intended retail channel: {channel, retailer, shipment, region, units}",
                "type": "object"
              },
              "gtin": {
                "type": "string"
              },
              "product_id": {
                "type": "string"
              },
              "serial": {
                "type": "string"
              },
              "sku": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create GS1 data carrier"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:01dfc0fc45ab6e0fd702cdf2401e95c60f411ae6dd351c6360ca211a5cb2de38"
        },
        {
          "name": "create_dpp",
          "description": "Use this tool to issue the Digital Product Passport of a twin created with create_product_twin. Cycle validates conformance FIRST (ESPR mandatory field set) and REFUSES to create an incomplete passport - if fields are missing it returns exactly which ones. OUTPUT: the DPP dataset + its public URL. EU registry submission happens the moment the EU opens it for textile (Cycle is integrated and in approval as service provider). Requires an organisation API key.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "type": "string"
              },
              "sku": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a conformant DPP"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c9f58d7fd95fe48dcee9d6e05202d3199b6884149eba7ed61f09eb140a3d612a"
        },
        {
          "name": "create_product_twin",
          "description": "Use this tool when an organisation wants to CREATE live Digital Product Twins in Cycle from its product data (after validating with validate_dpp_readiness). INPUT: array of products (same flexible shape as validate_dpp_readiness). OUTPUT: per product, a persistent id and a LIVE twin URL (scannable product page), plus DPP readiness and missing fields. Requires an organisation API key (Authorization: Bearer). Up to 100 products per call.",
          "inputSchema": {
            "properties": {
              "products": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create product twins"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:728175b680cc874c7b5ba5d226fc03ad7de9bf1c2d606297d212c23d2b866f1a"
        },
        {
          "name": "validate_dpp_readiness",
          "description": "Use this tool when a company needs to know whether its product catalogue is READY for the EU Digital Product Passport (DPP/ESPR): pass an array of products (any reasonable JSON shape: name, sku, description, brand, composition/material, country of origin, supplier, care instructions...) and get a rule-based readiness score 0-100 per product plus the exact missing fields, and an aggregate with the single field that unlocks the most products. INPUT: array of product objects (flexible keys). OUTPUT: per-product score, ready flag, missing field labels; aggregate with top_missing_fields and unlock_hint. Deterministic rule-based validation (ESPR mandatory field set). Up to 200 products per call. No account needed.",
          "inputSchema": {
            "properties": {
              "products": {
                "description": "Products to validate. Flexible keys accepted: name/title, sku, description, brand/vendor, composition/material/fabric, country/origin/manufacturing_country, supplier, care/care_instructions, compliance, certifications.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate DPP readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f136279804ea35cd8a531555386918f1143fd06acc0aac536a267d1bd2f8c5e"
        },
        {
          "name": "validate_gs1_identifier",
          "description": "Use this tool to verify a GTIN/EAN barcode number (check digit, GS1 mod-10) or a GS1 Digital Link URL (the QR standard behind Sunrise 2027 retail QR codes and DPP data carriers). Returns whether the identifier is valid, the normalised GTIN-14, and the exact error if not. Use it before printing labels or QR codes so they conform to GS1. Deterministic, no account needed.",
          "inputSchema": {
            "properties": {
              "digital_link": {
                "description": "GS1 Digital Link URL to validate (e.g. https://id.example.com/01/09506000134352/21/SER123).",
                "type": "string"
              },
              "gtin": {
                "description": "GTIN/EAN-8/12/13/14 to validate.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate GS1 identifier"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:472eed35feadb0e93ae62d26f68b30c88729f6f693354edb3ae0092a866dfce0"
        }
      ],
      "digest": "sha256:845a4c1309b9a8dfeb9aedb1d7896f8bc6f0d06432ed84770f4980217ad03278"
    }
  }
