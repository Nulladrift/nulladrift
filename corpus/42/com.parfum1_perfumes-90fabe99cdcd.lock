{
  "lockfileVersion": 2,
  "subjects": {
    "com.parfum1/perfumes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://parfum1.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "parfum1-perfumes",
        "title": "parfum1 Perfume API",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "parfum1 sells designer and niche perfumes as decants in 3, 10 and 30 ml (prices in EUR including VAT). Find a perfume with search_perfumes, read it with get_perfume (notes, every size with price and stock; the full bottle is always out of stock), browse houses with list_houses and get_house, and answer delivery, returns, payment and contact questions with get_store_info. Link customers to the product url in each answer; ordering happens on the website.",
      "tools": [
        {
          "name": "get_house",
          "title": "Get a perfume house",
          "description": "Read one perfume house by its handle: its introduction, the number of perfumes and the first 50 of them with starting price and stock. Use search_perfumes with the house for the rest.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "handle": {
                "description": "The house handle from list_houses, for example \"nishane\".",
                "maxLength": 200,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a perfume house"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1d485cbd77776813625b7d2ebe33aa334e86ab60b8d9ae388af55087dd01e88c"
        },
        {
          "name": "get_perfume",
          "title": "Get a perfume",
          "description": "Read one perfume by its handle: name, house, description, top, heart and base notes, and every size (3, 10 and 30 ml) with the price, the struck regular price, price per ml and whether it is in stock, exactly as the product page shows them, plus the full bottle (listed out of stock) and the product URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "handle": {
                "description": "The perfume handle from search_perfumes, for example \"hacivat-by-nishane\".",
                "maxLength": 200,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a perfume"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e4b9fa912ed16c9be8b86d180d734381731a7daa0abfd4c39d9e53d5be9bc0ec"
        },
        {
          "name": "get_store_info",
          "title": "Get store information",
          "description": "Read how parfum1 works, with the same facts as its help pages: delivery (dispatch, cost, countries), returns, payment methods, contact details and its own social profiles. Pass a topic for one, or none for all four.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "One of delivery, returns, payment, contact. Leave empty for all four.",
                "enum": ["delivery", "returns", "payment", "contact"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get store information"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a1d7809f189a83ed13a3871b1f349ca60d357f90d5a458c40fd300bdbdd3fa92"
        },
        {
          "name": "list_houses",
          "title": "List perfume houses",
          "description": "List the perfume houses in the catalogue, A to Z, with their handle, whether the house is a niche house, the number of perfumes and the house page URL. Optionally filter by words in the house name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Words in the house name, for example \"dior\".",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List perfume houses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e007483170bc879847d07bc4b997082990a69280f363ae9c7f7c74de0fa84aa1"
        },
        {
          "name": "search_perfumes",
          "title": "Search perfumes",
          "description": "Search the parfum1 catalogue by words in the perfume name, house or scent family (all words must match, accents ignored), optionally within one house. Returns a page of perfumes in popularity order with the starting price, stock, rating and product URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "house": {
                "description": "Only perfumes of this house: a house handle or name from list_houses, for example \"nishane\".",
                "maxLength": 100,
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number, starting at 1.",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 20,
                "description": "Perfumes per page, 1 to 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to find in the perfume name, house or scent family, for example \"oud\" or \"nishane hacivat\". Leave empty to list the catalogue.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search perfumes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:223ce3ba33e08e40ecbbf12ad68944e1a98fdae68fb37ff355836cf85aee639d"
        }
      ],
      "digest": "sha256:bbb2fe9f2d0842225d80c5af0cb4c60cbbeab5559d5d5aa1d653f35d5fc8b367"
    }
  }
}
