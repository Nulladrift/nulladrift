        {
          "name": "get_report",
          "title": "Get a weekly report",
          "description": "The weekly State of Agent Services report: coverage, probe results, payment networks, prices and purpose tags across everything we track. Counts and distributions only, with their method. Omit id for the latest published report; 'current' gives provisional week-to-date figures.",
          "inputSchema": {
