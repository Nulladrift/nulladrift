          "digest": "sha256:1d03db3264a5463926f4d234197ae524f427a5683984c584040f6c20eecac745"
        },
        {
          "name": "list_goods",
          "title": "List Squatch Stack goods",
          "description": "Browse the Squatch Stack shop (tees, hoodies, mugs and drinkware, hats, stickers, posters, totes, desk mats, stationery and accessories). Optional text search (matches a product's name or any of its design, colour or size options, and says which one matched) and kind filter. Prices in USD; tax and shipping are added at checkout.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "enum": ["tee", "hoodie", "mug", "drinkware", "hat", "sticker", "poster", "tote", "desk mat", "stationery", "accessory"],
                "type": "string"
              },
              "query": {
                "description": "Words to match in a name or in a design, colour or size option, e.g. 'hoodie', 'mug' or 'walk humbly'",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List Squatch Stack goods"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:58c5378df5cf12745d4bede80e1a8a6b31fcd4d3c6b4331976ab48be17aff03a"
        },
        {
