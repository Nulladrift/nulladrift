        },
        {
          "name": "contact_draft",
          "title": "Draft an email to the studio",
          "description": "Make a ready-to-send email link (mailto) to Squatch Stack with a fitting subject and body. It sends nothing; the person opens it in their mail app.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "summary": {
                "description": "One or two lines about what they want, placed in the body",
                "maxLength": 400,
                "type": "string"
              },
              "topic": {
                "default": "project",
                "enum": ["project", "press", "note"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Draft an email to the studio"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b9efb135b8168a0b5d5056ed5c87f96953cd675661cc2e63de3250ce9064b710"
        },
        {
          "name": "get_good",
          "title": "Get one product",
          "description": "Details for one Squatch Stack product by slug: description, every variant (design, color or size) with its variant_id and price.",
