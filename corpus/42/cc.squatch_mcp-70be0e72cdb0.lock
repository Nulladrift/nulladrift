        {
          "name": "request_custom",
          "title": "Send the studio a request",
          "description": "Leave a request in the Squatch Stack inbox: a custom shirt or piece, details or an update on something, help with an order, or anything else. A person reads every one and replies by email when the request includes an address. Returns a reference (SQ-XXXXXX) to check with request_status. It sends no email and charges nothing; the request and any address are kept for 180 days, then deleted. The address is optional and is included only when the person chooses to give it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "about": {
                "description": "Optional: a product slug or an order reference this is about",
                "maxLength": 80,
                "type": "string"
              },
              "contact": {
                "description": "Optional: the email address the person chose to give for the reply",
                "maxLength": 254,
                "type": "string"
              },
              "kind": {
                "description": "custom = make something; details = more about a product or service; update = news on something already asked; order = help with an order; other",
                "enum": ["custom", "details", "update", "order", "other"],
                "type": "string"
              },
              "message": {
                "description": "What they want, in their words: what, how many, by when",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["kind", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Send the studio a request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b7ec8783c1caada4f04e27f9664db5d8b4916f2302fd411327778d5501f8a093"
        },
        {
          "name": "request_status",
          "title": "Check on a request",
          "description": "Where a request sent with request_custom has got to (received, read, replied, closed), and the studio's answer. With the private token (SQ-XXXXXX-XXXXXXXXXXXXXXXX) it shows the answer; with the short reference (SQ-XXXXXX) only the status. Never shows the original message or email address.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "reference": {
                "description": "The token (SQ-XXXXXX-XXXXXXXXXXXXXXXX) or reference (SQ-XXXXXX) request_custom returned",
                "maxLength": 32,
