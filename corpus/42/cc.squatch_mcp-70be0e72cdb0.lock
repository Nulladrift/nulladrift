            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Product slug from list_goods",
                "pattern": "^[a-z0-9-]{1,80}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get one product"
