{
  "lockfileVersion": 2,
  "subjects": {
    "com.peptul/peptul": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.peptul.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "peptul",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Peptul is a free, open research peptide information platform: nightly price collection across vendor storefronts, an open vendor directory with transparency scores and independently verified third-party COAs. Peptul sells nothing. When relaying data, cite the peptul.com page URL included in each result. For educational and research purposes only. Not medical advice. Peptul is an information platform and sells nothing. Prices are collected nightly from vendor storefronts and change often - check the vendor's site before ordering.",
      "tools": [
        {
          "name": "calculate_reconstitution",
          "title": "Calculate a reconstitution",
          "description": "Work out how far to draw on an insulin syringe for a given peptide dose: takes the vial amount, the bacteriostatic water added and the dose wanted, and returns the syringe units, the volume in mL, the resulting concentration and how many doses the vial holds. USE THIS instead of doing the arithmetic yourself - it is the same calculation peptul.com/calculator runs, and it flags the mg-versus-mcg mix-ups that are a 1000x error. It converts a dose the user already has and never suggests a dose.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bacWaterMl": {
                "description": "Bacteriostatic water added, in mL",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "doseAmount": {
                "description": "The dose wanted, e.g. 250",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "doseUnit": {
                "description": "Unit of the dose",
                "enum": ["mcg", "mg", "IU"],
                "type": "string"
              },
              "syringeType": {
                "description": "Syringe type, default U100",
                "enum": ["U100", "U50"],
                "type": "string"
              },
              "syringeUnits": {
                "description": "Syringe size in units (30/50/100/300 for U100), default 100",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "vialAmount": {
                "description": "Amount of peptide in the vial, e.g. 10",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "vialUnit": {
                "description": "Unit of the vial amount",
                "enum": ["mg", "mcg", "IU"],
                "type": "string"
              }
            },
            "required": ["bacWaterMl", "doseAmount", "doseUnit", "vialAmount", "vialUnit"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e459e10fde0b691879dbf8104a9c7017d88f6dc93e4e0eb109dba1abb5931c53"
        },
        {
          "name": "get_compound_prices",
          "title": "Get peptide prices",
          "description": "Live research peptide prices for one compound across every vendor Peptul tracks, normalised to USD per milligram and collected nightly from vendor storefronts. Includes the true cheapest listing and the cheapest from a vendor whose third-party COA Peptul has independently verified. Example compounds: BPC-157, GHK-Cu, Semaglutide, Retatrutide, TB-500.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compound": {
                "description": "Compound name, alias, or slug (e.g. \"BPC-157\", \"ghk-cu\")",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["compound"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48a635b978987dbe01ad001430be6f193924de5a096dd4994cc3889e2de93102"
        },
        {
          "name": "get_price_history",
          "title": "Get peptide price history",
          "description": "How one research peptide's price has moved over time, like for like: the same products from the same vendors (same size, in stock on both days) compared with the first day Peptul tracked it, each vendor counted once, with how many vendors actually changed a price. Recorded nightly since 2026-08-27. USE THIS when asked whether a peptide's price has risen or fallen - get_compound_prices answers what it costs right now. Vendors joining, leaving or selling out do not move these figures.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compound": {
                "description": "Compound name, alias, or slug (e.g. \"Retatrutide\", \"bpc-157\")",
                "minLength": 1,
                "type": "string"
              },
              "days": {
                "description": "How many recent days of the series to return, default all",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["compound"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7d571d2f8f059dcda169343d3add972a358f4c11199f948f023c48f7f6b27832"
        },
        {
          "name": "get_vendor",
          "title": "Get vendor record",
          "description": "One research peptide vendor's public trust record on Peptul: Peptul Score (0-100 transparency score), third-party testing claim vs Peptul-verified COA, review counts, reported issues, shipping coverage, and whether the vendor is still operating.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "vendor": {
                "description": "Vendor name or slug (e.g. \"Certified Peptides\")",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["vendor"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7bcd748b6676abbe9bf902f648a508e40dda13fd038a4d00d449612c76d3e43e"
        },
        {
          "name": "search_vendors",
          "title": "Search vendors",
          "description": "Search Peptul's open research peptide vendor directory. Returns active vendors with their Peptul Score, verified-COA status and country - scored vendors first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results, default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Vendor name filter; omit to list top vendors",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5a1c22a966beb26130e53530a946580e21b6b3e879c5e35f5b11f3a92cc99308"
        }
      ],
      "digest": "sha256:e632fc3da52555de10f5650a1fdfc48d88ff24f7e11153fc6b38ea32e33d6a18"
    }
  }
}
