{
  "lockfileVersion": 2,
  "subjects": {
    "app.ferryman.telo/telo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.incubator.blynkai.app/v1/health/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Telo",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "daily_score",
          "description": "Read daily health metrics and scores across up to 365 dates, 100 records per page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "title": "Cursor",
                "type": "string"
              },
              "from": {
                "format": "date",
                "title": "From",
                "type": "string"
              },
              "to": {
                "format": "date",
                "title": "To",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "title": "DailyScoreInput",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "McpDailyHealthSummarySchema": {
                "additionalProperties": false,
                "properties": {
                  "readiness": {
                    "$ref": "#/$defs/McpReadinessSchema"
                  },
                  "record_date": {
                    "format": "date",
                    "title": "Record Date",
                    "type": "string"
                  },
                  "recovery": {
                    "$ref": "#/$defs/McpRecoverySchema"
                  },
                  "sleep": {
                    "$ref": "#/$defs/McpSleepSchema"
                  },
                  "strain": {
                    "$ref": "#/$defs/McpStrainSchema"
                  }
                },
                "required": ["readiness", "record_date", "recovery", "sleep", "strain"],
                "title": "McpDailyHealthSummarySchema",
                "type": "object"
              },
              "McpReadinessSchema": {
                "additionalProperties": false,
                "properties": {
                  "score": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "准备度评分",
                    "title": "Score"
                  }
                },
                "required": ["score"],
                "title": "McpReadinessSchema",
                "type": "object"
              },
              "McpRecoverySchema": {
                "additionalProperties": false,
                "properties": {
                  "hrv": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/QuantifiedMetricSchema"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "HRV"
                  },
                  "resting_hr": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/QuantifiedMetricSchema"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "静息心率"
                  },
                  "score": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "恢复评分；服务端派生值",
                    "title": "Score"
                  }
                },
                "required": ["hrv", "resting_hr", "score"],
                "title": "McpRecoverySchema",
                "type": "object"
              },
              "McpSleepSchema": {
                "additionalProperties": false,
                "properties": {
                  "deep_sleep_duration": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/QuantifiedMetricSchema"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Deep 睡眠时长"
                  },
                  "light_sleep_duration": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/QuantifiedMetricSchema"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "浅睡时长（Light/Core Sleep）"
                  },
                  "rem_sleep_duration": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/QuantifiedMetricSchema"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "REM 睡眠时长"
                  },
                  "score": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "睡眠评分；服务端派生值",
                    "title": "Score"
                  },
                  "total_sleep_duration": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/QuantifiedMetricSchema"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "总睡眠时长，不含清醒时长；可包含未分类睡眠"
                  }
                },
                "required": ["deep_sleep_duration", "light_sleep_duration", "rem_sleep_duration", "score", "total_sleep_duration"],
                "title": "McpSleepSchema",
                "type": "object"
              },
              "McpStrainSchema": {
                "additionalProperties": false,
                "properties": {
                  "active_energy": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/QuantifiedMetricSchema"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "活动消耗"
                  },
                  "exercise_time": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/QuantifiedMetricSchema"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Apple Exercise Time"
                  },
                  "score": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "负荷评分；服务端派生值",
                    "title": "Score"
                  }
                },
                "required": ["active_energy", "exercise_time", "score"],
                "title": "McpStrainSchema",
                "type": "object"
              },
              "QuantifiedMetricSchema": {
                "description": "统一度量对象：所有可量化指标统一使用 value + unit 结构。",
                "properties": {
                  "unit": {
                    "description": "标准化单位",
                    "title": "Unit",
                    "type": "string"
                  },
                  "value": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "结构化数值；无法确定时为 null",
                    "title": "Value"
                  }
                },
                "required": ["unit"],
                "title": "QuantifiedMetricSchema",
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "from": {
                "format": "date",
                "title": "From",
                "type": "string"
              },
              "items": {
                "items": {
                  "$ref": "#/$defs/McpDailyHealthSummarySchema"
                },
                "title": "Items",
                "type": "array"
              },
              "next_cursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Next Cursor"
              },
              "to": {
                "format": "date",
                "title": "To",
                "type": "string"
              }
            },
            "required": ["from", "items", "next_cursor", "to"],
            "title": "DailyScoreOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["health:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:08894aeb81ffd3ddc4fbf04b5c667a261e7095d2be9b13737926f52bab80aba4"
        },
        {
          "name": "query_health_events",
          "description": "Read structured health events for up to 365 dates in an IANA time zone.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "title": "Cursor",
                "type": "string"
              },
              "event_type": {
                "enum": ["activity.exercise", "biomarker.apob", "biomarker.blood_pressure", "biomarker.checkup_report", "biomarker.comprehensive_panel", "biomarker.cortisol", "biomarker.custom", "biomarker.fasting_insulin", "biomarker.heart_rate", "biomarker.hrv", "biomarker.uric_acid", "body.face", "body.skin", "body.tongue", "body.weight", "env.custom", "env.high_altitude", "env.long_flight", "lifestyle.sexual_activity", "lifestyle.smoking", "meal.breakfast", "meal.custom", "meal.dinner", "meal.drink", "meal.lunch", "meal.snack", "protocol.custom", "protocol.hyperbaric", "protocol.ice_bath", "protocol.meditation", "protocol.red_light", "protocol.sauna", "sleep.session", "supp.alcohol", "supp.caffeine_supplement", "supp.creatine", "supp.magnesium", "supp.medication", "supp.melatonin", "supp.nmn", "supp.omega3", "supplement.custom", "symptom.brain_fog", "symptom.custom", "symptom.fatigue", "symptom.high_energy", "symptom.mood"],
                "maxLength": 100,
                "minLength": 1,
                "title": "Event Type",
                "type": "string"
              },
              "from": {
                "format": "date",
                "title": "From",
                "type": "string"
              },
              "timezone": {
                "title": "Timezone",
                "type": "string"
              },
              "to": {
                "format": "date",
                "title": "To",
                "type": "string"
              }
            },
            "required": ["from", "timezone", "to"],
            "title": "HealthEventInput",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "McpEventTypeSchema": {
                "additionalProperties": false,
                "properties": {
                  "code": {
                    "title": "Code",
                    "type": "string"
                  }
                },
                "required": ["code"],
                "title": "McpEventTypeSchema",
                "type": "object"
              },
              "McpLifeEventSchema": {
                "additionalProperties": false,
                "properties": {
                  "event_type": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/McpEventTypeSchema"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "happened_at": {
                    "format": "date-time",
                    "title": "Happened At",
                    "type": "string"
                  },
                  "metrics": {
                    "additionalProperties": true,
                    "title": "Metrics",
                    "type": "object"
                  },
                  "source_urls": {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "title": "Source Urls",
                    "type": "array"
                  }
                },
                "required": ["event_type", "happened_at", "metrics", "source_urls"],
                "title": "McpLifeEventSchema",
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "$ref": "#/$defs/McpLifeEventSchema"
                },
                "title": "Items",
                "type": "array"
              },
              "next_cursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Next Cursor"
              }
            },
            "required": ["items", "next_cursor"],
            "title": "HealthEventOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["health:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:15421b3d5a63930959a3ac79c147192bf92a453694838e868d2e0ea6d4261d38"
        }
      ],
      "digest": "sha256:bffcf208a5a31fe39bda590ed26e588dc120be8b13b4ee054cfe28b484583b7d"
    }
  }
}
