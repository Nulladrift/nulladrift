  "subjects": {
    "com.appstoretracker/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.appstoretracker.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "appstoretracker-mcp",
        "title": "App Store Tracker",
        "version": "1.0.0",
        "websiteUrl": "https://www.appstoretracker.com",
        "icons": [
          {
            "src": "https://www.appstoretracker.com/favicon/android-chrome-192x192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "prompts": {},
        "tools": {}
      },
      "instructions": "App Store Tracker (https://www.appstoretracker.com) tracks iOS App Store top free charts, app listings, ratings, reviews, keyword positions, ads and revenue estimates across many storefronts. Top paid and top grossing charts are not collected. Revenue and download figures are estimates.\n\nStart with search_apps to turn an app name into an app_id (the App Store numeric id); every per-app tool takes it. Use get_categories to find a category_id, then get_rankings for a country chart.\n\nPer app: get_app_details (current snapshot), get_ranking_history (chart position over time), get_timeline (listing changes), get_revenue_history (monthly estimates), get_keywords (search terms it ranks for), get_ads (ad creatives), get_reviews, get_similar_apps (competitors).\n\nsearch_designs finds real iPhone app screens that App Store Tracker captured itself, by describing them; cite each result's page_url. list_design_apps lists the apps those screens come from, by category, name or design category. get_app_flow gives one app's flows in order, step by step, with its animation clips cut into still frames and the app's walkthrough recordings; it needs a Social Growth Engineers subscription.\n\nget_web_funnels shows the web-to-app funnels we recorded (landing page, quiz, email gate, paywall, with screenshots and prices) for an app_id or a landing host; an ad's landingDomain from get_ads can be passed as host. search_web_funnels finds funnels by words, builder or how they end.\n\nget_removed_apps lists apps that disappeared from the App Store, with their revenue before removal and whether they came back; it needs a Social Growth Engineers subscription.\n\nget_tracked_apps, get_keyword_watchlist and add_to_watchlist use the signed-in account; add_to_watchlist is the only tool that writes to the account. Country arguments are two-letter storefront codes and default to us.\n\nWhen no tool can answer what the user asked, a result is wrong or missing data, or the user wishes the server did something, call send_feedback with what they wanted in a sentence, then carry on. It works even after the monthly limit.\n\ntools/call needs the user signed in; initialize and tools/list work without it. The server supports MCP OAuth sign-in: a client given only the URL gets a 401 whose WWW-Authenticate header points to sign-in, and the user signs in and clicks Allow. In Claude Code that is /mcp → appstoretracker → Authenticate. An API key sent as \"Authorization: Bearer sk_mcp_...\" also works and is optional; keys are for scripts and clients without sign-in, created at /account/api, where signed-in clients are listed too.",
      "tools": [
        {
          "name": "add_to_watchlist",
          "title": "Add app to watchlist",
          "description": "Add an app to your watchlist, and with a keyword_id also track that keyword for the app. A keyword is tracked only for an app on your watchlist. Needs an API key bound to an account.",
          "inputSchema": {
            "properties": {
              "app_id": {
                "description": "App Store ID of the app to watch",
                "type": "integer"
              },
              "country_code": {
                "default": "us",
                "description": "Two-letter storefront code (default: \"us\"); with keyword_id it must match the keyword's storefront",
                "type": "string"
              },
              "keyword_id": {
                "description": "Keyword uuid to track for the app (optional; from the keyword tools)",
                "type": "string"
              }
            },
            "required": ["app_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e0b9b8fbd9887e3ca7993e12fb0e6c0b95d53599a93a89909ee4297f78d05650"
        },
        {
          "name": "get_ads",
          "title": "Get ads",
          "description": "Get the ad creatives one iOS app is running, with the ad library each came from and how many that library holds for the app. An ad's landingDomain (the host of its linkUrl) can be passed as host to get_web_funnels to see the recorded web funnel that ad sends people to.",
          "inputSchema": {
            "properties": {
              "app_id": {
                "description": "App Store ID (numeric ID from the app URL)",
                "type": "integer"
              },
              "limit": {
                "default": 30,
                "description": "About how many ads a page holds (1-100, default: 30). Copies of one creative merge into one ad, so a page can hold more or fewer.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Where the page starts, counted in stored ad entries rather than ads (default: 0). For the next page, pass meta.nextOffset.",
                "minimum": 0,
                "type": "integer"
              },
              "platform": {
                "description": "Narrow to one ad library",
                "enum": ["meta", "google", "apple"],
                "type": "string"
              }
            },
            "required": ["app_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:facbe2ff2e085cbc4cda4797d7c6446409fccefd1c0b2135744f2a5913856266"
        },
        {
          "name": "get_app_details",
          "title": "Get app details",
          "description": "Get the listing for one iOS app by app_id: name, developer, subtitle, description, version, price, languages, content rating, screenshot URLs, an AI-written short summary, plus the storefront's rating and rating count, its latest recorded chart position (and the one before it), and the latest revenue and downloads estimate. Use this for a single app's current snapshot; use get_ranking_history for positions over time, get_revenue_history for estimates over time and get_timeline for listing changes. Errors with 'App not found' when the id is not in our data. Get the id from search_apps. For several apps (a chart, a competitor list) pass app_ids instead of calling once per app.",
          "inputSchema": {
            "properties": {
              "app_id": {
                "description": "App Store ID (numeric ID from the app URL)",
                "type": "integer"
              },
              "app_ids": {
                "description": "Up to 25 App Store IDs in one call instead of app_id, e.g. every app of a get_rankings chart. Answers { items: [{ app_id, data } or { app_id, error }] }. Each app counts as one call against the monthly limit.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 25,
                "type": "array"
              },
              "country": {
                "default": "us",
                "description": "Two-letter country code (default: \"us\")",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05e49ac6b6bab8970214dc2cacf1657a002414bcba6c2cd8eb64677cd7bd94da"
        },
        {
          "name": "get_app_flow",
          "title": "Get an app's flows in order",
          "description": "Get one app's captured flows (onboarding, paywall, features...) in the order a user meets them, every screen numbered by step with its name, summary, on-screen text, main button and image, so a flow can be rebuilt screen by screen. The first page also gives walkthroughs: the app's full session recordings, one MP4 per part (guest, signed-in, sign-up...). Each flow gives its animation clips and, on some older captures only, a recording of that flow alone. Every animation clip and flow recording is an MP4 with still frames (frames: time in seconds and image URL) so the motion can be seen without playing the video; frames is empty for a clip not cut into stills yet. Flows come in recording order and keep their flow_no whatever the filter; use pattern for one kind (onboarding is usually what to copy first) or flow_no for one flow. Get the app_id from list_design_apps or search_designs. Needs an active Social Growth Engineers subscription; other keys are refused.",
          "inputSchema": {
            "properties": {
              "app_id": {
                "description": "App Store ID of an app we captured (from list_design_apps or search_designs)",
                "type": "integer"
              },
              "flow_no": {
                "description": "Only this flow (its flow_no from a previous answer)",
                "minimum": 1,
                "type": "integer"
              },
              "frames": {
                "default": true,
                "description": "Include the still frames of each clip (default: true)",
                "type": "boolean"
              },
              "limit": {
                "default": 3,
                "description": "Flows per page (1-10, default: 3)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Flows to skip, for the next page (use next_offset)",
                "minimum": 0,
                "type": "integer"
              },
              "pattern": {
                "description": "Only flows of this category. Default: all",
                "enum": ["onboarding", "paywall", "features", "other"],
                "type": "string"
              }
            },
            "required": ["app_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cfd00b41797d4141eef795de87555f044f688d9f25652de360f420e7aa38c288"
        },
