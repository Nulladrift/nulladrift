        {
          "name": "search_web_funnels",
          "title": "Search web funnels",
          "description": "Search the web-to-app funnels App Store Tracker recorded by words on their screens and prices (every word must appear as written, so \"week trial\" finds \"1-week trial\" while \"weekly trial\" does not; \"$6.99\", \"lose weight\"), by funnel builder (funnelfox, appbox, heyflow, custom), by how the funnel ended (paywall, checkout, email gate, App Store redirect), by a screen category or by a screen type (step_type email finds funnels that ask for an email). When no funnel has every word, funnels with any of the words come back instead, those matching the most words first, and the answer says matched: \"any_word\" (otherwise \"all_words\"): check matched_steps before treating them as exact. Each app (or host, for a web-only funnel) appears once, as its best recording; other_recordings counts the repeats left out. Complete funnels (ended on a paywall, checkout, email gate or App Store redirect, more than 2 steps) and those with prices come first, newest breaks ties. Each item gives the funnel's app and host, builder, end, prices (period is the billing unit as recorded, raw the screen text to check it against), step count and up to 3 matching screens; get_web_funnels with its host or app_id shows every screen. sort revenue ranks them by the app's revenue estimate instead (we hold no funnel conversion rates). Covers only the funnels we recorded.",
          "inputSchema": {
            "properties": {
              "builder": {
                "description": "Funnel builder, e.g. funnelfox, appbox, heyflow, custom",
                "type": "string"
              },
              "end_kind": {
                "description": "How the recording ended",
                "enum": ["paywall", "checkout", "email_gate", "store_redirect", "stuck", "error"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Funnels per page (1-50, default: 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Funnels to skip, for the next page (use next_offset; at most 500)",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "pattern": {
                "description": "Only funnels with a screen of this category: onboarding (quiz, questions, email) or paywall (paywall, checkout, upsell)",
                "enum": ["onboarding", "paywall", "other"],
                "type": "string"
              },
              "query": {
                "description": "Words to find on the funnel's screens, prices, builder or host, in any order; all must appear, or any when no funnel has all (at most 200 characters)",
                "type": "string"
              },
              "sort": {
                "default": "match",
                "description": "match (default): best match first. revenue: the app's newest worldwide monthly revenue estimate first, shown as revenue_estimate (USD); a stand-in for which funnels pay, since we hold no funnel conversion data",
                "enum": ["match", "revenue"],
                "type": "string"
              },
              "step_type": {
                "description": "Only funnels with a screen of this type, e.g. email (asks for an email), question_multi, upsell",
                "enum": ["landing", "question_single", "question_multi", "input", "info", "loader", "email", "paywall", "checkout", "upsell", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9bcf179299f92e8c194da2979bb95dc0425c9752511b061eca4a433605676559"
        },
        {
