        {
          "name": "get_ranking_history",
          "title": "Get ranking history",
          "description": "Get one app's top-free chart position per day in one storefront, as ranking_position and created_at points. The chart is the overall chart (category_id 36) when the app holds as many days there as in its own category over the asked span, otherwise its category chart, so a different span can answer from a different chart; category_id in the answer names it. Look back 1 to 3650 days (default 30). Use it for trends and for explaining a move; use get_rankings for a whole chart on one day. Top paid and top grossing history is not collected.",
          "inputSchema": {
            "properties": {
              "app_id": {
                "description": "App Store ID of the app",
                "type": "integer"
              },
              "country": {
                "default": "us",
                "description": "Two-letter country code (default: \"us\")",
                "type": "string"
              },
              "days": {
                "default": 30,
                "description": "Number of days of history (1-3650, default: 30)",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["app_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a7984357de2fa34aad706197aa0463dd7fdcebdcefd1f60a7a6353cfc0f8809e"
        },
        {
          "name": "get_rankings",
          "title": "Get top chart rankings",
          "description": "Get the App Store top free chart for a country, in chart order with #1 first: the overall chart by default, or one category via category_id (see get_categories). Each app comes with its position, previous position, name, developer, rating and revenue and download estimates, and the response gives the chart day it describes. Only top free is collected; top paid and top grossing are not. Use get_ranking_history for how one app's position moved over time.",
          "inputSchema": {
            "properties": {
              "category_id": {
                "description": "App Store category ID (default: \"36\", the overall chart; e.g. \"6015\" for Finance, \"6014\" for Games). get_categories lists them.",
                "type": "string"
              },
              "chart": {
                "default": "top_free",
                "description": "Which chart. Only top_free is collected (top paid and top grossing are not, and return no items), so this is the default and the only option.",
                "enum": ["top_free"],
                "type": "string"
              },
              "country": {
                "default": "us",
                "description": "Two-letter country code (default: \"us\")",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "description": "Maximum number of results (1-200, default: 100)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:596e076393023a010ed469f2580a81631929d9593f92c7dd52dda0885d568d7a"
        },
        {
          "name": "get_removed_apps",
          "title": "Get removed apps",
          "description": "List iOS apps that once charted and have disappeared from the App Store, biggest revenue first, updated daily. Each item has the name, developer, category, best chart rank and the store it reached it in, the worldwide monthly revenue and downloads estimates from before the removal (5000 or less means under 5K), first release and last update dates, removed_on (the day we found it gone, not the day Apple acted), restored_on when it came back, and developer_gone when Apple lists no live apps from that developer. The answer also gives totals for the whole list. Needs an active Social Growth Engineers subscription; other keys are refused.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "App Store category name, e.g. \"Games\", \"Finance\". An unknown name is refused and the error lists the valid ones",
                "type": "string"
              },
              "country": {
                "description": "Two-letter code of the store where the app reached its best rank",
                "type": "string"
              },
              "developer_gone": {
                "description": "Only apps whose developer has no live apps left",
                "type": "boolean"
              },
              "dir": {
                "description": "Sort direction. Default: biggest, best rank, most recent or A to Z, to suit the sort",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Apps per page (1-100, default: 25)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Apps to skip, for the next page (use next_offset)",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words in the app's or developer's name (at most 200 characters)",
                "type": "string"
              },
              "sort": {
                "default": "revenue",
                "description": "What to sort by",
                "enum": ["name", "category", "revenue", "downloads", "rank", "released", "updated", "removed"],
                "type": "string"
              },
              "status": {
                "default": "gone",
                "description": "gone: still missing. back: returned to the store",
                "enum": ["gone", "back"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:748565221da535f290fb2bdead176b7950f410fe00deec9eefb1a4eaa98889e6"
        },
        {
          "name": "get_revenue_history",
          "title": "Get revenue history",
          "description": "Get the worldwide monthly downloads and revenue estimates for one iOS app, one point per data month (dated its first day). Values are Sensor Tower buckets; downloadsFloor/revenueFloor mark the stored 1,000, which means \"< 5K\", not an exact figure. missing_months lists the months between the first and the last point for which we hold no estimate: a gap in our data, not a zero. For several apps pass app_ids instead of calling once per app.",
          "inputSchema": {
            "properties": {
              "app_id": {
                "description": "App Store ID (numeric ID from the app URL)",
                "type": "integer"
              },
              "app_ids": {
                "description": "Up to 25 App Store IDs in one call instead of app_id, e.g. every app of a get_rankings chart. Answers { items: [{ app_id, data } or { app_id, error }] }. Each app counts as one call against the monthly limit.",
                "items": {
                  "type": "integer"
                },
                "maxItems": 25,
                "type": "array"
              },
              "range": {
                "default": "all",
                "description": "How many data months to return, newest last: 30d = the newest month, 90d = the newest 3, 1y = the newest 12, all = everything",
                "enum": ["30d", "90d", "1y", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:15fa9ce2eb872a7d8a155387bebb9206ce73b3fa841275a34e584fc52c3b8e92"
        },
