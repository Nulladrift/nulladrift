        {
          "name": "search_designs",
          "title": "Search app designs",
          "description": "Search real iPhone app screens that App Store Tracker captured itself (the library at /designs) by describing what you want to see, e.g. \"paywall with a free trial toggle and the yearly plan preselected\", \"onboarding that asks for the user's goals\", \"notification permission pre-prompt\". Describe one screen in plain words; narrow with pattern or app_id rather than with negations or keyword lists. Ranked by meaning, with exact on-screen words counting extra, and at most per_app screens per app; in deep mode (the default) a model then reads the top 40 and puts the screens that really show what was asked first, each with match true, the rest after with match false. Each item gives the app_id for every per-app tool, the flow and screen it belongs to, a short summary, the image URL and the App Store Tracker page to cite. Covers only the apps we captured, not the whole App Store; an empty list means none of those matched.",
          "inputSchema": {
            "properties": {
              "app_id": {
                "description": "Only this app's screens (App Store ID, from search_apps)",
                "type": "integer"
              },
              "limit": {
                "default": 8,
                "description": "Screens per page (1-20, default: 8)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "default": "deep",
                "description": "deep (default): a model checks the top results against the query and moves the real matches first; standard: search order only, a little faster",
                "enum": ["deep", "standard"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Screens to skip, for the next page (use next_offset; at most 500, enough for every screen of one app)",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "pattern": {
                "description": "Only screens of this category: onboarding, paywall (paywall & subscription), features (the app itself after first run) or other (settings, account, help...). Default: any",
                "enum": ["onboarding", "paywall", "features", "other"],
                "type": "string"
              },
              "per_app": {
                "default": 2,
                "description": "Most screens from one app (1-5, default: 2; ignored with app_id)",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the screen shows, in plain language (at most 300 characters)",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
