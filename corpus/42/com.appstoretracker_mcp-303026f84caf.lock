        {
          "name": "get_keywords",
          "title": "Get keywords",
          "description": "Get the App Store search terms one iOS app is collected as ranking for in one storefront, with its position, the day that position was observed, and popularity: Apple's own search popularity for the term in that storefront, 1-100, or null when unknown.",
          "inputSchema": {
