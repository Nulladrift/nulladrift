        {
          "name": "edgegap_deploy",
          "title": "Deploy a game server",
          "description": "Start one authoritative dedicated game server from an application version, placed near the players you specify. The server owns the game state, so no player hosts it. Returns immediately with a request_id; the server is still starting and has no connection details yet. Follow this call with edgegap_wait_for_deployment to get the address players connect to. Always stop deployments you started for testing. Every deployment is tagged \"edgegap-mcp\" in addition to any tags you pass, so edgegap_list_deployments with only_agent_deployments: true finds them all. Runs until stopped or until the version's max_duration, which the result reports. Refused, with nothing sent, if the API token appears in an env var or tag, if the version uses the \"latest\" docker tag, or when too many agent deployments are already running (EDGEGAP_MAX_AGENT_DEPLOYMENTS, default 5): stop finished ones first. Also refused when the version's max_duration is unlimited or above EDGEGAP_MAX_DURATION_MINUTES, unless allow_long_running is true (ask the developer first), and on the local server after EDGEGAP_MAX_DEPLOYS_PER_RUN deploys (default 20). Env vars named like secrets are hidden in the dashboard. Optional: webhooks Edgegap calls when the server is ready, errors or ends, require_cached_locations for faster starts, and private_host_ids to place it on your private fleet first. Backend code that deploys (POST /v2/deployments, 40/s per organization) should track servers with these webhooks, not by polling status (20/s for the whole organization); webhooks are not retried or signed, so keep polling as a fallback only.",
