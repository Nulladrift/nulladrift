              "filters": {
                "description": "Omit for all deployments.",
                "items": {
                  "properties": {
                    "field": {
                      "enum": ["status", "request_id", "tags", "created_at", "application", "version", "fleet_name", "host_name"],
                      "type": "string"
                    },
                    "operator": {
                      "enum": ["eq", "neq", "in", "nin", "gte", "lte", "ilike"],
                      "type": "string"
                    },
                    "value": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      ],
                      "description": "A string, or an array of strings for in/nin. created_at is ISO 8601, e.g. \"2026-09-30T00:00:00Z\"."
                    }
                  },
                  "required": ["field", "operator", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "limit": {
                "description": "1-100. Default 50.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "only_agent_deployments": {
                "description": "Only deployments started through this server: tagged \"edgegap-mcp\", or \"mcp\" by versions up to 0.3.3. Cannot be combined with a tags filter.",
                "type": "boolean"
              },
              "order_by": {
                "description": "e.g. [{field:\"created_at\",order:\"asc\"}] for oldest first.",
