        {
          "name": "edgegap_get_registry_credentials",
          "title": "Get Edgegap container registry push credentials",
          "description": "Get the push login for this organization's private Edgegap container registry (registry.edgegap.com) and the exact docker login, build and push commands for your image. Use this when the server image is not in a registry yet. Edgegap only hands these credentials to the quick-start token the Unity/Unreal plugins use; with a regular API token or Edgegap sign-in this tool cannot fetch them and instead returns the steps to copy them from the dashboard's Container Registry page — ask the developer for them then, do not retry. When it does return a token, it is registry-scoped (push/pull images in this project), not the org API token: pass it to docker login via --password-stdin, never as a command-line argument, and do not write it into files. Call edgegap_validate_server_config before building. Any other registry Edgegap can pull from (Docker Hub, GHCR, ECR, GitLab) works too: then skip this tool and pass that registry and its pull login to edgegap_create_app_version.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "image_name": {
                "description": "Image name without project or tag, e.g. \"my-game-server\". Used to build the commands.",
                "pattern": "^[a-z0-9]+([._-][a-z0-9]+)*$",
                "type": "string"
              },
              "tag": {
                "description": "Unique build tag for the commands, e.g. a build ID. Never \"latest\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
