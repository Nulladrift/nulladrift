        {
          "name": "edgegap_list_deployments",
          "title": "List running deployments",
          "description": "List active deployments, optionally filtered and sorted. Use this to find deployments left running from earlier sessions before starting new ones — orphaned servers cost money. Backend code: the list API is limited to 10 requests/s per organization, so reconcile on a schedule, not per match. Filter by status, application, version, tags, request_id, created_at, fleet_name or host_name, e.g. [{field:\"application\",operator:\"eq\",value:\"my-game\"},{field:\"status\",operator:\"eq\",value:\"ready\"}]. Operators: eq and neq on every field except created_at (eq, gte, lte); in and nin with an array value on request_id, tags, application, version, fleet_name, host_name; ilike with % wildcards on fleet_name and host_name. At most one filter per field. Sort by created_at or available_session_sockets. To find every deployment an agent started through this server, pass only_agent_deployments: true (the same as filtering tags in [\"edgegap-mcp\", \"mcp\"]).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
