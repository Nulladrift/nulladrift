        {
          "name": "edgegap_create_app_version",
          "title": "Create an application version",
          "description": "Register a container image as a deployable version of an application. The image must already be pushed to a registry that Edgegap can pull from (see edgegap_get_registry_credentials and edgegap_list_registry_tags). Resource units: 1024 cpu units = 1 vCPU; memory_mb must be at least 256 and at most double the cpu units. Set verify_image true on the first version so a bad image fails here rather than at deploy time. Refused, with nothing sent, for the \"latest\" or an empty docker tag (use a build ID so deployments are reproducible) and for a docker_image that also holds a registry host or tag. Env vars named like secrets (TOKEN, SECRET, PASSWORD, API_KEY…) are hidden in the dashboard. Images on registry.edgegap.com need no registry login: leave registry_username and registry_token out and the version gets the organization's own registry login (registry_profile \"Edgegap\"). When copying an existing version, copy only non-secret settings: the API returns \"This value is set and encrypted\" for its registry login and secret env values, and that placeholder is refused here.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "application": {
                "description": "Existing application name.",
                "type": "string"
              },
              "cpu_units": {
                "description": "vCPU units. 1024 = 1 vCPU.",
                "maximum": 9007199254740991,
                "minimum": 256,
                "type": "integer"
              },
              "docker_image": {
                "description": "Namespaced image, e.g. \"mystudio/game-server\".",
                "type": "string"
              },
              "docker_repository": {
                "description": "Registry host, e.g. \"docker.io\" or \"registry.edgegap.com\".",
                "type": "string"
              },
              "docker_tag": {
                "description": "Image tag: a build ID, commit SHA or timestamp. \"latest\" and empty tags are refused.",
                "type": "string"
              },
              "dry_run": {
                "description": "Show the exact request (method, host, path, body) with secrets masked, and send nothing. Local checks still run. Use it to confirm a billable or destructive call before making it.",
                "type": "boolean"
              },
              "endpoint_storage": {
                "description": "Endpoint Storage name (edgegap_list_endpoint_storage) to export container logs to when deployments end.",
                "minLength": 1,
                "type": "string"
              },
              "env": {
                "description": "Environment variables injected into the container. Values are never echoed back.",
                "items": {
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["key", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "max_duration_minutes": {
                "description": "Auto-stop after this many minutes. Keeps test deployments from running up cost.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "memory_mb": {
                "description": "Memory in MB. At most 2x cpu_units.",
                "maximum": 9007199254740991,
                "minimum": 256,
                "type": "integer"
              },
              "name": {
                "description": "Version identifier, typically a build ID or timestamp.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "ports": {
                "description": "Ports to expose. At least one is required for players to connect.",
                "items": {
                  "properties": {
                    "name": {
                      "description": "Label, e.g. \"gameport\".",
                      "type": "string"
                    },
                    "port": {
                      "description": "Port the server listens on.",
                      "maximum": 59999,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "protocol": {
                      "description": "One of UDP, TCP, TCP/UDP, HTTP, HTTPS, WS, WSS. Most game servers use UDP.",
                      "type": "string"
                    },
                    "tls_upgrade": {
                      "description": "Edgegap terminates TLS on this port, so clients connect with wss:// or https://. Required for browser (WebGL) clients, which cannot use plain ws:// from an https page. WS and HTTP ports only. Default false.",
                      "type": "boolean"
                    },
                    "to_check": {
                      "description": "Readiness check on this port. Default true.",
                      "type": "boolean"
                    }
                  },
                  "required": ["port", "protocol"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "registry_token": {
                "description": "Registry password or token.",
                "type": "string"
              },
              "registry_username": {
                "description": "Registry username, for private images on other registries (Docker Hub, GHCR, ECR...). Leave it out for registry.edgegap.com: Edgegap then pulls with the organization's own registry login (registry_profile \"Edgegap\").",
                "type": "string"
              },
              "restart_policy": {
                "description": "What Edgegap does when the server process exits. \"never\" for match servers that stop themselves (an exit or crash ends the deployment instead of restarting a half-played match); \"on_failure\" restarts only after a crash (persistent servers); \"always\" (the API default) restarts after any exit.",
                "enum": ["never", "on_failure", "always"],
                "type": "string"
              },
              "verify_image": {
                "description": "Verify Edgegap can pull the image before accepting the version.",
                "type": "boolean"
              }
            },
            "required": ["application", "cpu_units", "docker_image", "docker_repository", "docker_tag", "memory_mb", "name", "ports"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create an application version"
          },
          "behavior": {
