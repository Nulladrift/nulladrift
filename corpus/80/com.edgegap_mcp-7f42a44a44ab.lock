        {
          "name": "edgegap_create_pull_profile",
          "title": "Create a pull profile (copy bucket files into containers)",
          "description": "Create a pull profile under an Endpoint Storage: at boot, Edgegap copies a file or folder from the bucket into the container (maps, configs, large assets kept out of the image). It does nothing until linked to a version with edgegap_link_pull_profile. Avoid destination paths the image already uses.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "destination": {
                "description": "Absolute path in the container, e.g. \"/data/maps\".",
                "minLength": 1,
                "type": "string"
              },
              "dry_run": {
                "description": "Show the exact request (method, host, path, body) with secrets masked, and send nothing. Local checks still run. Use it to confirm a billable or destructive call before making it.",
                "type": "boolean"
              },
              "endpoint_storage": {
                "description": "Endpoint Storage name, from edgegap_list_endpoint_storage.",
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Name for the profile, e.g. \"maps\".",
                "minLength": 1,
                "type": "string"
