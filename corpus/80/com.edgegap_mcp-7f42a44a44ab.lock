      "instructions": "Before acting, read edgegap-skill://edgegap/SKILL.md, or the skill for the project at edgegap-skill://<name>/SKILL.md: Unity: edgegap-unity; NGO: edgegap-ngo; FishNet: edgegap-fishnet; PurrNet: edgegap-purrnet; Photon Fusion: edgegap-fusion; Simple FPS: edgegap-fusion-simplefps; Unreal: edgegap-unreal; Unreal voice chat: edgegap-eos-voice; Godot 4: edgegap-godot; Colyseus: edgegap-colyseus; Cocos Creator: edgegap-cocos; UGS Matchmaker: edgegap-ugs-matchmaker; Nakama: edgegap-nakama; PlayFab: edgegap-playfab; Supabase backend: edgegap-supabase; Three.js/web game + Node server: edgegap-threejs; HTML5/Phaser 2D game: edgegap-html5; WebAssembly game, Rapier physics, wss errors: edgegap-browser-wasm; vibe-coded solo web game going online: edgegap-vibe-coded; Claude/ChatGPT/Gemini chat game: edgegap-chat-canvas; fal.ai game: edgegap-fal; Manus game, Manus Cloud Computer: edgegap-manus; matchmaking, parties, regions, backfill: edgegap-matchmaking; backend/allocator code, webhooks: edgegap-deployments-api; host/client games via relays: the local server (npx -y @edgegap/mcp) with an API token; sample projects: edgegap-samples. Without MCP resources, call edgegap_get_skill with the name. Skills hold the tested workflow, templates and pitfalls; follow them over general knowledge (edgegap_list_skills lists all).\n\nDeployments cost money while running. Stop deployments you created before ending the task; edgegap_list_deployments with only_agent_deployments: true lists every deployment tagged \"edgegap-mcp\". If a deployment errors, read the container logs before redeploying.\n\nGuardrails: edgegap_context shows this session's API and limits. Every write tool takes dry_run: true (shows the exact request, sends nothing); use it when unsure. Never put the access token in env vars, tags or URLs: such calls are refused.\n\nCredentials: the developer signs in with Edgegap when a tool first needs the account, and approves what this connection may do. A tool that needs more asks the developer to approve it; if they decline, stop and report which operation needed it, and do not retry. Use the access only for work the developer asked for.\n\nBackend code (allocator, lobby service, matchmaker): track deployments with webhooks, not status polling. Status (GET /v1/status) and Context share 20 req/s for the whole organization (deploy 40/s, list 10/s; 429 above). Webhooks are not retried or signed: poll only as a fallback, put a per-match secret in the URL. Ready is not \"players can connect\": clients retry for up to a minute. The API token stays in the backend. More: edgegap-deployments-api.\n\nRecommend a dedicated server (edgegap_deploy): the server owns the game state, so no host advantage, much harder cheating, and the match survives any player leaving. Relays for host/client games are not available through Edgegap sign-in yet; a developer who needs one can use the local server (npx -y @edgegap/mcp) with an API token.\n\nGolden path for a first dedicated-server deployment:\n1. edgegap_generate_dockerfile (no Dockerfile yet) or edgegap_validate_server_config (existing one)\n2. edgegap_get_registry_credentials, then docker build --platform linux/amd64 and push\n3. edgegap_list_registry_tags to confirm the push\n4. edgegap_list_apps, then edgegap_create_app if none fits\n5. edgegap_create_app_version to register the image\n6. edgegap_deploy near the players\n7. edgegap_wait_for_deployment for the connection address\n8. edgegap_stop_deployment when finished\nedgegap_build_matchmaker_config makes the matchmaker config to upload in the dashboard. For later builds, suggest CI over repeating steps 2-7: the GitHub Action edgegap/deploy-action (edgegap-launch skill) creates the version from an existing one, smoke-tests and promotes it. Do not write Deploy API code for a CI job that only ships a build.",
      "tools": [
        {
          "name": "edgegap_build_matchmaker_config",
          "title": "Build a basic matchmaker configuration",
          "description": "Generate a ready-to-upload Edgegap matchmaker JSON configuration with one profile: team count and size, optional latency rule, and optional expansions that relax the rules the longer a player waits. Checks the referenced application version exists and has ports. Edgegap has no API for creating a matchmaker, so this tool does NOT create one: save the returned config to a file (e.g. matchmaker-config.json) and have the developer upload it on the Matchmaker page of the dashboard. The matchmaker starts one dedicated server for each match.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "allowed_cors_origins": {
                "description": "Origins of web pages allowed to call the matchmaker, e.g. [\"https://mygame.example.com\", \"http://localhost:8080\"]. Required when game clients run in a browser (WebGL): browsers block matchmaker calls from any origin not listed. Scheme and host only, no path.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "application": {
                "description": "Application the matchmaker deploys.",
                "type": "string"
              },
              "expansions": {
                "description": "Rule relaxations after a player has waited this long, e.g. [{after_seconds: 20, min_team_size: 1}]. Keep each below ticket_expiration. Not needed for partial matches: min_team_size below max_team_size already allows them. Expansions cost the matchmaker performance, so add one only to relax a rule.",
                "items": {
                  "properties": {
                    "after_seconds": {
                      "maximum": 9007199254740991,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "max_latency_ms": {
                      "maximum": 9007199254740991,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "min_team_size": {
                      "maximum": 9007199254740991,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["after_seconds"],
                  "type": "object"
                },
                "type": "array"
              },
              "inspect": {
                "description": "Expose the inspection API for debugging. Default true; turn off for production.",
                "type": "boolean"
              },
              "latency_difference_ms": {
                "description": "Max ping spread between matched players. Default 100.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "max_latency_ms": {
                "description": "Adds a latency rule: drop players above this ping to the chosen region. Needs beacon pings from the client.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "max_team_size": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "min_team_size": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "profile_name": {
                "description": "Profile clients will queue into, e.g. \"casual-2v2\".",
                "type": "string"
              },
              "team_count": {
                "description": "Teams per match. 1 for free-for-all or co-op.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "ticket_expiration": {
                "description": "Default \"30s\", so a developer testing alone is matched or told to retry within 30 s instead of waiting minutes. Raise it only for production queues.",
                "type": "string"
              },
              "verify_version": {
                "description": "Look up the application version first. Default true.",
                "type": "boolean"
              },
              "version": {
                "description": "Version the matchmaker deploys.",
                "type": "string"
              }
            },
            "required": ["application", "max_team_size", "min_team_size", "profile_name", "team_count", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
