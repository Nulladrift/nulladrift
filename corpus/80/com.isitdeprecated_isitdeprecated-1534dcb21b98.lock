{
  "lockfileVersion": 2,
  "subjects": {
    "com.isitdeprecated/isitdeprecated": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://isitdeprecated.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "isitdeprecated",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ask before writing a model identifier into code. check_model accepts any provider spelling.",
      "tools": [
        {
          "name": "check_model",
          "description": "Check whether an AI model identifier is deprecated, retiring, or has silently changed (price, context window, capabilities). Accepts any spelling a provider or SDK uses, e.g. 'gpt-4-turbo', 'azure/gpt-4.1-mini', 'claude-opus-4-1-20250805'. Call this before writing a model identifier into code.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Model identifier to check",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:08d519144592a0e60dc3e0538d28f6b93fb2ae6b17f52054fe2f40590b3bc003"
        },
        {
          "name": "check_models",
          "description": "Check many model identifiers at once and report which are retired or scheduled for retirement. Use when auditing a codebase or config.",
          "inputSchema": {
            "properties": {
              "models": {
                "description": "Up to 100 identifiers",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["models"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dbfd4aaba693fcd94ee5b4861da190951453515cf7ad5700c54425991efc280f"
        },
        {
          "name": "recent_changes",
          "description": "Recent breaking changes across AI model APIs: price moves, context-window cuts, removed capabilities, removals. One entry per real upstream change.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 30,
                "type": "integer"
              },
              "min_severity": {
                "default": "medium",
                "enum": ["critical", "high", "medium", "low", "info"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6e424f82c01491262465dee70871ac39c44ad3d33bf2d36a396db4d6b79bb657"
        },
        {
          "name": "upcoming_retirements",
          "description": "List models with an announced retirement date inside a horizon, soonest first.",
          "inputSchema": {
            "properties": {
              "within_days": {
                "default": 90,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d2f1e30db318d32569d92665272d0a888a41cde9ae2e4d5511e1a1e294d3128e"
        }
      ],
      "digest": "sha256:0f63014cfa94f37194fbc913b8b9dd97e9e9c4b005a3dc3e115c3932ea184e04"
    }
  }
}
