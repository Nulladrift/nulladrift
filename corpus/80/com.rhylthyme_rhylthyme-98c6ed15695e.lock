                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["actorPeak", "criticalPath", "makespan", "makespanSeconds", "name", "programId", "resourceConflicts", "steps", "tracks", "wallClock"],
            "type": "object"
          },
