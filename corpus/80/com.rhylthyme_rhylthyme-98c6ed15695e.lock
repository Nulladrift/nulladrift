              },
              "text": {
                "description": "Pasted source instead of a URL: an Opentrons .py, or an Ontime project JSON or rundown table (CSV, TSV or Markdown).",
                "type": "string"
              },
              "token": {
                "description": "Access token from the login tool. Omit when the account is connected.",
                "type": "string"
              }
