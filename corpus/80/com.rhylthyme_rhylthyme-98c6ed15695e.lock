      "serverInfo": {
        "name": "rhylthyme-mcp",
        "title": "Rhylthyme",
        "version": "1.3.0",
        "description": "Schedule real-time, multi-track work (recipes, lab protocols, events, workouts) as timed tracks with dependencies and resource limits; validate, analyze and share a live timeline.",
        "websiteUrl": "https://www.rhylthyme.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Rhylthyme schedules any real-time, multi-track process — cooking, lab protocols, event run-of-shows, workouts, manufacturing, turnarounds. A \"program\" is JSON: parallel **tracks** of sequential **steps**, each with a duration and a startTrigger (programStart / afterStep / programStartOffset / afterStepWithBuffer / manual), plus **resourceConstraints** (e.g. one oven) that the live runner enforces.\nWorkflow:\n- Existing content: **search_public_recipes** → **load_public_recipe** (or the one-shot tool). The result already includes the live URL.\n- New content: build the program → **validate_program** (fix every error it reports) → optionally **analyze_schedule** (makespan, critical path, conflicts, wall clock when you pass finishAt/startAt) → **visualize_schedule** for the shareable live timeline. visualize_schedule validates too and refuses invalid programs.\n- visualize_schedule returns the live timeline URL together with an ASCII Gantt and an itinerary.\n- **login** is only needed for the private library (list_my_programs, load_program, save_program) and for imports. Public catalog tools need no token.\nAuthoring rules: stepIds unique across the whole program; steps in one track never overlap (chain with afterStep); every `task` used by a step has a matching resourceConstraint; durations in seconds (numbers) or time strings (\"5m\", \"1h30m\"); repeated work is `replicates` on ONE step with `instances: \"each\"`/`\"all\"` and `maxInFlight`, never copied steps; to make everything finish together, delay short tracks with programStartOffset or afterStep, and pass finishAt to analyze_schedule for wall-clock start times; step `alerts` ({event:\"end\", offsetSeconds:\"-2m\", message}) notify the person.\nAuthoring from a goal or a source text: run the **plan_schedule** prompt — four turns (read the source back → confirm the program model → extract the steps with the words they came from → assign tracks and triggers). The same four turns are documented in `rhylthyme://guide/extraction` for clients without multi-message prompt support. `rhylthyme://guide/authoring` is the cheat-sheet, `rhylthyme://guide/tools` the long form of each tool, `rhylthyme://schema/program` the full JSON schema, `rhylthyme://examples/*` complete valid programs.",
      "tools": [
        {
          "name": "analyze_schedule",
          "title": "Analyze schedule timing",
          "description": "Put a program on the clock: each step's start and end, total length, the critical path and what gates it, resource conflicts, slack per track. Pass finishAt to answer 'when do I start X so everything is ready at 6pm?'. Pure computation. With `history` (run records) or `program_id` it also predicts durations from recorded runs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "finishAt": {
                "description": "ISO 8601 datetime everything must END at, e.g. '2026-11-26T18:00:00-05:00'. Start times are worked backwards from it.",
                "type": "string"
              },
              "history": {
                "description": "Recorded runs of this program (from load_run); adds predicted durations.",
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "predictionContext": {
                "additionalProperties": {},
                "description": "Optional: environmentId, userTags (variance factors), userId, programVersion, minIdentical, minModel, corrThreshold, verdicts. See rhylthyme://guide/tools.",
                "properties": {},
                "type": "object"
              },
              "program": {
                "additionalProperties": {},
                "description": "Program JSON; shape under validate_program.",
                "properties": {},
                "type": "object"
              },
              "program_id": {
                "description": "Saved program UUID: loads the user's own recorded runs as the history.",
                "type": "string"
              },
              "startAt": {
                "description": "ISO 8601 start datetime. Ignored with finishAt.",
                "type": "string"
              },
              "token": {
                "description": "Access token from the login tool. Omit when the account is connected.",
                "type": "string"
              },
              "useDurations": {
                "default": "planned",
                "description": "planned (default): analyse the program as authored. predicted: as the history says it will run.",
                "enum": ["planned", "predicted"],
                "type": "string"
              }
            },
            "required": ["program"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "actorPeak": {
                "additionalProperties": {},
                "properties": {},
                "type": "object"
              },
              "bindingConstraints": {
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "criticalPath": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "durationsUsed": {
                "type": "string"
              },
              "inFlight": {
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "makespan": {
                "type": "string"
              },
              "makespanSeconds": {
                "type": "number"
              },
              "name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "plannedMakespan": {
                "type": "string"
              },
              "plannedMakespanSeconds": {
                "type": "number"
              },
              "predictedCriticalPath": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "predictedMakespan": {
                "type": "string"
              },
              "predictedMakespanSeconds": {
                "type": "number"
              },
              "programId": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "resourceConflicts": {
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "steps": {
                "items": {
