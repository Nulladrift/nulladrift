        {
          "name": "calibrate_program",
          "title": "Propose durations from recorded runs",
          "description": "Propose durations for a saved program from its recorded runs: median as the default, P10 to P90 as the range, at least as wide as the author's, with the evidence per step and the effect on total length. Saves nothing; with `accept` it returns the calibrated program. Needs the user's Rhylthyme account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "accept": {
                "anyOf": [
                  {
                    "const": "all",
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                ],
                "description": "Step ids to accept, or \"all\": also returns the calibrated program. Nothing is saved either way."
              },
              "history": {
                "description": "Run records to use instead of the stored ones.",
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "k": {
                "description": "Measurements a step needs for a proposal (default 5).",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "program": {
                "additionalProperties": {},
                "description": "Program JSON to calibrate; omit to use program_id's saved JSON.",
                "properties": {},
                "type": "object"
              },
              "program_id": {
                "description": "Saved program UUID whose recorded runs are the evidence.",
                "type": "string"
              },
              "since": {
                "description": "Only runs started on or after this date (YYYY-MM-DD or ISO).",
                "type": "string"
              },
              "token": {
                "description": "Access token from the login tool. Omit when the account is connected.",
                "type": "string"
              }
            },
            "type": "object"
          },
