      "instructions": "HOMEMADE is a weekly subscription of home-cooked lunches, delivered chilled in Israel. The tools return live data from the site. An order is completed by the person on homemade-global.com: order_url and checkout_url open checkout with the choices prefilled, the person accepts the terms there, and payment is made on PayMe's hosted page. create_order_draft keeps the details the person gave for 48 hours and creates no account, order, charge or message. The order repeats weekly until it is skipped, paused or cancelled before Wednesday 21:00 Israel time. show_menu, show_quote and show_order_link return the same data as UI in hosts that support MCP Apps. Allergy notice: The service is unequivocally not suitable for anyone with a food allergy or sensitivity, and the Company accepts no responsibility for an allergic reaction or health harm arising from a food allergy or sensitivity. The Company does not warrant that any dish is free of any allergen, even when that allergen does not appear in the dish's ingredient or allergen list. A customer who, or any member of whose household the food is intended for, has a food allergy or sensitivity must contact the Company individually, via the customer service chat on the Site, and verify the suitability of the service for their condition before ordering and before consuming any dish. An order placed without such verification, and any consumption of a dish by a person with an allergy or sensitivity, is at the customer's sole responsibility. Support: Customer service is the chat on the site only. There is no phone line and no WhatsApp, and nobody calls back. https://homemade-global.com/support",
