        "description": "Public read-only catalog and knowledge of the Good Nature Vibe shop. No login.",
        "websiteUrl": "https://goodnaturevibe.com",
        "icons": [
          {
            "src": "https://catalog-mcp.goodnaturevibe.com/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
