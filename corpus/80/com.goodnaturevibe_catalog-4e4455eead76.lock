      "tools": [
        {
          "name": "gnv_catalog_search",
          "title": "Search the Good Nature Vibe catalog",
          "description": "Search or list products from the public catalog feed, with category, brand and a short text. Discovery only, not the checkout price. NL: zoek of lijst producten uit de catalogusfeed; dit is geen betaalprijs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Optional search words, matched against names and text. Leave out to list everything.",
                "type": "string"
              },
              "store": {
                "description": "Store view code. Default nl, the Dutch shop.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "Time of this answer, ISO 8601.",
                "type": "string"
              },
              "products": {
                "description": "At most 20 products.",
                "items": {
                  "properties": {
                    "as_of": {
                      "description": "Time of this answer, ISO 8601.",
                      "type": "string"
                    },
                    "availability": {
