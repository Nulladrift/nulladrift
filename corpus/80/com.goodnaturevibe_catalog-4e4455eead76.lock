                      "type": "string"
                    },
                    "name": {
                      "type": ["string", "null"]
                    },
                    "path": {
                      "description": "Path of the public product page on the shop origin.",
                      "type": "string"
                    },
                    "price_cents": {
                      "description": "Price from the catalog feed in euro cents. Not the checkout price.",
                      "type": "integer"
                    },
                    "price_max_cents": {
                      "description": "Highest variant price in cents, or null.",
                      "type": ["integer", "null"]
                    },
                    "product_type": {
