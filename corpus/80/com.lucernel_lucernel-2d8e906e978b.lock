{
  "lockfileVersion": 2,
  "subjects": {
    "com.lucernel/lucernel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lucernel.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Lucernel Content MCP",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "analyze_content",
          "description": "Return structured content and objective reading statistics for one public Lucernel app or article URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "Canonical Lucernel URL or relative path.",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9b66a260eb74066ca9de14c60fb8fa690fdb6c16e2e1cb6070b198da876c3f97"
        },
        {
          "name": "list_apps",
          "description": "List public Lucernel apps with canonical product, support, privacy, and terms URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d75af2951af38f0e6e1cfe5de4c752e926921a87f989bf133e5d8c6aae8c811d"
        },
        {
          "name": "list_articles",
          "description": "List public Lucernel guides, best-of roundups, comparisons, and alternative articles.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "enum": ["guide", "best", "comparison", "alternative"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:242be33d31b03f5473ca042ab4a171ff3df8e55770cdb2cba43047f624aa2220"
        },
        {
          "name": "search_content",
          "description": "Search public Lucernel apps and articles by topic or product name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ab289ce098c9ede4aa6091d65aedd807dafedcbbbc8d5633a42d85967388848f"
        }
      ],
      "digest": "sha256:bdb11481778726c02510d9dedfb05751313c0dbb8fd812c654dc886fe6f33791"
    }
  }
}
