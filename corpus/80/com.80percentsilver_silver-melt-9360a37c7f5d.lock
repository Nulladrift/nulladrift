{
  "lockfileVersion": 2,
  "subjects": {
    "com.80percentsilver/silver-melt": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://80percentsilver.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "silver-melt-calculator",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "calculate_coin_melt",
          "description": "Calculate the melt value of junk silver coins (constitutional silver) at the current silver spot price: US 90% pre-1965 dimes/quarters/halves/dollars, US 40% Kennedy halves (1965–1970), US 35% war nickels (1942–1945), Canadian 80% (1920–1966/67) and Canadian 50% (1967–68) coins. Provide the coin type plus either a quantity of coins or a total face value (e.g. face_value 2.50 for a roll of dimes). Returns total actual silver weight (ASW) in troy oz and grams, and melt value in USD and CAD.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "coin_type": {
                "description": "Coin preset id. us_90_dime = US 90% dime (pre-1965), 0.0723 ozt ASW each; us_90_quarter = US 90% quarter (pre-1965), 0.1808 ozt ASW each; us_90_half = US 90% half dollar (pre-1965), 0.3617 ozt ASW each; us_90_dollar = US 90% dollar (Morgan/Peace), 0.7734 ozt ASW each; us_40_half = US 40% half dollar (Kennedy), 0.1479 ozt ASW each; us_35_nickel = US 35% war nickel, 0.05626 ozt ASW each; ca_80_dime = Canadian 80% dime, 0.06 ozt ASW each; ca_80_quarter = Canadian 80% quarter, 0.15 ozt ASW each; ca_80_half = Canadian 80% half dollar, 0.3 ozt ASW each; ca_80_dollar = Canadian 80% dollar, 0.6 ozt ASW each; ca_50_dime = Canadian 50% dime, 0.0375 ozt ASW each; ca_50_quarter = Canadian 50% quarter, 0.0937 ozt ASW each",
                "enum": ["us_90_dime", "us_90_quarter", "us_90_half", "us_90_dollar", "us_40_half", "us_35_nickel", "ca_80_dime", "ca_80_quarter", "ca_80_half", "ca_80_dollar", "ca_50_dime", "ca_50_quarter"],
                "type": "string"
              },
              "face_value": {
                "description": "Total face value in the coin's own currency, e.g. 2.50 for a roll of dimes",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "quantity": {
                "description": "Number of coins (provide this or face_value)",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["coin_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:fdd333dc1dd285b9f9dc0bc737fb28a6f2b0baf610bb79dd3f0b595708492bce"
        },
        {
          "name": "calculate_melt_value",
          "description": "Calculate the melt value (intrinsic bullion value) of silver or gold from weight and purity — e.g. sterling silver flatware, .999 rounds, scrap gold. Returns melt value in both USD and CAD plus the fine metal weight. Purity is a fraction: 0.925 = sterling, 0.999 = fine silver, 0.9 = US coin silver. Weight units: g (grams), ozt (troy ounces), oz (avoirdupois ounces — postal-scale ounces).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "metal": {
                "description": "Which metal",
                "enum": ["silver", "gold"],
                "type": "string"
              },
              "purity": {
                "description": "Fineness as a fraction, e.g. 0.925 for sterling silver",
                "exclusiveMinimum": 0,
                "maximum": 1,
                "type": "number"
              },
              "unit": {
                "description": "Weight unit: g = grams, ozt = troy ounce, oz = avoirdupois ounce",
                "enum": ["g", "ozt", "oz"],
                "type": "string"
              },
              "weight": {
                "description": "Gross weight of the item(s)",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["metal", "purity", "unit", "weight"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6f7c79d6ba94c2e70ce9778ae9778ac90020038133e9d68361a550e094b80760"
        },
        {
          "name": "get_spot_price",
          "description": "Get the current spot price of silver and gold in USD and CAD per troy ounce. Use this to answer questions about the silver spot price, gold spot price, or the USD→CAD exchange rate used for melt value calculations. Prices are live, cached up to 15 minutes. All prices are per troy ounce (ozt).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dc66a33152dfc525409c77ff0de83f363b4bc0a204f011cc2f9d93f2c2ee800a"
        }
      ],
      "digest": "sha256:12c5dc038208f6e41b40bdc3cf1aa0112020ccf52032b4db1d9acb2237b2ec24"
    }
  }
}
