            "properties": {
              "appraisal_won": {
                "type": "number"
              },
              "case_no": {
                "type": "string"
              },
              "court": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "item": {
                "type": "string"
              },
              "kind": {
                "enum": ["apt", "vil", "off", "house"],
                "type": "string"
              },
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "question": {
                "description": "물건 없이 찾을 때 지역·종류. 예: 수원시 영통구 아파트",
                "type": "string"
              },
              "sido": {
                "type": "string"
              },
              "sigu": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
