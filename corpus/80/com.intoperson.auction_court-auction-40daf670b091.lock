      "serverInfo": {
        "name": "kr-auction",
        "title": "Court auction items and predicted prices",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "법원 경매 물건을 말이나 조건으로 찾고 예상 낙찰가와 위험 신호를 봅니다. 먼저 get_analysis_report를 부르세요. 예상 낙찰가·위험 신호·입찰 시나리오는 구독자 전용이며 키는 Authorization: Bearer <key>로 보냅니다.",
      "tools": [
        {
          "name": "bid_scenarios",
          "title": "Bid price scenarios",
          "description": "For one item, show where bid amounts sit in the predicted 10-90% price band (an estimate), the deposit and the gap to the predicted price. No tax numbers. Use this when: the person is deciding how much to bid. 구독자 전용.",
          "inputSchema": {
            "properties": {
              "bids": {
                "description": "원 단위 입찰가, 없으면 최저가부터 상단까지 6단계",
                "items": {
                  "type": "number"
                },
                "maxItems": 10,
                "type": "array"
              },
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Bid price scenarios"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3f7365380d2b92c5e239127e8c0e01d6a44d83d3db1d3a6c80cdf6d83023382f"
        },
        {
          "name": "check_items",
          "title": "Check items against conditions",
          "description": "For up to 20 items, say per condition whether it is met, not met or unknown (unknown when the needed case or building information was not read). Use this when: the person has a short list and wants each item checked against conditions. Without a subscription, conditions on sale chance or risk signals answer locked.",
          "inputSchema": {
            "properties": {
              "case_nos": {
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "conditions": {
                "description": "조건 객체(목록 화면 주소의 조건과 같은 모양). question과 함께 주면 합쳐서 읽습니다.",
                "type": "object"
              },
              "ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "question": {
                "description": "찾고 싶은 물건을 말로. 예: 강남구 아파트 5억 이하 유치권 없는",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check items against conditions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
