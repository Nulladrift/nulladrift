        },
        {
          "name": "get_analysis_report",
          "title": "Analyze a question",
          "description": "Read a person's own words about court-auction items they want (region, kind, price, risk) and answer with the matching items, what was read, what was not read, and a link to the list page. Use this when: someone describes in words which auction items they are looking for, as the first call. Without a subscription, predicted price, band, chance and risk are locked. 구독 없이도 쓸 수 있으나 예상 낙찰가·위험 신호는 구독해야 열립니다.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "찾고 싶은 물건을 말로. 예: 강남구 아파트 5억 이하 유치권 없는",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze a question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aea864d5fb3aebb785056a4b948bda42b74b097f67f264825cb2878478c4593f"
        },
        {
          "name": "get_auction_stats",
          "title": "Sale statistics by area",
          "description": "Court-auction sale statistics from the court's sale results (residential, no shares): how many sold, the median and 10-90% range of sale price ÷ appraisal and the median number of failed rounds, for a 시·군·구, its 시·도 and the whole country (or every 시·도 when no place is given). Use this when: the person asks what share of the appraisal items usually sell for in a place. 누구나 쓸 수 있습니다.",
          "inputSchema": {
            "properties": {
              "kind": {
                "enum": ["apt", "vil", "off", "house"],
                "type": "string"
              },
              "months": {
                "description": "최근 몇 개월만",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "question": {
                "description": "지역·종류를 말로. 예: 서울 강남구 아파트",
                "type": "string"
              },
              "sido": {
                "description": "예: 서울특별시",
                "type": "string"
              },
              "sigu": {
                "description": "예: 강남구",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sale statistics by area"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ff8db8a71cf9c38152553511d5a4ee9021e4f4956f1fe3e32552be163b8ccf12"
        },
        {
          "name": "get_item",
          "title": "Item details",
