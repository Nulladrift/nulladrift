        },
        {
          "name": "manage_interest",
          "title": "Manage saved interest conditions",
          "description": "List, add or remove the subscriber's saved interest conditions (the ones behind the mail alerts). Use this when: the person wants to save, see or delete what they follow. 구독자 전용.",
