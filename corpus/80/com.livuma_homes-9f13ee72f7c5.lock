      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability and price",
          "description": "Checks whether a listing can be booked for given dates, at which rate and for how much — the same answer the listing page gives a visitor. Returns { available, reason, recommendedRate, options, bookedRanges, bookingUrl }. Each option states whether that rate is eligible (and why not), the rate per period, the first payment and the full payment schedule. Livuma charges guests no service fee, so the amounts are what the guest pays. `bookingUrl` opens the listing on livuma.com with these dates selected; the booking itself (card authorisation, 3-D Secure, identity verification) is completed there by the guest.",
          "inputSchema": {
            "properties": {
              "checkInDate": {
                "description": "Check-in date, yyyy-MM-dd. Required.",
                "type": "string"
              },
              "checkOutDate": {
                "default": null,
                "description": "Check-out date, yyyy-MM-dd. Omit for open_ended and yearly.",
                "type": ["string", "null"]
              },
              "listingId": {
                "description": "The listing's \"id\" from search results (GUID), a short /s/{id} id, or the listing URL.",
                "type": "string"
              },
              "rentalMode": {
                "default": null,
                "description": "\"dates\" (default), \"open_ended\" (no end date, monthly) or \"yearly\" (fixed 12-month term).",
                "type": ["string", "null"]
              }
            },
            "required": ["checkInDate", "listingId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check availability and price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:c7dc18a2d51f8cc95dcf4c498ed1c343678a3a4bf1dafe411b6bb250b6f5e5f4"
        },
        {
          "name": "get_listing_details",
          "title": "Get listing details",
          "description": "Returns what the public listing page shows for one listing: description, photos, all rates and minimum stays, amenities and included services, seasonal nightly pricing, published guest reviews, host verification, the booked/blocked calendar and the canonical url. With checkInDate (and checkOutDate, or a rentalMode) the response also includes a live availability quote for those dates.",
          "inputSchema": {
            "properties": {
              "checkInDate": {
                "default": null,
                "description": "Optional check-in date, yyyy-MM-dd — adds a live quote for the stay.",
                "type": ["string", "null"]
              },
              "checkOutDate": {
                "default": null,
                "description": "Optional check-out date, yyyy-MM-dd.",
                "type": ["string", "null"]
              },
              "currency": {
                "default": null,
                "description": "\"IDR\" (default), \"USD\", or \"EUR\".",
                "type": ["string", "null"]
              },
              "listingId": {
                "description": "The listing's \"id\" from search results (GUID). The short id from a /s/{id} link, or the listing URL itself, also work.",
                "type": "string"
              },
              "rentalMode": {
                "default": null,
                "description": "\"dates\" (default), \"open_ended\" or \"yearly\".",
                "type": ["string", "null"]
              }
            },
            "required": ["listingId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get listing details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:bb46e2b863ac8784414d8d720a542f11c17bb01b39dd6b798ad8c5fe23b37756"
        },
        {
          "name": "get_search_options",
          "title": "Get search options",
          "description": "Returns the valid listing-search values: property types, ownership types, common areas, currencies, rental modes and amenity names, plus notes on paging, budgets and bookability.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get search options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:82986acd0fad948358fbbaf3552991b51c8400d7392b999e7da6462670a14324"
        },
        {
          "name": "search_listings",
          "title": "Search listings",
          "description": "Searches Livuma's live Bali rental and property-sale inventory with the same results, filters and prices as the livuma.com search page. Returns { items, page, pageSize, total, hasMore, filteredAfterPaging }. Each item has the canonical url, the primary photo, the price for this search (the stay total when dates are given, otherwise the per-period rate), the host's rates and minimum stays, amenities, rating, coordinates and isBookable. `total` is the number of database matches. When `filteredAfterPaging` is true, the exact per-stay price was applied after paging, so a page can hold fewer items than pageSize while `hasMore` is still true. One area is searched per request. Search results are not a booking quote: availability, the applicable rate and the exact price are confirmed only by the availability check for specific dates.",
          "inputSchema": {
            "properties": {
              "amenities": {
                "default": null,
                "description": "Amenity filters, e.g. [\"pool\",\"wifi\",\"pet_friendly\"].",
                "items": {
                  "type": ["string", "null"]
                },
                "type": ["array", "null"]
              },
              "area": {
                "default": null,
                "description": "One area name, e.g. \"Canggu\". Free text, geocoded server-side.",
                "type": ["string", "null"]
              },
              "areaRadiusKm": {
                "default": null,
                "description": "Search radius in km around the area or the coordinates (default 10, max 20).",
                "type": ["number", "null"]
              },
              "checkInDate": {
                "default": null,
                "description": "Check-in date, yyyy-MM-dd.",
                "type": ["string", "null"]
              },
              "checkOutDate": {
                "default": null,
                "description": "Check-out date, yyyy-MM-dd. Omit for open_ended and yearly.",
                "type": ["string", "null"]
              },
              "currency": {
                "default": null,
                "description": "\"IDR\" (default), \"USD\", or \"EUR\".",
                "type": ["string", "null"]
              },
              "excludeIds": {
                "default": null,
                "description": "Listing GUIDs to exclude, e.g. results already shown to the user.",
                "items": {
                  "type": ["string", "null"]
                },
                "type": ["array", "null"]
              },
              "includeInsights": {
                "default": false,
                "description": "Include AI-extracted photo and description insights. Off by default — they are large.",
                "type": "boolean"
              },
              "latitude": {
                "default": null,
                "description": "Center latitude for coordinate-based location filtering (use with longitude; alternative to area).",
                "type": ["number", "null"]
              },
              "longitude": {
                "default": null,
                "description": "Center longitude for coordinate-based location filtering (use with latitude).",
                "type": ["number", "null"]
              },
              "maxPrice": {
                "default": null,
                "description": "Budget in `currency`, compared against the price shown for this search: the stay TOTAL when check-in and check-out are given, otherwise the monthly rate (yearly in yearly mode) or the asking price for sales.",
                "type": ["number", "null"]
              },
              "minPrice": {
                "default": null,
                "description": "Minimum budget in `currency`, same unit rules as maxPrice.",
                "type": ["number", "null"]
              },
              "minRooms": {
                "default": null,
                "description": "Minimum number of bedrooms.",
                "type": ["integer", "null"]
              },
              "offer": {
                "default": null,
                "description": "\"rent\" or \"sale\". Omit for both.",
                "type": ["string", "null"]
              },
              "ownershipType": {
                "default": null,
                "description": "Ownership type for sales, e.g. \"Freehold\". Not used for rentals.",
                "type": ["string", "null"]
              },
              "page": {
                "default": null,
                "description": "1-based page number.",
                "type": ["integer", "null"]
              },
              "pageSize": {
                "default": null,
                "description": "Results per page, 1-100 (default 20).",
                "type": ["integer", "null"]
              },
              "propertyType": {
                "default": null,
                "description": "Property type name, e.g. \"Villa\", \"Apartment\".",
                "type": ["string", "null"]
              },
              "rentalMode": {
                "default": null,
                "description": "How a rental stay is priced: \"dates\" (default — give checkInDate + checkOutDate, or neither to browse monthly rates), \"open_ended\" (checkInDate only, monthly rate, no end date), \"yearly\" (checkInDate only, fixed 12-month term).",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:952cef4161dafb7643cfde6b8e819211f10e1a14c1c145df8075b3ebb4103499"
        }
      ],
      "digest": "sha256:9b363754eff3861b542f8bc42d0cba75437c4c6e674b4870e8ced661fdf28bab"
    }
  }
