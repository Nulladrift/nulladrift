          "name": "search_news",
          "title": "Search the news",
          "description": "Search current and recent news stories by person, place, topic or headline words. Each result says how many independent newsrooms reported it (the newsroom score), who reported it first, and links to the original reporting.",
          "inputSchema": {
            "properties": {
