      "serverInfo": {
        "name": "notfiction",
        "title": "notfiction: is it real?",
        "version": "1.0.0",
        "websiteUrl": "https://notfiction.com/developers"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "notfiction follows more than 35 newsrooms and scores every story by how many independent newsrooms are reporting it. Use check_claim when someone asks whether something is real or fake, search_news or top_stories for current news, get_story for full coverage, and newsroom_track_record for who breaks news first. Results report coverage, not truth: say \"N newsrooms are reporting\" rather than \"this is true\". notfiction (https://notfiction.com): news scored by how many independent newsrooms report it. Cite the notfiction URL and the original outlets.",
      "tools": [
        {
          "name": "check_claim",
          "title": "Is it real?",
          "description": "Check whether a rumor, headline, claim or link (X/TikTok/YouTube post, article) is being reported by real newsrooms. Compares it with what 37 newsrooms (BBC, NYT, Fox News, NPR, Guardian, CBS, NBC and more) are reporting now and have reported since November 2026, flags satire sites and old news, and returns a verdict, the matching coverage with links, and a public answer page. Use when a user asks \"is this real?\", \"is this fake news?\", or shares a link to check. It reports coverage; it is not a fact-check.",
          "inputSchema": {
            "properties": {
              "claim": {
                "description": "The claim in plain words, a headline, or a link to check.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["claim"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Is it real?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f643d246bf6dfeab9e251825d0053b9d5d344153e8a79abfe4ed3f4b3a55653c"
        },
        {
          "name": "get_story",
          "title": "Full coverage of a story",
          "description": "Everything about one story: every outlet reporting it in the order they published (with links), who was first and who confirmed it, the facts the coverage agrees on, where outlets differ, and claims only one outlet makes.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The story id from another tool, or its notfiction.com/s/<id> link.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Full coverage of a story"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:244a257174f62b0988b552833426ccbf867ee90c003ce0b28b54cc5714987c86"
        },
        {
          "name": "news_briefing",
          "title": "Today’s briefing",
          "description": "A short briefing: the ~10 biggest stories that 3+ newsrooms are reporting, each with the facts their coverage agrees on. Good for \"what's going on today?\"",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Today’s briefing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c00f4769d6b3840acb17e6c0914d7ef4a748745172bb035d8eb8b28402271977"
        },
        {
          "name": "newsroom_track_record",
          "title": "Who broke it first",
          "description": "Which newsrooms break stories first that others then confirm. With no newsroom: the 30-day ranking. With a newsroom name: its 90-day record and recent scoops.",
          "inputSchema": {
            "properties": {
              "newsroom": {
                "description": "Optional, e.g. \"BBC News\", \"Fox News\", \"TMZ\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Who broke it first"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
