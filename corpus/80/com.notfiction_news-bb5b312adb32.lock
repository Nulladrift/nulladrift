          "title": "Top stories now",
          "description": "The biggest news stories right now, ranked by how many independent newsrooms are reporting them and how recent they are. Optionally one section. Includes the facts the coverage agrees on when available.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
