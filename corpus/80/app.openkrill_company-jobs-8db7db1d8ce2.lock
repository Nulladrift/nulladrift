        {
          "name": "rank_jobs_for_profile",
          "title": "Rank company jobs for profile",
          "description": "Best for: which open jobs at up to 3 companies suit the user, such as \"which jobs at Ramp fit a senior backend engineer with 7 years of Go?\".\nReturns: jobs ranked best first, each with a score, a fit of strong, possible or weak, a levelFit verdict (match, step_up, stretch, step_down), whyFit reasons, gaps and the applyUrl, plus one boards entry per company.\nInput tips: send companies and targetTitles, such as {\"companies\": [\"Ramp\"], \"targetTitles\": [\"Backend Engineer\"]}. Add recentTitles, level, yearsExperience, skills, locations and openToRemote only when the user gave them; never guess.\nNot for: listing every job at a company (use find_company_jobs) or the facts of one known job (use job_fit_brief).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "companies": {
                "description": "Company names or careers page links to rank jobs from, 1 to 3, such as [\"Ramp\", \"Linear\"].",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "level": {
                "description": "Their current level, if known: one of intern, entry, mid, senior, lead, staff, principal, manager, director, executive. Otherwise it is read from recentTitles or yearsExperience.",
                "enum": ["intern", "entry", "mid", "senior", "lead", "staff", "principal", "manager", "director", "executive"],
                "type": "string"
              },
              "limit": {
                "description": "Most ranked jobs to return. Default 10, most 20: a larger value returns 20 with a note.",
                "minimum": 1,
                "type": "integer"
              },
              "locations": {
                "description": "Cities or countries they would work in, such as \"London\" or \"DE\". Up to 5.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 0,
                "type": "array"
              },
              "openToRemote": {
                "description": "true if remote roles are fine, false to avoid them. Leave out if no preference.",
                "type": "boolean"
              },
              "recentTitles": {
                "description": "Titles of their most recent one or two roles; recruiters weigh these most.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 2,
                "minItems": 0,
                "type": "array"
              },
              "skills": {
                "description": "Key skills and tools, such as \"Go\" or \"PostgreSQL\". Up to 30.",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 30,
                "minItems": 0,
                "type": "array"
              },
