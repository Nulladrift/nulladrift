        {
          "name": "profile_keyword_check",
          "title": "Check recruiter and LinkedIn profile keywords",
          "description": "Best for: LinkedIn profile and resume keywords recruiters search. Checks the user's own pasted headline, About or resume text, such as \"does my profile have the right keywords for backend jobs?\" or \"what words am I missing for this job?\".\nReturns: per role, the title, skill, tool and seniority words present or missing, an example boolean search string and whether the text matches it, and tips for the headline and About section.\nInput tips: send profileText (headline on the first line) plus targetTitles OR company and job, never both, such as {\"profileText\": \"...\", \"targetTitles\": [\"Senior Backend Engineer\"]}. For a job you do not know exactly, call find_company_jobs first for its applyUrl.\nNot for: reading a LinkedIn link or any site (ask the user to paste the text) or the facts of a job alone (use job_fit_brief).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "With job: the company name or its careers page link",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "job": {
                "description": "With company: the job's applyUrl from find_company_jobs, or its title as listed",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "level": {
                "description": "The level aimed for, when the target titles do not say it: one of intern, entry, mid, senior, lead, staff, principal, manager, director, executive.",
                "enum": ["intern", "entry", "mid", "senior", "lead", "staff", "principal", "manager", "director", "executive"],
                "type": "string"
              },
              "profileText": {
                "description": "The user's pasted profile text, headline on the first line, then About and roles, up to 10,000 characters, such as \"Backend engineer | Go, PostgreSQL\". Also send targetTitles, or company and job.",
                "maxLength": 10000,
                "minLength": 20,
                "type": "string"
              },
              "targetTitles": {
                "description": "Job titles the user is aiming for, such as \"Senior Backend Engineer\". Use this or company and job.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["profileText"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "type": "string"
              },
              "guidance": {
                "type": "string"
              },
              "job": {
                "properties": {
                  "applyUrl": {
                    "type": "string"
                  },
                  "company": {
                    "type": "string"
                  },
                  "source": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": ["applyUrl", "company", "source", "title"],
                "type": "object"
              },
              "message": {
                "description": "Set when status is not ok: what went wrong and the next step (job_not_found: pick from suggestions or call find_company_jobs; not_found: ask for the careers page link; unavailable: retry once later).",
                "type": "string"
              },
              "narrative": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "roles": {
                "items": {
                  "properties": {
                    "boolean": {
                      "properties": {
                        "example": {
                          "type": "string"
                        },
                        "matches": {
                          "type": "boolean"
                        },
                        "unmatched": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["example", "matches", "unmatched"],
