        "type": "http",
        "url": "https://jobs.openkrill.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "company-jobs",
        "title": "Jobs, recruiter and LinkedIn",
        "version": "1.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Jobs, recruiter and LinkedIn. Use find_company_jobs when the user asks about open jobs, hiring or roles at specific companies. Pass company names as the user wrote them. When the user names a kind of company instead (\"startups\", \"AI labs\"), pick up to five well-known companies of that kind and say which ones you checked. Link each job's applyUrl. A not_found company publishes no board on Greenhouse, Lever, Ashby, Workable or SmartRecruiters; suggest its own careers page instead. When the user wants to know which jobs suit them, call rank_jobs_for_profile with the profile they gave you (target titles, recent titles, level, years, skills, locations); never invent profile details, ask for what is missing. Show each job's score with its whyFit and gaps and say the ranking is a rule-based match, not a hiring prediction. For one job, call job_fit_brief and turn its must-haves, level signals and tailoring checklist into advice in your own words; credit the checklist as general recruiter practice, not a guarantee. When the user wants to know whether their profile has the words recruiters search for, ask them to paste their own profile text (headline first) and call profile_keyword_check with it and either targetTitles or one company and job; never fetch a profile link and never invent profile text. Present which terms are present and missing, the example search string and the narrative tips, and say add only what is true. The tools return facts; you write any resume or profile text, and only from what the user told you. Do not look up or contact people at the company. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "find_company_jobs",
          "title": "Find company jobs and careers",
          "description": "Best for: open jobs at named companies, such as \"jobs at Stripe\", \"is Notion hiring designers?\" or \"remote backend jobs at Ramp and Linear\". Covers careers pages on Greenhouse, Lever, Ashby, Workable and SmartRecruiters; other companies come back as not_found.\nReturns: per company, each job's title, locations, workplace type, salary when published, posting date, a short summary and the applyUrl. Call this first when you need a job's exact title or applyUrl for the other tools.\nInput tips: send companies as the user says them or as careers page links, 1 to 5, such as {\"companies\": [\"Stripe\"], \"keyword\": \"designer\"}. Optional filters: keyword, location, remote, department, postedSince (YYYY-MM-DD), withSalary.\nNot for: looking up people at a company, applying to a job, or companies on other systems (point the user to the company's own careers page).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "companies": {
                "description": "Company names as the user says them, or careers page links, 1 to 5, such as [\"Stripe\", \"Hugging Face\"].",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "department": {
                "description": "Department or team, such as \"Engineering\"",
                "maxLength": 200,
                "type": "string"
              },
              "keyword": {
                "description": "The role to find, matched on the job title, such as \"designer\" or \"backend engineer\". \"engineer\" also finds Engineering and Solutions Engineer titles. A skill no title names, such as \"rust\", is matched on the posting text instead.",
                "maxLength": 200,
                "type": "string"
              },
              "limit": {
                "description": "Most jobs per company. Default 10, most 50: a larger value returns 50 with a message.",
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City, country name or ISO country code, such as \"London\" or \"DE\"",
                "maxLength": 200,
                "type": "string"
              },
              "postedSince": {
                "description": "Date as YYYY-MM-DD, such as \"2026-10-01\"; keeps jobs posted on or after it",
                "maxLength": 40,
                "pattern": "^\\d{4}-\\d{2}-\\d{2}",
                "type": "string"
              },
              "remote": {
                "description": "true to keep only remote jobs",
                "type": "boolean"
              },
              "withSalary": {
                "description": "true to keep only jobs that publish a salary",
                "type": "boolean"
              }
            },
            "required": ["companies"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "companies": {
                "items": {
                  "properties": {
                    "boardUrl": {
                      "type": "string"
                    },
                    "company": {
                      "type": "string"
                    },
                    "filters": {
                      "description": "The filters the list was cut to. When set, the board has other open jobs too.",
                      "type": "object"
                    },
                    "jobs": {
                      "items": {
                        "properties": {
                          "applyUrl": {
                            "type": "string"
                          },
                          "department": {
                            "type": ["string", "null"]
                          },
                          "employmentType": {
                            "type": ["string", "null"]
                          },
                          "locations": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "postedOn": {
                            "type": ["string", "null"]
                          },
                          "salary": {
                            "properties": {
                              "currency": {
                                "type": ["string", "null"]
                              },
                              "interval": {
                                "type": ["string", "null"]
                              },
                              "max": {
                                "type": ["number", "null"]
                              },
                              "min": {
                                "type": ["number", "null"]
                              }
                            },
                            "type": ["object", "null"]
                          },
                          "summary": {
                            "type": ["string", "null"]
                          },
                          "title": {
                            "type": "string"
                          },
                          "workplace": {
                            "enum": ["remote", "hybrid", "onsite", null],
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["applyUrl", "locations", "title"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "matchedOn": {
                      "description": "title: every job's title names the keyword. text: no title did, and these jobs only mention it in the posting.",
                      "enum": ["title", "text"],
                      "type": "string"
                    },
                    "message": {
                      "description": "Why the list is empty or missing, and the next step: for not_found ask for the careers page link, for unavailable retry once later.",
                      "type": "string"
                    },
                    "moreAvailable": {
                      "type": "boolean"
                    },
                    "query": {
                      "type": "string"
                    },
                    "shown": {
                      "description": "How many jobs the list holds. Quote this count; do not count rows.",
                      "type": "integer"
                    },
                    "source": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["ok", "not_found", "unavailable"],
                      "type": "string"
                    }
                  },
                  "required": ["query", "status"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["companies"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
