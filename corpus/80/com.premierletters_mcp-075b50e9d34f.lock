{
  "lockfileVersion": 2,
  "subjects": {
    "com.premierletters/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.premierletters.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "premier-letters",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Premier Letters writes real letters, cards and postcards with an actual pen (or prints them, if asked) and mails them via USPS on behalf of the caller — from a single thank-you note to a large campaign. get_pricing, list_handwriting_styles, verify_address, connect_account and check_connection work without a key; everything else needs the user's Premier Letters API key as \"Authorization: Bearer pl_live_...\". If you have no key: call connect_account with the user's email and your name, show the user the returned user_code and ask them to approve the emailed link, then call check_connection every 10-30 seconds until it returns status \"approved\" with the api_key (shown once; save it). Recommended order flow: get_pricing to quote (pass output_mode \"printed_bw\" / \"printed_color\" for a printed letter body; default is handwritten), preview_letter to show the user the rendered letter, then create_order with an idempotency_key (reuse the same key when retrying so nothing is created or charged twice) and a return_address unless the account already has a default return address (without either, the order is refused unless no_return_address_ack is true), then get_order_status to follow delivery. get_balance shows the prepaid balance; create_topup_link returns a checkout link for the user to add funds. Paying with payment.method \"balance\" waives the small-order handling fee. Keys starting pl_test_ are test keys: create_order validates and prices but creates and charges nothing (the result has test: true).",
      "tools": [
        {
          "name": "check_connection",
          "description": "Check whether the user approved a connect_account request. Returns status pending, denied, expired or claimed, or, exactly once, status approved with the api_key. Poll every 10-30 seconds.",
          "inputSchema": {
            "properties": {
              "poll_secret": {
                "description": "poll_secret from connect_account.",
                "type": "string"
              },
              "request_id": {
                "description": "request_id from connect_account.",
                "type": "string"
              }
            },
            "required": ["poll_secret", "request_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c3080ad4791d3e3847e14c07a39c5411c0fc222ebef87d11791d68a7779c7e19"
        },
        {
          "name": "connect_account",
          "description": "Get a Premier Letters API key without the user copying one by hand. Pass the user's email and your name; we email them a link to approve (they can sign up from it if they have no account). Then call check_connection with the returned request_id and poll_secret every 10-30 seconds until it returns the api_key (returned once). Show the returned user_code to the user so they can match it on the approval page. No account or key needed to call this.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "description": "Your name as the user will see it, 1-80 characters: letters, digits, spaces and . , ' & ( ) - _ only (no links), e.g. \"Claude\".",
                "type": "string"
              },
              "email": {
                "description": "The account owner's email address. The approval link is sent here.",
                "type": "string"
              },
              "mode": {
                "description": "Key mode. Defaults to \"live\".",
                "enum": ["live", "test"],
                "type": "string"
              }
            },
            "required": ["agent_name", "email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:51b8e6cae0926b7e5246a5d880c5293d8dde3f8168264afcebbea455236c9d03"
        },
        {
          "name": "create_order",
          "description": "Create and pay for a Premier Letters order — a real, handwritten letter mailed via USPS. Requires a Premier Letters API key. Use get_pricing or preview_letter first to confirm the price. For payment, \"card_on_file\" charges the caller's saved card immediately, \"balance\" pays from the prepaid account balance (no small-order handling fee; fails with insufficient_balance when short), or \"checkout_session\" returns a checkout_url for the human to complete payment in a browser. Envelope return address: an explicit no_return_address_ack: true always wins; otherwise a supplied return_address, else the account default. With neither address, set no_return_address_ack: true to send without one.",
          "inputSchema": {
            "properties": {
              "extras": {
                "description": "Optional extra pieces for each envelope (printed insert, printed letter, your own insert, flyer, business card…). Call list_extras for pieces, options and prices. \"instant\" pieces are charged with the order; \"request\" pieces are priced by staff afterwards and cost nothing now.",
                "items": {
                  "properties": {
                    "artwork_url": {
                      "description": "https URL of print-ready artwork (PDF/PNG/JPEG). Required for instant printed pieces.",
                      "type": "string"
                    },
                    "note": {
                      "description": "Anything staff should know about this piece.",
                      "type": "string"
                    },
                    "options": {
                      "description": "Option choices, e.g. { \"size\": \"small\", \"color\": \"bw\" }. Omitted options take the first choice.",
                      "type": "object"
                    },
                    "piece": {
                      "description": "Piece key from list_extras.",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Per recipient (default) or in total when scope is \"flat\". Default 1.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "role": {
                      "description": "Write the handwritten letter ON this printed piece (printed letter, letter flyer, 4x6 postcard). Needs a pen-written letter of the matching product type.",
                      "enum": ["pen_stock"],
                      "type": "string"
                    },
                    "scope": {
                      "enum": ["per_recipient", "flat"],
                      "type": "string"
                    }
                  },
                  "required": ["piece"],
                  "type": "object"
                },
                "type": "array"
              },
              "idempotency_key": {
                "description": "Client-supplied key (1–255 chars). Repeating a call with the same key returns the original order instead of creating a second one. Always set this when you might retry.",
                "type": "string"
              },
              "mailing": {
                "description": "Optional: a built mailing instead of piecing together options + extras. Either a tier {\"tier\":\"essential\"} (luxe = pen letter + pen envelope; signature = pen-addressed envelope, printed-handwriting letter; essential = printed handwriting throughout; print = printed type) or a full mailing: {\"tier\":\"signature\",\"main\":{\"format\":\"card\",\"size\":\"card\",\"design\":\"thank_you\"},\"contents\":[{\"item\":\"business_card\",\"qty\":1}],\"addons\":[{\"id\":\"foil_seal\"}],\"envelopeStock\":\"premium_cream\"}. It sets product_type, output modes, paper, envelope and mailing_option, and adds its pieces to extras. Price it first with get_pricing (same mailing). Item ids: /llms-full.txt \"Build a mailing\".",
                "type": "object"
              },
              "message": {
                "description": "The letter text. Supports {{first_name}}, {{last_name}}, {{greeting}} merge fields per-recipient.",
                "type": "string"
              },
              "no_return_address_ack": {
                "description": "Send with no return address at all. An explicit no_return_address_ack: true always wins; otherwise a supplied return_address, else the account default. Undeliverable mail is then destroyed.",
                "type": "boolean"
              },
              "options": {
                "description": "handwriting_style, paper_type, product_type, mailing_option, authenticity_preset, include_letter, include_envelope, copies, output_mode (\"handwritten\" default; \"facsimile\" prints the handwriting on a laser printer; \"printed_bw\" / \"printed_color\" print typed text) and envelope_output_mode (null default = hand-addressed, or \"facsimile\" / \"printed_bw\" / \"printed_color\") — see /openapi.json for the full field list.",
                "type": "object"
              },
              "payment": {
                "properties": {
                  "method": {
                    "description": "Defaults to \"checkout_session\".",
                    "enum": ["card_on_file", "checkout_session", "balance"],
                    "type": "string"
                  },
                  "return_url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "recipients": {
                "description": "One or more recipients. At least one is required unless options.product_type is a letter/card with no envelope.",
                "items": {
                  "properties": {
                    "address_line1": {
                      "type": "string"
                    },
                    "address_line2": {
                      "type": "string"
                    },
                    "city": {
                      "type": "string"
                    },
                    "custom_fields": {
                      "type": "object"
                    },
                    "first_name": {
                      "type": "string"
                    },
                    "last_name": {
                      "type": "string"
                    },
                    "state": {
                      "type": "string"
                    },
                    "zip": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "return_address": {
                "description": "Return address written on the envelope. Omit to use the account's default return address. Required unless the account has a default or no_return_address_ack is true. An explicit no_return_address_ack: true always wins; otherwise a supplied return_address, else the account default. name, address_line1, city, state and zip are required unless return_address_partial_ok is true.",
                "properties": {
                  "address_line1": {
                    "type": "string"
                  },
                  "address_line2": {
                    "type": "string"
                  },
                  "city": {
                    "type": "string"
                  },
                  "company": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "state": {
                    "description": "2-letter US state code.",
                    "type": "string"
                  },
                  "zip": {
                    "description": "5-digit ZIP or ZIP+4.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "return_address_partial_ok": {
                "description": "Send return_address exactly as written although it is incomplete: at least one of name, company, address_line1, city, state, zip. Only the filled lines print (a name alone is fine). Without it an incomplete return_address is refused.",
                "type": "boolean"
              },
              "skip_invalid": {
                "description": "When true, invalid recipients are skipped instead of failing the whole order.",
                "type": "boolean"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dd1cce03c7b48e5b3dd0481a5abc2cfa0049a8456a5316ccb916e8191599fd23"
        },
        {
          "name": "create_topup_link",
          "description": "Create a Stripe Checkout link that adds prepaid credit (plus any bonus tier) to the authenticated account. Give checkout_url to the human to pay in a browser; the balance updates once they pay (check with get_balance). amount_cents must be a whole number between min_cents and max_cents from get_balance.",
          "inputSchema": {
            "properties": {
              "amount_cents": {
                "description": "Amount to add, in cents (e.g. 5000 for $50.00).",
                "type": "integer"
              }
            },
            "required": ["amount_cents"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bdc84cbdbfacde77dc44515d9136737a412c6fb7b869db60b9c1905750a1a03b"
        },
        {
          "name": "get_balance",
          "description": "Get the authenticated account's prepaid balance (balance_cents) and the top-up rules: minimum and maximum top-up, bonus tiers and suggested amounts. Orders paid with payment.method \"balance\" skip the small-order handling fee. Use create_topup_link to add funds.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4454b08e48fb0c9f8949f74624fb02b6c5d0e35d5f4db23814aef929511cfda8"
        },
        {
          "name": "get_order_status",
          "description": "Get an order's status, delivery/tracking summary, and per-recipient mail status.",
          "inputSchema": {
            "properties": {
              "order_id": {
                "description": "The order UUID returned by create_order.",
                "type": "string"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7746fcec31064535187cf21bf76432d606a6389cdbd7a521a54343ddcdbcb778"
        },
        {
          "name": "get_pricing",
          "description": "Get a live price quote for a Premier Letters order. Pass char_count (or letter_count for a rough estimate) plus optional mailing_option and paper_type to get a per-piece and total price, in cents. No account needed. Orders under 5 pieces carry a $0.99 per-piece handling fee (included in total_cents), waived when paid from a prepaid balance. Pass output_mode (printed_bw / printed_color, or facsimile for the handwriting printed on a laser printer) to quote a printed letter body instead of a pen-written one, and envelope_output_mode to quote a printed envelope. Or pass tier (luxe = letter and envelope written with a real pen; signature = pen-addressed envelope with a printed-handwriting letter; essential = printed handwriting throughout; print = printed type) and/or mailing (a whole built mailing: contents such as coupons, flyers, business cards; add-ons such as wax seals or QR codes; paper and envelope stock) to price it line by line. Every response lists the tiers with their per-piece price.",
          "inputSchema": {
            "properties": {
              "char_count": {
                "description": "Length of the letter message in characters. Longer letters cost more (character meter).",
                "type": "number"
              },
              "envelope_output_mode": {
                "description": "Omit (or null) for a hand-addressed envelope, the default. facsimile prints the handwritten addressing; printed_bw / printed_color print typed addressing.",
                "enum": ["facsimile", "printed_bw", "printed_color"],
                "type": "string"
              },
              "envelope_stock": {
                "description": "Envelope stock: \"standard\" (white, included), \"premium_white\" or \"premium_cream\". Defaults to \"standard\". Ignored for postcards.",
                "enum": ["standard", "premium_white", "premium_cream"],
                "type": "string"
              },
              "letter_count": {
                "description": "Number of recipients / pieces. Defaults to 1.",
                "type": "number"
              },
              "mailing": {
                "description": "A built mailing (same shape as the mailing field on create_order). Example: {\"tier\":\"signature\",\"contents\":[{\"item\":\"coupon\",\"qty\":1}],\"addons\":[{\"id\":\"wax_seal\"}]}. See /llms-full.txt \"Build a mailing\" for every item id.",
                "type": "object"
              },
              "mailing_option": {
                "description": "Delivery option. Defaults to \"we_mail\" (we write, stamp, and mail it for you).",
                "enum": ["we_mail", "you_mail_stamped", "you_mail_no_stamp"],
                "type": "string"
              },
              "output_mode": {
                "description": "Defaults to \"handwritten\". facsimile prints the handwriting layout on a laser printer; printed_bw / printed_color print typed text. The envelope stays hand-addressed unless envelope_output_mode is set.",
                "enum": ["handwritten", "facsimile", "printed_bw", "printed_color"],
                "type": "string"
              },
              "paper_type": {
                "description": "Letter paper stock. \"standard\" = white page (included), \"premium_white\" = premium white page, \"premium\" = premium cream page. Defaults to \"standard\". The response carries each stock's exact spec sheet (brand, item number, weight, thickness, brightness).",
                "enum": ["standard", "premium_white", "premium"],
                "type": "string"
              },
              "product_type": {
                "description": "Product type (letter, card, postcard, etc). Informational only — does not change pricing components beyond envelope inclusion.",
                "enum": ["letter", "card", "a7", "postcard", "card_5x7", "postcard_5x7", "a4", "a5", "a6"],
                "type": "string"
              },
              "sheet_count": {
                "description": "Sheets the letter runs to (preview_letter returns page_count). Long letters on heavier paper can pass 1 oz; every ounce over 1 adds the USPS extra-ounce rate when we mail it. Defaults to 1.",
                "type": "number"
              },
              "tier": {
                "description": "Price a tier: luxe (Letter and envelope written with a real pen); signature (A real pen on the envelope, printed handwriting inside); essential (Printed handwriting, letter and envelope); print (Clean printed type).",
                "enum": ["luxe", "signature", "essential", "print"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:47e79c9b2cdabe901a9c8fbd0e535363b71255d43e9c501e9244e119b45396bd"
        },
        {
          "name": "list_extras",
          "description": "List the extra pieces that can go in each envelope with a Premier Letters order: printed inserts, printed letters, your own inserts, flyers, postcards, business cards. Each has options, a per-unit price in cents, a lead time and a purchase mode: \"instant\" pieces are charged with the order, \"request\" pieces are priced by staff after the order is placed. Pass them as `extras` on create_order. With an API key, the account's own prices apply.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ee4d4801eea66a833abf0bf8e13d3c89c2c1641888c7430d04befefe1c40a078"
        },
        {
          "name": "list_handwriting_styles",
          "description": "List available handwriting styles (fonts) for a letter order. Use the returned \"id\" as options.handwriting_style / handwriting_style when creating an order or previewing.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:479b67e54bc5dffcdeb185cf58407f9b637174039dc8b7f70e2fffbb9ea3ed0e"
        },
        {
          "name": "list_orders",
          "description": "List the authenticated user's recent orders.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max orders to return (1-100). Defaults to 20.",
                "type": "number"
              },
              "status": {
                "description": "Optional status filter (pending_payment, paid, in_production, mailed, delivered, cancelled, refunded).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0b2497a5959f1a148aed6ad11165fc2a3285927bb61ddc5c001b311277e4f1d2"
        },
        {
          "name": "list_templates",
          "description": "List the authenticated user's saved letter templates.",
          "inputSchema": {
            "properties": {
              "favorites_only": {
                "description": "Only return favorited templates.",
                "type": "boolean"
              },
              "search": {
                "description": "Filter templates by name or content substring.",
                "type": "string"
              },
              "sort": {
                "description": "Sort order. Defaults to \"recent\".",
                "enum": ["recent", "most_used", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4fdea45d40754ddf637bca6cdca902ea4ea0d8d9d6bec85f12f415b772ab423b"
        },
        {
          "name": "preview_letter",
          "description": "Render a preview of a handwritten letter (as an SVG image) and get its price, before creating an order. Does not save anything.",
          "inputSchema": {
            "properties": {
              "handwriting_style": {
                "description": "Font UUID from list_handwriting_styles. Defaults to the house font.",
                "type": "string"
              },
              "message": {
                "description": "The letter text to render.",
                "type": "string"
              },
              "product_type": {
                "description": "Product slug: letter, card, postcard, etc. Defaults to \"letter\".",
                "type": "string"
              },
              "recipient": {
                "description": "Optional recipient info, used only to personalize {{merge fields}} in the message before rendering.",
                "properties": {
                  "first_name": {
                    "type": "string"
                  },
                  "last_name": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db069b4778af3221d04e4fef1dc00881f29371f49b78795882620784a1316b7a"
        },
        {
          "name": "verify_address",
          "description": "Verify and standardize a US mailing address via USPS. Use before create_order to catch typos and get the USPS-standardized form.",
          "inputSchema": {
            "properties": {
              "address_line1": {
                "description": "Street address",
                "type": "string"
              },
              "address_line2": {
                "description": "Apt/suite/unit (optional)",
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code",
                "type": "string"
              },
              "zip": {
                "description": "5-digit or ZIP+4 postal code",
                "type": "string"
              }
            },
            "required": ["address_line1", "city", "state", "zip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fdd2c9b61fb638b5bacec9c6eb263ed8b783a671ef25aedbe8bf319186783890"
        }
      ],
      "digest": "sha256:30f8d14b5c8fbcd3ad56f1b025f68ec66c70f9d5bce061b7204dfc6bd0b4c9f4"
    }
  }
