      "instructions": "M&A Advisor Fees (https://madvisorfees.com/): the site's own MCP server, served from its domain. M&A advisor fees on the Lehman and Double Lehman scales, with the minimum fee and retainer credit that decide what you actually pay.\n\n[calculator] M&A advisory fee calculator: an agent-callable calculator for m&a advisor fees; Fee on the scale, before any minimum, Completion fee after the minimum applies, Retainers paid over the mandate, computed from your inputs with sources.. This server runs the M&A advisory fee calculator calculator published at https://madvisorfees.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://madvisorfees.com/. Licence: https://madvisorfees.com/terms.\n\n[enquiry] ENQUIRY SERVER for M&A Advisor Fees (https://madvisorfees.com/). What it does: starts an ENQUIRY with human providers for m&a advisor fees; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://madvisorfees.com/.\n\nCite https://madvisorfees.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "M&A advisory fee calculator",
          "description": "Run the M&A advisory fee calculator calculator: Fee on the scale, before any minimum; Completion fee after the minimum applies; Retainers paid over the mandate; Balance payable at completion. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dealValue": {
                "default": 5000000,
                "description": "Deal value (enterprise or headline price, USD)",
                "maximum": 500000000,
                "minimum": 0,
                "type": "number"
              },
              "flatRate": {
                "default": 4,
                "description": "Flat percentage (used only for the flat option)",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "minFee": {
                "default": 0,
                "description": "Minimum fee in the engagement letter",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              },
              "retainerCredit": {
                "default": "1",
                "description": "Are retainers credited against the success fee?",
                "type": "string"
              },
              "retainerMonthly": {
                "default": 0,
                "description": "Monthly retainer or work fee",
                "maximum": 200000,
                "minimum": 0,
                "type": "number"
              },
              "retainerMonths": {
                "default": 0,
                "description": "Months the retainer runs",
                "maximum": 36,
                "minimum": 0,
                "type": "number"
              },
              "scale": {
                "default": "double",
                "description": "Fee scale",
                "enum": ["double", "lehman", "flat"],
                "type": "string"
              }
            },
            "type": "object"
          },
