      "serverInfo": {
        "name": "atom-agent-channel",
        "title": "Atom Technologies agent channel",
        "version": "1.1.0",
        "websiteUrl": "https://atomtechnologies.ai/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Automated MCP server for Atom Technologies (not a person). Read tools return Atom Technologies' published facts, services, prices, FAQ and an honest fit record (check_fit: who it is for, when it is not a fit, proof with its basis, alternatives). request_quote, book_call and send_inquiry record an inquiry that a person on the team reads and answers; book_call with a start from get_available_times returns a link the person confirms. Privacy: Atom Digital Technologies LLP (England and Wales, OC450214), which trades as Atom Technologies is responsible for the information an agent sends here. It is used to answer this inquiry, follow up on it and count inquiries, under UK GDPR (Article 6(1)(b), steps you asked for before a contract, and 6(1)(f), legitimate interests); for contacts in the United States, the applicable state privacy laws. It is not sold. It is kept 12 months from receipt, then deleted; ask privacy@atomtechnologies.ai to see, correct or delete it sooner. Full notice: https://atomtechnologies.ai/privacy/",
      "tools": [
        {
          "name": "book_call",
          "title": "Book a call with Atom Technologies",
          "description": "Book a 30-minute call with Atom Technologies for a person. With start (from get_available_times) it returns a confirmation link to give the person: one click confirms, then the calendar invite comes from Atom Technologies. Without start it records a call request and a person replies with a time. Set consent to true only if the person agreed to be contacted. A person on the team answers; nothing is emailed automatically.",
          "inputSchema": {
            "properties": {
              "agent": {
                "additionalProperties": false,
                "description": "The agent sending this (optional but recommended). The User-Agent header is recorded too.",
                "properties": {
                  "name": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "operator": {
                    "description": "Who runs the agent.",
                    "maxLength": 160,
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "maxLength": 300,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "budget": {
                "description": "Budget or range, free text (e.g. \"$20k-30k a month\").",
                "maxLength": 200,
                "type": "string"
              },
              "company": {
                "description": "The organization the person represents.",
                "maxLength": 160,
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "True only if the person named in contact agreed to be contacted by this company about this inquiry.",
                "type": "boolean"
              },
              "contact": {
                "additionalProperties": false,
                "description": "The person to answer. An email or a phone is required.",
                "properties": {
                  "email": {
                    "format": "email",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "phone": {
                    "description": "International format, e.g. +1 212 555 0100.",
                    "maxLength": 32,
                    "type": "string"
                  },
                  "role": {
                    "description": "Job title or role.",
                    "maxLength": 160,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "language": {
                "description": "Language for the answer.",
                "enum": ["en", "es", "pt"],
                "type": "string"
              },
              "need": {
                "description": "What the person needs, in their words: the problem, scope, roles or volumes.",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              },
              "on_behalf_of": {
                "description": "Who the agent acts for: the person and, if any, their organization.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "preferred_times": {
                "description": "Without a start: the days and times that suit the person, with the time zone.",
                "maxLength": 300,
                "type": "string"
              },
              "start": {
                "description": "A start exactly as get_available_times listed it. Needs contact.email (the invite goes there).",
                "format": "date-time",
                "maxLength": 40,
                "type": "string"
              },
              "test": {
                "description": "True to test an integration: recorded and marked as a test, nobody follows up.",
                "type": "boolean"
              },
              "timeline": {
                "description": "When they want to start or decide.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["consent", "contact", "need", "on_behalf_of"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a call"
