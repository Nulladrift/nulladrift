{
  "lockfileVersion": 2,
  "subjects": {
    "com.eurogpsr/eu-ai-act": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://eurogpsr.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "eurocomply",
        "title": "EuroComply · EU AI Act",
        "version": "1.1.0",
        "websiteUrl": "https://eurogpsr.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for EU AI Act (Regulation (EU) 2024/1689) triage: classify an AI system by risk tier, estimate the maximum fine, generate Article 50 disclosure notices, and list application dates. Results are triage signals, not legal advice.",
      "tools": [
        {
          "name": "classify_ai_system",
          "title": "Classify an AI system under the EU AI Act",
          "description": "Classifies an AI system into the EU AI Act risk tiers (prohibited, high, limited, minimal) from 9 facts about it. Returns the tier, a compliance score, findings with the legal article, the documents the tier requires, and a link to the saved report. Ask the user for any fact you do not know instead of guessing.",
          "inputSchema": {
            "properties": {
              "aiSystemType": {
                "description": "What the system does.",
                "enum": ["chatbot", "recommendation", "hr_screening", "credit_insurance", "biometric", "content_moderation", "medical_diagnosis", "fraud_detection", "other"],
                "type": "string"
              },
              "companyName": {
                "description": "Optional, shown on the saved report.",
                "type": "string"
              },
              "consumerFacing": {
                "description": "People interact with it directly.",
                "type": "boolean"
              },
              "disclosesAi": {
                "description": "How users are told it is AI.",
                "enum": ["clearly", "tos_only", "no"],
                "type": "string"
              },
              "euJurisdiction": {
                "description": "Whether it is offered or its output used in the EU (\"spain\" if Spain specifically).",
                "enum": ["none", "eu", "spain"],
                "type": "string"
              },
              "hasHumanOversight": {
                "description": "A person can review and override its output.",
                "type": "boolean"
              },
              "hasTechnicalDocs": {
                "description": "Technical documentation of the system exists.",
                "type": "boolean"
              },
              "industry": {
                "description": "Sector where it is used.",
                "enum": ["health", "employment", "financial", "infrastructure", "education", "law_enforcement", "ecommerce_marketing", "entertainment", "migration", "other"],
                "type": "string"
              },
              "makesConsequentialDecisions": {
                "description": "Effect on people: binding decisions, influences a human decision, or none.",
                "enum": ["binding", "influential", "none"],
                "type": "string"
              },
              "processesBiometric": {
                "description": "Processes biometric data (face, voice, fingerprint, emotion).",
                "type": "boolean"
              }
            },
            "required": ["aiSystemType", "consumerFacing", "disclosesAi", "euJurisdiction", "hasHumanOversight", "hasTechnicalDocs", "industry", "makesConsequentialDecisions", "processesBiometric"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2a1ce2eed3368007fcde9975a3ef2e518afdf7b3f51601b13f22e3b4cf04da1f"
        },
        {
          "name": "estimate_ai_act_fine",
          "title": "Estimate the maximum EU AI Act fine",
          "description": "Maximum administrative fine under Articles 99 and 101 of the EU AI Act for a violation type, given worldwide annual turnover, including the lower-of rule for SMEs (Art. 99(6)).",
          "inputSchema": {
            "properties": {
              "annualTurnoverEur": {
                "description": "Total worldwide annual turnover in euros.",
                "type": "number"
              },
              "isSme": {
                "description": "The company is an SME or start-up.",
                "type": "boolean"
              },
              "violation": {
                "description": "prohibited: Deploying a system that falls under Article 5. obligations: Failing provider, deployer, importer, distributor or transparency duties. information: Supplying incorrect, incomplete or misleading information to notified bodies or authorities. gpai: Fines imposed by the European Commission on providers of general-purpose AI models.",
                "enum": ["prohibited", "obligations", "information", "gpai"],
                "type": "string"
              }
            },
            "required": ["annualTurnoverEur", "isSme", "violation"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49a637e8fd63b8b7346c353ee7eedd17fe459625e888020b7513655974140d35"
        },
        {
          "name": "generate_ai_disclosure_notice",
          "title": "Generate Article 50 AI disclosure notices",
          "description": "Ready-to-paste \"you are interacting with an AI\" notices required by Article 50 of the EU AI Act, for chat, voice and AI-generated content, in up to 8 EU languages (en, es, de, fr, it, pt, nl, pl).",
          "inputSchema": {
            "properties": {
              "assistantName": {
                "description": "Name of the assistant, if it has one.",
                "type": "string"
              },
              "chat": {
                "description": "Text chat channel (default true).",
                "type": "boolean"
              },
              "company": {
                "description": "Company name.",
                "type": "string"
              },
              "generatedContent": {
                "description": "Publishes AI-generated text, images, audio or video.",
                "type": "boolean"
              },
              "hasHumanHandoff": {
                "description": "Users can be transferred to a human (default true).",
                "type": "boolean"
              },
              "languages": {
                "description": "Defaults to [\"en\"].",
                "items": {
                  "enum": ["en", "es", "de", "fr", "it", "pt", "nl", "pl"],
                  "type": "string"
                },
                "type": "array"
              },
              "voice": {
                "description": "Voice or phone channel.",
                "type": "boolean"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bfd42df27637409c81139cb498f7778a3309a7ae8348933d4adc352a5140863b"
        },
        {
          "name": "list_ai_act_deadlines",
          "title": "List EU AI Act application dates",
          "description": "Every application date of the EU AI Act after the 2026 Digital Omnibus (Regulation (EU) 2026/1744): what applies, to whom, the legal basis and how many days are left.",
          "inputSchema": {
            "properties": {
              "upcomingOnly": {
                "description": "Only dates that have not passed (default false).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:704e69d48ec56957aaa455da5492975fcaba5672d9a80e67c93f037039c386e3"
        }
      ],
      "digest": "sha256:e93d502959b1613d3448c2aa2b7f37569d3a68fad6f1f47bd6f1e59ddd7ad931"
    }
  }
