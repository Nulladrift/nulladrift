{
  "lockfileVersion": 2,
  "subjects": {
    "com.botrecipe/approve": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://approve.cloudforbots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "approval-rules",
        "title": "Approval Rules",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Rules for what your AI agent may do without asking. Small, reversible actions under your limits get auto-approved; everything else becomes a plain-English approval card you tap Approve or Reject on. Free watch-only mode logs what it would decide and drafts a weekly report; Pro at $9 a month makes the rules act. Free 200 calls/day, then $9/month. No model inside: bring your own model. Works with Claude, Codex, ChatGPT, Grok Bot.",
      "tools": [
        {
          "name": "check_action",
          "description": "Before a consequential action, ask whether the user's rules auto-approve it. Returns auto_approve, needs_approval (with a plain-English approval card and a link the user can tap) or deny. Free plan is watch-only: it reports what it WOULD decide and logs it for the weekly report, but nothing counts as approved, so ask your user as you normally would.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "The action your agent wants to take.",
                "properties": {
                  "amount_usd": {
                    "description": "Money involved, if any.",
                    "type": "number"
                  },
                  "reversible": {
                    "description": "Can it be undone easily?",
                    "type": "boolean"
                  },
                  "summary": {
                    "description": "One plain sentence of what will happen, e.g. \"Buy a $3.99 domain renewal for example.com\".",
                    "type": "string"
                  },
                  "target": {
                    "description": "Who or what it touches: a recipient email, domain, file, repo.",
                    "type": "string"
                  },
                  "type": {
                    "description": "Short verb: read, search, draft, send_email, send_message, post, purchase, payment, delete, deploy, change_settings, ...",
                    "type": "string"
                  }
                },
                "required": ["summary", "type"],
                "type": "object"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2fddebd37749755d70925f296f491835e13134f801817d3acc9e663825fd89c7"
        },
        {
          "name": "get_decision",
          "description": "Check whether the user approved or rejected an approval card (by card_id and card_token). Only act when status is approved.",
          "inputSchema": {
            "properties": {
              "card_id": {
                "type": "string"
              },
              "card_token": {
                "type": "string"
              }
            },
            "required": ["card_id", "card_token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:58ccaeacc68e0788c01630458f43046b863dccea8e0f6bb51dbda7df05492a37"
        },
        {
          "name": "get_rules",
          "description": "Show the rules in effect for your key (or the default starter rules).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:da82165c37a8652d9a8e9ca9667b5a490fe4dd81a18a30dc61e360605379b9d6"
        },
        {
          "name": "set_rules",
          "description": "Save the user's rules (needs an API key so they stay yours). Each rule: {name, when:{type:[...], max_usd, min_usd, reversible, target_ends_with:[...]}, verdict:\"auto\"|\"ask\"|\"deny\"}. First matching rule wins; anything unmatched needs approval. Call once without confirm to preview, then with confirm=true.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "type": "boolean"
              },
              "rules": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["rules"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:110948c363373520477c0725d835d8dc233a8b569424ba616256fc70f359f9a9"
        },
        {
          "name": "usage_and_upgrade",
          "description": "Show today's usage for your key or IP and the $49/month All Access upgrade link (cloudforbots.com/offer). Free tier: 200 calls/day. Not metered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8f2fae665f48ad1879525f8a7023431e48225c5b814347f2c286d849cd0cb9dc"
        },
        {
          "name": "weekly_report",
          "description": "Draft a plain-English report of the last 7 days: actions checked, how many your rules would auto-approve, how many needed you, top kinds of asks, and rule suggestions. Read-only; sends nothing.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d4729f9d5714d0bed6e24b7f8de19c1e719aeb21799c1b7219ac3f34e47cf6bb"
        }
      ],
      "digest": "sha256:122310c7b66ab886eab308e237c837289777c72833faec49f3f3199a08258d89"
    }
  }
}
