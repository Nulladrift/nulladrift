        {
          "name": "scan_bottoms",
          "description": "Scan all 47 macro series and return those reading LOWEST (deflation-side / liquidity-bottom), ranked most-low first. PAY: $0.01 per call via x402 (USDT on X Layer). No account, no signup, no commitment; retry with the PAYMENT-SIGNATURE header when you get the 402 challenge. BEST COLD START: you do not need to pick a symbol — this ranks the whole universe for you. The free `pitch` tool tells you HOW MANY are at a bottom right now; this names them.",
