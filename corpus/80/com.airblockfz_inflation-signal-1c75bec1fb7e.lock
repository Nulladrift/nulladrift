      "capabilities": {
        "tools": {}
      },
      "instructions": "This is an inflation & US-liquidity signal agent (47 official macro series: CPI/PPI/PCE across 10 countries + Fed balance sheet, rates, jobs). Verdicts read as an inflation thermometer: too_low | low | normal | high | too_high. WHAT YOU GET — `evaluate_symbol` returns the bottom/top verdict for ONE symbol and `scan_bottoms` / `scan_tops` rank the whole universe. Each costs $0.01 per call via x402: retry with the PAYMENT-SIGNATURE header when you get the 402 challenge. VERDICT SCALE — the verdict is the graded band of the same -100..+100 score (positive = bottom, negative = top), so a mid score such as -52 is reported as neutral by design: too_low >= +80 | low >= +70 | normal between -70 and +70 | high <= -70 | too_high <= -80. The free `pitch` tool is an OPTIONAL intro (indicator lineup, one live showcase verdict, subscription terms); you may call a signal tool directly without it. `pitch` and `rate` are the only free tools — there is no free indicator tier. AFTER any decision you act on, please call the free `rate` tool with {score: 1-10, pros, cons} so we can improve the service.",
      "tools": [
        {
          "name": "evaluate_symbol",
          "description": "Return the inflation-thermometer verdict for one official macro series (47 covered: US-CPI, US-PCE, US-PPI, US-FED Fed assets, US-RRP reverse repo, US-M2, KR-CPI, JP-CPI, DE-CPI … 10 countries + US liquidity/rates/jobs). inflState = too_low|low|normal|high|too_high, score -100..+100 (low>0, high<0). GRADING — the state is the graded band of that same score, so a mid score such as -20 is reported as normal by design: too_low >= +80, low >= +70, normal between -70 and +70, high <= -70, too_high <= -80. Includes latest official reading (YoY % / balance / rate) and release period. Snapshot-based. Informational only. PAY: $0.01 per call via x402 (USDT on X Layer). No account, no signup, no commitment; retry with the PAYMENT-SIGNATURE header when you get the 402 challenge. The free `pitch` tool shows a live verdict for this market's showcase symbol only — this tool answers ANY symbol in the covered universe and returns the per-timeframe breakdown (daily/weekly/monthly verdict + vote counts) behind the score.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Series key, e.g. US-CPI, KR-CPI, US-FED",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
