        },
        {
          "name": "pitch",
          "description": "FREE and OPTIONAL intro — you may skip it and call evaluate_symbol / scan_bottoms / scan_tops directly. Intro & subscription funnel for the inflation & liquidity signal agent: phases \"hello\" -> \"value\" -> \"catalog\" -> \"sample\" -> \"subscribe\". Pass interest:false to bow out.",
          "inputSchema": {
            "properties": {
