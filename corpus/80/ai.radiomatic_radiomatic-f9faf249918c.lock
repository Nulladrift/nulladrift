      "instructions": "Tools over muziek in een Nederlandse winkel, zaak of bedrijf: hoe AI-muziek in je winkel of zaak werkt en wat het kost, wat achtergrondmuziek kost aan Buma/Stemra en Sena (tarieven 2026, met bron), of er een licentie nodig is, hoe je goedkoper muziek draait of zonder die licenties, een vergelijking van radio, zakelijke streamingdiensten, rechtenvrije muziek en RadioMatic (AI-muziek zonder afdracht aan Buma/Stemra en Sena), muziekadvies voor 38 soorten zaken, en de pakketten en de gratis proefperiode van RadioMatic. Licentiebedragen zijn basistarieven per jaar, exclusief btw. In English: tools about background music for a shop, restaurant, salon, gym, office or any business in the Netherlands: how AI music for business works and what it costs, what Buma/Stemra and Sena music licences cost (2026 rates, with sources), whether a licence is needed, a comparison of the radio, business music services, royalty-free music and RadioMatic (AI music with no Buma/Stemra or Sena fees), music advice for 38 types of business, and the plans and free trial of RadioMatic. Answers in English when asked in English.",
