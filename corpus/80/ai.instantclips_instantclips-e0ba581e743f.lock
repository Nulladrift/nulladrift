        {
          "name": "generate_video",
          "title": "Generate the video (spends credits)",
          "description": "Render the video. SPENDS THE USER'S CREDITS: ask first, with the direction, settings, cost and any\nwatermark, and pass the cost as `expected_credit_cost`. External services render it; it gets a\npublic share page and may send account email.\n",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "expected_credit_cost": {
                "description": "The cost you told the user, from get_product's video_direction.credit_cost. A stale one is refused, uncharged.",
                "type": "integer"
              },
              "product_id": {
                "description": "The product to render. Its current direction and settings are used as-is.",
                "type": "string"
              }
            },
            "required": ["expected_credit_cost", "product_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "credits_charged": {
                "type": "number"
              },
              "credits_remaining": {
                "type": "number"
              },
              "email_on_completion": {
                "type": "string"
              },
              "next_step": {
