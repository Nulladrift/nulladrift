          "description": "슈퍼쇼핑 상품의 대표 이미지를 실제 이미지(렌더 가능)로 반환.\n\n언제: 사용자가 상품 사진을 보고 싶어할 때(\"이 코트 보여줘\"). 검색/추천 결과의 thumbnail은\nURL(텍스트)이라 화면에 안 뜨므로, 시각 확인이 필요하면 이 툴로 이미지 자체를 가져온다.\n반환: 이미지 콘텐츠(여러 개를 한 번에 보여주지 말고 관심 상품 위주로 호출).",
