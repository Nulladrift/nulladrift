        {
          "name": "compare_products",
          "title": "슈퍼쇼핑 상품 비교",
          "description": "슈퍼쇼핑 상품 여러 개(2~5개)의 스펙·가격 비교 매트릭스 + 한 줄 결론.\n\n언제: 사용자가 후보 여러 개를 견주려 할 때(\"이 중에 뭐가 나아?\"). product_ids는 search 결과에서.\n반환: {attributes: 공통 키, matrix: 상품별 값/가격, verdict: 한국어 결론}.",
