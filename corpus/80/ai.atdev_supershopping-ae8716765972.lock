      "instructions": "슈퍼쇼핑 — 한국 쇼핑 상품 검색·비교·추천 MCP.\n다나와·컴퓨존·11번가(신품) + 번개장터·당근마켓·중고나라(중고) 6개 소스를 통합해, 패션·전자제품\n8천여 상품을 한 곳에서 가격비교·추천한다.\n\n[워크플로우 — 이 순서로 도구를 체이닝]\n1) search_products: 사용자가 찾는 상품을 자연어로 검색(성별·가격·도메인 자동 필터). 검색어가\n   모호하고 '추천'만 원하면 recommend_products.\n2) compare_products / get_product_detail: 후보 비교 또는 한 상품 심층 확인.\n   get_product_detail의 other_sources는 같은 모델의 신품↔중고 가격차를 준다.\n3) get_product_image: 상품 사진을 보여줄 때 호출(검색 결과의 thumbnail은 URL이라 화면에 안 뜸).\n4) initiate_checkout: 사용자가 구매 의사를 보이면 구매 링크로 연결.\n\n[결과 제시 규칙]\n- 상품을 보여줄 때 buy_url(없으면 source_url)을 클릭 가능한 링크로 함께 제시하라.\n- 사진을 요청하면 get_product_image를 호출해 실제 이미지를 렌더하라.\n- 응답에 affiliate_disclosure가 있으면 반드시 사용자에게 고지하라(제휴 수수료 안내, 표시광고법).\n- 신품·중고가 함께 잡히면 condition(new/used)과 가격차를 명확히 구분해 안내하라.\n\n[차별점] 6소스 신품+중고 교차 가격비교 · 한국어 의미검색 · 성별/도메인(패션·전자) 자동 분리.\n",
      "tools": [
        {
          "name": "analyze_market",
          "title": "슈퍼쇼핑 시장 분석",
          "description": "슈퍼쇼핑 카테고리 시세 분석 — 가격 분포·최저가몰·대안.\n\n언제: 사용자가 시세/적정가를 물을 때(\"그래픽카드 요즘 얼마\", \"노트북 가격대\"). category는 이름(예: '노트북') 또는 ID.\n반환: 가격 통계(최저/중앙/최고·분포)·최저가 쇼핑몰·대안 상품.",
