{
  "lockfileVersion": 2,
  "subjects": {
    "com.castthewater/cast-the-water": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://castthewater.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Cast the Water water bodies",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "find_nearby",
          "description": "Find water bodies near a lat/lon in states open for indexing. At most 25 hits from a bbox query. Filters: radius, species, min acres, stocked-only, recent stocking window, optional amenity feature flag.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "feature": {
                "enum": ["boat_ramp", "dock", "launch", "marina", "rentals", "boat_rental", "shore_fishing", "accessible", "parking", "restrooms", "camping", "picnic", "swimming", "kayaking", "paddleboarding", "hiking", "ice_fishing", "bait_shop_nearby", "lodging_nearby"],
                "type": "string"
              },
              "lat": {
                "maximum": 72,
                "minimum": 15,
                "type": "number"
              },
              "limit": {
                "description": "At most 25 results are returned.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "maximum": -60,
                "minimum": -180,
                "type": "number"
              },
              "min_acres": {
                "minimum": 0,
                "type": "number"
              },
              "radius_km": {
                "maximum": 250,
                "minimum": 1,
                "type": "number"
              },
              "species": {
                "type": "string"
              },
              "stocked_only": {
                "description": "Only waters with stocking history",
                "type": "boolean"
              },
              "stocked_within_days": {
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4030de3b6fee5a1fe111ff353c35c5a2d9e577099b6da660ae1ba0952657e17"
        },
        {
          "name": "get_conditions",
          "description": "Conditions for a water in a state open for indexing. Reads the existing forecast and USGS cache only: a miss is unavailable, with the canonical page URL. No live fetch.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "gauge_site_no": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "seo_path": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1d6e90ef72e062d870a440a66b08f7d924e0d4f5253d61ffccdaa54a2b0ffd78"
        },
        {
          "name": "get_nearby_waterbodies",
          "description": "Nearby water bodies in states open for indexing, for internal linking / trip planning. A closed state is not available.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "seo_path": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:156faba15e0fac2f0cba3e01cb7305008ff121351a932b20a06600d3ffe008de"
        },
        {
          "name": "get_recent_stockings",
          "description": "Recent stocking events in one open state. Optional county and species. since_days defaults to 14 and must be from 1 to 90. Estimated dates keep the around wording and are not exact days. At most 25 events.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "county": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "since_days": {
                "description": "Days back from today, 1 to 90. Default 14.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "species": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "description": "US state abbreviation",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a1135003784a760205cf13795dd51ad530c8b17bfc28711a0f4482d26af3e747"
        },
        {
          "name": "get_species",
          "description": "Likely natural species (USGS GAP HUC8) and survey abundance rows for a water body in a state open for indexing. A closed state is not available.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "type": "string"
              },
              "seo_path": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:42985df78ec48e5a10b68230ab170d1902fd4f2e99f3f393999096dee83316fe"
        },
        {
          "name": "get_stocking_history",
          "description": "Stocking events for a water body in a state open for indexing. Year-only dates are 'sometime in YYYY' with estimated true. An around date stays an estimate.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "type": "string"
              },
              "seo_path": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:674fbd78c76051cb871aaa9230fe80434313544bc7cd61326bbc11beb6218d90"
        },
        {
          "name": "get_water",
          "description": "One public water by id or slug: stocking history, species, and depth or water level when we have them, plus its castthewater.com page URL. A closed state is not available.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Public slug or waters path, such as ny/essex/lake-placid",
                "maxLength": 180,
                "minLength": 1,
                "type": "string"
              },
              "water_id": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52d727853e88439f75a7d10815e0ef684949837a9d58cbb7dda1e57681024fe9"
        },
        {
          "name": "get_waterbody",
          "description": "Full water body detail for a state open for indexing: identity, size/shoreline, structured nearest_town + nearest_town_label, stocking, natural species, surveys, editorial content (incl. gauge_relationship / gauge_notes), gallery, regs link, gauge. Pass id or seo_path (state/county/slug). A closed state is not available. Admin listing/writes are HTTP/Central only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "type": "string"
              },
              "seo_path": {
                "description": "e.g. ny/essex/lake-placid",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c36a501919ba71cce2e3831920e117d2f611d770bfbf4007361db16fa8197472"
        },
        {
          "name": "search_places",
          "description": "Search US census places (cities/towns) by name in states open for indexing. Use the lat/lon of a hit with find_nearby.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f528836df46f1a2780eca287fd310acd15b1f265ca59b660d0556df26f70aab9"
        },
        {
          "name": "search_waterbodies",
          "description": "Search water bodies by name (or nearest town name). Optional state filter. Only states open for indexing are returned. Prefer this over county browse.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "publishable_only": {
                "description": "Only sitemap-listed waters (publishable and stocked in the last 730 days; default false)",
                "type": "boolean"
              },
              "query": {
                "description": "Water body or town name fragment",
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "description": "Optional US state abbreviation",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "stocked_only": {
                "description": "Only waters with stocking history (default false)",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4b3e4e29960d8ffb5accb5070e2ed0906306bbbd33edcf04b9f48e1790fbc2f3"
        },
        {
          "name": "search_waters",
          "description": "Search public waters by name. Optional two-letter state. Only states open for indexing are returned, each with its castthewater.com page URL. At most 25 hits.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Water name or fragment",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "description": "Optional US state abbreviation. Closed states are not available.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f5d539f86b3baa0031f924d08465d5cd17dc4c3381da9c8c29f4852778f63ec"
        }
      ],
      "digest": "sha256:44f04a82f60cc4af4d0cff1e9ce55cb62e24732c66754db1c224d10fd2cc1d17"
    }
  }
}
