{
  "lockfileVersion": 2,
  "subjects": {
    "com.castthewater/cast-the-water": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://castthewater.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Cast the Water water bodies",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_recent_stockings",
          "description": "Recent stocking events in one open state. Optional county and species. since_days defaults to 14 and must be from 1 to 90. Estimated dates keep the around wording and are not exact days. At most 25 events.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "county": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "since_days": {
                "description": "Days back from today, 1 to 90. Default 14.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "species": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "description": "US state abbreviation",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a1135003784a760205cf13795dd51ad530c8b17bfc28711a0f4482d26af3e747"
        },
        {
          "name": "get_water",
          "description": "One public water by id or slug: stocking history, species, and depth or water level when we have them, plus its castthewater.com page URL. A closed state is not available.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Public slug or waters path, such as ny/essex/lake-placid",
                "maxLength": 180,
                "minLength": 1,
                "type": "string"
              },
              "water_id": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52d727853e88439f75a7d10815e0ef684949837a9d58cbb7dda1e57681024fe9"
        },
        {
          "name": "search_waters",
          "description": "Search public waters by name. Optional two-letter state. Only states open for indexing are returned, each with its castthewater.com page URL. At most 25 hits.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Water name or fragment",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "description": "Optional US state abbreviation. Closed states are not available.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f5d539f86b3baa0031f924d08465d5cd17dc4c3381da9c8c29f4852778f63ec"
        }
      ],
      "digest": "sha256:bc4da23fff975d827cf3700dcdff2f4f99d59663652e713f58c2ac42098b65bb"
    }
  }
}
