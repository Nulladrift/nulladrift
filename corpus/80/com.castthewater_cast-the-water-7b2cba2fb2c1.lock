{
  "lockfileVersion": 2,
  "subjects": {
    "com.castthewater/cast-the-water": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://castthewater.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Cast the Water",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "fetch",
          "description": "Use this when you already have a water id from search and need the readable detail: species and a conditions summary when one is already cached. A closed state is not available. This does not fetch a live forecast.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Water id returned by search.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {
                  "type": "string"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fe903dec0d7a5fdf8dfe5942fb18980ce4cdd8a3df39bd7bac6516f2cad6710d"
        },
        {
          "name": "get_water",
          "description": "One public water by id or slug: species, fishing conditions when cached, and depth or water level when we have them, plus its castthewater.com page URL. A closed state is not available.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Public slug or waters path, such as ny/essex/lake-placid",
                "maxLength": 180,
                "minLength": 1,
                "type": "string"
              },
              "water_id": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92286626cb32402c3487d8bc576e0bf79920bbe00f515f7dddbfbafa54beeee8"
        },
        {
          "name": "search",
          "description": "Use this when you need to find a public fishing water by name for research or a citation. Optional two-letter state. Only states open for indexing are searched, at most 25 hits, each with its castthewater.com page URL. An empty query returns no results. Call fetch with an id from these results.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Water name or words to search. An empty query returns no results.",
                "maxLength": 80,
                "type": "string"
              },
              "state": {
                "description": "Optional US state abbreviation. Closed states are left out.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6393f0e826f659c38c47ded0b2612f32dd5616d5b30eb358b1867597481f9e8d"
        },
        {
          "name": "search_waters",
          "description": "Search public waters by name. Optional two-letter state. Only states open for indexing are returned, each with its castthewater.com page URL. At most 25 hits.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Water name or fragment",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "description": "Optional US state abbreviation. Closed states are not available.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c634f74f839fa74af200c2254bb21e4ffaced94bc59b1babbf5f66959a64a230"
        }
      ],
      "digest": "sha256:4021e9388c5a2a0704383c92435c6765f27a33590c3dc1c7cf11593910e8bf31"
    }
  }
}
