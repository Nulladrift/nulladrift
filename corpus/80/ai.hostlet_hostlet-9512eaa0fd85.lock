{
  "lockfileVersion": 2,
  "subjects": {
    "ai.hostlet/hostlet": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hostlet.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Hostlet",
        "title": "Hostlet",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "Hostlet builds a real website for someone's business, club, building or project from a sentence, with its own AI that answers visitors, at name.hostlet.ai. Use make_website (it shows a live card and builds in about two minutes), then change_site for any change the user asks for, add_document to teach the site's AI, and check_site to show it again. make_ai makes just a simple chat AI. Never show the owner_key in your reply; the card has the private edit link.",
      "tools": [
        {
          "name": "add_document",
          "title": "Teach a Hostlet site",
          "description": "Give a site's AI a document to answer visitors from (a menu, price list, rules, FAQ): pass its title and full text.",
          "inputSchema": {
            "properties": {
              "owner_key": {
                "type": "string"
              },
              "site": {
                "type": "string"
              },
              "text": {
                "description": "The document text.",
                "type": "string"
              },
              "title": {
                "description": "Document title, e.g. \"House Rules 2024\".",
                "type": "string"
              }
            },
            "required": ["owner_key", "site", "text", "title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6bdb4169b4ecc90ece85b58f47d409dcc08c5179da4a0b15d7c9fcab508e71ba"
        },
        {
          "name": "ask_site",
          "title": "Ask a Hostlet site",
          "description": "Ask any public Hostlet site's AI a question (e.g. \"night-owls\" for night-owls.hostlet.ai). Pass passcode if the site has one, or owner_key for your own.",
          "inputSchema": {
            "properties": {
              "owner_key": {
                "type": "string"
              },
              "passcode": {
                "type": "string"
              },
              "question": {
                "type": "string"
              },
              "site": {
                "type": "string"
              }
            },
            "required": ["question", "site"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aa862d5025f65fd2d009b2665207f82dd41a38d77407eeb2af52652b1a42247d"
        },
        {
          "name": "change_site",
          "title": "Change a Hostlet site",
          "description": "Change a site made with make_website, in plain words: \"make the headline shorter\", \"add our hours: Tue to Sun 7 to 3\", \"add a section about catering\", \"use warmer colors\". Pass exactly what the user asked for.",
          "inputSchema": {
            "properties": {
              "change": {
                "description": "What to change, in the user's words.",
                "type": "string"
              },
              "owner_key": {
                "type": "string"
              },
              "site": {
                "description": "The site address name (e.g. \"maple-street-bakery\").",
                "type": "string"
              }
            },
            "required": ["change", "owner_key", "site"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://hostlet/card-sky.html",
            "openai/toolInvocation/invoked": "Done",
            "openai/toolInvocation/invoking": "Working on your site…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://hostlet/card.html"
            }
          },
          "digest": "sha256:5457a41cbe315c36cb96fd142f659d58a67891fab25805130b42c8031f240fa7"
        },
        {
          "name": "check_site",
          "title": "Show a Hostlet site",
          "description": "Show a Hostlet site or AI the user made, as a card, and whether it is finished building.",
          "inputSchema": {
            "properties": {
              "owner_key": {
                "type": "string"
              },
              "site": {
                "type": "string"
              }
            },
            "required": ["owner_key", "site"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://hostlet/card-sky.html",
            "openai/toolInvocation/invoked": "Done",
            "openai/toolInvocation/invoking": "Working on your site…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://hostlet/card.html"
            }
          },
          "digest": "sha256:c8c0072659a68452446a0749535b2b85aaa4ef9ba621d2ce7063e3c98e3040dc"
        },
        {
          "name": "make_ai",
          "title": "Make a simple AI",
          "description": "Make a simple chat AI (like a small ChatGPT for one job, with a chat history) on its own page, in a few seconds. Use when the user wants just an assistant, not a website.",
          "inputSchema": {
            "properties": {
              "about": {
                "description": "What the AI should help with, e.g. \"helps my students practice Spanish verbs\".",
                "type": "string"
              }
            },
            "required": ["about"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://hostlet/card-sky.html",
            "openai/toolInvocation/invoked": "Done",
            "openai/toolInvocation/invoking": "Working on your site…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://hostlet/card.html"
            }
          },
          "digest": "sha256:a6307d5699df8a83ed80c435b023c9305d217414e70250f9e3819cb92d10b01c"
        },
        {
          "name": "make_website",
          "title": "Make a website",
          "description": "Build a real website for the user's business, club, building, class or project from a sentence or two, with its own AI that answers visitors' questions. Hostlet designs the whole thing (words, layout, photos, logo) in about two minutes. It returns right away with a live card and the address; the site appears there when it is done. Ask only what you need: what they run and anything that makes it theirs (place, what they offer). Do not ask about colors or layout.",
          "inputSchema": {
            "properties": {
              "about": {
                "description": "What they run, in their words plus any useful details they gave: e.g. \"A small bakery on Maple Street in Portland. Sourdough, croissants, open Tue to Sun 7 to 3.\"",
                "type": "string"
              },
              "name": {
                "description": "The name of the business or group, if they said it.",
                "type": "string"
              }
            },
            "required": ["about"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://hostlet/card-sky.html",
            "openai/toolInvocation/invoked": "Done",
            "openai/toolInvocation/invoking": "Working on your site…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://hostlet/card.html"
            }
          },
          "digest": "sha256:d87ebe5d9b8c6c4683f74cc2366e0e45d2961a4233f1a09883a7a70166dd4869"
        }
