      "instructions": "PayFresco Payment Planner compares business facts with a capability catalog. Unknown means evidence is missing, expired, conflicting, or not approved for publication. It does not approve merchants, quote fees, or move money. Distinguish the UK, the EU, and the EEA. Do not infer a country from the user's location. start_application is the only tool that sends data or leads to contact: call it only after the user asked to apply or be contacted, you showed them every field you will send, and they explicitly agreed in chat.",
      "tools": [
        {
          "name": "application_handoff",
          "title": "Prepare an application handoff",
          "description": "Turn business facts already discussed into answers the user can copy into PayFresco's application form, list what to enter only on PayFresco's own site, and give the apply link. Runs the same eligibility screen first. Does not fill in, submit, or send an application, does not contact anyone, and never collects ID numbers, bank details, or contact details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "billing_model": {
                "enum": ["one_time", "subscription", "mixed", "invoice"],
                "type": "string"
              },
              "business_category": {
                "enum": ["physical_goods", "digital_goods", "subscriptions", "marketplace", "travel", "professional_services", "supplements", "adult", "gambling", "tobacco_nicotine", "firearms", "controlled_substances", "credit_repair", "money_transfer", "cbd_hemp", "peptides_research", "crypto_assets"],
                "type": "string"
              },
              "has_refund_policy": {
                "type": "boolean"
              },
              "monthly_volume_band": {
                "enum": ["not_processing_yet", "under_10k_usd", "10k_to_100k_usd", "100k_to_1m_usd", "over_1m_usd"],
                "type": "string"
              },
              "notes": {
                "maxLength": 400,
                "type": "string"
              },
              "payment_methods": {
                "items": {
                  "enum": ["cards", "wallets", "bank_transfer", "open_banking", "buy_now_pay_later", "alternative_payment_methods", "cash_on_delivery"],
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "presentment_currencies": {
                "items": {
                  "pattern": "^[A-Z]{3}$",
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "processing_history": {
                "enum": ["none", "under_6_months", "6_to_24_months", "over_24_months"],
                "type": "string"
              },
              "product_description": {
                "maxLength": 300,
                "type": "string"
              },
              "registration_country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "settlement_currencies": {
                "items": {
                  "$ref": "#/properties/presentment_currencies/items"
                },
                "maxItems": 8,
                "type": "array"
              },
              "target_markets": {
                "items": {
                  "$ref": "#/properties/registration_country"
                },
                "maxItems": 12,
                "type": "array"
              },
              "top_sales_country": {
                "$ref": "#/properties/registration_country"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "apply_url": {
                "type": ["string", "null"]
              },
              "approved_facts": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cta": {
                "anyOf": [
                  {
