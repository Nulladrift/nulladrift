              "limitations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "merchant_approval": {
                "const": "not_assessed",
                "type": "string"
              },
              "missing_information": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "next_steps": {
