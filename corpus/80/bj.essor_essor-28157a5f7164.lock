              },
              "posterImageBase64": {
                "description": "Image de l'affiche encodée en base64 ou data:image/... si disponible.",
                "type": "string"
              },
              "socialLinks": {
                "description": "Comptes Instagram / Facebook / contacts à inclure si non présents.",
                "type": "string"
              },
              "streamUrl": {
                "description": "Lien de diffusion en ligne (ex: https://meet.google.com/xxx-yyyy-zzz ou Zoom).",
                "type": "string"
              },
              "ticketName": {
                "description": "Nom du billet (ex: Accès Google Meet, Pass Standard).",
                "type": "string"
              },
              "ticketPriceFcfa": {
                "description": "Prix du ticket en FCFA (0 si gratuit).",
                "type": "number"
              },
              "time": {
