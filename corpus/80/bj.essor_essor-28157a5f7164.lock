        {
          "name": "prepare_event_draft",
          "title": "Préparer un brouillon d'événement complet (lien court)",
          "description": "Prépare un brouillon d'événement ESSOR COMPLET sans troncature (titre complet jusqu'à 140 car., description complète jusqu'à 4000 car., format physical/online/hybrid, lien Google Meet/Zoom streamUrl, date YYYY-MM-DD, heure HH:MM, tarifs, image affiche URL/base64 uploadée sur Cloudinary) et génère un lien court /d/... prêt à finaliser.",
          "inputSchema": {
            "$defs": {
              "OpenAIFile": {
                "additionalProperties": false,
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              }
            },
            "properties": {
              "capacity": {
                "description": "Nombre de places disponibles.",
                "type": "number"
              },
              "category": {
                "description": "Concert, Soirée, Anniversaire, Conférence, Chill, Festival, Workshop, Sport...",
                "type": "string"
              },
              "date": {
                "description": "Date au format YYYY-MM-DD (ex: 2026-12-05).",
                "type": "string"
              },
              "dateHint": {
                "description": "Texte brut de la date lue sur l'affiche si incertaine.",
                "type": "string"
              },
              "description": {
                "description": "Description complète sans coupure (intervenants, programme, réseaux, slogan).",
                "type": "string"
              },
              "endDate": {
                "description": "Date de fin optionnelle YYYY-MM-DD.",
                "type": "string"
              },
              "endTime": {
                "description": "Heure de fin optionnelle HH:MM.",
                "type": "string"
              },
              "eventType": {
                "description": "Type d'événement : 'online' pour Google Meet/Zoom/visio, 'physical' sur place, 'hybrid' les deux.",
                "enum": ["physical", "online", "hybrid"],
                "type": "string"
              },
              "imageUrl": {
                "description": "URL publique HTTPS de l'affiche de l'événement (sera sauvegardée sur CDN ESSOR).",
                "type": "string"
              },
              "locationAddress": {
                "description": "Adresse complète ou précision lieu.",
                "type": "string"
              },
              "locationName": {
                "description": "Lieu physique (ex: Haie Vive, Cotonou) ou 'En ligne (Google Meet)'.",
