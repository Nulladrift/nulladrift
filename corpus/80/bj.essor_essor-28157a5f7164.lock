        "url": "https://essor.bj/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "essor-connector",
        "title": "ESSOR",
        "version": "1.0.0",
        "websiteUrl": "https://essor.bj",
        "icons": [
          {
            "src": "https://essor.bj/pwa-icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://essor.bj/essor-mcp-icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Connecteur officiel d'ESSOR. Lorsque l'utilisateur est connecté, tu PEUX publier directement sur son compte : utilise create_essor_event pour publier directement un événement complet (avec affiche passée par posterFile, imageUrl ou posterImageBase64, et photos galerie mediaUrls — ou prepare_event_draft pour générer un lien court /d/...), add_essor_wall_photos pour ajouter directement des photos sur son Mur Vivant ou un événement, create_essor_mur_quiz pour créer et publier un quiz personnalisé directement sur son Mur Vivant ESSOR, et create_essor_game_session pour lancer ou programmer un salon Action ou Vérité / On juge !. Utilise aussi search_essor_events, get_event_details, search_essor_cachepasses et get_my_essor_summary.",
      "tools": [
        {
          "name": "add_essor_wall_photos",
          "title": "Ajouter des photos directement sur un Mur ESSOR",
          "description": "Ajoute une ou plusieurs photos (via photoFiles depuis ChatGPT ou photoUrls HTTPS) directement au Mur Vivant personnel ou à un événement de l'utilisateur connecté sans écraser la galerie. Avec setAsPoster=true sur un eventId précis, met à jour l'affiche/bannière de l'événement. Nécessite un compte connecté ESSOR.",
          "inputSchema": {
            "$defs": {
              "OpenAIFile": {
                "additionalProperties": false,
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              }
            },
            "properties": {
              "eventId": {
                "description": "UUID de l'événement ciblé, ou 'living_mur' (par défaut) pour le Mur Vivant personnel.",
                "type": "string"
              },
              "photoFiles": {
                "description": "Photos envoyées ou générées dans ChatGPT (fileParams).",
                "items": {
                  "$ref": "#/$defs/OpenAIFile"
                },
                "type": "array"
              },
              "photoUrls": {
                "description": "Liste de 1 à 15 URLs HTTPS de photos à ajouter au Mur.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "setAsPoster": {
                "description": "true pour définir la 1ère photo comme bannière/affiche principale (banner_url) d'un événement.",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["photoFiles"]
          },
          "digest": "sha256:8bdeca857c5a02f66aed38e97d3453fe004ed5fb516c9fd69176454b8093e805"
        },
        {
          "name": "create_essor_event",
          "title": "Créer et publier directement un événement sur ESSOR",
          "description": "Publie directement un événement (physique, Google Meet / Zoom en ligne, ou hybride) sur le compte ESSOR connecté avec titre complet, description complète, date/heure, affiche (posterFile, URL ou base64), photos Mur optionnelles (wallFiles/mediaUrls) et lien court essor.bj/<slug>. Dès qu'une image a été envoyée ou générée dans le chat, passe-la obligatoirement dans posterFile (ou imageUrl/posterImageBase64). Si une info critique manque, génère un lien brouillon /d/... et indique ce qu'il faut confirmer. Nécessite un compte connecté ESSOR.",
          "inputSchema": {
            "$defs": {
              "OpenAIFile": {
                "additionalProperties": false,
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              }
            },
            "properties": {
              "allowMissingStreamUrl": {
                "type": "boolean"
              },
              "capacity": {
                "type": "number"
              },
              "category": {
                "type": "string"
              },
              "confirmPastDate": {
                "type": "boolean"
              },
              "date": {
                "description": "Date YYYY-MM-DD.",
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "endDate": {
                "type": "string"
              },
              "endTime": {
                "type": "string"
              },
              "eventType": {
                "enum": ["physical", "online", "hybrid"],
                "type": "string"
              },
              "imageUrl": {
                "description": "URL HTTPS de l'affiche.",
                "type": "string"
              },
              "isPrivate": {
                "type": "boolean"
              },
              "locationAddress": {
                "type": "string"
              },
              "locationName": {
                "type": "string"
              },
              "mediaUrls": {
                "description": "URLs HTTPS additionnelles de photos du Mur/galerie de l'événement.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "posterFile": {
                "$ref": "#/$defs/OpenAIFile",
                "description": "Affiche ou image envoyée/générée dans ChatGPT (obligatoire si une image existe dans la conversation)."
              },
              "posterImageBase64": {
                "description": "Affiche en data:image/...;base64,...",
                "type": "string"
              },
              "socialLinks": {
                "type": "string"
              },
              "streamUrl": {
                "description": "Lien Google Meet / Zoom / YouTube requis si online ou hybrid.",
                "type": "string"
              },
              "ticketName": {
                "type": "string"
              },
              "ticketPriceFcfa": {
                "type": "number"
              },
              "time": {
                "description": "Heure HH:MM (ex: 19:30).",
                "type": "string"
              },
              "title": {
                "description": "Titre complet de l'événement.",
                "type": "string"
              },
              "unlimitedCapacity": {
                "type": "boolean"
              },
              "wallFiles": {
                "description": "Photos galerie / Mur additionnelles envoyées dans ChatGPT.",
                "items": {
                  "$ref": "#/$defs/OpenAIFile"
                },
                "type": "array"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
