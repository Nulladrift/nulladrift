          "digest": "sha256:9828a1bdb82dc40fcad1caf8922adc9b7dd3c1333d17e9343020ee91dbaf9005"
        },
        {
          "name": "create_essor_game_session",
          "title": "Lancer ou programmer un salon Action ou Vérité ou On juge !",
          "description": "Crée immédiatement un salon de jeu sur ESSOR, OU le programme à une date/heure précise (avec lancement automatique + e-mails de confirmation et de lancement) si scheduledFor est fourni. Nécessite un compte connecté ESSOR.",
          "inputSchema": {
            "properties": {
              "gameType": {
                "description": "'av' pour Action ou Vérité, 'on_juge' pour On juge !",
                "enum": ["av", "on_juge"],
                "type": "string"
              },
              "isPublic": {
                "description": "true pour salon public, false pour privé sur code.",
                "type": "boolean"
              },
              "maxParticipants": {
                "description": "Nombre de joueurs max (2 à 12).",
                "type": "number"
              },
              "mood": {
                "description": "Ambiance des cartes/défis.",
                "enum": ["soiree", "piquant", "anniversaire"],
                "type": "string"
              },
              "scheduledFor": {
                "description": "Optionnel : date/heure ISO-8601 (ex: '2026-11-28T20:00:00+01:00') pour programmer le lancement automatique du salon et envoyer l'e-mail.",
                "type": "string"
              },
              "title": {
                "description": "Nom du salon.",
                "type": "string"
              }
            },
            "required": ["gameType"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
