        },
        {
          "name": "create_essor_mur_quiz",
          "title": "Créer un quiz personnalisé sur le Mur ESSOR",
          "description": "Crée et publie un vrai quiz sur le Mur Vivant personnel de l'utilisateur connecté ('Qui me connaît vraiment ?') avec tes questions personnalisées et génère le lien direct à partager. Nécessite un compte connecté ESSOR.",
          "inputSchema": {
            "properties": {
              "questions": {
                "description": "Liste de 3 à 10 questions personnalisées à choix multiples sur l'utilisateur.",
                "items": {
                  "properties": {
                    "correctIndex": {
                      "description": "Index (0..3) de la bonne réponse.",
                      "type": "number"
                    },
                    "options": {
                      "description": "2 à 4 réponses possibles.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "prompt": {
                      "description": "Intitulé de la question.",
                      "type": "string"
                    }
                  },
                  "required": ["correctIndex", "options", "prompt"],
                  "type": "object"
                },
                "type": "array"
              },
              "requiredPoints": {
                "description": "Coût en Flammes pour jouer (0 si gratuit, 5 à 50 sinon).",
                "type": "number"
              },
              "resultsVisibility": {
                "enum": ["public", "private"],
                "type": "string"
              },
              "reward": {
                "description": "Récompense pour le gagnant (ex: Pass VIP, Un verre offert).",
                "type": "string"
              },
              "title": {
                "description": "Titre du quiz (ex: Qui connaît vraiment Medessi ?).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
