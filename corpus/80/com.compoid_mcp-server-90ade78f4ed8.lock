        {
          "name": "Compoid_delete_record",
          "description": "Delete a published Compoid record. IRREVERSIBLE.\n\n    The record is tombstoned and drops out of all search results. Use it to\n    clean up test records. Only PUBLISHED records can be deleted - drafts have\n    no PID until they are published, so a draft must be published first (or\n    cancelled via the review flow) before it can be addressed this way.\n\n    The API token's user must be the record's creator or an owner of the record's\n    community; otherwise the API returns 403.\n\n    Required:\n        work_id: the record to delete - a published record PID (e.g.\n            '4171t-rc787'), a full record URL\n            (https://www.compoid.com/records/<pid>), or its OAI.\n\n    On success returns a confirmation (HTTP 204). On failure the error includes\n    an actionable hint (403 = wrong user/permissions, 404 = not found or draft).\n    ",
          "inputSchema": {
            "properties": {
              "work_id": {
                "title": "Work Id",
                "type": "string"
              }
            },
            "required": ["work_id"],
            "title": "Compoid_delete_recordArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "Compoid_delete_recordOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
