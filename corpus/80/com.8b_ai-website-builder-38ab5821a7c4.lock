{
  "lockfileVersion": 2,
  "subjects": {
    "com.8b/ai-website-builder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.8b.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "8b",
        "title": "8B AI Website Builder",
        "version": "0.3.0",
        "websiteUrl": "https://8b.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "explore_designs",
          "title": "Explore 8B AI designs",
          "description": "Lists 8B site designs: the look, the structure and the kinds of business each one suits. Use it to choose the design for the user's site.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explore 8B AI designs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a2d2a0b2bd91ebb2a116c6e3027de8ecfdf738fe19063fd8f4265f09fe14d49b"
        },
        {
          "name": "generate_site",
          "title": "Generate the site with 8B",
          "description": "Generates the user's site with 8B from a design and the texts, colors, fonts and photo queries written for the business, and shows a live, animated preview in the conversation. Call get_design_brief first to see the fields. Returns the preview id, the preview link and the link to download the site. To change a site that is already built (a color, some texts, a photo), call it with base_preview_id and only the values that change: everything else is kept.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "base_preview_id": {
                "description": "To change an existing preview: its id. Send only the values that change; the rest is taken from that preview",
                "pattern": "^[a-z0-9]{10}$",
                "type": "string"
              },
              "colors": {
                "additionalProperties": {
                  "maxLength": 60,
                  "type": "string"
                },
                "description": "New CSS color per palette id",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "design_id": {
                "description": "Design id from explore_designs. Required for a new site, not needed with base_preview_id",
                "enum": ["8b-generated-0001", "8b-generated-0002", "8b-generated-0003", "8b-generated-0004", "8b-generated-0005", "8b-generated-0006", "8b-generated-0007", "8b-generated-0008", "8b-generated-0009", "8b-generated-0010", "8b-generated-0011", "8b-generated-0012", "8b-generated-0013", "8b-generated-0014", "8b-generated-0015", "8b-generated-0016", "8b-generated-0017", "8b-generated-0018", "8b-generated-0019"],
                "type": "string"
              },
              "fonts": {
                "additionalProperties": {
                  "maxLength": 80,
                  "type": "string"
                },
                "description": "Current font family → new Google Fonts family spec",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "images": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "maxLength": 100,
                      "type": "string"
                    },
                    {
                      "properties": {
                        "alt": {
                          "maxLength": 200,
                          "type": "string"
                        },
                        "query": {
                          "maxLength": 100,
                          "type": "string"
                        }
                      },
                      "required": ["query"],
                      "type": "object"
                    }
                  ]
                },
                "description": "Image id → {query: English Unsplash search query, alt: photo description in the site language}. Photos of the same kind share one query; each place gets a different photo",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "language": {
                "description": "Language of the site, e.g. \"ru\" or \"de\", the same as for get_design_brief. Not needed with base_preview_id",
                "maxLength": 20,
                "type": "string"
              },
              "site_name": {
                "description": "Name of the business or project the site is for. Required for a new site",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "texts": {
                "additionalProperties": {
                  "maxLength": 3000,
                  "type": "string"
                },
                "description": "New text per field id from get_design_brief",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Generate the site with 8B"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://8b/site-preview/bf1fb2ed93"
            },
            "ui/resourceUri": "ui://8b/site-preview/bf1fb2ed93"
          },
          "digest": "sha256:ccfbfac21393367d74bc71229bffce7cd0bfc909fc895fb495e029ca79c259c7"
        },
        {
          "name": "get_design_brief",
          "title": "Get the 8B design brief",
          "description": "Returns the brief for writing the site in a design: every text with a hint and max length, the color palette, fonts and photos. Write them for the user's business and pass the values to generate_site.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "design_id": {
                "description": "Design id from explore_designs",
                "enum": ["8b-generated-0001", "8b-generated-0002", "8b-generated-0003", "8b-generated-0004", "8b-generated-0005", "8b-generated-0006", "8b-generated-0007", "8b-generated-0008", "8b-generated-0009", "8b-generated-0010", "8b-generated-0011", "8b-generated-0012", "8b-generated-0013", "8b-generated-0014", "8b-generated-0015", "8b-generated-0016", "8b-generated-0017", "8b-generated-0018", "8b-generated-0019"],
                "type": "string"
              },
              "language": {
                "description": "Language of the site you are making, e.g. \"ru\" or \"en\": the word limits are adjusted to it",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["design_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the 8B design brief"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c84275be659b891d9e3de8bdd584e326170bff7d5c6bfdd3806ce0d3e3a74066"
        }
      ],
      "resources": [
