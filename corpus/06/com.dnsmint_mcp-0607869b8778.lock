{
  "lockfileVersion": 2,
  "subjects": {
    "com.dnsmint/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dnsmint.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dnsmint",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Mint a secure HTTPS endpoint for your agents. Each on its own dedicated domain.\n\nOne API call, and you have a hostname that resolves and a certificate that stays\ncurrent, on a domain no other customer is on. No domain to buy, no zone to\nconfigure, no person in the loop.\n\nEvery tool call needs a credential: a DNSMint API key as a Bearer token, or an OAuth\ntoken obtained through the flow advertised at /.well-known/oauth-protected-resource/mcp.\nListing tools does not.\n\nThe list you get without a credential is the full catalog. A key granted less than the\nwhole account will reach fewer tools than are listed here, and calling one it does not\nreach is refused with a message saying so. Authenticate first and list again to see what\nyour own credential actually carries.",
      "tools": [
        {
          "name": "diagnose_hostname",
          "title": "Diagnose a hostname",
          "description": "Why a hostname is or is not working: what the nameservers answer, what public resolvers see, and whether a certificate has been issued. Use this before assuming something is broken; a name minted moments ago may simply not have propagated.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The hostname's id, from list_hostnames.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9470b80b5da76852f50ab4ca54253b2b9df514dc85b613716f61c255f1df3aad"
        },
        {
          "name": "get_hostname",
          "title": "Get a hostname",
          "description": "One hostname's status and certificate mode. Does not say where it points: DNS is the authoritative answer for that, so use diagnose_hostname or resolve the name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The hostname's id, from list_hostnames.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:06f01d44be7480441a4eccbba4b2eb9fef9202fb43077cc8a78717f7ee185b2a"
        },
        {
          "name": "get_plan",
          "title": "Get the plan",
          "description": "What this account's plan allows and how much of it is used: hostnames, dedicated domains, and whether a plan is active at all. Also says whether a checkout is outstanding, which is how you find out a payment link you were given has not been completed yet.\n\nCall this after handing someone a checkout URL, instead of retrying a mint to see if it worked. It costs nothing and changes nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c542a3f883dfbcded90582434197213e750ce31141ea9d05b44868c85c53522e"
        },
        {
          "name": "list_hostnames",
          "title": "List hostnames",
          "description": "Every hostname this credential can see, with how many are active and the plan's cap. Check the cap before minting: a hostname is the unit the plan counts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f66fa5ad897de86205cdc4dcc76bdf12e967cdf33b7bb3dd05985786d4c94663"
        },
        {
          "name": "mint_hostname",
          "title": "Mint a hostname",
          "description": "Register an address and get back a stable hostname that survives the address changing. This is the tool to use when a machine or agent needs a name.\n\nThe address class is fixed for the life of the name: mint with a public address and it stays public, mint with a private one and it stays private. Crossing later is refused, so pass the address the machine will actually serve on. A target fixes the class the same way, from whatever it resolves to.\n\nA hostname is one label above a domain. Names below a hostname are not hostnames and cannot be minted.\n\nNewly minted names report status 'pending' and go 'live' within about a minute.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Which of the account's domains to mint on. Omitted, DNSMint picks when the account holds one.",
                "type": "string"
              },
              "ip": {
                "description": "IPv4 or IPv6, public or private.",
                "type": "string"
              },
              "subdomain": {
                "description": "The label to use. Omitted, DNSMint picks an opaque one.",
                "type": "string"
              },
              "target": {
                "description": "A platform endpoint to mint on instead of an address, when the platform gave you a URL and no IP. Send either ip or target, not both.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8553f926099252b64be65f8bd5fa2474cd704944ae0c6e6c318368e1902a066d"
        },
        {
          "name": "release_hostname",
          "title": "Release a hostname",
          "description": "PERMANENTLY give up a hostname. Read this before calling it.\n\nA released hostname is tombstoned and is never issued again, to anyone, including this account. There is no undo and it cannot be re-minted. This is not like deleting a DNS record.\n\nOnly call this when the name is genuinely finished with and a human has asked for it. If the goal is to stop serving, repoint it or stop the machine instead.\n\nPass the hostname in `confirm` exactly as it appears, so a name cannot be released by guessing an id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confirm": {
                "description": "The full hostname, exactly. Must match the name behind that id.",
                "type": "string"
              },
              "id": {
                "description": "The hostname's id, from list_hostnames.",
                "type": "string"
              }
            },
            "required": ["confirm", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:27d20c16e17cf8b6b500c5d0d7a1c04367f242f6bb47bbf1793ce87fee250655"
        },
        {
          "name": "repoint_hostname",
          "title": "Repoint a hostname",
          "description": "Point an existing hostname at a new address. This is what makes the name worth having: the machine moves, the name does not, and everything holding the URL keeps working.\n\nRepointing within an address class is free, including between IPv4 and IPv6. Crossing between public and private is refused, because one name resolving public then private is how DNS rebinding works.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The hostname's id, from list_hostnames.",
                "type": "string"
              },
              "ip": {
                "description": "The new address.",
                "type": "string"
              },
              "target": {
                "description": "A platform endpoint to follow instead of a fixed address, when the platform gave you a URL and no IP. Send either ip or target, not both.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fdae78f6e42a5930775b2b57d3fe1c5b2decae0d453b3cb07482a9155e6bfc9b"
        },
        {
          "name": "start_checkout",
          "title": "Start a checkout",
          "description": "Get a payment link the account owner opens to raise this account's limits. Call this when minting fails because the account is at its hostname cap or has no plan.\n\nThis charges nothing and buys nothing. It returns a URL, and the purchase only happens if a person opens it and enters card details. Give the URL to the human you are working with and say what it costs; do not try to complete it yourself, and do not call this repeatedly hoping the limit lifts. Nothing changes until somebody pays.\n\nOnly for an account with no plan yet. If one already exists you get the billing page back instead, because changing a running plan charges a card on file and is a person's decision.\n\nBoth numbers default to what the account already holds, so asking for hostnames alone keeps the domains. A plan smaller than what is in use is refused.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domains": {
                "description": "Dedicated domains the plan should include. Leave unset to keep the current count.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "hostnames": {
                "description": "Hostnames the plan should include. Ask for the cap you need, not the extra.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5d9e436656ad8383444b3f46a331ab7cd06efbe42d115c4c5199280656511657"
        }
      ],
      "digest": "sha256:ac70dfd32744f00e2c8279dbbe78a31711aaf1382c6bcb6ffaf12300bf9fc3de"
    }
  }
}
