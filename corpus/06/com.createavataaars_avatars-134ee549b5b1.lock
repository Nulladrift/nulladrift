      "tools": [
        {
          "name": "avatar_for_name",
          "title": "Avatar for a name",
          "description": "One approved avatar for a name or a user id, the same every time.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "style": {
                "enum": ["avataaars", "notionists", "lorelei", "adventurer", "big-smile", "adventurer-neutral", "thumbs"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24d6f4eea67ff7bdc301eca320ac61a9a811a9fc5663ead73b3f886785bf78e1"
        },
        {
          "name": "create_avatar",
          "title": "Create avatar",
          "description": "An avatar from attributes, or from a code plus changes. Attribute names and values come from list_attributes; null or \"off\" switches a part off.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "attributes": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean", "null"]
                },
                "type": "object"
              },
              "code": {
                "pattern": "^[0-9A-Za-z]{10}(?:[0-9a-f]{6}(?:[0-9a-f]{6}[0-9]{3})?)?$",
                "type": "string"
              },
              "style": {
                "enum": ["avataaars", "notionists", "lorelei", "adventurer", "big-smile", "adventurer-neutral", "thumbs"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c0a31d65d1170693c34f549789f4b5aca908593f1aeb99832b9d185c730cbba"
        },
        {
          "name": "list_attributes",
