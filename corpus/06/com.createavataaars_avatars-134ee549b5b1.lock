            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "style": {
                "enum": ["avataaars", "notionists", "lorelei", "adventurer", "big-smile", "adventurer-neutral", "thumbs"],
                "type": "string"
