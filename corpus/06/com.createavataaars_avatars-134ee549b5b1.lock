        {
          "name": "random_avatar",
          "title": "Random avatar",
          "description": "A template at random, as a code and a preview.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "exclude": {
                "pattern": "^[0-9A-Za-z]{10}(?:[0-9a-f]{6}(?:[0-9a-f]{6}[0-9]{3})?)?$",
                "type": "string"
              },
              "style": {
