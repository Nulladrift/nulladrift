          "title": "Create avatar",
          "description": "An avatar from attributes, or from a code plus changes. Attribute names and values come from list_attributes; null or \"off\" switches a part off.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "attributes": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean", "null"]
                },
                "type": "object"
              },
              "code": {
                "pattern": "^[0-9A-Za-z]{10}(?:[0-9a-f]{6}(?:[0-9a-f]{6}[0-9]{3})?)?$",
                "type": "string"
              },
              "style": {
