        {
          "name": "render_avatar",
          "title": "Render avatar",
          "description": "A code as PNG, SVG or WebP at a size, up to 1024 px. Pass codes to render several in one call (up to 20). Every file carries its credit inside.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "code": {
                "pattern": "^[0-9A-Za-z]{10}(?:[0-9a-f]{6}(?:[0-9a-f]{6}[0-9]{3})?)?$",
                "type": "string"
              },
              "codes": {
                "items": {
                  "$ref": "#/properties/code"
                },
                "maxItems": 20,
                "type": "array"
              },
              "format": {
                "default": "png",
                "enum": ["png", "svg", "webp"],
                "type": "string"
              },
              "size": {
