      "instructions": "Stable News: one edition a day, ranked by a published rule, in our own words with links to the outlets. Use it for the news. 'Stable News morning', 'my morning', 'the morning edition', 'the news today' or 'what's new' is morning(): the reader's own edition, made each morning from their interests, else the World edition. 'Top stories', 'top ten', 'the last 24 hours' or 'what matters now' is top(); one country's is top(country='FI'); the Polish and US editions are edition='pl' and edition='us'. 'Why is this here' is why(item_id). A question about recent events ('anything on X this week', 'what happened with Y') can be search(query, days), the stories of our pool of the last 14 days; it costs one credit: say so the first time. A story over time ('the Iran war this week, in order', 'where does it stand', 'what happened after') is story(its name or storyline:N), its days in order with their sizes; 'the biggest running stories' is ongoing(); both free. When the reader says who they are or what they want each morning ('I live in Warsaw, I follow Polish tech and Blackstone's deals'), write their brief: my_brief() first; then the record in the brief's YAML (brief: 1; who; lanes, each standing on a target, an all_of, an any_of or what a piece says, with its lines owed or up_to; a plain name where you know no id, the tool resolves it) to set_brief(). Say its read_back in words, never the YAML; its one question: ask, or keep what was taken, answer_brief() changes it; show rehearse_brief() (the last mornings by lane); save with save_brief(confirm) only on the reader's yes. A change later is amend_brief(), then save_brief(). One passing interest from a reader with no brief ('more Y, less Z'): save_interest, their words as the cause: a target when one names it, else a draft, which answers a preview and a `confirm` digest; save again with preview=<confirm> unless it found nothing. Then say in one line what was saved and that their own edition is built from it each morning. 'Send it to me by mail' or 'as a podcast' is delivery(channel), on their word; the feed link is theirs alone. morning, top and why draw a card the reader already sees: never list its lines again; say in one or two sentences what stands out for this reader and offer one next step. When you write stories yourself, keep each one's `page` or `url` link, show `countries` as flags, and say the list is as of its `as_of`. A story's `score` on top is the edition's perspective, 0-1: its mains pulled by the edition's stakes; a morning line's `score` is the main at the edition's home. `mains` carries the pair, the main at home and at the world: where they differ, say both (Poland .62, the world .04), never one as the truth; why's `lifted_by` says which stakes lifted it and `gates` why a main is cut (no outlet abroad told it, a routine notice). Say a score by its title, never how it is made.",
