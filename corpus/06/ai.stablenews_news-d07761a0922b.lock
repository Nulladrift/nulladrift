        {
          "name": "save_interest",
          "title": "Save an interest",
          "description": "Move one of the reader's magnets, what draws their own edition: a `target` and a step (away, low, normal,\nhigh) saves at once. For a subject no target names, a `draft` of their own words: without `preview` it answers\nwhat the draft would give a day, the pieces it finds, and a `confirm` digest; with preview=<confirm> it saves.\nTheir own words are the cause. The same move again changes nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amplitude": {
                "enum": ["away", "low", "normal", "high"],
                "type": "string"
              },
              "cause": {
                "description": "The reader's own words, kept verbatim as the cause.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "draft": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "description": "A definition of a reader's own words, one saved version of it (docs/field/own-words.md).",
                    "properties": {
                      "anchors": {
                        "description": "Codes, countries and entities, each with its use.",
                        "items": {
                          "additionalProperties": false,
                          "description": "A code, a country or an entity the definition leans on, and how.",
                          "properties": {
                            "key": {
                              "description": "country:XX (ISO 3166-1), medtop:NNNNNNNN (an IPTC Media Topic code in the tree) or wd:Qnnn (a Wikidata item), normalised as a magnet's target is.",
                              "pattern": "^(?:country:[A-Z]{2}|medtop:[0-9]{8}|wd:Q[1-9][0-9]{0,9})$",
                              "type": "string"
                            },
                            "release": {
                              "anyOf": [
                                {
                                  "pattern": "^\\d{4}-\\d\\d-\\d\\d$",
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "default": null,
                              "description": "A Media Topic code's IPTC release; null on a country or an entity."
                            },
                            "use": {
                              "description": "An entity selects or excludes; a code or a country gates or excludes, never selects (0.00 to 0.02 precision as selectors).",
                              "enum": ["select", "exclude", "gate"],
                              "type": "string"
                            }
                          },
                          "required": ["key", "use"],
                          "type": "object"
                        },
                        "maxItems": 20,
                        "type": "array"
                      },
                      "author": {
                        "description": "Who wrote this version: the reader, an assistant in conversation, or the owner.",
                        "enum": ["reader", "assistant", "owner"],
                        "type": "string"
                      },
                      "breadth": {
                        "default": "narrow",
                        "description": "narrow (about it) by default; broad adds adjacent pieces.",
                        "enum": ["narrow", "broad"],
                        "type": "string"
                      },
                      "counter": {
                        "description": "Up to 8 pieces the reader does not want, the same shape.",
                        "items": {
                          "additionalProperties": false,
                          "description": "A piece the definition should find (an example) or should not (a counter-example).",
                          "properties": {
                            "item": {
                              "description": "The piece's item id. Not checked against the pool, which prunes.",
                              "minimum": 1,
                              "type": "integer"
                            },
                            "title": {
                              "description": "The piece's title as stored, so the definition outlives it.",
                              "maxLength": 400,
                              "minLength": 1,
                              "pattern": "\\S",
                              "type": "string"
                            },
                            "why": {
                              "description": "Why it is in or out, in a few words (\"water\", \"a strike\").",
                              "maxLength": 120,
                              "minLength": 1,
                              "pattern": "\\S",
                              "type": "string"
                            }
                          },
                          "required": ["item", "title", "why"],
                          "type": "object"
                        },
                        "maxItems": 8,
                        "type": "array"
                      },
                      "examples": {
                        "description": "3 to 8 pieces the reader wants, with their titles stored.",
                        "items": {
                          "additionalProperties": false,
                          "description": "A piece the definition should find (an example) or should not (a counter-example).",
                          "properties": {
                            "item": {
                              "description": "The piece's item id. Not checked against the pool, which prunes.",
                              "minimum": 1,
                              "type": "integer"
                            },
                            "title": {
                              "description": "The piece's title as stored, so the definition outlives it.",
                              "maxLength": 400,
                              "minLength": 1,
                              "pattern": "\\S",
                              "type": "string"
                            },
                            "why": {
                              "description": "Why it is in or out, in a few words (\"water\", \"a strike\").",
                              "maxLength": 120,
                              "minLength": 1,
                              "pattern": "\\S",
                              "type": "string"
