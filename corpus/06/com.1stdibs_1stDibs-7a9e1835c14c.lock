        {
          "name": "read_taxonomy",
          "title": "Read 1stDibs Taxonomy",
          "description": "Get how items in a 1stDibs category are organized. The top-level categories\n        are furniture, art, jewelry, and fashion. Returns the next-level categories and the\n        facets for the category, each with its filter values and item counts. Use it to find\n        valid filters for search_items and browse_items.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Category path, such as \"furniture\", \"art\", \"jewelry\", or \"furniture/seating\"",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "facets": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "filters": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "values": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "count": {
                            "type": "number"
                          },
                          "value": {
                            "type": "string"
                          }
                        },
                        "required": ["count", "value"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["key", "values"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["facets", "filters"],
            "type": "object"
          },
