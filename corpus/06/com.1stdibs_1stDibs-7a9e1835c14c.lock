                    },
                    "price": {
                      "type": "number"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["available", "category", "currency", "facts", "itemId", "price", "title"],
                  "type": "object"
                },
                "type": "array"
