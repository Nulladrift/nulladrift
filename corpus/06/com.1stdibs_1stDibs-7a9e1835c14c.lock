      "instructions": "Help the user discover items on 1stDibs.\nBefore showing items, call search_items or browse_items at least twice with varied terms or\nfilters (use read_taxonomy for facet and filter slugs). Do not write to the user between\nthese calls. Then call show_items once with 4-8 distinct item IDs, best match\nfirst. Recommend items in the order shown, and ground every claim about an item in data the\ntools returned.",
      "tools": [
        {
          "name": "browse_items",
          "title": "Browse 1stDibs Items",
          "description": "List 1stDibs items in a category, optionally narrowed by filters. Use it when\n        the user wants items of a kind rather than a keyword match. Returns 20\n        items per page with price, availability, photos, and product page links; descriptions\n        are shortened. Pass nextPage as page for more. Filters are a query string like\n        category=furniture&location=usa-north-america; get them from read_taxonomy.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Category path, such as \"furniture\" or \"furniture/seating\"",
                "minLength": 1,
                "type": "string"
              },
              "filters": {
                "description": "Filters from read_taxonomy as a query string, such as \"category=furniture&location=usa-north-america\"",
                "type": "string"
              },
              "page": {
                "description": "Page number, starting at 1. Use nextPage from the previous result.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "filters": {
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "additionalImages": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "available": {
                      "type": "boolean"
                    },
                    "category": {
                      "type": "string"
                    },
                    "checkoutUrl": {
                      "type": "string"
                    },
                    "currency": {
                      "const": "USD",
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "itemId": {
                      "type": "string"
                    },
                    "price": {
                      "type": "number"
                    },
                    "primaryImage": {
                      "type": "string"
                    },
                    "productDetailUrl": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["additionalImages", "available", "category", "checkoutUrl", "currency", "description", "itemId", "price", "primaryImage", "productDetailUrl", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "nextPage": {
                "type": ["number", "null"]
              },
              "page": {
                "type": "number"
              }
            },
            "required": ["filters", "items", "nextPage", "page"],
            "type": "object"
          },
