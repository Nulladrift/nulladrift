                    "available": {
                      "type": "boolean"
                    },
                    "category": {
                      "type": "string"
                    },
                    "currency": {
                      "const": "USD",
                      "type": "string"
                    },
                    "facts": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "name": {
                            "type": "string"
                          },
