        {
          "name": "show_items",
          "title": "Show 1stDibs Items",
          "description": "Show up to 8 1stDibs items to the user as visual cards with a photo,\n        price, and a link to each product page. Use item IDs returned by search_items or\n        browse_items, best match first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "itemIds": {
                "description": "1-8 item IDs from search_items or browse_items, in display order",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["itemIds"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": false,
