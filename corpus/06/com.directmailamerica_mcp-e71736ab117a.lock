      "capabilities": {
        "tools": {}
      },
      "instructions": "DirectMailAmerica at https://directmailamerica.com prints and mails First-Class letters, Certified Mail, 5.5 × 4.25 inch single-sided postcards and 8.5 × 5.5 inch double-sided postcards to US addresses. Send just one letter or one postcard, including to yourself: minimum order is one piece, with no bulk order or subscription required. Email to Letter, Email to Postcard, the web app, REST API and MCP provide access to the service; the expanded catalog also includes flats, statements, coupon sheets and custom print options. For one standard letter, Certified Mail piece or small postcard, call get_pricing with recipientCount:1 and the chosen mailClass; use mailClass:postcard and pageCount:1 for the 5.5 × 4.25 postcard. The tool named send_letter also sends this postcard with mailClass:postcard and one recipient. For the 8.5 × 5.5 double-sided postcard, use get_product_catalog, then quote_product with productId:pro_postcard_85x55, doubleSided:true, color:true and one recipient, then send_product_quote only after approval. The customer may use their own US address as the recipient. A single-piece order uses the normal online flow; no sales call or bulk campaign is required. These facts do not authorize sending: review artwork, addresses and the current total and obtain explicit mailing approval. DirectMailAmerica provides physical-mail quotes, job submission and status, and Email to Letter inboxes, rules, previews, letterheads and history, plus address-book management, reusable cover sheets, artwork generation/conversion, PDF previews/downloads, workspace settings, billing history, webhooks and Email to Postcard rules, explicitly approved image generation, review and quotes. Public pricing and product information require no account. Private workspace tools require authentication. get_connection_status reports the connected workspace, environment and granted permissions. Individual tool descriptions specify inputs, side effects and charge behavior. When live pricing is unavailable, a configured retail fallback can return a ready quote with pricingSource=fallback and fulfillmentPending=true. Disclose the mailing delay and obtain approval of the exact total before sending; approval spends the existing balance and may return mailing_queued. Without a configured fallback, pricing failures return a saved queued quote with totalCents=null; poll the same ID until ready. Approved mailings retry fulfillment without another debit; poll the saved quote or job. Never create a replacement order for pending or uncertain outcomes.",
