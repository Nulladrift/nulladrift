          "name": "send_letter",
          "title": "Send Letter",
          "description": "Release one immutable standard-mail quote from quote_letter after the user reviews the exact PDF, sender, all recipients, print options and price. Required: quoteId, confirmed:true, matching approvedTotalCents and one idempotencyKey. Any change needs a new quote and fresh approval. Supports one First-Class letter, Certified Mail piece or Express postcard, including a single self-addressed piece. Can immediately spend credits and buy postage, or settle an explicitly authorized guest x402 payment. A safe preauthorization failure queues the approved order for automatic retry without another debit. Queued is not submitted. Retry the same quote and key; get_letter_quote recovers the saved result. Unknown authorization stays held for review. Staging prevents postage but can spend real money; use the separate simulation endpoint for no-cost tests.",
