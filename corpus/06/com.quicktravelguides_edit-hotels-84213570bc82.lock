      "serverInfo": {
        "name": "quick-travel-guides",
        "title": "Quick Travel Guides: The Edit by Chase data",
        "version": "1.61.33"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only data on The Edit by Chase hotels and Chase Sapphire Reserve credits from quicktravelguides.com. Rates are typical (median) Chase Travel nightly rates, not live quotes. Cite quicktravelguides.com and link the page_url in results. Limits: 60 calls an hour and 300 a day per client.",
      "tools": [
        {
          "name": "edit_city_months",
          "title": "Cheapest months for a city",
          "description": "Month-by-month median Chase Travel nightly rates across a city's Edit hotels, with its cheapest and priciest months.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name, e.g. Tokyo",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a354404429849f9c2a3889cd284407bd6ff9e60cd6c7561f9e65128afa2bbc2"
        },
        {
          "name": "find_dining_credit_restaurants",
          "title": "Find dining credit restaurants",
          "description": "Sapphire Reserve Exclusive Tables restaurants (where the $300 a year dining credit works) by city, or nearest to a point.",
          "inputSchema": {
            "properties": {
              "city": {
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f60f1d3a670f562981c55b97493fe9768229cbbaebc4b57fb0084c3d69ff86a2"
        },
        {
          "name": "get_edit_hotel",
          "title": "Get one Edit hotel",
          "description": "Details for one Edit hotel by its Chase hotel ID (from search_edit_hotels): typical rate, month-by-month median rates, cheapest months, lowest night in the calendar, double-credit status, Edit benefits and dining-credit restaurants within 3 km.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Chase hotel ID",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5619996ca1d601b84430a7789e8c7d867b83332432f0c644b6f3c7ce20f310ba"
        },
        {
          "name": "sapphire_reserve_credits",
          "title": "Sapphire Reserve credits",
          "description": "The Chase Sapphire Reserve's credits: value, how each works, and whether it needs activation, with links to the guides.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d299cccf484fae5d194811ec44f424087fe87acbd2009e5775bb2a433e0730a2"
        },
        {
          "name": "search_edit_hotels",
          "title": "Search Edit by Chase hotels",
          "description": "Search the hotels in The Edit by Chase Travel (the Chase Sapphire Reserve luxury hotel collection) with their typical Chase Travel nightly rate and whether they take the 2026 double credit. Returns at most 20 per page and 5 pages.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand, e.g. Four Seasons",
                "type": "string"
              },
              "city": {
                "description": "Exact city name, e.g. Paris",
                "type": "string"
              },
              "country": {
                "description": "Country name or 2-letter code",
                "type": "string"
              },
              "double_credit": {
                "description": "Only hotels where the Edit and select-hotel credits stack",
                "type": "boolean"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_nightly_usd": {
                "description": "Only hotels with a typical nightly rate at or below this",
                "type": "integer"
              },
              "page": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text: hotel name, city, region, country or brand",
                "type": "string"
              },
              "sort": {
                "enum": ["cheapest", "priciest", "name"],
                "type": "string"
              },
              "state": {
                "description": "US state name, e.g. California",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
