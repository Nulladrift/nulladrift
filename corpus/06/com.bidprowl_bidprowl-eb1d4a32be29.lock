{
  "lockfileVersion": 2,
  "subjects": {
    "com.bidprowl/bidprowl": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bidprowl.com/api/v1/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "BidProwl",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "BidProwl aggregates live US government surplus auctions (GovDeals, GSA, Public Surplus, Purple Wave and more) and their sold prices. Use search_listings to find live lots, get_listing for one lot, sold_comps for what similar items sold for (sold_comps_batch for many at once, get_sold_history for the individual sales), and flip_score for a lot's deal score. get_api_usage reports the key's remaining quota for free. Bidding happens on the source site linked in each listing.",
      "tools": [
        {
          "name": "flip_score",
          "title": "Flip Score for a listing",
          "description": "BidProwl's deal score for a live listing, with its condition-adjusted tier.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b6eea5e7def272293c32b796b86410925fc654cec64bd00efd735091e552b93"
        },
        {
          "name": "get_api_usage",
          "title": "API quota and usage",
          "description": "This API key's plan, monthly call limit, calls used, calls remaining and when the quota resets (first of next month, UTC). Free to call: it does not count against the quota.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:72166c0cd4b49dd39a696778aec5201949a276cf1d6645ed7feffe6fe9da3644"
        },
        {
          "name": "get_listing",
          "title": "Get one auction listing",
          "description": "Fetch a single listing by its BidProwl id or slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3402caf3217c595b0b3da8e0e070f0d522b6f50df6d36dfd528a755f9d9f590d"
        },
        {
          "name": "get_sold_history",
          "title": "Individual sold lots",
          "description": "The actual sold lots behind a comps number, newest close first: title, final price (cents), close date, state, source, BidProwl link. Pass one of category, item (tracked item slug) or q (free text, matched like a listing title), plus optional state. Paginate with cursor.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous call",
                "type": "string"
              },
              "item": {
                "description": "Pro: tracked item slug, e.g. forklift",
                "type": "string"
              },
              "limit": {
                "description": "Default 25",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Pro: free text, e.g. 2015 ford f150",
                "type": "string"
              },
              "state": {
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:636505e72941703f5f36b48b624ce4ca2d1e1ef044d858bdd5513c849caccd72"
        },
        {
          "name": "search_listings",
          "title": "Search live government auctions",
          "description": "Search 90,000+ live US government surplus auction listings from 27 official sources. Supports keyword, category, state, ZIP-radius, and price filters.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "type": "string"
              },
              "limit": {
                "description": "Results per page, default 25",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "price_max_usd": {
                "type": "number"
              },
              "query": {
                "description": "Keyword search, e.g. 'forklift'. Model numbers match across spellings (f150, F-150, F 150) and common brand short forms are included (CAT, JD, Chevy, VW, IH).",
                "type": "string"
              },
              "radius_miles": {
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "Default: relevance (best match) when a query is given, otherwise ending_soon",
                "enum": ["relevance", "ending_soon", "newest", "price_low", "price_high", "most_bids", "best_deals"],
                "type": "string"
              },
              "state": {
                "description": "2-letter US state code",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "zip": {
                "description": "Center a radius search on this ZIP",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:23fa08aa6c666e9dee94bc2d3e40a6735075ab8228728baf5999c559e62f9468"
        },
        {
          "name": "sold_comps",
          "title": "Sold-price comparables",
          "description": "Sold-price stats from 250,000+ closed government auctions, nearly all from the last 12 months. Category+state aggregates, or exact percentile comps for a live listing via listing_id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "type": "string"
              },
              "listing_id": {
                "description": "Pro: exact comps for this live listing",
                "type": "string"
              },
              "state": {
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d3711d6744136d751be5b1dbc9938ed6431093a5534ce496f4386730ddf6c67f"
        },
        {
          "name": "sold_comps_batch",
          "title": "Sold-price comparables, many at once",
          "description": "Up to 25 sold_comps lookups in one call (100 on Pro+), each costing one API call. Each query is a listing id, a tracked item slug (\"forklift\"), a category (\"vehicles\"), or text naming a tracked item (\"2015 Ford F150\"). Item-level and per-listing answers need Pro or Pro+; categories work on every plan. Amounts are in cents.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "queries": {
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "state": {
                "description": "Default 2-letter state for item and category queries",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["queries"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e204c9e0d87ed829a751858e8f3ff1aae8f3a7ed43adfbb852c01fdb9afc036"
        }
      ],
      "digest": "sha256:170ba6a133910f4667eca445fa4ccda0f17ae2a83968d2de8f561c627bfa21d0"
    }
  }
}
