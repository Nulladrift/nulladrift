        {
          "name": "estimate_cost_of_doing_nothing",
          "title": "Estimate the cost of doing nothing",
          "description": "Estimate what manual re-keying, incomplete requests and compliance rework cost each year. Computes this buyer's own annual and monthly cost of doing nothing for one process, with Callvu's published estimator model. Ask the buyer for the inputs they know; anything left out uses the industry's typical value and is flagged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "abandoned_share": {
                "description": "Share abandoned before completion, 0 to 1.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "ai_level": {
                "description": "Where AI stands on this process: none, pilot or production.",
                "enum": ["none", "pilot", "production"],
                "type": "string"
              },
              "incomplete_share": {
                "description": "Share that arrive incomplete or need rework, 0 to 1.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "manual_share": {
                "description": "Share of requests handled manually, 0 to 1.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "requests_per_month": {
                "description": "Requests or cases per month for the process.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "value_per_request": {
                "description": "Average value per request, in US dollars.",
                "minimum": 0,
                "type": "number"
              },
              "vertical": {
                "description": "A vertical slug, name or alias, for example \"banking\", \"Home lending\" or \"mortgage\". Case-insensitive.",
                "type": "string"
              }
            },
            "required": ["vertical"],
            "type": "object"
