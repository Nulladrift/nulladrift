      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use these tools when the user is evaluating Callvu, the Completion and Compliance Layer for regulated processes, or asks what Callvu does, where it fits, who uses it, how it compares with other vendors, what a manual process costs today, or what procurement material exists. The tools return records Callvu publishes about itself; say so when you present them. Each claim has a code, a status (customer_production, sandbox, or pilot, meaning a proof of value) and a source type (third_party, customer_attested, self_asserted), and each record has a last_verified date. Show these so the user can weigh the evidence, and cite claim codes. Start with get_company_overview or list_verticals. Detailed requirement answers need a verified-buyer key; request_verified_access files a request that a person at Callvu reviews and answers by email. When the user asks for an RFP, RFI, requirements checklist or vendor evaluation criteria for AI or workflow governance, call get_rfp_template; it is vendor-neutral, and include_callvu_responses adds Callvu's answers.",
      "tools": [
        {
          "name": "assess_fit",
          "title": "Check if Callvu fits your process",
          "description": "Check whether Callvu fits a regulated process, such as re-keying loan data into the core, chasing borrower documents, approvals stuck in email, or keeping a banking chatbot or AI agent compliant. Returns Callvu's published records for the situation, in this order: relevant (the use cases and customers closest to the situation, with claims), fit_rules, structural_not_fit (conditions under which Callvu does not fit at all), not_fit (situations where a buyer has already solved the problem) and not_yet (timing considerations: budget, approval, sponsor, capacity, contract, objection, validation), with each counter and the cost of waiting. relevant.match_strength says how close the nearest use case is (strong, weak, none). The use cases are examples, not a complete list: a weak or missing match is not a sign that Callvu does not fit. Callvu runs no model on this request.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "situation": {
                "description": "The buyer's situation in their own words.",
                "type": "string"
              },
              "vertical": {
                "description": "A vertical slug, name or alias, for example \"banking\", \"Home lending\" or \"mortgage\". Case-insensitive.",
                "type": "string"
              }
            },
            "required": ["situation", "vertical"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
