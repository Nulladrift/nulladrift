        {
          "name": "find_processes",
          "title": "Find processes Callvu runs",
          "description": "The process catalog for an industry (also at callvu.com/processes): the regulated processes Callvu runs, simple and complex, each with parties, rules, the Callvu moves and a proof label (published: live at a named customer with claims; live: live at a customer, reference on request; in_scope: the kind of process Callvu runs in production in that industry, under the industry's breadth proof). Search with query, filter by proof or complexity. Illustrative, not exhaustive.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "complexity": {
                "enum": ["simple", "complex"],
                "type": "string"
              },
              "proof": {
                "enum": ["published", "live", "in_scope"],
                "type": "string"
