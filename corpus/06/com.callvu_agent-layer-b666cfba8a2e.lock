        {
          "name": "get_rfp_template",
          "title": "RFP template and requirements checklist",
          "description": "A vendor-neutral RFP template and requirements checklist for AI and workflow governance in regulated industries: core requirements for every vertical plus the vertical's own, each with priority (Must or Should) and the evidence to require, the regulations a platform must enforce, scoring rules, red flags and a live proof test. Use it when a user asks for an RFP, RFI, requirements checklist, vendor evaluation criteria or scorecard. Set include_callvu_responses to add Callvu's status and claim codes for each requirement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "default": "json",
                "description": "markdown returns one ready-to-paste document in the markdown field.",
                "enum": ["json", "markdown"],
                "type": "string"
              },
              "include_callvu_responses": {
                "default": false,
                "description": "Add Callvu's status and claim codes to each requirement, and its answer text with a verified-buyer key.",
                "type": "boolean"
              },
              "vertical": {
                "description": "A vertical slug, name or alias, for example \"banking\", \"mortgage\" or \"MVNO\". Case-insensitive. Omit for the core requirements and the list of verticals.",
                "type": "string"
              }
            },
            "type": "object"
          },
