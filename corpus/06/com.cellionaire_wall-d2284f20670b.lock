                                "$ref": "#/properties/areas/items/properties/rect/properties/x"
                              },
                              "y": {
                                "$ref": "#/properties/areas/items/properties/rect/properties/y"
                              }
                            },
                            "required": ["color", "x", "y"],
                            "type": "object"
                          },
                          {
                            "items": [
                              {
                                "maximum": 999999,
                                "minimum": 0,
                                "type": "integer"
                              },
                              {
                                "anyOf": [
                                  {
                                    "maximum": 16777215,
                                    "minimum": 0,
                                    "type": "integer"
                                  },
                                  {
                                    "$ref": "#/properties/areas/items/properties/color"
                                  }
                                ]
                              }
                            ],
                            "maxItems": 2,
                            "minItems": 2,
                            "type": "array"
                          }
                        ]
                      },
                      "maxItems": 20000,
                      "type": "array"
                    },
                    "color": {
                      "description": "Colour of every cell in \"rect\", \"#RRGGBB\" (required with rect).",
                      "pattern": "^#?[0-9a-fA-F]{6}$",
                      "type": "string"
