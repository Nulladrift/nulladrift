                    "color": {
                      "description": "Colour of every cell in \"rect\", \"#RRGGBB\" (required with rect).",
                      "pattern": "^#?[0-9a-fA-F]{6}$",
                      "type": "string"
                    },
                    "rect": {
                      "additionalProperties": false,
                      "description": "A rectangle of cells: top-left x, y and width w, height h (cells).",
