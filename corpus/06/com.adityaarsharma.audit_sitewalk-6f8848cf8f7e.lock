        {
          "name": "get_audit_status",
          "title": "Check audit status",
          "description": "Use this after start_site_audit to check whether the audit has finished. Takes the audit_id. Returns status (queued, running, completed, failed or canceled), pages crawled so far, the page limit, and any notes or error text. If the status is failed, the error field says why (for example the site blocked the crawler or robots.txt disallows it). Also returns phase, a plain-English message with the stage, pages crawled and time left, progress_pct, stalled and next_check_after_s. After each call, show the user the message, then call again after next_check_after_s seconds (20 to 30) until the status is completed, failed or canceled. A big audit can take 20 to 60 minutes, so keep calling for as long as the status is running or queued. When completed it also returns report_url, pdf_url and csv_url.",
          "inputSchema": {
            "properties": {
              "audit_id": {
                "title": "Audit Id",
                "type": "string"
              }
            },
            "required": ["audit_id"],
            "title": "get_audit_statusArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_audit_statusDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Status ready",
            "openai/toolInvocation/invoking": "Checking the audit",
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["audit"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:7135810b4a511863b3196ff9fb4edbcc3f5932a4f0a2e4989f75bdf756482cc1"
        },
        {
          "name": "start_site_audit",
          "title": "Start site audit",
          "description": "Use this when the user asks for a technical SEO audit, a site crawl or an SEO health check of a website, or for broken links, redirect chains, duplicate or missing titles and meta descriptions, canonical, noindex or hreflang problems, sitemap errors, pages that are hard to find from the home page, or whether robots.txt or meta robots tags keep search engines out of pages. Takes a site address (a domain such as example.com or a full URL; the scheme is optional) and starts a crawl of that site, then returns an audit_id, the page limit and a time estimate to relay to the user. The crawl follows robots.txt, is rate limited, and takes a few minutes for a small site and longer for a large one. The number of pages crawled is capped; the report says when the cap was reached. If the address redirects (http to https, or to www), the final site is audited. Only use it for sites the user owns or is allowed to audit. Do not use it for backlinks, keyword rankings, Google Search Console or analytics data, or writing content: Sitewalk does not measure those. Optional render_scripts (true or false, default false): set it to true only when the user asks for the pages to be read after their scripts have run, as a browser shows them. The server decides whether that is possible for this site and says in the result how the pages were read; report that line as given. Leave it out otherwise. To read a finished audit, use get_audit_report instead.",
          "inputSchema": {
            "properties": {
              "render_scripts": {
                "default": false,
                "title": "Render Scripts",
                "type": "boolean"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "start_site_auditArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "start_site_auditDictOutput",
            "type": "object"
          },
