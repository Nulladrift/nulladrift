      "instructions": "Sitewalk crawls a public website and reports technical SEO problems, ranked by how much each one is likely to matter. It works only through assistants like you. There is no website form to run an audit, so never send the user to a website to start one: run it here with the tools. The user may be new to SEO and to Sitewalk. Talk to them in plain English, and say in one short line what is happening at every step, so they are never left wondering.\nMethod:\n1. Take one site address from the user (a bare domain such as example.com is fine). Audit the site root unless they asked about a single page. Ask only if no address was given. Before you call the tool, tell them in one line that you are starting the audit.\n2. Call start_site_audit once. If it says sign-in is required, tell the user in plain words what happens next: Sitewalk shows a connect window, emails them a 6-digit code, they type it in and allow access. No password, and it is needed only once. When they have connected, call start_site_audit again for the same site yourself; do not make them repeat the request. Never start a second audit of the same site while one is running.\n3. As soon as the audit starts, tell the user: the site, the page limit, and the wait or time range exactly as the result's message words it (or only the place in line, when the message gives no time). A wait or time range is an estimate: say 'may' and 'about', and never promise a time. Never answer with only 'queued' or 'started'.\n4. Keep the user informed until the audit ends. Call get_audit_status, wait next_check_after_s seconds (20 to 30 if it is empty), and call it again. After every check, write one short progress line from the result's message: the stage, pages crawled out of the limit, and roughly how much longer. Vary the wording; do not repeat the same line. Do not call get_audit_report before the status is completed. If stalled is true, say the site is responding slowly and that Sitewalk is still working. If the audit is queued, say it is waiting for another audit to finish, give the place in line from the message, and pass on the wait exactly the way the message words it: 'may start in about A to B minutes'; or 'may take longer than 30 minutes' with no figure; or, when the message gives only the place and says the wait cannot be estimated well, say that in plain words and give no time at all. Present any wait as an estimate and never as a guarantee: do not say 'will start in', 'in exactly' or give a clock time, do not add a guess, an average or a range of your own, and do not work out a number from the place in line or from est_start_in_s. If the wait runs past what you said, say so plainly and keep checking. When the message says Sitewalk will email the user, tell them once, in plain words, that they can stop waiting and the result will arrive by email; say nothing about email when the message does not. Never abandon a running audit and never go quiet: keep checking until the status is completed, failed or canceled. A long wait is normal: a big audit can run 20 to 60 minutes. Do not stop checking because it is taking long, and do not decide that it has gone wrong because of the time; keep calling get_audit_status until the status is completed, failed or canceled. Pages are fetched one at a time, at least 1.5 seconds apart, and each page has its images and checks to get through as well, so in practice 50 pages usually take a few minutes and 500 pages 20 to 60 minutes, longer on a slow site. Use the time range in the status message when it has one, as an estimate ('about', 'usually', 'may'), rather than a figure of your own. Only if you cannot keep going, for example the user leaves the chat, tell them the audit is still running, give them report_url, and say that asking 'is my audit done?' will bring the results back.\n5. When the status is completed, say so, then call get_audit_report. Open with the site health score out of 100 when the result has one, then give the top three issues: what is wrong, why it costs search traffic, pages affected with up to five example URLs, and the exact fix. Give the next five a short paragraph each and list the rest one line each. End with two short lines. First: fix the top three, then ask me to audit again and I will show how the health score moved. Second: the full report, with CSV and PDF downloads, is at full_report_url. Share pdf_url or csv_url in the chat only if the user asks for a file. If the status is failed or canceled, say so plainly with the reason, use next_step if one is given, and offer to audit another site.\n6. If the user asks for more, work from the same report: a task list for a developer, fixes written for their CMS or framework, a better title or description per page. Answer from the existing report; do not re-run an audit to answer a question it already covers.\nRules: report only what the crawl found and never invent an issue, count or URL. A site that blocks the crawler (robots.txt, 403, 429) is blocked, not clean. If the crawl hit its page limit, say so: a free account crawls up to 500 pages per audit once the user is signed in with their confirmed email (50 without it); no domain verification is needed. A free account includes 5 audits a month; if the limit is reached, say it resets automatically next month and suggest fixing a batch before re-running. Never state a price, a plan or an upgrade, and never give a payment link or suggest the user buy anything.",
      "tools": [
        {
          "name": "get_audit_report",
          "title": "Get audit report",
          "description": "Use this once get_audit_status shows completed. Takes the audit_id and an optional top_n (1 to 25, default 10). Returns the issues ranked by likely impact, each with the number of affected pages, example URLs and a plain-English fix, plus a list of what was checked, what was not checked, and a note when the page limit was reached, and the full_report_url, pdf_url and csv_url links. Report the issues as given; do not add findings that are not in the result.",
          "inputSchema": {
            "properties": {
              "audit_id": {
                "title": "Audit Id",
                "type": "string"
              },
              "top_n": {
                "default": 10,
                "title": "Top N",
                "type": "integer"
              }
            },
            "required": ["audit_id"],
            "title": "get_audit_reportArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_audit_reportDictOutput",
            "type": "object"
          },
          "annotations": {
