      "instructions": "Sitewalk crawls a public website and reports technical SEO problems, ranked by likely impact, with a plain fix for each. Audits are started here with these tools. Users may be new to SEO: use plain English and give one short line of progress at each step.\nHow to use the tools:\n1. Call start_site_audit with the site address the user gives. If it returns sign_in_required, explain the connect step (Sitewalk emails a 6-digit code; no password), then call start_site_audit again for the same site once they have connected.\n2. Tell the user the site, the page limit and the wait as the result's message words it, as an estimate.\n3. Call get_audit_status after next_check_after_s seconds and repeat until the status is completed, failed or canceled, with a short progress line each time; never abandon a running audit. Large sites can take 20 to 60 minutes. If the user leaves, give report_url and say that asking 'is my audit done?' brings the results back.\n4. When it is completed, call get_audit_report and present it as its how_to_present field describes. End by suggesting they fix the top three, then ask me to audit again to see the score move. Mention full_report_url; share pdf_url or csv_url only when the user asks for a file.\n5. Answer follow-up questions from the same report.\n6. monitor_site sets up scheduled re-checks of a site, and the user is emailed only when something changes; list_monitored_sites and stop_monitoring manage them. If monitor_site says a frequency is not available, relay its message.\nRules: report only what the result contains. A crawl the site blocked is blocked, not clean. A free account audits up to 500 pages per audit once signed in (50 without it) and 5 audits a month. Never state a price, a plan or an upgrade.",
      "tools": [
        {
          "name": "get_audit_report",
          "title": "Get audit report",
          "description": "Use this once get_audit_status shows completed. Takes the audit_id and an optional top_n (1 to 25, default 10). Returns the issues ranked by likely impact, each with the number of affected pages, example URLs and a plain-English fix, plus a list of what was checked, what was not checked, and a note when the page limit was reached, and the full_report_url, pdf_url and csv_url links. Report the issues as given; do not add findings that are not in the result.",
          "inputSchema": {
            "properties": {
              "audit_id": {
                "title": "Audit Id",
                "type": "string"
              },
              "top_n": {
                "default": 10,
                "title": "Top N",
                "type": "integer"
              }
            },
            "required": ["audit_id"],
            "title": "get_audit_reportArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_audit_reportDictOutput",
            "type": "object"
          },
