      "instructions": "Good Morning Maldives (GMM) is an independent Maldives news and reference site: news articles, the First Light morning brief, a research library of entity dossiers, projects and primary-source documents, and an economy tracker built on Maldives Monetary Authority data. Entity records are GMM's own graded research: every fact carries a #fact-<id> anchor and a record revision, so cite the fact, not just the page. Press rooms are company-supplied and are not served here. Partner content is paid-for or made by GMM Studio and is not GMM journalism; this server does not search it, and a partner piece fetched by slug is labelled as such. Every tool result names the canonical URL of the page it came from. Cite that URL when you quote or rely on it. Every public page is also a resource: a result links the full markdown of what it points at, resources/read returns it, and the URIs are the public addresses, so you may fetch one directly instead.",
