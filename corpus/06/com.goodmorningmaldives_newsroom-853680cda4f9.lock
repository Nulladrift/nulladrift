        {
          "name": "search_site",
          "title": "Search everything",
          "description": "Searches the whole publication at once and says what kind each hit is: news articles, First Light items, entity records, projects, source documents and tracker pages. This is the broad search — prefer it when the question is not already about one kind of thing, because search_articles and the other per-kind tools look only in their own kind. Matching ignores case AND accents, so \"Male\" finds \"Malé\"; a query wrapped in slashes (/min(istry|ister)/) is a regular expression. Every hit carries the canonical URL to cite. Searches the most recent 400 stories and 45 First Light editions, and all reference records. Paginates: when more results remain, the structured answer has a nextCursor (absent on the last page). To continue, call this tool again with the same arguments and cursor set to that value. The cursor moves every kind on together: each page shows the next `limit` hits of each kind.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Continue a previous result: the nextCursor it returned, unchanged. Only valid with the same other arguments (limit may differ).",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "en (English) or dv (Dhivehi).",
                "enum": ["en", "dv"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Hits to return per kind (1-25, default 8).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Words to look for, or /a regular expression/.",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "groups": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "found": {
                      "description": "Hits of this kind in all.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "kind": {
                      "description": "What the hits are, e.g. \"News articles\" or \"Projects\".",
                      "type": "string"
                    },
                    "rows": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "note": {
                            "type": "string"
                          },
                          "snippet": {
                            "type": ["string", "null"]
                          },
                          "title": {
                            "type": "string"
                          },
                          "url": {
                            "description": "Canonical URL to cite.",
                            "type": "string"
                          }
                        },
                        "required": ["title", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["found", "kind", "rows"],
                  "type": "object"
                },
                "type": "array"
              },
              "nextCursor": {
                "description": "Opaque cursor for the next page: pass it back as the cursor argument, with the same other arguments. Absent on the last page.",
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "total": {
                "description": "Every hit across all kinds, not just this page.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
