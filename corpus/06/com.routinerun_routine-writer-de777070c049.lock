      "serverInfo": {
        "name": "routine-run-writer",
        "title": "Routine Run: write a routine",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Routine Run is an iPhone app that walks somebody through a routine one step at a time. To write one: read how_to_write_a_routine once, write the routine in that form, and pass it to routine_link — the link opens it in the app, which shows it before anything is saved. To start from a ready one, find_starter_routine. Nothing here reads or changes what is on anybody's phone; that is the other Routine Run server, which needs sign-in.",
      "tools": [
        {
          "name": "find_starter_routine",
          "title": "Find a ready routine",
          "description": "Searches the routines the app ships — mornings, focus, on call, chores and more — by words in their name or description. Each comes with its steps and a link that adds it in the app.",
          "inputSchema": {
            "properties": {
              "words": {
                "description": "What it is for, in a few words. Leave out to list them all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a ready routine"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6bacdf7f7bdd5063cfa7713f854f31b4baffa94257b53dfb29a27b3c2318ce7"
        },
        {
          "name": "how_to_write_a_routine",
          "title": "How to write a routine",
          "description": "The JSON form Routine Run reads a routine in: every field and every action a step can take. Use it when writing a routine for routine_link, start_new_run or propose_new_routine.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to write a routine"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a510ebc77ea5890eb92868fe62760e8375aae14ed34e194e89bf377a5e93e94f"
        },
        {
          "name": "routine_link",
          "title": "Make a link that opens a routine in the app",
          "description": "Checks a routine written in the form how_to_write_a_routine describes and returns a link. Opened on an iPhone with Routine Run, it shows the routine on the app's review screen, where the person saves it or not. Nothing is kept here. Give the person the link and the JSON too, in case the link is opened somewhere else.",
          "inputSchema": {
            "properties": {
              "routine": {
                "description": "The routine: one JSON object in the form, with \"routineRun\": 1, a name and its steps. JSON text is read too.",
                "type": ["object", "string"]
              }
            },
            "required": ["routine"],
            "type": "object"
          },
