          },
          "digest": "sha256:6fa79f83ff10a1a710bc20d31082e4a57025cf48a63ec3b3e6601c1d429112fd"
        },
        {
          "name": "get_lead_time",
          "title": "Get delivery lead time",
          "description": "Delivery lead-time band for a product (weeks, purchase order to shipment) plus Entogo's company-wide lead-time and warranty commitments. Bands: catalogue EV chargers 4–8, medium manufactured equipment 16–24, large engineered-to-order systems 16–24 weeks; new cULus / CSA certification can extend a band, to within 36 weeks when the order needs it. IEC/CE equipment built for export markets: about 12 weeks.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product id / URL slug",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "market": {
                "default": "north-america",
                "description": "Buyer market: north-america = ANSI/IEEE (UL/CSA on request) build; eu = IEC/EN CE edition (Poland, Romania, EU); gcc = IEC Gulf edition; central-asia-caucasus = IEC, GOST-compatible edition (KZ UZ KG TJ TM AZ AM GE; never Russia / Belarus)",
                "enum": ["north-america", "eu", "gcc", "central-asia-caucasus"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2d86c7f9357984deb67bcfd2a6ae611ec7add1c4fdada5a5a641f46098f11a44"
        },
        {
          "name": "get_product",
          "title": "Get an Entogo product",
          "description": "Full record for one product by catalogue id (slug): specifications, features, applications, FAQs, certifications listed on the page, lead-time band, language editions, Markdown twin and the quote channel.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product id / URL slug, e.g. metal-clad-switchgear",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6d5b0d0739c1b2c44ec72d8f40febfff2431bc4d8386e5267d6edb091bbe6a1d"
        },
        {
          "name": "list_products",
          "title": "List Entogo products",
          "description": "List products in the catalogue, optionally filtered by category (power = transformers & substations; distribution = switchgear & distribution; storage = battery energy storage; emobility = EV charging & PV-storage-charging) and/or a keyword. Returns compact rows; call get_product for full specifications.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["power", "distribution", "storage", "emobility"],
                "type": "string"
              },
              "keyword": {
                "description": "Case-insensitive match on title / model / summary, including the Polish, Romanian and Arabic edition titles",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9f3c61d640187d2f10c7d09b06537412216e6091b954e53a160ce6d7674b2ddd"
        },
        {
          "name": "request_quote_handoff",
          "title": "Hand off to Entogo for a quote",
          "description": "Returns the right channel for a request for quotation (RFQ): the transformer configurator deep link (pre-filled with the product name), the contact page, e-mail and phone numbers, office hours and the one-business-day response commitment. This tool stores nothing and sends nothing — the user completes the request on entogo.ca or by e-mail.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
                "description": "Language of the buyer — links point to that language edition of the site",
                "enum": ["en", "fr", "es", "ar", "pl", "ro", "ru"],
                "type": "string"
              },
              "product": {
                "description": "Product name or id the user is interested in",
                "maxLength": 160,
                "type": "string"
              },
              "summary": {
                "description": "One-paragraph project summary to paste into the form",
                "maxLength": 600,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e3844d60af2bfd0e7b7dba58dd2cffa149182de832e83bcb47300341809af933"
        },
        {
          "name": "search_knowledge",
          "title": "Search Entogo knowledge base",
          "description": "Semantic search over Entogo's product, solution, manufacturing, certification, lead-time and warranty knowledge (the same index that grounds the Ensight assistant). Returns the best-matching passages with source URLs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Natural-language question or keywords",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "topK": {
                "default": 5,
                "description": "Number of passages to return",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
