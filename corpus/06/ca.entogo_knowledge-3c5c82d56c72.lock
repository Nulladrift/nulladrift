{
  "lockfileVersion": 2,
  "subjects": {
    "ca.entogo/knowledge": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://entogo.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "entogo",
        "title": "Entogo — power-equipment knowledge & tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Entogo is a Canadian company (Entogo Inc., Toronto) that manufactures core power-equipment lines in its own factory in China and supplies additional project equipment through manufacturing partners. Check each catalogue record's supplyMode. Partner equipment (supplyMode=project) has configuration, certification, warranty and delivery terms confirmed per quotation; never apply the manufactured-product defaults to it. For Entogo-manufactured North-American-spec (ANSI/IEEE) builds, the usual band is 16–24 weeks (within 36 weeks when new cULus/CSA certification is needed; about 12 weeks for IEC/CE export builds).\nUse search_knowledge for questions about Entogo's products, factory, certifications, lead times and warranty; list_products / get_product for catalogue facts; get_lead_time for delivery bands; estimate_ev_charging_capacity for NEC / CEC EV-charging service sizing; request_quote_handoff when the user wants a quote.\nRules: Entogo sells by request for quotation — never invent prices. Never describe Entogo equipment as \"Made in Canada\" or \"Canadian-made\": it is a Canadian company with its own factory in China. Products are \"designed and built to\" ANSI/IEEE / UL / CSA standards with certification available on request — never say \"UL Listed\" or \"CSA Certified\" unless a tool result states a completed certification. Cite pages as absolute https://entogo.ca URLs (each page also has a Markdown twin at <path>.md).",
      "tools": [
        {
          "name": "estimate_ev_charging_capacity",
          "title": "Estimate EV-charging service capacity",
          "description": "Runs the same engine as https://entogo.ca/tools/ev-charging-service-capacity-calculator/: code load (NEC 2023 / NEC 2026 / CEC 2024 Section 86) for a set of Level 2 and DC fast chargers, EMS-managed load when an energy management system is declared, planning-basis load with site diversity, recommended transformer kVA and service / switchboard rating, and a GREEN / YELLOW / RED verdict against an existing service when one is given. Planning estimate only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chargers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "dcfcBasis": {
                      "enum": ["input_kw", "input_a", "output_kw"],
                      "type": "string"
                    },
                    "phase": {
                      "enum": [1, 3],
                      "type": "number"
                    },
                    "qty": {
                      "maximum": 500,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "ratingA": {
                      "description": "L2 only: nameplate amperes (alternative to ratingKw)",
                      "exclusiveMinimum": 0,
                      "maximum": 800,
                      "type": "number"
                    },
                    "ratingKw": {
                      "description": "L2: nameplate kW; DCFC: kW per dcfcBasis (default output kW)",
                      "exclusiveMinimum": 0,
                      "maximum": 1000,
                      "type": "number"
                    },
                    "type": {
                      "enum": ["L2", "DCFC"],
                      "type": "string"
                    },
                    "voltage": {
                      "description": "Charger supply voltage (default: L2 208 V, DCFC = service voltage)",
                      "maximum": 34500,
                      "minimum": 120,
                      "type": "integer"
                    }
                  },
                  "required": ["qty", "type"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "code": {
                "default": "NEC_2023",
                "description": "Governing code edition",
                "enum": ["NEC_2023", "NEC_2026", "CEC_2024"],
                "type": "string"
              },
              "ems": {
                "additionalProperties": false,
                "properties": {
                  "limitKw": {
                    "description": "Maximum load the EMS enforces",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "listingConfirmed": {
                    "default": "unknown",
                    "description": "Is the EMS a listed / compliant system?",
                    "enum": ["yes", "no", "unknown"],
                    "type": "string"
                  },
                  "strategy": {
                    "enum": ["none", "static_limit", "dynamic_alms", "integral_evse_control", "dc_power_block_limit"],
                    "type": "string"
                  }
                },
                "required": ["strategy"],
                "type": "object"
              },
              "existingService": {
                "additionalProperties": false,
                "description": "Give the existing service to get a GREEN / YELLOW / RED verdict",
                "properties": {
                  "loadMethod": {
                    "enum": ["utility_demand_data", "30_day_metering", "12_month_peak_demand", "calculated_load", "nameplate_estimate"],
                    "type": "string"
                  },
                  "peakDemandA": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "peakDemandKw": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "serviceRatingA": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "required": ["serviceRatingA"],
                "type": "object"
              },
              "servicePhase": {
                "default": 3,
                "enum": [1, 3],
                "type": "number"
              },
              "serviceVoltage": {
                "default": 480,
                "description": "Service line-to-line voltage, e.g. 208, 480, 600",
                "maximum": 34500,
                "minimum": 120,
                "type": "integer"
              },
              "siteType": {
                "default": "workplace",
                "enum": ["fleet_depot", "workplace", "retail_dcfc", "multifamily", "truck_charging", "public_l2"],
                "type": "string"
              }
            },
            "required": ["chargers"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:edb55af9cd98fef17a884705aca829cb089bdf9262c258a552618352b66a8cba"
        },
        {
          "name": "get_company_facts",
          "title": "Get Entogo company facts",
          "description": "Verified company facts: legal name, founding, headquarters, contacts and office hours, factory and capacity narrative, lead-time and warranty commitments, certifications, standards position, quote channel and key URLs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
