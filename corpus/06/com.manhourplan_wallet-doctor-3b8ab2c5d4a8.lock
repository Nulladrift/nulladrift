      "serverInfo": {
        "name": "wallet-doctor-mcp",
        "version": "0.6.7"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Paid tools use x402 v2 over MCP: call without payment to receive PaymentRequired (isError result with structuredContent.accepts), then retry with params._meta['x402/payment'] = PaymentPayload. USDC on Base or Solana (Base listed first in accepts); settled only when the tool succeeds.",
      "tools": [
        {
          "name": "approvals",
          "description": "SPL token approvals: token accounts with an active delegate (SPL Token + Token-2022) — $0.005 USDC per call via x402 v2 (Solana or Base).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "wallet": {
                "description": "Solana wallet address (base58 public key)",
                "example": "4dX3VmkGFJHj1XZbWN1MbRYnCaxYWEEN21LjkmCe9JRE",
                "pattern": "^[1-9A-HJ-NP-Za-km-z]{32,44}$",
                "type": "string"
              }
            },
            "required": ["wallet"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "approvals": {
                "items": {
                  "properties": {
                    "balance": {
                      "type": "string"
                    },
                    "delegate": {
                      "type": "string"
                    },
                    "delegated_amount": {
                      "type": "string"
                    },
                    "mint": {
                      "type": "string"
                    },
                    "program": {
                      "type": "string"
                    },
                    "token_account": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "approvals_count": {
                "type": "integer"
              },
              "ok": {
                "type": "boolean"
              },
              "wallet": {
                "type": "string"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "x402/amount": "5000",
            "x402/endpoint": "https://wallet-doctor-x402.m-zikriz.workers.dev/v1/approvals",
            "x402/networks": ["eip155:8453", "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"],
            "x402/paid": true,
            "x402/priceUSD": 0.005
          },
          "digest": "sha256:d6b3588cee0d02b40e4c3c3a014465df3000eeb680e73db7c05bd20926d44e96"
        },
        {
