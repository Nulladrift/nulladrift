        {
          "name": "txtrace",
          "description": "Solana transaction trace: status, slot, fee, SOL balance changes, first 20 log lines — $0.005 USDC per call via x402 v2 (Solana or Base).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "signature": {
                "description": "Solana transaction signature (base58)",
                "example": "2b96kfbbxdTUSVLFeRWVGoUmHR1rkgni4zR2rjxzBKo929CBP8kTSP3ns9iDk58Dncnt9Fqarq68UcYFGgBwEANY",
                "pattern": "^[1-9A-HJ-NP-Za-km-z]{64,90}$",
