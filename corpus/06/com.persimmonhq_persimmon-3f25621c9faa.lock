{
  "lockfileVersion": 2,
  "subjects": {
    "com.persimmonhq/persimmon": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.persimmonhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "persimmon",
        "version": "0.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Persimmon brand-intelligence MCP from Spann. Three read-only tools: get_momentum_index, get_brand_signals, get_competitive_context. Every response is filtered through the evidence-policy egress filter; internal-only and licensed-display content is dropped before emit.",
      "tools": [
        {
          "name": "get_brand_signals",
          "description": "Use this when an agent needs the recent harvested signals (each with text, tier, score, and source URL) backing a brand's score. Public-citable signals only — internal-only items are filtered before emit. Always carries a coverage_status describing why a list may be empty.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand name.",
                "type": "string"
              },
              "limit": {
                "description": "Max signals to return. Defaults to 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "tier_floor": {
                "description": "Minimum signal tier to include. Defaults to NOTABLE.",
                "enum": ["NOTABLE", "STRONG"],
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:627980615a6421036c11343776fe5683be0d104569f100c951356f622b658aff"
        },
        {
          "name": "get_competitive_context",
          "description": "Use this when an agent needs a brand's competitor set, peer momentum snapshots, and a deterministic competitive-position one-liner. Excludes peers without real signal coverage (scaffold tier). Always carries a coverage_status describing the result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand name.",
                "type": "string"
              },
              "limit": {
                "description": "Max number of peer snapshots to return. Defaults to 4.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:11af960da6f439657505c2a99b846bc2a16199ec551f81405a40c163c71825dc"
        },
        {
          "name": "get_momentum_index",
          "description": "Use this when an agent needs Persimmon's deterministic momentum score for a specific brand or the top of the index. Returns composite score plus four dimensions (Draw, Surge, Wedge, Hold), tier band, signal count, and last-updated timestamp. Pure read; no LLM calls in scoring.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand name. Omit to receive the full index (capped to top-N by composite score).",
                "type": "string"
              },
              "limit": {
                "description": "When `brand` is omitted, cap the number of returned brand entries. Defaults to 50. Maximum 200.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:591be678fb698110d8ab7edf9118625bab42ffced94fd7d0a4b4b940b224db70"
        }
      ],
      "digest": "sha256:d909c460e0f50e4938d9c32cf0d240a2e6f18d3059d3436433cc6a56864db7df"
    }
  }
}
