      },
      "instructions": "PancakeSwap on BNB Smart Chain, measured from the chain: read-only, free, no API key. Deciding WHERE to provide liquidity: pancakeswap_fee_tiers (which fee tier of a pair actually pays its LPs). Picking the PRICE RANGE of a V3 position: pancakeswap_range_plan (replays real swaps per width). Checking a V3 position you hold: pancakeswap_position_look. Swapping: pancakeswap_best_route (the pool that returns most at your size, and the round trip with the transfer tax). For a token safety check before a trade use https://brainonbnb.com/mcp/preflight; every tool together is at https://brainonbnb.com/mcp.",
      "tools": [
        {
          "name": "pancakeswap_best_route",
          "description": "For an agent about to swap on PancakeSwap, and for the two questions it has to answer before signing. FIRST: which of the up-to-five pools the pair lives in actually returns the most AT THIS SIZE, quoted by the venue itself rather than ranked by depth - the deepest pool is regularly not the cheapest one for the trade being made. SECOND: what comes back if the proceeds are sold straight back on the same route, with the transfer tax (measured from executed trades, or simulated on chain when there was no trade to measure: transfer_tax.source says which) applied to the amounts carried between the legs, because the tax is taken outside the pool where no quoter can see it. Returns the best route, what every other route would have cost, the round trip with and without the tax, and the slippage this size really needs. It is not a safety certificate and does not use the word: it cannot see an owner who has not acted yet, and it says so.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "A BSC token address, or a PancakeSwap pool address to pin the pair",
                "examples": ["0x0E09FaBB73Bd3Ade0a17ECC321fD13a19e81cE82"],
                "type": "string"
              },
              "usd": {
                "description": "Trade size in dollars, optional - defaults to 250",
                "type": "number"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8a9b81256b26bb0c9ef293627e33a8a35ac869eb2ec603b3192880854c7d38d7"
        },
        {
          "name": "pancakeswap_fee_tiers",
          "description": "Measure which PancakeSwap fee tier of a pair actually pays liquidity providers, to decide WHERE to put liquidity. Use it before adding liquidity to a pair; once the pool is chosen use pancakeswap_range_plan for the price range, for a position you already hold use pancakeswap_position_look, and for a swap (not liquidity) use pancakeswap_best_route. Pass a token to compare all its pools against its main quote, or a pool address to pin the exact pair. A pair lives in up to five pools at once — V2 at 0.25% and V3 at 0.01%, 0.05%, 0.25% and 1.00% — and every source ranks them by the money already parked in them, which does not say which one pays. This measures each tier over a live window: swaps, turnover, the fees the pool actually paid out, and those fees per $1,000 of capital — over TWO denominators. The first is everything the pool holds, which is what every interface shows. The second is the capital standing within 2% of the current price, reconstructed by walking the tick book of the pool itself, because concentrated liquidity parked far from the price earns nothing and a new dollar only competes with the capital that is at the price. The two rankings disagree often, and both are returned. It also names tiers holding real money that did not trade at all. Measured, never annualised: the window is about an hour of chain and is reported with the answer. The same token asked again within 60 seconds gets the same measurement from the edge cache (cache.hit, cache.age_seconds). Read-only, free, no key; a tier whose pool could not be read is listed in tiers_unreadable and comparison_complete says whether every tier was measured.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "A BSC token address (all of its PancakeSwap pools against its main quote are compared), or one PancakeSwap pool address to pin that exact pair; 0x + 40 hex",
                "examples": ["0x0E09FaBB73Bd3Ade0a17ECC321fD13a19e81cE82"],
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5ebb0840233bc8d2b8b6610c908333c19ecaddbf0d13bad03b729a1b8d99576e"
        },
        {
          "name": "pancakeswap_position_look",
          "description": "Look at any PancakeSwap V3 liquidity position on BNB Chain, read from the chain: in range or not and how much room is left to each edge, what it holds and is worth in BNB, the fees it is owed and whether collecting them pays for the gas, and what PancakeSwap’s The Flip proposal (LPs keeping 88% of swap fees) would change for it if adopted - the share the pool pays its LPs today is read from the pool itself. Give a position id, or a wallet that holds one (a wallet with several gets their ids back). Free. What to do about it - whether a re-set is due and in which width - is the paid plan of the DeFi Agent (ERC-8004 #363709), 0.10 USD1 or half that in $BOBAI.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Or a wallet address that holds the position",
                "examples": ["0xbFAA69233741924eD5b9d5DAA9B4Bf7B84567F0A"],
                "type": "string"
              },
              "position": {
                "description": "A PancakeSwap V3 position id (the NFT token id), digits only",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5c5257fbb94cc82b95afa2560ceba5557aa1f2e74ab4915c5df68aed283669e6"
        },
        {
          "name": "pancakeswap_range_plan",
          "description": "Replay real swaps to compare PRICE RANGE widths for a PancakeSwap V3 position: fees each width would have earned and how long it stayed in range. Use it after the pool is chosen (pancakeswap_fee_tiers picks the tier); for a position you already hold use pancakeswap_position_look. Read-only, free, no key. For a liquidity provider who has picked a PancakeSwap V3 pool and now has to pick a PRICE RANGE - the decision concentrated liquidity actually forces, and the one every interface answers with a preset. This does not model and does not forecast. It replays: the V3 Swap event carries the liquidity that was active when each trade went through, so a position of a stated size is walked through the swaps that really happened in a live window and asked, at each one, whether it was in range and what share of the active liquidity it was. Returns per candidate width the fees it would have collected, how much of the window it stayed in range, and how many times the price walked out. Impermanent loss is not in it, and it is worst exactly where the fees are best. The window is about an hour and travels with the answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "A BSC token address, or a PancakeSwap V3 pool address to pin the pool",
                "examples": ["0x0E09FaBB73Bd3Ade0a17ECC321fD13a19e81cE82"],
                "type": "string"
              },
              "capitalUsd": {
                "description": "Size of the position in dollars, optional - defaults to 1000. It sets your share of the active liquidity at each swap, so the fees depend on it",
                "type": "number"
              },
              "quote": {
                "description": "The other side of the pair, optional: BNB, USDT, USDC, USD1 or BUSD, or its address. Without it the quote with the deepest V3 pool is used, so pass it whenever a pair was named (CAKE/BNB)",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dd2dc90d0ad22164293c59882455e500578d9c88c5495c6fe85969aa688d2572"
        }
