{
  "lockfileVersion": 2,
  "subjects": {
    "com.germandex/guides": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://germandex.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "germandex",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only public student guides to Germany. Sources are guidance, not independently verified legal, medical, tax or financial advice. Cite sourceUrl and verify official sources for decisions. Translations are not native-reviewed.",
      "tools": [
        {
          "name": "get_guide",
          "description": "Fetch a single published guide as Markdown. Use a route returned by list_sections, / for the homepage, and an optional language code. Only known public guide routes are allowed; legal pages are English-only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "enum": ["en", "fr", "pt", "es", "id", "tr", "hr", "sl", "zh", "hi", "ta", "th"],
                "type": "string"
              },
              "route": {
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["route"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4905052343ad2bfb557053040c160b54b448651504ddd3823d0fe3084e3c4f26"
        },
        {
          "name": "list_cities",
          "description": "List the ten supported German student cities and their guide entry points.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f84691ffa7de63a5e578902b71abbc17f6530ac2bcec57a4486a56f640e2b50"
        },
        {
          "name": "list_sections",
          "description": "List city sections, Germany-wide guides and supported language codes. Optionally choose a supported city.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "enum": ["aachen", "berlin", "bochum", "dortmund", "duesseldorf", "frankfurt", "hamburg", "koeln", "muenchen", "muenster", "erlangen", "tuebingen"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63955b812708cf4d6f9a6eb129a98f5830b20c2dfee36e1b046cb29b672207a5"
        }
      ],
      "digest": "sha256:e51a430e95de77e74b6427f0cff62e544eedf5cbdf58c3fdc64eba9a1efbcbd3"
    }
  }
