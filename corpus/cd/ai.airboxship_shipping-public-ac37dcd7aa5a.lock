{
  "lockfileVersion": 2,
  "subjects": {
    "ai.airboxship/shipping-public": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://airboxship.ai/mcp-public"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ai.airboxship/shipping-public",
        "title": "AirboxShip Shipping (public)",
        "version": "1.0.0",
        "websiteUrl": "https://airboxship.ai/mcp-guide"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Look up USPS Post Offices and Smart Lockers for package pickup/drop-off, get USPS and UPS shipping rates (price and delivery time) between two US addresses, and track a USPS package by tracking number. No sign-in is needed. This service only looks things up; it cannot buy a label. Buying labels is done with a BoxNearby account at airboxship.ai.",
      "tools": [
        {
          "name": "find_pickup_hubs",
          "title": "Find Pickup Locations",
          "description": "Find nearby USPS Post Offices and Smart Lockers for package pickup/drop-off.\n\n    Returns each location's id, name, type, address and distance in miles. This is a\n    look-up only; it does not buy a label or reserve anything.\n    ",
          "inputSchema": {
            "properties": {
              "location": {
                "description": "Address, place name or ZIP code, e.g. '94103' or '123 Main St, San Francisco, CA'",
                "title": "Location",
                "type": "string"
              },
              "radius_miles": {
                "default": 5,
                "description": "Search radius in miles (1 to 25)",
                "maximum": 25,
                "minimum": 1,
                "title": "Radius Miles",
                "type": "integer"
              }
            },
            "required": ["location"],
            "title": "find_pickup_hubsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9dfa92767851dcc7d2bc0b79e0eb0f1b41d286bcff13da7eb645c090356e18ea"
        },
        {
          "name": "get_shipping_rates",
          "title": "Get Shipping Rates",
          "description": "Get shipping rates (postage cost and delivery time) for mailing a package with USPS or UPS\n    home delivery, between two US addresses.\n\n    Returns each option's carrier, service, price in USD and estimated delivery time at the\n    standard price. Quotes are indicative and not reserved. This tool only quotes prices; it\n    does not buy a label.\n    ",
          "inputSchema": {
            "properties": {
              "height_in": {
                "description": "Package height in inches",
                "title": "Height In",
                "type": "number"
              },
              "length_in": {
                "description": "Package length in inches",
                "title": "Length In",
                "type": "number"
              },
              "recipient_city": {
                "description": "City name, e.g. 'San Francisco'",
                "title": "Recipient City",
                "type": "string"
              },
              "recipient_name": {
                "description": "Full name of the person or business at this address",
                "title": "Recipient Name",
                "type": "string"
              },
              "recipient_state": {
                "description": "Two-letter US state code, e.g. 'CA'",
                "title": "Recipient State",
                "type": "string"
              },
              "recipient_street1": {
                "description": "Street address line, e.g. '123 Main St'",
                "title": "Recipient Street1",
                "type": "string"
              },
              "recipient_zip": {
                "description": "US ZIP code, e.g. '94103'",
                "title": "Recipient Zip",
                "type": "string"
              },
              "sender_city": {
                "description": "City name, e.g. 'San Francisco'",
                "title": "Sender City",
                "type": "string"
              },
              "sender_name": {
                "description": "Full name of the person or business at this address",
                "title": "Sender Name",
                "type": "string"
              },
              "sender_state": {
                "description": "Two-letter US state code, e.g. 'CA'",
                "title": "Sender State",
                "type": "string"
              },
              "sender_street1": {
                "description": "Street address line, e.g. '123 Main St'",
                "title": "Sender Street1",
                "type": "string"
              },
              "sender_zip": {
                "description": "US ZIP code, e.g. '94103'",
                "title": "Sender Zip",
                "type": "string"
              },
              "weight_lb": {
                "description": "Package weight in pounds, e.g. 2.5",
                "title": "Weight Lb",
                "type": "number"
              },
              "width_in": {
                "description": "Package width in inches",
                "title": "Width In",
                "type": "number"
              }
            },
            "required": ["height_in", "length_in", "recipient_city", "recipient_name", "recipient_state", "recipient_street1", "recipient_zip", "sender_city", "sender_name", "sender_state", "sender_street1", "sender_zip", "weight_lb", "width_in"],
            "title": "get_shipping_ratesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f1b092b57839554ba8f2cc83eaebe60a419eadf43d050f99a05a38bb9d2c8aca"
        },
        {
          "name": "track_package",
          "title": "Track a Package",
          "description": "Look up the current status of a USPS package by its tracking number.\n\n    Returns the status, USPS's one-line summary, the expected delivery date and the latest scan\n    (what happened, when, and the city and state). The same information usps.com shows anyone who\n    has the number. USPS packages only: a UPS number gets an error pointing to ups.com.\n    ",
          "inputSchema": {
            "properties": {
              "tracking_number": {
                "description": "USPS tracking number, e.g. '9400111899223197428490'",
                "title": "Tracking Number",
                "type": "string"
              }
            },
            "required": ["tracking_number"],
            "title": "track_packageArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9c6ccb1afbfacd060f8db44c5462c7c985608a25fb8770a99c3c3e22cfa86044"
        }
      ],
      "digest": "sha256:768c18403fa4a6460d77f0ec398e50935c42447fbec0054899cf3c9b94fdc5ac"
    }
  }
}
