{
  "lockfileVersion": 2,
  "subjects": {
    "com.generaterandomiban/iban-generator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://generaterandomiban.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Generate Random IBAN",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Tools to generate and validate structurally valid test IBANs (ISO 13616 / MOD-97), with correct national check digits where the country has them. generate_iban is realistic by default (real bank codes of major banks, digits only, random account numbers); pass realistic: false for fully random IBANs. Generated IBANs were not issued by any bank: never use them for payments.",
      "tools": [
        {
          "name": "generate_iban",
          "description": "Generate one or more random, structurally valid (ISO 13616 / MOD-97) test IBANs for a country, with correct national check digits where the country has them. Generated IBANs were not issued by any bank: never use them for payments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 1,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. DE, FR, IT.",
                "type": "string"
              },
              "realistic": {
                "default": true,
                "description": "Realistic mode (default true): digits only in alphanumeric fields (except real bank codes that contain letters), and a real bank code of a major bank (where curated data exists for the country) with a random account number. Pass false for fully random bank codes and accounts (letters where the format allows them). Such an IBAN was not issued by any bank but could match a real account by chance, so never use it for payments.",
                "type": "boolean"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dac4609d2b971a187b1cd4f335319c78b692887e933d4993bb51d5adff8d46b0"
        },
        {
          "name": "list_countries",
          "description": "List all countries supported for IBAN generation, with code, name and IBAN length.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e2e629a7dd6ba889eef9c60c83f2982a28d3deedc895f0f5e3f77aa0b69c45ee"
        },
        {
          "name": "validate_iban",
          "description": "Validate an IBAN: MOD-97 checksum, expected length and country support.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "iban": {
                "description": "The IBAN to validate (spaces are ignored).",
                "type": "string"
              }
            },
            "required": ["iban"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13241ec4528d94118a8ad9a034400598b0e8c72c2dee21a7d2f6a74ff0cbd194"
        }
      ],
      "digest": "sha256:5e93d05ba57faedd52079934b878fb8abd92a6a76be9cc56b9b4988f4fba5258"
    }
  }
