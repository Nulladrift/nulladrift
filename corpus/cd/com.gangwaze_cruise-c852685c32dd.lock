        {
          "name": "getSailingExcursions",
          "title": "Excursions for a sailing",
          "description": "Shore excursions for every port of one sailing in one call, in itinerary order: hours ashore at each port, up to three picks that fit the time ashore (with an hour to spare before all aboard) and each port's total. Pass a sailing id from searchCruises, or ship plus sail date. activity and minPrice/maxPrice narrow every port. Use this instead of calling getPortExcursions once per port.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "activity": {
                "description": "A kind of activity, e.g. \"scuba\", \"ATV tours\", \"snorkeling\"; omit for everything",
                "maxLength": 80,
                "type": "string"
              },
              "date": {
                "description": "Sail (departure) date, YYYY-MM-DD; with ship, when there is no sailing id",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "maxPrice": {
                "description": "Highest \"from\" price per person in US dollars, e.g. 145 for \"under $145\"; omit for no limit",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "minPrice": {
                "description": "Lowest \"from\" price per person in US dollars, e.g. 100 for \"over $100\"; omit for no limit",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "sailingId": {
                "description": "A sailing id from searchCruises results, e.g. \"carnival-breeze:2026-09-21:5\"",
                "maxLength": 120,
                "type": "string"
              },
              "ship": {
                "description": "Ship name, e.g. \"Allure of the Seas\"; with date, when there is no sailing id",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
