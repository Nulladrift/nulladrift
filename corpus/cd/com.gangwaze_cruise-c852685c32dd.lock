        {
          "name": "getCruiseDirector",
          "title": "Cruise director",
          "description": "Who is the cruise director on a Carnival or Royal Caribbean ship today, on a date or on one sailing, with who is next; or which ship a named director is on and where next. With a sailing (sailingId, or ship plus sail date) it also links that sailing's roll call page, where cruisers booked on it meet. From Gangwaze's own schedule, which can change.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "A date or sail date, YYYY-MM-DD; omit for today",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "director": {
                "description": "Cruise director name, e.g. \"Cory Rogers\"; when no ship is asked about",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "sailingId": {
                "description": "A sailing id from searchCruises results, e.g. \"carnival-breeze:2026-09-21:5\"",
                "maxLength": 120,
                "type": "string"
              },
              "ship": {
                "description": "Ship name, e.g. \"Carnival Mardi Gras\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
