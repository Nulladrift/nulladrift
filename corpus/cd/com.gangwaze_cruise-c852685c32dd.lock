        {
          "name": "getShipProfile",
          "title": "Ship profile",
          "description": "One ship: year built and refurbished, size, guests and crew, cabin counts, rating and attribute scores, family suitability, CDC inspection score, venues and editorial. For whether a ship has a venue and which deck it is on, use getDeckPlan; for where it is right now, getShipPosition; for its cruise director, getCruiseDirector.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
