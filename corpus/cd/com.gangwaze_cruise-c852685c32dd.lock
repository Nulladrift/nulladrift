        {
          "name": "getPortExcursions",
          "title": "Shore excursions",
          "description": "Bookable shore excursions and resort day passes in a cruise port, with price, duration, rating and a link. Pass activity (e.g. \"scuba\", \"ATV tours\") to narrow to that kind of excursion, with its total, minPrice/maxPrice to narrow by price, and provider (e.g. \"Shore Excursions Group\", \"Viator\") to narrow to the company that sells them. To narrow an earlier answer, call again with the same port and activity plus the price or provider. For every port of one sailing, use getSailingExcursions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "activity": {
                "description": "A kind of activity, e.g. \"scuba\", \"ATV tours\", \"snorkeling\"; omit for everything",
                "maxLength": 80,
                "type": "string"
              },
              "maxPrice": {
                "description": "Highest \"from\" price per person in US dollars, e.g. 145 for \"under $145\"; omit for no limit",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "minPrice": {
                "description": "Lowest \"from\" price per person in US dollars, e.g. 100 for \"over $100\"; omit for no limit",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "port": {
                "description": "Port name or slug, e.g. \"Cozumel\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "provider": {
                "description": "Who sells the excursions: \"Viator\", \"Shore Excursions Group\", \"Resort For A Day\" or \"Project Expedition\"; omit for every provider",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["port"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
