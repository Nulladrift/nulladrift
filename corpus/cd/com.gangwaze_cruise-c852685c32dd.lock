        {
          "name": "getCabinDetail",
          "title": "Cabin detail",
          "description": "One specific cabin by ship and room number: deck, side and position, category with size and how many it sleeps, connecting cabin, known issues (obstructed view, noise, long walk) and what cruisers who stayed there said. \"No issues recorded\" is not a guarantee of none.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cabin": {
                "description": "Cabin number, e.g. \"9318\" or \"D126\"",
                "maxLength": 16,
                "minLength": 1,
                "pattern": "\\d",
                "type": "string"
              },
              "ship": {
                "description": "Ship name, e.g. \"Allure of the Seas\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["cabin", "ship"],
            "type": "object"
          },
          "annotations": {
