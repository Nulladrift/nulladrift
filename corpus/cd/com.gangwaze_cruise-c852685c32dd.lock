        {
          "name": "searchCruises",
          "title": "Search cruises",
          "description": "Search upcoming cruise sailings by destination, region, dates, length (nights \"lo:hi\"), cruise line, ship, departure port, ports of call, cabin type, budget, family fit and more. Pass the full filter set; omitted fields are unfiltered. Returns the match count, cheapest fare, top lines, the 10 soonest-departing sailings (results are always soonest first; each has an id for compareSailings/getPriceHistory) and a link to the full results on gangwaze.com.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cabin": {
                "default": [],
                "description": "Cabin-type keys, lowercase, from exactly: \"inside\", \"oceanview\", \"balcony\", \"suite\". Multiple values are OR-ed. Do not use any other spelling or capitalization (e.g. not \"Suite\") — unrecognised values are rejected.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "cruiselines": {
                "default": [],
                "description": "Cruise line names, exact catalogue values (e.g. \"Carnival Cruise Line\", not \"Carnival\"). OR-ed together. The tool resolves each against the real catalogue and returns suggestions for any name it does not recognise.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "departureDays": {
                "default": [],
                "description": "Weekday the cruise departs, from exactly: \"mon\", \"tue\", \"wed\", \"thu\", \"fri\", \"sat\", \"sun\". OR-ed together. \"Weekend getaway\" / \"leave on the weekend\" -> [\"fri\",\"sat\"], and set `nights` to \":4\" unless the user gave a length. A named day (\"sails on a Saturday\") -> that day. A short cruise on its own never implies a weekend. Empty array means no constraint.",
                "items": {
                  "enum": ["mon", "tue", "wed", "thu", "fri", "sat", "sun"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "departurePorts": {
                "default": [],
                "description": "Departure/embarkation port names, exact catalogue values. OR-ed together. The tool resolves each against the real catalogue and returns suggestions for any name it does not recognise.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "destination": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A single top-level region name, exact catalogue value (e.g. \"Caribbean\", \"Europe\", \"Alaska\") — NOT a sub-region like \"Mediterranean\" or \"Eastern Caribbean\" (those go in `regions`). Must be a real catalogue value; the tool returns suggestions if it is not recognised. null means no constraint."
              },
              "endDate": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Latest sail date, as \"YYYY-MM-DD\" (e.g. \"2027-06-30\"). null means no upper bound."
              },
              "family": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Family-suitability of the SHIP as a colon-delimited INCLUSIVE range \"lo:hi\" over a 0-100 score. \"Family\", \"with the kids\", \"teens\", \"multi-generational\" -> \"60:\"; \"adults only\", \"couples retreat\", \"no kids\", \"quiet ship\" -> \":40\". Never quote the score to the user. Do NOT pass a bare number or a hyphenated range. null means no constraint."
              },
              "lineType": {
                "default": [],
                "description": "Cruise-line tier, from exactly: \"mainstream\", \"premium\", \"luxury\", \"river\". OR-ed together. Use for \"luxury cruise\", \"something upscale\", \"the big mainstream lines\". A NAMED line (\"Seabourn\") goes in `cruiselines`, never here — this field is for when no line is named. Empty array means no constraint.",
                "items": {
                  "enum": ["mainstream", "premium", "luxury", "river"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "nights": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Cruise length as a colon-delimited INCLUSIVE range \"lo:hi\", e.g. \"7:7\" for exactly 7 nights, \"5:9\" for 5 to 9 nights. Open-ended ranges are allowed: \"5:\" (5+ nights) or \":9\" (up to 9 nights). Do NOT pass a bare number like \"7\" and do NOT use a hyphen like \"5-9\" — both are invalid and the filter will be rejected. null means no constraint."
              },
              "ports": {
                "default": [],
                "description": "Ports of call, exact catalogue names. OR-ed together. The tool resolves each against the real catalogue and returns suggestions for any name it does not recognise.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "price": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "INSIDE-CABIN TOTAL price for the whole cruise, per person, in whole US dollars, as a colon-delimited INCLUSIVE range \"lo:hi\", e.g. \"100:900\" for $100 to $900. Open-ended ranges are allowed: \"500:\" or \":1500\". Use this for a total budget (\"under $1,500\"); for a budget stated per day / per night use `pricePerNight` instead. Always the inside-cabin price, never other cabin types. Do NOT pass a bare number or a hyphenated range. null means no constraint."
              },
              "pricePerNight": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "INSIDE-CABIN price PER NIGHT, per person, in whole US dollars, as a colon-delimited INCLUSIVE range \"lo:hi\" — e.g. \":100\" for \"under $100 a day\", \"80:120\" for $80 to $120 a night. Use this whenever the user states a budget per day, per night or per person per day; use `price` for a total. Divide nothing yourself — pass the per-night figure the user said. Do NOT pass a bare number or a hyphenated range. null means no constraint."
              },
              "regions": {
                "default": [],
                "description": "Sub-region names, exact catalogue values (e.g. \"Eastern Caribbean\", \"Western Mediterranean\"). OR-ed together. The tool resolves each against the real catalogue and returns suggestions for any name it does not recognise — it is not case-sensitive but must be a real region.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "safety": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Safety score as a colon-delimited INCLUSIVE range \"lo:hi\" over a 0-100 scale, e.g. \"80:100\" for safety score 80 and up. Open-ended ranges are allowed: \"80:\" or \":50\". Do NOT pass a bare number or a hyphenated range. null means no constraint."
              },
              "shipSize": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Ship size as PASSENGER CAPACITY (number of guests), as a colon-delimited INCLUSIVE range \"lo:hi\". Map words to these bands: \"small ship\" / \"intimate\" / \"boutique\" / \"not a floating city\" -> \":1500\"; \"mid-size\" -> \"1500:3000\"; \"big ship\" / \"mega-ship\" / \"lots to do on board\" -> \"3000:\". A stated number works too: \"under 1,000 passengers\" -> \":1000\". The fleet runs 100 to 7,600 guests. Open-ended ranges are allowed. Do NOT pass a bare number or a hyphenated range. null means no constraint."
              },
              "shipYear": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Year the ship was BUILT, as a colon-delimited INCLUSIVE range \"lo:hi\", e.g. \"2015:\" for ships built in 2015 or later — this is how to answer \"a newer ship\". The catalogue spans 1998-2024. Open-ended ranges are allowed: \"2015:\" or \":2005\". Note this is the build year, NOT the sail year — for when the cruise departs use startDate/endDate. Do NOT pass a bare number or a hyphenated range. null means no constraint."
              },
              "ships": {
                "default": [],
                "description": "Ship names, exact catalogue values. OR-ed together. The tool resolves each against the real catalogue and returns suggestions for any name it does not recognise.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "startDate": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Earliest sail date, as \"YYYY-MM-DD\" (e.g. \"2027-03-01\"). null means no lower bound."
              },
              "tripShape": {
                "anyOf": [
                  {
                    "enum": ["round_trip", "one_way"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Whether the cruise returns to where it started. \"round_trip\" for sailings that end at their departure port — use this when someone does not want to book two flights. \"one_way\" for sailings that end somewhere else, which includes repositioning cruises. Exactly those two strings; null means no constraint. About one in five sailings is one-way."
              },
              "vibes": {
                "default": [],
                "description": "Itinerary character, from exactly: \"relaxing\", \"adventure\", \"nature\", \"shopping\". OR-ed together. Map only what the user says (\"a relaxing beach week\" -> [\"relaxing\"]; \"scenery and wildlife\" -> [\"nature\"]); never infer a vibe from a destination. Empty array means no constraint.",
                "items": {
                  "enum": ["relaxing", "adventure", "nature", "shopping"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search cruises"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
