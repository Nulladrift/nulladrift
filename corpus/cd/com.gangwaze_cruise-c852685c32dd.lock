        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Gangwaze.com provides data on upcoming cruise sailings (current prices and six-month price history), cabins (location, known issues, cruiser reviews), ships, their deck plans (which deck a venue is on) where they are now (from their schedules) and their cruise directors, cruise lines, ports, shore excursions (for one port or every port of a sailing), dress codes, drink packages and port climate. The tools are relevant when someone is searching for, comparing or planning a cruise. searchCruises returns sailing ids that compareSailings and getPriceHistory accept.",
      "tools": [
        {
          "name": "compareSailings",
          "title": "Compare sailings",
          "description": "Compare 2–3 specific sailings side by side: dates, ports, price and price per night, price verdict against the six-month average, ship age and size, family suitability, rating with review count and CDC inspection score. Takes sailing ids from searchCruises.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cabin": {
                "description": "Cabin types to price: inside, oceanview, balcony, suite. Omit for all.",
                "items": {
                  "enum": ["inside", "oceanview", "balcony", "suite"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "ids": {
                "items": {
                  "description": "A sailing id from searchCruises results, e.g. \"carnival-breeze:2026-09-21:5\"",
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare sailings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
