        {
          "name": "getShipCabins",
          "title": "A ship's cabins",
          "description": "A ship's cabins grouped by type (inside, ocean view, balcony, suite): categories, cabin counts, size range, how many they sleep, and the line's guarantee categories.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ship": {
                "description": "Ship name, e.g. \"Voyager of the Seas\"",
                "maxLength": 120,
