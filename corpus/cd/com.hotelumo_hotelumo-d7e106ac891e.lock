        {
          "name": "get_room_type",
          "title": "Get room type details",
          "description": "Use this when someone asks about one room type, such as its name or how many guests it sleeps. Returns the room type's name, hotel and maximum guests, or not-found. Not for its prices or free dates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "roomTypeId": {
                "description": "Room type id: 24 lowercase hexadecimal characters",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              }
            },
            "required": ["roomTypeId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "roomType": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "hotelId": {
                        "anyOf": [
                          {
                            "pattern": "^[0-9a-f]{24}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "id": {
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      "lastEditTime": {
                        "$ref": "#/properties/roomType/anyOf/0/properties/name"
                      },
                      "maxGuests": {
                        "anyOf": [
                          {
                            "maximum": 100,
                            "minimum": 0,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "name": {
                        "anyOf": [
                          {
                            "maxLength": 200,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
