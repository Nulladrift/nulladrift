                "format": "date-time",
                "maxLength": 40,
                "type": "string"
              },
              "inventoryItemId": {
                "description": "Id of the stock item, from list_inventory_items.",
                "maxLength": 24,
                "minLength": 24,
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "quantity": {
                "description": "The quantity now in stock, in the item unit. It replaces the stored quantity; work out the total first when the user gives a change.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["expectedLastEditTime", "inventoryItemId", "quantity"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "item": {
                "additionalProperties": false,
                "properties": {
                  "hotelId": {
                    "anyOf": [
                      {
                        "maxLength": 24,
                        "minLength": 24,
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "id": {
                    "anyOf": [
                      {
                        "maxLength": 24,
                        "minLength": 24,
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "lastEditTime": {
                    "anyOf": [
                      {
                        "maxLength": 40,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "lowStock": {
                    "type": "boolean"
                  },
                  "minimumQuantity": {
                    "anyOf": [
                      {
                        "maximum": 1000000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "quantity": {
                    "anyOf": [
