      "instructions": "# Hotel operations with Hotelumo\n\nThis skill drives the hosted Hotelumo MCP connector. The user must connect\nHotelumo and authorize an account that can access the intended organization.\nIf authorization fails, ask the user to connect or reauthorize; do not guess\nidentifiers or retry with another tenant.\n\n## Hard privacy and commerce boundary\n\nThis connector intentionally does not expose:\n\n- guest identities, contact details, addresses, government-document details,\n  notes, documents or private profile data;\n- individual reservation records, exact individual stays, room allocations,\n  occupant identifiers or access codes;\n- payments, cards, processor data, transaction errors, folios or invoices;\n- staff records, organization internals, channel/integration credentials,\n  provider secrets or arbitrary metadata; or\n- tools that book, cancel, check in, check out, assign rooms, change room\n  availability or rates, take payments, message guests, or change any Hotelumo\n  record other than a stock count.\n\nNever ask the user to paste excluded data into chat, infer a person's stay from\naggregate counts, or imply that a missing write can be approximated with\nanother tool. Availability is an unassigned offer, not evidence that a person\nhas or will make a reservation.\n\n## Available tools\n\n| Tool                         | Use it when someone asks…                                                      |\n| ---------------------------- | ------------------------------------------------------------------------------ |\n| `list_hotels`                | which hotels they manage; also resolves the hotel ID every other tool needs    |\n| `get_hotel`                  | about one hotel's default check-in/check-out times, currency or timezone       |\n| `get_hotel_availability`     | whether rooms are free for a stay (1–30 nights) and what it would cost         |\n| `get_hotel_schedule_summary` | how busy each day is: arrivals, departures, in-house stays (at most 31 days)   |\n| `list_room_types`            | what kinds of rooms the hotel has and how many guests each sleeps              |\n| `get_room_type`              | about one room type's name and maximum guests                                  |\n| `list_rooms`                 | which rooms are clean, dirty, inspected, out of order or out of service        |\n| `list_rate_plans`            | which rate plans are sold, with meal plan, sell mode and base price            |\n| `list_daily_rates`           | what a rate costs on given nights, and its minimum stay or stop-sell days      |\n| `list_extras`                | which extras are sold (breakfast, parking, spa…) and their prices              |\n| `list_inventory_items`       | how many towels, sheets, toiletries or other supplies are left, or what is low |\n| `show_hotel_overview`        | for a one-card overview of one hotel's operations                              |\n| `set_inventory_quantity`     | to correct or update a stock count, after counting or a delivery               |\n\nEvery tool but `set_inventory_quantity` is read-only and requires the Hotelumo\nread scope; `set_inventory_quantity` also requires the write scope. There is no\nconnector operation for booking, reservation lookup, guest lookup, payment,\nrate updates, room assignment, check-in, check-out, messaging or deletion.\n\nIf `set_inventory_quantity` is missing, the connection was authorized to read\nonly (every connection made before November 2026 was). Ask the user to\ndisconnect Hotelumo and connect it again, allowing Hotelumo to create and\nupdate data.\n\n## Identifiers, pagination and bounds\n\nNever guess a hotel ID. Start with `list_hotels`, choose the hotel that matches\nthe user's request, and reuse its returned 24-character lowercase hexadecimal\nID. If several hotels match, ask which one they mean. Resolve room-type IDs\nfrom `list_room_types` before using `get_room_type`.\n\nListing tools use bounded limits and offsets. Keep the same hotel and filters\nwhen requesting the next page. A result marked with `hasMore`, or a count shown\nwith a plus sign, is a lower bound from a bounded read; do not report it as a\ncomplete total. Do not interpret identifiers as meaningful business codes.\n\n## Hotel overview workflow\n\nWhen the user wants a broad operational snapshot:\n\n1. Call `list_hotels`.\n2. Resolve the intended hotel without guessing.\n3. Call `show_hotel_overview` with that hotel ID.\n4. Interpret only safe property metadata, aggregate next-seven-day reservation\n   status counts, room/housekeeping status counts and bounded catalog counts.\n\nThe overview's reservation count is a bounded overlap sample, not a list of\nstays and not necessarily a complete total.\n\n## Schedule workflow\n\nFor workload over a period:\n\n1. Resolve the hotel with `list_hotels`.\n2. Call `get_hotel_schedule_summary` with ISO calendar dates. Omit both dates\n   for the default seven-day range. Never request more than 31 days.\n3. Report only aggregate status, arrival, departure and in-house counts.\n   Arrivals, departures and in-house counts cover confirmed, checked-in and\n   checked-out stays; the status totals include every status, cancellations\n   and no-shows too.\n4. Treat checkout as exclusive for in-house occupancy. A reservation overlaps\n   the requested range only when checkout is after the range start and check-in\n   is on or before the range end.\n\nThe connector fetches a bounded reservation sample. When the result indicates\nmore rows, every aggregate is a lower bound. Never try to reconstruct an\nindividual stay or identify a guest from these counts.\n\n## Availability and pricing\n\nUse `get_hotel_availability` only for unassigned offers. Provide valid ISO\ncheck-in/check-out dates for 1–30 nights and occupant counts in the supported\nrange. The tool returns safe room-type/rate-plan labels, availability, nightly\nrates and totals; it does not make or hold a booking.\n\nPrices from availability, rate plans, daily rates and extras are integer minor\ncurrency units. For a two-decimal currency, 12000 means 120.00. Keep the\nreturned currency attached and do not assume every currency has two decimals.\nDo not sum values across different currencies.\n\n## Rooms, rates and extras\n\nUse `list_rooms` for operational room and housekeeping states, not for guest\nor allocation lookup. A room status of `AVAILABLE` means in service, not\nunoccupied; use `get_hotel_availability` for free rooms on given dates.\nInternal room IDs are intentionally absent.\n\nUse `list_rate_plans`, `list_daily_rates` and `list_extras` for safe catalog\nreview. `list_daily_rates` returns only the dates with a stored daily rate; any\nother date sells at the plan's base price from `list_rate_plans`. Follow\npagination only as far as the user's question requires. Catalog data does not\nprove that a guest bought an offer or extra.\n\n## Stock\n\n`list_inventory_items` reads one hotel's supplies (towels, linen, toiletries,\nminibar and cleaning stock): name, unit, quantity, minimum quantity, a\nlow-stock flag and each item's `lastEditTime`. It returns up to 100 items, 50\nby default, and `hasMore` when there are more; `lowStockOnly` keeps only items\nat or below their minimum, and `search` matches item names. It never returns an\nitem's notes. This is a hotel's own stock of supplies, not the rooms it can\nsell: for free rooms on given dates use `get_hotel_availability`.\n\nTo correct a count:\n\n1. Read the item with `list_inventory_items` and keep its id and\n   `lastEditTime`.\n2. Work out the new total. `set_inventory_quantity` replaces the stored\n   quantity with the number given; it does not add to it. When the user reports\n   a change (\"we used 6 towels\", \"12 arrived\"), compute the total from the\n   quantity just read.\n3. Confirm the item, the hotel and the new total with the user, then call\n   `set_inventory_quantity` with `expectedLastEditTime` set to the\n   `lastEditTime` read.\n4. A `conflict` means the item changed since it was read: read it again, show\n   the user the stored quantity, and try again once they confirm. After an\n   unknown delivery, read the item before retrying: a saved count shows in its\n   new `lastEditTime`.\n\nThe write runs as the signed-in member, with that member's Hotelumo role: a\nrole without stock access is refused. It cannot add, rename or delete a stock\nitem; direct the user to Inventory in the Hotelumo app for that.\n\n## Unsupported requests\n\nFor guest, individual reservation/allocation, payment, access-code,\ncredential, staff or private-integration requests, state that the public\nconnector cannot access that data. For booking, cancellation, room assignment,\ncheck-in/out, rate changes, payment or any write other than a stock count,\nstate that the connector cannot make that change and direct the user to\nHotelumo itself.\n",
      "tools": [
        {
          "name": "get_hotel",
          "title": "Get hotel details",
          "description": "Use this when someone asks about one hotel's setup, such as its default check-in and check-out times, currency, country or timezone. Returns the hotel's name, currency, language, timezone, country code and default check-in and check-out times, or not-found. Not for room availability or prices.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hotelId": {
                "description": "Hotel id: 24 lowercase hexadecimal characters",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              }
            },
            "required": ["hotelId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hotel": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "checkInDefaultTime": {
                        "$ref": "#/properties/hotel/anyOf/0/properties/name"
                      },
                      "checkOutDefaultTime": {
                        "$ref": "#/properties/hotel/anyOf/0/properties/name"
                      },
                      "countryCode": {
                        "$ref": "#/properties/hotel/anyOf/0/properties/name"
                      },
                      "currency": {
                        "$ref": "#/properties/hotel/anyOf/0/properties/name"
                      },
                      "id": {
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      "lastEditTime": {
                        "$ref": "#/properties/hotel/anyOf/0/properties/name"
                      },
                      "locale": {
                        "$ref": "#/properties/hotel/anyOf/0/properties/name"
                      },
                      "name": {
                        "anyOf": [
                          {
                            "maxLength": 200,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "timezone": {
                        "$ref": "#/properties/hotel/anyOf/0/properties/name"
                      }
                    },
                    "required": ["checkInDefaultTime", "checkOutDefaultTime", "countryCode", "currency", "id", "lastEditTime", "locale", "name", "timezone"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Operational hotel metadata; null when not found. Contact details, addresses, integrations, credentials, payment configuration, reminders and guest data are never returned."
              },
              "status": {
                "enum": ["found", "not-found"],
                "type": "string"
              }
            },
            "required": ["hotel", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get hotel details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["hotelumo:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:b5f0aa4d600cc277cac57ff8680bc7540acd588b563934d31f1690647c725a45"
        },
        {
          "name": "get_hotel_availability",
          "title": "Check room availability and prices",
          "description": "Use this when someone asks if rooms are free for certain dates or what a stay would cost. Returns the room types and rate plans with a free room every night for the party, with rooms left and nightly and total prices in minor currency units. Stays of 1–30 nights, check-in within 365 days. Not for making a booking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "Adults staying, from 1 to 20; defaults to 2",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "checkInDate": {
                "description": "Arrival date as YYYY-MM-DD, from today to 365 days ahead in the hotel's timezone",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOutDate": {
                "description": "Departure date as YYYY-MM-DD, 1 to 30 nights after checkInDate",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "children": {
                "description": "Children staying, from 0 to 20; defaults to 0",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "hotelId": {
                "description": "Hotel id: 24 lowercase hexadecimal characters",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "infants": {
                "description": "Infants staying, from 0 to 20; defaults to 0",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["checkInDate", "checkOutDate", "hotelId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "offers": {
                "description": "One row per bookable room type and rate plan with a free room every night. Amounts are integer minor currency units (12000 is 120.00 in a two-decimal currency). Guest records, reservations, room assignments, access data, notes, payments, channel references, photos, free-text descriptions and credentials are excluded.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "availableRooms": {
                      "anyOf": [
                        {
                          "maximum": 100000,
                          "minimum": 0,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "currency": {
                      "$ref": "#/properties/offers/items/properties/roomTypeName"
                    },
                    "mealPlan": {
                      "$ref": "#/properties/offers/items/properties/roomTypeName"
                    },
                    "nightlyRate": {
                      "anyOf": [
                        {
                          "maximum": 1000000000000,
                          "minimum": 0,
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "nightlyRates": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "date": {
                            "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                            "type": "string"
                          },
                          "price": {
                            "$ref": "#/properties/offers/items/properties/nightlyRate"
                          }
                        },
                        "required": ["date", "price"],
                        "type": "object"
                      },
                      "maxItems": 30,
                      "type": "array"
                    },
                    "ratePlanId": {
                      "$ref": "#/properties/offers/items/properties/roomTypeId"
                    },
                    "ratePlanTitle": {
                      "$ref": "#/properties/offers/items/properties/roomTypeName"
                    },
                    "roomTypeId": {
                      "anyOf": [
                        {
                          "pattern": "^[0-9a-f]{24}$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "roomTypeName": {
                      "anyOf": [
                        {
                          "maxLength": 200,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "sellMode": {
                      "$ref": "#/properties/offers/items/properties/roomTypeName"
                    },
                    "totalPrice": {
                      "$ref": "#/properties/offers/items/properties/nightlyRate"
                    }
                  },
                  "required": ["availableRooms", "currency", "mealPlan", "nightlyRate", "nightlyRates", "ratePlanId", "ratePlanTitle", "roomTypeId", "roomTypeName", "sellMode", "totalPrice"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "offersAreTruncated": {
                "description": "True when more than 100 offers matched the search",
                "type": "boolean"
              },
              "search": {
                "additionalProperties": false,
                "properties": {
                  "adults": {
                    "maximum": 20,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "checkInDate": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "checkOutDate": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "children": {
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "infants": {
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "nights": {
                    "maximum": 30,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["adults", "checkInDate", "checkOutDate", "children", "infants", "nights"],
                "type": "object"
              }
            },
            "required": ["offers", "offersAreTruncated", "search"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check room availability and prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["hotelumo:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:8d571578236e5ce9773b4cc79e54b9f47bfd0cf059216598a6a28dbe226ebc0c"
        },
        {
          "name": "get_hotel_schedule_summary",
          "title": "Count arrivals, departures and stays",
          "description": "Use this when someone asks how busy the hotel is, or how many arrivals, departures or in-house stays fall on each day. Returns daily counts of confirmed, checked-in and checked-out stays plus reservation totals by status, for 7 days from today by default and at most 31 days; counting stops at 500. Not for looking up a guest or reservation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dateFrom": {
                "description": "First day as YYYY-MM-DD (inclusive); defaults to today in UTC",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "dateTo": {
                "description": "Last day as YYYY-MM-DD (inclusive), at most 31 days in total; defaults to six days after dateFrom",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "hotelId": {
                "description": "Hotel id: 24 lowercase hexadecimal characters",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              }
            },
            "required": ["hotelId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "One row per day. arrivals, departures and inHouseReservations count confirmed, checked-in and checked-out stays; a stay is not in-house on its checkout day. Reservation or allocation identifiers, individual stay records, guest data, room assignments, notes, documents, payments, access data, channel references and credentials are never returned.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "arrivals": {
                      "maximum": 500,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "day": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "departures": {
                      "maximum": 500,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "inHouseReservations": {
                      "maximum": 500,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["arrivals", "day", "departures", "inHouseReservations"],
                  "type": "object"
                },
                "maxItems": 31,
                "type": "array"
              },
              "hotel": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "pattern": "^[0-9a-f]{24}$",
                    "type": "string"
                  },
                  "name": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "timezone": {
                    "$ref": "#/properties/hotel/properties/name"
                  }
                },
                "required": ["id", "name", "timezone"],
                "type": "object"
              },
              "range": {
                "additionalProperties": false,
                "properties": {
                  "dateFrom": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "dateTo": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["dateFrom", "dateTo"],
                "type": "object"
              },
              "reservationCount": {
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "reservationCountIsLowerBound": {
                "description": "True when more than 500 reservations overlap the range",
                "type": "boolean"
              },
              "statusCounts": {
                "additionalProperties": {
                  "maximum": 500,
                  "minimum": 0,
                  "type": "integer"
                },
                "description": "Reservations overlapping the range by status, inquiries, requests, no-shows and cancellations included",
                "propertyNames": {
                  "enum": ["INQUIRY", "REQUESTED", "CONFIRMED", "CHECKED_IN", "CHECKED_OUT", "NO_SHOW", "CANCELED", "UNSPECIFIED"]
                },
                "type": "object"
              }
            },
            "required": ["days", "hotel", "range", "reservationCount", "reservationCountIsLowerBound", "statusCounts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Count arrivals, departures and stays"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://hotelumo/schedule-summary-v1.html",
            "openai/toolInvocation/invoked": "Hotelumo schedule summary ready.",
            "openai/toolInvocation/invoking": "Counting Hotelumo stays…",
            "securitySchemes": [
              {
                "scopes": ["hotelumo:read"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://hotelumo/schedule-summary-v1.html"
            },
            "ui/resourceUri": "ui://hotelumo/schedule-summary-v1.html"
          },
