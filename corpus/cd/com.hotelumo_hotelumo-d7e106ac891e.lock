        {
          "name": "show_hotel_overview",
          "title": "Show hotel operations overview",
          "description": "Use this when someone wants a quick overview or dashboard of one hotel's operations. Returns an overview card with the hotel's details, reservation status counts for the next 7 days, and room, room-type, room-status and housekeeping counts from bounded samples (no guest, stay or payment data). Not for a single reservation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "hotelId": {
                "description": "Hotel id: 24 lowercase hexadecimal characters",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              }
            },
            "required": ["hotelId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "hotel": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "currency": {
                        "anyOf": [
                          {
                            "maxLength": 200,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "id": {
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      "locale": {
                        "anyOf": [
                          {
                            "maxLength": 200,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "name": {
                        "anyOf": [
                          {
                            "maxLength": 200,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "timezone": {
                        "anyOf": [
                          {
                            "maxLength": 200,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "required": ["currency", "id", "locale", "name", "timezone"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Null when not found. Guest identities, contact details, reservation or allocation identifiers, individual stay records, notes, documents, occupant ids, payments, access data, integration configuration, credentials and arbitrary metadata are excluded."
              },
              "housekeepingStatusCounts": {
                "additionalProperties": {
                  "maximum": 100,
                  "minimum": 0,
                  "type": "integer"
                },
                "propertyNames": {
                  "enum": ["CLEAN", "DIRTY", "INSPECTED", "UNSPECIFIED"],
                  "type": "string"
                },
                "type": "object"
              },
              "reservationStatusCounts": {
                "additionalProperties": {
                  "maximum": 50,
                  "minimum": 0,
                  "type": "integer"
                },
                "propertyNames": {
                  "enum": ["INQUIRY", "REQUESTED", "CONFIRMED", "CHECKED_IN", "CHECKED_OUT", "NO_SHOW", "CANCELED", "UNSPECIFIED"],
                  "type": "string"
                },
                "type": "object"
              },
              "reservations": {
                "additionalProperties": false,
                "description": "Reservations overlapping the next seven UTC days, any status, sampled up to 50; hasMore marks a lower bound",
                "properties": {
                  "count": {
                    "maximum": 50,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "hasMore": {
                    "type": "boolean"
                  }
                },
                "required": ["count", "hasMore"],
                "type": "object"
              },
              "roomStatusCounts": {
                "additionalProperties": {
                  "maximum": 100,
                  "minimum": 0,
                  "type": "integer"
                },
                "propertyNames": {
                  "enum": ["AVAILABLE", "OUT_OF_ORDER", "OUT_OF_SERVICE", "UNSPECIFIED"],
                  "type": "string"
                },
                "type": "object"
              },
              "roomTypes": {
                "additionalProperties": false,
                "description": "Room types, sampled up to 50; hasMore marks a lower bound",
                "properties": {
                  "count": {
                    "maximum": 50,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "hasMore": {
                    "type": "boolean"
                  }
                },
                "required": ["count", "hasMore"],
                "type": "object"
              },
              "rooms": {
                "additionalProperties": false,
                "description": "Physical rooms, sampled up to 100; hasMore marks a lower bound",
                "properties": {
                  "count": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "hasMore": {
                    "type": "boolean"
                  }
                },
                "required": ["count", "hasMore"],
                "type": "object"
              },
              "scheduleRange": {
                "additionalProperties": false,
                "properties": {
                  "dateFrom": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "dateTo": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["dateFrom", "dateTo"],
                "type": "object"
              }
            },
            "required": ["hotel", "housekeepingStatusCounts", "reservationStatusCounts", "reservations", "roomStatusCounts", "roomTypes", "rooms", "scheduleRange"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show hotel operations overview"
