        {
          "name": "send_feedback",
          "title": "Report a problem",
          "description": "Send the reader's report to readqurantoday.com: a problem with the site's text, a translation, the tafsir or a recitation, or a suggestion. Only when the reader asks to report or suggest something; send what they said, in their words, and the ayah or reciter it is about. Never on your own initiative.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ayah": {
                "minimum": 1,
                "type": "integer"
              },
              "email": {
                "description": "Only if the reader gives it, for a reply",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "kind": {
                "description": "\"bug\" for something wrong",
                "enum": ["bug", "suggestion", "feature", "other"],
                "type": "string"
              },
              "message": {
                "description": "The report, in the reader's words",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "reciter": {
                "description": "Reciter id, for a problem with a recitation",
                "maxLength": 80,
                "type": "string"
              },
              "surah": {
                "maximum": 114,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["kind", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Report a problem"
          },
          "behavior": {
            "destructive": false,
