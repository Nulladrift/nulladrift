        {
          "name": "search",
          "title": "Search the Quran",
          "description": "Ayahs containing the words given: in the Arabic (diacritics optional) or, with \"translation\", in that translation; words with no Arabic letter search the English (Hilali & Khan) unless a translation is named. Up to 50 results, each with its reference and link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "translation": {
                "description": "Search this translation instead of the Arabic, e.g. \"hilali\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
