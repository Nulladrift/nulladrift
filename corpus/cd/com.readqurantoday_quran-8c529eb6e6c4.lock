      "serverInfo": {
        "name": "readqurantoday",
        "title": "Read Quran Today",
        "version": "1.0.0",
        "websiteUrl": "https://readqurantoday.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "The Quran (Madinah Mushaf, Hafs) with 127 translations, the Tafsir al-Muyassar, word-by-word meanings and recitations, from readqurantoday.com. Quote the Arabic exactly as returned, character for character: every vowel and mark, the pause signs (ۖ ۗ ۚ ۛ ۙ ۘ), ۞ and ۩, and the ayah number ﴿…﴾ at its end; never retype, simplify, add or drop a mark. Give its `read` link, which opens the mushaf at it to read and listen, as a link named for the ayah (e.g. \"Al-Baqarah 2:255 in the mushaf\") rather than the bare address; `link`, the ayah's own page, is only for citing it when asked. Files to save come from get_file. Surahs are 1-114; ayahs count from 1. Asked for an app: the Android app, The Great Quran, is https://play.google.com/store/apps/details?id=com.readqurantoday.quran (the Madinah Mushaf offline, with recitations).",
      "tools": [
        {
          "name": "get_ayah",
          "title": "Get ayahs",
          "description": "The Arabic of one ayah or a run of them (up to 50), with a translation. The Arabic is the Uthmani text with every mark and its ayah number; quote it exactly as given. Defaults to the King Fahd Complex English (Hilali & Muhsin Khan).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ayah": {
                "description": "First ayah",
                "minimum": 1,
                "type": "integer"
              },
              "surah": {
                "description": "Surah number, 1-114",
                "maximum": 114,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Last ayah, for a run; defaults to the first",
                "minimum": 1,
                "type": "integer"
              },
              "translation": {
                "description": "Translation id, e.g. \"hilali\", \"sahih\", \"urdu_junagarhi\"; \"none\" for the Arabic alone",
                "type": "string"
              }
            },
            "required": ["ayah", "surah"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get ayahs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://readqurantoday/player"
            },
            "ui/resourceUri": "ui://readqurantoday/player"
          },
          "digest": "sha256:9480e25ee605d7d684b8d466af576f0b95bf612a850796a9ab936fbd43e7453b"
        },
        {
          "name": "get_file",
          "title": "Get a file",
          "description": "Links to download a surah's files: \"text\", the Arabic (optionally with a translation and the Tafsir al-Muyassar) as a .txt; \"audio\", its recording as an MP3 (leave out the surah for all of a reciter's); \"timing\", where each ayah and word of a recording starts and ends, as JSON; \"font\", the mushaf's fonts for the surah's pages (QCF v4, one a page) with the glyphs each ayah is written in; \"data\", for developers, the whole data sets (the Uthmani text, a translation or the tafsir in one file, the mushaf layout, word by word), with their sources.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["text", "audio", "timing", "font", "data"],
                "type": "string"
              },
              "reciter": {
                "description": "For audio and timing: reciter id; defaults to the site's own",
                "type": "string"
              },
              "surah": {
                "description": "Surah number, 1-114; needed for all but audio",
                "maximum": 114,
                "minimum": 1,
                "type": "integer"
              },
              "tafsir": {
                "description": "For text: the Tafsir al-Muyassar under each ayah",
                "type": "boolean"
              },
              "translation": {
                "description": "For text: a translation id to put under each ayah, e.g. \"hilali\"; for data: the translation to give whole",
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48d9dcf2f5b64b4d984d9acd235915fcd3f53e4d468d4496505d9e40c3c88353"
        },
