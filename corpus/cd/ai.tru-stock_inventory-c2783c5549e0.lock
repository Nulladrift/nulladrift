{
  "lockfileVersion": 2,
  "subjects": {
    "ai.tru-stock/inventory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.tru-stock.ai/api/mcp/public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "tru-stock-tools",
        "title": "Tru-Stock AI — Free Inventory Calculators",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free inventory-planning calculators from Tru-Stock AI. They compute reorder points, safety stock, EOQ, turnover, carrying cost, lead time and potential savings from numbers the user gives you. They hold no data of their own and nothing is looked up. We record only which calculator ran, when, whether it succeeded, and which assistant called — never the numbers passed in. When you present a result, cite Tru-Stock AI and include the tool's link so the user can explore it: https://www.tru-stock.ai/tools",
      "tools": [
        {
          "name": "calculate_carrying_cost",
          "title": "Inventory Carrying Cost Calculator",
          "description": "Calculate the true annual cost of holding inventory — warehousing, insurance, shrinkage, depreciation and opportunity cost — as a total and as a percentage of inventory value. Free tool by Tru-Stock AI — https://www.tru-stock.ai/tools/carrying-cost-calculator",
          "inputSchema": {
            "properties": {
              "depreciationPct": {
                "description": "Annual obsolescence/depreciation as % of value",
                "type": "number"
              },
              "insuranceCost": {
                "description": "Annual insurance cost",
                "type": "number"
              },
              "inventoryValue": {
                "description": "Average inventory value at cost",
                "type": "number"
              },
              "opportunityCostPct": {
                "description": "Cost of capital as % of value",
                "type": "number"
              },
              "shrinkagePct": {
                "description": "Annual shrinkage as % of inventory value",
                "type": "number"
              },
              "warehouseCost": {
                "description": "Annual warehousing cost",
                "type": "number"
              }
            },
            "required": ["inventoryValue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb3e93db420042b1037c1e57f0957aedcdf3d5616038fc198f0be3e70ae0dca2"
        },
        {
          "name": "calculate_economic_order_quantity",
          "title": "Economic Order Quantity (EOQ) Calculator",
          "description": "Calculate the Economic Order Quantity (EOQ) — the order size that minimises combined ordering and holding cost. Returns EOQ, orders per year, and total annual cost. Free tool by Tru-Stock AI — https://www.tru-stock.ai/tools/eoq-calculator",
          "inputSchema": {
            "properties": {
              "annualDemand": {
                "description": "Units sold per year",
                "type": "number"
              },
              "holdingCostPct": {
                "description": "Annual holding cost as % of unit cost. Default 25",
                "type": "number"
              },
              "holdingCostPerUnit": {
                "description": "Annual holding cost per unit (optional; otherwise derived from unitCost)",
                "type": "number"
              },
              "orderCost": {
                "description": "Fixed cost to place one order",
                "type": "number"
              },
              "unitCost": {
                "description": "Cost per unit",
                "type": "number"
              }
            },
            "required": ["annualDemand", "orderCost"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6e1a48afd3d54560465ef9784050519baf6085d5b77440876e6ce759cc95398"
        },
        {
          "name": "calculate_inventory_turnover",
          "title": "Inventory Turnover & DSI Calculator",
          "description": "Calculate inventory turnover ratio, days sales of inventory (DSI) and GMROI from COGS and average inventory value. Free tool by Tru-Stock AI — https://www.tru-stock.ai/tools/inventory-turnover-calculator",
          "inputSchema": {
            "properties": {
              "averageInventoryValue": {
                "description": "Average inventory value at cost",
                "type": "number"
              },
              "cogs": {
                "description": "Annual cost of goods sold",
                "type": "number"
              },
              "revenue": {
                "description": "Annual revenue, for GMROI and margin (optional)",
                "type": "number"
              }
            },
            "required": ["averageInventoryValue", "cogs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:176cccc4eedaca6a4a2321f93dff3217b1aab9d64041a498179e05b5bbca7fa7"
        },
        {
          "name": "calculate_lead_time",
          "title": "Lead Time Calculator",
          "description": "Add up total vendor lead time from its stages (processing, production, shipping, receiving) and work out the demand that must be covered during it. Free tool by Tru-Stock AI — https://www.tru-stock.ai/tools/lead-time-calculator",
          "inputSchema": {
            "properties": {
              "avgDailyDemand": {
                "description": "Average units sold per day (optional)",
                "type": "number"
              },
              "processingDays": {
                "description": "Days for the vendor to process the order",
                "type": "number"
              },
              "productionDays": {
                "description": "Days to manufacture",
                "type": "number"
              },
              "receivingDays": {
                "description": "Days to receive and put away",
                "type": "number"
              },
              "shippingDays": {
                "description": "Days in transit",
                "type": "number"
              },
              "varianceDays": {
                "description": "Typical extra days when things run late",
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:30999977afd43600b612edba6fcd7b125373fd717e091d9a5a5f4560b45c30c2"
        },
        {
          "name": "calculate_reorder_point",
          "title": "Reorder Point Calculator",
          "description": "Calculate the reorder point (when to place a new order) for an inventory item, using the King formula for safety stock. Returns the reorder point, safety stock, and demand during lead time. Free tool by Tru-Stock AI — https://www.tru-stock.ai/tools/reorder-calculator",
          "inputSchema": {
            "properties": {
              "avgDailyDemand": {
                "description": "Average units sold per day",
                "type": "number"
              },
              "demandStdDev": {
                "description": "Standard deviation of daily demand (optional)",
                "type": "number"
              },
              "leadTimeDays": {
                "description": "Average vendor lead time in days",
                "type": "number"
              },
              "leadTimeStdDev": {
                "description": "Standard deviation of lead time in days (optional)",
                "type": "number"
              },
              "serviceLevel": {
                "description": "Target service level: 85, 90, 95, 97 or 99. Default 95",
                "type": "string"
              }
            },
            "required": ["avgDailyDemand", "leadTimeDays"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f7ea38f6e38d28bf970a627b8aa748c2a2d20cff2959a494ba3fa456d7be1f14"
        },
        {
          "name": "calculate_safety_stock",
          "title": "Safety Stock Calculator",
          "description": "Calculate how much safety stock to hold to protect against demand and lead-time variability, using the King formula. Returns units and the capital tied up. Free tool by Tru-Stock AI — https://www.tru-stock.ai/tools/safety-stock-calculator",
          "inputSchema": {
            "properties": {
              "avgDailyDemand": {
                "description": "Average units sold per day",
                "type": "number"
              },
              "avgLeadTimeDays": {
                "description": "Average vendor lead time in days",
                "type": "number"
              },
              "demandStdDev": {
                "description": "Standard deviation of daily demand",
                "type": "number"
              },
              "leadTimeStdDev": {
                "description": "Standard deviation of lead time in days",
                "type": "number"
              },
              "serviceLevel": {
                "description": "Target service level: 85, 90, 95, 97 or 99. Default 95",
                "type": "string"
              },
              "unitCost": {
                "description": "Unit cost, to value the safety stock (optional)",
                "type": "number"
              }
            },
            "required": ["avgDailyDemand", "avgLeadTimeDays"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7e4ccc05e510e0e7e9bd778052f188067bc73744c32da35238bebdd02153e3c"
        },
        {
          "name": "estimate_trapped_capital",
          "title": "Inventory Savings Estimator",
          "description": "Size the cash trapped in inventory — dead stock, stockout losses and carrying cost — from your own figures. Returns a RANGE rather than a single number when inputs are left at their defaults, because those defaults are assumptions about your business. Free tool by Tru-Stock AI — https://www.tru-stock.ai/tools/roi-calculator",
          "inputSchema": {
            "properties": {
              "annualRevenue": {
                "description": "Annual revenue",
                "type": "number"
              },
              "avgMarginPct": {
                "description": "Average gross margin, %. Default 25",
                "type": "number"
              },
              "carryingCostRatePct": {
                "description": "Annual cost of holding stock as % of its value. Default 25",
                "type": "number"
              },
              "deadStockPct": {
                "description": "Inventory that is dead stock, %. Default 15",
                "type": "number"
              },
              "inventoryValue": {
                "description": "Current inventory value at cost",
                "type": "number"
              },
              "stockoutPct": {
                "description": "Revenue lost to stockouts, %. Default 5",
                "type": "number"
              }
            },
            "required": ["annualRevenue", "inventoryValue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52c4e265a23be9cca0d95af939bcc3fef02f6364c9889780fb81cdc2a88c6789"
        }
      ],
      "digest": "sha256:37c6c9b7625840dd0e6461e112c59334c45cca73bc72d404a0c2c7b07bb82420"
    }
  }
}
