  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/world-time": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/world-time"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-world-time",
        "title": "Faceabot World Time",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot World Time: current time anywhere and time conversion between places, with daylight saving, free, no key.\nworld_time {\"place\":\"Tokyo\"} · convert_time {\"time\":\"15:00\",\"from\":\"Paris\",\"to\":[\"New York\",\"Tokyo\"]}.\nTime zones: IANA tz database; unknown cities are located with OpenStreetMap.\nPart of Faceabot (https://faceabot.com): any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "convert_time",
          "title": "Convert a time between places",
          "description": "Converts a local time from one place to one or more other places, handling daylight saving on that date (meeting planning).\nUse when: \"15:00 in Paris is what time in New York?\", \"schedule a call at 9 am San Francisco for London and Tokyo\".\nExample: {\"time\":\"15:00\",\"from\":\"Paris\",\"to\":[\"New York\",\"Tokyo\"],\"date\":\"2026-11-03\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Date YYYY-MM-DD in 'from' (default: today there)",
                "type": "string"
              },
              "from": {
                "description": "Place or time zone of that time",
                "examples": ["Paris"],
                "type": "string"
              },
              "time": {
                "description": "Local time in 'from': HH:MM (24 h) or 9am / 3:30pm",
                "examples": ["15:00"],
                "type": "string"
              },
              "to": {
                "description": "Place or time zone, or a list of up to 10",
                "examples": ["Tokyo"],
                "oneOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  }
                ]
              }
            },
            "required": ["from", "time", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:83a3692e94edc55c750fb1ae1060afb781e0f72a35de631da8556bdd65f0ec00"
        },
        {
          "name": "world_time",
          "title": "Current time anywhere",
          "description": "Current local time, date, weekday, UTC offset and daylight-saving status for any city, country or time zone in the world (any language: \"Tokyo\", \"東京\", \"Brasil\", \"America/New_York\", \"UTC+3\"). Countries with several time zones return each zone.\nUse when: someone asks what time it is somewhere, or you need a place's time zone.\nExample: {\"place\":\"Sydney\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "place": {
                "description": "City, country, IANA time zone (Europe/Paris) or UTC offset (UTC+2)",
                "examples": ["Sydney"],
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:648a29a6f24ccee8a1b3239caffb8cd3a388c806221bc89954884acb4a34b3b7"
        }
      ],
      "digest": "sha256:e5c610d00c8bda0521d865e73124f488642631922d40397cb0f97ceb3565f6d1"
    }
  }
}
