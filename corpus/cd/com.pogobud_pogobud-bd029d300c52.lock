      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PoGoBud answers Pokémon GO battle questions: who to bring to a raid or Max Battle, how many trainers it takes, which raids and events are on, and Team GO Rocket line-ups. Answers come from PoGoBud's daily data snapshot. Always link the PoGoBud page URL given in each result. PoGoBud is a fan-made tool, not affiliated with Niantic, Nintendo or The Pokémon Company. Pokémon and Pokémon GO are trademarks of their respective owners.",
      "tools": [
        {
          "name": "events_now",
          "title": "Events now",
          "description": "Pokémon GO events happening now and coming up, with dates, raid bosses and bonuses.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
