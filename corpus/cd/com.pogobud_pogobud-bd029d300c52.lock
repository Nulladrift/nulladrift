        },
        {
          "name": "max_counters",
          "title": "Max Battle counters",
          "description": "Best attackers, defenders and healers for one Dynamax or Gigantamax Max Battle boss, and how many trainers it needs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "boss": {
                "description": "Max boss key or name, e.g. 'zapdos' or 'charizard-gmax'",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["boss"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
