        {
          "name": "pokemon_info",
          "title": "Pokémon info",
          "description": "One Pokémon form: types, base stats, max CP, weaknesses, best raid movesets and the raid bosses it is best against.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "pokemon": {
                "description": "Pokémon name or id, e.g. 'mewtwo' or 'giratina origin'",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["pokemon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
