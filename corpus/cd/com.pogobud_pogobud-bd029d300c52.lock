        {
          "name": "raid_counters",
          "title": "Raid counters",
          "description": "Best counters for one raid boss, how many trainers it needs, its weaknesses and catch CP. `boss` is a Pokémon name or PoGoBud id (dialga, giratina-origin, mewtwo-mega-x, shadow-raikou).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "boss": {
                "description": "Raid boss name or id, e.g. 'dialga' or 'shadow raikou'",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "tier": {
                "description": "Only the boss's usual tier is answered (the default); any other tier gets the boss page link instead. Leave it out.",
                "maxLength": 24,
                "type": "string"
              }
            },
            "required": ["boss"],
            "type": "object"
          },
