        {
          "name": "get_fiscal_calendar",
          "title": "Get Fiscal Calendar",
          "description": "Get a company's fiscal calendar: every quarter it reported, with its own dates.\n\nOne row per quarter, oldest first, from the company's 10-K and 10-Q reports in\norder: period_start is the day after the previous quarter's period end,\nperiod_end the report's, fiscal_year and fiscal_quarter by position after the\nprevious annual report (Q4 is the 10-K), plus the quarter's length in months and\nthe report that closes it (form, filing_date, accession_number; its page is\nbeatandraise_base_url + accession_number). cover_fiscal_year /\ncover_fiscal_period are what the filing's cover says, as filed (about 1% disagree,\nflagged). latest_fiscal_year_end is the newest 10-K's period end.\n\nUse it whenever a question names a fiscal period (\"Apple Q1 FY2024\", \"Nvidia's\nfiscal 2025\", \"Q4\") to get the exact dates instead of guessing: fiscal years are\nnot calendar years (Medtronic's fiscal 2018 runs May 2017 to April 2018), and 52/53\nweek companies end on a weekday that moves every year (Apple's FY2023 ended\n2023-09-30, FY2024 on 2024-09-28). Also to see which report covers a quarter, and\nthat Q4 has no 10-Q of its own: Q4 = the 10-K's year minus the Q3 10-Q's nine\nmonths.\n\nIrregular quarters are flagged, never corrected: irregular_quarter (not 3 months:\na missing 10-Q, or a company that files only 10-Ks, whose rows are years),\nirregular_year, transition (10-KT/10-QT, a fiscal-year change), period_mismatch\n(header_period and xbrl_period differ; period_end is the one the filing's figures\nconfirm), header_only (no XBRL, dates from the submission header, mostly before\n2011), fy_mismatch / fp_mismatch, duplicate_report, amendment_only, first. 10-K/10-Q\nfilers only: a foreign filer (20-F, 40-F) has no quarterly calendar here.\n\nArgs:\n    cik: Company CIK (e.g. \"320193\" for Apple; use search_companies to find it)\n    fiscal_year: Only this fiscal year's quarters (e.g. 2024)\n    from_date: Earliest period end (YYYY-MM-DD)\n    to_date: Latest period end (YYYY-MM-DD)\n    limit: The newest N quarters in the window, returned oldest first (1-400, default 40)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cik": {
                "type": "string"
              },
