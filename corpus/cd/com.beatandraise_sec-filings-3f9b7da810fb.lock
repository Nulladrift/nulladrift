                  }
                ],
                "default": null
              },
              "min_sold": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "nav_range": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
