        {
          "name": "get_filing_item",
          "title": "Get Filing Item",
          "description": "Read one Item of a 10-K, 10-Q, 8-K or 20-F, e.g. Risk Factors or MD&A, instead of the whole document.\n\nMuch smaller than get_document: a 10-K's Item 1A is typically 5-15% of the\nfiling. The first lines say which item it is and give a highlight_url marking\nthe whole section in the filing, to cite.\n\nIf the item's heading was not found, you get the text between the\nneighbouring items instead, and the first line says so (\"APPROXIMATE\").\nThat span contains the item if the filing has it: search within it.\n\nArgs:\n    accession_number: SEC accession number of a 10-K, 10-Q, 8-K or 20-F (other forms have no Items:\n          read them with search_document or get_document)\n    item: The item: a number (\"1A\", \"7\", \"7A\", \"2.02\", a 20-F's \"5\" or \"16G\") or a name (\"Risk Factors\",\n          \"MD&A\", \"Legal Proceedings\"). For a 10-Q, \"Part II Item 1A\" also works. In a 20-F, Risk\n          Factors is inside Item 3 (3.D) and MD&A is Item 5 (Operating and Financial Review).\n    part: 10-Q only: \"I\" or \"II\" when the number exists in both parts (\"1\", \"2\", \"3\", \"4\");\n          a bare number means Part I.\n    get_markdown: Markdown (default). Set False for the raw HTML of the section.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accession_number": {
                "type": "string"
              },
              "get_markdown": {
                "default": true,
                "type": "boolean"
              },
              "item": {
                "type": "string"
              },
              "part": {
