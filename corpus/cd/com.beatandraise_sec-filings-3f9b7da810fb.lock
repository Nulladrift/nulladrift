        {
          "name": "list_figures",
          "title": "List Figures in a Document",
          "description": "List the numbers a filing document actually states, each with its label.\n\nEach entry is a number with its label (the table row's label, or the words leading\nup to it in prose) and its digits with formatting removed, e.g.\n{\"digits\": \"416161\", \"text\": \"416,161\", \"label\": \"Total net sales\"}. Any figure you\nstate from this document must be one of these digit strings times a power of ten\n(possibly rounded): 416161 can be cited as $416.2 billion if the table is in millions,\nnever as $416.9 billion. Work out the scale from the label and the table heading. Tables usually list columns in order\n(current period first); confirm the period from the document if it matters.\n\nUse near to filter by label (e.g. \"gross margin\", \"net income\"). A 10-K holds about\n2,000 figures, so filter unless the document is short (press releases run ~400).\nLink an entry by appending \"?hl=\" + its hl + \"&src=mcp#br-hl-0\" to highlight_base.\n\nArgs:\n    cik: CIK of the filer (e.g. \"0000320193\")\n    accession_number: SEC accession number\n    filename: Document filename (e.g. \"q4fy26cfocommentary.htm\")\n    near: Keep only figures whose label contains this text (case-insensitive)\n    limit: Max figures returned (1-2000, default 300)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accession_number": {
                "type": "string"
              },
              "cik": {
                "type": "string"
              },
              "filename": {
                "type": "string"
              },
              "limit": {
                "default": 300,
                "type": "integer"
              },
              "near": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["accession_number", "cik", "filename"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
