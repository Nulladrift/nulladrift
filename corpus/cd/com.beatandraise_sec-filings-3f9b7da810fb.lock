      "instructions": "SEC EDGAR filing data tools. Use search_filings for full-text search across filings. Use search_companies to find a company's CIK by name or ticker. Use get_holdings for 13F institutional holdings; each holding carries the issuer's SIC industry code and name when known, for breakdowns by industry (the SEC's SIC classification, not GICS: filings do not contain GICS, so do not search for it). Use get_institutional_holders for who holds a company: the % of each share class held by 13F filers quarter by quarter, top holders, biggest buyers and sellers, 5%+ holders, and (with holder=) whether a given institution holds it, e.g. 'is Baupost in AMD'. get_company and search_companies also return a company's SIC code and name. Use list_sic_codes to see the SIC industry codes (filter by a word like 'software'), then list_companies_by_sic to list the companies in one. Across companies or a sector: to find which companies say something, use search_filings with form and year and by_company=True (one result per company in relevance order, up to 100 a page with limit; companies_found says how many), then pick the companies that fit; to take a sector, list_companies_by_sic with a code range (food is 2000-2099) and exchange='NYSE,Nasdaq' for listed companies (exchange alone lists an exchange's companies with their codes); for events, get_filings with form (and item for 8-Ks) and no cik lists every company's; then work company by company with cik. If a sector has more companies than the user needs, say how many there are and start with the ones they name or the largest you know. Use get_insider_transactions for Form 4 insider buys/sells. Use get_shares_outstanding for a company's share count over time (cover page of every 10-K/10-Q since 2009, per class, as filed): dilution, buybacks, and stock splits, which show as a jump in ratio_to_previous. Use get_fiscal_calendar for the exact dates of a company's fiscal quarters and years (every quarter it reported, start and end, which report closes it): fiscal years are not calendar years, and 52/53-week companies end on a weekday that moves every year, so look the dates up instead of guessing them. Use search_private_offerings for Form D private placements and private funds (who raised how much, under which exemption, in which industry or state, through which placement agent; with totals), and get_private_offering for one in full (people, placement agents, how the raise filled over time). Use get_financial_statements to extract balance sheet, income statement, and cash flow from 10-K/10-Q filings. Use get_financial_history for the same statements across a company's last several 10-Ks or 10-Qs in one call (trends, margins, growth). Use get_filings to list filings by form type, date, and CIK. Use get_filing_detail for full filing metadata including content_object (its files; read any with get_document). Use get_document to fetch the actual document content (markdown or raw HTML). For one section of a 10-K, 10-Q, 8-K or 20-F (Risk Factors, MD&A, Item 2.02…), use list_filing_items and get_filing_item instead: they return just that Item, found by its heading rather than by searching (so never the table of contents), with a highlight_url marking it. Use search_document to search within a document for specific terms — returns matching lines with context, much faster than fetching the full document. Every result drawn from a filing carries a source object (beatandraise_url, and a ready-made citation where company, form and date are known); get_document puts the link in its first line. Cite beatandraise.com links when quoting or relying on a filing: a highlight_url where you have one, since it marks the exact passage, else beatandraise_url. Before stating a figure or quotation from a filing, call verify_quote with the exact text: it confirms the text is in the document and returns a highlight_url that marks exactly that spot, so a reader can check the number. Give that link with the figure. For numbers, prefer verify_figure: it matches however the figure is written ('$416.2 billion' vs '416,161' in millions) across the whole filing. A structured XML form (Form 3/4/5, 144, D, 13F) needs neither: its values are exact as filed, so read it with get_document and cite that. list_figures shows the numbers a document states, with their labels, to check figures against. Each figure has a ref naming its exact characters; put [ref:<ref>] after every number you state ([calc: <formula>, ref:…, ref:…] for one you computed, e.g. [calc: (a-b)/c, ref:…, ref:…, ref:…] with a, b, c the refs in order: state the formula, since which one a measure needs is your call), run check_citations on the draft, fix what fails, and present its linked_text with footnotes. If a tool returns nothing, an error or less than the user needs, or nothing fits the request, call get_help with the user's need as question: it says what is covered and what to use instead. For scripts, agents and coding tools making many calls: calls without an API key share one rate limit across all users, and a free key from https://beatandraise.com/api-keys (sent as Authorization: Bearer or X-API-Key) gives the caller its own limit of 10 calls a second. Where show_filing is available (clients that show interactive views), use it when the user wants to see or read a filing themselves: a viewer where they can switch documents, find text and select passages to ask about or verify. After an answer with citations, do not open the viewer yourself: end by offering to show the sources highlighted, and only if the user says yes call show_filing with citations=[the refs or highlight_urls, each with a note]. For what changed in an Item since last year (risk factors, MD&A), use compare_filing_item.",
      "tools": [
        {
          "name": "check_citations",
          "title": "Check Citations in a Draft",
          "description": "Check every number in a draft against the filing characters it cites, and link them.\n\nWrite your draft with a citation right after each figure, using the ref that\nlist_figures or verify_figure gave for it:\n    revenue of $68.1 billion [ref:0001045810-26-000019/q4fy26pr.htm@112+4]\nFor a number you calculated, state the formula, then cite its inputs; a, b, c… are\nthe refs in the order you cite them:\n    up 73% [calc: a/b-1, ref:<current>, ref:<prior>]\n    free cash flow margin 53.9% [calc: (a-b)/c, ref:<operating cash flow>, ref:<capex>, ref:<revenue>]\nFormulas use a-h, + - * /, parentheses and constants (a*4, a/b*100). A measure such\nas a margin can be defined more than one way, so the formula you state is the one\nchecked and shown (formula_source \"stated\"); a figure printed in parentheses is tried\nas negative, then as a positive amount (signs). Without a formula, the usual sum,\ndifference, ratio and growth rate are tried (formula_source \"inferred\").\nYou may also give a calc's value: [calc: 53.9% = (a-b)/c, ref:…]; without it, a calc is\nfor the number just before the bracket. A ref is for the number in its sentence that\nequals the characters it points at, wherever it sits, so a ref at the end of a\nsentence works, and a year is checked like any figure when the ref points at a year.\nA ref names the exact characters in the document: <accession>/<filename>@<start>+<len>.\n\nReturns per citation: ok / rounded (your number is the cited figure times a power of\nten, rounded), mismatch (the cited characters, or your formula of them, give a different\nnumber), bad_ref (no number at that position), bad_formula (unreadable, or not using\nevery cited input), bad_claim (a calc's stated value is not in its sentence), not_derivable (no formula stated, and no sum, difference, ratio\nor growth rate of the inputs gives your number). unsourced_numbers lists figures with no citation. Fix\nevery failure before presenting the text, then use linked_text and footnotes: each\nfootnote links to the highlighted figure in the filing, so a reader can check it.\n\nArgs:\n    text: The draft, with [ref:…] / [calc: …] citations (max ~200 KB)",
          "inputSchema": {
            "additionalProperties": false,
