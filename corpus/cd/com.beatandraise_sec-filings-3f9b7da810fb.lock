        {
          "name": "search_private_offerings",
          "title": "Search Private Offerings (Form D)",
          "description": "Search Form D filings: private placements and private funds (exempt offerings under\nRegulation D, Section 4(a)(5) and the Investment Company Act 3(c) exclusions), since 2009.\n\nEach result is one filing: issuer (CIK, name, city, state, entity type, year of incorporation),\nindustry group and fund type, revenue or net-asset-value range, exemptions claimed (code and\nmeaning), securities offered, date of first sale, total offering amount (null with\noffering_amount_indefinite=true when the filer wrote \"Indefinite\"), total amount sold so far,\nremaining, minimum investment, number of investors and non-accredited investors, sales\ncommissions, finders' fees, proceeds paid to executives/directors/promoters, and counts of related\npersons and sales recipients. totals sums the WHOLE match, not just the page, and\ntotals.by_category breaks it down by industry group and fund type.\n\nCategories are SEC's own (Form D Item 4), as the filer chose them; filter with exactly these\n(case does not matter, several comma-separated). industry:\n  Banking & financial: Commercial Banking, Insurance, Investing, Investment Banking,\n    Pooled Investment Fund, Other Banking and Financial Services\n  Real estate: Commercial, Construction, REITS and Finance, Residential, Other Real Estate\n  Technology: Computers, Telecommunications, Other Technology\n  Health care: Biotechnology, Health Insurance, Hospitals and Physicians, Pharmaceuticals, Other Health Care\n  Energy: Coal Mining, Electric Utilities, Energy Conservation, Environmental Services, Oil and Gas, Other Energy\n  Travel: Airlines and Airports, Lodging and Conventions, Tourism and Travel Services, Other Travel\n  Single: Agriculture, Business Services, Manufacturing, Retailing, Restaurants, Other\nfund_type (given only when industry is Pooled Investment Fund): Hedge Fund, Private Equity Fund,\n  Venture Capital Fund, Other Investment Fund.\nIssuer size (Form D Item 5), also SEC's own values:\n  revenue_range (operating companies, and VC/PE funds): No Revenues, $1 - $1,000,000,\n    $1,000,001 - $5,000,000, $5,000,001 - $25,000,000, $25,000,001 - $100,000,000,\n    Over $100,000,000, Decline to Disclose, Not Applicable\n  nav_range (hedge funds and other investment funds): No Aggregate Net Asset Value,\n    $1 - $5,000,000, $5,000,001 - $25,000,000, $25,000,001 - $50,000,000,\n    $50,000,001 - $100,000,000, Over $100,000,000, Decline to Disclose, Not Applicable\n  About 82% of filers choose Decline to Disclose for revenue (nearly all funds for NAV), so a\n  size filter finds only those that disclosed; for \"smaller raises\" filter on amounts instead\n  (max_sold, max_offering) and say which you used.\nExamples from real filings:\n  Founders Fund Growth IV, LP -> Pooled Investment Fund / Venture Capital Fund\n  Blackstone Private Equity Strategies Fund L.P. -> Pooled Investment Fund / Private Equity Fund\n  Renaissance Institutional Diversified Global Equities Onshore Fund -> Pooled Investment Fund / Hedge Fund\n  BlackRock Private Equity Co-Investments 2025 (Lux) SCSp -> Pooled Investment Fund / Other Investment Fund\n  Alexander Series Trust (a cash fund) -> Pooled Investment Fund / Other Investment Fund\n  New York Life Insurance & Annuity Corp -> Insurance\n  Blackstone Real Estate Income Trust -> REITS and Finance\n  Blue Owl Real Estate Exchange VI DST (a real estate syndication) -> Other Real Estate\n  Space Exploration Technologies (SpaceX), X.AI Holdings, Databricks -> Other Technology\n  Koios Medical -> Biotechnology\nThe filer picks the category, so similar vehicles can land in different ones (a single-deal SPV\nmay be Pooled Investment Fund or Other; some real estate syndications tick \"pooled investment\nfund interests\" as the security while choosing a real estate group). The securities field\n(pooled_fund, equity, debt...) is a second, independent signal.\n\nHow to read the numbers:\n- A Form D/A restates the whole form, and total_amount_sold is cumulative. amendments=\"latest\"\n  (default) returns each offering once, at its newest filing, so sums never double count;\n  \"new\" returns only original notices filed in the date range (new raises); \"all\" every filing.\n- For a Pooled Investment Fund, above all an evergreen or cash fund with an Indefinite\n  offering, amount sold is cumulative subscriptions since the offering began (money in and\n  out), not capital raised: Alexander Series Trust reports $591 billion. Read by_category before\n  adding categories together, and say which categories a total includes.\n- Dates filter the filing date, not the date of first sale.\n- Form D says where the issuer is (state) and where paid salespeople solicited (solicited_in),\n  never where investors live.\nUse get_private_offering for one filing in full (people, placement agents, offering history).\n\nArgs:\n    q: Issuer name contains (e.g. \"Databricks\"). Also matches funds and SPVs named after a\n       company (\"Gaingels Databricks 2023 LLC\"), which are investors in it, not the company.\n    cik: Issuer CIK; matches primary issuer or co-issuer. For one company's own filings, find\n       its CIK with search_companies and pass it here rather than q.\n    industry: One or more SEC industry groups from the list above, comma-separated\n    exclude_industry: Industry groups to leave out, comma-separated (e.g. \"Pooled Investment Fund\"\n        for operating companies only)\n    fund_type: One or more of Hedge Fund, Private Equity Fund, Venture Capital Fund, Other Investment Fund\n    revenue_range: One or more SEC revenue ranges from the list above, comma-separated\n    nav_range: One or more SEC net asset value ranges from the list above, comma-separated\n    exemption: \"506(b)\", \"506(c)\", \"506\" (any Rule 506 incl. pre-2013), \"504\", \"4(a)(5)\", \"3(c)(1)\", \"3(c)(7)\"...\n    security: equity, debt, option_warrant, security_to_be_acquired, pooled_fund, tenant_in_common, mineral_property, other\n    state: Issuer's state/country code, e.g. \"CA\", \"NY\", \"X0\" (United Kingdom)\n    solicited_in: Two-letter state where a paid placement agent solicited (offerings with no paid agent never match)\n    recipient: Placement agent / broker-dealer name contains, or its FINRA CRD number (e.g. \"7691\" = Merrill Lynch)\n    person: Related person's name contains (executive officer, director, promoter)\n    from_date: Filing date from (YYYY-MM-DD)\n    to_date: Filing date to (YYYY-MM-DD)\n    min_sold: Minimum total amount sold, USD\n    max_sold: Maximum total amount sold, USD\n    min_offering: Minimum total offering amount (the planned raise), USD\n    max_offering: Maximum total offering amount, USD (Indefinite offerings never match)\n    amendments: \"latest\" (default), \"new\" or \"all\" — see above\n    sort: \"date\" (newest first, default), \"sold\" or \"offering\" (largest first)\n    limit: Results per page (1-100, default 20)\n    offset: Pagination offset",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amendments": {
                "default": "latest",
                "type": "string"
              },
              "cik": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "exclude_industry": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "exemption": {
