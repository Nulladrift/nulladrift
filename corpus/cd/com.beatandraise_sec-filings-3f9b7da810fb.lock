        {
          "name": "list_filing_items",
          "title": "List Filing Items",
          "description": "List the Items of a 10-K, 10-Q, 8-K or 20-F: which sections the filing has and where.\n\nEach entry gives the item (\"1A\", \"7\", \"2.02\"), its part (\"I\"..\"IV\"; 10-Q\nitems repeat across Part I and Part II), the SEC's title, the heading as\nthe filer wrote it, its length in characters, and a highlight_url that\nopens the filing with that whole section marked. Read one with\nget_filing_item. Items are found by their headings in the document, not\nby searching for the words \"Item 1A\", so a table of contents or a\ncross-reference is never mistaken for the section.\n\nnot_located lists the form's items that were not found: the filing may\nnot have them (Item 1C before 2023, a 10-K/A carrying only Part III, the\nmany 8-K items a given 8-K doesn't report), or the heading was missed.\nget_filing_item still answers for those, with the text between the\nneighbouring items. Other forms (6-K, 40-F, DEF 14A, S-1...) have no\nnumbered Items: read them with search_document or get_document.\n\nArgs:\n    accession_number: SEC accession number of a 10-K, 10-Q, 8-K or 20-F (e.g. \"0000320193-25-000079\")",
          "inputSchema": {
