        {
          "name": "search_filings",
          "title": "Search Filings",
          "description": "Full-text search across all SEC filing content.\n\nReturns matching documents, relevance-ranked, with counts by form type and\nyear (forms, years) and how many distinct companies match (companies_found).\nWith limit 10 or less (the default), each result carries an excerpt:\nthe passage of the document where the most query terms meet, to judge the\nhit without opening it. Page on with page= for more; a larger limit returns\nno excerpts. For every occurrence in one document, use search_document.\nUse this to find filings mentioning specific topics like \"revenue growth\",\n\"cybersecurity risk\", \"stock buyback\", etc.\n\nAcross companies (\"which companies mention X\"), set by_company=True: one\nresult per company, its best-matching document with an excerpt, so a page of\n10 is ten companies, in relevance order; page on for more. For the list of\ncompanies to choose from, ask for up to 100 at once (limit=100: no excerpts,\nso read the ones you pick with search_document or cik=). Without it a page\noften holds several documents of one company. Narrow with form and year\nfirst: a broad query matches thousands of companies (companies_found says\nhow many), and reading them all is rarely what the user wants. Then use cik=\nfor every match within one company.\n\nCoverage: filings from 2020 onwards, except Forms 3/4/5, 144, N-PORT, 13F and\nD. A search for an earlier year finds nothing (the response's coverage_note\nsays so); for older filings, list them with get_filings (cik, form,\nfrom_date, to_date; back to 1993) and read them with search_document or\nget_document. Users who need older years searched can email\nsupport@beatandraise.com.\n\nArgs:\n    query: Search query (e.g. \"revenue growth\", \"cybersecurity risk factors\")\n    form: Filter by SEC form type (e.g. \"10-K\", \"10-Q\", \"8-K\")\n    cik: The company's CIK, if known (search_companies gives it): narrows the\n        search to that company's filings. E.g. for Clear Channel Outdoor's\n        merger background, cik=\"0001334978\" with query=\"go-shop confidentiality\n        agreement\", not the company name in query. Without it every company's\n        filings are searched, and a name in query is matched as words.\n    year: Filter by filing year (e.g. \"2025\")\n    limit: Results per page (1-100, default 10; excerpts only up to 10)\n    page: Page number (0-indexed)\n    by_company: One result per company (its best match) instead of per document",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "by_company": {
                "default": false,
                "type": "boolean"
              },
              "cik": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "form": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "limit": {
                "default": 10,
                "type": "integer"
              },
              "page": {
                "default": 0,
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "year": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["query"],
            "type": "object"
          },
