        {
          "name": "list_sic_codes",
          "title": "List SIC Industry Codes",
          "description": "List the SEC's SIC industry codes, so you know which code to use with list_companies_by_sic.\n\nWith a query (a word from the industry title: \"software\", \"bank\", \"oil\", \"pharmaceutical\") you get the\nmatching codes, most companies first, at most 50, each with the code (sic), the SEC's industry title\n(description), the SEC office that reviews filers in it (office), and how many companies we hold under it\n(companies, of which listed have an exchange ticker). Then call list_companies_by_sic with a code, or\nget_company for one company's own code.\n\nWith no query you get every code (about 440) as one short line each, \"code title (companies)\", sorted by\ncode. That is a long list, so prefer a query.\n\nSIC is the SEC's classification of the filer, assigned when it registers. It is not GICS or NAICS.\n\nArgs:\n    query: a word to look for in the industry titles (optional)",
