        {
          "name": "list_companies_by_sic",
          "title": "List Companies by Industry (SIC)",
          "description": "List the companies in an industry, using the SEC's Standard Industrial Classification (SIC).\n\nPass a SIC code (3-4 digits, e.g. \"6200\" for securities brokers and exchanges, \"3571\" for electronic\ncomputers, \"7372\" for prepackaged software) to get its companies: CIK, name, ticker, exchange, state of\nincorporation and fiscal year end, 100 per page, companies with a ticker first. Get a company's own\ncode from get_company or search_companies (sic).\n\nA sector is often several codes: pass a range or a list (\"2000-2099\" for all food and beverages,\n\"2833-2836\" for drugs, \"2080,2086\"), and each company then carries its own code; codes lists the\ncodes found with their titles and company counts. A ticker is not an exchange listing: OTC\ncompanies have tickers too, so for exchange-listed companies pass exchange=\"NYSE,Nasdaq\". Every\nanswer with a code also has by_exchange: how many of its companies are on each exchange (none = no\nexchange ticker), so one call says how a sector splits between NYSE, Nasdaq and OTC.\n\nWith exchange and no industry you get every company listed there (e.g. exchange=\"NYSE\"), by name, 100\nper page, each with its SIC code and title, and by_sic: how many of them each SIC code has. With\nneither industry nor exchange you get the exchanges themselves: every name SEC's ticker file uses, with\nhow many companies are on each.\n\nIf you do not know the code, pass a word from the industry name instead (\"software\", \"pharmaceutical\",\n\"bank\", \"oil\") and you get the matching SIC codes with how many companies each has; then call again\nwith the code you want. list_sic_codes shows the whole classification.\n\nSIC is the SEC's classification of the filer, assigned when it registers. It is not GICS or NAICS,\nindividuals and most funds have none, and some codes are broad (e.g. 6770 \"blank checks\").\n\nArgs:\n    industry: a SIC code like \"6200\", or a word to look up codes by (\"software\"); may be left out\n        when exchange is given\n    query: with a code: only companies whose name or ticker contains this\n    page: with a code: page number, 100 companies per page (default 1)\n    listed_only: with a code: only companies that have a ticker (default True; OTC included). Set False\n        to include the many dormant, delisted and asset-backed entities that carry the same code.\n    exchange: only companies listed on one of these, comma-separated, as SEC names them: NYSE, Nasdaq,\n        OTC, CBOE, TXSE; without industry, every company listed there",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "exchange": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "industry": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "listed_only": {
                "default": true,
                "type": "boolean"
              },
              "page": {
                "default": 1,
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List Companies by Industry (SIC)"
