        {
          "name": "get_shares_outstanding",
          "title": "Get Shares Outstanding",
          "description": "Get a company's shares outstanding over time, as stated on the cover page of\neach 10-K, 10-Q, 20-F and 40-F (dei:EntityCommonStockSharesOutstanding).\n\nOne row per share class and as-of date, oldest first, each with the filing it\ncomes from (source). Counts are as filed and never split-adjusted, so a stock\nsplit appears as a jump in ratio_to_previous (the count divided by the same\nclass's previous count; Apple 2020: 3.98 for its 4-for-1, the gap being\nbuybacks).\n\nsplits lists every stock split and reverse split found, each with its ratio\n(\"4-for-1\", \"3-for-2\", \"1-for-10\"), the dates it falls between (happened_after,\nby) and the 10-K/10-Q that first restated the company's earlier share counts\nby that ratio, which accounting rules require for every split (source: cite\nit). restated_figures is how many share counts were restated: 1-2 is thin\nevidence. Two splits between the same two filings show as one with the\ncombined ratio. share_count_tagging_corrections are jumps of 1000x or\n1,000,000x in the reported data that were the company fixing the scale of its\nXBRL share-count tag, not splits. Covers 10-K, 10-Q, 20-F and 40-F filers\n(a 20-F/40-F filer reports once a year, so its window is about a year wide).\nA split is listed once a filing has restated the share counts, so a\nratio_to_previous far from 1 with no split listed is worth checking in the\nfiling. Use this for share-count history, dilution, buybacks and splits\ninstead of reading filings one by one.\n\nMulti-class companies (Alphabet, Meta) have one series per class, named by the\nXBRL member (CommonClassAMember, CapitalClassCMember); \"listed\" maps classes to\ntickers from the newest filing. Covers filings from coverage_from (2009) on,\nfor companies that tagged the count in XBRL. Filer errors (a zero, a mistyped\ndate) are returned as filed.\n\nArgs:\n    cik: Company CIK (e.g. \"320193\" for Apple)\n    share_class: Only this class, as returned in share_class (optional)\n    from_date: Earliest as-of date (YYYY-MM-DD)\n    to_date: Latest as-of date (YYYY-MM-DD)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cik": {
                "type": "string"
              },
