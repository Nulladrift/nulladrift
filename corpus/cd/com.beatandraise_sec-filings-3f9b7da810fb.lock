        {
          "name": "search_document",
          "title": "Search Within a Filing",
          "description": "Search within a filing's documents for specific terms. Returns matching lines with context.\n\nIf filename is omitted, searches every readable document in the filing (the main\ndocument and its exhibits, e.g. an 8-K's press release AND its CFO commentary), up to\n12 files. A filing with only XML forms (Form 144, 3/4/5, 13F, N-PORT, D) is searched as\nraw XML lines, so element names (aggregateMarketValue, netAssets) match as well as values.\nIf filename is provided, searches only that file. Each file in the result\ncarries its own source (beatandraise_url) — cite the file the match came from.\n\nWorkflow:\n1. Use get_filings to find the accession number for the filing you want\n2. Call this tool with just accession_number and query — it will search all its documents\n3. Optionally use get_filing_detail to see all files, then search a specific one by filename\n\nSupports multiple search terms separated by commas — lines matching any term are returned.\nA comma inside a number or a date is kept: \"3,007\" or \"464,391\" is searched as one figure,\n\"May 30, 2025\" as one date, and a date also matches its other spellings (\"May 30 2025\",\n\"May30, 2025\", \"Dec. 31\" for \"December 31\"). A term of 1-3 characters (\"AI\", \"EPS\", \"Q3\")\nmatches only as a whole word; longer terms match inside words (\"nominat\" finds \"nominated\").\n\nArgs:\n    accession_number: SEC accession number (e.g. \"0001045810-25-000023\")\n    query: Search terms, comma-separated (e.g. \"singapore,revenue\" or \"risk factors\")\n    cik: Optional. CIK of the filer (e.g. \"0000320193\"); found from the accession number when left out\n    filename: Optional document filename. If omitted, searches all readable documents.\n    context_lines: Lines of context around each match (0-50, default 10)\n    compact: Optional. True returns the matches as plain text (each file's link, then its\n        lines numbered, matching lines marked \">\") instead of JSON: the same content in\n        fewer tokens.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accession_number": {
                "type": "string"
              },
              "cik": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "compact": {
                "default": false,
                "type": "boolean"
              },
              "context_lines": {
                "default": 10,
                "type": "integer"
              },
              "filename": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["accession_number", "query"],
            "type": "object"
          },
