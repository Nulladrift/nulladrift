        {
          "name": "get_insider_transactions",
          "title": "Get Insider Transactions",
          "description": "Get parsed Form 4 insider transactions for a company.\n\nReturns insider buy/sell transactions with owner details (name, title,\nrelationship), transaction details (date, code, shares, price), and\npost-transaction holdings. Data is extracted from the Form 4 XML.\n\nTransaction codes: P=Purchase, S=Sale, A=Award, M=Exercise, G=Gift, F=Tax\n(shares withheld to pay tax on a vesting or exercise, not a sale by choice).\n\nEvery row carries plan_10b5_1: the filing's Rule 10b5-1 checkbox as filed\n(true, false, or null for filings from before the box existed in 2023). It is\nthe filer's declaration for the whole filing. Filers sometimes leave it\nunticked and name a plan in a footnote (common for plans adopted before 2023),\nor tick it without one, so before saying a sale was or was not under a plan,\nread the footnotes (include_footnotes=True). An S alone does not tell a planned\nsale from a discretionary one.\n\nWith include_footnotes=True each row also lists the footnotes it points to\n({id, text}, as filed): plan adoption dates, the price range behind a weighted\naverage price, shares sold to cover taxes, trusts and other indirect holdings.\nCovers filings from coverage_from (2024-01-01).\n\nBy default only Form 4 Table I (the shares themselves) is returned. With\ninclude_table_ii=True, Table II lines are added and every row says which table\nit is from (\"I\" or \"II\"); Table II rows also give the underlying security,\nexercise price and dates. Table II is what the SEC calls \"derivative\nsecurities\" for Section 16: stock options, but also RSUs, PSUs and convertible\nshare classes, which are compensation or share classes, not derivatives in the\nusual sense, so describe them by their security_title. An RSU vesting appears\nin both tables (an M disposal of units in II, an M acquisition of shares in I):\ncount it once. A grant (A) is compensation, not a purchase. Table II covers\nfilings from coverage_from (2024-01-01).\n\nArgs:\n    cik: Issuer CIK — the company whose insiders are trading (e.g. \"320193\" for Apple)\n    from_date: Start date (YYYY-MM-DD)\n    to_date: End date (YYYY-MM-DD)\n    limit: Max filings to process (1-100, default 20)\n    offset: Pagination offset\n    include_table_ii: Also return Table II lines: options, RSUs and the like (default False)\n    include_footnotes: Also return each line's footnotes (default False)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cik": {
                "type": "string"
              },
              "from_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "include_footnotes": {
                "default": false,
                "type": "boolean"
              },
              "include_table_ii": {
                "default": false,
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "type": "integer"
              },
              "to_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["cik"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
