        {
          "name": "get_financial_history",
          "title": "Get Financial History",
          "description": "A company's financial statements from its last several 10-Ks or 10-Qs, in one call.\n\nFor trends (revenue, margins, cash flow over years or quarters) instead of calling\nget_financial_statements filing by filing. Returns each filing, newest first, with its\nstatements as that filing presents them (the same text get_financial_statements gives).\nThey are not combined into one table: a 10-K shows two or three years, so periods repeat\nacross filings (the newest filing's figure is current; it may restate), and labels, line\nitems and scale can differ between filings. Read the figures from each filing yourself.\n\nCoverage: filings with XBRL, which the SEC phased in by company size: the largest companies\nfrom mid-2009, other large companies from mid-2010, all others from mid-2011. Earlier reports\nhave no statements here (read a 10-K's Item 8 with get_filing_item); to have earlier years\nadded, email support@beatandraise.com.\n\nArgs:\n    cik: Company CIK (use search_companies to find it)\n    period: \"annual\" (10-K, or a foreign filer's 20-F / 40-F; default 5 filings, max 10) or\n        \"quarterly\" (10-Q, default 8, max 20; foreign filers report quarters on 6-K, not covered)\n    statements: Optional subset: \"income_statement\", \"balance_sheet\", \"cash_flow\",\n        \"equity\", \"comprehensive_income\". Ask for fewer to get more filings in one answer.\n    limit: Number of filings to read\n    before: Only filings filed on or before this date (YYYY-MM-DD), for history as of a past date\n    fiscal_year: Only filings for this fiscal year, as the company states it on the filing\n        (fiscal, not calendar: Medtronic's fiscal 2018 runs May 2017 to April 2018)\n    fiscal_period: With or without fiscal_year: \"Q1\", \"Q2\", \"Q3\" (a 10-Q) or \"FY\" (the annual\n        report). There is no Q4 filing: the fourth quarter is in the annual report, as the\n        year. E.g. fiscal_year=2018, fiscal_period=\"Q1\" returns that one 10-Q; fiscal_year=2018\n        with period=\"quarterly\" returns its Q1-Q3. Each returned filing carries its\n        fiscal_year and fiscal_period.\n    include_tags: true to also get each statement as `lines`: every line with its XBRL tag\n        (concept, axis members, unit) and its figures for the filing's own period (this\n        quarter and year to date, or the balance sheet date), each with its value in full\n        units, the text the page prints, a `ref` for check_citations and a `highlight_url`\n        that opens the 10-K / 10-Q with that number marked. For building a spreadsheet model\n        or citing figures: concept + members + unit identifies the same line in the next\n        filing. Figures printed as a dash (zero) and filings before mid-2019 (no inline\n        XBRL) have no ref or link; a filing's tags are added the night after it is filed\n        (`tags_note` says why a statement has none). Responses are larger: ask for fewer\n        statements or filings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
