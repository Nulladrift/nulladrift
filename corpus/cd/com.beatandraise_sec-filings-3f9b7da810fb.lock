        {
          "name": "get_document",
          "title": "Get Filing Document",
          "description": "Fetch a filing document's content from storage.\n\nFor one section of a 10-K, 10-Q, 8-K or 20-F (MD&A, Risk Factors, Legal\nProceedings, Item 2.02…), use get_filing_item instead: it returns just\nthat Item, a fraction of the document, with a link highlighting it.\n\nReturns the document as markdown (default) or raw HTML. Use this to read\nthe actual text of a whole 10-K, 8-K, exhibit, or any other filing document.\nThe first line gives its source: the beatandraise.com viewer link, to cite.\n\nName the document either by accession_number + filename, or by url: a\nsec.gov document link (https://www.sec.gov/Archives/edgar/data/<cik>/<accession>/<file>,\nalso inside an /ix?doc= link) or a beatandraise.com document link.\n\nArgs:\n    accession_number: SEC accession number\n    filename: Document filename from the content_object (e.g. \"ef20060722_8k.htm\")\n    cik: Optional. CIK of the filer (e.g. \"0000320193\"); found from the accession number when left out\n    url: Optional. A sec.gov or beatandraise.com link to the document, instead of the fields above (not a company website)\n    get_markdown: Return markdown version (default True). Set False for raw HTML.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
