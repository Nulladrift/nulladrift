        {
          "name": "verify_quote",
          "title": "Verify a Quote or Figure",
          "description": "Check that a figure or sentence really appears in a filing document, and get a\nlink that highlights exactly where.\n\nUse this before stating any number or quotation from a filing. Analysts need to see\nthe figure in the source; a link to the whole document is not enough. Quote the text\nas it appears in the document: a sentence, or a table row's label and figure\n(\"Total net sales 416,161\", \"Gross margin 75.0%\"). Words and numbers must match\nexactly. Spacing, table-cell breaks, \"$\" and curly quotes may differ.\n\nReturns found (true/false) and, for each occurrence, its surrounding context, a\nhighlight_url (beatandraise.com viewer, marks that exact span, including across table\ncells), to cite with the quotation. If there are several occurrences, pick the one whose context fits\nthe claim, or quote more of the row to pin one. If found is false, do not present the\ntext as a quotation from this document: numbers_elsewhere shows where its figures do\nappear, which usually reveals a misremembered figure or the wrong document. A label\nand a figure (\"Operating income 79,975\") are rarely adjacent in a table, where other\nyears' columns sit between them: a miss on one returns try_instead, the verify_figure\ncall that checks the number however the row is laid out. Use verify_figure for figures.\n\nArgs:\n    cik: CIK of the filer (e.g. \"0000320193\")\n    accession_number: SEC accession number (e.g. \"0000320193-25-000079\")\n    filename: The document the text came from (e.g. \"aapl-20250927.htm\", or an\n        exhibit such as \"q4fy26cfocommentary.htm\"), as listed in content_object\n        or in a search result\n    quote: The exact text to find (max 1000 characters)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accession_number": {
                "type": "string"
              },
              "cik": {
                "type": "string"
              },
