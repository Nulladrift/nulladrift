        {
          "name": "get_institutional_holders",
          "title": "Get Institutional Holders",
          "description": "Who holds a company, from 13F filings: how much of each share class institutions hold,\nand how that changed quarter by quarter. The company-side view of 13F; get_holdings is the\nmanager side (what one institution owns).\n\nUse it for questions like:\n  - \"What % of AMD do institutions hold, and how has it changed over the last 4 quarters?\"\n    -> quarters=4; read quarters[].share_classes[].pct_of_class.\n  - \"Is Baupost an investor in AMD?\" -> holder=\"Baupost\" (a name fragment or a filer CIK).\n    holder.matched_filers says which 13F filers the name matched; holder.positions gives\n    each quarter's position; holder.not_held_in lists quarters with none. If matched_filers\n    is empty, no 13F filer has that name. With holder the response is lean by default (about\n    5 KB: no top_holders/buyers/sellers lists); pass detail=\"full\" if you also need those.\n  - \"Who are the largest holders / who bought or sold most last quarter?\" -> top_holders,\n    biggest_buyers, biggest_sellers, largest_new_positions, largest_exits.\n  - \"Who owns more than 5%?\" -> large_holders_5pct (latest 13D/13G per holder).\n\nReturns, newest complete quarter first (the quarter still being filed is in\nin_progress_quarter, not in quarters):\n  quarters[]: period, holders, new_holders, exited_holders, shares_held, value_usd,\n    share_classes[] (one per class on the company's cover page: shares_outstanding as of\n    the 10-Q/10-K after the quarter, listed/symbol, held_by_13f, pct_of_class, holders,\n    cusips), share_count_source (the filing the count comes from), holders_url.\n  source.beatandraise_url: the holders page, the human view of the same data.\n\nReport each share class separately; never add classes together (Meta's Class B is unlisted,\nso no institution can hold it). State the caveats in notes when giving numbers: 13F is as\nfiled and not deduplicated, options are excluded, holdings can exceed 100% for heavily\nshorted stocks, and a \"new position\" can be a manager whose previous 13F was late or a\nplaceholder. Cite share_count_source's link for share counts and holders_url for holdings.\n\nArgs:\n    company: Ticker (e.g. \"AMD\") or CIK of the company being held (not of the institution); for a\n        company name, get them from search_companies first\n    quarters: Number of complete quarters, newest first (1-12, default 4)\n    holder: Optional 13F filer to follow across the quarters: a name fragment (\"Baupost\",\n        \"Berkshire\") or a CIK (\"1061768\")\n    limit: Number of top holders to return for the latest quarter (1-100, default 25)\n    detail: \"lean\" or \"full\". Default: lean when holder is given (just the holder's positions,\n        share classes and sources), full otherwise (adds top holders, buyers, sellers, new\n        positions, exits and 5%+ holders)\n    ticker: Same as company (models often name it so)\n    cik: Same as company\n\nA ticker that cannot be tied to a company (an index option such as XSP, a former ticker) is\nnot an error: the response has empty quarters and not_covered with the reason, and\nticker_used_by names companies whose cover pages stated it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cik": {
