        {
          "name": "get_holdings",
          "title": "Get 13F Holdings",
          "description": "Get parsed 13F-HR institutional holdings for a filer.\n\nReturns individual stock positions with issuer name, CUSIP, FIGI, market value,\nshare count, investment discretion, and voting authority, parsed from the 13F\ninformation table XML (\"format\": \"xml\"), as filed: one row per entry, values in the\nfiler's unit (thousands of dollars for most filings before 2023, dollars since).\n\n13F-HRs filed before SEC introduced the XML table (2013 Q2) carry their holdings as a\nplain-text table in the filing's own document. For those the result has \"format\": \"text\"\nand \"text\": that document as filed, paged by line (limit/offset count lines, total_lines\nsays how many). Read the table from it; search_document on its filename finds one position.\n\"period\" in the result is the quarter the report covers; \"filing_date\" is about 45 days later.\nA \"period_note\" says when the filer has no 13F for the period asked for and an earlier one is\nreturned (that quarter is not filed yet, or the filer stopped).\n\nEach holding also carries issuer_cik, sic and sic_description (the SEC's SIC industry\nclassification of the issuer, not GICS) when the CUSIP maps to a company with a SIC. In a typical\nquarter that is about 87% of the value held; funds, ETFs, options and unmapped CUSIPs have none.\n\"with_sic\" in the result says how many holdings on this page were classified, so say how much of a\nportfolio an industry breakdown covers. Use sic_url from get_company to see peers in an industry.\n\nArgs:\n    cik: CIK of the 13F filer / institutional investor (e.g. \"1535950\")\n    period: Report period (YYYY-MM-DD), e.g. 2026-06-30 for the second quarter: the 13F for that period, else the latest period before it. Default: the latest period.\n    limit: Max holdings per page (1-5000, default 500)\n    offset: Pagination offset",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cik": {
                "type": "string"
              },
              "limit": {
                "default": 500,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "type": "integer"
              },
              "period": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
