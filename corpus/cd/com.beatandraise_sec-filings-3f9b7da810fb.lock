        {
          "name": "search_companies",
          "title": "Search Companies",
          "description": "Search for companies by name or ticker symbol.\n\nReturns matching entities with CIK, all known names, and ticker symbols, plus\nthe SEC's SIC industry code and name (sic, sic_description) for companies that have one.\nUse this to find a company's CIK before using other tools.\n\nA result with succession_filing filed an 8-K12B or 8-K12G3 in the last five years: it\nbecame the successor to an earlier registrant (a new holding company, a change of\ndomicile, a merger), and the ticker usually moved with it. Its filings before that date,\nsuch as past 10-Ks, are often under the predecessor's CIK. To get the predecessor's\nname, search that filing (search_document) for \"successor\" or \"12g-3\" -- filers write\n\"successor issuer\", \"successor registrant\" or \"successor to\" -- then search for it.\n\nArgs:\n    query: Company name or ticker (e.g. \"apple\", \"AAPL\", \"Tesla\")\n    limit: Max results (1-50, default 10)",
