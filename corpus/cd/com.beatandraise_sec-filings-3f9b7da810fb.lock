        {
          "name": "get_private_offering",
          "title": "Get Private Offering (Form D)",
          "description": "Get one Form D filing in full, by accession number (from search_private_offerings).\n\nEverything search returns, plus: the issuer's full address, phone and previous names;\nco-issuers; related persons (executive officers, directors, promoters) with their roles and\naddresses as filed; sales compensation recipients (placement agents and brokers) with FINRA CRD\nnumbers, their broker-dealer and the states they solicited in; notes the filer added to amounts,\nfees and use of proceeds; the signatures; and offering_history: every filing of the same offering\n(original notice and amendments, oldest first) with its cumulative amount sold and investor count,\nwhich shows how the raise filled over time.\n\nArgs:\n    accession_number: Form D accession number, e.g. \"0001104659-26-114962\"",
