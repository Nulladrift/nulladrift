        {
          "name": "get_filings",
          "title": "List Filings",
          "description": "Query SEC filings by form type, date range, CIK and/or 8-K item.\n\nReturns deduplicated filing metadata sorted by filing date (newest first). Each\nfiling's content_object lists its documents (filename, doc_type, description,\nsequence; sequence 1 is the primary document); read any of them with\nget_document(cik, accession_number, filename). A document's link, to cite, is\nbeatandraise_base_url + filename (the beatandraise.com viewer); the filing's own\nsource gives the primary document's link and a ready-made citation. Each filing\nalso carries its items (an 8-K's, e.g. \"2.02 Results of Operations and Financial\nCondition\") when it has any. The R*.htm files are XBRL financial-table\npages; list_filing_tables says which table each one is.\n\nAn 8-K carries a headline when its press release (EX-99.1) has one, e.g.\n\"Tesla Third Quarter 2026 Production, Deliveries & Deployments\": read from the\nrelease's opening lines by rules, so use it to choose which 8-K to read, not as\na quotation (about 2% are another line of the release; verify_quote before\nquoting). No headline says nothing about the filing: its exhibit may be a\ndeck or an agreement, or it may have no EX-99. An 8-K whose only item is 9.01\nand that has no headline files exhibits and nothing else: exhibits_only lists\nthem by type and the SEC's exhibit title (\"EX-5.01 Opinion re legality; EX-99.01\nAdditional exhibits (no press release headline)\"), so it holds no financial\nstatements despite its item's name, and is rarely worth reading for news.\n\nArgs:\n    form: SEC form type (e.g. \"10-K\", \"10-Q\", \"8-K\", \"4\", \"13F-HR\", \"S-1\"), or\n        several comma-separated in one call (up to 20), e.g.\n        \"N-CSR,N-CSRS,N-CSR/A,N-CSRS/A\" or \"10-K,10-K/A\". Amendments are\n        their own form types, so name them to include them.\n    cik: Company CIK (e.g. \"0000320193\" or \"320193\")\n    from_date: Start date inclusive (YYYY-MM-DD). Without cik, defaults to\n        30 days before to_date (or today); pass it to reach older filings.\n    to_date: End date inclusive (YYYY-MM-DD)\n    limit: Max results (1-100, default 100; at most 25 with include_item_text).\n        For more, page with offset\n    offset: Pagination offset\n    item: Only 8-Ks reporting this item, by its number as the 8-K header states it,\n        e.g. \"5.02\" (departure or election of directors or officers, officers' pay),\n        \"1.01\" (material agreement), \"2.01\" (acquisition or disposal), \"4.01\"\n        (auditor change), \"5.07\" (shareholder vote); several comma-separated match\n        any (\"1.01,2.01\"). Defaults form to \"8-K,8-K/A\". Numbered since 2004-08-23.\n        Use it instead of reading 8-Ks one by one to find, say, every director change\n        this week.\n    include_item_text: With item, also return each filing's text of that item\n        (item_texts: item, title, text up to 10,000 characters, highlight_url marking\n        it in the filing), so a screen across companies takes one call. The header\n        only says 5.02; whether it is a director, a CEO or a pay plan is in the text.\n    item_text: Items whose text to return with each filing, for any 10-K, 10-Q or 8-K\n        (not only with item): by number or name, up to 5 comma-separated, e.g. \"MD&A\",\n        \"1A\", \"Risk Factors\", \"Part II Item 1A\", \"5.02\". With form=\"10-Q\" and a cik,\n        \"MD&A\" gives a company's last several MD&As in one call. A filing without that\n        Item says so in its item_texts entry (\"not in this filing\").\n    item_text_chars: Characters of text per Item, 1,000-100,000 (default 10,000). The\n        whole page carries at most 500,000 characters of text, so limit is lowered to\n        fit: ask for fewer filings when you want whole MD&As.",
