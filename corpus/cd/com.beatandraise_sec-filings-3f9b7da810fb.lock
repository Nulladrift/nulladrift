        {
          "name": "verify_figure",
          "title": "Verify a Figure",
          "description": "Check that a number you are about to state appears in a filing, however it is written.\n\nEvery number is compared as its digits alone (separators, decimal point, sign, $ and %\ndropped, zeros trimmed): \"416,161\", \"416.161\" and \"416,161,000\" are all 416161. Your\nfigure must be one of the filing's numbers times a power of ten, allowing for rounding\nto the digits you give: \"$416.2 billion\" matches 416,161 (in millions), \"75%\" matches\n\"75.0 %\". Searches every document in the filing (main document and\nexhibits) unless filename is given. Candidates are ranked by exactness and by your\nlabel's words appearing in the number's row label or lead-in text.\n\nReturns found, match_count, and up to 10 matches, each with its document, label,\ncontext and a highlight_url that marks that exact number in the beatandraise.com\nviewer. Matching ignores magnitude, so confirm each candidate's label, period and\nscale from its context, then cite its highlight_url. found=false means no number in\nthe filing has those digits: do not attribute the figure to the filing. If you\ncalculated it (a growth rate, a margin), say so and cite the inputs instead.\nfound=null with checked=false means nothing was checked, which says nothing about the\nfigure: a structured XML form (Form 3/4/5, 144, D, 13F) has no text to check, so read\nits values with get_document and cite that; the note says what to do.\n\nArgs:\n    cik: CIK of the filer (e.g. \"0000320193\")\n    accession_number: SEC accession number\n    value: The figure as you would state it (e.g. \"$416.2 billion\", \"75.0%\", \"-1,234\").\n        A value with one significant digit (\"$10.00\", \"20,000,000\") only matches\n        numbers written exactly the same way; \"$2 million\" is too vague to check.\n    label: What the figure is (e.g. \"total net sales\", \"GAAP gross margin\"). Used for ranking.\n    filename: Optional single document to check instead of the whole filing",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accession_number": {
                "type": "string"
              },
              "cik": {
                "type": "string"
              },
              "filename": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "label": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "value": {
                "type": "string"
              }
            },
            "required": ["accession_number", "cik", "value"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
