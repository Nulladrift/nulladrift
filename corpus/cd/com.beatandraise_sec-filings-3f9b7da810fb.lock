        {
          "name": "list_filing_tables",
          "title": "List Filing Tables",
          "description": "List every R*.htm financial table in a filing (10-K, 10-Q, S-1, etc.).\n\nReturns one entry per <Report> in the filing's FilingSummary.xml — typically\nthe Cover page, the core financial statements (income, balance sheet, cash\nflow, comprehensive income, equity), notes, and detail breakdowns. Each\nentry includes the filename you'd pass to get_document, plus a canonical\ntype (xbrl_role_normalized) so you can find e.g. the income statement\nacross different filers regardless of how they ordered their R-files.\n\nCommon xbrl_role_normalized values: 'income_statement', 'balance_sheet',\n'cash_flow', 'comprehensive_income', 'equity', 'segment', 'cover'.\n\nEmpty list means the filing has no FilingSummary.xml (most 8-Ks, pre-2009\nfilings, short-form prospectuses) or it hasn't been indexed yet.\n\nArgs:\n    accession_number: SEC accession number (e.g. \"0000320193-25-000079\")",
