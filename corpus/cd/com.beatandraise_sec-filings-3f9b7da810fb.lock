        {
          "name": "compare_filing_item",
          "title": "Compare Filing Item With Prior Year",
          "description": "What changed in one Item of a 10-K, 10-Q or 20-F since the same filing a year earlier\n(new and dropped risk factors, rewritten MD&A, legal proceedings...), shown to the user\nas a marked-up comparison in the viewer.\n\nYou get every added, removed and changed paragraph as text: inside a changed one,\n[-old words-] and {+new words+}. Unchanged paragraphs are left out of your copy. The\nprior filing is the company's same form filed closest to one year before (a 10-Q is\ncompared with the same quarter last year); pass prior_accession_number to choose another.\nChanges are numbered; a long list comes in pages: the last line says to call\nmore_item_changes for the next one.\n\nArgs:\n    accession_number: The newer filing (10-K, 10-Q or 20-F)\n    item: The Item, by number or name (\"1A\", \"Risk Factors\", \"7\", \"MD&A\", \"3\")\n    part: 10-Q only: \"I\" or \"II\" when the number exists in both parts (\"1\", \"2\"); Risk Factors is Part II Item 1A\n    prior_accession_number: Optional. The older filing to compare with",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accession_number": {
                "type": "string"
              },
              "item": {
                "type": "string"
              },
              "part": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "prior_accession_number": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["accession_number", "item"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare Filing Item With Prior Year"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
