        {
          "name": "get_company",
          "title": "Get Company",
          "description": "Look up a company by CIK to get its name(s), ticker(s) and industry.\n\nWhen known, the result also has the SEC's SIC classification: sic (4-digit code, e.g. \"6200\"),\nsic_description (e.g. \"SECURITY & COMMODITY BROKERS, DEALERS, EXCHANGES & SERVICES\"),\nsic_url (a page listing the other companies in the same industry), fiscal_year_end (MMDD, e.g.\n\"1231\" for 31 December) and state_of_incorporation. SIC is the SEC's own scheme and is not GICS;\nindividuals and most funds have none.\n\nsuccession_filing, when present, is an 8-K12B or 8-K12G3 from the last five years in which this\ncompany says it succeeded an earlier registrant; its older history may be under that\npredecessor's CIK (see search_companies).\n\nArgs:\n    cik: Central Index Key (e.g. \"0000320193\" or \"320193\")",
