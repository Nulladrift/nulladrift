                "default": "tripo-rig",
                "enum": ["tripo-rig", "rodin-rig", "meshy-rig"],
                "type": "string"
              },
              "wait_seconds": {
                "default": 45,
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["mesh"],
            "type": "object"
