          "digest": "sha256:020361b1336997f9364125f564ba48a79b5b789b4724569c1cd9c361b0ab9fe7"
        },
        {
          "name": "upload_file",
          "title": "Upload a local file",
          "description": "The server cannot read the user's disk. This returns an upload id and the exact curl command that sends a local file (a mesh or picture) to it; run that command, then pass the id as the image or mesh of another tool. Uploads last 24 hours.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bytes": {
                "description": "The file's size in bytes (ls -l or stat).",
                "minimum": 1,
                "type": "integer"
              },
              "content_type": {
                "type": "string"
              },
              "filename": {
                "description": "The file's name with its extension, e.g. \"chest.glb\".",
                "type": "string"
              }
            },
            "required": ["bytes", "filename"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
