        {
          "name": "edit_model",
          "title": "Edit a 3D model",
          "description": "Change a model you have: retexture (new PBR textures from a picture or words; trellis-2-texture 5, trellis-2-texture-pro 10, tripo-texture 20, tripo-texture-detailed 40, meshy-texture 50 credits) or remesh (new, clean topology at a face count; tripo-remesh 50 credits). The mesh is an https URL, an upload id from upload_file, a library id (ph:wooden_barrel_01) or a job id, so steps chain without downloading. Waits about 45 s, then returns job_id for get_job. To reduce, compress, convert or repair a file, use gltf-transform or Blender locally.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "type": "string"
              },
              "image": {
                "description": "retexture: the look as a picture.",
                "type": "string"
              },
              "max_credits": {
                "minimum": 0,
                "type": "integer"
              },
              "mesh": {
                "description": "The model: URL, upl_..., library id, or job_...",
                "type": "string"
              },
              "model": {
                "description": "retexture or remesh: the model to use.",
                "type": "string"
              },
              "operation": {
                "enum": ["retexture", "remesh"],
                "type": "string"
              },
              "options": {
                "additionalProperties": true,
                "description": "remesh: faces (500 to 20,000; 10,000 as quads), topology (quads|triangles).",
                "type": "object"
              },
              "prompt": {
                "description": "retexture: the look in words, when there is no picture.",
                "type": "string"
              },
              "wait_seconds": {
                "default": 45,
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["mesh", "operation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "credits": {
                "additionalProperties": true,
                "type": "object"
              },
              "error": {
                "type": ["object", "null"]
              },
              "id": {
                "type": "string"
              },
              "output": {
                "type": ["object", "null"]
              },
              "status": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
