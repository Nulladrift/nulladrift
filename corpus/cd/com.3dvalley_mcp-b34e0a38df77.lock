        {
          "name": "animate_model",
          "title": "Animate a rigged character",
          "description": "Put animations on a rigged humanoid, whoever rigged it: a rig_model job, a rigged library character (search_assets with rigged true) or the user's own GLB. Everything goes into one GLB, in place, each animation by name, after any the file has, so calls chain. Two ways: animations, up to 20 of the 79 ids in its schema, from the free library (0 credits; Quaternius' CC0 Universal Animation Library, retargeted onto the rig: walks, jogs, sprints, jumps, rolls, sitting, talking, punches, sword and shield moves, pistols, spells, farm work); or prompt, one motion described in words, made by hunyuan-motion (15 credits, up to 12 s; one person moving, in English, no props or second person). Prefer the library (search_assets with type animation finds its ids by words; each result's animate_id is the id to pass); describe a motion only for what it lacks. Waits about 45 s, then returns job_id for get_job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "animations": {
                "description": "Library animations to add, by id, free. idle, walk, jog and sprint are what most games need first.",
                "items": {
                  "enum": ["walk", "walk-formal", "jog", "sprint", "crouch-walk", "carry-walk", "zombie-walk", "jump-start", "jump-air", "jump-land", "ninja-jump-start", "ninja-jump-air", "ninja-jump-land", "roll", "slide-start", "slide", "slide-end", "climb", "swim", "tread-water", "push", "drive", "idle", "talk", "phone", "arms-folded", "yes", "no", "torch", "lantern", "rail", "rail-call", "crouch", "sit-down", "sitting", "sitting-talk", "stand-up", "get-up", "dance", "zombie-idle", "jab", "cross", "hook", "sword-idle", "sword-attack", "sword-slash-1", "sword-slash-2", "sword-slash-3", "sword-combo", "sword-heavy-combo", "sword-dash", "sword-block", "shield-up", "shield-bash", "shield-charge", "shield-broken", "hit-chest", "hit-head", "knockback", "death", "zombie-scratch", "pistol-idle", "pistol-aim", "pistol-shoot", "pistol-reload", "throw", "spell-start", "spell-hold", "spell-cast", "spell-end", "interact", "pick-up", "open-chest", "eat", "repair", "chop-tree", "plant", "water", "harvest"],
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "idempotency_key": {
                "type": "string"
              },
              "max_credits": {
                "minimum": 0,
                "type": "integer"
              },
              "mesh": {
                "description": "The rigged model: job_... (from rig_model), a library id, an upload id or a URL.",
                "type": "string"
              },
              "prompt": {
                "description": "A motion in words, instead of animations: \"waves hello, then sits down cross-legged\". Costs credits.",
                "type": "string"
              },
              "seconds": {
                "default": 5,
                "description": "With prompt: how long the motion lasts.",
                "maximum": 12,
                "minimum": 1,
                "type": "number"
              },
              "seed": {
                "minimum": 0,
                "type": "integer"
              },
              "wait_seconds": {
                "default": 45,
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["mesh"],
            "type": "object"
