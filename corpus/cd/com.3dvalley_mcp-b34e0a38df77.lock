            "additionalProperties": false,
            "properties": {
              "job_id": {
                "type": "string"
              },
              "wait_seconds": {
                "default": 45,
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "credits": {
                "additionalProperties": true,
                "type": "object"
              },
              "error": {
                "type": ["object", "null"]
