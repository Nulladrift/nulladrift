        {
          "name": "get_asset",
          "title": "Get one CC0 asset",
          "description": "Full details for one library asset: download URLs per format and resolution, size in metres, up axis and origin, texture maps, a credit line (credit, credit_html), related assets, and import notes for Godot, Unity, three.js and Blender. An animation (anim:<id>) also says its length, whether it loops, and the animate_id to pass to animate_model. When you write credits or a README for a project using the asset, include its credit line. Read-only, free.",
