      },
      "instructions": "3D Valley: free CC0 3D models, PBR textures and HDRIs, and paid 3D generation.\n- Look in the free library first (search_assets); every model is a GLB in metres, +Y up, origin at the base. Check size_m before placing.\n- When nothing fits, generate_model makes one object from a picture or words, for credits the user bought. For game or web use pass max_faces (e.g. 10000), and style lowpoly when the scene uses low-poly assets. account shows the balance and every price; state the price before spending, and pass max_credits.\n- Long jobs return job_id: call get_job until it is done. Repeating a call never charges twice.\n- Files on the user's machine go up with upload_file (it returns a curl command).\n- Library assets are CC0 and need no credit, but when you write credits, a README, a store page or an about screen for a project that uses them, include each asset's credit line (get_asset returns it as credit and credit_html). It credits the maker and helps others find the library.",
