        {
          "name": "rig_model",
          "title": "Auto-rig a 3D model",
          "description": "Give a humanoid character a skeleton and skin weights, as a GLB ready to pose and animate (tripo-rig 45, meshy-rig 35 credits). Humanoids only: two arms, two legs, standing. tripo-rig (default) takes bone_names (mixamo, unity, unreal, vrm) so the engine's own animations play on it; animations adds up to 5 of Tripo's presets in the same job (17 credits each), all in the GLB. meshy-rig returns an FBX, a walk and a run as well. Best on one closed model standing in a T-pose or A-pose; remesh a generated model first, never after. The mesh is a URL, an upload id, a library id or a job id. Waits about 45 s, then returns job_id for get_job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "animations": {
                "description": "tripo-rig only: preset:idle, preset:walk, preset:run, preset:jump, preset:turn, preset:climb, preset:dive, preset:slash, preset:shoot, preset:hurt, preset:fall.",
                "items": {
                  "enum": ["preset:idle", "preset:walk", "preset:run", "preset:jump", "preset:turn", "preset:climb", "preset:dive", "preset:slash", "preset:shoot", "preset:hurt", "preset:fall"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "bone_names": {
                "default": "tripo",
                "enum": ["tripo", "mixamo", "unity", "unreal", "vrm"],
                "type": "string"
              },
              "idempotency_key": {
                "type": "string"
              },
              "max_credits": {
                "minimum": 0,
                "type": "integer"
              },
              "mesh": {
                "description": "The model: URL, upl_..., library id, or job_...",
                "type": "string"
              },
              "model": {
                "default": "tripo-rig",
                "enum": ["tripo-rig", "meshy-rig"],
                "type": "string"
              },
