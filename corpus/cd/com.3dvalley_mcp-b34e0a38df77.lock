          "digest": "sha256:f193c1a164d5477cb2a7f657ed57faab4a10c3a32b150642c877b6a7ca51f29f"
        },
        {
          "name": "generate_model",
          "title": "Generate a 3D model",
          "description": "Make one 3D object (never a scene) as a textured GLB, from a picture (image) or a description (prompt). Costs credits, which the user bought: image models trellis-2 5, trellis-2-pro 15, hunyuan-3d-3-1-pro 90, tripo-3-1 50, tripo-3-1-detailed 100; from a prompt add the picture model (flux-2-klein 1). Pass max_credits to refuse anything dearer. For a game or the web pass max_faces (5000-20000; the default is 200,000 triangles), and from a prompt style lowpoly to match low-poly kits. The GLB stands on its base at the origin, like library models. Waits about 45 s, then returns job_id for get_job if it is not done. Calling again with the same arguments resumes the same job and never charges twice; pass a new idempotency_key to make another one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "Only to make a second, different job from identical arguments.",
                "type": "string"
              },
              "image": {
                "description": "A picture of one object: an https URL, a data: URI, an upload id from upload_file, or a job id.",
                "type": "string"
              },
              "image_model": {
                "description": "The picture model for a prompt: flux-2-klein (default), muse-image, gpt-image-2-5.",
                "type": "string"
              },
              "max_credits": {
                "description": "Refuse the job if it would cost more.",
                "minimum": 0,
                "type": "integer"
              },
              "max_faces": {
                "description": "Most triangles in the model, at no extra cost: 5,000-20,000 for game or web use (the default is 200,000).",
                "maximum": 1000000,
                "minimum": 5000,
                "type": "integer"
              },
              "model": {
                "description": "Default trellis-2. See account for every model and its price.",
                "type": "string"
              },
              "prompt": {
                "description": "A description of one object: \"a weathered wooden barrel with iron bands\".",
                "type": "string"
              },
              "seed": {
                "minimum": 0,
                "type": "integer"
              },
              "style": {
                "description": "From a prompt: lowpoly draws a flat-shaded, flat-colour game asset to match low-poly kits; stylized a hand-painted look.",
                "enum": ["realistic", "lowpoly", "stylized"],
                "type": "string"
              },
              "wait_seconds": {
                "default": 45,
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "credits": {
                "additionalProperties": true,
                "type": "object"
              },
              "error": {
                "type": ["object", "null"]
              },
              "id": {
                "type": "string"
              },
              "output": {
                "type": ["object", "null"]
              },
              "status": {
                "type": "string"
              }
            },
