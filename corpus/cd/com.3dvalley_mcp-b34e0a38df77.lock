        {
          "name": "search_assets",
          "title": "Search free CC0 3D assets, animations and sounds",
          "description": "Search the free CC0 library of 3D models, PBR textures, HDRIs, character animations, sound effects and music by meaning and filters. Every model is a GLB measured in metres, +Y up, origin at the base. Every animation (type animation) is a humanoid clip in place, with its length, whether it loops, and animate_id: pass that id in animate_model's animations to put it on any rigged humanoid, free. Every sound (type audio) has its length, loudness in LUFS and whether it loops, measured from the file, and audio_url, an MP3 any browser plays; loop_url is an AAC M4A of a loop, for Safari; the MP3 decodes to its exact length in Chrome and Firefox. Check size_m before placing an asset; use min_size_m >= 2 for floors and walls. previews (max 6) attaches thumbnails, which is cheaper than downloading the wrong asset. Each result has match (strong, good or weak); when none is better than weak the answer says so, and generate_model (generate_sound_effect or generate_music for sounds) is the way to get it. Read-only, free with a free account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "animated": {
                "type": "boolean"
              },
              "category": {
                "description": "A category slug; see the categories in the results. Sounds: sfx, ui, ambience, voice, music. Animations: move, idle, fight, ranged, work.",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page.",
                "type": "string"
              },
              "format": {
                "description": "A file format we serve it in.",
                "enum": ["glb", "zip", "hdr", "exr", "png", "jpg", "mp3", "m4a", "ogg", "wav"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "loop": {
                "description": "Sounds: true for one that loops without a click (music beds, ambience), false for one-shots. Animations: true for a cycle (walk, idle), false for one that plays once (jump, sword combo).",
                "type": "boolean"
              },
              "maps": {
                "description": "Must have all of these maps.",
                "items": {
                  "enum": ["base_color", "normal", "roughness", "metallic", "ao", "height", "displacement"],
                  "type": "string"
                },
                "type": "array"
              },
              "max_seconds": {
                "description": "Sounds and animations: at most this long.",
                "minimum": 0,
                "type": "number"
              },
              "max_size_m": {
                "description": "The largest side at most this many metres.",
                "minimum": 0,
                "type": "number"
              },
              "max_tris": {
                "description": "At most this many triangles (models).",
                "minimum": 0,
                "type": "integer"
              },
              "min_res": {
                "description": "Smallest texture resolution: 1k, 2k, 4k.",
                "type": "string"
              },
              "min_seconds": {
                "description": "Sounds and animations: at least this long.",
                "minimum": 0,
                "type": "number"
              },
              "min_size_m": {
                "description": "The largest side at least this many metres. Use 2 or more for floors and walls.",
                "minimum": 0,
                "type": "number"
              },
              "min_tris": {
                "description": "At least this many triangles (models).",
                "minimum": 0,
                "type": "integer"
              },
              "pack": {
                "description": "A pack id from a result (\"kn:mini-skate\"): only assets from that kit, to keep a game in one style.",
                "type": "string"
              },
              "previews": {
                "default": 0,
                "description": "Attach this many thumbnails as images, so you can look before downloading.",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "What you need, in words: \"wooden barrel\", \"mossy rock\", \"sci-fi crate\", \"footsteps on gravel\", \"calm forest music\".",
                "type": "string"
              },
              "rigged": {
                "type": "boolean"
              },
              "similar_to": {
                "description": "An asset id: the nearest to it by meaning.",
                "type": "string"
              },
              "sort": {
                "enum": ["relevance", "popular", "newest"],
                "type": "string"
              },
              "source": {
                "enum": ["polyhaven", "ambientcg", "kenney", "kaykit", "quaternius", "gobkit", "smithsonian", "met", "khronos", "openhdri", "cgbookcase", "texturecan"],
                "type": "string"
              },
              "style": {
                "enum": ["realistic", "stylized", "lowpoly", "scan"],
                "type": "string"
              },
              "type": {
                "enum": ["model", "texture", "hdri", "audio", "animation"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
