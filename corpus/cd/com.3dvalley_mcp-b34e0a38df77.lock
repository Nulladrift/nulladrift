        {
          "name": "search_assets",
          "title": "Search free CC0 3D assets",
          "description": "Search the free CC0 library of 3D models, PBR textures and HDRIs by meaning and filters. Every model is a GLB measured in metres, +Y up, origin at the base. Check size_m before placing an asset; use min_size_m >= 2 for floors and walls. previews (max 6) attaches thumbnails, which is cheaper than downloading the wrong asset. Each result has match (strong, good or weak); when none is better than weak the answer says so, and generate_model is the way to get the object. Read-only, free with a free account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "animated": {
                "type": "boolean"
              },
              "category": {
                "description": "A category slug; see the categories in the results.",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page.",
                "type": "string"
              },
              "format": {
                "description": "A file format we serve it in.",
                "enum": ["glb", "zip", "hdr", "exr", "png", "jpg"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "maps": {
                "description": "Must have all of these maps.",
                "items": {
                  "enum": ["base_color", "normal", "roughness", "metallic", "ao", "height", "displacement"],
                  "type": "string"
                },
                "type": "array"
              },
              "max_size_m": {
                "description": "The largest side at most this many metres.",
                "minimum": 0,
                "type": "number"
              },
              "max_tris": {
                "description": "At most this many triangles (models).",
                "minimum": 0,
                "type": "integer"
              },
              "min_res": {
                "description": "Smallest texture resolution: 1k, 2k, 4k.",
                "type": "string"
              },
              "min_size_m": {
                "description": "The largest side at least this many metres. Use 2 or more for floors and walls.",
                "minimum": 0,
                "type": "number"
              },
              "min_tris": {
                "description": "At least this many triangles (models).",
                "minimum": 0,
                "type": "integer"
              },
              "pack": {
                "description": "A pack id from a result (\"kn:mini-skate\"): only assets from that kit, to keep a game in one style.",
                "type": "string"
              },
              "previews": {
                "default": 0,
                "description": "Attach this many thumbnails as images, so you can look before downloading.",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "What you need, in words: \"wooden barrel\", \"mossy rock\", \"sci-fi crate\".",
                "type": "string"
              },
              "rigged": {
                "type": "boolean"
              },
              "similar_to": {
                "description": "An asset id: the nearest to it by meaning.",
                "type": "string"
              },
              "sort": {
                "enum": ["relevance", "popular", "newest"],
                "type": "string"
              },
              "source": {
                "enum": ["polyhaven", "ambientcg", "kenney", "kaykit", "quaternius", "gobkit", "smithsonian", "met", "khronos", "openhdri", "cgbookcase", "texturecan"],
                "type": "string"
              },
              "style": {
                "enum": ["realistic", "stylized", "lowpoly", "scan"],
                "type": "string"
              },
              "type": {
                "enum": ["model", "texture", "hdri"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "next_cursor": {
                "type": ["string", "null"]
              },
              "results": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
