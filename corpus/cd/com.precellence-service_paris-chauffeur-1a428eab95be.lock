        {
          "name": "voir_conditions",
          "title": "Service conditions — Precellence Service",
          "description": "Service conditions of Precellence Service, generated from the tariff and rules in force: vehicle classes (passengers, luggage, minimum fare, hourly rate), fixed-price zones, long distance, hourly hire (chauffeur at your disposal by the hour, half day or full day: minimum hours, sold durations, block prices per class, km included, overtime), intermediate stops (stopovers, legs, drop-offs on the way, when the tariff in force has them: price per hour started on short trips, legs per km on long trips, bookable on the website only, never priced by obtenir_devis), options, waiting time, cancellation and refunds, booking notice, payment (website only), contacts and links. Read-only; no booking, no payment. FR : conditions du service, arrêts intermédiaires (étapes, escales) compris. AR : شروط الخدمة. ES : condiciones del servicio.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
