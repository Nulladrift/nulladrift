                "description": "Language of labels. One of the 7 website languages: fr, en, ar, es, tr, ru, zh. Texts exist in fr, en, ar, es; tr, ru, zh get English texts (field \"lang\" of the answer = language served). Names read from the tariff (classes, zones, destinations) that have no version in the language served are given in English and flagged by \"name_lang\". Booking link: booking form in fr, en, ar, es; English booking form for tr, ru, zh.",
                "enum": ["fr", "en", "ar", "es", "tr", "ru", "zh"],
                "type": "string"
              }
            },
            "type": "object"
          },
