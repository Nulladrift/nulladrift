      "serverInfo": {
        "name": "precellence-service",
        "title": "Precellence Service — Paris chauffeur prices",
        "version": "1.1.0",
        "websiteUrl": "https://precellence-service.com/en/developpeurs",
        "icons": [
          {
            "src": "https://precellence-service.com/images/marque/png/precellence-icon-noir-512.png",
