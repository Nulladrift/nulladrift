      "instructions": "Precellence Service is a private chauffeur company in Paris. Use obtenir_devis to price a trip (prices include VAT, per vehicle) and voir_conditions for classes, zones, options, waiting, cancellation and contacts. Never book or take a payment in the conversation: give the traveller the booking_url; the website recomputes the same price, guarantees it for 20 minutes and takes the payment. For a chauffeur by the hour, for a half day or for the day (hourly hire, \"mise à disposition\"), call obtenir_devis with type \"hourly\" and duration (3 to 12 hours); the pickup can be anywhere in metropolitan France, at the same prices as Paris; from a ski resort (reason ski_season_package: give the resort page) or outside metropolitan France (reason pickup_outside_service_area) the answer is \"on_request\": show the reason and the contacts. Show the price per vehicle, what is included (waiting, 40 km per hour, tolls, fuel), the overtime rule and the booking_url, which opens the booking form with the duration and class set. The price of a duration comes from the sold blocks (3, 4, 5, 6, 8, 12 hours) and can be lower than hours × hourly rate: do not multiply the hourly rate. More than 12 hours, several days or a weekly chauffeur: written quote through the quote form in contact. Online booking needs at least 2 h notice; when status is \"on_request\", show the reason and the contacts. When status is \"quota_reached\", this is not an outage: the free monthly calculation quota shared by all assistants is used up; show the message and give booking_url (the website computes the exact price at once); if the answer asks for it, give the full postal address with the postcode. Error -31429 means too many requests at once: wait retry_after_seconds or give booking_url.",
      "tools": [
        {
          "name": "obtenir_devis",
          "title": "Get a quote — transfer or hourly chauffeur hire, Paris (Precellence Service)",
          "description": "Prices including VAT, per vehicle, for a private chauffeur trip in Paris and the Île-de-France region (airports, stations, hotels, addresses), or for hourly chauffeur hire, computed by the Precellence Service website pricing engine. Hourly hire (type \"hourly\": chauffeur at your disposal by the hour, half day or full day, \"as directed\"; French « mise à disposition »): 3 to 12 h in one day, waiting, 40 km per hour, tolls and fuel included; pickup anywhere in metropolitan France at Paris prices; from a ski resort or abroad: \"on_request\" with the reason, contacts and a pre-filled quote form; over 12 h or several days: written quote. Returns one price per vehicle class (or \"on_request\" with a clear reason), and a pre-filled booking link (booking_url) to the website. This tool does NOT book and does NOT take any payment: the traveller books and pays on the website only, where the same price is recomputed and then guaranteed. No card details are used or needed by this tool. Addresses are plain text, ideally the full postal address with the postcode (e.g. \"15 avenue Montaigne, 75008 Paris\"); a station, airport or terminal name also works. Date and time are Paris local time. A well-known Paris place (\"Place de l'Opéra\", palaces and 5-star hotels such as the \"Ritz\"), a street with its city or postcode, an arrondissement alone (\"Paris 13\", \"75013\": its town hall), a city alone or a published destination alone (\"Lyon\", \"Reims\") gives a price with exact_address_required (address_estimate): the website asks for the exact address before payment; price_is_estimate is true only when that price may still change with the exact address, false for a fixed price (Paris ↔ CDG / Orly, Paris ↔ Lyon). A name shared by several places (\"Valence\", \"Saint-Denis\", \"La Rochelle\", \"13e arrondissement\", a street found in several cities) returns status \"on_request\", reason \"address_ambiguous\" and the candidates (each reason.candidates[].value can be sent back as from / to); the tool never picks one by default. Shared server limits: 30 computed quotes per minute and 5000 units per day for all users; identical requests within 10 minutes return the same cached answer. Fair use: The automatic quote (public API and MCP server) is free and shared by all assistants. To keep it free, address and route computations are capped each month for all assistants together, and bursts are limited (60 computed quotes per minute per IP address for the API, 30 per minute for the whole MCP server). Always answered, even at the monthly limit: trips between a Paris address with a postcode (75001 to 75020, 75116) and an airport, a main Paris railway station, Disneyland, La Défense or Versailles, which have a fixed price, and hourly chauffeur hire (by the hour, half day or full day, wherever it starts), which needs no route computation. The places of the tariff (airports, stations, destinations) are recognised by their name, and French addresses with a postcode are located with the Base Adresse Nationale (IGN Géoplateforme, Licence Ouverte). At the monthly limit: a normal answer, not an error, with status \"quota_reached\", a plain-language message, the pre-filled booking link (booking_url) and, when the trip has a fixed price, that price. On a burst: HTTP 429 (API) or JSON-RPC error -31429 (MCP), with the waiting time (Retry-After) and the same link. What to do: give the full postal address with the postcode (for example \"15 avenue Montaigne, 75008 Paris\") rather than a hotel name, then send the traveller to booking_url: the website computes the exact price at once. A block is never an outage: the website and the booking link always work. FR : devis TTC par véhicule, transfert ou mise à disposition (chauffeur à l'heure), sans réservation ni paiement (lien booking_url vers le site). AR : عرض سعر شامل الضريبة لكل سيارة، دون حجز أو دفع (رابط booking_url إلى الموقع). ES : presupuesto con IVA por vehículo, sin reserva ni pago (enlace booking_url al sitio web).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "class": {
                "description": "Vehicle class to pre-select in the booking link (business = Mercedes E-Class, electric = Mercedes EQE, first = Mercedes S-Class, van = Mercedes V-Class, ev = Mercedes EQV; special = on request).",
                "enum": ["business", "electric", "first", "van", "ev", "special"],
                "type": "string"
              },
              "date": {
                "description": "Pickup date, Paris, YYYY-MM-DD.",
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "duration": {
                "description": "Hours of chauffeur hire for the day, 3 to 12, required when type is \"hourly\". Sold blocks: 3, 4, 5, 6, 8, 12 hours (e.g. 4 = half day, 8 = full day); any other whole number of hours is priced as the sold block below plus the extra hours at the hourly rate, never above the next block. Included: waiting, 40 km per hour, tolls, fuel; overtime at the same hourly rate per started hour. The price of a block can be lower than hours × hourly rate.",
                "maximum": 12,
                "minimum": 3,
                "type": "integer"
              },
              "from": {
                "description": "Pickup, as text: full postal address with the postcode (number, street, postcode, city) — best —, or a station, airport or terminal name; a hotel name alone may need a paid lookup (see fair use).",
                "maxLength": 300,
                "type": "string"
              },
              "lang": {
                "default": "fr",
                "description": "Language of messages and of the booking link. One of the 7 website languages: fr, en, ar, es, tr, ru, zh. Texts exist in fr, en, ar, es; tr, ru, zh get English texts (field \"lang\" of the answer = language served). Names read from the tariff (classes, zones, destinations) that have no version in the language served are given in English and flagged by \"name_lang\". Booking link: booking form in fr, en, ar, es; English booking form for tr, ru, zh.",
                "enum": ["fr", "en", "ar", "es", "tr", "ru", "zh"],
                "type": "string"
              },
              "pax": {
                "description": "Number of passengers, 1 to 7.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "time": {
                "description": "Pickup time, Paris local time, HH:MM (9:30 and 9h30 accepted).",
                "pattern": "^\\d{1,2}[:hH]\\d{2}$",
                "type": "string"
              },
              "to": {
                "description": "Drop-off, as text, same advice as \"from\". Required unless type is \"hourly\".",
                "maxLength": 300,
                "type": "string"
              },
              "type": {
                "default": "oneway",
                "description": "\"oneway\" (transfer, default) or \"hourly\": hourly chauffeur hire, a chauffeur at your disposal by the hour, half day or full day (\"as directed\"; French « mise à disposition », « chauffeur à l'heure ») — \"to\" not needed; the pickup (\"from\") can be anywhere in metropolitan France, at the same prices as Paris; from a ski resort (season packages) or outside metropolitan France: status \"on_request\".",
                "enum": ["oneway", "hourly"],
                "type": "string"
              }
            },
            "required": ["date", "from", "time"],
            "type": "object"
          },
