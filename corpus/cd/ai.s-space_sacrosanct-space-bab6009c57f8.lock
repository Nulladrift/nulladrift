{
  "lockfileVersion": 2,
  "subjects": {
    "ai.s-space/sacrosanct-space": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://s-space.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "sacrosanct-space",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "complete_purchase",
          "title": "Complete purchase",
          "description": "After paying with prepare_purchase.payment_plan, submit the mined transaction hash with the payment_id, purchase_ticket, and commerce_scope. Verifies the payment on-chain, then executes the purchased function and returns its result.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "args": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "buyer": {
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "commerce_scope": {
                "minLength": 16,
                "type": "string"
              },
              "function_name": {
                "pattern": "^[A-Za-z0-9._-]{1,128}$",
                "type": "string"
              },
              "job_id": {
                "pattern": "^[A-Za-z0-9._-]{1,128}$",
                "type": "string"
              },
              "payment_id": {
                "minLength": 16,
                "type": "string"
              },
              "purchase_ticket": {
                "minLength": 16,
                "type": "string"
              },
              "tx_hash": {
                "pattern": "^0x[a-fA-F0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["buyer", "commerce_scope", "function_name", "job_id", "payment_id", "purchase_ticket", "tx_hash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0bf759c219e73908253ae361ec54678a93d6cca249bf407be1ef756df2c89769"
        },
        {
          "name": "get_purchase_status",
          "title": "Get purchase status",
          "description": "Recover a purchase after a dropped connection: reports whether a (payment_id, tx_hash) pair was already consumed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "payment_id": {
                "minLength": 16,
                "type": "string"
              },
              "tx_hash": {
                "pattern": "^0x[a-fA-F0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["payment_id", "tx_hash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:af6d324e4b978452e15aad9f6606ec89cdb6355c507fcfc5f244c55b2bac489c"
        },
        {
          "name": "get_service_details",
          "title": "Get service details",
          "description": "Get a service's functions, inputs, price, purchase model, and the commerce_scope needed to buy. Refuses account-bound models with ACCOUNT_REQUIRED.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "creator": {
                "pattern": "^[a-z0-9][a-z0-9_-]{0,63}$",
                "type": "string"
              },
              "slug": {
                "pattern": "^[a-z0-9][a-z0-9_-]{0,63}$",
                "type": "string"
              }
            },
            "required": ["creator", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cabb0e36448e280c7a37aa6efb09ec8bc2c881312b88eb92b0144db92d1baebe"
        },
        {
          "name": "prepare_purchase",
          "title": "Prepare purchase",
          "description": "Prepare a guest per-call purchase: returns the authoritative price split, payment_id, purchase_ticket, reissued commerce_scope, and payment_plan. Pay by sending payment_plan.calls (to/value/data verbatim) from the buyer wallet as ONE atomic batch transaction on Base Mainnet — the platform call's data carries the required payment_id stamp; separate or re-encoded transfers are refused and not refunded.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "buyer": {
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "commerce_scope": {
                "minLength": 16,
                "type": "string"
              },
              "job_id": {
                "pattern": "^[A-Za-z0-9._-]{1,128}$",
                "type": "string"
              }
            },
            "required": ["buyer", "commerce_scope", "job_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:85eb6e1c60994dc23c9d63fc974314e69bfc77ea0bf4ac9953bf7401dce611ae"
        },
        {
          "name": "search_services",
          "title": "Search services",
          "description": "Search the live Sacrosanct Space marketplace. Returns published service cards (creator, slug, title, summary, model, price in USDC per call). Only publicly listed Spaces appear.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "default": "",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cb3036efda2f9856c9bf6ecff0a3f84bfc0b4610e4607d79b78feed590e6b8d0"
        }
      ],
      "digest": "sha256:be85e9c4d498ecb594d470a48beaee5a0c3b239f67fa0b2ee9cb3fc2d1f7ef3e"
    }
  }
}
