      "instructions": "Mind Polling polls AI models the way pollsters poll people: a poll asks fixed questions of chosen models on a schedule and records every answer. Public polls need no key: list_polls, then get_results. For someone without an account, price_poll prices a poll and draft_poll gives them a private link to it, filled in, which they open, check and start themselves. For the account holder's own polls, the person signs this app in (OAuth: the first tool that needs an account asks them to), or the MCP client sends their API key as Authorization: Bearer mp_live_... (made at https://mindpolling.com/app/settings/api); call get_me first. create_poll is free; estimate_poll says what running costs; run_poll_now and start_poll spend the account's balance and must carry max_cost_usd, so confirm the amount with the person first. Results can be read as they stood at a past moment with as_of. Errors carry a code, a suggestion and next_steps. When something blocks you or answers wrong, offer to report it with give_feedback: show the person the message you would send, and send it only if they agree (never a key, a private link or anything private about them). Guide: https://mindpolling.com/docs/api.md.",
      "tools": [
        {
          "name": "create_poll",
          "title": "Create a poll",
          "description": "Create a poll from a definition: questions and their wordings, the models to ask (provider and model from list_models), samples per cell, search depth, schedule and dates. It is saved as a draft and costs nothing; call estimate_poll for its cost, then start_poll or run_poll_now. A test key makes a test poll, which runs on a stub model and charges nothing. Send an Idempotency-Key so a retry cannot make two polls. (POST /api/v1/polls)",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "change_note": {
                "default": "",
                "description": "Why this version differs from the last, kept in the poll's history.",
                "maxLength": 500,
                "type": "string"
              },
              "copied_from": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A new poll only: the poll it was copied from (get_poll's id), recorded when you can read that poll. A public copy says where it came from."
              },
              "delivery": {
                "description": "realtime (the default), or batch: scheduled runs ask the models that can be batched (Anthropic) through the providers' batch APIs, cheaper, with answers arriving up to 2 hours after the run starts; run_poll_now is always real time. OpenAI and Google models are asked at their flex tier, the same price, in real time, either way. Left out: unchanged.",
                "enum": ["realtime", "batch"],
                "type": "string"
              },
              "description": {
                "default": "",
                "description": "What the poll is for, or empty.",
                "maxLength": 2000,
                "type": "string"
              },
              "end_date": {
                "anyOf": [
                  {
                    "format": "date",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The last day it runs, on or after start_date. A poll may run for as long as its owner chooses."
              },
              "index_name": {
                "default": "",
                "description": "A name for the composite of the poll's Better-Worse index questions, such as \"AI Economy Index\"; empty for \"Composite Better-Worse index\". Shown only when two or more questions have the index.",
                "maxLength": 80,
                "type": "string"
              },
              "mentions": {
                "description": "Free-text questions only: up to 6 names per question whose mention the results count, per model, as the share of answers that name each (and the share that name none of them), with a 95% range. A name counts once per answer, for any reason, warnings included. Left out: unchanged (none for a new poll).",
                "items": {
                  "properties": {
                    "names": {
                      "description": "Up to 6 names for the question, each with the other forms that count as it.",
                      "items": {
                        "properties": {
                          "case": {
                            "description": "as written (the default): a name that begins with a capital must begin with one in the reply, so a brand that is also a common word is not counted for the word; any: any case.",
                            "enum": ["as written", "any"],
                            "type": "string"
                          },
                          "name": {
                            "description": "The name as it is usually written, such as Alaska Airlines.",
                            "maxLength": 80,
                            "minLength": 1,
                            "type": "string"
                          },
                          "variants": {
                            "default": [],
                            "description": "Other forms that count as it, such as Alaska Air.",
                            "items": {
                              "maxLength": 80,
                              "minLength": 1,
                              "type": "string"
                            },
                            "maxItems": 10,
                            "type": "array"
                          }
                        },
                        "required": ["name"],
                        "type": "object"
                      },
                      "maxItems": 6,
                      "minItems": 1,
                      "type": "array"
                    },
                    "question": {
                      "description": "The question's position, from 0.",
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["names", "question"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "panel": {
                "description": "1 to 30 models to ask, each once.",
                "items": {
                  "properties": {
                    "model": {
                      "description": "The model id, as list_models gives it.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "provider": {
                      "description": "The provider, as list_models gives it.",
                      "enum": ["anthropic", "openai", "google", "xai", "openrouter", "stub"],
                      "type": "string"
                    },
                    "reasoning_effort": {
                      "anyOf": [
                        {
                          "maxLength": 20,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "The reasoning setting to send, or null for the model's lowest."
                    },
                    "search": {
                      "default": false,
                      "description": "Whether the model may search the web, at the poll's search_depth. Only where list_models offers that depth.",
                      "type": "boolean"
                    },
                    "temperature": {
                      "anyOf": [
                        {
                          "maximum": 2,
                          "minimum": 0,
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "The temperature to send, or null for the provider's default."
                    }
                  },
                  "required": ["model", "provider"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "questions": {
                "description": "1 to 50 questions, in order.",
                "items": {
                  "properties": {
                    "answer_type": {
                      "description": "choice (pick one option), scale (a whole number between scale_min and scale_max), number, or free_text.",
