{
  "lockfileVersion": 2,
  "subjects": {
    "com.mindpolling/mindpolling": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mindpolling.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "mindpolling",
        "title": "Mind Polling",
        "version": "1.0.0",
        "icons": [
          {
            "src": "https://mindpolling.com/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Mind Polling polls AI models the way pollsters poll people: a poll asks fixed questions of chosen models on a schedule and records every answer. Public polls need no key: list_polls, then get_results. For the account holder's own polls, the MCP client must send their API key as Authorization: Bearer mp_live_... (made at https://mindpolling.com/app/settings/api); call get_me first. create_poll is free; estimate_poll says what running costs; run_poll_now and start_poll spend the account's balance and must carry max_cost_usd, so confirm the amount with the person first. Results can be read as they stood at a past moment with as_of. Errors carry a code, a suggestion and next_steps. Guide: https://mindpolling.com/docs/api.md.",
      "tools": [
        {
          "name": "create_poll",
          "title": "Create a poll",
          "description": "Create a poll from a definition: questions and their wordings, the models to ask (provider and model from list_models), samples per cell, search depth, schedule and dates. It is saved as a draft and costs nothing; call estimate_poll for its cost, then start_poll or run_poll_now. A test key makes a test poll, which runs on a stub model and charges nothing. Send an Idempotency-Key so a retry cannot make two polls. (POST /api/v1/polls)",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "change_note": {
                "default": "",
                "description": "Why this version differs from the last, kept in the poll's history.",
                "maxLength": 500,
                "type": "string"
              },
              "delivery": {
                "description": "realtime (the default), or batch: scheduled runs ask the models that can be batched (Anthropic) through the providers' batch APIs, cheaper, with answers arriving up to 2 hours after the run starts; run_poll_now is always real time. OpenAI and Google models are asked at their flex tier, the same price, in real time, either way. Left out: unchanged.",
                "enum": ["realtime", "batch"],
                "type": "string"
              },
              "description": {
                "default": "",
                "description": "What the poll is for, or empty.",
                "maxLength": 2000,
                "type": "string"
              },
              "end_date": {
                "anyOf": [
                  {
                    "format": "date",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The last day it runs, at most 90 days after start_date."
              },
              "index_name": {
                "default": "",
                "description": "A name for the composite of the poll's Better-Worse index questions, such as \"AI Economy Index\"; empty for \"Composite Better-Worse index\". Shown only when two or more questions have the index.",
                "maxLength": 80,
                "type": "string"
              },
              "panel": {
                "description": "1 to 30 models to ask, each once.",
                "items": {
                  "properties": {
                    "model": {
                      "description": "The model id, as list_models gives it.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "provider": {
                      "description": "The provider, as list_models gives it.",
                      "enum": ["anthropic", "openai", "google", "xai", "openrouter", "stub"],
                      "type": "string"
                    },
                    "reasoning_effort": {
                      "anyOf": [
                        {
                          "maxLength": 20,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "The reasoning setting to send, or null for the model's lowest."
                    },
                    "search": {
                      "default": false,
                      "description": "Whether the model may search the web, at the poll's search_depth. Only where list_models offers that depth.",
                      "type": "boolean"
                    },
                    "temperature": {
                      "anyOf": [
                        {
                          "maximum": 2,
                          "minimum": 0,
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "The temperature to send, or null for the provider's default."
                    }
                  },
                  "required": ["model", "provider"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "questions": {
                "description": "1 to 50 questions, in order.",
                "items": {
                  "properties": {
                    "answer_type": {
                      "description": "choice (pick one option), scale (a whole number between scale_min and scale_max), number, or free_text.",
                      "enum": ["choice", "scale", "number", "free_text"],
                      "type": "string"
                    },
                    "measure": {
                      "anyOf": [
                        {
                          "enum": ["diffusion"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "diffusion: results also show a -100 to +100 Better-Worse index, the share answering Better less the share answering Worse (0 is balanced: as many Better as Worse answers, or all About the same). Only on a choice question whose options are exactly Better, About the same and Worse, in that order; null otherwise."
                    },
                    "number_max": {
                      "default": null,
                      "description": "Number questions: the highest answer accepted, or null.",
                      "type": ["number", "null"]
                    },
                    "number_min": {
                      "default": null,
                      "description": "Number questions: the lowest answer accepted, or null.",
                      "type": ["number", "null"]
                    },
                    "number_unit": {
                      "default": "",
                      "description": "Number questions: the unit, such as US dollars or %, or empty.",
                      "maxLength": 20,
                      "type": "string"
                    },
                    "options": {
                      "default": [],
                      "description": "Choice questions: 2 to 12 options, shown in a fresh random order on every call.",
                      "items": {
                        "maxLength": 300,
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 12,
                      "type": "array"
                    },
                    "scale_max": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Scale questions: the highest value, at most 20 above scale_min."
                    },
                    "scale_max_label": {
                      "default": "",
                      "description": "Scale questions: what the highest value means.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "scale_min": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Scale questions: the lowest value."
                    },
                    "scale_min_label": {
                      "default": "",
                      "description": "Scale questions: what the lowest value means.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "variations": {
                      "description": "1 to 100 wordings of the question; each is asked samples_per_cell times of every model.",
                      "items": {
                        "properties": {
                          "label": {
                            "description": "A short name for this wording, shown beside its results.",
                            "maxLength": 80,
                            "minLength": 1,
                            "type": "string"
                          },
                          "place": {
                            "anyOf": [
                              {
                                "description": "The place this wording asks about, from Google Places. Models never see it; the wording's text names the place.",
                                "properties": {
                                  "country": {
                                    "anyOf": [
                                      {
                                        "pattern": "^[A-Z]{2}$",
                                        "type": "string"
                                      },
                                      {
                                        "type": "null"
                                      }
                                    ],
                                    "description": "The ISO 3166-1 country code, such as US, or null."
                                  },
                                  "id": {
                                    "description": "Google's place id.",
                                    "pattern": "^[A-Za-z0-9_-]{10,1000}$",
                                    "type": "string"
                                  },
                                  "kind": {
                                    "description": "country, region (a state or province), county, city, or postal_code (a ZIP or postal code, the finest).",
                                    "enum": ["country", "region", "county", "city", "postal_code"],
                                    "type": "string"
                                  },
                                  "name": {
                                    "description": "The place's name, as Google formats its address, such as \"Alaska, USA\".",
                                    "maxLength": 120,
                                    "minLength": 1,
                                    "type": "string"
                                  },
                                  "region": {
                                    "anyOf": [
                                      {
                                        "pattern": "^[A-Z]{2}-[A-Z0-9]{1,3}$",
                                        "type": "string"
                                      },
                                      {
                                        "type": "null"
                                      }
                                    ],
                                    "description": "The ISO 3166-2 code of the state or province it is in, such as US-AK, or null."
                                  }
                                },
                                "required": ["country", "id", "kind", "name", "region"],
                                "type": "object"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          },
                          "system_prompt": {
                            "anyOf": [
                              {
                                "maxLength": 4000,
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "A system prompt for this wording alone, in place of the poll's; null or empty uses the poll's."
                          },
                          "text": {
                            "description": "The question exactly as the model is asked it.",
                            "maxLength": 4000,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["label", "text"],
                        "type": "object"
                      },
                      "maxItems": 100,
                      "minItems": 1,
                      "type": "array"
                    }
                  },
                  "required": ["answer_type", "variations"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "restored_from": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The earlier version this one was started from, or null."
              },
              "run_time": {
                "anyOf": [
                  {
                    "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The time of day it runs, HH:MM in time_zone; null runs from the moment it is started."
              },
              "run_weekday": {
                "anyOf": [
                  {
                    "maximum": 6,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Weekly polls: the day it runs, 0 = Sunday."
              },
              "sample_percent": {
                "description": "The share of the poll's wordings each scheduled run asks, 1 to 100 percent; every wording is asked once before any is asked again. Left out: unchanged (100 for a new poll). run_poll_now asks this share with share=true, every wording otherwise.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "samples_per_cell": {
                "description": "How many times each model is asked each wording per run, 1 to 50: more samples, narrower ranges.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "schedule": {
                "description": "once, daily or weekly.",
                "enum": ["once", "daily", "weekly"],
                "type": "string"
              },
              "search_depth": {
                "default": 1,
                "description": "Searches allowed per answer, for every model with search on.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "start_date": {
                "anyOf": [
                  {
                    "format": "date",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The first day it runs, YYYY-MM-DD in time_zone; needs run_time."
              },
              "system_prompt": {
                "default": "",
                "description": "The system prompt every wording is asked under unless it has its own; empty for none.",
                "maxLength": 4000,
                "type": "string"
              },
              "time_zone": {
                "default": "America/Anchorage",
                "description": "The IANA time zone of its dates and run time.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "description": "The poll's title.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["panel", "questions", "samples_per_cell", "schedule", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a poll"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e4b11551d7781fdf148c9ce663c08ae68c8dd5ad82ad7aed142742d1c9bf9e5b"
        },
        {
          "name": "create_webhook",
          "title": "Create a webhook",
          "description": "Register an https URL to receive events as Standard Webhooks: a POST with webhook-id, webhook-timestamp and webhook-signature (v1, HMAC-SHA256 of id.timestamp.body with the secret returned here, once). scope mine sends your own polls' events, public every public poll's; poll_id narrows it to one poll. Only events after it is made are sent. Answer 2xx to acknowledge; failures are retried for about three days, and 410 stops deliveries. (POST /api/v1/webhooks)",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "events": {
                "default": ["run.settled", "poll.published", "poll.unpublished", "poll.versioned", "results.revised"],
                "description": "Which event types to send. Default: all.",
                "items": {
                  "enum": ["run.settled", "poll.published", "poll.unpublished", "poll.versioned", "results.revised"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "poll_id": {
                "anyOf": [
                  {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only this poll's events."
              },
              "scope": {
                "default": "mine",
                "description": "mine: your own polls. public: every public poll.",
                "enum": ["mine", "public"],
                "type": "string"
              },
              "url": {
                "description": "Your receiver's https URL.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a webhook"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f759daad21e668e9fecca9d1f0cceefdbeb02087e11e6d36ca1565dcdb94e5e1"
        },
