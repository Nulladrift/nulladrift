        "title": "Mind Polling",
        "version": "1.0.0",
        "websiteUrl": "https://mindpolling.com/",
        "icons": [
          {
            "src": "https://mindpolling.com/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
