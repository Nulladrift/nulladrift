          "title": "Price a poll",
          "description": "What a poll would cost per run and per month, typical and at the 95th percentile, from the same prices the builder shows and the worker charges by. Send the definition create_poll and draft_poll take; it saves nothing and needs no key, so an agent can answer what a poll would cost before its person has an account. It does not say what a run holds from the balance or what starting the poll commits: those need a saved poll (estimate_poll). (POST /api/v1/estimate)",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
