        {
          "name": "get_poll",
          "title": "Get a poll",
          "description": "A poll's settings and every version: the questions and their wordings exactly as asked, the models, samples and search depth, plus any prediction markets associated with it. Accepts the poll's id or its public address (slug). (GET /api/v1/polls/{id})",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The poll's id, or its public address (slug).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a poll"
