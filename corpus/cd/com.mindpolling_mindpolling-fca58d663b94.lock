                                        "type": "string"
                                      },
                                      {
                                        "type": "null"
                                      }
                                    ],
                                    "description": "The ISO 3166-2 code of the state or province it is in, such as US-AK, or null."
                                  }
                                },
                                "required": ["country", "id", "kind", "name", "region"],
                                "type": "object"
                              },
