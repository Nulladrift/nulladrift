              },
              "id": {
                "description": "The poll's id, or its public address (slug).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "version": {
                "description": "One version only. Default: every version continued onto the latest.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
