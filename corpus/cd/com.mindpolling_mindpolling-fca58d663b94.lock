        {
          "name": "get_results",
          "title": "Get a poll's results",
          "description": "A poll's results. For choice and scale questions each answer's share per model per run, for number and scale questions each model's mean, each with its 95% repeat range (low, high). Pooled over wordings, each wording counts once and the range combines each wording's own sampling error; the wording range (wording_low, wording_high) says how far the wordings' own figures lie apart and is never merged into it, and any_low and any_high give a range for any phrasing where 5 or more rephrasings were asked. Every point carries available_at, when this reader could first have seen it. as_of reads the results exactly as they stood at a past moment (no later run and no later re-reading of an answer), and first_release=true reads every answer as first published; both need a free key (the historical reads are what a backtest pulls, and a key says who is pulling). Versions are continued onto the latest unless version is given. (GET /api/v1/polls/{id}/results)",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "as_of": {
                "description": "Read as things stood at this moment (RFC 3339): only runs this reader could have seen by then, each answer as it was read then. Needs a key.",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "first_release": {
                "description": "true: each answer's first reading, as first published, rather than its latest. Needs a key.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "id": {
                "description": "The poll's id, or its public address (slug).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "version": {
                "description": "One version only. Default: every version continued onto the latest.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "view": {
                "default": "pooled",
                "description": "pooled combines a question's wordings, each once; by-wording keeps them apart.",
                "enum": ["pooled", "by-wording"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a poll's results"
          },
          "behavior": {
            "destructive": false,
