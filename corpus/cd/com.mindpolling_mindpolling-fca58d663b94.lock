                      "description": "diffusion: results also show a -100 to +100 Better-Worse index, the share answering Better less the share answering Worse (0 is balanced: as many Better as Worse answers, or all About the same). Only on a choice question whose options are exactly Better, About the same and Worse, in that order; null otherwise."
                    },
                    "number_max": {
                      "default": null,
                      "description": "Number questions: the highest answer accepted, or null.",
                      "type": ["number", "null"]
                    },
                    "number_min": {
                      "default": null,
                      "description": "Number questions: the lowest answer accepted, or null.",
                      "type": ["number", "null"]
                    },
                    "number_unit": {
                      "default": "",
                      "description": "Number questions: the unit, such as US dollars or %, or empty.",
                      "maxLength": 20,
                      "type": "string"
                    },
                    "options": {
                      "default": [],
                      "description": "Choice questions: 2 to 12 options, shown in a fresh random order on every call.",
                      "items": {
                        "maxLength": 300,
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 12,
                      "type": "array"
                    },
                    "scale_max": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Scale questions: the highest value, at most 20 above scale_min."
                    },
                    "scale_max_label": {
                      "default": "",
                      "description": "Scale questions: what the highest value means.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "scale_min": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Scale questions: the lowest value."
                    },
                    "scale_min_label": {
                      "default": "",
                      "description": "Scale questions: what the lowest value means.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "short_name": {
                      "default": "",
                      "description": "A short name for the question, such as Prices or Jobs, used where the page names it in brief; empty names it Question N. Never sent to a model.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "variations": {
                      "description": "1 to 100 wordings of the question; each is asked samples_per_cell times of every model.",
                      "items": {
                        "properties": {
                          "label": {
                            "description": "A short name for this wording, shown beside its results.",
                            "maxLength": 80,
                            "minLength": 1,
                            "type": "string"
                          },
                          "place": {
                            "anyOf": [
                              {
                                "description": "The place this wording asks about, from Google Places. Models never see it; the wording's text names the place.",
                                "properties": {
                                  "country": {
                                    "anyOf": [
                                      {
                                        "pattern": "^[A-Z]{2}$",
                                        "type": "string"
                                      },
                                      {
                                        "type": "null"
                                      }
                                    ],
                                    "description": "The ISO 3166-1 country code, such as US, or null."
                                  },
                                  "id": {
                                    "description": "Google's place id.",
                                    "pattern": "^[A-Za-z0-9_-]{10,1000}$",
                                    "type": "string"
                                  },
                                  "kind": {
                                    "description": "country, region (a state or province), county, city, or postal_code (a ZIP or postal code, the finest).",
                                    "enum": ["country", "region", "county", "city", "postal_code"],
                                    "type": "string"
                                  },
                                  "name": {
                                    "description": "The place's name, as Google formats its address, such as \"Alaska, USA\".",
