          "description": "A poll's results. For choice and scale questions each answer's share per model per run, with its Wilson 95% interval; for number and scale questions each model's mean with its 95% interval. Every point carries available_at, when this reader could first have seen it. as_of reads the results exactly as they stood at a past moment (no later run and no later re-reading of an answer), and first_release=true reads every answer as first published; both need a free key (the historical reads are what a backtest pulls, and a key says who is pulling). Versions are continued onto the latest unless version is given. (GET /api/v1/polls/{id}/results)",
