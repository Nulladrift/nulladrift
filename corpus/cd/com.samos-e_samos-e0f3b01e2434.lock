      },
      "transport": {
        "type": "http",
        "url": "https://samos-e.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "SAMOS",
        "version": "1.0.4"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for SAMOS, a UK cross-border parcel delivery provider. Use track_parcel to check a SAMOS parcel by tracking number, list_destinations to see where SAMOS ships, estimate_shipping_price to quote shipping or return costs, search_help to answer questions from the SAMOS FAQs, and estimate_duties (heavily rate limited) to estimate import duties and taxes.",
      "tools": [
        {
          "name": "estimate_duties",
          "title": "Estimate import duties and taxes",
          "description": "Estimate the import duties and taxes the recipient pays on one item shipped from the UK with SAMOS. Provide a product description or HS code. Heavily rate limited: only call when the user asks for a duties/tax estimate.",
          "inputSchema": {
            "properties": {
              "country_of_origin": {
                "description": "ISO 3166-1 alpha-2 code of the country where the item was made, e.g. GB, CN.",
                "type": "string"
              },
              "currency_code": {
                "description": "ISO 4217 currency of the value, e.g. GBP (default), EUR, USD.",
                "type": "string"
              },
              "description": {
                "description": "Product description, e.g. \"cotton t-shirt\". Required unless hs_code is given.",
                "type": "string"
              },
              "destination_country": {
                "description": "ISO 3166-1 alpha-2 destination code. Use list_destinations for supported countries.",
                "type": "string"
              },
              "destination_postcode": {
                "description": "Destination postcode / ZIP.",
                "type": "string"
              },
              "hs_code": {
                "description": "HS / tariff code, e.g. \"6109100010\". Required unless description is given.",
                "type": "string"
              },
              "quantity": {
                "description": "Number of items (default 1).",
                "type": "integer"
              },
              "value": {
                "description": "Value of one item.",
                "type": "number"
              },
              "weight_kg": {
                "description": "Weight of one item in kg (optional).",
                "type": "number"
              }
            },
            "required": ["country_of_origin", "destination_country", "destination_postcode", "value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate import duties and taxes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:154865f67fe318d50d898f08a833989331f1d9e116f2029e1e0ef81a24a1f3b7"
        },
        {
          "name": "estimate_shipping_price",
          "title": "Estimate shipping price",
          "description": "Estimate the SAMOS price (GBP) to ship a parcel from the UK to a country, or to return a parcel from that country to the UK. Max weight 20 kg, max dimensions 100 cm x 43 cm x 43 cm.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Destination country (or origin country for returns), as a name like \"France\" or ISO 3166-1 alpha-2 code like \"FR\".",
                "type": "string"
              },
              "type": {
                "description": "\"shipping\" (UK to country, default) or \"return\" (country back to UK).",
                "enum": ["shipping", "return"],
                "type": "string"
              },
              "weight_kg": {
                "description": "Parcel weight in kg, between 0.1 and 20.",
                "type": "number"
              }
            },
            "required": ["country", "weight_kg"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate shipping price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2834a960ef12b81f33ce0edf6f49da1e1c5fd7e78a290de1a4208bf95ad4512f"
        },
        {
          "name": "list_destinations",
          "title": "List SAMOS destinations",
          "description": "List the countries SAMOS ships to from the UK, with their ISO codes and whether returns from that country are supported.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List SAMOS destinations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3c1522c75bd7d06ac4c8b0e7d55d26a7afece33fb4e48ec96c364aca85e9503"
        },
        {
          "name": "search_help",
          "title": "Search SAMOS help",
          "description": "Search the SAMOS help centre (FAQs) for answers about shipping, customs, IOSS, labels, returns and accounts. Returns the best matching questions and answers.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "The question or keywords, e.g. \"do I need an IOSS number?\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search SAMOS help"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d667ea4d3498faec686d07500500ae0b249a3e50eb8c3e898ad27229b46b940"
        },
        {
          "name": "track_parcel",
          "title": "Track a SAMOS parcel",
          "description": "Track a SAMOS parcel by tracking number. Returns tracking events, newest first, and local_carrier_tracking_url: a link to track the parcel with the local delivery company (e.g. UPS) once it has reached them. Share that link when the user wants more delivery detail.",
          "inputSchema": {
            "properties": {
              "tracking_number": {
                "description": "The SAMOS tracking number, e.g. SAM12345678.",
                "type": "string"
              }
            },
            "required": ["tracking_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Track a SAMOS parcel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f733707a30bfd025acec16b7aee609e103fa322c4935c9cb8e8a20ba275e9408"
        }
      ],
      "digest": "sha256:09eec336ee2656c8e90a02f5443673c664285e2962efbc965b7a83451027a391"
    }
  }
