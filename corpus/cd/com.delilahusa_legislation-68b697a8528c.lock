        {
          "name": "get_bill",
          "title": "Get one bill",
          "description": "Fetch a single bill by its numeric bill_id (GET /v1/bills/{bill_id}), optionally merging in sub-resources: votes (roll calls with tallies), sponsors, history (action timeline), texts (version metadata), amendments, subjects, analyses (staff analyses), calendar (scheduled events), citations (statutes the bill touches), referrals (committee referrals), sast (same-as / similar-to companion bills in the other chamber or other states), supplements (fiscal notes and summaries). analyses and citations are populated only for the deeper-coverage states. Each include is a separate API call, so ask only for what you need. Pass detail:true to get everything in one round trip instead. Get a bill_id from search_bills or semantic_search_bills. status_id values: 1=Introduced, 2=In Committee, 3=Passed One Chamber, 4=Passed Both Chambers (for a simple resolution, bill_type_id 2: Adopted, its final step), 5=Signed into Law, 6=Vetoed, 7=Failed/Dead, 8=Chaptered. Aggregate buckets: passed={4,5,8}, failed={6,7}, alive={1,2,3}.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bill_id": {
                "description": "Numeric bill_id from a search result.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "detail": {
                "description": "true = one request to /v1/bills/{id}/detail with every sub-resource merged (the cheapest way to get everything). Ignores include.",
                "type": "boolean"
              },
              "include": {
                "description": "Sub-resources to merge into the result: votes, sponsors, history, texts, amendments, subjects, analyses, calendar, citations, referrals, sast, supplements.",
                "items": {
                  "enum": ["votes", "sponsors", "history", "texts", "amendments", "subjects", "analyses", "calendar", "citations", "referrals", "sast", "supplements"],
                  "type": "string"
                },
                "type": "array"
              },
              "max_items": {
                "description": "Cap on items per included list (default 50).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["bill_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get one bill"
          },
          "behavior": {
            "destructive": false,
