        {
          "name": "get_coverage",
          "title": "Get per-state data coverage",
          "description": "Per-state depth snapshot (GET /v1/coverage): how COMPLETE each jurisdiction's data is — bill counts, the share of bills holding at least one vote, text or sponsor, and whether the legislature is currently in session. Use it before drawing conclusions from a thin result set, to tell 'no such bills' apart from 'this state is thinly covered'. Read the completeness ratios rather than the raw percentages: most bills die in committee without ever getting a roll call, so a low pct_with_votes usually reflects the legislature, not a gap in the data. Served from a materialised snapshot; `computed_at` gives its age.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "max_items": {
                "description": "Cap on rows returned (default 60 — all jurisdictions).",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
