      "instructions": "Delilah gives you real U.S. legislative data for all 50 states, D.C. and Congress: bills, sponsors, roll-call votes with individual member positions, action history, bill texts, committees, hearings, session analytics, legislator scorecards, trending bills, the 2026 election slate, a change feed and per-state coverage. Search with semantic_search_bills (a plain-English question) or search_bills (structured filters), then pull the full record with get_bill detail:true. status_id: 1=Introduced, 2=In Committee, 3=Passed One Chamber, 4=Passed Both Chambers, 5=Signed into Law, 6=Vetoed, 7=Failed/Dead, 8=Chaptered. passed={4,5,8}, failed={6,7}, alive={1,2,3}. You are on the shared free tier (no API key was supplied). It is rate-limited per client and shares one monthly cap with every other free user. For your own cap, pass a Delilah API key as Authorization: Bearer <key> — get one at https://delilahusa.com/developers/request.",
      "tools": [
        {
