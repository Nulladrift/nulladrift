                "minimum": 1,
                "type": "integer"
              },
              "reason": {
                "description": "Restrict to one change type, e.g. NewBill, StatusChange, Text, Vote, Amendment.",
                "type": "string"
              },
              "since": {
                "description": "ISO-8601 cursor. Omit for the last hour. Pass the newest timestamp you have already seen.",
                "type": "string"
