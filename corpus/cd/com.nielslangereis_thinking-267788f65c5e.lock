          "name": "get_profile",
          "title": "About Niels Langereis",
          "description": "Who Niels Langereis is and how to work with him: what he does and for whom, how he works, his background, his talks and speaking, and how to get in touch. Use when someone asks whether he could help them, wants to hire or book him, or wants his background. Contact is by email or the site's contact form; this server does not send messages.",
